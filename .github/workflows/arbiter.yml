# Constitutional arbiter (Stage 4, dry period).
#
# On every needs-approval PR, five independent vendor seats judge the diff
# against AGENTS.md and the tally posts as a sticky comment: PASS (≥4
# complies, zero violates) or PARKED. The job's exit code mirrors the
# verdict so the check renders red/green — but it is NOT a required check
# during the dry period: the founder's merge tap still decides. Retiring
# the tap = making this check required. auto:low-risk PRs are skipped;
# they are governed by the classifier's allowlist and CI.
name: Arbiter

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: arbiter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  arbiter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classify the change
        id: classify
        run: |
          if node scripts/classify-pr-risk.mjs "origin/${{ github.base_ref }}" | tail -1 | grep -q '^low-risk$'; then
            echo "class=low-risk" >> "$GITHUB_OUTPUT"
          else
            echo "class=needs-approval" >> "$GITHUB_OUTPUT"
          fi
      - name: Panel vote
        if: steps.classify.outputs.class == 'needs-approval'
        id: vote
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Title and body reach the script ONLY as env values — never via
          # expression interpolation into the script text, which would let a
          # PR body execute as shell. (The first live run failed on exactly
          # that: this PR's own body, interpolated, was a syntax error. The
          # second failed because this very comment contained a literal
          # dollar-double-brace, which Actions evaluates even in comments.)
          printf '%s' "$PR_BODY" > pr-body.txt
          set +e
          node scripts/arbiter.mjs \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --title "$PR_TITLE" \
            --body-file pr-body.txt
          echo "verdict=$?" >> "$GITHUB_OUTPUT"
      - name: Post sticky report
        if: steps.classify.outputs.class == 'needs-approval'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- aletheia-arbiter -->'
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq \
            ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -F body=@arbiter-report.md >/dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@arbiter-report.md >/dev/null
          fi
      - name: Mirror the verdict in the check result
        if: steps.classify.outputs.class == 'needs-approval'
        run: |
          if [ "${{ steps.vote.outputs.verdict }}" = "0" ]; then
            echo "panel verdict: PASS"
          elif [ "${{ steps.vote.outputs.verdict }}" = "1" ]; then
            echo "panel verdict: PARKED (advisory during the dry period)"; exit 1
          else
            echo "arbiter operational failure"; exit 2
          fi
