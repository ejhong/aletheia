# The chain, unattended (docs/AUTOMATION.md, step 4b): `aletheia next --run`
# chooses the case the ledger wants worked — a half-done chain first, then a
# due edition, then the least recently reported case — and runs it through
# report → draft → verify → edition under config/budget.yaml, then opens the
# PR the Arbiter judges. One case per run; every step is its own run record
# with its own cost under proposals/<runId>/.
#
# Schedule: the cron line below is the founder's toggle. It ships commented
# out under the kill switch (governance/operation.yaml); uncommenting it is
# the act that lets the loop run itself. Until then, workflow_dispatch — and
# a dispatch may run while paused only when the founder says so in the
# dispatch form (`even_if_paused`), which the run log then records.
name: Chain
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "How many choices to make in this sitting (each a budgeted run)"
        default: "3"
        required: false
      even_if_paused:
        description: "Run although governance/operation.yaml says paused (the founder launching a run by hand)"
        type: boolean
        default: false
  # Turned on by the founder on 2026-09-09 (direction in session), after the
  # first supervised run in CI (#214). Weekly: one sitting of three budgeted
  # choices a week, about $30, within config/budget.yaml's caps; the founder
  # dispatches by hand for more. Comment these two lines out to turn it off
  # again, or set governance/operation.yaml to paused — either stops it.
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
concurrency:
  group: chain
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to run while paused
        run: |
          state=$(node -e 'const y=require("yaml");console.log(y.parse(require("fs").readFileSync("governance/operation.yaml","utf8")).state)')
          if [ "$state" != "live" ] && [ "${{ github.event.inputs.even_if_paused }}" != "true" ]; then
            echo "::warning::governance/operation.yaml says the automation is $state — the chain does not run itself; dispatch it by hand with even_if_paused, or set the state to live"
            exit 78
          fi
          [ "$state" != "live" ] && echo "::notice::running while paused, on the founder's dispatch (even_if_paused=true)" || true
      - name: Choose and run one case through the chain
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The panel's other three seats (config/models.yaml) — a check step without them loses three of five seats.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          # The intake asks GitHub who committed a dropped file (config/founder.yaml).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/aletheia.ts next --run --steps "${{ github.event.inputs.steps || '3' }}" | tee next.json
      - name: Open the PR the panel judges
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        run: |
          rm -f next.json.tmp
          if [ -z "$(git status --porcelain -- content proposals governance)" ]; then
            echo "nothing changed — the chain rested"
            exit 0
          fi
          date=$(date +%Y-%m-%d)
          branch="chain/${date}-${GITHUB_RUN_ID}"
          git config user.name "aletheia-maintenance-bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- content proposals governance
          git commit -m "Chain ${date}: $(node -e 'const j=JSON.parse(require("fs").readFileSync("next.json","utf8"));const all=[j,...(j.more||[])];console.log(all.map(o=>o.choice.case+" — "+o.ran.map(s=>s.verb+":"+s.outcome.outcome).join(", ")).join("; "))')"
          git push -u origin "$branch"
          risk=$(node scripts/classify-pr-risk.mjs "origin/${GITHUB_REF_NAME}" | tail -1)
          body=$(node -e 'const j=JSON.parse(require("fs").readFileSync("next.json","utf8"));const all=[j,...(j.more||[])];console.log(all.map(o=>"`aletheia next --run` chose **"+o.choice.case+"** ("+o.choice.verb+(o.choice.seat?" via "+o.choice.seat:"")+"): "+o.choice.reason+"\n\n"+o.ran.map(s=>"- "+s.verb+" → "+s.outcome.outcome+(s.outcome.cost&&s.outcome.cost.usd!=null?" ($"+s.outcome.cost.usd.toFixed(2)+")":"")+(s.outcome.reason?" — "+s.outcome.reason:"")).join("\n")).join("\n\n")+"\n\nRun records and working material under proposals/<runId>/. The Arbiter judges this PR; standing derives on merge.")')
          gh pr create --title "Chain: ${date}" --body "$body" --label "$( [ "$risk" = "low-risk" ] && echo auto:low-risk || echo needs-approval )"
