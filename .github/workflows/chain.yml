# The chain, unattended (docs/AUTOMATION.md, step 4b): `aletheia next --run`
# chooses the case the ledger wants worked — a half-done chain first, then a
# due edition, then the least recently reported case — and runs it through
# report → draft → verify → edition under config/budget.yaml, then opens the
# PR the Arbiter judges. One case per run; every step is its own run record
# with its own cost under proposals/<runId>/.
#
# Schedule: the cron line below is the founder's toggle. It ships commented
# out under the kill switch (governance/operation.yaml); uncommenting it is
# the act that lets the loop run itself. Until then, workflow_dispatch — and
# a dispatch may run while paused only when the founder says so in the
# dispatch form (`even_if_paused`), which the run log then records.
name: Chain
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "How many choices to make in this sitting (each a budgeted run)"
        default: "3"
        required: false
      even_if_paused:
        description: "Run although governance/operation.yaml says paused (the founder launching a run by hand)"
        type: boolean
        default: false
  # Turned on by the founder on 2026-09-09 (direction in session), after the
  # first supervised run in CI (#214). Weekly: one sitting of three budgeted
  # choices a week, about $30, within config/budget.yaml's caps; the founder
  # dispatches by hand for more. Comment these two lines out to turn it off
  # again, or set governance/operation.yaml to paused — either stops it.
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
concurrency:
  group: chain
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  chain:
    runs-on: ubuntu-latest
    # A sitting of eight steps with a verified intake runs past two hours (2026-09-10: the
    # two-hour limit cancelled one after its seventh step and the runner took every record
    # and spend row with it). The sitting knows its own deadline — no new choice after
    # --deadline-minutes — and the step under way finishes inside this margin.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to run while paused
        run: |
          state=$(node -e 'const y=require("yaml");console.log(y.parse(require("fs").readFileSync("governance/operation.yaml","utf8")).state)')
          if [ "$state" != "live" ] && [ "${{ github.event.inputs.even_if_paused }}" != "true" ]; then
            echo "::warning::governance/operation.yaml says the automation is $state — the chain does not run itself; dispatch it by hand with even_if_paused, or set the state to live"
            exit 78
          fi
          [ "$state" != "live" ] && echo "::notice::running while paused, on the founder's dispatch (even_if_paused=true)" || true
      - name: Harvest the Arbiter's verdicts for the panel page
        # Settled PRs' verdicts, copied from their sticky comments into governance/arbiter/ (the Maintain workflow's job until 2026-09-09).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/harvest-governance.mjs || echo "::warning::governance harvest failed; the sitting continues"
      - name: Choose and run one case through the chain
        id: chain
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The panel's other three seats (config/models.yaml) — a check step without them loses three of five seats.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          # The intake asks GitHub who committed a dropped file (config/founder.yaml).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cases with a sitting still open on an unmerged chain/* branch are not chosen again (scripts/busy-cases.mjs).
          busy=$(node scripts/busy-cases.mjs || true)
          [ -n "$busy" ] && echo "::notice::not choosing: $busy"
          node scripts/aletheia.ts next --run --steps "${{ github.event.inputs.steps || '3' }}" --deadline-minutes 240 --max-cases 2 --out next.json --busy "$busy"
      # Runs whatever became of the chain step — a failed step, a deadline, a cancelled or
      # timed-out job: what the sitting wrote is committed and judged, and the spend rows
      # reach the ledger. Money spent is recorded, whatever became of the run.
      - name: Open the PR the panel judges
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
          CHAIN_STEP_OUTCOME: ${{ steps.chain.outcome }}
        run: |
          rm -f next.json.tmp
          if [ -z "$(git status --porcelain -- content proposals governance inbox)" ]; then
            echo "nothing changed — the chain rested"
            exit 0
          fi
          # next.json is rewritten after every choice; a sitting killed mid-step leaves the last complete
          # account, or none. Without one, nothing is invented about what the sitting chose: the PR says
          # the account is interrupted and lists the run records the working tree holds, as they are.
          account=complete
          if ! node -e 'JSON.parse(require("fs").readFileSync("next.json","utf8"))' 2>/dev/null; then
            account=none
          elif [ "$CHAIN_STEP_OUTCOME" != "success" ]; then
            account=partial
          fi
          date=$(date +%Y-%m-%d)
          branch="chain/${date}-${GITHUB_RUN_ID}"
          git config user.name "aletheia-maintenance-bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git checkout -b "$branch"
          # inbox: an intake moves the item it took in to inbox/processed/<runId>/; left out, the item would be taken in again at the next sitting (2026-09-10).
          git add -A -- content proposals governance inbox
          if [ "$account" = "none" ]; then
            summary="interrupted — chain step ${CHAIN_STEP_OUTCOME}, no complete account of the sitting; the run log is the record"
          else
            summary="$(node -e 'const j=JSON.parse(require("fs").readFileSync("next.json","utf8"));const all=[j,...(j.more||[])];const cut=j.stopped?(j.stopped.reason==="cases"?" (stopped at its case limit after "+j.stopped.stepsMade+" choices)":" (stopped at its deadline after "+j.stopped.afterMinutes+" min)"):(process.env.CHAIN_STEP_OUTCOME!=="success"?" (interrupted during a later step: chain step "+process.env.CHAIN_STEP_OUTCOME+"; the account is what completed)":"");console.log(all.map(o=>o.choice.case+" — "+o.ran.map(s=>s.verb+":"+s.outcome.outcome).join(", ")).join("; ")+cut)')"
          fi
          git commit -m "Chain ${date}: ${summary}"
          git push -u origin "$branch"
          risk=$(node scripts/classify-pr-risk.mjs "origin/${GITHUB_REF_NAME}" | tail -1)
          if [ "$account" = "none" ]; then
            body="$(printf '**Interrupted sitting.** The chain step ended as \`%s\` before its first choice completed, so there is no account of what \`aletheia next --run\` chose; nothing is inferred here. The run records the working tree holds, as they are:\n\n%s\n\nThe run log of this workflow is the record of the sitting. The Arbiter judges this PR; standing derives on merge.' "$CHAIN_STEP_OUTCOME" "$(node -e 'const fs=require("fs"),y=require("yaml");const out=[];for(const l of require("child_process").execSync("git show --name-only --format= HEAD -- proposals").toString().split("\n")){if(!l.endsWith("/run.yaml"))continue;try{const r=y.parse(fs.readFileSync(l,"utf8"));out.push("- "+r.runId+" — "+r.verb+" on "+r.case+": "+r.outcome+(r.cost&&r.cost.usd!=null?" ($"+Number(r.cost.usd).toFixed(2)+")":"")+(r.notes?" — "+String(r.notes).slice(0,200):""))}catch(e){out.push("- "+l+" (unreadable: "+e.message+")")}}console.log(out.length?out.join("\n"):"(no run record was written)")')")"
          else
          body=$(node -e 'const j=JSON.parse(require("fs").readFileSync("next.json","utf8"));const all=[j,...(j.more||[])];const note=process.env.CHAIN_STEP_OUTCOME!=="success"?"**The sitting was interrupted during a later step (chain step "+process.env.CHAIN_STEP_OUTCOME+"); the account below is what had completed when its progress file was last written. The run log is the record of the rest.**\n\n":"";console.log(note+all.map(o=>"`aletheia next --run` chose **"+o.choice.case+"** ("+o.choice.verb+(o.choice.seat?" via "+o.choice.seat:"")+"): "+o.choice.reason+"\n\n"+o.ran.map(s=>"- "+s.verb+" → "+s.outcome.outcome+(s.outcome.cost&&s.outcome.cost.usd!=null?" ($"+s.outcome.cost.usd.toFixed(2)+")":"")+(s.outcome.reason?" — "+s.outcome.reason:"")).join("\n")).join("\n\n")+"\n\nRun records and working material under proposals/<runId>/. The Arbiter judges this PR; standing derives on merge.")')
          fi
          title="Chain: ${date}"
          [ "$account" = "none" ] && title="Chain: ${date} (interrupted — no account of the sitting)"
          [ "$account" = "partial" ] && title="Chain: ${date} (interrupted during a later step — partial account)"
          gh pr create --title "$title" --body "$body" --label "$( [ "$risk" = "low-risk" ] && echo auto:low-risk || echo needs-approval )"
