# The site's fast metabolism, batched hourly: reassessment and re-panels
# run on a schedule rather than per canon push, so a burst of merges costs
# one judgment cycle instead of one per merge. The scripts detect change
# mechanically (content commit dates vs. overlay dates), so an hour with
# nothing new exits without a single model call — the schedule is free
# when idle. The loop still terminates: canon change → (within the hour)
# judgment PR → overlays merge → the next hour finds nothing stale.
#
# This replaced the per-push trigger on 2026-08-26 (see docs/DECISIONS.md)
# after a same-day burst produced two respond PRs forty minutes apart, the
# second superseding the first — duplicate panel spend and a stale PR left
# open. Worst-case latency for a canon change is now one hour, which the
# judgment layer never needed to beat.
name: Content response

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops cron jobs scheduled
    # at :00 under load.
    #
    # OBSERVED, 2026-09-03: even off the hour, GitHub drops most of these.
    # Twelve runs across 2026-09-01/03 landed roughly every three to five
    # hours, not hourly — about five a day against twenty-four requested.
    # Nothing downstream breaks (the loop is idempotent and exits free when
    # nothing is stale), but worst-case latency for a canon change is a few
    # hours rather than the one the comment below claims, and anything
    # reasoning about this cadence should use the observed figure. Asking
    # for hourly is still right: it is the cheapest way to get five.
    - cron: "17 * * * *"
  # Manual trigger: run the reassess/re-panel loop on demand — e.g. to
  # recover a panel run whose output was lost, to panel a case without
  # waiting for the hour, or to test.
  workflow_dispatch:

concurrency:
  group: content-response
  # Never cancel an in-flight run: panels are paid model calls, and a
  # cancelled run discards them. The next scheduled run waits its turn.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BUDGET_GITHUB_TOKEN: ${{ secrets.MAINTENANCE_PAT }}

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for a pending content batch
        id: pending
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        run: |
          # Preserve paid drafts and disagreement. A pending batch must settle
          # before the next one repeats its work; API errors stop this check.
          count=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("respond/"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "A content-response PR is still open; keeping its work and resting this run."
          fi
      - name: Draft and compare one due edition
        if: steps.pending.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
        run: node scripts/draft-editions.ts --scan --prepare
      - name: Reassess changed cases (drafts + editorial audit)
        if: steps.pending.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/reassess-changed.mjs || echo "::warning::reassessment failed; panels still run"
      - name: Re-panel stale cases
        if: steps.pending.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        run: |
          for c in $(node scripts/stale-checks.mjs); do
            echo "re-paneling $c"
            node scripts/cross-model-check.mjs "$c" || echo "::warning::panel failed for $c"
          done
      - name: Open classified PR
        if: steps.pending.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        run: |
          rm -f reassess-digest.md arbiter-report.md
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "no judgment changes — the loop rests"
            exit 0
          fi
          date=$(date +%Y-%m-%d)
          branch="respond/${date}-${GITHUB_RUN_ID}"
          git config user.name "aletheia-maintenance-bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git checkout -b "$branch"
          # Stage by directory, with errors VISIBLE. The previous form —
          # a glob list with 2>/dev/null || true — hid a fatal git-add
          # property: when any one pathspec matches nothing (e.g.
          # proposals/cross-model-failures not yet created), git add aborts
          # and stages NOTHING, so an entire panel run's paid overlays were
          # once discarded with the runner while the job reported
          # "nothing stageable". Fail loudly instead, and log what staged.
          git add -A -- content/cases proposals
          git status --porcelain
          if git diff --cached --quiet; then
            echo "nothing stageable — the loop rests"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Content response ${date}: reassessment and panels for the latest canon change"
          git push -u origin "$branch"
          risk=$(node scripts/classify-pr-risk.mjs "origin/${GITHUB_REF_NAME}" | tail -1)
          pr_url=$(gh pr create \
            --title "Content response: ${date}" \
            --body "Judgment batch: a due illustrated edition and its independent comparison record, legacy reassessment where applicable, and fresh blind checks for stale cases. Retained, failed and contested edition comparisons preserve the incumbent. The ordinary arbiter gates publication; standing derives from exact independent receipts on merge." \
            --label "$( [ "$risk" = "low-risk" ] && echo auto:low-risk || echo needs-approval )")
          gh pr merge --auto --squash "$pr_url" || echo "::warning::auto-merge unavailable; PR waits on checks"

      - name: AI allowance report
        if: always()
        run: npm run ai:budget -- status --summary
