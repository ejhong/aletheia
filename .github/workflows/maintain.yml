# The commentator-in-chief maintenance loop (docs/MAINTENANCE.md):
# weekly (and on demand) this workflow
#   1. processes inbox/ drops (commentary, links, documents) into proposals,
#   2. refreshes AI assessment overlays for cases whose evidence changed,
#   3. runs the literature watch (scripts/watch-literature.mjs): new
#      arXiv/Crossref items matching each case's watch.yaml queries become
#      unverified, discovery-only proposals under proposals/watch/,
#   4. triages the newest untriaged watch run (scripts/triage-watch.mjs):
#      import / shelf / archive with recorded reasons; imports queue
#      verification requests as inbox link drops for the next run,
#   5. opens ONE PR with a plain-language digest body (readable on a phone),
#      classified by scripts/classify-pr-risk.mjs:
#        low-risk       → labeled, auto-merge enabled (merges when CI is green)
#        needs-approval → labeled, review requested — read the digest, tap merge.
#
# Requires ANTHROPIC_API_KEY or OPENAI_API_KEY as a repository secret; fails
# early with instructions when neither is set. Optional: a MAINTENANCE_PAT
# fine-grained token (contents+pull-requests write) so that CI runs on the
# PRs this workflow opens — PRs created with the default GITHUB_TOKEN do not
# trigger other workflows, which would leave auto-merge waiting forever.

name: Maintain

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything; inbox = intake + reassess only (event-triggered drops)"
        type: choice
        options: [full, inbox]
        default: full

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reassess-changed compares git dates
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # poppler-utils supplies pdftotext so PDF drops in inbox/ are
      # converted and routed instead of skipped.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check LLM API key is configured
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::No LLM API key configured. Add ANTHROPIC_API_KEY (preferred) or OPENAI_API_KEY under Settings → Secrets and variables → Actions, then re-run. See docs/MAINTENANCE.md."
            exit 1
          fi

      - name: Process inbox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          node scripts/process-inbox.mjs | tee inbox-out.txt
          outdir=$(tail -1 inbox-out.txt)
          if [ -f "$outdir/report.md" ]; then
            cp "$outdir/report.md" inbox-digest.md
          fi

      - name: Refresh stale assessments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: node scripts/reassess-changed.mjs

      # Discovery only: new arXiv/Crossref items become unverified proposals
      # under proposals/watch/ — low-risk by construction (never touches
      # published content). Works without an LLM key; a key only adds
      # labeled relevance notes. Runs older than 60 days expire (deleted;
      # git history keeps the record).
      - name: Watch literature
        if: ${{ (inputs.mode || 'full') == 'full' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          node scripts/watch-literature.mjs | tee watch-out.txt
          outdir=$(tail -1 watch-out.txt)
          if [ -f "$outdir/report.md" ]; then
            cp "$outdir/report.md" watch-digest.md
          fi
          rm -f watch-out.txt

      # Triage the newest untriaged watch run: one model call per case
      # judges every surfaced item (import / shelf / archive, reasons
      # recorded, fail-closed on malformed replies). Imports queue a
      # verification request as an inbox link drop, processed by the NEXT
      # run's inbox step — nothing touches sources.yaml directly, and the
      # build-time source admission rule holds regardless.
      - name: Triage watch results
        if: ${{ (inputs.mode || 'full') == 'full' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          node scripts/triage-watch.mjs | tee triage-out.txt
          outdir=$(tail -1 triage-out.txt)
          if [ -f "$outdir/triage.md" ]; then
            cp "$outdir/triage.md" triage-digest.md
          fi
          rm -f triage-out.txt

      # Attention follows yield (docs/AUTOMATION.md): measure each case's
      # verdict-moving events and derive its cadence band. Model-free and
      # stateless; the JSON drives which cases the expensive loops visit
      # this run. The cheap identifier-based watch deliberately stays
      # weekly for every case.
      - name: Measure yield
        if: ${{ (inputs.mode || 'full') == 'full' }}
        run: |
          node scripts/yield-report.mjs > yield.json 2> yield-table.txt
          { echo '## Attention (yield bands)'; echo '```'; cat yield-table.txt; echo '```'; } > yield-digest.md
          echo "DUE_CASES=$(node -e 'const r=require("./yield.json");console.log(Object.entries(r.cases).filter(([,c])=>c.due).map(([s])=>s).join(","))')" >> "$GITHUB_ENV"
          rm -f yield-table.txt

      # The generative step no other stage has: propose (never publish)
      # new claims, research items, or studies the current ledger implies.
      # Output is proposals/agenda/ files — adopted or ignored by the
      # founder; the gates decide what becomes real. Visits only the cases
      # whose yield band says they are due this run.
      - name: Propose agenda additions
        if: ${{ (inputs.mode || 'full') == 'full' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          node scripts/propose-agenda.mjs --only "${DUE_CASES}" | tee agenda-out.txt
          outdir=$(tail -1 agenda-out.txt)
          if [ -f "$outdir/report.md" ]; then
            cp "$outdir/report.md" agenda-digest.md
          fi
          rm -f agenda-out.txt

      - name: Harvest governance and write the weekly digest
        if: ${{ (inputs.mode || 'full') == 'full' }}
        env:
          # Deliberately the Actions bot token, not the PAT: GitHub
          # suppresses notifications for your own activity, and the digest
          # exists to be emailed to the founder.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/harvest-governance.mjs --digest || echo "::warning::governance harvest failed; continuing"
          if [ -f weekly-digest.md ]; then
            date=$(date +%Y-%m-%d)
            printf '\n\ncc @%s\n' "${GITHUB_REPOSITORY_OWNER}" >> weekly-digest.md
            gh issue create --title "Weekly digest — ${date}" --body-file weekly-digest.md \
              || echo "::warning::could not open the digest issue"
            rm -f weekly-digest.md
          fi
      - name: Open classified PR
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
        run: |
          rm -f inbox-out.txt
          # Digest body from the run reports; the temp digests themselves
          # are not committed.
          {
            echo "Weekly maintenance run. Plain-language summary:"
            echo
            [ -f yield-digest.md ] && cat yield-digest.md && echo
            [ -f inbox-digest.md ] && cat inbox-digest.md && echo
            [ -f reassess-digest.md ] && cat reassess-digest.md && echo
            [ -f watch-digest.md ] && cat watch-digest.md && echo
            [ -f triage-digest.md ] && cat triage-digest.md && echo
            [ -f agenda-digest.md ] && cat agenda-digest.md && echo
          } > pr-body.md
          rm -f inbox-digest.md reassess-digest.md watch-digest.md triage-digest.md agenda-digest.md yield-digest.md yield.json

          if git status --porcelain | grep -qv '^?? pr-body.md'; then :; else
            echo "No changes produced — nothing to open a PR for."
            exit 0
          fi

          date=$(date +%Y-%m-%d)
          branch="maintain/${date}-${GITHUB_RUN_ID}"
          git config user.name "aletheia-maintenance-bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- ':!pr-body.md' ':!weekly-digest.md' ':!casework'
          git commit -m "Maintenance run ${date}: inbox, assessments, literature watch, triage"
          git push -u origin "$branch"

          # Conservative risk classification; the pr-risk-check workflow
          # re-verifies this on the PR itself and fails closed.
          risk=$(node scripts/classify-pr-risk.mjs "origin/${GITHUB_REF_NAME}" | tail -1)
          echo "classification: $risk"
          echo -e "\n---\nRisk classification: **${risk}** (verified by the PR risk check)." >> pr-body.md

          pr_url=$(gh pr create \
            --title "Maintenance: ${date} run" \
            --body-file pr-body.md \
            --label "$( [ "$risk" = "low-risk" ] && echo auto:low-risk || echo needs-approval )")
          echo "opened $pr_url"

          if [ "$risk" = "low-risk" ]; then
            gh pr merge --auto --squash "$pr_url" || echo "::warning::Could not enable auto-merge (is it enabled in repo settings, with required checks configured?). The PR stays open for manual merge."
          else
            gh pr edit "$pr_url" --add-reviewer "${GITHUB_REPOSITORY_OWNER}" || true
          fi

  # The promotion pipe (docs/AUTOMATION.md build step 1): verified import
  # proposals become drafted ledger records in their own needs-approval
  # PR, never mixed into the maintenance proposals PR (whose auto tier
  # they would break). Runs on a fresh checkout of main, so it consumes
  # proposals that have already merged — this run's new imports promote
  # on the next cycle, which trades a week of latency for a clean tier
  # boundary. The script cannot publish: dedupe, verbatim-quote checks,
  # enum/anchor validation and budgets are mechanical inside it, and the
  # drafted records face the classifier, the citation-checking arbiter,
  # the founder tap, and the content-response ripple like any canon edit.
  promote:
    needs: maintain
    if: ${{ (inputs.mode || 'full') == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draft promotions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          count=$(node scripts/promote-imports.mjs | tail -1)
          echo "PROMOTED=${count}" >> "$GITHUB_ENV"
      - name: Validate the ledger still loads
        if: ${{ env.PROMOTED != '0' }}
        run: npx vitest run src/domain/load.test.ts
      - name: Open the gated promotion PR
        if: ${{ env.PROMOTED != '0' }}
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        run: |
          date=$(date +%Y-%m-%d)
          branch="promote/${date}-${GITHUB_RUN_ID}"
          git config user.name "aletheia-maintenance-bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- content/cases proposals/promotions-ledger.yaml
          git status --porcelain
          if git diff --cached --quiet; then
            echo "nothing stageable — the pipe rests"
            exit 0
          fi
          git commit -m "Promotion ${date}: verified imports enter the ledger through the gates"
          git push -u origin "$branch"
          pr_url=$(gh pr create \
            --title "Promotion: ${date} — verified imports into the ledger" \
            --body "The promotion pipe (docs/AUTOMATION.md build step 1): verified import proposals drafted into sources + evidence records. Every quoted span mechanically verified verbatim against the fetched source; dedupe, enum, and claim-anchor checks fail-closed in the script. The panel judges the readings; the ledger admission rule is satisfied by construction. Ledger of dispositions (promoted / duplicate / failed, with reasons): proposals/promotions-ledger.yaml." \
            --label needs-approval)
          gh pr edit "$pr_url" --add-reviewer "${GITHUB_REPOSITORY_OWNER}" || true
          echo "opened $pr_url"
