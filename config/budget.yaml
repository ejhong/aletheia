# The spend ceiling (docs/AUTOMATION.md, "The code": budgets in one config).
# Enforced by the model transport before every paid call (build step 3b):
# a call that would carry the run, the day, or the month past its cap is
# refused and the run ends `failed` with the reason — never a silent
# partial. Founder-set, 2026-09-08, for the two tests (Cast, Not Carved;
# Deep Memory); revisit when the first unattended cadence is chosen.
usd:
  perRun: 20      # one report or one edition; the first house-seat report cost $37.86 uncached, ~$13 is the cached estimate
  perDay: 50
  perMonth: 150
