# The spend ceiling (docs/AUTOMATION.md, "The code": budgets in one config).
# Enforced by the model transport before every paid call (build step 3b):
# a call that would carry the run, the day, or the month past its cap is
# refused and the run ends `failed` with the reason — never a silent
# partial. Founder-set, 2026-09-08, for the two tests (Cast, Not Carved;
# Deep Memory); revisit when the first unattended cadence is chosen.
usd:
  perRun: 20      # one report or one edition; the first house-seat report cost $37.86 uncached, ~$13 is the cached estimate
  perDay: 50
  perMonth: 150
# Dated exceptions to the daily cap, granted by the founder, on the record
# and self-expiring. The guard uses the exemption's perDay on that date only.
exemptions:
  - date: "2026-09-08"
    perDay: 100
    reason: "Founder direction: continue the first-runs stage today (re-run draft and verify with retrieval, validate the cached house-seat cost, run the panel check on Cast Not Carved) rather than wait for the next day's cap."
    by: "founder (chat direction, 2026-09-08)"
  - date: "2026-09-09"
    perDay: 100
    reason: "Founder direction (chat, 2026-09-09: \"expand budget if you feel it's necessary\"): the essay's propositions through the chain, plus the two undrafted reports the per-run rule surfaced, in one sitting."
    by: "founder (chat direction, 2026-09-09)"
