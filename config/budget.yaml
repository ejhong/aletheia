# The spend ceiling. Every paid call is guarded before it is made — the
# panel's seats by the transport, the operator's session by the hard cap
# Claude Code is given — and a call that would carry the run, the session,
# the day or the month past its cap is refused with the reason, never
# trimmed. The review is not under the caps (it judges every change put to
# it) and is on the bill. The month's money is spread over its days: a
# scheduled session starts only when the month has spent no more than its
# share of the days gone; a session the founder starts by hand runs ahead
# of that pace, within the caps.
#
# Standing caps: the founder's direction of 2026-10-19, in session — "keep
# the cost lower per month if possible — maybe like $100 or something like
# that" — for both sites; this site's share is $60 (Erebus's is $40, in its
# own config). They hold from 2026-11-01, when the crunch below ends.
usd:
  perRun: 15      # one blind panel on a case: five seats, the Anthropic seat at max effort ($2–3 of it)
  perSession: 10  # one operator session (Claude Code's --max-budget-usd), when the day and the month leave that much and the month is on its pace
  perDay: 15
  perMonth: 60
# The crunch: caps that hold until a date, then fall to the standing caps —
# the bootstrap sweep (every case through the closed loop at least once,
# founding essays taken in, panels re-judged) is the expensive part, and it
# ends. Founder-granted, dated, reasoned; the founder moves the date.
crunch:
  until: "2026-10-31"
  perDay: 60
  perMonth: 400
  reason: "Founder direction (2026-09-09, in session): the system may crunch at the start and must settle to almost no cost in steady state. The crunch is the bootstrap sweep; the standing caps above are the steady state."
  by: "founder (direction in session, 2026-09-09)"
# Dated exceptions to the caps, granted by the founder, on the record and
# self-expiring: for one date, or a span (`until`, inclusive) as the crunch
# is dated. The guard uses the exemption's perDay and, when given, its
# perMonth on those dates only.
exemptions:
  - date: "2026-09-08"
    perDay: 100
    reason: "Founder direction: continue the first-runs stage today (re-run draft and verify with retrieval, validate the cached house-seat cost, run the panel check on Cast Not Carved) rather than wait for the next day's cap."
    by: "founder (chat direction, 2026-09-08)"
  - date: "2026-09-09"
    perDay: 140
    perMonth: 200
    reason: "Founder direction (2026-09-09, in session: the budget may be expanded as the operator judges necessary): the essay's propositions through the chain, plus the two undrafted reports the per-run rule surfaced, in one sitting. Raised the same day from 100 to 140, and the month from 150 to 200, when the month's cap stopped the verification of the founder's second essay mid-run (the drafted proposal carries 50 claims); the verifier now remembers its judgments so the re-run pays only for what it has not asked."
    by: "founder (chat direction, 2026-09-09)"
  - date: "2026-09-22"
    until: "2026-09-30"
    perDay: 60
    perMonth: 550
    reason: "Founder direction (2026-09-22, in session): the loop keeps running for the rest of September. The crunch's $400 month was reached on 2026-09-21 ($400.58 recorded on main) with the vasocomputation follow-up's edition refused at $7 and the weekly chain due; the day cap stays at the crunch's $60, the month rises by $150 for the nine days left. October falls to the crunch's caps as dated."
    by: "founder (direction in session, 2026-09-22)"
