# Every model Aletheia calls, named once. To change a model, change it here:
# nothing under src/ or scripts/ names one. Every model named here needs a
# row in config/tariffs.yaml (priced, or honestly null); a seat whose row is
# unpriced cannot be budgeted, and is not called (config/budget.yaml).
#
# `effort` pins reasoning depth so that a vendor's changing default cannot
# silently change which judge we are running; the pinned level is part of
# the seat's identity and is recorded with each verdict.

# The operator: the AI agent that does the site's day-to-day work — reading,
# extracting, drafting, editing, coding — one session at a time, run by
# Claude Code (operator/charter.md, .github/workflows/operator.yml). It drafts;
# it never reviews or judges its own work (AGENTS.md §3.15).
operator:
  vendor: anthropic
  model: claude-opus-5-5
  effort: high

# The five-seat cross-vendor panel: the blind check that gives a judgment its
# standing (src/engine/check.ts), one seat per API vendor. Seat selection 2026-09-05 (docs/DECISIONS.md, "the
# budget panel"): every seat scores 56–59 on the Artificial Analysis
# Intelligence Index v4.2 at the effort pinned here. The /panel seat records
# start a new row for a new model.
panel:
  anthropic:
    model: claude-opus-5-5
    label: Opus 5.5 (Anthropic)
    tag: opus             # the tag names the seat's files and is kept across a model change, so a case's checks stay one series
    effort: max           # adaptive thinking; effort is the depth control. 2026-09-22: Opus 5 had fallen to AA 51, below the 56–59 band this panel is chosen on; Opus 5.5 scores 58 at max, 54 at high, so max is what keeps the seat in its band
    # The seat's ceiling on thinking and reply together (the vendor's max_tokens), whatever a caller asks for.
    # On this model the two share one ceiling and the model is not told where it is: at max effort a blind
    # check of a 35,000-token case spent all 64,000 tokens thinking and returned no reply (2026-09-30). The
    # model's own maximum is 128,000, which the seat may use now that it streams.
    # 2026-09-30: the founder, shown what max cost that day ($1.90 to $2.96 an asking, $24.69 of the $31.88 the
    # day's checks cost, the ceiling reached twice in ten askings), keeps it (direction in session).
    maxOutputTokens: 128000
  openai:
    model: gpt-5.6-sol
    label: GPT-5.6 Sol (OpenAI)
    tag: gpt
    effort: high          # AA: high 57, $0.43/task; replaced gpt-5.1, whose API default is no reasoning (AA 21)
  gemini:
    model: gemini-3.8-flash
    label: Gemini 3.8 Flash (Google)
    tag: gemini
    effort: medium        # thinkingLevel (AA: medium 57, $0.41/task); replaced gemini-3.1-pro-preview (48)
  xai:
    model: grok-4.5
    label: Grok 4.5 (xAI)
    tag: grok
    effort: high          # AA: high 56, $0.43/task; reasoning cannot be disabled on this model
  venice:
    model: z-ai-glm-5-3-flash
    label: GLM 5.3 Flash (Z.ai, via Venice)
    tag: glm
    effort: high          # open weights (MIT), Venice-hosted, $0.15/$0.50 per 1M; AA 57, $0.09/task; "high" is Venice's deepest level

# The reviewers of a change (src/engine/review.ts; AGENTS.md §3.15): the
# panel's seats from vendors other than the one whose model drafted the
# change, so that no vendor reviews its own model's work.
review:
  seats: [openai, gemini, xai, venice]
