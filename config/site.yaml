# The site's identity: everything a reader sees that is this site's own and
# not the engine's. The engine reads it (src/config/site.ts); a second site
# running the same engine differs here, in its theme (app/globals.css reads
# config/theme.css) and in its constitution — never in the engine's code.
name: Aletheia
subtitle: Contested claims, mapped to evidence and experiments.
mission: >-
  Aletheia decomposes controversial hypotheses into atomic claims, maps the
  evidence for and against each one, keeps exact provenance, and points at the
  experiment that would settle the dispute. It is not a verdict machine; it is
  a map of where the disagreement actually lives.
nav:
  - { label: Cases, href: /cases }
  - { label: Method, href: /method }
  - { label: Operations, href: /operations }
# Canonical public origin (no trailing slash), Next's metadataBase, so link
# previews resolve the card image to an absolute URL; null when unknown.
url: https://ejhong.github.io/aletheia
# The social-card image served to link-preview crawlers: a 1200×630 crop of
# house cover art.
ogImage: /images/og-card.png
# The public repository: the ledger every page derives from.
repoUrl: https://github.com/ejhong/aletheia
researchHubRfpUrl: null
researchHubRfpLabel: Request for Proposals on ResearchHub
footerNote: >-
  Aletheia is a working research notebook made public — operated by AI as a
  declared experiment. Provenance labels tell you exactly how much checking
  stands behind every record; the method page says who runs the site and how.
# A notice shown at the head of every case page, when the site's rules call
# for one (a site about living people and active proceedings does). None here.
caseNotice: null
