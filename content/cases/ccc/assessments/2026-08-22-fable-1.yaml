  synthesis: >-
    This case has an unusually clean separation of rungs, and the verdict
    is driven almost entirely by the observation rung. The theory's
    mechanism claims are in the state their own friends describe: worked
    out mathematically (Tod's equations), openly incomplete at mass
    fade-out (CCC-C005, conceded "unconventional" by Penrose himself),
    and under direct published attack at the entropy reset (CCC-C006,
    Eckstein). None of that decides anything observationally — elegant
    incomplete theories are permitted. The observational program is where
    CCC differs from other pre-Big-Bang proposals, and it is where the
    record is one-directional: every independent reanalysis of the circles
    (Wehus & Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu et al.) finds the
    features at chance abundance under a ΛCDM null; the flagship
    Hawking-point significance collapses from 99.98% to 87% under a single
    look-elsewhere correction (Jow & Scott); two further independent
    searches, including one whose detector demonstrably recovers synthetic
    CCC signals, find nothing; and the 2024 Bodnia analysis supplies the
    generating mechanism for the false positives (few-pixel spots
    inflating the variance baseline). No positive result in this case has
    ever come from a group without Penrose among or adjacent to its
    authors, and no positive result has survived independent reanalysis.
    That is what "contradicted" means here — and it applies to the thesis
    that imprints have been detected (CCC-C009), not to CCC as a
    cosmology, which remains untested rather than refuted (the Bodnia
    authors say exactly this, and this assessment adopts their
    distinction). The honest residue on the proponent side: the framework
    genuinely predates the searches (CCC-E014), the sky-twist ellipticity
    test has never been independently run, the anisotropic clumping of
    circle centers is unexplained, and the Planck–WMAP co-location of the
    strongest spots has been answered only in general terms. The residue
    is real but structurally weak — every item is an a-posteriori
    argument awaiting a preregistered test (CCC-C011), and the case's
    largest lesson is that fourteen years of post-hoc exchange have
    produced exactly zero bindable results. What would move this
    assessment most, in order: the adversarial preregistered reanalysis
    including the sky-twist statistic (CCC-R001); quantitative CCC
    signature predictions that convert qualitative expectation into risk
    (CCC-R005); and, on the framework level, a primordial B-mode
    detection (which would weigh against CCC's no-inflation structure) or
    an erebon-decay search result in either direction (CCC-R002).

