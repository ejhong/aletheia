  synthesis: "The question this case actually litigates is not whether conformal
    cyclic cosmology is a coherent mathematical framework, but whether the
    microwave sky has already delivered news from an aeon before ours. That
    attribution (CCC-C009) is load-bearing on two statistical claims: that
    concentric low-variance circle families are incompatible with a standard
    ΛCDM sky (CCC-C002), and that compact raised-temperature spots of a
    characteristic size are present at 99.98 percent confidence (CCC-C004). Both
    claims fail on the evidence records provided. The rings themselves are real
    as procedure outputs — every independent group recovers them (CCC-C001) —
    but the entire reported six-sigma anomaly lives in the construction of the
    null (CCC-C003). Gurzadyan and Penrose compared the data to a pure Gaussian
    sky plus instrument noise; Wehus and Eriksen, Moss, Scott and Zibin, Hajian,
    and DeAbreu, Contreras and Scott each compared the same search to skies
    drawn from the observed ΛCDM power spectrum and found the features at chance
    abundance. DeAbreu et al. additionally froze the search parameters to the
    proponents' own published choices and extended the test to Planck, which is
    as close to a claimant-criteria null as this literature contains. Bodnia et
    al. 2024 then identified the generating mechanism under the proponents' own
    criterion: a handful of freak few-pixel spots inflate the local variance
    baseline and certify rings around themselves as anomalously quiet; after
    those spots are removed, no statistically significant circles remain at full
    resolution. The Hawking-point headline number is a look-elsewhere artifact.
    Jow and Scott show that quoting the best ring size after inspection produces
    99.98 percent, while marginalizing over the family of sizes searched leaves
    87 percent — about one sigma. López et al., using a detector validated at 95
    percent retrieval on synthetic CCC spots, find no significant population.
    Bodnia et al. rule out Gaussian-profile spots of 100–400 µK at 0.7–1.2
    degrees and trace the strongest candidates to anomalous pixels. Seven
    independent analyses therefore converge on CCC-C010: standard inflationary
    ΛCDM plus a-posteriori statistics fully accounts for the reported
    signatures. Steelman of the other direction, taken at its strongest. CCC was
    written down in 2006, four years before anyone searched the maps, so the
    program is not a pattern found first and theorized after; that priority is
    real and should be credited. The sky-twist test compares the sky to
    distorted versions of itself and so does not depend on which simulation
    ensemble one prefers; if mild ellipticity collapses concentric families,
    that is a structural fact about the data that no critic has independently
    run under artifact screening. Circle centers are reported to clump
    extravagantly — 83 percent of 1134 centres in three patches covering about 3
    percent of the searched sky — and the five strongest hot spots sit at the
    same locations in Planck and WMAP, instruments with different noise. No
    analysis on either side was preregistered (CCC-C011), so critic nulls are
    themselves post-hoc responses, and qualitative predictions (some rings, some
    spots, somewhere) mean that current-data absences cannot be fatal. Those
    points keep the thesis from being closed forever. They do not presently
    support it. An untested ellipticity comparison does not restore significance
    that appears only against an impoverished null; cross-map co-location shows
    the spots are on the sky rather than in one instrument, which is expected
    for any shared sky feature, artifact or fluctuation; and a 2025 preprint
    that assumes the unrehabilitated 2020 detection and introduces a new
    gravitational-wave epoch to absorb a factor-of-two angular-diameter mismatch
    continues the post-hoc pattern rather than breaking it. Separately, CCC as a
    cosmological framework is not refuted by these nulls and should not be
    described as if it were. Mass fade-out remains an admittedly unconventional,
    unimplemented requirement (CCC-C005). The entropy reset is contested and may
    raise the cosmic ledger rather than clear it (CCC-C006). Erebons are a
    genuine laboratory-adjacent prediction that has never been searched
    (CCC-C007). Deleting inflation assigns the measured CMB spectrum a job no
    published calculation has performed (CCC-C008), and a future primordial
    B-mode detection would be a signal the theory has no mechanism for — while
    the present tensor bound (r < 0.036) constrains inflationary models without
    confirming CCC. The honest residual is methodological: a fully post-hoc
    literature on qualitative signatures can run forever. What the present
    evidence warrants, on the claim actually at issue, is nonetheless a strong
    verdict. These particular map features are not news from a previous
    universe. They are what a correlated Gaussian sky looks like when it is
    searched hard enough, against the wrong randomness, with parameters chosen
    after looking."
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: Independent groups on both sides of the dispute — Wehus and Eriksen,
      Moss, Scott and Zibin, Hajian, and DeAbreu, Contreras and Scott —
      reproduce low-variance annular rings, often in concentric sets, as outputs
      of the published search on WMAP and Planck maps. Existence of those
      procedure outputs is therefore not in contention. The strongest opposing
      consideration is Bodnia et al. 2024's demonstration that the
      Gurzadyan–Penrose criterion is triggered by few-pixel bright or dark spots
      that inflate local baseline variance, so reproducing the rings partly
      means reproducing a method artifact; that objection bears on significance
      and attribution, not on whether the flagged features exist and are
      independently recoverable.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Four independent reanalyses each find the observed circle abundance
      fully consistent with ΛCDM-spectrum simulations containing no previous
      aeon, and Bodnia et al. 2024 show that few-pixel spots manufacture
      concentric low-variance families under the proponents' criterion, after
      which no significant circles remain at full resolution. No independent
      group has reproduced the claimed 6σ significance; that figure appears only
      against a Gaussian-plus-noise null that lacks the known large-scale
      correlations of the CMB. The strongest opposing consideration is the
      proponents' sky-twist ellipticity drop-off and the extreme anisotropy of
      circle centers, neither of which has been independently run under artifact
      screening — real gaps in the critical record, but they do not rehabilitate
      a significance that lives only in the choice of an impoverished null.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: "Gurzadyan and Penrose themselves state that the critics \"simulate
      maps using the CMB power spectrum for LCDM, while we simulate a pure
      Gaussian sky plus the WMAP's noise,\" and every critical paper documents
      the same split. The claim is a description of what each side did, not a
      verdict on which ensemble is correct, and that description is
      uncontroversial on the face of the record. The strongest opposing
      consideration is that calling this a symmetric \"choice of ensembles\"
      understates an asymmetry: omitting the known power spectrum from the null
      is a methodological error rather than a legitimate alternative — but that
      is the attribution dispute (CCC-C009 versus CCC-C010), not a reason to
      deny that the ensemble difference is where the significance disagreement
      actually sits."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: Jow and Scott 2020 show that the 99.98 percent figure is the
      best-size result after the ring radius was chosen by inspection;
      marginalizing over the family of sizes searched leaves an 87 percent
      (about 1σ) excess. López et al. 2022, with a detector that recovers 95
      percent of synthetic CCC spots, find no significant population, and Bodnia
      et al. 2024 rule out Gaussian-profile spots of 100–400 µK at 0.7–1.2
      degrees and trace the strongest candidates to anomalous pixels. The
      strongest opposing consideration is the Planck–WMAP co-location of the
      five strongest spots, which no critic has specifically dismantled and
      which shows the spots are on the sky rather than in one instrument — but
      co-location is expected for any real shared-sky feature, artifact or
      fluctuation, and does not restore the headline significance.
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: Penrose 2018 states that CCC requires asymptotic "mass fade-out,"
      calls it "an admittedly unconventional hypothesis," and Tod 2022 lists
      implementation of mass fade-out among the theory's open problems, noting
      that massless charged particles are usually regarded as problematical. No
      evidence record supplies an accepted particle-physics mechanism. The
      strongest opposing consideration is Penrose's de Sitter-group remark that
      mass is not a Casimir operator when Λ > 0, together with the 2025
      Meissner–Penrose crossover conservation law — genuine theoretical
      movement, but neither implements rest-mass fade-out for the electron nor
      withdraws the concession that the hypothesis is unconventional.
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: Penrose's writings work out an entropy reset that depends on genuine
      information loss in black-hole evaporation together with conformal
      rescaling at crossover. Eckstein 2023 argues that the assumed loss of
      degrees of freedom is incompatible with the quantum notion of entropy and
      that information loss would raise global entropy rather than renormalize
      it — the opposite of what CCC needs — while proposing a unitary variant
      rather than dismissing the framework. The strongest opposing consideration
      on the supportive side is that information loss remains a live if minority
      position and that Eckstein is one analysis; on the critical side,
      AdS/CFT-era consensus and Page-curve calculations weigh heavily against
      the premise the accounting requires. The claim as stated, that the
      accounting is self-consistent, is therefore neither established nor
      refuted.
  - claimId: CCC-C007
    verdict: well_supported
    confidence: high
    reasoning: Penrose 2018 introduces erebons as gravitation-only Planck-mass
      particles created at crossover, decaying on a timescale of perhaps 10^11
      years, and possibly visible as impulsive events in gravitational-wave
      detectors; that is exactly what the claim asserts the theory predicts. No
      detection exists and no dedicated search has been published; the 2017
      LIGO-noise conjecture was not pursued to a result in either direction. The
      strongest opposing consideration is that the prediction is an
      order-of-magnitude sketch ("perhaps," "or thereabouts"), so as a
      theory-description the claim holds, but as a discriminator it remains
      quantitatively underspecified — a limitation the claim's own objection
      records, not a reason to deny that CCC makes this prediction.
  - claimId: CCC-C008
    verdict: well_supported
    confidence: high
    reasoning: Penrose 2018 states "there is no inflation in CCC" and assigns the
      near scale-invariance of CMB fluctuations to erebon decay during the
      previous aeon's exponential expansion; the claim is a correct description
      of the theory's structure. No published computation reproduces the
      measured spectral index, Gaussianity, or acoustic-peak structure from that
      mechanism. The strongest opposing consideration is that this makes the
      replacement a promissory note rather than a derived result, and that a
      confirmed primordial tensor B-mode detection — still absent, with
      BICEP/Keck reporting r < 0.036 — would be a signal CCC has no mechanism
      for; those points concern whether the replacement works, not whether CCC
      in fact deletes inflation and assigns the job to erebons.
  - claimId: CCC-C009
    verdict: contradicted
    confidence: high
    reasoning: "The attribution inherits the failure of its load-bearing
      observational claims: independent reanalyses find neither the circles nor
      the Hawking points anomalous once the null ensemble and look-elsewhere
      corrections are handled, and Bodnia et al. identify a few-pixel mechanism
      that manufactures the strongest recent circle families. The 2006 priority
      of the framework is real and weighs against treating CCC as a just-so
      story, but priority of a qualitative idea is not evidence that particular
      map features are previous-aeon scars. The strongest opposing consideration
      is the bundle of unanswered structural points — the untested sky-twist
      test, the extreme anisotropy of circle centers, Planck–WMAP co-location of
      the top spots, and the 2025 mass–temperature relation — together with the
      honest caveat that current nulls cannot rule out fainter or differently
      shaped imprints. Those residues keep the thesis from being closed forever;
      they do not presently support it."
  - claimId: CCC-C010
    verdict: well_supported
    confidence: high
    reasoning: "Seven independent analyses over fourteen years converge on the same
      account: a ΛCDM Gaussian random field plus documented search practices —
      an impoverished null, a-posteriori size choice, and few-pixel triggers —
      produce the reported signatures at the observed abundance. Planck 2018's
      precision inflationary scorecard shows the assumed null is not a
      placeholder. The strongest opposing consideration is that the critics'
      analyses are themselves post-hoc responses, that an 87 percent
      marginalized Hawking-point excess is not zero, that Planck–WMAP
      co-location and the sky-twist and anisotropy arguments have been answered
      only partially, and that Bodnia et al. themselves say their nulls do not
      disprove CCC. Those residues keep the claim short of established; they do
      not overturn the convergence."
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: "The record shows no preregistered or blind CCC-signature search: the
      Hawking-point radius was optimized in-sample, the sky-twist and anisotropy
      tests arrived after the first critiques, each critical reanalysis was
      built in response to a published claim, and the 2025 Meissner–Penrose
      paper continues to interpret the unrehabilitated 2020 detection. The
      strongest opposing consideration is the asymmetry objection: DeAbreu et
      al. froze parameters to the proponents' own published choices, which is a
      form of prespecification, and a null under the claimant's criteria carries
      more weight than a post-hoc positive. That asymmetry is real and means the
      claim slightly overstates symmetry of sin; it does not invent a
      preregistered protocol that the literature does not contain."
