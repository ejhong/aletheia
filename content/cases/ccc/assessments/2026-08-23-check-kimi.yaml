  synthesis: "This case has a clean three-storey structure, and the storeys
    decouple. The observation floor is settled: the low-variance rings exist as
    outputs of the published procedure and are reproduced by the theory's
    fiercest critics (CCC-C001, established), and the location of the dispute is
    itself documented in both camps' own words — a pure Gaussian-plus-noise null
    versus ΛCDM-spectrum simulations (CCC-C003, established). The
    theory-description floor is likewise settled as description: mass fade-out
    is required and admittedly unconventional (CCC-C005), the erebon dark-matter
    prediction and the deletion of inflation are verbatim in Penrose's papers
    (CCC-C007, CCC-C008), while the entropy reset's coherence (CCC-C006) is
    weakly supported and leaning adverse. The collapse happens on the evidential
    floor: both anomaly claims (CCC-C002, CCC-C004) are contradicted by
    convergent independent reanalyses — four groups for the circles, three for
    the Hawking points — under nulls that include the sky's known correlations,
    with the 99.98% figure deflating to ~1σ under a single look-elsewhere
    correction and the 2024 analysis identifying the few-pixel mechanism that
    manufactures false circles under the proponents' own criterion. The headline
    attribution (CCC-C009) therefore falls with its signatures, and the
    conventional account (CCC-C010) is well supported. The steelman for CCC is
    real. The framework predates the searches by four years — the circles were
    offered as predictions, not retrofits, which distinguishes CCC from nearly
    all pre-Big-Bang proposals. The sky-twist ellipticity test has never been
    independently run; the Planck–WMAP co-location of the strongest spots and
    the extreme clumping of circle centers have no specific conventional
    explanation; the ensemble objection is at least coherent if CCC is true; and
    because CCC's signature predictions remain qualitative, null results cannot
    yet be fatal. The 2025 Meissner–Penrose paper begins supplying the missing
    quantitative model. As a framework, CCC is untested, not refuted — erebons
    have never been searched for, and mass fade-out has no no-go theorem. The
    steelman for the verdict is stronger. A detection claim must be tested
    against everything the standing model predicts, and the measured power
    spectrum is not optional — that is a methodological norm, the one place this
    assessment leans on priors beyond the record, and the record itself
    documents it in four independent papers. The proponents' pattern — new
    statistic after each null, a new epoch after the angular-diameter
    discrepancy — is the documented signature of a-posteriori reasoning, and
    nothing on either side was ever preregistered (CCC-C011). The verdict is
    \"contradicted\" rather than \"unresolved\" because the burden sits on the
    detections and every independent test under defensible methods returns null;
    it is not closed because the residual items are unexplained observations,
    and the exit is procedural, not rhetorical: a preregistered adversarial
    reanalysis (CCC-R001) binding to quantitative predictions (CCC-R005), plus
    the instrument-level discriminators (CCC-R002, CCC-R003)."
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: The claim asserts only that low-variance rings exist in WMAP and
      Planck maps and are reproducible by independent groups applying the
      published procedure — and the critics themselves confirm exactly that in
      print (CCC-E002 "we do reproduce the claimed ring structures"; CCC-E003;
      CCC-E008 confirming the "special directions" in Planck data). Both camps
      agree on this rung; the entire dispute is downstream. The strongest
      opposing consideration is that the features are procedure-relative and
      Bodnia et al. 2024 (CCC-E012) show the criterion is triggered by few-pixel
      anomalous spots — so reproducing the rings partly means reproducing an
      artifact of the method. But the claim as stated is about procedure
      outputs, not their provenance, and on that it is confirmed by every group
      that has looked.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Four independent reanalyses — Wehus & Eriksen (CCC-E002),
      Moss/Scott/Zibin (CCC-E003), Hajian with realistic anisotropic noise
      (CCC-E004), and DeAbreu et al. using the proponents' own frozen parameters
      on Planck data (CCC-E008) — each find the observed circle abundance
      typical of ΛCDM-spectrum skies, and Bodnia et al. 2024 (CCC-E012) identify
      the mechanism by which few-pixel spots manufacture concentric low-variance
      circles under the search criterion. The reported 6σ survives only against
      a Gaussian-plus-noise null that omits the sky's known large-scale
      correlations; treating that null as inadequate is a methodological norm
      (the one prior-based input here), and the record documents it
      independently. The strongest opposing consideration is that the
      proponents' sky-twist ellipticity test (CCC-E006) has never been
      independently run and the anisotropy of ring centers (CCC-C504) lacks a
      specific conventional accounting — genuine gaps, but both are post-hoc
      proponent constructions, and artifact-driven circles would clump as well.
      No independent group has ever reproduced the claimed significance.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: "This is a documented fact about the record, stated verbatim by the
      proponents themselves (CCC-E005: \"Both groups simulate maps using the CMB
      power spectrum for LCDM, while we simulate a pure Gaussian sky plus the
      WMAP's noise\") and exhibited in every critical reanalysis. That the same
      rings are anomalous under one ensemble and typical under the other is the
      direct content of CCC-E002 and CCC-E003. The strongest opposing
      consideration is that describing this as a symmetric \"choice of
      ensembles\" understates the asymmetry — testing a detection against a null
      that omits known statistical properties of the data is a textbook error.
      But that objection concerns which null is right, not whether the ensemble
      difference is what the significance dispute traces to, which is all this
      claim asserts."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: "The headline 99.98% does not survive independent scrutiny: Jow &
      Scott (CCC-E010) show it was quoted for the ring size chosen after
      inspection, and marginalizing over the searched sizes leaves an 87% (~1σ)
      excess. López et al. (CCC-E011) built a detector that recovers 95% of
      synthetic CCC spots and found no significant population; Bodnia et al.
      (CCC-E012) found no significant Hawking points, excluded Gaussian-profile
      spots of 100–400 µK at 0.7–1.2°, and traced the strongest candidates to
      anomalous pixels. The strongest opposing consideration is the Planck–WMAP
      co-location of the five strongest spots, which no critic has specifically
      dismantled — but co-location is expected for any real feature of the
      shared sky, artifact or ΛCDM fluctuation, so it shows the spots are on the
      sky rather than in the instruments without showing they are pre-cosmic.
      The claim as stated, including its significance figure, is contradicted."
  - claimId: CCC-C005
    verdict: established
    confidence: high
    reasoning: "The claim concerns the theory's requirements and the state of
      mechanisms, and both are verified from primary sources: Penrose's own \"an
      admittedly unconventional hypothesis\" (CCC-E015) and Tod's sympathetic
      open-problems list (CCC-E016: \"Massless charged particles are usually
      regarded as problematical\"). The 2025 Meissner–Penrose paper (CCC-E022)
      derives a crossover conservation law but supplies no fade-out mechanism,
      leaving the gap intact as of this run. The strongest opposing
      consideration is Penrose's de Sitter-group observation that mass is not a
      Casimir operator when Λ > 0, so exact mass constancy is less sacrosanct
      than Poincaré-invariant intuition suggests — but that makes the gap a
      missing mechanism rather than a proven impossibility, which is precisely
      what the claim says."
  - claimId: CCC-C006
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The claim asserts that the entropy reset is self-consistent and
      legitimate, but it depends on black-hole information loss, which the
      AdS/CFT-era unitarity consensus and recent Page-curve calculations reject
      — that is background calibration beyond the evidence records, and I flag
      it as such. Within the record, the one direct published analysis is
      adverse: Eckstein 2023 (CCC-E017) argues the assumed loss of degrees of
      freedom is incompatible with the quantum notion of entropy and raises
      global entropy rather than resetting it — the opposite of what CCC needs.
      On the supporting side there is Penrose's worked-out position
      (CCC-E014-era writings, SRC-PENROSE-2013-FOP) and the fact that Eckstein
      repairs rather than dismisses the framework with a unitary variant. With
      the underlying quantum gravity unsettled and no demonstration that the
      crossover ledger balances, the claim is weakly supported; moderate
      confidence because the relevant physics is genuinely live."
  - claimId: CCC-C007
    verdict: established
    confidence: high
    reasoning: "As stated, this is a claim about what CCC predicts, and it is
      verified verbatim in Penrose 2018 (CCC-E018: mass \"something of the order
      of a Planck mass (10−5 g),\" gravitation-only interactions, lifetime
      \"perhaps something like 10^11 years\"), with the detector-noise
      conjecture documented in CCC-E019. No detection exists and no dedicated
      search has been published, but the claim does not assert that erebons
      exist. The strongest opposing consideration is that the prediction is an
      order-of-magnitude sketch (\"perhaps with some factor such as 8π\") whose
      vagueness risks unfalsifiability — that bears on the prediction's
      testability and diagnostic value, not on whether the theory makes it,
      which is the claim's content."
  - claimId: CCC-C008
    verdict: established
    confidence: high
    reasoning: "The claim describes the theory's structure, and the primary source
      is unambiguous: \"there is no inflation in CCC\" (CCC-E018), with erebon
      decay in the previous aeon assigned the fluctuation-sourcing role
      inflation normally plays. Tod's question list (CCC-E016) confirms the same
      structure from a sympathetic hand. The strongest opposing consideration is
      that the assignment is a promissory note — no published CCC computation of
      the spectral index, acoustic peaks, or Gaussianity exists, so the
      mechanism's adequacy is undemonstrated. That objection targets the
      theory's unpaid debts, not the accuracy of this description of it, which
      is what the claim asserts."
  - claimId: CCC-C009
    verdict: contradicted
    confidence: moderate
    reasoning: "The thesis inherits CCC-C002 and CCC-C004, both contradicted under
      defensible nulls and look-elsewhere accounting, and adds its own defect:
      the predictions were qualitative (some rings, some spots, somewhere), so
      any flagged feature could be claimed as a match and the significance lived
      entirely in after-the-fact analysis choices. Seven independent analyses
      converge against the claimed anomalies, and the 2025 Meissner–Penrose
      paper (CCC-E022) defends the interpretation without engaging the
      statistical critiques that contradicted it. What holds confidence at
      moderate rather than high: the genuine 2006 priority of the framework
      (CCC-E014), the never-independently-run sky-twist test, the unexplained
      Planck–WMAP co-location of the strongest spots, and Bodnia et al.'s own
      caveat that current nulls cannot exclude fainter or differently shaped
      imprints. These are residuals, not positive evidence, but a preregistered
      test (CCC-R001) could still reopen the question."
  - claimId: CCC-C010
    verdict: well_supported
    confidence: high
    reasoning: "Seven independent analyses across fourteen years converge on this
      account (CCC-E002, E003, E004, E008, E010, E011, E012), the 2024 artifact
      diagnosis supplies the positive mechanism by which the proponent criterion
      generates false positives, and the account requires nothing beyond
      standard cosmology plus documented analysis practices — while Planck's
      precision fits (CCC-E020) give the rival a quantitative scorecard CCC
      cannot currently match. It is held short of established by its own
      acknowledged residuals: the marginalized Hawking-point excess is 87%
      rather than zero, the cross-map co-location has no specific conventional
      explanation, and the sky-twist test was never run by critics. The
      strongest opposing consideration is that the universal wording — \"fully
      accounts for every reported signature\" — outruns the record on exactly
      those items, and the critics' analyses were themselves post-hoc, though
      DeAbreu et al.'s freeze to the proponents' published parameters is a de
      facto prespecification that mitigates the symmetry charge."
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: "The post-hoc character of the entire exchange is visible on the face
      of the record: the Hawking-point ring size was optimized in-sample (the
      defect CCC-E010 corrects), the sky-twist and anisotropy arguments were
      introduced in response to criticism (CCC-E006), every critical reanalysis
      was constructed after the claim it tested, and the 2025 paper absorbs a
      factor-of-two angular discrepancy by introducing a new epoch after the
      observation (CCC-E022). No party has published a preregistered or blinded
      protocol. The strongest opposing consideration is the asymmetry objection:
      post-hoc design is far more corrosive to detection claims than to nulls,
      and DeAbreu et al. deliberately froze their parameters to the proponents'
      own published choices. That is a real qualification, but the proponents'
      underlying choices were themselves made after inspecting the data, so the
      claim survives — it is kept at well_supported rather than established
      because it is an editorial synthesis of the exchange, as the case file
      honestly labels it, with the DeAbreu nuance attached."
