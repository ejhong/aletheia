  synthesis: >-
    The featured hypothesis is that the reported low-variance concentric circles
    and compact hot spots in the WMAP and Planck maps are imprints of
    supermassive-black-hole encounters and Hawking evaporations in an aeon
    before our Big Bang. That attribution does not survive the evidence ledger.
    Every group that has looked, critics included, reproduces the ring-like and
    spot-like outputs of the published search procedures, so the sky is not
    empty of the features. Significance, however, is a comparison, and the
    comparison that produced six-sigma circles and 99.98-percent Hawking points
    was drawn against an impoverished null: a nearly white Gaussian sky plus
    instrument noise, or a ring size chosen after inspection. When the same
    procedures are run on skies that carry the observed ΛCDM angular power
    spectrum, the features appear at the same abundance. When the Hawking-point
    search is marginalized over the family of sizes actually examined, the
    excess falls to about one sigma. When a handful of freak few-pixel spots are
    screened out, the concentric-circle criterion ceases to flag a statistically
    significant population. A purpose-built detector that recovers 95 percent of
    synthetic CCC spots finds none of significance in Planck. Those results,
    from seven independent analyses spanning 2011 to 2024, are the load-bearing
    record.

    Steelmanned, the proponent case is not frivolous. Conformal cyclic cosmology
    was stated in 2006, four years before anyone searched for circles, so the
    program is not a pattern found first and theorized after. The sky-twist test
    compares the real sky to elliptically distorted versions of itself and, if
    an independent replication ever confirmed a sharp circular preference under
    artifact screening, would sidestep the ensemble quarrel. Circle centers are
    reported to clump with extreme anisotropy, and the strongest hot spots sit
    at the same locations in Planck and WMAP. Proponents can insist that feeding
    the ΛCDM spectrum into the null smuggles in the large-scale correlations at
    issue. Mass fade-out and the entropy reset are acknowledged costs, not
    hidden ones, and a 2025 preprint begins to supply a mass–temperature
    relation that earlier searches lacked. None of that, on the present ledger,
    rehabilitates the headline detections. The sky-twist and anisotropy
    arguments remain unreplicated under artifact screening; cross-instrument
    co-location shows the spots are on the sky, which ordinary CMB fluctuations
    also are; and a conservation law plus a post-hoc angular-diameter epoch do
    not answer Jow and Scott or Bodnia et al.

    The conventional steelman is correspondingly strong, and incomplete only in
    a narrower way. Inflationary ΛCDM plus the ordinary statistics of searching
    a red-tilted Gaussian field accounts for the reported signatures without a
    remainder that has been shown to be surprising. Residual 87-percent weather,
    untested ellipticity, and the absence of a preregistered protocol on either
    side are real caveats, which is why CCC-C011 is a weakest link: the same
    public maps have never been submitted to a jointly frozen statistic,
    ensemble, mask, artifact screen, and look-elsewhere correction. Until that
    is done, and until CCC states how many circles and spots, at what amplitude
    and profile, the observational case can be contradicted without the
    framework being refuted. CCC as a cosmological construction remains an
    untested idea carrying unpaid theoretical debts — mass fade-out, a contested
    entropy reset, and no computed perturbation spectrum. A confirmed primordial
    B-mode detection would expose the deleted-inflation gap; an erebon-decay
    search would test the one laboratory-adjacent commitment. Those are future
    discriminators. On the evidence in this file, the microwave sky has been
    shown to contain structure, not a previous universe.
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: Every independent group that applied the published Gurzadyan–Penrose
      search — including Wehus and Eriksen, Moss, Scott and Zibin, and DeAbreu
      et al. — reproduced low-variance annular rings, often in concentric sets,
      in both WMAP and Planck maps. The observational existence of these
      procedure outputs is therefore not in dispute between the camps. The
      strongest opposing consideration is Bodnia et al. 2024's demonstration
      that the search criterion is triggered by few-pixel bright or dark spots
      that inflate local baseline variance, so reproducing the rings partly
      means reproducing a method artifact; that objection bears on
      interpretation and significance, not on whether the published procedure
      returns the same features.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Four independent reanalyses (Wehus and Eriksen 2011; Moss, Scott and
      Zibin 2011; Hajian 2011; DeAbreu et al. 2015) each found the observed
      circle abundance consistent with ΛCDM-spectrum simulations containing no
      previous aeon, and Bodnia et al. 2024 showed that few-pixel spots
      manufacture concentric low-variance families under the proponents' own
      criterion. The reported 6σ lives only against a pure-Gaussian-plus-noise
      null that omits the known CMB correlations. The strongest opposing
      consideration is the unreplicated sky-twist ellipticity drop-off and the
      extreme reported anisotropy of circle centers, neither of which has been
      independently run under artifact screening.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: "Gurzadyan and Penrose themselves stated that the critics \"simulate
      maps using the CMB power spectrum for LCDM, while we simulate a pure
      Gaussian sky plus the WMAP's noise,\" and every critical paper records the
      same split. As a description of what each side did, the claim is
      uncontroversial on the primary record. The strongest opposing
      consideration is that calling this a symmetric choice of ensembles
      understates an asymmetry: omitting known statistical properties of the
      data from the null is a textbook error, and the proponents' justification
      that the CMB is mostly non-random presupposes part of what is in dispute."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: Jow and Scott showed that the 99.98% figure was quoted for the best
      ring size after inspection; marginalizing over the family of sizes
      searched leaves an 87% (about 1σ) excess. López et al. 2022, using a
      detector that recovered 95% of synthetic CCC spots, found no significant
      population, and Bodnia et al. 2024 ruled out Gaussian-profile spots of
      100–400 µK at 0.7–1.2° and traced the strongest candidates to anomalous
      pixels. The strongest opposing consideration is the Planck–WMAP
      co-location of the five strongest spots, which shows the candidates are on
      the sky rather than in one instrument's noise — though co-location is also
      expected for ordinary shared-sky CMB fluctuations and shared map
      artifacts.
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: Penrose 2018 states in his own words that CCC requires asymptotic
      mass fade-out and calls it "an admittedly unconventional hypothesis"; Tod
      2022 lists implementation of fade-out, especially for charged particles,
      among the theory's open problems. No evidence record supplies an accepted
      particle-physics mechanism, and the 2025 Meissner–Penrose conservation law
      advances crossover bookkeeping without implementing fade-out itself. The
      strongest opposing consideration is Penrose's remark that mass is not a
      Casimir operator of the de Sitter group, so exact mass constancy is less
      sacrosanct when Λ > 0 — a hint of a gap rather than a working mechanism.
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: Penrose's writings work out an entropy reset that depends on
      black-hole information loss plus conformal rescaling at crossover, which
      is coherent on its own stated premises and supplies CCC's answer to the
      Second-Law initial-condition problem. Eckstein 2023 argues that the
      assumed loss of degrees of freedom is incompatible with the quantum notion
      of entropy and that information loss would increase rather than reset
      global entropy, and the AdS/CFT-era consensus plus Page-curve results
      favor unitarity. The strongest opposing consideration is that Eckstein is
      one analysis in a live quantum-gravity controversy, proposes a unitary CCC
      variant rather than dismissing the framework, and the information-loss
      premise has not been formally withdrawn by its author.
  - claimId: CCC-C007
    verdict: established
    confidence: high
    reasoning: Penrose 2018 introduces erebons as Planck-mass, gravitation-only
      particles created at crossover, decaying within an aeon, and possibly
      visible in gravitational-wave detectors; the claim is a statement of what
      the theory predicts and is documented in the primary text. No detection
      exists and no dedicated search has been published; the 2017 LIGO-noise
      note remains an unfollowed conjecture. The strongest opposing
      consideration is that the prediction is an order-of-magnitude sketch —
      mass "perhaps with some factor such as 8π," lifetime "perhaps something
      like 10^11 years" — so a null search can still be absorbed by parameter
      adjustment.
  - claimId: CCC-C008
    verdict: well_supported
    confidence: high
    reasoning: Penrose 2018 states "there is no inflation in CCC" and assigns the
      near scale-invariance of CMB fluctuations to erebon decay during the
      previous aeon's exponential expansion; that is the theory's structure as
      written. Whether erebon decay can quantitatively reproduce the measured
      tilt and acoustic peaks has not been demonstrated. The strongest opposing
      consideration is that no published CCC computation of the fluctuation
      spectrum exists, so the assignment is a promissory note against
      inflationary ΛCDM's sub-percent Planck fit, and a confirmed primordial
      B-mode detection would expose a signal CCC has no mechanism for.
  - claimId: CCC-C009
    verdict: contradicted
    confidence: high
    reasoning: "The attribution inherits the contradicted status of CCC-C002 and
      CCC-C004: independent groups find no significant anomaly once the null
      ensemble and look-elsewhere corrections are handled, and Bodnia et al.
      trace the strongest recent candidates to few-pixel artifacts. Priority of
      the 2006 framework is real but does not rescue qualitative, post-hoc
      signature claims, and the 2025 preprint defends the 2020 detection without
      engaging those statistical critiques. The strongest opposing consideration
      is the bundle of still-untested structural arguments — sky-twist
      ellipticity, center anisotropy, cross-map co-location — plus Bodnia's own
      caveat that current-data nulls do not disprove fainter CCC imprints."
  - claimId: CCC-C010
    verdict: well_supported
    confidence: high
    reasoning: Seven independent analyses over fourteen years find the reported
      signatures at chance abundance under ΛCDM-spectrum skies, Jow and Scott
      remove the Hawking-point headline by a look-elsewhere correction, and
      Bodnia et al. supply the generating mechanism for false concentric circles
      around anomalous pixels. The account requires nothing beyond a Gaussian
      random field with the observed power spectrum plus documented search
      practices. The strongest opposing consideration is that the critics'
      analyses were themselves designed after reading the proponents, none were
      preregistered, and the sky-twist and center-anisotropy arguments have been
      answered only partially, mostly by noting they were not predicted in
      advance.
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: "The Hawking-point ring size was optimized in-sample, the sky-twist
      and anisotropy tests were introduced after criticism, and every critical
      reanalysis was constructed because of the claim it tested; no party has
      published a preregistered protocol. The 2025 mass–temperature relation is
      a first quantitative fragment but arrived after the contested detection it
      is used to interpret. The strongest opposing consideration is the
      asymmetry objection: DeAbreu et al. froze parameters to the proponents'
      published choices, which is a form of prespecification, and a null found
      under the claimant's own criteria carries weight that a post-hoc positive
      does not."
