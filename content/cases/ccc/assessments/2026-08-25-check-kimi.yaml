  synthesis: "The headline thesis of this case — that concentric low-variance
    circles and compact hot spots in the microwave sky are imprints of a
    previous aeon — is contradicted by the assembled evidence record, and the
    structural reason is worth stating precisely because it is not \"the critics
    outnumber the proponents.\" Every group, on both sides, reproduces the
    features; the entire anomaly claim lives in the null ensemble and in
    after-the-fact analysis choices, and when those are handled by independent
    parties the significance evaporates without the data changing at all. That
    is the strongest form a contradiction can take in this kind of dispute: not
    a failure to reproduce, but reproduction-plus-typicality. Four independent
    circle reanalyses and three independent Hawking-point analyses converge, and
    the 2024 Bodnia et al. work upgrades the critique from \"your null is
    wrong\" to a positive mechanism — few-pixel bright spots inflate the local
    variance baseline and thereby generate the flagged rings — which is exactly
    the kind of explanatory closure that turns \"your statistic is
    questionable\" into \"here is how your statistic manufactures its own
    positives.\" The rival thesis CCC-C010, standard ΛCDM plus ordinary search
    statistics, is well supported rather than established, and the record itself
    flags why: the proponents' sky-twist ellipticity test has never been
    independently run, the anisotropy of circle centers has been answered only
    by noting it was not predicted in advance, the Planck–WMAP co-location of
    the strongest spots has not been specifically dismantled, and the
    marginalized Hawking-point residue is 87%, not zero. These are loose ends,
    not exonerations — each is precisely the kind of argument that post-hoc
    analysis generates and only preregistration can adjudicate — but they are
    honestly on the record, and they keep the verdict at contradicted for the
    detection claims rather than closed. The framework itself, CCC as a
    cosmological proposal, is a different matter and must not be fused with the
    failed detections: it predates the data claims, it carries real theoretical
    costs (mass fade-out, the entropy reset) that the record documents as open
    problems rather than refutations, and it retains two forward exposures —
    primordial B-modes and the untried erebon search — that are presently
    untested in either direction. The case verdict is contradicted because the
    featured hypothesis as presented — the CMB carries news from the aeon before
    ours — is carried entirely by CCC-C002 and CCC-C004, both of which fail
    independent scrutiny, while CCC-C009 inherits their collapse and adds the
    qualitative-prediction defect that made the whole exchange possible.
    Steelmanning the other direction: Penrose's group chose its statistics in
    the open, published its disagreements with the critics' nulls, produced
    genuine structural arguments no one has refuted head-on, and has now
    supplied the first fragment of a quantitative signal model; if a
    preregistered adversarial search found a surviving excess, the record would
    have to be re-read. But on the evidence as it stands, fourteen years of
    reanalysis by disinterested groups finds a sky that looks exactly like the
    standard model's sky searched hard."
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: "The existence of low-variance ring features as outputs of the
      published search procedure is affirmed by every group that has run it,
      including the theory's sharpest critics, who reproduced the
      Gurzadyan–Penrose outputs verbatim and said so in print (CCC-E002,
      CCC-E003, CCC-E008). This is the rare claim in the case with genuinely
      adversarial confirmation. The strongest opposing consideration is that
      \"feature\" is procedure-relative: Bodnia et al. 2024 show the variance
      criterion is triggered by few-pixel anomalies (CCC-E012), so what is
      reproduced is partly an artifact-generator rather than a sky object. That
      bears on what the features are, not on whether the procedure outputs them,
      so the claim as stated stands."
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Four independent reanalyses — Wehus & Eriksen, Moss/Scott/Zibin,
      Hajian, and DeAbreu et al. — each find the observed circle abundance fully
      typical of simulated ΛCDM skies, with Hajian closing the anisotropic-noise
      loophole and DeAbreu freezing the proponents' own published parameters, a
      de facto prespecification (CCC-E002 through CCC-E008). The 6σ figure
      arises only against the Gaussian-plus-noise null that omits the measured
      large-scale correlations of the real sky. The 2024 artifact diagnosis
      (CCC-E012) then supplies the generating mechanism for false positives,
      which is the difference between a statistical quibble and a contradiction.
      The strongest opposing consideration is the sky-twist ellipticity drop-off
      (CCC-C503), a simulation-free comparison no independent group has ever
      run; it is a genuine gap, but it is also an a-posteriori statistic
      introduced after the critiques, so it cannot presently outweigh four
      concordant independent nulls.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: "As a description of where the disagreement lives, this claim is
      documented on both sides: the proponents' own response note states that
      the critics simulate with the ΛCDM power spectrum while they simulate a
      pure Gaussian sky plus noise (CCC-E005), and every critical paper confirms
      it. No party disputes the facts of who simulated what. The strongest
      opposing consideration is normative rather than factual — the proponents
      hold that ΛCDM-spectrum simulations smuggle the disputed structure into
      the definition of chance — but that is the attribution dispute (CCC-C009
      versus CCC-C010), not a challenge to this claim's descriptive content.
      Where the verdict leans on priors: the near-universal view that the null
      must contain the rival model's known predictions is standard statistical
      doctrine, used here for calibration only, not as evidence."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: "Jow & Scott's marginalization over the in-sample-optimized ring size
      collapses the headline 99.98% to 87% — roughly one sigma — on unchanged
      data, which is the cleanest demonstration in the case that the
      significance lived in the analysis choices (CCC-E010). Two further
      independent searches then find nothing: López et al. built a detector that
      recovers 95% of synthetic CCC-style spots and found no significant
      population in Planck maps (CCC-E011), and Bodnia et al.'s HawkingNet rules
      out Gaussian-profile spots of 100–400 µK at 0.7–1.2° while tracing the
      strongest candidates to anomalous individual pixels (CCC-E012). The
      strongest opposing consideration is the Planck–WMAP co-location of the
      five strongest spots, which no critic has specifically dismantled; but
      co-location only shows the spots are in the shared sky rather than in one
      instrument, and both instruments observe the same ΛCDM fluctuations and
      (per Bodnia) the same few-pixel anomalies, so it cannot presently carry
      the anomaly claim."
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: "This is a claim about the theory's requirements, and it is supported
      from the primary source: Penrose himself calls mass fade-out \"an
      admittedly unconventional hypothesis\" (CCC-E015), and Tod's sympathetic
      open-problems inventory lists its implementation — including the
      massless-charged-particle problem — as unsolved (CCC-E016). No accepted
      mechanism exists, and none is claimed in the record. The strongest
      opposing consideration is Penrose's observation that mass is not a Casimir
      operator of the de Sitter group, so exact mass constancy is less
      sacrosanct with positive Λ than Poincaré intuition suggests; the 2025
      Meissner–Penrose conservation law (CCC-E022) is progress on the crossover
      bookkeeping but, per the record, does not supply the fade-out mechanism
      itself. That makes the gap a missing mechanism rather than a proven
      impossibility — which is exactly what the claim says. Whether nature
      obliges is presently untestable and outside the claim's content."
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: "The entropy accounting is worked out in Penrose's writings, but it
      rests on black-hole information loss, which the mainstream quantum-gravity
      position rejects, and Eckstein 2023 argues directly that the assumed loss
      of degrees of freedom is incompatible with the quantum notion of entropy
      and would raise rather than reset global entropy (CCC-E017). Notably,
      Eckstein proposes a unitary CCC variant rather than dismissing the
      framework, which cuts both ways: the critique is live, but so is the
      repair program. The strongest opposing consideration to a \"contradicted\"
      verdict is that this is a one-paper attack inside an unresolved
      foundational controversy (the Page-curve literature is invoked on both
      sides), and the record contains no definitive adjudication — so the claim
      is genuinely contested rather than refuted. \"Mixed\" here is substantive:
      the reset as originally formulated is under a specific, published,
      mechanism-level challenge that the proponents have not answered in the
      record."
  - claimId: CCC-C007
    verdict: well_supported
    confidence: high
    reasoning: "As a statement of what CCC predicts, this is documented verbatim in
      Penrose 2018: Planck-mass gravitation-only particles, ~10¹¹-year
      lifetimes, decay signals potentially visible to gravitational-wave
      detectors (CCC-E018), with the 2017 LIGO-noise conjecture as context
      (CCC-E019). The verdict covers attribution to the theory, not truth: no
      dedicated search has ever been run and no detection exists, so the
      empirical content is presently untested in either direction. The strongest
      opposing consideration is recorded in the claim's own file — the
      parameters are order-of-magnitude (\"perhaps with some factor such as
      8π,\" \"perhaps something like 10^11 years\"), so a null can always be
      absorbed by adjustment until a spectrum and rate are derived; this is the
      same underspecification that disabled the CMB claims, imported into the
      one prediction that could be clean."
  - claimId: CCC-C008
    verdict: well_supported
    confidence: high
    reasoning: "As a description of the theory's structure this is directly sourced
      — \"there is no inflation in CCC,\" with the fluctuation-seeding role
      reassigned to erebon decay in the previous aeon (CCC-E018) — and Tod
      confirms the perturbation-spectrum derivation remains an open question
      (CCC-E016). The claim is therefore accurate about what CCC contains. The
      strongest opposing consideration is the asymmetry of obligations:
      inflationary ΛCDM fits Planck to sub-percent precision (CCC-E020), while
      CCC offers no published computation of the spectrum it predicts, so the
      reassignment is a promissory note; and the claim's exposure is real — a
      confirmed primordial tensor B-mode detection would evidence an era CCC has
      no mechanism for, while current BICEP/Keck nulls (r < 0.036) leave that
      discriminator open (CCC-E021). The verdict reflects descriptive accuracy,
      not empirical adequacy."
  - claimId: CCC-C009
    verdict: contradicted
    confidence: moderate
    reasoning: 'The headline attribution inherits the collapse of both signature
      claims: with CCC-C002 and CCC-C004 contradicted under independent
      reanalysis and the artifact mechanism identified, there is no anomalous
      feature left for a previous aeon to explain. Confidence is moderate rather
      than high for the reasons the record itself enumerates: the theory
      genuinely predates the searches (CCC-E014), the sky-twist test and
      center-anisotropy argument have never been independently examined
      (CCC-E006), the cross-map spot co-location is undismantled, and Bodnia et
      al. state explicitly that their nulls do not disprove CCC or fainter
      imprints (CCC-E012). The strongest opposing consideration is that the
      predictions were qualitative — some rings, some spots, somewhere — so
      strictly speaking the theory was never exposed to a bound test, which cuts
      toward "unresolved" as a matter of logic. The verdict nonetheless lands on
      contradicted because the claim as stated asserts these reported features
      are such imprints, and every independent check of those features says
      otherwise; what remains open is CCC at lower amplitude, not this thesis.'
  - claimId: CCC-C010
    verdict: well_supported
    confidence: high
    reasoning: "Seven independent analyses across fourteen years converge on the
      account, the 2024 study supplies the previously missing false-positive
      mechanism, and the account requires nothing beyond standard cosmology plus
      documented analysis practices (CCC-E002, E003, E004, E008, E010, E011,
