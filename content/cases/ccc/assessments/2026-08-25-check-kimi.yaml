      analyses are also post-hoc — each designed in response to a proponent
      claim, none preregistered — which is true but asymmetric in force: a null
      obtained under the claimant's own frozen parameters (DeAbreu et al.) and a
      null obtained by a detector validated to find the claimed signal (López et
