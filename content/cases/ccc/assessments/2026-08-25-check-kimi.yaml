      diagnosis is a positive explanatory result rather than a mere failure to
      confirm."
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: "Visible on the face of the record: the Hawking-point ring size was
      optimized in-sample (CCC-E010), the sky-twist and ellipticity statistics
      were introduced in the same papers that report their success (CCC-E006),
      each critical reanalysis was constructed after the claim it tested, and no
      party has published a preregistered protocol; the proponents' rejoinder
