      opposing consideration is the asymmetry objection: DeAbreu et al.'s
      freezing of the proponents' published parameters is a form of
      prespecification, and post-hoc construction is far more corrosive to
      positive claims than to nulls. That objection qualifies how the
      methodological fact should be weighted, but does not dispute the fact
      itself, which is all this claim asserts."
