  synthesis: >-
    Taken as a whole, the case file shows a sharp separation between three
    layers: (1) what is in the CMB maps, (2) what CCC as a theory asserts, and
    (3) whether the reported features are anomalous in a way that favors CCC
    over standard ΛCDM with inflation. The observational layer is clear:
    low-variance rings and compact hot spots of raised temperature are present
    as outputs of the Gurzadyan–Penrose / An et al. search procedures (CCC-C001,
    CCC-E001, E002, E008, E009). No serious critic disputes their procedural
    existence. The dispute is entirely about whether their abundance and
    structure are surprising under a sound null and hence evidence for a
    previous aeon (CCC-C002, CCC-C004, CCC-C009) versus ordinary realizations of
    a correlated Gaussian CMB field plus the usual pitfalls of searching
    (CCC-C010).

    On the circles, four independent groups using ΛCDM-spectrum simulations and,
    in Hajian’s case, realistic anisotropic noise (CCC-E002–E004, E008) find
    that the observed low-variance rings and concentric sets are fully
    consistent with a standard sky: the features are confirmed, the anomaly is
    not. DeAbreu et al. go further by freezing the search parameters to the
    proponents’ own published choices, applying them to Planck, and still
    finding no excess beyond ΛCDM expectations (CCC-E008). Bodnia et al. then
    identify a concrete mechanism by which the Gurzadyan–Penrose statistic
    manufactures concentric low-variance sets around a handful of freak
    bright/dark pixels, and show that removing those spots eliminates any
    statistically significant circles at full resolution (CCC-E012). This
    sequence strongly undermines CCC-C002 and supports the conventional
    attribution CCC-C010. The proponents’ sky-twist ellipticity test and
    anisotropy of centers (CCC-E006, C503, C504) remain unreplicated; they are
    the best steel for CCC on this front, but are themselves post-hoc constructs
    with unclear null behavior and potentially sensitive to the same spot
    artifacts. In the absence of independent confirmation under artifact
    screening, they do not rescue the anomaly claim.

    The Hawking-point story parallels this but is even clearer. An et al. report
    hot spots of a characteristic size at 99.98% confidence (CCC-C004, E009).
    Jow & Scott show that this figure exploits an a-posteriori choice of ring
    size; marginalizing over the sizes actually searched reduces the excess to
    ~87% (≈1σ), i.e. statistically unremarkable (CCC-E010). López et al. design
    a ring detector that recovers 95% of synthetic CCC spots yet finds no
    significant population in Planck maps (CCC-E011). Bodnia et al.’s HawkingNet
    search likewise finds no signal and explicitly rules out spots with
    amplitudes and scales close to those claimed by An et al. (CCC-E012). What
    survives for CCC is mainly the cross-map co-location of the strongest spots
    in Planck and WMAP and the 2025 Meissner–Penrose attempt to fit a
    mass–temperature relation, but those points presuppose the existence of a
    statistically significant population that the independent reanalyses do not
    corroborate. In other words, the detailed theoretical modeling is being hung
    on a signal whose detection has not withstood basic look-elsewhere
    correction and robustness checks.

    Methodologically, CCC-C003 and CCC-C011 capture the crux. Both sides agree
    the circle dispute lives in the construction of the null ensemble; Gurzadyan
    & Penrose used an impoverished pure-Gaussian + noise null, while every
    independent reanalysis used simulations matched to the observed ΛCDM power
    spectrum and noise properties. Under standard practice, the latter is
    plainly the appropriate null for testing “unexpected structure” claims,
    which is why the 6σ headline effectively “lives in the choice of null.”
    CCC-C011 is also borne out: every analysis, pro and con, has been post-hoc;
    no search for CCC signatures has been preregistered or blinded. However, the
    asymmetry matters. Post-hoc choices inflate the risk of false positives far
    more than they erode the force of nulls found under the proponents’ own
    criteria. DeAbreu et al.’s and Bodnia et al.’s results, which explicitly
    adopt or encapsulate proponent-defined statistics then find no excess,
    therefore carry substantial weight against the anomaly claims even in a
    non-preregistered environment.

    The broader CCC framework has distinct theoretical costs: the need for an
    as-yet-unrealized mass fade-out mechanism (CCC-C005, CCC-E015, E016) and a
    controversial entropy reset relying on black-hole information loss
    (CCC-C006, E017), plus the obligation to reproduce the exquisitely measured
    CMB power spectrum without inflation (CCC-C008, E018, E020). Those are
    correctly described in the claims as open or contested; they do not by
    themselves refute CCC but do lower its prior plausibility relative to
    standard ΛCDM+inflation, especially given the latter’s quantitative
    empirical success (CCC-E020) and lack of a CCC-specific observational win.

    Weighing all this, the central attribution claim CCC-C009—that the reported
    circles and Hawking points are genuine imprints of the previous aeon—is
    contradicted by the best available evidence: multiple independent reanalyses
    using appropriate nulls find the features unexceptional, and the most
    careful recent work finds that key circle signatures are artifacts of
    few-pixel anomalies and that Hawking points of the claimed character are
    absent. The rival conventional claim CCC-C010—that standard ΛCDM plus
    ordinary statistical effects explains the signatures—is well-supported by
    convergent studies. The case is not entirely closed in principle: a
    preregistered adversarial analysis with quantitative CCC predictions
    (CCC-R001, R005) could, in theory, revive a signal, and forward tests such
    as erebon-decay searches (CCC-R002) or future B-mode detections (CCC-R003)
    could move the framework-level balance. But on the current evidence, the
    specific CMB detections claimed for CCC have failed independent review, and
    the case as framed here warrants a contradicted verdict.

    Sensitivity-wise, CCC-E012 (Bodnia et al. 2024) is the single load-bearing
    record whose removal would most soften this conclusion: it both supplies a
    concrete artifact mechanism and delivers the strongest modern nulls for both
    circles and Hawking points. Even without E012, however, the remaining
    independent reanalyses (E002–E004, E008–E011) still leave CCC-C002,
    CCC-C004, and thus CCC-C009 contradicted rather than merely mixed. The
    assessment therefore does not hang on one thread; Bodnia et al. sharpen and
    anatomize a pattern already visible from earlier work.
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: Multiple independent groups, including critics of CCC, explicitly
      report reproducing the Gurzadyan–Penrose low-variance rings and concentric
      sets in WMAP and Planck data when applying the published procedure
      (CCC-E002, E008), and nothing in the later high-resolution work disputes
      their procedural existence—only their interpretation and significance. The
      strongest opposing consideration is that Bodnia et al. show these
      “features” are often generated by a few anomalous pixels inflating the
      local variance baseline (CCC-E012), so existence here is method-relative
      rather than evidence of a distinct physical pattern.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Four independent reanalyses using ΛCDM-spectrum simulations and
      realistic noise (Wehus & Eriksen, Moss/Scott/Zibin, Hajian,
      DeAbreu/Contreras/Scott; CCC-E002–E004, E008) all find that the abundance
      of concentric low-variance circles is fully consistent with standard ΛCDM
      skies, directly contradicting the claimed multi-sigma anomaly. Bodnia et
      al. further show that the proponents’ own search criterion manufactures
      concentric families around few-pixel bright/dark spots and that, once
      these are removed, no significant circle population remains at full
      resolution (CCC-E012). The main opposing consideration is the unreplicated
      sky-twist ellipticity test and anisotropy of centers (CCC-E006, C503,
      C504), which could, if independently confirmed under artifact screening,
      signal non-generic structure, but presently rest on post-hoc statistics
      lacking null calibration.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: Gurzadyan & Penrose themselves state that they simulate a “pure
      Gaussian sky plus the WMAP’s noise” while critics use simulations with the
      ΛCDM power spectrum (CCC-E005), and all critical papers characterize this
      ensemble difference explicitly (CCC-E002–E004, E008). There is no serious
      dispute about this factual description; what is contested is which
      ensemble is appropriate as a null, which belongs to attribution rather
      than to this methodological claim. The only opposing point is the
      proponent argument that ΛCDM-spectrum simulations are illegitimate because
      most of the CMB is “non-random,” but that does not alter the descriptive
      accuracy of CCC-C003.
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: The 99.98% Hawking-point significance in An et al. (CCC-E009) is
      shown by Jow & Scott to collapse to an 87% (~1σ) excess once one correctly
      marginalizes over the searched ring sizes (CCC-E010), and two further
      independent searches—López et al., with a CCC-calibrated ring detector,
      and Bodnia et al., with a deep network—find no statistically significant
      Hawking-point population, with Bodnia et al. explicitly ruling out spots
      of the quoted amplitudes and scales and tying candidate regions to a few
      anomalous pixels (CCC-E011, E012). The strongest counter-consideration is
      the cross-map co-location of the brightest spots in WMAP and Planck and
      the 2025 Meissner–Penrose modeling of a mass–temperature relation, but
      these presuppose a genuine excess and do not restore the underlying
      statistical case once look-elsewhere and artifact issues are addressed.
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: Penrose explicitly states that CCC “must apparently assume” an
      asymptotic rest-mass fade-out and labels this an “admittedly
      unconventional hypothesis” (CCC-E015), and Tod’s sympathetic review lists
      implementing mass fade-out as an open problem, particularly for charged
      particles like the electron (CCC-E016). These converge on CCC-C005 as an
      accurate description of the theory’s requirement and current status. The
      main opposing element is Penrose’s own claim that de Sitter symmetry
      weakens objections to variable mass, but this addresses plausibility, not
      the absence of a concrete mechanism.
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: CCC’s entropy-reset story—black-hole information loss plus conformal
      rescaling—exists in worked-out form in Penrose’s own writings (CCC-E015,
      PENROSE 2013), and Eckstein’s 2023 critique acknowledges it sufficiently
      to propose a unitary CCC variant, indicating the scheme is at least
      structurally coherent as a proposal. However, Eckstein also argues that
      the assumed information loss is incompatible with quantum entropy and
      would increase, not reset, global entropy (CCC-E017), and mainstream
      quantum-gravity work generally favors unitarity, undercutting the specific
      loss-based accounting. The strongest opposing consideration for a negative
      verdict is that this debate sits within an unsettled research area; no
      consensus no-go theorem yet definitively rules out CCC’s entropy scheme,
      so the claim cannot be cleanly labeled false or true.
  - claimId: CCC-C007
    verdict: well_supported
    confidence: high
    reasoning: "Penrose’s 2018 Foundations of Physics paper explicitly defines
      erebons as Planck-mass, gravitation-only dark-matter particles born at the
      crossover, decaying on ~10¹¹-year timescales in bursts of gravitational
      radiation potentially detectable by LIGO-like instruments (CCC-E018), and
      reiterates this conjecture in a 2017 preprint about LIGO noise (CCC-E019).
      These sources clearly support CCC-C007 as an accurate characterization of
      CCC’s prediction; the lack of quantitative spectrum/rate details bears on
      testability, not the content of the prediction. The main opposing point is
      precisely that vagueness: until amplitudes and rates are nailed down, the
      prediction remains too loose to be strongly falsifiable."
  - claimId: CCC-C008
    verdict: well_supported
    confidence: high
    reasoning: Penrose states unambiguously that “there is no inflation in CCC” and
      that erebon dynamics in the previous aeon are to source the CMB
      perturbations (CCC-E018), making CCC-C008 a straightforward summary of the
      framework. Independent mathematical work by Tod and others treats this
      “inflation-before-the-Bang” idea as one of CCC’s open tasks, further
      corroborating the attribution (CCC-E016). The main opposing consideration
      is that no explicit CCC power-spectrum calculation has yet matched
      Planck’s data, so while the descriptive claim about CCC is secure, the
      implied adequacy of the erebon mechanism to replace inflation remains an
      unproven promissory note.
  - claimId: CCC-C009
    verdict: contradicted
    confidence: high
    reasoning: CCC-C009’s attribution of the observed circles and Hawking points to
      previous-aeon black-hole encounters and evaporations depends on both
      CCC-C002 and CCC-C004 being true anomalies, but those anomaly claims are
      decisively undermined by multiple independent reanalyses and by Bodnia et
      al.’s artifact diagnosis and Hawking-point nulls (CCC-E002–E004,
      E008–E012). With the features’ abundance and profiles explained as typical
      for ΛCDM skies plus method-induced artifacts, there is no residual,
      statistically robust signature uniquely calling for a CCC explanation. The
      strongest opposing consideration is that CCC’s qualitative prediction of
      ring-like features predates the data mining (CCC-E014), and some
      structural arguments (ellipticity preference, anisotropy, cross-map spot
      co-location, Meissner–Penrose’s mass–temperature relation) have not been
      exhaustively addressed under preregistered, artifact-screened analyses;
      these keep a logically open door for future results but do not salvage the
      current attribution.
  - claimId: CCC-C010
    verdict: well_supported
    confidence: high
    reasoning: Independent reanalyses consistently find that when one uses ΛCDM
      power-spectrum simulations, realistic noise, appropriate look-elsewhere
      corrections, and, in Bodnia et al.’s case, explicit screening of few-pixel
      anomalies, the reported low-variance circles and Hawking points are
      statistically unremarkable or absent (CCC-E002–E004, E008, E010–E012).
      Bodnia et al. additionally demonstrate a concrete mechanism—anomalous
      few-pixel spots inflating local variance—by which the proponents’ own
      search procedure generates false concentric signatures, matching the
      critics’ contention that the CMB “simply contains structure” (CCC-E003).
      Remaining loose ends, such as the 87% Hawking-point residual, the
      unquantified anisotropy of centers, and cross-map co-location, are
      acknowledged by the critics themselves but are weak and statistically
      marginal compared to the weight of the null results.
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: The record shows that the Gurzadyan–Penrose circle statistic, the
      Hawking-point ring size, the sky-twist test, and subsequent proponent
      refinements were all introduced after exploration of the data; conversely,
      each critical reanalysis was explicitly designed in response to those
      claims, not from a precommitted protocol (CCC-E001, E005–E008, E009–E013).
      Jow & Scott’s need to retrospectively marginalize over ring sizes and
      Bodnia et al.’s post-hoc choice to investigate anomalous pixels exemplify
      this pattern. The strongest opposing point is that DeAbreu et al. do adopt
      the proponents’ previously published parameters as fixed when moving to
      Planck (CCC-E008), which is a limited form of prespecification; still, no
      analysis on either side freezes the full set of choices (statistic, masks,
      null, artifact handling) before first application to the relevant dataset,
      so CCC-C011 stands.
