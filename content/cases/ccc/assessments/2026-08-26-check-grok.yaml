      than renormalize it, while most of the post-Page-curve quantum-gravity
      literature rejects the information-loss premise. The strongest opposing
      consideration on the supportive side is that Eckstein proposes a unitary
      CCC variant rather than dismissing the framework, so the failure mode may
      be this particular reset, not every cyclic construction."
  - claimId: CCC-C007
    verdict: well_supported
    confidence: high
    reasoning: Penrose 2018 states the erebon proposal in full — Planck-mass,
