      is a cost of the theory, not a reason to deny that CCC makes the
      attribution.
  - claimId: CCC-C009
    verdict: contradicted
    confidence: high
    reasoning: "The attribution inherits the failure of CCC-C002 and CCC-C004: once
      the circles are typical of a ΛCDM sky and the Hawking-point significance
