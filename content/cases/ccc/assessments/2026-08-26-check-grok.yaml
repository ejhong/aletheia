  synthesis: "The featured hypothesis is that reported low-variance concentric
    circles and compact hot spots in the microwave sky are conformal scars of a
    previous aeon. Weighed only against the supplied evidence records, that
    attribution does not survive. Every group that has applied the published
    search finds the rings, so the maps-plus-procedure fact (CCC-C001) is not in
    dispute. What is in dispute is whether those rings, or the later
    Hawking-point candidates, are anomalous under a standard sky. Four
    independent circle reanalyses recover the same features at the same
    abundance in ΛCDM-spectrum simulations that contain no previous aeon.
    DeAbreu, Contreras and Scott froze the proponents' own published parameters
    and extended the search to Planck, with the same null result. The original
    6σ lived entirely in a pure-Gaussian-plus-noise ensemble that omits the
    known angular correlations of the CMB — a disagreement both sides document
    (CCC-C003). Bodnia et al. (2024) then identified a generating mechanism: a
    handful of few-pixel extrema inflate the local variance baseline and certify
    surrounding annuli as quiet; after those pixels are screened, no significant
    circles remain at full resolution. The Hawking-point claim follows the same
    arc. An, Meissner, Nurowski and Penrose reported 99.98% confidence plus
    Planck–WMAP co-location of the five strongest spots. Jow and Scott showed
    the headline figure is the best size after inspection; marginalizing over
    the family of sizes searched leaves an 87% (about 1σ) excess. López et al.
    built a detector that recovers 95% of synthetic CCC spots and found no
    significant population. Bodnia et al. rule out Gaussian-profile spots in a
    stated amplitude–size box and again trace the strongest candidates to
    anomalous pixels. Co-location shows the spots are on the sky rather than in
    one instrument; it does not show they are pre-Big-Bang. Steelman of the
    proponent side: CCC was stated in 2006, four years before anyone searched,
    so the program is not a just-so story fitted to a known anomaly. The
    sky-twist ellipticity drop-off and the extreme anisotropy of circle centers
    are structural claims that sidestep the ensemble fight, and no independent
    group has run the sky-twist test under artifact screening. The 87%
    Hawking-point residue is not zero. Qualitative predictions mean current
    nulls cannot kill fainter or differently shaped imprints, a limitation
    Bodnia et al. themselves record. Mass fade-out and the entropy reset remain
    open theoretical costs rather than observational disproofs, and primordial
    tensor B-modes — the cleanest framework discriminator — have not been
    detected. Those points keep CCC as a cosmological framework unresolved. They
    do not rehabilitate the specific detection claims. Fourteen years of
    un-preregistered exchange produced significances that live in analysis
    choices. Under a dependence-aware null and look-elsewhere accounting, the
    reported signatures are what a searched ΛCDM sky looks like. The
    observational thesis — that these features carry news from an aeon before
    ours — is therefore contradicted. The single record whose removal would most
    change the texture of that verdict is CCC-E012 (Bodnia et al. 2024), because
    it is the only record that both nulls the signatures at full resolution and
    identifies the false-positive mechanism. The verdict survives without it:
    the 2011–2015 circle reanalyses plus Jow and Scott and López et al. already
    remove the claimed anomalies."
claimAssessments:
  - claimId: CCC-C001
    verdict: well_supported
    confidence: high
    reasoning: "Independent groups on both sides of the dispute reproduce
      low-variance annular rings, often in concentric sets, when they apply the
      published Gurzadyan–Penrose search to WMAP and Planck maps (Wehus and
      Eriksen; Moss, Scott and Zibin; DeAbreu et al.). The claim as stated is
      about procedure outputs, not about whether those outputs are physical
      relics, and that narrower fact is multiply confirmed. The strongest
      opposing consideration is Bodnia et al. 2024: the same criterion is
      triggered by few-pixel bright or dark spots that inflate the local
      baseline, so reproducing the rings partly means reproducing a method
      artifact rather than an independent sky structure."
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Four independent reanalyses that simulate skies from the observed
      ΛCDM power spectrum find the claimed circle families at chance abundance,
      and DeAbreu et al. obtain that null after freezing the proponents' own
      published search parameters and extending the test to Planck. Bodnia et
      al. further show that screening a handful of freak pixels eliminates
      statistically significant circles at full resolution, which identifies a
      concrete false-positive mechanism under the original criterion. The
      strongest opposing consideration is the unreplicated sky-twist ellipticity
      drop-off and the reported anisotropy of circle centers, which sidestep the
      ensemble dispute and have not been independently run under artifact
      screening.
  - claimId: CCC-C003
    verdict: well_supported
    confidence: high
    reasoning: "Gurzadyan and Penrose themselves state that they simulated a pure
      Gaussian sky plus instrument noise while the critical groups simulated
      maps from the ΛCDM power spectrum, and every independent reanalysis
      describes the same split. As a description of where the significance
      disagreement lives, the claim is documentary rather than interpretive. The
      strongest opposing consideration is that calling this a symmetric choice
      of ensembles understates an asymmetry: a detection claim tested against a
      null that omits the known two-point correlations of the data is a
      misspecified test, and the proponents' defense of the poorer null already
      presupposes that most of the CMB is non-random."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: "The 99.98% figure does not survive a look-elsewhere correction: Jow
      and Scott show that marginalizing over the family of ring sizes actually
      searched drops the excess to 87%, about 1σ. Two further independent
      searches — López et al., with a detector that recovers 95% of synthetic
      CCC spots, and Bodnia et al., with HawkingNet plus pixel screening — find
      no significant population and can rule out Gaussian-profile spots in a
      stated amplitude and size range. The strongest opposing consideration is
      the Planck–WMAP co-location of the five strongest spots, which no critic
      has specifically dismantled, and the honest 87% residue, neither of which
      rehabilitates the claimed confidence."
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: Penrose states in print that strict CCC requires asymptotic mass
