  synthesis: "The case asks whether specific features of the microwave sky are
    messages from an aeon before the Big Bang. The record supports a clean
    three-layer answer: the features are real, the anomaly is not, and the
    attribution therefore fails. First, existence: low-variance rings and
    compact warm spots are in the maps, reproduced verbatim by the theory's
    sharpest critics (CCC-E002, CCC-E003, CCC-E008), so CCC-C001 is established
    — and nearly contentless for the hypothesis, since identical features appear
    at identical abundance in simulated skies containing no previous aeon.
    Second, anomaly: the headline significances (6σ circles; 99.98% Hawking
    points) do not survive a null ensemble containing the measured ΛCDM
    correlations, nor look-elsewhere accounting (CCC-E002–E004, CCC-E008,
    CCC-E010), and the 2024 analysis identifies the actual mechanism by which
    the proponents' criterion manufactures concentric quiet rings around freak
    few-pixel spots (CCC-E012). Third, attribution: CCC-C009 inherits both
    failures and adds its own defect — the predictions were qualitative (some
    rings, some spots, somewhere), so any flagged feature could be claimed post
    hoc. Steelman for the proponents: the framework genuinely predates the
    searches (CCC-E014); the sky-twist ellipticity test has never been
    independently run under artifact screening; the center anisotropy and
    Planck–WMAP spot co-location remain unexplained in detail; current-data
    nulls cannot exclude fainter imprints, as the critics themselves concede;
    and the 2025 preprint begins supplying the quantitative signal model whose
    absence made the dispute interminable. Steelman for the critics: the
    asymmetry is real — DeAbreu et al. froze the proponents' own published
    parameters, a de facto prespecification, and a null under the claimant's own
    criteria outweighs any post-hoc positive; moreover, testing against a null
    that omits the known power spectrum is a methodological error rather than an
    alternative convention — a judgment I flag as leaning on standard
    statistical practice (a prior), not on the ledger alone. The framework
    itself (mass fade-out, entropy reset, erebons) is unresolved, not refuted;
    this verdict contradicts the claimed detections and their attribution only.
    Sensitivity: removing CCC-E012 (Bodnia et al. 2024) would most weaken this
    assessment, but the verdict survives without it on CCC-E002–E004, E008, and
    E010–E011 — it does not hang on one thread."
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: "Every group that applied the published procedure — including the
      three most critical reanalyses — reproduced the low-variance rings in WMAP
      and Planck data (CCC-E002, CCC-E003, CCC-E008), with Wehus & Eriksen
      verifying the proponents' computational procedures verbatim. The claim as
      stated is explicitly procedure-relative, so the 2024 artifact diagnosis
      does not undercut it: reproducing the rings under the procedure is exactly
      what happened. Strongest opposing consideration: Bodnia et al. (CCC-E012)
      show the features are partly manufactured by few-pixel anomalies inflating
      the local variance baseline, so what is reproduced is partly an artifact
      of the method rather than sky structure — but that bears on interpretation
      (CCC-C002, CCC-C010), not on the existence-and-reproducibility claim
      assessed here."
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: "Four independent reanalyses simulating skies with the ΛCDM power
      spectrum (CCC-E002, CCC-E003, CCC-E004, CCC-E008) each found the observed
      circle abundance fully consistent with the standard sky; the 6σ lives
      entirely in the pure-Gaussian-plus-noise null, as the proponents' own
      response note confirms (CCC-E005). Bodnia et al. then supplied the
      generating mechanism for false positives under the proponents' criterion
      (CCC-E012), and DeAbreu et al. obtained the null using the proponents' own
      published parameters. No independent group has reproduced the claimed
      significance. Strongest opposing consideration: the proponents' sky-twist
      ellipticity result (CCC-E006) has never been independently replicated
      under artifact screening, leaving one structural discriminator untested —
      but it is a different, post-hoc statistic and does not rehabilitate the
      specific 6σ anomaly claimed here."
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: "Both camps state the ensemble difference in their own words — the
      proponents' response note says it verbatim (CCC-E005) — and every critical
      paper confirms it. That the features are typical under the ΛCDM ensemble
      is found by four independent groups, and the proponents' 2011 note
      effectively concedes circles arise at similar frequency under a
      WMAP-derived spectrum. The claim assessed here is descriptive — what each
      side did and what follows under each null — and that is a matter of public
      record. Strongest opposing consideration: which null is *correct* remains
      genuinely contested, since the proponents argue the ΛCDM-spectrum ensemble
      smuggles the disputed structure into the definition of chance; but that is
      the attribution dispute (CCC-C009 vs CCC-C010), not a challenge to this
      claim's factual content."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: "The 99.98% figure was quoted for the ring size that worked best
      after inspection; marginalizing over the searched sizes leaves 87%,
