  synthesis: "The case splits cleanly into two questions: do the claimed features
    exist as data-level structures, and do they carry the attributed meaning? On
    the first, the record is unusually clean: every independent group that ran
    the proponents' own procedure reproduced the low-variance rings (CCC-E002,
    CCC-E008), so CCC-C001 is established. On the second, the evidential program
    has been systematically dismantled, and the dissolution mechanism is the
    same every time: a free analysis choice fixed after seeing the data, which
    an independent reanalysis then varied. The 6σ circle claim rests on a
    pure-Gaussian null that three independent groups (Wehus & Eriksen,
    Moss/Scott/Zibin, Hajian) showed delivers chance-level abundance once the
    full ΛCDM sky and realistic anisotropic noise are simulated, and DeAbreu et
    al. extended that null verdict to Planck using the proponents' own frozen
    parameters (CCC-C003, CCC-E008). The 99.98% Hawking-point claim falls to 87%
    — barely 1σ — under a textbook marginalization over the ring size the
    proponents selected post hoc (CCC-E010), and two further independent
    searches, one validated at 95% retrieval on synthetic CCC signals, find no
    significant population (CCC-E011), while Bodnia et al. identify the actual
    false-positive generator: few-pixel spots manufacturing concentric circles
    under the proponents' criterion (CCC-E012). Steelmanning the other
    direction: CCC is not a just-so story — the framework predates the searches
    by four years (CCC-E014) — and it makes a laboratory-adjacent forward
    prediction (erebons, CCC-E018) plus a structural argument, the sky-twist
    ellipticity test, that no critic has ever run. But the theory's mechanism
    rung is honestly unsettled even by its friends: mass fade-out is admittedly
    conventional-free (CCC-E015), the sympathetic expert inventory treats it and
    the perturbation spectrum as open (CCC-E016), and the entropy accounting
    that motivates the whole crossover is under published attack (CCC-E017). The
    study table's unanimous finding — every search on both sides invented its
    own signal model, and the single CCC-derived fragment is a 2025 unrefereed
    preprint no search has used (CCC-E023) — explains why fourteen years of
    exchange produced stalemate rather than convergence, and it makes the
    verdict reversible in principle: a preregistered search bound to derived
    predictions (CCC-R001/R005) could revive or close the case finally. As the
    record stands, the featured hypothesis's claimed observational support is
    contradicted, not merely unresolved; the theory itself remains untested
    rather than disproven, but \"untested\" is not the verdict its proponents
    claimed."
  steelman: "The sky-twist result plus the cross-instrument co-location stand
    entirely unrebutted: Gurzadyan & Penrose 2013 showed, without simulations,
    that concentric-set prevalence collapses under even slight ellipticity —
    exactly what a real geometric imprint would do and a generic procedural
    artifact should not — and An et al. 2020 found the five strongest
    Hawking-point candidates at precisely the same sky positions in WMAP and
    Planck despite very different noise properties, while roughly 83% of 1134
    ring-triple centers cluster inside three regions covering ~3% of the
    searched sky. No independent reanalysis (DeAbreu, Jow & Scott, López,
    Bodnia) ran the ellipticity test or offered a ΛCDM explanation for the
    center anisotropy or the co-location; if those structures are sky-real
    rather than noise-real, the current critical consensus has not explained
    them."
