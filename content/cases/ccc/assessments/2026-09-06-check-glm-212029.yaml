  synthesis: "The case splits into three layers with different epistemic states.
    The observational-statistics layer is decisively negative: the ring and spot
    features are real, reproducible outputs of the published search procedures
    (CCC-C001, established), but every headline significance has been dissolved
    by independent reanalyses — three converging 2011 nulls on the 6σ circles,
    DeAbreu et al. 2015 extending the null to Planck with the proponents' own
    frozen parameters, Jow & Scott's marginalization cutting 99.98% to 87%
    (~1σ), and López et al.'s validated detector (95% retrieval on synthetic CCC
    signals) plus Bodnia et al.'s maximum-resolution search finding nothing
    significant on either signature. The recurring mechanism is documented on
    both sides (CCC-C003, CCC-C011): the signal model was always the searchers'
    choice, never derived from CCC, so each proponent significance met a
    critique that varied one free choice. The attribution layer (CCC-C009)
    therefore fails on its premise, though two structural observations — the
    extreme anisotropy of circle centers and Planck–WMAP co-location of top
    spots — remain unaccounted, keeping CCC-C010 at mixed rather than letting
    the conventional account claim completeness. The theory layer carries real
    but unresolved costs: mass fade-out is required and mechanism-free
    (CCC-C005, on the author's own admission), the entropy accounting is
    directly attacked (CCC-C006), and erebons are a genuine forward prediction
    that is qualitative and untested (CCC-C007, CCC-C008). What survives for the
    featured hypothesis is framework priority (2006), thin unreplicated
    structure, and open predictions — weak support, not none, and not yet
    contradicted as a framework. Sensitivity: the record whose removal would
    most change this case is CCC-E012 (Bodnia et al. 2024), which uniquely
    supplies a generative mechanism for false circles and double-signature nulls
    at full resolution; without it the verdict weakly_supported survives,
    because the 2011 triple null plus DeAbreu still dissolve the circles and Jow
    & Scott plus López still dissolve the Hawking-point significance, but the
    artifact diagnosis, the strength behind CCC-C010, and part of the case
    against CCC-C009 would be lost."
  steelman: An et al. 2020 report that the five strongest Hawking-point regions
    occupy precisely the same locations in Planck and WMAP maps with very
    different noise properties — and Jow & Scott's marginalization explicitly
    does not address this, López et al. and Bodnia et al. do not adjudicate it
