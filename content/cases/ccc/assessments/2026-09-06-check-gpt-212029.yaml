  synthesis: >-
    The supplied record distinguishes a reproducible map feature from a
    statistically anomalous or causally identified signal. Independent groups
    reproduce directions selected by the published low-variance-ring procedure,
    so CCC-C001 is locally established. That does not establish CCC-C002:
    several reanalyses using structured ΛCDM skies, including realistic WMAP
    noise and the proponents' published search parameters, find comparable rings
    at ordinary abundance. The most recent analysis adds a concrete
    false-positive mechanism, showing that a few unusual pixels can manufacture
    multiple near-concentric low-variance rings under the earlier criterion.
    Likewise, the reported 99.98% Hawking-point result does not survive
    marginalization over spot size, falling to 87% confidence, while two later
    searches find no significant population. Thus the two advertised empirical
    pillars are not merely unreplicated headline numbers; their significance is
    directly contradicted by analyses that vary or correct the choices on which
    those numbers depended.

    The strongest pro-CCC reading is not empty. The general framework predates
    the searches, the ring outputs occur in both WMAP and Planck analyses, the
    leading hot regions were co-located across instruments, and the proponents'
    sky-twist test reports a marked preference for circular over slightly
    elliptical rings. Those points reduce the plausibility of a simple
    instrument-noise dismissal. They do not, however, discriminate a
    previous-aeon origin from structure in the shared celestial sky, ordinary
    fluctuations, foreground or pixel effects, or a statistic selected after
    inspection. WMAP and Planck are different instruments but observe the same
    sky, while most positive papers come from overlapping proponent
    collaborations. Conversely, the critical studies reuse that same sky too:
    their independence is primarily methodological, not replication on an
    independent universe.

    The attribution in CCC-C009 consequently fails even more strongly than the
    bare existence claim. Neither signature has a surviving anomaly that needs
    the proposed black-hole explanation, and no derived abundance, profile, or
    sky distribution was fixed before searching. CCC-C010 is supported for the
    principal headline detections but overstates matters by saying that every
    auxiliary feature is fully accounted for; the sky-twist and anisotropic
    center reports remain specifically untested rather than positively
    explained.

    On theory, CCC-C007 and CCC-C008 are established only as accurate
    descriptions of the proposal. The records provide no evidence that erebons
    exist or that their decays quantitatively reproduce the observed
    perturbation spectrum. Mass fade-out remains an acknowledged requirement
    without a supplied accepted mechanism, and the claimed entropy reset faces a
    direct quantum-information objection. General scientific priors against
    adding an unobserved Planck-mass particle and an unspecified disappearance
    of rest mass reinforce caution, but the case verdict does not principally
    depend on those priors. It rests on the failure of the claimed empirical
    signatures and their attribution. “Contradicted” therefore applies to the
    featured package as stated, not to the bare mathematical possibility of
    cyclic conformal aeons, which this record does not directly disprove.

    The single record whose removal would most change the verdict is CCC-E012,
    because it addresses both signatures and supplies a mechanism for false
    circle detections rather than only another null result. The verdict survives
    without it: CCC-E002 through CCC-E004 and CCC-E008 independently undermine
    the circle significance, while CCC-E010 and CCC-E011 undermine the
    Hawking-point significance. Removal would make the negative case less
    mechanistically complete, but would not restore either advertised detection.
  steelman: The strongest unanswered pro-CCC observation is the reported sky-twist
    result that even slight ellipticity dramatically suppresses the concentric
    ring sets while circular rings persist. No supplied independent analysis
    repeats that specific test with fixed masks, artifact screening, and
    preregistered statistics, so this purported shape selectivity remains
    unrebutted by the record.
claimAssessments:
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: Wehus and Eriksen reproduce the claimed WMAP ring structures, and
      DeAbreu and colleagues reproduce the procedure in WMAP and Planck,
      establishing that the maps contain directions selected in this way.
      Multiple other analyses likewise confirm variance variations before
      disputing their significance. The strongest opposing consideration is
      CCC-E012's finding that a few unusual pixels can generate such outputs,
      but that concerns their origin and significance rather than the local
      reproducibility claim.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Independent analyses using ΛCDM-spectrum skies, realistic anisotropic
      noise, and the proponents' published parameters find the rings typical
      rather than anomalous. CCC-E012 further identifies a few-pixel mechanism
      that can generate near-concentric sets and reports no significant rings
      after those spots are removed. The strongest opposing consideration is the
      reported sky-twist circularity result and the proponent-adjacent 99.7%
      ring analysis, but neither was obtained under a preregistered signal model
      or independently validated against artifact-screened data.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: The proponents' own response explicitly contrasts their
      pure-Gaussian- plus-noise simulations with critics' skies based on the
      ΛCDM CMB power spectrum. The independent reanalyses consistently report
      that the observed structures are typical under the latter ensemble,
      locating the dispute in the null rather than failure to reproduce the map
      outputs. The strongest opposing consideration is the proponents'
      substantive claim that a ΛCDM-spectrum ensemble is the wrong conception of
      chance, but that dispute does not undermine this claim's description of
      the methodological disagreement.
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: Jow and Scott show that marginalizing over the searched ring size
      reduces the claimed 99.98% result to 87%, or little more than 1σ. López
      and colleagues validate their detector on synthetic CCC-style points but
      find no significant structures in Planck, while Bodnia and colleagues
      likewise report a null within their tested profile and amplitude range.
      The strongest opposing consideration is the original size cutoff and
      Planck-WMAP co-location of leading hot regions, but co-location can follow
      from both instruments observing the same sky and does not restore the
      corrected significance.
  - claimId: CCC-C005
    verdict: established
    confidence: moderate
    reasoning: Penrose directly states that strict CCC requires asymptotic mass
      fade-out and calls it an admittedly unconventional hypothesis. Tod's
      sympathetic open-problems inventory still asks whether mass fade-out can
      be implemented, supporting the record's statement that no accepted
      particle mechanism is supplied. The strongest opposing consideration is
      the 2025 crossover conservation-law work and Penrose's de Sitter-group
      motivation, but neither record provides the required fade-out mechanism;
      confidence is moderated because “no accepted mechanism” is a broad
      literature-absence claim.
  - claimId: CCC-C006
    verdict: contradicted
    confidence: moderate
    reasoning: Eckstein's published analysis directly argues that the assumed loss
      of black-hole degrees of freedom increases global quantum entropy and
      undermines the proposed entropy renormalization. The supplied positive
      basis is principally Penrose's own theoretical account rather than an
      independent demonstration that the reset is compatible with quantum
      entropy. The strongest opposing consideration is that black-hole
      information loss remains a live foundational controversy and a unitary CCC
      variant may preserve part of the framework, so the contradiction is less
      secure than the observational nulls.
  - claimId: CCC-C007
    verdict: established
    confidence: high
    reasoning: Penrose's 2018 paper explicitly proposes gravitational-only,
      approximately Planck-mass erebons, gives a possible lifetime of roughly
      10^11 years, and discusses impulsive detection in gravitational-wave
      instruments. This establishes the claim as a description of what CCC
      predicts, not as evidence that erebons constitute dark matter. The
      strongest opposing consideration is that the mass, lifetime, waveform, and
      event rate remain qualitative and no erebon-specific search is reported,
      which weakens the physical prediction but not the descriptive claim.
  - claimId: CCC-C008
    verdict: established
    confidence: high
    reasoning: The primary theory source states unambiguously that there is no
      inflation in CCC and assigns the origin of CMB fluctuations to erebon
      decay during the previous aeon's expansion. The claim is therefore
      accurate as a theory description. The strongest opposing consideration is
      Tod's observation that deriving the familiar perturbation spectrum remains
      an open problem, so the record establishes an attribution within CCC
      rather than a successful quantitative replacement for inflation.
  - claimId: CCC-C009
    verdict: contradicted
    confidence: moderate
    reasoning: The attribution depends on anomalous circles and Hawking points, yet
      the headline significance of both disappears under independent null
      ensembles, look-elsewhere correction, or artifact screening. No record
      supplies a causal discriminator connecting the surviving map features to
      previous-aeon black-hole encounters or evaporation, and the signal model
      was not quantitatively derived in advance. The strongest opposing
      consideration is the theory's priority, the sky-twist shape result, and
      cross-instrument co-location, but those facts do not identify a
      previous-aeon source.
  - claimId: CCC-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The supplied reanalyses give strong conventional or methodological
      accounts of the principal circle and Hawking-point claims: structured ΛCDM
      skies reproduce the circles, spot-size marginalization removes the Hawking
      significance, and few-pixel features can manufacture the earlier circle
      output. Planck's broader quantitative fit also makes ΛCDM a substantive
      null rather than an arbitrary placeholder. The strongest opposing
      consideration is the word “every”: the sky-twist circularity, anisotropic
      center distribution, and cross-map co-location have not all received
      direct, artifact-screened explanations, so full accounting is not
      established."
  - claimId: CCC-C011
    verdict: established
    confidence: moderate
    reasoning: The frozen-criteria study finds no search whose signal model, null
      model, and statistics were preregistered or fixed before inspection of the
      public data, on either side of the dispute. The recurring shifts in ring
      radius, ellipticity treatment, spot size, masks, and simulations support
      the claim that reported significances depend on analyst choices made
      within an already examined dataset. The strongest opposing consideration
      is that DeAbreu and colleagues reused the proponents' published
      parameters, functioning as partial prespecification, and absence across an
      entire literature is difficult to prove from a secondary workpaper;
      neither point supplies a genuinely blind or preregistered exception.
