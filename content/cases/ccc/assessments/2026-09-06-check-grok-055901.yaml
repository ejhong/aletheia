  synthesis: "The featured hypothesis bundles a cyclic conformal cosmology with a
    specific observational program: that WMAP/Planck contain statistically
    anomalous concentric low-variance circles and compact raised-temperature
    Hawking points imprinted by black-hole activity in a prior aeon. The record
    cleanly separates three layers. First, the procedural features exist:
    independent groups applying the published search methods recover
    low-variance annuli and candidate spots (CCC-C001 established). Second, the
    anomaly claims do not survive proper nulls. Every independent reanalysis
    that draws simulations from the full ΛCDM angular power spectrum (Wehus &
    Eriksen 2011, Moss/Scott/Zibin 2011, Hajian 2011, DeAbreu et al. 2015) finds
    the circle families typical of a structured Gaussian sky; the original
    up-to-6σ figures were computed against an inadequate pure
    Gaussian-plus-noise ensemble, a discrepancy both sides document (CCC-C003).
    Bodnia et al. 2024 further identify a concrete false-positive generator
    under the proponents' own criteria: few-pixel temperature outliers
    manufacture concentric low-variance sets, and after their removal no
    significant circles remain. For Hawking points, An et al. 2020's 99.98%
    falls to ~1σ (87%) once ring size is marginalized (Jow & Scott 2020); a
    purpose-built detector validated at 95% retrieval on synthetic CCC signals
    finds no significant population (López et al. 2022); Bodnia's HawkingNet
    likewise yields a null and rules out a stated amplitude/size box. Third, the
    attribution claim (CCC-C009) therefore fails: without anomalous signatures
    there is nothing left to attribute to prior-aeon encounters. Parallel
    theoretical costs remain unpaid: mass fade-out is required and admitted
    unconventional, with no accepted particle-physics mechanism (CCC-C005; Tod
    2022 lists it open); entropy accounting is contested by Eckstein 2023, who
    argues information loss raises rather than resets global entropy (CCC-C006
    mixed). Erebon dark matter and the no-inflation fluctuation story are
    correctly recorded as theory content (CCC-C007, CCC-C008) but supply no
    tested quantitative spectrum. Standard inflationary ΛCDM plus documented
    a-posteriori choices (look-elsewhere on ring size, inadequate nulls,
    post-inspection statistics) accounts for the reported signatures (CCC-C010
    well_supported); CCC-C011 is established—no search on either side was
    preregistered. Shared-source caveats: proponent papers are repeatedly
    co-authored by the same small set; critical reanalyses are independent of
    one another in method and institution yet converge. Priors on ΛCDM's
    precision fit (Planck 2018) calibrate why full-spectrum nulls are the right
    standard, but the verdict is carried by the reanalyses themselves, not by
    prestige. Removing the entire critical-reanalysis cluster would reopen the
    case; no single positive detection survives that cluster. The hypothesis
    that the reported CMB features are prior-aeon imprints is contradicted by
    the supplied record."
  steelman: The 2013 sky-twist result—concentric-set prevalence collapsing under
    mild ellipticity, with a sharp radius cutoff near 15–20°—and the reported
    extreme anisotropy of ring-triple centers (~83% of 1134 centers inside three
    regions covering ~3% of searched sky) have never been independently re-run
    under few-pixel artifact screening and a frozen mask; a proponent can still
    say the critics dissolved simulation-based significances without answering
    the structural, simulation-free tests the program treats as its strongest
    internal evidence.
claimAssessments:
  - claimId: CCC-C001
