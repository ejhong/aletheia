    reasoning: Multiple independent groups using full ΛCDM-spectrum simulations find
      the observed circle families typical of a Gaussian structured sky (Wehus &
      Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu); Bodnia et al. 2024 show
      few-pixel outliers manufacture concentric low-variance sets under the
      published criteria, with significance vanishing after removal. The
      strongest opposing consideration is the proponents' sky-twist and
      anisotropy arguments, which sidestep simulation ensembles but remain
      unreplicated independently and a-posteriori.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: Gurzadyan & Penrose's own response note states both critical groups
      simulated LCDM power-spectrum maps while they used pure Gaussian plus WMAP
