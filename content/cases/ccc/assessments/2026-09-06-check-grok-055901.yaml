      is Planck–WMAP co-location of the top spots, which rules out pure
      instrument noise but not shared-sky ΛCDM fluctuations or common artifacts,
      and does not restore the marginalized significance.
  - claimId: CCC-C005
    verdict: established
    confidence: high
    reasoning: Penrose 2018 states verbatim that strict CCC requirements demand
      asymptotic mass fade-out, calling it an admittedly unconventional
      hypothesis; Tod 2022 lists implementing mass fade-out as an open question;
      the 2025 Meissner– Penrose preprint advances crossover conservation but
      still does not supply a particle-physics fade-out mechanism. The strongest
      opposing consideration is Penrose's de Sitter-group remark that mass is
      not a Casimir operator for Λ>0, which motivates plausibility without
      constituting an accepted mechanism.
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: Penrose's book and Foundations of Physics treatments present
      information loss plus conformal rescaling as a legitimate
      gravitational-entropy reset; Eckstein 2023 publishes a direct
      counterargument that the assumed loss is incompatible with quantum entropy
      and increases global entropy, undermining the renormalization needed at
      crossover, while proposing a unitary variant. The strongest opposing
      consideration is that information-loss debates in quantum gravity remain
      unsettled and Eckstein is one analysis; the claim of demonstrated
      self-consistency is therefore neither established nor flatly retired.
  - claimId: CCC-C007
    verdict: established
    confidence: high
    reasoning: Penrose 2018 §5 introduces erebons as Planck-mass, gravitation-only
      particles created at crossover, with lifetimes of order 10^11 years whose
      decays might appear in gravitational-wave detectors; the 2017 note extends
      the conjecture to LIGO correlated noise. The strongest opposing
      consideration is parameter vagueness (order-of-magnitude mass and
      lifetime, no computed spectrum or rate) and the deflation of the
      underlying LIGO-noise premise, but the claim only asserts that CCC
      contains this prediction, which the primary texts confirm.
  - claimId: CCC-C008
    verdict: established
    confidence: high
    reasoning: Penrose 2018 states flatly there is no inflation in CCC and
      attributes near scale-invariance to erebon decay during the previous
      aeon's expansion. The strongest opposing consideration is Tod 2022's open
      question whether one can actually derive the familiar perturbation
      spectrum from that mechanism—an unpaid theoretical debt that does not
