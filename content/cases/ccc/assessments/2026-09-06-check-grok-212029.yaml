  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: Wehus & Eriksen 2011, Moss/Scott/Zibin 2011, and DeAbreu et al. 2015
      all explicitly reproduce the low-variance annular features and special
      directions in WMAP and/or Planck using the published procedures. The
      strongest opposing consideration is that reproducibility of a pipeline
      output is not evidence of cosmological anomaly, but the claim as stated
      only asserts presence and reproducibility, which the record confirms.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: Independent reanalyses that simulate full ΛCDM skies (Wehus &
      Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu) find the features typical;
      Bodnia et al. 2024 show few-pixel spots manufacture concentric
      low-variance families under the GP criteria, after which significance
      disappears. The strongest opposing consideration is the proponents’
      insistence that ΛCDM-spectrum nulls are the wrong standard and that
      concentric families plus sky-twist ellipticity remain unexplained as pure
      chance, but those arguments do not restore a 6σ excess against the
      appropriate ensemble.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: Gurzadyan & Penrose’s own response note (arXiv:1012.1486) states that
      both critical groups simulated LCDM power-spectrum maps while they used
      pure Gaussian plus WMAP noise; the reanalyses’ abstracts match that
      description. The strongest opposing consideration is whether the
      pure-Gaussian null could still be defended on theoretical grounds if most
      CMB structure is non-random under CCC, but the factual tracing of the
      disagreement to ensemble construction is undisputed.
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: Jow & Scott 2020 show that marginalizing over the ring-size parameter
      the 2020 analysis fixed post hoc drops the excess from 99.98% to 87%
      (~1σ); López et al. 2022’s validated ring detector and Bodnia et al.
      2024’s HawkingNet find no significant population. The strongest opposing
      consideration is Planck–WMAP co-location of the strongest spots and a
      residual ~1σ excess, neither of which rehabilitates the stated 99.98%
      confidence claim.
  - claimId: CCC-C005
    verdict: established
    confidence: high
    reasoning: Penrose 2018 states verbatim that strict CCC requires asymptotic mass
      fade-out and calls it “an admittedly unconventional hypothesis”; Tod 2022
      lists implementing mass fade-out as an open question. The strongest
      opposing consideration is Penrose’s de Sitter-group remark that mass is
      not a Casimir operator when Λ > 0, which softens implausibility but does
      not supply an accepted particle-physics mechanism.
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: Penrose’s book and Foundations of Physics papers present information
      loss plus conformal rescaling as a legitimate gravitational-entropy reset;
      Eckstein 2023 argues the same loss increases global quantum entropy and
      undermines the renormalization needed at crossover, proposing a unitary
      variant instead. The strongest opposing consideration is that
      information-loss debates remain live in quantum gravity and Eckstein’s is
      one engaged analysis rather than a community verdict, so self-consistency
      is neither established nor flatly refuted.
  - claimId: CCC-C007
    verdict: established
    confidence: high
    reasoning: Penrose 2018 §5 states the erebon proposal in detail — Planck-mass,
      gravity-only, lifetime ~10^11 yr, possible impulsive GW signatures — as
      CCC’s dark-matter content. The strongest opposing consideration is the
      order-of-magnitude vagueness and absence of a computed spectrum or rate,
      but the claim is a theory-description claim and accurately tracks the
      source.
  - claimId: CCC-C008
    verdict: established
    confidence: high
    reasoning: Penrose 2018 states “there is no inflation in CCC” and attributes
      near scale-invariance to erebon decay in the previous aeon’s exponential
      expansion. The strongest opposing consideration is Tod’s open question
      whether one can actually derive the familiar perturbation spectrum that
      way, but again the claim correctly describes the theory’s stated stance.
  - claimId: CCC-C009
    verdict: contradicted
    confidence: high
    reasoning: The attribution requires anomalous circles and Hawking points
      (depends on CCC-C002 and CCC-C004); both anomaly claims fail under
      independent ΛCDM nulls, look-elsewhere correction,
      synthetic-signal-validated searches, and artifact diagnosis. The strongest
      opposing consideration is framework priority (CCC stated 2006, before the
      searches) plus unreplicated structural tests (sky-twist, center
      anisotropy), which support good-faith prediction but do not make the
      reported CMB features previous-aeon imprints.
  - claimId: CCC-C010
    verdict: well_supported
    confidence: moderate
    reasoning: Convergent reanalyses show the claimed excesses are expected in
      structured ΛCDM skies or dissolve under marginalization and few-pixel
      screening; Planck 2018 inflation constraints supply the positive scorecard
      the nulls assume. The strongest opposing consideration is that critics did
      not fully re-run sky-twist/ellipticity or explain center anisotropy under
      artifact cuts, and Bodnia notes a null does not disprove CCC, so “fully
      accounts for every signature” is slightly stronger than the residual open
      structural items warrant.
  - claimId: CCC-C011
    verdict: established
    confidence: high
    reasoning: Study CCC-S001’s twelve-row table finds unanimous searcher-supplied
      signal models on both sides; Hajian 2011 and Bodnia et al. 2024 state the
      quantitative-prediction gap explicitly; no paper in the record reports a
      preregistered or blind protocol. The strongest opposing consideration is
      that freezing proponents’ published parameters (DeAbreu) is a partial
      corrective, but that still post-dates data inspection and does not equal
      preregistration of statistic, ensemble, mask, and look-elsewhere together.
