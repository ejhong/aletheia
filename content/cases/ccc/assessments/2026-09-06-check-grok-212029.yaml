  synthesis: >-
    The featured hypothesis packages a conformal cyclic cosmology (CCC) with two
    headline CMB signatures — concentric low-variance circles from prior-aeon
    black-hole encounters and compact raised-temperature Hawking points from
    final evaporations — claimed at up to 6σ and 99.98% confidence, plus erebon
    dark matter and mass fade-out. The evidence record cleanly separates what is
    reproducible from what is anomalous and from what can be attributed to a
    previous aeon.

    Independent groups repeatedly confirm that the search procedures return
    low-variance annuli and candidate spots in WMAP and Planck (CCC-C001). That
    local observational claim is established. The anomaly claim (CCC-C002) is
    not. Gurzadyan & Penrose computed significance against
    pure-Gaussian-plus-noise skies; every independent reanalysis that drew nulls
    from the full ΛCDM angular power spectrum (Wehus & Eriksen 2011,
    Moss/Scott/Zibin 2011, Hajian 2011, DeAbreu et al. 2015) found the same
    features at typical abundance. The proponents themselves locate the dispute
    in exactly that null-ensemble choice (CCC-C003; arXiv:1012.1486). Bodnia et
    al. 2024 go further: few-pixel temperature extremes manufacture families of
    low-variance circles under the published criteria; after removal,
    significance vanishes. For Hawking points, An et al. 2020’s 99.98% falls to
    ~1σ (87%) once ring size is marginalized (Jow & Scott 2020); a purpose-built
    detector validated at 95% retrieval on synthetic CCC signals finds no
    significant population (López et al. 2022); Bodnia’s HawkingNet likewise
    returns a null and rules out a stated amplitude–size box. Thus CCC-C004’s
    confidence claim is contradicted, and the interpretive attribution that
    these features are previous-aeon imprints (CCC-C009) collapses with its
    statistical premises.

    On the theory side, Penrose states that strict CCC requires asymptotic mass
    fade-out and calls it “admittedly unconventional” (CCC-C005 — established as
    a cost of the framework). Entropy accounting is contested: Penrose treats
    information loss plus conformal rescaling as a legitimate
    Second-Law-compatible reset (CCC-C006), while Eckstein 2023 argues that the
    same loss increases global entropy and undermines the renormalization; Tod
    2022 lists mass fade-out and the perturbation spectrum as open. Erebons and
    the no-inflation stance (CCC-C007, CCC-C008) are accurately recorded as
    theory commitments, not as confirmed physics; the LIGO-noise conjecture
    remains speculative and unfollowed. Standard inflationary ΛCDM, with
    documented a-posteriori freedoms (look-elsewhere on ring size,
    post-inspection statistics, unscreened few-pixel artifacts), accounts for
    the reported significances (CCC-C010 well supported). Critically, no search
    on either side used a preregistered or blind protocol (CCC-C011 established;
    study CCC-S001).

    Steelmanning the affirmative: the sky-twist ellipticity collapse, the
    extreme anisotropy of circle centers, Planck–WMAP co-location of top spots,
    and the fact that CCC as a framework predates the 2010 searches are real
    features of the record that simple “CMB has structure” slogans do not
    automatically dissolve, and critics did not always re-run the proponents’
    strongest structural tests under artifact screens. Steelmanning the
    negative: multiple independent teams, different statistics, frozen proponent
    parameters, synthetic-signal validation, and an explicit false-positive
    mechanism converge on the same verdict — the headline σ values live in
    analysis choices, not in an excess over ΛCDM. The case verdict is therefore
    contradicted for the hypothesis as stated: the load-bearing observational
    claims fail under proper nulls and look-elsewhere corrections, the
    attribution cannot stand, and the remaining theoretical scaffolding carries
    acknowledged unconventional costs and open problems. A single preregistered
    joint protocol could still reopen the empirical chapter; until then the
    positive claims do not hold.
  steelman: The sky-twist test (Gurzadyan & Penrose 2013) showing concentric-set
    prevalence collapsing under mild ellipticity, together with the extreme
    anisotropy of ring centers (~83% of 1134 centers inside three regions
    covering ~3% of searched sky), has never been independently replicated under
    few-pixel artifact screening and proper masks; those structural regularities
    remain the strongest unrebutted empirical pointers a proponent can cite.
