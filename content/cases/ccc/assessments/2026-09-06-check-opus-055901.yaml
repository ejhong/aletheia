  - claimId: CCC-C009
    verdict: contradicted
    confidence: moderate
    reasoning: "This attribution depends entirely on CCC-C002 and CCC-C004, both of
      which fail: the circles are reproduced at chance abundance under proper
      ΛCDM nulls and partly traced to few-pixel artifacts, and the Hawking-point
