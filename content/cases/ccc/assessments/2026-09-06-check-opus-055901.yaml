  synthesis: "The featured hypothesis as advertised has two separable parts: a
    conformal-cyclic framework, and the claim that specific CMB features are its
    fingerprints at quoted significances. The record settles the second part
    against the proponents and leaves the first part under-determined rather
    than refuted. On the observational side the evidence is unusually clean
    because the two sides agree on the data. Wehus & Eriksen, Moss/Scott/Zibin,
    Hajian and DeAbreu et al. all reproduce the low-variance annuli (CCC-C001 is
    solid), and all four find them at chance abundance once the null ensemble
    carries the full ΛCDM angular power spectrum. Gurzadyan and Penrose concede
    the ensemble difference in their own response (CCC-C003), and their position
    — that ΛCDM-spectrum skies are the wrong notion of \"chance\" — is not a
    technical dispute that data can adjudicate but a choice that assumes the
    conclusion: if the true sky's correlated structure is deemed non-random, any
    structured feature will look anomalous against white-noise-plus-Gaussian
    simulations. That is why the 6σ figure carries almost no weight. The
    Hawking-point claim fails for an independent and even more elementary
    reason: Jow & Scott show the 99.98% is a best-of-search number that falls to
    ~87% under marginalization over the ring size the proponents fixed. Two
    further searches strengthen this beyond mere non-confirmation: López et al.
    built a detector validated to retrieve 95% of injected CCC-style Hawking
    points and found no significant population, and Bodnia et al. identified a
    positive generating mechanism for false concentric families — a few
    anomalously bright or dark pixels inflating local baseline variance under
    the proponents' own criterion — with nulls surviving after artifact removal.
    So CCC-C009's two dependencies (CCC-C002, CCC-C004) both fail, and the
    attribution falls with them. On the mechanism side, Penrose himself calls
    mass fade-out unconventional and unsupplied, Tod lists it and the
    perturbation spectrum as open, and Eckstein attacks the entropy reset that
    motivated the scheme. The erebon prediction is honest but parameter-free at
    the order-of-magnitude level and has never been searched. The steelman for
    ΛCDM is strong but not total: residues (87%, a 1%-level candidate excess,
    the untested sky-twist statistic, the reported 83%/3% clustering of ring
    centers) remain, which is why CCC-C010's universal quantifier is not fully
    earned. The structural diagnosis in CCC-C011 — no preregistered protocol
    anywhere on either side — is the case's most durable finding and explains
    the fourteen-year loop."
  steelman: "Nobody has independently run the sky-twist test: Gurzadyan & Penrose
    report that concentric-set prevalence collapses under slight ellipticity of
    the search annuli, a self-referential comparison of the sky against
    distorted copies of itself that needs no simulated null and is therefore
    immune to the ensemble dispute that sinks their other numbers. Paired with
    the unexplained reported clustering of ~83% of 1134 ring centers into ~3% of
    the searched sky and the co-location of the five strongest Hawking-point
    candidates in Planck and WMAP, this is a concrete anisotropy signature that
    no critique in this record has reproduced, rebutted, or shown to arise from
    few-pixel artifacts."
