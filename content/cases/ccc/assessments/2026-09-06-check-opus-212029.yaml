  synthesis: "The case has an unusually clean structure: everyone agrees on the
    data, and the entire dispute sits in the analysis layer. Three independent
    groups (Wehus & Eriksen, Moss/Scott/Zibin, Hajian) plus a fourth using the
    proponents' own frozen parameters on newer Planck data (DeAbreu et al.)
    reproduce the low-variance ring features exactly — so CCC-C001 is as solid
    as an observation record in this file can be — and all four find them at
    chance abundance once the null ensemble carries the ΛCDM angular power
    spectrum. The proponents concede the ensemble difference in their own words
    (CCC-E005), which makes CCC-C003 a documented fact rather than an editorial
    reading, and which converts CCC-C002 into a question about which null is
    correct. Here the record is lopsided: a null sky that omits the measured CMB
    power spectrum is not a null for a statistic computed on annuli of the real
    sky, and Hajian's anisotropic-noise modelling closes the one technical
    escape the proponents' response identified. The Hawking-point line repeats
    the pattern at higher resolution: a single free parameter (ring size) fixed
    at its best value produced 99.98%, and marginalizing it yields 87% — about
    1σ (CCC-E010). Two further independent efforts then push past mere
    non-replication: López et al. built a detector demonstrably 95% sensitive to
    synthetic CCC-style Hawking points and found no significant population, and
    Bodnia et al. identified a concrete false-positive generator (few-pixel
    bright/dark spots inflating local annular variance under the published
    criterion) and reported nulls after screening. That is a mechanism for the
    signal, not merely an absence of it — the strongest form a negative result
    can take. Against this, the theoretical rungs are independently strained:
    mass fade-out is unimplemented by the author's own admission (CCC-C005), the
    entropy reset — CCC's original motivation — is under a direct published
    attack (Eckstein 2023) with no recorded rebuttal, and the erebon prediction
    remains an order-of-magnitude conjecture never turned into a search. I
    therefore judge the attribution claim CCC-C009 contradicted on the present
    record. Two disciplining caveats: this is a verdict against the claimed
    detections, not a refutation of CCC as a cosmology, which remains largely
    untested; and CCC-C010's universal phrasing (\"fully accounts for every
    reported signature\") overreaches, since the sky-twist ellipticity result,
    the 83%-in-3% clustering of ring centres, and the Planck/WMAP co-location of
    the top spots have not been independently addressed. CCC-C011 — no
    preregistered protocol anywhere, on either side — is the honest frame for
    all of it. Sensitivity: the record whose removal would matter most is
    CCC-E012 (Bodnia et al. 2024), which supplies the artifact mechanism. The
    verdict survives without it: Jow & Scott's marginalization, López's
    validated-sensitivity null, and the four converging circle reanalyses
    independently dissolve both headline significances."
  steelman: No critic has reproduced the sky-twist test or explained why
