      only locus of disagreement: Jow & Scott's look-elsewhere correction and
      Bodnia et al.'s pixel-artifact diagnosis are distinct failure modes not
      reducible to the choice of null, so \"traces to\" is accurate for the
      2010–2011 circle exchange but incomplete for the later Hawking-point
      dispute."
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: "The 99.98% figure was computed with the ring size fixed at its
      best-fitting value; Jow & Scott marginalized over that searched parameter
