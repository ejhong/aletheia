      look-elsewhere correction. Two further independent efforts reinforce the
      null: López et al.'s detector, validated at 95% retrieval on synthetic CCC
      Hawking points, found no significant population, and Bodnia et al.'s
      maximum-resolution and ResNet searches excluded a specified amplitude/size
