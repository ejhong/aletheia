      features at the abundance expected in a standard ΛCDM sky; Bodnia et al.
      further find no significant low-variance circles at full resolution after
      screening few-pixel spots. The 6σ figure rests on a
      pure-Gaussian-plus-noise null that omits the measured CMB power spectrum,
