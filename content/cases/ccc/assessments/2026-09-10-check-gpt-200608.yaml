  synthesis: >-
    The case-level verdict applies to the featured empirical attribution: that
    the reported circles and Hawking points are observable imprints from a
    preceding aeon. It does not amount to a proof that no preceding aeon existed
    or that every possible formulation of conformal cyclic cosmology is false.
    The first essential separation is between finding features and showing that
    they are anomalous. CCC-C001 is established: independent groups recover
    low-variance rings or special directions when they apply the published
    searches. But CCC-C002 is contradicted. Multiple reanalyses find comparable
    structures in skies drawn from the full ΛCDM angular power spectrum,
    including analyses with realistic anisotropic noise, the proponents'
    published parameter choices, Planck data, and an extended range of ring
    radii. CCC-E012 adds a concrete false-positive mechanism: a few extreme
    pixels can manufacture numerous near-concentric low-variance circles under
    the original search criterion.

    The Hawking-point branch fails for a similarly methodological reason. The
    claimed 99.98% confidence falls to 87% after marginalizing over the searched
    ring sizes, and the excess is unusually dependent on its most extreme
    points. A purpose-built detector validated on synthetic CCC-style signals
    finds no significant population, while the maximum-resolution search
    likewise reports null results for its stated amplitude and profile range.
    Planck–WMAP co-location is evidence that selected spots belong to their
    shared sky rather than to independent instrumental noise, but both ΛCDM
    fluctuations and sky-processing artifacts would also recur at the same
    celestial coordinates. It therefore does not establish the previous-aeon
    attribution.

    The strongest case for CCC in this ledger is not frivolous. The framework
    predates the searches; the sky-twist result reports a sharp preference for
    circles over mildly elliptical rings; the ring centres are reported as
    highly anisotropic; and no search has been genuinely preregistered or blind.
    Those points prevent the existing null results from becoming a universal
    no-go theorem for CCC. Conversely, the standard account has positive
    explanatory content rather than merely institutional support: ΛCDM-spectrum
    simulations reproduce the searched features, low-order multipoles provide a
    mechanism for large-radius variance patterns, and the broader temperature,
    polarization, and lensing data have a quantitative conventional fit. The
    absence of detected primordial tensor modes and the unexplained status of
    some low-multipole anomalies remain limitations of that steelman, not
    affirmative evidence for CCC.

    The theory layer also carries unresolved costs: mass fade-out lacks an
    implemented particle-physics mechanism, the original entropy reset has a
    direct quantum-information objection, and the erebon account lacks a derived
    perturbation spectrum or detectable gravitational-wave signal in the one
    quantitative decay calculation. These considerations calibrate plausibility,
    but the case verdict does not depend on a prior that cyclic cosmology is
    impossible; it follows from the failed diagnosticity of the reported
    signatures. The single evidence record whose removal would most change the
    verdict is CCC-E012 because it supplies the clearest generating mechanism
    and covers both signature families. The contradicted verdict survives
    without it: CCC-E002, CCC-E003, CCC-E004, CCC-E008, CCC-E010, CCC-E011, and
    CCC-E037 still independently dissolve the reported significances under the
    relevant structured-sky nulls.
  steelman: "The ledger does not answer the sky-twist observation: no independent
    evidence record reruns the reported collapse of concentric-ring prevalence
    under slight ellipticity using masked ΛCDM simulations with an
    ellipse-specific null. A preregistered survival of that circularity
    preference would be a distinctive anomaly that the present conventional
    account has not explained."
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    reasoning: The attribution requires the searched features to discriminate a
      previous-aeon signal from an ordinary structured CMB sky, but the
      independent reanalyses find no such discrimination. The circle
      significances disappear under ΛCDM-spectrum simulations, while the
      Hawking-point significance collapses after the look-elsewhere correction
      and further searches return nulls. CCC-E012 additionally identifies a
      false-positive mechanism for both search programs. The strongest opposing
      consideration is the unreplicated sky-twist circularity result, together
      with the reported anisotropy of circle centres.
    confidence: high
  - claimId: CCC-C010
    verdict: well_supported
    reasoning: ΛCDM-spectrum simulations reproduce the circle abundance, ring-size
      marginalization removes the Hawking-point significance, and few-pixel
      spots explain how the published circle criterion generates false
      positives. Low-order CMB multipoles also provide a conventional mechanism
      for the large-radius variance patterns and regional clustering. The word
      "every" is stronger than the evidence because the sky-twist statistic and
      the exact reported concentration of circle centres have not received
      directly matched independent tests. Those outstanding tests are the
      strongest opposing consideration.
    confidence: moderate
