  synthesis: "The ladder has a credible bottom rung that decides nothing and a broken second rung. The annular low-variance features and the ring-like hot spots are genuine outputs of the published procedures, reproduced on WMAP and Planck by hostile groups (CCC-E002, CCC-E008, CCC-E037); a feature both ΛCDM and CCC skies produce separates nothing. One step up, the anomaly claims fail: five independent reanalyses place the circles at chance abundance — Wehus & Eriksen, Moss/Scott/Zibin, Hajian, Bielewicz et al. and DeAbreu et al., the last freezing the proponents' own parameters (CCC-E002, E003, E004, E037, E008); the Hawking-point 99.98% falls to about 87% under size marginalization (CCC-E010), a third of the residual comes from a single point (CCC-E054), the proposed clustering is absent (CCC-E049, E050), and a detector validated at 95% retrieval on synthetic CCC signals finds no significant population (CCC-E011). The null-ensemble crux both camps state in print (CCC-E005) is argued by proponents but never quantified against the ΛCDM ensemble, and Bielewicz et al. show it is subtler than 'Gaussian versus ΛCDM': even ΛCDM skies must be conditioned on the observed ℓ ≤ 7 multipoles before the large-radius deficit becomes typical (CCC-E056, E057), which supplies a positive conventional mechanism for the two features the proponents still hold — the systematic large-radius deficit and the clustering of centres. The few-pixel diagnosis (CCC-E012) supplies a second positive mechanism, for the concentric families under the proponents' criterion. Attribution (CCC-C009) therefore has nothing left to stand on, and the one recent proponent paper (CCC-E022) elaborates a signal whose statistical existence is unrehabilitated. The erebon route, CCC's laboratory-adjacent prediction, now has its first calculation: Allen 2020 places the gravitational-wave yield of the decay Penrose described 35–95 orders of magnitude below LIGO (CCC-E042, E069), and the correlated-noise premise Penrose adopted is removed on the maximum-likelihood analysis (CCC-E067, on a source not yet fully verified), so CCC-C505 is contradicted and CCC-R002 is downstream of a mechanism (CCC-R008), not merely unrun. Sensitivity: the single record whose removal would most change the case verdict remains CCC-E012, the only record reaching both signatures and supplying a false-positive generator; the verdict survives its removal — E002, E003, E004, E008, E037 sustain 'contradicted' on the circles and E010, E011, E054 on the Hawking points — and, unlike before, confidence on CCC-C002 would stay high, because Bielewicz et al. now supply an independent positive account of the large-radius and clustering features. The verdict attaches to the specific detection claims, not to CCC as a cosmology, which is untested rather than refuted; and because no search on either side was preregistered (CCC-E023), the critical case is capped too. Verdicts on the mechanism rungs (CCC-C005, C006) lean partly on priors about mass conservation and unitarity, and the reasoning says so."
  steelman: "The strongest case for CCC's signatures that this assessment does not answer runs as follows. (1) The sky-twist test (CCC-C503) compares the real sky against distorted copies of itself, so it is immune to the null-ensemble objection that dispatched every other proponent statistic; it has never been independently re-run with an appropriate null, and the one objection to it is known to the ledger only via the proponents' rebuttal. (2) The concentration of concentric-triple centres — 83% of 1134 in 3% of sky (CCC-C504) — is a real, independently observed clustering; the low-multipole mechanism offered for it (CCC-C524) was established on a different statistic in 2013 and has never been tested against this figure. (3) The five strongest Hawking-point candidates co-locate in Planck and WMAP, and the marginalized residue is 87%, with López et al. reporting a 1%-level candidate excess: the nulls leave non-zero residues rather than zeros. (4) Every null was computed against a signal model the searchers invented; CCC could be right and every search mis-aimed, as Bodnia et al. themselves concede in stating their nulls 'do not disprove the CCC model'. (5) The theory predates the searches by four years (CCC-E014), and the 2025 Meissner–Penrose mass–temperature relation reportedly matches the largest observed clusters — the first derived prediction to make contact with the data. (6) Allen's erebon bound assumes a homogeneous population and a spherically symmetric impulsive decay; a non-spherical decay or a nearby galactic source is not computed. None of this changes a verdict: (1), (2) and (4) are exactly the items the research agenda prioritizes because they are open, not because they are won; (3) is expected under every hypothesis once noise is shown negligible (CCC-E028); (5) elaborates a signal whose existence is unrehabilitated; (6) is a task (CCC-R008), not a result."
