caseAssessment:
  verdict: contradicted
  whatIsClaimed: The universe cycles through aeons. As each aeon's matter decays toward masslessness, its exponentially expanded remote future becomes conformally identical to the next aeon's Big Bang, so information can cross the boundary. Supermassive black-hole encounters late in the previous aeon emitted gravitational radiation that registers in our cosmic microwave background as families of concentric low-variance circles; the final Hawking evaporation of such black holes deposits compact spots of raised temperature ('Hawking points'). Proponents claim both are present in WMAP and Planck data — circles at up to 6σ, ring-type structures at 99.7% and 99.4%, Hawking points at 99.98% confidence — that the circles are circular rather than elliptical and their centres clumped, that dark matter consists of decaying Planck-mass 'erebons' created at the crossover, and that erebon decays may already appear as correlated noise in gravitational-wave detectors.
  whereDisagreementLives: "Not over whether the sky contains the features — every group that has looked, critical groups included, reproduces the low-variance circles and the hot spots, and the clustering of ring centres is independently observed. The crux is the null hypothesis and the accounting for the search. Gurzadyan and Penrose computed significance against a pure Gaussian sky plus instrument noise; five independent reanalyses, simulating skies with the full ΛCDM power spectrum, find the same features at the same abundance in synthetic data containing no previous aeon, and one shows the large-radius deficit becomes typical once simulations share the real sky's anomalous ℓ ≤ 7 multipoles. Layered on top: a-posteriori statistics (the Hawking-point confidence falls from 99.98% to about 1σ when the ring size is not chosen after looking, and a third of the residue comes from one point), and a 2024 diagnosis that few-pixel bright spots manufacture concentric low-variance circles under the proponents' criteria. Two proponent arguments remain untested rather than refuted: the sky-twist circularity preference and the 83%-in-3% centre concentration; the two camps also disagree about what CCC predicts for the distribution of centres. On the forward prediction, the disagreement is whether any erebon decay could produce a detectable signal at all: the only calculation says no by tens of orders of magnitude under the emission Penrose described."
  whatWouldSettleIt: "A preregistered, adversarial reanalysis — statistic (including the sky-twist ellipticity test), simulation ensemble, mask, few-pixel artifact screen and look-elsewhere correction fixed jointly by proponents and critics before unblinding — applied once to the final Planck maps would settle the existing detection claims. Two narrower desk tests would decide among the accounts: a fair ellipse null for the sky-twist statistic (does the real sky prefer circles when simulated skies do not?) and a re-run of the concentric-triple centre statistic on ΛCDM skies conditioned on the observed ℓ ≤ 7 multipoles (do conditioned skies reach 80% concentration?). Quantitative CCC predictions — abundance, amplitude, profile, polarization, sky distribution — would make every search interpretable; the 2025 mass–temperature relation is one fragment. Independently: a confirmed detection of primordial tensor B-modes would establish an inflationary signal CCC has no mechanism for; a specified erebon-decay emission mechanism that survives Allen's isotropy result would reopen a detector search, or a proof that none can would close it; and a field-theoretic mass fade-out or a no-go theorem would restructure the theory rung regardless of the sky."
  bestConventionalExplanation: Standard inflationary ΛCDM, plus the ordinary statistics of searching. The CMB is a realization of a correlated Gaussian random field with a red-tilted power spectrum; such a field is full of structure, including rings of low variance and compact warm spots, at exactly the abundance the reanalyses find. The proponents' significance figures arise from comparing the sky to an impoverished null (a Gaussian sky without the observed correlations), from selecting statistics and search parameters after inspecting the data, and — for the strongest recent claims — from a handful of anomalous few-pixel spots that inflate the local baseline variance and thereby generate concentric low-variance circles around themselves. The systematic large-radius deficits and the clustering of ring centres into a few large regions are manifestations of the known, still unexplained anomalies of the CMB's lowest multipoles, which predate CCC and require no previous aeon. The WMAP–Planck co-location of the strongest spots is expected under every hypothesis once instrumental noise is shown negligible at those scales. On this account nothing pre-cosmic has been detected; the CMB has been re-discovered to contain structure.
