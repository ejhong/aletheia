  synthesis: >-
    Roger Penrose's Conformal Cyclic Cosmology (CCC) presents a bold and
    mathematically elegant attempt to resolve the gravitational entropy puzzle
    of the Big Bang without cosmic inflation, bridging successive aeons through
    conformal rescaling. Uniquely among pre-Big-Bang proposals, CCC made direct
    empirical contact with observational cosmology by positing that catastrophic
    events in the prior aeon—specifically supermassive black hole encounters and
    Hawking evaporations—leave indelible geometric imprints in the cosmic
    microwave background (CMB) as concentric low-variance circles and localized
    temperature hot spots ("Hawking points"). Proponents reported both
    signatures at high statistical significance (up to 6σ for circles and 99.98%
    confidence for Hawking points) across WMAP and Planck data, arguing that
    these structures could not emerge by chance and displaying intriguing
    properties such as sky-twist ellipticity sensitivity and cross-satellite
    co-location.

    However, exhaustive independent replications (Wehus & Eriksen 2011, Moss et
    al. 2011, Hajian 2011, Bielewicz et al. 2013, DeAbreu et al. 2015, Jow &
    Scott 2020, and Bodnia et al. 2024) consistently demonstrate that while the
    raw spatial patterns can be extracted using the proponents' algorithms,
    their statistical anomaly is entirely an artifact of flawed null ensembles
    and uncorrected post-hoc search parameters. When measured against simulated
    skies drawn from the standard inflationary ΛCDM power spectrum rather than
    featureless Gaussian noise, concentric low-variance circles appear at
    ordinary, expected frequencies. Furthermore, Jow & Scott showed that
    marginalizing over the search window size collapses the Hawking-point
    significance from 99.98% to an unremarkable ~87% (~1σ), while Bodnia et al.
    demonstrated that single-pixel artifacts directly generate phantom
    low-variance rings under the proponents' metric. On the theoretical side,
    crucial physical underpinnings—such as asymptotic mass fade-out and entropy
    resetting via black hole information loss—remain speculative or physically
    contested (Eckstein 2023), and proposed gravitational-wave detection of
    erebon dark matter is disfavored by tens of orders of magnitude (Allen
    2020).

    In sensitivity testing, the single evidence record whose removal would most
    alter this case is CCC-E012 (Bodnia et al. 2024), which provides the
    definitive maximum-resolution artifact diagnosis and machine-learning
    search. Nevertheless, the case verdict of contradicted robustly survives
    without CCC-E012, as the earlier independent reanalyses by Wehus & Eriksen,
    Moss et al., Hajian, DeAbreu et al., and Jow & Scott independently dismantle
    both the circle and Hawking-point statistical claims under standard ΛCDM
    nulls.
  steelman: The unexplained ~83% spatial concentration of 1134 concentric
    ring-triple centers into three small regions comprising roughly 3% of the
    sky (An et al. 2020), combined with the reported sharp collapse in
