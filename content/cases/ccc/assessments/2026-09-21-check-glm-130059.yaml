  synthesis: "The case splits cleanly along its own three-rung structure, and the
    verdict differs by rung. Observation: the features are real — both sides
    agree the WMAP and Planck maps contain concentric low-variance ring sets and
    compact hot spots, and independent groups reproduce them (CCC-C001,
    established). Statistical anomaly: every headline significance has been
    dissolved by reanalysis using more appropriate nulls. The 6σ circle figure
    rested on a pure-Gaussian-plus-noise ensemble (CCC-C003); five independent
    reanalyses — Wehus & Eriksen, Moss/Scott/Zibin, Hajian with realistic
    anisotropic noise, DeAbreu with the proponents' own frozen parameters on
    Planck data, and Bielewicz over 0–90° radii — find the features at chance
    abundance in ΛCDM skies. The 99.98% Hawking-point figure falls to 87% under
    marginalization over ring size (Jow & Scott), loses a third of its excess to
    a single point, and survives neither López et al.'s validated detector (95%
    retrieval on synthetic CCC signals) nor Bodnia et al.'s maximum-resolution
    search, which additionally identifies the false-positive mechanism
    (few-pixel spots). Attribution (CCC-C009, contradicted): with the anomaly
    claims unrehabilitated, the previous-aeon reading has nothing to carry, and
    the mechanism rung imposes its own costs — mass fade-out remains an
    admittedly unconventional assumption (Tod's open-problems list), the entropy
    accounting is directly contested by Eckstein, and Allen's calculation puts
    the erebon gravitational-wave signature 35–95 orders below LIGO
    detectability. The conventional account (CCC-C010, well_supported) is not
    merely a null: Bielewicz supplies a positive mechanism (known low-ℓ
    multipole anomalies) for the large-radius and clustering features. Two
    proponent observations remain genuinely untested — the sky-twist ellipticity
    dependence and the 83% ring-center concentration — and the 2025
    Meissner–Penrose mass–temperature relation is the first derived signal
    fragment; these are the honest residues, and they are why the verdict is
    contradicted at moderate rather than high confidence. Sensitivity: the most
    consequential single record is CCC-E012 (Bodnia et al. 2024), but the
    verdict survives its removal — five independent circle reanalyses, Jow &
    Scott's marginalization, and López's validated null independently sustain
    it. The steelman below is the sky-twist test, which no record on this ledger
    answers."
  steelman: "Gurzadyan & Penrose's sky-twist test (2013) is the strongest
    unrequited argument on the ledger: it compares the real sky against mildly
    elliptically distorted versions of itself, without simulations, and finds
    the concentric low-variance sets collapse dramatically with ellipticity
    while ring radii cut off near 15–20° — behavior the proponents argue is
    exactly what CCC's impulsive previous-aeon events predict and generic search
    artifacts should not produce. No record in this packet rebuts it: DeAbreu et
    al. never ran the test, Bodnia et al.'s few-pixel-spot mechanism has not
    been shown to reproduce an ellipticity-dependent collapse, and the case's
    own research agenda (CCC-R006) concedes this is the one proponent argument
    examined but never independently re-run with a fair ellipse null."
