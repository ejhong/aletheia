  synthesis: >-
    The case turns on separating feature detection from anomaly detection and
    attribution. The low-variance rings are genuine outputs of the published
    search procedure: independent groups reproduce the relevant directions in
    WMAP and Planck. That establishes CCC-C001, but it does not establish that
    the rings are improbable under standard cosmology. Multiple independent
    reanalyses using skies drawn from the full ΛCDM angular power spectrum find
    comparable structures at ordinary abundance, including analyses with
    realistic anisotropic noise, Planck data, the proponents' published search
    settings, and radii extending to 90 degrees. The Hawking-point branch has
    the same structure. The claimed spots occur in the maps, but the reported
    99.98% confidence falls to 87% after marginalizing over searched sizes; the
    excess is highly dependent on a few points, and two independent
    purpose-built searches find no significant population. Thus the central
    attribution claim, CCC-C009, is contradicted as an account of the reported
    evidence even though these results do not prove that no previous aeon
    existed.

    The strongest case for CCC is more substantial than a dismissal based on
    authority would suggest. The framework predates the searches, the features
    are not merely instrument noise, Planck and WMAP see the same underlying
    sky, and the proponents report structural properties beyond a simple
    low-variance statistic: a sharp preference for circles over slightly
    elliptical rings, an upper-radius cutoff, and strong concentration of ring
    centres. Those are potentially discriminating observations. Moreover, no
    search on either side was formally preregistered, and the only emerging
    theory-derived signal fragment has not yet been used in a blinded test.

    Against that steelman, the adverse evidence concerns mechanisms and
    measurements rather than sociology. The null-ensemble disagreement is
    documented directly, and the full-spectrum ΛCDM ensemble repeatedly predicts
    the observed structures. Look-elsewhere correction removes the Hawking-point
    headline significance. CCC-E012 additionally identifies a concrete
    false-positive mechanism: a few extreme pixels manufacture concentric
    low-variance sets under the published criterion, while its full-resolution
    searches find neither signature. The theory also retains major independent
    debts: no implemented mass-fade-out mechanism, a direct challenge to its
    entropy reset, no derived perturbation spectrum, and an erebon
    gravitational-wave channel calculated to be vastly below detector
    sensitivity in the specified decay model. These deficiencies do not by
    themselves falsify every possible CCC formulation, but they remove the
    mechanistic support that might otherwise rescue an ambiguous sky pattern.

    The single evidence record whose removal would most change the case verdict
    is CCC-E012 because it addresses both CMB signatures and supplies a
    false-positive mechanism rather than only a null result. The contradicted
    verdict survives without it: CCC-E002 through CCC-E004, CCC-E008, CCC-E010,
    CCC-E011, and CCC-E037 independently dissolve the principal significance
    claims. Removal would reduce the explanatory completeness and confidence of
    the roll-up, not reverse it.
  steelman: "CCC-E006's unreplicated sky-twist result remains unanswered: the
