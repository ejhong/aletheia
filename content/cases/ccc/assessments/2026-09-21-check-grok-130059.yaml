  - claimId: CCC-C006
    verdict: mixed
    reasoning: Penrose’s entropy accounting via black-hole information loss plus
      conformal rescaling is the theory’s official solution to the low-entropy
      initial condition; Eckstein 2023 argues that the same information loss
      increases global entropy and thereby undermines the required
      renormalization, proposing a unitary variant instead. Tod treats the issue
      as open. The claim is therefore neither established nor refuted by the
      available records. The strongest opposing consideration is that Eckstein’s
      critique sits inside a still-unsettled quantum-gravity debate.
    confidence: moderate
  - claimId: CCC-C007
    verdict: established
    reasoning: Penrose 2018 introduces Planck-mass, gravitationally interacting
      particles created at crossover, decaying on timescales ~10^11 yr, and
      potentially visible as impulsive gravitational-wave events; the statement
      accurately records the theory’s dark-matter proposal. Allen 2020 shows
      that the resulting stochastic backgrounds lie far below detectability, but
      that calculation constrains the signal strength, not the logical content
      of the prediction itself. The strongest opposing consideration is the
      extreme vagueness of the lifetime and branching parameters.
    confidence: high
  - claimId: CCC-C008
    verdict: established
    reasoning: Penrose 2018 states explicitly “there is no inflation in CCC” and
      attributes the near scale-invariance of the CMB fluctuations to erebon
      decay in the previous aeon’s exponential expansion. The claim is a correct
      description of the theory’s content. The strongest opposing consideration
      is that no quantitative derivation of the observed spectral tilt or
      amplitude from erebon decay has yet been supplied, leaving an unpaid
      theoretical debt.
    confidence: high
  - claimId: CCC-C505
    verdict: weakly_supported
    reasoning: Penrose 2017 did propose that the reported LIGO inter-detector noise
      correlations at the same time lag as the gravitational-wave events could
      be erebon-decay impulses. The empirical premise (Creswell et al.) was
      subsequently contested by Nielsen et al. 2019, who found no significant
      residual correlation after subtraction of a maximum-likelihood waveform;
      Allen 2020 further shows that both direct and memory-effect backgrounds
      fall tens of orders of magnitude below LIGO sensitivity. The strongest
      opposing consideration is that a non-spherical or locally concentrated
      decay channel has never been calculated, so a narrow window of
      detectability is not formally closed.
    confidence: low
  - claimId: CCC-C519
    verdict: established
    reasoning: Allen 2020 derives, for Planck-mass particles decaying to two
      gravitons with lifetime longer than the Hubble time, a direct stochastic
      background Ω_GW(25 Hz) < 2 × 10^{-103}, approximately 95 orders of
      magnitude below the LIGO O1+O2 limit. The numerical claim is taken
      directly from the published calculation. The strongest opposing
      consideration is that the result assumes a homogeneous cosmological
      population and an isotropic two-body decay; galactic over-densities or
      anisotropic emission could in principle raise the local rate, though the
      paper already notes the memory-effect channel still misses by 35 orders.
    confidence: high
