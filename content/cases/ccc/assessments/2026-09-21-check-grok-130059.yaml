    confidence: high
  - claimId: CCC-C001
    verdict: established
    reasoning: Every independent group that has re-implemented the published search
      procedures (Wehus & Eriksen, Moss/Scott/Zibin, DeAbreu et al., Hajian,
      Bielewicz, Bodnia) reproduces the low-variance annular rings and the
      compact raised-temperature spots in both WMAP and Planck maps. The
      features are therefore real outputs of the analysis pipelines applied to
      the public data. The strongest opposing consideration is none; existence
      is not in dispute.
    confidence: high
  - claimId: CCC-C003
    verdict: established
    reasoning: Gurzadyan & Penrose themselves state that the critics simulate maps
      from the ΛCDM power spectrum while they simulate pure Gaussian sky plus
      noise; the independent reanalyses uniformly confirm that this ensemble
      choice is decisive and that the features become typical under the former.
      The methodological disagreement is therefore documented on both sides and
