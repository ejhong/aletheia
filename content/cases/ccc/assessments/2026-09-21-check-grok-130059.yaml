  synthesis: "The case turns on three separable questions that the literature
    repeatedly fuses: whether the reported low-variance concentric circles and
    compact raised-temperature spots exist as map features, whether those
    features are statistically anomalous relative to a properly constructed
    null, and whether any residual anomaly is best attributed to previous-aeon
    black-hole activity under CCC rather than to the ordinary statistics of a
    Gaussian ΛCDM sky searched a posteriori. Evidence records establish the
    first point cleanly. Multiple independent groups (Wehus & Eriksen 2011,
    Moss/Scott/Zibin 2011, DeAbreu et al. 2015, Hajian 2011, Bielewicz et al.
    2013, Bodnia et al. 2024) reproduce the rings and spots when the published
    search procedures are reapplied to WMAP and Planck maps; CCC-C001 is
    therefore established. The second point is where the dispute collapses.
    Every independent reanalysis that draws null skies from the full ΛCDM
    angular power spectrum (plus realistic noise) finds the observed abundance
    and amplitudes of both circles and Hawking points to be typical; the
    original high significances (up to 6σ circles, 99.98 % Hawking points)
    appear only when the null is a pure Gaussian-plus-noise ensemble that
    deliberately omits the CMB’s own correlated structure, or when the
    look-elsewhere effect over ring size is left uncorrected. Jow & Scott’s
    marginalization reduces the Hawking-point excess to ~1σ; Bodnia et al.
    further show that few-pixel temperature outliers manufacture families of
    low-variance circles under the exact search criteria used by the proponents,
    and that after those spots are excised no significant population survives.
    López et al. built a detector that recovers 95 % of synthetic CCC Hawking
    points yet finds none at high significance in the real sky. Thus CCC-C002
    and CCC-C004 are contradicted, and the methodological claim CCC-C003 that
    the entire significance discrepancy traces to null-ensemble choice is
    established. Once the features are recognized as unremarkable products of a
    structured Gaussian sky, the interpretive claim CCC-C009 (that they are
    conformal images of previous-aeon black-hole encounters and evaporations)
    loses its empirical base and is contradicted. The conventional attribution
    CCC-C010 is correspondingly well supported: a-posteriori statistics,
    inadequate nulls, look-elsewhere effects, and few-pixel artifacts fully
    account for every published “signature.” The absence of any preregistered or
    blind protocol (CCC-C011) is itself established by the study table and by
    the sequence of shifting signal models on both sides; every quoted
    significance, positive or negative, reflects choices made after data
    inspection. On the mechanism side the theory’s internal costs remain unpaid:
    mass fade-out is required and admitted to be unconventional (CCC-C005), the
    entropy-reset argument is under active challenge (CCC-C006), and the erebon
    dark-matter proposal, while a genuine forward prediction, yields
    gravitational-wave backgrounds tens to ninety-five orders of magnitude below
    existing limits when calculated (CCC-C519). The inflationary ΛCDM framework
    that supplies the successful nulls is itself tightly constrained by Planck
    and still lacks a detected tensor mode, but that open question does not
    rehabilitate features that are already explained by the scalar sector. The
    single most load-bearing cluster is therefore the set of independent
    ΛCDM-null reanalyses plus the artifact diagnosis; remove them and the
    anomaly claims regain surface plausibility. The case verdict that the
    reported CMB features do not carry news from a previous aeon survives that
    removal only because the methodological and artifact records are multiple
    and mutually reinforcing, but it would soften from contradicted to
    unresolved if the entire independent-reanalysis corpus were unavailable. In
    short, the observations are real, the claimed anomalies are not, and the
    previous-aeon interpretation is therefore unwarranted by the evidence on
    hand."
  steelman: The sky-twist ellipticity test of Gurzadyan & Penrose 2013, which has
    never been independently re-run under an ellipse-specific ΛCDM null and
    proper masks, still shows a sharp drop in concentric-set prevalence once
    rings are allowed even mild ellipticity, together with a hard radius cut-off
    near 15–20°; if that circularity preference survives a fair null it would
    remain an unexplained structural feature that generic Gaussian structure
    does not automatically produce.
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    reasoning: The claim requires both that the circles and Hawking points are
      statistically anomalous and that the anomaly is best explained as
      previous-aeon gravitational-wave and Hawking-radiation imprints.
      Independent reanalyses (Wehus & Eriksen, Moss/Scott/Zibin, Hajian,
      DeAbreu, Jow & Scott, López, Bodnia, Bielewicz) demonstrate that the
      features are reproduced yet fully consistent with ΛCDM skies once the null
      ensemble includes the observed power spectrum and look-elsewhere
      corrections are applied; Bodnia further identifies few-pixel artifacts as
      the generator of spurious concentric families. The strongest opposing
      consideration is the unreplicated sky-twist circularity preference and the
      reported centre anisotropy, neither of which has been shown to exceed ΛCDM
      expectations under a proper null.
    confidence: high
  - claimId: CCC-C010
    verdict: well_supported
    reasoning: Multiple independent groups recover the same map features at
      abundances and amplitudes expected under Gaussian ΛCDM simulations that
      incorporate the full angular power spectrum, anisotropic noise, and masks;
      after marginalization over search parameters and removal of few-pixel
      outliers the residual excesses fall to ~1σ or below. Bielewicz et al.
      further supply a positive conventional mechanism linking large-radius
      variance deficits and centre clustering to the known low-ℓ multipole
      anomalies. The strongest opposing consideration is that some
      proponent-specific statistics (sky-twist, exact triple-centre
      concentration) have not yet been subjected to the same null, leaving a
      narrow residual possibility that a subset of structure remains
      unexplained.
    confidence: high
  - claimId: CCC-C002
    verdict: contradicted
    reasoning: Five independent reanalyses using ΛCDM-spectrum nulls (Wehus &
      Eriksen 2011, Moss/Scott/Zibin 2011, Hajian 2011, DeAbreu et al. 2015,
      Bielewicz et al. 2013) and the later full-resolution Bodnia et al. 2024
      search all find the observed low-variance concentric families to be
      typical once the correct ensemble is used; the original 6σ figure was
      obtained only against pure-Gaussian-plus-noise simulations. Bodnia
      additionally shows that few-pixel temperature spots manufacture the
      apparent concentric sets under the published criteria. The strongest
      opposing consideration remains the sky-twist ellipticity dependence
      reported by the proponents, which has not been independently
      stress-tested.
    confidence: high
  - claimId: CCC-C004
    verdict: contradicted
    reasoning: Jow & Scott 2020 demonstrate that marginalizing over the ring-size
      parameter that was chosen after data inspection reduces the claimed 99.98
