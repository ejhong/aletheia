  - claimId: CCC-C002
    verdict: contradicted
    reasoning: Four independent groups (Wehus & Eriksen, Moss/Scott/Zibin, Hajian,
      DeAbreu) plus Bielewicz et al. reproduce the features but find them
      typical of ΛCDM simulations, with Hajian closing the anisotropic-noise
      loophole and Bodnia identifying few-pixel spots as a false-positive
      generator under the proponents' own criteria. The strongest opposing
      consideration is the proponents' argument that ΛCDM-spectrum simulations
      presuppose exactly the randomness CCC denies (CCC-E005) — but that is a
      philosophical objection to the null, not a demonstration that the features
      exceed it, and the five-way convergence under different statistics is what
      the evidence weighs.
    confidence: high
  - claimId: CCC-C004
    verdict: contradicted
    reasoning: Jow & Scott's marginalization over ring size reduces 99.98% to ~87%
      (CCC-E010), a third of the excess at the claimed scales comes from the
      single most significant point (CCC-E054), the top points show no anomalous
