  synthesis: "The case separates cleanly into three rungs, and the verdict is
    carried by the attribution rung. On the observation rung, the features
    themselves are real: the concentric low-variance circles are reproduced by
    at least four independent groups (Wehus & Eriksen, Moss/Scott/Zibin, Hajian,
    DeAbreu using the proponents' own parameters on Planck data), so CCC-C001 is
    established — but that is a statement about the search procedure's outputs,
    not about anomalies. Every claim of anomaly is contradicted: five-to-six
    independent reanalyses find the circles typical of properly simulated ΛCDM
    skies (CCC-C002), the 99.98% Hawking-point significance collapses to ~1σ
    under size marginalization with a third of the residual excess in a single
    point (CCC-C004), a purpose-built detector validated at 95% retrieval on
    synthetic CCC signals finds nothing significant, and Bodnia et al. supply a
    positive artifact mechanism — few-pixel spots manufacturing the signatures —
    plus a machine-learning null. On the mechanism rung, CCC's content is
    honestly documented (mass fade-out admitted unconventional; erebons stated;
    no inflation), but the theory carries unmet costs: no mass fade-out
    mechanism, a contested entropy reset (CCC-C006 mixed), and no derived
    perturbation spectrum. On the attribution rung, CCC-C009's declared
    evidential dependencies are exactly the contradicted claims, so it inherits
    their fate; the conventional account (CCC-C010) is well supported with
    positive mechanisms, not bare nulls. Steelmanning the other side: CCC was
    stated in 2006 before any search (CCC-E014), so it is not a just-so story;
    and the sky-twist ellipticity result plus the 83% ring-centre concentration
    remain genuinely unrebutted. Sensitivity: the single record whose removal
    would most change this verdict is CCC-E012 (Bodnia et al. 2024), the only
    record that explains the false positives rather than merely failing to
    confirm them — but the verdict survives without it, resting independently on
    CCC-E002, E003, E004, E008, E010, and E011. The verdict is therefore not
    single-threaded. What would move the case is exactly what the agenda
    targets: a preregistered, jointly endorsed search (CCC-R001) binding to a
    derived quantitative signal model (CCC-R005); until then, the burden the
    proponents must discharge is not more statistics but a prediction fixed
    before the data are looked at again."
  steelman: "The Gurzadyan–Penrose 2013 sky-twist test: a simulation-free
    self-comparison showing the prevalence of concentric low-variance sets
    collapses under even slight ellipticity, with ring radii cutting off below
    20° — the one proponent argument on the record that no independent group has
    ever re-run with an ellipse-specific ΛCDM null (CCC-R006). Combined with the
    reported concentration of 83% of 1134 ring-triple centres within ~3% of the
    searched sky (CCC-C504) and the Planck–WMAP co-location of the strongest
    Hawking points, a proponent can rightly say the critics have dissolved
    headline significances without explaining these structured, directional
    properties of the data; no record in this packet tests the sky-twist
    statistic or the 83% figure against conditioned simulations."
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    reasoning: The claim's declared evidential dependencies (CCC-C002, CCC-C004) are
      both contradicted by multiple independent reanalyses, and Bielewicz et al.
      judge the ring clustering inconsistent with CCC under the random-centres
      reading (CCC-E058–E060). Meissner & Penrose 2025 (CCC-E022) defends the
      interpretation but does not answer Jow & Scott's marginalization or
      Bodnia's few-pixel screening — a signal's detailed properties cannot carry
      attribution while its statistical existence is unrehabilitated. The
      strongest opposing consideration is that the sky-twist result and the
      ring-centre anisotropy are unrebutted and never independently tested,
      which is why confidence is moderate rather than high.
    confidence: moderate
  - claimId: CCC-C010
    verdict: well_supported
