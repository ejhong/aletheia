claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    reasoning: The claim asserts that the reported circles and Hawking points are
      real previous-aeon imprints. Multiple independent reanalyses (Wehus &
      Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu, Jow & Scott, López, Bodnia,
      Bielewicz) recover the features yet find them statistically typical of
      ΛCDM skies once proper power-spectrum ensembles, look-elsewhere
      corrections, and few-pixel screening are applied; Bodnia et al. identify
      the artifact mechanism that manufactures false concentric sets. The
      strongest opposing consideration is the unreplicated sky-twist and
      centre-anisotropy arguments, which remain qualitative and post-hoc.
    confidence: high
  - claimId: CCC-C010
    verdict: well_supported
    reasoning: Independent groups using full ΛCDM simulations, realistic noise,
      frozen proponent parameters, size marginalization, purpose-built detectors
      validated on synthetic signals, and maximum-resolution artifact screening
      all conclude that every reported CCC signature is expected under standard
      inflationary skies plus a-posteriori search effects. Planck 2018 inflation
      constraints supply the positive baseline fit. The strongest opposing
      consideration is that low-ℓ anomalies themselves remain incompletely
      explained, so the conventional account relocates rather than dissolves
      every large-scale oddity.
    confidence: high
  - claimId: CCC-C002
    verdict: contradicted
    reasoning: Five independent reanalyses (Wehus & Eriksen, Moss/Scott/Zibin,
      Hajian, DeAbreu, Bielewicz) plus Bodnia et al. demonstrate that the
      low-variance concentric families appear at comparable abundance in
      ΛCDM-spectrum simulations; the original 6σ figure was computed against an
      inadequate pure-Gaussian-plus-noise null. The strongest opposing
      consideration is the proponents’ sky-twist claim that circularity
      preference cannot be a random effect, which has not been tested under an
      ellipse-specific null.
    confidence: high
  - claimId: CCC-C004
    verdict: contradicted
    reasoning: Jow & Scott show that marginalizing over the post-hoc ring-size
      window reduces the 99.98% claim to ~87% (~1σ); López et al. recover no
      significant population with a detector validated at 95% on synthetic
      Hawking points; Bodnia et al. rule out the amplitude/size box with
      HawkingNet and open code. The strongest opposing consideration is the
      Planck–WMAP co-location of the top spots, which establishes they are on
      the sky but is expected under any shared-sky hypothesis including ΛCDM
      fluctuations.
    confidence: high
  - claimId: CCC-C001
    verdict: established
    reasoning: Every independent group that has applied the published search
      procedures (Wehus & Eriksen, Moss/Scott/Zibin, DeAbreu et al., and others)
      reproduces the low-variance annular families and the compact
      raised-temperature spots; the dispute is solely over their statistical
      interpretation, not their existence as map features. The strongest
      opposing consideration would be residual instrument-specific artifacts,
      but cross-map co-location and half-difference noise tests already address
      that.
    confidence: high
  - claimId: CCC-C003
    verdict: established
    reasoning: Gurzadyan & Penrose’s own response note states that the critics
      simulate full ΛCDM power-spectrum skies while they simulate pure Gaussian
      plus noise; every subsequent independent paper confirms that this ensemble
      choice is the locus of the significance disagreement. The strongest
      opposing consideration is the proponents’ philosophical claim that most of
      the CMB is not random and therefore ΛCDM simulations are the wrong null,
      but that claim is itself the hypothesis under test and cannot define the
      null.
    confidence: high
  - claimId: CCC-C011
    verdict: established
    reasoning: The study-table synthesis and the sequence of published papers show
      that every reported significance on both sides—proponent and critic—used
      statistics, size windows, masks, and ensembles chosen after data
      inspection; no blind or preregistered protocol appears in the ledger. The
      strongest opposing consideration is that some later reanalyses froze the
      proponents’ published parameters, which is a partial but incomplete step
      toward prespecification.
    confidence: high
  - claimId: CCC-C503
    verdict: weakly_supported
    reasoning: Gurzadyan & Penrose 2013 report that concentric-set prevalence
      collapses under mild ellipticity and that radii cut off near 15–20°,
