  synthesis: "The observational core of the case is settled by multiple
    independent reanalyses that all parties accept on the raw maps: concentric
    low-variance annular families and compact raised-temperature spots exist as
    outputs of the published search procedures (CCC-C001). The anomaly claims
    that would make those features news from a previous aeon (CCC-C002,
    CCC-C004) do not survive once the null ensemble is constructed from the full
    ΛCDM angular power spectrum rather than pure Gaussian-plus-noise skies, and
    once look-elsewhere effects and few-pixel artifacts are accounted for. Wehus
    & Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu et al., Jow & Scott, López et
    al., Bielewicz et al., and Bodnia et al. independently recover the same
    features at abundances and significances fully consistent with a standard
    inflationary sky; Bodnia et al. further diagnose the generating mechanism
    (anomalous few-pixel spots inflate local baseline variance and manufacture
    concentric sets under the original criteria). The methodological dispute
    (CCC-C003) is therefore decisive rather than peripheral: the headline 6σ and
    99.98% figures live in the choice of null and the post-hoc size window, not
    in the data. Consequently the attribution claim that the features are
    imprints of previous-aeon black-hole encounters and evaporations (CCC-C009)
    is contradicted by the statistical record; the rival claim that standard
    ΛCDM plus a-posteriori search effects fully accounts for every reported
    signature (CCC-C010) is well supported. No search on either side was
    preregistered (CCC-C011), so residual 1σ excesses and untested sky-twist or
    anisotropy arguments cannot be promoted to evidence. On the mechanism rung,
    CCC requires an admittedly unconventional mass fade-out with no accepted
    particle-physics realization (CCC-C005), its entropy-reset accounting is
    challenged by published information-theoretic critique (CCC-C006), and its
    forward dark-matter prediction (erebons) yields a gravitational-wave
    background tens to ninety-five orders of magnitude below LIGO sensitivity
    under the only quantitative calculation available (CCC-C007, CCC-C519,
    CCC-C505). Planck’s precision fit to inflationary ΛCDM supplies the positive
    conventional baseline; the continued non- detection of primordial B-modes
    leaves one future discriminator open but does not rehabilitate the existing
    CMB claims. The single most load- bearing evidence thread is the suite of
    independent null reanalyses under realistic ensembles; remove them and the
    case collapses back to the proponents’ original significance figures. The
    verdict is therefore that the featured hypothesis—that the observed circles
    and Hawking points carry news from a prior aeon—is contradicted by the
    evidence records as they stand. A preregistered joint protocol or a
    quantitative CCC signal model could in principle reopen the question, but
    neither exists in the ledger."
  steelman: The sky-twist ellipticity test and the extreme anisotropy of
