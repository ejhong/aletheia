      group has repeated the test under artifact screening and an
      ellipse-specific null; Bodnia et al. note that few-pixel spots can
      generate concentric families, which could interact with the ellipticity
      comparison. The strongest opposing consideration is precisely the absence
      of an independent, properly nulled replication.
    confidence: low
  - claimId: CCC-C504
    verdict: mixed
    reasoning: An et al. 2020 report that ~83% of 1134 concentric-triple centres lie
      inside three regions covering ~3% of searched sky—an extreme anisotropy.
      Bielewicz et al. earlier showed that low-variance ring centres cluster
      because of large-angular-scale (low-ℓ) features rather than randomly
      distributed sources, offering a conventional mechanism, yet they used a
      different statistic and predate the 83% figure. The strongest opposing
      consideration is that a direct test against low-ℓ-conditioned simulations
      has not been performed.
    confidence: moderate
  - claimId: CCC-C501
