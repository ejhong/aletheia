  synthesis: >-
    This verdict answers the case's question: do the reported CMB circles and
    Hawking points carry news of a previous aeon? It is built rung by rung.

    Observation: the features exist. Independent groups reproduce the
    Gurzadyan–Penrose rings with the published procedure, one of them in Planck
    as well as WMAP (E002, E003, E008), so CCC-C001 is established. The
    'undermines' label these joint-linked records carry against C001 reflects
    their bearing on the anomaly claim, not their content.

    Anomaly: both signatures fail. The 6σ circle figure was computed against a
    pure-Gaussian-plus-noise null (CCC-C003, in the proponents' own words,
    E005). Six analyses from five groups independent of the proponents find the
    features at the abundance a ΛCDM sky produces. These include one that froze
    the proponents' own parameters (E008), one spanning radii 0–90° (E037), and
    one that identifies few-pixel spots as a generator of false concentric
    families (E012). I judge the ΛCDM-spectrum null the correct standard. That
    leans partly on background physics (a Gaussian CMB sky is characterized by
    its measured angular power spectrum), though the proponent-adjacent Warsaw
    group itself adopted a spectrum-preserving null (E007). The 99.98%
    Hawking-point figure becomes 87% once ring size is marginalized (E010). A
    third of the excess at the claimed scales comes from one point (E054), and
    two further independent searches find nothing significant (E011, E012).
    Cross-map co-location is non-diagnostic: with instrumental noise negligible
    at these scales (E028), any sky feature appears in both instruments.

    Attribution: if the features were previous-aeon imprints added to an
    ordinary sky, they should exceed the ΛCDM expectation. At the claimed
    strengths they do not. The load-bearing claims are CCC-C002 and CCC-C004
    (contradicted) and CCC-C003 and CCC-C010 (well supported); together they
    make the verdict 'contradicted'.

    The steelman for the hypothesis is real. CCC was published in 2006, before
    any search (E014), so it is not a just-so story. The nulls were no more
    preregistered than the detections (CCC-C011). CCC's signal model is
    under-specified, so no null can be fatal to the theory itself. And three
    proponent results have never been re-tested in any primary record here: the
    sky-twist ellipticity collapse (CCC-C503), the concentration of triple
    centres (CCC-C504), and the Warsaw 99.7% (CCC-C501). Those, with the only
    provisionally supported conventional account of centre clustering
    (CCC-C524), are this verdict's weakest links.

    The steelman for the rival is stronger. Every significance that has been
    re-tested dissolved, each by a different and specific mechanism: null
    choice, look-elsewhere, few-pixel artifacts, low-ℓ structure. The survivors
    are a-posteriori statistics introduced by the papers reporting them. The
    2025 preprint (E022), per its abstract, attributes a factor-of-two excess in
    spot size to a newly introduced epoch and does not engage the critiques.

    Two bounds apply. First, this is not a finding that no previous aeon
    existed; with present signal models that question is untestable. The theory
    also carries separate debts: mass fade-out without a mechanism (CCC-C005),
    an entropy accounting under unanswered published attack (CCC-C006), and no
    derived perturbation spectrum (CCC-C008). The erebon–detector route has lost
    its empirical premise (E067) and sits tens of orders of magnitude below
    detectability for modeled emission (E042, E069). Second, CCC-C504 as worded
    misreads its source: 3% is a per-region upper bound, so the three regions
    may together cover up to about 9% of the searched sky.

    Sensitivity: the record whose removal would most change the verdict is
    CCC-E010, the only direct re-test of the flagship Hawking-point statistic
    (E023 restates its result but is derivative). Without it, the Hawking-point
    branch would rest on differently constructed nulls (E011, E012) plus E054,
    and would weaken toward mixed. The case verdict survives on the circle
    branch, which six independent analyses contradict and which hangs on no
    single record (E012 is the runner-up). Three things could reopen the case: a
    fair ellipse-specific null (CCC-R006), low-ℓ-conditioned tests of the centre
    concentration (CCC-R007), or a preregistered joint protocol (CCC-R001) bound
    to quantitative predictions (CCC-R005).
  steelman: Two proponent results do not depend on the pure-Gaussian null that the
    reanalyses discredit, and no independent group on this ledger has re-run
    either. First, Gurzadyan and Penrose's sky-twist test (CCC-C503) compares
    the real WMAP sky only with distorted versions of itself. It finds that
    concentric low-variance sets collapse as the rings are made even slightly
    elliptical. Once thresholds are calibrated to each shape's own expected
    variance, a statistically isotropic Gaussian sky has no reason to favour
    exact circles, whereas CCC's conformal geometry requires them. If that
    preference survived an ellipse-specific ΛCDM null (CCC-R006), it would be a
    structural signature, not a significance artifact. Second, Meissner,
    Nurowski and Ruszczycki found ring structures at 99.7% against maps of the
    same harmonic content (CCC-C501), a null that already concedes the critics'
    power-spectrum point. This assessment discounts both as post hoc and
    proponent-produced; it refutes neither. The circles branch is closed by the
    weight of nulls on other statistics, not by an answer to its best structural
    argument.
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    reasoning: "If the reported circles and Hawking points were previous-aeon
      imprints added to an ordinary sky, they should appear in excess of what a
      ΛCDM sky produces; at the claimed strengths they do not. The circle
      families occur at chance abundance in ΛCDM-spectrum skies and can be
      manufactured by few-pixel spots (E002–E004, E008, E012, E037). The
      Hawking-point excess falls to about 1σ once ring size is marginalized
      (E010) and is absent in two independent searches (E011, E012), so the only
      support records (E001, E009) are significances that did not survive, and
      the claims this one depends on (C002, C004) are contradicted. Theory
      priority (E014) cannot substitute for a signature that beats the null, the
      2025 preprint (E022) builds on the 2020 detection without engaging its
      critiques, and I give Bielewicz's inconsistency argument (E058–E060)
      little weight because it assumes CCC predicts randomly placed centres,
      which proponents dispute. Strongest opposing consideration: no search on
      either side was preregistered and CCC's signal model is under-specified,
      so this verdict covers the reported features at their claimed strengths,
      not every conceivable pre-Big-Bang imprint — and the sky-twist and
      centre-concentration results remain un-retested."
    confidence: moderate
