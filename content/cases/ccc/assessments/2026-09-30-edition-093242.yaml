caseAssessment:
  verdict: contradicted
  whatIsClaimed: Roger Penrose's Conformal Cyclic Cosmology holds that our Big Bang was the remote future of a previous universe, whose black-hole collisions and evaporations left marks on our microwave sky. Proponents report concentric rings of unusually steady temperature (up to 6σ) and compact hot 'Hawking points' (99.98% confidence) in the WMAP and Planck maps, and read them as those marks.
  whereDisagreementLives: "The dispute is over what counts as chance: the features are real, but whether they are surprising depends on the comparison skies and on correcting for having searched. Proponents compared against plain random skies. Five independent reanalyses, using skies simulated from the standard model, find the rings just as often. Correcting for the spot sizes tried cuts the Hawking-point confidence to about 87%. Still untested: the rings' reported preference for circles over ellipses, and the crowding of ring centres."
  whatWouldSettleIt: "A protocol both camps agree and freeze before looking — statistic, comparison skies, artifact screen, search correction — applied once to the final Planck maps would settle the detection claims. Two cheaper tests decide between accounts: do simulated skies show the same circle-over-ellipse preference, and do skies copying our sky's largest ripples reproduce the ring-centre crowding? A detection of primordial gravitational waves would count against CCC itself."
  bestConventionalExplanation: |-
    The microwave sky is a random field whose fluctuations are correlated as the standard inflationary model (ΛCDM) predicts. Such a field is full of structure, including quiet rings and warm spots at the abundance the reanalyses find.

    The high significances came from three sources:
    - comparing the sky with plain random skies that lack those correlations;
    - choosing statistics and sizes after looking;
    - a few freak pixels that generate concentric quiet rings around themselves.

    The large-radius shortfall and the regional clustering of ring centres reflect the sky's known, unexplained oddities at its largest scales, which predate CCC. The Planck–WMAP co-location of the strongest spots is expected for any real sky feature once instrument noise is negligible.

    Two items are not yet explained so much as untested: the reported circle-over-ellipse preference and the specific ring-centre concentration.
