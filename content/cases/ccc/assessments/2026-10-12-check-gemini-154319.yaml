  synthesis: >-
    Roger Penrose's Conformal Cyclic Cosmology (CCC) is an intellectually
    ambitious cosmological model that seeks to eliminate the Big Bang
    singularity and resolve the initial low-entropy puzzle by matching the
    conformally invariant late future of a prior aeon to the origin of our own.
    Unusually for pre-Big-Bang theories, CCC ventured concrete, falsifiable
    observational predictions in existing microwave background maps: concentric
    low-variance circles produced by gravitational-wave bursts from supermassive
    black-hole collisions, and localized temperature spikes ("Hawking points")
    left by evaporating black holes. Proponents reported both signatures at high
    statistical significance (up to 6σ for circles and 99.98% for Hawking
    points).

    However, the provided evidence records overwhelmingly contradict the
    hypothesis that these CMB features represent physical relics of a prior
    aeon. Multiple independent research teams (Wehus & Eriksen 2011; Moss, Scott
    & Zibin 2011; Hajian 2011; Bielewicz et al. 2013; DeAbreu et al. 2015; Jow &
    Scott 2020; Bodnia et al. 2024) reproduced the search algorithms and
    confirmed that the geometric features exist, but demonstrated that they are
    completely typical of Gaussian fluctuations drawn from the standard ΛCDM
    power spectrum. The proponents' high significance figures resulted from an
    invalid null hypothesis (a pure Gaussian sky plus white noise rather than
    the structured CMB sky), severe uncorrected look-elsewhere effects across
    search radii, and few-pixel point-like artifacts that artificially depress
    annular baseline variances. When proper null simulations, parameter
    marginalization, and artifact screening are applied, the statistical
    anomalies completely disappear. Furthermore, CCC's theoretical mechanisms
    face unresolved foundational challenges: mass fade-out lacks any known
    particle-physics basis, and quantum information analyses show black-hole
    evaporation increases global entropy rather than resetting it.

    Steelman for CCC: CCC was formulated well before the data searches took
    place (Penrose 2006) and is not a post-hoc curve fit. Proponents rightly
    emphasize that two observational claims remain unrefuted by direct,
    apples-to-apples counter-simulations: the sky-twist procedure showing a
    sharp drop in concentric structure abundance under slight ellipticity, and
    the dramatic spatial clustering wherein 83% of concentric ring triples lie
    within just 3% of the sky.

    Sensitivity: The single evidence record whose removal would most change this
    assessment is CCC-E012 (Bodnia et al. 2024), which provides the mechanistic
    artifact explanation (few-pixel spots generating false rings) and a
    comprehensive machine-learning null. Nonetheless, the case verdict of
    'contradicted' comfortably survives without it, as five earlier independent
    reanalyses (Wehus & Eriksen, Moss et al., Hajian, DeAbreu et al., and Jow &
    Scott) had already demonstrated that the reported circle and spot
    significances dissolve under standard ΛCDM nulls.
  steelman: The sharp drop in concentric ring prevalence under minor elliptical
    deformation demonstrated by Gurzadyan and Penrose's sky-twist procedure (EPJ
    Plus 2013) has never been re-evaluated against an ellipse-matched,
    artifact-screened ΛCDM null ensemble.
