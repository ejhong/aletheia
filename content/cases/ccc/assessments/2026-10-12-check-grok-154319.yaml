  synthesis: "The case turns on three separable layers that the polemics fuse: the
    existence of searchable features in WMAP/Planck maps, whether those features
    are anomalous under a properly constructed null, and whether any residual
    anomaly must be attributed to a previous aeon rather than the statistics of
    a structured Gaussian sky plus a-posteriori search. On the first layer the
    evidence is unambiguous and bipartisan. Multiple independent groups
    reproduce the low-variance annular rings and compact raised-temperature
    spots when they apply the published search procedures (Wehus & Eriksen 2011,
    Moss/Scott/Zibin 2011, DeAbreu et al. 2015, An et al. 2020). CCC-C001 is
    therefore established. The second layer collapses under the same reanalyses.
    When the null ensemble is drawn from the full ΛCDM angular power spectrum
    (plus realistic anisotropic noise), the observed circle families and
    Hawking-point candidates appear at frequencies entirely typical of a
    standard inflationary sky; the original 6σ and 99.98% figures were artifacts
    of an under-powered pure-Gaussian-plus-noise null and of un-marginalized
    ring-size choices. Jow & Scott’s look-elsewhere correction drops the
    Hawking-point excess to ~1σ; Bodnia et al. further show that few-pixel
    outliers manufacture concentric low-variance sets under the original
    criterion and that a maximum-resolution, machine-learning search finds
    nothing significant. Thus CCC-C002 and CCC-C004 are contradicted, and the
    methodological diagnosis in CCC-C003 is itself established by both sides’
    own statements. The third layer—the attribution claim CCC-C009—therefore
    inherits no positive statistical support. The conventional account CCC-C010,
    which invokes ordinary CMB structure plus a-posteriori statistics, accounts
    for every published signature once the null is simulated correctly;
    Bielewicz et al. additionally supply a concrete causal mechanism (anomalous
    low-ℓ multipoles) for the large-radius variance deficit and the clustering
    of ring centres. No search on either side was preregistered (CCC-C011), so
    every significance number remains conditional on post-data choices. On the
    theory side the costs are acknowledged by the originators themselves: mass
    fade-out is “admittedly unconventional,” the entropy reset via information
    loss is contested by Eckstein, and the erebon dark-matter sector supplies
    only order-of-magnitude parameters whose gravitational-wave yield lies tens
    of orders below LIGO sensitivity (Allen 2020). The net result is that the
    featured hypothesis—that the observed circles and hot spots are conformal
    imprints of a prior aeon—is contradicted by the only evidence that could
    have confirmed it. The remaining open threads (unreplicated sky-twist,
    centre anisotropy under low-ℓ conditioning, quantitative signal models) are
    precisely the items the research agenda flags; none of them currently
    reverse the ledger."
  steelman: "The 2013 sky-twist test still stands unreplicated by any independent
    group under an ellipse-specific null: Gurzadyan & Penrose report that the
    abundance of concentric low-variance sets collapses dramatically once rings
    are allowed even mild ellipticity, a circularity preference that is
    difficult to dismiss as a generic artifact of low-multipole structure or
    few-pixel spots and that no critic has yet confronted with a fair simulation
    ensemble."
