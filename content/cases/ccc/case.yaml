researchPriority:
  level: low
  reason: >-
    The claimed CMB detections have been independently contradicted under
    dependence-aware null ensembles, so further relitigation has low
    expected yield; framework-level discriminators (B-modes, erebon
    searches) await instruments and precision beyond current reach.
