id: CCC-001
slug: ccc
title: "The Aeon Before Ours?"
subtitle: "Do faint concentric circles and hot spots in the cosmic microwave background carry news from a universe before the Big Bang — or is that what any random sky looks like when you search it hard enough?"
domain: "Cosmology · CMB data analysis · Statistical methodology"
status: active
summary: >-
  Roger Penrose's Conformal Cyclic Cosmology (CCC) holds that the Big Bang
  was not the beginning: our universe is one aeon in an unending sequence,
  and the infinitely expanded far future of the previous aeon is,
  conformally, our own initial singularity. Unusually for a theory of what
  came before the Big Bang, CCC makes claims about data we already have —
  gravitational-wave bursts from black-hole encounters in the previous aeon
  should mark our microwave sky with concentric circles of anomalously low
  temperature variance, and evaporating supermassive black holes should
  leave "Hawking points" of raised temperature. Penrose's collaborators
  report both signatures at high significance. Every independent reanalysis
  finds the features real but unremarkable — exactly what a standard
  inflationary sky produces once the null hypothesis is simulated properly.
  The dispute is now less about cosmology than about statistical
  methodology: which simulation ensemble defines "expected," and how much
  significance survives when you correct for having searched.
whatIsClaimed: >-
  The universe cycles through aeons. As each aeon's matter decays toward
  masslessness, its exponentially expanded remote future becomes
  conformally identical to the next aeon's Big Bang, so information can
  cross the boundary. Supermassive black-hole encounters late in the
  previous aeon emitted gravitational radiation that registers in our
  cosmic microwave background as families of concentric low-variance
  circles; the final Hawking evaporation of such black holes deposits
  compact spots of raised temperature ("Hawking points"). Proponents claim
  both are present in WMAP and Planck data — circles at up to 6σ, Hawking
  points at 99.98% confidence — and that dark matter consists of decaying
  Planck-mass "erebons" created at the crossover.
whereDisagreementLives: >-
  Not over whether the sky contains the features — every group that has
  looked, critical groups included, reproduces the low-variance circles
  and the hot spots. The crux is the null hypothesis. Gurzadyan and
  Penrose computed significance against simulations of a pure Gaussian sky
  plus instrument noise; four independent reanalyses, simulating skies
  with the full ΛCDM power spectrum, find the same features at the same
  abundance in synthetic data that contains no previous aeon. Layered on
  top: a-posteriori statistics (the Hawking-point confidence falls from
  99.98% to roughly 1σ when the ring size is not chosen after looking),
  and a 2024 diagnosis that few-pixel bright spots manufacture concentric
  low-variance circles under the proponents' search criteria.
whatWouldSettleIt: >-
  A preregistered, adversarial reanalysis — statistic, simulation
  ensemble, mask, and look-elsewhere correction fixed jointly by
  proponents and critics before unblinding — applied to the final Planck
  maps would settle the existing detection claims. Quantitative CCC
  predictions (how many circles, what amplitude, what profile), which the
  theory has so far supplied only qualitatively, would make the search
  falsifiable going forward. Independently: a confirmed detection of
  primordial tensor B-modes would establish the inflationary signal CCC
  has no mechanism for, and a demonstrated erebon-decay signal in
  gravitational-wave detectors — or a well-characterized null — would test
  the theory's one laboratory-adjacent prediction.
bestConventionalExplanation: >-
  Standard inflationary ΛCDM, plus the ordinary statistics of searching.
  The CMB is a realization of a Gaussian random field with a red-tilted
  power spectrum; such a field is full of structure, including rings of
  low variance and compact warm spots, at exactly the abundance the
  reanalyses find. The proponents' significance figures arise from
  comparing the sky to an impoverished null (a white-ish Gaussian sky
  without the observed correlations), from selecting statistics and search
  parameters after inspecting the data, and — for the strongest recent
  claims — from a handful of anomalous few-pixel spots that inflate the
  local baseline variance and thereby generate "concentric circles" around
  themselves. On this account nothing pre-cosmic has been detected;
  the CMB has simply been re-discovered to contain structure.
