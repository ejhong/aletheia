id: CCC-001
slug: ccc
title: "The Aeon Before Ours?"
subtitle: "Do faint concentric circles and hot spots in the cosmic microwave background carry news from a universe before the Big Bang — or is that what any random sky looks like when you search it hard enough?"
domain: "Cosmology · CMB data analysis · Statistical methodology"
status: active
summary: >-
  Roger Penrose's Conformal Cyclic Cosmology (CCC) holds that the Big Bang was not the beginning: our universe is one aeon in an unending sequence, and the infinitely expanded far future of the previous aeon is, conformally, our own initial singularity. Unusually for a theory of what came before the Big Bang, CCC makes claims about data we already have — gravitational-wave bursts from black-hole encounters in the previous aeon should mark our microwave sky with concentric circles of anomalously low temperature variance, and evaporating supermassive black holes should leave "Hawking points" of raised temperature. Penrose's collaborators report both signatures at high significance. Every independent reanalysis finds the features real but unremarkable — exactly what a standard inflationary sky produces once the null hypothesis is simulated properly. The dispute is now less about cosmology than about statistical methodology: which simulation ensemble defines "expected," and how much significance survives when you correct for having searched.
