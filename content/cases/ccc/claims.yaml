# ── Attribution rung ─────────────────────────────────────────────────────────

- id: CCC-C009
  statement: >-
    The reported concentric low-variance circles and Hawking points in the
    CMB are real imprints of supermassive black-hole encounters and
    evaporations in an aeon preceding our Big Bang, as predicted by
    conformal cyclic cosmology.
  plainLanguage: >-
    The featured thesis: the microwave sky is a palimpsest, and the faint
    rings and hot spots are legible writing from the universe before ours.
    If true, these would be the oldest observable events in existence —
    older than the Big Bang.
  theme: attribution
  rung: attribution
  tier: featured
  claimType: interpretive
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — central thesis of Gurzadyan & Penrose 2010–2013 and An, Meissner, Nurowski & Penrose 2020"
    extractedBy: "Fable (AI agent)"
    runId: "ccc-case-2026-08-22"
    date: "2026-08-22"
  credibility: contradicted
  credibilitySummary: >-
    The verdict presently follows the signature claims it rests on: every
    independent reanalysis of the circles (four groups) and of the Hawking
    points (three groups) finds no significant anomaly once the null
    ensemble and look-elsewhere effects are handled, and the strongest
    recent candidates trace to few-pixel artifacts. What keeps the thesis
    from being closed rather than contradicted: the genuine pre-2010
    prediction of ring-type signatures, the unexplained Planck–WMAP
    co-location of the strongest spots, the proponents' untested
    ellipticity and anisotropy arguments, and the fact that current-data
    nulls cannot rule out fainter imprints (Bodnia et al. say exactly
    this).
  diagnosticity: high
  diagnosticitySummary: >-
    This is the thesis itself, and it is unusually well-formed for a
    pre-Big-Bang proposal: it stakes observable, in-principle-decidable
    claims on data everyone shares — which is why the case can be mapped
    at all.
  parentClaimIds: []
  dependsOnClaimIds: [CCC-C002, CCC-C004]
  strongestObjection: >-
    The thesis inherits every statistical defect of CCC-C002 and CCC-C004,
    and adds one: the predictions were qualitative (some rings, some
    spots, somewhere), so any flagged feature can be claimed as a match —
    abundance, amplitude, and profile were never specified in advance,
    which is what allowed the significance to live entirely in
    after-the-fact analysis choices.
  whatWouldChangeOurMind:
    - "The adversarial preregistered reanalysis (CCC-R001) finding a surviving excess — or the proponents accepting its null as binding."
    - "Quantitative CCC signature predictions (CCC-R005) succeeding on held-out data."
    - "An erebon-decay detection (CCC-R002), which would transform the prior for every other CCC claim."

