# ── Mechanism rung ───────────────────────────────────────────────────────────

- id: CCC-C005
  statement: >-
    CCC's aeon-to-aeon matching requires all rest mass to fade out in the
    remote future, and no accepted particle-physics mechanism for mass
    fade-out exists; Penrose presents it as an admittedly unconventional
    hypothesis.
  plainLanguage: >-
    For the far future of one universe to be conformally identical to the
    Big Bang of the next, the far future must contain nothing that carries
    a built-in clock — and rest mass is a clock. Electrons are the sharp
    case: they are the lightest charged particle, charge conservation
    forbids their decay, and yet CCC needs their mass gone. Penrose
    proposes the mass simply fades asymptotically; he concedes this is
    unconventional, and sympathetic reviewers list it among the theory's
    open problems.
  theme: theory
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — Penrose 2018 (Found. Phys.) full text; Tod 2022 (arXiv:2202.10864)"
    extractedBy: "Fable (AI agent)"
    runId: "ccc-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Penrose 2018, Foundations of Physics 48(10), §2"
    quote: >-
      For the strict requirements of the theory one must apparently assume
      that there is a mechanism whereby in the hugely long-term future,
      mass eventually fades away, asymptotically — which I shall refer to
      as "mass fade-out" — an admittedly unconventional hypothesis.
    sourceId: SRC-PENROSE-2018-FOP
  credibility: well_supported
  credibilitySummary: >-
    Well supported as a statement about the theory: the requirement and
    the absence of a mechanism are documented in Penrose's own papers and
    in Tod's sympathetic open-questions review ("Can one implement mass
    fade-out? Massless charged particles are usually regarded as
    problematical."). Whether the hypothesis is true is untested and
    currently untestable.
  diagnosticity: moderate
  diagnosticitySummary: >-
    A theoretical cost rather than an observational discriminator: it does
    not bear on whether the CMB features are anomalous, but it prices the
    theory those features are meant to support. A demonstrated no-go
    theorem would remove CCC from contention regardless of the statistics.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    Penrose notes that mass is not a Casimir operator of the de Sitter
    group, so exact mass constancy is less sacrosanct with a positive
    cosmological constant than Poincaré-invariant intuition suggests — the
    gap is a missing mechanism, not a proven impossibility.
  whatWouldChangeOurMind:
    - "A concrete field-theoretic implementation of mass fade-out consistent with observation (CCC-R004)."
    - "A no-go result showing conformal crossover incompatible with charged massive relics."

- id: CCC-C006
  statement: >-
    CCC's entropy accounting is self-consistent: information loss in
    black-hole evaporation, together with the conformal rescaling at
    crossover, legitimately resets the gravitational entropy so that each
    aeon can begin in a low-entropy state without violating the Second Law.
  plainLanguage: >-
    A cyclic universe has a bookkeeping problem: entropy must always rise,
    so how can each new aeon start pristine? Penrose's answer is that
    black holes destroy information (contrary to the mainstream view that
    quantum evolution preserves it), which licenses discarding the
    associated entropy. Whether that move is coherent is contested
    territory in quantum gravity.
  theme: theory
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — Penrose 2010 (Cycles of Time), Penrose 2013 (Found. Phys. 44); critique in Eckstein 2023 (Gen. Rel. Grav.)"
    extractedBy: "Fable (AI agent)"
    runId: "ccc-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Penrose 2013, Foundations of Physics 44(8): 873–890 (CCC's entropy discussion); book-length treatment in Cycles of Time (2010)"
    sourceId: SRC-PENROSE-2013-FOP
  credibility: mixed
  credibilitySummary: >-
    The proposal is worked out at the level of Penrose's own writings and
    depends on black-hole information loss, which most of the quantum
    gravity community rejects. Eckstein's 2023 analysis argues the assumed
    loss of degrees of freedom is incompatible with the quantum notion of
    entropy and that information loss would increase rather than reset
    global entropy — while, notably, proposing a unitary variant of CCC
    rather than dismissing the framework.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Like mass fade-out, this prices the theory: if the entropy reset fails,
    CCC loses its central motivation (explaining the Second Law's initial
    condition) even if some sky features were anomalous.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    Information loss in Hawking evaporation contradicts the unitarity that
    the AdS/CFT-era consensus and the recent Page-curve calculations
    support; and Eckstein argues that even granting loss, discarding
    degrees of freedom raises global entropy instead of renormalizing it —
    the reset does the opposite of what CCC needs.
  whatWouldChangeOurMind:
    - "A rigorous demonstration that the crossover entropy accounting balances (or provably cannot), engaging the modern information-paradox literature."
    - "Adoption of a unitary CCC variant (Eckstein 2023) by proponents, which would change what this claim asserts."

- id: CCC-C007
  statement: >-
    CCC predicts that dark matter consists of Planck-mass particles
    ("erebons") created at the crossover, which interact only
    gravitationally, decay completely within an aeon, and whose decays
    could register as impulsive signals in gravitational-wave detectors.
  plainLanguage: >-
    The theory's most laboratory-adjacent commitment: dark matter is made
    of particles about the mass of a dust grain (~10⁻⁵ g), each one born
    at the aeon boundary, each one eventually dying in a burst of
    high-frequency gravitational radiation. Penrose has suggested such
    bursts might already lurk in LIGO's noise. Unlike the CMB signatures,
    this prediction is about future data.
  theme: erebons
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: supporting
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — Penrose 2018 (Found. Phys.) full text; Penrose 2017 (arXiv:1707.04169)"
    extractedBy: "Fable (AI agent)"
    runId: "ccc-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Penrose 2018, Foundations of Physics 48(10), §5"
    quote: >-
      Since no other physical interactions (electromagnetic, weak, or
      strong) are involved, their mass would have to be something of the
      order of a Planck mass (10−5 g) or thereabouts... erebons should be
      able to decay, with a lifetime of perhaps something like 10^11 years.
    sourceId: SRC-PENROSE-2018-FOP
  credibility: well_supported
  credibilitySummary: >-
    Well supported as a statement of what CCC predicts — the erebon
    proposal is developed in print by Penrose himself. No detection exists;
    no dedicated search has been published; the one suggestive connection
    (correlated LIGO noise) was floated by Penrose in a 2017 preprint and
    has not been pursued to a result in either direction.
  diagnosticity: high
  diagnosticitySummary: >-
    This is CCC's cleanest forward-looking discriminator: a demonstrated
    population of impulsive, non-astrophysical Planck-frequency events
    would be evidence no rival account expects, and a well-characterized
    null constrains the theory's dark-matter sector. Unlike the CMB
    claims, nothing here depends on a-posteriori statistics yet.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    The prediction is an order-of-magnitude sketch, not a spectrum: mass
    "perhaps with some factor such as 8π," lifetime "perhaps something
