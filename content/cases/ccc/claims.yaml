    sourceId: SRC-GURZADYAN-PENROSE-2010B
  credibility: well_supported
  credibilitySummary: >-
    Uncontroversial as a description of what each side did — the ensemble
    difference is stated in the proponents' own response note and in every
    critical paper. What remains contested is which null is the right one,
    and that is the attribution dispute (CCC-C009 vs CCC-C010), not this
