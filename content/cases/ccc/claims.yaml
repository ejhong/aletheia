- id: CCC-C003
  statement: >-
    The disagreement over circle significance traces to the construction of
    the null ensemble: Gurzadyan and Penrose computed significance against
    simulations of a pure Gaussian sky plus instrument noise, while all
    independent reanalyses simulated skies drawing on the full ΛCDM angular
    power spectrum, under which the observed features are typical.
  plainLanguage: >-
    Both camps agree what is in the real data; they disagree about what
    "expected by chance" means. The proponents tested against a sky with
    no built-in large-scale correlations; the critics tested against the
    standard cosmological model's sky, which is full of them. The same
    rings are a 6σ anomaly against the first null and unremarkable against
    the second.
  theme: statistics
  rung: observation
  tier: featured
  claimType: methodological
  importance: major
  reviewState: ai_extracted
