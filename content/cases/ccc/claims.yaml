    annular rings show low temperature variance, often in concentric sets,
    and these features are reproducible by independent groups applying the
    published search procedure.
  plainLanguage: >-
    If you scan the microwave sky for rings that are unusually "quiet" —
    less patchy than their surroundings — you find them, sometimes several
    sharing one center. This is not in dispute: the critics who reject the
    cosmological interpretation reproduce the rings themselves.
