# Canon layer. Claims built directly from published primary literature —
# there is no seeding research document for this case. Every citation was
# verified against Crossref, the arXiv API, publisher pages, or retrieved
# full text before import (2026-08-22 batch). reviewState is honest
# provenance: nothing here has been hand-checked by a human yet.
#
# Ladder note: this case's central discipline is separating three things
# that the polemics tend to fuse — (1) what features the maps contain
# (observation: both sides agree they are there), (2) what the theory
# actually requires and predicts (mechanism), and (3) what explains the
# features (attribution: a previous aeon versus the statistics of
# searching a Gaussian sky).

