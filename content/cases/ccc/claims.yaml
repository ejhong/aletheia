  diagnosticity: high
  diagnosticitySummary: >-
    This claim locates the crux. Under the standard understanding of
    hypothesis testing, the null must include everything the rival
    hypothesis (ΛCDM) actually predicts — including the observed power
    spectrum — which is why the independent choice is near-universally
    regarded as correct. The proponents' contrary position, that the CMB's
    non-random component invalidates ΛCDM-spectrum simulations as a null,
    is itself a substantive cosmological claim requiring defense.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    Calling this a symmetric "choice of ensembles" understates the
    asymmetry: testing a detection claim against a null that omits the
    known statistical properties of the data is a textbook error, and the
    proponents' justification (that the CMB signal is mostly non-random)
    presupposes part of what is in dispute.
  whatWouldChangeOurMind:
    - "A published derivation showing the ΛCDM-spectrum ensemble is inappropriate for this statistic — or proponent adoption of the standard ensemble with the anomaly surviving."

