  claimIds: [CCC-C007, CCC-C008]
  sourceId: SRC-PENROSE-2018-FOP
  direction: supports
  strength: strong
  sourceStatement: >-
    Erebons are introduced as gravitation-only particles: "their mass
    would have to be something of the order of a Planck mass (10−5 g) or
    thereabouts, perhaps with some factor such as 8π involved... erebons
    should be able to decay, with a lifetime of perhaps something like
    10^11 years."     Their decay replaces inflation as the source of CMB
    fluctuations: "there is no inflation in CCC." On
    detection: "There is an intriguing issue concerning whether such
    erebon decays in our own aeon might be detectable by gravitational
    wave detectors such as LIGO."
  editorInference: >-
    Supports CCC-C007 and CCC-C008 as statements of what the theory
    predicts — the record establishes that CCC has a forward-looking,
    laboratory-adjacent commitment, which most pre-Big-Bang proposals
    lack. The vagueness of the parameters ("perhaps," "or thereabouts")
    is the claim's own recorded objection.
  exactLocator: "Found. Phys. 48(10): 1177–1190, §5"
  limitations:
    - "Order-of-magnitude proposal without a computed decay spectrum or event rate."
