- id: CCC-E019
  title: "Penrose 2017: the LIGO-noise conjecture"
  claimIds: [CCC-C007, CCC-C505]
  sourceId: SRC-PENROSE-2017-ARXIV
  direction: context
  strength: weak
  sourceStatement: >-
    Responding to a report of correlated noise between the two LIGO
    detectors with the same time delay as the gravitational-wave signals,
    the note proposes "that what seems to be spuriously generated noise
    may in fact be gravitational events caused by the decay of dark-matter
    particles (erebons) of mass around 10^-5g."
  editorInference: >-
    Context for the erebon prediction's one contact with existing
    instrument data. The underlying correlated-noise claim (Cresswell et
    al.) was disputed and largely deflated in subsequent LIGO analyses,
    and no erebon-specific search was ever published — the conjecture
    remains exactly that.
  exactLocator: "arXiv:1707.04169, abstract"
  limitations:
    - "Unrefereed; premised on a contested noise analysis; no follow-up."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (arXiv API, abstract verbatim)"
    extractedBy: "Fable (AI agent)"
    runId: "ccc-case-2026-08-22"
    date: "2026-08-22"

