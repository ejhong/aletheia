# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit and read against the listed
# claims; sourceStatement (what the source says) is kept separate from
# editorInference (what we infer).
#
# Structural note: because the observation claims are split between "the
# features exist" (CCC-C001) and "the features are anomalous" (CCC-C002,
# CCC-C004), the independent reanalyses appear twice with different
# directions — they SUPPORT the existence claim while UNDERMINING the
# anomaly claims. That split is the case's central discipline.

# ── The founding circles claim ───────────────────────────────────────────────

