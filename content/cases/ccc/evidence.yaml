  direction: supports
  strength: moderate
  sourceStatement: >-
    "A new 'sky-twist' procedure, directly analysing WMAP data, without
    appeal to simulations, shows that the prevalence of these concentric
    sets depends on the rings being circular, rather than even slightly
    elliptical, numbers dropping off dramatically with increasing
    ellipticity. This is consistent with CCC's expectations; so also is
    the crucial fact that whereas some of the rings' radii are found to
    reach around 15°, none exceed 20°." The paper also reports a "highly
    non-isotropic" distribution of concentric sets.
  editorInference: >-
    The proponents' most substantive structural argument: it sidesteps the
