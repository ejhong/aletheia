- id: CCC-E021
  title: "BICEP/Keck 2021: still no primordial B-modes (r < 0.036)"
  claimIds: [CCC-C010, CCC-C008]
  sourceId: SRC-BICEP-KECK-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The combined BICEP/Keck, Planck, and WMAP analysis through the 2018
    observing season constrains the tensor-to-scalar ratio to r < 0.036
    at 95% confidence, with no detection of primordial gravitational-wave
    B-modes.
  editorInference: >-
    Qualifies the inflationary steelman rather than supporting CCC: the
    one signature that would evidence an inflationary era in our own aeon
    directly remains unseen, so the discriminating measurement between
    the two frameworks (CCC-R003) is still open in both directions.
    Recorded symmetrically: a future detection would create a signal CCC
    has no mechanism for; continued nulls constrain inflationary models
    without confirming CCC.
  exactLocator: "PRL 127: 151301"
  limitations:
    - "Many viable inflation models predict r below current sensitivity, so the null does not currently damage the steelman."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (Crossref)"
