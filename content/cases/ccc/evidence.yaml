- id: CCC-E020
  title: "Planck 2018 inflation constraints: the rival's quantitative scorecard"
  claimIds: [CCC-C010]
  sourceId: SRC-PLANCK-2018-X
  direction: supports
  strength: strong
  sourceStatement: >-
    The Planck 2018 inflation analysis reports precision fits of the
    ΛCDM+inflation framework to the full temperature, polarization, and
    lensing dataset: a measured red spectral tilt, tight Gaussianity
    constraints, and parameter-level agreement of simple slow-roll models
    with the data.
  editorInference: >-
    The steelman's positive case, distinct from its critiques of CCC: the
    framework the reanalyses assume as the null is not a placeholder but
    the most precisely tested model in cosmology. Any CCC alternative must
    reproduce this scorecard before its distinctive signatures add net
    evidence (the debt recorded at CCC-C008).
  exactLocator: "A&A 641: A10"
  limitations:
    - "Precision fit is not proof of inflation: the inflationary sector's parameters are fitted, not independently confirmed, and the tensor sector remains undetected (CCC-E021)."
