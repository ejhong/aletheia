  claimIds: [CCC-C004, CCC-C010]
  sourceId: SRC-JOW-SCOTT-2020
  direction: undermines
  strength: strong
  sourceStatement: >-
    "We investigate recent claims for a detection of 'Hawking points'...
    at the 99.98% confidence level. We find that, after marginalization
    over the size of the rings, an excess is detected in Planck satellite
