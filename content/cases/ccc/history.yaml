- date: "2026-08-22"
  change: >-
    Case published: 11 featured claims across the three rungs plus 5 catalog claims, 21 evidence records (9 supports, 8 undermines, 2 qualifies, 2 context by direction against their listed claims), 24 sources (all ai_verified with per-source verification notes; none unverified, none fabricated), 5 research opportunities, and a first AI assessment overlay labeled as an unreviewed draft. All claims labeled ai_extracted pending human review. Structural note: the observation rung deliberately splits "the features exist" (CCC-C001, confirmed by critics) from "the features are anomalous" (CCC-C002/C004, contested), so the independent reanalyses support the former while undermining the latter — keeping the null-ensemble dispute (CCC-C003) and the preregistration crux (CCC-C011) visible instead of averaged away.
  reason: >-
    Launch the case with the statistical-methodology dispute — not the cosmology — carrying the epistemic weight, since that is where the evidence actually disagrees.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

