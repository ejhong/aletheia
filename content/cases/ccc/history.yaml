- date: "2026-08-22"
  change: >-
    Case built directly from published primary literature (runId ccc-case-2026-08-22) — no seeding research document exists for this topic. Every citation was verified before import against Crossref DOI records, the arXiv API, publisher pages, or retrieved full text. Primary texts read in full during verification: An, Meissner, Nurowski & Penrose 2020 (arXiv v5 matching the MNRAS version), Jow & Scott 2020, Bodnia et al. 2024, Penrose 2018 (Foundations of Physics), Tod 2022, and Penrose 2006 (EPAC proceedings). Abstract-level verification with verbatim quotes: the Gurzadyan–Penrose preprint series, the four independent circle reanalyses, Meissner/Nurowski/Ruszczycki 2013, López et al. 2022, Eckstein 2023, and the Planck and BICEP/Keck reference records. Cycles of Time was verified bibliographically only (full text not held).
