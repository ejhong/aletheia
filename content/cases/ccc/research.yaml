# Research agenda: designed so that every project moves specific claims in
# either direction. The recurring theme is prespecification — fourteen years
# of this dispute have been conducted entirely post hoc (CCC-C011), on a
# theory whose signature predictions have never been stated quantitatively.

- id: CCC-R001
  title: "Adversarial, preregistered reanalysis of the circles and Hawking points"
  summary: >-
    A joint protocol, frozen and deposited before unblinding, agreed by CCC
    proponents and their critics: the statistic (including the sky-twist
    ellipticity test the critics have never run), the simulation ensemble,
    the mask, the artifact-screening step for few-pixel spots, and the
    look-elsewhere correction, all fixed in advance — then applied once to
    the final Planck maps. Desk work on public data with open-source
    tooling (Bodnia et al.'s HawkingNet is already published). Either
    outcome is decisive for the existing record: a surviving excess would
    be extraordinary; a null under the proponents' own endorsed protocol
    would close the current detection claims.
  claimIds: [CCC-C002, CCC-C003, CCC-C004, CCC-C011]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    The single most decisive project available: it converts a
    fourteen-year methodological stalemate into one preregistered
    measurement.

- id: CCC-R002
  title: "A dedicated erebon-decay search in gravitational-wave detector data"
  summary: >-
    Turn the erebon conjecture into a search: specify the expected
    waveform class (impulsive, Planck-frequency events appearing as
    coincident broadband transients), rate assumptions for a galactic
    dark-matter halo of ~10⁻⁵ g particles with ~10¹¹-year lifetimes, and
    run it against public LIGO/Virgo/KAGRA noise data. Requires proponent
    input to pin the free parameters in advance — which is itself part of
    the test. A detection would transform the case; a well-characterized
    null would bound the erebon parameter space for the first time.
  claimIds: [CCC-C007, CCC-C009, CCC-C505]
  track: small_grant
  effortTier: desk
  informationGain: >-
    Tests CCC's only laboratory-adjacent forward prediction, on data that
    already exist, in a regime untouched by the CMB statistics dispute.

- id: CCC-R003
  title: "Primordial tensor B-modes as the framework discriminator"
  summary: >-
    Track and interpret the coming generation of B-mode measurements
    (BICEP Array, Simons Observatory, LiteBIRD, CMB-S4) as a CCC-relevant
    test with the asymmetry stated in advance: a confirmed detection of
    primordial tensor modes would evidence an inflationary era in our own
    aeon that CCC — which deletes inflation and sources fluctuations in
    the previous aeon's erebon decay — has no mechanism for; continued
    nulls tighten inflationary parameter space without confirming CCC.
    The desk task is a published statement, endorsed by proponents, of
    what r-value CCC can and cannot survive.
  claimIds: [CCC-C008, CCC-C010]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Converts the inflation-versus-CCC contrast from rhetoric into a
    number that upcoming instruments will actually deliver.

- id: CCC-R004
  title: "Make mass fade-out precise — or prove it impossible"
  summary: >-
    The theory side of Tod's question list: a concrete field-theoretic
    implementation of asymptotic rest-mass decay consistent with current
    bounds (electron mass stability, charge conservation), engaging
    Penrose's de Sitter-group observation that mass is not a Casimir
    operator when Λ > 0 — or a no-go theorem showing conformal crossover
    is incompatible with charged massive relics. Also in scope: deriving
    the CMB perturbation spectrum from erebon decay (the debt recorded at
    CCC-C008), which would give the observational program its first
    quantitative prediction.
  claimIds: [CCC-C005, CCC-C006, CCC-C008]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Either outcome restructures the case: a mechanism would answer the
    standing theoretical objection; a no-go would retire the theory
    regardless of the sky statistics.

- id: CCC-R005
  title: "Quantitative CCC signature predictions for preregistration"
  summary: >-
    The gap Bodnia et al. name explicitly: CCC's circle and Hawking-point
    predictions are qualitative, so every search has had to invent the
    signal model itself. Proponents (or anyone) should derive from CCC the
    expected abundance, amplitude distribution, angular profile, and sky
    distribution of both signatures — including what the anisotropic
    clumping of circle centers (CCC-C504) should look like if it reflects
    previous-aeon superclusters — in a form a preregistered search
    (CCC-R001) can bind to. The 2025 Meissner–Penrose preprint supplies a
    first fragment — a mass–temperature relation for the Hawking spots,
    unreviewed and so far unchecked outside the program — but the expected
    abundance, profile, and sky-distribution predictions remain missing;
    until the full model exists, positive claims cannot be credited and null
    results cannot be fatal.
  claimIds: [CCC-C002, CCC-C004, CCC-C009, CCC-C011]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    The prerequisite that makes every other project's outcome
    interpretable; highest leverage per page of theory in the case.

- id: CCC-R006
  title: A fair ellipse null for the sky-twist test
  summary: Compute, from ΛCDM simulations masked as the data, the expected annular variance as a function of the full ellipse parameter space (eccentricity, orientation, radius, masked fraction), then re-run the GP13 concentric low-variance search on WMAP9 and Planck 2018 maps for circles and for ellipses of increasing eccentricity, with the low-variance threshold defined relative to that ellipse-specific expectation rather than a per-direction average. The measurement is the abundance of concentric low-variance sets versus eccentricity, for the data and for each simulated sky. If the data show a circularity preference that the simulated skies do not, CCC-C503 is rehabilitated and the DeAbreu, Contreras and Scott (2015) sky-rotation objection answered; if the data's eccentricity dependence tracks the simulations, CCC-C503 falls and CCC-C010 gains its one missing piece.
  claimIds:
    - CCC-C503
    - CCC-C010
  track: either
  effortTier: desk
  informationGain: This is the only proponent argument on the record that has been examined but never independently re-run with an appropriate null; the outcome would either close or reopen the circles branch of the case.
  origin:
    ref: report 2026-09-10-report-ccc-191230
    extractedBy: claude-fable-5-1
    runId: 2026-09-10-draft-ccc-191834
    date: 2026-09-10
- id: CCC-R007
  title: Test the ring-centre concentration against low-ℓ-conditioned ΛCDM skies
  summary: "Reproduce the An–Meissner–Nurowski–Penrose 2020 concentric-triple search that yields the 83%-of-1134-centres-in-3%-of-sky figure, then run it on two simulation ensembles: standard ΛCDM Gaussian skies, and ΛCDM skies whose ℓ ≤ 7 multipoles are replaced by the observed values (the Bielewicz conditioning). The measurement is the fraction of triple centres falling in the three densest regions for each ensemble. If conditioned skies routinely reach ~80% concentration, the anisotropy is a low-ℓ effect and the deficit-of-variance reading (proposed at intake and not admitted) is confirmed against CCC-C504's proponent reading; if neither ensemble approaches it, CCC-C504 becomes the strongest surviving proponent observation."
  claimIds:
    - CCC-C504
    - CCC-C009
  track: either
  effortTier: desk
  informationGain: Directly discriminates the two competing accounts of the one proponent anisotropy claim that has not been specifically re-tested.
  origin:
    ref: report 2026-09-10-report-ccc-191230
    extractedBy: claude-fable-5-1
    runId: 2026-09-10-draft-ccc-191834
    date: 2026-09-10
- id: CCC-R008
  title: Specify an erebon-decay emission mechanism that survives the isotropy objection
  summary: "A theory task: state the decay channel and radiation geometry of a Planck-mass erebon precisely enough to compute the far-field strain at a LIGO-class detector, addressing Allen's result that an isotropic impulsive shell has no O(1/r) strain and that both direct and memory-effect backgrounds fall tens of orders below detectability. The deliverable is either a non-spherical decay model with a computed single-event strain and rate for galactic dark-matter densities (which would give CCC-R002 a target amplitude), or a demonstration that no gravitationally coupled Planck-mass decay can reach detectability, which would settle CCC-C505 negatively as a matter of theory."
  claimIds:
    - CCC-C505
    - CCC-C007
  track: publication_prize
  effortTier: desk
  informationGain: Determines whether the erebon–detector prediction is a live test or a closed route; without it CCC-R002 cannot be preregistered with an expected signal.
  origin:
    ref: report 2026-09-10-report-ccc-191230
    extractedBy: claude-fable-5-1
