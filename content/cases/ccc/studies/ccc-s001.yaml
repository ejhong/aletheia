findings:
  - statement: >-
      The signal-model-provenance column comes back unanimous across
      twelve search rows: in every published search, on both sides, the
      operative signal model — statistic, size window, thresholds,
      expected abundance — was supplied by the searchers, not derived
      from CCC. Hajian 2011 states it outright ('the CCC model at its
      present stage lacks quantitative predictions of the actual
      observables'), Bodnia et al. make it the center of the current
      methodological synthesis, and the one CCC-derived fragment (a
      mass-temperature relation) appears only in a 2025 unrefereed
      preprint that no search has yet used. CCC-C011's assertion is not
      an opinion about the literature; it is the literature's own
      record.
    evidenceId: CCC-E023
  - statement: >-
      The quantitative trajectory is symmetric and unresolved by
      assertion: the proponents' significances (up to 6\u03c3 circles;
      99.7% rings; 99.4% rings; 99.98% Hawking points) each met an
      independent reanalysis that reproduced the features and dissolved
      the significance (fully consistent with \u039bCDM; entirely
      expected; not anomalous; 87% after marginalizing the free
      parameter). The recurring mechanism is identical in every cycle:
      a free choice the claim fixed, which the critique varied — ring
      radii, ellipticity procedure, spot size. That is what an
      under-specified signal model does, and it is why the preregistered
      search this case proposes (CCC-R001) needs the derived
      predictions this study finds only one unrefereed fragment of.
    evidenceId: CCC-E023
  - statement: >-
      Interpretive discipline note, both directions: this table does not
      adjudicate whether circles or Hawking points exist; it records
      that no claim on either side was produced under a protocol whose
      signal model, null model, and statistics were fixed before the
      data were examined. Every row's numbers are quoted from the
      papers' own abstracts and stated methods, and the disagreements
      between rows are recorded as the papers state them.
limitations:
  - >-
    Searcher coverage, reported bluntly: the OpenAI substitute run
    fabricated its table — wrong arXiv identifiers, invented verbatim
    quotes (including spot amplitudes and radii contradicting the
    verified record), and invented methods-section provenance language —
    and was discarded entirely, contributing nothing. The Gemini
    deep-research run corroborated the table — including the Bodnia
    author list, the Lopez refereed venue, and the pixel-artifact
    mechanism verbatim — and surfaced no search paper beyond the
    thirteen rows; its interpretive glosses ('decisive blow,'
    a '2026 critical consensus') were not adopted.
    Every cell above was verified natively against the primary document
    or anchored to a ledger source verified in the case's 2026-08-22
    batch, with the anchor stated per row.
  - >-
    Two rows (Gurzadyan-Penrose 2013; An-Meissner-Nurowski 2017) rest on
    ledger verification notes that characterize results partly through
    later papers of the same program, as those notes themselves record;
    their cells are correspondingly coarser.
  - >-
    The Meissner-Penrose 2025 row is unrefereed (arXiv only) and enters
    flagged, as the frozen criteria require; it is in the table because
    it is the only CCC-derived signal fragment in the literature, and
    its content cell carries only what the ledger's verified evidence
    record (CCC-E022) states.
