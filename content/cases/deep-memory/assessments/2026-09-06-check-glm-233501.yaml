  synthesis: "The Deep Memory case as recorded rests entirely on two AI-extracted
    observations drawn from a single source: Oliver Dietrich's 2016 blog post on
    Göbekli Tepe Pillar 43, hosted by the DAI. Both claims are descriptive of
    the pillar's iconography and both are locally plausible. Dietrich writes
    from within the excavation project, so the descriptions carry more
    evidential weight than an anonymous blog would; the headless ithyphallic
    figure (MEM-C001) is a well-known, distinctive motif, and the three
    rectangular cupola-topped forms paired with animals (MEM-C002) are directly
    attested in the quoted text. Against this stand several structural
    weaknesses: every record in the file depends on one object (Pillar 43) and
    one secondary summarizing source, the anchors are retrieved-text character
    offsets rather than printed locators, extraction was performed by an AI
    model without human review, and the source itself flags the meaning of the
    motifs as uncertain — the upper forms are explicitly \"hard to guess.\"
    Nothing in the record connects these carvings to any other site, period, or
    symbol system. The case question asks whether shared symbols and myths
    preserve a common prehistoric inheritance; the supplied evidence documents
    only that one pillar at one site carries deliberate, complex imagery whose
    semantics are unknown. That is a necessary precondition for such an
    argument, not evidence of it. The editorial interpretations correctly label
    both records as \"context\" rather than supporting the hypothesis, and I
    concur. Steelmanning the hypothesis: the iconography is unusually elaborate,
    intentionally composed, and includes anthropomorphic and zoomorphic elements
    in spatial relation — exactly the raw material from which a proponent could
    argue for a proto-mythological repertoire. But composition is not
    transmission, and one pillar cannot demonstrate a shared inheritance. The
    verdict is weakly_supported with the strong caveat that the support is
    entirely indirect: the case establishes that rich symbolic material exists,
    not that it was shared, preserved, or inherited."
  steelman: Pillar 43 presents a deliberately composed scene — a headless
    ithyphallic human among multiple animal reliefs and a structured upper
    register of three repeated architectural forms each paired with an animal. A
    proponent would argue that this systematic pairing and repetition is
    precisely what a narrative or mythological program looks like in material
    form, and that no assessment of the supplied records explains why such an
    elaborate, non-utilitarian, iconographically organized composition was
    produced unless it encoded a story or belief system capable of being shared
    and transmitted.
