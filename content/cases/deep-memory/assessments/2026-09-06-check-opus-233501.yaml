  synthesis: "The featured question asks whether shared symbols and myths preserve
    a common prehistoric inheritance — a diffusion/transmission hypothesis that
    requires, at minimum, two or more spatially or temporally separated symbol
    corpora, a demonstrated non-trivial similarity between them, and an argument
    that the similarity is better explained by shared descent or contact than by
    independent invention, iconographic convergence, or observer-imposed
    pattern-matching. The supplied record contains none of these components. It
    contains two descriptive observations about a single object — Göbekli Tepe
    Pillar 43 — drawn from a single webpage, extracted by a single automated
    run, and explicitly flagged in the evidence records as belonging to one
    independence group. Both editorial interpretations are labelled \"context,\"
    and both correctly state that the observation does not bear on transmission.
    On local truth the record is in good shape. The source is the Tepe Telegrams
    blog of the German Archaeological Institute, authored by Oliver Dietrich, a
    member of the excavation team; for plain descriptive facts about a pillar's
    relief content this is a competent and proximate reporter, even though it is
    not a peer-reviewed excavation report. Both claims are stated conservatively
    and match the quoted source text closely, and the second claim's hedge
    (\"cupola-like arches\") preserves the source's own tentativeness. The
    steelman for the hypothesis cannot be built from this file: there is no
    comparative corpus, no chronology, no independent replication of the
    descriptions, and no statistical or structural argument about motif
    similarity. The steelman against it is equally unavailable, since nothing
    here tests and fails to find transmission. The correct verdict is therefore
    unresolved on the case, not mixed and not weakly_supported: the evidence
    base is orthogonal to the question rather than divided about it. Any leaning
    toward or against \"deep memory\" here would be a prior, not a reading of
    these records. No claim is load-bearing for the case verdict, because no
    claim bears on the case at all; both are listed as weakest links in the
    sense that they are the only, and non-independent, contents of the file."
  steelman: Pillar 43's upper register — three rectangular forms with arched tops,
    each paired with a distinct animal — is a structured, repeated,
    non-representational composition at roughly 9600 BCE whose meaning the
    excavators themselves cannot decode; a proponent can fairly argue that such
    deliberately schematic, combinatorial symbol sets are exactly the kind of
    encoded content that could be transmitted verbally across millennia, and
    this assessment offers no test that would distinguish that possibility from
    decorative convention, because the record supplies no comparative corpus
    against which to check it.
