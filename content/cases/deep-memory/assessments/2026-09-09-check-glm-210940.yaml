    secondary reports, and whose five experiments are self-reports with methods
    and run data not retrieved. Structurally the ledger has three tiers. First,
    a methodological spine — DEEP-C002 (resemblance needs dates, contexts,
    differences and connections), DEEP-C026 (a catalogue distribution cannot by
    itself separate independent invention from very old transmission), DEEP-C035
