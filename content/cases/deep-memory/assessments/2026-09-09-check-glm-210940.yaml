    about source, date and capabilities) and DEEP-C065 (shape and function are
    separate questions) — is well supported, though several of these are
    analytic or near-analytic and the verdict leans on the internal logic of the
    claims plus background methodological consensus, not on independent evidence
    records. Second, the founder's quantitative results (DEEP-C005, DEEP-C025,
    DEEP-C027, DEEP-C038) are only weakly supported: they are self-reports of
    unaudited experiments, with in-house second readers flagging that some cited
    passages qualify rather than support the numbers. Third, most empirical
    claims — the navel toponyms, the Pillar 43 handled forms, the Jiroft wear
    traces, the flood pilot's regional clustering and Genesis-detail unevenness,
    the Hoa Hakananai'a carving sequence, the Viracocha and apkallu
    identifications — have no evidence records at all and are unresolved.
    Steelmanning the transmission direction: the lineup result (DEEP-C027) is a
    genuine positive signal if it replicates. Steelmanning the convergence
    direction: the bundle test (DEEP-C057), kind-matching sensitivity
    (DEEP-C038) and documented retelling convergence (DEEP-C034) all point away
    from taking resemblance as transmission evidence. On this ledger the
    founding question is genuinely open: nothing supports a shared-source
    reading, nothing refutes it, and the best-supported content is the caution
    that resemblance alone cannot decide it."
  steelman: "The V1 civiliser lineup result: claimed partners ranked first in
    62.5% of completed lineups against 9% for random pairs (DEEP-C027). A
    seven-fold excess over chance, across culturally distant civiliser
