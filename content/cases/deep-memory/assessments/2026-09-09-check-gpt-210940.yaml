  synthesis: >-
    Interpreting the featured hypothesis as the proposition that the
    cross-cultural resemblances reflect a shared past, transmission, or common
    source, the supplied evidence does not resolve it. The positive side
    consists principally of founder-reported experimental results: bird-person
    and cosmic-serpent classes reportedly occur in 55% and 37% of sampled
    traditions, and claimed civiliser partners reportedly ranked first in 62.5%
    of completed lineups versus 9% for random pairs. Those observations could
    establish that broad motifs recur and that selected descriptions appear
    unusually similar under one lineup design. They do not establish chronology,
    contact routes, common descent, source identity, or transmission of a
    particular motif bundle. Moreover, all are weak self-reports from the same
    self-published source; the underlying data, coding decisions, completed and
    incomplete runs, and analysis are absent.

    The strongest case against treating the resemblance as historical evidence
    is structural rather than directly falsifying. The supplied records say the
    catalogue has uneven coverage and that its broad narrative categories are
    not the specific images or place names at issue. The sole record about
    comparison design reports that matching the kinds of objects changed a
    lineup result, indicating sensitivity to control construction. General
    inferential principles also support DEEP-C002, DEEP-C026, and DEEP-C035:
    resemblance requires contextual interpretation, one geographical
    distribution can be compatible with multiple generative histories, and
    similarity alone cannot identify a lost source's date, identity, and
    capabilities. These principles limit what the reported patterns imply, but
    they do not demonstrate independent invention or later borrowing.

    Steelmanning the transmission side, the civiliser lineup contrast is
    substantially above its reported random comparator, and broad catalogue
    categories may erase the potentially diagnostic conjunction of pose, object,
    arrangement, narrative role, and place-name semantics. Steelmanning
    convergence, broad bird and serpent motifs have high reported baselines,
    visually grouped “bird-men” can represent distinct concepts, and control
    sensitivity can manufacture apparent matches. Crucially, the ledger contains
    no direct evidence record for the claimed nonexceptional three-motif bundle,
    regional flood clustering, Genesis-detail distribution, or inter-judge
    disagreement. It also contains no independent replication, primary-source
    chronology, archaeological connection, or explicit model comparison. The
    result is therefore unresolved rather than weakly supported or contradicted.

    Sensitivity is greatest to DEEP-E022, because its removal would eliminate
    the only supplied experimental observation that control matching changed a
    resemblance result. The unresolved verdict survives without it: the
    remaining positive records are still unaudited single-source reports and
    still provide no historical bridge from resemblance to transmission.
  steelman: "The assessment does not answer the exact object-level conjunction
    that motivates the hypothesis: bird-human imagery, handled forms,
    constrained hand placement, sacred-centre language, civilising teachers, and
    flood details may co-occur in a configuration far rarer than any broad motif
    considered separately. No supplied record tests that conjunction with blind
    coding, chronologically appropriate controls, explicit independent-invention
    models, and plausible transmission routes; a strong excess under such a test
    would remain unexplained by the broad-category baselines assessed here."
