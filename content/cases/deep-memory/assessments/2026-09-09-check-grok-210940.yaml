  synthesis: "The ledger's evidence base consists solely of weak, self-reported
    statements drawn from the founder's own unverified webpage (SRC-JHONG-2026).
    No primary excavation reports, peer-reviewed wear studies, independent
    catalogue audits, raw lineup data, or external toponymic sources appear.
    Under these constraints the central question—how much of the cross-cultural
    resemblance in bird-men, handled objects, navel names, feathered serpents,
    civilisers and flood stories records a shared past versus independent
    invention, convergence or later retelling—cannot be closed. Methodological
    claims that resemblance alone is insufficient (C002, C026, C035) and that
    stories can converge through translation and comparative writing (C034) are
    the strongest load-bearing elements; they rest on ordinary historiographic
    standards that the thin evidence never contradicts and that general
    scientific background fully endorses. The catalogue experiment's own
    reported outcomes—that broad bird-person and cosmic-serpent classes are
    common (C005, C025, C056) yet their co-occurrence bundle does not stand out
    against documentation-preserving controls (C057)—further undercut any claim
    that the specific motif package is diagnostic of deep transmission.
    Image-pilot findings that kind-matching alters rankings (C038) and that
    judges disagree (C037) reinforce the same caution. All numerical results
    remain unaudited self-reports of incomplete runs, so they supply only
    provisional, low-confidence support for the frequencies themselves and none
    for a lost-civilisation source. Claims about particular objects (Jiroft
    wear, Pillar 43 function, Hoa Hakananai'a carvings, Assyrian banduddû,
    Tiwanaku Viracocha identification, flood clustering) lack any retrieved
    primary evidence and stay unresolved. Material-constraint explanations for
    hands-on-belly poses (C047) and the logical separation of shape from
    function (C065) are plausible on engineering priors but do not decide
    symbolic meaning or historical connection. Collectively the ledger therefore
    leaves the founding question open: the pattern people see is real enough to
    notice, yet every tested quantitative and methodological probe either fails
    to isolate a privileged ancient bundle or remains too weakly documented to
    carry weight. A shared-past account is not ruled out, but nothing in the
    present evidence elevates it above convergence, universal cognitive
    templates or post-contact retelling. The case verdict is consequently
    unresolved; stronger primary sources and blinded replications would be
    required to move it."
  steelman: The side-by-side visual matches the founder assembles—bird-headed
    figures at Göbekli Tepe, Nimrud and Rapa Nui; the three arched forms on
    Pillar 43 beside the Assyrian banduddû and Olmec pouch; hands meeting on
    T-pillar and moai bellies—remain subjectively striking in a way that neither
    the broad 55 % / 37 % motif baselines nor the kind-matched lineup controls
    have quantitatively dissolved, leaving open the possibility that a
    yet-untested specific-feature coding or an older common source could still
    explain the residual resemblance.
