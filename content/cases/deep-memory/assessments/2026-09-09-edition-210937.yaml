  synthesis: "The ledger holds twelve evidence records, all weak, all from one source: the founder's self-published, AI-assisted home page reporting its own unaudited experiments. No primary text — excavation report, wear study, statue study, chronicle, ritual text — has been retrieved. On that footing the featured hypothesis (that the resemblances record a shared past) can be neither supported nor refuted, and the verdict is unresolved. The word is chosen, not defaulted to: the alternative verdicts each require a record the ledger lacks. Such evidence as exists leans toward the conventional accounts. The catalogue experiment reports base rates of 55% (bird-person) and 37% (cosmic serpent) for broad classes, which make a bird-man or a serpent in two cultures expected rather than surprising (DEEP-E013, E016), though the page's own qualifiers (E018, E019) note uneven coverage and that broad classes are not the specific images. Its headline null — the motif bundle does not stand out against comparison bundles (C057) — has no supporting record at all. The only record pointing toward resemblance beyond base rates is the V1 civiliser lineup (E020, E021: 62.5% vs 9%), which the page itself confounds with recognisable, compressed modern accounts — exactly the retelling mechanism (C034). The image pilots' one recorded finding (E022) is that kind-matched controls change lineup results, a warning about every side-by-side gallery. The single evidence record whose removal would most change the case verdict is DEEP-E020: without it nothing in the ledger points toward a resemblance beyond base rates, and the case would tilt from unresolved toward weakly supported for convergence and retelling."
  steelman: The strongest case for a shared past that this assessment does not answer has two parts. First, the only evidence in the ledger that could count against a common source — the catalogue experiment's finding that the motif bundle does not stand out — tests broad narrative classes, and the page concedes (E019) that broad classes are not the specific images or place names in the claim. A composite of profile head, bent limb and rounded form, or of handle attachment, proportion and decoration, has never been counted against a control set; so the null result has not actually been aimed at the hypothesis it is taken to undermine. Second, the V1 lineup produced a measured signal (62.5% first-rank against 9% for random pairs) under stated conditions, and the objections to it — recognisability, compression — are reasons, not measurements; until the blind human rerun is done, the one experiment in the ledger with a result favours the resemblance being real. Neither point changes a verdict, because neither adds a record; both name the test that would.
