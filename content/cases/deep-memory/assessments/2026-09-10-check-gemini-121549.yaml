  synthesis: >-
    The "Deep Memory" hypothesis proposes that striking iconographic and
    mythological similarities across distant ancient cultures—including
    bird-headed figures, handled "handbag" shapes, sacred navel toponyms,
    feathered serpents, civilising culture-bringers, and flood
    narratives—reflect a shared ancestral tradition, prehistoric contact, or an
    undocumented common civilisational source. In weighing the ledger, we
    evaluate this overarching hypothesis against both diffusionist claims and
    models of independent cognitive and cultural convergence.

    Steelmanning the deep memory hypothesis, proponents point to specific,
    highly idiosyncratic structural alignments across traditions that resist
    dismissal as pure coincidence. In the ledger, the Deep Memory V1 civiliser
    lineup experiment (DEEP-E020, DEEP-E021) offers preliminary quantitative
    support, showing that paired culture-bringer narratives (such as Oannes,
    Viracocha, and Quetzalcoatl) ranked first in 62.5% of completed lineups
    compared to only 9% for random controls. Furthermore, proponents argue that
    the recurrent clustering of non-obvious motifs—such as an anthropomorphic
    figure paired with an arched-handled container at Pre-Pottery Neolithic
    Göbekli Tepe, Iron Age Assyria, and Formative Mesoamerica—presents an
    aesthetic specificity that exceeds what independent invention would generate
    from material constraints alone.

    Conversely, the countervailing evidence and methodological principles in the
    ledger indicate that these apparent parallels are largely artifacts of high
    baseline ubiquity, psychological convergence, and retrospective grouping. As
    demonstrated by the catalogue experiment (DEEP-E013, DEEP-E016), motifs such
    as bird-men (55%) and cosmic serpents (37%) represent common baseline
    elements across global traditions, and bundling them together does not stand
    out statistically against documentation-preserving baselines (DEEP-C057).
    Moreover, the image pilots show that visual resemblance is heavily
    confounded by object kind (DEEP-E022), indicating that AI and human
    observers respond to generic morphological formats rather than shared
    genetic traditions. These motifs are separated by thousands of miles and
    many millennia (e.g., Göbekli Tepe c. 9000 BCE vs. Rapa Nui c. 1200 CE)
    without intermediate material sequences.

    Sensitivity analysis shows that the single evidence record whose removal
    would most change this case verdict is DEEP-E020. This record provides the
    sole empirical signal in the ledger showing above-chance cross-cultural
    narrative alignment. If DEEP-E020 were removed, the verdict of weakly
    supported would not survive, as the hypothesis of an ancestral common source
    would possess zero affirmative quantitative evidence in the ledger, reducing
    the case entirely to unresolved or contradicted by baseline motif ubiquity.
  steelman: The precise co-occurrence of the specific arched handled-bucket motif
    held by ritual figures across Pre-Pottery Neolithic Anatolia, Mesopotamia,
    and Mesoamerica constitutes an idiosyncratic feature combination that simple
    single-motif baseline frequencies fail to explain away.
