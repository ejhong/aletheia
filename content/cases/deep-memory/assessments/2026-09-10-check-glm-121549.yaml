  synthesis: "This case opened as an open question with an empty ledger, and the
    assessment reflects that state honestly: the featured hypothesis — that part
    of the cross-cultural resemblance in bird-men, handled objects, navel names,
    civilisers and flood stories belongs to a shared past — is neither
    established nor contradicted by anything currently in the ledger. The
    evidentiary weight sits almost entirely on the founder's self-published
    page, and every quantitative result is a weak self-report whose run data
    were not retrieved. The directional content runs mostly against the strong
    shared-past reading: the catalogue's three broad motif classes are
    individually common but their bundle reportedly does not stand out
    (DEEP-C057, itself only caveat-attested), and the image pilots showed that
    the measuring instruments are unstable — kind-matching changes lineup
    results (DEEP-C038) and judges disagree. The one positive signal for
    resemblance being real rather than invented is the civiliser lineup effect
    (DEEP-C027, 62.5% vs 9%), but it is an unaudited self-report from exactly
    the kind of AI-judge instrument the site's own pilots flagged, and the site
    itself names its reliance on compressed modern retellings as the confound.
    The methodological claims (C002, C026, C035, C065) all converge on the same
    structural point — resemblance requires dates, contexts and independently
    evidenced connections before it carries historical meaning, and a
    lost-civilisation source adds claims similarity alone cannot supply — but
    none of them yet has an evidence record; their verdicts lean on general
    background and say so. The historical observation claims (C044, C012, C018,
    C028, C053, C059, C047) are plausible against standard scholarship but
    currently hang on no primary source read into the ledger. Verdicts of
    unresolved on C015, C031, C037 and C054 are substantive findings: those
    claims have no supporting evidence records at all, not merely weak ones.
    Sensitivity: removing DEEP-E020 (the lineup result's first record) would
    leave the pro-hypothesis side with nothing quantitative in the ledger, but
    the case verdict of unresolved survives, because weak self-reports cannot
    settle a case whose own founding method demands primary, retrievable,
    replicable evidence."
  steelman: "The civiliser lineup result stands unrebutted: claimed partner
    figures ranked first in 62.5% of completed lineups against 9% for random
    pairs, a sevenfold effect. If even partially real, independent invention
    should not make matchings to claimed partners hit seven times chance, and
    this assessment cannot explain the effect away on the ledger's contents
    because the run data were never retrieved and the confound (similarity
    manufactured by modern compressed retellings) is acknowledged but untested.
    A proponent can also add the Jiroft handle-wear observation — a functional
    trace, not merely a shape — and the co-occurrence of handled objects,
    bird-men and navel names across three continents as a conjunction no
    evidence record here explains."
