caseAssessment:
  verdict: unresolved
  whatIsClaimed: That a set of recurring forms and stories — bird-headed figures, small handled objects, hands folded on the body of a stone figure, sacred centres named as a navel, feathered serpents, teachers who arrive, bring the arts and depart, floods that few survive — appear across distant ancient cultures (Göbekli Tepe, Nimrud, Jiroft, La Venta, Delphi, Cusco, Tiwanaku, Rapa Nui) because they descend from a shared past, whether one common source or long-distance contact, rather than arising independently or being assembled after the fact by retelling and comparison.
  whereDisagreementLives: Not in whether the outlines rhyme — everyone agrees they do — but in four places. Whether the broad classes' high base rates dispose of the parallels, or whether the specific composites are rarer than chance (no count exists). Whether the civiliser lineup signal measures the original accounts or the modern summaries that compress them. Whether the four navel names share anything beyond a bodily metaphor, given their different languages, dates and users. And whether resemblance can be measured at all when kind-matched controls change the ranking and AI judges disagree.
  whatWouldSettleIt: "For the shared-past account: dated intermediates and a plausible route for any one parallel; a specific composite (pose plus object plus arrangement; handle attachment plus proportion plus decoration) occurring across the compared objects more often than across a kind-matched control set from unconnected cultures; a blind human lineup of original civiliser passages that beats random pairs by a margin like V1's; an early, builder-attested navel usage at two or more sites. Against it: the catalogue's bundle comparison data released and holding under narrower classes; the blind rerun collapsing toward chance; source histories showing the Göbekli name modern and descriptive, the Cusco gloss colonial, the Viracocha identification modern; the Rapa Nui birdmen dated centuries after their statue; the Göbekli handled forms identified as something other than containers."
  bestConventionalExplanation: "Broad motif classes are common everywhere — a bird-person in more than half of sampled traditions, a cosmic serpent in more than a third — so meeting them in two cultures is the expectation, not the anomaly. Shared bodies, animals, materials and practical problems produce convergent forms: a handle is how anyone carries a thing, hands against a stone body are how a monolith keeps its arms. The compared set is selected for resemblance from a very large pool of objects, and comparing unlike kinds inflates the likeness that kind-matched controls remove. Stories converge through translation, comparative writing and missionary contact, so compressed modern summaries of Oannes, Viracocha and Quetzalcoatl are more alike than their originals. The navel names are four languages recorded across two and a half millennia, one of them a modern Turkish description of a mound's shape."
