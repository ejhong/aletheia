caseAssessment:
  verdict: unresolved
  whatIsClaimed: "That a set of recurring forms and stories appear across distant ancient cultures because they descend from a shared past — one common source, or long-distance contact — rather than arising independently or being assembled after the fact by retelling and comparison. The features admitted evidence carries are: small handled objects (three box-like forms with handle-like attachments on Göbekli Tepe's Pillar 43, the Assyrian ritual bucket, a Halil Rud chlorite object worn as if hung on a cord); bird-headed figures, among them two birdmen carved onto the back of the Rapa Nui statue Hoa Hakananai'a; a teacher from the sea who brings the arts, in Berossus's Oannes; and hands held against the body of a stone figure, in Urfa Man. Held here on anchors only: sacred centres named as a navel, the feathered serpent's antiquity, and flood stories that few survive."
  whereDisagreementLives: Not in whether the outlines rhyme, nor now in what most of the objects are — the primaries confirm the descriptions — but in five places. Whether the broad classes' high base rates dispose of the parallels, or whether the specific composites are rarer than chance (no count exists). Whether the civiliser lineup signal measures the original accounts or the modern summaries that compress them. Whether any dated intermediate can be produced for any parallel, given that the excavators themselves report missing links and the Rapa Nui birdmen are additions read against a nineteenth-century text. Whether the four navel names share anything beyond a bodily metaphor, given their different languages, dates and users. And whether resemblance can be measured at all when kind-matched controls change the ranking.
  whatWouldSettleIt: "For the shared-past account: dated intermediates and a plausible route for any one parallel — most concretely, a securely dated Neolithic seal from Upper Mesopotamia carrying a specific Pillar 43 motif a millennium or more after the site; a specific composite (pose plus object plus arrangement; handle attachment plus proportion plus decoration) occurring across the compared objects more often than across a kind-matched control set from unconnected cultures; a blind human lineup of original civiliser passages that beats random pairs by a margin like V1's; an early, builder-attested navel usage at two or more sites. Against it: the catalogue's bundle comparison data released and holding under narrower classes; the blind rerun collapsing toward chance; source histories showing the Göbekli name modern and descriptive, the Cusco gloss colonial, the Viracocha identification modern; a team publication committing the three Göbekli forms to buildings rather than containers; the Hoa Hakananai'a reliefs dated in absolute terms to the post-contact period."
  bestConventionalExplanation: "Broad motif classes are common everywhere — a bird-person in more than half of sampled traditions, a cosmic serpent in more than a third, by the page's own count — so meeting them in two cultures is the expectation, not the anomaly. Shared bodies, animals, materials and practical problems produce convergent forms: a handle is how anyone carries a thing, hands against a stone body are how a monolith keeps its arms. The compared set is selected for resemblance from a very large pool of objects, and comparing unlike kinds inflates the likeness that kind-matched controls remove. The compared pieces are far apart in time and, where dated, late: the Rapa Nui birdmen are additions to an older statue and are read by their students against a myth recorded after European contact, and the Göbekli excavators report no established chain from their imagery to anything later. Stories converge through translation, comparative writing and missionary contact, so compressed modern summaries of Oannes, Viracocha and Quetzalcoatl are more alike than their originals. The navel names are four languages recorded across two and a half millennia, one of them a modern Turkish description of a mound's shape."
