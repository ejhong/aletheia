  synthesis: "The ledger now holds two kinds of record. The founder's self-published page supplies the experiments: base rates of 55% for a broad bird-person class (DEEP-E013, on DEEP-C005) and 37% for a cosmic serpent (DEEP-E016, on DEEP-C025), both qualified by the page's own notes on uneven coverage and on broad classes not being the specific images (DEEP-E018, DEEP-E019); the V1 civiliser lineup at 62.5% against 9% (DEEP-E020, DEEP-E021, on DEEP-C027); and the image-pilot finding that kind-matched controls change a lineup result (DEEP-E022, on DEEP-C038). All are weak self-reports. Seven primary or near-primary texts now decide object-level questions: the excavators describe the Pillar 43 forms as box-like with handle-like attachments (DEEP-E025, on DEEP-C067) and state that no final decision on their meaning is possible (DEEP-E028, on DEEP-C012); the Jiroft object's published abstract reads its wear as long suspension on a cord (DEEP-E035, on DEEP-C009), on a single object and 'far from being granted' (DEEP-E038); Wiggermann, via an unchecked transcription, names the banduddû as the reliefs' bucket, filled with water and sprinkled (DEEP-E055, on DEEP-C044); the Hoa Hakananai'a abstract places the bas-reliefs after the komari, which were added after the statue was made (DEEP-E068, DEEP-E069, on DEEP-C059), and reads them against the birdman myth as recorded in the nineteenth and early twentieth centuries (DEEP-E071, on DEEP-C080); Berossus's first fragment gives Oannes a fish body with a human head beneath (DEEP-E043, on DEEP-C081) and the teaching of cities, temples and laws (DEEP-E046, on DEEP-C092), and the translators align him with U-An, first of the apkallu (DEEP-E079, on DEEP-C086); the Urfa Man post has both hands grabbing the penis (DEEP-E081, on DEEP-C021); and a team member states there are too many missing links to be sure of any survival of the site's imagery into later periods (DEEP-E061, DEEP-E062, on DEEP-C072). None of these tests the thesis; they confirm what the objects are and, in two cases, remove a rung — the Rapa Nui birdmen are late additions read against a post-contact text, and the excavators report no established chain toward later Near Eastern imagery. The bundle null (DEEP-C057) still has no supporting record; the navel names, the Viracocha label, the flood coding and the AI judges' disagreement are anchor-only. The featured hypothesis therefore stands neither supported nor refuted, and the verdict is unresolved — chosen, because 'contradicted' would need the composite count or the blind lineup to have come out against it, and any supported grade would need a record pointing toward a shared past beyond base rates. Such evidence as exists leans toward convergence and retelling. The single record whose removal would most change the case verdict is DEEP-E020: without it nothing in the ledger points toward a resemblance beyond base rates, and the case would tilt from unresolved toward weak support for the conventional accounts."
  steelman: "The strongest case for a shared past that this assessment does not answer has three parts. First, the only evidence that could count against a common source — the page's report that the motif bundle does not stand out against comparison bundles — tests broad narrative classes, and the page itself concedes (DEEP-E019) that broad classes are not the specific images or place names in the claim; a composite of profile head, bent limb and rounded form, or of handle attachment, proportion and decoration, has never been counted against a control set, so the null has not been aimed at the hypothesis it is taken to undermine. Second, the V1 lineup produced a measured signal (DEEP-E020, DEEP-E021) under stated conditions, and the objections to it — recognisability, compression — are reasons, not measurements; until the blind human rerun is done, the one experiment in the ledger with a result favours the resemblance being real. Third, every primary read so far has confirmed the founder's descriptions rather than corrected them: the Göbekli forms are handle-like in the excavator's own words (DEEP-E025), the Jiroft object hung on a cord (DEEP-E035), the banduddû is a ritual bucket (DEEP-E055), Oannes is fish-bodied and teaches the arts (DEEP-E043, DEEP-E046) — so proponents can say the parallel is drawn between correctly described things, and that 'function unknown' at Göbekli Tepe is not 'function known to be other than a container'. Proponents read Berossus's remark that Oannes's form was preserved in sculpture (DEEP-E044) as tying the text to the fish-cloaked figures; the fragment does not itself say which sculpture. None of this changes a verdict, because none adds a record pointing to a connection; each names the test that would."
