  synthesis: "This case opened question-only, and the ledger built since
    2026-09-09 supports a mixed structural finding: the best-evidenced claims in
    the packet are methodological and cautionary, the data-bearing statistical
    claims are all weak self-reports of the founder's own unaudited experiments,
    and the featured hypothesis — that a shared past explains part of the
    cross-cultural resemblance — has no record in the ledger that positively
    supports it, and none that refutes it either. On the sceptical side, the
    strongest anchors are primary: DEEP-E028 records the excavation team's own
    published statement that no final decision on the meaning of Pillar 43's
    three forms is possible (DEEP-C012, well supported at moderate confidence),
    and DEEP-E035/E038 record the Vidale & Micheli abstract's cord-suspension
    reading with its single-object caveat (DEEP-C009, provisionally supported).
    Together these make the handled-object comparison a comparison of shapes
    with one leg functionally unanchored. The excavators' \"missing links\"
    reply (DEEP-C072) and the kind-matching pilot result (DEEP-C038) reinforce
    that no dated intermediate chain and no stable AI resemblance measure
    currently exist. On the other side, the only positive quantitative signal —
    the 62.5% versus 9% lineup result (DEEP-C027) — is a self-report whose run
    data were never retrieved, and the catalogue findings on which the bundle
    argument turns (DEEP-C056, DEEP-C057) have only qualifying records, no
    extracted support, so they cannot carry weight in either direction.
    Sensitivity: the single record whose removal would most change the case is
    DEEP-E028; without the team's own \"no final decision\" statement, the
    handled-object uncertainty rests on the founder's caption alone, DEEP-C012
    drops to weakly supported, and the case verdict would slide from mixed
    toward unresolved at low confidence. The mixed verdict survives its removal,
    but barely. Steelmanning the hypothesis: nothing in the ledger explains away
    the civiliser-lineup signal, and the \"missing links\" agnosticism is
    symmetric — absence of documented intermediates is not evidence of their
    absence, so a proponent can rightly say the transmission account has been
    neither tested nor defeated by anything retrieved so far."
  steelman: "The founder's V1 lineup result (DEEP-C027: claimed civiliser partners
    ranked first in 62.5% of completed lineups against 9% for random pairs) is a
    quantitative, falsifiable signal that the deep correspondences in civiliser
    narratives exceed chance structure, and nothing in this assessment's
    evidence base explains it away — I discounted it only as an unaudited
    self-report, which is a provenance objection, not a rebuttal of the signal
    itself; if DEEP-R003's human-rater, source-level rerun reproduces it, no
    record in this ledger currently accounts for why claimed partners would
    systematically outrank random pairs."
