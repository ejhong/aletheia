  synthesis: >-
    Interpreted as the hypothesis that the cross-cultural resemblances
    highlighted by Deep Memory substantially preserve a shared ancient source,
    the case remains unresolved. The evidence establishes several local
    observations, but those observations do not form a dated transmission chain.
    Schmidt's description in DEEP-E025 strongly confirms that Pillar 43 has
    three box-like forms with handle-like attachments. DEEP-E035 reports that
    one Iranian chlorite object bears wear interpreted as prolonged suspension
    from a cord, while DEEP-E055 weakly supports a ritual water-and-sprinkling
    function for the Assyrian banduddû. DEEP-E068 and DEEP-E069 place the
    birdman-related reliefs on Hoa Hakananai'a after the statue's manufacture.
    The Berossus records establish a fish-bodied civilising figure and provide
    contextual support for an Oannes–apkallu relationship. These findings show
    that the underlying comparisons are not all inventions of captions: some
    component forms and narratives are genuinely attested.

    The strongest argument for shared memory is therefore cumulative.
    Handle-like forms, bird-human imagery, and civilising figures with unusual
    attributes occur in multiple settings, while the self-reported civiliser
    lineup in DEEP-E020 and DEEP-E021 says the proposed partners outperformed
    random pairings. Transmission, inheritance, and later retelling are
    scientifically possible explanations, and regional persistence may
    eventually be demonstrated through dated intermediates. Nothing in the
    ledger proves independent invention for every comparison.

    The strongest argument against the featured hypothesis is structural rather
    than merely consensual. The records do not connect the compared objects
    through chronology, geography, descent, or a mechanism of contact. DEEP-E028
    says the function of the Pillar 43 forms remained undecided, so their
    resemblance to portable containers does not establish shared function.
    DEEP-E061 and DEEP-E062 explicitly identify missing intermediate links and
    possible changes of meaning. The catalogue frequencies and lineup results
    are founder self-reports whose data and methods were not retrieved; the
    records attached to DEEP-C057 qualify coverage and category breadth but do
    not actually document the claimed non-standout bundle result. The flood
    clustering claims and the reported inter-judge disagreement have no
    supporting evidence records at all. Thus neither a transmission model nor a
    convergence model has received a decisive comparative test.

    This warrants unresolved rather than contradicted: the packet lacks
    affirmative evidence for the required common-source chain, but its negative
    findings are too weak, incomplete, or methodologically underexposed to
    exclude one. It also warrants unresolved rather than weakly supported
    because verified resemblance is not itself evidence that one historical
    source generated the instances. Sensitivity centers on DEEP-E025, the
    strongest primary record confirming a central handle-like visual parallel.
    Removing it would materially weaken the positive observational basis, but
    the case verdict survives because the remaining evidence still neither
    supplies nor excludes a dated transmission chain; the verdict does not hang
    on one record.
  steelman: "The ledger does not test the proponent's strongest prediction: that
    the full, specific conjunctions of pose, associated animal, handled form,
    narrative role, and spatial arrangement are far rarer under independent
    invention than the broad bird, serpent, or sacred-centre categories used in
    the pilots. No blinded study of securely dated objects and original-language
    texts measures those conjunctions or systematically searches the proposed
    intermediate route."
