  synthesis: "The ledger's evidence base is thin, heavily weighted toward
    methodological cautions and local archaeological statements rather than
    positive demonstrations of deep shared ancestry or long-distance
    transmission. Foundational claims such as DEEP-C002, DEEP-C026 and DEEP-C035
    correctly insist that visual or narrative resemblance alone never assigns
    historical meaning, cannot separate independent invention from ancient
    transmission on geography alone, and cannot underwrite lost-civilisation
    identity/date/capability claims; these rest on ordinary historiographic
    standards and are reinforced by the excavators' own agnostic stance on
    missing links (DEEP-C072) and by the absence of secure functional
    identifications for the Göbekli forms (DEEP-C012, backed by Dietrich 2016).
    Catalogue and lineup self-reports (DEEP-C005, DEEP-C025, DEEP-C056,
    DEEP-C057, DEEP-C027) indicate that broad bird-person and cosmic-serpent
    classes are common while their co-occurrence bundle does not stand out under
    documentation-preserving controls, and that AI civiliser pairings exceed
    random baselines; yet every such figure is an unaudited author report whose
    underlying data, coding rules and incomplete runs remain unretrieved, so
    they function only as weak internal baselines. Primary or near-primary
    fragments that do exist settle narrower points: Schmidt 2006 and Dietrich
    confirm the three box-like handle-like forms and the team's refusal of a
    final reading; Vidale & Micheli's abstract supports cord-suspension wear on
    one Jiroft specimen while immediately limiting the inference; Pitts et al.
    abstract establishes that Hoa Hakananai'a birdman bas-reliefs post-date
    manufacture; Berossus F1 and the translators' table supply the fish-body
    description and an U-An alignment without closing the apkallu-iconography
    loop. Hands-on-body poses admit material-constraint contributions
    (DEEP-C047) without deciding symbolism; navel names and Viracocha labelling
    lack source-history primaries and stay open. Taken together the records show
    that many of the striking side-by-side resemblances dissolve once dates,
    functions, later additions, retellings and category breadth are admitted,
    yet they supply no decisive positive chain of dated intermediates that would
    quantify a shared-past residue. The case therefore remains unresolved: the
    evidence neither establishes a substantial deep-memory contribution nor
    fully eliminates the possibility that some residual pattern still requires
    explanation beyond convergence, constraint and modern looking. Sensitivity
    is highest to DEEP-E028 (Dietrich's no-final-decision statement); without it
    the handled-object uncertainty softens and the overall caution against
    over-reading shape parallels weakens, yet the methodological core and the
    missing-links stance still leave the shared-past fraction unquantified, so
    the unresolved verdict survives."
  steelman: The persistent, multi-motif visual clustering (bird-headed figures
    holding handled objects beside navel-named centres and civilising teachers)
    that the catalogue bundle test and kind-matched lineups still fail to
    dissolve completely once documentation bias is controlled, leaving an
    unexplained residual co-occurrence that independent invention and material
    constraint have not yet accounted for in the retrieved records.
