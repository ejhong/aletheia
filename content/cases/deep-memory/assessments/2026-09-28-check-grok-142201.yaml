  synthesis: >-
    The founding question asks how much of the observed resemblances among
    bird-men, handled objects, navel names, feathered serpents, civilising
    teachers and flood stories across distant cultures records a shared past
    (deep transmission or lost source) versus independent invention, convergence
    under shared human cognition and material constraints, or later retelling
    and comparative writing. The ledger's evidence records do not resolve the
    quantitative "how much." They do, however, establish several load-bearing
    negative and scoping results that keep any strong shared-past reading from
    rising above unresolved. Methodological claims (C002, C035, C026, C065) are
    the strongest: historical meaning of resemblance requires dates, contexts,
    differences and possible connections; motif similarity alone cannot
    establish a lost-civilisation source's identity, date or capabilities; a
    catalogue's geographical distribution of broad classes cannot by itself
    distinguish independent invention from very old transmission; and shape and
    function of handled objects are separate questions. These are supported
    either directly by excavator statements or by the internal logic of the
    experiments themselves, and they align with ordinary archaeological
    standards rather than depending on priors alone.

    On the concrete motifs the picture is uneven and mostly weak or provisional.
    The three handled forms on Göbekli Tepe Pillar 43 have no secure functional
    identification (C012, C066), confirmed by the excavation team's own 2016
    statement that a final decision on meaning is not possible; any survival of
    Early Neolithic imagery into later Near Eastern objects remains
    unestablished because of missing links (C072). The Jiroft chlorite handbag
    shows wear consistent with long suspension on a cord (C009), but the authors
    themselves limit the inference to a single object. Assyrian banduddû is
    textually a ritual bucket used for sprinkling (C043–C044), yet the link is
    second-hand via a blog transcription. Birdman carvings on Hoa Hakananai'a
    post-date the statue (C059), supported at abstract level by Pitts et al.
    Catalogue frequencies (bird-person 55 %, cosmic-serpent 37 %, three broad
    classes widespread) and the non-standing-out of their bundle (C005, C025,
    C056, C057) are self-reports of the founder's unaudited experiment on an
    uneven 2016 catalogue; they supply baselines but cannot decide transmission
    versus invention. Civiliser lineup rates (62.5 % vs 9 %) and flood-detail
    regional clustering plus uneven Genesis distribution (C027, C031, C054) are
    likewise self-reports of pilots whose raw data and full methods are not in
    the ledger. Image-pilot findings that AI judges disagree and that
    kind-matching changes rankings (C037, C038) further caution that perceived
    resemblance is method-sensitive.

    Navel-name claims remain thin: the four names differ in language, date of
    first record and builder usage (C018) is methodologically sound but largely
    untested by primary attestations; the Turkish toponym as shape-descriptive
    (C015) lacks independent sourcing in the packet. Oannes–apkallu
    correspondence (C053) rests on Berossus F1's fish-body description plus a
    translators' secondary table aligning Oannes with U-An; the iconographic
    half is not secured here. Material constraints as a contributor to
    hands-on-body poses (C047) is mechanistically plausible but not measured.
    Collectively the evidence therefore supports the negative half of the
    founding question (resemblance is not self-interpreting; many specific
    functional and chronological links are missing or modern) far more robustly
    than any positive deep-shared-past account. No dated intermediate chain, no
    replicated statistical excess of the specific motif bundle beyond
    documentation bias, and no primary demonstration that the civiliser or flood
    templates pre-date known literary horizons appear in the records. The case
    therefore stays unresolved: the resemblances are real enough to notice, the
    methodological barriers to reading them as deep memory are well-supported,
    and the positive transmission hypothesis retains only the residual force of
    the unexplained visual matches that the experiments have not yet dissolved.
  steelman: The immediate, cross-cultural visual match of the three arched handled
    forms on Göbekli Pillar 43 with the Assyrian banduddû and the Olmec pouch,
    which remains striking even after function is declared uncertain and shape
    is separated from use, and which no retrieved intermediate or convergence
    model has yet dissolved into ordinary independent invention.
