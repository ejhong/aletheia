  synthesis: "This case asks whether cross-cultural resemblances — bird-men,
    handled objects, navel names, civilisers, floods — record a shared past or
    arise from independent invention and retelling. On the ledger as it stands,
    neither answer is earned. The only quantitative signal pointing toward the
    shared-past reading is the V1 civiliser lineup result (DEEP-C027: 62.5% vs
    9%), and it rests entirely on the founder's self-report of his own unaudited
    experiment, with run data never retrieved; the same site's pilots then
    showed that kind-matching changed lineup results (DEEP-C038, itself only
    weakly self-reported), which is the proponent's own caveat against
    overreading V1. The catalogue frequencies (55%, 37%; DEEP-C005, DEEP-C025)
    are likewise self-reports, and the one result that would make the motif
    bundle diagnostic — that the three-class bundle stands out against
    documentation-preserving comparisons (DEEP-C057) — has no supporting record
    at all; the site's own qualifications about uneven coverage are the only
    records touching it. On the sceptical side, the key method claims
    (DEEP-C026, DEEP-C034, DEEP-C035) have no evidence records in the ledger, so
    the case cannot currently say that resemblance fails to discriminate either;
    the strongest sceptical datum actually retrieved is the excavator's 'missing
    links' reply (DEEP-C072), which is a weak, informal comment-thread
    statement. What the ledger does establish is mostly local and
    non-diagnostic: the Pillar 43 forms have no secure function per the team
    (DEEP-C012, well supported), the Jiroft handbag's cord-suspension wear
    reading is real but single-object and abstract-level (DEEP-C009), the Hoa
    Hakananai'a reliefs postdate the statue (DEEP-C059, the best-evidenced claim
    in the ledger), and the banduddû ritual reading rests on an unchecked
    secondhand transcription (DEEP-C044). Every well-supported claim concerns a
    single object or site; none connects two cultures. The honest verdict is
    unresolved: the transmitted-past hypothesis is neither supported nor
    contradicted by retrieved evidence, and the strongest pro-hypothesis datum
    is precisely the one whose audit is missing. No prior-assessment or outside
    information enters this judgement; where a claim's verdict rests on general
    plausibility rather than records, the per-claim reasoning says so."
  steelman: "The Berossus half of the civiliser parallel is now documented at
    source level, not from the founder's page: fragment F1 in a scholarly
    translation records Oannes as a fish-bodied figure from the sea who taught
    writing, mathematics, city-building, temple-founding and law-making
    (DEEP-E043, DEEP-E046), and the translators' table aligns him with U-An,
    first of the apkallu (DEEP-E079). A proponent can rightly say that this
    specific template — arrives from water, brings the arts of civilisation, is
    fish-cloaked — matches figures reported from the Americas, and that nothing
    in this ledger explains that resemblance away: the retelling-convergence
    mechanism (DEEP-C034) has no evidence records, the V1 lineup's
    62.5%-versus-9% result is unrebutted by any retrieved run data, and no
    record in the ledger demonstrates that compressed modern retellings
    manufactured the similarity. The one experiment that measured the
    resemblance found it far above chance, and this assessment has no retrieved
    evidence that the measurement is wrong — only that it is unaudited."
