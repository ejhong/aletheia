  synthesis: >-
    Interpreted as the hypothesis that the distant resemblances substantially
    preserve a shared source or transmission history, the case is unresolved.
    The packet establishes several local propositions, but local truth does not
    supply the historical links needed for the larger inference. The Jiroft
    study reports wear interpreted as long suspension on a cord, while the
    Assyrian material weakly supports a ritual water-bucket interpretation.
    Neither result identifies the uncertain forms on Göbekli Tepe Pillar 43 or
    connects the three traditions. Likewise, the later addition of birdman
    reliefs to Hoa Hakananai'a is reasonably supported, but that chronology
    supplies no transmission chain to earlier bird-human imagery. The Oannes
    records support a fish-bodied civilising figure within Mesopotamian
    tradition and a scholarly Oannes–U-An alignment, but the packet does not
    complete the iconographic identification or extend it to distant civilisers.

    The strongest case for shared history is the reported civiliser-lineup
    asymmetry: claimed partners allegedly ranked first in 62.5% of completed
    lineups, compared with 9% for random pairs. That is potentially
    discriminative rather than a mere assertion that two selected images look
    alike. The reported bird-person and cosmic-serpent frequencies also show
    that the project attempted quantitative baselines. However, all three
    numerical results are founder self-reports without retrieved run data,
    coding rules, completeness counts, or an independent replication. Moreover,
    no evidence record actually states the claimed result that the three-motif
    bundle failed to stand out, and no records substantiate the flood-clustering
    results. These omissions prevent either positive or negative statistical
    conclusions.

    The strongest case against the hypothesis is structural. Resemblance and
    broad geographical frequency are compatible with transmission, convergence,
    selection, and later retelling; they cannot alone identify a source, date,
    or capabilities. The excavation-team material also says that too many
    intermediate links are missing to establish survival of the Göbekli imagery
    into later periods. The image-pilot report that kind-matched controls
    changed a lineup result further indicates that comparison-set construction
    can generate or erase apparent distinctiveness. Nevertheless, these
    considerations do not demonstrate independent invention and therefore do not
    contradict transmission.

    The single evidence record whose removal would most change the balance is
    DEEP-E020, the only record giving the claimed partners' 62.5% first-place
    rate. Without it, DEEP-E021 supplies only the random-pair baseline and the
    case loses its clearest positive quantitative observation. The unresolved
    verdict survives without DEEP-E020 and becomes, if anything, less favorable
    to the featured hypothesis; the verdict therefore does not hang on that
    record.
  steelman: The reported civiliser-lineup asymmetry—claimed partners ranking first
    in 62.5% of completed lineups against 9% for random pairs—is the strongest
    unanswered pro-hypothesis observation. Because the underlying lineups,
    exclusions, source passages, and coding data were not supplied, this
    assessment cannot determine whether independently recorded civiliser
    accounts contain a rare shared bundle that ordinary hero narratives lack.
