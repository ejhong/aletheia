    verdict: well_supported
    reasoning: "No evidence record attaches to this claim, so the verdict rests on
      inference, disclosed: contact, common inheritance, convergence and chance
      all predict resemblance, and only dates, contexts, differences and
      possible routes can separate them. The ledger's records illustrate the
      principle rather than test it: the Hoa Hakananai'a birdman reliefs turn
      out to be a later addition read against ethnohistoric texts (DEEP-E068,
      DEEP-E069, DEEP-E071), and the excavators leave the Pillar 43 forms
      functionally undecided, floating a building reading (DEEP-E025,
      DEEP-E028). The strongest opposing consideration is the old diffusionist
      criterion of form and quantity, on which a specific, arbitrary, many-part
      resemblance can make independent invention improbable without any dates.
      Applying that criterion already means weighing differences and
      constraints, and it cannot supply direction or timing, so the claim holds
      for historical explanation in the full sense."
