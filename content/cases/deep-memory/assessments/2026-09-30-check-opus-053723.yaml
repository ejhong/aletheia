  synthesis: >-
    I read the featured hypothesis as the case title's: that a material share of
    the resemblance between the bird-men, handled objects, navel names,
    feathered serpents, civilisers and flood stories records a shared past (a
    common source, long-distance contact or very old transmission) rather than
    convergent image-making and later retelling. On this ledger that hypothesis
    is unresolved. The evidence is not neutral, but no record discriminates a
    shared past from convergence for any cross-cultural pair.

    The best-supported claims are methodological. They explain why the
    resemblance data cannot settle the question alone. Historical meaning needs
    dates, contexts and differences (DEEP-C002). A broad class's distribution
    cannot by itself separate invention from ancient transmission (DEEP-C026).
    Similarity cannot establish a lost source's identity, date or capabilities
    (DEEP-C035), which leaves the lost-civilisation variant without any
    evidential footing. The quantitative legs are thin. The catalogue
    frequencies (DEEP-C005, DEEP-C025, DEEP-C056) and the civiliser lineup
    (DEEP-C027) rest on quoted self-reports of unaudited experiments. Their
    source's own record is still flagged unverified, so I grade them weakly
    supported. The bundle null (DEEP-C057), the flood clustering (DEEP-C031,
    DEEP-C054) and the judge disagreement (DEEP-C037) have no evidence record at
    all, only anchors on the founder page, so I grade them unresolved.

    Where primary sources have been read, each resemblance resolves into a local
    object with a local date or function:

    - The Hoa Hakananai'a birdman reliefs are a later addition, read against a
    myth recorded in the nineteenth and early twentieth centuries (DEEP-C059).

    - The Pillar 43 forms are shapes the excavators decline to identify; they
    float a building reading (DEEP-C012).

    - The Jiroft object's handle wear is read as long suspension on a cord
    (DEEP-C009). The Assyrian bucket, on a secondhand transcription, held water
    for ritual sprinkling (DEEP-C044).

    - The Urfa Man statue grasps its genitals rather than joining hands on the
    belly (DEEP-E081).

    The one specialist statement on transmission finds too many missing links
    (DEEP-C072). This erodes the explanandum without testing the explanation.
    Survival with change of meaning, which the excavators themselves contemplate
    (DEEP-E062), also predicts local reinterpretation. Three motif families
    (serpents, floods, navel names) have no primary-source record at all.

    That is why the verdict is not 'contradicted'. Nor is it 'weakly_supported':
    nothing here favours a shared past over convergence, because resemblance is
    what is to be explained, not evidence for one explanation of it. Priors
    about geography and chronology weigh against the global-contact and
    lost-civilisation variants; that lean comes from background, not from the
    records.

    Steelman for a shared past: the one primary civiliser text in hand already
    carries the arrival from the sea and the teaching of cities, laws and
    agriculture (DEEP-E043, DEEP-E046), so that template is not a modern
    confection. The Göbekli–Assyria pairing is regional, and the excavators
    leave survival open. Steelman against: every leg examined dissolved into
    shape-only resemblance of the kind that handles, containers and closed stone
    bodies make generic. The lineup partners were pairs already claimed as
    equivalents. No record anywhere shows a chain.

    Sensitivity: the single most influential record is DEEP-E028, the team's
    statement that no final decision on the Pillar 43 forms is possible. Without
    it, the handled-object leg loses its clearest demonstration that shape and
    function part company. Schmidt's shape-only description (DEEP-E025) would
    still name no function. The verdict rests on the absence of any
    discriminating record rather than on one thread, so 'unresolved' survives
    the removal. The verdict would move with dated intermediates (DEEP-R004),
    the navel names' source histories (DEEP-R002) and blind human lineups on
    original passages (DEEP-R003).
  steelman: "The strongest unanswered argument is regional rather than global. On
    Pillar 43 at Göbekli Tepe a vulture is carved beside three box-like objects
    with handle-like attachments, each accompanied by an animal (DEEP-E025,
    DEEP-E026). Millennia later, in the same broad region, many figures on the
    Assyrian reliefs hold a bucket that the ritual texts name (DEEP-E086). The
    excavation team does not rule continuity out. It treats the survival of
    Early Neolithic imagery into later periods as possible and grounds its
    caution in missing links rather than counter-evidence (DEEP-E061). It also
    allows that anything that survived may have changed its meaning on the way
    (DEEP-E062). On that account, the functional divergence this assessment
    leans on (no identified function or a building reading at Göbekli Tepe, a
    water bucket for sprinkling in Assyria) is exactly what survival with
    reinterpretation predicts, so it does not count against a link. The deciding
    prediction is untested: that the specific handled-form or bird-and-object
    motifs recur on securely dated Neolithic stamp seals and later image-bearing
    objects in Upper Mesopotamia. The research agenda attributes that
    intermediate class to the excavators (DEEP-R004). Nothing in this assessment
    rules the continuity out."
