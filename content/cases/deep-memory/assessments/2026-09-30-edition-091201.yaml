  synthesis: "The case stays unresolved: primary sources settle what several compared objects are, but nothing tests whether any resemblance records a shared past. The founding page's experiments are weak self-reports: 55% for a bird-person class (DEEP-E013, on DEEP-C005) and 37% for a cosmic serpent (DEEP-E016, on DEEP-C025), qualified by uneven coverage and broad classes (DEEP-E018, DEEP-E019); the civiliser lineup at 62.5% against 9% (DEEP-E020, DEEP-E021, on DEEP-C027); kind-matched controls changing a lineup (DEEP-E022, on DEEP-C038). No record states the bundle null (DEEP-C057) or that all three classes are widespread (DEEP-C056). The primaries describe objects: handle-like forms (DEEP-E025, on DEEP-C067) whose meaning the team cannot decide (DEEP-E028, on DEEP-C012); Jiroft wear read as long suspension on a cord (DEEP-E035, on DEEP-C009), on one object (DEEP-E038); a ritual water bucket via an unchecked transcription (DEEP-E055, on DEEP-C044); Hoa Hakananai'a reliefs carved after komari added to the finished statue (DEEP-E068, DEEP-E069, on DEEP-C059), read against a myth recorded in the nineteenth century (DEEP-E071, on DEEP-C080); Oannes fish-bodied (DEEP-E043, on DEEP-C081) and teaching the arts (DEEP-E046, on DEEP-C092); and too many missing links to trace survival (DEEP-E061, DEEP-E062, on DEEP-C072). Two of these raise the cost of a shared past — one leg is late, no chain is established — without testing convergence. The navel names, the Viracocha label, the flood coding and the judges' disagreement have no record. 'Contradicted' would need the composite count or the blind lineup to come out against a shared past; missing intermediates are not proof of independence. Any supported grade would need a record pointing beyond base rates. What evidence exists leans toward convergence and retelling. The record whose removal would most change the verdict is DEEP-E020: without it nothing points toward resemblance beyond base rates, and the case would tilt toward weak support for the conventional accounts."
  steelman: The strongest unanswered case is regional. On Pillar 43 three box-like objects with handle-like attachments sit beside a vulture (DEEP-E025); millennia later, in the same broad region, Assyrian relief figures hold a bucket the ritual texts name (DEEP-E086). The excavators ground their caution in missing links rather than counter-evidence, and allow that surviving imagery may have changed meaning (DEEP-E061, DEEP-E062) — so the functional divergence this assessment leans on is what survival with reinterpretation predicts. The test that could show it, specific Pillar 43 motifs on securely dated Neolithic seals, is unrun. More broadly, the catalogue null tests broad classes, which the page concedes are not the specific images (DEEP-E019), so the strongest evidence against a common source has not been aimed at it; and the lineup signal (DEEP-E020, DEEP-E021) is a measurement the critics answer only with reasons. None of this changes a verdict, because none adds a record of a connection; each names the test that would.
