caseAssessment:
  verdict: unresolved
  whatIsClaimed: "That resemblances among images and stories from distant ancient cultures record a shared past — one common source or long-distance contact — rather than independent invention or later retelling. Primary sources read so far describe the compared objects: Pillar 43's handled forms, the Assyrian ritual bucket, a Jiroft object that hung on a cord, the Rapa Nui birdmen, Berossus's Oannes and Urfa Man's grip. The navel names, the feathered serpent and the flood stories rest on the founding page's word alone."
  whereDisagreementLives: The dispute is whether any specific resemblance is rarer than chance and linked by dated intermediates, or whether common motifs, shared constraints and modern retelling explain it. No one has counted specific composites against controls. The civiliser lineup signal may measure modern summaries rather than original accounts. The excavators report missing links, and the Rapa Nui birdmen are later additions. The navel names differ in language and date. Matching object kinds changes how resemblance ranks.
  whatWouldSettleIt: "A dated chain for any one parallel would settle it: most concretely, a securely dated Neolithic seal carrying a specific Pillar 43 motif long after the site. Beside it, specific composites counted against matched controls from unconnected cultures, and a blind human lineup of original civiliser passages beating random pairs. Against a shared past: that lineup falling to chance, the bundle comparison holding under narrower classes, and the navel names traced to modern or colonial origins."
  bestConventionalExplanation: "Broad motif classes are common everywhere — by the page's own unaudited count, a bird-person in over half of sampled traditions and a cosmic serpent in over a third — so meeting them in two cultures is expected. Shared bodies, animals, materials and problems produce convergent forms: a handle is how anyone carries a thing, and arms carved against a stone body are less likely to break. Galleries select resemblances from a huge pool and compare unlike kinds, and matching kinds changes the result. Where dated, the compared pieces are far apart and often late: the Rapa Nui birdmen were added to an older statue and are read against a myth recorded after European contact, and the Göbekli excavators report no established chain to later imagery. Translation and comparative writing make stories converge, so modern summaries of Oannes, Viracocha and Quetzalcoatl may match better than their originals. The navel names come from four languages across millennia."
  components:
    - label: How common the broad motifs are
      state: weakly_supported
      note: The page reports a bird-person class in 55% and a cosmic serpent in 37% of sampled traditions, with its own caveats on coverage. Unaudited; the bundle result is unstated in anything read.
    - label: The civiliser lineup against retelling
      state: weakly_supported
      note: The page reports matched pairs ranked first 62.5% of the time against 9% for random pairs. Whether that measures the originals or modern summaries is untested.
    - label: "Handled objects: shape known, use argued separately"
      state: provisionally_supported
      note: The excavators describe handle-like forms and decline to name their use; one Jiroft object hung on a cord; the Assyrian bucket held ritual water, seen secondhand. Outlines rhyme; uses differ.
    - label: Dates and intermediates
      state: well_supported
      note: The Rapa Nui birdmen were carved onto an older statue and read against a nineteenth-century myth; a Göbekli excavator reports too many missing links to trace survival.
    - label: The navel names
      state: unresolved
      note: None of the four names has been traced to its first record; they are treated as different kinds of evidence on the plain fact of four languages and eras.
    - label: Whether resemblance can be measured
