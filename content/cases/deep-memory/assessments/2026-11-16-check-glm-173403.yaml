  synthesis: "The featured hypothesis is bipartite — how much of the
    cross-cultural resemblance belongs to a shared past, and how much to the
    ways people make images, tell stories and look for connections — and the
    ledger currently supports the two halves to very different degrees. Where
    the loop reached primary sources, the specific featured parallels tend to
    degrade. The navel theme is the strongest result: DEEP-C018 is supported by
    a genuine source history built from Pindar, Pausanias, Strabo, Garcilaso,
    Thomson, Churchill, Holmer and the excavators' own monograph, and it shows
    the four names differing on exactly the axes the claim names — language,
    date of first record, and whether the builders used the name. Within that
    theme the Cusco gloss is rejected by a specialist (DEEP-C094, though on one
    unread demonstration) and the Rapanui name has a documented rival 'land's
    end' reading (DEEP-C093). For the handled objects, the excavation team's own
    statement leaves the Pillar 43 forms without a functional identification
    (DEEP-C012), so the Assyrian bucket comparison is a comparison of shapes;
    and the excavator's stated position is that no chain of intermediates to
    later Near Eastern imagery is established (DEEP-C072). The Hoa Hakananai'a
    birdman reliefs are late additions narrating a locally recorded myth
    (DEEP-C059, DEEP-C080), which dates that parallel late and local. Against
    this, the affirmative and quantitative strands are weak: every catalogue and
    lineup figure (DEEP-C005, DEEP-C025, DEEP-C027, DEEP-C056, DEEP-C057) is a
    self-report of the founder's own unaudited experiments with run data not in
    hand, and the flood pilot (DEEP-C031, DEEP-C054) and image-pilot agreement
    claims (DEEP-C037) have no evidence records at all. Steelmanning the
    shared-past direction: the lineup effect is large and unrebutted,
    theapkallu–Oannes continuity is at least textually anchored, and 'missing
    links' means undocumented, not absent. Steelmanning the convergence
    direction: the methodological ceiling (DEEP-C035, DEEP-C002, DEEP-C026) and
    the documented comparative-writing mechanism (DEEP-C034) are exactly what
    the weak statistical results would predict. Mixed is therefore a substantive
    finding: the well-evidenced parts of the ledger cut against reading the
    featured resemblances as a shared past, but the experiments that would
    quantify 'how much' are too weakly supported to carry either reading, and no
    record positively contradicts transmission."
  steelman: "The V1 civiliser lineup result — claimed partners ranked first in
    62.5% of completed lineups against 9% for random pairs, roughly seven times
    chance — is an unrebutted quantitative observation. This assessment grades
    it only as a weakly supported self-report; it neither explains the effect
    nor shows it to be an artifact. The page's own confound (similarity
    manufactured by compressed modern retellings) is a hypothesis, not a
    finding: the blind human rerun on unrecognisable source-level passages
    (DEEP-R003) has not been run, so if the effect survives verification against
    run data, a proponent would rightly ask what makes the civiliser accounts
    converge across oceans when the navel names demonstrably do not."
