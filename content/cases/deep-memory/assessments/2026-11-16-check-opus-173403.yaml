  synthesis: >-
    This run reads the featured hypothesis as the case's shared-past answer. On
    that reading, the resemblances the founder's pages set side by side record a
    common source or long-distance contact, not independent invention,
    convergence and later retelling. The resemblances are bird-headed figures,
    handled objects, navel names, civilising teachers and flood details. On the
    records in hand, the hypothesis is contradicted, within a stated scope. It
    is contradicted for the specific resemblances the ledger has traced into
    primary or specialist sources. It is not tested for the weaker thesis of
    very old transmission of broad motif classes. A distribution alone cannot
    settle that thesis (DEEP-C026).

    Source criticism carries the verdict, not the founder's experiments. The
    navel leg is the best documented. It fails the prediction a shared past
    makes: old, indigenous attestation of the designation. One name meets that
    prediction. Delphi's omphalos is Greek, on record by 462 BC, and was the
    sanctuary's own word (DEEP-E087, DEEP-E088, DEEP-E089). The other three fail
    it: - Göbekli Tepe's name is modern Turkish, read by its excavators as
    describing the mound's shape (DEEP-E096). - Cusco's 'navel' is Garcilaso's
    Spanish gloss of 1609. He assigns it to the Incas' private language, and a
    specialist calls it entirely gratuitous (DEEP-E090 to DEEP-E092). - The
    Rapanui phrase is on record from the late nineteenth century, through a
    foreign visitor. It carries a gloss of its own and a documented rival
    reading as 'land's end' (DEEP-E093, DEEP-E094, DEEP-E095). What is left to
    explain is one ancient bodily metaphor for a sacred centre (DEEP-C018,
    DEEP-C093, DEEP-C094, DEEP-C015).

    The other legs point the same way, more weakly: - Bird-men: the Rapa Nui
    birdmen were carved after the statue. They narrate a myth recorded in the
    nineteenth and early twentieth centuries, a sufficient local history
    (DEEP-E068, DEEP-E069, DEEP-E071). - Handled objects: the handled outline
    has three different evidential fates. One is a ritual water bucket
    (DEEP-E055, through a weak transcription). One is a single specimen worn as
    if hung on a cord (DEEP-E035, with the authors' caveat DEEP-E038). The third
    is the Pillar 43 forms, which the team declines to identify and for which it
    floats a building reading (DEEP-E025, DEEP-E028). - Hands: the 'hands on the
    belly' set already mixes gestures. Urfa Man's hands 'seem to grab his penis'
    (DEEP-E081). - Transmission: the excavators see too many missing links to
    establish even regional survival of the imagery (DEEP-E061, DEEP-E062). The
    method claims (DEEP-C002, DEEP-C065) explain why resemblance cannot bridge
    these gaps. Those claims lean on reasoning; the legs above lean on records.

    Steelman against the verdict: none of the founder's direct tests is audited.
    - The one quantitative result favouring non-chance similarity is a
    self-report without a denominator. Civiliser partners ranked first in 62.5%
    of completed lineups, against 9% for random pairs. - The catalogue's null
    result on the motif bundle (DEEP-C057) has no evidence record. - Floods and
    feathered serpents are untouched. Records also cut the proponents' way
    locally. Schmidt's first description already saw 'handle-like attachments'
    (DEEP-E025). Thomson reports an island tradition that the name was given by
    Hotu Matua right after the island's discovery (DEEP-E093). Berossus already
    tells of a being from the sea who brings the arts (DEEP-E046).

    Steelman for the verdict: each of those records shows a resemblance is not
    only in the modern viewer's eye, which nobody disputes. None shows a
    connection between the places. The ledger's one record of comparative
    reading (DEEP-E097) catches seventeenth-century readers manufacturing
    correspondences detail by detail.

    Sensitivity: the single record whose removal would most change the verdict
    is DEEP-E092, the only record against the Cusco gloss. Without it, Cusco's
    'navel' would stand as a late, second-hand but unrefuted report of the
    Incas' own meaning. That would give the hypothesis a second builder-era
    navel beside Delphi. The verdict survives that removal, for three reasons: -
    Göbekli Tepe's name stays modern and descriptive. - The Rapanui reading
    stays disputed on two independent lines. - No other leg depends on Cusco.
    The navel leg would thin rather than dissolve. No single record carries the
    verdict.

    Two disclosures: - That a Turkish toponym cannot be the Pre-Pottery
    Neolithic builders' word comes from language history. It is background, not
    a ledger record. - The founder's page is still flagged unverified in its
    source record. Every experimental figure here therefore weighs only as a
    self-report.
  steelman: This assessment discounts the civiliser resemblance but does not
    explain it. In the founder's V1 lineup, the claimed partner figure ranked
    first in 62.5% of completed lineups, against 9% for random pairs (DEEP-C027,
    DEEP-E020, DEEP-E021). The account offered against it is that compressed
    modern retellings manufactured the match. That account is itself untested.
    The blind, source-level lineup that would decide it has not been run
    (DEEP-R003). That lineup would use Berossus via Polyhistor for Oannes,
    Sarmiento or Betanzos for Viracocha, Sahagún for Quetzalcoatl and Simón for
    Bochica, with random hero narratives as controls. The ledger's only record
    of retelling (DEEP-E097) shows Spanish readers aligning an Inca origin story
    with Noah. It does not show a civiliser account whose own details converged.
    Nor is the Mesopotamian member a modern construct. Berossus F1 already has a
    being from the sea teaching writing, cities, temples, laws and agriculture
    (DEEP-E046). If source-level passages still pair above chance, nothing in
    this ledger explains that match.
