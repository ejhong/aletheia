  synthesis: "The ledger's evidence records, taken strictly on their own terms,
    leave the founding question open while systematically weakening any strong
    reading that the noticed resemblances (bird-men, handled forms, navel names,
    civilisers, floods) primarily record a shared deep past or long-distance
    transmission package. Methodological claims that are directly attested or
    rest on elementary source criticism are the load-bearing ones: historical
    meaning cannot be read from resemblance alone without dates, contexts,
    differences and possible connections (C002); a catalogue geography of broad
    motif classes cannot by itself separate independent invention from very old
    transmission (C026); and motif similarity alone cannot establish a
    lost-civilisation source's identity, date or capabilities (C035). These are
    reinforced by the catalogue experiment's own reported outcome that the three
    broad classes are each widespread yet their joint bundle does not stand out
    against documentation-preserving comparisons (C056, C057), by the
    excavators' explicit statement that too many missing links prevent any
    secure claim of survival of Göbekli imagery into later Near Eastern objects
    (C072), and by the demonstration that the four 'navel' designations differ
    in language, date of first record and builder use (C018, supported by
    primary passages from Pindar, Pausanias, Strabo, Garcilaso, Thomson,
    Churchill and the UNESCO/Schmidt site descriptions). Handled-object function
    at Pillar 43 remains uncertain on the team's own published word (C012),
    while Assyrian banduddû has a documented bucket-and-sprinkler ritual reading
    that is shape-function distinct from the undecided Göbekli forms (C044,
    C065). Birdman reliefs on Hoa Hakananai'a post-date the statue (C059). Flood
    summaries show regional clustering and uneven Genesis-linked detail (C031,
    C054) rather than a single deep template. Image-pilot results themselves
    caution that AI judges disagree and that kind-matching alters rankings
    (C037, C038). Against this, the positive statistical signals for shared
    patterning (bird-person at 55 %, cosmic-serpent at 37 %, civiliser partners
    first-ranked in 62.5 % of lineups) are exclusively self-reports of unaudited
    founder experiments whose underlying data and full methods are not in the
    ledger; they therefore supply only weak, provisional support and cannot
    outweigh the cautions. Material constraints on stone limbs (C047) and
    documented pathways of retelling and convergence (C034) supply independent
    mechanisms that generate resemblance without transmission. The net result is
    mixed: broad motifs recur at rates consistent with either deep inheritance
    or repeated independent invention plus later scholarly/comparative
    smoothing, while every claim that would convert those recurrences into
    evidence of a specific shared past, contact chain or lost source remains
    either unsupported by primary records or actively qualified by the same
    records. The verdict would shift only with dated intermediate objects,
    audited catalogue micro-data, or source-critical lineups that survive
    kind-matched and language-matched controls; none of those are present."
  steelman: The civiliser-partner lineup result (claimed pairs first-ranked far
    above random) and the repeated visual co-occurrence of bird-headed figures
    with handled containers across Göbekli, Assyrian and Olmec contexts remain
    unexplained by the methodological cautions alone if future kind-matched
    human ratings or motif-bundle statistics still exceed base rates; a
    proponent can rightly note that the ledger contains no negative control
    showing that equally salient but historically unrelated motif sets produce
    the same ranking elevation.
