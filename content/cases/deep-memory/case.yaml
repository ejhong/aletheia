id: DEEP-001
slug: deep-memory
title: "Deep Memory"
subtitle: "Distant places, familiar forms: how much of the resemblance between bird-men, handled objects, navel-of-the-world names, feathered serpents, civilising teachers and flood stories across distant ancient cultures belongs to a shared past, and how much to the ways people make images, tell stories and look for connections?"
domain: "Comparative iconography · Comparative mythology · Archaeology"
status: active
summary: >-
  Put the images side by side and it is easy to see why people stop and look: a bird-headed figure at Göbekli Tepe, at Nimrud and on Rapa Nui; three handled shapes on Pillar 43 beside the Assyrian bucket and the Olmec pouch; hands meeting on the belly of a T-pillar and a moai; a sacred centre called a navel at Delphi, at Cusco and on Easter Island; a teacher who arrives from the sea, brings the arts and departs; a flood that only some survive. The founder's Deep Memory site sets the pictures and stories out and keeps open the question its pages ask — whether the resemblances record a common source, long-distance contact, independent invention or later retelling, and by what evidence one could tell — and reports five investigations that try pieces of it: a catalogue experiment on whether the motifs travel together, image pilots on whether AI can measure the resemblance people see, lineups and a source audit of the civiliser figures, a coding of flood-story details, and a companion comparison of two undeciphered scripts. This case opens as that question, from those pages, with an empty ledger: every claim, source and grade is to be built by the loop from retrieved text, and the founder's pages are its founding inputs and its hypothesis material, never its evidence.
