article: |-
  What would it take for a carving to count as a memory—not simply an image made long ago, but a trace of a tradition inherited across places and generations? Pillar 43 at Göbekli Tepe offers a concrete starting point. Before asking whether its symbols travelled, we need to establish what is carved there and how much of its meaning we can recover.

  ## A shape is not yet an identity

  [Oliver Dietrich’s account of Pillar 43](https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headless-man-gobekli-tepe-pillar-43/) describes [three rectangular forms topped with cupola-like arches, each paired with an animal, at the pillar’s uppermost edge]{claim=MEM-C002}. This is a description of a configuration, not an identification of the objects. The account explicitly leaves their meaning uncertain.

  {plate:IMG-MEM-P01}

  The accompanying plate provides context for the pillar. Its supplied description notes that foreground stones obscure part of the lower face; it should not be treated as a complete view of every motif discussed in the source.

  The same account identifies [a human figure shown without a head and with an erect penis]{claim=MEM-C001}. The pillar is damaged, and the figure is incompletely preserved. The description gives us another element of the imagery, but not a secure interpretation of the scene. It does not establish whether the figure belongs to a ritual, a myth, a narrative, or some other scheme of meaning.

  These are two observations about **one object, reported in one source**. Their combination may matter to an eventual interpretation, but they are not independent witnesses to a widespread tradition. The evidence records treat them as context for the larger question, not as demonstrations of shared inheritance.

  ## What the inheritance hypothesis still needs

  The strongest argument worth pursuing is not that one simple outline resembles another. It is that a distinctive arrangement of forms, animals and actions might preserve a convention learned and transmitted between communities. If such an arrangement recurred in securely documented settings, its relationships could be more informative than any isolated shape.

  That is a hypothesis to test, not a result in this ledger. No recorded comparison yet establishes recurrence elsewhere, shared meaning, a chronological sequence, or a route of transmission. Nor does the ledger contain evidence from myths. **The broad question remains unresolved.** This is missing evidence, not a failed test of inheritance.

  Independent invention, shared constraints on representation, regional borrowing and deeper inheritance remain serious alternatives. Different motifs could also have different histories. The present observations cannot distinguish these possibilities.

  ## A comparison that could teach us something

  A useful next step would freeze one narrowly defined comparison before searching widely. Describe the pillar’s upper forms without naming their function; specify which features and relationships would count as a match; then assemble securely documented comparison objects, including mismatches and regional context.

  The test should ask whether the proposed resemblance is unusually specific, rather than merely the best resemblance found in a large search. Chronology and independent connecting evidence would then be needed to turn a visual match into a historical argument. Ordinary matches, incompatible sequences or missing predicted features would weaken that argument.

  For now, the pillar supplies an object to investigate, not a recovered ancestral story.

