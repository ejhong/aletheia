  ## A question, opened

  This case begins with a question and an empty ledger. The founder's Deep Memory site sets out the pictures — bird-men, handled objects, hands on the belly, sacred centres called navels, serpents and the feathered serpent, the teachers who brought the arts, the floods — and asks how much of their resemblance belongs to a shared past and how much to the ways people make images, tell stories and look for connections. Its pages are to be this case's founding inputs: they enter through the inbox by the founder's own drop, and none has yet.

  From there the loop works unattended. The drafter proposes claims and sources from those pages and from text it retrieves; the verifier admits only what the text it was shown supports, and writes a reason for everything it refuses; an edition assesses and tells what the ledger holds; and a panel of independent models judges it blind. Nothing here is graded yet, and nothing on this page is evidence for anything.
