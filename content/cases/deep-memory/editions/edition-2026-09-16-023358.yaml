article: |-
  ## The pattern people see

  Set the pictures out in a row and the resemblance does its work before anyone has made an argument. An eagle-headed figure strides across a palace wall from Nimrud with a bucket in one hand and a cone in the other. A vulture spreads its wings on a Neolithic pillar at Göbekli Tepe, and along the pillar's top edge sit three arched shapes with handles. A seated man on an Olmec boulder from La Venta holds a small bag inside the coils of a crested serpent. Two bird-headed men face one another on the back of a statue taken from Rapa Nui. A netted stone at Delphi marks the navel of the world; so, in their own languages, do places in the Andes and the Pacific. A teacher comes from the sea, brings the arts, and leaves. A flood drowns everyone but a few.

  {plate:IMG-DEEP-P01}

  The eye reads these as kin. The question is whether history does — and how one could tell. The founder's Deep Memory pages ask it without answering it, and their working rule is the one this case adopts: [the historical meaning of a visual resemblance depends on the objects' dates, contexts, differences and possible connections, not on the resemblance alone]{claim=DEEP-C002}. What follows applies that rule to a ledger that is, so far, almost empty.

  ### How thin the ground is

  Every evidence record in the ledger comes from one source: the founder's own home page, a self-published web essay that describes itself as AI-assisted and reports five investigations its author ran. The method calls this a *self-report* — an author's statement of an unaudited result, with data and code not in hand — and admits it as weak support at most. None of the primary literature the page leans on has been read: not the wear-trace study of the Jiroft object, not the excavators' discussion of Pillar 43, not the published study of the Rapa Nui statue, not the fragments of Berossus, not a ritual text or a chronicle. So nothing here is graded above “weakly supported”, and most claims that matter are “unresolved”: they stand in the catalogue, anchored to the page that made them, with no record for or against. That is not a finding that they are false. It is a finding that they are untested, with a list of what would test them.

  ## Four accounts, set side by side

  The founding pages name four explanations and insist that more than one can be true in different cases. This edition treats them as the live accounts.

  - **A common source.** The forms and stories descend from one ancestor and were carried outward. In its strongest version — the lost-civilisation account — that ancestor is an unknown society of great age and capability whose emissaries taught the rest. It predicts that specific composites (this pose with this object in this arrangement; this arrival, teaching and departure in this order) recur across the compared cultures more often than chance, and that the oldest examples cluster near the source.
  - **Long-distance contact.** Particular cultures met and exchanged images or stories, with no single ancestor. It predicts dated intermediates, a plausible route, and resemblance strongest where the route runs.
  - **Independent invention, or convergence.** Similar bodies, animals, materials and practical problems make similar forms; similar disasters make similar stories. It predicts that the broad classes are common everywhere, that a handle or a folded hand appears wherever carvers face the same problem, and that specific composites do not travel together more than comparison bundles do.
  - **Later retelling.** Much of the resemblance is made after the fact: by translation, by borrowing after contact, by comparative writers who smooth different stories into one biography, and by selecting matching examples from a very large pool. It predicts that similarity grows between an original account and its modern summary, and that details of a famous version turn up unevenly, where that version was preached.

  The themes follow in turn: what the ledger holds for each account, and what observation would decide between them.

  ## Bird-men

  {plate:IMG-DEEP-P10}

  The gallery runs from the shaft scene at Lascaux — a stick-figure man with a bird's head falling beside a wounded bison, a bird on a staff nearby — through Egyptian gods and Assyrian genii to costumed dancers in the Americas and the birdman cult of Rapa Nui. The founding pages supply the first objection themselves: [the description “bird-man” groups at least three distinct ideas — a deity with a bird's head, a person wearing feathers, and a person transforming into a bird]{claim=DEEP-C004}. If the compared images fall into different ones of these, the parallel is not one resemblance but three weaker ones. This edition grades the distinction provisionally supported on priors — the gallery plainly spans all three — while noting that no evidence record has yet sorted the images.

  {plate:IMG-DEEP-P05}

  The Rapa Nui example is where dates bite. Hoa Hakananai'a, the basalt moai taken from Orongo, carries on its back two facing birdmen, a ring and girdle, komari and paddles. The claim that matters is that [the birdman carvings were added later than the statue's manufacture]{claim=DEEP-C059}, itself placed at around 1000–1200 CE. If so, the Rapa Nui leg of the comparison is not only an ocean from Lascaux and Nimrud but some sixteen millennia later than the one and two millennia later than the other — and centuries later than the statue it decorates. The ledger holds no record for this; the published study of the statue that the page cites has not been read. Unresolved.

  The catalogue experiment gives the other half. It reports that [a broad bird-person motif class occurs in 55% of 926 sampled traditions]{claim=DEEP-C005}. A *base rate* is how often a thing occurs in the population at large; a motif found in more than half of all sampled traditions is one you would expect to meet in any two cultures picked at random. That number, if it holds, is the strongest reason in the ledger not to be surprised by a bird-man in two places. But the page qualifies its own figure twice, and the ledger records both: the catalogue's coverage is uneven, particularly for the ancient Near East and Rapa Nui — the very regions compared — and broad narrative categories are not the specific images or place names in the claim. A class that includes every winged soul and feathered dancer does not say how often a profile head, a bent limb and a rounded form nearby occur together. That composite, not the class, is what a common-source account needs, and no one has counted it.

  ## The handled objects

  {plate:IMG-DEEP-P02}

  Four objects make the comparison: the three arched forms on Pillar 43, the bucket carried by the Assyrian genii, the carved chlorite objects from the Halil Rud valley in Iran, and the small pouch held by the seated figure on Monument 19 at La Venta. Their outlines rhyme; the founding pages say so, and this edition agrees they are worth close looking. Then the pages make the distinction the theme turns on: [shape and function are separate questions]{claim=DEEP-C065}.

  The four are not on the same footing. For the Assyrian object, [ritual context supports a bucket-and-purifier interpretation]{claim=DEEP-C044}: the *banduddû* is [named in ritual texts]{claim=DEEP-C043}, and the cone in the genie's other hand sprinkles from it. For the Göbekli forms, [the function remains uncertain]{claim=DEEP-C012}; no secure identification has been published. The comparison thus sets a known bucket beside three shapes whose purpose no one knows. Were the Göbekli forms shown to be containers, the resemblance would gain a rung; were they something with no handle at all, it would lose one. Neither the Assyrian texts nor the excavators' discussion has been retrieved, and both claims are unresolved.

  {plate:IMG-DEEP-P04}

  The Jiroft object is the one case where function has reportedly been tested physically. The page's caption says the chlorite “handbag” in the National Museum of Iran [shows wear on its handle consistent with having hung on a cord]{claim=DEEP-C009}, and points to a published wear-trace study by Vidale and Micheli. What the ledger holds is the pointer, not the study: a record that the page cites a paper whose title says it infers the object's function from its wear traces. That is *context* — it says where the evidence is — not support, because what the paper found has not been read. Unresolved; retrieving the study is desk work and leads the third item of the research programme.

  {plate:IMG-DEEP-P03}

  At La Venta, the figure's pouch is [usually read as an incense bag]{claim=DEEP-C010}, and the serpent framing him is [often called the earliest known feathered serpent]{claim=DEEP-C003}. Neither reading has an evidence record.

  What would move the theme: a handle is a practical solution that can recur wherever people carry things. What a common-source account needs, and convergence does not predict, is that the *particular* handle — its attachment, its proportion to the body, its decoration, the figures beside it — recurs across the compared objects more often than across a control set of handled containers from cultures known to be unconnected. No one has run that comparison.

  ## Pigs, lizards and other stone animals

  A low body, a raised back and a projecting snout make a boar legible across any distance; splayed limbs and open jaws make a crouching predator. The ledger holds one narrow observation here: the Göbekli Tepe excavation team's discussion of Enclosure C [distinguishes boars from snarling predators]{claim=DEEP-C045} — the people who dug the site read the animals in their setting, as an arrangement, not as isolated silhouettes. The founding pages are right that “lizard” should stay a proposed identification where the animal is uncertain, and that the useful next comparison is with other securely identified pig and boar sculptures rather than with whatever looks alike. Nothing in this theme is graded; it awaits objects with museum numbers.

  ## The navel of the world

  {plate:IMG-DEEP-P06}

  The linguistic parallel is the most evocative and, on inspection, the most fragile. Delphi's *omphalos* — the netted stone said to mark where Zeus's eagles met — is Greek and ancient. Cusco is glossed as the navel of the Inca world in Garcilaso's account, written after the conquest. Rapa Nui is Te Pito o te Henua, and a smooth stone near Ahu Te Pito Kura carries a name [glossed as “navel of light”]{claim=DEEP-C019}. Göbekli Tepe means “navel hill” in Turkish.

  The founding pages' own claim is the crux: [these are different kinds of evidence, differing in language, date of first record and whether the ancient builders used the name]{claim=DEEP-C018}. This edition grades it provisionally supported on priors — Greek, Spanish, Rapanui and Turkish are four languages recorded across some two and a half millennia — while noting that none of the four source histories has been retrieved. The sharpest test is the Turkish name. If [the modern Turkish name Göbekli Tepe describes the shape of the mound]{claim=DEEP-C015}, it is a descriptive toponym given long after the builders were gone and says nothing about what they believed. The page states exactly this, and adds that [the Kurdish names for the site mean “wish hill”]{claim=DEEP-C016}; but the ledger's one record on the site's names covers the Kurdish gloss, not the Turkish, and neither is sourced on the page. The claim is unresolved, and the second item of the research order traces all four names to their first attestation.

  What would change the picture: an early, builder-attested “navel” usage at two or more sites. What would settle it the other way: source histories showing, as the page proposes, that one name is a modern description, one a colonial gloss, and only Delphi's an ancient sacred designation in the language of the people who used it. A bodily metaphor for a centre is available in any language; an inherited usage would need more than this.

  ## Hands on the belly

  {plate:IMG-DEEP-P07}

  [Arms and hands are carved on the central T-pillars of Enclosure D at Göbekli Tepe]{claim=DEEP-C023}; the shaft is a body and the T a stylised head. Urfa Man, a life-size limestone statue from Şanlıurfa of about 9000 BCE with dark inlaid eyes, [holds its hands over the genitals]{claim=DEEP-C021}. The moai of Ahu Tongariki, carved some ten millennia later, meet their hands low on the abdomen above the belt. The Ponce monolith at Tiwanaku [holds its hands to the chest]{claim=DEEP-C050}, one of them around [a snuff tablet]{claim=DEEP-C051}.

  {plate:IMG-DEEP-P08}

  The founding pages make the observation the eye skips: a hand across the abdomen and a hand at the groin are close in outline but different observations. And they offer convergence in its plainest form. [Carving limbs against a stone body can protect them from breakage]{claim=DEEP-C046}, so [material constraints are a plausible contributor to the hands-on-body pose]{claim=DEEP-C047} — graded provisionally supported on priors, since any carver of a monolith knows what happens to a free-standing arm. Equally, [material constraint as a contributor to the pose does not settle its symbolic meaning]{claim=DEEP-C048}: a constraint explains why hands rest against the body, not why at the abdomen rather than the groin or the chest. The deciding observation is a survey of stone figures in the same media from cultures with no possible connection: if the pose varies with the stone and the tool, constraint wins; if it clusters along a route, something else is happening.

  ## Serpents, and the feathered serpent

  {plate:IMG-DEEP-P12}

  Snakes are everywhere in the gallery: coiled around the Olmec figure at La Venta, gripped by the hero on the Jiroft object, projecting in feathered collars from the Temple of the Feathered Serpent at Teotihuacan. The catalogue experiment reports [a broad cosmic-serpent motif class in 37% of sampled traditions]{claim=DEEP-C025} — another high base rate, weakly supported on the same self-reported footing as the bird-men figure. The feathered serpent of Mesoamerica is a much more specific thing than “snake”, and any comparison worth making has to preserve the feathers, the head, the body's arrangement and its relation to a human figure.

  The page adds the point that governs both catalogue results: [a catalogue's geographical distribution of a broad motif class cannot by itself distinguish independent invention from very old transmission]{claim=DEEP-C026}. The same map fits a serpent invented a hundred times and a serpent inherited once. Telling them apart takes dated intermediates or a model with stated assumptions — neither of which the ledger holds.

  The catalogue experiment's headline is the most consequential thing in the case and the least tested. It reports that [the three broad motif classes — birds, serpents, sacred centres — are each widespread]{claim=DEEP-C056}, and that [their bundle does not stand out against the study's documentation-preserving comparisons]{claim=DEEP-C057}. If the second holds, finding birds, serpents and a sacred centre together in a tradition is no rarer than finding any comparable trio of common motifs — which convergence predicts and a common source does not. But the ledger contains no record supporting that finding, only the page's two qualifications of it; and the first claim is supported only indirectly, through the bird and serpent figures, with no number recorded for sacred centres at all. The bundle claim is unresolved, and its data are what this edition would most like to see.

  ## The people who brought the arts

  {plate:IMG-DEEP-P09}

  The narrative parallel is as arresting as the visual one. A figure arrives, often from the sea; teaches writing, agriculture, law or craft; changes human life; departs, sometimes promising to return. Oannes in Babylonia, Viracocha in the Andes, Quetzalcoatl in Mexico and Bochica among the Muisca recur in the comparison. The founding pages' caution is that the exact arrival, teaching and departure have to be read in each account, not supplied by a composite biography.

  One figure has a dated image behind him. On a basalt basin from Assur, the god Ea stands with streams flowing from him beside a fish-cloaked sage; the page holds that [this fish-cloaked figure is the apkallu type the texts actually name]{claim=DEEP-C052}, and that [Berossus's Oannes corresponds to it]{claim=DEEP-C053}. Oannes is thus the one civiliser with a documented iconographic type — but Berossus survives only in later excerpts, and neither the excerpts nor the apkallu texts have been read for this ledger. Unresolved.

  {plate:IMG-DEEP-P11}

  At Tiwanaku, the staff-bearer with the rayed head in the centre of the Gate of the Sun is often called Viracocha. The page's claim is that [that identification is a modern one]{claim=DEEP-C028}. If so, the most-reproduced “image of Viracocha” is not evidence that the story existed before the Spanish wrote it down. Unresolved, for want of a record.

  The one measured result in this theme is the founder's V1 lineup experiment. AI judges were shown a civiliser account and asked to pick its partner from a lineup; [the claimed partner ranked first in 62.5% of completed lineups, against 9% for random pairs]{claim=DEEP-C027}. That is a real signal under the experiment's conditions, and the only evidence record in the ledger pointing toward a resemblance beyond base rates. The ledger does not yet hold a record of the experiment's own stated limitations; the record proposed for them was declined at intake as non-atomic, so this article does not carry them. What it can say is what the retelling account predicts: a model that has read the comparative literature knows that Viracocha and Quetzalcoatl are supposed to match, and a lineup of modern summaries would measure the similarity of modern summaries. That is the mechanism the retelling account proposes — [stories can become more alike than their originals through translation, borrowing and comparative writing]{claim=DEEP-C034} — and no test has yet been run on the original passages. The decisive experiment leads this edition's research order: rerun the lineup with human raters on unrecognisable passages from the sources — Berossus via his excerptors, the early Andean chroniclers, Sahagún, Simón — against random hero narratives, and see whether 62.5% survives.

  The lost-civilisation account attaches to these figures its strongest claims: that the teachers were emissaries of a real, identifiable, technically advanced society of great age. The page's answer, adopted here on priors, is that [similarity between motifs alone cannot establish a lost-civilisation account's claims about the source's identity, date and capabilities]{claim=DEEP-C035}. A resemblance can at most suggest a connection; who was connected to whom, when, and what they could do, needs evidence of a different kind, and none is in this ledger.

  ## What survives the water

  Flood stories raise several questions at once: whether people remember local disasters, whether particular stories travelled, and whether traditions preserve much older environmental knowledge. The founder's text-coding pilot had an AI code the details of 263 flood-story summaries. It reports that [the coded details cluster by region]{claim=DEEP-C031}, that [details associated with Genesis are unevenly distributed]{claim=DEEP-C054}, and that [generic flood motifs are widespread]{claim=DEEP-C055}.

  Each of the four accounts can live with regional clustering: inheritance with regional drift, contact along routes, independent memory of local floods, retelling in regional missions. The uneven distribution of Genesis details is the more pointed finding, because it is what the retelling account predicts — and yet, as the page says, recording a story after contact does not establish that it was borrowed. None of the three claims has an evidence record, and the pilot coded one compiler's summaries rather than a representative collection of original accounts. All three are unresolved. What would move them: the coded data released and re-coded by human readers against original texts, with the Genesis-associated details dated, where possible, to before or after missionary contact.

  ## Indus and rongorongo

  The companion project compares the sign inventories of two undeciphered scripts and the illustrations used to connect them. Its governing claim is the one this case would apply everywhere: [a visual resemblance between signs of two undeciphered scripts does not establish shared sound, meaning or descent]{claim=DEEP-C036}. Sign shapes converge between scripts known to be unrelated; the ledger holds the principle and none of the companion's results.

  ## When resemblance becomes evidence

  Can the resemblance people see be measured at all? The founder's three image pilots tried to make AI judges rank objects by likeness. The page reports that [judges disagreed strongly with one another about the same objects]{claim=DEEP-C037}, and that [matching the kinds of objects in a lineup changed the lineup result]{claim=DEEP-C038}. The second has an evidence record and is weakly supported; the first does not, and is unresolved.

  The second is the more important. *Diagnosticity* is how much an observation decides between rival explanations. If a lineup that pits a pillar against a moai, a relief and a boulder ranks them one way, and a lineup of pillars against pillars ranks them another, then part of the original resemblance was an artefact of comparing unlike kinds — a finding about every side-by-side gallery, including the one that opens this article.

  ## Where this leaves the question

  Read strictly, the ledger says this. The broad classes — bird-people, cosmic serpents, sacred centres — are reported as each widespread, a claim the ledger supports only indirectly and whose bundle comparison has no supporting record yet; if it holds, meeting them in two cultures is expected, and the ledger has not yet established that it holds. Whether the specific composites are rarer than chance has not been counted. The one positive signal, the civiliser lineup, awaits the test that would separate it from what the retelling account predicts. The navel parallel rests on four names whose source histories have not been traced, one of them very probably modern. The dating that would place the Rapa Nui birdmen centuries after their statue, the texts that would make one “handbag” a known bucket, and the wear that would make another a hung container, are asserted but unrecorded.

  The verdict is *unresolved*, chosen rather than defaulted to. It means the featured hypothesis — that the resemblances record a shared past — has neither support nor refutation in the ledger, because the ledger holds one unverified source and no primary text. It does not mean the evidence is balanced: such evidence as there is leans, weakly and by the founder's own report, toward base rates, convergence and retelling.

  What would change our mind, in either direction:

  - A blind human lineup of original civiliser passages that beats random pairs by a margin like V1's — or one that does not.
  - A count of specific composites (pose plus object plus arrangement; handle attachment plus proportion plus decoration) across the compared objects and a kind-matched control set.
  - The four navel names traced to first attestation, with the builders' usage documented or shown absent.
  - The excavators' discussion of Pillar 43, the wear-trace study of the Jiroft object and the published study of Hoa Hakananai'a read, and their statements recorded in place of the page's captions.
  - Dated intermediates and a route for any one of the parallels.

  The best argument for the shared past that this edition does not answer: the catalogue experiment's null result, by the page's own admission, tests broad classes rather than the specific images in the claim — so the strongest evidence against a common source has not actually been aimed at it — and the lineup signal, whatever its limitations, is a measurement, where the critics have so far offered only reasons. Both are fair. Both point to the same thing: the next steps are small, cheap and named, and this case waits on them.
