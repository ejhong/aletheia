article: |-
  ## The pattern people see

  Set the pictures out in a row and the resemblance does its work before anyone has made an argument. An eagle-headed figure strides across a palace wall from Nimrud with a bucket in one hand and a cone in the other. A vulture spreads its wings on a Neolithic pillar at Göbekli Tepe, and along the pillar's top edge sit three arched shapes with handles. A seated man on an Olmec boulder from La Venta holds a small bag inside the coils of a crested serpent. Two bird-headed men face one another on the back of a statue from Rapa Nui. A netted stone at Delphi marks the navel of the world; so, in their own languages, do places in the Andes and the Pacific. A teacher comes from the sea, brings the arts, and leaves. A flood drowns everyone but a few.

  {plate:IMG-DEEP-P01}

  The eye reads these as kin. The question is whether history does — and how one could tell. The rule this case works by is a proposition, not a finding: [the historical meaning of a visual resemblance depends on the objects' dates, contexts, differences and possible connections, not on the resemblance alone]{claim=DEEP-C002}. It is held here on a prior — that no likeness has yet been assigned a history without those data — and no evidence record tests it. What follows applies it, object by object, to what the ledger holds.

  ### Two kinds of source

  The ledger draws on two kinds of text. The first is the case's one founding source, a self-published, AI-assisted home page that reports five investigations its author ran; it supplies the catalogue frequencies, the lineup result and the image and text pilots. The method calls these *self-reports*: an author's statement of an unaudited result, with data and code not in hand, admitted as weak support at most. The second kind is the primary literature behind particular objects: the excavator's first published note on Pillar 43 and his team's later discussion of it; the abstract of the wear-trace study of the Jiroft object; the abstract of the published study of Hoa Hakananai'a; the translated fragments of Berossus; the excavation team's post on Urfa Man; and one page of Wiggermann's edition of the Assyrian ritual texts, seen through a blog's transcription. These settle several questions about what the objects are and when they were carved. None tests the thesis itself, and several claims that matter — the four navel names, the Viracocha label, the flood coding, the AI judges' disagreement — stand on the page alone, with no record for or against. Where that is so, this article says so.

  ## Four accounts, set side by side

  The page names four explanations and states that more than one can be true in different cases. This edition treats them as the live accounts.

  - **A common source.** The forms and stories descend from one ancestor and were carried outward. In its strongest version — the lost-civilisation account — that ancestor is an unknown society of great age and capability whose emissaries taught the rest. It predicts that specific composites (this pose with this object in this arrangement; this arrival, teaching and departure in this order) recur across the compared cultures more often than chance, and that the oldest examples cluster near the source.
  - **Long-distance contact.** Particular cultures met and exchanged images or stories, with no single ancestor. It predicts dated intermediates, a plausible route, and resemblance strongest where the route runs.
  - **Independent invention, or convergence.** Similar bodies, animals, materials and practical problems make similar forms; similar disasters make similar stories. It predicts that the broad classes are common everywhere, that a handle or a folded hand appears wherever carvers face the same problem, and that specific composites do not travel together more than comparison bundles do.
  - **Later retelling.** Much of the resemblance is made after the fact: by translation, by borrowing after contact, by comparative writers who smooth different stories into one biography, and by selecting matching examples from a very large pool. It predicts that similarity grows between an original account and its modern summary, and that details of a famous version turn up unevenly, where that version was preached.

  The themes follow in turn: what the ledger holds for each account, and what observation would decide between them.

  ## Bird-men

  {plate:IMG-DEEP-P10}

  The gallery runs from the shaft scene at Lascaux — a stick-figure man with a bird's head falling beside a wounded bison, a bird on a staff nearby — through Egyptian gods and Assyrian genii to costumed dancers in the Americas and the birdman cult of Rapa Nui. The first objection is recorded on the page itself: [the description “bird-man” groups at least three distinct ideas — a deity with a bird's head, a person wearing feathers, and a person transforming into a bird]{claim=DEEP-C004}. If the compared images fall into different ones of these, the parallel is not one resemblance but three weaker ones. The distinction is graded here on the prior that these are different concepts; no evidence record has yet sorted the gallery into them.

  {plate:IMG-DEEP-P05}

  The Rapa Nui example is where dates bite, and it is the one bird-man in the ledger with a published study behind it. Hoa Hakananai'a, the basalt statue from Orongo now in the British Museum, carries low reliefs on its back. The study's abstract gives their order: the statue was made with a tapering base to stand in the ground; two *komari* — stylised female genitalia — were subsequently added; and succeeding those came the bas-relief carvings. So [the birdman carvings were added later than the statue's manufacture]{claim=DEEP-C059}: a later use of an older monument, not part of its design. The authors [read the reliefs as a single composition narrating the island's birdman myth as it was recorded in the nineteenth and early twentieth centuries]{claim=DEEP-C080}, a reading they say is supported by photographs taken in Chile in 1868. The comparison text for these birdmen is therefore an ethnohistoric one, written down after European contact; the study reads them against no prehistoric source. The page dates the statue to about 1000–1200 CE and lists a sooty tern between the birdmen's beaks, paddles, a ring and a girdle; the abstract [gives no absolute date]{claim=DEEP-C058} and does not itemise those motifs, so both are held on the page's word until the body of the paper or the museum record is read. Whatever the date, the Rapa Nui leg of the comparison stands an ocean from Lascaux and Nimrud and many millennia later than either.

  The catalogue experiment gives the other half. The page reports that [a broad bird-person motif class occurs in 55% of 926 sampled traditions]{claim=DEEP-C005}. A *base rate* is how often a thing occurs in the population at large; a motif found in more than half of all sampled traditions is one you would expect to meet in any two cultures picked at random. That figure, if it holds, is the strongest reason in the ledger not to be surprised by a bird-man in two places. But the page qualifies its own number twice, and the ledger records both: the catalogue's coverage is uneven, particularly for the ancient Near East and Rapa Nui — the very regions compared — and broad narrative categories are not the specific images or place names in the claim. A class that includes every winged soul and feathered dancer does not say how often a profile head, a bent limb and a rounded form nearby occur together. That composite, not the class, is what a common-source account needs, and no one has counted it.

  ## The handled objects

  {plate:IMG-DEEP-P02}

  Four objects make the comparison: the three arched forms on Pillar 43, the bucket carried by the Assyrian genii, the carved chlorite objects from the Halil Rud valley in Iran, and the small pouch held by the seated figure on Monument 19 at La Venta. Their outlines rhyme. The distinction the theme turns on is that [shape and function are separate questions]{claim=DEEP-C065} — held on a prior, since one outline can hold water, incense or nothing — and the primaries now in the ledger show how differently the four stand on the second.

  At Göbekli Tepe the shape is the excavator's own description. Klaus Schmidt's first published note on the pillar records, above the vulture, [three big, similarly carved box-like objects with handle-like attachments]{claim=DEEP-C067}, [each accompanied by an animal]{claim=DEEP-C068}. He names no function. Ten years later his team's discussion of the pillar weighs a reading of the three forms as the enclosures themselves seen from the side, and closes by saying that a final decision on the meaning of these images is not possible at the moment. [The function of the three handled forms is uncertain]{claim=DEEP-C012}, in the words of the people who dug them up — the best-supported statement in this theme, and one a later team publication could sharpen in either direction.

  For the Assyrian object the ledger holds the textual identification, at one remove. Wiggermann's edition of the protective-spirit rituals, seen through a blog's transcription of a single page, states that [*banduddû* unquestionably denotes the bucket held by many figures of the reliefs]{claim=DEEP-C043}, and that in rituals it was filled with water: the exorcist is told to take the bucket, bring water from the mouth of the twin rivers, cast a holy spell over it and sprinkle it over the man. That is the water half of [the bucket-and-purifier interpretation]{claim=DEEP-C044}; the cone in the genie's other hand is not in the transcribed text, and the transcription has not been checked against the printed page. Weakly supported, then, but supported: the Nimrud object is a known ritual vessel.

  {plate:IMG-DEEP-P04}

  The Jiroft object is the one case where function has been tested physically. The abstract of Vidale and Micheli's study describes a chlorite “hand-bag” in the museum in Tehran examined for the wear traces clearly visible on its handle and along its contour, and reads that strong wear as showing that [the object hung for a long time on a cord]{claim=DEEP-C009}. The page's caption is a faithful summary of their reading. The authors add the limit themselves: the inference rests on a single object and is far from being granted. So one Halil Rud object was probably a hung container; the class is not thereby settled, and whether this is the very object photographed above is not confirmed from the abstract.

  {plate:IMG-DEEP-P03}

  At La Venta the ledger holds only the page's captions: the figure's pouch is [usually read as an incense bag]{claim=DEEP-C010}, and the serpent framing him is [called the earliest known feathered serpent]{claim=DEEP-C003}. Neither has an evidence record.

  Set the four out again and the comparison is now legible: a known Assyrian ritual bucket, one Iranian object that hung on a cord, a Mesoamerican pouch read as a bag on the page's word, and three Anatolian forms whose own excavators decline to say what they are. The outlines rhyme; the functions run from established to unknown. What a common-source account needs, and convergence does not predict, is that the *particular* handle — its attachment, its proportion to the body, its decoration, the figures beside it — recurs across the compared objects more often than across a control set of handled containers from cultures known to be unconnected. No one has run that comparison.

  The excavators have also been asked the contact question directly. To a reader who raised later Sumerian and Assyrian bird figures in a similar posture, a team member replied that some of the site's imagery may survive into later seal images, but that at the moment [there are far too many missing links to be sure about the extent of any survival of Early Neolithic imagery, or the changes in meaning it may have undergone]{claim=DEEP-C072}. That is the contact account's requirement — dated intermediates and a route — stated as unmet by the people best placed to know, with one candidate class of intermediates named. The research item that tests it stands second on this edition's agenda.

  ## Pigs, lizards and other stone animals

  A low body, a raised back and a projecting snout make a boar legible across any distance; splayed limbs and open jaws make a crouching predator. The page reports that the excavation team's discussion of Enclosure C [distinguishes boars from snarling predators]{claim=DEEP-C045}, reading the animals in their arrangement rather than as isolated silhouettes; the claim is held on its anchor, with no evidence record yet. “Lizard” should stay a proposed identification where the animal is uncertain, and the useful next comparison is with other securely identified pig and boar sculptures rather than with whatever looks alike. Nothing in this theme is graded; it awaits objects with museum numbers.

  ## The navel of the world

  {plate:IMG-DEEP-P06}

  The linguistic parallel is the most evocative and, on inspection, the most fragile. Delphi's *omphalos* is a netted stone, Greek and ancient, which the page's caption describes as marking the meeting point of Zeus's eagles; the ancient text behind that story has not been read here. Cusco is glossed as a navel in Garcilaso's account, written after the conquest. Rapa Nui is Te Pito o te Henua, and a smooth stone near Ahu Te Pito Kura carries a name the page [glosses as “navel of light”]{claim=DEEP-C019}. Göbekli Tepe means “navel hill” in Turkish.

  The claim on which the theme turns is that [these are different kinds of evidence, differing in language, date of first record and whether the ancient builders used the name]{claim=DEEP-C018}. This edition grades it provisionally supported on a prior — Greek, Spanish, Rapanui and Turkish are four languages recorded across some two and a half millennia — while noting that none of the four source histories has been retrieved. The sharpest test is the Turkish name. If [the modern Turkish name Göbekli Tepe describes the shape of the mound]{claim=DEEP-C015}, it is a descriptive toponym given long after the builders were gone and says nothing about what they believed. The page states exactly this, and adds that [the Kurdish names for the site mean “wish hill”]{claim=DEEP-C016}; but the ledger's one record on the site's names covers the Kurdish gloss, not the Turkish, and neither is sourced on the page. The Turkish claim is unresolved, and the research item that traces all four names to their first attestation is open.

  What would change the picture: an early, builder-attested “navel” usage at two or more sites. What would settle it the other way: source histories showing, as the page proposes, that one name is a modern description, one a colonial gloss, and only Delphi's an ancient sacred designation in the language of the people who used it. A bodily metaphor for a centre is available in any language; an inherited usage would need more than this.

  ## Hands on the belly

  {plate:IMG-DEEP-P07}

  The page states that [arms and hands are carved on the central T-pillars of Enclosure D at Göbekli Tepe]{claim=DEEP-C023} — the shaft a body, the T a stylised head — a claim held on its anchor, the team's study of the central pillars not yet read. Urfa Man, the limestone statue from Şanlıurfa that the page dates to about 9000 BCE, is described by the excavation team in its own post: [both hands seem to grab his penis]{claim=DEEP-C021}. The word matters. A hand across the abdomen and a hand at the groin are close in outline but different observations — the page's own distinction — and the excavators' “grab” makes them different gestures too. The moai of Ahu Tongariki, carved some ten millennia later, meet their hands, in the page's caption, on the abdomen above the belt. The Ponce monolith at Tiwanaku, the page reports, [holds its hands to the chest]{claim=DEEP-C050}, one of them around [a snuff tablet]{claim=DEEP-C051} — captions without records.

  {plate:IMG-DEEP-P08}

  Convergence in its plainest form is stated on the page and adopted here on a prior. [Carving limbs against a stone body can protect them from breakage]{claim=DEEP-C046}, so [material constraints are a plausible contributor to the hands-on-body pose]{claim=DEEP-C047} — any carver of a monolith knows what happens to a free-standing arm. Equally, [material constraint as a contributor to the pose does not settle its symbolic meaning]{claim=DEEP-C048}: a constraint explains why hands rest against the body, not why at the abdomen rather than the groin or the chest. The deciding observation is a survey of stone figures in the same media from cultures with no possible connection: if the pose varies with the stone and the tool, constraint wins; if it clusters along a route, something else is happening.

  ## Serpents, and the feathered serpent

  {plate:IMG-DEEP-P12}

  Snakes are everywhere in the gallery: coiled around the Olmec figure at La Venta, gripped by the hero on the Jiroft object, projecting in feathered collars from the Temple of the Feathered Serpent at Teotihuacan. The page reports [a broad cosmic-serpent motif class in 37% of sampled traditions]{claim=DEEP-C025} — another high base rate, weakly supported on the same self-reported footing as the bird-men figure. The feathered serpent of Mesoamerica is a much more specific thing than “snake”, and any comparison worth making has to preserve the feathers, the head, the body's arrangement and its relation to a human figure.

  The point that governs both catalogue results is also stated on the page: [a catalogue's geographical distribution of a broad motif class cannot by itself distinguish independent invention from very old transmission]{claim=DEEP-C026}. The same map fits a serpent invented a hundred times and a serpent inherited once. Telling them apart takes dated intermediates or a model with stated assumptions — and the one set of excavators asked about intermediates, above, reports missing links.

  The catalogue experiment's headline is the most consequential thing in the case and the least tested. The page reports that [the three broad motif classes — birds, serpents, sacred centres — are each widespread]{claim=DEEP-C056}, and that [their bundle does not stand out against the study's documentation-preserving comparisons]{claim=DEEP-C057}. If the second holds, finding birds, serpents and a sacred centre together in a tradition is no rarer than finding any comparable trio of common motifs — which convergence predicts and a common source does not. But the ledger contains no record supporting that finding, only the page's two qualifications of it; and the first claim is supported only indirectly, through the bird and serpent figures, with no number recorded for sacred centres at all. The bundle claim is unresolved, and its data are what this edition would most like to see.

  ## The people who brought the arts

  {plate:IMG-DEEP-P09}

  The narrative parallel is as arresting as the visual one. A figure arrives, often from the sea; teaches writing, agriculture, law or craft; changes human life; departs, sometimes promising to return. Oannes in Babylonia, Viracocha in the Andes, Quetzalcoatl in Mexico and Bochica among the Muisca recur in the comparison. The exact arrival, teaching and departure have to be read in each account, not supplied by a composite biography.

  One figure has both a text and a dated image behind him, and the text is in the ledger. Berossus's *Babyloniaca* survives only in excerpts — here through Alexander Polyhistor as preserved by Syncellus — and its first fragment describes the creature that came out of the sea in the first year: [it had the whole body of a fish, but beneath the fish's head another, human, head, and joined to the tail feet like a man's]{claim=DEEP-C081}, and a human voice. It taught men writing, mathematics and knowledge of every kind — [how to build cities, found temples and make laws, how to fix borders and divide land, how to plant and harvest; in short, everything conducive to a settled and civilised life]{claim=DEEP-C092} — and, the fragment adds, [its form has been preserved in sculpture to this day]{claim=DEEP-C082}. Which sculpture, the text does not say. On a basalt basin from Assur the god Ea stands with streams flowing from his shoulders beside a sage wearing a fish's head and skin as a cloak; the page holds that [this fish-cloaked figure is the apkallu type the texts actually name]{claim=DEEP-C052}, a claim still on its anchor. What the ledger does hold is the translators' comparative table, which [sets Berossus's Oannes beside U-An, the first of the apkallu, in a king-and-sage list from Uruk]{claim=DEEP-C086}. So the textual half of the match — a fish body over a human head, and a name aligned by scholars with the first sage — is recorded; the iconographic half, that the cloaked figure on the basin is that type, is not. [Berossus's Oannes corresponds to the fish-cloaked apkallu]{claim=DEEP-C053} is graded weakly supported on that disclosed footing. Oannes is nonetheless the one civiliser in the comparison whose “brings the arts” episode can be read in a source older than the comparative literature that joined him to the others.

  {plate:IMG-DEEP-P11}

  At Tiwanaku, the staff-bearer with the rayed head in the centre of the Gate of the Sun is often called Viracocha. The page's claim is that [that identification is a modern one]{claim=DEEP-C028}. If so, the most-reproduced “image of Viracocha” is not evidence that the story existed before the Spanish wrote it down. Unresolved, for want of a record.

  The one measured result in this theme is the page's V1 lineup experiment. AI judges were shown a civiliser account and asked to pick its partner from a lineup; the page reports that [the claimed partner ranked first in 62.5% of completed lineups, against 9% for random pairs]{claim=DEEP-C027}. That is a real signal under the experiment's conditions, and the only evidence record in the ledger pointing toward a resemblance beyond base rates. The ledger holds no record of the experiment's own stated limitations. What it can say is what the retelling account predicts: a model that has read the comparative literature knows that Viracocha and Quetzalcoatl are supposed to match, and a lineup of modern summaries would measure the similarity of modern summaries. That is the mechanism the retelling account proposes — [stories can become more alike than their originals through translation, borrowing and comparative writing]{claim=DEEP-C034} — and the Rapa Nui reliefs, read by their students against a story recorded in the nineteenth and early twentieth centuries, show how routinely a modern comparison reaches for a late text. No test has yet been run on the original passages. The decisive experiment leads this edition's research order: rerun the lineup with human raters on unrecognisable passages from the sources — Berossus via his excerptors, the early Andean chroniclers, Sahagún, Simón — against random hero narratives, and see whether 62.5% survives.

  The lost-civilisation account attaches to these figures its strongest claims: that the teachers were emissaries of a real, identifiable, technically advanced society of great age. The answer adopted here, on the prior that identity, date and capability are not properties of a resemblance, is that [similarity between motifs alone cannot establish a lost-civilisation account's claims about the source's identity, date and capabilities]{claim=DEEP-C035}. A resemblance can at most suggest a connection; who was connected to whom, when, and what they could do, needs evidence of a different kind, and none is in this ledger.

  ## What survives the water

  Flood stories raise several questions at once: whether people remember local disasters, whether particular stories travelled, and whether traditions preserve much older environmental knowledge. The page's text-coding pilot had an AI code the details of 263 flood-story summaries. The page reports that [the coded details cluster by region]{claim=DEEP-C031}, that [details associated with Genesis are unevenly distributed]{claim=DEEP-C054}, and that [generic flood motifs are widespread]{claim=DEEP-C055}.

  Each of the four accounts can live with regional clustering: inheritance with regional drift, contact along routes, independent memory of local floods, retelling in regional missions. The uneven distribution of Genesis details is the more pointed finding, because it is what the retelling account predicts — and yet, as the page says, recording a story after contact does not establish that it was borrowed. None of the three claims has an evidence record; all are held on their anchors, and the pilot coded one compiler's summaries rather than a representative collection of original accounts. What would move them: the coded data released and re-coded by human readers against original texts, with the Genesis-associated details dated, where possible, to before or after missionary contact.

  ## Indus and rongorongo

  The companion project compares the sign inventories of two undeciphered scripts and the illustrations used to connect them. Its governing claim is the one this case would apply everywhere: [a visual resemblance between signs of two undeciphered scripts does not establish shared sound, meaning or descent]{claim=DEEP-C036}. Sign shapes converge between scripts known to be unrelated; the ledger holds the principle on its anchor and none of the companion's results.

  ## When resemblance becomes evidence

  Can the resemblance people see be measured at all? The page's three image pilots tried to make AI judges rank objects by likeness. The page reports that [judges disagreed strongly with one another about the same objects]{claim=DEEP-C037}, and that [matching the kinds of objects in a lineup changed the lineup result]{claim=DEEP-C038}. The second has an evidence record and is weakly supported; the first is held on its anchor, unresolved.

  The second is the more important. *Diagnosticity* is how much an observation decides between rival explanations. If a lineup that pits a pillar against a moai, a relief and a boulder ranks them one way, and a lineup of pillars against pillars ranks them another, then part of the original resemblance was an artefact of comparing unlike kinds — a finding about every side-by-side gallery, including the one that opens this article.

  ## Where this leaves the question

  Read strictly, the ledger says this. The objects in the gallery are, on the whole, what the page's captions say they are: the primaries confirm handle-like forms on Pillar 43 whose function their excavators decline to name, an Assyrian ritual bucket filled and sprinkled, a Halil Rud object that hung on a cord, a fish-bodied Oannes who taught the arts, and birdmen carved later onto an older statue. That is a finding about description, not about history. Nothing retrieved supplies what the shared-past accounts need — a dated intermediate, a route, or a specific composite rarer than chance — and two of the primaries take rungs away: the Rapa Nui birdmen are additions read against a nineteenth-century story, and the Göbekli excavators describe the chain to later Near Eastern imagery as full of missing links. The broad classes are reported widespread, a self-report the ledger holds weakly; the bundle comparison has no supporting record. The one positive signal, the civiliser lineup, awaits the test that would separate it from what the retelling account predicts. The navel parallel rests on four names whose source histories have not been traced, one of them very probably modern.

  The verdict is *unresolved*, chosen rather than defaulted to. It means the featured hypothesis — that the resemblances record a shared past — has neither support nor refutation in the ledger: the primaries read so far describe the objects without testing the connection between them. It does not mean the evidence is balanced. Such evidence as there is leans toward base rates, convergence and retelling, and the primaries have made the strongest form of the shared-past account more expensive without touching its weakest.

  What would change our mind, in either direction:

  - A blind human lineup of original civiliser passages that beats random pairs by a margin like V1's — or one that does not.
  - A securely dated Neolithic seal or image-bearing object from Upper Mesopotamia carrying a specific Pillar 43 motif — the arched forms, the bird with disc — a millennium or more after the site: the excavators' own named intermediate, checked.
  - A count of specific composites (pose plus object plus arrangement; handle attachment plus proportion plus decoration) across the compared objects and a kind-matched control set.
  - The four navel names traced to first attestation, with the builders' usage documented or shown absent.
  - The bodies of the Jiroft and Hoa Hakananai'a papers read, and every later statement by the Göbekli team on the three forms, in case one commits to a container or a building.

  The best argument for the shared past that this edition does not answer: the catalogue experiment's null result, by the page's own admission, tests broad classes rather than the specific images in the claim — so the strongest evidence against a common source has not actually been aimed at it; the lineup signal, whatever its limitations, is a measurement where the critics have so far offered only reasons; and every primary read so far has confirmed rather than corrected the page's descriptions, so the parallel is at least drawn between correctly described things. All three are fair. All three point to the same place: the next steps are small, cheap and named, and this case waits on them.
