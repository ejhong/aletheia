- id: DEEP-E087
  title: "Garcilaso (1609): Cuzco means 'a navel' in the special language of the Incas"
  claimIds:
    - DEEP-C018
  sourceId: SRC-GARCILASO-1609
  direction: supports
  strength: moderate
  sourceStatement: "Retelling the origin legend told in the royal family, Garcilaso says Manco Capac founded the city called Cuzco, which in \"the special language of the Yncas, means a navel\"."
  editorInference: "Of the four names, Cuzco is the one the builders themselves certainly used: it is the Inca city's own name. What is late is the gloss. Its earliest record in this ledger is a Spanish-language book printed in Lisbon in 1609, and Garcilaso places the meaning not in the common speech but in a language peculiar to the Inca lineage. That source history differs from the Greek, Rapanui and Turkish ones on all three of the claim's points."
  exactLocator: "Book I, ch. XVIII, printed p. 73 (Markham's translation)"
  limitations:
    - "An English translation (1869) of the Spanish original; the Spanish wording was not read."
    - "This pass did not look for an earlier chronicler's gloss of the name, nor for colonial-era rival etymologies; 'first record' here means the earliest found, not the earliest that exists."
  reviewState: ai_extracted
  origin:
    ref: DEEP-R002, session 2026-11-22-session-site-152825
    extractedBy: claude-opus-5-5
    runId: 2026-11-22-session-site-152825
    date: 2026-11-22
- id: DEEP-E088
  title: "Garcilaso (1609): Cuzco, 'the navel of the earth', at the centre of the four quarters"
  claimIds:
    - DEEP-C018
  sourceId: SRC-GARCILASO-1609
  direction: supports
  strength: moderate
  sourceStatement: "Describing the empire's four divisions, Garcilaso writes: \"They placed the city of Cuzco in the centre, for in the peculiar language of the Yncas this word means the navel of the earth\", adding that the meaning is apt because \"the whole of Peru is long and narrow, like a human body, and the city is almost in the middle\"."
  editorInference: Garcilaso ties the gloss to the city's place at the centre of a four-part political order and to a body metaphor for the country's shape. The 'navel' sense here is a statement about the Inca state's geography, given by a writer of the early seventeenth century; it is not an attestation from the city's builders.
  exactLocator: "Book II, ch. XI, printed p. 142 (Markham's translation)"
  limitations:
    - An English translation; the Spanish was not read.
    - The same author as DEEP-E087; the two records are one witness, not two.
  reviewState: ai_extracted
  origin:
    ref: DEEP-R002, session 2026-11-22-session-site-152825
    extractedBy: claude-opus-5-5
    runId: 2026-11-22-session-site-152825
    date: 2026-11-22
