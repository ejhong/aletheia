# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license, presented as numbered
#            museum plates. Duotone treatment is applied in CSS at display
#            time; the original files are unmodified apart from resizing.
# The plates are the Wikimedia Commons photographs the founder's Deep Memory
# site uses in its gallery, fetched by scripts/add-commons-image.mjs with
# the licence checked and the credit and provenance from the Commons API,
# re-encoded at up to 1600 px; captions describe what each photograph shows.
# claimIds are empty at the opening: the ledger holds no claims yet.

- id: IMG-DEEP-COVER
  role: cover
  file: /images/cases/deep-memory/cover.jpg
  alt: >-
    Hand-tinted engraving in sepia and lapis: on an empty shore, a bird-headed
    stone figure holding a small blue disc faces a broad stone figure with
    hands folded on its belly; between them a single handled stone object
    stands in the sand.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-09-09"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph, chromolithograph plate from a vintage natural-history atlas. Two carved stone figures set far apart on a long empty shore, facing each other across the water: a bird-headed figure in profile with a bent limb and a small disc held near it on one side, a broad-shouldered statue with hands meeting on its belly on the other, and between them, half-buried in the sand, a single handled stone object. Their outlines rhyme; nothing joins them but the horizon. An allegorical emblem of resemblance across distance — never a depiction of any real monument, site, or excavated object as documentation. Fine copperplate cross-hatching and stipple engraving beneath soft, translucent hand-applied watercolor washes. Full color in subdued antique mineral pigments — warm sepia and burnt-umber stone, weathered basalt grey, a pale sand-and-sea-mist wash behind, one small faded lapis accent on the held disc — over warm-black ink linework on aged warm cream paper (#f6f1e8). Colors muted and slightly faded as if printed in 1870; never saturated modern digital color, no gradients, no glow. Darwin-era natural-history journal plate aesthetic, generous plain paper margins, quiet composition. Absolutely no text, no labels, no captions, no border frame lines. Unmistakably a hand-tinted engraving — stylized editorial artwork, not photorealistic, no photograph.

- id: IMG-DEEP-P01
  role: plate
  file: /images/cases/deep-memory/plates/vulture-stone-gobekli-tepe-sanliurfa-south-east-anatolia-tur.jpg
  alt: >-
    A limestone T-pillar photographed in situ at an angle, its face carved in low relief: along the top edge a row of three arched, handled shapes with small animals between them; below, a large bird with spread wings beside a disc, a scorpion and other animals. The lower part of the pillar is below the frame.
  source: commons
  license: "CC BY-SA 2.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/2.0"
  credit: "Sue Fleckney, via Wikimedia Commons"
  plateNumber: 1
  depicts: >-
    Pillar 43 ("the Vulture Stone") in Enclosure D at Göbekli Tepe, Şanlıurfa, Turkey, photographed in situ in 2013: the top register carries three arched, handled forms with small animals; the main register a vulture-like bird, a disc and a scorpion. The function of the handled forms is unknown; the headless figure the excavators describe lies below the frame.
  provenance:
    photographer: "Sue Fleckney"
    date: "2013-08-20 11:21:18"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Vulture_Stone,_Gobekli_Tepe,_Sanliurfa,_South-east_Anatolia,_Turkey.jpg"
    originalTitle: "File:Vulture Stone, Gobekli Tepe, Sanliurfa, South-east Anatolia, Turkey.jpg"
  claimIds: []

