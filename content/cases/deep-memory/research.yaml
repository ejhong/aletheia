- id: DEEP-R002
  title: Source history of the four 'navel' names
  summary: For omphalos (Delphi), Garcilaso's gloss of Cusco, Te Pito o te Henua / Te Pito Kura and Göbekli Tepe, find the earliest attestation of the 'navel' meaning, the language it is recorded in, and whether the builders' own usage is documented — from primary texts (Pausanias/Pindar for Delphi; Garcilaso de la Vega 1609; early Rapanui lexicons; Turkish/Kurdish toponymic records).
  claimIds:
    - DEEP-C015
    - DEEP-C016
    - DEEP-C018
    - DEEP-C019
  track: either
  effortTier: desk
  informationGain: "Tests CLM-DEEP-018 directly: if the four names differ in date and origin as the page proposes, the navel parallel drops to a shared bodily metaphor; if any shares an early, builder-used meaning, that is unexpected and worth reporting."
  origin:
    ref: report 2026-09-09-inbox-deep-memory-200334
    extractedBy: claude-fable-5-1
    runId: 2026-09-09-draft-deep-memory-203731
    date: 2026-09-09
  status: answered
  statusNote: "Answered for DEEP-C018, the claim it was written to test. Delphi: Greek, on record in Pindar's Pythian 4 of 462 BC and reported by Pausanias as the Delphians' own word (DEEP-E087, DEEP-E088, DEEP-E089). Cusco: Spanish, 1609, Garcilaso's gloss assigned to the Incas' private language (DEEP-E090, DEEP-E091), rejected as unfounded by Cerrón-Palomino (DEEP-E092, on new claim DEEP-C094). Te Pito o te Henua: Rapanui, recorded in the late nineteenth century and glossed 'navel and uterus' by Thomson (DEEP-E093); read as 'land's end' by Churchill, from an islander's answer, and by Holmer from the Maori cognate (DEEP-E094, DEEP-E095, on new claim DEEP-C093). Göbekli Tepe: modern Turkish, glossed 'belly mountain' by the excavators as a description of the mound's shape; the site was recognised under that name in 1963 (DEEP-E096, also on DEEP-C015). No name shares an early, builder-used meaning but Delphi's. Left over — the Te Pito Kura gloss, the Kurdish names, the first record of the Turkish toponym, and the later Rapanui scholarship — is carried by DEEP-R006."
  statusBy: 2026-11-16-session-site-170920
  statusDate: 2026-11-16
