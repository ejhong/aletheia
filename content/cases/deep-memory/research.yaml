- id: DEEP-R006
  title: "The navel names, second pass: the first record of 'Göbekli Tepe', the Kurdish name, Te Pito Kura, and the later Rapanui dictionaries"
  summary: "Read (a) the 1963 Istanbul–Chicago survey report (Benedict 1980) or the excavation team's account of it, for the earliest written record of the name Göbekli Tepe; (b) a Kurdish toponymic or ethnographic source for Girê Mirazan and its meaning; (c) Englert's and later Rapanui dictionaries for 'pito', 'henua' and the compound Te Pito Kura; and (d) Roussel's 1908 vocabulary itself, for his rendering and any note on where he heard the phrase. Decision rule: if any record earlier than Roussel's and Thomson's, or any later dictionary, gives Te Pito o te Henua as the island's own old name meaning 'navel of the land', DEEP-C093 narrows to a dispute among early recorders and the Rapanui case moves toward the Greek one on builder use; if later dictionaries side with Churchill, the island-name 'navel of the world' is a contact-era usage. If the Göbekli name proves older than the twentieth century, nothing changes for builder use (Turkish postdates the site by millennia) but the first-record date is filled in."
  claimIds:
    - DEEP-C015
    - DEEP-C016
    - DEEP-C018
    - DEEP-C019
    - DEEP-C093
  track: either
  effortTier: desk
  informationGain: "Closes the gaps DEEP-R002 left. The Rapanui part decides whether the one 'navel' name that might have been the first settlers' own was so, which is the only route by which the navel parallel could carry more than a shared bodily metaphor."
