- id: DEEP-R002
  title: Source history of the four 'navel' names
  summary: For omphalos (Delphi), Garcilaso's gloss of Cusco, Te Pito o te Henua / Te Pito Kura and Göbekli Tepe, find the earliest attestation of the 'navel' meaning, the language it is recorded in, and whether the builders' own usage is documented — from primary texts (Pausanias/Pindar for Delphi; Garcilaso de la Vega 1609; early Rapanui lexicons; Turkish/Kurdish toponymic records).
  claimIds:
    - DEEP-C015
    - DEEP-C016
    - DEEP-C018
    - DEEP-C019
  track: either
  effortTier: desk
  informationGain: "Tests CLM-DEEP-018 directly: if the four names differ in date and origin as the page proposes, the navel parallel drops to a shared bodily metaphor; if any shares an early, builder-used meaning, that is unexpected and worth reporting."
  origin:
    ref: report 2026-09-09-inbox-deep-memory-200334
    extractedBy: claude-fable-5-1
    runId: 2026-09-09-draft-deep-memory-203731
    date: 2026-09-09
  status: answered
  statusNote: "Three of the four histories are now read from primaries. Delphi: Greek, used by the sanctuary's own community, attested from Pindar's ode of 462 BCE (DEEP-E090) through Strabo (DEEP-E091) and Pausanias (DEEP-E089). Cusco: the Incas' own city name, with the 'navel' gloss first found in Garcilaso's book of 1609, which places it in a language peculiar to the Inca lineage (DEEP-E087, DEEP-E088). Te Pito o te Henua: recorded by Europeans in the later nineteenth century. Its meaning and its standing as the island's name were already disputed by 1912 — Thomson's 'navel and uterus' and Hotu Matua tradition against Churchill's 'end of the land' and an islander's three headlands (DEEP-E094 to DEEP-E097; new claim DEEP-C093). Göbekli Tepe: a Turkish name glossed as 'potbelly hill', describing the mound (DEEP-E098), for a Pre-Pottery Neolithic site (DEEP-E099). The four differ on language, date of first record and builder use, as DEEP-C018 says. The Göbekli name's first record, the Kurdish name and Te Pito Kura are carried to DEEP-R006."
  statusBy: 2026-11-22-session-site-152825
  statusDate: 2026-11-22
