- id: DEEP-R004
  title: "Test the excavators' named intermediate: do Göbekli Tepe motifs demonstrably persist into Neolithic stamp seals?"
  summary: "Retrieve Atakuman 2015 (Cambridge Archaeological Journal 25/4, 'From monuments to miniatures') and the seal corpus it publishes. For each Pillar 43 motif class relevant to this case — the H-shaped symbol, the arched box-like forms, the bird-with-disc composition — record whether a securely dated Neolithic stamp seal or image-bearing object from Upper Mesopotamia carries the same motif, with the object's site, stratum and date. Decision rule: if at least one of these specific motifs appears on dated seals continuing for a millennium or more after Göbekli Tepe, the team's 'survival into seals' statement gains a documented instance and the ledger's principle that geography alone cannot separate transmission from invention acquires its first dated intermediate for the local case; if none of the specific motifs appears and the continuity is confined to generic animal figures, the 'missing links' statement stands and the intermediate class is closed for this case. Either way the result bears only on continuity within Anatolia, not on any chain to Assyria or beyond."
  claimIds:
    - DEEP-C072
    - DEEP-C026
  track: publication_prize
  effortTier: desk
  informationGain: Names and checks the only candidate intermediate class the diggers themselves offer; a positive result converts a general caution into a dated local continuity, a negative one removes the one named route for the handled-object and bird-figure parallels.
  origin:
    ref: report 2026-09-19-report-deep-memory-120902
    extractedBy: claude-fable-5-1
    runId: 2026-09-19-draft-deep-memory-121715
    date: 2026-09-19
- id: DEEP-R005
  title: Buildings or objects? Read every team statement on the three forms of Pillar 43
  summary: "Retrieve Schmidt 2012 (Göbekli Tepe: A Stone Age Sanctuary, p. 244 and the Pillar 43 discussion), Becker et al. 2012 (ZORA 5), and Notroff et al. 2017 ('More than a vulture', the response to Sweatman and Tsikritsis). For each, record verbatim what the authors say the three arched forms are or might be, and whether any commits to a container, a building, or neither. Decision rule: if any team publication later than 2017 commits to a handled object or container, the ledger's 'function uncertain' claims weaken and the founder's 'handbag' comparison regains its Göbekli leg; if every team text either offers the building reading or refuses a decision, the uncertainty claims are confirmed by the full run of the team's literature and the comparison of a known Assyrian bucket with these forms should be presented as a comparison of shapes only."
  claimIds:
    - DEEP-C012
    - DEEP-C066
    - DEEP-C065
  track: publication_prize
  effortTier: desk
  informationGain: Settles whether the 'no decision' statement is the team's standing position or a 2016 snapshot, and puts the rival building reading on the record alongside the container reading, each from the excavators' own words.
