  synthesis: >-
    The megalithic casting hypothesis is structurally caught in a disciplinary
    stalemate where both sides frequently argue past each other using orthogonal
    lines of evidence. To steelman the orthodox account, the carving and
    transport of megalithic stones is supported by robust, independent, and
    convergent sets of data. Quarry matching utilizing bulk trace-element
    geochemistry successfully fingerprints monument stones to distinct natural
    deposits, as definitively demonstrated at Stonehenge. Furthermore, when
    independent experts apply binder-aware petrographic analysis to disputed
    artifacts, such as the Great Pyramid casing stones, they observe macro-scale
    continuous sedimentary features, intact marine fossils, and localized
    tectonic fractures—none of which survive a crushing and casting process.
    Crucially, as Jana's 2007 analysis utilizing a geopolymer positive control
    proved, binder phases and artificial microstructures are glaringly obvious
    under modern microscopy when actually present, yet these diagnostic
    signatures are entirely absent in the authenticated pyramid samples. This
    provides highly probative physical falsification of the specific Egyptian
    casting claims.

    Conversely, to steelman the casting hypothesis, proponents correctly
    identify a major methodological vulnerability in the orthodox reliance on
    standard trace-element provenancing. Bulk XRF or ICP-MS techniques are
    fundamentally blind to lighter elements like hydrogen, carbon, and oxygen,
    meaning they cannot detect the presence of organic or mineral binders.
    Consequently, if a megalith were cast in situ using crushed aggregate
    sourced from a specific natural quarry, it would yield a perfect
    trace-element match to that quarry. "Finding the quarry" does not inherently
    rule out the stone being cast from that quarry's debris. Proponents also
    validly note that the required chemical ingredients (like natron) and
    pyrotechnologies were available to Bronze Age societies. Moreover,
    conventional mechanical explanations struggle to replicate observed
    quarrying rates—such as the painfully slow 216 cubic centimeters per hour
    measured in recent dolerite pounding experiments—and independent replication
    of the characteristic Aswan scoop marks remains undocumented.

    Ultimately, the hierarchy of evidence decays rapidly at the top of the
    ladder. While the basic feasibility of geopolymer synthesis (GEO-C012) and
    the presence of ancient reagents (GEO-C011) are well supported, the actual
    attribution claims lack any non-proponent laboratory validation. The
    foundational Egyptian claim (GEO-C020) is contradicted by independent
    petrography, and the Andean claim (GEO-C021) rests on unreplicated proponent
    data. The overarching hypothesis remains strictly unresolved, requiring
    pre-registered, blinded microstructural audits of structurally secure
    samples to finally move the debate beyond methodological proxy wars.
