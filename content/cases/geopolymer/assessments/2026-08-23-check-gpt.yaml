  synthesis: >-
    Across the ladder, feasibility and conventional archaeology are both in
    decent shape, but the attribution claims that matter most remain undecided
    in opposite directions for Egypt and the Andes. The mechanism rung is
    comparatively strong: GEO-C011 (natron availability) is well_supported by
    mainstream glass/flux studies, and GEO-C010 (achieving ~850 °C with ancient
    pyrotechnology) is provisionally_supported given documented glassmaking and
    metallurgy, even though industrial-scale throughput is not demonstrated.
    GEO-C012, the feasibility of making large reconstituted limestone blocks
    with anciently plausible inputs, is likewise provisionally_supported: modern
    geopolymer and lime–pozzolan research (including Barsoum’s feasibility work
    and Davidovits’ demonstration blocks) shows such materials can exist; what
    is not shown is that any such block actually matches monument microstructure
    under blind analysis. The discovery-pathway and iconographic support claims
    (GEO-C013, GEO-C005) are weak and unresolved, resting on anecdote and
    untested reinterpretation.

    On the key Egyptian attribution claim (GEO-C020), the evidence is internally
    conflicted. Barsoum 2006 (GEO-E012) and the MacKenzie NMR paper (GEO-E017)
    provide two moderate-strength, peer‑reviewed, materials‑science lines that
    read certain samples as reconstituted or binder‑cemented; they show that
    non‑proponent labs have seen anomalies compatible with human intervention.
    At the same time, four independent petrographic studies (Folk & Campbell,
    Harrell & Penrod, Jana, Freestone & Middleton: GEO-E018–E021) consistently
    find that sampled pyramid limestones look like natural sedimentary rocks
    and, in Jana’s case, that a genuine Davidovits geopolymer control exhibits a
    clear binder signature absent from any casing sample. These undermining
    records are strong, but their scope is limited by small sample counts,
    conference venues for some, and a genuine factual dispute about which
    physical object was the “Lauer sample.” Given this clash of competent but
    restricted analyses and unresolved chain‑of‑custody issues, GEO-C020 stays
    weakly_supported: there is real anomaly evidence, but it is outweighed in
    aggregate by direct negative petrography and by the lack of a blinded,
    pre‑registered test.

    In the Andean case (GEO-C021), the situation inverts. The only direct
    materials evidence (GEO-E006, GEO-E007) consists of two moderate
    peer‑reviewed papers from the Davidovits team reporting organics and
    “non‑natural” microstructure, with no independent replication, and an older
    quarry‑attribution study (GEO-E008) pointing to natural sources for the
    sandstones. Because there has been no outside laboratory check, the
    supporting line is neither negligible nor decisive. The best rating here is
    mixed: plausibly significant anomalies reported by proponents, countered by
    conventional quarrying evidence and the lack of independent confirmation.

    Methodologically, GEO-C030 is an important clarifier. Fóti’s critique,
    bolstered by the editor’s synthesis and by general analytical chemistry
    knowledge, correctly notes that trace‑element provenance tools (PXRF,
    ICP‑MS/AES, XRD in bulk‑chemistry mode) do not see hydrogen and are largely
    blind to water‑rich binders and many organics; a quarry match therefore
    cannot, by design, rule out stone cast from aggregate taken at that quarry.
    However, Jana’s positive‑control study and the broader petrographic
    literature show that binder phases, porosity patterns, and related
    signatures are in fact detectable when present. Thus GEO‑C030 is mixed:
    strong as a warning against over‑interpreting provenance chemistry, weak as
    a shield against direct petrography.

    At the observation rung, Marčiš et al.’s quarry‑rate measurement (GEO-C001)
    is provisionally_supported and moderately diagnostic. It stresses simple
    “pounders alone” timelines but is equally compatible with more mundane
    supplemental methods (fire‑setting, better tooling, work‑crew learning) as
    with casting. The Aswan tourist anecdote, vertical shaft geometry, Al‑Ma’mun
    salt story, and Rekhmire mural reinterpretation (GEO‑C002, GEO‑C006,
    GEO‑C003, GEO‑C005) all remain unresolved: they either lack primary‑source
    verification, systematic measurement, or any exclusion of conventional
    alternatives. None provides a secure lever on attribution.

    Rolling this up to the headline disjunctive claim (GEO-C022), there is
    credible but non‑replicated anomaly evidence for Andean casting, a set of
    conflicting but overall more negative analyses for Egyptian casting, and a
    solid mechanistic basis that makes casting chemically and technologically
    plausible somewhere. Conventional carved‑and‑transported explanations retain
    strong support from quarries, unfinished stones, tools, ramps, and
    provenance studies, and nothing in the current record forces abandoning
    them. Yet because no monument has undergone the decisive blinded,
    binder‑aware comparison the case itself calls for, we cannot firmly
    establish or decisively contradict the existential “at least one monument”
    thesis. Given a mix of under‑powered positives, substantial but not fully
    decisive negatives, and clear methodological gaps, the fairest overall
    assessment is mixed rather than unresolved: there is a real, structured
    evidentiary conflict that only targeted new work (GEO-R003, GEO-R004, and
    independent re‑analysis at Tiwanaku) can resolve.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: "No monument has yet been subjected to a blinded, binder‑aware
      comparative test, so there is no direct, decisive positive or negative.
      The feasibility rung (GEO‑C012, GEO‑C010, GEO‑C011) is provisionally to
      well supported: casting is chemically and technologically plausible with
      ancient inputs. There is also some anomaly evidence from actual
      monuments—Barsoum’s and MacKenzie’s Egyptian work and the Davidovits
