      limestone. The strongest opposing consideration is the weight of
      conventional quarry, tooling, and provenance evidence, plus multiple
      binder‑sensitive petrographic studies that fail to find casting signatures
      where they have been sought."
  - claimId: GEO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: "Barsoum 2006 (GEO‑E012) and MacKenzie et al. 2011 (GEO‑E017) provide
      moderate, peer‑reviewed support for the idea that at least some pyramid
      stones show microstructural and NMR features suggestive of reconstituted
      limestone or a human‑made binder; this is non‑trivial support,
      particularly because Barsoum’s group is not part of the Geopolymer
      Institute. However, four independent petrographic and microanalytical
      studies (GEO‑E018–E021) consistently conclude that examined blocks and
      fragments are natural limestone lacking any clear geopolymer‑type binder
      or aggregate‑cement fabric; Jana’s inclusion of a genuine geopolymer
      positive control is especially persuasive in showing what a strong casting
      signature should look like. The factual dispute over Lauer‑sample
      identity, small and potentially unrepresentative sample sets, and the
      shift from an alkali geopolymer to a C–S–H binder all prevent either side
      from being decisive, leaving the net support for actual casting weak. The
      strongest opposing consideration is precisely Jana’s positive‑control
      based negative: he detects the geopolymer signature clearly in the control
      but not in any casing sample, arguing that at least the original
      Geopolymer‑style recipe was not used."
  - claimId: GEO-C021
    verdict: mixed
    confidence: moderate
    reasoning: "Two peer‑reviewed papers by the Davidovits team (GEO‑E006, GEO‑E007)
      report organics and microstructures in Pumapunku andesite that they
      interpret as incompatible with natural volcanic rock and indicative of a
      geopolymer‑like binder, which moderately supports casting if the analyses
      and interpretations hold. Against this, the only cited contrary study
      (GEO‑E008) is a 1971 Bolivian provenance report attributing the
      sandstones, not the andesite, to natural quarries, using pre‑modern
      analytical methods that may not distinguish cast stone from quarry
      aggregate. Because all positive evidence comes from a single, highly
      invested team and has not been independently replicated or re‑checked
      under agreed sampling protocols, the result cannot be taken as
      established. The strongest opposing consideration is precisely the lack of
      independent replication and contested chain of custody: without outside
      labs confirming the anomalies, they could reflect sampling, contamination,
      or over‑interpretation rather than casting."
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: high
    reasoning: Modern geopolymer chemistry and related lime–pozzolan systems are
      well established, and feasibility work (GEO‑E013, GEO‑E022) shows that
      large, strong blocks of reconstituted stone can be produced with mineral
      inputs, lime, and siliceous additives at modest temperatures, all
      compatible with ancient technology. This demonstrates that making visually
      convincing artificial limestone is chemically and technically realistic in
      principle. The main limitation is that none of the demonstration blocks
      has been subjected to a blind, side‑by‑side petrographic comparison with
      quarry and monument stone, so exact similarity in microstructure and trace
      phases is unproven. The strongest opposing consideration is this gap
      between modern lab feasibility using optimized recipes and proof that any
      ancient builders actually matched monument‑grade material in practice.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "It is well accepted that ancient glassmaking and copper/bronze
      metallurgy reached or exceeded 800–900 °C, and the cited Badari glass
      precedent (GEO‑E016) at least plausibly extends such pyrotechnology before
      the pyramid age, so achieving ~850 °C in crucibles or small furnaces with
      charcoal and bellows is quite consistent with broader archaeological
      knowledge. That supports the claim that nothing in the proposed
      natron‑based silicate chemistry is thermally impossible. The strongest
      opposing consideration is the scale issue: evidence of small‑scale furnace
      temperatures does not automatically entail the ability to run large‑scale,
      continuous natron or lime processing at the volumes hypothesized for
      casting major masonry."
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: Shortland et al. 2006 and Sayre & Smith 1961 (GEO‑E010, GEO‑E011)
      provide mainstream, detailed evidence that Wadi el Natrun and al‑Barnuj
      supplied natron at large scale for Egyptian vitreous industries, and that
      a compositional shift in glass corresponds to a 7th–9th century transition
      away from natron toward plant ash. This securely establishes the existence
      and large‑scale exploitation of natron over many centuries, plus a later
      decline. The strongest opposing consideration is that all documented uses
      are for glass, faience, and ritual applications; no surviving text or
      archaeological context directly associates natron with building stone
      production.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: The only support (GEO‑E015) is an unattributed anecdote of rock‑like
      material forming in a repeatedly used outdoor fire pit, with no identified
      site, material characterization, or experimental replication. Without
      controlled tests checking whether such pits can actually produce hard,
      structurally competent stone rather than friable sinter, the claim remains
      speculative. The strongest opposing consideration is that, given known
      ash–carbonation and clinker phenomena, it is at least as plausible that
      casual firepits produce weak, crumbly deposits that would not suggest a
      useful stone‑casting technology.
  - claimId: GEO-C030
    verdict: mixed
    confidence: high
    reasoning: "Fóti’s methods critique (GEO‑E024), plus general knowledge of XRF
      and ICP‑MS, correctly states that standard trace‑element provenance
      workflows largely ignore hydrogen, carbon, and bound water and use
      calibrations assuming natural rock; they therefore cannot, by themselves,
      distinguish carved stone from material cast with quarry aggregate of the
      same metallic fingerprint. This justifies the core of GEO‑C030 as applied
      to provenance claims. However, Jana’s study with a geopolymer positive
      control and other petrographic work (GEO‑E018–E021) show that binder
      phases and casting textures are detectable using optical microscopy,
      SEM‑EDS, and NMR when they are present, so the “blindness” critique cannot
      be generalized to materials analysis as a whole. The strongest opposing
      consideration is exactly this: where binder‑aware microscopic methods have
      been applied directly to monument stone, they have mostly failed to find
      casting signatures, undermining the use of GEO‑C030 as a broad
      methodological escape hatch."
  - claimId: GEO-C001
    verdict: provisionally_supported
    confidence: high
    reasoning: GEO‑E001 documents a peer‑reviewed, instrumented experiment by Marčiš
      et al., who measured granite removal at 216 cm³/h with a dolerite pounder,
