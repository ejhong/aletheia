      ancient pounders, with no data on number of attempts, strike duration,
      skill level, or precise wear patterns over time. Without a structured
      observational or experimental study, this remains an anecdote that might
      reflect only brief, unskilled efforts. The strongest opposing
      consideration is that even if entirely accurate, tourist behavior is a
      poor proxy for trained ancient crews working systematically, so failure in
      this context would not challenge the pounding hypothesis strongly.
  - claimId: GEO-C006
