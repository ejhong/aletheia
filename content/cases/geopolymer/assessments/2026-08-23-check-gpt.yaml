      Obelisk’s quarrying within conventional timelines. As the only modern,
      quantitative rate measurement, it deserves considerable weight. The
      strongest opposing consideration is that this is a single study with one
      protocol and rock type; more expert teams, improved technique, or
      different granite conditions could plausibly yield higher rates, reducing
      the anomaly.
  - claimId: GEO-C002
    verdict: unresolved
    confidence: low
    reasoning: The support (GEO‑E003) is a qualitative report by Fóti that tourists
