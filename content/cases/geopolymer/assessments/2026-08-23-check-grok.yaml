  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Bulk trace-element tools (PXRF, ICP-MS/AES) are insensitive to H, C,
      and O, and a crushed-quarry aggregate re-bound with a few percent of
      binder will largely keep the quarry's metallic fingerprint, so a quarry
      match does not by itself answer the casting question. Fóti's own chapter
      concedes petrography and microscopy, and Jana 2007 demonstrated that a
      real alkali-aluminosilicate casting signature is detectable when present —
      so the claim is strong against over-reading provenance and weak as a
      shield against binder-aware materials analysis. The strongest opposing
      consideration is the claim's own list: XRD is not a trace-element method
      and can see crystalline binder phases, and Fóti's methods table misstates
      NMR, which is exactly the technique MacKenzie et al. used on the
      pro-casting side."
  - claimId: GEO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Marčiš et al. 2023 is a peer-reviewed photogrammetric measurement
