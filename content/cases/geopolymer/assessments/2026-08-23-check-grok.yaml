  synthesis: >-
    The featured hypothesis is an existence claim: at least one major megalithic
    monument contains man-made cast stone. Existence claims are confirmed by a
    single clean positive and are only globally closed by exhaustive negatives.
    Neither condition is met on this record. That is why the case verdict is
    unresolved — a finding about the shape of the evidence, not a polite
    default.

    Steelman the orthodox account first, because it is strong. Quarries still
    hold unfinished monuments attached to bedrock. Tools, worker settlements,
    administrative records, ramp remains, and experimental carving exist. On the
    Egyptian attribution, four independent petrographic programs (Folk and
    Campbell; Harrell and Penrod; Jana; Freestone and Middleton) read the
    examined pyramid limestone as natural. Jana's study is the methodological
    high-water mark in the file: a genuine Davidovits geopolymer was run as a
    positive control, the alkali-aluminosilicate binder signature was obvious in
    that control, and it was absent from every casing-stone sample, while the
    Si-rich spheres highlighted by Barsoum occur as opal-CT lepispheres in
    ordinary Tura limestone. Macro-scale bedding, burrows, marine fossils, and
    tectonic fractures confined to individual blocks are especially hard to
    reconcile with slurry casting. For Pumapunku, the only laboratory positives
    come from one proponent team on samples of contested custody, and a 1971
    Bolivian Academy study attributes the sandstones to identifiable quarries.
    Forty-five years after Davidovits' proposal, no blinded, prespecified,
    binder-aware comparison of disputed monument stone against geologically
    matched natural controls has been published.

    Steelman the casting side with equal care. Feasibility is not the obstacle.
    Modern geopolymer chemistry, the Geopolymer Institute's demonstration
    blocks, and Sierra et al. 2010 (lime plus diatomaceous earth forming C–S–H
    at room temperature) show that limestone-like material can be made with
    inputs that are not obviously beyond a Bronze Age toolkit. Egypt had
    industrial natron; charcoal-and-bellows pyrotechnology reaches the relevant
    temperatures. The methodological hinge is real: PXRF and ICP-MS are blind to
    hydrogen, carbon, and oxygen, so a quarry fingerprint inherited by crushed
    aggregate cannot, by itself, rule out casting. Barsoum 2006 remains the only
    non-Davidovits laboratory dataset read as reconstituted limestone, and
    MacKenzie et al. 2011 used solid-state NMR to suggest a calcium-silicate gel
    in a Bent Pyramid casing stone — a chemistry Jana did not test. Marčiš et
    al. 2023's photogrammetric rate of 216 cm³/h is a peer-reviewed stress on
    pounding-only granite extraction. If the Al-Ma'mun salt-layer report
    survives contact with primary Arabic sources, a sealed dry-limestone
    monument growing a salt coat becomes an anomaly the natron-route predicts.
    None of this requires aliens or lost machines; it requires forgotten
    chemistry, which is a documented historical phenomenon.

    The ladder decays with altitude, and that decay is the honest structure of
    the file. Ingredient and temperature claims sit on decent ground and prove
    almost nothing about monuments. Feasibility opens a door. The observation
    rung mixes one solid rate measurement with a cluster of unsurveyed anecdotes
    — tourist scoop marks, unmeasured shafts, an unattributed fire-pit story, an
    untraced caliphal salt report, an unengaged mural rereading. Attribution is
    where the hypothesis has to win, and that is exactly where independence,
    chain of custody, and diagnosticity fail. GEO-C030 correctly limits what
    quarry-matching can refute; it does not answer binder-aware petrography that
    knew what a casting signature looks like and did not find one.

    An unresolved headline therefore names a real gap. The hypothesis remains
    scientifically legitimate because the chemistry works and the discriminating
    experiment is unrun. It remains unestablished because every climb from
    feasibility to a named monument currently dies on independence, sample
    security, or a documented natural explanation. A blinded microstructural
    comparison against prespecified cast-stone criteria, or an independent
    re-analysis of the Pumapunku samples, would move the case. Until then the
    existence claim should not be treated as weakly confirmed or as closed.
