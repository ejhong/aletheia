      far GEO-E009's Stonehenge match can be pressed as an anti-casting
      argument). But the claim as stated overreaches: it sweeps in XRD, which is
      mineralogical and was in fact used to look for zeolitic cement in the
      Lauer work (GEO-E019), and its source's methods table misstates NMR —
      solid-state ²⁹Si NMR is exactly what the pro-casting MacKenzie study used
      (GEO-E017). The strongest opposing consideration is Jana 2007 (GEO-E020):
      its positive control proves binder signatures are detectable when present,
      so the blindness argument shields the hypothesis from provenance overreach
      but not from binder-aware petrography. Mixed: sound as a critique of
      quarry-matching, overbroad as written, and no general immunity claim."
  - claimId: GEO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The claim is a measurement, and the measurement exists: a
      peer-reviewed photogrammetric study reports ~216 cm³/h at 85 strikes/min
      (GEO-E001), with the authors themselves concluding against pounders as the
      sole method. Context record GEO-E002 suggests the orthodox rate it
      displaces rested on a thin experimental base, though that characterization
