      nothing independent on either side."
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: 'The feasibility claim as stated — convincing artificial limestone
      from ancient-available materials and temperatures — is backed by
      established chemistry (GEO-E022 demonstrates C–S–H gel formation from lime
      and diatomaceous earth at room temperature) and by self-reported multi-ton
      demonstration blocks (GEO-E013). Per the assessment rules, part of this
      verdict leans on general scientific background: alkali-activated and
      pozzolanic materials are a mature industrial field, which calibrates
      plausibility beyond what the evidence records alone show. The strongest
      opposing consideration is that no demonstration block has been
      independently analyzed and blind-compared against monument stone, and
      modern production knowledge does not establish ancient production — the
      gap between "can be made" and "was made, indistinguishably, at monument
      scale" is exactly what remains unproven. As a mechanism-rung claim,
      provisionally_supported is warranted.'
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The only evidence record is Fóti's citation of Badari-period
      glassmaking as an ~850 °C precedent (GEO-E016), whose dating and
      temperature basis remain unverified. The verdict nonetheless lands at
      provisionally_supported, and I flag per the rules that this leans heavily
      on general background rather than the record: ancient glass, faience, and
      copper metallurgy demonstrably operated at or above this range, so the
      narrow temperature-availability claim faces no plausibility problem. The
      strongest opposing consideration is the scale-up gap — a crucible reaching
      850 °C is not an industrial process sustaining it over tonnage — but that
      objection bears on production feasibility, not on the claim as stated,
      which is only about achievable temperature."
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: "Shortland et al. 2006 (GEO-E010, strong, mainstream peer-reviewed)
      documents Wadi el Natrun and al-Barnuj as the primary ancient natron
      sources and the 7th–9th-century decline and replacement by plant ash;
      Sayre & Smith 1961 (GEO-E011) supplies the compositional typology
      underpinning that timeline. The claim is uncontroversial in the literature
      and uncontested anywhere in the record. The strongest opposing
      consideration bears on diagnosticity rather than truth: documented natron
      consumption is fully accounted for by glass, faience, and ritual use, and
      no ancient text ties natron to building stone — so while the claim itself
      is well_supported, it lifts the casting hypothesis barely at all."
  - claimId: GEO-C013
    verdict: unresolved
    confidence: moderate
    reasoning: "The sole support is an unattributed anecdote of rock-like material
      forming in a long-used fire pit (GEO-E015), flagged as under-sourced by
      the geo project's own skeptical review; no controlled replication exists
