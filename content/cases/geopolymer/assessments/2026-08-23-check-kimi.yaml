      opposing consideration is external validity: one team, one protocol, one
      granite, one tool configuration — and trained ancient crews with
      maintained pounders and optimized technique could plausibly beat the
      experimental rate, so the number stresses the orthodox timeline without
      breaking it. Unreplicated but methodologically modern and quantitative:
      provisionally_supported, with GEO-R002 the designed replication."
  - claimId: GEO-C002
    verdict: unresolved
