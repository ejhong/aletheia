      that there is nothing to weigh: one unattributed story and zero
      measurements. Unresolved is substantive here rather than a default — the
      claim is cheaply testable in either direction and has never been tested."
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: "The claim's core is instrumentally sound: PXRF and ICP-MS/AES
      genuinely cannot see hydrogen, carbon, or oxygen, calibrations presuppose
      natural stone, and aggregate crushed from a quarry retains that quarry's
