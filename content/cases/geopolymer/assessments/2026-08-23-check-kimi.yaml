  synthesis: >-
    The casting hypothesis is best understood as a ladder whose lower rungs are
    in reasonable condition and whose top rungs carry almost no independent
    weight. Steelmanning the proponents: feasibility is real. Modern geopolymer
    and lime-pozzolan chemistry is established science (GEO-E022), natron supply
    at industrial scale is documented in mainstream archaeology (GEO-E010), the
    required temperatures were within ancient reach (GEO-E016, plus general
    background), and demonstration blocks exist (GEO-E013) — so the hypothesis
    requires no unattested technology, only unattested application. One
    peer-reviewed measurement (GEO-E001) genuinely stresses the dolerite-pounder
    orthodoxy. The methodological critique (GEO-E024) is locally sound: bulk
    trace-element provenance is blind to H/C/O, so a quarry match cannot by
    design exclude casting from same-quarry aggregate, and "we found the quarry"
    overreaches when read as anti-casting proof. And the decisive experiment — a
    blinded, binder-aware comparison with prespecified criteria — has never been
    run, which is an institutional fact, not a scientific resolution.

    Steelmanning the orthodoxy: the conventional account rests on convergent
    positive evidence — quarries with unfinished pieces, recovered tools, worker
    settlements, experimental replication, provenance matches — and requires no
    novel mechanism anywhere. Against the specific attribution claims, four
    independent multi-technique petrographic examinations (GEO-E018, GEO-E019,
    GEO-E020, GEO-E021) all conclude natural limestone; one of them (GEO-E020)
    is a genuine discriminating test with a geopolymer positive control, which
    found the casting signature clearly detectable in the control and absent
    from every casing stone, and supplied documented natural explanations for
    the headline anomalies (opal-CT lepispheres; a phosphate contamination
    halo). Macro-scale sedimentary and tectonic features run through the blocks
    themselves. The monument-level positives that remain are a
    provenance-contested 2006 study, a hedged single-stone NMR paper sharing an
    author with that group, and a single-team Pumapunku line with disputed
    custody — and the proposed binder chemistry migrated after the strongest
    negative, a classic degenerating-programme signal.

    The structural roll-up: evidence decays with altitude, and at the
    attribution altitude the independent record is negative for the recipes
    actually tested, while genuinely untested pockets remain — the revised C–S–H
    binder, an independent Pumapunku re-analysis, provenance-secure blinded
    sampling. The verdict is unresolved, substantively rather than by default:
    the tested sub-claims trend toward contradiction, the validating evidence is
    non-independent or custody-disputed, and both sides' key specimens are
    entangled in unresolved sample-identity disputes. The burden of positive,
    replicated, independent evidence is unmet after forty-five years; the case's
    real finding is that the experiments capable of moving it are cheap,
    specified, and unfunded.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: "The headline disjunction inherits the state of its two branches. For
      Egypt, the independent petrographic record (GEO-E018 through GEO-E021) is
      uniformly negative, including the only positive-control study (GEO-E020);
      for the Andes, the only monument-sample evidence is a single proponent
      team's unreplicated pair (GEO-E006, GEO-E007). No blinded, binder-aware
      comparison with prespecified criteria has ever been run on
      provenance-secure samples, and both sides' key specimens sit under genuine
      chain-of-custody disputes (Lauer authenticity; the SCA denial of Barsoum's
      sampling permission). The strongest opposing consideration is that the
      disjunction is easy to satisfy and forty-five years have produced nothing
      independent that satisfies it — a long null that itself carries weight.
      But null-by-absence differs from null-by-test: the experiment both camps
      accept as decisive has never been performed in either direction, so
      unresolved is the honest verdict rather than contradicted."
  - claimId: GEO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: "Two peer-reviewed studies report casting-consistent anomalies
      (GEO-E012, GEO-E017), and the methods critique (GEO-E024) correctly limits
      what provenance matching can say. Against that stand four independent
      multi-technique examinations concluding natural limestone: Folk &
      Campbell's macro-scale sedimentary and tectonic features across many
      blocks (GEO-E018), Harrell & Penrod on the showcase Lauer specimen
      (GEO-E019), Freestone & Middleton on a museum fragment (GEO-E021), and
      above all Jana 2007 (GEO-E020) — the only study with a genuine geopolymer
      control — which found the signature detectable in the control and absent
      from every casing stone while supplying natural explanations for Barsoum's
      anomalies. The strongest opposing consideration is that Jana's decisive
      negative covers only the alkali-aluminosilicate recipe, leaving the
      revised C–S–H gel binder of GEO-E017 untested, and the Lauer-sample
      authenticity dispute (complicated by Jana's own phosphate mapping)
      conditions the two strongest underminers. The post-negative shift in
      proposed binder chemistry, plus the contested provenance of the Barsoum
      samples, leaves the independent weight running against the claim while not
      quite extinguishing it."
  - claimId: GEO-C021
    verdict: mixed
    confidence: low
    reasoning: "The supporting evidence is two peer-reviewed 2019 papers reporting
      SEM/petrographic anomalies and organic matter in monument andesite
      (GEO-E006, GEO-E007) — but they share one team and one sample set, so they
      constitute a single non-independent line with contested chain of custody.
      The opposing evidence is the 1971 Bolivian provenance attribution to
