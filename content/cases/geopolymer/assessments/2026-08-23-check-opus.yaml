      solid-state ²⁹Si NMR is precisely what the pro-casting GEO-E017 used. The
      decisive opposing consideration is GEO-E020: a positive control
      demonstrated that binder-aware petrography and SEM-EDS do detect a real
      casting signature, so the blindness argument is a valid limit on
      provenance inference and not a shield against direct materials analysis.
      Sound in its narrow form, wrong in its stated scope — mixed is the
      accurate reading."
  - claimId: GEO-C001
    verdict: provisionally_supported
