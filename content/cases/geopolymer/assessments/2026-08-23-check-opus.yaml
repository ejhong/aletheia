    reasoning: "As a disjunction it needs only one confirmed instance, and two
      peer-reviewed Pumapunku papers plus two Barsoum-line pyramid papers
      constitute real, non-zero support that cannot be waved away. But no
      positive result from any monument has ever been independently replicated
      in forty-five years, the Pumapunku pair is a single team on a single
      contested sample set, and the branch that received the most independent
      scrutiny (Egypt) failed it under four separate examinations including one
      with a positive control. The strongest opposing consideration is precisely
      that pattern: hypotheses that survive only in the regions nobody has
      independently tested are typically not surviving on evidence. The claim
      stays weakly supported rather than contradicted because a disjunction over
      the world's megaliths cannot be closed by negative results at Giza."
  - claimId: GEO-C020
    verdict: contradicted
