  synthesis: "The case is built as an explicit ladder, and the ladder's structural
    weakness is visible in the evidence records rather than merely asserted. The
    mechanism rung is in reasonable shape: natron availability is documented by
    mainstream archaeology (GEO-E010), the required pyrotechnology is
    unremarkable for a society that smelted copper and made glass, and
    lime-pozzolan and geopolymer chemistry genuinely work (GEO-E022). But every
    one of those records is about what could have been done, and none of them
    contains monument stone. The attribution rung — the only rung that decides
    the case — rests on two independence groups: the Barsoum line (GEO-E012,
    GEO-E017, with GEO-E022 as feasibility support) and the Davidovits line
    (GEO-E006/E007, which the file itself flags as one line, not two). Against
    the Barsoum line stands the most informative body of evidence in the file:
    four examinations by groups independent of the proponents, all concluding
    natural limestone, one of them (GEO-E020) carrying a genuine geopolymer
    positive control that made the casting signature plainly visible where it
    existed and plainly absent from every casing stone, and one of them
    (GEO-E018) reporting macro-scale sedimentary and tectonic features —
    bedding, burrows, fragile worm tubes in sharp cross-section, fractures
    confined to single blocks — that a slurry or re-agglomerate should not
    reproduce. Two further facts weigh structurally: the proposed binder
    chemistry migrated from alkali-aluminosilicate to calcium-silicate gel after
    the strongest negative test, and the headline microconstituents of GEO-E012
    were later found in undisputed natural stone (opal-CT lepispheres) or traced
    to a surface phosphate contamination halo. That is the profile of a
    hypothesis whose specific predictions have been tested and failed,
    retreating to versions not yet tested. Steelmanning the other side: the
    retreat is not illegitimate. The revised C–S–H binder has genuinely never
    been tested on provenance-secure pyramid samples; Barsoum's own 2006
    specimens have never been re-examined by anyone; both sides' showcase
    samples are under live chain-of-custody disputes; the Pumapunku material has
    never been touched by an outside laboratory; and GEO-C030's narrow core is
    correct — bulk trace-element quarry matching genuinely cannot see a binder,
    so the provenance literature (GEO-E008, GEO-E009) carries far less
    anti-casting weight than it is usually assigned. The observation rung,
    meanwhile, contributes almost nothing: one unreplicated but real
    quarrying-rate measurement that stresses timelines without implicating
    casting, and four untraced or unmeasured anecdotes. The case therefore ends
    where the dossier says it does — with the discriminating, binder-aware,
    blinded comparison unrun — but the existing record is more asymmetric than
    \"unresolved\" conveys: Egypt leans strongly negative, and the hypothesis
    survives principally in Bolivia, where nobody independent has looked."
