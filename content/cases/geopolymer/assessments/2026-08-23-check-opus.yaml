  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: "The core logic is sound and important: PXRF and ICP-MS/AES cannot
      see hydrogen or carbon, immobile-element ratio matching survives dilution
      by a few percent binder, and a block cast from crushed local aggregate
