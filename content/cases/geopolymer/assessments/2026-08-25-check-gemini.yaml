  synthesis: >-
    The megalithic casting hypothesis presents a fascinating structural divide
    between theoretical feasibility and physical attribution. To steelman the
    conventional orthodox account: it rests on overwhelming physical and
    geological evidence. Independent field and laboratory petrography (Folk &
    Campbell, Harrell & Penrod, Freestone & Middleton) confirms macroscopic
    sedimentary bedding, marine fossils, and tectonic fractures within
    individual pyramid blocks that are virtually impossible to forge through
    casting. Furthermore, independent positive-control studies (Jana)
    demonstrably prove that when a genuine geopolymer binder is present,
    standard microscopy detects it easily—yet finds it entirely absent in casing
    stones. Conventional techniques, while slow, are quantitatively attested (a
    measured 216 cm³/h removal rate), requiring only time, organization, and
    labor rather than lost chemistry.

    To steelman the casting hypothesis: it requires no alien intervention, only
    a forgotten industrial application of historical chemistry. Egypt possessed
    massive, documented natron deposits that declined precisely during the
    medieval period (Shortland 2006). Modern materials science confirms that
    Bronze Age-feasible recipes—whether alkali-aluminosilicate or diatomaceous
    earth-based calcium-silicate gels (Sierra 2010)—can reconstitute limestone
    into hard structural material. Most crucially, the proponents raise a valid
    methodological critique against the strongest pillar of the orthodox
    narrative: bulk trace-element quarry matching. Spectrographic techniques
    like XRF or ICP-MS track metal isotopes but are fundamentally blind to
    organic or water-based binders (H, C, O). Therefore, a block cast on-site
    using crushed aggregate from the Tura quarry would perfectly match the Tura
    trace-element fingerprint.

    Ultimately, the case degrades heavily as it climbs from plausible mechanisms
    to actual monument attribution. Ingredient availability and basic chemical
    feasibility are well-supported. Yet the definitive attribution claims
    collapse under independent scrutiny, surviving primarily through sample
    chain-of-custody disputes and shifting chemical definitions (from
    geopolymers to C-S-H gels). The headline claim remains unresolved strictly
    because a blinded, binder-aware analysis comparing uncompromised,
    securely-provenanced monument samples against natural stone and cast
    controls has yet to be formally published. Until this targeted
    methodological gap is closed, the hypothesis persists in the margins.
