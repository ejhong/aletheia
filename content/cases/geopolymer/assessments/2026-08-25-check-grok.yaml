  synthesis: >-
    The featured hypothesis is an existence claim: at least one major megalithic
    monument contains man-made cast stone. Existence claims are confirmed by a
    single well-secured positive and are hard to kill globally, so the honest
    case-level finding is not a lean toward yes or no. It is that the one class
    of test capable of deciding nominated monuments — a blinded, binder-aware
    mineralogical comparison of disputed samples against geologically matched
    natural stone, scored on prespecified signatures — has never been run. That
    absence is the load-bearing fact of the case, not a polite default.

    Steelman for casting. The mechanism rung is not crank chemistry. Alkaline
    and lime-pozzolan routes to reconstituted stone are real materials science;
    Sierra 2010 shows a calcium-silicate hydrate gel forming from lime and
    diatomaceous earth at room temperature; Davidovits has poured large
    demonstration blocks; Egypt sat on industrial natron and already commanded
    charcoal-and-bellows heat in the glass and copper industries. Trace-element
    quarry matching, the conventional side's strongest-looking card, is
    genuinely ill-suited to the question it is asked to close. Crushed quarry
    rock rebound with a few percent of binder keeps the quarry's metallic
    fingerprint, so "we found the quarry" does not, by itself, mean "this block
    was carved there." On the observation rung there is a modern, peer-reviewed
    granite-removal rate of 216 cm³/h that the authors themselves read as
    evidence against pounders as the sole method, plus two Barsoum-group
    laboratory papers (SEM/TEM 2006; NMR 2011) and two Davidovits-team SEM
    papers on Pumapunku that passed peer review. If any of those monument
    analyses survived independent re-measurement under lock-and-key custody,
    GEO-C022 would be won on a single site.

    Steelman against. The carved-and-transported account is not a vibe. It has
    unfinished monuments still attached to bedrock, recovered tools, worker
    settlements, ramps, and experimental carving. For the Great Pyramid, every
    independent multi-technique examination in this file — Folk and Campbell,
    Harrell and Penrod, Jana 2007 with a genuine geopolymer positive control,
    Freestone and Middleton — concludes natural limestone. Jana showed the
    alkali-aluminosilicate binder signature is obvious in a real Davidovits
    stone and absent from the casing stones, while the headline Barsoum
    microconstituents occur as opal-CT lepispheres in ordinary Tura limestone.
    Macro-scale bedding, burrows, marine fossils, and block-confined tectonic
    fractures are extremely difficult to reconcile with casting of the blocks
    that display them. The supporting pyramid papers share a group, rest on
    samples whose origin Egypt's antiquities authority has disputed, and quietly
    changed binder chemistry after the strongest negative. The Andean laboratory
    file is one team, one sample set, contested chain of custody, and a 1971
    quarry attribution sitting on the other side. Natron's documented uses are
    glass, faience, and ritual; no ancient text in this file connects it to
    building stone. The remaining Egyptian and Aswan color — Al-Ma'mun salt,
    tourist scoop marks, narrow shafts, the Rekhmire mural, the fire-pit origin
    story — is untraced, unmeasured, or anecdotal.

    Roll-up. Feasibility (GEO-C012) is provisionally real and does not climb.
    The Egyptian attribution (GEO-C020) is a split literature whose independent
    petrographic pile is heavier and whose live remainder is an untested
    calcium-silicate recipe on insecure samples. The Andean attribution
    (GEO-C021) is unreplicated proponent microscopy. GEO-C030 correctly
    discounts provenance-as-disproof and does not discount Jana-style
    binder-aware petrography. Because the hypothesis is a disjunction, a single
    secured Andean replication would flip GEO-C022; because no such replication
    exists and the best-tested Egyptian recipe failed a positive- control audit,
    the headline stays unresolved. That is a research finding: the cheap
    decisive experiment is still on the table, and until it is run neither camp
    has earned the case.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: The claim is a disjunction that would be settled by one independently
      secured cast block, and no disputed monument stone in this file has been
      through a blinded, prespecified, binder-aware comparison. The Egyptian
      branch has been tested more thoroughly than the Andean one and currently
      leans against the original alkali recipe, while Pumapunku rests on
      unreplicated proponent SEM; neither branch is closed. The strongest
      opposing consideration is the conventional package of quarries, unfinished
      pieces, tools, and independent pyramid petrography, which would make a
      global existence claim surprising — but surprise is not a negative
      measurement on the untested sites.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: Barsoum 2006 reports Si-Ca-Mg microconstituents, hydrated phases, and
      amorphous silica that the authors read as reconstituted limestone, and
      MacKenzie 2011 NMR on a Bent Pyramid casing stone suggests Tura grains in
      an artificial calcium-silicate gel; those are real laboratory
      observations, not rhetoric. Against them sit four independent examinations
      concluding natural limestone, including Jana 2007, the only study with a
      genuine geopolymer positive control, which found the alkali binder
      signature obvious in the control and absent from every casing stone, plus
      in-situ bedding, burrows, fossils, and tectonic fractures that casting
      does not naturally produce. The strongest opposing consideration is that
      package of binder-aware petrography and macro-scale sedimentary fabric,
      compounded by contested sample custody on both sides and a post-hoc shift
      from alkali-aluminosilicate to C–S–H chemistry that Jana never tested.
  - claimId: GEO-C021
    verdict: mixed
    confidence: moderate
    reasoning: Two 2019 peer-reviewed papers from the Davidovits team report SEM and
      petrographic features, including organic matter, that they argue natural
      andesite should not contain, and those papers are the only laboratory
      measurements in this file taken from an actual disputed Andean monument.
      They are not independent of each other, the samples' chain of custody is
      contested, and Ponce Sangines et al. 1971 attribute the red sandstones to
      identifiable natural quarries. The strongest opposing consideration is the
      combination of single-team unreplicated microscopy with a
      quarry-provenance result — qualified, but not erased, by GEO-C030 — plus
      the fact that volcanic rocks can host organic and glassy phases without
      human help.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Geopolymer chemistry is established science, Sierra 2010 shows a
      C–S–H binder forming from lime and diatomaceous earth at room temperature,
      and the Geopolymer Institute reports multi-ton demonstration blocks, so
      the narrow feasibility claim — that convincing artificial limestone can be
      made at all — is in decent shape. What remains open is whether
      ancient-feasible recipes, without modern quality control, produce stone
      that matches monument blocks under close analysis, and no demonstration
      block has been independently compared to quarry and monument stone under
      blind conditions. The strongest opposing consideration is that modern
      know-how and tools are doing work the claim attributes to Bronze Age
      inputs, so visual similarity of a modern pour is not a period process
      proof.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The evidence records themselves are thin — a Fóti citation of
      Badari-period glassmaking that still needs dating and temperature
      verification — but the claim is calibrated by well-known archaeology:
      ancient glassmaking and copper smelting routinely reached or exceeded ~850
      °C with charcoal and bellows, so the temperature is not an impossibility
      objection. That lean on prior knowledge rather than on a monument-specific
      measurement should be explicit. The strongest opposing consideration is
      scale: crucible-range heat is not the same as sustaining industrial
      processing of the volumes a pyramid-scale casting program would require."
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: "Shortland et al. 2006, mainstream and uncontroversial, identify Wadi
      el Natrun and al-Barnuj as the primary ancient Egyptian natron sources for
      the vitreous-materials industry and document a 7th–9th-century decline and
      replacement by plant ash; Sayre and Smith 1961 supply the compositional
      typology behind that timeline. Nothing in the file contradicts the
      sources, the scale, or the medieval discontinuity. The strongest opposing
      consideration is diagnostic, not factual: documented natron use is already
      accounted for by glass, faience, and ritual, and no ancient text in this
      record connects natron to building stone, so availability does not climb
      toward attribution."
  - claimId: GEO-C013
    verdict: unresolved
    confidence: high
    reasoning: The entire record is an unattributed anecdote in Fóti 2024 about
      rock-like material forming in a long-used outdoor fire pit; the geo
      project's own skeptical review already flagged it as under-sourced, and no
      controlled replication exists. A discovery-pathway story can be true or
      false independently of whether any monument was cast, so even a clean
      future replication would move plausibility, not attribution. The strongest
      opposing consideration is that months of ash-carbonation may yield crumbly
      sinter rather than structural stone, which is exactly why the claim
      remains a proposal rather than a result.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Assessed as stated, the core chemistry is sound: PXRF and typical
      ICP-MS/AES quarry-matching suites do not see hydrogen, carbon, or oxygen,
      instrument calibrations assume natural stone, and crushed quarry aggregate
      rebound with a few percent of binder should retain the quarry's metallic
      fingerprint. The claim overreaches by folding XRD into the same blindness
      (hydrated and carbonate binder phases can have distinct diffraction
      patterns) and has not been demonstrated in a blind test on known cast
      composites versus their source rock. The strongest opposing consideration
      is Jana 2007: binder-aware petrography and SEM-EDS detected a real
      alkali-geopolymer signature in a positive control and found it absent in
      casing stones, so the methods critique correctly limits
      provenance-as-disproof and does not shield the hypothesis from direct
      materials analysis."
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: Marčiš et al. 2023 is a peer-reviewed photogrammetric measurement
      that reports 216 cm³/h at 85 strikes per minute and concludes against
      dolerite pounders as the sole quarrying method; the figure was checked
      against the paper in the project's verification batch. The claim as stated
      is that this controlled measurement yielded that rate, which the source
      supports, not that 216 cm³/h is the true ancient production number. The
      strongest opposing consideration is that it remains a single team, single
      granite, and single protocol, so experienced crews with maintained tools,
      fire-setting, or other conventional supplements could beat the measured
      rate without any casting.
  - claimId: GEO-C002
    verdict: unresolved
    confidence: high
    reasoning: The only support is Fóti's anecdotal report that visitors striking
      the designated Aswan test block have never reproduced a scoop mark;
      attempt rates, cumulative person-hours, and wear on the block have never
      been surveyed. Casual tourist pounding is a weak proxy for skilled, shift-
      organized labor even if the anecdote is roughly true. The strongest
      opposing consideration is that unskilled, brief novelty strikes tell us
      almost nothing about trained crews, so the observation currently motivates
      a field survey rather than carrying any weight.
  - claimId: GEO-C006
    verdict: unresolved
    confidence: high
    reasoning: Shaft dimensions and the biomechanical claim that a worker cannot
      deliver effective pounder strikes at the bottom both come from Fóti; no
      independent survey or anthropometric envelope study is in the file. If
      confirmed, the orthodox pounding account would fail for these specific
      features without thereby proving casting. The strongest opposing
      consideration is that smaller tools, abrasives, work from above, or other
      conventional techniques have not been excluded, so geometry alone, even if
      measured, would be a bounded problem for pounding rather than a positive
      for reconstituted stone.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: moderate
    reasoning: The salt-layer report circulates through the Geopolymer Institute and
      Fóti and has not been traced to primary Arabic sources; Davidovits' own
      taste tests of fragments are proponent observations with obvious
      contamination routes. A sealed limestone monument growing a
      centimeter-scale salt coat would be easier to explain if natron were in
      the mix, but salt also has mundane sources in mortar efflorescence and
      groundwater wicking. The strongest opposing consideration is that a
      ninth-century episode surviving only through later compilations may be
      embellishment or mistranslation, which is why the archival trace is the
      cheapest decisive project on this claim.
  - claimId: GEO-C005
    verdict: unresolved
    confidence: moderate
    reasoning: The Rekhmire mural is real and conventionally read as bronze-door
      casting; the claim that its scale and apparatus fit mineral or waterglass
      processing better is a single proponent reinterpretation that
      Egyptologists have not engaged. Iconography is a high-degrees-of-freedom
      arena, and a scene can be made to fit a hypothesis after the fact without
      residual evidence. The strongest opposing consideration is that the
      conventional metal-casting reading is consistent with the scene's
      inscriptions and with known bronze practice, so the mural currently adds
      color rather than constraint.
  - claimId: GEO-C004
    verdict: mixed
    confidence: moderate
    reasoning: Materials Letters and Ceramics International (2019) do report organic
      matter and microstructural features in Pumapunku andesite that the authors
      argue are inconsistent with natural volcanic stone, and those publications
      are the most direct physical measurements on a disputed monument in this
      case. Both papers are the same team and sample set, not two independence
      groups; chain of custody is contested; and volcanic rocks can contain
      organic and glassy phases naturally. The strongest opposing consideration
      is the total absence of an outside-laboratory re-analysis, which means the
      record is a peer-reviewed assertion rather than a replicated material
      fact.
