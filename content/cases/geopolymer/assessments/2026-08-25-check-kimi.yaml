  synthesis: "This case separates cleanly by rung, and the rungs do not transfer
    support upward. The feasibility base is genuinely healthy: the key reagent
    existed at industrial scale with a documented supply discontinuity
    (GEO-C011, well supported on mainstream literature), the required
    temperatures were within ancient reach (GEO-C010), and the chemistry
    demonstrably works in modern demonstrations (GEO-C012). None of that is
    evidence of use, and the dossier is right to treat decay-with-altitude as
    the case's central structural fact. The observation rung offers exactly one
    modern, peer-reviewed, quantitative anomaly, the 216 cm³/h pounding rate
    (GEO-C001), which stresses the orthodox Aswan timeline but discriminates
    nothing between casting and supplemental conventional techniques; everything
    else on that rung (scoop-mark anecdote, narrow shafts, salt report, mural
    reinterpretation) is unmeasured, untraced, or unengaged. The attribution
    rung, where the thesis lives, is split. The Egyptian branch has been tested
    and has failed in its tested form: four independent petrographic
    examinations converge on natural limestone, the only positive-control study
    found the alkali-aluminosilicate signature plainly detectable in a genuine
    geopolymer and absent from every casing stone, and the flagship anomalies
    have documented mundane explanations. That record warrants \"contradicted\"
    for GEO-C020 at low confidence, the confidence capped by an untested revised
    binder (the C–S–H gel of GEO-E017), thin sampling relative to a claim about
    \"some blocks,\" and a genuine sample-authenticity dispute conditioning the
    two strongest undermining records. The Andean branch holds the only positive
    laboratory evidence from a disputed monument, but it is one team, one sample
    set, unreplicated, and custody-contested: mixed, and entirely hostage to an
    independent re-analysis that has never happened. Steelmanning the
    proponents: feasibility is proven, a supply discontinuity exists exactly
    where a lost-craft story needs one, the strongest conventional evidence
    class (trace-element provenance) is genuinely blind to binders, which is
    GEO-C030's sound core, and the decisive blinded, prespecified, binder-aware
    comparison has never been run, an absence as indicting of the mainstream
    funding landscape as of proponent rigor. Steelmanning the orthodoxy:
    forty-five years without an independently replicated physical result,
    convergent multi-technique negatives, macro-scale sedimentary features
    running through blocks in situ, quarries and unfinished pieces and worker
    villages, and a pro-casting literature displaying degenerating habits, with
    binder chemistry revised after the decisive negative, sample authenticity
    disputed selectively, and a methods table that misstates the pro-casting
    side's own best technique. The case verdict is unresolved because the
    featured claim is a disjunction whose best-tested instance failed on one
    recipe and a handful of specimens, whose second branch stands unreplicated
    rather than refuted, and whose discriminating test class, cheap, lab-scale,
    and already specified in the research agenda (GEO-R003, GEO-R004), has been
    executed exactly once. Current evidence tilts against the Egyptian
    formulation as tested; it does not yet tilt against the hypothesis as
    stated."
