    reasoning: "The thesis is a disjunction, and its branches sit in different
      states: the Egyptian branch (GEO-C020) has now failed its best direct
      test, while the Andean branch (GEO-C021) rests on one team's unreplicated
      positives. The only evidence class that could settle the disjunction, a
      blinded, binder-aware, prespecified comparison on provenance-secure
      samples, has never been run; the closest approach (GEO-E020) covered one
      recipe and disputed specimens. Against the claim stands a 45-year
      accumulation of quarries, tools, unfinished pieces, provenance matches,
      and four independent petrographic examinations concluding natural
      limestone; for it stand real feasibility results and the sound core of
      GEO-C030, which shows the strongest conventional evidence class cannot by
      itself detect cast-from-local-aggregate stone. The strongest opposing
