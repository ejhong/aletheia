  - claimId: GEO-C020
    verdict: contradicted
    confidence: low
    reasoning: "Every independent multi-technique examination in the record
      converges on natural limestone: Folk & Campbell's in-situ and laboratory
      petrography (bedding, burrows, worm tubes, block-confined tectonic
      fractures, tool marks), Harrell & Penrod on the Lauer sample, Jana's
