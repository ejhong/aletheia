  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: "Assessed as stated, this is a claim about the content of the
      published record, and it is accurate: two peer-reviewed 2019 papers
      (GEO-E006, GEO-E007) do report SEM and petrographic features plus organic
