  - claimId: GEO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "This is a narrow measurement claim backed by a peer-reviewed
      photogrammetric study (GEO-E001), verified against the catalog's
      characterization, and the project explicitly corrected Fóti's second-hand
      framing to the paper's actual figure — a good sign for the number's
      fidelity. It remains one team, one protocol, one granite and tool
      configuration, with no independent replication. The strongest opposing
      consideration is that experimental rates from inexperienced operators
