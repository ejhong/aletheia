  - claimId: GEO-C002
    verdict: unresolved
    confidence: moderate
    reasoning: The only record is Fóti's report (GEO-E003) that no visitor has
      reproduced a scoop mark, with attempt rates, cumulative person-hours, and
      block wear all unquantified, and no systematic survey in existence. As
