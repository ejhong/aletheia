  synthesis: "The case is built as a ladder, and the evidence records show it
    thinning sharply with altitude. The bottom rungs — natron availability
    (GEO-E010, mainstream and strong) and high-temperature pyrotechnology — are
    secure but nearly non-diagnostic: an ingredient that is documented for
    glass, faience, and mummification tells us nothing about building stone, and
    the case file itself concedes this. The mechanism rung is in decent shape:
    lime-plus-diatomaceous-earth C–S–H chemistry works at room temperature
    (GEO-E022) and demonstration blocks exist (GEO-E013, self-reported). But
    feasibility is not occurrence, and Jana's positive control cuts an
    unexpected way here: a genuine Davidovits geopolymeric limestone was
    trivially distinguishable from natural stone by binder-phase SEM-EDS,
    Na+K/Al enrichment, and matrix texture. That single fact does double duty in
    this case. It weakens GEO-C012's \"visually similar under analysis\"
    component, and it guts the strategic value of GEO-C030: the
    provenance-blindness argument is logically correct for PXRF and ICP-MS, but
    it is an argument about the wrong toolkit, because the anti-casting record
    for Egypt does not rest on quarry-matching at all — it rests on direct
    microscopy of monument stone. That is the decisive structural point. Four
    examinations independent of the proponent groups (Folk & Campbell, Harrell &
    Penrod, Jana, Freestone & Middleton) applied binder-aware methods to Giza
    material and found natural limestone, with the specific Barsoum anomaly
    (Si-rich spheres) reidentified as opal-CT lepispheres present in undisputed
    natural Tura stone, and the phosphorus signal mapped as a ~5 mm surface
    contamination halo. Macro-scale bedding, burrows, fragile worm tubes, and
    calcite-filled tectonic fractures confined to individual blocks are very
    hard to cast. Against this, steelmanning the proponents: the tested sample
    count is tiny relative to the monument; the Lauer-sample authenticity
    dispute is a genuine factual disagreement, not a rhetorical dodge; the
    recipe under test (alkali-aluminosilicate) is not the recipe the pro-casting
    side now advances (C–S–H gel, GEO-E017, which has drawn no published
    rebuttal); and Pumapunku — the only place with reported organics inside
    monument stone — has never been re-examined by anyone outside the Davidovits
    team in the twenty-plus years the claim has been live. The disjunction
    GEO-C022 therefore survives, but only on the strength of unreplicated,
    proponent-adjacent work at sites nobody neutral has tested. The honest
    summary is that where the hypothesis has been tested with controls it has
    failed, and where it has not failed it has not been tested. The blinded,
    binder-aware comparison the agenda calls for (GEO-R003/R004, plus
    independent Pumapunku re-analysis) remains the only thing that would move
    this materially in either direction."
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: 'As a disjunction, this claim cannot be refuted by branch-specific
      negatives, and one live positive record remains formally unrebutted:
      MacKenzie et al. 2011 (GEO-E017) reads Bent Pyramid casing stone as Tura
      grains in an artificial C–S–H gel, with no published reply located. That,
      plus the two unreplicated Pumapunku papers, is genuine but thin and
      non-independent support — every positive traces to the Barsoum or
      Davidovits groups. The strongest opposing consideration is the asymmetry
      of testing: in the one place where independent, binder-aware,
      positive-controlled analysis has been done (Giza casing stones), the
      casting signature was absent, and forty-five years have produced no
      independent replication of any positive anywhere. I place this a hair
      above "unresolved" only because a peer-reviewed, technique-independent
      positive on a major monument sits in the record without a documented
      rebuttal.'
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: "Four examinations by groups independent of Davidovits and Barsoum
      converge on natural limestone using complementary techniques, and Jana
      2007 (GEO-E020) is the only study in the exchange with a real geopolymer
      positive control: the binder signature was plainly visible in the control
      and absent from every casing-stone sample, while Barsoum's Si-rich spheres
      turned out to occur in undisputed natural Tura stone. Folk & Campbell's
      in-situ sedimentary and tectonic features (burrows, fragile worm tubes,
      fractures confined within blocks) extend the negative beyond single
      specimens. The strongest opposing consideration is scope: Barsoum claims
      casting only for casings, backing blocks, and upper courses, the sampled
      set is minute, the Lauer-sample authenticity dispute is unresolved, and
      the revised calcium-silicate binder of GEO-E017 was never inside Jana's
      alkali-targeted test. That residual untested space is why I withhold high
      confidence, but the versions of the claim that have actually been examined
      have failed repeatedly and with controls."
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: The entire physical case is two 2019 papers from one team on one
      sample set (GEO-E006, GEO-E007), which the evidence file itself instructs
      be treated as a single line, with chain of custody contested and no
      independent laboratory re-analysis. The only counterweight in the file,
      Ponce et al. 1971 (GEO-E008), addresses sandstones rather than the
      andesite where the anomalies are claimed, uses pre-modern methods, and is
      exactly the kind of provenance inference GEO-C030 legitimately qualifies.
      The strongest opposing consideration is that reported organic matter
      inside andesite would be genuinely hard to explain naturally if real and
      uncontaminated — but contamination and restoration history (the confound
      GEO-R005 targets) have not been excluded, and volcanic rocks can host
      glassy and organic phases. With one non-independent positive line and no
      discriminating independent test, "unresolved" is the substantive finding,
      not a hedge.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Lime-pozzolan chemistry forming a C–S–H binder from diatomaceous
      earth at ambient temperature is demonstrated in a peer-reviewed materials
      paper (GEO-E022), and multi-ton demonstration blocks are reported, though
      only by the proponent organization (GEO-E013). Background knowledge of
      ancient lime plasters and mortars raises the prior that binder chemistry
      was within reach, and I flag that this verdict leans partly on that
      background rather than on the file's records alone. The strongest opposing
      consideration is the \"visually similar to natural stone\" component:
      Jana's control geopolymeric limestone was readily separable from natural
      limestone by matrix texture, spherical air voids, and Na/Al enrichment, so
      fidelity under analysis — the property that would matter for attribution —
      is not established, and no demonstration block has been independently
      characterized against monument stone."
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: "The in-file direct support is weak (GEO-E016 is a Fóti citation to
      Badari glassmaking with unverified dating), but Shortland et al. 2006
      documents a natron-fluxed vitreous materials industry in Egypt, which
      independently entails sustained pyrotechnology in and above the stated
      range, and general archaeometallurgical background (copper smelting, kiln
      firing) makes ~850 °C uncontroversial. I note explicitly that this verdict
      rests more on well-established background than on the case's own records.
      The strongest opposing consideration is the one the claim does not cover:
      crucible-scale heat is not industrial-scale processing of pyramid
      tonnages, so the claim as worded removes an impossibility objection and
      establishes nothing more."
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: 'GEO-E010 is a mainstream, peer-reviewed archaeological-science paper
      identifying Wadi el Natrun and al-Barnuj as the principal sources and
      documenting the 7th–9th century decline and replacement by plant ash, with
      GEO-E011 supplying the compositional method behind that timeline. Nothing
      in the file contests it, and it is uncontroversial in the wider
      literature. The strongest opposing consideration is not to its truth but
      to its relevance: documented natron consumption is fully accounted for by
      glass, faience, and mummification, no ancient text links natron to
      building stone, and the "declining supply explains a lost craft" reading
      is narrative, not inference.'
  - claimId: GEO-C013
    verdict: unresolved
    confidence: moderate
    reasoning: The sole record (GEO-E015) is an unattributed anecdote in a proponent
      book, flagged as under-sourced by the project's own skeptical review, with
      no controlled replication attempted. Background chemistry makes weak
      ash-carbonation cementation plausible in principle, but plausible
