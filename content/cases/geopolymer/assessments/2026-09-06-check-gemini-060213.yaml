  synthesis: >-
    The overarching hypothesis (GEO-C022) claims that at least one major
    megalithic monument contains man-made cast stone bound by ancient chemical
    formulations. Assessing the supplied evidentiary record requires separating
    mechanistic feasibility from physical monument attribution.

    On feasibility (GEO-C012, GEO-C010, GEO-C011), the record provides moderate
    to strong evidence that artificial reconstitution of limestone and silicates
    is chemically possible at temperatures achievable anciently, and that raw
    materials like natron were available in Egypt. Modern laboratory syntheses
    (GEO-E013, GEO-E022) confirm that pozzolanic C-S-H gels or geopolymer
    systems can harden into stone-like composites under accessible regimes.
    Furthermore, the methodological critique (GEO-C030) validly points out that
    bulk trace-element provenance (e.g., PXRF, ICP-MS) cannot distinguish carved
    bedrock from rock aggregate cast on site using crushed material from that
    same quarry.

    However, monument attribution (GEO-C020, GEO-C021) falters under direct
    petrographic scrutiny. The pro-casting physical evidence rests almost
    exclusively on two clusters: Barsoum's SEM/TEM microconstituent work and
    subsequent NMR casing-stone work (GEO-E012, GEO-E017), alongside Davidovits'
    SEM/organic reports on Pumapunku andesite (GEO-E006, GEO-E007). Both suffer
    from contested sample provenance and lack of replication by independent
    teams. Conversely, mainstream petrographic and microstructural studies
    (GEO-E018, GEO-E019, GEO-E020, GEO-E021) repeatedly observe intact
    sedimentary layering, delicate fossil shells, worm tubes, tectonic fractures
    confined to blocks, and intergranular porosities characteristic of natural
    Eocene limestone. Decisively, Jana (GEO-E020) demonstrated with a
    Davidovits-produced geopolymer control that true synthetic binder chemistry
    (alkali/aluminum enrichment) is easily detectable via binder-aware SEM-EDS,
    yet is absent in Great Pyramid casing stones, while showing that Barsoum's
    Si-rich microconstituents are natural sedimentary opal-CT lepispheres.

    The ancillary arguments—anomalously slow dolerite quarrying rates
    (GEO-C001), tourist failure on Aswan test blocks (GEO-C002), untraced
    medieval salt reports (GEO-C003), or reinterpreted tomb murals
    (GEO-C005)—point out legitimate engineering bottlenecks or curiosities in
    the orthodox carve-and-haul model, but do not positively substantiate
    chemical reconstitution. The overall case is therefore weakly supported:
    while chemically feasible in a lab, physical evidence of cast stone in
    actual monuments remains unverified and heavily contradicted by petrography.
  steelman: MacKenzie and Barsoum's 2011 multinuclear MAS NMR detection of an
