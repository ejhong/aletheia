      insensitive to light elements (H, C, O) and hydration states that
      distinguish an authigenic cement binder from a bedrock matrix.
      Consequently, stone cast from crushed local quarry rock will mirror the
      trace-element profile of that quarry. The strongest opposing consideration
      is that while bulk provenance cannot distinguish them, petrographic
      examination and microprobe analysis (such as SEM-EDS) can easily detect
      mineralogical and textural disequilibrium between aggregate and binder.
