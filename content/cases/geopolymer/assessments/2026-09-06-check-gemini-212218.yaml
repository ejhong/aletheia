  synthesis: >-
    The hypothesis that at least one major megalithic monument contains man-made
    cast stone (GEO-C022) rests primarily on two pillars: the materials-science
    analyses of Egyptian pyramid limestone (GEO-C020, GEO-C012) and South
    American monuments (GEO-C021), supported by mechanistic plausibility
    arguments and critiques of orthodox stone-working techniques. 

    Steelman for the hypothesis: The pro-casting case is grounded in specific,
    peer-reviewed microstructural observations. Barsoum et al. (2006, GEO-E012)
    identified amorphous or nanocrystalline Si-rich phases, abnormal Ca/Mg
    ratios, and hydrated minerals in pyramid casing stones that are not observed
    in surrounding limestone quarries, suggesting rapid basic precipitation
    rather than sedimentary formation. This was reinforced by MacKenzie et al.
    (2011, GEO-E017) using multinuclear NMR, which pointed to an artificial
    calcium-silicate hydrate (C-S-H) binder, a reaction demonstrated to be
    chemically feasible at ambient temperatures using pozzolanic inputs
    (GEO-E022). Furthermore, standard provenance studies (e.g., Nash et al. 2020
    at Stonehenge) rely heavily on trace-element profiles blind to C, H, and O
    (GEO-C030), meaning that aggregate sourced from a local quarry and cast on
    site would falsely appear as carved quarry stone. At Aswan, the measured
    removal rate for dolerite pounders (216 cm³/h, GEO-E001) challenges standard
    manual carving logistics, and reports of organic matter in Pumapunku
    andesite (GEO-E006, GEO-E007) provide independent materials-level anomalies.

    Steelman against the hypothesis: Direct materials evidence from independent
    petrographers systematically refutes the presence of synthetic binder
    phases. Comprehensive microstructural investigations by Folk & Campbell
    (1992, GEO-E018) revealed delicate, intact marine fossils, bioturbation
    burrows, and pre-existing tectonic fractures across pyramid blocks that
    could not survive crushing and reconstituted slurry casting. Crucially, Jana
    (2007, GEO-E020) conducted side-by-side comparative petrography utilizing a
    genuine synthetic geopolymer positive control: the casing stones matched
    natural Tura limestone in pore structure and lacked the distinctive Na, K,
    and Al enrichment characteristic of Davidovits' binder, while demonstrating
    that the Si-rich spherical phases were naturally occurring opal-CT
    lepispheres. Freestone & Middleton (2007, GEO-E021) confirmed these findings
    on British Museum samples. Proponents have repeatedly shifted the target
    binder chemistry when refuted—from alkali aluminosilicates to lime-pozzolan
    C-S-H gels—and the Pumapunku claims (GEO-E006, GEO-E007) derive exclusively
    from self-interested proponents lacking independent verification or secure
    provenance.

    Structurally, the case cannot clear a higher threshold because where
    binder-sensitive petrography with positive controls has been deployed, the
    synthetic binder signal is absent and sedimentary textures persist. The
    removal of Barsoum et al. (2006, GEO-E012) would completely collapse the
    scientific credibility of the attribution claims, leaving behind only
    proponent anecdotes and generic operational anomalies; without GEO-E012, the
    case verdict would fall to contradicted or unresolved.
  steelman: The unexplained presence of amorphous calcium-silicate-hydrate binder
    signatures detected by solid-state 29Si and 27Al NMR in Dahshour casing
    stones (MacKenzie et al. 2011), which bypassed the petrographic refutations
