      at Aswan. There are no controlled protocols, force measurements,
      cumulative strike counts, or systematic wear surveys documenting this
      alleged failure. The strongest opposing consideration is that casual,
      untrained tourists wielding heavy pounders for a few minutes cannot be
      meaningfully compared to organized ancient labor gangs performing
      sustained quarrying.
  - claimId: GEO-C006
    verdict: provisionally_supported
    confidence: low
    reasoning: The observation that vertical test shafts beside the Unfinished
