      and microstructural markers seen in true geopolymer stone.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: Analytical findings for Great Pyramid and Bent Pyramid casing stones
      are sharply divided across prestigious materials science and geological
      literature. Barsoum et al. (2006, GEO-E012) and MacKenzie et al. (2011,
      GEO-E017) present SEM, TEM, and NMR evidence for rapid chemical
      precipitation and synthetic C-S-H binding phases. Conversely, petrographic
      analyses by Folk & Campbell (1992), Harrell & Penrod (1993), Freestone &
      Middleton (2007), and Jana (2007) document intact fossil worm tubes,
      sedimentary lamination, and the presence of natural opal-CT lepispheres
      rather than artificial cement. The strongest opposing consideration is
      Folk & Campbell's documentation of delicate intact fossils and tectonic
      jointing cutting across blocks, which cannot be reconciled with
      crushed-aggregate casting.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: The attribution of Pumapunku and Tiwanaku andesite and sandstone to
      geopolymer casting rests almost entirely on two 2019 papers by Davidovits
      et al. reporting organic matter and amorphous phases (GEO-E006, GEO-E007).
      These studies originate from the primary proponents of the theory and have
      not received independent laboratory replication or secure chain-of-custody
      confirmation. Furthermore, natural quarry provenance for the sandstones
      was established by Ponce Sangines et al. (1971, GEO-E008). The strongest
      opposing consideration is the total lack of third-party replication and
      the potential for natural volcanic glass and secondary weathering to
      explain the reported microstructural phases.
  - claimId: GEO-C012
    verdict: well_supported
    confidence: high
    reasoning: The physical and chemical feasibility of reconstituting limestone
      using lime, natron, waterglass, or pozzolanic additions like diatomaceous
      earth is solidly established in materials science (GEO-E013, GEO-E022).
      Sierra et al. (2010) demonstrated room-temperature C-S-H gel formation
      from lime and diatomaceous earth, and the Geopolymer Institute has
      produced multi-ton reconstituted blocks. Feasibility, however, is purely
      mechanistic and does not establish that this process was employed in
      monument construction. The strongest opposing consideration is whether
      ancient builders could mobilize the colossal quantities of pure chemical
      reagents required without leaving unambiguous industrial production
      debris.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: high
    reasoning: Achieving temperatures around 850 °C with pre-industrial charcoal
      kilns and forced-air bellows is standard in archaeometallurgy and
      glassmaking (GEO-E016). Early vitreous materials, Egyptian blue, and
      bronze casting from the predynastic and Old Kingdom periods confirm that
      ancient pyrotechnology comfortably operated at or above this threshold.
      The strongest opposing consideration is that achieving 850 °C in small,
      insulated crucibles does not demonstrate the capacity to maintain such
      temperatures over industrial batches sufficient to supply megaton monument
      construction.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: Historical and archaeological evidence confirms that Egypt exploited
      massive natural evaporite natron deposits at Wadi el Natrun and al-Barnuj
      from antiquity until medieval supply shifts (GEO-E010, Shortland et al.
      2006). The chemical typology of ancient glass documented by Sayre & Smith
      (1961, GEO-E011) corroborates this chronology. The strongest opposing
      consideration is that the historical record documents natron exploitation
      primarily for mummification, faience, and glass flux, providing no
      contemporary textual or administrative evidence for its diversion into
      masonry.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: The proposal that long-cycle outdoor fire pits can accidentally
      generate hard artificial stone via ash carbonation relies on an
      unverified, unattributed anecdote in proponent literature (GEO-E015). No
      controlled experimental or geochemical study has demonstrated that
      wood-ash carbonation under ambient outdoor fire pit conditions produces
      durable, structural artificial stone. The strongest opposing consideration
      is the complete absence of controlled experimental replication or
      geochemical literature confirming that cyclic wood fires achieve
      structural hydraulic or geopolymeric bonding.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: Methodologically, standard elemental provenance techniques such as
      PXRF and ICP-MS quantify metallic and immobile trace elements, which
      reflect the parent rock source (GEO-E009, GEO-E024). If stone were
      reconstituted using crushed aggregate from a specific quarry bound by
      light-element compounds (hydrates, carbonates, hydroxides), the
      heavy-element trace fingerprint would match the quarry rock while leaving
      the binder undetected by bulk elemental surveys. The strongest opposing
      consideration is that comprehensive archaeological petrography utilizes
      thin-section optical microscopy, SEM-EDS, and XRD—techniques that are
      specifically designed to detect interstitial binder phases and crushed
      aggregate textures, as demonstrated by Jana (2007).
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: The specific claim regarding a measured granite removal rate of
      roughly 216 cm³ per hour at 85 strikes per minute is directly verified by
      the photogrammetric experimental study of Marčiš et al. (2023, GEO-E001).
      The measurement is published in a rigorous peer-reviewed venue (Digital
      Applications in Archaeology and Cultural Heritage). The strongest opposing
      consideration is that a single modern experimental trial may not reflect
      the efficiency, mechanical leverage, or tool configurations of lifelong
      ancient quarry workers, nor does it test supplemental quarrying aids such
      as thermal shock.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: This claim relies entirely on anecdotal observations reported by Fóti
