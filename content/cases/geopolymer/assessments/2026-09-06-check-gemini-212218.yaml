      mechanisms such as saline groundwater wicking, limestone pore-water
      evaporation, and modern atmospheric condensation readily explain
      efflorescence. The strongest opposing consideration is that primary Arabic
      accounts have not been verified, leaving the historical datum completely
      untraced.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: The claim that the Rekhmire tomb scene depicts mineral casting rather
      than bronze metalworking is a revisionist interpretation proposed by Fóti
      (GEO-E014) without support from mainstream Egyptology. The mural's
      iconographic context, accompanying hieroglyphic inscriptions, and
      depictions of blowpipes, crucibles, and molds overwhelmingly align with
      New Kingdom bronze door casting. The strongest opposing consideration is
      the extensive consensus among archaeometallurgists and Egyptologists who
      have translated the captions and identified standard metallurgical
      crucibles and foot-bellows in the painting.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: high
    reasoning: As a factual claim about the literature, Davidovits et al. (2019,
      GEO-E006, GEO-E007) did publish SEM and petrographic studies in Materials
      Letters and Ceramics International reporting organic carbon and amorphous
