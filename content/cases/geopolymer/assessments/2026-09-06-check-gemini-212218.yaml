  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: The overarching existence claim depends entirely on specific monument
      attributions, principally Giza/Dahshour (GEO-C020) and Pumapunku
      (GEO-C021). While peer-reviewed papers by materials scientists report
      anomalous nanoscale binders and microconstituents (GEO-E012, GEO-E017),
      these are heavily counterbalanced by rigorous petrographic studies
      identifying macrofossils, natural sedimentary bedding, and an absence of
      synthetic binder phases (GEO-E018, GEO-E020, GEO-E021). The strongest
      opposing consideration is the detailed positive-control comparative study
