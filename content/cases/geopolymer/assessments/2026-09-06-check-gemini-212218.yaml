      standard downward pounding. However, biomechanical strike efficacy inside
      these confined spaces has not been formally modeled or experimentally
      tested. The strongest opposing consideration is that ancient quarrymen may
      have used weighted drop-pounders, ropes, or wooden handles rather than
      unassisted manual arm strikes at the shaft bottom.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: low
    reasoning: The claim that Caliph Al-Ma'mun encountered interior salt
      encrustations in ~820 AD derives from secondary summaries on the
      Geopolymer Institute website without citation of primary medieval Arabic
