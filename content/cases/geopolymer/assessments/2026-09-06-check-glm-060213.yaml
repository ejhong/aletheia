  synthesis: "The case's evidential center of gravity is the Great Pyramid
    materials exchange (GEO-E012, E017-E023), and it is genuinely two-sided. For
    casting: Barsoum 2006 is the only non-proponent laboratory support in the
    corpus, reports real microstructural observations, and hedges honestly to
    \"some samples\"; MacKenzie 2011 adds an independent NMR technique pointing
    at a C-S-H binder, with no published rebuttal found. Against casting: Folk &
    Campbell document macro-scale sedimentary and tectonic features across many
    in-situ blocks that casting struggles to explain; Harrell & Penrod's
    analysis of the proponents' own showcase specimen found natural Mokattam
    limestone; Jana 2007 is the only study with a positive control and found
    that the Si-rich features Barsoum highlighted also occur in natural
    limestone while a genuine geopolymer shows Na/K-Al enrichment no casing
    stone has; Freestone & Middleton, fully independent of all camps, found no
    casting features. Confounds cut both ways: the pro samples carry a
    disputed-provenance problem (SCA denial, unverified chain of custody), while
    the anti studies rest on few samples and Jana's Lauer piece is
    authenticity-disputed - though Jana's mapping of the phosphate coating on
    the Harrell-supplied piece cuts against that specific dispute. The methods
    critique (GEO-C030) is physically sound for XRF/ICP-MS (they cannot see H,
    C, O) but does not extend to binder-aware petrography, which Jana's positive
    control shows can detect a casting signature when present; editorial records
    correctly bound its scope. The Andean claims (GEO-C021, C004) rest entirely
    on one proponent team and one sample set, opposed only by a methodologically
    dated 1971 provenance report - no independent analysis exists in either
    direction. The peripheral observational claims (scoop-mark failures, narrow
    shafts, fire-pit stone, the salt report, the Rekhmire rereading) are
    single-sourced from proponent literature, unquantified or untraced, and can
    generate hypotheses but cannot carry an attribution verdict. Feasibility
    ingredients - industrial natron supply (Shortland 2006) and achievable
    temperatures - are solidly grounded, but feasibility is not occurrence
    (Sierra 2010 contains nothing archaeological). Steelmanning the orthodox
    side: the positive-control petrography plus four independent negatives make
    \"some casing stones are geopolymer\" currently more undermined than
    supported. Steelmanning the proponents: the Al-Ma'mun salt report is
    untraced rather than refuted; the 216 cm3/h rate and the absence of any
    documented pounder reproduction of a scoop mark remain unexplained
    quantitative anomalies; and the MacKenzie C-S-H result stands unrebutted and
    outside the reach of every negative study in the record. Net: a real, narrow
    open question about a limited class of blocks; the broad cast-stone reading
    of world megaliths is presently unsupported."
  steelman: 'The MacKenzie et al. 2011 multinuclear MAS NMR result: solid-state
    29Si/27Al/43Ca spectra of a Bent Pyramid outer casing stone, run at
    independent labs, indicate Tura limestone grains cemented by an amorphous
