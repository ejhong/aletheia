  synthesis: "The case reduces to one live scientific dispute: whether the
    casing/top stones of the Egyptian pyramids are reconstituted limestone. The
    pro side holds two genuinely peer-reviewed, partly non-proponent datasets —
    Barsoum 2006's SEM/TEM microconstituents (GEO-E012) and MacKenzie 2011's
    multinuclear NMR reading of a Bent Pyramid casing stone as Tura grains in an
    amorphous calcium-silicate gel (GEO-E017). The con side holds three
    independent or quasi-independent petrographic studies (Folk & Campbell,
    Harrell & Penrod, Freestone & Middleton) plus Jana 2007, the only study with
    a positive control showing that a real casting signature is detectable when
    present and absent from pyramid stones. Critically, the record shows these
    two lines do not fully engage: Jana's negative refutes the
    alkali-aluminosilicate recipe but not the revised C–S–H binder, and the
    C–S–H revision has never been independently tested. Meanwhile the pro
    samples carry an unresolved provenance dispute (Hawass/SCA), and the anti
    side's showcase specimen (the Lauer sample) carries a mirror-image
    authenticity dispute. Folk & Campbell's in-situ sedimentary features
    (burrows, clam sections, bedding across many blocks) remain the broadest
    anti-casting observation but predate the 2006 microstructural claims. The
    methods critique (GEO-C030) is half-right: PXRF/ICP-MS are genuinely blind
    to H/C/O, but the claim overreaches by including XRD, and Jana demonstrates
    binder-aware petrography works. Everything else is thinner: the Pumapunku
    evidence is proponent-only with questioned sample chain (GEO-C021), the
    Aswan anomalies are a real measurement (216 cm³/h, unreplicated) plus
    anecdotes (visitor failures, shaft geometry), and the historical anchors
    (Al-Ma'mun salt, Rekhmire) rest on untraced secondary and proponent
    readings. Mechanistic feasibility is solid — lime-pozzolan C–S–H chemistry
    and industrial natron supply are well documented — but feasibility is not
    occurrence. The honest verdict is unresolved: a genuine, unadjudicated
    peer-reviewed conflict centered on one monument class, with neither side
    holding a decisive, replicated test."
  steelman: "The MacKenzie et al. 2011 multinuclear NMR result has never been
    replicated, rebutted, or even commented on: solid-state ²⁹Si/²⁷Al/⁴³Ca MAS
    NMR of a Bent Pyramid outer casing stone independently indicates Tura
    limestone grains cemented by an amorphous calcium-silicate gel \"formed by
    human intervention,\" and the only positive-control study in the entire
    exchange (Jana 2007) tested exclusively the alkali-aluminosilicate recipe,
    not this C–S–H binder — so no analysis on record is capable of having
    detected, or refuted, the binder chemistry that the pro-casting side's own
    best peer-reviewed evidence now proposes. Combined with Jana's concession
    that a ~5 wt% binder could escape bulk chemistry, a proponent can correctly
    say the decisive experiment on the revised hypothesis simply has not been
    run."
