  synthesis: >-
    The record contains genuine evidence in both directions, but the two sides
    are not symmetrical in scope or independence. The strongest case for casting
    comes from direct materials work rather than tool-mark or historical
    arguments. Barsoum 2006 reports unusual hydrated and silicon-bearing
    microconstituents in samples attributed to the Great Pyramids, while the
    2011 multinuclear NMR study reports an amorphous calcium-silicate binder
    around limestone grains in a Bent Pyramid casing stone. The Pumapunku papers
    likewise report organic matter and microstructures interpreted as products
    of geopolymer casting. These observations are reinforced at the level of
    feasibility by room-temperature calcium-silicate chemistry, reported
    multi-ton demonstration blocks, ancient natron availability, and attainable
    furnace temperatures. The narrow methodological point behind GEO-C030 also
    has force: matching trace elements to a quarry does not alone identify
    whether material arrived as an intact block or as processed aggregate from
    that quarry.

    The strongest contrary case is more extensive for the Great Pyramid. Folk
    and Campbell report bedding, burrows, fossils, ripple lamination,
    block-confined tectonic fractures, tool marks, and other natural sedimentary
    features across numerous blocks observed in situ. Jana compared casing
    stones with both natural Tura limestone and a genuine Davidovits geopolymer
    positive control; the artificial material displayed a binder fabric and
    alkali-aluminosilicate enrichment absent from the casing samples. Freestone
    and Middleton independently found a British Museum casing fragment to be
    natural limestone, while Harrell and Penrod reached the same conclusion for
    the disputed Lauer specimen. These studies directly examine fabric and
    binder phases, so they are not answered by the claim that XRF or ICP-MS
    cannot measure hydrogen, carbon, or oxygen. The negative evidence does not,
    however, test every block or fully address the revised calcium-silicate
    binder proposed by the NMR study.

    The Pumapunku evidence is substantially weaker: its two publications come
    from the same proponent team and sample set, chain of custody has been
    questioned, and no blind or independent replication is supplied. The
    red-sandstone part of that attribution lacks direct affirmative materials
    evidence in this record. Conversely, the 1971 quarry attribution does not
    alone exclude reconstitution from quarry-derived aggregate.

    Tool-removal rates, tourist failures, narrow shafts, salt reports, and the
    Rekhmire reinterpretation can challenge particular conventional narratives,
    but none specifically demonstrates casting. Ingredient availability and
    laboratory feasibility establish possibility, not ancient occurrence. The
    resulting verdict is mixed rather than provisionally supported because the
    positive monument-sample findings remain unreplicated or provenance-limited,
    while the better-controlled negative studies have restricted samples and
    cannot exclude the existential claim across all blocks and monuments. The
    single evidence record whose removal would most change this verdict is
    GEO-E012, the strongest direct pro-casting dataset. The mixed verdict
    survives its removal, though with a pronounced shift against casting,
    because GEO-E017 and the Pumapunku analyses still conflict with the negative
    record; support would then rest on markedly thinner evidence.
  steelman: "The supplied record does not answer the 2011 multinuclear NMR
    observation from a Bent Pyramid casing stone: the spectra were reported to
    indicate Tura limestone grains cemented by an amorphous calcium-silicate gel
    formed through human intervention. Jana's positive-control study tested an
    alkali-aluminosilicate geopolymer signature in Great Pyramid stones, not
    this calcium-silicate binder, and no record provides a sample-specific
    replication or rebuttal. This is a direct monument-stone observation that
    would satisfy the featured existence claim on its own."
