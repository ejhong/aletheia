  synthesis: >-
    The record contains genuine, technically relevant evidence on both sides,
    but it does not establish that a securely provenanced block from a major
    monument was cast. The strongest affirmative line is materials analysis
    rather than quarrying difficulty or visual anomaly. GEO-E012 reports unusual
    hydrated and Si-bearing microconstituents in purported Great Pyramid
    samples, while GEO-E017 interprets multinuclear NMR from a Bent Pyramid
    casing stone as limestone grains cemented by a human-made calcium-silicate
    gel. The latter is directly relevant to the broad case hypothesis even
    though it does not locally establish GEO-C020, which concerns the Great
    Pyramid. GEO-E006 and GEO-E007 add a separate Pumapunku attribution, but
    they arise from the same team and sample set and must count as one
    evidential line.

    The strongest negative case is also materials-based. GEO-E018 reports
    sedimentary bedding, fossils, burrows, ripple structures, fractures, and
    tool marks across pyramid blocks, all naturally coherent features that
    casting would have to preserve or explain. GEO-E020 is especially diagnostic
    because it compared casing stones with both natural limestone and a genuine
    geopolymer positive control, finding the alkali-rich binder and cast texture
    only in the positive control. GEO-E021 independently found a museum casing
    fragment to be natural limestone. These studies do not sample every block,
    and the Lauer-sample identity dispute limits parts of GEO-E019 and GEO-E020,
    but the broader natural-stone observations do not depend entirely on that
    disputed specimen. Conversely, Jana's negative result addresses an
    alkali-aluminosilicate recipe and does not directly dispose of the
    calcium-silicate-gel interpretation in GEO-E017.

    Feasibility is materially stronger than historical occurrence. Natron
    availability is well supported, ancient attainment of approximately 850 °C
    is plausible, room-temperature calcium-silicate binding is demonstrated in
    modern materials work, and proponents report large demonstration blocks.
    Those facts show that casting cannot be rejected merely as chemically
    impossible. They do not show that ancient builders employed it at a
    monument, much less at construction scale. The Aswan pounding rate is a
    credible challenge to pounders as the sole technique, but difficulties with
    one quarrying account do not identify casting as the replacement. Salt
    reports, mural reinterpretation, tourist trials, narrow shafts, and the
    fire-pit story are too weakly documented to bridge that inferential gap.

    The methodological critique in GEO-C030 has a sound narrow core:
    trace-element provenance by itself cannot exclude a composite made
    principally from material taken from the matched source. It is overextended
    when used against binder-aware microscopy, spectroscopy, or petrography,
    which can test phases and textures directly. Thus the affirmative steelman
    is that two monument-sample studies using different techniques report
    engineered binders and that limited sampling leaves an existential “some
    blocks” claim open. The negative steelman is that broader in-situ geology, a
    positive-control comparison, and an independent museum-fragment analysis all
    support natural limestone, while no affirmative result has been
    independently replicated on an undisputed, provenance-secure sample.

    Sensitivity is greatest to GEO-E012, the strongest direct Great Pyramid
    affirmative dataset. Removing it would substantially weaken the pro-casting
    side and shift GEO-C020 toward contradiction, but the overall mixed verdict
    survives because GEO-E017 and the Pumapunku results remain affirmative while
    GEO-E018–E021 remain substantive negatives. The case therefore does not hang
    on one record, although its Great Pyramid component comes close.
  steelman: "GEO-E017's multinuclear NMR result remains specifically unanswered:
    it reports Tura limestone grains in a Bent Pyramid casing stone cemented by
    an amorphous calcium-silicate gel attributed to human intervention, and no
    supplied record applies the same NMR comparison to that specimen and
    demonstrates a natural origin for the reported gel."
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: Affirmative monument-sample analyses report possible engineered
      binders at Egyptian pyramids and artificial microstructures at Pumapunku,
      so the existential claim has more than purely circumstantial support.
      Against this, Great Pyramid petrography and positive-control work identify
