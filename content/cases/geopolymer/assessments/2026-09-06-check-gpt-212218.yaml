  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: "Two verified peer-reviewed publications from the same research team
      report organic matter and SEM or petrographic features in Pumapunku
      andesite and explicitly interpret them as inconsistent with natural
      volcanic stone. That establishes the claim as carefully worded: the
      analyses were published and the authors made the stated argument. The
      strongest opposing consideration concerns implication rather than this
