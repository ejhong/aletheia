      assurance. Because the claim requires only one cast block at one major
      monument, the limited negative samples cannot contradict it universally,
      but no affirmative instance is established securely.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: GEO-E012 directly supports reconstitution of some purported Great
      Pyramid samples through reported hydrated and rapidly precipitated
      microconstituents, although sample provenance is contested. GEO-E018–E021
      provide substantial opposition through broad natural sedimentary features,
      a geopolymer positive control absent from casing samples, and an
      independent museum fragment classified as natural limestone. GEO-E017
      concerns the Bent Pyramid rather than the Great Pyramid and therefore
      supports general feasibility or the wider case, not this local attribution
      directly.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: GEO-E006 and GEO-E007 report artificial-looking microstructure and
      organic matter in Pumapunku andesite, but they are two publications from
      the same proponents and sample set rather than independent corroboration.
      The 1971 quarry attribution favors natural sourcing for red sandstone,
      although provenance alone cannot exclude reconstitution from
      quarry-derived aggregate. Most importantly, the supplied direct materials
      evidence addresses andesite, leaving the red-sandstone component of the
      claim without a demonstrated casting signature.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Proponents report producing large re-agglomerated limestone blocks,
      and GEO-E022 independently establishes that lime and diatomaceous earth
      can form a calcium-silicate hydrate binder at room temperature. Natron
      availability and plausible ancient heating capability further support
      material feasibility. The strongest opposing consideration is that no
      independently characterized full-scale demonstration simultaneously
      establishes ancient-compatible inputs, processing, hardness, durability,
      and visual equivalence to natural stone.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: GEO-E016 offers pre-pyramid glassmaking as a precedent for reaching
      approximately 850 °C with charcoal-and-bellows technology. The conclusion
      is also chemically and pyrotechnically plausible on general scientific
      grounds, so this assessment partly relies on background plausibility
      rather than a fully verified archaeological demonstration in the record.
      The strongest opposing consideration is that the cited Badari dating and
      temperature basis remain unverified here, and crucible-scale attainment
      would not establish industrial-scale processing.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: moderate
    reasoning: GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as major
      ancient Egyptian natron sources used by the vitreous-materials industry
      and documents replacement by plant ash during the seventh to ninth
      centuries AD. GEO-E011 supplies a compositional method for distinguishing
      natron from plant-ash glass, supporting the historical supply chronology.
      The strongest opposing consideration is that “industrial-scale” is not
      quantified in the record and none of this evidence connects the supply to
      stone manufacture.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: The only support is GEO-E015, an unattributed account of rock-like
      material forming in a repeatedly used outdoor fire pit. It provides a
      conceivable observation but no composition, controlled conditions,
      strength testing, or replication establishing the proposed ash-carbonation
      mechanism. The strongest opposing consideration is that ordinary
      sintering, slag, fused soil, or misdescription cannot be excluded from the
      supplied account.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: "The narrow methodological point is sound: PXRF and ICP-based
      trace-element matching could assign aggregate to a quarry without
      determining whether that aggregate remained a natural monolith or was
      rebound. However, the claim overgeneralizes by including XRD and by
      implying that hydrogen, carbon, and oxygen are necessarily the only
      discriminators; phases, textures, pores, and binder-associated elements
      can also distinguish composites. GEO-E020 is the strongest opposing
      consideration because its positive control demonstrates that binder-aware
      petrography can detect a genuine geopolymer signature even where
      provenance chemistry alone would be insufficient."
  - claimId: GEO-C001
    verdict: well_supported
