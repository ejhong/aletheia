      and small-scale demos do not automatically scale to pyramid-block volumes
      or prove historical deployment.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Pre-pyramid glassmaking traditions are cited as evidence that
