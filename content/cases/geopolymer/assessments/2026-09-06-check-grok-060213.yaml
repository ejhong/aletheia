      industry and document decline and replacement by plant ash in the 7th–9th
      centuries AD; Sayre & Smith 1961 supply the dual-oxide compositional
      typology that underpins natron-versus-plant-ash glass timelines. The claim
      is historical availability, not stone-making use. Strongest opposing
      consideration is that the papers address glass and faience fluxes and are
      silent on any application to artificial stone.
  - claimId: GEO-C013
