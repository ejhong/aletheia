  synthesis: "The featured existence claim (GEO-C022) requires at least one major
    megalithic monument to contain blocks produced by binding processed mineral
    inputs rather than carving natural rock alone. The supplied record supplies
    two primary candidate attributions (Great Pyramid limestone via GEO-C020;
    Pumapunku/Tiwanaku andesite and sandstone via GEO-C021) plus supporting
    mechanism, observation, and methods claims. Feasibility of reconstituting
    limestone into hard, visually similar blocks with anciently available
    materials and temperatures (GEO-C012) is well attested by demonstration
    blocks, room-temperature lime-pozzolan C–S–H chemistry, and related
    materials work; natron sources at industrial scale (GEO-C011) and
    charcoal-bellows temperatures near 850 °C (GEO-C010) are likewise grounded
    in mainstream archaeology of glass and faience. These mechanistic enablers
    do not, however, establish occurrence. On the Great Pyramid, Barsoum et al.
    2006 SEM/TEM microconstituents and the later MacKenzie et al. 2011
    multinuclear NMR reading of a Bent Pyramid casing stone as Tura grains in an
    artificial calcium-silicate gel constitute the strongest positive laboratory
    signals; both are limited by contested sample provenance, small sample
    counts, partial author overlap, and explicit hedges. Against them stand
    multiple independent petrographic and multi-technique examinations (Folk &
    Campbell, Harrell & Penrod on the Lauer sample, Jana 2007 with a genuine
    Davidovits geopolymer positive control, Freestone & Middleton on a British
    Museum casing fragment) that recover ordinary sedimentary bedding, fossils,
    tectonic fractures confined to single blocks, opal-CT lepispheres identical
    to those in natural limestone, particulate texture with intergranular pores,
    and no alkali-aluminosilicate or crushed-reaggregated binder signature.
    Jana’s positive-control design is especially diagnostic: the real geopolymer
    shows Na+K and Al enrichment and smooth matrix with air voids that casing
    stones lack. The methods critique (GEO-C030) correctly notes that
    metallic-fingerprint quarry matching (PXRF, ICP-MS) is blind to H/C/O binder
    chemistry and therefore cannot by itself refute casting from same-quarry
    aggregate, yet the same critique is bounded by its own concession that
    petrography, microscopy and related tools can see binders; Jana demonstrates
    that detectability in practice. Pumapunku rests on a single proponent team’s
    SEM/petrography and organic-matter reports with no independent replication
    and faces a 1971 quarry attribution; sample-custody questions further weaken
    it. Observational anomalies at Aswan (slow measured pounder rates,
    unreproduced scoop marks, narrow shafts) and historical/interpretive items
    (Al-Ma’mun salt layer, Rekhmire mural, fire-pit anecdote) are real
    curiosities or thin anecdotes but do not identify cast stone inside any
    finished monument. Soft-stone deformation and cross-site morphological
    suites appear in the broader catalog yet lie outside the fourteen assessed
    claims and lack controlled comparative petrography here. Collectively the
    record leaves the existence claim neither established nor cleanly
    contradicted: the best-examined candidates fail to show the expected binder
    signatures under binder-aware methods, feasibility is real, and large
    unexamined corpora plus untested diagnostics (UV fluorescence, radon
    emanation, bulk chlorine, authigenic phase partitioning) keep the question
    open. The verdict is therefore unresolved. Removing the Jana
    positive-control study would most soften the negative weight on GEO-C020 and
    thereby on GEO-C022, yet the remaining Folk/Campbell, Harrell/Penrod and
    Freestone/Middleton petrography would still leave the case unresolved rather
    than affirmatively supported."
