  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Demonstration blocks, room-temperature lime–diatomaceous-earth C–S–H
      formation, and available natron/lime chemistries establish that large hard
      blocks visually similar to limestone can be produced with anciently
      accessible materials and temperatures. Strongest opposing consideration is
      that modern laboratory or institute demonstrations do not establish that
      any ancient monument actually used the process; scale, durability under
      site conditions, and discovery pathway remain unproven for antiquity.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Pre-pyramid glass and faience traditions supply a documented
      pyrotechnology precedent in the relevant temperature band achievable with
      charcoal and bellows. Strongest opposing consideration is that crucible-
      or kiln-scale heat does not automatically scale to the industrial volumes
      required for monument-scale casting, and the Badari temperature
      attribution itself awaits tighter verification.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: Shortland et al. 2006 and the classic Sayre & Smith compositional
      typology establish Wadi el Natrun and al-Barnuj as major ancient sources
      exploited for vitreous materials, with a documented later decline.
      Strongest opposing consideration is that the papers address glass and
      faience fluxes, not stone-making; availability of the ingredient is
      secure, but any link to megalithic production is an external inference.
  - claimId: GEO-C013
