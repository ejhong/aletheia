  synthesis: >-
    The featured existence claim (at least one major megalithic monument
    containing cast rather than solely carved stone) rests on a thin and
    contested materials record rather than on convergent, independently
    replicated binder-phase detections. Feasibility is the strongest supporting
    strand: limestone reconstitution is chemically possible with lime-pozzolan
    or related low-temperature routes available in principle to ancient builders
    (GEO-E013 demonstration blocks, GEO-E022 room-temperature C–S–H formation,
    natron sources and supply history in GEO-E010/E011, and pyrotechnology
    precedents near 850 °C). The methods critique in GEO-C030 correctly notes
    that standard immobile-trace quarry-matching (XRF, ICP-MS) is blind to the
    light-element and hydration chemistry that would distinguish a cast
    composite from natural rock of the same metallic fingerprint; Nash et al.
    2020 on Stonehenge therefore cannot by itself rule casting out. Yet
    feasibility and methodological incompleteness do not establish occurrence.

    Direct petrography of the principal candidate monuments pulls strongly the
    other way. Multiple independent examinations of Great Pyramid and related
    casing and interior stones (Folk & Campbell 1991/1992, Harrell & Penrod 1993
    on the Lauer sample, Jana 2007 with an explicit Davidovits geopolymer
    positive control, Freestone & Middleton 2007 on a British Museum Cheops
    fragment) report sedimentary bedding, burrows, fragile fossils, tectonic
    fractures confined to single blocks, quarry tool marks, opal-CT lepispheres
    identical to those in natural Tura limestone, particulate textures with
    intergranular pores, and the absence of alkali-aluminosilicate binder
    enrichment or crushed-and-reaggregated fabrics. Jana’s side-by-side control
    is especially diagnostic: the real geopolymer shows Na+K and Al spikes and
    smooth matrix with air voids that no casing stone exhibits. Barsoum 2006
    SEM/TEM microconstituents and the later MacKenzie et al. 2011 NMR suggestion
    of an amorphous calcium-silicate gel remain the best pro-casting laboratory
    observations, but sample provenance was publicly disputed by Egyptian
    authorities, the 2006 paper itself hedges that nature could have produced
    the features, the NMR study shares an author with Barsoum, and the revised
    C–S–H chemistry is outside the scope of Jana’s alkali-focused negative. No
    independent replication on provenance-secure samples exists.

    The Andean strand (GEO-C021/C004) is weaker still: the only positive
    SEM/petrographic and organic-matter reports come from the same proponent
    team and sample set; the 1971 Bolivian Academy provenance attribution to
    natural quarries stands unrebutted by independent modern work. Observational
    anomalies at Aswan (slow measured pounding rates, unreproduced scoop marks,
    narrow shafts) challenge the completeness of the dolerite-pounder orthodoxy
    and rest on a thin 1922 evidentiary base, yet they supply no positive
    signature of casting chemistry or formwork. Historical anchors (Al-Ma’mun
    salt layer, Rekhmire mural reinterpretation, fire-pit anecdote) are either
    untraced to primary sources, purely interpretive, or anecdotal. Soft-stone
    deformation, nubs, and cross-site morphological suites appear in the broader
    catalog but lack controlled, blind testing against restoration histories and
    natural analogues within the supplied record.

    Steelmanning the affirmative, the combination of slow traditional removal
    rates, available reagents, and a handful of unreplicated microstructural/NMR
    anomalies keeps the hypothesis alive as a live research program.
    Steelmanning the negative, the binder-aware petrographic record with
    positive controls already performed is more decisive than any single
    pro-casting paper, and the burden remains on demonstrating an artificial
    binder in secure samples rather than on explaining every anomaly. Because
    the existence claim is existential (“at least one”), a single clean
    confirmation would suffice, yet none is present; equally, the counters do
    not exhaustively survey every block of every monument. The net result is
    unresolved: the record neither establishes nor decisively contradicts the
    hypothesis, and the decisive measurements (binder-phase mapping on
    provenanced cores, radon emanation, bulk chlorine, UV fluorescence against
    known-cast panels) remain unperformed.
  steelman: MacKenzie et al. 2011 multinuclear MAS NMR on a Bent Pyramid casing
    stone reports spectra consistent with Tura limestone grains cemented by an
