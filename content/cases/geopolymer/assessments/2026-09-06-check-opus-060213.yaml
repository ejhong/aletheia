    reasoning: "As a global existence claim it is barely constrained: most
      megalithic sites have never been examined with binder-aware methods, so
      the hypothesis remains live nearly everywhere. But the evidence supplied
      that would establish it is concentrated on Giza and Pumapunku, and at Giza
      the better-controlled tests (GEO-E018–E021) return natural limestone while
      the supporting studies come from one overlapping group with disputed
      sample provenance. The strongest opposing consideration is the reverse:
      absence of a casting signature in a handful of casing-stone fragments
      cannot refute an existence claim across millions of blocks and dozens of
      monuments, which is why the verdict is weak support rather than
      contradiction."
  - claimId: GEO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: Two genuinely anomalous datasets (GEO-E012, GEO-E017) face four
      negatives from three unrelated groups, one of which (GEO-E020) carried a
      real geopolymeric-limestone positive control and found the expected binder
      signature absent from casing stones while finding Barsoum's marker
      microconstituents in ordinary natural limestone. Folk & Campbell's in-situ
      fossils, burrows and block-confined fractures are hard to square with
      casting at any scale. The strongest opposing consideration is that Jana's
      control tested the alkali recipe, not the C–S–H binder MacKenzie proposes,
      and Barsoum's specific quarry-incompatible oxide ratios have not been
      reproduced or explained; the claim is not dead, but it is not carried by
      this record.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: The entire supporting base is two 2019 papers from the hypothesis's
      principal proponents using the same team and sample set (GEO-E006,
      GEO-E007), which the record itself flags as one line of evidence, not two.
      No independent replication exists, and volcanic lithologies can host
      glassy and organic phases naturally without blind-tested discriminating
      criteria. The 1971 provenance attribution (GEO-E008) opposes it but is
      itself dated and partly disarmed by GEO-C030's point that quarry matching
      cannot exclude casting from that quarry's aggregate. The strongest
      opposing consideration is simply that a single proponent group reporting
      unreplicated microstructural interpretation is the weakest configuration a
      materials claim can have.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Sierra et al. (GEO-E022) show lime plus diatomaceous earth forms a
      cementing C–S–H gel at room temperature with materials plausibly available
      in Egypt, and general background — lime plaster, mortar, Roman concrete —
      makes hard artificial calcareous stone unremarkable. Self-reported
      multi-ton demonstration blocks (GEO-E013) are consistent but
      proponent-sourced and never independently analysed. The clause carrying
      the weight is \"visually similar to natural stone\": Jana's side-by-side
      comparison found a real geopolymeric limestone texturally distinguishable
      from natural Tura stone (smooth matrix, spherical voids), which is the
      strongest opposing consideration and the reason this is provisional rather
      than well supported."
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: "The evidence record supplied is thin — Fóti's appeal to Badari
      glassmaking (GEO-E016) is flagged as needing verification — so this
      verdict leans substantially on general background rather than the case
      file: charcoal-and-bellows furnaces reaching pottery-firing and
      copper-smelting temperatures well above 850 °C are uncontroversial in
      archaeometallurgy. The claim as stated is about achievability, not scale.
      The strongest opposing consideration, noted in the record itself, is that
      crucible-scale heat is not the same as sustained industrial-scale
      processing of tonnes of reagent, which this claim does not establish."
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: Shortland et al. 2006 (GEO-E010) is mainstream peer-reviewed
      archaeological science that directly names Wadi el Natrun and al-Barnuj as
      the primary ancient natron sources and documents the 7th–9th century
      decline and substitution by plant ash. Sayre & Smith's dual-oxide
      criterion (GEO-E011) supplies the analytical basis for that timeline. The
      claim is historical and about glass and faience supply; the strongest
      opposing consideration is that "industrial-scale" is doing implicit work
      for the casting argument that the cited source does not support, since it
      says nothing whatever about stone production.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: "The sole record is an unattributed anecdote in a proponent book
      (GEO-E015), which the project's own skeptical review flagged as
      under-sourced, and no controlled replication has been attempted. The
      underlying chemistry is not absurd — wood ash contains calcium
      oxide/hydroxide that carbonates and can cement — so the pathway is not
      implausible on background grounds. But plausibility is not evidence: there
      is no measurement, no specimen, no source. The strongest opposing
      consideration is that ash-cemented hearth material is common and
      unremarkable, and demonstrating it would still not show it produces
      structurally useful stone."
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The core point is sound and non-trivial: PXRF and ICP-MS do not
      measure hydrogen or carbon, and a block cast from crushed rock taken at a
      given quarry would carry that quarry's immobile trace-element fingerprint,
      so a provenance match cannot by itself exclude casting from that source.
      But the claim as stated overreaches by including XRD, which resolves
      mineral phases and was in fact used by Folk & Campbell precisely to look
      for zeolitic binder; the record also notes Fóti's methods table wrongly
      lists NMR as blind to Si. Strongest opposing consideration: GEO-E020's
      positive control shows that binder-aware petrography detects a real cast
      signature when present, so the blindness argument bounds provenance
      reasoning only, not the whole analytical case against casting."
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: "This is a claim about what a specific peer-reviewed photogrammetric
      experiment measured, and GEO-E001 confirms both the 216 cm³/h figure and
      the 85 strikes/minute protocol, with the authors themselves concluding
      against dolerite pounders as the sole method. Verification was done by an
      AI agent against the paper, and the number is internally consistent. The
      strongest opposing consideration concerns not the measurement but its
      extrapolation: one team, one granite, one tool configuration, and modern
      experimenters are not trained ancient quarrymen with maintained tools and
      optimised technique — the rate may understate achievable throughput
      considerably."
  - claimId: GEO-C002
    verdict: unresolved
    confidence: low
    reasoning: "As phrased, the claim asserts an absence of documentation, which is
      nearly self-fulfilling: nobody records casual tourist attempts, so \"no
      documented success\" would be true regardless of whether success is
      possible. The single source is a proponent's anecdote (GEO-E003) with no
      attempt counts, no cumulative effort estimate, and no wear survey of the
      test block. The strongest opposing consideration is that untrained
      visitors striking a block for a few minutes is not a test of a technique
      that GEO-E001 measures in cubic centimetres per hour of sustained skilled
      work; even a valid observation would carry almost no inferential weight."
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: The geometric intuition is reasonable — a ~5 m shaft narrow enough to
      constrain posture would badly limit percussion at its base — but the
      record contains no surveyed dimensions, no anthropometric analysis, and no
      biomechanical test (GEO-E005 is a single proponent description). The
      strongest opposing consideration is that ancient quarrymen worked confined
      trenches routinely and could have used smaller hand-held pounders, levers,
      wedges, or fire-setting at depth; "cannot pound effectively" does not
      follow from "cannot pound in the posture assumed," and the alternative
