  synthesis: "The featured hypothesis is an existence claim, which makes it cheap
    to state and hard to refute: one authenticated cast block anywhere would
    settle it. The record supplied contains two site-specific routes to that
    conclusion — Giza limestone (GEO-C020) and Pumapunku andesite/sandstone
    (GEO-C021) — plus a mechanism tier (GEO-C010, GEO-C011, GEO-C012, GEO-C013)
    and a methodological shield (GEO-C030). The mechanism tier is in good shape
    and is the least contested part of the case: natron was mined at industrial
    scale (GEO-E010), ~850 °C is unremarkable for charcoal-and-bellows
    pyrotechnology, lime and pozzolan chemistry demonstrably yields a C–S–H
    binder at room temperature (GEO-E022), and lime plaster long predates the
    pyramids. But feasibility is not occurrence, and the case turns on whether
    monument stone itself carries a casting signature. On that question the
    supplied evidence runs against the hypothesis where it has actually been
    tested. The pro-casting laboratory record is two overlapping efforts:
    Barsoum 2006 (GEO-E012), which reports genuinely anomalous Si–Ca–Mg
    microconstituents and hydrated phases but hedges explicitly and whose sample
    provenance was publicly disputed, and MacKenzie 2011 (GEO-E017), which
    shares an author and quietly replaces the alkali-aluminosilicate geopolymer
    with a lime-pozzolan gel. Against them stand four records from three
    unrelated groups: broad in-situ petrography reporting fossils, burrows,
    bedding and block-confined tectonic fractures (GEO-E018); re-analysis of the
    proponents' own showcase Lauer specimen (GEO-E019); an independent
    multi-technique study of a museum casing fragment identifying opal-CT as
    natural (GEO-E021); and, decisively, Jana's comparison with a genuine
    Davidovits-made geopolymeric limestone as positive control (GEO-E020), which
    showed that the Na/K/Al binder enrichment a real cast stone carries is
    absent from casing stones, and that Barsoum's spherical Si-rich
    microconstituents occur in undisputed natural limestone too. That positive
    control also bounds GEO-C030: quarry-matching trace-element chemistry really
    is blind to a binder, but binder-aware petrography is not, and Fóti concedes
    as much. The Andean line is weaker still — a single proponent team, one
    sample set, two papers, no independent replication, and a standing (if
    dated) provenance attribution against it. The observational tier — tourist
    failures at Aswan, shaft ergonomics, an untraced 820 AD salt report, a
    reinterpreted mural, a fire-pit anecdote — is largely single-author,
    unquantified and unverified, and carries little independent weight. The one
    exception, the Marčiš removal-rate measurement, is a real anomaly for
    orthodox quarrying timelines but is evidence about carving difficulty, not
    about casting; \"carving is harder than assumed\" does not entail
    \"therefore cast,\" and no record here closes that gap. The honest position
    is that casting remains chemically feasible, largely untested at most sites,
    and negative at the few places where competent binder-aware testing has been
    done. Sensitivity: the single record whose removal would most change the
    verdict is GEO-E020 (Jana 2007). Without its positive control, the methods
    critique GEO-C030 would stand largely unanswered and the case would move
    toward mixed. The verdict survives its removal, but only because GEO-E021
    and GEO-E018 remain as partially independent negatives — it survives
    thinner, not intact."
  steelman: Jana's decisive negative tested Davidovits' alkali-aluminosilicate
    recipe, and its diagnostic markers were Na/K and Al binder enrichment. The
    binder MacKenzie et al. actually propose — an amorphous calcium-silicate
    hydrate gel from lime plus Fayum diatomaceous earth, at a few weight percent
    — carries no such alkali signature and would be spectroscopically
    near-invisible against a calcitic limestone matrix by exactly the methods
    used to reject it. So the currently live version of the Egyptian casting
    hypothesis has never been tested by an independent lab on provenance-secure
    monument stone with a matched C–S–H positive control, and Barsoum's specific
    reported anomalies — Si:Ca:Mg ratios found in none of six candidate
    quarries, and calcite/dolomite-like phases "not known to hydrate in nature"
    — have never been reproduced or explained away on their own terms. That is
    an unanswered empirical residue, not a rhetorical one.
