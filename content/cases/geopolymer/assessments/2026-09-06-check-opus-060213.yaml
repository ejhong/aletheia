  - claimId: GEO-C003
    verdict: unresolved
    confidence: low
    reasoning: "The claim is about what medieval accounts report, and that is
      exactly what has not been checked: the only record (GEO-E004) is a
      proponent organisation's retelling with the primary Arabic sources
      untraced, which is why GEO-R001 exists as the cheapest item on the
      research agenda. Until Al-Maqrīzī or comparable compilations are read, the
      report may be authentic, embellished, or a modern accretion. The strongest
      opposing consideration is that even a verified 820 AD salt observation has
      mundane explanations — efflorescence from mortar, groundwater wicking,
      human occupation residues — so verification would move GEO-C003 far more
      than it would move GEO-C020."
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: Read literally the claim is nearly trivially true — such an argument
      has indeed been made (GEO-E014) — so I assess the substantive reading,
      that the mural's details fit mineral processing better than bronze work.
      That reading rests on one proponent's iconographic judgement, is unengaged
      by Egyptology, and competes with a conventional interpretation supported
      by accompanying inscriptions and by an entire corpus of Egyptian
      metallurgical imagery. The strongest opposing consideration is that scale
      arguments from tomb painting are notoriously weak, since Egyptian art uses
      hierarchical and schematic proportion rather than depicting apparatus to
      scale.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: "As stated this is a reporting claim — that published SEM and
      petrographic analyses of Pumapunku andesite report organic matter and
      features their authors read as non-natural — and GEO-E006 and GEO-E007
      establish exactly that in Materials Letters and Ceramics International.
      Its local truth carries far less than it appears to: the two papers share
      a team and a sample set and are one line of evidence, the authors are the
      hypothesis's principal proponents, and sample chain of custody has been
      questioned. The strongest opposing consideration is that the diagnostic
      step — organic and glassy phases being inconsistent with natural volcanic
      rock — has never been blind-tested against natural andesite controls, so
      the reported observation does not yet license the inference drawn from
      it."
