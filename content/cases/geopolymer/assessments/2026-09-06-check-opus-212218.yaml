  synthesis: "The featured hypothesis (GEO-C022) is an existence claim, so it
    needs only one monument to survive scrutiny. The record supplies two
    candidate venues with actual laboratory data — Giza/Dahshour and Pumapunku —
    plus a large penumbra of interpretive site-morphology claims that carry
    almost no independent weight because they originate in one proponent text
    and are frequently mutually corroborating only in appearance (the catalog
    itself flags independence groups such as provenance-method-critique,
    cross-site-signature-surveys, and aswan-pounder-function). On the Egyptian
    line, the real evidential contest is narrow and legible. Barsoum 2006
    (GEO-E012) is the strongest pro-casting dataset and is not from the
    Davidovits camp, but its sample provenance was publicly disputed, its
    authors explicitly concede nature could have produced the microstructures,
    and Jana 2007 (GEO-E020) — the only study in the exchange with a genuine
    geopolymer positive control — reports that the Si-rich spherical
    microconstituents occur in undisputed natural limestone, while the real
    geopolymer's Na/K/Al binder enrichment is absent from casing stones. Folk &
    Campbell, Harrell & Penrod, and the independent Freestone & Middleton
    fragment analysis point the same way, and the macro-scale sedimentary and
    tectonic features Folk & Campbell report in situ (burrows, fragile worm
    tubes, fracture sets confined to single blocks) are the hardest single thing
    for casting to accommodate. The proponents' standing reply, the methods
    critique (GEO-C030 / GEO-E024), is genuinely correct about PXRF and ICP-MS
    being blind to H/C/O, but it is scoped to provenance chemistry and does not
    touch binder-aware petrography; the same record documents that its own
    methods table is wrong about NMR. The Andean line (GEO-C021, GEO-C004) rests
    entirely on two papers from one team on one sample set, unreplicated,
    against a dated 1971 provenance study. Feasibility claims fare better than
    attribution claims: natron supply (GEO-C011) is mainstream-documented, ~850
    °C is trivially within ancient pyrotechnology, and lime-pozzolan chemistry
    (GEO-C012) is demonstrated — but feasibility is not occurrence, and the
    case's tool-mark and site-morphology observations (GEO-C002, GEO-C006,
    GEO-C003, GEO-C005) are anecdotal, unquantified, or untraced to primaries.
    The verdict is therefore weak support: a live, non-absurd hypothesis with
    one unrebutted thread, not a demonstrated one. Sensitivity: removing
    GEO-E017 (MacKenzie et al. 2011 NMR) would drop the case to contradicted for
    the Egyptian claim, because every remaining positive is either
    provenance-disputed (GEO-E012) or proponent-internal; the verdict does not
    survive that removal intact, and it should be stated plainly that the case
    hangs on that one paper plus the Barsoum microconstituents."
  steelman: "MacKenzie et al. 2011 read Bent Pyramid casing stone as Tura
    limestone grains cemented by an amorphous calcium-silicate gel, and no
    negative study in the record tests that binder: Jana's positive control was
    an alkali-aluminosilicate geopolymer, and Freestone & Middleton looked for
    geopolymeric markers. A C–S–H binder at ~5 wt% in a calcareous matrix is
    exactly the case where the published negatives are not designed to look, and
    nobody has run binder-aware ²⁹Si/⁴³Ca NMR on provenance-secure casing stones
    with a lime-pozzolan positive control. That prediction stands untested."
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: As an existence claim it needs one surviving instance, and two
      peer-reviewed laboratory studies (GEO-E012, GEO-E017) do point at casting
      for specific Egyptian stones. But the best-controlled examination in the
      record (Jana 2007, with a genuine geopolymer positive control) found no
      casting signature, and three further petrographic studies from partly
      independent groups read the same material as natural limestone. The
      strongest opposing consideration is Folk & Campbell's in-situ observation
      of bedding, burrows, fragile worm tubes, and block-confined tectonic
      fractures — features a cast block should not have and that apply across
      many blocks rather than one sample.
  - claimId: GEO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: Barsoum 2006 and MacKenzie 2011 are real, non-Davidovits data
      pointing to an artificial binder in casing and backing stones, and the
      honest scope (per C&EN) is never "the whole pyramid." Against this stand
      four negative analyses, one with a positive control demonstrating that a
      real geopolymer binder is detectable when present. The strongest opposing
      consideration is that Barsoum's samples had disputed provenance while
      Freestone & Middleton's British Museum fragment did not, and the latter
      found natural opal-CT rather than a synthetic cristobalite marker.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: Support rests on GEO-E006 and GEO-E007, which the record explicitly
      notes are the same team and same sample set — one line of evidence, not
      two — with no independent replication and no blind-tested discriminating
      criteria. The 1971 Ponce provenance attribution counts against, though its
      methods are dated and its force is partly blunted by the GEO-C030
      argument. The strongest opposing consideration is that volcanic rocks
      naturally host glassy and organic-bearing phases, so "organic matter in
      andesite" is not by itself diagnostic of a binder.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Sierra et al. 2010 demonstrate that lime plus diatomaceous earth
      forms a C–S–H cementing gel at room temperature, and lime mortar and
      plaster long predate the pyramids, so binding calcareous material into
      hard blocks is uncontroversially feasible with ancient inputs. Davidovits'
      multi-ton demonstration blocks are self-reported and unanalysed by
      outsiders, so they add little. The strongest opposing consideration is the
      \"visually similar to natural stone\" clause: Jana reports that a genuine
      geopolymeric limestone differs texturally from limestone (smooth matrix
      with spherical air voids versus particulate texture with intergranular
      pores), which is exactly the visual-equivalence step this claim asserts."
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: "The specific evidence record here is thin — Fóti citing Badari
      glassmaking, itself flagged as needing verification — so this verdict
      leans substantially on general background: pottery kilns, faience, copper
      smelting, and glass all demonstrably ran at or above ~850 °C in the
      ancient Near East. The claim as stated concerns achievability, not scale.
      The strongest opposing consideration is that crucible-scale attainment of
      a temperature says nothing about sustaining it over the tonnages a casting
      programme would require, which is a different and untested proposition."
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: 'Shortland et al. 2006 is mainstream peer-reviewed archaeology
      identifying Wadi el Natrun and al-Barnuj as the primary natron sources for
      the vitreous-materials industry and documenting the 7th–9th century
      decline and replacement by plant ash. The claim as stated is a
      straightforward restatement of that paper. The strongest opposing
      consideration is definitional: "industrial-scale" is doing rhetorical work
      here, since the documented scale is that of glass and faience production,
      not of monument-volume stone casting, and the paper makes no claim about
      stone.'
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: The sole evidence is an unattributed anecdote in a proponent text,
      flagged as under-sourced by the project's own skeptical review, with no
      controlled replication attempted (GEO-R007 proposes one). Ash-carbonation
      chemistry is not implausible in principle — wood ash contains CaO and
      alkali carbonates — but "hardened artificial stone" is an unquantified
      endpoint. The strongest opposing consideration is that hearth-derived
      cemented crusts are common and mundane, so even a positive replication
      would need to distinguish weak concretion from anything structurally
      stone-like.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: "The core assertion is correct for PXRF and ICP-MS/AES: they report
      elemental abundances, are blind to H/C/O, and cannot in principle separate
      carved quarry stone from stone cast with that quarry's aggregate. But the
      claim as stated also names XRD, which is a phase-identification method
      that would register binder minerals, and the companion record notes the
      same author's table wrongly lists NMR as blind to Si. The strongest
      opposing consideration is Jana 2007's positive control: it shows that
      binder-aware petrography and SEM-EDS do detect a real casting signature,
      so the blindness argument bounds provenance inference without insulating
      the casting hypothesis from the direct petrographic record."
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: "This is a reported measurement from a peer-reviewed photogrammetric
