  synthesis: "The case splits by monument and by binder chemistry, and neither
    half dominates. For the Great Pyramid, the only non-proponent laboratory
    support (Barsoum 2006 SEM/TEM; MacKenzie 2011 NMR) rests on real
    observations of samples whose provenance is publicly disputed, and it faces
    a four-way direct counter-record: Folk & Campbell's in-situ sedimentary
    bedding, burrows, and calcite-filled tectonic fractures across many blocks;
    Harrell & Penrod's natural reading of the proponents' own showcase Lauer
    sample; Jana's positive-control petrography, which measured what a genuine
    casting signature looks like and found it absent from casing stones; and
    Freestone & Middleton's independent natural-limestone finding on a British
    Museum fragment. Together these contradict the original alkali-geopolymer
    recipe for pyramid blocks — though they do not test the revised
    calcium-silicate binder, which is a material change of hypothesis, not a
    rebuttal. For Pumapunku, proponent-authored SEM and organic-matter evidence
    stands unrefuted in this ledger but unreplicated, confounded by natural
    volcanic glass/organic phases, and opposed by the 1971 provenance
    attribution. The methodology critique (GEO-C030) is chemically correct for
    PXRF/ICP-MS trace-element provenancing and genuinely weakens \"quarry found,
    therefore carved\" arguments; but Jana's positive control shows the critique
    cannot be extended to binder-aware petrography, which is exactly the method
    the anti-casting record uses. The ingredient layer is solid: industrial
    natron sources and their documented decline are established, and
    pre-industrial pyrotechnology plausibly reached the required temperatures.
    By contrast, the anecdotal observation layer — tourist scoop-mark failures,
    shaft biomechanics, fire-pit stone, the Al-Ma'mun salt report — is thin, and
    the salt line specifically collapsed once Sessa et al. 2026 documented
    halite at the Sphinx and other Egyptian limestone sites and reported halite
    as native to Giza nummulitic strata. The steelman the proponent can fairly
    press: no binder-aware analysis of a provenance-secure sample exists for the
    revised C–S–H recipe or for the Andean organo-mineral recipe, so the
    strongest negative results miss the hypothesis as now stated. The verdict is
    therefore mixed: feasibility well supported, the flagship tested instance
    contradicted on its original chemistry, and the surviving variants
    unresolved pending exactly the tests this agenda funds. Consensus against
    the hypothesis is not itself evidence; what counts here is that the
    affirmative observations are either non-replicated, provenance-disputed, or
    matched by natural analogues — while the negative results include the only
    blinded positive control in the corpus."
  steelman: The MacKenzie et al. 2011 finding — solid-state ²⁹Si/²⁷Al/⁴³Ca MAS NMR
    of a Bent Pyramid casing stone reading as Tura limestone grains cemented by
    an amorphous calcium-silicate gel "formed by human intervention" — has no
    published rebuttal anywhere in this ledger, uses a technique the proponents'
    own methods critique concedes is capable, falls entirely outside Jana 2007's
    alkali-geopolymer negative control, and has never been replicated or refuted
    on provenance-secure samples; combined with the equally unrefuted Davidovits
    andesite SEM results at Pumapunku, the proponent can rightly say that no
    independent, binder-aware analysis of a provenance-secure sample has ever
    tested the hypothesis as currently formulated.
