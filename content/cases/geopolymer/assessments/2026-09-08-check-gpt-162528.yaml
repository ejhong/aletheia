      GEO-E010 and the general chemical plausibility of mineral binders support
      ancient material availability, but this part of the judgment relies partly
      on ordinary materials-science priors rather than archaeological evidence.
      The strongest opposing consideration is that the large-block demonstration
      is self-reported and has not received independent compositional or
      performance testing.
    confidence: moderate
  - claimId: GEO-C010
    verdict: provisionally_supported
    reasoning: GEO-E016 offers a weak archaeological precedent for pyrotechnology in
      the approximate 850 °C range. General combustion science makes reaching
      that temperature with charcoal and forced air plausible, so the verdict
