      evidence. The strongest opposing consideration is that crucible-scale
      temperature capability does not demonstrate sustained, industrial-scale
      natron processing for monumental construction.
    confidence: moderate
  - claimId: GEO-C011
    verdict: established
    reasoning: "GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as major
      ancient Egyptian natron sources used by the vitreous-materials industry
      and documents their medieval decline and replacement by plant ash.
      GEO-E011 supplies compatible compositional context for distinguishing
      natron and plant-ash glass. The strongest opposing consideration is
      limited in scope: these records establish natron supply for glass and
      faience, not its use for manufacturing stone."
    confidence: high
  - claimId: GEO-C013
