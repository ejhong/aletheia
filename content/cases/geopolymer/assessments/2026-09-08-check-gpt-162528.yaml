  synthesis: >-
    The evidence supports a mixed case verdict because direct materials
    observations point in opposite directions, while none combines secure
    archaeological provenance, adequate controls, and independent replication.
    The broad existence hypothesis in GEO-C022 is not established merely by
    showing that ancient-compatible binders are chemically possible. It requires
    at least one reliably identified monument block to exhibit a diagnostic
    manufactured-stone fabric. The ledger contains candidate observations of
    that kind, but they remain contested.

    The strongest case for casting comes from the pyramid analyses in GEO-E012
    and GEO-E017 and the Pumapunku work in GEO-E006 and GEO-E007. Barsoum and
    colleagues reported unusual hydrated and Si-bearing microconstituents in
    some pyramid samples, while the later NMR study interpreted a Bent Pyramid
    casing specimen as Tura grains cemented by an artificial calcium-silicate
    gel. At Pumapunku, published SEM and petrographic work reports organic
    matter and microstructures interpreted as an engineered organo-mineral
    matrix. These are measurements of monument material rather than arguments
    from construction difficulty, and they therefore deserve substantially more
    weight than taste tests, mural reinterpretations, or anecdotal tool-mark
    observations. Chemical feasibility is also credible: natron was demonstrably
    available, ancient pyrotechnology plausibly reached the relevant temperature
    range, and room-temperature calcium-silicate binding is experimentally
    possible.

    The strongest contrary case is the direct petrographic record in GEO-E018
    through GEO-E021. It reports sedimentary bedding, fossils, burrows, ripple
    lamination, tectonic fractures, and ordinary limestone textures in pyramid
    blocks, while failing to find the aggregate-binder fabric predicted by
    casting. GEO-E020 is especially probative because it compared casing stone
    with both natural Tura limestone and a genuine Davidovits geopolymer
    positive control; the manufactured control displayed a detectable binder
    signature absent from the casing samples. That result strongly contradicts
    the alkali-aluminosilicate version of the pyramid hypothesis, although it
    does not directly test the revised calcium-silicate-gel interpretation in
    GEO-E017. Sample identity disputes and the small number of laboratory
    specimens prevent these negative findings from excluding every block.

    The salt argument does not materially support casting. Modern analysis
    confirms halite efflorescence, but comparable Egyptian limestone sites also
    exhibit halite, and the supplied geological account treats it as native to
    Giza limestone and mobilized by humidity. The asserted medieval salt-layer
    report is uncited, absent from the Arabic compilation actually checked, and
    attached to a questionable date. Likewise, the Aswan removal-rate
    measurement challenges pounders as the sole technique but does not identify
    casting as the alternative.

    The methods critique is valid only in its narrow form: trace-element quarry
    matching alone need not distinguish a natural block from a composite made
    from aggregate collected at the same source. It does not neutralize
    binder-aware microscopy, phase analysis, or positive-control petrography.
    Thus the evidence neither establishes a cast monument nor cleanly
    contradicts the broad existential hypothesis. “Mixed” reflects genuine
    conflict between direct analytical datasets, not deference to controversy.

    The single evidence record whose removal would most change this verdict is
    GEO-E020, because its positive-control design simultaneously strengthens the
    negative pyramid evidence and limits GEO-C030. Without GEO-E020 the pyramid
    balance would become less negative and the overall case more favorable to
    casting, but the mixed verdict survives because GEO-E018, GEO-E019, and
    GEO-E021 remain opposed to GEO-E012 and GEO-E017, while the Pumapunku
    findings remain unreplicated.
  steelman: The strongest unanswered pro-casting observation is that GEO-E012 and
    GEO-E017 report unusual hydrated or amorphous Si-Ca phases in particular
    pyramid specimens, including an NMR interpretation of limestone grains
    cemented by calcium-silicate gel. No ledger record presents a
    provenance-secure, blinded reanalysis of those exact anomalies using natural
    controls and methods optimized for the revised calcium-silicate binder
    rather than only the original alkali-aluminosilicate recipe.
claimAssessments:
