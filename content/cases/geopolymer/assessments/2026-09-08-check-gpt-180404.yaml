  synthesis: >-
    The evidence supports a mixed case verdict, but it does not establish the
    featured existential hypothesis. The strongest case for casting consists of
    direct materials observations rather than logistical incredulity: GEO-E012
    reports unusual hydrated and Si-bearing microconstituents in pyramid
    samples, GEO-E017 reports an amorphous calcium-silicate gel in one Bent
    Pyramid casing sample, and GEO-E006–E007 report organic matter and
    purportedly artificial microstructures in Pumapunku andesite. The latter
    records leave the Pumapunku attribution weakly supported, because they
    concern monument material directly and have not been met here by an
    independent analysis of the same securely provenanced specimens. Ancient
    access to natron is well supported, and large artificial limestone is
    chemically plausible, but ingredient availability and laboratory feasibility
    do not demonstrate archaeological occurrence.

    The strongest case against casting is the binder-aware pyramid petrography.
    GEO-E018 reports widespread sedimentary bedding, fossils, burrows, fractures
    and quarry marks that are naturally coherent but hard to reconstruct through
    casting. GEO-E020 is especially diagnostic because it compares casing stones
    with both natural limestone and an actual Davidovits geopolymer positive
    control: the conspicuous alkali, aluminosilicate and matrix signatures of
    the control were absent from the casing stones. GEO-E019 and the independent
    museum-fragment study GEO-E021 point in the same direction, although sample
    identity, representativeness and heterogeneity remain important limitations.
    Collectively, these records contradict GEO-C020 as an account of Great
    Pyramid blocks more strongly than GEO-E012 supports it. They do not,
    however, exhaustively sample every block, and GEO-E020 does not directly
    test the later calcium-silicate binder proposed in GEO-E017.

    The salt argument has substantially collapsed. Modern analysis confirms
    halite efflorescence, but GEO-E031–E033 provide natural Egyptian comparators
    and a sedimentary source mechanism, while GEO-E027 finds no salt report in
    the examined medieval compilation. Tool-removal rates and awkward Aswan
    features can challenge an exclusively pounding-based account, but they do
    not discriminate casting from other supplemental quarrying methods.
    Likewise, GEO-C030 contains a valid narrow warning: matching trace elements
    to a quarry does not alone exclude use of material from that quarry as
    aggregate. It becomes overbroad when extended to XRD or binder-aware
    petrography, which can detect relevant phases and fabrics.

    Thus the site-specific record points in different directions: the Great
    Pyramid attribution is contradicted, while Pumapunku retains a fragile,
    unreplicated positive signal. That warrants “mixed” rather than a claim that
    casting has been demonstrated. The single record whose removal would most
    change this verdict is GEO-E020, because its positive-control design most
    directly tests the proposed binder signature. The mixed verdict survives
    without it: GEO-E018, GEO-E019 and GEO-E021 still weigh against Great
    Pyramid casting, while GEO-E006–E007 still leave the independent Pumapunku
    question open.
  steelman: The assessment does not explain the reported organic matter and
    geopolymer-like microstructures inside Pumapunku andesite with an
    independent, provenance-secure reanalysis; no evidence record supplies a
    blind natural-versus-cast comparison of those monument specimens.
