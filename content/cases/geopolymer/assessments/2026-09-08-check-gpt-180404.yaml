  - claimId: GEO-C012
    verdict: weakly_supported
    reasoning: GEO-E013 reports production of large re-agglomerated limestone
      blocks, while GEO-E022 establishes that lime and diatomaceous earth can
      form a calcium-silicate hydrate binder at room temperature. These records
      make the general mechanism plausible but do not independently characterize
      the large demonstration block or establish that every input and process
      was ancient-feasible at construction scale. GEO-E012 concerns disputed
      archaeological occurrence rather than a controlled feasibility trial. The
      strongest opposing consideration is the absence of an independent, fully
      documented large-block replication using only specified ancient materials
      and operations.
    confidence: moderate
  - claimId: GEO-C010
