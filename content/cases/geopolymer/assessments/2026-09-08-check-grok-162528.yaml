  synthesis: >-
    The featured hypothesis is an existence claim: that at least some major
    megalithic fabric was manufactured by binding processed mineral inputs
    rather than solely by quarrying, carving, and transport. The ledger
    separates cleanly into mechanism, observation, methodology, and attribution.
    Mechanism is the strongest tier. GEO-C011 is established by mainstream
    glass-industry work on Wadi el Natrun and al-Barnuj. GEO-C012 is well
    supported as laboratory feasibility: demonstration blocks, room-temperature
    lime–diatomaceous-earth C–S–H formation, and related alkali-silicate
    chemistry show that hard, stone-like limestone composites can be made with
    materials and temperatures in principle available in antiquity. GEO-C010 is
    provisionally supported by known charcoal-bellows pyrotechnology and early
    glassmaking precedents, though industrial-scale heat delivery remains
    unproven. GEO-C013, the accidental fire-pit discovery pathway, rests on an
    unattributed anecdote and is only weakly supported. Methodology claim
    GEO-C030 is largely correct in its narrow form: standard immobile-trace
    quarry-matching (PXRF, ICP-MS) cannot see binder H/C/O chemistry and
    therefore cannot, by itself, refute a cast-from-same-quarry- aggregate
    story. That critique is real, but it is bounded. Binder-aware petrography,
    SEM-EDS, XRD phase work, and positive-control comparison are not blind in
    the same way, and Jana 2007 explicitly showed that a genuine Davidovits
    geopolymer limestone carries detectable Na+K and Al enrichment and a matrix
    fabric that casing stones lack.

    Attribution is where the hypothesis fails to clear the bar. GEO-C020 (some
    Great Pyramid blocks are cast reconstituted limestone) is contradicted on
    the present record. Folk & Campbell document in-situ sedimentary bedding,
    burrows, fragile fossils, ripple lamination, and block-confined tectonic
    fractures across pyramid fabric—features extremely difficult to reconcile
    with casting. Harrell & Penrod found no zeolite cement in the Lauer showcase
    specimen. Jana’s side-by-side positive control found Barsoum’s highlighted
    Si-rich microconstituents in natural limestone as well, and found no
    alkali-aluminosilicate binder signature in casing stones. Freestone &
    Middleton independently read a British Museum Cheops casing fragment as
    natural limestone with opal-CT, not synthetic cristobalite. Barsoum 2006 and
    MacKenzie 2011 remain the best pro-casting laboratory lines, but sample
    provenance was publicly disputed, the 2006 paper hedges that nature could
    have produced the microstructures, MacKenzie revises the binder from alkali
    geopolymer to C–S–H (so Jana’s alkali negative does not automatically kill
    the revised recipe), and there is still no independent replication on
    ministry-secured samples. The salt narrative that once propped the Egyptian
    case collapses: Sessa et al. 2026 confirm chamber halite, but also document
    halite efflorescence at the Sphinx and other Egyptian limestone monuments,
    and cite Klemm & Klemm for halite as a primary sedimentary constituent of
    Giza nummulitic limestone. The al-Ma’mun salt-layer report has no traced
    medieval anchor in the checked compilation and is carried only by an uncited
    proponent webpage.

    GEO-C021 (Pumapunku/Tiwanaku andesite and sandstone cast) is only weakly
    supported. The SEM/petrography/organic-matter papers are from the
    hypothesis’s principal authors on a shared sample set, without independent
    replication, and sit against a 1971 natural-quarry attribution for the
    sandstones. The 2020 model (GEO-C903) is clearly stated—natural Khapia
    andesite sand stored at Iwawe Stratum V, piedras cansadas unused—but that is
    theory description, not confirmation, and the Iwawe/Khapia checks remain
    open research items. Tool-mark observations (slow measured dolerite removal
    rates; narrow shafts; failed tourist scoop reproduction) are real or
    plausible anomalies for the orthodox pounding account, yet they do not
    positively identify casting; they at most pressure the exclusive-pounder
    story. Restoration-history gaps (GEO-C594) correctly warn that surface
    chemistry and coatings may be modern.

    Rolling up: feasibility does not equal ancient use; quarry-match blindness
    does not equal proof of casting; proponent-only SEM does not equal
    independent materials proof; and the best-studied monument class (Giza
    casing and related limestone) has been examined with binder-aware methods
    and positive controls that fail to show the expected artificial signature
    while showing natural sedimentary structure. The global existence claim
    therefore remains only weakly supported—carried by unreplicated pro-casting
    microanalyses, genuine logistical and rate puzzles, and a live but bounded
    methods critique—against a substantially stronger petrographic and
    conservation record on the Egyptian side and an absence of independent
    Andean confirmation. A single secure-sample, blinded, binder-aware study
    with natural and known-cast controls could still move the needle; on the
    ledger as it stands, the hypothesis does not.
  steelman: Barsoum 2006’s SEM/TEM report of Si–Ca–Mg microconstituent ratios
    absent from the six local quarry comparators, plus hydrated phases “not
    known to hydrate in nature” and amorphous/nanocrystalline Si phases read as
    rapid basic precipitation, together with MacKenzie 2011 multinuclear NMR on
    a Bent Pyramid casing stone suggesting Tura limestone grains in an
    artificial calcium-silicate gel (a recipe Jana’s alkali-geopolymer positive
    control never tested), remain the strongest unrebutted laboratory anomalies
    if sample authenticity were ever secured—no subsequent study has reproduced
    those exact ratio claims on ministry-provenanced core and then shown they
    occur routinely in undisturbed Mokattam fabric under identical protocols.
