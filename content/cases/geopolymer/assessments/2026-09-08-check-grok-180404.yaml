      ancient scale, durability matching, and visual identity for multi-ton
      monuments are unproven. Strongest opposing consideration is that modern
      demos with contemporary knowledge do not establish ancient industrial
      practice or the specific recipes' sufficiency at pyramid volumes.
    confidence: moderate
  - claimId: GEO-C010
    verdict: weakly_supported
    reasoning: Charcoal-and-bellows pyrotechnology can reach ~850 °C at crucible
      scale, and Badari glass is cited as precedent, yet the ledger supplies
      only secondary assertion without quantified industrial-scale heat-work
      evidence. Strongest opposing consideration is the leap from small-batch
      glass or metal work to the sustained thermal regime needed for bulk
      silicate processing of monument stone.
    confidence: low
  - claimId: GEO-C011
    verdict: established
    reasoning: Shortland et al. 2006 directly identify Wadi el Natrun and al-Barnuj
      as primary ancient Egyptian natron sources for vitreous industries with a
      documented 7th–9th-century AD decline and plant-ash replacement. Strongest
      opposing consideration is that the paper addresses glass/faience fluxes
      and is silent on any stone-making use, so availability does not equal
      application.
    confidence: high
  - claimId: GEO-C013
    verdict: unresolved
    reasoning: The claim rests on a single unattributed anecdote of rock-like
      material in a long-cycle fire pit with no controlled replication or
      material characterization in the ledger. Strongest opposing consideration
      is that ash-carbonation chemistry is real in principle, yet the
      discovery-pathway observation itself is flagged as under-sourced even by
      the project's own notes.
    confidence: low
  - claimId: GEO-C030
    verdict: mixed
    reasoning: XRF and ICP-MS are indeed blind to H/C/O and can return identical
      metallic fingerprints for quarried stone and aggregate cast from the same
      quarry, so pure quarry-match arguments over-reach; however Jana 2007's
      positive-control petrography and SEM-EDS directly detect binder alkali/Al
      enrichment and matrix textures when present, bounding the critique.
      Strongest opposing consideration is that many published provenance studies
      never claimed to see binders and the methods point remains valid against
      over-extension of metallic matching alone.
    confidence: moderate
  - claimId: GEO-C001
    verdict: well_supported
