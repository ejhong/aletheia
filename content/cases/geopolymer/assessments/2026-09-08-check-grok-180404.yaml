  synthesis: "The featured hypothesis that some major megalithic monuments contain
    cast reconstituted stone rather than exclusively carved and transported
    natural rock is contradicted by the balance of the supplied evidence
    records. The flagship Egyptian claim (GEO-C020) is met by multiple
    independent petrographic and multi-technique studies (Folk & Campbell
    1991/1992, Harrell & Penrod 1993, Jana 2007 with positive geopolymer
    control, Freestone & Middleton 2007) that document natural sedimentary
    bedding, fossils, burrows, tectonic fractures confined to blocks, opal-CT
    lepispheres identical to those in quarry limestone, particulate textures
    with intergranular pores, and the absence of alkali-aluminosilicate binder
    enrichment or air-void matrices diagnostic of the proposed recipes. Jana's
    side-by-side positive control is decisive against the original Davidovits
    alkali geopolymer; the later C–S–H revision (MacKenzie/Barsoum 2011) remains
    untested by equivalent controls and rests on contested sample provenance.
    Barsoum 2006's SEM/TEM anomalies are real observations but are explained as
    natural microconstituents in the subsequent literature and lack secure
    chain-of-custody confirmation. Salt observations (GEO-C003, GEO-C506)
    collapse under Sessa et al. 2026: halite is confirmed but is reported as a
    primary sedimentary constituent of Giza nummulitic limestone and is
    documented on the carved-bedrock Sphinx and other uncontested Egyptian
    limestone monuments, removing anomaly status; the Al-Ma'mun salt-layer
    report itself lacks any traced medieval Arabic anchor in the checked
    compilation and is carried only by an uncited proponent webpage. For
    Pumapunku/Tiwanaku (GEO-C021) the sole positive line is proponent-authored
    SEM/organic-matter reports on samples of disputed custody, offset by earlier
    natural-quarry attribution and an untested 2020 aggregate-sand model; no
    independent replication exists. Mechanism claims fare better on ingredient
    availability (natron sources strongly attested) and laboratory feasibility
    of small reconstituted blocks, yet ancient industrial-scale production,
    discovery pathway, and visual/hardness equivalence for multi-ton monuments
    remain undemonstrated. Tool-mark and rate observations establish that
    dolerite pounding is slow and that Engelbach's orthodoxy rests on thin early
    trials, but slow rates do not entail casting and leave open skilled-crew or
    supplemental techniques. The methods critique (GEO-C030) correctly notes
    that bulk metallic quarry-matching is binder-blind, yet it is bounded by the
    same petrographic record that directly examines binders and finds none.
    Restoration-history gaps are real confounds for surface claims. Taken
    together, the ledger supplies strong, multi-lab, control-bearing negatives
    on the principal attribution claims, weak and non-independent positives, and
    no uncontested cast specimen. General background knowledge of ancient
    pyrotechnology and lime mortars calibrates that artificial stone is
    conceptually possible, but the evidence records themselves do not establish
    occurrence at the monuments. The verdict is therefore contradicted for the
    hypothesis as framed around major sites; a single secure, independently
    replicated binder signature on provenance-controlled monument stone would
    reopen it."
  steelman: Barsoum 2006's specific hydrated Si-Ca-Mg nanocrystalline phases and
    ratios reported as absent from the six local natural limestones compared,
    together with the MacKenzie 2011 NMR indication of an amorphous
    calcium-silicate gel on a Bent Pyramid casing stone, remain the strongest
    unrebutted laboratory anomalies that a proponent can still cite as not fully
    accounted for by every natural-variability argument in the
    counter-literature.
claimAssessments:
  - claimId: GEO-C022
