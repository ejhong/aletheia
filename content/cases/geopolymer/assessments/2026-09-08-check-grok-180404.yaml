    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Multiple petrographic studies with natural and artificial controls
      document sedimentary structures, fossils, natural opal-CT, and absence of
      geopolymer or anomalous binder signatures in casing and interior samples,
      while Barsoum/MacKenzie positives rest on contested provenance and
      features later matched in natural stone. Strongest opposing consideration
      remains the unreplicated Barsoum microconstituent ratios and the C–S–H NMR
      suggestion, which have not been exhaustively eliminated by every
      comparator set.
    confidence: high
  - claimId: GEO-C021
    verdict: weakly_supported
    reasoning: Only the Davidovits team SEM/petrography and organic-matter reports
      support artificial origin; they are non-independent, custody-questioned,
      and offset by 1971 natural-quarry attribution plus an untested 2020
      sand-aggregate model. Strongest opposing consideration is that volcanic
      rocks can host glassy and organic phases naturally and no blinded
      independent replication exists.
    confidence: low
  - claimId: GEO-C012
    verdict: provisionally_supported
    reasoning: Laboratory demonstrations of re-agglomerated limestone blocks and
      room-temperature C–S–H formation from lime plus diatomaceous earth
