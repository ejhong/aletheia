  - claimId: GEO-C020
    verdict: contradicted
    reasoning: "Four independent-of-each-other negative studies examine the actual
      stone with methods competent to the question: sedimentary bedding, fragile
      intact worm tubes and clam cross-sections, and calcite-filled fractures
      confined to single blocks (Folk & Campbell); no zeolite cement in the
      showcase Lauer specimen (Harrell & Penrod); no alkali-aluminosilicate
      binder against a genuine geopolymer control (Jana); natural limestone with
      opal-CT in a British Museum fragment (Freestone & Middleton). The
