  synthesis: "The ledger separates cleanly into three layers, and they do not fare
    alike. The mechanism layer is the strongest: natron supply at industrial
    scale is mainstream and uncontested (Shortland 2006), 850 °C is trivially
    within charcoal-and-bellows pyrotechnology on general metallurgical
    background, and lime-pozzolan chemistry demonstrably yields a C–S–H binder
    from materials plausibly at hand (Sierra 2010). Nothing in the case turns on
    feasibility; casting limestone-like blocks is possible, and would have been.
    The methodological layer is also partly sound in its narrow form: immobile
    trace-element provenance genuinely cannot discriminate carved quarry stone
    from stone cast with aggregate from that quarry, because XRF and ICP-MS do
    not see H, C, or O. That correctly defuses the Nash 2020 sarsen match and
    the 1971 Pumapunku sandstone attribution as anti-casting arguments — but it
    defuses only provenance reasoning, and the proponents' own author concedes
    petrography and microscopy are exempt. The attribution layer is where the
    case fails as presently evidenced. For Giza, the disputed stone has been
    examined repeatedly with exactly the binder-aware methods the methods
    critique concedes are competent, and the results run one way: macro-scale
    sedimentary and tectonic features confined to individual blocks (Folk &
    Campbell), no zeolite cement in the proponents' own showcase specimen
    (Harrell & Penrod), no alkali-aluminosilicate binder signature in casing
    stones when a genuine Davidovits geopolymer is run as a positive control
    (Jana), and natural limestone with opal-CT rather than synthetic
    cristobalite in an independent museum fragment (Freestone & Middleton).
    Meanwhile the salt line — historically the case's most rhetorically potent
    thread — has just collapsed from both ends: no traceable medieval Arabic
    source for the al-Maʾmūn salt layer, and halite documented as a sedimentary
    constituent of Giza limestone and as efflorescence on the carved-bedrock
    Sphinx. For Pumapunku the picture is thinner but not negative: only
    proponent-authored work exists on both sides of the discriminating question,
    with no independent replication and contested chain of custody. That is
    unresolved, not refuted. Hence weakly_supported overall: a real but small
    residue of unexplained microstructural and NMR observations, embedded in a
    corpus whose best-controlled tests are negative."
  steelman: "Nothing in this ledger tests the revised binder. Jana's positive
    control was a Davidovits alkali-aluminosilicate geopolymer, so his decisive
    negative — no Na/K/Al enrichment in casing-stone binder phases — is silent
    on MacKenzie et al. 2011's proposal that Bent Pyramid casing stones are Tura
    grains cemented by an amorphous calcium-silicate gel, a claim resting on
    ²⁹Si/²⁷Al/⁴³Ca MAS NMR that no one in the record has replicated, rebutted,
    or commented on in fifteen years. Barsoum's specific reported anomalies
    stand equally unanswered on their own terms: hydrated phases with
    calcite/dolomite-like chemistries \"not known to hydrate in nature,\" and
    Si:Ca:Mg microconstituent ratios that he reports exist in none of the six
    local quarry comparators. No study in this ledger has run a lime-pozzolan
    positive control against provenance-secure pyramid samples, which is
    precisely the experiment that would settle it — and the proponent can fairly
    note that the sample-permission regime is why it has never been done."
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    reasoning: "The existence claim is carried almost entirely by its two children,
      and both are weak in different ways: the Egyptian instance has been
      directly tested with binder-aware petrography and repeatedly found
      natural, while the Andean instance rests on a single proponent team's
      unreplicated SEM work. What survives is a genuine residue — Barsoum's
      anomalous microconstituents and MacKenzie's NMR reading — that no negative
      study in the ledger has addressed on its own chemistry. The strongest
      opposing consideration is Jana 2007's positive control, which demonstrates
      that a real casting signature is detectable when present and was not
      present in casing stones, so the \"we couldn't have seen it\" defence does
      not generalise."
