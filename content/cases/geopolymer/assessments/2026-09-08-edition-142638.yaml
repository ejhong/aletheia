caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks produced on site by binding processed mineral inputs (geopolymer, natron/waterglass, lime-pozzolan, or related chemistry) rather than by carving natural rock alone. The two concrete instances are casing and backing blocks of the Great Pyramid and the andesite and sandstone blocks of Pumapunku/Tiwanaku."
  whereDisagreementLives: "Not over whether anomalies exist — a measured quarrying rate, salt reports, proponent SEM and NMR findings — but over three narrower things: whether the pro-casting laboratory results come from provenance-secure samples and survive independent replication; whether the negative petrography, built around an alkali recipe, also excludes the calcium-silicate binder the pro-casting side has moved to; and whether quarry-provenance matching, the strongest conventional evidence class, could detect casting at all if the aggregate came from the matched quarry."
  whatWouldSettleIt: "For Egypt: an independent laboratory testing provenance-secure casing stone specifically for a calcium-silicate binder against matched Tura limestone, with criteria fixed in advance; and a blinded paleomagnetic survey of many blocks against a natural-limestone remanence baseline, which tests set-in-place versus quarried-and-rotated regardless of recipe. For the Andes: independent re-analysis of Pumapunku andesite, and a desk check of the Iwawe Stratum V deposit and the piedras cansadas against the excavators' own descriptions. Either direction is decisive for the specific monument."
  bestConventionalExplanation: "Quarrying, carving, and transport with well-attested means: dolerite pounders and copper tools, fire-setting, ramps, sledges, levers, and large organized labor forces. This is supported by unfinished monuments abandoned mid-carve at quarries, tool marks and tools at extraction sites, worker settlements, experimental carving, and geochemical provenance matching such as Stone 58 to West Woods. Direct petrography of pyramid stone shows sedimentary bedding, fossils, and tectonic fractures that moulds do not produce; salt on interior walls has ordinary sources (efflorescence, groundwater, visitors); slow measured pounding rates imply more labour or supplementary techniques, not manufacture. The account's gaps are quantitative, not existential."
