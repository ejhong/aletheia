    reasoning: The claim is existential, so a single vindicated monument suffices and no number of natural monuments refutes it. The Egyptian instance has been tested directly and, in the recipe tested, contradicted (GEO-E018–E021), with GEO-E020's positive control showing the signature would have been visible. The Andean instance rests on one proponent team's results (GEO-E006, GEO-E007) never independently rerun. GEO-E009 undermines only the Stonehenge case and only through provenance. No monument has an independent positive result on provenance-secure samples; no independent negative exists for Pumapunku. That is a gap in testing, not an evidential tie.
    confidence: moderate
    treatment:
      plainLanguage: Somewhere, at least one great monument has blocks that were manufactured like concrete rather than cut from bedrock.
