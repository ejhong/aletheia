      diagnosticity: high
      diagnosticitySummary: This is the thesis itself; every other claim matters only insofar as it moves this one.
      strongestObjection: Every time monument stone has been examined directly by anyone outside the proponent camp it has read as natural, down to fossil worm tubes and calcite-filled tectonic fractures, and the one study with a positive control found no binder in any casing stone.
