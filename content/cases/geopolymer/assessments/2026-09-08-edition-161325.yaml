  synthesis: "The thesis (GEO-C022) is existential — at least one monument — so the case verdict cannot be an average across branches. The Egyptian branch is the only one tested with binder-aware methods on monument stone, and in the recipe tested it failed: GEO-E018, GEO-E019, GEO-E021 and above all GEO-E020, whose genuine Davidovits-made positive control shows that an alkali-aluminosilicate binder is plainly visible when present and absent from every casing stone examined. What survives on the Egyptian side is the calcium-silicate (C–S–H) binder of GEO-E017, which has drawn no published rebuttal and which GEO-E020's alkali-specific negative does not test, plus the GEO-E012 microconstituents, whose sample provenance is contested and whose distinguishing features GEO-E020 found in natural limestone too. The salt line, formerly untested, is now examined and does not discriminate: the medieval report (GEO-C003) is carried only by an uncited proponent page (GEO-E029) and is absent from al-Suyūṭī's compilation of the breach accounts (GEO-E027); the modern salt is confirmed as halite (GEO-E030) but halite effloresces at the carved-bedrock Sphinx and other Egyptian limestone sites (GEO-E031) and is reported, second-hand via Klemm & Klemm, as a primary constituent of Giza limestone (GEO-E032), while undocumented 1990s cleaning leaves every surface observation without a baseline (GEO-E034). GEO-E033 therefore removes the salt as support for GEO-C020 without testing any block. The Andean branch (GEO-E006, GEO-E007) is one team, one sample set, contested custody, never independently rerun; the only counterweight, GEO-E008, is a 1971 provenance study of sandstone set against microscopy of andesite, so the two partly talk past each other — an untested branch, not a genuine evidential collision. The proponents' 2020 model (GEO-E035) makes that branch checkable at Iwawe and Khapia without touching a monument. The methods critique (GEO-C030, GEO-E024) holds in its narrow form — light-element blindness is real for PXRF and ICP-MS and legitimately limits quarry-match reasoning such as GEO-E009 — but does not reach direct binder-aware petrography and its own table misstates NMR. The Aswan material (GEO-C001, GEO-C002, GEO-C006, GEO-C502) bears on the completeness of the pounding orthodoxy, not on casting. The single evidence record whose removal would most change the case verdict is GEO-E020: without its positive control the Egyptian record would be two supportive and three negative studies with no demonstration that a casting signature is detectable at all, and the case would drift toward 'mixed'. With it, the Egyptian branch is contradicted in the tested recipe, and the case is unresolved only because the C–S–H variant and the Andean stone have never been independently examined."
  steelman: The revised calcium-silicate binder has never been tested for. Every negative Egyptian study was built around Davidovits' alkali-aluminosilicate recipe; the one study with a positive control (GEO-E020) used an alkali geopolymer as that control and its author concedes a binder at about 5 wt% might not register in bulk chemistry. Meanwhile GEO-E017 reports solid-state ²⁹Si/²⁷Al/⁴³Ca NMR on a Bent Pyramid casing stone reading as Tura grains cemented by an amorphous calcium-silicate gel, GEO-E022 shows that lime plus diatomaceous earth forms exactly such a gel at room temperature from materials plausibly available in Egypt, and GEO-E012 reports Si–Ca–Mg ratios absent from all six candidate quarries. No published rebuttal of GEO-E017 exists. The salt evidence (GEO-E030) confirms NaCl on chamber stone as the natron recipe predicts, and no bulk-versus-surface test has been run; the sedimentary reading rests on a citation not yet read. Add the proponents' scope restriction (casing, tops and backing blocks only, per GEO-E023) and the valid narrow form of GEO-C030 — quarry matching cannot see a binder — and a low-percentage lime-pozzolan cement in some casing stones is excluded by nothing in this ledger.
