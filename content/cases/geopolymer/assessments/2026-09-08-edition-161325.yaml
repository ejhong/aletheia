caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks produced on site by binding processed mineral inputs (geopolymer, natron/waterglass, lime-pozzolan, or related chemistry) rather than by carving natural rock alone. The two concrete instances are casing and backing blocks of the Great Pyramid and the andesite and sandstone blocks of Pumapunku/Tiwanaku."
  whereDisagreementLives: "Not over whether anomalies exist — a measured quarrying rate, halite on the pyramid's inner walls, proponent SEM and NMR findings — and no longer over the salt, which both accounts predict once halite is native to Giza limestone. The disagreement is over three narrower things: whether the pro-casting laboratory results come from provenance-secure samples and survive independent replication; whether the negative petrography, built around an alkali recipe, also excludes the calcium-silicate binder the pro-casting side has moved to; and whether quarry-provenance matching, the strongest conventional evidence class, could detect casting at all if the aggregate came from the matched quarry — which at Khapia both sides agree it did."
  whatWouldSettleIt: "For Egypt: an independent laboratory testing provenance-secure casing stone specifically for a calcium-silicate binder against matched Tura limestone, with criteria fixed in advance; and a blinded paleomagnetic survey of many blocks against a Mokattam natural-limestone remanence baseline, which tests set-in-place versus quarried-and-rotated regardless of recipe. For the Andes: a desk check of the Iwawe Stratum V deposit and the piedras cansadas against the excavators' own descriptions, a survey of Cerro Khapia for extraction faces versus natural sand, and independent re-analysis of Pumapunku andesite. For the salt: XRD of efflorescence on unworked Giza/Mokattam bedrock and Tura quarry faces, which would close the salt line if positive. Either direction is decisive for the specific monument."
  bestConventionalExplanation: "Quarrying, carving, and transport with well-attested means: dolerite pounders and copper tools, fire-setting, ramps, sledges, levers, and large organized labor forces. This is supported by unfinished monuments abandoned mid-carve at quarries, tool marks and tools at extraction sites, worker settlements, experimental carving, and geochemical provenance matching such as Stone 58 to West Woods. Direct petrography of pyramid stone shows sedimentary bedding, fossils, and tectonic fractures that moulds do not produce. Salt on interior walls is halite, which effloresces at the carved-bedrock Sphinx and other Egyptian limestone sites and is reported as a primary sedimentary constituent of Giza limestone, mobilised by humidity and visitor-driven condensation. Slow measured pounding rates imply more labour or supplementary techniques, not manufacture. The account's gaps are quantitative, not existential."
  components:
    - label: "Egypt: materials evidence for cast casing stone"
      state: weakly_supported
      note: Two supportive studies (SEM/TEM 2006, NMR 2011) with shared authorship and contested sample provenance against four independent petrographic negatives, one with a genuine geopolymer positive control. Contradicted in the alkali recipe; the calcium-silicate variant is untested. The salt no longer contributes.
    - label: "Andes: Pumapunku andesite"
      state: mixed
      note: Peer-reviewed SEM and organic-matter findings from one proponent team on one contested sample set, never independently rerun; a 1971 sandstone provenance study partly talks past them. The proponents' 2020 model makes two checkable predictions at Iwawe and Khapia.
    - label: Feasibility and ingredients
      state: provisionally_supported
      note: Natron supply at scale is well documented; ~850 °C pyrotechnology is plausible on priors; artificial limestone is demonstrably makeable (self-reported multi-ton blocks, laboratory C–S–H gel, Jana's real geopolymer block). Feasibility is not occurrence; the fire-pit discovery story is a single anecdote.
    - label: Salt as a casting signature
      state: mixed
      note: "The salt is real (XRD: halite) but the medieval report has no traceable author and is absent from al-Suyūṭī's compilation; halite effloresces at the carved Sphinx and other Egyptian limestone sites and is reported (second-hand) as native to Giza strata; 1990s cleaning is undocumented. Both accounts predict salt, so it does not discriminate pending a bedrock comparator."
    - label: Quarrying rates and Aswan features
      state: provisionally_supported
      note: The 216 cm³/h pounder rate is a single peer-reviewed measurement that stresses the pounders-only account; the tourist test block, narrow shafts, and Engelbach characterisation are unsurveyed proponent reports. None bears on casting as against fire-setting or more labour.
    - label: Provenance-method critique
      state: mixed
      note: Correct that PXRF and ICP-MS cannot see a binder and that a quarry match is not a proof of carving; wrong about NMR, and silent on the direct petrography whose positive control shows binders are detectable when present.
  researchPriority:
    level: medium
    reason: Several cheap, decisive checks exist — reading the Iwawe excavation report and Klemm & Klemm, XRD of efflorescence on unworked bedrock, a methods audit — and one moderately priced physical test (blinded paleomagnetism) that does not depend on contested samples. But the hypothesis has failed where it has been tested with binder-aware methods, the conventional account is strongly supported, and the surviving residue (a low-percentage C–S–H cement; one team's Andean microscopy) does not warrant large field programmes before the desk work is done.
