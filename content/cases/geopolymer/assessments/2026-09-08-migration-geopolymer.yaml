      diagnosticity: high
      diagnosticitySummary: Directly decides the Egyptian branch of the thesis and would validate GEO-C022 by itself.
      strongestObjection: "Every multi-technique examination by researchers independent of the Barsoum and Davidovits groups has concluded natural limestone; Jana's 2007 study, the only one with a genuine geopolymer positive control, found the casting signature clearly detectable in the control and absent from every casing-stone sample; and macro-scale sedimentary features (bedding, burrows, marine fossils, tectonic fractures) run through the blocks themselves. The live proponent response is the methods critique (GEO-C030, GEO-E024): quarry-matching chemistry is blind to binders, so provenance results cannot carry the anti-casting conclusion alone — a response that qualifies the provenance evidence class but does not answer the direct petrography above."
