  - claimId: GEO-C030
    verdict: mixed
    reasoning: "The logical point is sound for bulk trace-element methods: they really are blind to H/C/O, and instrument calibrations assume natural stone. But it does not extend to binder-aware methods — Fóti's own chapter concedes petrography and microscopy exist, his methods table misstates NMR (solid-state ²⁹Si NMR is exactly what MacKenzie et al. 2011 used, on the pro-casting side), and Jana 2007's geopolymer positive control (GEO-E020) demonstrated that a real casting signature is detectable when present. So the claim is strong against \"provenance settled it\" and weak as a shield against direct materials analysis. Related catalog claims carrying the same argument (one independence group, not separate evidence): GEO-C507, GEO-C522, GEO-C575."
    confidence: moderate
    treatment:
      plainLanguage: "The methodological hinge of the whole dispute, and the proponents' central counter-argument (Fóti's formulation, endorsed as the case's live crux by editor Eugene, 2026-08-22). Two different toolkits, run by different specialist communities, answer two different questions: quarry-matching fingerprints the metals in the stone and asks \"where did this material come from?\"; binder-aware materials analysis (petrography, SEM-EDS, NMR) asks \"how is this material put together?\". Crushed quarry rock re-bound with a few percent of binder keeps the quarry's metallic fingerprint — so \"we found the quarry\" does not, by itself, answer the casting question, and quarry-match conclusions can overextend into anti-casting claims the chemistry does not support. It is also, read the other way, the escape hatch that keeps the casting hypothesis from being falsified by provenance data alone."
      importance: major
      diagnosticity: high
      diagnosticitySummary: Decides how much weight the strongest conventional evidence class (provenance matching) actually carries against casting.
      strongestObjection: Cast stone requires a binder, and binders are physically detectable; a methodology that looked for them and found none would refute rather than evade the casting reading. Jana 2007 did exactly this for the alkali-aluminosilicate recipe with a positive control and found the signature absent from every casing-stone sample — so the blindness argument, valid against quarry-matching, does not neutralize the direct petrographic record.
      whatWouldChangeOurMind:
        - A published re-examination of quarry-attribution studies under cast-stone-aware methodology (geo topic T-087).
        - A blind test showing standard provenance workflows do (or do not) discriminate known cast composites from their source rock (geo topic T-007).
