caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks produced on site by binding processed mineral inputs (geopolymer, natron/waterglass, lime, or related chemistry) rather than by carving natural rock alone."
  whereDisagreementLives: Not over whether anomalies exist — measured quarrying rates, salt reports, proponent SEM findings — but over whether any of them survive rigorous, independent testing, and whether the provenance methods used to attribute monument stone to quarries could even detect casting if it happened, since cast stone made from quarry-sourced aggregate would inherit the quarry's geochemical signature.
