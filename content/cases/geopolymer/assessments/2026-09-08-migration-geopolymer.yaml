  synthesis: "The featured thesis is existential: GEO-C022 asks only that at least one major monument contain cast stone, so the case verdict cannot be an average across branches. The Egyptian branch is the one that has actually been tested with binder-aware methods on monument stone, and in the recipe tested it failed — GEO-E018, GEO-E019, GEO-E021 and above all GEO-E020, whose genuine Davidovits-made positive control shows that an alkali-aluminosilicate binder is plainly visible when present. What survives on the Egyptian side is narrower than the original claim: the C–S–H (lime-pozzolan) binder proposed in GEO-E017, which has drawn no published rebuttal and which GEO-E020's alkali-based negative does not test, plus the microconstituent anomalies of GEO-E012 whose sample provenance is contested. The Andean branch (GEO-E006, GEO-E007) is one team, one sample set, contested custody, never independently rerun; the only counterweight, GEO-E008, is a 1971 provenance study of sandstones set against microscopy of andesite, so the two partly talk past each other. That is an untested branch, not a genuine evidential collision — hence unresolved rather than mixed or weakly_supported. The proponents' methods critique (GEO-C030, GEO-E024) holds only in its narrow form: H/C/O blindness is real for PXRF and ICP-MS and legitimately qualifies quarry-match reasoning such as GEO-E009, but it does not reach direct binder-aware petrography, and its own methods table misstates NMR. The Aswan material (GEO-C001, GEO-C002, GEO-C006) bears on the completeness of the pounding orthodoxy, not on casting; even a fully vindicated GEO-E001 is compatible with fire-setting, chisels or more labour. Decisive next steps are unchanged: provenance-secure Egyptian samples tested specifically for a C–S–H binder, and an independent modern re-analysis of Pumapunku andesite."
