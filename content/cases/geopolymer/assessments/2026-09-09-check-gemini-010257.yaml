  synthesis: "The megalithic casting hypothesis posits that key components of
    ancient monumental masonry were manufactured in situ from chemical slurries
    rather than carved from quarried bedrock. While materials-science
    replication demonstrates that synthetic limestone binders (such as C-S-H
    gels and alkali geopolymers) are chemically feasible at ambient temperatures
    with ancient ingredients (GEO-C012, GEO-E013, GEO-E022), the empirical
    evidence that such technology was actually deployed at monument scale
    remains tenuous and predominantly contradicted by geological observations.
    Proponent analyses of Great Pyramid casing stones and Pumapunku andesite
    (GEO-E012, GEO-E017, GEO-E006, GEO-E007) claim anomalous microstructural
    constituents, amorphous gels, and organic residues. However, subsequent
    independent petrographic investigations (GEO-E018, GEO-E019, GEO-E020,
    GEO-E021) demonstrate that pyramid blocks exhibit intact natural sedimentary
    structures (such as uninterrupted fossil shells, burrows, and tectonic
    fractures) entirely inconsistent with disaggregated slurry casting.
    Crucially, comparative petrography using an authentic geopolymeric positive
    control (Jana 2007) revealed that true artificial binders exhibit distinct
    Na/K and Al enrichment absent in pyramid casing stones, while the amorphous
    siliceous microstructures cited as artificial signatures naturally occur as
    opal-CT lepispheres. Similarly, historical and observational anomalies cited
    to support casting fail scrutiny: reported interior salt crusts (GEO-C003,
    GEO-C506) represent normal evaporite mobilization of halite native to Giza
    nummulitic limestone (GEO-E031, GEO-E032), not natron processing residues.
    Furthermore, the absence of salt mentions in early Arabic breach accounts
    (GEO-E027) removes a core historical pillar. While Fóti's methodological
    critique (GEO-C030) validly notes that elemental quarry-matching (ICP-MS,
    XRF) cannot separate aggregate from quarried stone, it does not inoculate
    the hypothesis against binder-specific petrography and macro-sedimentary
    bedding. With Pumapunku's evidence confined to an uncorroborated proponent
    team and Egyptian field evidence heavily favoring carved sedimentary stone,
    the overarching attribution claim (GEO-C022) remains weakly supported at
    best."
  steelman: Solid-state multinuclear NMR spectra of Bent Pyramid casing stones
    (MacKenzie et al. 2011) demonstrate an amorphous calcium-silicate-hydrate
    (C-S-H) binding gel distinct from natural quarry comparators, a specific
    phase detection that is unaddressed by negative tests calibrated solely
    against alkali-aluminosilicate geopolymers.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    reasoning: The overarching existence claim rests on ambiguous microstructural
      anomalies in a handful of Egyptian and Bolivian specimens (GEO-E006,
      GEO-E012, GEO-E017). However, robust independent petrographic surveys
      (GEO-E018, GEO-E020, GEO-E021) consistently identify intact natural
      sedimentary bedding, fossils, and lack of synthetic binder phases across
      surveyed monuments. The strongest opposing consideration is that testing
      has sampled an extremely small fraction of total monumental stones,
      leaving open the possibility of targeted composite use in casing or
      backing blocks.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Extensive optical and electron petrography by multiple independent
      groups (GEO-E018, GEO-E019, GEO-E020, GEO-E021) demonstrates that Great
      Pyramid casing and core blocks possess intact sedimentary structures,
      fossil cross-sections, and natural opal-CT lepispheres rather than
      artificial matrices. Furthermore, positive-control testing confirms casing
      stones lack the alkali enrichment found in Davidovits' geopolymers. The
      strongest opposing consideration is the MacKenzie et al. (2011)
      multinuclear NMR study indicating an amorphous C-S-H cementing gel in a
