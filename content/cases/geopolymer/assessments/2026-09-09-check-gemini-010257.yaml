      anecdote in proponent literature (GEO-E015). While basic soil carbonation
      and ash-slagging are theoretically possible under continuous alkaline
      conditions, no controlled experimental replication has documented the
      spontaneous formation of hard, structural artificial limestone. The
      strongest opposing consideration is that ash deposits in archaeological
      fire pits typically remain friable silt and charcoal without cementing
      into coherent stone blocks.
    confidence: low
  - claimId: GEO-C001
