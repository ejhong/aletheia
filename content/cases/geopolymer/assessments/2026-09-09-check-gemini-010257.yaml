  - claimId: GEO-C903
    verdict: established
    reasoning: This is a purely descriptive claim detailing Davidovits' 2020
      published hypothesis regarding Pumapunku andesite sand sourcing from Cerro
      Khapia and storage at Iwawe. The evidence record (GEO-E035) confirms that
