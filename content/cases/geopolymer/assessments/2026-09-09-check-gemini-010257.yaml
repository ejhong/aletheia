      that the underlying archaeological report by Isbell & Burkholder (2002)
      may characterize Stratum V differently than Davidovits asserts.
    confidence: high
  - claimId: GEO-C030
    verdict: well_supported
    reasoning: Standard elemental quarry-matching methods (such as PXRF and ICP-MS)
      rely on heavy or immobile trace elements and do not characterize light
      elements (H, C, O) or hydration binder phases that bind crushed aggregate.
      Consequently, natural bedrock and crushed aggregate from the same bedrock
      will present identical metallic provenance profiles. The strongest
      opposing consideration is that full-spectrum characterization often
      integrates mineralogical techniques like XRD and thin-section petrography,
      which readily distinguish natural crystalline textures from reconstituted
      synthetic binders.
    confidence: high
  - claimId: GEO-C012
    verdict: well_supported
    reasoning: "Chemical and materials feasibility has been demonstrated
      experimentally: ambient-temperature formulations of lime, pozzolans, or
      diatomaceous earth readily form coherent C-S-H binders (GEO-E022), and
      large reconstituted limestone blocks have been physically synthesized by
      proponents (GEO-E013). The underlying mineral chemistry does not exceed
      ancient technical capabilities. The strongest opposing consideration is
      that producing multi-ton crack-free blocks without modern hydraulic
      cements poses severe rheological, setting, and drying shrinkage challenges
      at scale."
    confidence: high
  - claimId: GEO-C010
    verdict: provisionally_supported
    reasoning: Pre-industrial pyrotechnology utilizing charcoal and forced-air
      bellows routinely achieved temperatures of 850 °C to 1100 °C, as evidenced
      by ancient metallurgy, faience, and glassmaking precedents (GEO-E010,
      GEO-E016). The thermal requirements for basic silicate melting are
      historically attested within the Bronze Age. The strongest opposing
      consideration is that achieving such temperatures in crucible scale does
      not demonstrate the capacity for industrial-scale batch calcination of
      thousands of tons of reagents.
    confidence: moderate
  - claimId: GEO-C011
    verdict: established
    reasoning: Historical and archaeological evidence confirms that Egypt exploited
      vast, industrial-scale natron evaporite deposits at Wadi el Natrun and
      al-Barnuj throughout antiquity, with supply dropping sharply in the early
      medieval period (GEO-E010, GEO-E011). This resource framework is fully
      recognized in mainstream archaeological science. The strongest opposing
      consideration is that natron exploitation is overwhelmingly documented for
      mummification, faience, and glassmaking, with zero textual or logistical
      records connecting it to monumental masonry.
    confidence: high
  - claimId: GEO-C013
    verdict: weakly_supported
    reasoning: The assertion that long-cycle fire pits accidentally produce durable
