  synthesis: "The megalithic casting hypothesis seeks to resolve longstanding
    logistical paradoxes of monumental construction by proposing that ancient
    builders cast blocks in situ from chemical slurries rather than exclusively
    quarrying, carving, and transporting solid stone. Proponents assemble an
    intriguing case anchored in the verified mechanical bottlenecks of ancient
    quarrying: quantitative trials by Marčiš et al. (2023) record dolerite
    pounder removal rates of only 216 cm³/h, underscoring the immense labor
    burden of traditional quarrying, while materials analyses by Barsoum et al.
    (2006) and MacKenzie et al. (2011) identified anomalous amorphous
    calcium-silicate microconstituents and NMR spectra in pyramid casing samples
    that do not match surrounding quarries. Furthermore, chemical feasibility
    demonstrations show that ancient societies possessed the pyrotechnology,
    natron deposits, and lime-pozzolan chemistry needed to reconstitute stone at
    ambient temperatures. However, when evaluated against the empirical ledger
    of physical stone analyses, the casting hypothesis is contradicted. Multiple
    rigorous petrographic studies across four decades (Folk & Campbell 1992,
    Harrell & Penrod 1993, Jana 2007, Freestone & Middleton 2007) demonstrate
    that Great Pyramid blocks exhibit intact sedimentary bedding, delicate
    fossil shells traversing block fabrics, micro-burrows, and tectonic calcite
    veins that cannot form in a poured slurry. Crucially, Jana (2007) introduced
    a positive control—a genuine Davidovits geopolymer block—and proved that the
    microconstituents highlighted by Barsoum are natural opal-CT lepispheres
    found in natural Tura limestone, whereas the synthetic binder matrices,
    spherical air voids, and alkali signatures of cast stone are entirely absent
    from monument samples. The secondary pillar of the hypothesis—unusual salt
    efflorescence—has been thoroughly dismantled by Sessa et al. (2026), who
    established that halite is a native marine evaporite inherent to Giza
    plateau limestone, efflorescing identically on uncast bedrock monuments like
    the Sphinx. Without microstructural or binder evidence in monument stone,
    the hypothesis fails. Sensitivity analysis indicates that the single most
    decisive record is Jana (2007); however, the contradicted verdict robustly
    survives its removal due to the converging field and laboratory petrography
    of Folk & Campbell and Freestone & Middleton."
  steelman: Barsoum et al. (2006) and MacKenzie et al. (2011) documented
    amorphous, hydrated calcium-silicate (C–S–H) phases and distinctive
    solid-state NMR spectra in Snefru casing stones that remain unreplicated on
    natural quarry controls, coinciding with measured experimental dolerite
    pounding rates of only 216 cm³/h that challenge orthodox quarrying
    durations.
