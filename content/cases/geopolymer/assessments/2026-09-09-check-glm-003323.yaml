  synthesis: "The casting hypothesis splits into three evidential theatres that
    must not be averaged. Theatre one, the Great Pyramid, now has the case's
    densest record: Barsoum 2006 reports real SEM/TEM microconstituents in some
    samples, but those samples carry contested, undocumented provenance, and
    Jana 2007 — the only study in the exchange with a positive control, a
    genuine Davidovits geopolymer — showed the same Si-rich features in natural
    limestone and no alkali binder in casing stones. Folk & Campbell's in-situ
    sedimentary features (bedding, burrows, clams, tool marks across many
    blocks) and Freestone & Middleton's independent multi-technique negative
    converge the same way. The salt line, once a pillar, has collapsed within
    this ledger: Sessa et al. 2026 document halite efflorescence at the
    carved-bedrock Sphinx and other Egyptian limestone sites, and report Klemm &
    Klemm reading halite as native to Giza nummulitic limestone, so surface NaCl
    no longer discriminates. Theatre two, the Bent Pyramid, is different:
    MacKenzie 2011's NMR finding of Tura grains in an amorphous C–S–H gel formed
    \"by human intervention\" is unrebutted, used a technique outside Fóti's
    flawed methods table, and lies outside Jana's alkali-recipe test — but it is
    one casing stone, partly Barsoum's own group, and feasibility (Sierra 2010)
    is not occurrence. Theatre three, Pumapunku, rests entirely on one proponent
    team's unreplicated SEM/petrography against a methodologically dated 1971
    provenance study — genuinely unresolved. The methods critique (GEO-C030) is
    chemically correct for XRF/ICP-MS but, by Fóti's own concession and Jana's
    positive control, does not reach binder-aware petrography. Steelmanning the
    orthodoxy: the strongest anti-casting evidence is controlled, replicated in
    technique class, and independent of the proponents, while the strongest
    pro-casting evidence is either proponent-authored, provenance-disputed, or a
    single sample. Steelmanning the proponents: Jana's negative never tested the
    C–S–H binder MacKenzie actually found, the paleomagnetic and Iwawe tests
    that could settle the question have never been run, and the salt
    discriminator's collapse is itself only second-hand. Net: the flagship
    attribution claim is contradicted by the best controlled evidence, a
    revised-binder claim stands unrebutted, and the decisive binder-aware,
    provenance-secure test at scale has never been run. That is a substantive
    mixed, not a safe one."
  steelman: "The 2011 multinuclear MAS NMR result on the Bent Pyramid casing stone
    (MacKenzie, Smith, Wong, Hanna, Barry & Barsoum): an independent
    spectroscopic technique at partly independent labs found limestone grains
    from the Tura quarry cemented by an amorphous calcium-silicate gel \"formed
    by human intervention, by the addition of extra silica,\" and no published
    replication, rebuttal, or comment on that paper exists as of the ledger's
    2026-08-22 check. Jana 2007's positive control refutes only the
    alkali-aluminosilicate recipe, not this C–S–H binder, so the strongest
    anti-casting study never tested the chemistry the strongest pro-casting
    study actually proposes. A proponent can rightly ask: where is the
    binder-aware petrographic or NMR examination, with proper controls, of Bent
    Pyramid casing material that answers MacKenzie? Until that exists, one
    unrebutted peer-reviewed instrumental finding of a human-made binder in a
    major monument stands unanswered."
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    reasoning: The generic attribution claim inherits the case's split record. Jana
      2007's positive control shows casting signatures are detectable and finds
      none in Great Pyramid casing stones, and Folk & Campbell's in-situ
      sedimentary features argue broadly against casting; yet MacKenzie 2011's
      unrebutted C–S–H binder finding at the Bent Pyramid is exactly the kind of
      evidence the claim requires and has never been independently tested. The
      strongest opposing consideration is that every controlled, independent
      examination of monument stone to date has returned natural — but none of
      those examinations tested the revised binder chemistry.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Every direct examination of Great Pyramid stone with adequate
      controls in this ledger — Jana 2007 with a genuine geopolymer positive
      control, Freestone & Middleton's independent multi-technique analysis,
      Folk & Campbell's in-situ petrography, Harrell & Penrod on the Lauer
      sample — finds natural limestone, and Jana specifically reproduces
      Barsoum's anomalous microconstituents in natural comparators. The
      supporting Barsoum 2006 result rests on samples whose provenance the
      Supreme Council of Antiquities disputes, and MacKenzie 2011 concerns
      Snefru's Bent Pyramid, not Khufu's. The residual scope — largely untested
      interior core blocks — is why confidence is moderate rather than high, not
      why the verdict softens.
    confidence: moderate
  - claimId: GEO-C021
    verdict: unresolved
    reasoning: The only direct evidence is Davidovits' own team's SEM/petrographic
      reports (GEO-E006/E007), peer-reviewed but unreplicated, with questioned
      sample provenance and untested discriminating criteria against naturally
      glassy volcanic phases; the counter-evidence is a 1971 provenance study
      using pre-modern methods. Both directions carry named defects, and no
      independent laboratory has examined Pumapunku andesite. This is a genuine
      stalemate, not a safe default.
    confidence: low
  - claimId: GEO-C004
    verdict: established
    reasoning: "As stated, the claim is descriptive: peer-reviewed publications by
      Davidovits' team do report organic matter and microstructural features
      they argue are inconsistent with natural volcanic stone, and the ledger's
      source records confirm this accurately. The verdict does not endorse the
      interpretation — the strongest opposing consideration is that volcanic
      rocks naturally host organic and glassy phases and the discriminating
      criteria were never blind-tested, and sample provenance has been
      questioned. Local truth of the report; not diagnosticity."
    confidence: moderate
  - claimId: GEO-C903
    verdict: established
    reasoning: "This is a theory-description claim, and the primary abstract
      (GEO-E035, verified against the geopolymer.org landing page) states
      exactly what the claim says: natural Khapia andesite sand stored at Iwawe
      Stratum V, no crushing, and the piedras cansadas not used. The main caveat
      is that only the abstract was read and the venue is the proponents' own
      journal, but for a claim about what the model specifies, that suffices.
      Its empirical testability is precisely what GEO-R009 and GEO-R012 target."
    confidence: high
  - claimId: GEO-C030
    verdict: provisionally_supported
    reasoning: "The core chemistry is textbook: XRF and ICP-MS cannot see hydrogen,
      carbon, or oxygen, so a trace-element quarry match genuinely cannot
      distinguish carved stone from stone cast with same-quarry aggregate — and
      the ledger honestly notes Fóti's methods table errs elsewhere (it wrongly
      lists NMR, which MacKenzie 2011 used productively). The strongest opposing
      consideration is Jana 2007: his positive control demonstrates that
      binder-aware petrography does detect casting when present, so the claim's
      implicit generalization from quarry-matching blindness to
      undetectability-at-large fails, and XRD's inclusion in the claim is
      overextended."
    confidence: moderate
  - claimId: GEO-C012
    verdict: provisionally_supported
    reasoning: "Feasibility has genuine support: Sierra 2010 shows lime plus
      diatomaceous earth forms a C–S–H binder at room temperature, and the
      Geopolymer Institute reports multi-ton demonstration blocks — but the
      latter is self-reported with no independent analysis, and the natron
      route's feasibility at construction scale is expressly untested
      (GEO-C519). The claim is about capability, and the demonstration gap
      between a lab binder and large, hard, visually natural blocks produced
      with ancient means is real. Feasibility is not occurrence."
    confidence: moderate
  - claimId: GEO-C010
