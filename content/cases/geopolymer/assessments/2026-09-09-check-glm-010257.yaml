      creep: the claim is true only for trace-element quarry matching, not for
      binder-aware petrography, which Jana's positive control shows can detect
      casting signatures directly, and Fóti's own methods table overstates
      blindness (his claim that NMR cannot see Si is wrong). Read narrowly, the
      claim survives; it cannot be extended to exempt monument stone from all
      analysis."
