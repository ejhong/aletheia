  - claimId: GEO-C030
    verdict: well_supported
    reasoning: "The core chemistry is textbook: PXRF and ICP-MS measure metallic
      trace elements and are effectively blind to hydrogen, carbon, and oxygen,
      so stone cast from aggregate collected at the matched quarry would return
