  synthesis: "The case splits cleanly into two halves. The mechanism half is in
    reasonable shape: natron supply at industrial scale is established by
    mainstream archaeometry (GEO-E010), the 850 °C pyrotechnology claim is
    plausible on priors though thinly evidenced in the ledger, and the
    feasibility of reconstituted limestone is supported by demonstration blocks
    and, in a revised C–S-H form, by peer-reviewed materials science (GEO-E013,
    GEO-E022). The methods critique (GEO-C030) is chemically sound in its narrow
    form: PXRF and ICP-MS genuinely cannot see hydrogen, carbon, or oxygen, so
    trace-element quarry matches cannot by themselves exclude stone cast from
    the same quarry's aggregate — a point Jana 2007 itself concedes for small
    binder fractions. The attribution half is where the case falters. For the
    Great Pyramid there is a genuine multi-technique conflict: Barsoum 2006 and
    MacKenzie 2011 report real microstructural and spectroscopic anomalies, but
    they are met by Folk & Campbell's broad in-situ sedimentary features
    (bedding, burrows, intact clam sections), Harrell & Penrod's negative on the
    proponents' own showcase specimen, and — most decisively — Jana's
    positive-controlled petrography showing that a genuine geopolymer displays
    alkali enrichment and a smooth void-bearing matrix that no casing stone
    shows. The salt line, once a pillar of the pro case, has been largely
    dissolved by Sessa et al. 2026: halite is reported as native to Giza
    nummulitic limestone and effloresces at the Sphinx, Saqqara, Lisht and other
    Egyptian limestone sites nobody claims were cast, and the al-Ma'mun salt
    report itself has no traceable medieval anchor. For Pumapunku the only
    positive evidence is proponent-authored, unreplicated, from a contested
    sample set, and is met by a 1971 provenance attribution of undetermined
    force given GEO-C030. The honest roll-up: feasibility and method-blindness
    are supported, pyramid attribution is genuinely contested (mixed, not
    settled either way), Pumapunku attribution is weakly supported, and several
    popular surface arguments (salt anomaly, tourist scoop-mark failures,
    fire-pit discovery story) are anecdotal or now counter-evidenced.
    Sensitivity: remove Barsoum 2006 (GEO-E012) and the case's only substantial
    non-proponent laboratory support collapses — MacKenzie 2011 shares a
    co-author — dropping the overall verdict from mixed toward weakly_supported;
    the mixed verdict does not survive that removal intact."
  steelman: Jana 2007's decisive negative tested only Davidovits' original
    alkali-aluminosilicate recipe; the casting hypothesis as actually defended
    in the peer-reviewed literature has since been revised to an amorphous
    calcium-silicate (C–S–H) binder (MacKenzie et al. 2011, GEO-E017), and no
    study in this ledger — including Jana's positive control — tests that
    revised recipe against pyramid stone. MacKenzie's multinuclear MAS NMR
    result on a Bent Pyramid casing stone (Tura grains cemented by amorphous
    calcium-silicate gel) has never been rebutted, replicated, or formally
    answered anywhere in the record, and Folk & Campbell 1992 predates Barsoum
    2006 and therefore does not address the specific Si-rich microconstituents
    at issue. A proponent can also point to the Aswan shafts (GEO-C006) and the
    un-replicated 216 cm³/h pounding rate (GEO-C001) as measured anomalies with
    no completed conventional accounting. The absence of any binder-aware test
    of the C–S-H recipe on provenance-secure samples is a genuine hole in the
    anti-casting case.
