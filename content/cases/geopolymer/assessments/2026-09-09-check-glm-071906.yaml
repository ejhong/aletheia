  synthesis: "The case splits cleanly by rung, and the split drives the verdict.
    At the mechanism rung the casting hypothesis is in reasonable shape:
    industrial natron supply is established mainstream archaeology (GEO-C011,
    Shortland 2006), 850 °C pyrotechnology is uncontroversial against Old
    Kingdom metallurgical background (GEO-C010), and reconstituted-limestone
    binder chemistry is feasible at room temperature (GEO-C012 via Sierra 2010).
    Feasibility is not occurrence, however, and the attribution rung is where
    the evidence thins. The strongest independent positive remains Barsoum 2006
    (GEO-E012) with the MacKenzie 2011 NMR follow-up — real, partly independent,
    peer-reviewed, and never formally rebutted in a journal — but it rests on
    samples whose provenance Egypt's Supreme Council of Antiquities publicly
    disputed, and the specific anomalies were matched in natural limestone by
    Jana's positive-control petrography and Freestone & Middleton's independent
    multi-technique analysis. The Andean branch is entirely proponent-sourced:
    the best observation, organic matter inside fragment PP1 (GEO-C918), comes
    from a loose fragment picked up outside the protected monument area
    (GEO-C913), with no geological andesite control ever run (GEO-E060) and the
    authors themselves unable to distinguish binder from guano residue
    (GEO-E059). Meanwhile the two most legible pro-casting anomalies degrade on
    inspection: the salt discriminator collapses against halite documented at
    the carved-bedrock Sphinx and in Giza's parent strata (GEO-C506,
    GEO-E031/E032), and the Al-Ma'mun salt report currently has no traceable
    medieval anchor at all (GEO-C003). The proponents' methods critique
    (GEO-C030) is valid in its narrow form — trace-element provenance genuinely
    cannot distinguish stone cast from same-quarry aggregate — but Jana 2007
    demonstrates that binder-aware petrography is not so blind, and the critique
    exempts petrography itself. Steelmanning the opposition: four independent
    petrography efforts, one with a positive control, found natural stone, and
    no pro-casting measurement anywhere in the corpus has been independently
    replicated. Steelmanning the proponents: every decisive negative tested the
    alkali-aluminosilicate recipe or predates the NMR work, so the revised C–S–H
    binder reading survives all of them untested. Hence weakly_supported at low
    confidence. Sensitivity: remove GEO-E012 (Barsoum 2006) and the case loses
    its only non-proponent laboratory positive on Egyptian stone; the present
    verdict would not survive and would drop toward contradicted — the case
    verdict hangs materially on that single contested thread."
  steelman: The MacKenzie 2011 multinuclear NMR result on Bent Pyramid casing
    stone — a −84 ppm shoulder and dominant −111 ppm silica resonance attributed
    to an amorphous calcium-silicate gel binder "formed by human intervention" —
    has never been tested against a stratified natural Tura/Dahshur/Giza
    limestone suite and never refuted; every decisive negative in the ledger
    (Jana 2007, Folk & Campbell 1992, Harrell & Penrod 1993, Freestone &
    Middleton 2007) either examined the alkali-aluminosilicate geopolymer
    recipe, which the pro-casting side has since abandoned, or predates the NMR
    work entirely, and no aged C–S–H positive control has ever been run on
    pyramid stone. The one binder chemistry consistent with the pro-casting
    microstructural evidence therefore stands completely untested (GEO-R017
    unbudgeted), and a proponent can rightly say the case against GEO-C020 was
    never closed.
