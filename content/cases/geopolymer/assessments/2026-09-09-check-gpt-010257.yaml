      sulfur-rich modern repair material, and recurrent efflorescence. This
      establishes that undocumented intervention can confound surface evidence
      at one central site. The strongest opposing consideration is that one
      well-described Giza example cannot establish the claim's near-global
      assertion that almost no megalithic site has a complete published
      restoration history.
    confidence: moderate
  - claimId: GEO-C005
    verdict: well_supported
    reasoning: GEO-E014 directly records Fóti's argument that the scale and
      apparatus in the Rekhmire scene fit mineral or waterglass processing
