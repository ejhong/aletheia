  synthesis: >-
    The ledger yields a mixed verdict because it contains genuine, mutually opposed materials observations rather than merely a dispute between authorities. The strongest case for casting consists of the anomalous microconstituents reported in Great Pyramid samples in GEO-E012, the multinuclear-NMR interpretation of a Bent Pyramid casing sample as Tura grains bound by an artificial calcium-silicate gel in GEO-E017, and the SEM and petrographic observations from Pumapunku in GEO-E006 and GEO-E007. These are more probative than transport puzzles, surface resemblance, or historical speculation because they purport to measure the material itself. They also keep the broad existential claim GEO-C022 alive: even if one proposed site is natural, another could contain manufactured stone. The Pumapunku evidence, however, is one non-independent proponent sample set with questioned provenance and no blinded replication. GEO-C903 accurately describes a more detailed aggregate-source model but supplies no independent occurrence evidence.

    The Great Pyramid attribution fares substantially worse. GEO-E018 reports widespread bedding, fossils, burrows, ripple lamination, fractures, and tool marks characteristic of natural sedimentary blocks. GEO-E020 adds the ledger's most discriminating comparison: monument samples and natural limestone were examined beside a known Davidovits geopolymer, whose binder and pore fabric were detectable but absent from the casing samples. GEO-E019 and GEO-E021 provide further natural-stone findings, although individual specimens and the disputed Lauer sample cannot prove that every block is natural. GEO-E012 remains a serious opposing result, but its sample provenance, limited quarry comparison, and the occurrence of its highlighted feature classes in natural limestone reduce its diagnostic force. GEO-E017 does not directly establish GEO-C020 because its sample came from the Bent Pyramid, and its proposed calcium-silicate chemistry differs from the alkali-aluminosilicate recipe tested by GEO-E020.

    The narrow core of GEO-C030 is sound: a trace-element provenance match alone cannot distinguish a natural block from a hypothetical composite made principally from material gathered at that source. Its broader wording is not sound, because XRD is phase-sensitive and binder-aware microscopy and petrography can test fabrication rather than merely provenance. Thus quarry matching is not proof of carving, but neither does methodological criticism neutralize the direct petrographic negatives.

    Feasibility evidence is weaker than occurrence evidence. Natron availability is established, and temperatures near 850 degrees Celsius are plausible partly on general pyrotechnological priors, but the ledger lacks an independently characterized, ancient-feasible, monument-scale limestone replication. The Aswan removal-rate result may show that pounders were not the sole technique; it does not imply casting. Likewise, the salt line has largely collapsed as a discriminator: instrumental work confirms halite but reports comparable Egyptian efflorescence and a natural sedimentary source. The alleged medieval salt account remains untraced.

    The single record whose removal would most change this assessment is GEO-E020, because its positive control most directly demonstrates that a genuine geopolymer signature is detectable and absent from the tested Great Pyramid stones. Without GEO-E020, the negative Great Pyramid case becomes less decisive, but GEO-E018, GEO-E019, and GEO-E021 still oppose casting while the unresolved Pumapunku and Bent Pyramid observations remain; the overall mixed verdict therefore survives.
  steelman: No evidence record independently reanalyzes a provenance-secure Bent Pyramid casing sample for the amorphous calcium-silicate gel reported by multinuclear NMR in GEO-E017. GEO-E020 tested an alkali-aluminosilicate geopolymer rather than that revised binder, so the ledger leaves a specific direct-material observation capable of satisfying the broad existential hypothesis without a matched rebuttal.
