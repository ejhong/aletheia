  synthesis: "The casting hypothesis asserts that at least some major megalithic
    blocks were manufactured in place from processed mineral inputs rather than
    solely quarried, carved and transported. Mechanism-level claims are the
    strongest part of the ledger. Natron sources at industrial scale are
    established by mainstream glass literature, temperatures around 850 °C lie
    within charcoal- and-bellows reach, and laboratory reconstitutions plus
    lime-diatomaceous- earth C–S–H gels demonstrate that artificial limestone
    visually and mechanically similar to natural stone can be produced with
    materials available to ancient builders. The methodological claim that bulk
    trace- element quarry matching is blind to binder chemistry (H/C/O) is also
    sound in its narrow form and correctly limits the force of provenance
    studies such as Nash 2020 or Ponce 1971. These points keep the hypothesis
    live as a technical possibility. Attribution, however, fails to clear the
    bar set by the same evidence records. For the Great Pyramid the decisive
    petrographic suite (Folk & Campbell in-situ bedding, burrows and fractures
    confined to single blocks; Harrell & Penrod on the Lauer sample; Jana’s
    side-by-side positive-control comparison showing no alkali-aluminosilicate
    enrichment and natural opal- CT lepispheres; Freestone & Middleton
    multi-technique natural limestone) consistently reads the examined casing
    and interior stones as ordinary Mokattam or Tura limestone. Barsoum 2006 and
    the later MacKenzie NMR paper remain the only non-proponent laboratory
    anomalies, yet sample provenance is contested by the Supreme Council, the
    claimed binder has shifted from geopolymer to C–S–H, and Jana’s positive
    control directly demonstrates that a real casting signature is detectable
    when present. Salt observations, once central, collapse once Sessa 2026 and
    the cited Klemm geology place halite as a primary sedimentary constituent of
    Giza nummulitic limestone and document identical efflorescence on the
    carved-bedrock Sphinx and other natural monuments; the Al-Ma’mun salt-layer
    report itself lacks any traced medieval anchor. For Pumapunku the sole
    positive microstructural and organic-matter claims come from the Davidovits
    team on samples whose chain of custody has been questioned; the 1971
    Bolivian Academy quarry attribution and the 2020 model’s reliance on Iwawe
    Stratum V sand remain untested against the excavators’ own descriptions.
    Tool-mark and rate observations (Marčiš 216 cm³ h⁻¹, tourist scoop-mark
    failures, narrow shafts) establish that pure dolerite pounding is slow and
    ergonomically awkward, yet they do not discriminate casting from
    supplemental techniques already contemplated by conventional accounts, nor
    do they supply a positive casting signature. Restoration-history gaps
    further weaken every surface-chemistry claim. The net result is a
    technically feasible process whose application to any named major monument
    is either contradicted by binder-aware petrography or supported only by
    unreplicated proponent data. The case therefore sits at mixed: mechanism
    open, attribution unresolved to negative for the load-bearing examples."
  steelman: Barsoum 2006 SEM/TEM microconstituents (Si-Ca-Mg ratios absent from
    the six local natural limestones, hydrated phases not known to form in
    nature, nanocrystalline silica consistent with rapid basic precipitation)
    plus the MacKenzie 2011 NMR detection of an amorphous calcium-silicate gel
    on a Bent Pyramid casing stone remain unexplained by the natural-limestone
    petrography of Folk, Jana and Freestone; if those specific anomalies survive
    blinded re-analysis on provenance-secure samples they would constitute
    positive evidence of human intervention that the present negative controls
    have not fully extinguished.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    reasoning: No monument has been shown by independent, binder-aware analysis to
      contain cast stone; the two principal candidates (Giza casing/backing and
      Pumapunku andesite) are respectively contradicted or supported only by
      unreplicated proponent work. Feasibility and methods critiques keep the
      existential claim open rather than falsified. Strongest opposing
      consideration is the absence of any positive control-matched signature on
      a secure sample.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Multiple independent petrographic and multi-technique studies (Folk &
      Campbell, Harrell & Penrod, Jana with positive geopolymer control,
      Freestone & Middleton) find natural sedimentary fabrics, tectonic
      fractures limited to single blocks, tool marks, and no alkali-
      aluminosilicate or crushed-reaggregated binder. Barsoum 2006 and MacKenzie
      2011 anomalies are real but rest on contested samples and a shifted binder
      chemistry that Jana’s control still fails to match. Strongest opposing
      consideration remains the Barsoum microstructures if provenance is ever
      secured.
    confidence: moderate
  - claimId: GEO-C021
