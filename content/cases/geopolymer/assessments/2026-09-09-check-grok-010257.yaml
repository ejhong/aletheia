  - claimId: GEO-C030
    verdict: provisionally_supported
    reasoning: XRF and ICP-MS are indeed blind to H, C and O and therefore cannot
      distinguish a cast composite from natural rock sharing the same metallic
      fingerprint; Fóti’s methods table correctly identifies this limit. Jana
      2007’s positive-control petrography shows, however, that binder-aware
      microscopy and SEM-EDS detect casting signatures when present, so the
      critique does not immunize against all analytical methods. Strongest
      opposing consideration is over-extension of the blindness claim beyond
      provenance chemistry.
    confidence: moderate
  - claimId: GEO-C012
    verdict: well_supported
    reasoning: Davidovits demonstration blocks, Barsoum-group
      lime-plus-diatomaceous- earth C–S–H gels, and related room-temperature
      syntheses establish that hard, visually stone-like limestone can be
      reconstituted with materials and temperatures accessible to ancient
      builders. Scale-up and durability under monument loads remain untested in
      the ledger. Strongest opposing consideration is that laboratory
      feasibility is not occurrence in the archaeological record.
    confidence: moderate
  - claimId: GEO-C010
    verdict: provisionally_supported
    reasoning: Charcoal-and-bellows pyrotechnology is known to reach the ~850 °C
      needed for natron-silicate reactions; Badari-period glass is cited as a
      pre-pyramid precedent. Industrial-scale continuous processing is not
      demonstrated. Strongest opposing consideration is the leap from
      crucible-scale heat to the fuel and labour budget of monument casting.
    confidence: low
  - claimId: GEO-C011
