    confidence: high
  - claimId: GEO-C906
    verdict: well_supported
    reasoning: Sessa et al. 2026, citing Klemm & Klemm 2010, state that halite is a
      primary salt in Giza plateau nummulitic limestones within stratigraphic
      layers, likely precipitated from evaporating marine or lagoonal waters
      during formation, and treat Na and Cl as probably inherent matrix
      components. The claim is therefore well anchored second-hand; the
      underlying Klemm & Klemm volume was not read directly in the ledger.
      Strongest opposing consideration is dependence on citation chain until
      GEO-R010 reads the primary geology and unworked quarry faces.
    confidence: moderate
  - claimId: GEO-C594
    verdict: well_supported
    reasoning: Sessa et al. 2026 document that 1995–97 conservation interventions
      inside Khufu (cleaning, cavity fills) lack available documentation, that
      sulfur-rich modern fill appears in XRF at restored areas, and that
      extensive salt efflorescence re-formed after 2022 — a concrete instance at
      the case’s central monument. The general claim that almost no megalithic
      site has a complete published restoration history is a fair methodological
      caution from that pattern plus catalog framing, though only one site is
      evidenced in depth here. Strongest opposing consideration is
      over-generalization from Giza interiors to every surface claim worldwide
      without a full multi-site audit.
    confidence: moderate
  - claimId: GEO-C005
    verdict: weakly_supported
    reasoning: The claim correctly notes that an 18th-Dynasty Rekhmire mural
      conventionally read as metal casting has been argued (by Fóti) to fit
      mineral/waterglass processing better on grounds of scale and apparatus.
      That argument exists; conventional Egyptology has not adopted it and the
      ledger has no residue or tool-kit test either way. Strongest opposing
      consideration is that the standard bronze-casting reading remains the
      unrefuted default without new epigraphic or archaeological discriminants.
    confidence: low
