  synthesis: "The featured hypothesis — that some major megalithic monuments
    contain cast reconstituted stone rather than exclusively carved natural rock
    — splits cleanly across rungs. On mechanism and ingredients, the ledger is
    permissive: industrial natron sources and their medieval decline are well
    documented (GEO-C011); temperatures near 850 °C sit inside known
    charcoal-and-bellows pyrotechnology once glass and metal precedents are
    granted (GEO-C010); and laboratory reconstitution of hard limestone-like
    blocks from processed mineral inputs is chemically feasible under recipes
    the proponents and the Barsoum group have both demonstrated (GEO-C012). None
    of that establishes ancient use. On attribution, the best-tested monument
    fails the claim. Multiple independent or semi-independent petrographic and
    multi-technique studies of Great Pyramid casing and interior limestone —
    Folk & Campbell’s in-situ sedimentary and tectonic features, Harrell &
    Penrod on the Lauer sample, Jana’s side-by-side comparison against a genuine
    Davidovits geopolymer positive control, and Freestone & Middleton on a
    British Museum casing fragment — find natural limestone fabric, shared
    microconstituents with quarry stone, and no alkali-aluminosilicate binder
    signature (GEO-C020). Barsoum 2006 and MacKenzie 2011 remain the strongest
    pro-casting laboratory threads, but sample-provenance disputes, limited
    comparators, and a binder revision from geopolymer to C–S–H gel leave them
    unreplicated on secure material. The salt-line that once propped Giza
    casting collapses under Sessa et al. 2026: surface NaCl is real, yet halite
    is reported as a primary sedimentary constituent of Giza nummulitic
    limestone and as common efflorescence on other Egyptian limestone monuments
    including carved bedrock, so uniqueness fails (GEO-C506, GEO-C906,
    GEO-C907). Al-Ma’mun salt-coat accounts reduce to an uncited proponent
    webpage absent from the principal medieval compilation checked (GEO-C003).
    Pumapunku/Tiwanaku rests on a single proponent team’s SEM/petrography
    reporting organics and anomalous microstructure, with 1971 quarry
    attribution the conventional counter and no independent replication
    (GEO-C004, GEO-C021, GEO-C903). The methodological critique that
    trace-element quarry-matching is blind to H/C/O binder chemistry is correct
    as far as XRF/ICP-MS go (GEO-C030), but Jana’s positive control shows
    binder-aware petrography detects casting signatures when present, so
    provenance-blindness does not neutralize the Giza negatives. Tool-mark and
    rate observations (low pounder removal rates, tourist scoop-mark failures,
    narrow shafts) raise logistics questions for orthodoxy at Aswan but remain
    single-study, anecdotal, or unmeasured, and do not themselves demonstrate
    casting (GEO-C001, GEO-C002, GEO-C006, GEO-C502). Historical
    reinterpretations (Rekhmire) and discovery-pathway anecdotes (fire-pit
    stone) are weak (GEO-C005, GEO-C013). Restoration-history gaps are real and
    properly caution every surface reading (GEO-C594). Net: feasibility is not
    occurrence; where binder-aware tests exist they contradict casting for the
    primary Egyptian case; Andean and other sites stay open only because they
    are under-tested, not because positive evidence is strong. The case is
    therefore mixed — mechanism provisionally live, attribution contradicted
    where rigorously examined and weakly supported elsewhere — not a global
    proof or a global dismissal."
  steelman: Barsoum 2006 SEM/TEM microconstituents and MacKenzie 2011 multinuclear
    NMR still report Si-bearing amorphous or nanocrystalline phases and a
    calcium-silicate gel reading in some pyramid limestone samples that no
    binder-aware study has re-measured on a fully ministry-provenanced,
    chain-of-custody-secure sample set using the revised C–S–H recipe as the
    explicit positive control; until that exact test is done, a proponent can
    fairly say the strongest non-Davidovits laboratory anomalies remain
    incompletely retired rather than explained away by the existing Jana and
    Freestone negatives aimed at the older alkali-geopolymer recipe.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    reasoning: The existence claim requires at least one major monument to be cast.
      Giza casting is contradicted by binder-aware petrography on examined
      casing and interior stone, while Pumapunku rests on unreplicated proponent
      SEM/organics work and Andean/other sites are largely untested in this
      ledger. Feasibility of reconstitution and quarry-match blindness do not
      establish occurrence. Strongest opposing consideration is that absence of
      proof across unfinished sites is not global disproof, so the claim stays
      open rather than contradicted.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Folk & Campbell, Harrell & Penrod, Jana (with a real geopolymer
      positive control), and Freestone & Middleton independently or
      semi-independently report natural sedimentary fabrics, shared
      microconstituents with Tura or Mokattam limestone, and no
      alkali-aluminosilicate binder in Great Pyramid material. Barsoum 2006 and
      MacKenzie 2011 supply the main counter-evidence but suffer contested
      sample provenance, limited quarry comparators, and a chemistry shift to
      C–S–H that Jana did not test. Salt-based support fails once halite is read
      as native or common on Egyptian limestone. Strongest opposing
      consideration remains the unreplicated Barsoum/MacKenzie microstructural
      and NMR anomalies on insecure samples.
    confidence: high
  - claimId: GEO-C021
    verdict: weakly_supported
    reasoning: Support is essentially one proponent team’s 2019 SEM/petrography and
      organics papers plus a 2020 model restatement; the same sample set is not
      independent replication, and custody has been questioned. The 1971
      Bolivian Academy sandstone quarry attribution undermines under
      conventional provenance logic, though GEO-C030 limits how far metallic
      fingerprint matching can go. No independent laboratory confirmation
      appears in the ledger. Strongest opposing consideration is that if the
      reported organics and microstructures survive blind re-analysis on
      documented samples, the claim could rise quickly.
    confidence: low
  - claimId: GEO-C004
    verdict: well_supported
    reasoning: The claim is that published SEM and petrographic analyses report
      organic matter and microstructural features the authors argue are
      inconsistent with natural volcanic stone. Davidovits et al. 2019 Materials
      Letters and Ceramics International do so report. That is distinct from
      whether their interpretation is correct (GEO-C021). Strongest opposing
      consideration is that volcanic rocks can host organics and glassy phases
      naturally and the discriminating criteria were not blind-tested against
      controls by an independent team.
    confidence: high
  - claimId: GEO-C903
    verdict: established
    reasoning: "The claim describes Davidovits’ 2020 model contents: uncrushed Cerro
      Khapia andesite sand stored at Iwawe Stratum V as aggregate, and non-use
      of the piedras cansadas. The GPSA 2020 abstract states exactly that.
      Strongest opposing consideration is that only the abstract was read in the
      ledger, not the full PDF body, but the descriptive match is already
      sufficient for a theory-description claim."
    confidence: high
  - claimId: GEO-C030
    verdict: well_supported
    reasoning: "XRF and ICP-MS are genuinely blind to H, C, and O, so metallic
      quarry-matching cannot by itself separate carved rock from cast stone made
      with aggregate from the same quarry; Fóti’s methods critique and the Nash
      2020 Stonehenge example illustrate the point. Jana 2007 simultaneously
      shows the limit of the claim: binder-aware petrography and a positive
      control do detect casting chemistry when present, so the blindness does
      not extend to all materials methods. Strongest opposing consideration is
      over-extension of the critique to microscopy, NMR, and SEM-EDS, which Fóti
      himself partly exempts."
    confidence: high
  - claimId: GEO-C012
    verdict: provisionally_supported
    reasoning: Geopolymer Institute demonstration blocks and Sierra et al. 2010 lime
      plus diatomaceous earth C–S–H work show reconstituted limestone-like
      material is chemically achievable with ingredients and ambient or modest
      temperatures. Barsoum-group feasibility is real; ancient scale, fuel
      budgets, and exact recipes remain unproven as historical practice.
      Strongest opposing consideration is that modern lab or yard demos do not
      establish that ancient builders produced multi-ton architectural stone
      this way.
    confidence: moderate
  - claimId: GEO-C010
    verdict: provisionally_supported
    reasoning: The ledger’s direct support is thin (Fóti’s Badari glassmaking
      precedent), but the claim aligns with well-known charcoal-and-bellows
      pyrotechnology capable of glass and metal temperatures in the relevant
      range; that calibration is prior knowledge, not a measured ledger result.
      Crucible-scale heat is not the same as industrial mineral processing
      throughput. Strongest opposing consideration is the missing independent
      verification of Badari temperature basis and the scale gap between craft
      heat and monument-scale reagent production.
    confidence: moderate
  - claimId: GEO-C011
    verdict: established
    reasoning: Shortland et al. 2006 document Wadi el Natrun and al-Barnuj as
      primary ancient Egyptian natron sources for the vitreous-materials
      industry, with supply decline and plant-ash replacement in the 7th–9th
      centuries AD; Sayre & Smith 1961 supply the compositional typology behind
      natron-versus-plant-ash timelines. The paper is about glass and faience,
      not stone, but the ingredient-availability claim as stated holds.
      Strongest opposing consideration is that availability for glass does not
      prove diversion into stone-making.
    confidence: high
  - claimId: GEO-C013
    verdict: weakly_supported
    reasoning: Support is a single unattributed fire-pit anecdote in Fóti, flagged
