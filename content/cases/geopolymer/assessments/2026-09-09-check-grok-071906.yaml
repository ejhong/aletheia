  synthesis: "The featured hypothesis — that at least some major megalithic blocks
    were manufactured in place from processed mineral inputs rather than solely
    quarried, carved, and hauled — remains weakly supported as an existence
    claim and is not established for any named monument on the present ledger.
    Attribution splits by site. For the Great Pyramid (GEO-C020), binder-aware
    petrography with natural and positive-control comparators (Folk & Campbell
    in-situ sedimentary and tectonic fabrics; Harrell & Penrod on the Lauer
    specimen; Jana’s side-by-side casing / Tura / Davidovits-geopolymer study;
    Freestone & Middleton multi-technique museum fragment) finds natural
    limestone microstructures, shared opal-CT lepispheres, and no alkali-
    aluminosilicate binder enrichment. Those records outweigh Barsoum 2006’s
    SEM/TEM anomalies and the later MacKenzie NMR suggestion of a C–S–H gel,
    both limited by contested sample provenance, small comparator sets, and lack
    of independent replication on secure material. Salt-based supports
    (GEO-C003, GEO-C506) collapse under Sessa et al. 2026: chamber efflorescence
    is halite, but the same paper and its cited geology treat NaCl as expected
    in Giza nummulitic limestone and document identical efflorescence on the
    carved-bedrock Sphinx and other Egyptian limestone monuments; al-Suyūṭī’s
    compilation of the al-Maʾmūn breach mentions no salt layer, leaving the
    proponent web-page report unanchored. For Pumapunku/Tiwanaku (GEO-C021), the
    only positive materials line is proponent SEM/EDS reporting organic- bearing
    amorphous matter in andesite and anomalous sandstone fabrics. That line is
    severely qualified: the andesite sample PP1 was a loose surface fragment
    outside the protected area chosen by appearance (GEO-C913), no geological
    andesite control was run, nitrogen is only semi-quantitative, and the
    authors cannot distinguish unreacted guano from binder. An interior
    subsample finding (GEO-C918) reduces simple surface-dirt explanations but
    does not repair provenance or controls. Orthodox quarry attribution (Ponce
    1971; later XRF to Khapia) is not decisive against casting-from- aggregate
    (GEO-C030), yet it also supplies no positive casting signature. Mechanism
    and ingredients are in better shape than attribution. Natron supply at
    industrial scale in Egypt is established (Shortland 2006). Room-temperature
    or modest-heat routes to hard artificial limestone (demonstration blocks;
    lime–diatomaceous-earth C–S–H) make GEO-C012 provisionally feasible with
    materials ancient builders could obtain, though pyramid-scale fuel,
    logistics, and quality control remain untested. Charcoal-bellows
    temperatures near 850 °C are archaeologically routine. Accidental fire-pit
    discovery (GEO-C013) is an untested anecdote. Tool-mark observations (slow
    measured pounder rates; failed tourist scoop reproduction; narrow shafts)
    identify real strains on a pure dolerite- pounding orthodoxy at Aswan but do
    not positively identify casting; they are compatible with lost or
    supplemental techniques of many kinds. Methodologically, GEO-C030 correctly
    limits what metallic quarry-matching can rule out, while Jana’s positive
    control shows that binder-aware petrography and SEM-EDS can detect a real
    geopolymer signature when one is present — so provenance-blindness does not
    neutralize the Egyptian negative record. Restoration-history gaps (GEO-C594)
    further discount uncontextualized surface chemistry. Net: feasibility is
    live; the existence claim for major monuments is not carried by secure,
    replicated, binder-positive measurements; the best-studied case (Giza) is
    contradicted on the samples and methods that have been applied. The
    hypothesis survives only as a narrow, unproven remainder (some casing
    recipes other than alkali geopolymer; Andean blocks if provenance-secure
    organics replicate against Khapia controls). That is weak support, not
    parity."
  steelman: MacKenzie et al. 2011 multinuclear NMR on a Bent Pyramid casing stone
    still reports spectra read as Tura limestone grains in an amorphous calcium-
    silicate gel from human-added silica, a binder chemistry outside Jana’s
    alkali-geopolymer positive control and never re-tested blind against a
    broad, stratified natural Tura/Dahshur/Giza suite with aged C–S–H controls;
    if that shoulder is absent from natural stone and present in secure casing,
    the Egyptian negative record has a specific unrebutted hole.
