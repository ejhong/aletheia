    confidence: low
  - claimId: GEO-C506
    verdict: contradicted
    reasoning: "The presence half survives — Sessa et al. confirm halite
      efflorescence in the Queen's Chamber by XRD and SEM-EDX (GEO-E030) — but
      the claim's discriminating content is the comparative clause, and that
      fails: halite efflorescence is documented at the Sphinx, carved from Giza
      bedrock and claimed by nobody as cast, and at rock-cut tombs and other
      Egyptian limestone sites (GEO-E031), while halite is reported as a primary
      sedimentary constituent of the Giza nummulitic limestone itself
      (GEO-E032). The proponents' comparator, European cathedrals (GEO-E026), is
      the wrong lithology and climate. The strongest opposing consideration is
      that GEO-E031 is a qualitative literature summary with no concentration
      comparison, and no one has yet sampled unworked Mokattam quarry faces
      (GEO-R010), so the comparative premise is refuted in kind but not yet
      quantitatively."
    confidence: moderate
  - claimId: GEO-C907
    verdict: well_supported
    reasoning: 'This restates a directly quoted analytical result from an
      open-access, non-proponent conservation study: XRD of seven samples
      confirming only halite, calcite and quartz, with SEM-EDX Na–Cl correlation
      R = 0.969 and no nitrates or widespread gypsum crusts (GEO-E030). The
      source has no stake in the casting question, which strengthens rather than
      weakens it. The strongest opposing consideration is the stated XRD
      detection limit below 5 wt%, which the authors themselves note could hide
      minor sulfate phases — and indeed sulfur enrichment was found at a
      restored patch (GEO-E034), so "no widespread gypsum" is a statement about
      crusts, not about total absence.'
    confidence: high
  - claimId: GEO-C906
    verdict: well_supported
    reasoning: The claim is carefully worded as what Klemm & Klemm are read as
      saying by Sessa et al., and GEO-E032 quotes that reading verbatim,
      including the evaporating marine-or-lagoonal-waters mechanism, alongside
      the authors' own SEM-EDX finding of Na and Cl in unaffected substrate as
      "probably inherent components of the stone matrix". Confidence is capped
      at moderate purely because Klemm & Klemm 2010 and Hemeda & Sonbol 2020 are
      cited second-hand and unread here (GEO-R010). The strongest opposing
      consideration is that "inherent" is inferred from naturally detached
      fragments rather than cored stone, so the depth distribution of halite in
      Giza blocks is still formally untested.
    confidence: moderate
  - claimId: GEO-C594
    verdict: provisionally_supported
    reasoning: 'GEO-E034 gives a concrete, well-documented instance at the
      most-cited monument in the case: 1995–97 interventions inside Khufu whose
      records are unavailable, visible cleaning and cavity-filling inferable
      only from photographs, a sulfur-rich modern fill detected at points
      P27–P28, and efflorescence that re-formed extensively within about two
      years. That directly establishes the inferential hazard the claim asserts.
      What is not established is the universal quantifier "almost no megalithic
      site", which rests on an editorial cross-source note rather than any
      survey (GEO-R005 proposes the audit). The strongest opposing consideration
      is that the claim, taken maximally, could be used to dismiss any surface
      observation whatever, including ones favourable to the mainstream — it is
      a symmetric confound, not a pro-casting argument.'
    confidence: moderate
  - claimId: GEO-C005
    verdict: weakly_supported
    reasoning: "Read literally the claim is modest — such an argument has been made
      — and GEO-E014 shows Fóti making it, so the reporting component is true.
      The substantive component is unsupported: it is a single proponent's
      iconographic reinterpretation, not peer reviewed, with no engagement from
      Egyptology or history of technology, and the Rekhmire scene's conventional
      reading as metalworking is anchored in accompanying inscriptions and a
      large comparative corpus of Egyptian metallurgical iconography. The
      strongest opposing consideration is that unexamined absence of specialist
      rebuttal is not evidence of merit; GEO-R008 exists precisely because
      nobody has yet tested which reading better explains the depicted
      apparatus."
    confidence: low
