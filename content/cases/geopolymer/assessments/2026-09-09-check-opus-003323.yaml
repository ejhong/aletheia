  synthesis: "The case decomposes into three structurally different questions, and
    they do not resolve the same way. (1) Feasibility. That ancient builders
    could reach ~850 °C (GEO-C010), had industrial natron (GEO-C011, backed by
    mainstream work in SRC-SHORTLAND-2006), and that lime/pozzolan and
    alkali-silicate chemistry can bind mineral aggregate into hard blocks
    (GEO-C012, GEO-E022) is either established or highly plausible. But every
    record in this cluster establishes feasibility, not occurrence, and the
    ledger's own editor notes say so. Feasibility carries almost no Bayesian
    weight against direct examination of the stones. (2) The Egyptian
    attribution. Here the discriminating tests have actually been attempted, and
    they come back negative: macro-scale sedimentary and tectonic features in
    situ (GEO-E018), the proponents' own showcase Lauer sample read as natural
    Mokattam limestone (GEO-E019), an independent multi-technique
    museum-fragment analysis (GEO-E021), and — decisively in method terms —
    Jana's comparison against a genuine Davidovits-made geopolymeric limestone
    (GEO-E020), which found the alkali/Al binder signature present in the real
    cast material and absent in casing stones, while the Si-rich lepispheres
    Barsoum highlighted occur in both casing stones and natural limestone. That
    is a positive control, the single most valuable feature in this entire
    literature, and it converts Barsoum's anomalies from evidence into
    non-diagnostic observations. The salt line, historically the most
    rhetorically effective pro-casting argument, collapses in this ledger: the
    al-Maʾmūn salt report has no traceable medieval source (GEO-E027, GEO-E029),
    the date is wrong, halite effloresces on the carved-bedrock Sphinx and other
    Egyptian limestone sites (GEO-E031), and halite is reported as native to the
    Giza strata (GEO-E032). (3) The Andean attribution. This is where the case
    genuinely remains open. The positive SEM/petrographic reports (GEO-E006,
    GEO-E007) are real peer-reviewed results, but they are one team, one sample
    set, no replication, no blind criteria, and no positive control; the
    counterweight is a 1971 provenance study whose force is limited by the
    narrow and correct part of GEO-C030 — quarry matching cannot distinguish
    carved stone from stone cast with aggregate from the same quarry. No
    Jana-equivalent has been run at Pumapunku. Hence \"unresolved\" for the
    case: not a hedge, but the statement that where good tests exist the answer
    is natural stone, and where the hypothesis is still live no good test has
    been run. The research agenda (GEO-R009, GEO-R012, GEO-R004, GEO-R011)
    correctly targets exactly that gap. Steelman for the mainstream: the casting
    hypothesis has had forty-five years and has produced no provenance-secure,
    independently replicated, positive-control-anchored result at any site,
    while its Egyptian branch has been checked and failed. Steelman for
    proponents: the Egyptian negatives concern casing stones and one binder
    chemistry, and the revised C–S–H model (GEO-E017) is untested by them."
  steelman: "No one in this ledger has explained, on the carved account, how
    organic matter comes to sit inside Pumapunku andesite (GEO-E007), nor has
    any independent lab attempted the obvious refutation — a Jana-style
    comparison of monument andesite against Cerro Khapia parent rock with a
    synthetic organo-mineral positive control. The proponents' 2020 model also
    makes a checkable, non-vacuous prediction the orthodox account does not: a
    stored natural andesite sand at Iwawe Stratum V and deliberately unused
    quadrangular piedras cansadas. Until Stratum V is read and Khapia surveyed,
    the Andean branch stands unrebutted rather than refuted, and the MacKenzie
    NMR calcium-silicate-gel reading of a Bent Pyramid casing stone has drawn no
    published counter-analysis at all."
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    reasoning: As an existential claim across all megalithic monuments it cannot be
      closed by negative results at one site, and the Giza negatives
      (GEO-E018–E021) are the only place binder-aware methods with a positive
      control have been applied. The positive side (GEO-E012, GEO-E017,
      GEO-E006/E007) consists of real laboratory observations whose
      diagnosticity is either directly rebutted (lepispheres occur in natural
      limestone) or untested by any independent group. The strongest opposing
      consideration is that after four decades every provenance-secure,
      control-anchored test has returned natural stone, which under any
      reasonable prior should shift the claim toward false rather than merely
      open; I stop short of "contradicted" only because the Andean and
      revised-binder branches have never been tested.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Four independent-to-semi-independent negative analyses converge —
      in-situ sedimentary and tectonic features (GEO-E018), the Lauer sample
      (GEO-E019), a British Museum casing fragment (GEO-E021), and Jana's
      positive-control comparison (GEO-E020) — and they target precisely the
      block classes Barsoum claims. The supporting salt line has failed on every
      check in this ledger (GEO-E027, E029, E031, E032). The strongest opposing
      consideration is that Jana's and Harrell's conclusions about the Lauer
      specimen ride on a genuine, unresolved dispute over which physical object
      was analysed, and that GEO-E017's calcium-silicate binder lies outside the
      alkali-aluminosilicate test Jana ran — so the refutation is of the
      original recipe, not of every possible one.
    confidence: moderate
  - claimId: GEO-C021
    verdict: unresolved
    reasoning: "The only affirmative evidence is two 2019 papers from one team on
      one sample set (GEO-E006, GEO-E007, explicitly non-independent) plus a
      2020 self-citation (GEO-E036); the only direct counter is a 1971
      provenance report (GEO-E008) whose logic is partly blunted by the narrow
      reading of GEO-C030, since both camps now place the andesite's origin at
      Khapia. Nothing here has the structure that decided the Egyptian branch:
      no blind criteria, no positive control, no replication, and contested
      chain of custody. The strongest opposing consideration is that
      unreplicated proponent-authored microscopy is exactly the evidence class
      that failed at Giza when someone finally ran a control, which is a reason
      to expect this to resolve negatively — but expectation is not evidence,
      and the test is undone."
    confidence: moderate
  - claimId: GEO-C004
    verdict: well_supported
    reasoning: The claim is about what published analyses report and what their
      authors argue, and GEO-E006 and GEO-E007 establish exactly that in
      peer-reviewed venues (Materials Letters, Ceramics International). Local
      truth is near-certain; the claim as worded makes no assertion that the
      interpretation is correct. The strongest opposing consideration is that
      readers routinely collapse this claim into GEO-C021, and the two records
      are one line of evidence from one team and sample set, so the
      well-supported verdict here must not be read as corroboration of casting.
    confidence: high
  - claimId: GEO-C903
    verdict: well_supported
    reasoning: "This is a theory-description claim and GEO-E035 quotes the 2020
      abstract directly on all three specifics: uncrushed natural Khapia
      andesite sand, storage at Iwawe Stratum V per Isbell & Burkholder 2002,
      and the statement that the quadrangular blocks were not used. Verification
      is limited to the landing-page abstract (the PDF returned 403), which is
      the only real weakness. The strongest opposing consideration is that an
      abstract may compress or overstate what the body argues, so a body-text
      check could alter details — but not, plausibly, the three quoted
      elements."
    confidence: high
  - claimId: GEO-C030
    verdict: provisionally_supported
    reasoning: "The narrow core is straightforwardly true and needs no citation:
      PXRF and ICP-MS do not measure H, C, or O, and immobile trace-element
      fingerprints would survive crushing and re-binding of the same parent
      rock, so a quarry match alone cannot exclude casting from that quarry's
      material — Nash 2020 (GEO-E009) is compatible with both stories on this
      axis. The claim overreaches by including XRD, which sees mineral phases
      and hydration products and is not blind in the relevant way, and
      GEO-E024's own limitations record notes Fóti's methods table misstates
      NMR. The strongest opposing consideration is GEO-E020: a real cast
      geopolymer's binder was plainly visible to binder-aware SEM-EDS, so the
      blindness argument constrains provenance inference only and gives no cover
      against direct petrography."
    confidence: moderate
  - claimId: GEO-C012
    verdict: provisionally_supported
    reasoning: 'Cement science makes the chemistry unremarkable — lime-pozzolan
      C–S–H forms at room temperature (GEO-E022) and alkali-silicate binders set
      with carbonate aggregate — so I rate this largely on background rather
      than on the ledger, which offers only self-reported demonstration blocks
      (GEO-E013) with no independent analysis. The demanding words are "large"
      and "visually similar to natural stone": nobody in this record has
      independently examined a multi-ton proponent block or shown that a cast
      block passes petrographic inspection as natural. The strongest opposing
      consideration is GEO-E020, which found a real Davidovits geopolymeric
      limestone readily distinguishable from natural limestone in texture and
      binder chemistry — i.e. the visual-similarity component may be false even
      if the making is easy.'
    confidence: low
  - claimId: GEO-C010
    verdict: well_supported
    reasoning: "This rests on background rather than on the ledger: charcoal with
      forced draught routinely reached copper- and bronze-melting temperatures
      well above 850 °C in pharaonic Egypt, and pottery kilns of the period
      operated in that range. The only evidence record offered (GEO-E016) is
      weak and second-hand, citing Badari glassmaking whose dating and
      temperature basis the record itself flags as unverified. The strongest
      opposing consideration is one of scale rather than temperature: crucible-
      or kiln-scale heat says nothing about sustaining 850 °C over the tonnages
      a casting programme would require, and the claim's \"achievable\" wording
      quietly sidesteps that."
    confidence: moderate
  - claimId: GEO-C011
    verdict: well_supported
    reasoning: 'GEO-E010 draws on mainstream peer-reviewed archaeological science
      (SRC-SHORTLAND-2006) that identifies Wadi el Natrun and al-Barnuj as the
      principal ancient natron sources and documents the 7th–9th century decline
      and switch to plant ash; this is uncontroversial and independent of the
      casting debate. The supporting typology (GEO-E011, Sayre & Smith) is
      likewise standard. The strongest opposing consideration is scope, not
      truth: the source concerns glass and faience fluxes, and
      "industrial-scale" for a vitreous-materials industry is orders of
      magnitude below what pyramid-scale stone casting would demand, so the
      claim supports ingredient existence and not ingredient sufficiency.'
    confidence: high
  - claimId: GEO-C013
    verdict: unresolved
    reasoning: The sole evidence is an unattributed anecdote in a proponent book
      (GEO-E015), which the geo project's own skeptical review flagged as
      under-sourced, and no replication has been attempted (GEO-R007 proposes
      one). Ash-carbonation cementation is chemically plausible in principle, so
      I cannot call the claim contradicted, but "hardened artificial stone" is a
      strong outcome that nothing here measures. The strongest opposing
      consideration is that hearths and ash pits are among the most excavated
      features in world archaeology, and accidental lithification of hearth ash
      is not a reported phenomenon in that literature — an absence that counts
      against the claim even without a dedicated test.
    confidence: low
  - claimId: GEO-C001
    verdict: well_supported
    reasoning: GEO-E001 reports a peer-reviewed photogrammetric measurement giving
      216 cm³/h at 85 strikes/min, and the claim states only that this is what
      such measurement yielded — a faithful restatement of a published result.
      Confidence is capped at moderate because it is a single team, single tool
      configuration, single granite, with no replication (GEO-R002 targets
      exactly this). The strongest opposing consideration is that the number is
      not a property of ancient quarrying but of one experimental protocol; a
      skilled, tool-maintaining crew could plausibly exceed it, so the
      measurement's inferential reach toward the casting hypothesis is much
      weaker than its local truth.
    confidence: moderate
  - claimId: GEO-C002
    verdict: weakly_supported
    reasoning: "The claim is only that no success has been documented, and GEO-E003
      is a single proponent's anecdotal report with no attempt count, no
      cumulative-effort figure, and no survey of the test block's wear. A claim
      of the form \"no documented X\" is close to self-fulfilling where nobody
      documents anything, which drains it of evidential force. The strongest
      opposing consideration is GEO-E001: controlled pounding demonstrably
      removes granite at a measurable rate, so casual tourist strikes failing to
      reproduce a scoop mark is the expected outcome under the orthodox account
