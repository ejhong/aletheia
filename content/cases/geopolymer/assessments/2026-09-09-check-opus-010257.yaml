  - claimId: GEO-C506
    verdict: contradicted
    reasoning: The presence half is confirmed — Sessa et al. identify halite by XRD
      and SEM-EDX with a Na–Cl correlation of R = 0.969 — but the claim's
      load-bearing half is comparative, and that half fails. Halite
      efflorescence is documented at the Sphinx, which is carved from Giza
      bedrock and claimed by no one to be cast, and at Saqqara, Lisht and Sohag;
      Klemm & Klemm read halite as a primary sedimentary constituent of the Giza
      nummulitic limestone. The proponents' comparator, European cathedrals, is
      the wrong lithology and climate. The strongest opposing consideration is
      that none of this is a quantitative comparison of concentrations, and
      Sessa's sampling touched only efflorescence and detached fragments, so
      bulk versus surface distribution — the measurement that would actually
      discriminate — remains untested.
    confidence: moderate
  - claimId: GEO-C907
    verdict: well_supported
    reasoning: 'This restates the analytical result of a peer-reviewed open-access
      conservation study directly and accurately, with quoted text and figure
      references: XRD across seven samples returned only halite, calcite and
      quartz, no nitrates, no widespread gypsum crusts. The paper has no stake
      in the casting debate, which strengthens rather than weakens it here. The
      strongest opposing consideration is the stated XRD detection limit below 5
      wt%, so minor phases could be missed — and the same paper records sulfur
      enrichment at a restored area, meaning "no widespread gypsum" is
      compatible with localised modern gypsum-bearing fills.'
    confidence: high
  - claimId: GEO-C906
    verdict: provisionally_supported
    reasoning: The claim is carefully scoped as a report of what Klemm & Klemm say
