      is true as stated. The strongest opposing consideration is one of
      relevance rather than truth: the paper concerns glass and faience and
      makes no claim about stone, so establishing this costs the casting
      hypothesis nothing and buys it nothing."
    confidence: high
  - claimId: GEO-C013
    verdict: unresolved
    reasoning: The only record is an unattributed anecdote in a proponent book,
