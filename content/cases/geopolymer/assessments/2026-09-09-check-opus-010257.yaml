  synthesis: "The case decomposes cleanly into three rungs, and almost all of its
    evidential weight sits on one of them. The mechanism rung is in good shape
    and largely beside the point: natron supply at industrial scale with a
    documented medieval decline is established by mainstream non-proponent work
    (GEO-E010); ~850 °C is unremarkable for charcoal-plus- bellows
    pyrotechnology on general background; lime plus diatomaceous earth
    demonstrably forms a C–S–H binder at room temperature (GEO-E022). None of
    that is evidence of occurrence, and the ledger's own editor notes say so.
    The attribution rung therefore stands or falls on materials analyses of
    monument stone. At Giza the discriminating test has been run repeatedly and
    returns natural: Folk & Campbell report bedding, burrows, sharp
    cross-sections of fragile shells and worm tubes, and calcite-filled tectonic
    fractures confined to individual blocks; Harrell & Penrod find no zeolite
    cement in the proponents' own showcase specimen; Freestone & Middleton find
    opal-CT and no reaggregation texture in an independent museum fragment; and
    Jana runs the only study with a positive control, showing that a genuine
    Davidovits geopolymeric limestone carries Na+K and Al binder enrichment that
    casing stones do not, while the Si-rich lepispheres Barsoum highlighted
    occur in undisputed natural limestone. Diagnosticity, not the observations,
    is what failed for the pro-casting side. Independence structure compounds
    this: the supporting corpus is essentially one network (Davidovits, Barsoum,
    MacKenzie, plus the Institute's self-reported demonstration blocks), while
    at least three mutually independent groups report negatives. The methods
    critique (GEO-C030) is locally sound about PXRF and ICP-MS but is scoped to
    trace-element provenance and does not reach binder-aware petrography —
    Jana's positive control is its direct counterexample. The salt line has
    collapsed: the al-Maʾmūn report has no traceable medieval anchor and is
    absent from the compilation that gathers the principal accounts, while Sessa
    et al. read Giza halite as native to the nummulitic limestone and document
    it at the carved-bedrock Sphinx. Steelmanning the other direction: nobody
    refutes a mixed model by sampling a handful of stones; the Lauer-sample
    authenticity dispute is genuinely unresolved and cuts both ways; Barsoum's
    anomalous Ca–Mg–Si ratios and hydrated phases have never been reproduced on
    provenance-secure samples in either direction; and the Andean branch
    (GEO-C021) rests on proponent-only data with no independent replication and
    no positive-control rebuttal, so it is not closed. Sensitivity: the record
    whose removal most changes the verdict is GEO-E020 (Jana 2007). Without it
    the anti-casting case still rests on three independent studies including
    in-situ macro-scale sedimentary features, so the verdict survives — but
    GEO-C020 would soften from contradicted to mixed, because Jana supplies the
    only measured baseline for what a casting signature actually looks like."
  steelman: MacKenzie et al. 2011 report ²⁹Si/²⁷Al/⁴³Ca MAS NMR on a Bent Pyramid
    casing stone that they read as Tura limestone grains cemented by an
    amorphous calcium-silicate gel, and no published rebuttal of that paper
    exists. Every decisive negative in this ledger — Jana above all — tested for
    an alkali-aluminosilicate geopolymer signature (Na+K, Al enrichment), which
    a lime-pozzolan C–S–H binder would not produce. The revised binder chemistry
    has therefore never faced a positive-control test, and no blinded,
    provenance-secure, C–S–H-aware NMR survey of casing and backing stones has
    been attempted. That prediction is cheap, specific, and outstanding.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    reasoning: The umbrella existence claim needs only one monument to survive,
      which makes it resilient — but the site where the discriminating test has
      actually been run (Giza) returns natural under four studies, three of them
      mutually independent and one with a genuine geopolymer positive control.
      What keeps the claim from being contradicted is that the supporting
      threads with the least rebuttal (MacKenzie's C–S–H NMR at Dahshur, the
      Andean SEM work) have never been directly tested by anyone outside the
      proponent network. The strongest opposing consideration is that after
      forty-five years the pro-casting corpus still contains no replicated,
      provenance-secure, binder-positive result from any monument.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: "Barsoum restricts the claim to casing, backing and summit blocks,
      and those are precisely the stones Jana, Freestone & Middleton, and
      Harrell & Penrod examined with binder-aware methods; all report natural
      limestone, and Jana's positive control shows a real geopolymer binder is
      plainly detectable when present. Folk & Campbell add macro-scale features
      — intact fragile fossils in cross-section, bedding, tectonic fractures
      confined within single blocks — that a cast-block account has never
      explained. The salt-based support for this claim has been removed by Sessa
      et al. and by the failure to trace the al-Maʾmūn report. The strongest
      opposing consideration is real: Barsoum's anomalous Ca–Mg–Si
      microconstituents and hydrated phases were never reproduced or refuted on
      the same samples, and the C–S–H binder variant of the hypothesis lies
      outside the scope of every test above."
    confidence: moderate
  - claimId: GEO-C021
    verdict: weakly_supported
    reasoning: Two peer-reviewed papers report SEM, petrographic and organic-matter
      evidence read as geopolymeric, but they share one team, one sample set and
      contested chain of custody, so they are one line of evidence, not two. The
      only counterweight in the ledger is a 1971 provenance study of the red
      sandstones using pre-modern methods, and provenance cannot discriminate
      here anyway, since both the orthodox account and the proponents' 2020
      model place the andesite's origin at Cerro Khapia. Nothing equivalent to
      Jana's positive control has been run in the Andes. The strongest opposing
      consideration is that volcanic rocks can naturally host glassy and
      organic-bearing phases, and the authors' discriminating criteria have
      never been blind-tested against natural andesite comparators.
    confidence: low
  - claimId: GEO-C004
    verdict: well_supported
    reasoning: "As stated, this is a claim about what published analyses report, and
      GEO-E006 and GEO-E007 establish it directly in two peer-reviewed venues.
      Its truth is nearly definitional and should not be read as support for
      casting: the reports exist, their diagnosticity does not follow. The
      strongest opposing consideration is that the claim's apparent evidential
      weight comes entirely from the authors' own interpretive step
      (\"inconsistent with natural volcanic stone\"), which no independent group
      has tested."
    confidence: high
  - claimId: GEO-C903
    verdict: well_supported
    reasoning: "This is a description of what Davidovits & Davidovits 2020 assert,
      and GEO-E035 quotes the abstract verbatim on all three elements: uncrushed
      Cerro Khapia andesite sand, storage at Iwawe (Isbell & Burkholder Stratum
      V), and the explicit statement that the quadrangular blocks were not used.
      The only caveat is that solely the abstract was read; the PDF body was
      inaccessible. Nothing here bears on whether the model is true — the
      strongest opposing consideration is that a faithfully described model can
      still be wholly unsupported, and the checks that would test it (GEO-R009,
      GEO-R012) are unrun."
    confidence: high
  - claimId: GEO-C030
    verdict: provisionally_supported
    reasoning: "The core physics is correct and not seriously disputed: PXRF and
      ICP-MS cannot see H, C or O, immobile trace-element ratios would survive
      crushing and rebinding of local rock, and an amorphous binder at a few
      weight percent can fall below XRD detection limits. So a quarry match
      genuinely does not by itself exclude casting from that quarry's aggregate.
      The claim overreaches in scope, however, and the ledger itself records
      that the author's methods table wrongly lists NMR as blind to Si — the
      very technique the pro-casting side used. The strongest opposing
      consideration is Jana 2007: with a positive control, binder-aware SEM-EDS
      demonstrably distinguishes a real geopolymer from natural limestone, so
      the blindness argument constrains provenance inference only, not the
      materials-analysis literature that actually carries the anti-casting
      case."
    confidence: moderate
  - claimId: GEO-C012
    verdict: provisionally_supported
    reasoning: "Reconstituting carbonate aggregate with a lime-pozzolan or alkali
      binder is uncontroversial cement science, and Sierra et al. show a C–S–H
      gel forming at room temperature from lime and diatomaceous earth —
      materials plausibly available in Egypt. This verdict leans partly on
      general materials-science background rather than on the ledger's records,
      since the only direct demonstration of large blocks is the proponent
      organisation's self-report with no independent analysis. The strongest
      opposing consideration is the untested part of the claim: \"large\" and
      \"visually similar to natural stone\" at monument scale, with
      ancient-available reagent quantities, has never been demonstrated under
      third-party observation."
    confidence: moderate
  - claimId: GEO-C010
    verdict: well_supported
    reasoning: "Charcoal with forced draught routinely exceeds 850 °C — copper
      smelting and pottery kilns in the region operated at or above that range —
      so the claim is comfortably within known ancient pyrotechnology. This
      verdict rests mainly on that background, because the ledger's only direct
      record is Fóti citing Badari glassmaking, which the project itself flags
      as needing verification. The strongest opposing consideration is the scale
      objection noted in the case file: crucible- or hearth-scale temperature is
      not the same as sustaining that temperature over the tonnages a casting
      programme would require."
    confidence: moderate
  - claimId: GEO-C011
    verdict: well_supported
    reasoning: "Shortland et al. is mainstream, peer-reviewed and uncontroversial on
      exactly these points: Wadi el Natrun and al-Barnuj as the primary sources,
