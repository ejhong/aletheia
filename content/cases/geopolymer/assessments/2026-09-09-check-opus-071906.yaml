      why this is weakly_supported rather than contradicted. The strongest
      opposing consideration is that the two most intensively examined loci —
      Great Pyramid casing and interior stone, and Stonehenge sarsens — both
      return conventional answers under methods that Jana demonstrated can see a
      binder when one is present."
