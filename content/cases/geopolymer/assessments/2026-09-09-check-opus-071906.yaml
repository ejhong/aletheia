  synthesis: "The case has two independent branches and they are in very different
    evidential states. The Egyptian branch is the best tested and comes out
    badly for the hypothesis. Four separate records examine monument stone with
    methods capable of seeing a binder: Folk & Campbell's in-situ and laboratory
    petrography (sedimentary bedding, intact fragile fossils and worm tubes,
    calcite-filled tectonic fractures confined to single blocks, visible tool
    marks, no aggregate-cement fabric), Harrell & Penrod on the proponents' own
    showcase Lauer sample, Freestone & Middleton on an independently held
    British Museum casing fragment, and Jana's comparative study — the only one
    in the exchange carrying a genuine Davidovits-made geopolymer positive
    control, which showed both that a real casting signature (Na+K and Al
    enrichment, smooth matrix with spherical voids) is detectable when present
    and that the Si-rich lepispheres Barsoum highlighted occur in undisputed
    natural Tura limestone. Against that, Barsoum 2006 remains a real set of
    anomalous microconstituents whose diagnosticity, not existence, is disputed,
    and MacKenzie 2011 proposes a different binder (C–S–H, not
    alkali-aluminosilicate) that Jana's alkali-based control does not test. The
    salt line, once a headline argument, has now collapsed from the other
    direction: Sessa et al. identify the chamber efflorescence as halite, read
    it as inherent to Giza nummulitic limestone, and document the same halite at
    the Sphinx and rock-cut tombs, while the al-Ma'mun salt report has no
    traceable medieval source at all. The Andean branch is nearly the mirror
    image: no adversary has ever published a petrographic study of Pumapunku
    andesite, so the proponents' reported interior carbon- and nitrogen-bearing
    amorphous matter stands unrebutted — but it rests on one loose fragment
    chosen by appearance from outside the protected area, analysed by the
    hypothesis's own team, by EDS only, with no natural Khapia control, and the
    authors themselves cannot say whether the material is binder or unreacted
    guano. The methods critique (GEO-C030) is narrowly correct and does real
    work against quarry-matching inferences, but by Fóti's own concession it
    does not touch binder-aware petrography, which is exactly what the negative
    record is made of. Mechanism claims (natron supply, achievable temperatures,
    lime-pozzolan binder feasibility) are largely fine and largely irrelevant:
    feasibility is not occurrence. Sensitivity: the single record whose removal
    would most change the case is GEO-E020 (Jana 2007). Without its positive
    control, Barsoum's anomalies regain diagnostic force and the methods
    critique loses its sharpest counter; my GEO-C020 verdict would soften from
    contradicted to mixed. The case verdict of weakly_supported would survive,
    because GEO-E018, GEO-E019 and GEO-E021 remain, but it would survive with
    materially lower confidence — this thread is load-bearing."
  steelman: "No independent laboratory has ever examined Pumapunku andesite
    adversarially, and the proponents' interior subsample PP1C reportedly shows
    carbon- and nitrogen-bearing amorphous matter lying beneath plagioclase
    crystals — a location that simple modern surface contamination does not
    explain and that no tested natural-andesite mechanism in this ledger
    accounts for. The 1892 Stübel & Uhle observation of amorphous pockets in
    Tiwanaku monument andesite, made by observers with no stake in the
    hypothesis, shows the feature is not an artefact of the proponents'
    sampling. Meanwhile the announced radiocarbon dating of that organic matter
    has never been reported: the one measurement that could decide the Andean
    branch either way remains simply undone, and its absence is a gap in my
    assessment, not evidence against the claim."
