  synthesis: "The thesis (GEO-C022) is existential — at least one monument — so the case verdict cannot be an average across branches, and it must be graded branch by branch. The Egyptian branch (GEO-C020) is the only one tested with binder-aware methods on monument stone, and it is contradicted: GEO-E018 (in-situ sedimentary bedding, burrows, fossil cross-sections and block-confined tectonic fractures across many blocks), GEO-E019 (the proponents' showcase Lauer sample reads as natural Mokattam limestone with no zeolite cement), GEO-E021 (an independent multi-technique study of a museum casing fragment finds natural limestone and opal-CT rather than synthetic cristobalite), and above all GEO-E020, whose genuine Davidovits-made positive control shows that a real alkali-aluminosilicate binder is plainly visible when present — Na+K and Al enrichment, smooth matrix with air voids — and absent from every casing stone examined, while the Si-rich spheres of GEO-E012 occur in natural limestone too. Against these stand GEO-E012 (contested provenance, features later matched in natural stone) and GEO-E017 (one Bent Pyramid casing stone read by NMR as Tura grains in a calcium-silicate gel, Barsoum co-author, no rebuttal). GEO-E017 is the surviving objection: its C–S–H binder is outside the scope of GEO-E020's alkali-specific negative, and GEO-E022 shows the chemistry is feasible. But no record has looked for that binder and found it, so it qualifies the confidence of the negative rather than supplying support. The salt line adds nothing: the medieval report (GEO-C003) is carried only by an uncited proponent page (GEO-E029) and is absent from al-Suyūṭī's compilation of the breach accounts (GEO-E027); the modern salt is confirmed as halite (GEO-E030) but halite effloresces at the carved-bedrock Sphinx and other Egyptian limestone sites (GEO-E031) and is reported, second-hand via Klemm & Klemm, as a primary constituent of Giza limestone (GEO-E032), while undocumented 1990s cleaning leaves every surface observation without a baseline (GEO-E034); GEO-E033 therefore removes the salt as support for GEO-C020 without testing any block. The Andean branch (GEO-C021) is weakly supported: GEO-E006/GEO-E007 are the only records on the monument stone itself and read it as artificial, and nothing in the ledger tests them directly — GEO-E008 is a 1971 provenance study of sandstone set against microscopy of andesite and cannot in principle exclude same-quarry aggregate. They are one team, one sample set, contested custody, never independently rerun, and of exactly the type (SEM microstructure read as artificial) that GEO-E020's positive control found non-diagnostic at Giza. The proponents' 2020 model (GEO-E035) makes the branch checkable at Iwawe and Khapia without touching a monument. The methods critique (GEO-C030, GEO-E024) holds in its narrow form — light-element blindness is real for PXRF and ICP-MS and legitimately limits quarry-match reasoning such as GEO-E009 — but the claim wrongly lists XRD as blind and does not reach direct binder-aware petrography. The Aswan material (GEO-C001, GEO-C002, GEO-C006, GEO-C502) bears on the completeness of the pounding orthodoxy, not on casting. Why unresolved rather than contradicted, mixed or weakly supported: an existential claim is not refuted by one contradicted instance when the other instance has no negative record at all; Egypt-negative and Andes-untested is not an evidential collision; and a single non-independent positive of a type already shown non-diagnostic elsewhere does not move the prior. The decisive test has been run at the wrong site. The single evidence record whose removal would most change the case verdict is GEO-E020: without its positive control the Egyptian record would be two supportive and three negative studies with no demonstration that a casting signature is detectable at all, GEO-C020 would drift back toward mixed, and the proponents' blindness argument (GEO-C030) would stand unanswered against the petrography — moving the case toward mixed. With it, the Egyptian branch is contradicted in the tested recipe, and the case is unresolved only because the C–S–H variant and the Andean stone have never been independently examined."
  steelman: The revised calcium-silicate binder has never been tested for, and the only monument whose stone reads as artificial in the laboratory has never been examined by anyone but its proponents. Every negative Egyptian study was built around Davidovits' alkali-aluminosilicate recipe; the one with a positive control (GEO-E020) used an alkali geopolymer as that control and its author concedes a binder at about 5 wt% might not register in bulk chemistry. GEO-E017 reports solid-state ²⁹Si/²⁷Al/⁴³Ca NMR on a Bent Pyramid casing stone reading as Tura grains cemented by an amorphous calcium-silicate gel, with no published rebuttal; GEO-E022 shows lime plus diatomaceous earth forms exactly such a gel at room temperature from materials plausibly available in Egypt; GEO-E012 reports Si–Ca–Mg ratios absent from all six candidate quarries and hydrated phases not known to hydrate in nature, and those specific ratios have not been reproduced in natural stone by any record here. At Pumapunku, GEO-E006/GEO-E007 report organic matter inside dense andesite in peer-reviewed materials journals, and no independent analysis, blind comparison or dedicated rebuttal exists; GEO-E008 predates the analytical era and concerns a different lithology. Add the proponents' honest scope restriction (casing, tops and backing blocks only, per GEO-E023), the valid narrow form of GEO-C030 (a quarry match cannot see a binder, which at Khapia both sides concede), and the fact that the halite the natron recipe predicts is present (GEO-E030) with no bulk-versus-surface test run, and a proponent can say without error that the negative literature refuted the 1980s recipe and then stopped.
