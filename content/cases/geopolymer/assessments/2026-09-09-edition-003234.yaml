caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks produced on site by binding processed mineral inputs (geopolymer, natron/waterglass, lime-pozzolan, or related chemistry) rather than by carving natural rock alone. The two concrete instances are casing and backing blocks of the Great Pyramid and the andesite and sandstone blocks of Pumapunku/Tiwanaku."
  whereDisagreementLives: "Not over whether anomalies exist — a measured quarrying rate, halite on the pyramid's inner walls, proponent SEM and NMR findings — and not over the salt, which both accounts predict once halite is native to Giza limestone and which fails as a discriminator on the present record. The Egyptian instance is contradicted on the record as tested; the residual disagreement there is whether the negative petrography, built around an alkali recipe, also excludes the calcium-silicate binder the pro-casting side has moved to, and whether the disputed samples were the right physical objects. The live disagreement is Andean: whether the organic matter and microstructures one team reports in Pumapunku andesite would survive an independent, blinded comparison against natural volcanic rock — the same audit that, at Giza, turned claimed casting signatures into ordinary geology — and whether Cerro Khapia yielded dressed blocks or natural sand."
  whatWouldSettleIt: "For the Andes, where the case verdict now turns: a desk check of the Iwawe Stratum V deposit and the piedras cansadas against the excavators' own descriptions; a survey of Cerro Khapia for extraction faces versus natural sand; and independent re-analysis of Pumapunku andesite with a natural andesite control and criteria fixed in advance. For Egypt: an independent laboratory testing provenance-secure casing stone specifically for a calcium-silicate binder against matched Tura limestone; and a blinded paleomagnetic survey of many blocks against a Mokattam natural-limestone remanence baseline, which tests set-in-place versus quarried-and-rotated regardless of recipe. For the salt: XRD of efflorescence on unworked Giza/Mokattam bedrock and Tura quarry faces, which would close the line if positive; and the remaining medieval authors for the al-Maʾmūn report. Either direction is decisive for the specific monument."
  bestConventionalExplanation: "Quarrying, carving, and transport with well-attested means: dolerite pounders and copper tools, fire-setting, ramps, sledges, levers, and large organized labor forces. This is supported by unfinished monuments abandoned mid-carve at quarries, tool marks and tools at extraction sites, worker settlements, experimental carving, and geochemical provenance matching such as Stone 58 to West Woods. Direct petrography of pyramid stone shows sedimentary bedding, fossils, and tectonic fractures that moulds do not produce, and a genuine geopolymer control shows what a binder looks like when present. Salt on interior walls is halite, which effloresces at the carved-bedrock Sphinx and other Egyptian limestone sites and is reported as a primary sedimentary constituent of Giza limestone, mobilised by humidity and visitor-driven condensation. Slow measured pounding rates imply more labour or supplementary techniques, not manufacture. At Pumapunku, the andesite comes from Cerro Khapia as dressed blocks, and the organic and glassy phases reported are natural to volcanic rock. The account's gaps are quantitative, not existential."
