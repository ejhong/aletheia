caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks produced on site by binding processed mineral inputs (geopolymer, natron/waterglass, lime-pozzolan, or organo-mineral chemistry) rather than by carving natural rock alone. The two concrete instances are casing and backing blocks of the Great Pyramid and the andesite and red sandstone blocks of Pumapunku/Tiwanaku."
  whereDisagreementLives: "Not over whether anomalies exist — a measured quarrying rate, halite on the pyramid's inner walls, proponent SEM and NMR findings — and not over the salt, which both accounts predict once halite is native to Giza limestone and which fails as a discriminator on the present record. The Egyptian instance is contradicted on the record as tested; the residual disagreement there is whether the negative petrography, built around an alkali recipe, also excludes the calcium-silicate binder the pro-casting side has moved to, and whether the disputed samples were the right physical objects. The live disagreement is Andean and now has two parts: whether the andesite fragment PP1 — a loose surface find chosen by appearance, never refitted to a block and never compared with natural Khapia andesite — is monument stone at all, and whether the organic and amorphous matter one team reports in it and in the slab No. 2 sandstone would survive an independent, blinded comparison against natural rock, the same audit that at Giza turned claimed casting signatures into ordinary geology; and, at the raw-material end, whether Cerro Khapia yielded dressed blocks or natural sand."
  whatWouldSettleIt: "For the Andes, where the case verdict now turns: establish what PP1 is (permits, photographs, coordinates, attempted refit) and test a fragment with an object number independently against a Khapia andesite control, with criteria fixed in advance; locate or run the radiocarbon date on the andesite organic matter; a desk check of the Iwawe Stratum V deposit and the piedras cansadas against the excavators' own descriptions; a survey of Cerro Khapia for extraction faces versus natural sand; and an independent re-analysis of the slab No. 2 sandstone against a broad Kimsachata/Kallamarka suite. For Egypt: blinded multinuclear NMR of provenance-secure casing stone against a stratified natural Tura/Dahshur/Giza suite with aged C–S–H controls; and a blinded paleomagnetic survey of many blocks against a Mokattam natural-limestone remanence baseline, which tests set-in-place versus quarried-and-rotated regardless of recipe. For the salt: XRD of efflorescence on unworked Giza/Mokattam bedrock and Tura quarry faces, which would close the line if positive; and the remaining medieval authors for the al-Maʾmūn report. Either direction is decisive for the specific monument."
  bestConventionalExplanation: "Quarrying, carving, and transport with well-attested means: dolerite pounders sourced from dykes within the Aswan granitoids and copper tools, fire-setting, ramps, sledges, levers, and large organized labor forces. This is supported by unfinished monuments abandoned mid-carve at quarries, tool marks and tool-production quarries at extraction sites, worker settlements, radiocarbon dates on construction-context organics, experimental carving, and geochemical provenance matching such as Stone 58 to West Woods. Direct petrography of pyramid stone shows sedimentary bedding, fossils, and tectonic fractures that moulds do not produce, and a genuine geopolymer control shows what a binder looks like when present. Salt on interior walls is halite, which effloresces at the carved-bedrock Sphinx and other Egyptian limestone sites and is reported as a primary sedimentary constituent of Giza limestone, mobilised by humidity and visitor-driven condensation. Slow measured pounding rates imply more labour or supplementary techniques, not manufacture. At Pumapunku, the andesite comes from Cerro Khapia as dressed blocks, the sandstone from identified quarries; the amorphous pockets in the andesite are natural volcanic glass already noted in 1892, and the organic matter in a loose fragment lying in the open is contamination or natural infiltration along microcracks — the loose fragment PP1 has no demonstrated connection to any architectural block. The account's gaps are quantitative, not existential."
