    verdict: well_supported
    reasoning: "As a claim about what was published it is straightforwardly true: GEO-E007 reports organic matter in Pumapunku andesite read as a binder residue, and GEO-E058 the interior occurrence. GEO-E006's corrected title shows the companion paper concerns red sandstone (PP4), so only one published paper is about andesite. The credibility of the report is not in doubt; its diagnosticity is: GEO-E057 (loose fragment, no identified block), GEO-E060 (no geological comparator), GEO-E059 (EDS-only, nitrogen semi-quantitative, guano versus binder unresolved), GEO-E061 (amorphous matter recurs in monument andesite since 1892), GEO-E066 (no radiocarbon date located)."
