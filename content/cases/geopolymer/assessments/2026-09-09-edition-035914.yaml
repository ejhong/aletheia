  synthesis: "The thesis (GEO-C022) is existential — at least one monument — so the case cannot be graded by averaging and must be taken branch by branch. The Egyptian branch (GEO-C020) is the only one tested with binder-aware methods on monument stone and it is contradicted: GEO-E018 (in-situ sedimentary bedding, burrows, fossil cross-sections and block-confined tectonic fractures across many blocks), GEO-E019 (the proponents' showcase Lauer sample reads as natural Mokattam limestone with no zeolite cement), GEO-E021 (an independent multi-technique study of a museum casing fragment finds natural limestone and opal-CT rather than synthetic cristobalite), and above all GEO-E020, whose genuine Davidovits-made positive control shows that a real alkali-aluminosilicate binder is plainly visible when present — Na+K and Al enrichment, smooth matrix with air voids — and absent from every casing stone examined, while the Si-rich spheres of GEO-E012 occur in natural limestone too. Against these stand GEO-E012 (contested provenance; features later matched in natural stone) and GEO-E017 (one Bent Pyramid casing stone read by NMR as Tura grains in a calcium-silicate gel; Barsoum co-author; no rebuttal). GEO-E017 is the surviving objection: its C–S–H binder lies outside GEO-E020's alkali-specific negative and GEO-E022 shows the chemistry is feasible, but no record has looked for that binder and found it, so it qualifies the confidence of the negative rather than supplying support. The salt line adds nothing: the medieval report (GEO-C003) is carried only by an uncited proponent page (GEO-E029) and is absent from al-Suyūṭī's compilation of the breach accounts (GEO-E027); the modern salt is confirmed as halite (GEO-E030) but halite effloresces at the carved-bedrock Sphinx and other Egyptian limestone sites (GEO-E031) and is reported, second-hand via Klemm & Klemm, as a primary constituent of Giza limestone (GEO-E032), while undocumented 1990s cleaning leaves every surface observation without a baseline (GEO-E034); GEO-E033 therefore removes the salt as support for GEO-C020 without testing any block. The Andean branch (GEO-C021) is weakly supported, and the ledger now shows exactly how weak. The two 2019 papers are one on red sandstone from slab No. 2 (GEO-E006, sample PP4) and one on andesite (GEO-E007) whose sample PP1 was picked by its flat surface from loose debris outside the protected monument area (GEO-E057), analysed with no natural andesite comparator (GEO-E060), with nitrogen only semi-quantitative and the authors unable to say whether the organic matter is unreacted guano or a binder (GEO-E059). An interior subsample PP1C showing the same carbon- and nitrogen-bearing matter beneath plagioclase (GEO-E058) is the strongest part of the result and makes simple surface dirt an incomplete explanation, but it is the same team and the same fragment, and EDS reads elements, not molecules. The promised radiocarbon date has not been located (GEO-E066); Stübel & Uhle saw amorphous nests in monument andesite in 1892 (GEO-E061), which shows the feature recurs and settles nothing about its nature; surface bubbles and the Protzen quotation (GEO-E062) and the 2020 restatement (GEO-E036) carry no independent weight. The only negative record, GEO-E008, is a 1971 provenance study of sandstone that cannot in principle exclude same-quarry aggregate. So the branch has positive records from one interested team on stone of contested identity and no independent negative: that is weakly_supported, not unresolved and not mixed. The proponents' 2020 model (GEO-E035) makes the branch checkable at Iwawe and Khapia without touching a monument. The methods critique (GEO-C030, GEO-E024) holds in its narrow form — PXRF and ICP-MS are blind to H, C and O, which legitimately limits GEO-E009 and any quarry-match reasoning — but it wrongly lists XRD as blind and does not reach binder-aware petrography. The Aswan material (GEO-E001, GEO-E002, GEO-E003, GEO-E005, GEO-E045) bears on the completeness of the pounding orthodoxy, not on casting. Why the case is unresolved rather than contradicted, mixed or weakly supported: an existential claim is not refuted by one contradicted instance when the other instance has no independent negative record at all; Egypt-negative and Andes-untested is not an evidential collision but a gap; and a single non-independent positive of a type already shown non-diagnostic at Giza does not move the prior. The decisive test has been run at the wrong site. The single evidence record whose removal would most change the case verdict is GEO-E020: without its positive control the Egyptian branch would be two supportive and three negative studies with no demonstration that a casting signature is detectable at all, GEO-C020 would drift toward mixed, GEO-C030 would stand unanswered against the petrography, and the case would move toward mixed. Second is GEO-E058: without the interior occurrence the andesite result would be a surface reading on a loose surface find, and GEO-C021 would fall toward unresolved."
  steelman: The revised calcium-silicate binder has never been tested for, and the only monument whose stone reads as artificial in the laboratory has never been examined by anyone but its proponents. Every negative Egyptian study was built around Davidovits' alkali-aluminosilicate recipe; the one with a positive control (GEO-E020) used an alkali geopolymer as that control and its author concedes a binder at about 5 wt% might not register in bulk chemistry. GEO-E017 reports solid-state ²⁹Si/²⁷Al/⁴³Ca NMR on a Bent Pyramid casing stone reading as Tura grains cemented by an amorphous calcium-silicate gel, with no published rebuttal; GEO-E022 shows lime plus diatomaceous earth forms exactly such a gel at room temperature from materials plausibly available in Egypt; GEO-E012 reports Si–Ca–Mg ratios absent from all six candidate quarries and hydrated phases not known to hydrate in nature, and those specific ratios have not been reproduced in natural stone by any record here. At Pumapunku, GEO-E007 reports organic matter inside dense andesite in a peer-reviewed materials journal; the authors anticipated the surface-contamination objection and cut into the fragment, finding the same carbon- and nitrogen-bearing matter beneath plagioclase crystals in the interior (GEO-E058) — dirt does not lie under feldspar; the guano-trade record (GEO-E063) supplies a documented supply route for the proposed hardener; and no independent analysis, blind comparison or dedicated rebuttal exists, GEO-E008 predating the analytical era and concerning a different lithology. The sandstone paper (GEO-E006) concerns a sample cut from a documented architectural slab, so the branch does not rest on the loose fragment alone. Add the proponents' honest scope restriction in Egypt (casing, tops and backing blocks only, GEO-E023), the valid narrow form of GEO-C030 (a quarry match cannot see a binder, which at Khapia both sides concede), and the fact that the halite the natron recipe predicts is present (GEO-E030) with no bulk-versus-surface test run, and a proponent can say without error that the negative literature refuted the 1980s recipe and then stopped, while the Andean positive has simply never been answered.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    reasoning: Existential thesis graded branch by branch. Egypt is contradicted by GEO-E018, GEO-E019, GEO-E020 and GEO-E021 against GEO-E012 and GEO-E017. The Andes are weakly supported by GEO-E006, GEO-E007 and GEO-E058 from one team, now heavily qualified by GEO-E057, GEO-E059 and GEO-E060, with no independent negative (GEO-E008 is a sandstone provenance study). GEO-E009 undermines only the Stonehenge instance and, per GEO-C030's narrow form, cannot exclude same-quarry aggregate. An existential claim is neither refuted by one contradicted instance nor supported by an untested one; the honest description is a gap, not a collision.
    confidence: moderate
    treatment:
      plainLanguage: Somewhere in the world, at least one great monument is built partly of stone that was made rather than quarried.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself; every other claim is graded by how much it moves this one. The alternatives it competes with are total (all monument stone is natural) and its truth would require only one clean instance.
      strongestObjection: Every time monument stone has been examined directly for a binder by anyone outside the proponent camp it has read as natural, and the one positive laboratory result comes from the proponents on a fragment never shown to be part of the monument and never compared with the rock it supposedly differs from.
      whatWouldChangeOurMind:
        - An independent laboratory reproducing interior organic matter or a binder phase in a provenance-secure Pumapunku fragment against a natural Khapia control, with criteria fixed in advance — toward supported.
        - A calcium-silicate binder found by blinded NMR in provenance-secure casing stone and absent from a broad natural Tura suite — toward supported.
        - PP1's origin remaining undocumented and its features reproduced in natural Khapia andesite, together with the slab No. 2 sandstone matrix reproduced in natural Kimsachata sandstone — toward contradicted.
        - Documented Khapia quarry faces with dressing debris and carved andesite ashlars in transit, with Iwawe Stratum V shown to be tephra or dressing debris — toward contradicted.
