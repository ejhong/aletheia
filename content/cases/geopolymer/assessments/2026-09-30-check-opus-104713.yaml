  synthesis: >-
    The featured hypothesis is existential. It holds if any major megalithic
    monument contains original cast blocks, so it can outlive the failure of its
    flagship. The ledger supplies three kinds of material: an Egyptian branch
    (the Great Pyramid, plus a Bent Pyramid outlier), an Andean branch
    (Pumapunku), and circumstantial lines on ingredients, Aswan tool marks, salt
    and historical texts. Only those records are weighed here. The ledger
    carries little of the conventional quarry and logistics record beyond Kelany
    2009, and this assessment does not supply it.

    The Egyptian flagship (GEO-C020) is the best-tested claim in the case, and
    it fails. Three studies of casing and interior stone find natural limestone:
    Harrell & Penrod, Jana alongside a genuine geopolymeric limestone, and
    Freestone & Middleton working independently (GEO-E019 to GEO-E021). Folk &
    Campbell add field textures that do not depend on binder chemistry, though
    possibly on core blocks that no one now claims were cast (GEO-E018,
    GEO-E023). Jana's positive control also shows that the Si-rich spheres at
    the heart of Barsoum's dataset (GEO-E012) occur in natural Tura stone.

    What survives is a revised calcium-silicate binder. It rests on two things:
    Barsoum's hydrated phases, which no record reproduces in natural stone, and
    MacKenzie's single-sample NMR of a Bent Pyramid casing stone (GEO-E017). The
    binder chemistry has shifted as tests arrived. MacKenzie's 'extra silica'
    reading also faces the natural-variability problem Jana exposed, because
    opal-CT silica is native to Tura limestone (GEO-E020, GEO-E021).

    The circumstantial lines add little. The salt argument has collapsed on
    three counts:

    - The al-Maʾmūn report has no traceable source and is absent where it should
    appear
      (GEO-C003).
    - Halite is native to Giza strata and effloresces on the carved Sphinx
    (GEO-C506,
      GEO-C906).
    - The chambers were cleaned without records (GEO-C594).

    At Aswan, the one quantitative result shows pounding is slow (GEO-C001).
    That argues for supplemental methods, not for casting, and the pounders
    belong to a local quarry industry (GEO-C511). Natron sources and period
    temperatures are real (GEO-C010, GEO-C011), and reconstitution is chemically
    feasible (GEO-C012). These are necessary conditions only; feasibility is not
    occurrence.

    The Andean branch is both the least refuted and the least supported. Its
    positives are proponent-only and come from a loose fragment with no natural
    comparator. The organic matter was identified by EDS alone, and even its
    authors have not resolved the binder mechanism (GEO-C004, GEO-C913,
    GEO-C918, GEO-C580). Its counter-evidence is provenance, which GEO-C030
    correctly neutralizes in its narrow form. But GEO-C030 does not reach
    binder-aware petrography, which Jana showed can detect a real casting
    signature when one is present.

    Steelman for the hypothesis:

    - Two techniques from partly independent laboratories point to an amorphous,
      basic-solution silicate phase in Old Kingdom casing stone, and the only positive
      control never tested for it.
    - Backing and top blocks are unsampled. - Pumapunku's interior organic
    matter is unexplained and undated. - Provenance cannot exclude stone cast
    from quarry aggregate. - The orthodox Aswan account rests on a thin,
    century-old experimental base
      (GEO-C502).

    Steelman against the hypothesis:

    - Every positive in the corpus comes from small, unblinded comparator sets.
    The one
      time a control was used, the flagship anomaly appeared in natural stone.
    - The field textures are indifferent to binder chemistry. - The proponents'
    samples lack provenance. - The circumstantial lines that have been checked
    (salt, the al-Maʾmūn report, the
      pounders' origin) failed. The one that held, a slow pounding rate, does not point
      to casting.

    Verdict: weakly_supported. The flagship is contradicted. The residual
    existential claim rests on uncontrolled, unreplicated positives, and no
    monument has a validated casting signature.

    Sensitivity: the most influential single record is GEO-E020, and the verdict
    does not survive its removal intact. Without it, Barsoum's microconstituents
    would lack their demonstrated natural counterpart, GEO-C020 would move
    toward mixed, and the case would likely rise to mixed. GEO-E018 and GEO-E021
    would still keep the flagship from turning positive. Removing GEO-E017
    instead leaves the verdict standing, but resting almost wholly on
    proponent-only Andean work.

    Where ledger labels conflict with content, I followed the content:
    GEO-E006's sample identity, and the directions of GEO-E027, GEO-E030,
    GEO-E032 and GEO-E064. The tests most likely to move this case are GEO-R017,
    GEO-R016, GEO-R019 and GEO-R010.
  steelman: "The calcium-silicate version of the Egyptian claim has never faced
    the test that defeats the geopolymer version. Barsoum et al. report hydrated
    Ca/Mg phases 'not known to hydrate in nature' and Si:Ca:Mg ratios absent
    from six local limestone sources (GEO-E012). MacKenzie et al.'s multinuclear
    NMR of a Bent Pyramid casing stone yields signals they read as Tura grains
    in an amorphous calcium-silicate gel (GEO-E017). That is two techniques,
    from partly independent laboratories, converging on a basic-solution
    silicate phase. Jana's positive control was an alkali-aluminosilicate
    geopolymer, so its decisive negative (no Na+K/Al binder enrichment) does not
    test a lime–silica binder. No record reproduces the hydrated phases or the
    NMR signal in natural Tura, Dahshur or Giza limestone. No provenance-secure
    casing stone has been examined against an aged C–S–H control (GEO-R017). A
    proponent can rightly say two things: the only controlled refutation tested
    a recipe the pro-casting laboratory evidence no longer proposes, and the
    specific anomalies pointing to the revised binder remain unexplained."
