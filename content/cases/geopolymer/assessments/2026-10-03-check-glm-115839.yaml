  synthesis: "The case divides cleanly by site, and neither side can close it with
    the records on this ledger. For the Great Pyramid, the strongest pro-casting
    dataset (Barsoum 2006, GEO-E012) reports real SEM/TEM microconstituents, but
    it is hedged by its own authors, rests on samples whose provenance Egypt's
    SCA disputed, and has been directly answered by the only study in the entire
    exchange with a positive control: Jana 2007 (GEO-E020) analyzed a genuine
    Davidovits geopolymeric limestone alongside casing stones and showed that a
    real casting signature (Na+K/Al-rich binder, smooth matrix, spherical voids)
    is detectable when present, and absent from the pyramid stones. Folk &
    Campbell, Harrell & Penrod, and Freestone & Middleton independently report
    natural sedimentary textures, tool marks, and no binder. For the
    alkali-aluminosilicate recipe as applied to Khufu limestone, the verdict is
    contradicted, not merely contested. Two escape routes keep the case alive:
    the revised C–S–H binder (MacKenzie 2011) lies outside Jana's test and has
    never been replicated or control-tested, and the Andean branch rests on one
    loose, provenance-insecure fragment (GEO-E057) whose interior C/N-bearing
    amorphous matter (GEO-E058) has never been compared against a single
    geological Khapia andesite control (GEO-E060), with the promised 14C date
    never published. The salt line, once a pillar, has collapsed: Sessa et al.
    2026 documents halite at the Sphinx and other carved Egyptian limestone
    sites and reports Klemm & Klemm's reading of halite as native to Giza
    strata, and the al-Ma'mun salt report traces only to an uncited proponent
    webpage. The methods critique (GEO-C030) is chemically correct for
    trace-element provenance but cannot extend to binder-aware petrography.
    Steelmanning the opposition: conventional archaeology explains every
    quantitative anomaly offered here with at least one live alternative
    (skilled crews vs. Marčiš's rate, local pounder industry vs. exotic import,
    sedimentary halite vs. casting salt), and no decisive binder-aware study on
    provenance-secure samples exists for either the Bent Pyramid NMR result or
    Pumapunku andesite — so the honest verdict is unresolved, with the
    pyramid-geopolymer sub-claim specifically contradicted and the hypothesis as
    a whole neither established nor refuted."
  steelman: "The PP1C subsample's carbon- and nitrogen-bearing amorphous matter
    lies beneath plagioclase crystals inside a Pumapunku andesite fragment — an
    occurrence no record in this ledger explains under the carved account,
    because the proponents' own 2019 study admits no geological andesite was
    ever compared and the announced radiocarbon dating of that interior organic
    matter was never published or located. A proponent can rightly say: the
    single cheapest decisive test (14C on the interior organic matter, or any
    natural Khapia control thin section) has never been run by either side, so
    the strongest surviving observation in the case is unrefuted, not refuted —
    and the same holds for the Bent Pyramid NMR silica resonances, which no
    published study has tested against a stratified natural Tura/Dahshur
    limestone suite."
