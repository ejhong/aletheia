    confidence: low
  - claimId: GEO-C030
    verdict: provisionally_supported
    reasoning: XRF and ICP-MS are elementally blind to H/C/O and commonly calibrated
      to natural rock; Fóti’s methods table and the Stonehenge/Nash example
      illustrate the point (GEO-E024/E009). Jana’s positive-control petrography
      shows binder phases are detectable by other means, so the claim holds only
      for the named quarry-matching techniques. Strongest opposing consideration
      is over-extension beyond XRF/ICP to all materials analysis.
    confidence: moderate
  - claimId: GEO-C012
    verdict: provisionally_supported
    reasoning: Demonstration blocks (GEO-E013) and room-temperature
      lime–diatomaceous-earth C–S–H formation (GEO-E022) establish laboratory
      feasibility with anciently available materials; natron chemistry is
      chemically coherent. No ancient block has been shown to match, and
      scale/fuel questions remain open. Strongest opposing consideration is that
      modern success does not prove ancient practice.
    confidence: moderate
  - claimId: GEO-C010
    verdict: weakly_supported
    reasoning: Fóti cites Badari-period glass and charcoal-bellows practice as
      reaching ~850 °C (GEO-E016). Crucible-scale heat is not industrial kiln
      heat, and independent pyrotechnology verification is absent from the
      ledger. Strongest opposing consideration is the leap from small-batch
      glass to continuous high-volume silicate processing.
    confidence: low
  - claimId: GEO-C011
    verdict: established
    reasoning: Shortland et al. 2006 document Wadi el Natrun and al-Barnuj as
      primary ancient natron sources for vitreous industries, with decline and
      plant-ash replacement in the 7th–9th centuries AD (GEO-E010); Sayre &
      Smith supply the compositional discriminator (GEO-E011). The paper is
      mainstream and uncontroversial on sources. Strongest opposing
      consideration is that the sources are attested for glass/faience, not
      stone, yet availability itself is established.
    confidence: high
  - claimId: GEO-C013
    verdict: unresolved
    reasoning: Only an unattributed fire-pit anecdote in Fóti is offered (GEO-E015);
      the geo project itself flagged it as under-sourced and no controlled
      replication exists. Strongest opposing consideration is total absence of
      experimental confirmation.
    confidence: low
  - claimId: GEO-C001
    verdict: provisionally_supported
    reasoning: Marčiš et al. 2023 photogrammetrically measured 216 cm³/h at 85
      strikes/min and concluded against pounders as sole method (GEO-E001).
      Single-team, single-granite configuration; skilled ancient performance may
      differ. Strongest opposing consideration is lack of independent
      replication and possible technique variance.
    confidence: moderate
  - claimId: GEO-C002
    verdict: weakly_supported
    reasoning: Fóti reports collective tourist failure to reproduce scoop marks with
