  synthesis: "The featured hypothesis (GEO-C022) asserts that at least one major
    megalithic monument contains cast reconstituted stone rather than solely
    carved natural rock. Evidence records supply two primary candidate
    sites—Great Pyramid limestone (GEO-C020) and Pumapunku/Tiwanaku
    andesite-sandstone (GEO-C021)—plus mechanism, methodology, tool-mark, and
    historical observations. On the Egyptian side the sole non-proponent
    laboratory positive is Barsoum et al. 2006 (GEO-E012) reporting Si-Ca-Mg
    microconstituents, hydrated phases unknown in nature, and
    rapid-precipitation textures in some samples; MacKenzie et al. 2011
    (GEO-E017) later read a Bent Pyramid casing as Tura grains in artificial
    C–S–H gel. These are real observations, yet they are opposed by multiple
    independent petrographic and multi-technique studies (Folk & Campbell
    GEO-E018, Harrell & Penrod GEO-E019, Jana GEO-E020 with positive geopolymer
    control, Freestone & Middleton GEO-E021) that recover ordinary sedimentary
    bedding, burrows, tectonic fractures confined to blocks, opal-CT lepispheres
    identical to natural limestone, and no alkali-aluminosilicate or
    aggregate-cement fabric. Jana’s side-by-side control demonstrates that a
    genuine casting binder is detectable when present; its absence in casing
    stones therefore carries weight. Sample-provenance disputes (Supreme Council
    statements, Lauer-sample identity) further dilute Barsoum. Salt observations
    (GEO-C003, GEO-C506) collapse under Sessa et al. 2026: halite is native to
    Giza nummulitic limestone and appears as efflorescence at the carved-bedrock
    Sphinx and other Egyptian sites; the Al-Ma’mun salt-layer report remains an
    uncited secondary claim absent from al-Suyūṭī’s compilation. Tool-mark rates
    (GEO-C001) are low but single-study; tourist scoop failures and shaft
    geometry (GEO-C002, GEO-C006) are anecdotal. Natron sources and temperatures
    (GEO-C011, GEO-C010) are established or plausible, and laboratory
    reconstitution is feasible (GEO-E013, GEO-E022), yet feasibility is not
    occurrence. On the Andean side Davidovits team SEM/EDS reports
    organic/amorphous matter inside andesite (GEO-E006/E007/E058) and
    microstructural features read as geopolymer; an interior subsample reduces
    simple surface-contamination concerns. However the key andesite fragment PP1
    was selected by appearance from loose debris outside the protected area
    (GEO-E057/C913), no geological Khapia comparator was ever run (GEO-E060),
    nitrogen quantification is admitted impossible by EDS (GEO-E059), and 1971
    quarry attribution plus the methods point that metallic fingerprints cannot
    distinguish cast-from-aggregate (GEO-C030) leave the result unanchored.
    Restoration-history gaps (GEO-C594/E034) further qualify every surface
    claim. Cross-cutting, quarry-matching methods are indeed blind to H/C/O
    (GEO-C030 supported), yet binder-aware petrography is not. No record
    supplies a provenance-secure, independently replicated binder signature that
    survives positive-control comparison. The hypothesis therefore remains open:
    mechanism and ingredient availability are not refuted, tool-mark logistics
    remain awkward under pure pounding, and the Andean organics are unexplained
    if natural, yet every concrete attribution is either contradicted by
    stronger petrography, undermined by sample insecurity, or reduced to
    anecdote. The decisive settling study—blinded, controlled petrography or NMR
    on documented monument stone versus matched natural parents and aged binder
    controls—has not been performed. Verdict is unresolved rather than
    weakly_supported because the positive threads do not clear the threshold of
    reliable occurrence, and rather than contradicted because the counters,
    while strong for examined Egyptian samples, do not exhaust all blocks or the
    Andean corpus."
  steelman: Barsoum 2006 microstructures (Si-rich phases and hydrated chemistries
    absent from the six local natural limestones compared) plus the interior
    carbon-nitrogen amorphous matter reported under plagioclase in Pumapunku
    andesite PP1C remain concrete laboratory observations that no counter-study
    has reproduced on the identical specimens or fully explained as ordinary
    diagenesis; a proponent can rightly demand why those specific anomalies
    appear if every block is unmodified quarry stone.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    reasoning: The existence claim requires at least one secure cast monument.
      Pyramid positives (Barsoum GEO-E012, MacKenzie GEO-E017) are opposed by
      stronger multi-author petrography with positive controls (GEO-E018–E021)
      showing natural fabrics and no binder; Andean positives rest on insecure
      loose fragments without natural comparators (GEO-E057/E060). Feasibility
      and methodological blindness (GEO-C012/C030) keep the door open but do not
      establish occurrence. Strongest opposing consideration is the consistent
      failure of binder-aware methods to recover a casting signature on
      provenance-better samples.
    confidence: moderate
  - claimId: GEO-C020
    verdict: contradicted
    reasoning: Barsoum 2006 and MacKenzie 2011 supply the only laboratory support
      for reconstituted casing or backing blocks, yet Folk & Campbell, Harrell &
      Penrod, Jana (with geopolymer positive control), and Freestone & Middleton
      recover bedding, fossils, tectonic veins, opal-CT identical to natural
      limestone, and no alkali or C–S–H binder enrichment. Sample-provenance
      disputes further weaken the positives. Salt and historical lines add
      nothing once Sessa et al. establish native halite. Strongest opposing
      consideration remains possible heterogeneity or unexamined core blocks,
      but examined casing stones are natural.
    confidence: moderate
  - claimId: GEO-C021
    verdict: weakly_supported
    reasoning: Davidovits 2019 SEM/EDS reports organic/amorphous matter and
      mold-like features in Pumapunku andesite and sandstone, with an interior
      subsample (GEO-E058) reducing surface-dirt objections. However PP1 is
      loose debris outside the protected zone (GEO-E057), no Khapia geological
      control was analysed (GEO-E060), nitrogen remains unquantified (GEO-E059),
      and 1971 quarry matching plus C030 leave metallic identity
      non-discriminating. Strongest opposing consideration is that volcanic
      glass and secondary organics occur naturally; without comparator or
      independent replication the reading stays proponent-only.
    confidence: low
  - claimId: GEO-C004
    verdict: weakly_supported
    reasoning: The published SEM/petrographic claims of organic matter and
      non-natural microstructure are accurately recorded from the Davidovits
      papers (GEO-E006/E007/E058). Interior occurrence under crystals is the
      strongest detail. Yet the same sources admit no geological andesite
      comparator, insecure fragment provenance, and inability to identify the
      organic compound or decide guano residue versus binder (GEO-E059/E060).
      Strongest opposing consideration is that the features may be ordinary for
      the parent volcanic rock once controls are run.
    confidence: low
  - claimId: GEO-C913
    verdict: established
    reasoning: The 2019 source itself states that the andesite fragments, including
      PP1, lie outside the protected monument area and were chosen by
      flat-surface appearance from scattered debris (GEO-E057). No contrary
      evidence appears. Strongest opposing consideration is none; the sampling
      description is unambiguous.
    confidence: high
  - claimId: GEO-C918
    verdict: provisionally_supported
    reasoning: The same 2019 report states that interior subsample PP1C, cut from
      PP1, yielded the same C/N-bearing amorphous EDS spectrum beneath
      plagioclase (GEO-E058). This is the authors’ own observation and has not
      been independently repeated. Strongest opposing consideration is that the
      parent fragment’s insecure provenance (C913) and lack of natural control
      still leave open contamination or natural glass.
    confidence: moderate
  - claimId: GEO-C903
    verdict: established
    reasoning: "The 2020 abstract directly states the model: uncrushed Cerro Khapia
      andesite sand stored at Iwawe Stratum V, piedras cansadas unused
      (GEO-E035). The claim is descriptive of the published model, not a test of
      its truth. Strongest opposing consideration is none for the descriptive
