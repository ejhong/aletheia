    confidence: moderate
  - claimId: GEO-C003
    verdict: weakly_supported
    reasoning: The sole carrier is an uncited Geopolymer Institute webpage asserting
      a 1.5 cm salt layer found by al-Ma’mun in 820 (GEO-E004/E029). al-Suyūṭī’s
      compilation of the principal medieval accounts describes the breach in
      detail yet never mentions salt (GEO-E027); the date is also corrected to
      832 (GEO-E028). Strongest opposing consideration is total absence of a
      traceable primary Arabic source.
    confidence: low
  - claimId: GEO-C506
    verdict: contradicted
    reasoning: Sessa et al. 2026 confirm surface halite on Queen’s Chamber stone
      (GEO-E030) yet document the same efflorescence at the carved-bedrock
      Sphinx and multiple other Egyptian limestone monuments (GEO-E031) and cite
      Klemm & Klemm for halite as a primary sedimentary constituent of Giza
      nummulitic limestone (GEO-E032). The uniqueness premise fails. Strongest
      opposing consideration is that bulk-versus-surface distribution remains
      untested by coring.
    confidence: moderate
  - claimId: GEO-C907
    verdict: established
    reasoning: Sessa et al. XRD/SEM-EDX of efflorescence and detached fragments
      identify only halite, calcite and quartz; no nitrates, no widespread
      gypsum (GEO-E030). The analytical result is clear. Strongest opposing
      consideration is detection-limit caveats for minor phases, which the
      authors themselves note.
    confidence: high
  - claimId: GEO-C906
    verdict: provisionally_supported
    reasoning: Sessa et al. report Klemm & Klemm’s description of halite as primary
      in Giza nummulitic limestones, precipitated from evaporating
      marine/lagoonal waters (GEO-E032). The statement is second-hand pending
      direct reading of Klemm & Klemm, yet consistent with the conservation
      paper’s own SEM-EDX inference of inherent NaCl. Strongest opposing
      consideration is reliance on citation rather than primary text.
    confidence: moderate
  - claimId: GEO-C594
    verdict: provisionally_supported
    reasoning: Sessa et al. document that 1995–97 interventions inside Khufu
      (cleaning, cavity filling) lack available records, that sulfur-rich modern
      fills are detectable, and that salt re-formed extensively within ~2 years
      (GEO-E034). The concrete Giza instance supports the general methodological
      warning. Strongest opposing consideration is that one monument does not
      prove the universal claim, yet the pattern is expected.
    confidence: moderate
  - claimId: GEO-C005
    verdict: unresolved
    reasoning: Only Fóti’s interpretive re-reading of the Rekhmire mural as mineral
      rather than metal casting is offered (GEO-E014). Conventional Egyptology
      has not engaged it; no residue or tool prediction has been tested.
      Strongest opposing consideration is that the claim remains pure
      iconographic assertion without external corroboration.
    confidence: low
