  synthesis: "The thesis (GEO-C022) is existential and stays unresolved: one instance is contradicted and the other has never been independently tested. Egypt (GEO-C020) is contradicted. GEO-E018, GEO-E019 and GEO-E021 read pyramid stone as natural limestone. GEO-E020's genuine geopolymer control shows an alkali binder is visible when present and absent from casing stone, and that GEO-E012's Si-rich spheres occur in natural Tura stone. GEO-E017's calcium-silicate reading survives outside GEO-E020's alkali test, but no record has looked for that binder and found it. The salt no longer supports GEO-C020 (GEO-E033). The medieval report (GEO-C003) is uncited (GEO-E029) and absent from al-Suyūṭī (GEO-E027). The modern halite (GEO-C907, GEO-E030) also effloresces on the carved Sphinx (GEO-E031) and is reported native to Giza limestone (GEO-E032, on GEO-C506). Undocumented 1990s cleaning removes any surface baseline (GEO-E034, on GEO-C594). Pumapunku (GEO-C021) is weakly supported. GEO-E006 and GEO-E007 are positive but come from one team. The andesite was a loose surface find (GEO-E057), compared with no natural rock (GEO-E060). The interior occurrence (GEO-E058, on GEO-C004) makes surface dirt an incomplete explanation. The only negative, GEO-E008, is a sandstone provenance study that cannot exclude same-quarry aggregate. The methods critique (GEO-C030) holds for XRF and ICP-MS (GEO-E024) but not against binder-aware petrography (GEO-E020). The Aswan records bear on pounding, not casting. The evidence record whose removal would most change the case verdict is GEO-E020. Without its positive control, the Egyptian branch would drift toward mixed, GEO-C030 would stand unanswered, and the case would move toward mixed."
  steelman: The negative Egyptian literature tested Davidovits' alkali recipe and stopped there. GEO-E020's control was an alkali geopolymer, and its author concedes a binder near 5 wt% might not register in bulk chemistry. GEO-E017 reads a Bent Pyramid casing stone by solid-state NMR as Tura grains in an amorphous calcium-silicate gel, and has drawn no published rebuttal. GEO-E022 shows lime and diatomaceous earth form such a gel at room temperature. GEO-E012's Si–Ca–Mg ratios, absent from six nearby candidate quarries, have not been reproduced in natural stone by any record here. At Pumapunku the proponents anticipated the contamination objection and cut into the fragment. GEO-E058 reports the same carbon- and nitrogen-bearing matter beneath plagioclase crystals, which proponents read as excluding surface dirt. The sandstone result (GEO-E006) comes from a documented architectural slab, not loose debris. No independent laboratory has re-examined either stone. The only negative, GEO-E008, predates modern analysis and concerns provenance, which GEO-C030's narrow point shows cannot see a binder. A proponent can say without error that the answer to the Andean result is absent, not negative.
