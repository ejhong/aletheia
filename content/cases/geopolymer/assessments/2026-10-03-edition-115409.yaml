caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks made by binding processed mineral inputs rather than carved from natural rock. The two instances tested are the Great Pyramid's casing and backing blocks and the andesite and red sandstone of Pumapunku in Bolivia."
  whereDisagreementLives: "The live dispute is at Pumapunku: would one team's organic and glassy findings, in a loose andesite fragment and a sandstone slab, survive independent testing against natural rock? In Egypt every independent study reads the stone as natural. Two questions remain there: whether tests built for an alkali recipe also exclude a lime–silica cement, and whether the disputed samples were the right objects. The pyramid's salt no longer decides anything, because both accounts predict it."
  whatWouldSettleIt: "An independent laboratory should test a documented Pumapunku andesite fragment against natural Khapia andesite, with criteria fixed in advance; that would settle the open branch. Alongside it: establish where the analysed fragment came from, date its organic matter, read the Iwawe excavation report, and survey Cerro Khapia for quarry faces or natural sand. For Egypt: blinded NMR of casing stone against a broad suite of natural limestone, and a magnetic survey of many blocks against natural bedrock."
  bestConventionalExplanation: "The stone was quarried, carved and hauled with attested means: locally quarried dolerite pounders, copper tools, fire-setting, sledges and organised crews. Half-cut monuments in quarries, tool-production quarries and provenance matches such as Stonehenge's Stone 58 to West Woods support this. Pyramid stone shows bedding, fossils and fractures confined to single blocks, which moulds do not make. A real geopolymer control shows what a binder looks like when present. The pyramid's salt is halite, also found on the carved Sphinx and reported native to Giza limestone. Slow measured pounding rates mean more labour or supplementary methods, not manufacture. At Pumapunku the sandstone came from identified quarries and the andesite from Cerro Khapia. Amorphous pockets were noted in 1892 and may be volcanic glass. Organic matter in a loose fragment lying in the open is contamination or infiltration."
