caseAssessment:
  verdict: unresolved
  whatIsClaimed: "At least one major megalithic monument contains man-made cast stone: blocks made by binding processed mineral inputs rather than carved from natural rock. The two instances tested are the Great Pyramid's casing and backing blocks and the andesite and red sandstone of Pumapunku in Bolivia."
  whereDisagreementLives: "The live dispute is at Pumapunku: would one team's organic and glassy findings, in a loose andesite fragment and a sandstone slab, survive independent testing against natural rock? In Egypt every independent study reads the stone as natural. Two questions remain there: whether tests built for an alkali recipe also exclude a lime–silica cement, and whether the disputed samples were the right objects. The pyramid's salt no longer decides anything, because both accounts predict it."
  whatWouldSettleIt: "An independent laboratory testing a documented Pumapunku andesite fragment against natural Khapia andesite, with criteria fixed in advance, would settle the Pumapunku question for that stone. Alongside it: establish where the analysed fragment came from, date its organic matter, read the Iwawe excavation report, and map and date the blocks and suspected quarries on Cerro Khapia. For Egypt: blinded nuclear magnetic resonance of casing stone against a broad suite of natural limestone, and a magnetic survey of many blocks, since stone that set in place would share one field direction."
  bestConventionalExplanation: "The stone was quarried, carved and hauled with attested means: locally quarried dolerite pounders, copper tools, fire-setting, sledges and organised crews. Half-cut monuments in quarries and provenance matches such as Stonehenge's Stone 58 to West Woods support this. Pyramid stone shows bedding, fossils and fractures confined to single blocks, which moulds do not make, and a real geopolymer control shows what a binder looks like when present. The salt is halite, also found on the carved Sphinx. At Tiwanaku, stone flakes reproduced the crisp corners in experiment, raw andesite blocks lie part-divided by pounding, and hewn blocks lie on the routes from Khapia. Organic matter in a loose fragment is contamination or infiltration."
  components:
    - label: The Great Pyramid's casing and backing blocks
      state: contradicted
      note: Four independent microscope studies read the stone as natural, one with a real artificial-stone control. An untested lime–silica cement and a sample-identity dispute remain.
    - label: Pumapunku andesite and sandstone
      state: weakly_supported
      note: The only monument stone that reads as artificial, but from one team, on a loose andesite fragment, with no natural comparison. The conventional record of carving at the site now stands beside it, though it does not touch the analysed stone.
    - label: Ingredients and feasibility
      state: provisionally_supported
      note: Egypt's natron supply is established and artificial limestone can be made; the fire-pit discovery story is one anecdote. Feasibility is not occurrence.
    - label: The pyramid salt
      state: contradicted
      note: The salt is real halite, but it also crusts the carved Sphinx and is reported native to Giza limestone. The medieval salt report has no traceable author.
    - label: Can quarry matching see a binder?
      state: mixed
      note: Correct that trace-element matching cannot see a binder; wrong about diffraction and NMR; silent on direct microscopy, which can.
    - label: Aswan quarrying and tools
      state: mixed
      note: One solid measurement strains a pounding-only timeline; the shaft and visitor reports are unmeasured, and the pounders were quarried locally. None of it evidences casting.
