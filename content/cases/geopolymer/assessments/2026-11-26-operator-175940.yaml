  synthesis: "The thesis (GEO-C022) is existential and stays unresolved: one instance is contradicted and the other has never been independently tested. Egypt (GEO-C020) is contradicted. GEO-E018, GEO-E019 and GEO-E021 read pyramid stone as natural limestone, and GEO-E020's genuine geopolymer control shows an alkali binder is visible when present and absent from casing stone. GEO-E017's calcium-silicate reading survives outside that test, unlooked-for. The salt no longer supports GEO-C020 (GEO-E027, GEO-E029, GEO-E031, GEO-E032, GEO-E033). Pumapunku (GEO-C021) stays weakly supported. GEO-E006 and GEO-E007 are positive but from one team; the andesite was a loose surface find (GEO-E829 on GEO-C913) compared with no natural rock (GEO-E060). The interior occurrence (GEO-E058, GEO-C918) makes surface dirt an incomplete explanation. New against it, all indirect: Nair's stone-tool experiment (GEO-E824, GEO-C921) removes the claim that the crisp corners need casting (GEO-E825), raw andesite blocks at Tiwanaku were being divided by pounding (GEO-E828), and hewn blocks lie on the Khapia routes (GEO-E826, GEO-E827), undated. None examines the analysed stone. The evidence record whose removal would most change the verdict is GEO-E020."
  steelman: The negative Egyptian literature tested Davidovits' alkali recipe and stopped there. GEO-E020's control was an alkali geopolymer, and its author concedes a binder near 5 wt% might not register in bulk chemistry. GEO-E017 reads a Bent Pyramid casing stone by solid-state NMR as Tura grains in an amorphous calcium-silicate gel, and has drawn no published rebuttal. At Pumapunku the proponents anticipated the contamination objection and cut into the fragment; GEO-E058 reports the same carbon- and nitrogen-bearing matter beneath plagioclase crystals. The conventional counter-record is about other stones. Nair's experiment shows the corners could be carved, and says itself that it cannot show they were (GEO-E825). The blocks on the Khapia routes are undated, and the proponents' model already holds that the abandoned blocks were never building material. The part-divided blocks at Tiwanaku are not the H-blocks. No independent laboratory has re-examined the analysed stone, so the answer to the Andean result is absent, not negative.
