id: GEO-001
slug: megalithic-casting
title: "Cast, Not Carved?"
subtitle: "Were some megalithic monuments cast in place from processed mineral inputs rather than carved and transported?"
domain: "Archaeology · Materials science"
status: active
summary: >-
  The megalithic casting hypothesis proposes that some monumental stones — from
  Great Pyramid blocks to the andesite of Pumapunku — were manufactured in place
  from chemically processed mineral inputs, rather than exclusively quarried,
  carved, and transported. The idea has a forty-five-year history, a small body
  of peer-reviewed proponent literature, a mainstream consensus against it, and
  a striking absence of the one study that could settle it.
whatIsClaimed: >-
  At least one major megalithic monument contains man-made cast stone:
  blocks produced on site by binding processed mineral inputs (geopolymer,
  natron/waterglass, lime, or related chemistry) rather than by carving
  natural rock alone.
whereDisagreementLives: >-
  Not over whether anomalies exist — measured quarrying rates, salt reports,
  proponent SEM findings — but over whether any of them survive rigorous,
  independent testing, and whether the provenance methods used to attribute
  monument stone to quarries could even detect casting if it happened, since
  cast stone made from quarry-sourced aggregate would inherit the quarry's
  geochemical signature.
whatWouldSettleIt: >-
  A blinded mineralogical and microstructural comparison of disputed monument
  samples against geologically matched natural stone, scored against
  prespecified cast-stone signatures — combined with primary-source
  verification of the historical anchors. Either result would be decisive
  for specific monuments.
bestConventionalExplanation: >-
  Quarrying, carving, and transport with well-attested means: dolerite pounders
  and copper tools, ramps, sledges, levers, and large organized labor forces.
  This account is supported by unfinished monuments abandoned mid-carve at
  quarries, tool marks and tools recovered at extraction sites, worker
  settlements with administrative records, experimental archaeology
  demonstrations, and geochemical provenance studies matching monument stone
  to specific quarries. It requires no unattested technology — its gaps are
  quantitative (rates, timelines, specific features), not existential.
