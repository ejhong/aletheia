id: GEO-001
slug: megalithic-casting
title: "Cast, Not Carved"
subtitle: "Were some megalithic monuments cast in place from processed mineral inputs rather than carved and transported?"
domain: "Archaeology · Materials science"
status: active
summary: >-
  The megalithic casting hypothesis proposes that some monumental stones — from Great Pyramid blocks to the andesite of Pumapunku — were manufactured in place from chemically processed mineral inputs, rather than exclusively quarried, carved, and transported. The idea has a forty-five-year history, a small body of peer-reviewed proponent literature, a mainstream consensus against it, and a striking absence of the one study that could settle it.
