- id: GEO-C020
  statement: >-
    Some blocks of the Great Pyramid are cast reconstituted limestone rather
    than quarried natural stone.
  plainLanguage: >-
    The Egyptian branch of the thesis, associated with Davidovits since 1979:
    parts of the pyramid (most versions say upper-course or casing blocks)
    were made from limestone slurry or aggregate re-bound with a
    natron/lime-based binder.
  theme: attribution
  rung: attribution
  claimType: existence
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "geo catalog — Davidovits pyramid corpus (T-005..T-019 cluster)"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"
  credibility: mixed
  credibilitySummary: >-
    One peer-reviewed microstructural study (Barsoum 2006) reported features
    its authors read as reconstituted limestone; mainstream petrography
    disputes the interpretation, and no blinded follow-up has been run.
    Historical anchors (the salt-layer account) remain untraced to primary
    sources.
  diagnosticity: high
  diagnosticitySummary: >-
    Directly decides the Egyptian branch of the thesis and would validate
    GEO-C022 by itself.
  parentClaimIds: [GEO-C022]
  dependsOnClaimIds: [GEO-C012]
  strongestObjection: >-
    Petrographic re-examinations attribute the reported anomalies to natural
    limestone variability and to sampling/contamination issues, and quarry
    provenance at Giza is conventionally considered settled.
  whatWouldChangeOurMind:
    - "Blinded comparison of pyramid core/casing samples against Tura and Mokattam quarry stone using prespecified microstructural criteria."
    - "Tracing the Al-Ma'mun salt account to credible primary sources (or showing it is a later embellishment)."

