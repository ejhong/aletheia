- id: GEO-C030
  statement: >-
    Standard geochemical provenance methods attribute stone to a quarry but
    cannot, by design, distinguish carved quarry stone from stone cast using
    aggregate collected at that same quarry.
  plainLanguage: >-
    The methodological hinge of the whole dispute. Provenance studies match
    trace-element fingerprints of monument stone to quarry stone — but
    crushed quarry rock re-bound with a few percent of binder would carry
    the same fingerprint. If true, "provenance settled it" settles less
    than it seems; it is also the escape hatch that keeps the casting
    hypothesis from being falsified by provenance data.
  theme: methodology
  rung: mechanism
  claimType: methodological
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-087"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"
  credibility: mixed
  credibilitySummary: >-
    The logical point is sound for bulk trace-element methods, but binders
    should leave detectable signatures of their own (hydrogen, carbon,
    microstructure), so "cannot by design" may overstate the blindness —
    exactly what a methods re-examination would establish.
  diagnosticity: high
  diagnosticitySummary: >-
    Decides how much weight the strongest conventional evidence class
    (provenance matching) actually carries against casting.
  parentClaimIds: [GEO-C022]
  dependsOnClaimIds: []
  strongestObjection: >-
    Cast stone requires a binder, and binders are physically detectable;
    a methodology that looked for them and found none would refute rather
    than evade the casting reading.
  whatWouldChangeOurMind:
    - "A published re-examination of quarry-attribution studies under cast-stone-aware methodology (geo topic T-087)."

# ── Observation rung ────────────────────────────────────────────────────────

- id: GEO-C001
  statement: >-
    Controlled photogrammetric measurement of granite quarrying with a
    dolerite pounder yields a removal rate of roughly 216 cm³ per hour at
    85 strikes per minute.
  plainLanguage: >-
    The one modern, peer-reviewed number in the tool-rate debate. At that
    pace, the authors conclude, dolerite pounders alone are hard to square
    with the accepted timeline for the Unfinished Obelisk.
  theme: tool-marks
  rung: observation
  claimType: measurement
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-003"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"
  credibility: provisionally_supported
  credibilitySummary: >-
    Peer-reviewed (Marčiš et al. 2023) and quantitative, but a single study
    by a single team; the geo project corrected Fóti's second-hand "36
    months instead of 7" framing to the paper's actual rate figure.
  diagnosticity: moderate
  diagnosticitySummary: >-
    A slow measured rate stresses the orthodox account's timeline but is
    equally consistent with supplemental conventional techniques (fire
    setting, better tooling) as with casting.
  parentClaimIds: [GEO-C022]
  dependsOnClaimIds: []
  strongestObjection: >-
    One team, one protocol, one granite; experienced ancient crews with
    optimized technique could plausibly beat the measured rate.
  whatWouldChangeOurMind:
    - "Independent replication with sensitivity analysis on technique, tool mass, and rock type (geo topic T-003)."

