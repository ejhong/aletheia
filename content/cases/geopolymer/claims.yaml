    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"
  credibility: unresolved
  credibilitySummary: >-
    No disputed monument stone has ever been subjected to a blinded,
    prespecified discriminating test. The proponent evidence is real but
    proponent-generated; the mainstream rejection is broad but has not
    engaged the specific discriminating experiments either.
  diagnosticity: high
