    At least one major megalithic monument contains man-made cast stone —
    blocks produced by binding processed mineral inputs rather than by
    carving natural rock alone.
  plainLanguage: >-
    The headline thesis, stated as a disjunction: the casting hypothesis wins
    if it is true anywhere — one monument, one confirmed cast block. It does
    not require that every megalith was cast.
  theme: attribution
  rung: attribution
  claimType: existence
  importance: headline
  reviewState: ai_extracted
  origin:
