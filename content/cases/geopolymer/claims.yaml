    (c. 820 AD) report interior chamber walls coated with a layer of salt.
  plainLanguage: >-
    The historical anchor of the "salty pyramid" argument. A sealed limestone
    structure growing a centimeter-scale salt coat is easier to explain if
    the stone itself was cast wet with natron than if it is dry quarried
    rock — if the account is real.
  theme: historical-record
  rung: observation
  claimType: historical
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-005"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"
  credibility: unresolved
  credibilitySummary: >-
    The report circulates through proponent literature (Geopolymer Institute,
    Fóti); it has never been traced to primary Arabic sources — which is
    precisely the proposed research project.
  diagnosticity: moderate
  diagnosticitySummary: >-
    If verified in credible primary sources, hard to explain conventionally;
    but salt has mundane candidate sources (mortar efflorescence, groundwater
    wicking), so verification alone would not be decisive.
  parentClaimIds: [GEO-C020]
  dependsOnClaimIds: []
  strongestObjection: >-
    A ninth-century report surviving through later compilations may be
    embellishment or mistranslation; until the primary sources are traced,
    the anchor is hearsay.
  whatWouldChangeOurMind:
    - "Primary-source verification in Al-Maqrīzī, Ibn Khaldūn, Al-Idrīsī and related Arabic accounts (geo topic T-005)."

