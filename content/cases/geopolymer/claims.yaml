# ── Mechanism rung ──────────────────────────────────────────────────────────

- id: GEO-C012
  statement: >-
    Limestone can be reconstituted into large, hard blocks visually similar
    to natural stone using materials and temperatures available to ancient
    builders.
  plainLanguage: >-
    The feasibility keystone: can you actually make convincing artificial
    limestone with Bronze Age inputs? Modern demonstrations (Davidovits'
    multi-ton blocks) say yes at some scale; how faithfully they reproduce
    ancient conditions is debated.
  theme: ingredients
  rung: mechanism
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "geo catalog — Davidovits/Barsoum feasibility line (T-019, T-072 context)"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"
  credibility: provisionally_supported
  credibilitySummary: >-
    Modern geopolymer chemistry is established science, and proponent
    demonstration blocks exist; what is unproven is that the specific
    ancient-feasible recipes produce stone that matches monument blocks
    under close analysis.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Necessary but not sufficient: feasibility opens the door, but attribution
    (GEO-C020/C021) requires signatures found in the monuments themselves.
  parentClaimIds: [GEO-C020]
  dependsOnClaimIds: [GEO-C010, GEO-C011]
  strongestObjection: >-
    Demonstrations use modern knowledge, tools, and quality control; no
    demonstration block has been independently analyzed and compared to
    monument stone under blind conditions.
  whatWouldChangeOurMind:
    - "Independent analytical study of a demonstration block against monument and quarry stone (geo topic T-072)."

