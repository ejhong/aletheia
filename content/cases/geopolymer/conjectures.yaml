# On-the-record editorial conjectures. A conjecture carries no evidential
# weight anywhere on this site: it does not touch any claim's credibility,
# and the evidence ledger is assessed as if this file did not exist. Its
# job is the opposite — to make the site's own editors falsifiable, by
# recording what they believe ahead of the evidence, why, and exactly what
# result they will accept as being wrong.

- id: GEO-J001
  by: "Eugene (ejhong)"
  date: "2026-08-23"
  statement: >-
    Casting of artificial stone was used in the construction of at least
    one major ancient megalithic monument, and the product resembles
    natural stone closely enough that conventional archaeology has
    misclassified it as carved natural rock.
  confidence: >-
    High — stated as founder's intuition, explicitly not derived from the
    evidence ledger, which currently grades the corresponding claim
    (GEO-C022) unresolved.
  rationale: >-
    Intuitive pattern recognition across the assembled record, weighted by
    how many stubborn anomalies one hypothesis dissolves at once. Casting
    explains the precision and irregular interlocking of joints that
    pounding and fitting reproduce poorly. It explains the logistics that
    the carving account leaves heroic: quarries tens of kilometers distant
    (transport aggregate and binder, not monoliths), massive blocks placed
    at high altitude, and constructions too large to have fit through the
    rooms and passages that enclose them. It explains the protruding nubs
    (casting or mold-handling features rather than abandoned lifting
    bosses) and the scoop marks (material removal from a soft or
    unconsolidated state rather than percussion on hard rock). It also
    explains why the question stays invisible: the standard quarry-matching
    toolkit is blind to the chemistry that would distinguish cast from
    natural stone (GEO-C030). One caveat is accepted up front: binder
    discrimination between natural and artificial stone is necessary but
    apparently not easy — the signatures can be subtle and protocols need
    validated sensitivity on known cast controls. It is still the best
    test to focus on, which is why the disconfirmers below are staked on
    it. Recorded as intuition, with the predictions and disconfirmers
    carrying all of the accountability.
  predictedFindings:
    - "Non-geological binder phases at block boundaries or interiors in at least one nominated monument sample."
    - "Hydration, carbonate, or isotopic signatures inconsistent with matched natural rock from the attributed quarry."
    - "Composite microstructure — aggregate-in-matrix textures, air voids, or entrained organic material (fibers, charcoal, plant matter) inside block interiors, absent from quarry controls; organics deep inside an 'igneous' or 'metamorphic' block would be close to dispositive."
    - "Mold-consistent surface or placement features — including nub and scoop-mark morphology — that carving and dressing do not produce."
  disconfirmers:
    - "Preregistered, blinded, binder-aware analyses of the strongest nominated samples repeatedly classify them as natural stone, using protocols with demonstrated sensitivity to known cast controls."
    - "If the best available samples from multiple nominated monuments pass such testing as natural, this conjecture should be marked refuted for those monuments and its scope narrowed or withdrawn — not migrated to ever-less-testable candidates."
  decisiveTestIds: [GEO-R003, GEO-R004]
  status: open
