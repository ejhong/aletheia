- key: text:petrie s 1880 82 survey of the great pyramid recorded salt incrustation on the walls of the queen s chamber and salt exudation on the two lower laps of its niche with none on the upper three laps
  kind: claim
  disposition: failed
  reason: "second reader rejected the anchor (relevant): The quote and paraphrase accurately reflect Petrie's description of salt incrustation and niche exudation patterns, and the locator matches the transcribed section. However, the passage concerns natural salt weathering on limestone walls, not any process of casting or molding megalithic material from processed mineral inputs; the source offers no basis for treating salt residue as evidence of in-situ casting. Thus the observation does not bear on the case question about cast versus carved/transported monuments, and any implied 'supports' direction toward that claim is unwarranted."
