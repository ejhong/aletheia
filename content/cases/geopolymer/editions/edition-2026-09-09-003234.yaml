ate because of the sample-identity dispute and the untested recipe. GEO-C021 — ADOPT weakly_supported (Gemini, GPT, Grok, Opus); HOLD against GLM (unresolved). GEO-E006/E007 are the only records on the monument stone itself and support; GEO-E008 is on a different lithology with pre-modern methods. The incumbent's own synthesis called this 'an untested branch, not a genuine evidential collision', which is inconsistent with 'mixed'. The ledger is not silent, so not unresolved; it is one non-independent line, so weakly_supported at low confidence. GEO-C003 — ADOPT contradicted (Gemini, GPT, Grok, Opus), confidence low. Decided by GEO-E027 (the compilation of the principal medieval accounts describes the breach twice in detail with no salt) together with GEO-E029 (the only carrier cites no author and misdates the event). Unread Arabic sources (GEO-R001) are the route to reversal and are named in whatWouldChangeOurMind. GEO-C506 — ADOPT contradicted (same four seats). Decided by GEO-E031 (halite efflorescence at the carved-bedrock Sphinx and other Egyptian limestone sites) and GEO-E032 (halite reported as a primary constituent of Giza nummulitic limestone). The claim's content is the comparison, and the comparators that matter carry the salt; GEO-E030 confirms presence only, which is not what the claim distinctively asserts. Confidence moderate because no concentration comparison exists (GEO-R010). GEO-C011 — ADOPT established (Gemini, Grok, GLM, Opus): GEO-E010 is a strong mainstream record whose statements the claim closely tracks; GEO-E011 supplies the analytical basis. GEO-C907 — ADOPT established (Gemini, GPT): GEO-E030 quotes the peer-reviewed paper, read in full via PMC, and the claim is scoped to the reported result. GEO-C001 — ADOPT well_supported (Grok, GLM); HOLD against established (Gemini, GPT): a single unreplicated team and configuration (GEO-E001 limitations); GEO-R002 is the replication. GEO-C004 — ADOPT well_supported (GLM, Opus); HOLD against established (Gemini, GPT): the papers' citations were confirmed but the source records show their content was characterised from the Davidovits 2024 bibliography, not read directly. HOLD against Grok (weakly_supported): that grades the interpretation, which lives in GEO-C021; the claim as worded is a report of what was published. GEO-C903 — HOLD well_supported against established (Gemini, GPT, Grok): GEO-E035 is abstract-only, the PDF returned 403, so the model's body was not read. GEO-C906 — HOLD provisionally_supported against Gemini (established) and Opus (well_supported): GEO-E032 is a second-hand citation of Klemm & Klemm, unread, and the 'inherent' inference rests on detached fragments; GEO-R010 is the test. GEO-C594 — HOLD provisionally_supported against Gemini/Grok (well_supported) and GPT (weakly_supported): GEO-E034 is one moderate record at one monument; it establishes the confound at the flagship site but not the general quantifier, which awaits GEO-R005. GEO-C012 — HOLD provisionally_supported against Gemini (well_supported) and GPT (weakly_supported): a real artificial limestone exists in the record (GEO-E020's positive control) and the C–S–H chemistry is demonstrated (GEO-E022), but 'large' and 'ancient inputs only' rest on self-report (GEO-E013). GEO-C010 — HOLD against Gemini/Opus (well_supported) and GPT/Grok (weakly_supported): the ledger alone is one weak proponent record (GEO-E016), which would warrant weakly_supported; the verdict rests on a declared prior about Bronze Age pyrotechnology, stated in the reasoning. Not a split: the two components (ledger, prior) are named and the verdict follows from combining them. GEO-C030 — HOLD mixed against Gemini (contradicted) and GLM (well_supported): the claim bundles a true proposition (PXRF/ICP-MS blind to H/C/O; a quarry match is not a proof of carving — GEO-E024, GEO-E035) with a false one (XRD listed as blind) and an overreach (GEO-E020 shows binder-aware methods see binders). Mixed is the finding, not the default. GEO-C013 — HOLD weakly_supported against Grok/Opus (unresolved): one weak supporting record (GEO-E015), none against; that is weak support, not an undecidable question. GEO-C006 — HOLD weakly_supported against Opus (unresolved): same logic on GEO-E005; the competing proponent reading Opus cites bears on diagnosticity, which is graded low. GEO-C005 — HOLD weakly_supported against GPT/Opus (unresolved): the claim as worded is that an argument has been made (GEO-E014); its merit is where doubt lives, and that is graded through low diagnosticity and low confidence rather than by moving the credibility verdict. GEO-C502 — HOLD weakly_supported against Gemini/Grok/GLM (provisionally_supported): the only carrier is Fóti's characterisation, unverified against the monograph (GEO-E002 limitation), and the source record notes three other Fóti characterisations found inaccurate. SELECTION: the featured set of 20 is unchanged; no unfeatured claim carries evidence. CRUX ORDER: reordered so the Andean checks lead (GEO-R009, GEO-R012) because with the Egyptian branch contradicted the case verdict now turns on Pumapunku, and both are legible without touching a monument; GEO-R011 follows as the recipe-independent Egyptian test. ARTICLE: rewritten to carry the new verdicts — the salt section now states that the medieval report is contradicted on what has been read and that the comparative salt claim fails; the Egypt section concludes 'contradicted' with the C–S–H residue as objection; the Andes section is reframed as the branch the case rests on, with the Giza positive-control precedent as the specific reason for caution; the ladder and closing distinguish the resolved instance from the unresolved thesis."
