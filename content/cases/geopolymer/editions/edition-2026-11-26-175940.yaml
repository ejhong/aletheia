article: |-
  Were some of the world's great stone monuments poured rather than carved? On this account they were mixed from crushed or gathered rock and a mineral binder, and set in place like concrete. The idea has been tested properly in one place and hardly at all in another. At the Great Pyramid, every independent microscope study reads the stone as natural limestone. The one study that also examined a genuine artificial stone found none of its signatures in the monument. There, [the claim that some blocks are cast]{claim=GEO-C020} is contradicted. At Pumapunku in Bolivia, one team reports organic matter inside the andesite that it says natural rock should not hold. Its sample was a loose fragment never tied to any block, and nobody else has looked. So whether [at least one great monument contains cast stone]{claim=GEO-C022} remains open — and most of the tests that would close it are cheap.

  {plate:IMG-GEO-P01}

  At Aswan, beside the largest abandoned obelisk in Egypt, visitors are invited to strike a granite block with one of the rounded dolerite stones ancient workers are thought to have used. According to the proponent literature, [no visitor has ever reproduced one of the smooth scooped depressions that line the quarry walls]{claim=GEO-C002}. Nobody has counted the attempts or examined the block, so the anecdote proves little. But it points at the real question. Nobody serious doubts that Egyptians built the pyramids and Andeans built Tiwanaku. The question is how the hardest stone was worked, and whether some of it was made instead. Casting needs no lost civilisation, only forgotten chemistry, which is why it can be tested.

  ## Four accounts

  In the orthodox account, stone was quarried, carved with stone and copper tools and fire, hauled, and dressed in place. The French chemist Joseph Davidovits proposes two instances of casting. Pyramid casing and backing blocks are limestone re-bound in an alkali 'geopolymer' cement. Pumapunku's andesite was cast from natural volcanic sand with a binder of plant acids and seabird guano. A revision by Michel Barsoum and colleagues at Drexel University makes the pyramid binder a lime-and-silica cement, the chemistry of a mortar. And the researcher Marcell Fóti proposes a natron route: stone etched or bound with waterglass made from natron and heat, with the Aswan pounders and shafts serving as processing tools. Each account predicts something different inside the stone.

  ## The case for carving

  The orthodox account is strong. Unfinished monuments still lie attached to bedrock; the Aswan obelisk was abandoned when its granite cracked. Tools survive in quantity. Geochemistry matches monument stone to quarries. At Stonehenge, fifty of fifty-two sarsens share one chemical profile, and one of them matches the West Woods area about 25 km away. The account's gaps are quantitative. In a few places it needs more time, more hands or better technique than anyone has yet shown, and those places are where this case lives.

  ## Aswan: rates and tools

  The firmest modern number on pounding comes from a 2023 experiment. [Photogrammetry of a dolerite pounder on granite measured about 216 cubic centimetres an hour at 85 strikes a minute]{claim=GEO-C001}. Its authors say that rate tells against pounders as the only quarrying method. That strains the orthodox timeline without favouring moulds: fire-setting, chisels or more labour would absorb the shortfall.

  Nor are the pounders strange. Egyptian antiquities inspectors and a Norwegian geologist surveyed the quarries. They trace the dolerite to dykes in the local granite, and find tool quarries near the obelisk with pounder-sized blanks beside them. That weighs against [Fóti's reading that the pounders were brought in to grind or tamp a casting mix]{claim=GEO-C511}, though nobody has studied what their wear was made on. Then there are [shafts some five metres deep beside the trench, said to be too narrow to swing a pounder at the bottom]{claim=GEO-C006}. Conventionally they are prospecting pits; to Fóti they are settling vessels. Nobody without a stake in the answer has measured them.

  ## Ingredients and pictures

  The natron route starts from a fact nobody disputes. Egypt had [industrial-scale natron deposits, the glassmakers' alkaline flux, worked from antiquity and declining sharply in the seventh to ninth centuries AD]{claim=GEO-C011}. Natron, heat and silica make waterglass, and [the roughly 850 °C needed was within reach of charcoal and bellows]{claim=GEO-C010}. The only support offered is a proponent's appeal to early glassmaking, though ancient metallurgy makes it easy to believe. But the natron studies concern glass, not stone, and heat in a crucible is not industrial processing. The proposed discovery story, that [long-used fire pits accidentally make stone from ash]{claim=GEO-C013}, rests on one unattributed anecdote.

  The firmest point is feasibility: [limestone can be re-formed into large, hard, natural-looking blocks with ancient materials]{claim=GEO-C012}. Davidovits' institute reports multi-ton demonstration blocks, never independently analysed. Separately, lime and diatomaceous earth form a calcium-silicate cement at room temperature. That feasibility is why the case is a question and not a fantasy. It shows only that the thing could be done. It is no evidence that anyone did it.

  {plate:IMG-GEO-P05}

  In the Tomb of Rekhmire, an 18th-Dynasty mural shows rows of crucibles tended by workers with poles. Egyptology reads it as metal casting; Fóti argues [the scale and apparatus fit mineral or waterglass processing better]{claim=GEO-C005}. Egyptologists have not engaged the argument. It would be settled by asking what residues each reading predicts and looking for them.

  ## The salt

  The proponents' favourite historical detail comes from the ninth century. When Caliph al-Maʾmūn's men broke into the Great Pyramid, [they found the chamber walls coated with salt]{claim=GEO-C003}. Salt is odd in dry quarried limestone and expected in stone that set wet with natron.

  The principal Arabic accounts, gathered by al-Suyūṭī in the fifteenth century, tell the story of the breach twice and in detail: fire and vinegar, a wall twenty cubits thick, a granite basin holding 'nothing but worn out pieces of rope'. They never mention salt. The web page carrying the salt report names no medieval author and misdates the entry. Other medieval authors remain unread, and one passage in them would revive the story.

  The modern argument rests on Davidovits' own report of licking fragments of Cheops stone and finding them salty, an uncontrolled test by one man. He argues that if the salt came from ancient seas, [the pyramid would not be unusual: Europe's limestone cathedrals would be crusted too]{claim=GEO-C506}. The salt is real: a 2026 peer-reviewed conservation study of the chambers found [the white crust in the Queen's Chamber and a nearby corridor to be halite — common salt — with only calcite and quartz beside it]{claim=GEO-C907}. But cathedrals are the wrong comparison. The same paper records halite crusts at other Egyptian limestone sites, including the Sphinx, carved from Giza bedrock. It also cites a geological study describing [halite as native to the plateau's limestone, laid down from evaporating seawater]{claim=GEO-C906}, a statement known here only through that citation. So the claim that the pyramid carries salt that comparable natural limestone lacks fails. Both accounts predict salt in the blocks, so salt cannot choose between them.

  Surfaces are unreliable witnesses anyway, because [almost no megalithic site has a complete published restoration history]{claim=GEO-C594}. At Giza the point is documented: cleaning and patching inside the pyramid in 1995–97 went unrecorded, and salt barely visible in 2022 had spread widely two years later.

  ## Egypt: inside the stone

  {plate:IMG-GEO-P03}

  The pyramid claim covers casing, top and backing blocks, not the core. Two laboratory results favour it. In 2006 the Drexel group reported phases combining silicon, calcium and magnesium 'in ratios that do not exist in any of the potential limestone sources'. It conceded that nature 'could have — however unlikely' produced them. In 2011 an overlapping team examined a casing stone from the Bent Pyramid, an earlier pyramid at Dahshur. It used nuclear magnetic resonance, which reads how silicon, aluminium and calcium atoms are bonded. It read the stone as Tura limestone grains in a calcium-silicate gel 'formed by human intervention'.

  Against them stand four examinations under the petrographic microscope, the geologist's basic tool, all finding natural limestone. Folk and Campbell saw bedding, burrows, fragile worm tubes and fractures confined to single blocks — things geology makes and moulds do not. Harrell and Penrod found the proponents' showcase 'Lauer sample' to be local limestone with no zeolite cement. Freestone and Middleton examined a British Museum casing fragment, and the cristobalite once called synthetic proved to be an ordinary sedimentary mineral. Jana examined casing stones beside natural Tura limestone and beside a genuine artificial geopolymer made by Davidovits. That last sample is the key. It showed what a binder looks like when it really is there, and the pyramid stone looked nothing like it. The 2006 silicon-rich spheres turned up in the natural stone too. The geopolymer's binder, rich in sodium, potassium and aluminium, appeared in no casing stone.

  On that record the pyramid claim is contradicted. Two objections remain. Davidovits disputes that his critics had the authentic Lauer sample, and Egypt's antiquities authority says the 2006 samples were taken without permission. And Jana's negative applies to the alkali recipe. Nobody has looked for the 2011 calcium-silicate cement, which at a few per cent might hide from bulk chemistry. That is an objection to the verdict, not evidence for casting.

  ## Pumapunku: the open question

  {plate:IMG-GEO-P04}

  Here is the only laboratory evidence from a disputed monument that reads as artificial. Two 2019 papers by the Davidovits group [report organic matter and microstructures in Pumapunku stone that the authors argue natural rock should not contain]{claim=GEO-C004}. On that basis [some andesite and red sandstone blocks there are held to be cast]{claim=GEO-C021}. No independent laboratory has re-examined the stone, so the claim is weakly supported: the only direct evidence points toward casting, and it comes from one interested team.

  What was analysed matters. The sandstone came from a documented slab. The andesite, by the authors' own account, [was picked by its flat surface from loose fragments lying outside the protected monument area]{claim=GEO-C913}, not cut from any identified block. The obvious reply is that organic matter in a stone lying in the open is dirt. Expecting this, the team cut into the fragment and [report the same carbon- and nitrogen-bearing matter in the interior, beneath feldspar crystals]{claim=GEO-C918}. That is the strongest part of the result, because surface dirt alone no longer explains it. But it is the same team and the same fragment, and their instrument reads elements, not molecules.

  The authors make three admissions. Nitrogen could not be measured properly, and they cannot tell leftover guano from binder. That leaves [the proposed chemistry of plant acids and a guano hardener]{claim=GEO-C580} asserted: its reported laboratory replication comes without data and used modern chemicals. They compared the monument andesite with no natural andesite at all. And amorphous pockets in Tiwanaku andesite were noted in 1892 by travellers with no stake in the matter, which shows the feature recurs but not whether it is organic or volcanic glass. A radiocarbon date on the organic matter, promised in 2019, has not appeared. At Giza, features read as artificial turned up in natural stone once someone checked. Nobody has run that check here.

  ## How Tiwanaku stone was worked

  Popular accounts point to the H-blocks' crisp inside corners as something stone tools could not make. Jean-Pierre Protzen and Stella Nair, whose 2013 monograph records the site's stonework in detail, tested that. Working with stone tools alone on a volcanic rock close to Tiwanaku andesite, [Nair cut a copy of a Tiwanaku cross motif with its precision, right angles and sharp inner and outer corners]{claim=GEO-C921}. Three of its five walls took about forty hours. One thing she could not match was the perfect flatness of the small inner faces. The authors add the caution themselves: an experiment shows a method was possible, never that it was used.

  The site keeps its own record of working. [Several large raw andesite blocks at Tiwanaku were left part-way through being split, covered in the pits and hollows that pounding leaves]{claim=GEO-C923}. And on the far side of the lake, [dozens of rough and part-shaped andesite blocks lie along tracks from Cerro Khapia down to the shore]{claim=GEO-C922}, as nineteenth-century travellers described and Protzen and Nair confirmed; large andesite blocks lie on the opposite shore. Near one track they found what was most likely a quarry, its traces almost erased, with extracted blocks still waiting.

  None of this reaches the stone the proponents analysed. A site can hold both carved and cast blocks, and nothing on Khapia is dated. The proponents' current model already answers the route blocks. On it, [the andesite was cast from natural, uncrushed volcanic sand from Cerro Khapia, stockpiled at the lakeshore village of Iwawe, and the abandoned 'tired stones' were never building material]{claim=GEO-C903}. That makes the ground a test. If the blocks and the suspected quarry date to Tiwanaku's building period, andesite left the mountain as stone, not sand. The excavators' own description of the Iwawe deposit is a second check. The older counter-evidence, a 1971 Bolivian study tracing the sandstones to natural quarries, cannot decide it, for a reason the next section explains.

  ## Can a quarry match see a binder?

  {plate:IMG-GEO-P02}

  The casting side's broadest reply to provenance work is that [standard quarry-matching methods cannot see hydrogen, carbon or oxygen, and so cannot tell carved quarry stone from stone cast with aggregate from that quarry]{claim=GEO-C030}. For X-ray fluorescence and mass spectrometry that is correct. Crushed rock keeps its metal fingerprint, so a quarry match is not proof of carving. But the reply reaches less far than claimed. It lists X-ray diffraction as blind, yet diffraction reads crystalline phases and is how critics looked for zeolite cement. It lists nuclear magnetic resonance as blind to silicon, which is exactly what the pro-casting 2011 study measured. Above all, it does not touch direct microscopy. Cast stone needs a binder, binders leave signatures, and the Egyptian comparison with a real geopolymer shows those signatures are visible when present.

  ## What would change our mind

  The strongest case for casting that this record does not answer runs as follows. The negative Egyptian studies were built around the alkali recipe, and the calcium-silicate cement has never been looked for. The one monument whose stone reads as artificial has been examined only by its proponents, and they found the organic matter inside the stone, under its crystals. The conventional record at Tiwanaku shows how stone could be and was worked, not how that stone was made.

  The strongest case against is equally plain. Every time anyone outside the proponent camp has examined monument stone, it has read as natural, down to fossil worm tubes. The Andean fragment that reads otherwise was picked up off the ground by its looks and never compared with the rock it supposedly differs from, at a site where andesite was being split by pounding.

  Toward casting:
  - a documented refit of the analysed andesite fragment to a catalogued block, or an independent laboratory finding the same interior matter in a catalogued fragment, tested against natural Khapia andesite;
  - a radiocarbon date near AD 600 on that matter;
  - a blinded test finding a calcium-silicate cement in securely sourced casing stone that a broad suite of natural limestone lacks;
  - a magnetic survey of many pyramid blocks, measured against natural Giza limestone, in which the blocks share one field direction. Stone that hardened where it sits would record Earth's field the same way in every block, while blocks cut elsewhere and laid in any orientation would disagree with each other;
  - the Khapia blocks dated after Tiwanaku, no quarry confirmed there, and the Iwawe deposit a natural sand store of the building period.

  Toward carving:
  - the fragment's origin staying undocumented while its features turn up in ordinary Khapia andesite;
  - a modern radiocarbon date;
  - the sandstone's unusual matrix reproduced in natural regional sandstone;
  - a targeted search for the cement in casing stone finding nothing;
  - halite growing on unworked Giza bedrock;
  - the Khapia quarry and route blocks dated to Tiwanaku's building period, or the Iwawe deposit turning out to be chips from shaping blocks.

  ## Where it stands

  The headline claim is existential: it needs only one monument, so it cannot be settled by averaging. Egypt, tested with methods that can see a binder, came out against. Pumapunku's stone has been examined by one team, on a fragment of uncertain standing, while the site's builders left plain evidence of carving andesite. An existential claim is neither refuted by one failed instance nor supported by an untested one, and the decisive test has so far been run at the wrong site. Much of what would close the question is cheap. Ask where the andesite fragment came from, and test one with a catalogue number instead. Read the Iwawe excavation report. Date the blocks on Khapia's tracks. The scoop marks at Aswan, meanwhile, still wait for someone to measure them properly.
