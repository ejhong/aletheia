rationale: |-
  This edition brings the conventional side of the Pumapunku question into the case. The Pumapunku branch is the only live instance of the thesis, and until now its telling set one team's laboratory results against almost nothing from the people who study how Tiwanaku was built. Jean-Pierre Protzen and Stella Nair's 2013 monograph, The Stones of Tiahuanaco, is open on eScholarship and was read in full this session. Three things in it bear on the case. First, Nair's stone-tool experiment reproduced the precise right angles and sharp inside corners that popular accounts call impossible without casting, though not the perfect flatness of the inner faces, and the authors say outright that an experiment shows possibility, not use. Second, the book records andesite blocks being divided by pounding at Tiwanaku itself. Third, it records dozens of raw and part-hewn andesite blocks on routes from Cerro Khapia to the lake, and a probable quarry, all undated. None of this examines the stone the proponents analysed, so the Pumapunku verdict holds at weakly supported. The article now says what each side's record does and does not reach.

  The panel split on the two sampling claims, GEO-C913 and GEO-C918. Every seat graded them established or well supported from the records that state them, while the draft held them provisional because no record named them. The records now name them, and the draft grades both well supported, within one step of every seat.

