- id: GEO-E032
  title: Halite reported as a primary sedimentary constituent of Giza nummulitic limestone (Klemm & Klemm, as cited by Sessa et al.)
  claimIds:
    - GEO-C506
    - GEO-C906
  sourceId: SRC-SESSA-2026
  direction: undermines
  strength: moderate
  sourceStatement: SEM-EDX of naturally detached material from visually unaffected areas of the substrate (S1–S3) found Na and Cl among the elements present, which the authors say indicates these "are probably inherent components of the stone matrix". They report Hemeda & Sonbol's composition of Khufu backing blocks (calcite with minor iron oxides, quartz, dolomite, opaques and halite) and state that Klemm & Klemm describe halite as the primary salt in the nummulitic limestones of the Giza plateau, its presence within the stratigraphic layers suggesting it is part of the original sedimentary environment, "likely precipitated from evaporating marine or lagoonal waters" during rock formation.
  editorInference: "Editor's inference: if halite is native to the strata conventionally identified as the pyramid's source rock, then salt on the blocks is expected under the carved account and GEO-C506's comparative premise fails; the proponent page's dismissal of exactly this reading (GEO-E603) is met here by a stated geological mechanism. The decisive check remains GEO-R010 — halite in unworked Giza/Mokattam bedrock and quarry faces — and Klemm & Klemm 2010 should be read directly. Note that both the proponents and this reading predict NaCl in the blocks; the salt does not discriminate between them."
  exactLocator: "Section 'Samples investigation: SEM-EDX and XRD analysis', first paragraph — via open-access copy PMC13087131"
  limitations:
    - Klemm & Klemm 2010 and Hemeda & Sonbol 2020 are cited, not read; the halite-in-strata statement is second-hand.
    - "'Inherent components' is the authors' inference from detached fragments, not from cored stone."
    - Standardless SEM-EDX quantification with ZAF corrections; semi-quantitative.
    - "Second reader (claude-sonnet-5, 2026-09-08) disputes the stated direction: The quoted spans ('inherent components of the stone matrix' and 'likely precipitated from evaporating marine or lagoonal waters') appear verbatim in the cited section and are used consistently with their original meaning, attributed correctly to Klemm & Klemm as reported by Sessa et al. The sourceStatement is an accurate, appropriately hedged summary of that paragraph, and the locator matches. Limitations flag that Klemm & Klemm and Hemeda & Sonbol are secondhand citations, satisfying independence disclosure. However, while 'undermines' is plausible for GEO-C506 (natural inherent Na/Cl cuts against an anomalous-surface-NaCl reading), it is wrong for GEO-C906, which the passage essentially restates and thus supports rather than undermines; this is noted as dissent rather than grounds for rejection."
