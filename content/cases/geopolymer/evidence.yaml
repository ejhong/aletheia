- id: GEO-E009
  title: "Stonehenge sarsen provenance: Stone 58 matches West Woods"
  claimIds: [GEO-C022, GEO-C030]
  sourceId: SRC-NASH-2020
  direction: undermines
  strength: moderate
  sourceStatement: >-
    Immobile-trace-element analysis found that 50 of 52 Stonehenge sarsens
    share a uniform geochemical profile, and Stone 58's signature directly
    matches the West Woods area — identifying the probable source region.
  editorInference: >-
    For Stonehenge, provenance evidence fits conventional sourcing well.
    Proponents respond that bulk trace-element methods would give the same
    result for stone cast from West Woods aggregate — but that response
    (GEO-C030) is itself an untested methodological claim. Note: the geo
    project corrected Fóti's "only a statistical correlation" framing;
    the published match is stronger than he presents.
  limitations:
    - "Bears directly on Stonehenge sarsens, not on the Egyptian or Andean claims."
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-075 / verified-citations batch"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"

- id: GEO-E010
  title: "Documented natron sources and their medieval decline"
  claimIds: [GEO-C011]
  sourceId: SRC-SHORTLAND-2006
  direction: supports
  strength: strong
  sourceStatement: >-
    Wadi el Natrun and al-Barnuj are identified as the primary ancient
    Egyptian natron sources for the vitreous-materials industry, with a
    documented decline and replacement by plant ash in the 7th–9th
    centuries AD.
  editorInference: >-
    Establishes ingredient availability at scale and a documented supply
    discontinuity — the kind of discontinuity a lost-craft narrative needs,
    though the paper itself makes no claim about stone.
  limitations:
    - "The paper concerns glass and faience; it says nothing about stone-making."
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-012 / T-060"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"

