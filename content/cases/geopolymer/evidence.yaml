  sourceStatement: >-
    Pyramid and temple blocks show sedimentary bedding, burrows, sharp
    cross-sections of clams and fragile worm tubes, ripple lamination,
    optical and SEM-scale properties of normal microporous limestone, and
    calcite-filled tectonic fractures confined to individual blocks;
    quarrymen's tool marks are evident; and no zeolitic "geopolymer" phase
    was observed by light microscopy or detected by XRD, DTA, SEM, EDXA,
    or chemical analysis in the sample examined, nor any aggregate-cement
    fabric (findings set out in Concrete International 13(8), 1991, and
    the Journal of Geological Education 40(1), 1992).
  editorInference: >-
    Macro-scale sedimentary and structural features observed across many
