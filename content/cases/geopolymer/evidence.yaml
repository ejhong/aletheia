  sourceStatement: "The compilation gives the caliph's opening of the pyramid twice. In the first entry (Isis p. 24, attributed by Nemoy's n.6 to al-Masʿūdī via al-Maqrīzī) the workers kindled fire, applied vinegar, tempered iron tools and used catapults; the Pyramid was opened \"and they found its wall to be twenty cubits thick\"; behind the breach they found a chrysolite jar of a thousand dinars, a square well with four doors to chambers of shrouded corpses, and at the top a chamber with a stone sarcophagus holding a malachite idol. In the second entry (Isis pp. 28–29, [p. 13–14]) al-Maʾmūn struck a narrow shaft of black quartz, a deep well, and a square place with a covered granite basin: \"they found nothing but worn out pieces of rope\". A third mention (Ibn al-Mutawwaj, Isis p. 30) reports a sarcophagus with an inscribed marble tablet. No passage in any of these mentions salt, halite, or any coating on the chamber walls."
  editorInference: "Editor's inference: the salt-layer report attributed to al-Maʾmūn's party (GEO-C003, carried in the ledger only by SRC-GEOPOLYMER-INST) is absent from the compilation that gathers the principal medieval Arabic accounts of the breach. This is negative evidence within one compilation, not proof that no Arabic author says it: al-Maqrīzī's full Khiṭaṭ chapter (Graefe ed.), ʿAbd al-Laṭīf al-Baghdādī and the Arabic extracts in Vyse 1840 vol. 2 remain unread (GEO-R001). But the burden now sits with whoever asserts the salt report to name its author."
