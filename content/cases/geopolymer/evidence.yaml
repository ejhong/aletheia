- id: GEO-E020
  title: "Comparative petrography with a geopolymer positive control finds no casting signature in casing stones (Jana)"
  claimIds: [GEO-C020, GEO-C030]
  sourceId: SRC-JANA-2007
  direction: undermines
  strength: strong
  sourceStatement: >-
    Side-by-side examination of Great Pyramid casing stones, natural Tura
    limestone, and a genuine Davidovits-made geopolymeric limestone found:
    (1) the Si-rich spherical microconstituents highlighted by Barsoum
    (opal-CT lepispheres, Si≫Ca>Mg>Al) occur in both casing stones and
    natural limestone; (2) the real geopolymeric limestone shows marked
    Na+K and Al enrichment in its binder that no casing-stone sample
    shows; (3) phosphorus in the Lauer sample maps as contamination from a
    calcium-phosphate surface coating penetrating ~5 mm, with the interior
    phosphate-free; (4) casing stones and Tura stone share a particulate
    texture with intergranular pores, unlike the geopolymer's smooth
    matrix with spherical air voids. Jana concedes a binder at ~5 wt%
    might not register in bulk chemistry, which is why binder-phase
    SEM-EDS was used.
  editorInference: >-
    The only study in the exchange with a positive control, directly
    measuring what a casting signature should look like — which is also
    why it bears on GEO-C030: it demonstrates that binder signatures are
    detectable when present, so provenance-blindness arguments do not
    extend to binder-aware petrography. Its decisive negative applies to
    the alkali-aluminosilicate recipe; the revised C–S-H binder of
    GEO-E017 is outside its test.
  exactLocator: "Proc. 29th ICMA (2007), pp. 207–266 (pagination unverified); figures 5, 8–9, 12–15, 17, 19, 24–25"
  limitations:
    - "GENUINE FACTUAL DISPUTE — sample authenticity: Davidovits contends Jana's 'Lauer sample' piece was not authentic (wrong thickness, missing phosphate coating). In tension with that specific contention, Jana's figures 12–15 report finding and mapping the phosphate coating on the Harrell-supplied piece. Unresolved; conclusions about the Lauer sample are conditional on it."
    - "Conference proceedings, not journal peer review."
    - "The alkali-based negative does not test the calcium-silicate binder proposed in GEO-E017."
    - "Proponent response to this line of criticism: the methods critique (GEO-C030, GEO-E024) — though this study is the strongest counter to it, since its positive control demonstrates binder-aware petrography can see what quarry-matching chemistry cannot."
  reviewState: ai_extracted
  origin:
    ref: "Barsoum response-literature verification run"
    extractedBy: "Fable (AI agent)"
    runId: "barsoum-lit-2026-08-22"
    date: "2026-08-22"

