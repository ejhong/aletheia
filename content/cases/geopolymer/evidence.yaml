- id: GEO-E064
  title: Plant acids do not disaggregate andesite; the acid-medium andesite binder is said to be replicated in the laboratory with modern chemicals
  claimIds:
    - GEO-C580
  sourceId: SRC-DAVIDOVITS-2019
  direction: supports
  strength: weak
  sourceStatement: The source states that carboxylic acids (acetic, oxalic, citric) work on limestone — any stone containing limestone "will be disaggregated but not volcanic andesite" — so the chemistry can only make a binder to agglomerate unconsolidated material; that earlier attempts could soften limestone but not re-harden it; and that the acidic-medium method with guano 'has been successfully replicated in our laboratory with modern chemicals' to test the mechanism.
  editorInference: "Mine: consistent with GEO-C580's three-stage description, but the replication is asserted without recipe, data or product characterisation, and used modern reagents rather than plant extracts and guano. Feasibility of the mechanism is claimed, not shown."
  exactLocator: "[p. 16] (§2.3.1–2.3.2) and [p. 18] (§3 Conclusion) of the PDF at geopolymer.org/wp-content/uploads/TIWANAKU-PUMAPUNKU.pdf"
  limitations:
    - No experimental data presented for the replication.
    - Modern chemicals, not the proposed ancient inputs.
    - "Second reader (claude-sonnet-5, 2026-09-09) disputes the stated direction: The quoted passages are accurately located at p.16 (\\u00a72.3.1-2.3.2) and p.18 (\\u00a73 Conclusion) and are quoted in context, and the sourceStatement fairly summarizes them without overreach. However, the source explicitly says the acids cannot disaggregate andesite (only limestone), that early attempts to re-harden softened stone failed, and that the acidic-medium mechanism was only replicated with modern chemicals rather than the plant/guano inputs claimed for antiquity \\u2014 this qualifies or undermines the pre-industrial feasibility asserted in GEO-C580 rather than supporting it, so the stated 'supports' direction is wrong (dissent recorded, not a rejection)."
  reviewState: ai_extracted
