# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit; sourceStatement (what the
# source says) is kept separate from editorInference (what we infer).

- id: GEO-E001
  title: "Measured dolerite-pounder removal rate: 216 cm³/h"
  claimIds: [GEO-C001]
  sourceId: SRC-MARCIS-2023
  direction: supports
  strength: moderate
  sourceStatement: >-
    Photogrammetric measurement of experimental granite quarrying with a
    dolerite pounder recorded a material removal rate of 216 cm³ per hour at
    85 strikes per minute; the authors conclude the results speak against
    dolerite pounders as the sole quarrying method.
  editorInference: >-
    At face value the rate implies dramatically extended timelines for the
    Unfinished Obelisk under the orthodox account, or the use of supplemental
    techniques.
  limitations:
    - "Single study, single team, single granite and tool configuration."
    - "Skilled ancient crews with maintained tools may outperform the experimental protocol."
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-003 (corrected framing)"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"

- id: GEO-E002
  title: "The evidentiary base of the pounding orthodoxy (Engelbach 1922)"
  claimIds: [GEO-C001, GEO-C002]
  sourceId: SRC-ENGELBACH-1922
  direction: context
  strength: moderate
  sourceStatement: >-
    Engelbach's monograph on the Aswan obelisk is the original source of the
    dolerite-pounder account, including his own brief working trial and
    workforce estimates.
  editorInference: >-
    Per the proponent literature's characterization, the orthodox rate
    estimate rests on one self-conducted one-hour trial (~5 mm progress,
    scaled by an efficiency multiplier) and a count-divided-by-four workforce
    heuristic — a thin base for a century of textbook confidence. This
    characterization should be checked against the monograph itself.
  limitations:
    - "The characterization of Engelbach's method is taken from Fóti's account and has not been verified against the 1922/1923 texts (that verification is geo topic T-002)."
  reviewState: ai_extracted
  origin:
    ref: "geo catalog T-002"
    extractedBy: "Fable (AI agent)"
    runId: "geo-catalog-2026-05"
    date: "2026-05-02"

