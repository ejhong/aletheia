  sourceStatement: The authors state that documentation of the "conservation interventions carried out between 1995 and 1997 is not available", but that published photographs and later documentation make it evident that "surface cleaning and the filling of wall cavities were carried out". XRF points P27–P28 show a sulfur enrichment at a visibly restored area, which they read as an S-rich (likely gypsum-bearing) fill not part of the original stone. In 2022 salt formation was observed only in very limited areas; since then "extensive salt efflorescence is now visible on the stone surfaces" (Fig. 3, Supplementary Fig. S4). Graffiti residues predating 2004 also survive.
