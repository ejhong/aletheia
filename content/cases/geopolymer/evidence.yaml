- id: GEO-E030
  title: "Efflorescence on Queen's Chamber limestone is halite (XRD: halite, calcite, quartz only)"
  claimIds:
    - GEO-C506
    - GEO-C907
  sourceId: SRC-SESSA-2026
  direction: supports
  strength: weak
  sourceStatement: The authors state that in the Queen's Chamber "halite was identified as the main phase responsible for efflorescence" on the limestone blocks. Targeted SEM-EDX of white efflorescence (samples S4, S5) detected only Na and Cl, with a Na–Cl correlation of R = 0.969 across all samples and halite whiskers visible at 400× and 1600× (Fig. 5); XRD of seven samples "confirmed the presence of only halite, calcite, and quartz", with no nitrates and no evidence of widespread gypsum formation.
  editorInference: "Editor's inference: this confirms the presence component of GEO-C506 — the salt on Great Pyramid chamber stone is NaCl — with modern instrumentation rather than a taste test. It carries essentially no weight toward casting: the same paper reads the halite as native to the limestone (GEO-E606) and the study analysed surface efflorescence and detached fragments only, so it cannot say whether NaCl is bulk-distributed or surface-confined."
  exactLocator: "Abstract; 'Samples investigation: SEM-EDX and XRD analysis'; Figs. 5–7 — via open-access copy PMC13087131"
  limitations:
    - Only efflorescence and naturally detached, salt-affected fragments were analysed; no stone was cored, so bulk versus surface distribution is untested.
    - XRD detection limit below 5 wt%; minor sulfate phases could be missed (the authors say so).
    - Conservation study; not designed to test any origin hypothesis for the blocks.
    - "Second reader (claude-sonnet-5, 2026-09-08) disputes the stated direction: The quotes and figures are accurately drawn from the Sessa et al. paper and the sourceStatement fairly summarizes the XRD/SEM-EDX findings for GEO-C907. However, for GEO-C506 the claim requires a comparison of NaCl surface concentrations against 'comparable natural limestone monuments,' which this conservation-focused paper never attempts; it even suggests Na and Cl are 'probably inherent components of the stone matrix' rather than anomalous, so labeling it as 'supports' for C506 is not justified (at best it is contextual). This is recorded as dissent on direction rather than a rejection, since the record still passes the other checks."
