- id: GEO-E047
  title: "The Koch Pyramids Radiocarbon Project's own summary: organics from Old Kingdom monuments dated, Great Pyramid placed in the historical era"
  claimIds:
    - GEO-C576
  sourceId: SRC-ASSOCIATES-ND
  direction: undermines
  strength: moderate
  sourceStatement: 'AERA states that in 1984 it radiocarbon-dated material from Egyptian Old Kingdom monuments, that "The average radiocarbon dates were 374 years earlier than expected", and that in spite of this "the radiocarbon dates confirmed that the Great Pyramid belonged to the historical era" studied by Egyptologists. A second round in 1994–95 broadened sampling to Saqqara, Djoser, Giza, 5th/6th Dynasty and Middle Kingdom pyramids plus Lost City bakeries, returning dates 100–200 years older than the Cambridge chronology, with Khufu dates scattered over ~400 years. It explains the offset by an old-wood effect: "recycled wood was burned, for example, in mortar preparation", so charcoal can be centuries older than the mortar it was burned for. Technicians preferred wood and charcoal, with reed and straw also collected.'
  editorInference: GEO-C576 says the pyramid's dating rests on 'wood fragments found on the ground rather than in masonry' and 'no direct dating'. The project's own account describes a programme of radiocarbon dates on organics from the monuments whose interpretation turns on charcoal burned for mortar — i.e. organics in masonry contexts — and concludes the Great Pyramid falls in the historical era. This undermines the claim's characterisation, though the page does not itemise per-sample contexts, and the wide scatter and 374-year offset it reports are genuine complications (in the direction of older, not younger). The 'no direct dating of the limestone' clause is untouched — radiocarbon dates organics, not carbonate. My inference.
  exactLocator: Sections 'Previous estimates', '1984', '1994-1995', 'Comparison 1984/1995', 'The old-wood problem' (webpage, no pagination)
  limitations:
    - Secondary summary; Bonani et al. 2001 not retrieved; sample-by-sample provenance not shown.
    - AERA is an interested party in the conventional chronology.
    - Reported offsets and scatter are themselves unresolved by the page.
    - "Second reader (claude-sonnet-5, 2026-09-09) disputes the stated direction: The quotes and summary accurately reflect AERA's own webpage, and the locator sections match. However, labeling this 'undermines' the claim is questionable: the same source reports a 374-year discrepancy, ~400-year scatter for Khufu, and an admitted old-wood problem casting doubt on precision, which arguably qualifies rather than refutes the claim's point about weak evidential grounding rather than simply confirming the historical chronology. This is recorded as dissent rather than grounds for rejection."
  reviewState: ai_extracted
  origin:
    ref: report 2026-09-08-report-megalithic-casting-161414
    extractedBy: claude-fable-5-1
    runId: 2026-09-09-draft-megalithic-casting-004619
    date: 2026-09-09
- id: GEO-E048
  title: Conventional fuel demand — gypsum mortar, copper, bread — offered as an explanation for Old Kingdom wood depletion
  claimIds:
    - GEO-C516
  sourceId: SRC-ASSOCIATES-ND
  direction: qualifies
  strength: weak
  sourceStatement: AERA asks whether its radiocarbon results reflect Old Kingdom deforestation and whether the builders had to scavenge wood "to burn tons of gypsum for mortar, to forge copper chisels", and to bake bread for thousands of labourers, concluding that the giant stone pyramids of the early Old Kingdom "may mark a major depletion of Egypt’s exploitable wood", which may explain the wide scatter of the dates.
  editorInference: GEO-C516 predicts that casting-scale wood-ash demand would leave region-scale deforestation signals dated to construction periods. This page shows the conventional account already expects a construction-era fuel shock from mortar, metallurgy and bread. A deforestation signal at the pyramid age would therefore be predicted by both accounts and cannot by itself discriminate; the claim's test needs a magnitude or a chemical (alkali/ash) signature beyond a fuel-demand signal. The page's suggestion is explicitly speculative. My inference.
  exactLocator: Section 'Conclusions' (webpage, no pagination)
  limitations:
    - Speculative questions, not measurements; no pollen or charcoal record cited.
    - Secondary summary.
    - "Second reader (claude-sonnet-5, 2026-09-09) disputes the stated direction: The quoted material is accurately drawn from AERA's speculative 'Conclusions' section and the sourceStatement fairly reflects it, but the source is about conventional Old Kingdom fuel demand (mortar, copper, bread) as a possible explanation for radiocarbon scatter, not about whether casting-scale mineral processing would leave detectable region-scale deforestation signals; it offers an alternative, unrelated explanation for wood depletion rather than qualifying the specific evidentiary expectation in GEO-C516, so this looks more like background context than a qualifier. The locator and quote are correctly attributed to AERA's own conclusions, not a cited third party, so independence is not an issue."
  reviewState: ai_extracted
