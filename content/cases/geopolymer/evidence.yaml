  claimIds: [GEO-C003]
  sourceId: SRC-GEOPOLYMER-INST
  direction: supports
  strength: weak
  sourceStatement: >-
    The Geopolymer Institute's account recounts that Al-Ma'mun's party
    (c. 820 AD) found interior pyramid chamber walls covered with a salt
    layer, and documents Davidovits' own repeated taste tests of Cheops
    stone fragments (1984–2003) reporting a salty character.
  editorInference: >-
    If the 820 AD report survives contact with primary Arabic sources, it
