- id: GEO-E031
  title: Halite efflorescence is documented at other Egyptian limestone sites, including the carved-bedrock Sphinx
  claimIds:
    - GEO-C506
  sourceId: SRC-SESSA-2026
  direction: undermines
  strength: moderate
  sourceStatement: The authors write that "Halite has been frequently identified as a dominant salt" contributing to efflorescence at numerous heritage sites across Egypt, and list its documentation at the Menkaure Pyramid, the Sphinx in Giza, the White Monastery in Sohag, the Imni Tomb at Lisht and the Saqqara Pyramid, citing published studies for each.
  editorInference: "Editor's inference: GEO-C506 asserts that comparable natural limestone monuments do not exhibit the Great Pyramid's surface NaCl; the proponents' comparator was European cathedrals. Egyptian limestone sites in the same climate — including the Sphinx, carved from Giza bedrock and claimed by no one to be cast, and rock-cut tombs — show the same halite efflorescence. This is a literature summary in a conservation paper, not a controlled comparison of concentrations, so it undermines the comparator premise without measuring it."
  exactLocator: Section 'Queen's Chamber and thieves' corridor', paragraph beginning 'Halite has been frequently identified' — via open-access copy PMC13087131
  limitations:
    - "Second-hand: the authors cite other studies (refs 15, 19, 42–44) which were not read here."
    - No concentrations are compared; the statement is qualitative.
    - Menkaure is itself among the pyramids proponents claim, so that comparator does not discriminate; the Sphinx and the tombs do.
    - "Second reader (claude-sonnet-5, 2026-09-08) disputes the stated direction: The quoted passage and the list of sites (Menkaure, Sphinx, White Monastery, Imni Tomb, Saqqara) appear exactly as stated at the cited paragraph, and the record correctly flags the citation chain as second-hand. However, while 'undermines' is a defensible direction for GEO-C506 (showing halite occurs elsewhere weakens the claim of Pyramid uniqueness), the same passage directly asserts that halite is documented at those very sites, so it should be marked as supporting the halite-at-those-sites claim (a candidate from the case's construction, not a ledger record) rather than undermining it; this is recorded as a dissent rather than a rejection."
