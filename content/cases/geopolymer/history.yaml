  reason: "Four texts were shown: the full Davidovits & Davidovits 2020 GPSA Part IV paper (already indexed as SRC-DAVIDOVITS-2020, previously seen only as an abstract), the full Davidovits/Huaman/Davidovits 2019 Materials Letters paper (SRC-DAVIDOVITS-2019-ML), the same team's 2019 twenty-page Geopolymer Institute 'Archaeological Paper #K-eng' (new source), and the full MacKenzie et al. 2011 NMR letter (SRC-MACKENZIE-2011) via an open-access reprint. The Ceramics International andesite paper, Vranich 2018, Isbell & Burkholder 2002, Isbell 2013 and the Protzen & Nair experiments were not shown (403, bot challenge, or empty page) and stay blocked. From the shown texts the report's findings F1–F4 verify: (F1) the 2020 paper itself quotes the excavators reading Iwawe Stratum V as volcanic pumice/possible tephra (2002) and as sand from shaping imported blocks (2013), rejects both by argument only, and names sample collection as its next step — a negative-evidence record; (F2) the Materials Letters paper analyses red sandstone slab No. 2 (PP4), not andesite, so GEO-E006 is retitled and unlinked from GEO-C004; (F3) the K-eng report states the andesite sample PP1 was chosen from debris outside the protected area, that an interior subsample PP1C showed the same organic matter, that nitrogen was only semi-quantitative, that guano versus binder is undetermined, and that no geological andesite comparison was made; (F4) MacKenzie et al. state that both major 29Si resonances also occur in Tura limestone, that the −84 ppm shoulder does not unambiguously prove C-S-H, that 43Ca shows at most possible slight broadening, and that broader quarry sampling may produce closer natural matches — so GEO-E017 is downgraded to weak and the caveats enter as qualifying records. F5 (Vranich) is blocked. No edition: the article's sentences remain literally true (the excavators' description is still known only as quoted by proponents; the NMR paper still has no published rebuttal), so the record deepens without the telling changing; the conditions for a light edition are named in the disposition."
