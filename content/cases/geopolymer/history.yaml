  reason: "Two sources the earlier pass could not open are now in hand as retrieved text: Nemoy's 1939 translation of al-Suyūṭī's Tuḥfat al-kirām (both al-Maʾmūn entries, pp. 24–25 and 28–29 of Isis, [p. 9] and [p. 13–14] of the PDF) and Sessa et al. 2026 (Sci. Rep. 16:12586, via the PMC open-access copy). Together with the khufupyramid.dk transcription of Petrie and the abstract page of Davidovits & Davidovits 2020, they let this pass record: (1) that the medieval compilation most often cited for the al-Maʾmūn breach describes fire, vinegar, iron tools, catapults, a well, chambers, a jar of dinars and a covered granite basin but no salt, and dates the caliph's arrival to 217/832 — supporting a date correction to GEO-C003; (2) that the proponent page carrying the salt report cites no author, work or edition; (3) that halite is confirmed as the Queen's Chamber efflorescence phase, is reported as an inherent sedimentary constituent of Giza nummulitic limestone (Klemm & Klemm as cited by Sessa), and is documented at other Egyptian limestone sites including the Sphinx — the comparator GEO-C506 previously lacked; (4) that the 1995–97 interventions inside Khufu are undocumented, a concrete instance for GEO-C594; and (5) the proponents' 2020 Pumapunku model, now entered with the correct direction toward GEO-C903. Cooperson, Legon, Túnyi & El-hemaly, Demortier, Janusek et al., Kelany et al., the Petrie scan, Klemm & Klemm, Hemeda & Sonbol and Isbell & Burkholder were not retrievable and stay blocked with routes. No edition is proposed: the additions deepen the salt line, which the assessment already treats as a weakest link, and the article's statements remain literally true; the Andean and paleomagnetic narrative changes the report wants rest entirely on unretrieved sources."
