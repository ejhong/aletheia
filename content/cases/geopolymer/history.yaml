- date: "2026-08-22"
  change: >-
    Methods-critique counterargument given first-class treatment on human
    editorial input (runId editorial-methods-2026-08-22) — the site's
    first human editorial entry. Editor Eugene endorsed Fóti's methods
    point as the case's live proponent counter-argument: trace-element
    quarry-matching (PXRF, ICP-MS) and binder-aware materials analysis
    are distinct methodologies run by different specialist communities,
    answer different questions, and quarry-match results can overextend
    into anti-casting conclusions the chemistry does not support.
    GEO-C030 sharpened to carry this argument, anchored to Fóti's own
    formulation with a verbatim quote (The Natron Theory, Ch 1 methods
    chapter), and promoted from ai_extracted to human_reviewed — the
    first claim to carry that state. New qualifying evidence record
    GEO-E024 (SRC-FOTI-2024) carries the critique as it applies to the
    pyramid debate, cross-referenced as "the proponent response" from
    the four undermining records GEO-E018–E021, and GEO-C020's
    strongestObjection now names it as the live response. Honesty
    guardrails kept: the Stonehenge illustration is stated accurately
    (bluestones ~230 km mainstream-accepted; Nash 2020's Stone-58/West
    Woods sarsen match is ~25 km and was verified as a direct match,
    against Fóti's "statistical correlation only" framing); Fóti's
    methods-table error on NMR (²⁹Si NMR is what MacKenzie 2011 used) is
    recorded; and the critique's scope is bounded by Fóti's own
    concession that petrography and microscopy exist. Related catalog
    claims GEO-C507/C522/C575 cross-linked as one independence group.
    None of the undermining evidence was deleted or softened, and
    GEO-C020's weakly-supported credibility is unchanged by this entry.
  reason: >-
    The named accountable editor judged that the critics' provenance
    reasoning conflates two methodologies, and asked for the
    counter-argument to be carried at full strength. The site's design
    requires human editorial positions to be visibly attributed and
    distinguishable from AI-extracted content; this entry establishes
    that pattern.
  actor: "Eugene (editor) — endorsement and direction; Fable (AI agent) — drafting and integration"
  aiAssisted: true

- date: "2026-08-23"
  change: >-
    Site v1.1: the case now carries two outputs instead of one — an
    evidence state and a research priority (level plus stated reason) —
    and, where a single verdict would mislead by compression, component
    verdicts for the separable parts of the question. Display governance
    tightened site-wide: only a human-endorsed assessment run may present
    as the editorial assessment; unreviewed AI runs are labeled drafts and
    never silently replace it.
  reason: >-
    "Weak evidence, strong reason to investigate" is this site's signature
    category; a single verdict cannot express it. Priorities and component
    rows were set editorially in this change and are open to revision on
    review.
  actor: "Eugene (direction); applied by Fable (AI agent)"
  aiAssisted: true

- date: "2026-08-23"
