udy analysed surface efflorescence and detached fragments only, so it cannot say whether NaCl is bulk-distributed or surface-confined.\"; GEO-E031.limitations — [\"Second-hand: the authors cite other studies (refs 15, 19, 42–44) which were not read here.\",\"No concentrations are compared; the statement is qualitative.\",\"Menkaure is itself among the pyramids proponents claim, so that comparator does not discriminate; the Sphinx and the tombs do.\",\"Second reader (claude-sonnet-5, 2026-09-08) disputes the stated direction: The quoted passage and the list of sites (Menkaure, Sphinx, White Monastery, Imni Tomb, Saqqara) appear exactly as stated at the cited paragraph, and the record correctly flags the citation chain as second-hand. However, while 'undermines' is a defensible direction for GEO-C506 (showing halite occurs elsewhere weakens the claim of Pyramid uniqueness), the same passage directly asserts the content of GEO-C905 (halite documented at those very sites), so it should be marked as supporting GEO-C905 rather than undermining it; this is recorded as a dissent rather than a rejection.\"] → [\"Second-hand: the authors cite other studies (refs 15, 19, 42–44) which were not read here.\",\"No concentrations are compared; the statement is qualitative.\",\"Menkaure is itself among the pyramids proponents claim, so that comparator does not discriminate; the Sphinx and the tombs do.\",\"Second reader (claude-sonnet-5, 2026-09-08) disputes the stated direction: The quoted passage and the list of sites (Menkaure, Sphinx, White Monastery, Imni Tomb, Saqqara) appear exactly as stated at the cited paragraph, and the record correctly flags the citation chain as second-hand. However, while 'undermines' is a defensible direction for GEO-C506 (showing halite occurs elsewhere weakens the claim of Pyramid uniqueness), the same passage directly asserts that halite is documented at those very sites, so it should be marked as supporting GEO-C905 rather than undermining it; this is recorded as a dissent rather than a rejection.\"]; GEO-E032.editorInference — \"Editor's inference: if halite is native to the strata conventionally identified as the pyramid's source rock, then salt on the blocks is expected under the carved account and GEO-C506's comparative premise fails; the proponent page's dismissal of exactly this reading (GEO-E603) is met here by a stated geological mechanism. The decisive check remains GEO-R010 — halite in unworked Giza/Mokattam bedrock and quarry faces — and Klemm & Klemm 2010 should be read directly. Note that both the proponents and this reading predict NaCl in the blocks; the salt does not discriminate between them.\" → \"Editor's inference: if halite is native to the strata conventionally identified as the pyramid's source rock, then salt on the blocks is expected under the carved account and GEO-C506's comparative premise fails; the proponent page's dismissal of exactly this reading is met here by a stated geological mechanism. The decisive check remains GEO-R010 — halite in unworked Giza/Mokattam bedrock and quarry faces — and Klemm & Klemm 2010 should be read directly. Note that both the proponents and this reading predict NaCl in the blocks; the salt does not discriminate between them.\"; GEO-E045.editorInference — \"GEO-C511 frames the spheres as 'transported to Aswan' for a non-pounding purpose. Kelany et al. place the raw material in dykes within the Aswan granitoids and identify purpose-built tool quarries adjacent to the working areas, i.e. a local pounder industry embedded in the quarry landscape. This weighs against the premise of exotic import (Engelbach's contrary 1922 opinion is recorded in GEO-E706) and, with the association of pounders with extraction debris everywhere, against a non-quarrying purpose. It does not itself test what the pounders struck. My inference.\" → \"GEO-C511 frames the spheres as 'transported to Aswan' for a non-pounding purpose. Kelany et al. place the raw material in dykes within the Aswan granitoids and identify purpose-built tool quarries adjacent to the working areas, i.e. a local pounder industry embedded in the quarry landscape. This weighs against the premise of exotic import (Engelbach's contrary 1922 opinion is recorded in GEO-E002) and, with the association of pounders with extraction debris everywhere, against a non-quarrying purpose. It does not itself test what the pounders struck. My inference.\"; GEO-E058.limitations — [\"Same team, same fragment as GEO-E007; not independent.\",\"EDS is elemental only; no molecular identification of the 'organic matter'.\",\"Sample provenance per GEO-E809.\"] → [\"Same team, same fragment as GEO-E007; not independent.\",\"EDS is elemental only; no molecular identification of the 'organic matter'.\",\"Sample provenance as the source states it.\"]; GEO-E060.limitations — [\"Applies to the 2019 work; the 2020 paper (GEO-E803) still presents no andesite comparison.\"] → [\"Applies to the 2019 work; the 2020 paper (GEO-E035) still presents no andesite comparison.\"]; GEO-R009.summary — \"Desk work. Read Isbell & Burkholder 2002 on the Iwawe excavation and record exactly how Stratum V is described — andesite sand, gravel, dressing flakes, or something else — and its dating relative to Pumapunku construction (c. AD 600–700). In parallel, obtain Janusek et al. 2013 ('Building Taypikala', doi:10.1007/978-1-4614-5200-3_4) and record what it documents about roughly carved andesite blocks at Iwawe and the Ccapia foothills, and whether andesite quarry faces on Ccapia have been documented in any fieldwork since 2013. Then compare with the proponent model in GEO-C603.\" → \"Desk work. Read Isbell & Burkholder 2002 on the Iwawe excavation and record exactly how Stratum V is described — andesite sand, gravel, dressing flakes, or something else — and its dating relative to Pumapunku construction (c. AD 600–700). In parallel, obtain Janusek et al. 2013 ('Building Taypikala', doi:10.1007/978-1-4614-5200-3_4)