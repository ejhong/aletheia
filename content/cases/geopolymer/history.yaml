- date: 2026-09-09
  change: |-
    The editorial conjecture file retired (GEO-J001, by "Eugene (ejhong)", dated 2026-08-23, status open). The card leaves the case page. Its proposition is the ledger's: GEO-C022 (at least one major megalithic monument contains man-made cast stone) with GEO-C030 (quarry-matching methods are blind to the chemistry that would tell cast from natural); its decisive tests are GEO-R003 and GEO-R004. Banked here, as the file recorded them, are the founder's own words that no ledger record holds.
    Statement: "Casting of artificial stone was used in the construction of at least one major ancient megalithic monument, and the product resembles natural stone closely enough that conventional archaeology has misclassified it as carved natural rock."
    Confidence: "High — stated as founder's intuition, explicitly not derived from the evidence ledger, which currently grades the corresponding claim (GEO-C022) unresolved."
    Rationale: "Intuitive pattern recognition across the assembled record, weighted by how many stubborn anomalies one hypothesis dissolves at once. Casting explains the precision and irregular interlocking of joints that pounding and fitting reproduce poorly. It explains the logistics that the carving account leaves heroic: quarries tens of kilometers distant (transport aggregate and binder, not monoliths), massive blocks placed at high altitude, and constructions too large to have fit through the rooms and passages that enclose them. It explains the protruding nubs (casting or mold-handling features rather than abandoned lifting bosses) and the scoop marks (material removal from a soft or unconsolidated state rather than percussion on hard rock). It also explains why the question stays invisible: the standard quarry-matching toolkit is blind to the chemistry that would distinguish cast from natural stone (GEO-C030). One caveat is accepted up front: binder discrimination between natural and artificial stone is necessary but apparently not easy — the signatures can be subtle and protocols need validated sensitivity on known cast controls. It is still the best test to focus on, which is why the disconfirmers below are staked on it. Recorded as intuition, with the predictions and disconfirmers carrying all of the accountability."
    Predicted findings: (1) "Non-geological binder phases at block boundaries or interiors in at least one nominated monument sample." (2) "Hydration, carbonate, or isotopic signatures inconsistent with matched natural rock from the attributed quarry." (3) "Composite microstructure — aggregate-in-matrix textures, air voids, or entrained organic material (fibers, charcoal, plant matter) inside block interiors, absent from quarry controls; organics deep inside an 'igneous' or 'metamorphic' block would be close to dispositive." (4) "Mold-consistent surface or placement features — including nub and scoop-mark morphology — that carving and dressing do not produce."
    What would prove it wrong: (1) "Preregistered, blinded, binder-aware analyses of the strongest nominated samples repeatedly classify them as natural stone, using protocols with demonstrated sensitivity to known cast controls." (2) "If the best available samples from multiple nominated monuments pass such testing as natural, this conjecture should be marked refuted for those monuments and its scope narrowed or withdrawn — not migrated to ever-less-testable candidates."
  reason: "Founder direction (2026-09-09, in session): a bet with a stated confidence and a disconfirmer is a claim, graded honestly against the evidence, not a registry beside the ledger; the essays are founding inputs and their propositions enter as claims. What the founder believed ahead of the evidence, and what he staked it on, belongs in the append-only changelog (AGENTS.md §7, amendment of 2026-09-01). The conjecture carried no evidential weight, so no standing changes; the file's text remains in git history."
