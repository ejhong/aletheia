- date: 2026-09-08
  change: "Intake from report proposals/2026-09-08-report-megalithic-casting-125721/report.md: 1 source(s), 1 evidence record(s), 1 claim(s), 3 research item(s) verified and added (proposal 2026-09-08-draft-megalithic-casting-132902, verification 2026-09-08-verify-megalithic-casting-134550); 6 candidate(s) rejected with reasons in dispositions.yaml."
  reason: "Of the ten sources the report proposed, only three came back with readable text: the Geopolymer Institute 'Pyramids (3)' page (already indexed as SRC-GEOPOLYMER-INST), an amateur transcription of Petrie 1883 on the Queen's Chamber (khufupyramid.dk), and the abstract page of Davidovits & Davidovits 2020 (GPSA 1:36–43). Sessa et al. 2026 returned only a bot-challenge page; Nemoy 1939, Cooperson, Legon 1993, Túnyi & El-hemaly 2012, Janusek et al. 2013 and Kelany et al. 2009 were not retrievable. The report's most consequential findings — that the medieval al-Maʾmūn compilations contain no salt, that the salt has a sedimentary explanation, that Tiwanaku andesite is pXRF-matched to Ccapia with carved blocks abandoned en route, and the paleomagnetic pilot — therefore all stay blocked with routes to the primaries. What can be verified and enters: (1) the ledger's sole anchor for the al-Maʾmūn salt report cites no medieval source and dates the entry to 820 AD; (2) Petrie 1883 independently recorded salt incrustation in the Queen's Chamber (via transcription, to be checked against the scan); (3) the proponents' current Pumapunku model specifies uncrushed natural Khapia andesite sand stored at Iwawe Stratum V and disowns the piedras cansadas — which makes a single stratigraphic description decisive. The proposed date correction to GEO-C003 (820→832) rests on the two unretrieved compilations and is held as blocked, not applied. No edition change: the report's narrative revisions depend on the blocked sources."
  actor: aletheia verify (claude-sonnet-5 second reader; drafter claude-fable-5-1)
  aiAssisted: true
  kind: content

