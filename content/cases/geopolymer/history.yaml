  change: "Intake from report proposals/2026-09-08-report-megalithic-casting-161414/report.md: 2 source(s), 3 evidence record(s), 2 claim(s), 2 research item(s) verified and added (proposal 2026-09-09-draft-megalithic-casting-004619, verification 2026-09-09-verify-megalithic-casting-005453); 13 candidate(s) rejected with reasons in dispositions.yaml. 1 correction(s) NOT applied — see proposals/2026-09-09-verify-megalithic-casting-005453/verification.md."
  reason: "Bounded pass. Three sources were shown: Engelbach 1922 (Project Gutenberg HTML, already indexed as SRC-ENGELBACH-1922; text shown through §44 of 56, the unseen remainder being miscellaneous objects and bibliography per the table of contents), Kelany et al. 2009 (NGU Special Publication 12, full 12-page PDF, new source; its blocked `declined` entry's reopen condition — NGU PDF retrieved — is met), and the AERA project page 'How Old Are the Pyramids?' (new webpage source, a secondary summary of Bonani et al. 2001). Túnyi & El-hemaly 2012, Hemeda & Sonbol 2020, Legon 1993, Bonani et al. 2001, Janusek et al. 2013 and Demortier 2009 were not retrieved and stay blocked; every observation the report drew from them stays out. Read directly, Engelbach §§13–15 partly contradict GEO-C502: the one-hour hand trial and absence of a mass measurement are as the claim says, but the workforce logic in the shown text is one man per double-foot from trench-floor groove spacing, the trench time rests on an assumed 8 mm/h rammer rate, and Engelbach himself was 'certain' pounders were not used entirely by hand; no count-divided-by-four heuristic appears in the shown text. Kelany et al. attribute the pounding-only reading to Röder 1965 and report massive charcoal, ash and burnt brick from the 2002 excavation, boulder extraction, local dolerite tool quarries and pounder use-wear. Engelbach §6 supplies a prior conventional reading of the deep shafts (test-shafts) that GEO-C006 and GEO-C536 currently lack. The AERA page undermines the 'wood on the ground, not in masonry' clause of GEO-C576 and qualifies GEO-C516's deforestation logic. A correction to GEO-C502's wording and to IMG-GEO-P01's caption follows from shown text. Because the article states that the proponent characterisation 'has not been checked against the monograph' and attributes the pounding orthodoxy to Engelbach, both now shown inaccurate, a light edition rewrites the Rates paragraph and the shafts sentence only; featured ids, crux order and the assessment's judgment are unchanged. Salt-section, paleomagnetic and Andean narrative changes remain blocked with their sources."
