    & Bradley" is actually Freestone & Middleton 2007, and the pro-casting
    binder chemistry shifted between 2006 and 2011 (alkali-aluminosilicate
    → calcium-silicate gel), so negatives against one recipe do not count
    against the other. Structural finding noted on the records: no formal
    journal comment/reply on Barsoum 2006 exists; criticism ran through
    the 2007 ICMA proceedings and the 1991–93 letters cycles.
  reason: >-
    The case's most significant non-proponent supporting analysis rested on
    an unverified citation, and its critical literature was absent — the
    fairness rules require the rebuttals imported with equal seriousness
