# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real photographs with provenance and license, presented as
#            numbered museum plates. Duotone treatment is applied in CSS at
#            display time; the original files are unmodified apart from
#            resizing.

- id: IMG-GEO-COVER
  role: cover
  file: /images/cases/geopolymer/cover.jpg
  alt: >-
    Engraved illustration of a monumental polygonal megalithic wall of
    interlocking many-angled stones, one central block shaded in copper.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v1
  model: "Cursor image generation tool, 2026-08-22"
  prompt: >-
    19th-century scientific expedition lithograph, copperplate engraving. A
    monumental polygonal megalithic wall of interlocking many-angled
    cyclopean stones, viewed at a slight angle with raking light, engraved
    with fine cross-hatching and stipple shading. Monochrome deep
    warm-black ink (#201b12) on aged warm cream paper (#f6f1e8), with one
    restrained oxidized-copper (#9a5b33) accent: a subtle copper wash on
    the central keystone block. Sparse engraved sky with horizontal
    hatching. Darwin-era natural-history journal plate aesthetic, generous
    plain paper margins. No text, no labels, no border frame lines.
    Unmistakably an engraving — stylized editorial artwork, not
    photorealistic.

- id: IMG-GEO-P01
  role: plate
  file: /images/cases/geopolymer/plates/obelisco-inacabado-asu-n-egipto-2022-04-01-dd-152.jpg
  alt: >-
    The Unfinished Obelisk at Aswan lying in its granite trench, the trench
    walls covered in rows of smooth scooped depressions.
  source: commons
  license: "CC BY-SA 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/4.0"
  credit: "Diego Delso, via Wikimedia Commons"
  plateNumber: 1
  depicts: >-
    The Unfinished Obelisk in its quarry trench at Aswan, Egypt. The
    scalloped "scoop marks" visible along the trench walls are the features
    whose production by dolerite pounders is contested (GEO-C001, GEO-C002).
  provenance:
    photographer: "Diego Delso"
    date: "2022-04-01"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Obelisco_inacabado,_Asu%C3%A1n,_Egipto,_2022-04-01,_DD_152.jpg"
    originalTitle: "File:Obelisco inacabado, Asuán, Egipto, 2022-04-01, DD 152.jpg"
  claimIds: [GEO-C001, GEO-C002, GEO-C006]

