# Research agenda: curated from the featured topics of the geo project's
# public RFP (rfp.md). Track labels mirror the RFP's two-track structure:
# publication prizes (pay for accepted results) and small grants (pay for
# work with upfront costs). The program funds tests in either direction.

- id: GEO-R001
  title: "Trace the Al-Ma'mun salt-layer report to primary Arabic sources"
  summary: >-
    Locate and evaluate the Arabic accounts (Al-Maqrīzī, Ibn Khaldūn,
    Al-Idrīsī and related compilations) behind the report that Al-Ma'mun's
    party found salt-coated chamber walls in 820 AD. Pure archival work,
    falsifiable in either direction: a credible primary source makes the
    salt argument's anchor real; absence or embellishment removes it.
  claimIds: [GEO-C003, GEO-C020]
  rfpTopicRef: "T-005"
  track: publication_prize
  effortTier: desk
  informationGain: >-
    High for cost: either result decisively moves GEO-C003, and it is the
    cheapest project on the agenda.

- id: GEO-R002
  title: "Replicate and extend the Marčiš pounding-rate measurement"
  summary: >-
    Independent replication of the 2023 photogrammetric quarrying-rate study
    with sensitivity analysis on technique, tool mass, drop height, and
    granite type; extension to scoop-mark sites beyond Aswan.
  claimIds: [GEO-C001]
  rfpTopicRef: "T-003"
  track: either
  effortTier: field
  informationGain: >-
    Confirms or dissolves the catalog's most mainstream-legible quantitative
    anomaly; a substantially higher replicated rate would restore the
    orthodox timeline.

- id: GEO-R003
  title: "Re-examine quarry-attribution studies under cast-stone-aware methodology"
  summary: >-
    A methods paper: for each major published provenance attribution, ask
    whether its analytical techniques could in principle distinguish carved
    quarry stone from stone cast with aggregate from the same quarry — and
    which additional measurements (hydration state, binder phases,
    microstructure) would discriminate.
  claimIds: [GEO-C030, GEO-C022]
  rfpTopicRef: "T-087"
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Decides how much the strongest conventional evidence class actually
    constrains the casting hypothesis — the methodological backbone of the
    whole agenda.

- id: GEO-R004
  title: "Field-test UV fluorescence and efflorescence as cast-stone diagnostics"
  summary: >-
    Test whether inexpensive, non-destructive UV fluorescence photography of
    surface efflorescence can discriminate cast from natural stone against
    prespecified criteria, using geologically matched natural controls at
    multiple megalithic sites. Framed neutrally: the question is whether the
    method discriminates at all, not whether any prior finding is validated.
  claimIds: [GEO-C020, GEO-C021, GEO-C022]
  rfpTopicRef: "T-091/T-092"
  track: small_grant
  effortTier: field
  informationGain: >-
    If the diagnostic works on known-cast versus natural test panels, it
    becomes a scalable field screen for every disputed site; if it fails,
    a popular class of surface arguments loses standing.

- id: GEO-R005
  title: "Audit restoration histories at key disputed sites"
  summary: >-
    Compile documented restoration and conservation interventions (modern
    mortar, consolidants, reassembly) at Giza, Tiwanaku/Pumapunku, Cusco,
    and Easter Island, so surface-chemistry anomalies can be checked against
    modern contamination before being read as ancient signatures.
  claimIds: [GEO-C022, GEO-C004]
  rfpTopicRef: "T-094"
  track: publication_prize
  effortTier: desk
  informationGain: >-
    A confound-killer: protects every surface-based claim in the case from
    its most likely mundane explanation.

- id: GEO-R006
  title: "Build a worldwide catalog of claimed cast-stone production signatures"
  summary: >-
    Systematic, criteria-first catalog of claimed production-site and
    product signatures (scoop marks, nubs, flow features, mold seams) across
    sites worldwide — including the null side: where the signatures should
    appear under the casting hypothesis but don't.
  claimIds: [GEO-C022]
  rfpTopicRef: "T-088"
  track: small_grant
  effortTier: field
  informationGain: >-
    Converts scattered anomaly anecdotes into a testable distribution; the
    "where are the scoop marks not?" question cuts both ways.

- id: GEO-R007
  title: "Replicate long-cycle fire-pit stone formation"
  summary: >-
    Controlled multi-month outdoor fire-pit cycles (ash accumulation,
    wetting, compaction) with periodic material testing, to check whether
    the proposed accidental-discovery pathway produces structurally
    stone-like material at all.
  claimIds: [GEO-C013]
  rfpTopicRef: "T-021"
  track: small_grant
  effortTier: field
  informationGain: >-
    Cheap test of the discovery-pathway story; failure would not refute
    casting but would remove its most intuitive origin narrative.

- id: GEO-R008
  title: "Re-examine the Tomb of Rekhmire casting scene"
  summary: >-
    Joint Egyptology and history-of-technology re-examination of the
    'casting a metal door' mural and its inscriptions: does the conventional
    bronze reading fully account for the depicted scale and apparatus, and
    what would each reading predict about residues or tools in the
    archaeological record?
  claimIds: [GEO-C005]
  rfpTopicRef: "T-034"
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Either strengthens the conventional reading with modern rigor or
    surfaces the first period depiction consistent with mineral casting.

- id: GEO-R009
  title: Check the Iwawe Stratum V deposit and the piedras cansadas against the excavators' own descriptions
  summary: Desk work. Read Isbell & Burkholder 2002 on the Iwawe excavation and record exactly how Stratum V is described — andesite sand, gravel, dressing flakes, or something else — and its dating relative to Pumapunku construction (c. AD 600–700). In parallel, obtain Janusek et al. 2013 ('Building Taypikala', doi:10.1007/978-1-4614-5200-3_4) and record what it documents about roughly carved andesite blocks at Iwawe and the Ccapia foothills, and whether andesite quarry faces on Ccapia have been documented in any fieldwork since 2013. Then compare with the proponent model in GEO-C603.
  claimIds:
    - GEO-C903
    - GEO-C021
    - GEO-C030
  track: either
  effortTier: desk
  informationGain: The proponents' 2020 model and the orthodox account agree on a Ccapia/Khapia origin for the andesite, so provenance geochemistry cannot separate them (GEO-C030). What separates them is a lakeshore deposit and some abandoned blocks. If Stratum V is a natural sand-consistency andesite store, the proponent model gains a non-trivial prediction; if it is dressing debris or unrelated fill, the model's aggregate source is unsupported. If carved ashlars are documented in transit, wholesale casting of andesite (GEO-C021) is undermined regardless of the SEM findings. Either outcome moves GEO-C021 without any new sampling of the monuments.
  origin:
    ref: report 2026-09-08-report-megalithic-casting-125721
    extractedBy: claude-fable-5-1
    runId: 2026-09-08-draft-megalithic-casting-132902
    date: 2026-09-08
- id: GEO-R010
  title: Establish whether halite is native to unworked Giza/Mokattam bedrock and quarry faces
  summary: "Open Klemm & Klemm 2010 (cited by the report via Sessa et al. 2026, not yet read) for what it says about halite within the stratigraphic layers of the Giza nummulitic limestone, and any published efflorescence surveys of unworked Mokattam quarry faces or Giza bedrock exposures. If the literature is thin, a small field task: non-destructive surface sampling (swab or scrape of natural efflorescence) at protected unworked bedrock and quarry-face locations on the plateau and at Tura/Mokattam, analysed by XRD for halite alongside a Queen's Chamber efflorescence reference. Record restoration/cleaning history of the chambers alongside (GEO-C594)."
  claimIds:
    - GEO-C506
    - GEO-C003
  track: either
  effortTier: field
  informationGain: GEO-C506 asserts that comparable natural limestone does not exhibit the pyramids' surface NaCl, but the ledger has no comparator; the proponents' comparator (European cathedrals) is the wrong lithology. If unworked Giza/Mokattam limestone effloresces halite, the salt discriminator collapses and GEO-C003's evidential interest with it; if it does not, the salt becomes a genuine anomaly worth bulk-chlorine testing under GEO-C590's logic.
  origin:
    ref: report 2026-09-08-report-megalithic-casting-125721
    extractedBy: claude-fable-5-1
    runId: 2026-09-08-draft-megalithic-casting-132902
    date: 2026-09-08
- id: GEO-R011
  title: Blinded paleomagnetic survey of pyramid core blocks with a natural-limestone remanence baseline
  summary: "The report describes a 2012 Europhysics News pilot (Túnyi & El-hemaly, doi:10.1051/epn/2012604; not retrievable here) that reported three of seven sampled block locations at Khufu and Khafre sharing a common N–S paleodirection and read the result as a possible mixture of natural and artificial blocks. A properly designed follow-up would: sample many blocks under a blinded protocol; measure the detrital remanence strength and stability of Mokattam quarry limestone as a baseline; treat block orientation explicitly, since bedding-horizontal placement preserves natural inclination and randomises only declination; and pre-register the criterion for 'set in place' versus 'quarried and rotated'. Non-destructive or micro-core sampling at already-damaged block faces would limit intervention."
  claimIds:
    - GEO-C020
    - GEO-C589
  track: small_grant
  effortTier: field
  informationGain: "Paleomagnetism is a method class absent from GEO-C589 and independent of the binder chemistry debate: a block that set in place should carry a remanence aligned with the present field regardless of recipe, while a quarried and rotated block should not. A null result with adequate power on core blocks would be the first direct in-situ physical test against GEO-C020 that does not depend on contested sample provenance; a positive at scale would force a mixed model. The 2012 pilot must first be read and its assumptions audited (blocked, see dispositions)."
  origin:
    ref: report 2026-09-08-report-megalithic-casting-125721
    extractedBy: claude-fable-5-1
    runId: 2026-09-08-draft-megalithic-casting-132902
    date: 2026-09-08

- id: GEO-R012
  title: Survey Cerro Khapia (Ccapia) for andesite extraction faces versus natural sand deposits
  summary: Both the orthodox provenance work and the proponents' 2020 model place the Pumapunku/Tiwanaku andesite's origin on Cerro Khapia; they differ on what was taken from it — dressed blocks from quarry faces, or a natural volcanic sand needing no crushing (GEO-E610). A field survey of the mountain's andesite outcrops for extraction signatures (working faces, wedge or pounder scars, dressing debris, abandoned blocks matched in size to monument ashlars) versus loose scoria/sand deposits, with grain-size and petrographic comparison of any sand against the Iwawe Stratum V material (GEO-R009), would settle which material left the mountain. Pairs with a literature check of any post-2013 fieldwork documenting Khapia quarries.
  claimIds:
    - GEO-C903
    - GEO-C021
    - GEO-C030
  track: either
  effortTier: field
  informationGain: Documented quarry faces with dressing debris and en-route ashlars would show carved andesite leaving Khapia and remove the proponents' aggregate-source story; a mountain with no extraction surfaces but a natural sand matching Iwawe Stratum V would remove the orthodox account's quarry and leave the proponents' model live. Either result is legible without touching a monument stone.
