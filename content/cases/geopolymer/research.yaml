- id: GEO-R015
  title: Compositional test of Iwawe Stratum V against Khapia andesite, regional tephra, monument andesite and experimental dressing debris
  summary: Locate surviving Stratum V samples and field records from the 2000–2002 Iwawe excavations (Isbell & Burkholder) or obtain new whole-fraction samples, and compare — with grain-size distribution, particle morphology, thin-section petrography, glass chemistry and major/trace elements prespecified — against (a) Cerro Khapia andesite outcrops and any unconsolidated volcaniclastic deposits there, (b) Pumapunku monument andesite, (c) regional tephra including Cerro Quemado, and (d) debris produced experimentally by dressing Khapia andesite with hammerstones. This is the laboratory extension of the desk check GEO-R009.
  claimIds:
    - GEO-C903
    - GEO-C021
  track: small_grant
  effortTier: lab
  informationGain: "Discriminates the three live readings of the one physical deposit on which the proponents' raw-material argument rests: airfall tephra (closes the Iwawe argument), dressing debris (documents conventional block-working at the port and undermines GEO-C021), or natural Khapia sand stockpiled at AD 600 with no extraction faces (the outcome the casting model predicts). Either way it replaces argument-by-analogy with measurement."
  origin:
    ref: report 2026-09-08-report-megalithic-casting-131750
    extractedBy: claude-fable-5-1
    runId: 2026-09-09-draft-megalithic-casting-033429
    date: 2026-09-09
- id: GEO-R016
  title: Establish what andesite sample PP1 is from, and whether a documented monument fragment can be tested instead
  summary: Request from the Geopolymer Institute and Bolivian authorities the 2017 collection permits, field photographs, coordinates and export documents for PP1/PP2/PP5, remaining fragments and thin-section numbers, and attempt a physical or petrographic refit of PP1 to a catalogued Pumapunku block. In parallel, identify a small detached andesite fragment with an object number and conservation history (site store or museum) for independent SEM/EDS and organic analysis against a Khapia andesite control. Also search for any published or unpublished 14C result on the andesite organic matter announced in 2019.
  claimIds:
    - GEO-C913
    - GEO-C918
    - GEO-C004
    - GEO-C021
  track: either
  effortTier: desk
  informationGain: Converts the andesite result from an observation about a loose surface find into evidence about (or not about) the monument. A documented refit or a provenance-secure fragment reproducing the interior organic matter would materially strengthen GEO-C004; failure to document PP1's origin caps its weight; a 14C date near AD 600 or a modern date would each be decisive for contamination versus ancient binder.
  origin:
