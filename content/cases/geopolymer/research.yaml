- id: GEO-R017
  title: Blinded multinuclear NMR of Bent Pyramid and other casing stone against a stratified Tura/Dahshur/Giza limestone suite with aged C-S-H controls
  summary: Repeat 29Si/27Al/43Ca MAS NMR on provenance-secure casing samples alongside a suite of natural limestone from multiple stratigraphic positions in the Tura, Dahshur and Giza quarries, blind-labelled, on replicate instruments, with synthetic C-S-H gels aged under dry heat and carbonation as positive controls, and with Q1/Q2 detection criteria (−79 and −84 ppm) fixed in advance. Report whether any natural sample shows the −84 ppm shoulder and dominant −111 ppm silica resonance seen in the Bent Pyramid sample.
  claimIds:
    - GEO-C020
    - GEO-C012
  track: small_grant
  effortTier: lab
  informationGain: Tests the one surviving positive Egyptian result against the alternative its own authors leave open — natural quarry variability — and supplies the positive control (aged C-S-H) that GEO-E020's alkali geopolymer control did not. A shoulder reproduced in natural Tura stone retires the result; a shoulder absent from a broad natural suite but present in casing stone, with a Q1 explanation, would be the first binder-specific positive on pyramid stone.
  origin:
    ref: report 2026-09-08-report-megalithic-casting-131750
    extractedBy: claude-fable-5-1
    runId: 2026-09-09-draft-megalithic-casting-033429
    date: 2026-09-09
