- id: GEO-R019
  title: Independent re-analysis of Pumapunku sandstone (PP4 or equivalent) against a broad Kimsachata/Kallamarka suite, testing the natural-albite alternative
  summary: Re-examine PP4 or a new sample from the same documented location on slab No. 2 by thin section, SEM/EDS and XRD alongside a substantially larger suite of regional red sandstone including multiple Kallamarka beds, with criteria for the 'fluidal ferro-sialate matrix' and for authigenic versus alkali-induced albite specified in advance and samples blind-labelled.
  claimIds:
    - GEO-C021
  track: small_grant
  effortTier: lab
  informationGain: The sandstone result has the better archaeological provenance of the two Pumapunku papers but rests on one thin section and three comparison sites, with a natural alternative the authors concede. Reproducing the matrix in natural Kimsachata sandstone closes the sandstone half of GEO-C021; failing to, across a broad suite, would be the first replicated Andean anomaly.
