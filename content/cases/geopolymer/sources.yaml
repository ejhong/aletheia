# Source records. Verification labels are honest about who checked what:
#   verified     — the document itself is held in the project library
#   ai_verified  — citation located and checked by an AI agent (geo project,
#                  2026-05-02 verification batch); no human re-check
#   unverified   — cited second-hand or from memory; locator unconfirmed

- id: SRC-MARCIS-2023
  title: "The problems of the obelisk revisited: Photogrammetric measurement of the speed of quarrying granite using dolerite pounders"
  authors: ["Marčiš, M.", "et al."]
  year: "2023"
  sourceType: paper
  identifier: "Digital Applications in Archaeology and Cultural Heritage, S2212054823000292 (Elsevier)"
  verification: ai_verified
  verificationNote: "Located and checked against the geo catalog's characterization by an AI agent (2026-05-02 batch); the '216 cm³/h at 85 hits/min' figure and the authors' against-pounders-alone conclusion were confirmed at that time."
  reliabilityNotes:
    - "Peer-reviewed journal; the only modern quantitative measurement of dolerite-pounder effectiveness."
    - "Single experimental team; no independent replication yet."

- id: SRC-ENGELBACH-1922
  title: "The Aswan Obelisk: With Some Remarks on the Ancient Engineering"
  authors: ["Engelbach, R."]
  year: "1922"
  sourceType: book
  identifier: "Cairo: Imprimerie de l'Institut Français d'Archéologie Orientale, pp. 1–47"
  verification: ai_verified
  verificationNote: "Companion volume: Engelbach (1923), The Problem of the Obelisks, London: T. F. Unwin — the more commonly read expanded version, full text on Internet Archive and Project Gutenberg. Many later citations conflate the two."
  reliabilityNotes:
    - "The foundational source of the pounding-stone orthodoxy."
