  synthesis: >-
    The hypothesis that a psychedelic sacrament powered the Eleusinian Mysteries
    and was subsequently inherited by early Christians—a 'religion with no
    name'—rests on a tiered ladder of claims where the evidentiary support thins
    drastically at each ascending rung. To steelman the affirmative case, the
    foundation of the hypothesis is archaeochemically secure. Modern residue
    analyses from sites like Tel Arad, the Bes vessel, and Es Càrritx
    conclusively prove that ancient Mediterranean cultures deliberately used
    potent psychoactive plants in ritual settings. Furthermore, a 2026
    experiment successfully resolved the classic pharmacological objection to
    the ergot-kykeon hypothesis by demonstrating that ancient-feasible wood-ash
    lye processing can fully hydrolyze toxic ergopeptides into psychoactive
    lysergamides (LSA). Anchored by the 2002 discovery of ergot fragments at a
    Demeter-linked sanctuary in Iberia, a psychedelic Eleusinian rite is a
    chemically and archaeologically viable possibility, not a baseless
    invention.

    However, to steelman the opposing case, background capability and distant
    analogues do not equate to historical reality at the target sites. The
    hypothesis is critically hampered by an absence of direct evidence where it
    matters most. No vessel from Eleusis itself has ever been chemically tested;
    the canonical Homeric Hymn names no psychoactive ingredients; and audited
    sanctuary financial inscriptions reflect conventional grain usage without
    drug production. More fatally, the grand narrative of Christian inheritance
    collapses upon contact with the primary source record. The earliest
    Christian texts—Paul, the Didache, and Justin Martyr—unequivocally describe
    the Eucharist as a Jewish-style thanksgiving liturgy of bread and wine,
    contradicting a mystery-cult derivation. There is no documented vector of
    transmission for a spiked sacrament, and no early Christian vessel has ever
    yielded pharmacological residues. Ultimately, the controversy illustrates a
    classic evidentiary mirage: established background capabilities are
    rhetorically fused with speculative chemical mechanisms to bear the weight
    of sweeping, unsupported historical conclusions. Until the empty cells are
    tested by preregistered organic residue analysis, the overarching thesis
    remains a provocative but unproven conjecture.
