  synthesis: >-
    The featured hypothesis is not one proposition. It is a ladder, and the
    evidence does not speak with one voice as one climbs. That split is the
    finding: the floor is chemically settled, the Greek middle is a live but
    thinly anchored historical conjecture, and the Christian penthouse is
    contradicted by the earliest documents we have. Treating the ladder as a
    single yes-or-no would launder lower-rung strength into upper-rung
    conclusions, which is the failure mode this case is built to block.

    At the observation floor, TIK-C001 is established. Independent residue
    chemistry has put psychoactive plants in ritual settings more than once:
    cannabis heated on the Tel Arad altars, tropane and ephedra alkaloids
    measured in human hair from the Es Càrritx cult cave, a multi-plant
    fermented preparation in a Bes vessel, with the Pinwheel Cave Datura quids
    as the methodological benchmark outside the region. TIK-C002 is well
    supported as capability: Greco-Roman pharmacology compounded psychoactive
    botanicals into wine. Neither result is diagnostic for Eleusis or for a
    Eucharistic cup. A Judahite cannabis altar and a Dioscoridean nightshade
    wine are priors about a world in which ritual pharmacology existed; they are
    not detections of ergot in the Telesterion or of a spiked cup in Corinth.

    The Greek half has a real mechanism, a real analogue, and an empty cell
    where direct evidence should be. TIK-C005 shows that wood-ash lye, an
    operation available in antiquity, can hydrolyze the toxic ergopeptides of
    Claviceps purpurea while yielding measurable LSA and iso-LSA. That retires
    "ergot would have poisoned everybody" at the level of possibility. It does
    not, by the authors' own framing, show that anyone at Eleusis ran a two-hour
    strong-alkali reflux, and the result stands as a single interested-network
    demonstration awaiting independent replication. TIK-C004 remains the only
    archaeological datum that combines the fungus, ingestion evidence, and a
    Demeter/Kore cult context, and it is a single 2002 analysis, never
    replicated, known here only through secondary citation, a thousand
    kilometres from the sanctuary. TIK-C003 is established as a textual fact:
    the Homeric recipe is barley meal, water, and mint, and names no
    psychoactive ingredient. TIK-C007 — deliberately prepared ergot in the
    Eleusinian kykeon — therefore sits at weakly_supported: genuine
    circumstantial scaffolding around an untested absence, set against a
    published recipe, sanctuary accounts that track grain into sacrifices and
    dedications, and no attested processing step. TIK-C008 is unresolved.
    Fasting, procession, secrecy, darkness and light, ritual drama, and mass
    emotion are a machine that needs no secret ingredient, no supply chain, and
    no dosing control, and that demonstrably ran for nearly two millennia;
    whether that machine is sufficient is not something this ledger has
    measured. Modern psilocybin trials show that a pharmacological route to
    mystical-type experience is real and say nothing about Attica. TIK-C006 is
    mixed: LSA is psychoactive and weaker than LSD, and its human record is
    nausea, sedation, autonomic effects, and anxiety as much as vision. The
    reconstructed extract has never been profiled, so "related to LSD" is still
    doing quiet work the pharmacology has not earned.

    The Christian half fails as history on the record in hand. TIK-C011 is
    contradicted by Paul, the Didache, and Justin Martyr: bread and a cup of
    wine, in Justin's case mixed with water, in Jewish thanksgiving form. Justin
    frames the Mithraic meal as demonic imitation of the Christian one, which is
    the wrong direction of borrowing for an inheritance thesis. TIK-C013, the
    framework on which transmission rides — Eucharist as an outgrowth of pagan
    mystery ritual rather than Second-Temple meal practice — is contradicted on
    the same documents and by the specialists cited in the record. TIK-C009 is
    mixed and low-diagnosticity: a Dionysian reading of John is a real scholarly
    position, not the book's invention, and a literary relationship is not a
    recipe. TIK-C010 is unresolved because no securely identified
    early-Christian liturgical vessel has been chemically tested; capability
    plus a hostile fraud polemic about Marcus are not detections. TIK-C012, the
    transmission rung, is the weakest load-bearing element in the structure.
    Cultural contact is real and wine-and-immortality language is shared, and
    none of that is surprising without pharmacological inheritance, because
    those are among the most common religious symbols in the ancient
    Mediterranean. No community, uncommon recipe, or vessel chain has been
    shown. The book's own scientific witness calls the connecting evidence
    extremely weak to nonexistent; an intra-movement reviewer rejects the grand
    theory; the author, in his scholarly register, does not hang his hat on a
    psychedelic Last Supper and asks "Where are the drugs?"

    Steelman for the hypothesis: secret rites omit secret ingredients, so
    textual silence is not a negative result; the empty cell at Eleusis is
    administrative rather than evidential; Mas Castellar plus alkaline
    feasibility plus barley in the canonical recipe is exactly the pattern the
    1978 conjecture predicted; LSA need not be LSD to have been good enough in a
    nine-day initiation machine; and a spiked cup somewhere in a diverse
    first-century Christianity is untested rather than refuted. A single
    replicated ergoline hit from a securely contexted Eleusinian vessel would
    transform the Greek half overnight. Steelman against: every climb from a
    lower rung to a higher one currently substitutes possibility, analogy, or
    literary atmosphere for a measurement at the site in question. That is the
    pattern of presenting mild circumstantial evidence, rhetorically solidifying
    it into fact, and building the next conjecture on it. Feasibility is not
    practice; an Iberian analogue is not Attic identity; Johannine vine imagery
    is not a lysergamide; and the earliest Eucharistic texts are Jewish table
    liturgies, not mystery initiations. Funding and interest-network authorship
    around the 2026 chemistry and the laboratory best placed to run the decisive
    tests are provenance, not refutation — chemistry stands on replication — but
    they forbid naive source-counting. The tests that would actually move the
    case remain residue analysis of Eleusinian vessels, modern re-analysis of
    the Mas Castellar samples, pharmacological profiling of the full
    reconstructed extract, and a preregistered survey of early-Christian cups.
    Until those measurements exist, the strong public form of the thesis is a
    conjunction whose Christian conjunct is already contradicted and whose Greek
    conjunct has not yet been asked the only question that can settle it.
claimAssessments:
  - claimId: TIK-C001
    verdict: established
    confidence: high
    reasoning: "Direct chemical evidence from independent teams and materials —
      cannabis residues on the Tel Arad shrine altars, ephedrine, atropine and
      scopolamine in Es Càrritx human hair, a multi-plant psychotropic
      preparation in a Bes vessel, and chewed Datura quids at Pinwheel Cave as a
      methodological benchmark — makes deliberate ancient ritual use of
      psychoactive plants a settled general fact. Individual sites still differ
      in route, certainty, and function, and the Bes vessel carries an
      art-market provenance caveat. The strongest opposing consideration is not
      to the proposition but to its use: none of these detections is ergot, none
      is from Eleusis, and none is from a Christian meal, so the rung is almost
      non-diagnostic for the featured thesis."
  - claimId: TIK-C002
    verdict: well_supported
    confidence: moderate
    reasoning: 'The Dioscoridean tradition, as presented in the Harvard discussion,
      describes wines deliberately compounded with henbane, mandrake, and black
      nightshade, the last credited with "not unpleasant visions," and Greek
      usage of wine as a pharmakon is on the same record; the Bes-vessel
      chemistry independently shows that complex fermented botanical ritual
      drinks existed in the Hellenistic world. What is missing is a denominator:
      how common potent additives were among wines generally, sacred wines, and
      cult wines. The strongest opposing consideration is that the surviving
      recipes are medical and magical with stated indications, the Dioscorides
      passages have not yet been independently pulled in this ledger, and
      nothing in the pharmacopeia connects those preparations to Eleusis or to
      any Christian meal.'
  - claimId: TIK-C003
    verdict: established
    confidence: high
    reasoning: "The Homeric Hymn to Demeter, read on the page, has Demeter refuse
      red wine and ask for meal and water mixed with soft mint; that is the
      whole public list, and no evidence record in this case names an ancient
      source that adds ergot or an alkaline-processing step. This is a claim
      about what the texts say, not about what was actually in the sanctuary
      cup, and as a textual claim it is secure. The strongest opposing
      consideration is secrecy: a cult forbidden to disclose its rite would
      publish a rustic posset whether or not a hidden additive existed, so the
      recipe cannot falsify the hypothesis even though it also cannot confirm
      it."
  - claimId: TIK-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: As carried by Antonopoulos et al. 2026, the 2002 Mas Castellar
      analysis reported fragments of Claviceps purpurea inside a ceremonial
      vessel and in the dental calculus of a young man at a Demeter/Kore-linked
      sanctuary near a Greek colony — the only datum in the case that combines
      substance, ingestion, and cult context. The primary chapters have not been
      obtained; the analysis has never been independently replicated; and
      downstream retellings that convert "fragments of ergot" into
      "hallucinogenic alkaloids chemically detected" outrun the record. The
      strongest opposing consideration is the stacked limitation of a single
      unreplicated twenty-four-year-old identification, known here only through
      secondary citation, at a site a thousand kilometres from Eleusis, which
      cannot by itself establish dose, deliberate preparation, or Attic
      practice.
  - claimId: TIK-C009
    verdict: mixed
    confidence: moderate
    reasoning: A Dionysian reading of John — Cana, the true vine, and related motifs
      — is a genuine position in Johannine scholarship rather than an invention
      of the book, and the Harvard transcript correctly flags it as a claim
      about a text's symbolic environment. Serious alternatives, Jewish
      messianic abundance symbolism chief among them, sit in the same
      literature, and no reading identifies a chemical. The strongest opposing
      consideration is that even if the literary relationship is granted in
      full, allusion transmits imagery rather than a recipe, and getting from
      there to pharmacology requires the further unestablished premises that
      Dionysian wine was itself drugged and that a community transferred the
      practice rather than the picture.
  - claimId: TIK-C005
    verdict: well_supported
    confidence: moderate
    reasoning: The 2026 experiment, across a 48-run design with NMR and
      UHPLC/Q-TOF-HRMS confirmation, showed complete hydrolysis of the six
      predominant toxic ergopeptides at 5 percent w/v ergot, initial lye pH
      12.5, and 120 minutes of reflux, with LSA and iso-LSA appearing at 0.54
      and 0.48 mg per gram of ergot. That is a real chemical result, and it
      closes the classic toxicity objection at the level of possibility; the
      authors are explicit that they demonstrated feasibility, not ancient
      practice. The strongest opposing consideration is that the work was
      performed once, by a team including the hypothesis's originators and
      members of an entheogen-research center, using modern pH control, and that
      weaker or shorter treatments left poison detectable — so the historical
      reconstruction now requires a specific controlled technology no source
      attests, and independent replication is still outstanding.
  - claimId: TIK-C006
    verdict: mixed
    confidence: moderate
    reasoning: "LSA reaches the brain, is psychoactive, and can produce
      hallucinations and euphoria, and modern psilocybin trials show that
      pharmacologically occasioned mystical-type experience is real — but
      psilocybin is not LSA, and those trials are analogy, not history. The 2025
      systematic review documents prominent nausea, autonomic effects, anxiety,
      and occasional severe outcomes in the human LSA literature, which is
      dominated by morning-glory-seed exposures rather than lye-processed ergot.
      The strongest opposing consideration is the claim as stated: nothing
      establishes that an iso-LSA-heavy crude extract at about one gram of ergot
      per initiate would reliably deliver the profound, largely positive
      experience attributed to Eleusis rather than an unpleasant sedated one,
      and the full reconstructed mixture has never been profiled."
  - claimId: TIK-C008
    verdict: unresolved
    confidence: moderate
    reasoning: The Mysteries produced extraordinary testimony; both a
      pharmacological generator and a ritual generator, and a mixed model, can
      explain that testimony, and no evidence record in this case adjudicates
      among them. Griffiths 2006 shows that a drug route to mystical-type
      experience is real in a modern lab and does not speak to a fourth-century
      BCE sanctuary; the ritual-sufficiency model is the mainstream default,
      held here partly as a prior because Burkert's canonical wording has not
      been independently audited in this ledger. The strongest opposing
      consideration to the claim as stated — that ritual was insufficient and a
      drug was required — is that two millennia of stable, scalable operation on
      fasting, procession, secrecy, sensory contrast, drama, and mass emotion is
      exactly what the non-drug model predicts, and it requires no secret
      ingredient, supply chain, or dosing control.
  - claimId: TIK-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The affirmative case is circumstantial scaffolding: a workable
      ancient-available chemical pathway, one unreplicated Iberian analogue in a
      Demeter/Kore setting, and a canonical recipe whose barley is ergot's host,
      around a cell that is still empty because no vessel from Eleusis has ever
      been chemically analyzed. Against it stand the Hymn's silence on any
      additive, Clinton's point that publicly audited sanctuary accounts track
      grain into sacrifices and dedications rather than drug production, the
      unattested two-hour alkaline technology the 2026 result now requires, and
      the methodological critique that this literature promotes possibility into
      fact. The strongest opposing consideration is the empty cell itself plus
      distance: analogy from Spain and feasibility in a modern flask are not a
      detection at the sanctuary, and an untested absence is not a positive."
  - claimId: TIK-C010
    verdict: unresolved
    confidence: moderate
    reasoning: No securely identified early-Christian liturgical vessel has
      undergone organic residue analysis, so the claim is testable and untested
      rather than measured in either direction. Surrounding capability is real,
      and the nearest cup-manipulation text — Irenaeus on Marcus — is hostile
      heresiology describing a conjuring trick and love-philters, not a
      psychedelic sacrament. The strongest opposing consideration is that after
      intensive archaeology and philology of early Christianity, no text, image,
      or object independently indicates a psychoactive Eucharist anywhere, the
      book's own scientific witness calls the connecting evidence extremely weak
      to nonexistent, and a claim currently running entirely on capability and
      analogy has not yet paid for an instance.
  - claimId: TIK-C011
    verdict: contradicted
    confidence: high
    reasoning: The earliest descriptions of the rite in this ledger — the Didache's
      berakah-style thanksgivings over cup and bread, and Justin's detailed
      account of bread and wine mixed with water, received not as common food
      but christologically — describe a Jewish thanksgiving meal, and Justin
      frames pagan mystery parallels as demonic imitation rather than
      inheritance. The author himself does not hang his hat on a psychedelic
      Last Supper, and intra-movement as well as specialist reviews reject the
      strong form. The strongest opposing consideration is that these are
      normative insider texts written decades after the events they describe, so
      a secret ingredient is exactly what they might omit; that objection makes
      the claim hard to kill by text alone, and no early-Christian vessel has
      been tested, but it does not convert a contradicted documentary record
      into support.
  - claimId: TIK-C012
    verdict: unresolved
    confidence: moderate
    reasoning: No evidence record in this case supports a documented transmission
      vector — communities in contact handing on an uncommon pharmacological
      recipe, shared ritual handling, or a vessel chain — from a Greek mystery
      sacrament into the Christian cup. What stands in its favor is
      low-specificity cultural contact and wine-immortality symbolism, which
      would be unsurprising without inheritance, plus Johannine literary
      parallels that even if granted do not move a molecule. Against it are the
      Jewish form of the earliest Eucharistic texts, McGovern's repudiation,
      Bremmer's and Ehrman's rejections, Brown's intra-movement verdict that the
      grand theory fails on overreach, and the author's own "Where are the
      drugs?" The strongest opposing consideration to leaving the claim open is
      that this is an ambitious historical-continuity claim whose necessary
      framework (TIK-C013) is contradicted and whose Christian instance
      (TIK-C011) is contradicted, so unresolved must not be mistaken for a live
      circumstantial case; it records that secret transmission has not been
      chemically closed, not that the evidence presently favors it.
  - claimId: TIK-C013
    verdict: contradicted
    confidence: high
    reasoning: The Didache's Eucharistic prayers are Jewish table blessings in form
      and content — the holy vine of David, broken bread, no mystery-cult
      vocabulary — and Justin's First Apology describes ordinary bread and
      wine-with-water while treating the Mithraic meal as a wicked imitation of
      the Christian one. Bremmer's recorded judgment that Christianity was not a
      mystery cult matches that documentary direction, and the derivation
      framework the book inherits is the one modern Christian-origins
      scholarship has rejected. The strongest opposing consideration is that
      first-century Judaism was itself Hellenized, so a hard "Jewish versus
      pagan" dichotomy can be overdrawn; that observation does not supply the
      specific mystery-cult initiation pathway the framework needs, and the
      burden of showing one has not been met.
