  synthesis: "The featured hypothesis is a ladder, and the rungs diverge too far
    for any single verdict besides mixed — a substantive finding, not a hedge.
    The floor is settled by direct chemistry from independent teams (Arad, Es
    Càrritx, the Bes vessel): ancient ritual pharmacology is fact. The mechanism
    rung is real but thin: the 2026 lye-hydrolysis result is rigorous,
    quantitative, and peer-reviewed, yet performed once, by the hypothesis's own
    network, and it raises the historical bar rather than lowering it — the safe
    pathway is a specific two-hour, strongly alkaline technology no ancient
    source attests. Steelmanning the pro side: ergot is the one psychoactive
    organism the canonical barley recipe actually invites; Mas Castellar puts
    that fungus, ingested, in a Demeter-cult context; secrecy laws explain the
    textual silence; the Eleusinian absence is an untested absence, so skeptics
    arguing from it overreach symmetrically; and the decisive test is cheap and
    blocked only by permission. Steelmanning the con side: above the floor,
    every rung stacks unattested elements — a secret ingredient, a secret
    technology, then a secret transmission — against an audited sanctuary
    economy showing no such expenditure, a thousand-kilometer gap to the one
    datum, and a documented genre pattern of solidifying possibility into
    \"fact.\" The Christian half splits decisively: the strong form (original
    psychedelic Eucharist) is contradicted by every early document, which
    uniformly describe a Jewish thanksgiving meal, and the author concedes as
    much; the minimal form (some community, somewhere) is honestly unresolved
    because zero vessels have been tested, though the textual prior is low.
    Transmission is the weakest load-bearing element: contact and
    wine-and-immortality symbolism are ubiquitous and unsurprising without
    inheritance, and no vector — people, recipes, vessels — has been documented
    in twelve years of motivated searching. One caveat on my own weighing: the
    plausibility of the ergopeptide chemistry leans partly on general chemical
    background, not only on the records. Funding interest networks surround the
    research program and this ledger alike; replication, not provenance, must
    decide."
