  synthesis: "The case file assesses the strong, conjunctive form of the thesis: a
    deliberately prepared ergot kykeon at Eleusis AND inheritance of that
    psychoactive sacrament by the earliest Greek-speaking Christians as the
    original Eucharist. Graded as a conjunction, that thesis is contradicted —
    not because every rung fails, but because one indispensable rung
    (TIK-C011/TIK-C013, the Christian terminus) is contradicted by the only
    direct descriptions of the rite we possess, and a second (TIK-C012, the
    transmission vector) has no evidence of any specificity in its favour. A
    conjunction inherits the fate of its worst conjunct, and the verdict should
    not be softened to \"mixed\" merely because the ladder's lower rungs are
    healthy. That said, the negative verdict must be read narrowly: it applies
    to the packaged thesis, not to each part. Steelmanning the proponents: the
    background rung is genuinely established by independent residue chemistry
    (TIK-C001); the classic toxicity objection has been retired at the level of
    possibility by a peer-reviewed 48-run experiment whose chemistry is also
    independently plausible on textbook grounds (TIK-C005); there is one real
    substance-in-cult-context datum (TIK-C004); and — the case's most important
    structural fact — the decisive measurement at Eleusis has never been
    attempted, so the Greek half rests on an untested absence, not a tested one.
    Steelmanning the sceptics: the only ancient recipe names nothing
    psychoactive, the required alkaline technology is attested nowhere, the
    sanctuary's audited stone accounts show grain used conventionally, the one
    archaeological datum is a single unreplicated 2002 analysis whose primary
    text the case has not even obtained, the pharmacology of the reconstructed
    extract has never been profiled and the human LSA record is dysphoric as
    often as visionary, and the earliest Eucharistic documents are Jewish table
    liturgies whose second-century apologist frames pagan parallels as imitation
    rather than inheritance. Almost all negative weight on the Christian side is
    documentary and testimonial rather than chemical, which is why TIK-R005
    matters: the ledger currently contains zero measurements on either disputed
    site, and both halves are cheaply decidable. Diagnosticity discipline is the
    case's real contribution — nothing at Arad, Menorca or Pinwheel Cave is
    evidence about an Attic cup."
claimAssessments:
  - claimId: TIK-C001
    verdict: established
    confidence: high
    reasoning: "Four independent evidence records from independent teams and
      materials converge: cannabis residue on the Arad altar, alkaloids measured
      directly in human hair at Es Càrritx, a multi-plant fermented preparation
      in the Bes vessel, and chewed Datura quids at Pinwheel Cave. Two of these
      measure compounds in human tissue or ingested material, which is
      consumption evidence rather than proximity. The strongest opposing
      consideration is heterogeneity of quality — the Bes vessel is an
      unexcavated 1960 market purchase and Pinwheel Cave is outside the region
      entirely — but the claim as stated (deliberate ritual use in the ancient
      Mediterranean and Near East) survives on Arad and Es Càrritx alone, and
      the field's documented failure mode (Balabanova-style contamination) is
      addressed by modern controls in these studies."
  - claimId: TIK-C002
    verdict: well_supported
    confidence: moderate
    reasoning: "The Dioscoridean tradition of wine steeped with henbane, mandrake
      and black nightshade is textually secure in the broad pharmacological
      record, and the Bes-vessel chemistry shows compound psychotropic ritual
      drinks were physically real in the Hellenistic Mediterranean. Confidence
      is held at moderate rather than high because the only evidence record in
      this file (TIK-E005) is a proponent's summary of Dioscorides given in a
      friendly venue, with exact book-and-chapter locators still unpulled — a
      secondhand anchor for a claim that general background makes independently
      plausible. The strongest opposing consideration is denominator-free
      inference: the surviving recipes are medical and magical, with stated
      indications, so capability evidence must not be silently reclassified as
      evidence about cult sacraments, and TIK-R008's missing base rate leaves
      each spectacular positive uncalibrated."
  - claimId: TIK-C003
    verdict: established
    confidence: high
    reasoning: "This is a claim about what a text says, and the text was read
      directly: Demeter refuses wine and asks for meal and water mixed with soft
      mint, with no further ingredient and no processing step, and no ancient
      source elsewhere names ergot in the kykeon. Within the limits of the
      claim's own scope it is as secure as textual evidence gets. The strongest
      opposing consideration cuts against overuse rather than truth: the
      Mysteries were secret by law, so a public aition would omit a secret
      ingredient — and would look identical if there was none, which is why this
      claim cannot settle the substantive question in either direction. Note
      also that the Hymn is myth-etiology, not a liturgical manual, so actual
      sanctuary practice is underdetermined by it."
  - claimId: TIK-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: "A published 2002 archaeobotanical analysis reported ergot fragments
      in a ceremonial vessel and in a young man's dental calculus at a
      Demeter/Kore-linked Iberian site; microremain identification of Claviceps
      sclerotia fragments is a routine task, and the find is cited with
      page-level references in a 2026 peer-reviewed paper. But the evidential
      chain here is thin in an unusual way: the primary chapters have not been
      obtained by this case at all, so every statement about sampling, controls
      and context is secondhand, and the analysis has never been independently
      replicated in twenty-four years. The strongest opposing consideration is
      documented source drift — \"fragments of ergot identified\" hardening
      downstream into \"hallucinogenic alkaloids chemically detected\" — which
      means the version circulating in the debate is demonstrably stronger than
      the record supports. TIK-R004's desk half would settle the grading almost
      for free."
  - claimId: TIK-C009
    verdict: mixed
    confidence: low
    reasoning: "Within this file the only evidence is a proponent's Harvard summary
      citing Nock and MacDonald on Cana, the Elis water-to-wine tradition and
      the \"true vine\" — a real scholarly position rather than an invention,
      but presented secondhand and never weighed against the alternative reading
      in an evidence record of its own. General background supports that a
      Dionysian foil for Johannine wine motifs is genuinely argued in Johannine
      scholarship without being consensus, which is why \"mixed\" rather than
      \"unresolved\" fits: the parallel's existence is arguable, its authorial
      deliberateness contested. The strongest opposing consideration is that
      abundant-wine and vine imagery is thoroughly at home in Jewish
      eschatological tradition, so the similarity is unsurprising without any
      Dionysian intent — and in any case a literary allusion transmits no
      pharmacology."
  - claimId: TIK-C005
    verdict: well_supported
    confidence: moderate
    reasoning: "A 48-run peer-reviewed experiment with 1H-NMR and UHPLC/Q-TOF-HRMS
      confirmation reports complete hydrolysis of all six predominant
      ergopeptides and their epimers at 5% w/v ergot, initial lye pH 12.5 and
      120 minutes reflux, with 0.54 mg LSA and 0.48 mg iso-LSA per gram of
      ergot. General chemical background raises this above single-study status:
      ergopeptines are peptide amides of lysergic acid, so alkaline cleavage to
      lysergamides with C-8 epimerisation is the expected reaction, which is why
      I grade it well_supported despite the interested-network authorship. The
      strongest opposing consideration is robustness rather than existence: the
      paper's own data show lower pH or shorter treatment leaves toxic
      ergopeptides detectable, so the safety envelope for a sensory-cue-guided
      ancient operator is untested, the extract's full composition unprofiled,
      and no disinterested laboratory has repeated it (TIK-R002). Feasibility is
      also, as the authors state, not evidence of practice — and the successful
      condition implies a specific controlled technology, making the historical
      reconstruction more demanding, not less."
  - claimId: TIK-C006
    verdict: weakly_supported
    confidence: moderate
    reasoning: 'The claim conjoins four things and the evidence stops at the third:
      LSA reaches the brain, is psychoactive, and can produce hallucinations and
      euphoria (TIK-E012), but nothing supports the reliability and positive
      valence at achievable dose that the claim asserts. The same systematic
      review documents prominent nausea, autonomic effects, anxiety and
      occasional severe outcomes, which points against rather than towards the
      "best night of your life" phenomenology, and the yield figures imply
      roughly a milligram of combined lysergamides per gram of ergot — a
      marginal extrapolation for a mass-administered rite. The strongest
      opposing consideration is matrix mismatch in the other direction: the
      human record is dominated by morning-glory-seed exposures whose vegetative
      burden may come from seed constituents rather than LSA itself, and the
      reconstructed extract has never been profiled (TIK-R003), so the negative
      signal is suggestive rather than decisive. TIK-E013 shows only that some
      pharmacology can occasion mystical experience, not that this one would.'
  - claimId: TIK-C008
    verdict: unresolved
    confidence: moderate
    reasoning: The claim as stated is a necessity claim — that ritual mechanisms
      were insufficient — and nothing in the file tests it. Both the
      pharmacological and ritual models explain the same non-specific
      testimonia, the mixed model would survive almost any single finding, and
      even the mainstream ritual-sufficiency position is carried here as
      unaudited background (Burkert unverified, TIK-R007 unperformed). Modern
      psilocybin trials establish that the pharmacological route to
      mystical-type experience exists, which is a possibility claim, not a
      necessity claim. My priors — drawn from general background on fasting,
      sensory manipulation, expectancy and collective ritual, plus the rite's
      two millennia of stable, scalable operation without a documented supply
      chain — lean against necessity, and that is the strongest opposing
      consideration to my verdict; but a prior is not a test, so "unresolved" is
      the honest grade and the affirmative burden remains unmet.
  - claimId: TIK-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: "There is a genuine circumstantial structure — a feasible chemical
      pathway (TIK-C005), one substance-in-cult-context analogue (TIK-C004),
      barley as ergot's host — and the absence at Eleusis is an untested
      absence, since no sanctuary vessel has ever been analysed. But the
      affirmative case has zero direct evidence at the target site, and the
      counter-record is specific rather than merely silent: the only recipe
      names nothing psychoactive, the required strongly alkaline multi-hour
      process is attested nowhere, and the sanctuary's publicly audited stone
      accounts track grain into sacrifices and dedications. The strongest
      opposing consideration to grading it this low is that the decisive test is
      blocked administratively rather than scientifically, so the empty cell
      reflects neglect and permission politics rather than searching and failing
      — proponents are entitled to that asymmetry. Weakly_supported, not
      unresolved, because the evidence that does exist is real but a thousand
      kilometres and several inferential steps away."
  - claimId: TIK-C010
    verdict: unresolved
    confidence: moderate
    reasoning: 'This is the rare claim that is genuinely testable and simply
      untested: no securely identified early-Christian liturgical vessel has
      ever undergone residue analysis, so the claim currently runs entirely on
      ambient capability (TIK-C002) and the diversity of first-century
      Christianity. The one candidate text is Irenaeus on Marcus, which read
      plainly is hostile heresiology about a cup-colour conjuring trick and love
      philters — evidence that cup manipulation was thinkable and scandalous,
      not that anything psychoactive was consumed sacramentally. The strongest
      opposing consideration to "unresolved" is that after a century of
      intensive early-Christian philology and archaeology no text, image or
      object independently indicates a psychoactive Eucharist anywhere, which is
      mild but real evidence against; I stop short of a negative verdict because
      the relevant material has never been interrogated with the one method that
      could detect it (TIK-R005), and a single positive would establish a
      practice somewhere without establishing a norm.'
  - claimId: TIK-C011
    verdict: contradicted
    confidence: moderate
    reasoning: "Every earliest description of the rite we possess — Paul in 1
      Corinthians, the Didache's berakah-style thanksgivings over cup and bread,
      Justin's detailed account of bread and wine mixed with water — describes
      ordinary elements in Jewish thanksgiving form, and Justin's own framing
      makes the mystery parallel demonic imitation rather than shared
      inheritance. The proponent himself declines to defend this form (\"I don't
      hang my hat on that claim\"), which is a concession with evidential weight
      against the marketed version. The strongest opposing consideration is that
      all these witnesses are normative insider texts written decades after the
      events, and a secret ingredient is precisely what such texts would omit —
      but that objection makes the claim unfalsifiable by text rather than
      supported by it. The contradiction is documentary, not chemical: no early
      Christian vessel has been tested, so the verdict is revisable in principle
      by TIK-R005."
  - claimId: TIK-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: Inheritance requires a documented vector — communities in contact,
      shared uncommon recipes, shared ritual handling — and none exists; the
      affirmative case is cultural contact plus shared wine-and-immortality
      symbolism plus the Johannine parallels, all of near-zero diagnosticity
      because such similarity is exactly what one expects without transmission.
      Against it stand the Jewish form of the earliest Eucharistic texts, the
      repudiation by the book's own consulted archaeochemist, two senior
      specialists on mystery cults and Christian origins, a sympathetic
      intra-movement reviewer who calls the grand theory overreach, and the
      author's own "where are the drugs?" concession. The strongest opposing
      consideration to grading it any higher is that most of that negative
      weight is testimony and absence rather than measurement. I note that on
      the strong reading actually asserted — that the earliest Greek-speaking
      Christians inherited the practice — the same documentary record that
      contradicts TIK-C011 pushes this close to contradicted; I retain
      weakly_supported only because the vector's absence is not itself a
      refutation, and because the claim's conjuncts (TIK-C007, TIK-C010) remain
      untested rather than falsified.
  - claimId: TIK-C013
    verdict: contradicted
    confidence: moderate
    reasoning: The earliest Eucharistic material is Jewish table liturgy in form and
      content — the Didache's thanksgivings over the cup ("the holy vine of
      David") and broken bread, with no mystery-cult vocabulary — and the
      earliest detailed liturgical description explicitly casts the Mithraic
      parallel as imitation of the Christian rite. Specialists in the two
      relevant fields state the framework flatly fails ("Christianity was not a
      mystery cult"), and while consensus is not proof, a framework claim
      rejected by the fields best positioned to test it and unsupported by any
      documentary vector carries an unmet burden of production. The strongest
      opposing consideration is that first-century Judaism was itself Hellenised
      and Greco-Roman association meal practice plausibly shaped Christian
      communal dining, so "Jewish versus pagan derivation" is partly a false
      dichotomy — but that observation does not supply the specifically
      mystery-cult initiation pathway the framework needs, and it is that
      specific pathway that the record contradicts.
