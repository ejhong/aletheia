    floor (TIK-C001, TIK-C003), a genuinely moved mechanism rung (TIK-C005), a
    live but under-evidenced attribution at Eleusis (TIK-C007), an untested
    minimal Christian claim (TIK-C010), and two contradicted Christian rungs
    (TIK-C011, TIK-C013). 'Unresolved' is the right word when the record cannot
    adjudicate; here it adjudicates decisively in places and is simply empty in
    others. Mixed carries that structure without laundering it. Only TIK-C008 is
    properly unresolved, and it stays that way at claim level. I do not follow
    Opus 5 to contradicted. Grading the packaged conjunction is a legitimate
    reading, and I accept its logic where it bites — the strong public thesis
    does fail because TIK-C011/TIK-C013 fail. But a case-level 'contradicted'
    would report a refutation of the Eleusinian half, and that half rests on an
    untested absence (TIK-E009): no vessel from Eleusis has ever been analyzed.
    Marking an unrun measurement as refuted is exactly the diagnosticity error
    Opus's own synthesis warns against, in the opposite direction. The
    contradiction is registered where it belongs, on the claims. I also do not
    follow Gemini to weakly_supported. That grade averages the ladder: it
    converts documentary contradiction — Paul, the Didache, Justin describing
    bread and wine in Jewish thanksgiving form (TIK-E022, TIK-E023), plus
    McGovern's and Bremmer's testimony (TIK-E017, TIK-E018) — into thin positive
    support, and simultaneously understates the established floor. Gemini's
    substantive reading is nearly identical to mine; only the roll-up label
    differs, and the label it chooses hides the split it correctly describes.
    Independence discipline is unchanged: TIK-C005 has one performance by
    interested-network authors, TIK-C004 is a single 2002 analysis seen through
    secondary citation, and TIK-E027 documents that the lab best placed to run
    the decisive tests is funded by the hypothesis's author and this project's
    founder. Feasibility of lye hydrolysis is not occurrence at Attica; repeated
    citation of Mas Castellar is not replication."
