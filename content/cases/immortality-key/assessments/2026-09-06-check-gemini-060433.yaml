  synthesis: >-
    The overarching hypothesis that the Eleusinian Mysteries centered on an
    ergot-derived psychedelic beverage, which subsequently passed through
    Dionysian rites into early Christian Eucharistic practice, breaks down upon
    rigorous structural evaluation. While the broader cultural background
    demonstrates that ancient Mediterranean populations were capable of
    compounding botanical preparations for ritual and medicinal purposes, the
    specific historical chain linking Eleusis to the Christian sacraments lacks
    evidential continuity. The strongest element supporting the Greek half of
    the hypothesis is modern chemical feasibility: recent experimental work
    confirms that hot alkaline hydrolysis can convert toxic ergot peptides into
    psychoactive lysergamides, and archaeological finds in Iberia show ergot
    presence in a Demeter-associated context. However, translating theoretical
    chemical viability into historical reality at Eleusis remains blocked by a
    complete absence of residue data from the Attic sanctuary itself, epigraphic
    accounts detailing conventional agricultural spending rather than
    specialized drug processing, and a foundational liturgical text that
    mentions only simple grains, water, and mint.


    The Christian extension of the thesis is considerably more fragile. The
    argument that early Eucharistic meals were psychedelic concoctions inherited
    from mystery cults directly conflicts with primary liturgical documents such
    as the Didache and Justin Martyr, which firmly anchor early Christian
    practices in Second-Temple Jewish table blessings over standard bread and
    wine. Furthermore, textual references to manipulated communal cups are found
    almost exclusively in hostile polemical writings describing magical deceit
    rather than accepted liturgy. Proponents of the theory have themselves
    acknowledged the lack of direct physical evidence and retreated from
    asserting a psychedelic Last Supper during scholarly exchanges. In terms of
    sensitivity, the single most critical piece of evidence currently supporting
    the plausibility of the Greek component is the 2026 alkaline hydrolysis
    study; if that record were removed, the ergot hypothesis would revert to
    being chemically dubious due to ergotism toxicity, though the ultimate
    verdict of weak support for the grand narrative would endure.
  steelman: The identification of ergot residues in a ceremonial vessel and in
