  synthesis: >-
    The overarching hypothesis that an unbroken, secret psychoactive tradition
    linked the Eleusinian Mysteries, Dionysian cults, and early Christian
    Eucharistic liturgy rests on a multi-stage evidentiary bridge where earlier
    rungs are scientifically credible but subsequent transmission rungs remain
    unsupported or contradicted. On the background level, the archaeobotanical
    record clearly establishes that ancient Mediterranean populations utilized
    psychotropic substances in ritual and medicinal contexts, ranging from
    cannabis at Iron Age Tel Arad to alkaloid-infused beverages in Ptolemaic
    Egypt and Iberian burial caves. Furthermore, modern chemical analysis has
    validated the chemical plausibility of detoxifying Claviceps purpurea via
    alkaline wood-ash hydrolysis into psychoactive ergolines (LSA/iso-LSA),
    neutralizing the classic objection that raw ergot ingestion would invariably
    cause fatal or disabling ergotism. Coupled with the discovery of ergot
    remains within a Demeter-associated shrine at Mas Castellar de Pontós, the
    proposition that some ancient Greek or Hellenized rites engaged ergot
    pharmacology is an empirically viable hypothesis.


    However, the strong public form of the case collapses upon transition to
    Attica and Christian origins. First, at Eleusis itself, no direct
    archaeochemical evidence exists; the sanctuary's public financial stone
    records fail to indicate any specialized botanical acquisitions, and the
    foundational mythological recipe contains only common non-psychoactive
    foodstuffs. Additionally, asserting that non-pharmacological ritual drivers
    are inherently insufficient to produce profound transformations misjudges
    the documented potency of sensory deprivation, communal fasting, and
    religious drama. Second, the Christian extension lacks material backing:
    early church liturgies, from the Didache to Justin Martyr, demonstrably
    situate the Eucharist in Second-Temple Jewish blessing meals rather than
    mystery-cult rituals. Crucially, the primary proponent has on the record
    conceded the absence of direct evidence for a psychedelic Last Supper or
    continuous transmission, and leading analytical partners have repudiated the
    synthesis. The case verdict is most sensitive to the laboratory hydrolysis
    data (TIK-E008); were that paper removed, the central chemical mechanism
    would revert to unsubstantiated speculation, though removing it would still
    leave the overall verdict weakly supported due to the profound deficiencies
    of the transmission claims.
