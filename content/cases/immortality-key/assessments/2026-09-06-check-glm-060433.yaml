  synthesis: "The case's ladder is real at its base and broken at its top. The
    observation rungs stand on measured chemistry from four independent
    archaeochemical findings, including alkaloids recovered from human hair (Es
    Càrritx) and a cult-context find in the Near East (Tel Arad), so deliberate
    ancient ritual psychoactive use is no longer speculative. The mechanism rung
    moved from a 26-year-old proposal to demonstrated feasibility in the 2026
    hydrolysis experiment — but by a team including the hypothesis's
    co-originator and an entheogenic-research center, unreplicated, and under
    demanding conditions (strong lye, two hours' reflux, complete conversion
    only at the highest pH) that now require an attested processing technology
    no ancient source names. The pharmacology rung stops short of the claim: LSA
    is psychoactive and can occasion hallucinations, but the systematic review
    documents prominent adverse effects and lower potency, and the reconstructed
    preparation has never been profiled, so \"reliably profound and largely
    positive\" remains asserted rather than measured. The Greek attribution
    (TIK-C007) rests on a single unreplicated 2002 find a thousand kilometers
    from Eleusis, seen by this ledger only through downstream citations, set
    against a canonical recipe naming nothing psychoactive and an audited
    sanctuary economy whose expert reader reports no drug expenditure; the
    decisive cell — residue analysis of Eleusinian vessels — is empty because
    permission was never granted, which qualifies both directions but pays for
    neither. The Christian extension is weaker still: the earliest liturgical
    documents (Didache, Justin) show Jewish berakah form and ordinary bread and
    wine-with-water, the second century's own borrowing polemic runs opposite to
    the inheritance thesis, the only \"drugged cup\" text is hostile heresiology
    about a conjuring trick, and the author himself declines to defend the Last
    Supper claim and concedes the transmission step is open. Independence
    accounting cuts both ways and is recorded rather than resolved: pro-side
    chemistry carries network co-authorship, the positioned testing program is
    funded by the hypothesis's author and this project's own founder, and the
    strongest methodological critique comes from an abstract-level read.
    Sensitivity: the 2026 feasibility paper (TIK-E008) is the single record
    whose removal would most change this assessment — without it, TIK-C005
    reverts to proposal status and TIK-C007 loses its mechanism rung entirely;
    the overall verdict would survive (the Christian half is contradicted by
    documentary evidence independent of that paper, and the background rungs do
    not depend on it), but the Greek side would drop from weakly_supported
    toward unresolved. The honest structural finding is a split case: supported
    background, feasible but unreplicated chemistry, a thin and contested Greek
    attribution, and a strong-form Christian thesis that the record positively
    contradicts."
  steelman: "No evidence record in this case can answer the convergence the 2026
    chemistry creates with Mas Castellar de Pontós: ergot fragments inside a
    ceremonial vase and in the dental calculus of a young man — direct ingestion
    evidence — at a sanctuary of the two Eleusinian Goddesses, now paired with a
    wood-ash method technically available in antiquity that demonstrably
    converts that same fungus's toxic ergopeptides into LSA and iso-LSA. The
    skeptic's remaining weapons (the Homeric Hymn's silent recipe, Clinton's
    audited accounts, the untested empty cell at Eleusis) all concern Attica,
    and the audited-accounts argument by its own framing cannot cover an
    ingredient gathered from the Rarian plain rather than purchased; meanwhile
    no Eleusinian vessel has ever been chemically analyzed because permission
    was never granted. The hypothesis's central prediction is therefore live,
    specific, and testable with methods already normalized at Arad, Es Càrritx,
    and the Bes vessel — replicated ergoline residues in curated sanctuary
    ceramics would flip TIK-C007 in a single stroke — and nothing in the
    supplied record closes that possibility."
