  synthesis: >-
    The supplied record establishes a broad historical background in which
    psychoactive substances were deliberately used in ancient ritual and
    psychoactive botanicals could be compounded with fermented or wine-based
    liquids. It also provides a substantial mechanistic advance: the 2026
    experiment shows that strong wood-ash-type lye under controlled heating can
    convert monitored ergot ergopeptides into LSA and iso-LSA. These findings
    make an ergot-derived kykeon chemically possible and render blanket claims
    that ancient ritual pharmacology was culturally or technically impossible
    untenable. The reported Mas Castellar find further supplies a potentially
    important analogy involving ergot, consumption evidence, and a sanctuary
    associated with Demeter and Kore.

    Those points do not establish the strong featured hypothesis. The Mas
    Castellar report is available here only through the same 2026 paper that
    supplies the hydrolysis experiment; its primary publication has not been
    obtained, and the material has not been independently reanalyzed. Thus the
    principal archaeological analogy and the principal chemical mechanism are
    neither evidence from Eleusis nor fully independent strands. At Eleusis
    itself, the sole recorded recipe names meal, water, and mint, while no text
    records ergot or the demanding alkaline preparation. The audited-account
    argument and lack of residue evidence add negative pressure, although both
    remain limited: the inscriptions were presented through journalism, and
    Eleusinian vessels have apparently never received a systematic residue
    survey. The Greek claim is therefore weakly supported rather than decisively
    refuted.

    The pharmacological bridge is also incomplete. LSA can be psychoactive and
    hallucinatory, but the supplied review describes variable, often unpleasant
    human effects. No study has tested the complete reconstructed ergot extract,
    so the claim that approximately one gram would reliably produce a profound,
    positive initiation experience outruns the evidence. Nor does the modern
    psilocybin study show that Eleusinian reports required a drug rather than
    expectancy, fasting, spectacle, secrecy, and collective ritual.

    The strong case fails most clearly in its Christian extension. The Didache
    presents Jewish-style thanksgiving over cup and bread, and Justin describes
    bread and wine mixed with water while polemically distinguishing Christian
    practice from pagan mysteries. Irenaeus supplies no psychedelic Eucharist:
    his Marcosian account describes an alleged cup trick and separate
    love-philter accusations in hostile polemic. No residue measurement,
    ingredient text, or historical transmission chain connects a psychoactive
    mystery sacrament to the earliest Christian Eucharist. Johannine wine and
    vine parallels can support literary engagement with Dionysian symbolism, but
    imagery is not evidence of shared pharmacology or institutional inheritance.
    The author's own recorded concessions expressly leave the Last Supper,
    Dionysian pharmacology, and transmission unestablished.

    The strongest pro-hypothesis synthesis is therefore a coherent possibility:
    ancient ritual drug use occurred, visionary fermented preparations existed,
    ergot appears at one Demeter/Kore-linked site, and an anciently available
    process can produce psychoactive lysergamides. The strongest countercase is
    structural: each move from possibility to Eleusis, from chemistry to
    reliable phenomenology, and from Greek imagery to Christian inheritance
    lacks the required measurement or historical bridge, while the earliest
    Christian documents positively favor a Jewish meal matrix. Because the
    featured strong form is conjunctive, its contradicted Christian-origin
    branch defeats it even though the narrower Eleusinian hypothesis remains
    testable.

    TIK-E023 is the single record whose removal would most alter the case
    assessment because it is the earliest supplied liturgical evidence directly
    supporting the Jewish-meal alternative. The contradicted verdict survives
    its removal: TIK-E022 independently describes ordinary bread and
    wine-with-water, while the absence of a transmission record, the author's
    concessions, and the weakness of the alleged Christian pharmacological
    evidence remain.
  steelman: "The reported combination of ergot in a ceremonial vessel and human
