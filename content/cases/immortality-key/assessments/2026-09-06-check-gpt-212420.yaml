  synthesis: >-
    The strong featured hypothesis is a conjunction of several propositions that
    receive sharply different levels of support. Its broad background is sound:
    direct chemical and archaeological evidence establishes deliberate
    psychoactive use in ancient ritual settings, and the record supports the
    existence of fermented or wine-based botanical preparations. The 2026
    experiment also makes a real mechanistic contribution. Under a demanding
    high-pH, two-hour heated treatment, wood-ash-type lye converted monitored
    ergot ergopeptides into LSA and iso-LSA. That result defeats the categorical
    objection that an ergot preparation could not have been made less toxic with
    anciently available materials. It establishes feasibility, however, not
    historical use, practical robustness, human safety, or the reliably positive
    visionary pharmacology required by the theory.

    The Eleusinian attribution remains only weakly supported. The reported Mas
    Castellar find is the closest archaeological analogue: ergot was reportedly
    identified in a ceremonial vessel and dental calculus at an Iberian
    sanctuary associated with Demeter and Kore. Yet this is one unreplicated
    result whose primary publication was not obtained, and the present record
    knows it through the same 2026 proponent-network paper that supplies the
    processing experiment. It is therefore neither an independent confirmation
    nor evidence from Eleusis itself. At Eleusis, no residue survey has been
    conducted. The Homeric Hymn names meal, water, and mint but no ergot, while
    the reported audited sanctuary accounts contain no drug expenditure or
    ergot-processing trace. Secrecy limits both negative arguments, but it does
    not supply the missing affirmative evidence. Nor does the human LSA
    literature support the stronger assertion that roughly one gram of processed
    ergot would reliably produce a profound, predominantly positive experience;
    the recorded effects include hallucinations and euphoria but also
    substantial nausea, autonomic effects, anxiety, and occasional severe
    outcomes.

    The Christian extension is where the strong case fails rather than merely
    remaining incomplete. No record measures psychoactive material in an early
    Christian Eucharistic vessel, identifies a psychedelic Eucharistic recipe,
    or documents transmission from a Greek mystery cult. Irenaeus describes a
    hostile fraud narrative and separate philter accusations, not a psychedelic
    sacrament. By contrast, the Didache presents Jewish-style thanksgiving over
    cup and bread, and Justin describes bread and wine mixed with water while
    polemically distinguishing Christianity from pagan mysteries. These sources
    are normative and cannot exclude every marginal community, so the
    existential claim that some community used psychoactives remains unresolved.
    They do, however, contradict the stronger claims that the original and
    earliest documented Eucharist was psychedelic and that it developed from
    mystery-cult practice rather than Jewish meals. The author's own recorded
    concessions independently acknowledge that he does not defend a psychedelic
    Last Supper and that both Dionysian pharmacology and Christian transmission
    are major unfilled gaps.

    Source counts would exaggerate independence here. The Dioscorides,
    Johannine, and concession records derive from one Harvard transcript;
    several critical expert quotations derive from one Reason article; and the
    Mas Castellar report and ergot-processing result are linked through the 2026
    interested-author network. Even after discounting testimony and duplicated
    provenance, the direct Didache, Justin, Homeric Hymn, experimental
    chemistry, and pharmacology records preserve the same structure: ancient
    ritual psychoactivity is established, processed ergot is chemically
    possible, Eleusinian use is weakly supported, and the asserted Christian
    inheritance is contradicted.

    The single record whose removal would most change the case verdict is
    TIK-E023, because the Didache is the earliest direct liturgical evidence
    here and most clearly locates Eucharistic form and language in a Jewish meal
    matrix. The contradicted verdict survives its removal: TIK-E022 still
    describes ordinary bread and wine-with-water, TIK-E024 records the
    proponent's abandonment of the Last Supper claim and admission of the
    transmission gap, and no positive Christian or transmission measurement
    remains. Thus the verdict does not hang on one evidentiary thread.
  steelman: The record does not explain away the reported combination of ergot in
    a ceremonial vessel and human dental calculus at a Demeter-and-Kore
    sanctuary, and neither Eleusinian vessels nor securely identified
    early-Christian liturgical vessels have received the residue surveys capable
    of detecting the proposed hidden sacramental practice.
claimAssessments:
  - claimId: TIK-C001
    verdict: established
    confidence: high
    reasoning: Multiple records directly identify psychoactive compounds in ancient
      ritual or cultic contexts, including cannabis on a Judahite altar and
      alkaloids in human hair from a Western Mediterranean cult cave. The
      evidence spans different substances and settings, which is sufficient for
      this broad existential claim without implying a common tradition. The
      strongest opposing consideration is that several contexts do not disclose
      the precise purpose of consumption, but the deliberately prepared altar
      deposit and ritual-vessel evidence make purely accidental exposure
      implausible for the claim as a whole.
  - claimId: TIK-C002
    verdict: well_supported
    confidence: moderate
    reasoning: The record combines a Ptolemaic vessel containing a fermented
      botanical psychotropic mixture with a proponent's account of explicit
      psychoactive wine recipes in Dioscorides. Together they support the
      inclusion of deliberately compounded psychoactive wines or fermented
      drinks within Greco-Roman pharmacological practice. The strongest opposing
      consideration is that the archaeological vessel lacks secure excavation
      provenance and the Dioscorides passages have not been checked directly, so
      the evidence falls short of an established verdict.
  - claimId: TIK-C003
    verdict: established
    confidence: high
    reasoning: The quoted Homeric Hymn passage directly specifies meal, water, and
      soft mint and names no ergot or other psychedelic additive. This
      establishes what that text says, which is all the claim asserts. The
      strongest opposing consideration is that a mythological aition is not a
      complete sanctuary manual, but possible divergence in actual practice does
      not alter the recipe as stated in the Hymn.
  - claimId: TIK-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: "The 2026 paper specifically reports ergot fragments in a ceremonial
      vessel and the dental calculus of a young man at a sanctuary associated
      with the two Eleusinian goddesses. That report supports every major
      element of the claim, including cultic context and apparent consumption.
      The strongest opposing consideration is decisive for confidence: the 2002
      primary chapters were not obtained, the finding has never been
      independently replicated, and the current record receives it secondhand
      through an interested research network."
  - claimId: TIK-C009
    verdict: weakly_supported
    confidence: low
    reasoning: Cana's wine miracle, the “true vine” language, and reported parallels
      with Dionysian traditions make deliberate literary engagement a plausible
      interpretation of John. The record also indicates that this is a genuine
      scholarly position rather than an invention unique to the featured author.
      The strongest opposing consideration is that the evidence is presented
      through the proponent's summary rather than the underlying scholarship,
      while Jewish scriptural and messianic wine imagery supplies a substantial
      alternative explanation for the same motifs.
  - claimId: TIK-C005
    verdict: well_supported
    confidence: moderate
    reasoning: Across 48 reported runs, the 2026 experiment found disappearance of
      the monitored toxic ergopeptides and production of 0.54 mg LSA and 0.48 mg
      iso-LSA per gram of ergot under wood-ash-type lye conditions. This
      directly demonstrates the claimed conversion at the level of chemical
      feasibility, using materials and operations plausibly available in
      antiquity. The strongest opposing consideration is that success required a
      narrow and demanding treatment at pH 12.5 for 120 minutes, and no
      unaffiliated laboratory has replicated the interested-network result. It
      also does not establish that the complete extract was safe for humans.
  - claimId: TIK-C006
    verdict: contradicted
    confidence: moderate
    reasoning: The human LSA literature supports psychoactivity, hallucinations, and
      occasional euphoria, but it also records lower potency than LSD, prominent
      nausea and autonomic effects, anxiety, and occasional severe outcomes.
      That profile conflicts with the claim of a reliably profound and largely
      positive experience at the proposed dose. The strongest opposing
      consideration is that existing human reports mostly involve morning-glory
      seeds rather than the reconstructed ergot extract, so they do not prove
      that the exact preparation would fail. Nonetheless, no direct
      pharmacological result supports the asserted reliability, and the
      available evidence points against it.
  - claimId: TIK-C008
    verdict: unresolved
    confidence: moderate
    reasoning: Modern psilocybin research shows that a drug can occasion intense,
      enduring mystical-type experiences, making a pharmacological contribution
      plausible. It does not show that Eleusinian experiences required a drug or
      that fasting, expectancy, secrecy, procession, sensory staging, and
      collective emotion were insufficient. The strongest opposing consideration
      for a non-drug account is that this record supplies no systematic
      demonstration that such ritual methods reproduce the reported intensity
      and consistency. With neither causal model directly tested against the
      ancient phenomenology, necessity remains unresolved.
  - claimId: TIK-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: The reported Mas Castellar find provides a relevant but
      geographically remote cultic analogue, and the 2026 chemistry establishes
      that deliberate ergot processing was technically possible. These facts
      give the Eleusinian attribution more than bare logical possibility. The
      strongest opposing consideration is that no Eleusinian artifact has
      yielded ergot evidence, no ancient text mentions the additive or required
      alkaline procedure, and the sanctuary's reported audited accounts contain
      no corresponding expenditure or production trace. The positive evidence is
      therefore circumstantial and cannot bear the definite historical
      statement.
  - claimId: TIK-C010
    verdict: unresolved
    confidence: moderate
    reasoning: No evidence record directly identifies a psychoactive substance in an
      early Christian Eucharistic meal or vessel. Irenaeus's account concerns an
      alleged cup trick and separate accusations involving philters, so it does
      not establish psychedelic consumption. The strongest opposing
      consideration is that normative descriptions in the Didache and Justin
      cannot exclude every marginal or heterodox community, especially one that
      left little surviving evidence. The broad existential claim is therefore
      neither supported nor decisively contradicted by this record.
  - claimId: TIK-C011
    verdict: contradicted
    confidence: moderate
    reasoning: The earliest liturgical evidence supplied describes Jewish-style
      thanksgiving over cup and bread, while Justin explicitly describes bread
      and wine mixed with water rather than a psychedelic potion. No record
      supplies a psychoactive ingredient for the Last Supper or the earliest
      documented Eucharist, and the proponent explicitly says he does not rely
      on the Last Supper claim. The strongest opposing consideration is that
      these texts are normative and do not chemically analyze their contents,
      while Justin is later than the first generation. Even so, the claim's
      positive universal wording conflicts with the documentary evidence
      actually provided.
  - claimId: TIK-C012
    verdict: contradicted
    confidence: moderate
    reasoning: The record contains no transmission document, shared psychoactive
      recipe, residue result, or institutional bridge connecting Greek mystery
      practice to the earliest Greek-speaking Christians. The proponent himself
      identifies both Dionysian psychoactivity and its transfer into
      Christianity as major unanswered conditions, while the early Eucharistic
      texts instead exhibit a Jewish meal framework. The strongest opposing
      consideration is that Greek-speaking Christians inhabited a Hellenistic
      symbolic environment and John plausibly engages Dionysian imagery.
      Literary engagement and shared environment, however, do not establish
      historical continuity of a psychoactive sacrament.
  - claimId: TIK-C013
    verdict: contradicted
    confidence: high
    reasoning: The Didache's cup and bread thanksgivings are Jewish in form and
      Davidic in content, directly supporting development from Jewish communal
      meal practice. Justin likewise describes ordinary bread and
      wine-with-water and treats mystery-cult resemblance polemically rather
      than as acknowledged ancestry. The strongest opposing consideration is
      that second-century Christian polemic could conceal or reverse an earlier
      history of borrowing. No evidence record documents that proposed earlier
      pagan derivation, whereas the earliest liturgical material in the record
      positively exhibits the competing Jewish matrix.
