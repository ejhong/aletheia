  synthesis: >-
    The strong-form hypothesis is a three-part conjunction: a prepared-ergot
    kykeon at Eleusis, analogous pharmacology in Dionysian wine, and historical
    inheritance of that practice as a psychedelic Eucharist by the earliest
    Christians. The supplied record supports the parts unevenly, which is why
    the case verdict is mixed rather than a single directional token.

    On the background rungs the record is comparatively strong. Multiple
    independent archaeochemical studies document deliberate ritual use of
    psychoactive plants in the ancient Mediterranean and Near East (cannabis
    residues on the Arad altars, alkaloids in Bronze Age Menorcan hair, a
    multi-plant psychotropic residue in a Ptolemaic Bes vessel), and Greco-Roman
    medical literature as summarized here includes wine preparations compounded
    with visionary botanicals. Those findings retire blanket skepticism that
    such technology was culturally unavailable. They do not, however, identify
    ergot at Eleusis or a spiked cup in any Christian meal.

    The Eleusinian core is a chain of possibility, not demonstration. The
    Homeric Hymn’s public recipe is meal, water, and mint; nothing psychoactive
    is named, and no ancient source describes alkaline processing. The 2026
    wood-ash lye experiments show that toxic ergopeptides can be converted to
    LSA/iso-LSA under harsh, controlled conditions, retiring the crude objection
    that ergot necessarily means ergotism, but the authors themselves frame the
    result as technological feasibility and call for residue work at Eleusis
    that has never been permitted. The sole cult-context archaeological hinge is
    the unreplicated 2002 Mas Castellar report of ergot in a Demeter/Kore
    sanctuary vessel and dental calculus—secondhand in this ledger, Iberian
    rather than Attic, and still a thousand kilometres from the mother
    sanctuary. LSA’s human pharmacology is psychoactive yet weaker and messier
    than LSD, with prominent adverse effects; whether a gram-scale lye extract
    would reliably yield the profound positive visionary experience attributed
    to initiation remains an open pharmacological gap. The further claim that
    fasting, drama, and collective emotion were causally insufficient is
    asserted rather than measured. Clinton’s epigraphic point—that audited
    sanctuary accounts show conventional grain use and no drug expenditure—
    converts bare silence into a published, specific silence, though it cannot
    rule out unpurchased field ergot or hidden flows. Net: deliberately prepared
    ergot in the Eleusinian kykeon is a coherent, still-untested hypothesis with
    thin circumstantial support, not an established historical fact.

    The Christian extension and the transmission rung fail on the documentary
    base that does exist. The Didache’s berakah-style thanksgivings over cup and
    bread, Justin Martyr’s mid-second-century description of bread and
    wine-mixed-with-water framed against Mithraic imitation as demonic
    counterfeit, and the absence of any early insider claim of a psychoactive
    sacrament place the normative Eucharist inside Second-Temple Jewish meal
    practice. Irenaeus’s polemic against Marcus describes cup color-tricks and
    love-philters condemned as fraud, not a psychedelic liturgy. The book’s own
    star archaeochemist (McGovern), mystery-cult and Christian-origins
    specialists (Bremmer, Ehrman), and an intra-movement reviewer (Brown) all
    reject the grand continuity thesis as overreach; the author himself, on the
    Harvard record, declines to defend a psychedelic Last Supper, calls the
    Dionysian premise “a big if,” and asks where the drugs are. Johannine
    engagement with Dionysian imagery is a real literary position and does not
    entail pharmacological transfer.

    Steelmanning the affirmative: ancient ritual pharmacology was real;
    visionary wine recipes existed; a chemically plausible ergot pathway is now
    on the bench; one Demeter-linked sanctuary yields an ergot signal; and the
    decisive cups at Eleusis and in early Christian contexts have never been
    analyzed. Steelmanning the negative: every load-bearing affirmative step
    beyond background capability is either analogy, unreplicated single finds,
    interested-network chemistry framed as feasibility only, or literary
    parallel, while the earliest Christian liturgical texts and the Hymn’s own
    recipe affirmatively describe ordinary elements. Shared sources and advocacy
    networks (Ruck continuity from 1978 through 2026; YAPP funding by the book’s
    author and this ledger’s founder) require independence discounts on the pro
    side; motive-discounting of critics is equally disallowed as evidence about
    cup contents. The strong public form therefore does not hold as a
    demonstrated historical package. The Greek half remains a live,
    permission-blocked chemical question; the Christian inheritance half is
    contradicted by the primary liturgical witnesses. That split is the warrant
    for mixed.
  steelman: No organic-residue analysis has ever been run on securely contexted
    drinking vessels from the Eleusis sanctuary itself; given a now-demonstrated
    wood-ash route from toxic ergot to LSA/iso-LSA, the unreplicated Mas
    Castellar ergot-in-Demeter-sanctuary parallel, and two millennia of reports
    of uniquely stable, life-altering initiation experiences whose intensity
    non-pharmacological models have not quantitatively matched, a positive
    ergoline result at Eleusis would reopen the Greek half overnight and cannot
    be ruled out by textual silence under a legally secret cult.
