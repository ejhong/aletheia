  synthesis: "The strong-form hypothesis is a multi-rung chain: background ritual
    psychoactives in the ancient Mediterranean (C001–C002), a specific
    ergot-prepared kykeon at Eleusis (C007, resting on C003–C006 and C004–C005),
    Dionysian pharmacological wine plus Johannine engagement (C009), and
    historical continuity into a psychedelic original Eucharist inherited by
    earliest Christians then suppressed (C010–C013). Evidence records support
    the background rung at well-supported to provisionally_supported strength.
    Multiple independent archaeochemical results (cannabis residues on Judahite
    altars, alkaloids in Bronze Age Menorcan hair, multi-plant psychotropic
    signals in a Ptolemaic Bes vessel, plus comparative Datura quids) establish
    deliberate ritual use of psychoactive plants and fungi; Greco-Roman wine
    compounding with botanicals is attested via the Bes vessel and secondhand
    Dioscorides summaries of henbane/mandrake/nightshade preparations. The
    Homeric Hymn recipe (C003) is established as barley meal, water and mint
    with no named psychoactive, so any ergot claim is an unattested addition.
    The 2026 lye-hydrolysis experiments (C005) demonstrate technical
    feasibility: wood-ash-type alkaline reflux converts toxic ergopeptides to
    LSA/iso-LSA at yields consistent with roughly gram-scale doses, retiring the
    crude “ergot equals ergotism” objection at the level of possibility;
    interested-network authorship and lack of independent replication qualify
    but do not erase the measured result. However, the pharmacological claim
    that such a preparation would reliably produce the profound, largely
    positive visionary experience reported by initiates (C006) is only weakly
    supported: systematic review of LSA shows it is psychoactive yet weaker than
    LSD, with prominent nausea, autonomic effects and occasional severe adverse
    outcomes, and human data derive from morning-glory matrices rather than the
    reconstructed extract. Necessity of a drug (C008) remains unresolved; modern
    psilocybin trials show mystical-type experience is pharmacologically
    inducible, but that is analogy only and does not demonstrate that fasting,
    procession, secrecy, drama and collective emotion were insufficient at
    Eleusis. The Eleusinian attribution itself (C007) is weakly supported at
    best: the sole cult-context ergot datum is unreplicated 2002 microremains
    (vessel plus dental calculus) at Iberian Mas Castellar, a
    Demeter/Kore-linked sanctuary a thousand kilometres from Attica, seen here
    only through 2026 citations; no residues have ever been analysed at Eleusis
    (explicit empty cell), the sanctuary’s audited grain accounts record no drug
    expenditure, and no ancient source names ergot or alkaline processing. The
    Christian extension collapses further. Johannine-Dionysian literary
    engagement (C009) is a genuine interpretive position in the scholarship but
    does not entail pharmacology. No positive chemical or unambiguous textual
    evidence supports psychoactive Eucharists in any early community (C010); the
    nearest text (Irenaeus on Marcus) is hostile heresiology describing a
    colour-change conjuring trick and love-philters, not a sacrament. The
    original/normative Eucharist as psychedelic potion (C011) is contradicted by
    the earliest liturgical descriptions (Didache berakah-style thanksgivings
    over cup and bread; Justin’s bread and wine-mixed-with-water framed
    christologically and against mystery-cult imitation) and by the author’s own
    on-record refusal to hang his hat on a psychedelic Last Supper. The
    transmission/continuity claim (C012) and the framework claim that the
    Eucharist developed from pagan mystery-cult rather than Second-Temple Jewish
    meal practice (C013) are contradicted by the same documentary base, by
    specialist rejections (Bremmer: Christianity was not a mystery cult; Ehrman
    and McGovern on implausibility and over-interpretation; Brown’s
    intra-movement verdict of recurring overreach and historical distortion),
    and by the proponent’s own concessions that the Dionysian premise is “a big
    if,” the transmission step an “even bigger if,” and “the smoking gun remains
    elusive.” Shared-source and interest-network hazards (proponent-funded
    residue programs, hypothesis-originator co-authorship on the key chemistry
    paper, journalism carrying expert quotes) further discipline independence
    accounting without themselves deciding chemistry. The ladder therefore holds
    at the level of ancient capability and modern chemical possibility, frays at
    Eleusinian practice, and breaks at Christian inheritance; the strong public
    form is an over-extension of a still-testable but presently weakly evidenced
    Greek hypothesis. Decisive residue work at Eleusis and on early Christian
    vessels remains unperformed; until then the affirmative burden is unmet.
    Sensitivity is highest to the Mas Castellar report (TIK-E007): without that
    single unreplicated hinge the Eleusinian attribution loses its only
    substance-in-cult-context datum and the case verdict drops toward
    unresolved/presently_untestable on the Greek side while the Christian side
    remains contradicted; the overall weakly_supported verdict does not survive
    unchanged."
  steelman: The nearly two-millennia continuity of initiate reports of uniquely
    profound, identity-altering visions at Eleusis, delivered inside a legally
    secret, highly standardised nocturnal rite whose public recipe names only
    barley, water and mint, still lacks a fully satisfactory non-pharmacological
    mechanism in the supplied record, and the unreplicated Mas Castellar ergot
    finds in a Demeter/Kore sanctuary keep open the possibility that a
    prepared-ergot practice existed somewhere in the wider Eleusinian orbit.
