    reasoning: "Multiple independent archaeochemical results directly document
      deliberate ritual use of psychoactive plants and fungi across the ancient
      Mediterranean and Near East: cannabis resin heated on eighth-century BCE
      Judahite altars at Tel Arad, ephedrine/atropine/scopolamine in Bronze Age
