  synthesis: "The featured hypothesis is a conjunction of three limbs: a
    prepared-ergot kykeon at Eleusis, a pharmacologically comparable Dionysian
    wine, and inheritance of that practice as a psychedelic Eucharist by the
    earliest Christians. The record supports the limbs very unevenly, and a
    conjunction is graded by its weakest necessary link. The background rung is
    genuinely strong: Tel Arad, Es Càrritx (alkaloids measured in human tissue),
    the Bes vessel, and the Pinwheel Cave benchmark establish that ritual
    psychoactive use is archaeochemically real and that the methods to detect it
    work. That defeats blanket a-priori dismissal, and nothing more. The
    mechanism rung has been materially improved by Antonopoulos et al. 2026:
    alkaline hydrolysis of ergopeptides to LSA/iso-LSA under wood-ash-lye
    conditions is demonstrated with quantitation across 48 runs, retiring
    \"ergot necessarily means ergotism\" at the level of possibility. But the
    same paper's own framing (\"feasibility... in the specific
    historical-technological context\") and its parameter sensitivity (complete
    hydrolysis only at pH 12.5, 120 min reflux) make the historical
    reconstruction more demanding, not less: a controlled, unattested processing
    technology is now a required posit. Meanwhile the pharmacology rung stops
    short of what the history needs — the LSA review documents psychoactivity
    alongside nausea, autonomic effects and dysphoria, and the reconstructed
    matrix has never been profiled. The archaeological hinge (Mas Castellar) is
    a single 2002 analysis, unreplicated, and known to this record only through
    a 2026 paper's citation, with a documented hardening drift from \"ergot
    microremains\" to \"hallucinogenic alkaloids detected.\" Against the Greek
    limb stand the Hymn's mundane recipe, Clinton's audited-accounts argument,
    and an untested — not merely empty — cell at Eleusis. The Christian limb is
    where the case breaks decisively: the earliest liturgical witnesses (Didache
    9–10, Justin Apol. 65–66) describe ordinary bread and watered wine in Jewish
    berakah form and frame mystery-cult parallels as demonic imitation; the one
    \"drugged cup\" text is hostile heresiology about conjuring and
    love-philters; and the author himself declines to defend the Last Supper
    claim and concedes the Dionysian premise is \"a big if.\" Two specialist
    fields (mystery cults, Christian origins), the book's own archaeochemical
    advisor, and a sympathetic intra-movement reviewer all reject the
    transmission thesis. The strong public form is therefore contradicted at its
    Christian and transmission joints, while the Eleusis limb alone remains a
    live, weakly supported, and decisively testable hypothesis."
  steelman: "No vessel from the Eleusis sanctuary has ever undergone organic
