  synthesis: "The strong form is a conjunction: a psychedelic ergot kykeon at
    Eleusis, a pharmacologically comparable Dionysian wine, and inheritance of
    that practice by the earliest Christians as a drugged Eucharist later
    suppressed. A conjunction is only as strong as its weakest required link,
    and the links here are of very unequal quality. The background rung is
    genuinely strong: Tel Arad, Es Càrritx (alkaloids in human hair —
    consumption, not proximity), the Bes vessel, and Pinwheel Cave together
    establish that ritual psychoactive use existed and that residue chemistry
    can demonstrate it (TIK-C001). The mechanism rung is now respectable rather
    than speculative: the 2026 alkaline hydrolysis experiment (TIK-E008) shows a
    technologically available route from toxic ergopeptides to LSA, which
    retires \"ergot means ergotism\" as a possibility objection, though it was
    run once by a team including the hypothesis's originators and its own
    authors frame it explicitly as feasibility, not evidence of ancient
    practice. Everything above feasibility thins rapidly. The only ancient
    recipe names nothing psychoactive; no source attests either the additive or
    the specific processing technology the mechanism requires; Clinton's
    audited-accounts argument converts the silence from generic to specific; and
    the one archaeological anchor (Mas Castellar) is a single unreplicated 2002
    analysis this record has seen only through a 2026 citation, with a
    documented drift from \"ergot microremains identified\" to \"hallucinogenic
    alkaloids detected.\" The Eleusinian half is therefore live-but-unproven,
    and the empty cell at Eleusis is honestly an untested absence, not a tested
    null. The Christian half is worse than unproven. The earliest documentary
    witnesses to the rite — the Didache's Jewish berakah over cup and bread,
    Justin's bread and wine-mixed-with-water framed polemically against the
    mysteries — describe ordinary elements and an inheritance running from
    Second-Temple meal practice, not mystery cult; the one \"drugged cup\" text
    is hostile heresiology about conjuring and love-philters; the specialist
    fields (Bremmer on mystery cults, Ehrman on Christian origins, McGovern on
    the archaeochemistry he himself supplied) all reject the reading; an
    intra-movement reviewer sympathetic to entheogenic history reaches the same
    verdict on the synthesis; and the author himself, in a friendly academic
    venue, declines to defend the Last Supper claim, calls the Dionysian premise
    \"a big if,\" and asks \"where are the drugs?\" Steelmanning the other way:
    none of the negative documentary evidence is a measurement, all of it is
    normative text that describes sanctioned practice rather than every
    community's, secret rites are precisely the kind of thing such texts would
    not record, and no early Christian vessel has ever been residue-analyzed
    either. That symmetry is real, and it is why the Greek half assessed alone
    would read weakly_supported/unresolved rather than contradicted. But the
    case asks about the strong conjunction, and a required link
    (TIK-C011/TIK-C012) is affirmatively opposed by the best available
    documentary evidence while carrying zero affirmative evidence of its own.
    Sensitivity: the single record whose removal would most move me is TIK-E008,
    the 2026 hydrolysis experiment — without it the mechanism rung collapses
    back to a 1978 proposal and the whole case would be flatly contradicted
    rather than contradicted-with-a-live-subclaim. The verdict survives its
    removal; on the negative side, removing the Didache (TIK-E023) leaves
    Justin, 1 Cor-type material, and the author's own concessions intact, so the
    verdict survives that too. No single thread carries this."
  steelman: No vessel from the Eleusis sanctuary has ever undergone organic
    residue analysis — the decisive test is blocked administratively, not by
    science — while every comparable sanctuary assemblage that has been analyzed
