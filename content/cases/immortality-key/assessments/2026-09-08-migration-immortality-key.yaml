  verdict: mixed
  whatIsClaimed: "In its strongest public form: the Eleusinian Mysteries administered a psychedelic kykeon whose active agent was prepared ergot; Dionysian ritual wine carried similar pharmacology; and the earliest Christians inherited this \"religion with no name\" as a psychedelic Eucharist, later suppressed by the Church Fathers. The author's own scholarly formulation is weaker — he calls the Dionysian premise \"a big if,\" does not defend a psychedelic Last Supper, and concedes the \"smoking gun remains elusive\" — so the claim exists in at least three strengths (publisher copy, popular interviews, scholarly concession), and this case assesses the strong form while recording the concessions as evidence."
  whereDisagreementLives: "Not over whether ancient Mediterranean peoples used psychoactive plants ritually — post-2020 archaeochemistry settled that — nor, since 2026, over whether a workable ergot preparation was chemically feasible with ancient technology. The crux is four narrow cells: the empty record at Eleusis itself (no artifact from the sanctuary has ever been chemically analyzed, an absence both sides cite); the canonical kykeon recipe, which names nothing psychoactive; the thousand-kilometer gap between the one hard ergot-in-cult-context datum (Mas Castellar de Pontós, Iberia) and the sanctuary at Eleusis; and the transmission vector into Christianity, where the earliest documents describe a Jewish table liturgy of bread and wine and no chain of pharmacological inheritance has been shown."
  whatWouldSettleIt: "For the Greek half: organic residue analysis of securely contexted, curated vessels from the Eleusis sanctuary — the decisive test both the 2026 feasibility paper and this case's critics point to, blocked by permission rather than science — together with independent modern re-analysis of the Mas Castellar samples. For the Christian half: a preregistered residue survey of securely identified early-Christian liturgical vessels, where a well-documented null would be almost as informative as a hit. A positive from one Christian cup would establish a practice somewhere, not the norm, and not inheritance from Eleusis — transmission would additionally require markers like shared uncommon recipes appearing first in a mystery cult and later in a Christian setting."
  bestConventionalExplanation: "Eleusis produced overwhelming experiences without pharmacology: nine days of fasting, procession, secrecy, darkness and light, ritual drama, and collective emotion in an initiation hall — mechanisms mainstream scholarship considers sufficient, and which kept the rite stable for nearly two millennia. The kykeon was what its recipe says: barley meal, water, and pennyroyal. Ancient pharmacological wines existed but were medicine and sorcery, not mystery-cult sacraments; the Mas Castellar ergot, if it survives re-analysis, attests an Iberian practice, not the Attic one. Christianity's Eucharist descends from Second-Temple Jewish meal liturgy — Passover, kiddush, berakah — exactly as the earliest texts present it, and its wine symbolism needs no drug to explain. The account's unpaid debt: nobody has actually tested the Eleusinian or early-Christian vessels that could falsify it."
