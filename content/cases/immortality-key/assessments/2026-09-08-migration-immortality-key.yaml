  synthesis: "The ladder in this case does not fail uniformly, which is why the roll-up stays mixed rather than collapsing to a single grade. The observation rung is genuinely solid: ritual psychoactive use in antiquity is established by independent residue chemistry (TIK-E001, TIK-E002, TIK-E003, TIK-E004), compounded drug-wines are well attested in Greco-Roman pharmacology (TIK-E005), and the Hymn's kykeon recipe is exactly what the text says it is (TIK-E006). None of that discriminates between hypotheses; a Judahite altar and a Menorcan cave are prior-shifting background, not evidence about an Attic cup. The mechanism rung moved once, with the 48-run lye-hydrolysis experiment (TIK-E008), and that result retires the 'ergot means ergotism' objection at the level of possibility while raising the historical cost: it requires strong lye held hot for two hours, a controlled technology no source attests. Feasibility is not occurrence. The attribution rung then splits. At Eleusis the decisive cell is empty rather than negative (TIK-E009), so TIK-C007 sits at weakly_supported, propped by one unreplicated 2002 Iberian find seen only through secondary citation (TIK-E007) and pressed by the audited sanctuary accounts (TIK-E016) and the silent recipe (TIK-E015). On the Christian side the record is not empty but contrary: Justin and the Didache describe bread and wine in Jewish thanksgiving form (TIK-E022, TIK-E023), the one 'drugged cup' text is fraud polemic (TIK-E021), specialists reject the framework (TIK-E017, TIK-E018, TIK-E020), and the author himself declines to defend the strong form (TIK-E024). Independence discipline is unchanged: one performance of the chemistry by interested-network authors, one unreplicated Iberian datum, and a funding edge (TIK-E027) that makes naive source-counting misleading."
