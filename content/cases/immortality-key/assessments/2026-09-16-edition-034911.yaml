caseAssessment:
  verdict: mixed
  whatIsClaimed: "In its strongest public form: the Eleusinian Mysteries administered a psychedelic kykeon whose active agent was lye-processed ergot; Dionysian ritual wine carried similar pharmacology; and the earliest Greek-speaking Christians inherited this ‘religion with no name’ as a drugged Eucharist later suppressed by the Church Fathers. The author's scholarly formulation is weaker — the Dionysian premise is ‘a big if,’ the Last Supper claim is not defended, and ‘the smoking gun remains elusive’ — so the claim exists in at least three strengths (marketing copy, popular interviews, scholarly concession). This case assesses the strong form, records the concessions as evidence, and treats ‘some community spiked its cup’ as the weak version of the inheritance account."
  whereDisagreementLives: "Not over whether ancient Mediterranean peoples used psychoactive plants ritually — post-2020 archaeochemistry settled that — nor, since 2026, over whether an ergot preparation could be detoxified with ancient technology under demanding conditions. The crux is five narrow cells: the empty record at Eleusis, where no vessel has ever been analyzed and both sides cite the absence; the canonical recipe, which names nothing psychoactive and no processing; the Pontós find, one unreplicated 2002 analysis seen only through citation, which may show no more than that barley carries ergot; the phenomenon itself, since whether any ancient text attests a transformative experience during initiation — rather than afterlife hopes read through a modern lens — is under audit; and the transmission vector into Christianity, where the earliest documents describe a Jewish table liturgy and no chain of pharmacological inheritance has been shown."
  whatWouldSettleIt: "For the Greek half: organic residue analysis of securely contexted, curated Eleusinian vessels, targeting LSA, iso-LSA and lysergic acid above soil background with ergot lipids run only as a cereal control — so that a predictable ‘barley was here’ is not read as a hit and a null is informative — together with reading the 2002 Pontós chapters and re-analyzing the samples, and an independent, blinded replication of the lye chemistry plus a pharmacological profile of the whole extract. For the phenomenon: a philological audit of Phaedrus 250b–c and the testimonia for any text independent of Kerényi's reading attesting an experience during initiation. For the Christian half: a preregistered residue survey of securely identified early-Christian liturgical vessels, where a documented null is nearly as informative as a hit; a positive would establish a practice somewhere, not the norm and not inheritance, which would further require an uncommon shared recipe appearing first in a mystery-cult vessel and later in a Christian one."
  bestConventionalExplanation: "Eleusis produced its effect without pharmacology: fasting, procession, secrecy, darkness and light, ritual drama and collective emotion in an initiation hall — mechanisms mainstream scholarship considers sufficient and which kept the rite stable for nearly two millennia — and the ‘life-changing vision’ may in any case be a modern reading of ancient afterlife hopes rather than an attested experience. The kykeon was what its recipe says: barley meal, water, pennyroyal. Ancient drug-wines were medicine and sorcery, not mystery-cult sacraments. The Pontós ergot, if it survives re-analysis, is ergot on barley in a barley vessel unless the report shows a contrast with the site's grain, and attests at most an Iberian practice. The Eucharist descends from Second-Temple Jewish meal liturgy exactly as the Didache, Paul and Justin present it, and its wine symbolism needs no drug. This account's unpaid debt: nobody has tested the Eleusinian or early-Christian vessels that could falsify it, and its ritual-sufficiency premise is asserted more than evidenced."
