  synthesis: "The ladder does not fail uniformly, so the roll-up stays mixed rather than collapsing to one grade. The observation rung is solid: ritual psychoactive use is established by independent residue chemistry (TIK-E001, TIK-E002, TIK-E003, TIK-E004), compounded drug-wines are attested (TIK-E005), and the Hymn's recipe is what it says (TIK-E006). None of that discriminates between the accounts. The mechanism rung moved once, with the 48-run hydrolysis experiment (TIK-E008), and the preprint fine print (TIK-E038) now fixes how narrowly: complete detoxification only at pH 12.5, 5% w/v, 120 minutes, with ergometrine still present. That retires ‘ergot means ergotism’ at the level of possibility while raising the historical cost — a controlled technology no source attests — and leaves the pharmacological question (TIK-E012) open. The attribution rung splits. At Eleusis the decisive cell is empty, not negative (TIK-E009); TIK-C007 sits at weakly_supported, propped by one unreplicated Iberian find seen only through citation (TIK-E007) and pressed by the silent recipe (TIK-E015), the audited accounts (TIK-E016) and the methodological critique (TIK-E019). Beneath it, the generator claim TIK-C008 is now doubly unresolved: no record evidences ritual sufficiency, and the proponents' own premise rests on ‘numerous accounts’ they do not cite (TIK-E040, TIK-E041), so whether there is a phenomenon to explain is itself under audit. On the Christian side the record is contrary rather than empty: Justin and the Didache describe bread and wine in Jewish thanksgiving form (TIK-E022, TIK-E023), the one drugged-cup text is fraud polemic (TIK-E021), specialists reject the framework (TIK-E017, TIK-E018, TIK-E020), and the author declines the strong form (TIK-E024). The single evidence record whose removal would most change the case verdict is TIK-E008: without it TIK-C005 reverts to a 26-year-old proposal, TIK-C007 loses its only mechanism, and the Greek half slides from weakly_supported toward contradicted, pulling the case verdict with it. Independence discipline is unchanged: one performance of the chemistry by interested-network authors, one unreplicated Iberian datum, and a funding edge (TIK-E027) that includes this project's founder."
  steelman: "The Mysteries were secret by law, and every countervailing record in this ledger is an argument from silence in precisely the domain where silence is expected: the Hymn is a public myth, the accounts are public stone, and neither would record a secret ingredient gathered free from the Rarian field and processed in a sanctuary that never published its rite. Meanwhile the hypothesis has been right both times it was checked. The one Demeter-and-Persephone-linked sanctuary whose vessel and worshipper have been examined (Pontós) reportedly showed ergot in the cup and in a man's teeth; the one chemical test ever run on the mechanism came out positive under conditions Greek technology could supply, at a yield that reaches an active dose from a gram of fungus. The initiates' own formula — ‘I fasted, I drank the kykeon’ — places the drink at the end of a fast, the moment of maximal absorption and the moment a ritual designer would choose. The skeptical account, by contrast, has never been tested at Eleusis at all: no cup, no null, no cereal-positive-lysergamide-negative series. A hypothesis that predicts correctly whenever it is checked, against an alternative that has never been checked, deserves more than ‘weakly supported.’ This assessment does not answer that argument; it holds that two checks, one unreplicated and one unread at its source, cannot carry the weight, and that the untested cell is untested for both sides."
