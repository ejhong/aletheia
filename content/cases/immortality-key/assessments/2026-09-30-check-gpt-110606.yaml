  synthesis: >-
    The evidence supports several lower-rung propositions without supporting the
    featured historical synthesis. Direct chemical measurements show that
    psychoactive plants were used in ancient ritual contexts, while the Bes
    vessel and the reported Dioscoridean recipes make deliberately compounded
    botanical drinks historically plausible. Most importantly for the Greek
    half, TIK-E008 demonstrates that a narrowly specified wood-ash-lye process
    can convert Claviceps purpurea ergopeptides into LSA and iso-LSA. This
    answers a feasibility objection: ergot need not invariably imply untreated
    ergot poisoning. It does not show that Eleusinian personnel knew or used the
    process, and the successful result required the experiment's strongest lye,
    low ergot loading, and long reflux.

    The best affirmative archaeological link is the reported Mas Castellar de
    Pontós find: ergot in a ceremonial vessel and dental calculus at an Iberian
    sanctuary associated with Demeter and Kore. That observation is important
    but presently travels through an unreplicated, secondhand citation to an
    unobtained 2002 primary report. It is also an analogy from Iberia, not a
    measurement at Eleusis. Against deliberate ergot use at Eleusis stand the
    canonical recipe's barley meal, water, and mint, the lack of any attested
    alkaline-processing step, and the reported silence of unusually detailed
    sanctuary accounts. Those are not decisive exclusions because secret,
    gathered, or ordinarily accounted ingredients could escape them. No
    Eleusinian vessel has been systematically analyzed, so TIK-C007 remains
    weakly supported rather than refuted.

    The pharmacological bridge is weaker still. Producing roughly an active
    literature dose of LSA does not establish that the complete extract would
    reliably cause a profound, positive experience. The reviewed human
    literature instead describes variable psychoactivity with substantial
    nausea, autonomic effects, anxiety, and occasional severe outcomes. Nor does
    any supplied evidence establish the stronger causal claim that the
    experiences attributed to initiation required a drug rather than ritual,
    expectation, fasting, secrecy, and collective emotion.

    The Christian extension fails more clearly. The Didache presents Jewish-form
    thanksgiving over cup and bread, and Justin describes bread and wine mixed
    with water while construing mystery-cult parallels as imitation rather than
    ancestry. Irenaeus's Marcosian account describes a color trick and separate
    accusations about love potions, not a psychedelic Eucharist. No evidence
    record supplies a material, textual, or institutional transmission chain
    from Eleusis or another mystery cult to the earliest Christian meals. Thus
    the verdict does not mean that no isolated Christian ever consumed a
    psychoactive substance; TIK-C010 remains unresolved. It means that the
    featured conjunction—psychedelic Eleusis inherited as the original
    Eucharist—is contradicted because its original-Eucharist, transmission, and
    pagan-origin components conflict with the earliest documentary evidence.

    The single removal that would most alter this assessment is TIK-E023, the
    earliest and clearest record of a Jewish-form Eucharistic thanksgiving.
    Removing it would weaken the documentary case against the Christian
    extension, but the case verdict survives because TIK-E022, TIK-E024, the
    absence of a transmission chain, and the unresolved Christian material
    record still fail to support—and substantially undermine—the featured strong
    form.
  steelman: "The decisive pro-hypothesis prediction remains untested:
    preregistered lysergamide analysis of securely contexted Eleusinian mixing
    and drinking vessels, followed by comparable analysis of the earliest
    securely attributed Christian liturgical cups, will reveal a non-background
    psychoactive residue pattern linking the two practices. No systematic
    residue survey of either material corpus is in the evidence, while the
    reported Mas Castellar vessel and dental-calculus finds provide a concrete
    cultic precedent for exactly the kind of otherwise secret practice that
    public recipes and normative liturgies could omit."
