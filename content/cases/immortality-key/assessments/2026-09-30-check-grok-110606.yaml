  synthesis: >-
    The case is a deliberate ladder whose rungs must be assessed separately
    rather than allowed to borrow strength upward. At the observation base,
    deliberate ritual use of psychoactive plants in the ancient Mediterranean
    and Near East is well documented by direct chemistry: cannabis residues on
    Iron Age Judahite altars, multiple alkaloids in Bronze Age Menorcan hair,
    and a complex fermented psychotropic preparation in a Ptolemaic Bes vessel.
    Greco-Roman compounding of wine with visionary botanicals is at least
    provisionally attested via Dioscorides summaries and the same Bes residue
    work. These findings retire blanket cultural impossibility and supply a
    non-zero prior, but they remain distant in substance, route, cult, and
    century from either Eleusis or the Eucharist.

    The mechanism rung is stronger than it was before 2026. Wood-ash lye, a
    technology available in antiquity, converts the toxic ergopeptides of
    Claviceps purpurea into LSA and iso-LSA under narrowly specified conditions
    (5 percent w/v, initial pH 12.5, at least 120 minutes reflux), yielding
    roughly a milligram of the lysergamides per gram of ergot. About one gram
    therefore meets literature minimum effective doses of LSA. Residual
    ergometrine persists even after peptide clearance, and Claviceps paspali
    hosts arrived in Europe only in the nineteenth century, so any historical
    reconstruction must stay with C. purpurea and accept an incomplete
    detoxification profile. Human LSA data (largely morning-glory exposures)
    show psychoactivity accompanied by prominent nausea, autonomic effects,
    anxiety, and occasional severe events; the claim that an achievable dose
    would reliably deliver the profound, largely positive visionary experience
    reported for Eleusis therefore remains only weakly supported. The further
    claim that ritual factors alone (fasting, procession, secrecy, drama,
    collective emotion) were causally insufficient is presently untestable from
    the supplied records; modern psilocybin trials demonstrate that pharmacology
    can occasion mystical-type experience, yet supply no historical necessity
    proof.

    Attribution at Eleusis rests on a single unreplicated 2002 report of ergot
    sclerotia in a ceremonial vessel and dental calculus at Mas Castellar de
    Pontós, an Iberian sanctuary linked to the Eleusinian goddesses, plus the
    newly demonstrated chemical feasibility. No vessel from Eleusis itself has
    ever been analyzed; the Homeric Hymn names only barley meal, water, and
    mint; and the sanctuary’s audited grain accounts record no drug expenditure.
    The Iberian find is therefore analogy, not identity, and the affirmative
    claim that the kykeon contained deliberately prepared ergot is only weakly
    supported. The empty cell is real and administrative rather than scientific,
    but an untested absence cannot be converted into positive evidence.

    The Christian half collapses under the earliest documents. The Didache’s
    berakah-style thanksgivings over cup and bread, Justin Martyr’s description
    of ordinary bread and wine mixed with water framed polemically against
    Mithraic imitation, and the absence of any non-polemical pharmacological
    Eucharist leave the strong-form claim that the original Eucharist was a
    psychedelic potion contradicted. Irenaeus’s account of Marcus is hostile
    heresiology describing stage magic and love-philters, not independent
    attestation of a sacrament. Specialist testimony (McGovern, Bremmer, Ehrman,
    Brown) and the author’s own on-record concessions further undermine both
    “some communities” and the full pagan-continuity transmission thesis. The
    Eucharist’s form and content read as Second-Temple Jewish meal practice; the
    claim that it developed out of pagan mystery-cult ritual rather than that
    matrix is contradicted.

    Structurally, therefore, the lower observational and mechanistic rungs are
    mixed-to-positive while the two attribution rungs and the transmission
    framework are weak-to-negative. The featured hypothesis as a single
    continuous ladder fails; its halves must be allowed to stand or fall apart.
    The decisive missing measurements remain organic residue analysis at Eleusis
    and on early Christian liturgical vessels. Until those exist, the grand
    synthesis cannot rise above mixed.
  steelman: The still-unperformed organic-residue analysis of securely contexted
    vessels from the Eleusis sanctuary itself, which the 2026 paper acknowledges
    has never been permitted; a positive ergoline result there would instantly
    convert the Iberian analogy and the now-demonstrated lye chemistry into the
    strongest direct case yet made for a psychedelic kykeon, leaving the
    phenomenological intensity of the Mysteries and any later literary echoes
    newly potent.
