      in Bronze Age Menorcan hair, and a multi-plant fermented preparation in a
      Ptolemaic Bes vessel. These establish deliberate ritual use as a real
      background practice. The strongest opposing consideration is geographic
      and chronological distance of some finds (and the California Datura quids)
      from the later Greek and Christian settings under discussion, so the claim
      supports only a prior, not transmission."
