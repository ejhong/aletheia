  synthesis: >-
    The featured hypothesis has two parts. The Eleusinian kykeon was a
    deliberately prepared ergot psychedelic, and the earliest Christians
    inherited that sacrament as the original Eucharist. The ladder lets the two
    halves be weighed separately, and they come out very differently.

    The lower rungs are sound and largely independent of the proponent network.
    Residue and tissue chemistry at Tel Arad, Es Càrritx and in the Bes vessel
    (E001–E003) well supports deliberate ritual use of psychoactive plants.
    Drug-compounded wines in Greco-Roman pharmacology are well supported, partly
    on background knowledge of Dioscorides pending R006. The Hymn's kykeon is,
    as text, meal, water and mint (E006). The one strong post-book result is the
    2026 lye experiment (E008, E038), which shows that ergopeptides can be
    hydrolyzed to LSA and iso-LSA. Its fine print makes the historical
    reconstruction more demanding, not less: complete detoxification came only
    at the harshest condition tested (C028), ergometrine persisted (C029), and
    the yield clears the cited threshold dose by a thin margin (C033). Nothing
    shows that such a drink would reliably produce a profound, positive
    experience (C006, E012), or that a drug was needed at all. C008's only
    support is one unlocated assertion (E040). The Greek headline, C007,
    therefore rests on possibility, a weak motive, and one secondhand,
    unreplicated ergot find in a Demeter/Kore-linked sanctuary in Catalonia
    (C004, E007). Against it stand a recipe that names nothing psychoactive
    (E015) and sanctuary accounts that show no drug expenditure (E016). That
    second point rests on Clinton's testimony, not yet checked against the
    stones. C007 is weakly supported: untested rather than refuted, because no
    Eleusinian vessel has ever been analyzed (E009).

    The Christian half fails on positive documentary evidence rather than
    silence. The earliest liturgies describe bread and a cup in Jewish
    thanksgiving form (E023). Justin describes bread with watered wine and
    frames mystery parallels as imitation (E022). The one "drugged cup" text is
    heresiology about a conjuring trick and love-philters (E021). The proponent
    himself declines to defend the Last Supper claim and concedes the
    transmission gap (E024). C011 and C013 are contradicted. C012 is the hinge
    of the "religion with no name." Every one of its dependencies is weak,
    unresolved or contradicted, and no channel of transmission is documented, so
    it is contradicted as well. Only the weak existential form, C010, stays
    open, because no early-Christian vessel has had any chemistry (R005).

    Steelman for: the chemistry now permits the Greek half, and the Pontós find
    has never been shown to be contamination. The decisive Eleusinian test has
    been blocked rather than failed. Normative church orders would not record a
    marginal or secret practice.

    Steelman against: even a positive Eleusinian residue would leave the
    Christian half untouched. The pro-side strand is one interest network: Road
    to Eleusis, "Mixing the Kykeon", the 2026 experiment and preprint, and YAPP
    (E010, E011, E008, E038, E040, E027). Its internal agreement is therefore
    not corroboration. And no one in this ledger has read the one physical datum
    at the primary level. I treat the expert quotations (E016–E018, E020) as
    testimony, not proof. The verdict rests on primary texts, measurements and
    the dependency structure.

    Verdict: contradicted for the two-part thesis as featured, carried by the
    Christian half. The Eleusinian half, standing alone, is weakly supported and
    decidable by R001.

    Sensitivity: the record whose removal would most change this verdict is
    E023, the Didache, the earliest and most diagnostic liturgical witness.
    Without it, C013 and C011 would rest on Justin, writing a century after the
    events, plus the proponent's concession, and would lose confidence. The case
    verdict survives, because C012 would still have no positive evidence and
    failing dependencies. It does not hang on one thread.

    No record in this packet is marked provisional. C029, C033 and C034 have no
    linked evidence record and are graded on disclosed alternative bases.
  steelman: The Mas Castellar de Pontós find is the observation this assessment
    discounts but does not explain. Ergot fragments were reported inside a
    ceremonial vase and in the dental calculus of a 25-year-old man, within a
    sanctuary attributed to Demeter and Kore (E007). That puts substance,
    ingestion and the Eleusinian goddesses' cult in one context, which is
    exactly the physical signature the hypothesis predicts. Nobody has shown it
    to be ordinary grain contamination. The site-wide comparison against cereal
    from mills and storage pits (R010) has never been made. The samples have
    never been re-analyzed (R004). The matching test on Eleusinian vessels has
    never been permitted (E009). A proponent can rightly say that the premise
    the whole continuity thesis needs, ritual ergot in the cult of the two
    goddesses, stands against an untested absence at Eleusis, not a negative
    result. Nothing in this ledger rules it out.
claimAssessments:
  - claimId: TIK-C001
    verdict: well_supported
    reasoning: "Three archaeochemical studies independent of the proponent network
      document deliberate ritual use of psychoactive plants: cannabis heated
      with dung on the Tel Arad shrine altar (E001), ephedrine, atropine and
      scopolamine in human hair from the Es Càrritx burial-and-cult cave (E002),
      and a multi-plant psychotropic preparation in a Bes ritual vessel (E003);
      E004 is a Californian methods benchmark, not Mediterranean evidence. For
      plants the claim is close to established. I stop at well_supported because
      the claim also names fungi, and no linked record shows ritual fungal use:
      the only candidate is the secondhand Mas Castellar ergot (C004), and
      Bremmer's remark that no ancient cult is known to have used mushrooms
      (E018) points the other way. Strongest opposing consideration: purpose is
      interpretive at Es Càrritx, the Bes vessel is unprovenanced, and there is
      no base rate (R008), though none of this defeats the existence claim. For
      the featured hypothesis this is a prior update only."
    confidence: high
  - claimId: TIK-C002
    verdict: well_supported
    reasoning: "E005 relays Dioscorides' first-century recipes for wines compounded
      with henbane and mandrake, including a black-nightshade wine said to cause
      \"not unpleasant visions\". E003 finds a fermented fruit-derived liquid
      with Peganum, Nymphaea and Cleome in a Hellenistic-period Egyptian vessel.
      The two agree, nothing in the ledger opposes this modest capability claim,
      and my confidence that the Materia Medica contains such drug-wines also
      leans on general background, a prior I disclose. Strongest opposing
      consideration: E005 is the proponent's secondhand summary in a friendly
      venue, not yet checked against the Greek text (R006), and E003's vessel is
      unprovenanced, so the ledger's own support is only moderate. The claim
      establishes medical capability; therapeutic drug-wines must not be
      reclassified as mystery or Eucharistic sacraments."
    confidence: moderate
  - claimId: TIK-C003
    verdict: established
    reasoning: 'The verified text says it: Demeter refuses red wine and bids them
      "mix meal and water with soft mint" (E006). That these words render Greek
      terms standardly glossed as barley meal and pennyroyal is philological
      background, not a ledger record, and does not affect the verdict. As a
      direct reading of a primary text, the claim is established. Strongest
      opposing consideration: the Hymn is a mythological origin story, not a
      liturgical manual, and pennyroyal is not pharmacologically inert (the 2026
      authors propose an untested potentiating role, R013), but neither changes
      what the text names. The real dispute is the implication, graded under
      C007: silence in a cult secret by law is weak evidence of absence.'
    confidence: high
  - claimId: TIK-C004
    verdict: provisionally_supported
    reasoning: "The sole evidence is E007, the 2026 paper's summary of
      Juan-Tresserras 2002 with exact chapter citations: ergot fragments in a
      ceremonial vase and in a 25-year-old man's dental calculus, within a
      sanctuary attributed to the two goddesses. The report itself is well
      attested, but nobody in this ledger has read the primary chapters, the
      identification method is unknown (R010), the analysis has never been
      replicated (R004), and two details of the claim, species-level \"Claviceps
      purpurea\" and the 4th–2nd century BCE date, are absent from the quoted
      summary. Strongest opposing consideration: ergot parasitizes cereal (the
      hypothesis's own premise, E010), so without a site-wide comparison against
      ordinary grain, ergot in a vessel and a grain-eater's calculus may be
      background rather than preparation; the later retelling as
      \"hallucinogenic alkaloids detected\" is unsupported. For the hypothesis
      it is analogy, not identity: Catalonia is, if anything, farther from
      Attica than the ledger's \"a thousand kilometers\" suggests."
    confidence: low
  - claimId: TIK-C009
    verdict: weakly_supported
    reasoning: "The only record (E014) is the proponent's summary of a genuine
      scholarly position attributed to Nock and MacDonald: Cana set against the
      Elis water-to-wine tradition, the \"true vine\" of John 15:1, and other
