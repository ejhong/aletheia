  - claimId: TIK-C005
    verdict: well_supported
    reasoning: "E008 is a peer-reviewed factorial experiment (48 runs; 1H-NMR and
      UHPLC/Q-TOF-HRMS). Lye at 5% w/v ergot, initial pH 12.5 and 120 minutes'
