      only as a consistency check). Strongest opposing consideration: it is a
      single run of work by the hypothesis's originating network, not replicated
      with independent or variable-content ergot (R002), and \"technically
      available in antiquity\" is the authors' argument, not a measurement; the
      record calls the reagent \"wood-ash-type\" lye, and only the strongest
      condition worked (C028). E010 and E011 are the mechanism's lineage, not
      corroboration, and feasibility is not evidence that anyone at Eleusis did
      it."
    confidence: high
