  synthesis: "The case splits: its foundations hold, the Greek attribution is weakly supported against an untested sanctuary, and the strong Christian claims are contradicted — so the roll-up is mixed. Ritual drug use is established by independent residue chemistry (TIK-E001, TIK-E002, TIK-E003, TIK-E004), and the Hymn's recipe is what it says (TIK-E006); neither discriminates between accounts. The 48-run hydrolysis experiment (TIK-E008) makes lye-processed ergot feasible for TIK-C005. The preprint (TIK-E038) fixes the narrow window for TIK-C028. The work is unreplicated and the hands are interested. Residual ergometrine (TIK-C029) and the paspali-host point (TIK-C034) have no evidence of their own and are unresolved. The dose step (TIK-C033) is graded only weakly, on the measured yield under TIK-C005 and an unchecked threshold. LSA's human profile (TIK-E012) keeps TIK-C006 mixed. For TIK-C007 the decisive cell is empty, not negative (TIK-E009). The silent recipe (TIK-E015), the audited accounts (TIK-E016) and the methodological critique (TIK-E019) press against it. It is propped only by the Pontós find, one unreplicated analysis read through citation (TIK-E007, on TIK-C004). TIK-C008 is unresolved: no record shows ritual sufficiency or its failure, and the proponents' 'numerous accounts' are uncited (TIK-E040, TIK-E041). On the Christian side the record is contrary, not empty. Justin and the Didache describe a Jewish thanksgiving rite (TIK-E022, TIK-E023, on TIK-C011 and TIK-C013). The one drugged-cup text is fraud polemic (TIK-E021, on TIK-C010). Specialists reject the inheritance thesis (TIK-E017, TIK-E018, TIK-E020, on TIK-C012), and the author declines the strong form (TIK-E024). The record whose removal would most change the verdict is TIK-E008. Without it TIK-C005 reverts to a 26-year-old proposal, TIK-C007 loses its only mechanism, and the Greek half slides toward contradicted. Independence is thin throughout, and the funding tie on the program positioned to test TIK-C007 and TIK-C010 (TIK-E027) includes this project's founder."
  steelman: The Mysteries were secret by law, and every countervailing record here is silence where silence is expected. The Hymn is public myth (TIK-E015) and the accounts are public stone (TIK-E016); neither would record a secret ingredient gathered free from the field. Meanwhile the hypothesis has come out right both times it was checked. The one goddess-linked sanctuary whose vessel and worshipper were examined reportedly showed ergot in the cup and in a man's teeth (TIK-E007, on TIK-C004). The one test of the mechanism came out positive under conditions Greek technology could supply (TIK-E008, on TIK-C005). Complex psychotropic ritual drinks are chemically real in the Hellenistic world (TIK-E003), and drug-occasioned mystical experience is real (TIK-E013). The skeptical account has never been tested at Eleusis at all (TIK-E009). A hypothesis that predicts correctly whenever it is checked, against a rival never checked, deserves more than 'weakly supported'. This assessment does not answer that argument. It holds that two checks — one unreplicated, one unread at its source — cannot carry the weight, and that the empty cell is empty for both sides.
