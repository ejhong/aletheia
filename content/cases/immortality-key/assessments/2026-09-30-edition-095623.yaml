caseAssessment:
  verdict: mixed
  whatIsClaimed: "The Eleusinian Mysteries served a psychedelic kykeon made from lye-processed ergot, and the earliest Greek-speaking Christians inherited that sacrament as a drugged Eucharist. The author's scholarly form is weaker: he does not defend a psychedelic Last Supper and says the smoking gun remains elusive. This case grades the strong form and treats 'some community spiked its cup' as its weak version."
  whereDisagreementLives: "The dispute lives in two cells nobody has measured: no Eleusinian vessel and no early-Christian vessel has ever been chemically tested. Around them sit four further points of contention. The one recipe names nothing psychoactive. The only ergot find, in Iberia, is unreplicated and not yet read at its source. No one has settled whether any ancient text describes a vision during initiation. And the earliest Eucharist texts describe a Jewish table, with no chain shown from mystery cult to church."
  whatWouldSettleIt: "Chemical tests of Eleusinian cups for LSA and related compounds above soil background would settle the Greek half; a preregistered survey of early-Christian vessels would test the Christian half. Three further checks would decide the steps between: reading and re-testing the 2002 Pontós find, an independent blinded repeat of the lye chemistry with a profile of the whole drink, and an audit of the ancient texts for any experience during initiation."
  bestConventionalExplanation: "Eleusis worked without a drug. Fasting, procession, secrecy, darkness and light, ritual drama and collective emotion produced the experience, if there was a transforming 'vision' at all rather than afterlife hopes read through a modern lens. The kykeon was barley, water and mint, as its one recipe says. Ancient drug-wines were medicine, not mystery sacraments. The Pontós ergot, if it survives re-reading, is the fungus barley carries, found in a barley vessel, unless the report shows a contrast with the site's grain. The Eucharist descends from Jewish meal blessings, as the Didache and Justin present it. This account's unpaid debt: nobody has tested the vessels that could falsify it, and ritual sufficiency is asserted more than shown."
  components:
    - label: Ancient ritual drug use
      state: established
      note: Residue chemistry from independent teams, at Arad, Menorca, a Bes vessel and a California cave, shows the practice existed. It says nothing about what Eleusis or the church used.
    - label: Making ergot drinkable with lye
      state: well_supported
      note: Shown once, in 48 runs by sympathetic authors, not yet repeated; full detoxification only at the harshest setting. Leftover ergometrine and the late-arriving grass host are reported but unchecked.
    - label: What the reconstructed drink would do
      state: mixed
      note: LSA is psychoactive but weaker and rougher than LSD. The whole drink has never been profiled, and the one-gram dose estimate rests on an unchecked threshold.
    - label: Ergot in the Eleusinian kykeon
      state: weakly_supported
      note: "No Eleusinian vessel has been tested. Support: one unreplicated Iberian find, read second-hand. Against: a recipe naming nothing psychoactive, and audited accounts showing no drug spending."
    - label: Whether a drug was needed, or there was a vision to explain
      state: unresolved
      note: Nothing shows ritual alone suffices or fails. Proponents cite 'numerous accounts' they do not quote, and no one has audited whether any ancient text describes an experience during initiation.
    - label: The Christian half
      state: contradicted
      note: The earliest texts describe bread and wine at a Jewish thanksgiving table, the one drugged-cup text is a fraud accusation, and specialists reject inheritance. Whether some community spiked its cup is untested.
