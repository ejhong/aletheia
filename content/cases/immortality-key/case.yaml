id: TIK-001
slug: immortality-key
title: "The Religion with No Name?"
subtitle: "Did a psychedelic sacrament power the Eleusinian Mysteries — and did the earliest Christians inherit it as the original Eucharist?"
domain: "Classical archaeology · Archaeochemistry · Early Christianity"
status: active
summary: >-
  Brian Muraresku's 2020 bestseller The Immortality Key argues that the kykeon drunk at the Eleusinian Mysteries was a psychedelic ergot preparation, and that the earliest Greek-speaking Christians inherited a version of that sacrament as the original Eucharist. The controversy is not one proposition but a ladder of increasingly ambitious ones, and the evidence thins fast as it climbs. Direct chemistry has settled the lowest rungs — ancient peoples demonstrably used psychoactive plants in ritual — and a 2026 experiment showed that wood-ash lye can convert toxic ergot into psychoactive lysergamides. But no vessel from Eleusis has ever been chemically analyzed, the one ergot-in-cult-context find sits a thousand kilometers away in Iberia, and the earliest Eucharistic documents describe bread and wine in a Jewish thanksgiving liturgy. The case splits cleanly at Eleusis versus Christianity, and an honest map must let the two halves fail — or survive — separately.
