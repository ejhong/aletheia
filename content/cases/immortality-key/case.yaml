researchPriority:
  level: high
  reason: >-
    The decisive tests are unusually cheap and well-defined: residue
    analysis of curated Eleusinian vessels (TIK-R001) is blocked by
    permission rather than science, and modern re-analysis of the Mas
    Castellar samples (TIK-R004) would move the case's one archaeological
    datum in either direction for archive-project money.
components:
  - label: "Ancient ritual psychoactive use (the background)"
    state: established
    note: "Direct chemistry from multiple independent sites; no longer seriously in doubt as a general phenomenon."
  - label: "An ancient-feasible ergot preparation (the chemistry)"
    state: well_supported
    note: "Demonstrated in 2026 as feasibility by interested-network authors; feasibility is not evidence of historical practice."
  - label: "Ergot in the kykeon at Eleusis"
    state: weakly_supported
    note: "One unreplicated analogue in Iberia plus a workable mechanism; zero direct evidence from Eleusis, whose vessels have never been tested."
  - label: "A psychedelic original Eucharist inherited from the Mysteries"
    state: contradicted
    note: "As history, per the earliest documentary record (a Jewish meal liturgy of bread and wine); no early-Christian vessel has ever been chemically tested."
