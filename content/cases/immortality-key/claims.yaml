    which is why the book leads with it and the evidence ledger cannot.
  parentClaimIds: [TIK-C010]
  dependsOnClaimIds: [TIK-C010, TIK-C012]
  strongestObjection: >-
    (To the contradicted grade:) all the earliest descriptions are
    normative insider texts written decades after the events they
    describe, and a secret ingredient is exactly what such texts would
