# ── Mechanism rung: could it work? ──────────────────────────────────────────

- id: TIK-C005
  statement: >-
    Wood-ash lye processing, technically available in antiquity, can
    convert the toxic ergopeptides of Claviceps purpurea into the
    psychoactive lysergamides LSA and iso-LSA.
  plainLanguage: >-
    The 2026 laboratory result: reflux powdered ergot in strong lye —
    something achievable with wood ash and water — and the poisonous
    alkaloids that cause ergotism break down completely while measurable
    amounts of the milder psychoactive compounds appear. The classic
    "ergot would have poisoned everybody" objection is no longer available
    at the level of possibility.
  theme: chemistry
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "TIK intake briefs — feasibility rung (C5 / TIK-C004)"
    extractedBy: "Fable (AI agent)"
    runId: "tik-import-2026-08-25"
    date: "2026-08-25"
  sourceAnchor:
    locator: "Antonopoulos et al. 2026, Results and Discussion (Sci Rep 16:8757; full text read 2026-08-25)"
    quote: "yielding 0.54 mg LSA and 0.48 mg iso-LSA per gram of ergot at 120 min"
    sourceId: SRC-ANTONOPOULOS-2026
  credibility: well_supported
  credibilitySummary: >-
    Demonstrated across a 48-run experimental design with NMR and
    UHPLC/Q-TOF-HRMS confirmation (TIK-E008): at 5% w/v ergot, initial lye
    pH 12.5, and 120 minutes of reflux, the six predominant toxic
    ergopeptides and their epimers were completely hydrolyzed while LSA
    and iso-LSA appeared at 0.54 and 0.48 mg per gram of ergot. Graded as
    feasibility: the authors are explicit that demonstrating the
    transformation, not ancient practice, was the study's scope — and the
    interested-network authorship (hypothesis originators among the
    co-authors) makes independent replication (TIK-R002) the fastest
    credibility lever available to the pro side.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Removes an objection rather than adds a detection: chemistry that
    works in a modern lab with ancient-available operations makes the
    hypothesis testable and plausible, and says nothing about whether
    anyone at Eleusis did it (TIK-C007). Note also what the successful
    condition implies: a controlled, strongly alkaline, two-hour hot
    process — a specific technology, not contaminated barley in water.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    Performed once, by a team including the hypothesis's originators and
    an entheogen-advocacy research center, with modern pH control and
    modern ergot; lower-pH and shorter-time conditions left toxic
    ergopeptides detectable, so the safety margin of a sensory-cue-guided
    ancient operator is untested (TIK-R002, TIK-R003).
  whatWouldChangeOurMind:
    - "Failure of independent replication with blinded ergot samples of known variable alkaloid content (TIK-R002)."
    - "Toxicology on the full reaction mixture showing residual harmful products the monitored panel missed (TIK-R003)."

- id: TIK-C006
  statement: >-
    An LSA/iso-LSA-rich ergot preparation, at doses achievable from about
    a gram of ergot, would reliably produce the profound and largely
    positive visionary experience attributed to Eleusinian initiation.
  plainLanguage: >-
    "Related to LSD" is doing a lot of quiet work in the popular story.
    LSA is psychoactive, but it is substantially weaker than LSD and its
    human record is messier — sedation, nausea, blood-pressure effects,
    anxiety — so whether the reconstructed drink delivers a reliably
    transcendent experience, rather than an unpleasant sedated one, is an
    open pharmacology problem.
  theme: chemistry
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: supporting
  reviewState: ai_extracted
  origin:
    ref: "TIK intake briefs — pharmacology gap (C6 / four-claim split)"
    extractedBy: "Fable (AI agent)"
    runId: "tik-import-2026-08-25"
    date: "2026-08-25"
  credibility: mixed
  credibilitySummary: >-
    The components with meaningful support: LSA reaches the brain, is
    psychoactive, and can produce hallucinations and euphoria (TIK-E012);
    pharmacologically induced mystical-type experience is real in modern
    trials (TIK-E013). The component without it: that this preparation at
    this dose reliably yields the profound, positive, mass-administered
    experience the Mysteries were famous for — the systematic review
    documents prominent nausea, autonomic effects, anxiety, and occasional
    severe outcomes, and the full reconstructed mixture has never been
    profiled (TIK-R003).
  diagnosticity: moderate
  diagnosticitySummary: >-
    If the reconstructed preparation's pharmacology cannot plausibly
    produce the reported phenomenology at achievable doses, the ergot
    hypothesis loses its motive even if the chemistry works; if it can,
    the hypothesis's central mechanism stands. A researchable gap, not a
    verdict.
  parentClaimIds: [TIK-C005]
  dependsOnClaimIds: [TIK-C005]
  strongestObjection: >-
    The human LSA literature is dominated by morning-glory-seed exposures
    with prominent vegetative and dysphoric effects; nothing establishes
    that an iso-LSA-heavy crude ergot extract at about one gram of ergot
    per initiate reliably produces anything an initiate would call the
    best night of their life.
  whatWouldChangeOurMind:
    - "Receptor profiling, toxicology, and dose modeling of the complete reconstructed extract (TIK-R003) landing clearly on either side."
    - "Evidence that the historical preparation differed (e.g., ergonovine-rich chemotypes) in ways that change the expected experience."

- id: TIK-C008
  statement: >-
    The transformative experiences reported by Eleusinian initiates
    required a pharmacological agent — fasting, procession, secrecy,
    ritual drama, and collective emotion being insufficient to explain
    them.
  plainLanguage: >-
    The Mysteries reliably delivered something extraordinary; Sophocles,
    Pindar, and Cicero all say so. The dispute is over the generator. The
    mainstream position in classics is that intense ritual is a sufficient
    one — fasting, anticipation, darkness and light, mass emotion — which
    would leave a drug possible but unnecessary.
  theme: eleusis
  rung: mechanism
  tier: featured
  claimType: causal
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "TIK intake briefs — competing causal models (H-Drug/H-Ritual/H-Mixed)"
    extractedBy: "Fable (AI agent)"
    runId: "tik-import-2026-08-25"
    date: "2026-08-25"
  credibility: unresolved
  credibilitySummary: >-
    No test adjudicates between the pharmacological, ritual, and mixed
    models; both sides explain the same testimony. Modern trials show the
    pharmacological route is real (TIK-E013); the ritual-sufficiency
    model is the mainstream default (held here as background pending an
    exact-wording audit of its canonical statements); and the mixed model
    — ritual amplifying a modest pharmacological stimulus — would survive
    almost any single finding. Extraordinary testimony must not be filed
    exclusively under the hypothesis that first cited it.
  diagnosticity: high
  diagnosticitySummary: >-
    Asymmetrically diagnostic: if ritual mechanisms suffice, the drug
    hypothesis loses its explanatory motive (though not its possibility);
    proving chemistry present would still not show chemistry was the
    generator. This claim is where the false dichotomy between "ergot"
    and "nothing happened" goes to be dismantled.
  parentClaimIds: [TIK-C007]
  dependsOnClaimIds: []
  strongestObjection: >-
    Two millennia of stable, scalable operation on fasting-plus-ritual is
    exactly what the non-drug model predicts and requires no secret
    ingredient, no supply chain, and no dosing control — a simpler
    machine.
  whatWouldChangeOurMind:
    - "Positive residue chemistry from Eleusinian vessels (TIK-R001), which would establish the pharmacological ingredient (though not yet its necessity)."
    - "A well-designed demonstration that matched non-pharmacological ritual reliably reproduces experiences of the reported intensity, which would complete the sufficiency argument."

