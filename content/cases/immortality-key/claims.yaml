# ── Attribution rung: the Christian half ────────────────────────────────────

- id: TIK-C010
  statement: >-
    Some early Christian communities consumed psychoactive substances in
    their Eucharistic meals.
  plainLanguage: >-
    The Christian half's most defensible form, and the one the author says
    he actually holds: not that Jesus served a drug, but that somewhere in
    the diverse first centuries, some community's cup was spiked. Nobody
    has found one — and nobody has looked with chemistry.
  theme: christian
  rung: attribution
  tier: featured
  claimType: historical
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "TIK intake briefs — Christian headline (C10 / Stang decomposition)"
    extractedBy: "Fable (AI agent)"
    runId: "tik-import-2026-08-25"
    date: "2026-08-25"
  credibility: unresolved
  credibilitySummary: >-
    No securely identified early-Christian vessel has ever supplied direct
    evidence, and none has been chemically tested (TIK-R005). The
    capability existed in the surrounding world (TIK-C002); the one
    "drugged cup" text in the record is hostile polemic describing a
    conjuring trick and love-philters (TIK-E021); the book's own
    scientific witnesses call the connecting evidence extremely weak
    (TIK-E017). Testable, untested, and — per the sympathetic critic
    Stang — plausible enough to test, with the caveat that one positive
    vessel would establish a practice somewhere, not the norm.
  diagnosticity: high
  diagnosticitySummary: >-
    Load-bearing for the Christian half: without at least one real
    community doing this, the psychedelic-Eucharist thesis has no
    instances. Note what even a positive would not show: that the
    practice was normative (TIK-C011) or inherited from the Mysteries
    (TIK-C012).
  parentClaimIds: [TIK-C012]
  dependsOnClaimIds: []
  strongestObjection: >-
    After a century of intensive early-Christian archaeology and
    philology, no text, image, or object independently indicates a
    psychoactive Eucharist anywhere — the argument currently runs
    entirely on capability and analogy.
  whatWouldChangeOurMind:
    - "A preregistered residue survey of securely identified early-Christian liturgical vessels (TIK-R005): one replicated positive would transform this claim; a well-documented broad null would substantially close it."

