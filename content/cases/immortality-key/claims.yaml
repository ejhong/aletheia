    in the ancient Mediterranean and Near East.
  plainLanguage: >-
    The floor of the ladder, and the part modern chemistry has settled:
    people in the ancient world really did take mind-altering plants in
    religious settings — cannabis burned on a Judahite altar, alkaloids
    measured in Bronze Age hair from a Menorcan cult cave, a psychotropic
    cocktail in an Egyptian ritual mug.
