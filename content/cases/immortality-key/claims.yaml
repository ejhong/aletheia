  rung: attribution
  tier: featured
  claimType: historical
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "TIK intake briefs — strong-form Eucharist claim (C11 / TIK-C007)"
    extractedBy: "Fable (AI agent)"
    runId: "tik-import-2026-08-25"
    date: "2026-08-25"
  credibility: contradicted
  credibilitySummary: >-
    Contradicted as history by the documentary record we actually have:
    the earliest Eucharistic texts (1 Cor 11:23–26; Didache 9–10,
    TIK-E023; Justin, First Apology 65–67, TIK-E022) describe bread and
    wine in Jewish thanksgiving form, the rite's documented antecedents
    are Jewish meal liturgies, and the author himself does not hang his
    hat on a psychedelic Last Supper (TIK-E024). The contradiction is
    documentary, not chemical — no early Christian vessel has been tested
    (TIK-R005) — so it is revisable in principle, but the present record
    points one way.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Its failure does not sink the weaker Christian claim (TIK-C010): a
    fringe community's spiked cup is compatible with an ordinary original
