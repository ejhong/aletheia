# Canon layer. Claims extracted by an AI agent (Fable) from two intake
# research briefs (inbox, 2026-08-25) and the independently verified source
# literature. reviewState is honest provenance: nothing here has been
# hand-checked by a human yet.
#
# The ladder deliberately splits at Eleusis versus Christianity — the public
# debate's main failure mode is blending the two — and separates, on each
# side, what was found from what would make it work from what it would mean.
# Evidence for a lower rung must not silently climb: a chemically proven
# Bronze Age hallucinogen in Menorca is excellent evidence against "ancient
# Europeans did not ingest psychoactive plants" and almost no evidence that
# a Christian in Corinth drank one a millennium later.

