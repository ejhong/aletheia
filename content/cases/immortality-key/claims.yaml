  plainLanguage: >-
    The strong form the marketing sells and the author declines to defend.
    The earliest descriptions we have of the rite — Paul, the Didache,
    Justin — describe bread and wine (Justin: wine mixed with water) in a
    Jewish-style thanksgiving meal, and none hints at anything else in
    the cup.
