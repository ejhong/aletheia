# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit; sourceStatement (what the
# source says) is kept separate from editorInference (what we infer).
#
# Two disciplines matter unusually much in this case. Distance: the
# background archaeochemistry (TIK-E001–E004) is strong evidence for the
# lowest rung and nearly none for the upper ones, and each record says so.
# Independence: the pro-hypothesis research strand (Road to Eleusis →
# "Mixing the Kykeon" → the 2026 experiment → YAPP) is one interest network
# with shared personnel and funders — including, by way of the YAPP funding
# disclosure, this project's own founder — so records from it carry the
# network flag rather than being counted as independent corroboration.

