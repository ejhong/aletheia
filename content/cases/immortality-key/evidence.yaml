  claimIds: [TIK-C007]
  sourceId: SRC-REASON-2025
  direction: undermines
  strength: moderate
  sourceStatement: >-
    Kevin Clinton (Cornell), a leading Eleusis epigrapher, is quoted: the
    Athenian sanctuaries "produced annual financial accounts that were
    publicly audited and published on stone; any expenses for drugs would
    have been public knowledge. Athens produced a financial account of
    its entire production of barley and wheat, from which a portion of
    grain was given to the sanctuary, to be sold and the funds used for
    sacrifices and dedications, none of it for the production of ergot or
    drugs." He adds that no evidence of drug use has been found at
    Eleusis and that the book "demonstrates how not to do research on
