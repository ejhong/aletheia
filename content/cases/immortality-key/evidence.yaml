    grain used conventionally. It is not decisive — a secret rite's
    ingredient could be small-scale, unpurchased (gathered from the
    Rarian field), or hidden in ordinary grain flows — but it converts
    the argument from silence into an argument from a specific,
    published, audited silence.
  exactLocator: "Reason, 2025-02-09; quotes verified against the article 2026-08-25"
  limitations:
