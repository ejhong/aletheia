- id: TIK-E008
  title: "The 2026 lye-hydrolysis experiment: toxic ergopeptides to LSA/iso-LSA"
  claimIds: [TIK-C005]
  sourceId: SRC-ANTONOPOULOS-2026
  direction: supports
  strength: strong
  sourceStatement: >-
    Across 48 experimental runs, pulverized Claviceps purpurea sclerotia
    refluxed in wood-ash-type lye at 5% w/v and initial pH 12.5 for 120
    minutes showed complete disappearance of all six predominant toxic
    ergopeptides and their C-8 epimers (1H-NMR and UHPLC/Q-TOF-HRMS),
    with LSA and iso-LSA produced at 0.54 and 0.48 mg per gram of ergot;
    lower pH or shorter treatments left toxic ergopeptides detectable.
    The authors extrapolate that about 1 g of ergot per initiate could
    supply an active dose, state that "the focus of the study was to
    demonstrate the feasibility of this transformation in the specific
    historical-technological context," and close by calling for advanced
    organic residue analysis of archaeological material from Eleusis.
  editorInference: >-
    The strongest post-book development that touches Eleusis: it retires
    "ergot necessarily means ergotism" as an objection at the level of
    possibility. What it does not do, by its own framing, is show anyone
    at Eleusis used the method — and the successful condition (strong
    lye, two hours hot, complete hydrolysis only at the highest pH) makes
    the historical reconstruction more demanding, not less: a specific
    controlled processing technology is now required, and no source
    attests one.
  exactLocator: "Sci Rep 16: 8757, Results ('Quantitation of LSA and iso-LSA') and Discussion/Conclusion; full text read 2026-08-25"
  limitations:
    - "Interested-network authorship: co-authors include the hypothesis's originators (Ruck; the Wasson Ruck institute's Hoffman) and three members of an entheogenic-research center; formally declared no competing interests and no external funding. Independent replication with blinded variable-content ergot is TIK-R002."
    - "Chemical safety shown as disappearance of the monitored ergopeptides — not a human safety trial, and no in-vivo psychoactivity data (TIK-R003)."
    - "Modern ergot from collections and field sources; the authors argue evolutionary continuity of ergot chemistry, which is an argument, not a measurement of ancient Greek ergot."
  reviewState: ai_extracted
  origin:
    ref: "TIK intake briefs — the 2026 experiment"
    extractedBy: "Fable (AI agent)"
    runId: "tik-import-2026-08-25"
    date: "2026-08-25"

