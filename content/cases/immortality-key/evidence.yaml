- id: TIK-E012
  title: "Systematic review of LSA pharmacology: psychoactive, weaker than LSD, messy in humans"
  claimIds: [TIK-C006]
  sourceId: SRC-CASTRO-2025
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The 2025 systematic review characterizes lysergic acid amide (LSA) as
    a psychoactive LSD analog with documented hallucinations and euphoria,
    alongside prominent adverse outcomes in the human literature —
    nausea, autonomic and vegetative effects, anxiety, and occasional
    severe psychiatric or cardiovascular events — and substantially lower
    potency than LSD.
  editorInference: >-
    Keeps the pharmacological gap open and honest: "LSA was produced"
    does not become "an LSD-like mystical experience would predictably
    result." Four separable propositions — LSA reaches the brain, is
    psychoactive, can hallucinate, and reliably yields a profound
    positive experience at achievable doses — have support that stops at
    the third.
