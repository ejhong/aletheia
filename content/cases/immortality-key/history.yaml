  change: "Corrections applied from proposals/2026-09-16-draft-immortality-key-025010: SRC-JUAN-TRESSERRAS-2002.title — \"Estudis dels residus orgànics per a la identificació de possibles ritus i ofrenes; Els productes vegetals per a ús domèstic (chapters in Mas Castellar de Pontós (Alt Empordà): Un complex arqueològic d'època ibèrica (Excavacions 1990–1998), ed. E. Pons i Brun)\" → \"Estudis dels residus orgànics per a la identificació de possibles ritus i ofrenes (pp. 548–556); Els productes vegetals per a ús domèstic a partir de la caracterització de microrrestes vegetals i compostos orgànics (pp. 477–481) (chapters in Mas Castellar de Pontós (Alt Empordà): Un complex arqueològic d'època ibèrica (Excavacions 1990–1998), ed. E. Pons i Brun; Museu d'Arqueologia de Catalunya–Girona)\"; IMG-TIK-P05.depicts — \"The floor of the Telesterion at Eleusis — the initiation hall where, for nearly two millennia, initiates drank the kykeon at the climax of the Mysteries. The sanctuary is excavated and its ceramics curated; the residue question the photograph cannot answer is carried by TIK-C007.\" → \"The floor of the Telesterion at Eleusis — the initiation hall in which, for nearly two millennia, the Mysteries reached their climax. The kykeon's place in the programme is a point of scholarly dispute: the initiates' formula 'I fasted, I drank the kykeon' ties it to the end of the sixth day's fast, and no source states that it was drunk in this hall. The sanctuary is excavated and its ceramics curated; the residue question the photograph cannot answer is carried by TIK-C007.\"."
  reason: "SRC-JUAN-TRESSERRAS-2002: The retrieved Research Square preprint of the 2026 paper (refs. 23–24) gives the page ranges 548–556 and 477–481 and the publisher for the two chapters; adding them gives TIK-R004 and the desk read of the primary an exact target. Verification stays unverified: the chapters themselves were not opened. | IMG-TIK-P05: The caption states as fact that the kykeon was drunk 'at the climax' in the Telesterion. The retrieved Gainsford post places it at the end of the sixth day's fast and says initiation 'didn't consist of one ritual drink'; the report also carries (from Bremmer 2014, not retrievable this pass) a reading that puts it outside the Greater Mysteries altogether. A plate caption should not settle a timing the specialists dispute; the revised text keeps the hall and the climax and leaves the drink's placement open."
