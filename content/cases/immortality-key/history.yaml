  reason: "Admitted after verification: SRC-ANTONOPOULOS-2025, TIK-E038, TIK-E040, TIK-E041, TIK-C028, TIK-C029, TIK-C033, TIK-C034, TIK-C035, TIK-R009, TIK-R010, TIK-R011, TIK-R012, TIK-R013; everything else proposed was refused or blocked with a reason in dispositions.yaml. The drafter's rationale for the proposal, written before verification and describing what it proposed: A bounded pass on the Greek half. Three of the report's eight sources were retrievable and read: Lucejko et al. 2018 (via the PMC open-access copy), Gainsford's 2021 Kiwi Hellenist post, and the Research Square preprint of the 2026 kykeon hydrolysis paper. From these I propose three sources, twenty-two single-proposition claims anchored to shown text, ten evidence records, five research items, and two scalar corrections (page locators for the unverified Pontós chapters, taken from the preprint's reference list; a softened Telesterion caption that no longer asserts the kykeon's timing as fact). Everything the report drew from Samorini, Bremmer 2014, Bennett 2021 and the unopened primary reports (Juan-Tresserras 2000, Adroher 1993, Portorusso, Czernikowice, Grauballe, Ciaraldi 2000, Calvari d'Amposta) is dispositioned blocked or irrelevant with the route to the primary; in particular the mill-flour negative at Pontós — the report's most consequential lead — enters only as the test a research item describes, not as a finding. Directions are honest to genre: Gainsford is a classicist's blog (weak), Lucejko is peer-reviewed chemistry that never mentions Eleusis (its bearing on TIK-C004 is a base-rate qualification), and the preprint's declarations are the authors' own statements about themselves (context). No edition change: the record deepens, the telling stands."
