# Change history for the Immortality Key case. Append-only.

- date: "2026-08-25"
  change: >-
    Source-mining layer produced: two AI research briefs ("The Immortality Key as an Aletheia Case: Evidence Map, Countercase, and Research Agenda" and "Aletheia Case Draft — TIK-001", founder-supplied; kept out of the repo per the casework convention) mapped the Muraresku controversy onto the Aletheia structure — a thirteen-claim ladder splitting the Greek half from the Christian half, an evidence map spanning the post-2020 archaeochemistry and the 2026 ergot-detoxification experiment, a countercase file (Clinton, McGovern, Bremmer, Ehrman, Mosurinjohn & Ascough, Brown), and a draft research agenda centered on the never-performed residue tests.
  reason: "Structure the topic before importing anything, so evidence for low rungs (ancient drug use generally) cannot silently support high ones (a psychedelic Eucharist)."
