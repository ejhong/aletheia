# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license, presented as numbered
#            museum plates. Duotone treatment is applied in CSS at display
#            time; the original files are unmodified apart from resizing.

- id: IMG-TIK-COVER
  role: cover
  file: /images/cases/immortality-key/cover.jpg
  alt: >-
    Hand-tinted engraving of a two-handled ancient Greek cup on a stone
    ledge, its interior dark, with barley ears bearing dark hornlike
    sclerotia leaning beside it, a grapevine climbing one handle, a mint
    sprig at its foot, and two crossed unlit torches behind.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-25"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph,
    chromolithograph plate from a vintage natural-history atlas. A
    two-handled ancient Greek drinking cup standing on a plain stone ledge
    in a quiet niche, sheaves of barley leaning beside it with a few grain
    heads bearing darkened, hornlike sclerotia, a small sprig of mint laid
    at its foot, and a grapevine climbing one handle; two crossed unlit
    ceremonial torches rest behind the cup. The cup's interior is dark and
    unreadable — the question is what it held. An allegorical emblem, never
    a depiction of any real excavated vessel, sanctuary, or laboratory
    result as documentation. Fine copperplate cross-hatching and stipple
    engraving beneath soft, translucent hand-applied watercolor washes.
    Full color in subdued antique mineral pigments — muted Tyrian purple
    and wine-dark washes on the cup and vine, pale barley-gold ears of
    grain, warm umber shadows, one small pale-mint green accent on the herb
    sprig — over warm-black ink linework on aged warm cream paper
    (#f6f1e8). Colors muted and slightly faded as if printed in 1870; never
    saturated modern digital color, no gradients, no glow. Darwin-era
    natural-history journal plate aesthetic, generous plain paper margins,
    quiet composition. Absolutely no text, no labels, no captions, no
    border frame lines. Unmistakably a hand-tinted engraving — stylized
    editorial artwork, not photorealistic, no photograph.

- id: IMG-TIK-P01
  role: plate
  file: /images/cases/immortality-key/plates/tel-arad-fortress-altar1949.jpg
  alt: >-
    Stone ruins of a small temple at Tel Arad under an overcast sky: a
    large rubble-built altar block in the foreground and, behind it, steps
    rising to a niche holding a standing stone, with an interpretive sign
    in front.
  source: commons
  license: "CC BY-SA 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/4.0"
  credit: "יעקב, via Wikimedia Commons"
  plateNumber: 1
  depicts: >-
    The temple complex in the upper fortress at Tel Arad, Israel — the
    eighth-century BCE Judahite shrine whose two limestone altars carried
    the residues analyzed in 2020: cannabis with animal dung on the smaller,
    frankincense with animal fat on the larger (TIK-E001). The photograph
    shows the excavated shrine as displayed at the site; the analyzed
    altars themselves are curated in the Israel Museum, Jerusalem. The
    site is in the Negev, not Greece; nothing in the photograph depicts
    Eleusis or the Eucharist.
  provenance:
    photographer: "יעקב"
    date: "2023-02-12 12:19:28"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Tel_Arad_fortress_altar1949.jpg"
    originalTitle: "File:Tel Arad fortress altar1949.jpg"
  claimIds: [TIK-C001]

- id: IMG-TIK-P02
  role: plate
  file: /images/cases/immortality-key/plates/nama-myst-res-d-eleusis.jpg
  alt: >-
    Red-figure clay votive plaque with a pedimented top, painted with two
    registers of robed figures in procession toward enthroned goddesses,
    some carrying bundled branches and round-topped vessels, with a Greek
    dedication inscription along the bottom edge.
  source: commons
  license: "Public domain"
  credit: "Marsyas (photograph), via Wikimedia Commons"
  plateNumber: 2
  depicts: >-
    The Ninnion Tablet (National Archaeological Museum, Athens): a
    fourth-century BCE clay votive plaque dedicated at Eleusis by a woman
    named Ninnion, generally read as the only surviving ancient depiction
    of the Mysteries' rites — processing initiates with branches and, on
    some figures' heads, the lidded vessels associated with the kykeon.
    The tablet does not depict what those vessels held; the contents of
    the kykeon are the question carried by TIK-C003 and TIK-C007.
  provenance:
    photographer: "Marsyas"
    date: "19 December 2005 (original upload date)"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:NAMA_Myst%C3%A8res_d%27Eleusis.jpg"
    originalTitle: "File:NAMA Mystères d'Eleusis.jpg"
  claimIds: [TIK-C003]

- id: IMG-TIK-P03
  role: plate
  file: /images/cases/immortality-key/plates/hordeum-vulgare-claviceps-purpurea-23-7-2009.jpg
  alt: >-
    Close-up of a bowl of pale gold barley grains mixed with scattered
    dark purplish-black, elongated horn-shaped bodies.
  source: commons
  license: "CC BY-SA 3.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/3.0"
  credit: "Dominique Jacquin, via Wikimedia Commons"
  plateNumber: 3
  depicts: >-
    Harvested barley (Hordeum vulgare) contaminated with the dark sclerotia
    of ergot (Claviceps purpurea) — the fungus named by the Eleusinian
    hypothesis (TIK-C005). Raw sclerotia contain the toxic ergopeptides
    that cause ergotism. The photograph documents the organism and its
    grain host, not any ancient practice.
  provenance:
    photographer: "Dominique Jacquin"
    date: "2009-07-23"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Hordeum_vulgare_Claviceps_purpurea_23-7-2009.JPG"
    originalTitle: "File:Hordeum vulgare Claviceps purpurea 23-7-2009.JPG"
  claimIds: [TIK-C005]

- id: IMG-TIK-P04
  role: plate
  file: /images/cases/immortality-key/plates/poblado-bero-de-mas-castellar-pont-s-gerona.jpg
  alt: >-
    Low stone wall foundations of an ancient settlement in a grassy
    clearing ringed by trees, with a red interpretive panel in the
    foreground.
  source: commons
  license: "CC BY 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by/4.0"
  credit: "Saint-Aniol, via Wikimedia Commons"
  plateNumber: 4
  depicts: >-
    The excavated Iberian settlement of Mas Castellar de Pontós (Girona,
    Catalonia), near the ancient Greek colony of Emporion. A 2002 analysis
    reported fragments of ergot inside a ceremonial vessel and in human
    dental calculus from this site, whose sanctuary is linked to Demeter
    and Persephone. The site lies roughly a thousand kilometers from
    Eleusis; the analysis, its standing, and its limitations are carried
    by the evidence record attached to TIK-C004.
  provenance:
    photographer: "Saint-Aniol"
    date: "2024-11-17 12:06:48"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Poblado_%C3%ADbero_de_Mas_Castellar_(Pont%C3%B3s,_Gerona).jpg"
    originalTitle: "File:Poblado íbero de Mas Castellar (Pontós, Gerona).jpg"
  claimIds: [TIK-C004]

- id: IMG-TIK-P05
