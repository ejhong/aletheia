  file: /images/cases/immortality-key/plates/archaeological-site-of-eleusis-telesterion-01.jpg
  alt: >-
    Broad expanse of weathered stone paving scattered with fallen marble
    blocks under a clear sky, a single visitor standing among them, with
    hills and the modern town of Elefsina beyond.
  source: commons
  license: "CC BY 2.0"
  licenseUrl: "https://creativecommons.org/licenses/by/2.0"
  credit: "TimeTravelRome, via Wikimedia Commons"
  plateNumber: 5
  depicts: >-
    The floor of the Telesterion at Eleusis — the initiation hall where,
    for nearly two millennia, initiates drank the kykeon at the climax of
    the Mysteries. The sanctuary is excavated and its ceramics curated;
    the residue question the photograph cannot answer is carried by
    TIK-C007.
  provenance:
    photographer: "TimeTravelRome"
    date: "2022-04-13 08:38:04"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Archaeological_Site_of_Eleusis_-_Telesterion_01.jpg"
    originalTitle: "File:Archaeological Site of Eleusis - Telesterion 01.jpg"
  claimIds: [TIK-C007]

- id: IMG-TIK-P06
  role: plate
  file: /images/cases/immortality-key/plates/twee-vroegchristelijke-muurschilderingen-met-voorstelling-va.jpg
  alt: >-
    Early-1900s glass lantern slide with a typed label, holding two
    black-and-white photographs of catacomb wall paintings: each shows
    robed figures reclining at a semicircular table around bread and a
    cup, flanked by rows of baskets.
  source: commons
  license: "Public domain"
  credit: "EuroPhot teaching slide (photographs after Joseph Wilpert), via Wikimedia Commons"
  plateNumber: 6
  mediaType: "archival lantern slide"
  depicts: >-
    An early-twentieth-century teaching slide, labeled in French, pairing
    the two most famous early depictions of the Christian eucharistic
    meal: the "Fractio Panis" fresco of the Capella Greca in the Catacomb
    of Priscilla, Rome (late second century, upper) and a banquet scene
    from the Catacomb of Callixtus (lower), photographed for Joseph
    Wilpert's 1903 corpus. Both scenes show bread, a cup, and baskets
    (TIK-C011); the frescoes do not show what the painted cups held, and
    the chemical question sits with TIK-C010.
  provenance:
    photographer: "Unknown (EuroPhot art-history slide series, after Wilpert 1903)"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Twee_vroegchristelijke_muurschilderingen_met_voorstelling_van_de_eucharistie,_GD010274.jpg"
    originalTitle: "File:Twee vroegchristelijke muurschilderingen met voorstelling van de eucharistie, GD010274.jpg"
  claimIds: [TIK-C010, TIK-C011]
