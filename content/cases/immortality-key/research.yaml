# Research agenda: decisive tests ranked by information gain, attached to the
# claims they would actually move. The ordering principle here: direct
# chemistry at the disputed sites first — this is the rare case where the
# decisive tests are cheap, well-defined, and blocked by permission and
# neglect rather than by science. Everything else (replication, pharmacology,
# philology, base rates) disciplines the interpretation of whatever that
# chemistry returns.

- id: TIK-R001
  title: "Organic residue analysis of securely contexted vessels from Eleusis"
  summary: >-
    The empty cell both sides argue from: no artifact from the Eleusis
    sanctuary has ever been chemically analyzed — per the 2026 feasibility
    paper, systematic residue research has never been conducted or permitted
    (TIK-E009). The test: obtain permission for modern organic residue
    analysis (GC-MS/LC-MS/HRMS panels including ergoline markers) of curated,
    securely contexted drinking and mixing vessels from the sanctuary,
    with extraction blanks, soil controls, and preregistered target
    compounds — the protocol the Tel Arad, Es Càrritx, and Bes-vessel
    studies have already normalized elsewhere. Vessels stored since early
    excavations exist in collections; the blocker is administrative, not
    technical.
  claimIds: [TIK-C007, TIK-C003, TIK-C008]
  track: either
  effortTier: lab
  informationGain: >-
    The highest in the case, in both directions: replicated ergoline
    residues in Eleusinian cups would transform TIK-C007 from weakly
    supported to the best-evidenced claim of its kind anywhere, while a
    methodologically sensitive null across many vessels would convert the
    current untested absence into a tested one and largely close the Greek
    half. No other single test moves the headline claims comparably.

- id: TIK-R002
  title: "Independent replication of the lye-hydrolysis result with blinded ergot"
  summary: >-
    The 2026 detoxification experiment (TIK-E008) was performed once, by a
    team including the hypothesis's originators and an entheogen-research
    center. The test: an unaffiliated analytical-chemistry group repeats the
    alkaline-hydrolysis protocol on blinded ergot samples of known but
    undisclosed variable alkaloid content — including sclerotia from
    different hosts and regions — and reports conversion efficiency, residual
    ergopeptide levels, and the pH/time sensitivity of the safety margin.
    The original paper's own data show lower pH or shorter treatment leaves
    toxic ergopeptides detectable, so robustness under sloppy conditions is
    the live question, not whether the textbook reaction runs.
  claimIds: [TIK-C005, TIK-C006]
  track: small_grant
  effortTier: lab
  informationGain: >-
    The fastest credibility lever available to the pro side: confirmation by
    a disinterested laboratory would make the mechanism rung
    network-independent; failure or a narrow safety envelope would reopen
    the classic toxicity objection at practical strength even though the
    2026 paper closed it at the level of possibility.

- id: TIK-R003
  title: "Pharmacological profile of the full reconstructed preparation"
  summary: >-
    Nobody has profiled what the lye process actually produces as a whole.
    The test: receptor-binding panels, toxicology, and pharmacokinetic dose
    modeling of the complete reconstructed extract — LSA, iso-LSA, and
    every co-product, not the isolated compounds — against the question the
    history needs answered: at doses achievable from about a gram of ergot,
    does this preparation plausibly produce a profound, largely positive
    visionary experience in most recipients, or sedation, nausea, and
    dysphoria? The human LSA literature (TIK-E012) is dominated by
    morning-glory-seed exposures and cannot answer for this matrix.
  claimIds: [TIK-C006, TIK-C005, TIK-C008]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Decides whether the hypothesis's motive survives contact with
    pharmacology: if the reconstructed drink cannot plausibly deliver the
    reported phenomenology, the ergot-kykeon loses its point even with the
    chemistry proven; if it can, the mechanism rung is complete from fungus
    to phenomenology.

- id: TIK-R004
  title: "Recovery and modern re-analysis of the Mas Castellar de Pontós materials"
  summary: >-
    The case's one hard archaeological datum rests on a single 2002 analysis
    (TIK-E007) that has never been independently replicated — and whose
    primary publication this case has so far seen only through the 2026
    paper's citations. Two steps, in order: obtain and audit the primary
    2002 chapters (Juan-Tresserras, in Pons i Brun ed., pp. 548–556 and
    477–481) against the downstream retellings; then re-analyze the
    surviving vessel residue and dental-calculus samples with current
    methods (UHPLC-HRMS ergoline panels, ancient-DNA or peptide
    confirmation of Claviceps), with chain of custody documented.
  claimIds: [TIK-C004, TIK-C007]
  track: either
  effortTier: lab
  informationGain: >-
    Binary and large for TIK-C004: confirmation would give the Eleusinian
    hypothesis a replicated archaeological anchor for the first time;
    failure to confirm — or a primary text materially weaker than the
    citations imply — would remove the modern case's only
    substance-in-cult-context datum. The desk half (retrieving the primary
    text) costs almost nothing and disciplines every retelling immediately.

- id: TIK-R005
  title: "Preregistered residue survey of early-Christian liturgical vessels"
  summary: >-
    The Christian half's claims (TIK-C010, TIK-C011) have never been tested
    with chemistry: no securely identified early-Christian cup, chalice, or
    communion vessel has undergone organic residue analysis. The test: a
    preregistered survey across museum collections — vessel identification
    criteria, target compound panels, contamination controls, and both
    positive and null publication commitments frozen in advance — of
    vessels with secure liturgical attribution from the first four
    centuries. Preregistration matters doubly here because the program best
    positioned to run such work (YAPP) is funded by the hypothesis's author
    and this project's founder (TIK-E027), so the protocol must be
    critic-proof before results exist.
  claimIds: [TIK-C010, TIK-C011, TIK-C012]
  track: either
  effortTier: lab
  informationGain: >-
    One replicated psychoactive positive would transform TIK-C010 and
    force the documentary reading of TIK-C011 to be reargued; a
    well-documented broad null would substantially close the Christian
    half. Either outcome converts claims currently running on capability
    and analogy into claims running on measurements.

- id: TIK-R006
  title: "Philological and epigraphic audit of the load-bearing texts"
  summary: >-
    Desk work the popular debate has skipped: (1) pull the exact Dioscorides
    passages behind the visionary-wine summaries (TIK-E005) and fix book,
    chapter, and translation; (2) audit the Eleusinian financial
    inscriptions behind Clinton's audited-accounts argument (TIK-E016) —
    what the stones actually record, published corpus references; (3) sweep
    the ancient kykeon testimonia beyond the Homeric Hymn for any hint of
    an additive or processing step; (4) fix the canonical statements of the
    ritual-sufficiency position (Burkert and successors) with exact
    locators. Every item replaces a secondhand characterization currently
    in this ledger with a primary locator.
  claimIds: [TIK-C003, TIK-C002, TIK-C007, TIK-C008]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Modest per item but structural in sum: this case currently carries
    several expert characterizations of texts rather than the texts
    themselves, and each audited locator either hardens an evidence record
    or exposes a drift — the exact failure mode (rhetorical solidification
    into "fact") the methodological critics have documented in this
    literature (TIK-E019).

- id: TIK-R007
  title: "Adversarial review: can drug-free ritual reliably generate the reported experience?"
  summary: >-
    The mainstream alternative — fasting, procession, secrecy, darkness,
    ritual drama, and mass emotion suffice (TIK-C008) — is asserted more
    often than it is evidenced. The test: an adversarial collaboration
    between a proponent and a skeptic of the pharmacological reading,
    reviewing the modern literature on non-pharmacological induction of
    intense mystical-type experience (sensory deprivation, collective
    ritual, expectancy, sleep restriction) against the phenomenological
    profile the ancient testimonia actually describe, with the evidential
    bar and the testimonia list frozen before either side argues.
  claimIds: [TIK-C008]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Bounded but real: if matched non-pharmacological ritual demonstrably
    produces experiences of the reported intensity and reliability, the
    drug hypothesis loses its explanatory motive (though not its
    possibility); if it demonstrably cannot, the Mysteries' two millennia
    of stable operation become genuinely anomalous and the pharmacological
    reading gains its strongest indirect support.

- id: TIK-R008
  title: "Base-rate survey: how common were psychoactive additives in ritual vessels?"
  summary: >-
    The background rung (TIK-C001, TIK-C002) runs on spectacular positives
    with no denominator: nobody knows what fraction of ancient ritual
    vessels carry potent botanical additives, so nobody knows how surprising
    any single find is. The test: a blinded residue survey across a
    representative sample of ritual and domestic vessels from comparable
    Mediterranean contexts — sacred and secular, urban and rural — with the
    analyst blinded to context, reporting additive frequencies by vessel
    class. The Bes-vessel and Es Càrritx methods make this routine
    chemistry; the design contribution is the sampling frame.
  claimIds: [TIK-C002, TIK-C001]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Converts the whole background rung from anecdote to rate: a high base
    rate would make ritual pharmacology unremarkable everywhere (raising
    the prior for Eleusis while lowering every find's diagnosticity); a
    very low one would make each cult-context positive — including any
    future Eleusinian hit — far more diagnostic than it is now.
