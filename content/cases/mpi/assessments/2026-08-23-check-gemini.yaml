  synthesis: >-
    The case of the Model of Pragmatic Information (MPI) presents a fascinating
    methodological puzzle: a theory structurally designed to mimic the null
    hypothesis under strict experimental conditions. The core observational
    claims (MPI-C001, MPI-C002, MPI-C003) are well-supported by the literature.
    The founding correlation-matrix experiments reported significant surpluses
    of correlations, which have systematically declined, shifted, or vanished as
    experimental protocols tightened, culminating in the null results of the
    strictest modern preregistered and blind-analysis replications. Similarly,
    the mechanistic claims about the theory itself (MPI-C004, MPI-C005,
    MPI-C006) are established or well-supported: the model’s proponents
    genuinely published the "no-transmission" axiom and derived its decline
    predictions prior to the recent rigorous failures.

    The crux of the case lies in the attribution layer. The hypothesis that the
    observed decline is a real, lawful non-local psychophysical correlation
    (MPI-C007) is weakly supported by the evidence. The strongest-designed
    tests, such as Grote's 200-participant blind analysis, yielded null results
    exactly as the conventional null hypothesis would predict. On the other
    hand, the conventional explanation (MPI-C008)—that the entire arc is an
    artifact of regression to the mean, analytic flexibility, and uncorrected
    statistical dependence (MPI-C009)—is provisionally supported. Every
    component mechanism of this mundane account, including post-hoc significance
    hunting and variable intercorrelation, has been documented within or
    adjacent to this corpus.

    Yet, the case remains unresolved. The mundane explanation has not yet
    quantitatively demonstrated that questionable research practices and
    statistical dependence account for the entirety of the early matrix
    successes. Conversely, the MPI's distinctive fine-structure predictions—such
    as the strength-reproducibility reciprocity and the theoretically suggestive
    split between true and pseudo random number generators—remain formally
    untested as prespecified predictions. Furthermore, while the model is
    frequently deployed in ways that insulate it from disconfirmation
    (MPI-C010), it does make falsifiable claims about macroscopic stability.
    Until adversarial tests of these specific fine structures are conducted, and
    dependence-aware reanalyses of the founding datasets are published, the
    debate cannot definitively conclude whether MPI is a profound discovery
    about psychophysical entanglement or merely a quantum-flavored description
    of statistical noise.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: high
    reasoning: The literature record clearly demonstrates that Lucadou's group and
      Walach's 2020 replication reported significantly more significant
      correlations than expected by chance. Whether these reported effects are
      artifacts of statistical dependence is contested, but the fact that these
      reports form the historical foundation of the program is established. The
      strongest opposing consideration is that the raw data remain unavailable
      for independent verification, but the existence of the published reports
      is undisputed.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: The methodologically strictest modern replications—including the
      proponents' own preregistered consensus protocols and an independent full
      blind analysis by Grote—have unambiguously failed to reproduce the matrix
      effect. While a few earlier or partial tests reported mixed or positive
      results, the overarching pattern is that when analytic flexibility is
      completely removed, the effect vanishes. The strongest opposing
      consideration is that a few in-house studies and an unreviewed online
      preprint still claim partial significance, preventing a completely uniform
      null record.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: The trajectory of the matrix experiments exhibits a classic decline
      and displacement pattern, with initially strong results weakening or
      shifting to different analyses and variables in subsequent studies. This
      descriptive reality is agreed upon by both proponents and critics, tracing
      from early successes through Grote's arc and Walach's null consensus
      replications. The strongest opposing consideration is that the term
      "decline" implies an initially genuine effect, whereas the pattern might
      instead be an artifact of varying statistical power and regression to the
      mean across heterogeneous studies.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: high
    reasoning: The Generalized Quantum Theory framework exists as a formally
      coherent axiomatic extension published in a credible physics-foundations
      venue, successfully dropping physical constants to apply complementarity
      and entanglement to macroscopic systems. It provides the explicit
      theoretical scaffolding for MPI. The strongest opposing consideration is
      that mathematical coherence does not equate to physical reality, and by
      abandoning quantitative parameters, the framework sacrifices the
      predictive power that makes quantum mechanics testable.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: The model's proponents explicitly published the no-transmission axiom
      and derived its necessary corollaries—decline, displacement, and sign
      reversal—in 2007, well before the strictest empirical failures occurred.
      As a factual claim about what the theory states and when it stated it,
      this is a matter of verifiable public record. The strongest opposing
      consideration is that predicting weaker effects in stricter replications
      is indistinguishable from the expectations of the null hypothesis, making
      the prediction less scientifically distinctive than it appears.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: The correlation-matrix design was explicitly engineered by Lucadou to
      bypass the no-transmission axiom by scattering potential effects across a
      multitude of variables without yielding a reliable signal channel. The
      theorists' own writings confirm this was the intended methodological
      translation of their model. The strongest opposing consideration is that
      this experimental design simultaneously creates a massive multiple-testing
      problem, effectively transforming standard statistical noise into the
      exact jumping pattern the theory predicts.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: The hypothesis that the matrix results reflect genuine non-local
      correlations is severely weakened by the failure of the most rigorous,
      blind-analysis replications and the viability of mundane statistical
      explanations. While early positive results exist, they align with what is
      expected from analytical flexibility and variable interdependence. The
      strongest opposing consideration is that the model actually predicted
      these exact empirical failures, and a few rigorously pre-registered
      studies and conservative permutation analyses still reported anomalous
      surpluses that resist easy dismissal.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Every component of the conventional explanation—statistical
      dependence, analytic flexibility, coding errors, and publication bias—has
      been empirically documented within this specific literature or its direct
      antecedents. It offers a highly parsimonious explanation for the entirety
      of the observed decline arc. The strongest opposing consideration is that
      a comprehensive, quantitative demonstration showing these mechanisms
      account for 100% of the founding matrix successes has not yet been
      published, and some positive results survive dependence-aware permutation
      tests.
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Simulations from within the research program itself have demonstrated
      that high intercorrelations among psychological variables artificially
      inflate the significance counts used in the original matrix studies. This
      dependence critique directly undermines the statistical foundation of the
      early positive reports. The strongest opposing consideration is that this
      reanalysis currently exists primarily in a doctoral thesis and unreviewed
      preprint, and has not yet completely zeroed out the effects in all
      datasets subjected to it.
  - claimId: MPI-C010
    verdict: mixed
    confidence: moderate
    reasoning: Proponents have demonstrably invoked the model's decline prediction
      to explain away the failure of their own pre-registered consensus
      replications, treating null results as a feature of the phenomenon.
      However, they also publicly conceded the paradigm is "not replicable," and
      the model contains universal prohibitions that render it falsifiable in
      principle. The strongest opposing consideration is that while the theory's
      fine-structure predictions could theoretically bind the model, proponents
      have not systematically pre-specified them in a way that risks
      disconfirmation in practice.
