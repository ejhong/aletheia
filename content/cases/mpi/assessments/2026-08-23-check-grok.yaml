  synthesis: >-
    The featured hypothesis holds that mind–matter correlations are real but
    non-local and lawfully shy: they may appear as a surplus of significant
    cells in a correlation matrix, and they must fade, reverse, or migrate once
    a protocol could exploit them as a signal. The observation layer of that
    story is solid. Lucadou’s group reported experimental-over-control surpluses
    from 1986 to 2006; Walach and colleagues reported another surplus in 2020
    against ten thousand simulated experiments; and the later literature is a
    sequence of weakening, relocating, or vanishing results. Generalized Quantum
    Theory exists as a published axiomatic framework, and the 2007 statement of
    the no-transmission axiom really does derive decline, sign reversal, and
    displacement before the 2017–2021 failures were run. The matrix design is
    the model’s self-nominated test, not an afterthought.

    Steelmanning the MPI reading: a theory that prints its own replication
    failures in advance, proposes a positive signature that initially appears,
    and then watches that signature scatter under tighter protocols is doing
    more than special pleading. Walach 2020 was a large two-lab study in an APA
    journal. Flores still found three of five thesis replications significant
    under permutation tests built to respect dependence. The 2023 online split —
    significant with an atmospheric-noise source, not with a deterministic
    generator — points the way a quantum-flavored account wants, though it is an
    unreviewed preprint with unequal power across arms. The no-transmission
    axiom is a genuine universal risk: one stable, exploitable psi channel
    anywhere would kill the model. Proponents published their own
    consensus-protocol failures under a candid title.

    Steelmanning the conventional reading: every mechanism required to
    manufacture this exact arc is already documented inside the corpus.
    Psychological variables are highly intercorrelated, so counting significant
    cells against an independence assumption inflates the founding headlines;
    Flores’s own simulations diminished those results. Grote’s 2017 paper is a
    live demonstration that a post-hoc variant can extract p = 0.012 from data
    whose three preplanned analyses were null. The 2020 surplus was, by its
    authors’ next paper, “significant but fragile,” and broke down under
    improved analysis. The two preregistered consensus replications were null.
    Grote’s 200-participant blind analysis — complete evaluation software locked
    before anyone looked at the data — fell well within chance. Bösch’s
    380-study meta-analysis finds the parent REG literature most economically
    explained by publication bias. A neighboring correlational micro-PK effect
    dissolved into a coding error its own authors published. A design that
    predicts “transitory, jumping, unexpected patterns” across thousands of
    cells is a design that has renamed multiple testing as the phenomenon.

    The two stories fit the same declining curve. They part on whether the early
    positives were real and whether displacement has structure that noise would
    not produce. Those distinctive predictions — faster decline after stronger
    initial effects, reappearance in related rather than random observables —
    have never been frozen in advance and tested. MPI’s claim to have predicted
    the failures therefore earns little credit: the null hypothesis makes the
    same coarse prediction. Residual positives under conservative analyses keep
    the hypothesis alive. The methodological gradient (tighter protocol, smaller
    effect) and the in-corpus failure modes keep it from earning more than weak
    support. This lean uses the ordinary prior that selected noise plus
    flexibility produce declining “effects”; the evidence records themselves do
    not contain a quantitative demonstration that those mechanisms reproduce the
    specific published matrix record, which is why the verdict is not
    “contradicted.”
