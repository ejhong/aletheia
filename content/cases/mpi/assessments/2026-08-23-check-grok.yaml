  - claimId: MPI-C010
    verdict: mixed
    confidence: moderate
    reasoning: "The insulating interpretive habit is real and quotable: Walach et
      al. 2021 read their own preregistered failures as “likely part of the
      systematic nature of such effects,” which is heads-I-win, tails-I-win if
      left unconstrained. Against a blanket unfalsifiability charge, the model
      does expose a risky universal (any stable exploitable psi channel refutes
      the no-transmission axiom), it nominated the matrix surplus as a positive
      prediction that could have failed from the start, and the 2021 authors did
      conclude the paradigm is not replicable rather than simply declaring
      victory. The strongest opposing consideration is that this remaining
      exposure is mostly unused: the distinctive corollaries have never been
      prespecified as binding tests, so in practice the insulation is a habit of
      interpretation even though it is not a theorem of the formalism."
