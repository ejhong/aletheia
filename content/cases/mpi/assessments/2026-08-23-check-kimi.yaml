  synthesis: "The ladder separates cleanly, and this case is decided on its top
    rung. The observation rung is solid: no party in the corpus disputes that
    the matrix program produced early surpluses, that its strictest replications
    are null, or that reported effects faded and shifted across four decades
    (MPI-C001 through MPI-C003). The mechanism rung is also real: Generalized
    Quantum Theory exists as a published formalism in a serious venue, and the
    no-transmission axiom's decline/displacement entailment is verbatim in print
    from 2007 — years before the preregistered failures it now explains
    (MPI-C004 through MPI-C006). What this buys MPI is integrity, not evidence:
    the predictions were demonstrably not retrofitted to the 2017–2021 record.
    But the attribution rung is where the featured thesis fails to carry its
    weight, for three structural reasons. First, the decline prediction is
    shared with the null hypothesis: regression to the mean acting on selected
    noise predicts exactly the same trajectory, so the replication record — the
    program's centerpiece — is evidentially inert between the rivals. Second,
    the foundation is compromised from inside: the founding surpluses were
    counted against independence assumptions the data violate, and that critique
    comes from the program's own doctoral work, not from hostile skeptics
    (MPI-C009). Third, every mundane mechanism the conventional account requires
    is documented operating inside this very corpus — a coding error
    manufacturing a celebrated effect, a post-hoc contrast conjuring
    significance where three preplanned analyses were null, publication-bias
    sensitivity in the parent literature (MPI-C008). Steelmanning MPI: it
    nominated its own positive test; its proponents publish their failures under
    admirably candid titles; one preregistered, adequately powered replication
    (Walach 2020) did report a surplus; and its genuinely discriminating fine
    structure — strength–reproducibility reciprocity, displacement into related
    observables — has never been prespecified and tested, so the model's
    distinctive content is unexercised rather than refuted. Steelmanning the
    null: the best-designed experiment in the corpus found exactly nothing; the
    proponents' own frozen consensus protocol failed twice; and \"not a
    replicable paradigm\" is the proponents' own conclusion about their chosen
    benchmark. The verdict is weakly_supported rather than contradicted because
    MPI's insulation makes contradiction structurally elusive and residual
    positives (Flores's permutation-surviving results, the unreviewed RNG split)
    forbid a clean-null verdict — but the burden has shifted decisively onto the
    fine-structure tests this model has never run."
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: "Assessed as stated, this is a report-level claim: that Lucadou's
      group published analyses showing surpluses of significant matrix cells in
      experimental versus control sessions. That is multiply attested inside the
      corpus, including by the Walach et al. 2021 introduction and Grote 2021,
      and even the program's sharpest internal critic (Flores) accepts the
      original analyses reported these numbers while disputing their validity.
      The strongest opposing consideration is provenance: the founding full
      texts were not independently examined for this case and the raw data were
      never published, so the characterization rests on later descriptions by
      proponents and successors. The deeper attack — that the surpluses are
      artifacts of significance counting under violated independence — is real,
      but it is the business of MPI-C009, not of this claim, which asserts only
      what was reported."
  - claimId: MPI-C002
    verdict: well_supported
    confidence: moderate
    reasoning: "The strictest tests in the corpus are unambiguous: Grote's
      200-participant full blind analysis fell well within the chance
      distribution, and the proponents' own two OSF-deposited consensus-protocol
      replications were both null, with Grote 2017's three preplanned analyses
      adding to the pattern. The word \"predominantly\" is accurate and
      necessary. The strongest opposing consideration is that the record is not
      a clean null: Walach 2020 was itself a preregistration-era, adequately
      powered replication reporting significance, and Flores reports three of
      five studies significant under conservative permutation analyses. Those
      exceptions are real but weaker than they look — the 2020 effect was
      deflated as \"fragile\" by its own authors under improved analyses, and
      Flores's five studies share equipment, personnel, and analytic choices, so
      they are not independent confirmations."
  - claimId: MPI-C003
    verdict: well_supported
    confidence: moderate
    reasoning: "As a descriptive sequence of published outcomes the claim holds:
      Lucadou's positives, Walach 2020's significant-but-fragile effect
      collapsing under improved analysis, the two 2021 nulls, and Grote's
      single-experimenter arc from a 2015 positive through 2017 preplanned nulls
      to a 2021 blind null. Kennedy 2003 documents the same elusiveness
      field-wide, so the matrix program is an instance of a pattern insiders
      already catalogued. The strongest opposing consideration is that \"decline
      and displacement\" is a narrative imposed post hoc on a small,
      heterogeneous set of studies with differing designs, power, and analyses;
      no prespecified metric of decline has ever been defined and then measured
      across the series. That objection limits the claim's diagnosticity —
      regression to the mean generates the same trajectory — but not its
      descriptive truth."
  - claimId: MPI-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The claim is modest and mostly met: Atmanspacher, Römer and Walach
      2002 exists in Foundations of Physics, axiomatizes complementarity and
      entanglement without Hilbert-space structure, and the 2007 JCS paper
      presents MPI as its psychophysical instantiation — so the formalism's
      existence and availability are documented, and no internal inconsistency
      is on record. What withholds stronger support is that no independent
      verification of the axiom system's coherence appears in the corpus; the
      attestation is essentially the framework's own authors. The strongest
      opposing consideration is that the generalization purchases its breadth by
      discarding exactly the quantitative machinery that gives quantum theory
      predictive risk: it assigns no probabilities, derives no effect sizes, and
      its \"entanglement\" functions as an axiomatized analogy. The claim as
      stated asserts existence and coherence rather than empirical traction, so
      it survives — narrowly."
  - claimId: MPI-C005
    verdict: well_supported
    confidence: high
    reasoning: "As a claim about what the model entails and when it said so, this is
      verbatim-attested: the 2007 paper states the no-transmission axiom and
      derives decline, sign change, and reappearance \"in different observables
      and/or between different parts of the system,\" plus the reciprocity
      corollary — all in print well before the preregistered 2017–2021 failures.
      One clause deserves flagging: \"in advance of any data\" overstates the
      history, since decline was already the field's best-documented
      embarrassment when MPI was formulated; the prediction was genuinely prior
      to the strict replications, not prior to the phenomenon it explains. The
      strongest opposing consideration is diagnostic rather than factual:
      regression to the mean makes the identical prediction about stricter
      protocols, so the entailment earns the model no differential credit. That
      diminishes the claim's evidential leverage, not its truth."
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: "The design rationale is documented in the theorists' own words:
      simultaneous registration of many correlations so that psi effects \"show
      up as transitory, jumping unexpected and statistically unlikely patterns
      in the correlation matrix,\" with the advance concession that this will
      \"never... convince every sceptic.\" The structural consequence matters
      for the whole case: the matrix experiment is MPI's self-nominated
      benchmark, so its replication record binds the model in a way generic psi
      results would not. The strongest opposing consideration is that the
      predicted signature is nearly isomorphic to what multiple testing produces
      from pure noise in an intercorrelated matrix — the design builds the
      multiplicity artifact in as the success criterion, which is why
      dependence-aware statistics are decisive for everything downstream. That
      objection bears on what the design can prove, not on the documented fact
      that this is what it was built to do."
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The featured thesis retains genuine residue: Walach 2020 was
      preregistered, adequately powered, published in an APA journal, and
      positive; Flores reports three of five studies significant under
      permutation analyses built to respect the dependence structure; the 2023
      preprint split points the direction quantum-flavored theories require.
      Against that: the strictest test in the corpus (Grote's blind analysis)
      was null, the proponents' own frozen protocol failed twice, the founding
      statistic is compromised by the dependence critique, and every mundane
      mechanism the rival needs is documented in-corpus. The thesis currently
      survives in the gaps the strictest tests have not covered, and its own
      distinctive fine structure has never been prespecified and tested —
      unexercised, not vindicated. The strongest opposing consideration is the
      insulation pattern: as deployed, both successes and failures are absorbed
      as confirmations, so the model's nominated experiments cannot count
      against it — while the conventional account explains the same record with
      mechanisms already caught operating in it."
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Each component mechanism is documented in or immediately adjacent to
      this corpus: violated independence assumptions (Flores's Monte Carlo
      work), analytic flexibility demonstrated live in Grote 2017's
      post-hoc-only significance, a coding error manufacturing a celebrated
      micro-PK effect in the neighboring line, and publication-bias sensitivity
      in the parent REG literature. The strongest opposing consideration has two
      prongs: the sufficiency claim is quantitative and has never been
      demonstrated against this specific corpus — no simulation calibrated to
      the matrix record has reproduced it — and the best-controlled positive
      (Walach 2020, preregistered and powered) is exactly the kind of result
      this account predicts should not occur, with Flores's
      permutation-surviving results beside it. Bierman's QRP simulation cuts
      both ways: it quantifies how far mundane mechanisms really go, and in the
      best-studied neighboring database they covered about sixty percent, not
      everything. Plausible, mechanism-rich, but not yet shown sufficient."
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "This is the sharpest technical attack on the program's foundation
      and it comes from inside: Flores's own thesis work found high
      intercorrelation among the psychological variables, and the 2023 successor
      states plainly that when dependence-respecting simulations were
      incorporated, \"the results from these studies diminished\" — a concession
      against interest that raises credibility. Two limitations hold it at
      provisional: the full dependence-aware reanalysis of the founding datasets
      has never been published as a standalone, independently reviewed result,
      so the magnitude of the shrinkage is summarized rather than demonstrated;
      and the critique has not zeroed the program even on its own terms, since
      the same project reports three of five studies significant under
      permutation analyses. The strongest opposing consideration is precisely
      that residual: the critique shrinks the founding results without
      eliminating structured excesses under methods designed to answer it."
  - claimId: MPI-C010
    verdict: mixed
    confidence: moderate
    reasoning: "The interpretive-absorption pattern is real and quotable: the
      proponents' response to their own preregistered failures was that failure
      is \"likely part of the systematic nature of such effects\" — success
      confirms the correlations, failure confirms the elusiveness, and
      heads-and-tails both land theory-side up. But the claim's universality
      overreaches. The model has exposed flanks: the no-transmission axiom
      forbids any stable, exploitable psi channel anywhere, a risky universal
      that one replicable experiment would demolish; it nominated the matrix
      design as a positive prediction that could simply have kept failing; its
      2007 paper contains distinctive, prespecifiable fine structure
      (reciprocity, displacement into related observables); and the 2021 authors
      did concede the paradigm is \"not replicable\" — a genuine concession
      about their chosen benchmark, not pure evasion. The strongest opposing
      consideration is thus that the insulation is a documented habit of
      interpretation rather than a theorem of the model: what is missing is not
      falsifiable content but binding, proponent-endorsed disconfirmation
      criteria, which the research agenda (MPI-R004) is designed to force."
