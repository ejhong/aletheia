  synthesis: >-
    The core dispute in "Elusive by Law?" is whether the ubiquitous decline
    effect observed in correlation-matrix parapsychology experiments is the
    lawful signature of generalized quantum entanglement or the entirely mundane
    product of statistical artifact and regression to the mean. The Model of
    Pragmatic Information (MPI) offers an intriguing, formally coherent
    framework (Generalized Quantum Theory) predicting that psychophysical
    correlations exist but inherently resist being harnessed as reliable signals
    (the no-transmission axiom). Steelmanning the MPI position requires
    acknowledging that its proponents successfully published these theoretical
    predictions before the recent wave of strict replication failures.
    Furthermore, the correlation-matrix paradigm initially produced statistical
    surpluses that appeared to support the model's expectations of "jumping" and
    transient effects, with even some recent, adequately powered studies showing
    residual positive anomalies under less constrained conditions.

    However, the evidentiary ledger tilts heavily toward the conventional
    explanation. The founding positive results are severely undermined by the
    statistical dependence critique; when the intercorrelation of psychological
    variables is properly modeled, the apparent anomalies substantially
    diminish. More decisively, as methodological rigor has escalated to include
    full blind-analysis and preregistered consensus protocols, the purported
    effects have completely evaporated. Steelmanning the conventional account
    means recognizing that it does not merely offer generalized skepticism, but
    relies on specific, documented failure modes explicitly caught operating
    within this very literature: post-hoc analytic flexibility conjuring
    significance out of null data, publication bias broadly impacting
    random-event-generator studies, and software coding errors previously
    mistaken for anomalous phenomena.

    Ultimately, while MPI is not entirely unfalsifiable—its proponents concede
    the paradigm's lack of replicability, and its fine-structure predictions
    regarding displacement remain technically testable—its current deployment
    absorbs failure far too easily. Because regression to the mean and multiple
    testing on noisy data naturally produce the exact same trajectory of initial
    surplus followed by scattering and decline, the evidence currently lacks the
    diagnosticity to justify invoking a novel scientific paradigm. The
    conventional statistical explanation comfortably accounts for the entire
    corpus without requiring revisions to the known laws of physics, leaving the
    MPI framework weakly supported as an empirical description of reality.
claimAssessments:
  - claimId: MPI-C001
    verdict: provisionally_supported
    confidence: high
    reasoning: The existence of these positive reports in the founding literature is
      confirmed by later reviews and replications (MPI-E001, MPI-E002). However,
      because the original datasets utilized statistical methods vulnerable to
      the dependence critique, the substantive finding of anomalous correlation
      remains provisionally supported rather than definitively established. The
      strongest opposing consideration is that dependence-aware reanalyses
      strongly suggest the initial statistical significance was an artifact of
      intercorrelated psychological variables.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: Evidence firmly establishes this null trend under strict conditions.
      The most rigorous blind-analysis test (MPI-E004) and the proponents' own
      consensus-protocol replications (MPI-E003) both yielded explicitly null
      results. The strongest opposing consideration is that a large two-lab
      preregistered replication (MPI-E002) and some permutation-based analyses
      (MPI-E007) still reported partial successes, indicating the record is
      slightly messier than a pure uniform failure.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: The historical trajectory of the matrix paradigm displays a clear
      pattern of initial positive reports degrading and shifting in later,
      stricter tests (MPI-E003, MPI-E005, MPI-E006). This evasion phenomenon is
      recognized as a broad descriptive reality across various experimental
      paradigms by insiders (MPI-E014). The strongest opposing consideration is
      that characterizing this specifically as "displacement" imposes a
      theoretical narrative on what is more simply explained by regression to
      the mean operating across heterogeneous, underpowered study designs.
  - claimId: MPI-C004
    verdict: provisionally_supported
    confidence: high
    reasoning: The Generalized Quantum Theory framework is verifiably published in a
      mainstream physics foundations venue, providing an internally coherent
      analog of entanglement (MPI-E010). It successfully establishes the formal
      availability of the theory. The strongest opposing consideration is that
      by stripping away physical constants and Hilbert-space structure, the
      framework sacrifices nearly all of its quantitative predictive power,
      rendering it an axiomatic analogy rather than a constrained physical
      model.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: high
    reasoning: The theoretical literature explicitly documents the no-transmission
      axiom and its derived corollaries regarding effect decline and
      displacement (MPI-E009). Crucially, these predictions were definitively
      published well before the most rigorous modern replication failures
      occurred. The strongest opposing consideration is that a prediction shared
      perfectly with the null hypothesis—that larger, stricter studies will
      yield weaker, fading effects—fails to provide diagnostic evidence for the
      theory's unique validity.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: Theorists explicitly stated in print that the correlation-matrix
      method was designed to capture transient, jumping patterns without
      establishing a signal, specifically to circumvent the no-transmission
      axiom (MPI-E011, MPI-E012). This definitively binds the theory to the
      experimental paradigm's actual record. The strongest opposing
      consideration is that a design built to expect scattered, jumping
      statistical significance perfectly mimics the exact artifacts produced by
      multiple testing on pure noise.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: The claim that genuine psychophysical anomaly produces this pattern
      is heavily strained by the total failure of the most rigorous blind
      analysis (MPI-E004) and consensus protocols (MPI-E003). While residual
      positive results exist under less stringent conditions, the competing
      conventional explanation accounts for the dataset's trajectory far more
      economically. The strongest opposing consideration is that some adequately
      powered, preregistered studies (MPI-E002) still generated statistical
      surpluses that demand precise, customized simulations of questionable
      research practices to fully explain away.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Documented instances of analytic flexibility (MPI-E006), software
      errors producing false positives (MPI-E017), and statistical dependence
      inflating significance (MPI-E007) establish that these mundane mechanisms
      actively govern this literature. Simulations also show questionable
      practices explain the vast majority of related flagship phenomena
      (MPI-E016). The strongest opposing consideration is that a specific,
      quantitative simulation fully reproducing the exact decline and
      displacement record of the matrix corpus has not yet been formally
      calibrated and published.
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: high
    reasoning: Research originating from within the program itself demonstrates that
      psychological variables in these matrices are highly intercorrelated
      (MPI-E007). When permutation and Monte Carlo simulations properly account
      for this structural dependence, the significance of the original results
      diminishes notably. The strongest opposing consideration is that even
      under these dependence-aware permutation tests, partial statistical
      significance still survives in a subset of the modern replication studies.
  - claimId: MPI-C010
    verdict: mixed
    confidence: moderate
    reasoning: The model's proponents actively deploy the theory to interpret failed
      replications as confirmations of its core systematic evasion prediction
      (MPI-E003). This interpretive habit heavily insulates the core claims from
      standard empirical disconfirmation. The strongest opposing consideration
      is that the model technically exposes itself to falsification through
      specific, untested fine-structure predictions—such as the reciprocity of
      initial strength and decline rate—meaning the insulation is more a
      sociological habit of its defenders than a strict mathematical theorem.
