  synthesis: >-
    On the observation rung, the record is clear. Early correlation-matrix and
    related micro-PK studies reported excess correlations between psychological
    and random-physical variables (MPI-C001), but when the paradigm was re-run
    under stricter methodological control — preregistered protocols and, at the
    apex, Hartmut Grote’s full blind analysis — the effect mostly vanished
    (MPI-C002). Across groups, designs, and time, nominal effects weakened,
    failed to reappear, or shifted to different variables or analyses
    (MPI-C003). This decline-and-displacement pattern is uncontroversial as a
    description; it is also documented more widely across parapsychology
    (MPI-E014).

    On the mechanism rung, MPI is internally coherent about what it claims.
    Generalized Quantum Theory (MPI-C004) and the no-transmission (NT) axiom
    (MPI-C005) together yield, in print and well before the latest experiments,
    the qualitative prediction that genuine psychophysical correlations cannot
    form a stable, exploitable signal and must decline, reverse, or “evade” when
    experiments tighten. The correlation-matrix design is explicitly constructed
    as the model’s own test-bed: by distributing potential effects over many
    correlations, it is meant to allow such unexploitable correlations to appear
    as a surplus of significant cells while still forbidding any clear
    signalling channel (MPI-C006). As statements about what MPI says and how the
    paradigm was intended, these claims are well-supported by the theorists’ own
    publications.

    The crux lies on the attribution and falsifiability rungs. The featured
    hypothesis (MPI-C007) is that the messy record — early positives, decline,
    and displacement — is best explained by real non-local psychophysical
    correlations of the MPI kind. The steelman rival (MPI-C008) holds that
    regression to the mean, analytic flexibility, publication bias, and —
    critically — statistical dependence among matrix cells are jointly
    sufficient to explain the same pattern from null data. Here the evidence is
    asymmetric.

    On the conventional side, every mechanism invoked is independently
    documented in or near this corpus (MPI-E015–E017). Most importantly,
    Flores’s Monte Carlo and permutation work shows that the psychological
    variables in matrix studies are strongly intercorrelated and that
    dependence-aware simulations shrink the founding excess-correlation results
    (MPI-C009, MPI-E007). Grote’s 2017 study demonstrates how a null set of
    preplanned analyses can coexist with a seemingly impressive post-hoc
    positive (MPI-E006). A celebrated micro-PK effect in a neighboring line
    collapses under a discovered coding error (MPI-E017). And the largest
    blind-analysis test in the matrix paradigm is cleanly null (MPI-E004). These
    strands jointly make it provisionally credible that ordinary statistical and
    methodological artifacts can explain the corpus without anomalous
    correlations, even though no one has yet constructed a single quantitative
    simulation that reproduces the exact pattern across all studies.

    On the MPI-advocating side, there are peer-reviewed positives that resist
    being dismissed as trivial. Walach et al. 2020’s two-lab,
    preregistration-era study reported a significant matrix surplus evaluated
    against 10,000 simulations (MPI-E002), and Flores’s thesis found three of
    five in-house replications significant under permutation tests designed to
    respect dependence (MPI-E007). The 2023 online game replication reports a
    striking true-RNG/pseudo-RNG split (MPI-E008), which qualitatively points
    the “right” way for quantum-flavored models, though it is unreviewed and
    unevenly powered. These positives stop the conventional account short of
    “established”: they keep open a residual anomaly, especially because some
    were produced by methodologically sophisticated insiders aware of the
    statistical pitfalls.

    However, the strongest-designed and most insulated tests — Grote’s
    200-participant blind analysis and the proponents’ own consensus-protocol
    replications — are null (MPI-E003, MPI-E004), and the founding series that
    originally motivated MPI has been weakened by the dependence critique. Given
    that MPI deliberately predicts decline under replication (MPI-C005), these
    failures neither obviously confirm nor refute it purely on pattern; but when
    weighed against priors and the documented artifact mechanisms, they
    substantially undercut MPI-C007. On this dossier alone, genuine non-local
    correlations remain at best weakly-supported.

    The falsifiability concern (MPI-C010) is real but not absolute. The
    proponents’ own language after failed replications — that failure is “likely
    part of the systematic nature of such effects” — illustrates a practice of
    reading both success and failure as consistent with MPI, which in practice
    insulates it from disconfirmation at the level of qualitative patterns. At
    the same time, the model is not logically unfalsifiable: it forbids any
    stable, exploitable psi signal and makes distinctive fine-structure
    predictions (e.g., stronger initial effects should decline faster;
    displacement should land in related observables). Those quantitative
    predictions have simply not been bound in advance and tested under
    adversarial blind conditions. Thus MPI-C010 is best rated mixed: the theory
    as used has been insulated, but need not be.

    Integrating these lines, the overall case assessment is mixed. The
    decline-and-displacement pattern that motivated MPI is real; the model’s
    internal logic and its self-nominated matrix test are clearly described; and
    there remain some anomalous-looking results. Yet the weight of the strongest
    evidence favors the conventional null-plus-artifacts account, and MPI’s
    distinctive content has not been sharply tested. On the present evidence,
    MPI remains an intriguing but weakly corroborated explanatory framework for
    a pattern that is, so far, more parsimoniously explained by noise, bias, and
    dependence, with a small residue not yet decisively allocated either way.
    Further progress depends on the proposed adversarial, dependence-aware,
    blind tests that pin down the theory’s fine-structure predictions.
claimAssessments:
  - claimId: MPI-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Multiple later sources, including Walach et al. 2020/2021 and Grote
      2021, report that Lucadou’s original matrix experiments showed more
      significant psychological–physical correlations in experimental than
      control sessions, and there is no evidence in this corpus that this
      characterization is factually wrong (MPI-E001, MPI-E002). The main doubt
      concerns not whether those surpluses were reported, but whether they were
      computed against a valid null distribution, given later dependence-aware
      critiques (MPI-C009). The strongest opposing consideration is Flores’s
      finding that high intercorrelations among psychological variables inflated
      early significance counts, which suggests the original “far more than
      chance” framing overstated the anomaly even if the basic reporting
      description is accurate.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: Grote’s 200-participant blind analysis and Walach et al.’s two
      consensus-protocol replications are all preregistered or
      preregistration-era studies that used fixed analysis plans and, in Grote’s
      case, locked software before unblinding; all three failed to find
      significant excess correlations (MPI-E003, MPI-E004). These are the
      methodologically strongest tests of the paradigm and directly support the
      statement that such replications have predominantly failed. The main
      counter-consideration is that not all preregistration-era work was null —
      Walach 2020 and parts of Flores’s thesis reported positives — but these
      either lacked full blind analysis or were less independently controlled,
      so they qualify “predominantly” without overturning it.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: "Study-by-study descriptions show an arc of early positives followed
      by weakening, nulls, and shifts in where any apparent signal resides:
      Lucadou’s original series and Walach 2020 reported surpluses that became
      “significant but fragile” under improved analyses; Grote’s 2015–2017–2021
      sequence moved from an initial positive to null preplanned analyses and
      finally a fully blind null; Walach 2021’s two replications were null;
      Flores saw mixed outcomes across different studies and analysis methods
      (MPI-E002–E008, MPI-E014). The strongest opposing point is that “decline
      and displacement” here is a narrative label: no rigorously prespecified
      quantitative measure of decline has been applied across the corpus, so
      some part of the pattern could be an artifact of heterogeneous designs and
      selective attention."
  - claimId: MPI-C004
    verdict: provisionally_supported
    confidence: high
    reasoning: Atmanspacher et al. 2002 in Foundations of Physics sets out “weak
      quantum theory,” explicitly retaining complementarity and entanglement for
      arbitrary systems while discarding Hilbert-space and physical constants,
      and MPI’s theorists explicitly place their model within this framework
      (MPI-E010, MPI-E009). This suffices to show that such a formalism exists
      and that MPI instantiates it conceptually. The main challenge is that, by
      giving up quantitative probabilities, GQT is mathematically weak in
      predictive terms — so while coherent, it does not by itself guarantee that
      MPI’s specific psychophysical application is empirically meaningful.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: high
    reasoning: The 2007 JCS paper by von Lucadou, Römer, and Walach explicitly
      states the no-transmission axiom and derives from it that attempts to
      replicate and stabilize anomalous correlations will wipe out apparent
      effects, with stronger initial effects predicted to decline faster, and
      with possible sign changes and displacement to other observables
      (MPI-E009). This is a direct match to the claim’s content and shows the
      prediction was published prior to the later strict replications. The key
      opposing consideration is that similar qualitative
      decline-under-stricter-tests is also predicted by conventional regression
      to the mean, so while the derivation is genuine, it is not uniquely
      diagnostic of a special psychophysical mechanism.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: The same 2007 JCS article explicitly proposes the correlation-matrix
      method as a way to “make positive use of the evasion phenomenon” by
      recording many correlations simultaneously, predicting that psi effects
      will appear as “transitory, jumping unexpected and statistically unlikely
      patterns in the correlation matrix” while never fully overcoming decline
      (MPI-E011). This directly supports the claim that the design was MPI’s own
      proposed test respecting the no-transmission constraint. The main
      objection is that the described signature — scattered unlikely cells in a
      large matrix — closely resembles what one expects from multiple testing of
      dependent variables, so the design’s intended selectivity may be illusory.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The thesis that genuine non-local psychophysical correlations
      produce the observed pattern gains some support from positive or
      partly-positive studies conducted with nontrivial methodological care:
      Walach 2020’s two-lab replication with simulation-based evaluation,
      Flores’s three-of-five significant thesis studies under permutation tests,
      and the large online Random.org versus pseudo-RNG split (MPI-E002,
      MPI-E007, MPI-E008). These show that, even under more conservative
      analyses than Lucadou’s originals, some surplus correlations have been
      observed. However, the strongest-designed test (Grote’s blind analysis) is
      null, the proponents’ own consensus replications are null, and
      dependence-aware reanalyses weaken the founding results; coupled with
      documented mundane mechanisms, this leaves MPI’s attribution with only
      weak support on this evidence."
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Each component of the conventional explanation is concretely
      instantiated here: dependence among psychological variables and its
      inflationary effect on significant-cell counts are documented by Flores’s
      Monte Carlo and permutation analyses (MPI-E007, MPI-C009); analytic
      flexibility is directly illustrated by Grote’s 2017 post-hoc-only positive
      (MPI-E006); publication bias and small-study effects in the broader REG
      literature are highlighted by Bösch 2006 (MPI-E015); and a major micro-PK
      effect’s collapse under a coding error (Maier & Dechamps 2022) shows how
      false positives can arise and persist (MPI-E017). Together, these make it
      provisionally credible that such mechanisms suffice to explain the matrix
      record, though no single quantitative model has yet reproduced the entire
      corpus, and some larger, more conservative positives (e.g., Walach 2020)
      remain as a counterweight."
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Flores’s thesis and subsequent preprint explicitly state that the
      psychological variables in matrix experiments exhibit high
      intercorrelations and that simulations respecting this dependence reduce
      the apparent strength of earlier significant results (MPI-E007, MPI-E016).
      This directly supports the claim that independence assumptions were
      violated and that dependence-aware reanalysis diminishes the founding
      effects. The strongest contra point is that Flores herself still finds
      three of five thesis studies significant under permutation tests that
      account for dependence, implying that while the critique weakens the
      original claims, it does not clearly eliminate all evidence for an
      excess-correlation effect.
  - claimId: MPI-C010
    verdict: mixed
    confidence: moderate
    reasoning: Walach et al. 2021 explicitly interpret their own two failed
      consensus-protocol replications as “likely part of the systematic nature
      of such effects” while also labeling the paradigm “not a replicable
      paradigm,” illustrating a practice in which both success and failure are
      accommodated within MPI’s qualitative expectations (MPI-E003). This
      supports the charge that, as deployed, the model has often not treated any
      realistic outcome of its nominated experiments as disconfirmatory. The
      opposing consideration is that the NT axiom in principle forbids any
      stable, exploitable psi signal, MPI did nominate the matrix surplus as a
      positive prediction, and the theory articulates testable fine-structure
      (e.g., decline rate versus effect size) that could be bound in advance;
      this shows that MPI is not logically unfalsifiable, and the insulation
      stems more from current scientific practice than from the model’s formal
      structure.
