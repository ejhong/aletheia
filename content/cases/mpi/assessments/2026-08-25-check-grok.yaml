  synthesis: >-
    The featured hypothesis is not that decline occurs — that is common ground —
    but that decline is the lawful signature of real, unexploitable
    psychophysical entanglement of the kind MPI describes. Assessed as an
    attribution about nature rather than as a description of a published theory,
    that hypothesis is only weakly supported by the records in this file. The
    observational rungs are solid and do not settle the case. Lucadou's group
    did report experimental-over-control surpluses from 1986 to 2006, and the
    later literature describes a genuine instability: Walach's 2020 two-lab
    surplus was called "significant but fragile" by its own authors a year
    later; two consensus-protocol replications were null; Grote's 2015 signal
    gave way to preplanned nulls in 2017 and a fully blind null in 2021.
    Kennedy's field-wide review confirms that this trajectory is the usual
    parapsychological pattern, not a matrix-specific curiosity. None of that
    distinguishes a shy law from selected noise.

    Steelman for MPI. The no-transmission axiom and its decline, sign-reversal,
    and displacement corollaries were in print in 2007, before the strict
    failures. The correlation-matrix design was the model's self-nominated
    positive test, not a post-hoc alibi, and for a time it produced the
    predicted surplus — including a large, simulation-evaluated two-lab report
    in an APA journal. Flores still found three of five thesis replications
    significant under permutation tests meant to respect dependence, and her
    2023 online split (true RNG significant, pseudo-RNG not) points the
    direction a quantum-flavored account wants. Generalized Quantum Theory is a
    real published formalism, not a metaphor. The model takes a genuine risk at
    the aggregate level: any stable, exploitable psi channel anywhere would
    refute it. Read that way, the empty box Grote opened on stage is what the
    theory said a well-built box would contain.

    Steelman for the conventional account. Counting significant cells against
    independence, when the psychological variables are highly intercorrelated,
    inflates the founding statistic; Flores's own Monte Carlo work, reported
    from inside the program, says the original results diminish once that
    dependence is respected. Grote 2017 is a live demonstration that a post-hoc
    contrast can extract p = 0.012 from data whose three preplanned analyses
    were null. Maier and Dechamps traced a celebrated neighboring micro-PK
    effect to a coding error. Bösch's 380-study REG meta-analysis judged
    publication bias the most encompassing explanation of the parent literature.
    The methodologically strongest test in the corpus — two hundred
    participants, analysis software locked before unblinding — fell well inside
    the chance distribution. Regression to the mean plus multiplicity produces
    decline and "displacement" from null data without remainder. On this reading
    MPI is a quantum vocabulary for the null hypothesis.

    The records do not make the conventional account airtight. No one has shown
    quantitatively that QRPs and dependence reproduce this specific published
    matrix record; Bierman's neighboring ganzfeld simulation covered about sixty
    percent, not all, of that effect; and a few structured positives survived
    analyses that were not naive. Those residues keep C007 from being
    contradicted. They do not carry it. The model's distinctive fine structure —
    faster decline after stronger initial effects, reappearance in related
    rather than random observables — has never been pinned down in advance and
    tested. Until it is, successes confirm entanglement and failures confirm
    elusiveness, and the attribution question is decided by priors about how
    often selected noise looks like a law. The evidence in this file, weighed
    without those priors doing extra work, leaves the shy-correlation thesis
    standing on a thinning ledge: early reports of contested statistical
    validity, a handful of later positives that did not survive the next
    tightening, and a prediction that the null hypothesis also makes.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: Successor papers (Walach 2020/2021, Grote 2021) consistently describe
      Lucadou's 1986–2006 series as reporting more significant
      psychological–physical cells in experimental than control matrices, and
      Walach 2020 itself added a further surplus against 10,000 simulated
      experiments. The claim as stated is about what those experiments reported,
      not about whether the counting was valid, and that reporting fact is
      multiply attested. The strongest opposing consideration is that the
      original full texts and raw data were not independently reanalyzed here,
      so the numerical surpluses remain second-hand, and the dependence critique
      in MPI-C009 attacks their statistical meaning rather than their existence
      as reports.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: "The two cleanest modern tests failed: Walach et al. 2021 froze a
      consensus protocol on OSF and obtained nulls in both replications,
      concluding the paradigm is not replicable; Grote 2021 wrote and locked the
      entire analysis before unblinding 200 participants and landed well inside
      the chance distribution. Grote 2017's three preplanned analyses were
      likewise null. \"Predominantly\" survives the messiness: Walach 2020
      predates those tighter controls and was later called fragile by its
      authors, and Flores's three-of-five thesis results were not full
      blind-analysis, preregistered replications. The strongest opposing
      consideration is that the record is not a clean sweep of nulls once every
      modern-era positive is counted."
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: "The published sequence is descriptively unstable: Lucadou positives,
      a 2020 surplus whose significance the same team said broke down under
      improved analysis, two 2021 consensus-protocol failures, and Grote's own
      arc from a 2015 significant distribution result through 2017 preplanned
      nulls to a 2021 blind null. Kennedy 2003 documents the same instability as
      a field-wide pattern. The claim does not assert that a real effect
      declined, only that reported patterns did not hold still. The strongest
      opposing consideration is that \"decline and displacement\" is a narrative
      laid over a small, heterogeneous set of studies with no prespecified
      metric of decline ever defined and then measured."
  - claimId: MPI-C004
    verdict: well_supported
    confidence: moderate
    reasoning: Atmanspacher, Römer and Walach 2002 axiomatize a weak quantum theory
      that keeps complementarity and entanglement while dropping Hilbert-space
      structure and Planck's constant, in a peer-reviewed foundations venue, and
      the 2007 JCS paper presents MPI as the psychophysical special case ordered
      by pragmatic information. That is enough to establish availability and
      intended instantiation; nothing in the file shows an internal
      inconsistency. The strongest opposing consideration is that, by discarding
      the quantitative machinery, the formalism retains quantum vocabulary while
      assigning no probabilities, so it constrains matrix data only
      qualitatively and functions more as a licensed analogy than as a
      predictive theory of effect size or timing.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: "The 2007 JCS paper states the no-transmission axiom verbatim and
      derives from it, in advance of the later failures, that attempted
      corroboration by replication will wipe out an apparent effect, that
      decline will be faster when the original effect was stronger, and that
      correlations may change sign or reappear in different observables or parts
      of the system. As a claim about what the model entails, this is on the
      page, not reconstructed after the fact. The strongest opposing
      consideration is diagnostic, not textual: regression to the mean makes the
      same coarse prediction, so the axiom's empirical credit depends on fine
      structure that has never been prespecified and tested."
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: The same 2007 paper, at the page cited, presents simultaneous
      registration of many correlations as the deliberate way to "make positive
      use of the evasion phenomenon," so that psi appears as transitory,
      jumping, unexpected patterns in a matrix, and concedes in the same breath
      that this will never convince every sceptic. That is the design's stated
      rationale, not a later gloss, and it binds the matrix record to MPI as the
      model's own nominated test. The strongest opposing consideration is that a
      design which predicts scattered, unexpected significant cells is also a
      description of what multiple testing on intercorrelated variables produces
      from noise, which is why dependence-aware standards decide what the design
      can show.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: low
    reasoning: A few structured positives remain after criticism — Walach 2020's
      simulation-evaluated surplus, Flores's three-of-five permutation
      survivors, and a theoretically pointed but unreviewed true-RNG split — and
      MPI did predict that tighter protocols would fail. Those residues are too
      thin to carry a claim that genuine non-local correlations produced the
      whole arc, given that the founding counts are diminished by
      dependence-aware reanalysis, the 2020 effect was called fragile by its own
      authors, the two consensus-protocol replications and Grote's blind n = 200
      test were null, and every mundane mechanism the rival needs is documented
      inside this literature. The strongest opposing consideration is that the
      explanation, as used, treats both hits and misses as confirmation, so the
      same record is at least as well explained by MPI-C008 without any anomaly.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Dependence-inflated cell counts, a post-hoc rescue of a null study
      (Grote 2017, p = 0.012 after three preplanned misses), a coding-error
      false positive in a neighboring micro-PK line, and a large REG
      meta-analysis that favors publication bias are all in this corpus or its
      immediate parent literature, and they jointly predict early selected
      positives followed by decline under tighter methods — which is the record
      we have. Sufficiency for this specific matrix series has not been
      demonstrated by a calibrated simulation, and Bierman 2016 covered only
      about sixty percent of a different flagship effect, so the claim stops
      short of well_supported. The strongest opposing consideration is that
      Walach 2020 and parts of Flores survived procedures intended to block the
      very artifacts invoked, which the mundane account says should not happen
      cleanly.
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Flores, working inside the program under Watt and Walach, found high
      intercorrelations among the psychological variables and reported that
      incorporating simulations diminished the earlier significant results — a
      concession against interest, later restated in the 2023 preprint. That is
      direct evidence that the independence assumption of the founding analyses
      was false and that correcting it shrinks the headline surpluses. The
      strongest opposing consideration is that the full quantitative reanalysis
      of the 1986–2006 datasets has not been published as a standalone reviewed
      result, and Flores herself still reported three of five thesis studies
      significant under permutation tests that respect dependence, so the
      critique weakens the origin story without zeroing out the program on its
      own terms.
  - claimId: MPI-C010
    verdict: mixed
    confidence: moderate
    reasoning: 'Walach et al. 2021 read their own preregistered nulls as "likely
      part of the systematic nature of such effects," which is the insulation
      pattern stated as a claim about practice, and the 2007 design paper had
      already announced that the paradigm would never convince every sceptic.
      Against that, the model is not theorem-level unfalsifiable: the
      no-transmission axiom forbids any stable exploitable psi channel, the
      matrix surplus was a positive prediction that could have failed from the
      start, the 2021 authors did concede the paradigm is not replicable, and
      distinctive corollaries (strength–reproducibility reciprocity,
      related-observable displacement) could be bound tomorrow. The strongest
      opposing consideration is therefore that the insulation is a habit of
      interpretation rather than a structural feature of the theory, and habits
      can be closed by published disconfirmation criteria that this file does
      not yet contain.'
