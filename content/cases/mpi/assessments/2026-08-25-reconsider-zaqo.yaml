    I hold weakly_supported, with two adjustments to the load-bearing set and
    explicit answers to the two seats that dissent on the verdict.


    Gemini argues for unresolved on the ground that neither side has closed: no
    calibrated simulation reproduces the founding matrix record, and MPI's
    distinctive fine structure (the strength–reproducibility reciprocity and
    displacement corollaries of MPI-E009, the RNG-type split in MPI-E008) has
    never been prespecified and tested. Both premises are correct and are
    already in the draft. They do not, however, entail evidential symmetry.
    'Unresolved' should mean the record cannot presently discriminate; here it
    can, partially. The model nominated its own benchmark (MPI-C006, MPI-E011),
    and that benchmark failed under the strictest available designs — two
    OSF-preregistered consensus replications reported by the proponents
    themselves (MPI-E003) and Grote's 200-participant frozen-software blind
    analysis (MPI-E004). That is asymmetric information about MPI-C007, not a
    tie. What is untested is the model's distinctive fine structure, and
    untested content earns no credit; it is precisely why the verdict is
    'weakly' rather than higher, not why it should be 'unresolved'.


    GPT-5.1 argues for mixed, on the strength of the surviving positives. But
    mixed implies two comparably weighted bodies of evidence pulling opposite
    ways, and the residue does not weigh that much. MPI-E002 was disowned as
    'significant but fragile' by its own authors in their next paper; MPI-E007's
    five studies share equipment, personnel and analytic choices, so three
    significant results are not three independent confirmations; MPI-E008 is an
    unreviewed preprint whose headline split is confounded by unequal achieved
    power (94% vs 67%). Against that stand two preregistered nulls and a blind
    null, plus every mundane mechanism caught operating in or beside the corpus:
    post-hoc rescue live in MPI-E006, dependence inflation from the program's
    own statistician (MPI-E007, MPI-C009), publication-bias dominance in the
    parent literature (MPI-E015), and a manufactured false positive from a
    coding error (MPI-E017). Credibility is not diagnosticity, and repetition
    inside one lab is not independence. Weakly_supported already records that
    the residue is non-zero.


    The three concurring seats add points I accept and now make explicit. Grok,
    Kimi and Opus are right that the decline record is evidentially inert
    between the rivals: regression to the mean on selected noise predicts the
    same curve, so MPI's advance publication of the decline (MPI-C005, MPI-E009)
    buys integrity against the retrofitting charge but no discriminating credit.
    Opus's further point — that non-signalling correlations in physics are
    perfectly replicable in aggregate, which is why the matrix design was
    supposed to work at all — is a real strain on the model's own logic and
    strengthens rather than weakens the present verdict; I note it without
    downgrading MPI-C005, which is a claim about what the model says and when,
    both matters of record. Gemini's rating of MPI-C001 as well_supported reads
    the claim as pure reportage; the word 'significantly' imports the validity
    of the significance count, which MPI-C009 undercuts and no one has audited,
    so MPI-C001 stays mixed and stays a weakest link. MPI-C002 joins the
    load-bearing set because the nulls, not the founding reports, now carry the
    verdict. Highest-value next steps are unchanged: a dependence-aware
    reanalysis of the founding datasets, and a prespecified test of the
    reciprocity corollary.
