      reported parapsychological anomalies.
  - claimId: MPI-C009
    verdict: well_supported
    confidence: moderate
    reasoning: Psychological test batteries inherently feature strong
      intercorrelations among items and subscales, directly violating the
      assumption of cell independence necessary for standard matrix significance
      counts. Methodological reanalyses and simulation work by Flores (2021,
      2023) demonstrated that when Monte Carlo and permutation techniques
      account for these intercorrelations, the nominal excess-correlation
      surplus of earlier studies substantially diminishes. The strongest
      opposing consideration is that the original raw datasets from the
      1986–2006 Lucadou studies have never been re-evaluated in a standalone,
      peer-reviewed reanalysis, leaving the exact degree of statistical
      inflation partially inferential.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: high
    reasoning: In practice, MPI operates with an asymmetrical interpretive structure
      that treats positive replications as evidence of psychophysical
      entanglement and failed replications as confirmation of the predicted
      decline effect. This epistemic insulation is directly evidenced in Walach
      et al. (2021), where two rigorous preregistered null results were
      characterized as part of the systematic nature of the effect rather than
      evidence against the paradigm. The strongest opposing consideration is
      that proponents have theoretically proposed testable fine-structure
      predictions, such as the mathematical reciprocity between initial effect
      size and decline rate, which could in principle constrain the model if
      strictly prespecified.
