  synthesis: >-
    The Model of Pragmatic Information (MPI) represents one of the
    parapsychological literature's most sophisticated attempts to explain the
    persistent failure of anomalous phenomena to replicate on demand. By
    embedding psychophysical interactions within Generalized Quantum Theory
    (GQT) and asserting a strict no-transmission axiom, MPI theoretically
    derives that any attempt to stabilize an anomalous correlation into a
    reliable, exploitable signal must inevitably induce its decline, sign
    reversal, or displacement. To empirically test this hypothesis, theorists
    proposed the correlation-matrix method (CMM), predicting that genuine
    entanglement correlations would manifest as an excess surplus of significant
    cells across high-dimensional matrices without enabling causal signal
    transmission.

    However, the recorded empirical evidence fundamentally contradicts the claim
    that correlation-matrix designs detect genuine non-local anomalies. When the
    paradigm was subjected to rigorous methodological safeguards—most decisively
    in preregistered consensus protocols (Walach et al. 2021) and
    software-blinded analyses where scripts were frozen prior to unblinding
    (Grote 2021)—the excess correlation effect failed entirely. Even the model's
    primary proponents concluded that the matrix experiment is not a replicable
    paradigm. Furthermore, methodological work by Flores (2021, 2023)
    demonstrated that the founding positive reports of the 1980s through 2000s
    were heavily confounded by psychological variable intercorrelations that
    violated independence assumptions, artificially inflating nominal matrix
    significance. When combined with established base rates of publication bias,
    selective analysis reporting, and ordinary coding errors, conventional
    statistical mechanics are jointly sufficient to account for the entire
    historical arc without requiring anomalous physics.

    Proponents steelman their position by arguing that replication failure is
    the explicit theoretical prediction of GQT, pointing to isolated residual
    anomalies such as the online true-RNG versus pseudo-RNG split reported by
    Flores & Rapazote-Flores (2023). Yet this conceptual insulation is precisely
    what undermines MPI scientifically: treating positive replications as
    evidence of entanglement and negative replications as confirmation of
    decline renders the model immune to empirical falsification.

    Sensitivity analysis: The single evidence record whose removal would most
    threaten this contradicted verdict is MPI-E003 (Walach et al. 2021, 'Nailing
    Jelly'). If this proponent-led preregistered replication had confirmed a
    robust matrix surplus, the empirical status of the paradigm would remain
    actively viable. Nevertheless, the contradicted verdict comfortably survives
    its removal: Grote's independent double-blind null (MPI-E004) and Flores's
    demonstration of widespread statistical dependence inflation (MPI-E007,
    MPI-C009) independently establish that the surplus is an artifact of
    uncorrected dependencies rather than genuine psychophysical entanglement.
  steelman: The online factorial replication by Flores & Rapazote-Flores (2023)
    observed a statistically significant surplus of matrix correlations
    exclusively with an atmospheric-noise quantum true-RNG (Random.org, p =
    0.00013) but found no significant effect with a deterministic pseudo-RNG
    (Mersenne Twister), an unexpected empirical divergence that aligns with
    MPI's theoretical requirement for ontic indeterminacy over algorithmic
    determinism.
