  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: Preregistered and blinded replications have systematically failed to
      reproduce significant excess correlations. Walach et al. (2021) tested two
      preregistered cohorts on identical hardware and found neither significant,
      concluding that the matrix experiment is not a replicable paradigm, while
      Grote's (2021) fully blind preregistered experiment yielded null primary
      outcomes. The strongest opposing consideration comes from Flores (2021),
      whose doctoral thesis reported that three out of five replication attempts
      retained statistical significance under permutation testing.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: Across the experimental record, positive effects have consistently
      failed to reproduce across identical matrix cells or variable pairs,
      exhibiting weakening effect sizes, shifts to alternate metrics, or
      complete disappearance upon replication. This instability is acknowledged
      by both critics and leading proponents, who documented the breakdown of
      significance across successive studies (Walach et al. 2021) and post-hoc
      variations (Grote 2017). The strongest opposing consideration is that a
      small subset of secondary analyses and re-analyses have occasionally
      reached marginal significance, creating the appearance of shifting rather
      than vanished effects.
  - claimId: MPI-C004
    verdict: established
    confidence: high
    reasoning: The theoretical foundations of Generalized Quantum Theory (GQT) were
      explicitly formalized by Atmanspacher, Römer, and Walach (2002) in
      Foundations of Physics as an axiomatic extension of quantum concepts like
      complementarity and entanglement to non-physical systems. MPI explicitly
      operationalizes this framework by applying pragmatic information as the
      ordering metric for psychophysical interactions. The strongest opposing
      consideration is that dropping Hilbert-space mathematics and Planck's
      constant removes the quantitative constraints that make physical quantum
      mechanics predictive, rendering GQT primarily an interpretive formal
      framework.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: The derivation that anomalous psychophysical correlations must
      decline, displace, or change sign to prevent exploitable signal
      transmission was published in detail by von Lucadou, Römer, and Walach in
      2007 prior to the modern replication attempts. The authors explicitly
      derived reciprocity between initial effect size and rate of decline
      directly from the no-transmission axiom. The strongest opposing
      consideration is that this derivation functions as an unfalsifiable
      conceptual buffer rather than a mathematically rigorous deduction with
      parameter-free quantitative predictions.
  - claimId: MPI-C006
    verdict: established
