  synthesis: >-
    The Model of Pragmatic Information (MPI) addresses a central dilemma in
    parapsychology: why putative psychophysical anomalies persistently elude
    stable replication. Grounded in Generalized Quantum Theory (GQT), MPI
    formalizes a 'no-transmission' axiom that forbids non-local correlations
    from serving as controllable causal signals, predicting that efforts to nail
    down an effect will induce decline, sign changes, or displacement to
    unmonitored variables. To circumvent this evasion, proponents nominated the
    correlation-matrix method (CMM), distributing potential psychophysical
    entanglements across hundreds of variable pairs. Proponents argue that the
    empirical trajectory—early positive yields followed by systematic decline
    under tight replication—is not a series of methodological failures but the
    exact qualitative signature predicted a priori by the theory. Furthermore,
    findings such as the RNG-type split in Flores & Rapazote-Flores (2023)
    suggest that physical, indeterminate sources may behave differently from
    algorithmic pseudo-random generators, exactly as a non-local correlation
    model would anticipate.

    However, the empirical and methodological weight of the evidence record
    contradicts the MPI hypothesis. First, CMM was specifically engineered by
    MPI theorists as an evasion-resistant test capable of revealing macroscopic
    entanglement; yet when evaluated under rigorous, preregistered consensus
    protocols (Walach et al. 2021) and strict pre-data blind analysis (Grote
    2021), the surplus of matrix correlations evaporated entirely. Second, the
    conventional statistical steelman accounts for the historical trajectory
    without invoking novel physics: psychological variables in the early matrix
    studies possessed strong intercorrelations that violated independence
    assumptions, and simulations correcting for this dependence severely
    diminish the founding results (Flores 2021, 2023). Combined with publication
    bias (Bösch 2006), analytic flexibility (Grote 2017), and documented coding
    bugs (Maier & Dechamps 2022), standard statistical artifacts adequately
    explain both the initial inflated positives and their subsequent
    disappearance under preregistration. Finally, MPI's protective structure
    renders it practically unfalsifiable (MPI-C010): treating replication
    success as confirmation and replication failure as predicted decline
    insulates the model from disconfirmation.

    In sensitivity analysis, the single evidence record whose removal would most
    alter this assessment is MPI-E003 (Walach et al. 2021, 'Nailing Jelly'),
    where the model's primary theorists acknowledged that their consensus
    preregistered replications failed and that the matrix paradigm is not
    replicable. Nevertheless, the contradiction verdict survives without
    MPI-E003, as Grote's 2021 blinded replication (MPI-E004) and Flores's
    demonstration of cross-variable dependence artifacts (MPI-E007, MPI-E009)
    independently undermine the empirical foundation of the correlation-matrix
    effect.
  steelman: The 2023 online matrix replication (Flores & Rapazote-Flores) observed
