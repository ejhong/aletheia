      intended to capture unexploitable entanglement without offering a singular
      signaling channel. The strongest opposing consideration is that the design
      may have served retroactively as an intuitive justification for
      multi-testing rather than a necessary structural consequence of
      quantum-like modeling.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: high
    reasoning: Attributing the pattern of early positive results and subsequent
      decline to genuine psychophysical entanglement correlations is
      contradicted by the experimental and statistical evidence. When rigorous
      controls such as pre-unblinding analysis scripts and OSF preregistration
      were applied, the excess correlations vanished, while the initial positive
      results have been demonstrated to stem from statistical dependence and
      analytic flexibility. The strongest opposing consideration is that
      proponents predicted the decline and displacement of effects in advance of
      replication failures, and anomalous splits between physical and
      pseudo-random sources were reported by Flores and Rapazote-Flores (2023).
  - claimId: MPI-C008
    verdict: well_supported
    confidence: high
    reasoning: The convergence of known statistical artifacts provides a
      comprehensive and sufficient explanation for the correlation-matrix record
      without invoking anomalous physics. Monte Carlo simulations demonstrate
      that intercorrelation among psychological test items artificially inflated
      nominal significance in the original matrices, while publication bias,
      regression to the mean, and post-hoc analysis shifts explain the initial
      positives and subsequent fade. The strongest opposing consideration is
      Bierman et al.'s (2016) finding in neighboring parapsychological datasets
      that standard models of questionable research practices could not fully
      eliminate reported effect sizes under realistic parameter assumptions.
  - claimId: MPI-C009
    verdict: well_supported
    confidence: high
    reasoning: Methodological reanalyses demonstrate that psychological inventories
      exhibit substantial internal covariance, violating the assumption of
      mutual independence required by standard cell-counting tests. Flores
      (2021, 2023) established via permutation and simulation methods that
      correcting for this cross-variable dependence substantially attenuates the
      excess-correlation signal reported in early matrix studies. The strongest
      opposing consideration is that Flores reported that three of five
      replication experiments nonetheless retained statistically significant
      excess correlations even after applying permutation tests designed to
      control for dependence.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: high
    reasoning: The interpretive deployment of MPI insulates the theory from
      empirical refutation by absorbing both positive and null findings as
      confirming instances. In Walach et al. (2021), the failure of two
      preregistered consensus experiments was explicitly interpreted as
      corroboration of the predicted evasive nature of psi rather than
      disconfirmation of the underlying hypothesis. The strongest opposing
      consideration is that MPI does offer conceptually distinct qualitative
      predictions, such as the documentation suppression effect tested by Watt
      and Tierney (2013), suggesting the model could theoretically be falsified
      if proponents committed to binding quantitative thresholds in advance.
