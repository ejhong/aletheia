  synthesis: "The record has a clear load-bearing structure. Three documentary
    claims are solid: the founding experiments did report excess correlations
    (C001), the formal framework exists in a physics-foundations venue (C004),
    and the correlation-matrix design was nominated by the theorists themselves
    as the model's best test, with the decline/displacement prediction verbatim
    in print by 2007 (C005, C006). The case then turns on what happened when
    that nominated test was run well. It failed twice under a preregistered
    consensus protocol by the proponents' own team, and independently returned
    null under the corpus's strictest blind analysis with 200 participants
    (C002). Meanwhile the founding significance has been directly targeted by a
    dependence-aware critique from inside the program: Monte Carlo work showing
    intercorrelated psychological variables inflated the original results, with
    simulated-data reanalyses diminishing them (C009). Together with the Bösch
    meta-analytic base rate, Bierman's QRP quantification, Maier & Dechamps's
    documented coding error, and Grote 2017's live demonstration that a post-hoc
    variant turns nulls into a positive, the conventional account (C008) is well
    supported as sufficient for this corpus. Steelmanning the null: the
    asymmetry is diagnostic — every surviving positive (the \"fragile\" 2020
    surplus, Flores's three-of-five thesis studies, the 2023 true-RNG arm) is
    non-independent, unreviewed, or unstable under improved analysis, while the
    negatives are the preregistered, blinded, adequately powered ones.
    Steelmanning MPI: the decline prediction was genuinely in print before the
    replication failures, and the 2007 paper even pre-conceded the paradigm
    would never convince skeptics — so the failures are not retrofitted. But a
    prediction compatible with both success and failure cannot carry an
    attribution, and the attribution claim (C007) is contradicted: the model's
    own chosen benchmark, run under the conditions it should survive, found
    nothing. What keeps the case at weakly_supported rather than contradicted is
    the residue: the 726-participant online replication's split by randomness
    source (true atmospheric noise significant, deterministic PRNG not), which
    no item on the mundane explanation list predicts, plus permutation-level
    positives that survived a dependence-aware analysis. The net evidential
    weight is negative on the central attribution, with a genuine but thin
    unexplained remainder. Sensitivity: remove MPI-E004 (the independent blind
    null) and the negative case rests mainly on proponent-run failures that the
    model explicitly absorbs as decline; the case verdict would likely slip
    toward mixed, so the current negative lean partly hangs on that single
    independent record."
  steelman: In the 2023 online replication (726 participants, ~10,900 sessions),
    the same protocol produced a significant experimental-versus-control matrix
    difference with a true atmospheric-noise random source (Welch's t = 3.811, p
    = 0.00013, power 94%) and no significant difference with a deterministic
    Mersenne Twister (p = 0.070, 67% power) in the same paradigm. None of the
    four mechanisms the conventional account invokes — regression to the mean,
    analytic flexibility, publication bias, statistical dependence among matrix
    variables — predicts any dependence on whether the physical entropy source
    of the random generator is genuine, whereas MPI-family theory specifically
    requires indeterminacy to matter. This measured, directional,
    source-dependent contrast is a specific observation my null-leaning
    assessment does not explain, and it is cheaply testable at equal per-arm
    power.
