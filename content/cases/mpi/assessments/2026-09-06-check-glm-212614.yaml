      already a documented field pattern (Kennedy 2003) before 2007, so the
      prediction's novelty and precision are limited. The strongest opposing
      consideration: an axiom that entails only qualitative evasiveness risks
      entailing whatever pattern occurs."
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: The 2007 paper states the matrix-design rationale verbatim — register
