      consistently attested. The strongest opposing consideration: the full
      texts were not examined, raw data are unpublished, and the analyses
      predate the dependence critique — so the *reported* excess is well
      supported even though its reality is not."
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: "The record contains three independent preregistered or blind
      failures: two consensus-protocol replications by the proponents' own team
      (Walach 2021), Grote's fully blinded 200-participant replication, and
      Grote 2017's null preplanned analyses. The only counterweight is Flores's
      three of five significant thesis studies, which \"predominantly\"
      correctly accommodates. The strongest opposing consideration is that
      Flores's partial positives and the 2023 true-RNG result show the paradigm
      is not uniformly null."
  - claimId: MPI-C003
