      its authors pre-announced as non-decisive.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: moderate
    reasoning: "The attribution claim requires the full record — early positives,
      decline, displacement — to be produced by genuine non-local correlations.
      The record shows the opposite trajectory: the effect vanishes precisely
      where artifacts predict it should (blind analysis, preregistration,
      dependence-aware statistics) and persists only where those controls are
      absent or weak (thesis studies, unreviewed preprint). The proponents' own
      conclusion that the paradigm \"is not replicable\" is close to a
      concession. The strongest opposing consideration is the unexplained 2023
      true-RNG result and Flores's partial positives, which is why confidence is
      moderate rather than high."
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The components are individually documented: Bösch's small-study
      effect and publication bias, Bierman's QRP simulation (explaining ~60% of
      the adjacent ganzfeld effect), a coding-error false positive (Maier &
      Dechamps), and live analytic flexibility (Grote 2017). \"Jointly
