  synthesis: "The case divides cleanly into a descriptive layer, which the record
    supports, and an attribution layer, which the record weighs against. The
    descriptive claims are solid: Lucadou's founding experiments did report
    excess matrix correlations (MPI-C001), the effects did not survive
    replication (MPI-C002, MPI-C003), the formal framework exists (MPI-C004),
    and the decline/displacement predictions and matrix-design rationale are
    genuinely in print from 2007 (MPI-C005, MPI-C006). The attribution claims
    are where the case fails. The strongest evidence against MPI-C007 is not
    hostile: it comes from the proponents' own program. Walach et al. 2021 ran
    two preregistered, consensus-protocol replications on the model's own
    nominated benchmark and got nothing, concluding the paradigm \"is not
    replicable\"; Grote 2021, the methodologically strictest and most
    independent test, was null under full blinding with analysis software frozen
    in advance; and Flores's dependence-aware Monte Carlo work (MPI-C009)
    substantially diminishes the founding excess-correlation results, attacking
    the statistical foundation rather than merely the interpretation. Meanwhile
    the conventional account (MPI-C008) is not merely a slogan: Grote 2017
    demonstrates analytic flexibility live on its own data, Bösch 2006 supplies
    the publication-bias base rate, and Maier & Dechamps 2022 documents an
    ordinary coding error manufacturing an \"anomalous\" effect in the adjacent
    literature. Against this, the residual positives — Walach 2020
    (self-described as fragile), Flores's three of five thesis studies sharing
    equipment and personnel, and the 2023 preprint's RNG split — are exactly the
    class of result that regression, flexibility, and selection predict.
    MPI-C010 completes the picture: because the model reads success as
    entanglement and failure as predicted decline, its agreement with the record
    is not differential evidence. A model consistent with everything is
    confirmed by nothing. The residual positives (see steelman) keep this from
    being high-confidence, and the desk-reanalysis and adversarial-blinding
    projects in the research agenda are the right next moves."
  steelman: The Flores & Rapazote-Flores 2023 preprint reports a significant
    excess-correlation effect (p = 0.00013, 94% power, 726 participants) with a
    physically indeterminate atmospheric-noise random source but not with the
    deterministic Mersenne Twister. No conventional account — regression to the
    mean, QRPs, publication bias, statistical dependence — predicts any
    dependence on whether the random source is quantum-indeterminate; every one
    of them treats the two arms identically. This is a forward-looking,
    theory-motivated contrast (not a post-hoc reading of old decline), it is
    cheaply testable as a preregistered factorial (MPI-R003), and this
    assessment has no evidence-based rebuttal to it beyond the record's caveats
    (unreviewed preprint, uneven power between arms). Combined with Flores's
    three of five replications surviving her own dependence-aware analyses, a
    proponent can rightly say the effect appears precisely where an
    indeterminacy-dependent theory says it should.
