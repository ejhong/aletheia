      not exhaust the ganzfeld residual, and no comprehensive quantitative model
      of the matrix corpus specifically exists. Sufficiency remains an
      inference; the mechanisms are real and the right magnitude, but
      sufficiency is not demonstrated."
  - claimId: MPI-C009
    verdict: well_supported
    confidence: moderate
    reasoning: "The Flores 2023 preprint reports both the high intercorrelations
      among psychological variables and the Monte Carlo simulations under which
      the founding results diminished, and the 2021 thesis applied the same
      methods from inside the program. The claim is directly anchored and
      consistent across two records by the same team. The strongest opposing
      consideration: this has not been published as a standalone peer-reviewed
      reanalysis of Lucadou's datasets, and the founding raw data remain
      unavailable for independent confirmation."
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: "The proponents' own texts supply the insulation: Walach 2021 reads
      its own preregistered failure as \"likely part of the systematic nature of
      such effects,\" and the 2007 paper concedes in advance that the paradigm
      will never convince every sceptic, while Watt & Tierney's field null was
