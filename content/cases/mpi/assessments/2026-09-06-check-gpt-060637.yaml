  synthesis: >-
    The record supports the existence of a published theoretical framework and a
    real empirical puzzle, but it provides only weak support for the featured
    hypothesis that genuine non-local psychophysical correlations produce that
    puzzle. GQT and MPI explicitly state a no-transmission principle, derive
    decline and displacement from it, and nominate correlation matrices as a way
    to register distributed correlations without creating a stable signal. Those
    are facts about the model's content, not empirical validation. The 2007
    derivation also preceded the prominent 2017–2021 failures, although it
    followed much of the founding experimental series and lacks quantitative
    thresholds for decline, sign reversal, or displacement.

    The strongest pro-MPI reading combines the original reported surplus, the
    positive but fragile 2020 experiment, three positive studies among Flores's
    five in-house replications, and the large 2023 online result obtained with
    an atmospheric-noise source. It adds that the subsequent decline was
    predicted by the theory rather than invented only after those replications
    failed. This is a nontrivial evidential residue, especially because Flores
    reports that some positive findings remained after dependence-aware methods
    were introduced.

    The stronger conventional reading emphasizes evidence quality and
    diagnosticity. Two preregistered consensus-protocol replications were null,
    and the independent 200-participant blind analysis fell within its expected
    random distribution. Grote's earlier series also illustrates the transition
    from an initial positive to null preplanned analyses and a significant
    post-hoc variant. Intercorrelation among psychological variables undermines
    the cell-counting assumptions behind the founding results, while the
    original raw data remain unavailable for an independent dependence-aware
    audit. The broader publication-bias and coding-error records are not direct
    tests of Lucadou's datasets, but they establish plausible ordinary failure
    modes. Even without invoking the low general prior for non-local
    psychophysical effects, the most controlled evidence is less favorable than
    the exploratory and methodologically fragile evidence.

    Source and sample dependence further limits the apparent volume of support.
    MPI-E009 and MPI-E011 are two passages from the same 2007 theory paper, not
    independent confirmations. MPI-E002 and MPI-E003 belong to an overlapping
    proponent-led experimental line, while the five Flores studies share
    personnel, equipment, and analytic development and therefore cannot be
    counted as five independent replications. MPI-E001 is largely a second-hand
    characterization of founding reports whose raw data were not supplied.

    The record therefore does not establish an anomalous correlation, much less
    its non-local and meaning-dependent attribution. Nevertheless, the positive
    dependence-aware and online observations prevent a stronger contradicted
    verdict on this supplied record alone. A major structural defect is that
    proponents can count positive outcomes as entanglement and prominent nulls
    as predicted decline; without binding fine-structure predictions,
    consistency with failure has little confirmatory value. Sensitivity is
    greatest to MPI-E007, because it is the best evidence that some positive
    results survived methods designed to address dependence. Removing MPI-E007
    would move the assessment appreciably toward contradicted, but the
    weakly_supported verdict survives because MPI-E002 and MPI-E008 still leave
    a fragile positive residue; confidence in that residue would be lower.
  steelman: The record does not explain why Flores obtained three significant
    studies out of five after introducing dependence-aware analyses, or why the
    2023 online experiment produced a strong experimental-control difference
    with atmospheric randomness but not with the deterministic generator. It
    also contains no preregistered test of MPI's distinctive prediction that
    stronger initial effects should decline faster or displace to specified
    alternate observables.
