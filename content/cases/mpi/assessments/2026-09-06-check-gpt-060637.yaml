  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: Successor papers consistently describe Lucadou's 1986–2006
      experiments as having reported an excess of significant
      experimental-session correlations, so the claim about what was reported is
      supported. This does not establish that the reported surplus was
      statistically valid. The strongest opposing consideration is that the
      primary texts and raw data were not examined here, leaving the claim
      dependent on later descriptions from an overlapping research group.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: Two preregistered consensus-protocol replications were
      nonsignificant, and an independent 200-participant experiment with
      analysis software completed before unblinding also returned a null main
      result. Grote's 2017 preplanned analyses were likewise nonsignificant. The
      strongest opposing consideration is that one consensus replication and the
      small 2017 study had limited power, but that does not overturn the stated
      predominance among preregistered or blind tests.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: moderate
    reasoning: The record documents initial positives followed by weaker or null
      preplanned results, including Grote's 2015–2017–2021 sequence and the
      failure of the 2020 matrix finding in two consensus replications. A
      significant post-hoc variant after null preplanned analyses also
      illustrates movement between analyses rather than stability in the
      nominated outcome. The strongest opposing consideration is that the
      supplied records demonstrate weakening more directly than literal sign
      changes or prospectively identified displacement to new variables.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: moderate
    reasoning: The 2002 paper is described as an axiomatized weak quantum framework
      retaining complementarity and entanglement for arbitrary systems, and the
      later MPI paper applies those ideas to psychophysical systems. This
      establishes the existence and broad structure of the formalism, not its
      empirical adequacy. The strongest opposing consideration is that dropping
      Hilbert-space probabilities and other quantitative machinery makes
      “formally explicit” compatible with very limited numerical predictive
      content.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: moderate
    reasoning: The 2007 source explicitly states the no-transmission axiom and
      derives decline, faster decline for stronger effects, possible sign
      change, disappearance, and displacement to other observables. It therefore
      documents more than a retrospective assertion made only after the
      2017–2021 failures. The strongest opposing consideration is that the
      publication followed the founding positive experiments and supplies no
      operational threshold for when a protocol becomes signal-capable or where
      displacement must occur.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: The theorists expressly proposed simultaneous registration of many
      correlations so that effects could appear as transient and jumping
      patterns rather than as one repeatable outcome. This directly establishes
      the matrix design's intended role within MPI. The strongest opposing
      consideration is that the same source concedes the design cannot fully
      overcome decline, which weakens it as a discriminating test but does not
      negate the methodological rationale claimed here.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: The fragile 2020 positive, three positive studies among Flores's five
      replications, and the 2023 atmospheric-randomness result provide some
      evidence for an unexplained correlation surplus. None directly measures
      non-locality, meaning dependence, or an MPI-specific mechanism, and the
      strict preregistered and blind tests were null. The strongest opposing
      consideration is the combination of those nulls with the dependence
      critique of the founding analyses, which makes ordinary statistical and
      selection mechanisms more diagnostic than the observed decline itself.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Dependence among matrix variables, the emergence of a significant
      post-hoc result after null preplanned analyses, and documented
      publication-bias or coding-error mechanisms together provide a coherent
      ordinary explanation of early positives followed by decline. This
      assessment is partly strengthened by the general prior that known
      statistical failure modes should be preferred to a novel non-local
      mechanism when both fit the same pattern. The strongest opposing
      consideration is that no supplied analysis demonstrates that these
      mechanisms quantitatively reproduce the entire matrix corpus, and some
      Flores results reportedly survived dependence-aware procedures.
  - claimId: MPI-C009
    verdict: well_supported
    confidence: moderate
    reasoning: Flores's work reports high intercorrelation among psychological
      variables and diminished founding results after simulations accounted for
      that dependence. This directly addresses a statistical assumption
      underlying counts of significant matrix cells. The strongest opposing
      consideration is that the evidence comes from a thesis and its successor
      preprint within one project, while the unavailable founding raw data have
      not received the proposed independent, reviewed reanalysis.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: In the clearest supplied example, proponents concluded that the
      matrix paradigm itself was not replicable yet interpreted its two failed
      replications as likely part of the effects' systematic nature. Combined
      with a framework that permits decline, sign reversal, disappearance, or
      movement to other observables, this leaves ordinary experimental outcomes
      with little apparent disconfirming force in actual deployment. The
      strongest opposing consideration is that the documentation field
      prediction and the proposed strength-reproducibility relation are
      operationalizable in principle, so the absolute claim that no feasible
      outcome could count against MPI exceeds what one documented proponent
      response conclusively proves.
