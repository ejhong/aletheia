  synthesis: >-
    The supplied record establishes a real but unstable experimental literature,
    not the claimed non-local psychophysical attribution. Early experiments were
    reported as showing excess matrix correlations, and positive findings did
    not end with the founding group: the 2020 two-laboratory study reported a
    surplus, Flores reported significance in three of five in-house studies
    after introducing improved methods, and the 2023 online preprint reported a
    surplus for atmospheric randomness but not for a pseudo-random generator.
    The qualitative sequence of positive findings followed by weakening or
    displacement also resembles the decline pattern that MPI expressly described
    before the 2017–2021 failures. This is the strongest case for MPI in the
    record and prevents a clean verdict of contradiction.

    The opposing case is methodologically stronger. Two consensus-protocol
    replications using the same equipment were nonsignificant, and Grote's
    independent 200-participant blind analysis placed its main result within the
    expected random distribution. Grote's earlier series also illustrates how a
    significant post-hoc analysis can coexist with null preplanned analyses.
    Most importantly, dependence among psychological variables appears to have
    inflated the founding significance counts, while improved analysis made the
    prominent 2020 effect fragile. These findings do not prove that every
    positive result is an artifact, but they remove the main reason to attribute
    the record specifically to non-local correlations. The broad
    publication-bias and coding-error records document plausible conventional
    failure modes, although they concern neighboring literatures and cannot by
    themselves explain every matrix result.

    The formal claims must be separated from their empirical implications. GQT
    and MPI are genuine articulated frameworks, and the no-transmission,
    decline, sign-change, and displacement ideas are in print. However, the
    record supplies no quantitative derivation of when a protocol becomes
    signal-enabling, how rapidly an effect must decline, where it must displace,
    or what result would count against the model. Consequently, agreement
    between the observed instability and MPI has low diagnostic value: ordinary
    selection, regression, dependence, and analytic flexibility predict a
    similar history. Conversely, failed replications cannot straightforwardly
    falsify a model that predicts failed replication. This asymmetry
    substantially supports the criticism that MPI has been insulated in
    practice.

    The verdict is therefore mixed rather than an assertion that both
    explanations are equally supported. The existence of reported, occasionally
    dependence-aware positives and a pre-existing decline prediction gives MPI
    limited evidential contact, but the genuine non-local attribution remains
    weak and the conventional interpretation is better supported by the most
    controlled tests. A verdict of contradicted would exceed this record because
    the founding data have not undergone the proposed independent
    dependence-aware reanalysis and the true-versus-pseudo-random contrast has
    not received an equally powered preregistered replication. This assessment
    does not rely on author prestige, outsider status, or paper counts.

    The single most consequential record is MPI-E003, because it contains two
    preregistered, same-equipment failures under a consensus protocol and comes
    from a proponent-led team. Removing it would weaken the negative side more
    than removal of any other individual record, but the mixed verdict survives:
    MPI-E004 supplies an independent blind null, MPI-E006 supplies preplanned
    nulls, and MPI-E007 and MPI-E009 preserve both the residual positive
    evidence and the dependence critique.
  steelman: "The strongest unanswered pro-MPI point is the surviving
    dependence-aware positive line: Flores reports significant results in three
