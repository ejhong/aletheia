  synthesis: "The featured hypothesis asserts that psi is real as non-local,
    meaning-dependent observer–system correlations governed by a no-transmission
    axiom, and that correlation-matrix experiments reveal those correlations as
    surplus significant cells. The supplied record separates cleanly into three
    layers. First, the descriptive and theoretical layer is solid: Lucadou-group
    experiments did report excess experimental-versus-control correlations
    (C001); Generalized Quantum Theory and MPI supply an explicit formalism and
    an advance decline/displacement derivation from the no-transmission axiom
    (C004, C005); and the matrix design was explicitly offered as the model's
    own test that spreads effects to evade signal-like use (C006). Second, the
    modern empirical layer undercuts the claimed surplus. Preregistered
    consensus-protocol replications by the proponent team itself returned nulls
    and led the authors to state that the matrix experiment is not a replicable
    psi paradigm (E003/C002); Grote's independent blind-analysis study with
    analysis code frozen before unblinding likewise fell inside the random
    distribution (E004); and within-experimenter series show the classic arc of
    early positives followed by preplanned nulls (E005–E006/C003). Third, the
    attribution layer favors ordinary mechanisms over genuine entanglement
    correlations. Intercorrelation among psychological variables violated the
    independence assumptions of the original significance counts, and
    dependence-aware Monte Carlo reanalyses diminish the founding excesses
    (C009/E007). Regression to the mean, analytic flexibility (including a
    documented post-hoc rescue inside Grote 2017), publication bias in the
    broader micro-PK literature, and at least one coding-error false positive in
    a neighboring correlational micro-PK line jointly supply a sufficient
    conventional account of early positives and subsequent decline (C008). As
    deployed, MPI absorbs both significant and null outcomes—success as
    entanglement, failure as predicted decline—so no feasible result of its own
    nominated experiments is treated as evidence against the model (C010/E003).
    That insulation is itself evidence against treating the hypothesis as
    empirically corroborated. Residual positive fragments remain (fragile Walach
    2020 surplus later qualified by its authors; partial Flores in-house
    positives; the 2023 true-RNG versus pseudo-RNG split in an unreviewed
    preprint), but they are smaller, less robust, and less independent than the
    failed preregistered and blind tests. Weighing only the supplied records,
    the anomalous-attribution core (C007) is therefore at best weakly supported:
    the pattern of reports exists, the theory is coherent on paper, yet the
    better- controlled measurements and the dependence critique remove most of
    the evidential base that would be required to prefer genuine non-local
    correlations over conventional statistical and selection processes. The
    verdict hangs primarily on the replication failures and the dependence
    reanalyses; it is not a strong positive finding for the hypothesis."
  steelman: The 2023 Flores online matrix study reported a statistically
    significant experimental–control surplus with a true atmospheric-noise RNG
    (Random.org) but not with a deterministic Mersenne Twister PRNG—the exact
    source-dependence split quantum-flavored non-local theories expect and that
    pure selection, dependence, or QRP accounts do not predict—and that split is
    not explained away by the conventional steelman in this assessment.
