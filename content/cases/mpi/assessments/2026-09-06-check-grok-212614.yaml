  synthesis: >-
    The featured hypothesis asserts that psi is real as non-local,
    meaning-dependent observer–system correlations governed by a no-transmission
    (NT) axiom, that this axiom forces decline, sign-change, or displacement
    under any protocol that could convert the correlations into a stable signal,
    and that correlation-matrix experiments are the appropriate way to detect
    the surplus without enabling transmission. The observational skeleton of
    that story is real in the supplied record. Original Lucadou-group matrices
    were reported as showing excess experimental-versus-control significant
    cells (C001; E001, E002). Later work by the same circle and by independent
    experimenters documents instability: patterns weaken, flip, or migrate
    across cells and analyses (C003; E003, E005, E006, E014). Preregistered
    consensus-protocol and full-blind replications predominantly return nulls on
    primary analyses (C002; E003, E004, E006). The theoretical claims are also
    correctly stated as claims about the literature: Generalized Quantum Theory
    was published as a weak, non-quantified extension of complementarity and
    entanglement (C004; E010); the 2007 NT axiom text does derive decline and
    displacement in advance of the 2017–2021 failures (C005; E009); and the
    matrix design was explicitly offered as MPI’s own positive use of evasion
    (C006; E011).

    Attribution is where the hypothesis fails to earn more than weak support.
    The founding excess-correlation counts rest on independence assumptions that
    Flores’s Monte Carlo work showed were violated by high intercorrelation
    among psychological variables; dependence-aware reanalyses substantially
    diminish those results (C009; E007). Parallel conventional
    mechanisms—regression to the mean, analytic flexibility (illustrated live by
    Grote 2017’s significant post-hoc against null preplanned tests),
    publication bias in the broader micro-PK literature (Bösch 2006), and
    documented coding error in a neighboring correlational micro-PK line (Maier
    & Dechamps 2022)—are jointly capable of generating an
    early-positive-then-decline record without anomalous correlation (C008;
    E006, E015, E016, E017). Bierman’s QRP simulation leaves a residual in
    ganzfeld, so “sufficient” is not proven to exhaustion, but for the much
    smaller and statistically dependent matrix corpus the conventional bundle is
    the more parsimonious default. The residual positives (Walach 2020’s fragile
    surplus, three of Flores’s five thesis studies, the 2023 true-RNG arm) are
    real entries in the ledger yet are qualified by author-admitted analytic
    fragility, shared lab context, preprint status, or uneven power; they do not
    outweigh the preregistered and blind nulls.

    Finally, as actually deployed, MPI absorbs both outcomes: positives are
    entanglement, nulls are the predicted decline (C010; E003). That
    interpretive symmetry is already visible in the 2007 design rationale’s
    concession that the paradigm will not convince every sceptic, and it is
    enacted in the 2021 “Nailing Jelly” abstract. A hypothesis that treats its
    own nominated experiment’s failure as confirmation cannot be raised above
    weak support by the same experiment’s occasional success. The net warrant is
    therefore weakly_supported: the descriptive and theoretical claims hold, the
    elusiveness pattern is genuine, but the central attribution to non-local
    psychophysical entanglement is not required by the data once dependence and
    selection are modelled, and the model’s structure blocks decisive
    disconfirmation within the very paradigm it proposes.
  steelman: The 2023 Flores online matrix (E008) found a clear
    experimental–control surplus with an atmospheric-noise true-RNG source (p =
    0.00013) but not with a deterministic Mersenne Twister, and Flores’s thesis
    still reported three of five studies significant after dependence-aware
    methods; no purely selection/QRP/dependence account specifically predicts a
    true-versus-pseudo RNG split, whereas quantum-indeterminacy readings of MPI
    do, and that split plus the residual dependence-aware positives remain the
    strongest unrebutted empirical pointer a proponent can cite.
