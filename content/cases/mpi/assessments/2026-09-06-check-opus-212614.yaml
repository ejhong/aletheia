  synthesis: "The featured hypothesis has three separable parts: a formal
    framework (C004, C006), a derivation from non-signalling to
    decline/displacement (C005), and an attribution of the observed
    correlation-matrix record to real non-local psychophysical correlations
    (C007). The record supports the descriptive parts and leaves the attributive
    part thin. That the framework exists, is published in a physics-foundations
    venue, and that the matrix design was proposed by the theorists themselves
    as the model's own best test, is documented verbatim (MPI-E009, MPI-E010,
    MPI-E011) and is not in dispute. That the decline and displacement
    predictions were in print in 2007, before the 2017–2021 failures, is
    important and correctly credited: these are not retrofits. The empirical
    record, however, runs the other way. The strictest tests are null. Grote
    2021 (200 participants, complete analysis code frozen and unblinded
    publicly) found nothing; Grote 2017's three preplanned analyses were null
    while a post-hoc variant reached p = 0.012 — a live demonstration of the
    flexibility mechanism the conventional account invokes; the proponents' own
    preregistered consensus-protocol replications failed twice, and they
    themselves concluded the paradigm is not replicable. The one large positive
    (Walach 2020) was described a year later by its own authors as fragile and
    non-robust to improved analysis. Flores's dependence-aware work, produced
    inside the program, indicates the founding excess-correlation counts were
    inflated by intercorrelation among psychological variables — attacking the
    origin story at its root. The decisive structural problem is that C005's
    entailment does not go through on its own terms. Non-signalling does not
    imply instability: quantum Bell correlations are strictly non-signalling and
    perfectly reproducible in aggregate statistics. MPI therefore needs an
    additional, unstated premise — that any stable psychophysical correlation
    would be exploitable as a signal — which is asserted rather than derived.
    Without it, the model predicts nothing distinctive about decline, and the
    decline it does observe is equally the signature of regression, selection,
    and analytic freedom. What survives is a real but unexplained residue
    (Flores's 3/5, the RNG-type split), enough to keep the case above
    \"contradicted\" and well below supported."
  steelman: Flores & Rapazote-Flores 2023 found the matrix surplus with an
    atmospheric-noise random source (p = 0.00013, 726 participants) but not with
    a deterministic Mersenne Twister — a source-dependence contrast that no
    regression, publication-bias, or analytic-flexibility account predicts,
    since all conventional mechanisms are indifferent to how the "random"
    numbers were generated. No record here explains why the split fell that way,
    and no equal-power factorial test of it has been run. Separately, the 2007
    strength–reproducibility reciprocity is a distinctive quantitative
    prediction that no replication has ever targeted with a prespecified metric,
    so it stands untested rather than refuted.
