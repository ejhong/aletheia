caseAssessment:
  verdict: weakly_supported
  whatIsClaimed: Psi phenomena are real but are non-local, meaning-dependent correlations between an observer and a physical system — not signals or forces. Because such correlations can never be used to transmit information (the "no-transmission" axiom), any experiment that could turn them into a reliable signal will find them declining, changing sign, or displacing to unmonitored variables. Correlation-matrix experiments, which spread the effect across many variable pairs instead of one outcome channel, are claimed to reveal these correlations as a surplus of significant matrix cells relative to control runs.
  whereDisagreementLives: "Not over whether decline happens — everyone agrees psi effects have never replicated stably. The crux is why. MPI says decline is the lawful signature of a real but unexploitable correlation, and points to matrix experiments where the effect appeared, moved, and faded roughly as the model expects. The conventional account says the initial effects were never real: intercorrelated variables inflated the count of significant cells, flexible analysis and publication bias supplied the early positives, and regression to the mean supplied the decline. Both stories fit a declining effect; they part company over the initial positives and over the fine structure of where effects reappear."
  whatWouldSettleIt: Adversarial, preregistered correlation-matrix replications with blind-analysis protocols, dependence-aware statistics agreed by both sides in advance, and — critically — prespecified quantitative predictions for the decline and displacement structure itself, endorsed by MPI's proponents as binding. Repeated failure of those fine-structure predictions in adequately powered blind tests would strip MPI of its distinctive content; their repeated success under conditions that exclude analytic flexibility would be extraordinary. A stable, exploitable psi signal anywhere would refute the model outright — by its own axiom.
  bestConventionalExplanation: "No anomalous correlation exists. The psychological variables in matrix experiments are highly intercorrelated, so counting \"significant cells\" against an independence assumption overstates the evidence — Monte Carlo and permutation reanalyses shrink the founding results. Early positives are what analytic flexibility, optional stopping, and publication selection produce from null data; decline is regression to the mean; displacement is multiplicity — with enough cells, something is always significant somewhere. Each of these mechanisms is documented inside this very corpus: a coding error behind one celebrated micro-PK effect, a post-hoc contrast rescuing a null study, significance that \"broke down in reasonably improved methods of analysis\" by the replicators' own account. The strongest-designed test — a fully blind analysis of 200 participants — found nothing, exactly as this explanation predicts. Its residue: a few preregistered replications still reported structured excess correlations, and their authors were not naive statisticians."
  components: []
  researchPriority:
    level: medium
    reason: The forward-looking tests are modest in cost — an equal-power true-vs-pseudo-RNG comparison and binding fine-structure predictions (MPI-R001, MPI-R003) — but the paradigm's own proponents concede it does not replicate on demand, capping expected yield.
