  - claimId: MPI-C001
    verdict: established
    reasoning: The historical record unambiguously confirms that Lucadou and
      co-workers published studies reporting a statistically significant surplus
      of psychological-physical correlations in experimental runs compared to
      control runs between 1986 and 2006. This observation claim strictly
      concerns what the authors reported in the literature, which is
      corroborated by subsequent summaries and replication literature. The
      strongest opposing consideration is that the original 1986–1987 datasets
      were largely published in non-peer-reviewed conference proceedings or
      German-language outlets without public data repositories, limiting direct
      archival auditing.
    confidence: high
  - claimId: MPI-C002
    verdict: established
    reasoning: Rigorous methodological replications featuring preregistered
      protocols or blinded analysis software have systematically failed to
      reproduce the correlation-matrix effect. This is demonstrated by the
      proponent team's own preregistered consensus replications, which returned
      entirely null results, as well as independent blind-analysis testing.
      Preplanned analyses in other conceptual replications similarly showed no
      significant effects. The strongest opposing consideration is that Flores
      reported isolated significant permutation analyses, though these were
      exploratory rather than confirmatory.
    confidence: high
  - claimId: MPI-C003
    verdict: established
    reasoning: Across the entire correlation-matrix literature, reported anomalous
      patterns have failed to replicate stably at specific matrix coordinates or
      variable pairings. Studies that initially reported significant matrix
      excesses or hit-rate distributions saw those effects evaporate, weaken, or
      appear only under post-hoc reclassifications in follow-up work. This
      trajectory matches the broad historical pattern of elusiveness and decline
      documented across parapsychology paradigms. The strongest opposing
      consideration is that proponents explicitly theorize this instability as
      the dynamic displacement predicted by Generalized Quantum Theory rather
      than as experimental noise.
    confidence: high
  - claimId: MPI-C004
    verdict: established
    reasoning: Generalized Quantum Theory was formally axiomatized in the
      peer-reviewed physics-foundations literature by Atmanspacher, Römer, and
      Walach, deliberately generalizing complementarity and entanglement beyond
      physical contexts. The Model of Pragmatic Information instantiates this
      broad axiomatic structure for psychophysical systems by adopting pragmatic
      information as the ordering metric. The claim accurately describes what
      the theoretical framework provides and formulates. The strongest opposing
      consideration is that dropping Hilbert spaces and Planck's constant
      renders the framework purely structural, depriving it of quantitative
      predictive derivations.
    confidence: high
  - claimId: MPI-C005
    verdict: established
    reasoning: The Model of Pragmatic Information explicitly derives the necessity
      of decline and displacement from its core no-transmission axiom, published
      well in advance of the decisive modern replication failures. The
      theoretical papers show that because non-local entanglement correlations
      cannot convey causal signals, any protocol attempting to statistically
      corroborate or exploit an anomalous correlation must see that correlation
      vanish, invert, or displace. The claim accurately characterizes the formal
      entailments of the model. The strongest opposing consideration is that in
      practice, the lack of operational boundaries for what constitutes an
      exploitable signal makes this deduction functionally unfalsifiable.
    confidence: high
  - claimId: MPI-C006
    verdict: established
    reasoning: The correlation-matrix methodology was specifically formulated by
      Lucadou and his collaborators as the designated empirical test of MPI. By
      distributing potential interactions across a vast matrix of simultaneous
      psychological and physical variables without a dedicated transmission
      channel, the design was explicitly intended to capture unexploitable
      entanglement while evading the decline effect. The claim correctly states
      the rationale and historical purpose behind the design's construction. The
      strongest opposing consideration is that designing an experiment to seek
      wandering, unreplicable matrix patterns inherently conflates genuine
      non-local evasion with random noise fluctuations.
    confidence: high
  - claimId: MPI-C007
    verdict: contradicted
    reasoning: The empirical record directly contradicts the attribution of the
      correlation-matrix findings to genuine psychophysical entanglement. When
      tested under stringent preregistration, blind analysis, and
      dependence-aware statistics, the anomalous excess correlations disappear
      completely. The early positive results are thoroughly explained by severe
      statistical dependence among variables, post-hoc analytical shifts, and
      small-study publication bias. The strongest opposing consideration is that
      proponents maintain that rigid replication attempts inevitably destroy the
      correlations by violating the no-transmission axiom.
    confidence: high
  - claimId: MPI-C008
    verdict: well_supported
    reasoning: Standard statistical and methodological mechanisms are fully
      sufficient to explain both the historical emergence of matrix anomalies
      and their subsequent disappearance under replication. The high
      intercorrelation among variables heavily inflated Type I error rates,
      analytical flexibility allowed post-hoc positives to be selected, and
      regression to the mean predictably attenuated effects in preregistered
      follow-ups. Related meta-analyses also demonstrate that publication bias
      and research practices account for purported anomalous effects. The
      strongest opposing consideration is Bierman et al.'s finding that
      questionable practices accounted for only 60% of effect size in Ganzfeld
      data, leaving room for unexplained variance.
    confidence: high
  - claimId: MPI-C009
    verdict: provisionally_supported
    reasoning: The program's own registrations and methodological evaluations
      explicitly concede that intercorrelations among psychological variables
      violated assumptions of independence, inflating test variance and
      producing spurious significance in earlier analyses. Furthermore,
      permutation reanalyses conducted in replication theses showed diminished
      matrix surpluses compared to the original Z-difference tests. However,
      this claim remains provisional because Lucadou's founding 1986–2006
      primary raw datasets have never been subjected to a published,
      independent, peer-reviewed reanalysis. The strongest opposing
      consideration is that without reanalyzing the original historical data
      directly, the exact extent of inflation in the founding studies remains an
      extrapolation.
    confidence: moderate
  - claimId: MPI-C010
    verdict: established
    reasoning: In practical deployment, proponents consistently treat positive
      matrix outcomes as evidence for psychophysical entanglement and negative
      outcomes as confirmation of the predicted no-transmission decline. Even
      following definitive failures in preregistered consensus studies, the null
      findings are defended as part of the systematic nature of the phenomena
      rather than evidence against the model. Because no achievable experimental
      result is admitted as disconfirming, the framework operates as an
      unfalsifiable hypothesis. The strongest opposing consideration is that
