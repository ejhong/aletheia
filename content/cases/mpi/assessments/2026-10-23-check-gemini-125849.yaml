  synthesis: "The Model of Pragmatic Information (MPI) presents a theoretically
    sophisticated attempt to ground the chronic unrepeatability of
    parapsychological phenomena within an extended quantum framework. Proponents
    argue that Generalized Quantum Theory rigorously forbids the utilization of
    non-local entanglement correlations for causal signal transmission. Under
    this view, any experimental protocol designed to rigidly isolate, measure,
    and exploit a psychophysical anomaly unavoidably triggers the
    no-transmission constraint, manifesting empirically as a decline, sign
    change, or spatial displacement across the measurement matrix. The
    correlation-matrix method was designed precisely to detect these transitory,
    evasive non-local correlations without forcing a deterministic signal
    channel. Proponents emphasize that this decline prediction was articulated
    in formal print long before modern replication failures, and point to
    occasional positive signals, such as exploratory permutation results and
    differential performance across true versus pseudo-random sources, as
    evidence that something beyond mere noise is occurring. Conversely, the
    conventional statistical explanation demonstrates that the entire
    correlation-matrix corpus is fully explained by standard methodological
    artifacts without invoking anomalous physics. The foundation of the paradigm
    rests on serious statistical violations: psychological variables within the
    matrix share extensive intercorrelations, violating the fundamental
    assumption of independent observations and inflating false-positive rates by
    expanding test variance. When modern, preregistered consensus protocols and
    pre-analysis blind software execution are implemented—as in Walach et al.
    (2021) and Grote (2021)—the purported excess correlations vanish entirely.
    Subsequent reported positives exhibit severe methodological defects,
    including single-subject experimenter designs, unprespecified permutation
    switches, and unit-of-analysis errors that treat thousands of collinear
    matrix cells as independent samples. When combined with ubiquitous
    small-study publication bias and documented software errors in related
    literature, regression to the mean completely accounts for the observed
    decline arc. As deployed, MPI functions as an epistemically sealed construct
    where null replications are dialectically converted into theoretical
    vindication. Regarding sensitivity, the single evidence record whose removal
    would most challenge this negative evaluation is Grote (2021, MPI-E004),
    which constitutes the only fully blind-analyzed, preregistered, independent
    test in the corpus. If MPI-E004 were removed, the case verdict would
    decisively survive based on Walach et al.'s (2021, MPI-E003) preregistered
    consensus failure, the acknowledged failure of matrix cell independence
    (MPI-E020), and extensive evidence of publication bias and selective
    reporting (MPI-E006, MPI-E015)."
  steelman: Generalized Quantum Theory's specific derivation of reciprocity
    between initial effect size and decline rate (Lucadou et al. 2007) has never
