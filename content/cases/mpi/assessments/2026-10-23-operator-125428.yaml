caseAssessment:
  verdict: weakly_supported
  whatIsClaimed: "Psi effects are real but are correlations, not signals: meaning-bound links between a person and a physical system that, like quantum entanglement, can never carry a message. So any experiment able to exploit them must see them fade, flip, or move elsewhere. The correlation-matrix experiment, which spreads the effect across thousands of variable pairs, is the model's own test, and should show a surplus of significant cells over control runs."
  whereDisagreementLives: "Not over whether the effects fade, which everyone accepts, but over why. MPI says fading is the lawful signature of a real correlation that cannot be pinned down. The conventional account says there was never anything to fade: dependent variables inflated the cell counts, flexible analysis and selective publication supplied the early positives, and regression to the mean supplied the decline. They part over the early positives and the fine structure of where effects reappear."
  whatWouldSettleIt: An adversarial matrix replication, analysed blind, with dependence-respecting statistics and quantitative decline and displacement predictions agreed in advance as binding on the model. Repeated failure of those predictions would strip MPI of its distinctive content; their success under such controls would be extraordinary. An equal-power comparison of true and pseudo-random sources, seeded independently of the participant, would test the one forward-looking split the record hints at. Any stable, exploitable psi signal would refute the model by its own axiom.
  bestConventionalExplanation: "No anomalous correlation exists. Matrix cells are not independent: the program's own 2016 registration says so and warns that this makes results look more significant than they are. Counting significant cells against an independence assumption therefore overstates the evidence. Early positives are what flexible analysis, optional choices of method and selective publication produce from null data. Decline is regression to the mean. Displacement is multiplicity: with thousands of cells, something is always significant somewhere. Each mechanism is documented inside this corpus: a coding error behind one micro-PK effect, a post-hoc contrast rescuing a null study, significance that broke down under improved analysis by the replicators' own account. The newest positive treats 4,096 dependent cells as independent samples. The strictest test, a fully blind analysis of 200 participants, found nothing. Its residue: a few reported positives that have not been shown to be artifacts, from researchers who published their own failures."
