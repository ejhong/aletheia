  synthesis: |-
    The verdict stays weakly supported, now at the low edge of that grade: reading the newest positives in full thinned the residue it rested on. The ladder is unchanged in shape. The theory and its own test are documented in the theorists' words (MPI-E009, MPI-E011), and the decline prediction is in print before the strict replications. But regression to the mean predicts the same curve, so the prediction earns integrity, not discrimination. The strictest tests are null: the proponents' consensus-protocol replications (MPI-E003) and Grote's blind analysis (MPI-E004), whose source split was null in both arms (MPI-E024).

    This pass read the Flores thesis and the 2023 online preprint in full, and both weigh less for the anomaly than the case had said. The thesis's three positives rest on a permutation analysis whose methods its exploratory registrations did not specify (MPI-E018). The registered analysis is one the author says overestimates (MPI-E007). One positive study had the researcher as its only participant (MPI-E019). The two studies that added a second generator did not confirm the prediction. The preprint's split between true and pseudo-random sources is weaker than reported: the pseudo-random arm was seeded from participants' own swipe timing (MPI-E021), it was significant under the paper's averaged analysis (MPI-E022), and no test of the difference between arms is reported. Its cells are tested as independent samples, an inference from the stated methods (MPI-E023). Against that, the dependence problem is now documented from a primary, pre-data source: the program's own 2016 registration (MPI-E020).

    What keeps the verdict off unresolved: reported positives exist that no one has shown to be artifacts (MPI-E002, MPI-E007 Studies 1–2, MPI-E008), and the conventional account has not been shown quantitatively to reproduce this corpus. A published permutation reanalysis of the founding and 2020 datasets would move it either way.
  steelman: "MPI's best case is that it alone predicted this record before it existed. In 2007, before the consortium's replications and Grote's blind test, its theorists wrote that replication attempts would wipe out the effect, faster where it had been stronger, and that correlations would reappear in other observables. The nulls then arrived on schedule, and positives kept surfacing in odd places. They came in a two-lab replication evaluated against ten thousand simulated experiments, in a doctoral thesis at Edinburgh's Koestler Unit, and in a 726-participant online study whose true-random arm cleared every threshold its authors set. The conventional account has never shown, with numbers, that dependence, flexibility and selection reproduce this particular corpus; it asserts that they could. And the model's insulation is not total: it forbids any stable psi channel anywhere, and it nominated a positive signature that could have failed from the first experiment. On this view the case is judged against a standard, stable replication, that the theory said in advance nature would refuse."
claimAssessments:
  - claimId: MPI-C001
    verdict: provisionally_supported
    reasoning: That the founding reports exist and say what they say is well documented. Whether the reported surpluses were computed against valid null distributions is what the dependence critique contests. The program's own 2016 registration states that the cells are not independent and that this makes outcomes look more significant (MPI-E020). The raw founding data remain unpublished, so the surpluses have never been recomputed under a permutation analysis.
    confidence: moderate
    treatment:
      plainLanguage: In the founding experiments, participants pressed keys trying to "influence" a random event generator. Nobody scored hits in the ordinary sense. Instead, the experimenters counted how many correlations between behaviour variables and machine variables came out statistically significant, and reported far more of them than control runs gave.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: If the surpluses are statistically sound, something needs explaining, though the something could still be analytic artifact. If they are unsound, the program's foundation shifts entirely to the later, stricter replications.
      strongestObjection: The founding analyses counted significant cells against an independence assumption the data violate. The program's own later registration says so, and the replications that switched to permutation analysis report lower counts than the original method gave.
      whatWouldChangeOurMind:
        - A permutation reanalysis of the original 1986–2006 datasets, in either direction.
        - Publication or archiving of the original raw data, which would make that reanalysis possible.
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: "The strictest tests are unambiguous: Grote's 200-participant blind analysis fell \"well within the expected random distribution\" (and was null in both random-source arms), and the proponents' own two consensus-protocol replications were null. The positives that remain (Walach 2020, which was not preregistered; Flores's studies, registered as exploratory with the permutation method unspecified) sit outside the preregistered confirmatory set the claim describes."
    confidence: high
    treatment:
      plainLanguage: When the matrix experiment was rerun under the strictest modern rules, the effect mostly disappeared. Those rules included analysis plans frozen in advance, and in one case the entire analysis software written and tested before anyone looked at the data.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "This is the case's central twist: a null replication record undermines the anomaly reading and at the same time matches MPI's own decline prediction. By itself it cannot separate the hypotheses, which is why the falsifiability crux (MPI-C010) exists."
      strongestObjection: '"Predominantly" hides how few strict tests there are: a handful of null studies, two of them run on the same equipment under one consortium protocol, one at 0.69 power, and one with twenty participants. So few strict nulls do not show the effect is absent, only that it does not appear on demand.'
      whatWouldChangeOurMind:
        - Further adversarial blind-analysis replications, in either direction.
        - A significant result under a Grote-style full blind-analysis protocol would break the pattern that the strictest tests are null.
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "Accurate as a sequence of published outcomes: Lucadou's positives; Walach 2020's effect, described by its authors a year later as \"significant but fragile\"; Grote's 2015 positive, then his 2017 and 2021 nulls; the consensus-protocol failures; and Flores's positives in her first three studies but not the last two. What \"decline\" presumes, that there was ever a real effect to decline, is not part of this claim."
    confidence: moderate
    treatment:
      plainLanguage: "Across four decades the matrix effect has behaved like a bar of wet soap: strong in early reports, weaker or absent in stricter reruns, and when something did show up later, it tended to show up somewhere else: different cells, different analyses, different variables."
      importance: major
      diagnosticity: low
      diagnosticitySummary: Regression to the mean produces exactly this trajectory from null data filtered by publication. The pattern sits equally well in both rival explanations, which is what makes the attribution rung necessary.
      strongestObjection: '"Decline and displacement" is a narrative laid over a small, varied set of studies with different designs, power and analyses. No prespecified measure of decline has ever been defined and then measured across the series.'
      whatWouldChangeOurMind:
        - A quantitative, prespecified decline and displacement measure applied across the full corpus.
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: "The framework is published in a serious foundations venue and is internally coherent as far as it has been reviewed. Its cost is lost power: without Hilbert-space structure it assigns no probabilities to outcomes, so it constrains data only qualitatively."
    confidence: moderate
    treatment:
      plainLanguage: The model is not hand-waving about "quantum consciousness". A published axiomatic framework keeps the algebraic structure of quantum theory (observables that do not commute, entanglement between parts of a system) while dropping its physical constants, and MPI is a special case of it. Whether that formalism describes reality is a separate question from whether it exists and is coherent.
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A coherent formalism shows the model is available, not that it is true. Its main evidential role is to make MPI's predictions derivable rather than improvised.
      strongestObjection: By discarding the quantitative machinery, the generalized theory keeps quantum vocabulary while giving up nearly all of its predictive risk. No derivation says how large any effect should be, or when.
      whatWouldChangeOurMind:
        - A derivation in the generalized theory yielding quantitative, parameter-fixed predictions for a matrix experiment.
        - A demonstrated internal inconsistency in the axiom system.
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: 'As a statement of what the model says, this is verbatim in the 2007 paper, which also derives the corollaries: decline that is faster when the original effect was stronger, sign reversal, and reappearance "in different observables and/or between different parts of the system." Whether the axiom is true of nature is the attribution question, not this claim.'
    confidence: high
    treatment:
      plainLanguage: The model's core rule is that these correlations can never be used to send a message. A perfectly replicable psi experiment would be a message channel, so the model says perfect replication cannot happen, and it published this before the stricter replications were run. The decline effect, usually psi research's embarrassment, becomes a theorem.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: "This is what distinguishes MPI from both conventional scepticism and conventional psi advocacy: it predicted, in print and in advance, that stricter protocols would show weaker effects. The prediction is real; the trouble is that the null hypothesis makes the same one (MPI-C008)."
      strongestObjection: 'A prediction shared with the null hypothesis earns no credit: regression to the mean also "predicts" weaker effects in stricter, larger replications. The distinctive content, displacement structure and the strength–reproducibility reciprocity, has never been tested against a prespecified measure.'
      whatWouldChangeOurMind:
        - A prespecified test of the model's distinctive fine structure (displacement patterns, decline-rate reciprocity) succeeding or failing.
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: Documented as the design's stated rationale in the theorists' own words. The matrix experiments are therefore not an arbitrary paradigm but the model's self-nominated benchmark, so their replication record is the primary evidence for and against it.
    confidence: high
    treatment:
      plainLanguage: Lucadou did not just explain away failed replications; he designed an experiment his theory says should work anyway. If no single number counts as "the result", no signal can be coded, so the no-transmission rule is respected and the correlations may appear as a surplus of significant cells scattered through a matrix.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: It cuts both ways. It makes the matrix record binding on MPI in a way generic psi results are not, and it means the blind-analysis failures land on the model's own chosen ground.
      strongestObjection: A design that predicts "transitory, jumping, unexpected" patterns in a large matrix describes what multiple testing produces from pure noise. It turns the multiplicity problem into the predicted signature, which is why dependence-respecting statistics are decisive here.
      whatWouldChangeOurMind:
        - Proponent agreement on a dependence-respecting standard for what counts as a matrix "hit".
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: "Some reported positives remain (Walach 2020; Flores's first two studies; the true-random arm of the 2023 online study), and the proponents publish their failures. But each positive now carries a documented limitation: fragility by its authors' own account, a permutation method unspecified in exploratory registrations, a seed tied to participant behaviour, cells tested as independent samples. The strictest test was null, and every conventional mechanism the rival needs is documented in this corpus. The thesis survives only where the strict tests have not reached."
    confidence: low
    treatment:
      plainLanguage: "The featured thesis: the matrix experiments really did catch something, a real connection between minds and machines that by its nature cannot be pinned down, and the fading, shifting record is that something behaving as the theory says it must."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself. Everything below it on the ladder exists to test it against MPI-C008.
      strongestObjection: "As deployed, the explanation cannot lose: successes confirm the correlations and failures confirm the elusiveness. Meanwhile the conventional account explains the same record with mechanisms already caught operating in it, including in the newest positive."
      whatWouldChangeOurMind:
        - Success or failure of prespecified displacement-structure predictions in adversarial replications.
        - A permutation reanalysis of the founding and 2020 datasets restoring or eliminating the original surpluses.
        - A blind, equal-power comparison of true and independently seeded pseudo-random sources.
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each component mechanism is documented in or near this corpus: dependence among cells (stated in the program's own 2016 registration), analytic flexibility (Grote 2017's post-hoc-only significance), error-driven false positives (Maier and Dechamps), and publication-bias sensitivity (Bösch 2006). What keeps it short of well supported: no one has shown quantitatively that these mechanisms reproduce this specific record. The nearest calibrated simulation, on ganzfeld data, explained about 60% of that effect, not all of it."
    confidence: moderate
    treatment:
      plainLanguage: 'The conventional steelman: nothing was ever there. Dependent variables made "significant cells" cheap, flexible analysis and selective publication made early positives likely, and when protocols tightened, results regressed to the nothing they came from. Every one of those mechanisms has been caught operating somewhere in this literature.'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: The direct rival to MPI-C007. If it holds, MPI's central evidence dissolves; if it can be shown insufficient under adversarial conditions, what remains is genuinely anomalous.
      strongestObjection: "\"Jointly sufficient\" is asserted, not demonstrated. Walach 2020 was evaluated against ten thousand simulated experiments and still reported a surplus. Flores's first two studies were significant under permutation analysis, and the 2023 true-random arm cleared every threshold its authors set. None has been shown to be an artifact."
      whatWouldChangeOurMind:
        - A dependence and selection simulation calibrated to the actual matrix corpus, reproducing or failing to reproduce its published record.
        - A significant matrix result under full blind analysis, which this explanation predicts should not occur.
  - claimId: MPI-C009
    verdict: provisionally_supported
    reasoning: "The first half is now documented from a primary, pre-data source: the program's own 2016 registration states that the cells are not independent and that this makes outcomes appear more significant (MPI-E020). Flores reports that the permutation analysis lowered her counts compared with the original method. The second half, that a dependence-respecting reanalysis substantially diminishes the founding results, rests on the successor preprint's summary; no such reanalysis of Lucadou's data has been published."
    confidence: moderate
    treatment:
      plainLanguage: 'The sharpest technical objection: counting significant cells only means something if the cells are independent. The behaviour variables in these matrices correlate with one another, so "significant" cells arrive in bundles. Analyses that respect this report fewer of them.'
      importance: major
      diagnosticity: high
      diagnosticitySummary: Directly attacks the load-bearing statistic of the founding experiments (MPI-C001). If it holds in full, the program's origin story weakens from "anomaly detected" to "artifact detected".
      strongestObjection: Flores still reports her first three studies significant under permutation analysis, so the critique shrinks results without, on the record so far, zeroing them out. And the founding data have never been reanalysed, so "substantially diminish" is not yet measured.
      whatWouldChangeOurMind:
        - An independent, published permutation reanalysis of the 1986–2020 matrix datasets.
  - claimId: MPI-C010
    verdict: mixed
    reasoning: "The pattern is real and quotable: the proponents' response to their own consensus-protocol failures was that failure is \"likely part of the systematic nature of such effects.\" But the charge is not airtight. The model exposes itself at the aggregate level (a stable, exploitable psi signal anywhere would refute it), it nominated the matrix design as a positive prediction that could have failed from the start, and the 2021 authors concluded the paradigm is \"not replicable\", which is a concession, not an evasion."
    confidence: moderate
    treatment:
      plainLanguage: "The falsifiability tension, stated as a claim about scientific practice: if heads confirms the theory and tails confirms it too, the theory has stopped taking risks. The live question is whether MPI's proponents have ever specified an outcome they would accept as a refutation, and whether the model's structure permits one."
      importance: major
      diagnosticity: high
      diagnosticitySummary: This crux decides how much the replication record can ever mean. If MPI has no bindable predictions, the case ends in philosophy; if its fine structure can be prespecified and tested, the case returns to the laboratory.
      strongestObjection: MPI is falsifiable in principle and partly in practice. Its axiom forbids any stable psi channel, a risky universal claim; the matrix surplus was a positive prediction; and specific corollaries could be prespecified and tested tomorrow. The insulation is a habit of interpretation, not a theorem of the model.
      whatWouldChangeOurMind:
        - Proponents publishing binding disconfirmation criteria, or explicitly declining to.
        - A prespecified fine-structure test whose outcome proponents accept as evidence either way.
