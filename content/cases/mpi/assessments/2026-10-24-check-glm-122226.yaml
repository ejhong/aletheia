  synthesis: "The case separates cleanly into rungs, and the verdict is mixed
    because the rungs do not reinforce each other. The observation rung is
    solid: the founding experiments reported excess correlations (MPI-C001), the
    strictest preregistered and blind replications — including the proponents'
    own \"Nailing Jelly\" study on the model's own nominated paradigm — failed
    (MPI-C002), and the decline/displacement pattern is real as a description of
    the record (MPI-C003). The mechanism rung establishes that MPI genuinely
    predicted this pattern in advance: the no-transmission axiom and the
    decline, sign-change, and displacement consequences are in print from 2007
    (and the model from 1995), and the correlation-matrix design was explicitly
    constructed as the model's own test (MPI-C005, MPI-C006). That is more than
    most psi hypotheses can claim — the prediction was not retrofitted to the
    2017–2021 failures. But predictive success here is weak confirmation,
    because the conventional account predicts the same record: regression to the
    mean, analytic flexibility (live in Grote 2017's post-hoc variant),
    publication bias on the Bösch base rate, a documented coding-error failure
    mode, and — most decisively — statistical dependence among matrix variables,
    whose dependence-aware reanalysis substantially diminishes the founding
    results (MPI-C009). The two attempts to give decline a quantitative
    signature that chance cannot produce both failed: the preregistered
    dampened-oscillation prediction did not beat 10,000 simulations (MPI-C504),
    and the one post-hoc oscillation result falls within permuted data (Grote
    2018). Meanwhile the attribution claim (MPI-C007) rests on evidence that is
    fragile by its own proponents' description, non-independent, or unreviewed,
    and the model's deployment absorbs every null as confirmation (MPI-C010) — a
    structural problem documented by both sides in the 2005 Lucadou–Guiard
    exchange. Net: the featured hypothesis survives as a formally coherent,
    advance-stated prediction of a real pattern, but the evidence currently
    favors the conventional explanation of that pattern, and the model's own
    nominated experiments cannot, as deployed, break the tie. Sensitivity: the
    single record whose removal would most change this verdict is MPI-E007
    (Flores 2021), the only source of positive results that survive
    dependence-aware analysis inside the program; without it, MPI-C007 would
    move toward contradicted and the case's \"mixed\" verdict would lose its
    strongest evidential leg on the pro side, though the observation rung and
    the failed fine-structure tests would still stand."
  steelman: "The Flores & Rapazote-Flores 2023 split: the same online protocol
    with 726 participants and ~10,900 sessions produced a significant
    excess-correlation result with a true atmospheric-noise source (p = 0.00013,
    power 94%) but not with the deterministic Mersenne Twister (p = 0.070). That
    is exactly the source-dependence an entanglement account requires and that
    no conventional mechanism named in this file — regression to the mean, QRPs,
    publication bias, variable intercorrelation — predicts, since none of them
    cares whether the physical randomness is quantum-grade. Combined with
    Flores's three significant studies under her own dependence-aware
    permutation methods, a proponent can rightly say the record contains
    positives that survive the best statistical critique and discriminate on a
    physical parameter the conventional account treats as irrelevant."
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: Two independent records (Lucadou's 2006 report and the successor
      team's summary in Walach et al. 2021) agree that the 1986–2006 series
      reported more significant correlations than chance or control matrices.
      The claim is descriptive of what was reported, and on that reading it
      stands. The strongest opposing consideration is that the underlying
      analyses predate the dependence critique (MPI-C009), the full texts were
      not examined for this import, and no raw data exist for reanalysis — so
      the truth of the reports does not certify the truth of the effect.
    confidence: moderate
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: "Three independent strict tests all failed: the proponents' own two
      preregistered consensus-protocol replications (\"neither of the two
      experiments was significant\"), Grote's fully blind 200-participant
      analysis, and Grote 2017's three preplanned nulls with a significant
      result appearing only post hoc. The strongest opposing consideration is
      that one replication arm was powered at 0.69 and that under MPI a failed
      replication is expected rather than informative — but the claim concerns
      what the replications found, not what it implies, and on that they
      converge."
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "The decline arc is documented study by study (Grote 2015 significant
      → 2017 null preplanned → 2021 blind null), in the proponents' own two-lab
      series (2020 significant but \"fragile\" → 2021 failed replications), and
      field-wide by Kennedy's review. The strongest opposing consideration is
      that part of the \"displacement\" appearance is a statistical artifact:
      Grote 2018 shows cumulative z-score oscillations necessarily dampen as
      data accumulate, and analytic flexibility can make effects seem to
      migrate. The pattern is real as a record; its cause is the contested
      part."
    confidence: moderate
  - claimId: MPI-C004
    verdict: well_supported
    reasoning: GQT is published in a physics-foundations venue (Foundations of
      Physics, 2002) and the 2007 JCS paper instantiates MPI within it, so the
      formalism's existence and content are not in doubt. The strongest opposing
      consideration, noted in the evidence record itself, is that the framework
      drops the quantitative machinery (Hilbert space, Planck's constant) that
      gives quantum theory predictive force, so "formally explicit" does not
      mean quantitatively predictive — GQT cannot say how large a matrix surplus
      should be.
    confidence: moderate
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: "The evidence record quotes the 2007 text verbatim: the
      no-transmission axiom is stated, and the decline, sign-change, and
      displacement consequences are derived from it in print, including the
      distinctive strength–reproducibility reciprocity. The claim is about what
      the axiom entails and that the entailment preceded the recent failures,
      and both are documented. The strongest opposing consideration is that a
      theory paper evidences what the model predicts, not that the prediction is
      true — this claim should not be read as empirical support for MPI."
    confidence: high
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: The 2007 text explicitly proposes the matrix design as the way to
      "make positive use of the evasion phenomenon," registering many
      correlations so effects appear as transitory patterns, while conceding the
      decline can never be fully overcome. The design rationale is thus
      documented in the theorists' own words, binding MPI to the matrix record
      as its nominated test. The strongest opposing consideration is that this
      is a methodological intention, not a demonstration that the design can in
      fact separate entanglement correlations from noise.
    confidence: high
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: The positive case rests on Walach 2020 (described by its own authors
      a year later as significant but fragile under improved analysis), Flores's
      three significant studies within a single thesis project sharing equipment
      and personnel, and an unreviewed 2023 preprint with an uneven power split.
      Against it, the founding results that C007 attributes to genuine
      correlations are the very results the dependence-aware reanalyses
      diminished (MPI-C009), and the strictest independent test (Grote 2021) is
      null. The strongest opposing consideration is that under MPI the failed
      replications are the prediction, so they cannot directly refute the
      attribution — but that same move leaves the claim supported only by
      fragile, non-independent positives.
    confidence: low
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each component is evidenced: Bösch's 380-study meta-analysis
      implicates publication bias, Grote 2017 demonstrates analytic flexibility
      conjuring significance from null data, Maier & Dechamps document a coding
      error manufacturing an effect, and the dependence critique covers the
      founding statistics. The strongest opposing consideration is Bierman 2016,
      which found QRPs explain only about 60% of a neighboring database's effect
      at empirically observed frequencies — sufficiency has not been
      demonstrated for the matrix record specifically, and Flores's surviving
      positives are not explained by these mechanisms."
    confidence: moderate
  - claimId: MPI-C009
    verdict: well_supported
    reasoning: "The claim is directly attested: Flores's Monte Carlo work found high
      intercorrelations among psychological variables, and the 2023 preprint
      states that when simulations were incorporated, the earlier results
      diminished. The strongest opposing consideration is provenance — the
      finding lives in a doctoral thesis and an unreviewed preprint rather than
      a standalone peer-reviewed reanalysis of the founding datasets, and the
      founding raw data have not been independently reanalyzed; the research
      agenda (MPI-R002) correctly flags this as decisive unfinished work."
    confidence: moderate
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: "The insulation is documented on three sides: the proponents' own
      failed replications are read as \"likely part of the systematic nature of
      such effects,\" Maier and Dechamps state that real nulls cannot be
      distinguished from decline under the model, and Guiard pressed the
      self-immunization charge to Lucadou's face in 2005, noting no criterion
      separates a PK process from chance. The strongest opposing consideration
      is MPI-E023: Lucadou does name a refuting outcome (reliable signal
      transmission), so the model is not strictly unfalsifiable — but he
      pre-assigns any such outcome to a sensory leak, and the named refutation
      is not an outcome of the matrix experiments the claim is scoped to."
    confidence: moderate
  - claimId: MPI-C504
    verdict: well_supported
    reasoning: "The preregistered test is documented with exact numbers: none of the
      three preregistered statistics beat 10,000 simulations (best p ≈ 0.053 on
      the end point), and the authors say so themselves. The strongest opposing
      consideration is scope and the authors' own qualification: the oscillation
      extension was proposed by the Munich group, not endorsed by MPI's
      theorists, the authors attribute the null partly to a prediction too
      undistinctive to separate chance, and their post hoc trajectory measures
      (MPI-E019) reportedly do distinguish the data — though those were chosen
      after the preregistered tests failed, which is itself the analytic
      flexibility pattern MPI-C008 warns of."
