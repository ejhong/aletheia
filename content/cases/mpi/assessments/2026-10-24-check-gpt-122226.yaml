  synthesis: >-
    The featured hypothesis combines three propositions that must not be
    conflated: excess psychophysical correlations exist, their instability
    follows from MPI's no-transmission principle, and the observed research
    record is produced by those correlations rather than ordinary statistical
    processes. The evidence establishes that MPI and its matrix design really
    were formulated to predict decline and displacement. MPI-E009 and MPI-E011
    therefore prevent dismissal of every later failure as a wholly post hoc
    invention. The literature also contains positive observations: the founding
    program reported excess correlations, MPI-E002 describes a significant but
    fragile modern result, MPI-E007 reports significance in three of five
    related studies after improved methods, and MPI-E008 reports a large online
    true-random-source result absent with a pseudo-random generator. This is the
    strongest proponent case: an advance theory of elusiveness is followed by
    the instability it predicts, with intermittent residual positives.

    That case fails at the attribution step. The strongest controlled tests
    predominantly return null results. MPI-E003 contains two preregistered
    consensus-protocol failures conducted by a proponent-led team, while
    MPI-E004 reports that an independent 200-participant blind analysis fell
    within its random distribution. MPI-E006 similarly produced null results on
    all three preplanned analyses but a significant result only after changing
    the analysis post hoc. Meanwhile, MPI-E007 and the evidence summarized for
    MPI-C009 identify intercorrelation among psychological variables as a source
    of inflated significance in the founding analyses. The original raw data are
    unavailable for the decisive dependence-aware audit. Thus the record does
    not demonstrate that a genuine anomaly was present and then declined; it is
    at least as expected if selected early positives regress toward null under
    stronger controls.

    The conventional steelman is correspondingly strong. Dependence, analytic
    flexibility, publication selection, and documented coding mistakes are not
    generic accusations here: the ledger contains examples or analyses of each
    relevant failure mode. However, MPI-C008's claim of complete joint
    sufficiency remains somewhat stronger than the direct evidence because no
    single dependence-aware model reconstructs every matrix result, and the
    surviving Flores and online positives remain incompletely explained. The
    conclusion therefore does not require treating the conventional account as
    proven in every detail. It rests on the failure of the affirmative non-local
    attribution to survive the best discriminating tests.

    Attempts to turn decline into quantitative fine structure have also failed
    so far. MPI-E018 reports that none of three preregistered trajectory
    statistics beat 10,000 random simulations, while MPI-E021 shows that a
    separate post hoc oscillation fell within permutation results. These tests
    concern extensions rather than MPI's unsystematic core, but that limitation
    exposes the central problem: broad decline or migration can absorb both
    positive and null outcomes without assigning a sufficiently specific
    likelihood to either. MPI-E003, MPI-E022, and MPI-E024 document this
    practice and critique; MPI-E023 names reliable signaling as a formal refuter
    but simultaneously assigns such a result to leakage and does not supply a
    binding matrix-experiment criterion.

    On the supplied evidence, the hypothesis that genuine MPI-type correlations
    produce the record is contradicted, although not deductively disproved: its
    residual, non-quantitative core is protected from decisive testing rather
    than positively established. The single evidence record whose removal would
    most change this verdict is MPI-E003 because it combines two preregistered
    failures with proponents' explicit reinterpretation of those failures as
    systematic. The verdict survives its removal: MPI-E004's blind null,
    MPI-E006's preplanned-null/post-hoc-positive contrast, the dependence
    critique, and the failed quantitative trajectory tests still favor ordinary
    noise and selection over the featured attribution.
  steelman: The 726-participant online experiment reported a significant
    experimental–control difference with an atmospheric-noise random source but
    not with a deterministic pseudo-random generator. No equal-powered,
    preregistered factorial replication in the ledger determines whether that
    source-specific split is reproducible, leaving a concrete observation that
    an MPI proponent can rightly demand be tested.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: MPI-E001 documents that Lucadou's original program reported more
      significant psychological–physical correlations in experimental than
      control matrices, and MPI-E002 confirms that the same positive-result
      narrative continued into the modern program. Because the claim concerns
      what was reported rather than whether the reported significance was valid,
      the later dependence critique does not erase it. The strongest opposing
