    confidence: moderate
  - claimId: MPI-C504
    verdict: established
    reasoning: "MPI-E018 reports 203 new participants and three preregistered
      comparisons against 10,000 simulated datasets, with none reaching
      significance: 18.71%, 19.42%, and 5.28% of simulations were closer to the
      prediction on the respective statistics. This directly establishes the
      claim as stated. The strongest opposing consideration is MPI-E019's report
      that post hoc trajectory measures distinguished experimental from
      simulated data, but those measures do not alter the failure of the three
      preregistered tests and require prospective replication."
    confidence: high
