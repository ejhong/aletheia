      original full text and raw data were not examined, and dependence may have
      invalidated the reported significance.
    confidence: moderate
  - claimId: MPI-C002
    verdict: established
    reasoning: MPI-E003 reports two preregistered consensus-protocol failures,
      MPI-E004 reports a 200-participant blind-analysis null, and MPI-E006
      reports null results on all three preplanned analyses. Together these
      directly establish that strict replications have predominantly failed to
      reproduce the excess-correlation effect. The strongest opposing
      consideration is the partial positive record in MPI-E007 and the limited
      power of one experiment in MPI-E003, neither of which reverses the
      predominance among preregistered and blind tests.
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: The significant 2020 result followed by the two failures in MPI-E003,
      and Grote's progression from MPI-E005 through MPI-E006 and MPI-E004,
