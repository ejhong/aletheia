      strongest opposing consideration is that the supplied records document
      weakening more clearly than specific sign changes or migrations between
      named matrix cells, so every listed form of instability is not equally
      well demonstrated.
    confidence: high
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: MPI-E010 establishes that Generalized or Weak Quantum Theory is an
      explicit axiomatic framework extending complementarity and entanglement to
      arbitrary systems while dropping standard quantum theory's Hilbert-space
      structure and Planck's constant. The MPI theory records show that this
      framework is applied to psychophysical correlations, but the supplied
      evidence gives less direct detail about pragmatic information as the
      precise ordering quantity. The strongest opposing consideration is that
      the framework lacks quantitative probability machinery, so formal
      explicitness should not be mistaken for a predictive physical mechanism.
    confidence: moderate
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: MPI-E009 directly states the no-transmission axiom and derives
      decline, faster decline for stronger effects, sign reversal,
      disappearance, and migration to other observables. Its 2007 publication
      predates the principal 2017–2021 replication failures in this ledger,
      establishing that those qualitative possibilities were in print
      beforehand. The strongest opposing consideration is that the derivation
      supplies no operational threshold for exploitability or quantitative
      distribution over the many permitted outcomes.
    confidence: high
  - claimId: MPI-C006
    verdict: established
    reasoning: "MPI-E011 explicitly states that the matrix design registers many
      correlations simultaneously so that transitory and displaced effects can
      appear without creating a stable signal. This directly establishes the
      design's stated rationale and its status as the model's proposed response
      to decline. The strongest opposing consideration is methodological rather
      than historical: the same many-channel design creates multiplicity and
      dependence problems that can make unexpected patterns difficult to
      distinguish from chance."
    confidence: high
  - claimId: MPI-C007
    verdict: contradicted
    reasoning: "The strongest controlled evidence does not support the claimed
      non-local attribution: MPI-E003 reports two preregistered failures,
      MPI-E004 a blind-analysis null, and the dependence findings in MPI-E007
      substantially weaken the founding significance calculations. MPI-E006 also
      shows how a positive can emerge post hoc from data whose preplanned
      analyses were null, while related prospective trajectory tests in MPI-E018
      and MPI-E021 failed to distinguish the proposed patterns from chance. The
      strongest opposing consideration is the combination of MPI-E002's fragile
      positive, MPI-E007's three significant studies out of five, and MPI-E008's
      true-random-source positive result. The verdict also uses the general
      scientific prior that an extraordinary non-local causal attribution
      requires evidence discriminating it from statistical artifacts; the
      records do not supply that discrimination."
    confidence: moderate
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "The records supply concrete components of the conventional account:
      MPI-E006 demonstrates analytic flexibility within one dataset, MPI-E007
      identifies dependence-driven inflation, MPI-E015 finds publication-bias
      signatures in the neighboring REG literature, and MPI-E017 documents a
      coding error that generated a false positive. The later strict nulls are
      also consistent with regression of selected early positives toward chance.
      The strongest opposing consideration is that no evidence record jointly
      models the complete correlation-matrix corpus, while MPI-E007 retains
      three significant studies and MPI-E008 retains an unexplained source
      split. Parsimony and ordinary statistical priors favor the conventional
      account, but those priors supplement rather than replace a still-missing
      comprehensive reconstruction."
    confidence: moderate
  - claimId: MPI-C009
    verdict: well_supported
    reasoning: MPI-E007 directly reports high intercorrelations among psychological
      variables and Monte Carlo analyses showing that these inflated the
      original significance, with diminished results after dependence-aware
      treatment. This supports both the methodological diagnosis and its
      material impact on the founding evidence. The strongest opposing
