    confidence: moderate
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: MPI-E003 shows proponents interpreting preregistered failures as part
      of the effects' systematic nature, and MPI-E022 states that genuine nulls
      cannot be distinguished from MPI decline under ordinary replication.
      MPI-E024 identifies the absence of a precise matrix criterion separating a
