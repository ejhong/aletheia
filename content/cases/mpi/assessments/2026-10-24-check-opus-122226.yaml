  synthesis: >-
    The ledger separates observation, mechanism and attribution, and the verdict
    depends on keeping them apart.

    The observation rung is solid. The 1986–2006 experiments did report an
    excess of significant psychophysical correlations (MPI-C001). Every
    preregistered or blind-analysis matrix replication in the record is null on
    its primary analysis (MPI-C002): two by the proponents' own team under a
    frozen consensus protocol (E003), one independent and fully blinded with 200
    participants (E004), plus Grote's preplanned analyses (E006). And effects
    did not hold from study to study (MPI-C003).

    The mechanism rung is solid as a description of the model. The GQT formalism
    exists in a physics venue (MPI-C004), though its MPI-specific detail is
    undocumented. The no-transmission axiom implies that a signal-capable
    correlation cannot stay stable, and this was in print by 2005–2007, before
    the strict replications (MPI-C005). The matrix was MPI's own nominated way
    around that constraint (MPI-C006). None of this bears on whether the
    correlations exist.

    The featured hypothesis lives on the attribution rung (MPI-C007), and there
    the record does not discriminate in its favour. Early positives followed by
    nulls under preregistration and blinding is what MPI predicts. It is also
    what noise filtered through artifacts and selection produces. So the match
    is worth little to either side beyond priors, and because MPI-C010 is well
    supported, the model as deployed would have absorbed other patterns too.

    What does discriminate tilts against attribution:

    First, significance shrank when fixed data were reanalysed. The 2020 surplus
    'broke down in reasonably improved methods of analysis' on its own authors'
    account (E002), and dependence-aware simulations diminished the earlier
    results (E007, MPI-C009). Decline acts on new data; it cannot make a re-run
    of the same numbers lose significance. This is the signature of an inflated
    inference, not of an evasive effect.

    Second, the only prospective test of a decline shape failed on all three
    preregistered statistics (MPI-C504). The one post-hoc oscillation offered
    from 12,571 sessions sits inside the permutation distribution (p = 0.328),
    and Grote notes that cumulative z-scores damp mechanically (E021).

    Third, each mechanism in MPI-C008 is documented operating inside this
    literature. These include dependence inflation, a post-hoc p = 0.012 from
    data whose preplanned tests were null (E006), a coding error manufacturing a
    correlational micro-PK effect (E017), and small-study effects across 380 REG
    studies (E015).

    Steelman for MPI: the strict nulls that weigh against it were predicted in
    print before they were run. Residual positives (Flores's three of five, the
    2023 Random.org arm) have no identified artifact. Bierman 2016 shows a
    realistic QRP model leaving a significant residual in the best neighbouring
    database, so MPI-C008's joint sufficiency is extrapolated rather than
    demonstrated. MPI's distinctive predictions — RNG-source dependence,
    strength–reproducibility reciprocity, documentation suppression — are
    untested or were tested at hopeless power (E013). Absent confirmation is
    partly absent attempt.

    Steelman for the conventional account: it predicts not only the nulls but
    where the positives sit — exploratory analyses, post-hoc variants, inflated
    tests on fixed data, in-house and unreviewed series. The fixed-data cases
    are ones MPI cannot recast as decline. The 2023 pseudo-random arm also
    reports a positive, near-threshold difference (t = 1.813, p = 0.070), which
    is awkward if the effect depends on genuine indeterminacy.

    Verdict: weakly_supported. It is not contradicted, for three reasons: nulls
    cannot contradict a model that predicts them, the fixed-data evidence
    diminishes rather than eliminates the surplus, and the discriminating tests
    (MPI-R003, MPI-R005, MPI-R006) have not been run. It is not
    presently_untestable, because those tests are feasible. Part of the lean
    rests on priors rather than records. One is the low prior plausibility of
    macroscopic non-local psychophysical correlations. The other is the
    background fact that in physics no-signalling coexists with stable,
    replicable entanglement correlations, so decline is an MPI-specific
    postulate rather than an inheritance from quantum theory.

    Sensitivity: the most consequential single record is MPI-E007 (Flores 2021).
    It is the only evidence record behind MPI-C009 — the one artifact argument
    aimed at the program's own earlier positive data rather than imported by
    analogy. It is also the strongest surviving positive. Without it, nothing in
    the record would bear on the earlier positives' statistics except the
    proponents' fragility note for 2020; MPI-C008 would rest on cross-paradigm
    analogy plus Grote 2017's illustration; and MPI-C007 would lose its best
    residual support. The verdict survives, carried by the strict nulls (E003,
    E004), the 2020 fragility finding (E002) and the failed decline-shape test
    (E018). Its margin over unresolved narrows, but it does not hang on a single
    thread.
  steelman: "Where the matrix surplus has survived, no record identifies what
    produced it. Flores's thesis reports three of five replications significant
    under permutation tests that, on the ledger's reading, survive her own
    dependence-aware analyses (E007). The 2023 online replication reports an
    experimental–control difference of Welch's t = 3.811 (p = 0.00013) across
    roughly 10,900 sessions with an atmospheric-noise RNG (E008). This
    assessment discounts both — shared equipment and personnel, no recorded
    preregistration, preprint status, unequal arm power — but a discount is not
    an explanation, and MPI-C008's sufficiency reaches these results only by
    extrapolation from other paradigms. They also point to the one contrast on
    which MPI-family theory and every conventional account make opposite forward
    predictions: whether the effect depends on genuine versus deterministic
    randomness. That contrast has never been tested at equal power, and neither
    has the 2007 paper's distinctive prediction that stronger initial effects
    decline faster."
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: "Every party in the record describes the 1986–2006 series as having
      reported more significant psychophysical correlations than chance and
      control: the proponents' own successor paper (Walach et al. 2021, the
      claim's anchor), the 2006 report as characterised in E001, and the
      internal critic whose dependence work presupposes that original
      significance (E007). Because the claim concerns what was reported, the
      dependence critique (MPI-C009) bears on the report's validity, not its
      existence. The strongest opposing consideration is provenance. The 2006
      proceedings and the German-language 1986–87 papers were not examined, and
      the raw data are unpublished. The anchoring quote also says 'more than
      seen in a control matrix', not that the experimental–control difference
      was itself significant, so the claim's 'significantly' slightly outruns
      the documentation; E002 is a 2020 replication and does not bear on the
      1986–2006 series directly."
    confidence: moderate
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: Every preregistered or blind-analysis matrix test in the record is
      null on its primary analysis. These are the proponents' two
      consensus-protocol replications on the 2020 equipment (64 and 40
      participants, power 0.88 and 0.69; E003); Grote's independent, fully
      blinded 200-participant replication, whose main result 'fell well within
      the expected random distribution' (E004); and the three preplanned
      analyses of Grote 2017 (combined p = 0.315; E006). The strongest opposing
      considerations are the small number of such studies, the modest power of
      two of them, and the partial positives in Flores's in-house series (three
      of five significant, E007) and the 2023 online study (E008). No record
      describes those as preregistered or blind-analysed, so they fall outside
      the claim's scope rather than against it. For the studies documented,
      'predominantly' understates a uniform result; what the failures imply for
      MPI is contested precisely because MPI predicts them (MPI-C005, MPI-C010).
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "Instability under replication is documented on several lines. The
      founding positives (E001) and the 2020 surplus (E002) give way to null
      preregistered and blinded replications (E003, E004). Grote's own series
      runs from significant (2015) to null (2017, 2021) (E005, though not a
      strict matrix design), and Kennedy's review documents the same arc
      field-wide (E014). The weakening limb is well evidenced, but no evidence
      record makes the study-by-study comparison needed to show sign reversals
      or migration to other cells or variables; the nearest instances are
      post-hoc variants reaching or approaching significance (Grote 2017's p =
      0.012, Grote 2021's two p = 0.06), which are as much analytic flexibility
      as displacement. The strongest opposing consideration goes to the
      observation's meaning rather than its truth: cumulative z-scores damp
      mechanically as data accumulate (E021) and, on general statistical
      grounds, selected early results regress, so the pattern favours no
      explanation over another."
    confidence: moderate
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: "The first conjunct is well supported. Atmanspacher, Römer and Walach
      axiomatised a weak quantum theory retaining complementarity and
      entanglement for arbitrary systems in a peer-reviewed physics-foundations
      journal (E010), and the 2007 paper states MPI's predictions within that
      framework, calling the strength–reproducibility reciprocity 'a further
      prediction of Generalized Quantum Theory' (E009). The second conjunct is
      thinner: no evidence record shows pragmatic information functioning as an
      'ordering quantity', and since MPI's canonical statement (1995) predates
      GQT (2002), 'instantiates' describes a later embedding whose formal depth
      the records do not display. The strongest opposing consideration is that
      GQT buys generality by dropping Hilbert-space structure and Planck's
      constant, so it cannot say how large or durable a psychophysical
      correlation should be (E010); how much of MPI it derives, rather than
      accommodates, is not shown. The claim's truth would in any case say
      nothing about whether such correlations exist."
    confidence: moderate
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: "The theorists' own text states the NT axiom and derives from it that
      an apparent effect 'will be wiped out' by replication attempts, may
      'change sign or disappear altogether', or may 'show up again in different
      observables' (E009). The 2005 exchange shows the postulate in print
      earlier still (E023, E024), before the 2017–2021 strict replications, so
      it is not a retrofit to them. The conditional entailment is sound: if a
      stable correlation would be a usable signal, NT forbids it to stay stable,
      and decline, sign change and displacement exhaust the ways of not staying
      stable. Confidence is moderate because 'in advance of any data' overstates
      the history — the 2007 text calls decline 'well known and often
      experienced' — and because NT alone is equally satisfied by an effect that
      never appears, so the initial-effect-then-decline shape needs MPI's
      further premises. Leaning on general background rather than the records:
      in physics, no-signalling coexists with perfectly stable, replicable
      entanglement correlations, so decline under replication is an MPI-specific
      addition, not an inheritance from quantum theory."
    confidence: moderate
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: "The rationale is in the theorists' own words: 'make positive use of
      the evasion phenomenon' by 'simultaneous registration of as many different
      correlations as possible', so that psi effects 'show up as transitory,
      jumping unexpected and statistically unlikely patterns in the correlation
      matrix' (E011). The 2015 chapter frames the method as 'a new light upon
      the repeatability problem' (E012), and the proponents' team treated the
      matrix as the benchmark whose failure was informative (E003). The
      strongest opposing considerations are that the attestation is effectively
      single-source (same paper and authors as E009) and that the records do not
      show whether the rationale preceded the 1986 design. In addition, Watt and
      Tierney could still call their 2013 field study 'the first systematic test
      of the MPI' (E013), suggesting not everyone regarded the matrix as a test
      of the model rather than a detection method derived from it. Guiard's
      point that the matrix's own summary statistic would become a signal if
      stable (E024) bears on whether the design works, not on what it was
      proposed to do, which is what the claim states."
    confidence: high
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: The positive evidence is thin and each item is qualified. The 2020
      surplus was called 'significant but fragile' by its own authors once
      improved analyses broke it (E002). Flores's three significant studies of
      five share equipment, personnel and analytic choices and are not recorded
      as preregistered (E007). The 2023 true-RNG result is an unreviewed
      preprint with unequal arm power, and its pseudo-random arm also reports a
      positive difference (t = 1.813, p = 0.070), awkward if the effect depends
      on genuine indeterminacy (E008); the only field test is mute at 14 cases
      (E013). Against attribution, significance shrinking when fixed data are
      reanalysed (E002, E007) cannot be decline, which acts only on new data;
      the strict tests are null (E003, E004), and the only prospective test of a
      decline shape failed (MPI-C504). The strongest consideration against this
      verdict is that no record traces Flores's residual positives or the
      Random.org difference to an identified artifact, and MPI's distinctive
      forward predictions remain essentially untested, which is why the verdict
      stops short of contradicted; part of the downward pull is a prior — the
      low plausibility of macroscopic non-local psychophysical correlations —
      not a finding.
    confidence: moderate
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each named mechanism is documented inside this literature.
      Dependence among psychological variables inflated earlier significance
      (E007), and a post-hoc variant reached p = 0.012 on data whose three
      preplanned tests were null (E006). A coding error manufactured a
      correlational micro-PK effect until a replication forced the audit (E017),
      and the parent REG literature shows small-study effects most simply
      explained by publication bias (E015). On general statistical grounds,
      selection on noisy early results yields decline without further
      assumption, and cumulative scores damp mechanically (E021). What is not
      shown is joint sufficiency for this corpus: no standalone dependence-aware
      reanalysis of the founding datasets exists, the publication-bias evidence
      comes from classical hit-rate studies, and no record traces Flores's three
      significant studies or the 2023 Random.org arm to a specific artifact. The
      strongest opposing consideration is Bierman et al. (E016): a QRP model at
      realistic rates explained about 60% of the ganzfeld effect but left it
      significant (p = 0.003), a documented case where the conventional toolkit
      fell short of the whole distance; some of this account's advantage over
      MPI-C007 rests on prior plausibility rather than demonstrated
      sufficiency."
    confidence: moderate
  - claimId: MPI-C009
    verdict: provisionally_supported
    reasoning: "Flores's thesis work, as summarised in the successor preprint,
      reports high intercorrelations among the psychological variables and finds
      that dependence-respecting simulations diminished the earlier significant
      results (E007, and the claim's anchor). This agrees with the proponents'
      own statement that the 2020 effect's significance 'broke down in
      reasonably improved methods of analysis' (E002). The first limb,
      dependence violating the original independence assumptions, is well
      grounded. The second is weaker than stated: the source language is hedged
      ('may have influenced', 'diminished'), no magnitude is reported, and the
      work is an examined thesis rather than a standalone reviewed reanalysis.
      With the 1986–2006 raw data unpublished, it is also unclear whether
      Lucadou's founding datasets, as opposed to later replications, were
      reanalysed. The strongest opposing consideration is that the same project
      found significance persisting in three of five new studies under its
      dependence-aware methods, so dependence is shown to shrink the surplus,
      not eliminate it; 'substantially' is not yet earned by the records."
    confidence: moderate
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: "The proponents read their own preregistered failures as 'likely part
      of the systematic nature of such effects' and declared the paradigm, not
      the model, non-replicable (E003). Micro-PK researchers who take MPI
      seriously enough to try to repair it conclude that under it 'real null
      effects... cannot be distinguished from decline effects' (E022). Guiard
      charged that Lucadou, by refusing to use the matrix's own correlation
      density as the observed criterion, left no criterion separating a PK
      process from chance; that charge has no recorded reply, though none was
      searched for (E024). The strongest opposing consideration is Lucadou's
      statement that a demonstrated reliable signal 'would bring it down at
      once' (E023). But that outcome is excluded by the matrix design the model
      nominated, and he pre-assigns any such demonstration to a sensory leak or
      fraud, which deepens rather than answers the insulation. The claim
      concerns practice, not logical necessity: MPI carries testable content
      (the reciprocity prediction in E009, the documentation prediction
      operationalised in E013), and Guiard grants that ordinary accumulation is
      permitted where no signal can be sent, so confidence is moderate on a
      documentary base of a handful of texts, with the 2015 formulation
      unchecked."
    confidence: moderate
  - claimId: MPI-C504
    verdict: established
    reasoning: "The full text was read, and the three preregistered statistics are
      quoted with their simulation percentiles: 18.71% of 10,000 simulations lay
      closer to the prediction on area between curves, 19.42% on turning point
      and 5.28% on end point. None falls below the conventional 5%, and the
      authors conclude that, although closer than most simulations, the data did
      not stand out significantly (E018). The post-hoc trajectory measures that
      did separate the data from simulations at the 1% level (E019) were
      selected after the preregistered tests failed and do not alter what those
      tests showed. The strongest opposing considerations are that the
      preregistration (osf.io/wn5b7) was not itself read, so 'preregistered'
      rests on the authors' account, and that the end-point statistic sits just
      above threshold. As to implication, this tests the Munich group's
      systematic-oscillation extension, which the authors distinguish from MPI's
      unsystematic decline, so its failure weighs on the project of making
      decline a checkable signature rather than on MPI's core."
    confidence: high
