  synthesis: |-
    The verdict holds at weakly_supported: the ladder is sound at the observation and theory rungs and breaks at attribution, and this pass adds weight to the falsifiability crux rather than to either side of the attribution contest.

    Observation: the founding surpluses (MPI-E001) remain unaudited under the dependence critique (MPI-E007), while the strictest designs — two preregistered consensus replications (MPI-E003), Grote's frozen-software blind analysis (MPI-E004), the preplanned nulls of MPI-E006 — are null. The nulls carry the case.

    Mechanism: MPI-C005 and MPI-C006 are documentary. The decline corollaries were in print in 2007 (MPI-E009), and the matrix design is the theorists' own nominated test (MPI-E011).

    New this pass: the one attempt found to turn decline into a prospective, quantitative prediction. Dechamps and Maier preregistered an oscillation forecast and scored it against 10,000 simulations; it did not stand out on any preregistered statistic (MPI-E018, MPI-C504). Their post hoc measures that did separate the data (MPI-E019) await a frozen test (MPI-R006). An earlier post-hoc oscillation from the same group is reproduced by permuted data (MPI-E021 against MPI-E020). These test an extension the authors distinguish from MPI, so they bear on whether decline can be made testable, not on the model's core.

    Falsifiability: MPI-C010 moves from mixed to provisionally_supported. Von Lucadou did name a refuting outcome in 2005 — reliable signal transfer — but in the same passage predicted that any experiment showing it contains a sensory leak (MPI-E023), and it is not an outcome of the matrix experiment. His critic's request for a criterion separating a PK process from chance was left unmet in that exchange (MPI-E024). Micro-PK researchers sympathetic to the model wrote that true nulls cannot be told from decline under it (MPI-E022). Against this stands the 2021 team's concession that the paradigm is not replicable (MPI-E003).

    Attribution: MPI-C007's residue is thin and qualified — MPI-E002 'significant but fragile', MPI-E007's three of five not independent, MPI-E008 an unreviewed preprint with unequal power. The decline pattern (MPI-C003) remains inert between rivals. Sensitivity: if Lucadou's later writings supply a bindable criterion for the matrix, MPI-C010 returns to mixed; the case verdict does not move either way.
  steelman: The model took its risk early and in print. In 2007, before the consensus replications and Grote's blind test, its theorists wrote that stricter protocols would see the effect decline, reverse or move — and they did. A theory that forbids any stable psi channel anywhere is making a bold universal claim, and its author has said a reliable signal would bring it down at once. The matrix design was a positive prediction that could have failed from the start, and in its inventors' hands it repeatedly did not; Walach's two-lab study was evaluated against ten thousand simulated runs and still reported a surplus, and three of Flores's five survived conservative analyses. The conventional account has not shown, with a simulation calibrated to this corpus, that selection and dependence reproduce the published record. Until it does, "regression to the mean" is a sketch, and MPI is the only account that predicted the shape of the record before seeing it.
claimAssessments:
  - claimId: MPI-C001
    verdict: provisionally_supported
    reasoning: "That these reports exist and say what they say is well documented. That the reported surpluses were computed against valid null distributions is exactly what the dependence critique (MPI-C009) contests: the original significance counting assumed independent cells in matrices built from intercorrelated psychological variables."
    confidence: moderate
    treatment:
      plainLanguage: In the founding experiments, participants pressed keys trying to "influence" a random event generator. Nobody scored hits in the ordinary sense — instead, the experimenters counted how many correlations between behavior variables and machine variables came out statistically significant, and reported far more of them than chance or control runs should give.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: If the surpluses are statistically sound, something needs explaining — but the something could still be analytic artifact rather than anomaly. If they are unsound, the whole program's foundation shifts to the later, stricter replications.
      strongestObjection: "The founding analyses counted significant cells against an independence assumption that the data violate: the psychological variables were highly intercorrelated, and dependence-aware reanalyses (Monte Carlo, permutation) diminish the reported effects."
      whatWouldChangeOurMind:
        - A dependence-aware reanalysis of the original 1986–2006 datasets, in either direction.
        - Publication or archiving of the original raw data, which would make such a reanalysis possible.
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: "The strongest-designed tests are unambiguous: Grote's 200-participant blind analysis fell \"well within the expected random distribution,\" and the proponents' own two consensus-protocol replications were null. The partial exceptions (Walach 2020; three of Flores's five studies) predate or sidestep the strictest controls."
    confidence: high
    treatment:
      plainLanguage: When the matrix experiment was rerun under the strictest modern rules — analysis plans frozen in advance, in one case the entire analysis software written and tested before anyone looked at the data — the effect mostly disappeared.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "This is the case's central twist: a null replication record undermines the anomaly reading and simultaneously matches MPI's own decline prediction. By itself, this observation cannot separate the hypotheses — which is why the falsifiability crux (MPI-C010) exists."
      strongestObjection: '"Predominantly" is doing work: Walach et al. 2020 reported a significant surplus against ten thousand simulated experiments, and Flores reported three of five significant under permutation analyses — the record is messier than a clean null.'
      whatWouldChangeOurMind:
        - Further adversarial blind-analysis replications, in either direction.
        - A significant result under a Grote-style full blind-analysis protocol would remove the 'strictest tests are null' pattern.
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "Descriptively accurate as a sequence of published outcomes: Lucadou's positives, Walach 2020's \"significant but fragile\" effect whose significance broke down under improved analyses, Grote's 2015 positive followed by his own 2017 and 2021 nulls with a post-hoc-only signal, and the two 2021 consensus-protocol failures. What \"decline\" presumes — that there was ever a real effect to decline — is not part of this claim."
    confidence: moderate
    treatment:
      plainLanguage: "Across four decades, the matrix effect has behaved like a bar of wet soap: strong in early reports, weaker or absent in stricter reruns, and when something did show up later, it tended to show up somewhere else — different cells, different analyses, different variables."
      importance: major
      diagnosticity: low
      diagnosticitySummary: Regression to the mean produces exactly this trajectory from null data filtered by publication, and a cumulative score's swings shrink as data accumulate whether or not anything is there. The pattern is at home in both rival explanations.
      strongestObjection: '"Decline and displacement" is a narrative imposed on a small, heterogeneous set of studies with different designs, power, and analyses; no prespecified metric of decline has been defined and then measured across the matrix series.'
      whatWouldChangeOurMind:
        - A quantitative, prespecified decline/displacement metric applied across the full corpus (see research agenda).
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: "The framework is published in a serious foundations venue and is internally coherent as far as reviewed. Its cost is candor about lost power: without Hilbert-space structure it assigns no probabilities to outcomes, so it constrains data only qualitatively."
    confidence: moderate
    treatment:
      plainLanguage: 'The model is not hand-waving about "quantum consciousness": there is a published axiomatic framework that keeps the algebraic structure of quantum theory (non-commuting observables, entanglement between parts of a system) while dropping its physical constants, and MPI is a special case of it. Whether that formalism describes reality is a separate question from whether it exists and is coherent.'
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A coherent formalism proves availability, not truth. Many consistent theories describe nothing. Its main evidential role is to make MPI's predictions derivable rather than ad hoc.
      strongestObjection: By discarding the quantitative machinery, GQT keeps quantum theory's vocabulary while giving up nearly all of its predictive risk — the entanglement here is an analogy wearing an axiom system, and no derivation says how large any effect should be, or when.
      whatWouldChangeOurMind:
        - A GQT derivation yielding quantitative, parameter-fixed predictions for a matrix experiment.
        - A demonstrated internal inconsistency in the axiom system.
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: 'As a statement about what the model says, this is verbatim in the 2007 paper, which also derives the corollaries: decline that is faster when the original effect was stronger, sign reversal, and reappearance "in different observables and/or between different parts of the system." Whether the axiom is true of nature is the attribution question, not this claim.'
    confidence: high
    treatment:
      plainLanguage: The model's core rule is that these correlations can never be used to send a message. A perfectly replicable psi experiment would be a message channel — so the model says perfect replication cannot happen, and published this consequence before the stricter replications were run. The decline effect, usually psi research's embarrassment, is here a theorem.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: "This is what distinguishes MPI from both conventional skepticism and conventional psi advocacy: it stakes out, in print and in advance, the prediction that stricter protocols will show weaker effects. The prediction is real; the trouble is that the null hypothesis makes the same one (MPI-C008)."
      strongestObjection: "A prediction shared with the null hypothesis earns no credit: regression to the mean also \"predicts\" that stricter, larger replications show weaker effects. The model's own distinctive fine structure — displacement patterns, strength–reproducibility reciprocity — has not been tested against a prespecified metric; the one preregistered decline-shape test found (MPI-C504) tested an extension and did not beat chance."
      whatWouldChangeOurMind:
        - A prespecified test of the model's distinctive fine structure (displacement patterns, decline-rate reciprocity) succeeding or failing.
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: "Documented as the design's stated rationale in the theorists' own words. This matters structurally: the matrix experiments are not an arbitrary paradigm but the model's self-nominated benchmark, so their replication record is the primary evidence line for and against MPI."
    confidence: high
    treatment:
      plainLanguage: Lucadou did not just explain away failed replications — he designed an experiment his theory says should work anyway. If no single number counts as "the result," no signal can be coded, so the no-transmission rule is not violated and the correlations are allowed to show up as a surplus of significant cells scattered through a matrix.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Cuts both ways. It makes the CMM record binding on MPI in a way generic psi results are not — and it means the blind-analysis failures land on the model's own chosen ground.
      strongestObjection: A design that predicts "transitory, jumping, unexpected patterns" in a large matrix describes what multiple testing produces from pure noise; the design converts the multiplicity problem into the predicted signature, which is precisely why dependence-aware statistics are decisive here.
      whatWouldChangeOurMind:
        - Proponent agreement on a dependence-aware analysis standard for what counts as a matrix 'hit' (see research agenda).
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: Some peer-reviewed positives exist (Walach 2020; parts of Flores 2021), and the proponents publish their failures — but the strongest-designed test (Grote's blind analysis) was null, the founding results are weakened by the dependence critique, and every conventional mechanism the rival explanation needs is documented inside this corpus. The decline-shape tests added this pass test an extension the authors distinguish from MPI, so they do not move this claim. The thesis survives mainly in the spaces the strictest tests have not yet covered.
    confidence: moderate
    treatment:
      plainLanguage: "The featured thesis: the matrix experiments really did catch something — a real connection between minds and machines that by its nature cannot be pinned down — and the fading, shifting record is that something behaving exactly as the theory says it must."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself. Everything below the ladder exists to test it against MPI-C008.
      strongestObjection: "The explanation is unfalsifiable in practice as deployed: successes confirm the correlations and failures confirm the elusiveness, so no outcome of the very experiments the model nominated can count against it — while the mundane account (MPI-C008) explains the same record with mechanisms already caught operating in it."
      whatWouldChangeOurMind:
        - Success or failure of prespecified displacement-structure predictions in adversarial replications.
        - Dependence-aware reanalysis of the founding datasets restoring (or eliminating) the original surpluses.
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each component mechanism is documented in or near this corpus: the dependence problem (Flores's Monte Carlo work), analytic flexibility (Grote 2017's post-hoc-only significance; a post-hoc oscillation that permuted data reproduce), error-driven false positives (Maier & Dechamps 2022), publication-bias sensitivity (Bösch 2006). What keeps this short of well_supported: no one has shown quantitatively that these mechanisms reproduce the specific published matrix record, and the strongest QRP simulation in the neighborhood (Bierman 2016, on ganzfeld data) explained about 60% of that effect, not all of it."
    confidence: moderate
    treatment:
      plainLanguage: 'The conventional steelman: nothing was ever there. Intercorrelated variables made "significant cells" cheap, flexible analysis and selective publication made early positives likely, and when protocols tightened, results regressed to the nothing they came from. Every one of those mechanisms has been caught operating somewhere in this literature.'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: The direct rival to MPI-C007. If it holds, MPI's central evidence line dissolves; if it can be shown insufficient under adversarial conditions, what remains is genuinely anomalous.
      strongestObjection: Walach et al. 2020 — large, two-lab, evaluated against ten thousand simulated experiments — still reported a significant surplus; Flores found effects in three of five studies using permutation analyses designed to respect dependence. The mundane account predicts stricter methods kill the effect — mostly they did, but not cleanly everywhere.
      whatWouldChangeOurMind:
        - A QRP/dependence simulation calibrated to the actual CMM corpus reproducing (or failing to reproduce) its published record.
        - A significant matrix result under full blind analysis, which this explanation predicts should not occur.
  - claimId: MPI-C009
    verdict: provisionally_supported
    reasoning: Reported from inside the research program itself (Flores worked under Watt and Walach), which raises its credibility as a concession against interest. The full quantitative reanalysis of the founding datasets has not been published as a standalone, independently reviewed result.
    confidence: moderate
    treatment:
      plainLanguage: 'The sharpest technical objection: counting significant cells only means something if the cells are independent. The psychological variables in these matrices strongly correlate with each other, so clusters of "significant" cells come in bundles. Simulations that respect this shrink the original headline numbers.'
      importance: major
      diagnosticity: high
      diagnosticitySummary: Directly attacks the load-bearing statistic of the founding experiments (MPI-C001). If it holds in full, the program's origin story weakens from "anomaly detected" to "artifact detected."
      strongestObjection: Flores herself still reports three of five thesis studies significant under permutation analyses that respect the dependence structure — the critique shrinks the founding results but has not, on its own terms, zeroed out the program.
      whatWouldChangeOurMind:
        - An independent, published dependence-aware reanalysis of the 1986–2020 matrix datasets.
  - claimId: MPI-C010
    verdict: provisionally_supported
    reasoning: "Moved from mixed. The proponents read their consensus-protocol failures as \"likely part of the systematic nature of such effects\" (MPI-E003). The model's author named a refuting outcome in 2005 — reliable signal transfer — but in the same passage predicted any such experiment contains a sensory leak, and it is not an outcome of the matrix experiment (MPI-E023). A critic's request for a criterion separating a PK process from chance went unmet in that exchange (MPI-E024); sympathetic researchers wrote that true nulls cannot be told from decline under the model (MPI-E022). Short of well_supported: the 2021 team conceded the paradigm is not replicable, and Lucadou's later writings were not checked for a sharper criterion."
    confidence: moderate
    treatment:
      plainLanguage: "The falsifiability tension, stated as a claim about scientific practice rather than philosophy: if heads confirms the theory and tails confirms it too, the theory has stopped taking risks. The live question is whether MPI's proponents have specified an outcome of their own experiment they would accept as a refutation — and whether the model's structure permits one."
      importance: major
      diagnosticity: high
      diagnosticitySummary: This is the crux that decides how much the replication record can ever mean. If MPI has no bindable predictions, the case ends in philosophy; if its fine structure can be prespecified and tested, the case returns to the laboratory.
      strongestObjection: "MPI is falsifiable in principle, and its author says so in print: the no-transmission axiom forbids any stable psi channel (a risky universal), the matrix surplus was a positive prediction, and corollaries such as faster decline after stronger effects could be prespecified tomorrow. On this view the insulation is a habit of interpretation, not a theorem of the model."
      whatWouldChangeOurMind:
        - Proponents publishing binding disconfirmation criteria for the matrix experiment (see research agenda) — or explicitly declining to.
        - A prespecified fine-structure test whose outcome proponents accept as evidence either way.
  - claimId: MPI-C504
    verdict: well_supported
    reasoning: 'The paper reports it directly: on area between curves and turning point about a fifth of 10,000 random simulations matched the forecast better, and on end point 5.28% did, so the data "did not stand out" on any preregistered statistic. Not higher than well_supported: the preregistration itself was not read, and the claim reports one study of 203 new participants.'
    confidence: high
    treatment:
      plainLanguage: "A Munich group tried to make the decline effect predictable: from two earlier studies they forecast the exact rise-and-fall shape the effect would trace in the next 203 participants, registered the forecast in advance, and compared the result with ten thousand runs of pure chance. The real data fit the forecast no better than chance often does."
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: The only prospective, scored test of a decline shape found. Its failure fits the conventional account; but it tested the authors' own extension, which they say differs from MPI, so it limits the route to testing elusiveness more than it refutes the model.
      strongestObjection: The forecast was too smooth to be distinctive — the authors' own explanation — so a near-miss tells little either way; and post hoc measures of the same data did separate it from simulations at the 1% level.
      whatWouldChangeOurMind:
        - The post hoc trajectory measures, frozen and applied blind to new data against a simulation ensemble (see research agenda).
        - A sharper, more distinctive decline forecast preregistered and passed.
