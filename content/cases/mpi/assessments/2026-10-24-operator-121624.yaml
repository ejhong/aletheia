caseAssessment:
  verdict: weakly_supported
  whatIsClaimed: Psi phenomena are real but are non-local, meaning-dependent correlations between an observer and a physical system — not signals or forces. Because such correlations can never be used to transmit information (the "no-transmission" axiom), any experiment that could turn them into a reliable signal will find them declining, changing sign, or displacing to unmonitored variables. Correlation-matrix experiments, which spread the effect across many variable pairs instead of one outcome channel, are claimed to reveal these correlations as a surplus of significant matrix cells relative to control runs.
  whereDisagreementLives: "Not over whether decline happens, but over why: everyone agrees these effects have never replicated stably. MPI says decline is the lawful signature of a real but unexploitable correlation. The conventional account says the early positives were never real — inflated by intercorrelated variables, flexible analysis and selective publication — and decline is regression to the mean. Behind that sits a second dispute, argued in print since 2005: whether the model names any outcome of its own experiments that would count against it."
  whatWouldSettleIt: Prespecified, binding predictions about the shape of decline, tested blind against an ensemble of chance runs. One sympathetic group tried this once, with a preregistered oscillation forecast, and it did not beat random simulations; their later measures were chosen after the fact. Freezing those measures, agreeing dependence-aware statistics for the matrix, and getting the proponents to name a refuting result would turn the falsifiability argument into an experiment. A stable, exploitable psi signal anywhere would refute the model outright, by its own axiom.
  bestConventionalExplanation: "No anomalous correlation exists. The psychological variables in matrix experiments are highly intercorrelated, so counting \"significant cells\" against an independence assumption overstates the evidence; Monte Carlo and permutation reanalyses shrink the founding results. Early positives are what analytic flexibility, optional stopping and publication selection produce from null data; decline is regression to the mean; displacement is multiplicity. Each mechanism is documented in or beside this corpus: a coding error behind one micro-PK effect, a post-hoc contrast rescuing a null study, an oscillation 'signature' that reshuffled data reproduce, significance that broke down under better analysis by the replicators' own account. The strictest test, a fully blind analysis, found nothing. Its residue: some replications, including preregistered ones in Flores's thesis, still reported excess correlations, and their authors were not naive statisticians."
  components: []
  researchPriority:
    level: medium
    reason: The decisive tests are cheap and partly built — frozen decline measures, an equal-power true-versus-pseudo-random comparison, binding fine-structure predictions — but the proponents concede the paradigm does not replicate on demand, which caps the expected yield.
  loadBearing:
    - MPI-C001
    - MPI-C002
