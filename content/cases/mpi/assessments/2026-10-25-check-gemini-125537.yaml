  synthesis: >-
    The central question posed by this case is whether the historical trajectory
    of the correlation-matrix program—early positive anomalies followed by
    inevitable decline, sign reversals, and displacement—represents an empirical
    signature of psychophysical entanglement predicted by the Model of Pragmatic
    Information (MPI), or whether it is the standard artifactual signature of
    statistical noise subjected to analytical flexibility and publication bias.
    Evaluating the provided ledger establishes that the evidence firmly favors
    the conventional statistical explanation over MPI's ontological mechanism.

    To steelman the MPI framework: proponents constructed an axiomatic,
    mathematically coherent generalization of quantum theory (GQT) in
    physics-foundations literature (Atmanspacher et al. 2002) and formally
    derived the no-transmission axiom and the decline effect in print as early
    as 2007 (Lucadou, Römer & Walach 2007). This was not merely an ad-hoc
    postulation invented to explain modern preregistered failures; the model
    genuinely predicted in advance that attempts to isolate psi correlations as
    stable, exploitable signals must fail, and proposed the correlation matrix
    specifically to detect evanescent, non-signaling correlations across
    dispersed channels. Furthermore, certain independent replications, such as
    Walach et al. (2020) and Flores & Rapazote-Flores (2023), initially reported
    massive surpluses of correlations exceeding classical random expectations.

    However, the evidentiary structure supporting MPI as a physical explanation
    collapses upon methodological scrutiny. When subjected to rigorous
    preregistration and blind analysis—specifically eliminating analytical
    degrees of freedom—the paradigm fails decisively. The model proponents' own
    consensus preregistered replications found no effect ("Nailing Jelly",
    Walach et al. 2021), as did Grote's (2021) blinded protocol. Crucially, the
    founding matrix effects were substantially inflated by treating
    intercorrelated psychological variables as independent observations; when
    permutation tests accounting for variable dependence are applied, the
    reported surpluses shrink or dissolve (Flores 2021). Furthermore, the
    supposed true-versus-pseudo RNG divergence in Flores & Rapazote-Flores
    (2023) disappears under average-datapoint analysis and was compromised by
    participant-seeded pseudo-RNG generation. When confronted with these
    failures, proponents invoke auxiliary hypotheses—such as requiring
    systematic "novelty" or dismissing statistical dependence corrections as
    only applicable to causal signals—insulating the model from any possible
    disconfirmation. Ordinary regression to the mean, researcher degrees of
    freedom, and dependence violations jointly account for the entire historical
    record without requiring non-local anomalies.

    Sensitivity analysis: The single evidence record whose removal would most
    change this case assessment is MPI-E003 (Walach et al. 2021). If this
    rigorously designed, proponent-led, preregistered failure were removed, the
    case would lean more heavily on outside critiques (Grote 2021, Bösch 2006).
    Nevertheless, the verdict of contradicted survives without MPI-E003,
    anchored by Grote's pre-blinded null result (MPI-E004), the methodological
    invalidation of independence assumptions documented in MPI-E018 and
    MPI-E023, and the demonstrated non-falsifiability dynamics (MPI-E019,
    MPI-E020).
  steelman: The model provides a formally explicit, pre-stated theoretical
    derivation of strength-reproducibility reciprocity and documentation
    suppression, operationalized across macroscopic systems before contemporary
    preregistered replication failures occurred.
claimAssessments:
  - claimId: MPI-C001
    verdict: established
    reasoning: The evidence records confirm that von Lucadou's original experimental
      series from 1986 to 2006 repeatedly reported statistically significant
      surpluses of psychological–physical correlations relative to chance and
      control matrices. This historical observation is acknowledged consistently
      across primary papers and subsequent reviews (Walach 2020, 2021; Grote
      2021). The strongest opposing consideration is that the raw data from
      these early trials were never published for open evaluation, and the
      reported significances relied on counting methods that failed to adjust
      for variable interdependence.
    confidence: high
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: Preregistered and blind-analysis efforts have consistently failed to
      detect the excess-correlation effect when methodological parameters were
      locked in advance. Key examples include the Walach et al. (2021)
      consensus-protocol replications, Grote's (2021) live-unblinded experiment,
      and Flores's (2021) preregistered Studies 4 and 5. The strongest opposing
      consideration is that Flores (2021) registered initial permutation
      surpluses in Studies 1 and 2, though these occurred before the protocol
      failures of Studies 4 and 5, and Study 3 relied solely on the experimenter
      as the subject.
    confidence: high
  - claimId: MPI-C003
    verdict: established
    reasoning: Across the experimental history of the matrix method and broader
      micro-PK literature, reported anomalous effects systematically failed to
      replicate stably, instead displaying rapid decay, analytical shifts, or
      complete sign reversals. This pattern is documented within Grote’s
      experimental trajectory (2015 to 2021), Flores’s replication series (where
      Study 4 reversed direction into a negative Z score), and Kennedy's (2003)
      field-wide survey. The strongest opposing consideration is that proponents
      view this instability not as noise or protocol error, but as the direct
      qualitative empirical manifestation of MPI's no-transmission theorem.
    confidence: high
  - claimId: MPI-C004
    verdict: established
    reasoning: Generalized Quantum Theory was successfully developed and published
      as an axiomatic mathematical framework extending concepts like
      complementarity and entanglement to non-physical systems by dropping
      Planck's constant and Hilbert-space constraints (Atmanspacher et al.
      2002). MPI formally adapts this structure to psychophysical interactions
      using pragmatic information as its organizational parameter. The strongest
      opposing consideration is that GQT purchases its systemic generality by
      relinquishing quantitative probability calculations, thereby operating
      primarily as an abstract conceptual scheme rather than a predictive
      computational theory.
    confidence: high
  - claimId: MPI-C005
    verdict: established
    reasoning: The formal derivation of the decline effect directly from the
      no-transmission (NT) axiom appears explicitly in published theoretical
      literature well before the recent replication crisis, notably in von
      Lucadou, Römer & Walach (2007). The theorem formally entails that any
      psychophysical correlation that could be harnessed as an exploitable
      causal signal must vanish, reverse, or displace to preserve non-signaling
      conditions. The strongest opposing consideration is that the axiom acts
      essentially as a theoretical guarantee that empirical confirmation will
      remain permanently out of reach.
    confidence: high
  - claimId: MPI-C006
    verdict: established
    reasoning: The literature demonstrates that the correlation-matrix paradigm was
      consciously formulated as the operational test of MPI, intended to capture
      non-local psychophysical entanglement by dispersing potential interactions
      across hundreds of variable pairs to avoid creating an exploitable causal
      channel. This precise rationale is detailed in von Lucadou, Römer & Walach
      (2007) and reiterated in canonical overviews (Lucadou 2015). The strongest
      opposing consideration is that designing an experiment deliberately around
      evasive, jumping patterns creates a paradigm virtually impossible to
      distinguish from random chance variation.
    confidence: high
  - claimId: MPI-C007
    verdict: contradicted
    reasoning: The attribution of matrix patterns to genuine non-local
      psychophysical correlations is directly undermined by the evidentiary
      record. Rigorous preregistered and blinded tests yield null results, while
      positive anomalies are readily explained by methodological artifacts,
      statistical dependence among matrix cells, and analytical flexibility. The
      strongest opposing consideration rests on isolated large datasets
      reporting significant surpluses, such as Walach et al. (2020) and Flores &
      Rapazote-Flores (2023), but these effects dissolve under dependence
      reanalysis or lack robustness across analytical variations.
    confidence: high
  - claimId: MPI-C503
    verdict: contradicted
    reasoning: Although the abstract of Flores & Rapazote-Flores (2023) highlighted
      a significant difference at the final cumulative matrix for Random.org
      that was absent for the Mersenne Twister, their second highlighted
      headline analysis (averaging across datapoints) revealed statistically
      significant effects for both sources (p = 0.002 vs p = 8.13E-5).
      Crucially, the Mersenne Twister was seeded using participant finger-swipe
      timestamps, meaning it was neither genuinely deterministic nor independent
      of the psychological variables. The strongest opposing consideration is
      that the authors maintained a distinction based on post-hoc effect size
      and statistical power thresholds.
    confidence: moderate
  - claimId: MPI-C008
    verdict: well_supported
    reasoning: Conventional methodological and statistical factors provide a
      sufficient and parsimonious explanation for the entire correlation-matrix
      record. Meta-analyses in neighboring REG research show severe publication
      bias and small-study heterogeneity (Bösch 2006), post-hoc analysis shifts
      readily manufacture significant p-values from null datasets (Grote 2017),
      coding errors can generate spurious correlational psi effects (Maier &
      Dechamps 2022), and dependent matrix cells inflate test statistics (Flores
      2021). The strongest opposing consideration is Bierman et al.’s (2016)
      simulation suggesting that standard QRPs did not fully account for all
      variance in the distinct ganzfeld telepathy database.
    confidence: high
  - claimId: MPI-C009
    verdict: well_supported
    reasoning: Re-examination of the correlation-matrix procedure by Flores (2021)
      showed that psychological variables exhibit high intercorrelations,
      violating the independence assumption underlying the original Z-score test
      and substantially overestimating statistical significance. Incorporating
      permutation tests that preserve variable dependence consistently lowered
      test statistics. The strongest opposing consideration is that this
      reanalysis was conducted on new replication data rather than the original
      1986–2006 raw datasets, which remain unreleased.
    confidence: moderate
  - claimId: MPI-C010
    verdict: established
    reasoning: The practical application of MPI by its proponents demonstrates
      systematic insulation against disconfirmation. When replications fail,
      proponents regularly interpret the failure as positive confirmation of the
      model's predicted decline effect rather than empirical evidence against
      the underlying hypothesis (Walach et al. 2021). Furthermore, proponents
      argue that valid replications require procedural novelty and dismiss
      standard statistical dependence adjustments as irrelevant to non-causal
      systems (Flores 2021). The strongest opposing consideration is that
      proponents have voluntarily designed and registered formal tests (e.g.,
      Walach et al. 2021; Flores Study 4), even if the interpretive framework
      subsequently immunizes the theory against negative outcomes.
    confidence: high
