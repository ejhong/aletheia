  synthesis: >-
    The observation rung is solid and needs no theory to read. Lucadou's
    original series reported an excess of significant psychophysical
    correlations (C001). That attestation is second-hand: the primary reports
    were not read and the raw data are unpublished. The strict tests then
    predominantly failed (C002). Six results were null or reversed: two
    preregistered consensus-protocol replications by the proponents' own team,
    Grote's 200-participant blind analysis, his preplanned 2017 analyses, and
    the last two of Flores's five preregistered studies. The record also shows
    weakening, a sign reversal after a preregistered no-decline prediction, and
    significance that depends on which analysis is read (C003).

    The mechanism rung is largely as described, with discounts. GQT is a
    published formalism, but it has shed the quantitative machinery that would
    say how large or durable a correlation should be (C004). The
    decline-and-displacement prediction is in print by 2007, ahead of the
    preregistered tests, but it is permissive, and it was built around a decline
    its authors already called well known (C005). The matrix design is the
    model's own nominated paradigm (C006).

    The case turns on attribution (C007), and there the structure is
    unforgiving. Transient positives followed by decline are what the null
    predicts once initial positives are selected and methods tighten. The one
    matrix outcome the model forbids is an excess that keeps replicating, which
    its own design rationale says can never be achieved (E011). That outcome
    would refute the null as well. So the decline pattern cannot separate MPI
    from no effect; only the soundness of the positives can.

    Where the record tests that soundness, it points away from the model. The
    2020 two-lab surplus lost significance under improved analysis. The founding
    method's Z overstates results when variables are intercorrelated (C009). The
    true-versus-pseudo-random split appears or vanishes depending on which of
    two emphasised analyses is read, and the two arms did not in fact differ in
    determinism (C503, contradicted). The one field test was too weak to count
    either way (E013). Results that shrink when the same data are analysed
    better are what noise plus analytic flexibility predicts. A decline
    mechanism that acts on fresh attempts at corroboration does not predict
    them.

    The conventional account (C008) is therefore the better-supported
    explanation, but only provisionally. The founding and 2023 datasets have
    never been reanalysed. Part of its weight is borrowed from neighbouring
    literatures and from priors about null effects.

    Steelmanning MPI: nulls are what it predicts and cannot by themselves count
    against it. Flores's dependence-corrected analyses still found an excess in
    her preregistered early studies, and no record explains it. Bierman's
    simulation shows conventional mechanisms falling short in the best-studied
    neighbouring database. The reciprocity prediction has never been tested.

    Steelmanning the conventional side: every positive in the record carries a
    specific identified weakness, and the strictest and most independent tests
    are null. The programme's deployment also absorbs every failure (C010):
    novelty is demanded of each replication, the dependence objection is
    confined to causal signals, and a failed no-decline prediction was explained
    in part by decline itself.

    Verdict: weakly_supported. It is not contradicted, because a model deployed
    to absorb nulls cannot be refuted by them and some positives remain
    unanswered. It is no higher, because nothing in the record favours MPI over
    noise and the only discriminating observations favour noise.

    Sensitivity: the single record whose removal would most change this verdict
    is MPI-E023. It neutralises the largest positive (726 participants, p =
    0.00013) by showing two things: the statistics treat 4,096 cells built from
    four-by-four variables as independent, and the control series are generated
    by a different procedure from the experimental ones. Without it the verdict
    survives, but narrowly and nearer to unresolved. The source contrast still
    collapses (E021, E022), the study remains an unpreregistered preprint
    without journal review, and the preregistered and blind tests remain null.
    The verdict rests on several converging lines rather than on one thread.
  steelman: Flores's preregistered Studies 1 and 2 were significant under a
    permutation analysis, both for the whole matrix and at p = 0.0002 each for
    its upper-right block. Permutation is the dependence-aware correction the
    critics themselves call for, and no record supplies a mundane mechanism for
    these results. Preregistration removes analytic flexibility. The permutation
    null respects the intercorrelated variables. A thesis reporting all five of
    its studies cannot have published them selectively. Regression to the mean
    cannot create an excess in fresh data. This assessment discounts those
    results for being in-house, on shared equipment and personnel, not for any
    identified artefact; the dispute recorded in the thesis touches only the
    upper-right block. A proponent would add that the model's one distinctive
    piece of fine structure, that stronger effects should decline faster (E009),
    has never been tested against a prespecified metric. The experiment that
    could separate MPI from noise on the model's own terms has not been run.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: "As a claim about what was reported, this is attested from several
      directions. The full-text-read Walach et al. 2021 introduction states that
      Lucadou's experiments \"produced more significant correlations than
      expected by chance and more than seen in a control matrix.\" E001's
      characterization of the 2006 report is cross-checked against Walach 2020
      and the independent Grote 2021. E002, though tagged to this claim, is a
      2020 replication and does not bear on the 1986–2006 series as stated. The
      strongest opposing consideration is that no one in the ledger has read the
      primary reports: the 2006 full text was not examined, the 1986–1987 series
      appeared mainly in German-language venues, and the raw data are
      unpublished. The attested wording also does not separately show that the
      experimental-versus-control difference was itself significant, and the
      claim's local truth concerns reporting only."
    confidence: moderate
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: "Counting the preregistered or blind-analysis matrix tests in the
      record gives six null or reversed results: the two consensus-protocol
      replications in Walach et al. 2021 (E003), Grote's 200-participant blind
      analysis (E004), Grote 2017's preplanned analyses including a conceptual
      matrix replication (E006, combined p = 0.315), and Flores's Studies 4 and
      5 (E007, E020). Against these stand three positives, Flores's Studies 1–3,
      all from one lab and one with the experimenter as sole participant. The
      nulls include the largest and most independent tests in the corpus, and
      the proponents' own team ran two of them under a protocol frozen in
      advance. The strongest opposing consideration is that the failure is not
      uniform: Flores's Studies 1–3 were preregistered and significant under a
      permutation analysis, and several nulls were modestly powered (the second
      Walach replication at 0.69, Grote 2017 with 20 participants).
      \"Predominantly\" survives any reasonable way of counting or weighting
      these studies."
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: Instability is directly attested in three places. The 2020 two-lab
      surplus (E002) failed in two preregistered replications, and its own
      authors report that its significance broke down under improved analysis
      (E003, E002). Grote's correlational series moved from a significant 2015
      result, which was not a strict matrix design, to nulls in 2017 and 2021
      (E005, E006, E004). Flores's run of three positives ended with a
      preregistered no-decline prediction, followed by fewer significant
      correlations than control (a sign reversal) and then a null (E020); E006
      and E021 add analysis-dependent significance. The strongest opposing
      consideration is that the displacement component, effects shifting to
      different variables or cells, is not documented study by study in any
      record. In a matrix of thousands of cells the identity of nominally
      significant cells varies under the null anyway, and the sign reversal
      rests on pages paraphrased from a letter-spaced PDF.
    confidence: moderate
  - claimId: MPI-C004
    verdict: well_supported
    reasoning: "E010 documents a published axiomatization of a \"weak\" quantum
      theory that keeps complementarity and entanglement while dropping
      Hilbert-space structure and Planck's constant. The 2007 JCS paper that
      supplies E009 and E011 recasts psi phenomena as entanglement correlations
      in that framework, so both halves of the claim have a documented basis.
      The specific detail that pragmatic information is the ordering quantity is
      not quoted in any evidence record. That part leans on the claim's
      provenance note and on general background about a model named for that
      quantity. The strongest opposing consideration is that the extension is
      formally explicit only at the level of abstract structure: having shed the
      quantitative machinery, GQT cannot say how large, where, or how durable a
      psychophysical correlation should be. The instantiation therefore supplies
      vocabulary rather than predictions, and the claim's truth adds nothing to
      the evidence that such correlations exist."
    confidence: moderate
  - claimId: MPI-C005
    verdict: provisionally_supported
    reasoning: E009 shows the derivation genuinely in print by 2007, a decade before
      the preregistered and blind tests of 2017–2021. From the no-transmission
      axiom the theorists conclude that an apparent effect "will be wiped out"
      under attempts at replication and may "change sign or disappear
      altogether, or else show up again in different observables." The
      entailment needs an auxiliary premise, that any stably replicable
      psychophysical correlation would be usable as a signal. The physical
      no-signalling constraint the model borrows coexists with perfectly stable,
      replicable correlations; that point rests on general physics background,
      not on a record. "In advance of any data" is undercut by the same passage,
      which calls decline "the well known and often experienced decline effect,"
      and the sign-change and displacement clauses are permissions ("may")
      rather than determinate predictions. The strongest consideration for the
      claim is the strength–reproducibility reciprocity, a distinctive
      consequence fixed in advance that no replication has yet tested.
    confidence: moderate
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: "E011 quotes the theorists' design rationale: register \"as many
      different correlations as possible\" so that psi effects \"show up as
      transitory, jumping unexpected and statistically unlikely patterns,\" in
      order to \"make positive use of the evasion phenomenon.\" E012 shows the
      model's author presenting the method as the model's answer to the
      repeatability problem. Together these fix the matrix paradigm as the
      model's own nominated test, spreading effects so that no single channel
      carries a signal. The strongest opposing consideration is that the
      rationale is stated in 2007, two decades after the series began. It also
      frames the design as a way to capture an evasive effect, conceding it
      \"will never be possible to overcome the decline effect completely,\"
      rather than as a test that could refute the model, so \"test\" is partly
      the ledger's framing. Both sources share an author, but for a claim about
      the theorists' intent their own words are the best evidence available."
    confidence: high
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: "The only support is the existence of positive results, and each
      carries an identified weakness. The founding counts used a method shown to
      overstate results under variable dependence (E018). The 2020 two-lab
      surplus lost significance under improved analysis of the same data (E002).
      Flores's positives were in-house, one with the experimenter as sole
      participant and traces of causal correlation (E007). The largest positive
      treats 4,096 dependent cells as independent and generates experimental and
      control series by different procedures (E023). The decline that followed
      is predicted equally by regression after selection plus tighter methods,
      the true-versus-pseudo-random contrast does not hold (E021, E022), and the
      field test was too weak to count (E013). The strongest opposing
      consideration is that some positives are answered by no record: Flores's
      preregistered Studies 1–2 stayed significant under a permutation analysis,
      and neither the founding nor the 2023 datasets have been reanalysed. That,
      with a model built to absorb nulls, is why this is weakly_supported rather
      than contradicted."
    confidence: moderate
  - claimId: MPI-C503
    verdict: contradicted
    reasoning: The claim restates the abstract, but the full text contradicts both
      halves of the contrast as stated. On the paper's second emphasised
      analysis, the average over the 23 cumulative matrices, the pseudo-random
      arm is itself significant (t = 2.972, p = 0.002) alongside the Random.org
      arm (t = 3.941, p = 8.13E-5) (E021). The generator called deterministic
      was seeded from participants' swipe timestamps, by the authors' own
      account "ensuring true non-deterministic random values" (E022), so the
      arms did not differ as determinism against indeterminacy. The strongest
      opposing consideration is that on the final-cumulative-matrix analysis the
      abstract headlines, the split holds as reported (p = 0.00013 against p =
      0.069; E008). The authors defend it on power and minimum-effect criteria
      that no record shows to be wrong. Still, a contrast that appears with one
      of two emphasised analyses and disappears with the other, between arms
      that are not what the claim says, cannot be stated as the study's finding.
    confidence: moderate
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each named mechanism has a foothold in or near the matrix record.
      Dependence inflated the founding method's counts (E018) and is built into
      the largest positive's statistics (E023). Analytic flexibility turned
      Grote's preplanned nulls into a post-hoc p = 0.012 (E006) and decides
      whether the 2023 source split exists (E021). A surplus shrank under
      improved analysis (E002), the parent micro-PK literature shows small-study
      effects consistent with selection (E015), and a coding error manufactured
      a correlational micro-PK effect next door (E017). Joint sufficiency for
      this record is not demonstrated, however. No dependence-aware reanalysis
      of the founding or 2023 data exists, and publication bias has little
      direct footing in a programme whose modern phase published its own
      failures. The named list omits the procedural confound E023 identifies,
      and much of the weight is extrapolated from neighbouring literatures and
      from priors. The strongest opposing consideration is the residue: Flores's
      preregistered, permutation-tested Studies 1–2, and Bierman 2016 (E016)
      finding that realistic QRP rates explained only about 60% of the ganzfeld
      effect, leaving p = 0.003."
    confidence: moderate
  - claimId: MPI-C009
    verdict: provisionally_supported
    reasoning: "The first half has primary-text support. Analysing her first exact
      replication with both the founding method and a permutation test, Flores
      concludes that \"the original Z overestimates results, due to the
      dependency of the variables\" (E018), and the claim's anchor reports high
      intercorrelation among the psychological variables. The second half is
      inferred rather than shown: no record reports a dependence-aware
      reanalysis of the 1986–2006 datasets, whose raw data are unpublished, and
      E018 says as much. The strongest opposing consideration is that even in
      Flores's own data the permutation analysis lowered but did not eliminate
      the excess, since experimental sessions still produced more significant
      correlations than control. \"Substantially diminish\" is therefore
      unquantified, and the founding results may retain a residue. The
      permutation treatment of the matrix's \"future\" block is itself disputed
      within the thesis."
    confidence: moderate
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: In every documented instance the programme reads its failures as
      compatible with the model. Walach et al. 2021 calls its preregistered
      nulls "likely part of the systematic nature of such effects" (E003). The
      model's author restricts the dependence objection to "situations where
      causal signals hold," and the programme requires "some novelty" in each
      replication, so no study repeats another closely enough to fail as a
      replication (E019). When Flores's preregistered no-decline prediction
      failed with a reversal, the decline effect was listed among the
      explanations (E020); the design rationale concedes in advance that decline
      can never be fully overcome (E011). The strongest opposing consideration
      is that the model is not unfalsifiable in principle. By inference from the
      axiom, a stably replicating excess would breach it; the reciprocity is
      testable, the field prediction was operationalised (E013), and the
      programme did expose itself to a failable preregistered test (E020). The
      universal "no feasible outcome" also outruns a handful of instances, one
      of them a supervisee's second-hand summary of an unread 2016 source.
    confidence: moderate
