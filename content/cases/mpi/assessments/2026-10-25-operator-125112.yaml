caseAssessment:
  verdict: weakly_supported
  whatIsClaimed: Psi effects are real but are correlations between an observer and a physical system, not signals or forces. Because such correlations can never carry a message (the model's "no-transmission" axiom), any experiment that could turn them into a reliable signal will see them decline, change sign, or move to other variables. Correlation-matrix experiments, which spread the effect across many variable pairs instead of one outcome, are claimed to reveal them as a surplus of significant cells over control runs.
  whereDisagreementLives: "Everyone agrees the effects fade; the dispute is over why. MPI says the fading is the lawful signature of a real but unexploitable correlation, and points to matrix experiments where the effect appeared, moved and faded as it predicted. The conventional account says the early effects were never real: dependent variables inflated the cell counts, flexible analysis and selective publication supplied the positives, and regression to the mean supplied the decline. Both fit a fading record; they part over the early positives and over where effects reappear."
  whatWouldSettleIt: Adversarial, preregistered matrix replications with blind analysis, dependence-aware statistics agreed in advance by both sides, and the model's distinctive predictions about decline and displacement written down beforehand and accepted by its proponents as binding. Reanalysing the existing positive datasets with a null that keeps the dependence among cells would settle the program's origin story either way. A stable, exploitable psi signal anywhere would refute the model by its own axiom.
  bestConventionalExplanation: "No anomalous correlation exists. The variables in matrix experiments are dependent, so counting significant cells as if they were independent overstates the evidence — a point the program's own replicator now states of the founding method. Early positives are what analytic flexibility and selective publication produce from null data; decline is regression to the mean; displacement is multiplicity across thousands of cells. Each mechanism is documented in or near this corpus: a coding error behind one micro-PK effect, a post-hoc rescue of a null study, significance that broke down under improved analysis, a source contrast that appears or vanishes with the choice of analysis. The strictest test, a fully blind analysis of 200 participants, found nothing. Its residue: a few preregistered studies reported surpluses, and their authors were not naive statisticians."
  components:
    - label: The fading, shifting record (observation)
      state: well_supported
      note: Positives in early and in-house studies; nulls, a reversal and a post-hoc-only signal under stricter protocols.
    - label: The model's predictions, in print in advance
      state: well_supported
      note: Decline, sign change and displacement were derived in 2007, before the strict replications.
    - label: Real correlations behind the record
      state: weakly_supported
      note: The surviving positives are few, in-house or methodologically open, and none has passed a blind or dependence-preserving test.
  researchPriority:
    level: medium
    reason: The decisive tests are cheap — a dependence-preserving reanalysis of existing data, an equal-power random-source comparison, binding fine-structure predictions — but the paradigm's own proponents concede it does not replicate on demand, capping expected yield.
  loadBearing:
    - MPI-C001
    - MPI-C002
    - MPI-C005
    - MPI-C006
    - MPI-C009
  weakestLinks:
    - MPI-C007
    - MPI-C503
    - MPI-C010
  synthesis: "The verdict stays weakly supported: the record is sound at the bottom and at the theory layer, breaks at attribution, and this pass thins the attribution rung further. Reading the two Flores texts in full, rather than through summaries, changed three things. First, the dependence critique is now in the primary text: the thesis states that the founding method overestimates results because the variables are dependent (MPI-E018), which carries the first half of MPI-C009 directly; the founding datasets themselves remain unreanalysed. Second, the thesis's 'three of five' is narrower than it sounded (MPI-E007): the third positive had the author as sole participant, and the fourth study, preregistered to show no decline, reversed (MPI-E020), adding a preregistered failure to MPI-C002 and a sign change to MPI-C003. Third, the online study's split between true and pseudo-random sources holds on one of its two emphasised analyses and not the other (MPI-E021), and its pseudo-random arm was seeded from participants' swipes (MPI-E022); MPI-C503 drops to mixed, and the case's one apparent forward-looking contrast is unestablished. That study also treats 4,096 dependent cells as independent and generates control series differently (MPI-E023), so it qualifies rather than supports MPI-C007. MPI-C005 and MPI-C006 stand: the predictions are in print in advance, and the matrix design is the model's own chosen test. MPI-C010 stays mixed: the program did expose itself to a failable preregistered prediction, and when it failed, the thesis read it through a list in which the decline effect stood beside the experimenter and the instructions (MPI-E020), while the model's author, as reported, holds that the dependence objection applies only to causal signals, and the thesis adds that every replication must change (MPI-E019). Sensitivity: if Walach 2020 and Flores's first two studies were set aside as in-house, MPI-C007 would fall to contradicted; if a session-level reanalysis of the online data held its surplus, it would rise toward mixed."
  steelman: "The model's best case is that its critics demand of it what it says nature forbids. MPI predicted in print, before the strict replications, that any protocol good enough to exploit an effect would watch it fade, reverse or move — and the strict replications did exactly that, including a reversal in a study preregistered to show none. Meanwhile surpluses appeared in independent hands that were not careless: a two-laboratory replication in an APA journal evaluated against ten thousand simulated experiments, and two preregistered Edinburgh studies with outside participants that stayed significant under a permutation analysis designed to answer the dependence critique. On this view the null hypothesis explains the fading but not the pattern of who finds what and when, and the model's distinctive predictions — faster decline after stronger effects, reappearance in related variables — have simply never been put to a prespecified test. Until they are, 'weak' describes the evidence, not the theory's failure."
claimAssessments:
  - claimId: MPI-C001
    verdict: provisionally_supported
    reasoning: "That the founding reports exist and say what they say is documented. That their surpluses were computed against a valid null is now contested in the primary text from inside the program: the replicator who repeated the founding method concludes it overestimates results because the variables are dependent. The raw data have never been published for an independent reanalysis."
    confidence: moderate
    treatment:
      plainLanguage: In the founding experiments, participants pressed keys trying to "influence" a random event generator. Nobody scored hits in the ordinary sense — instead, the experimenters counted how many correlations between behaviour variables and machine variables came out statistically significant, and reported more of them than control runs gave.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: If the surpluses are statistically sound, something needs explaining — though it could still be an artefact rather than an anomaly. If they are unsound, the program's foundation shifts to the later, stricter replications.
      strongestObjection: "The founding analyses counted significant cells against an independence assumption the data violate, and the replicator who repeated them says so: the original Z score overestimates results because the variables are dependent."
      whatWouldChangeOurMind:
        - A dependence-aware reanalysis of the original 1986–2006 datasets, in either direction.
        - Publication or archiving of the original raw data, which would make such a reanalysis possible.
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: "The strictest tests are null: Grote's 200-participant blind analysis fell well within the random distribution, the proponents' two consensus-protocol replications were null, Grote's 2017 preplanned analyses were null, and the last two of Flores's five preregistered studies failed — one with a reversal. The exceptions are Walach 2020, for which no preregistration is recorded and which its authors later called fragile, and Flores's first three studies, the third with the author as sole participant."
    confidence: high
    treatment:
      plainLanguage: When the matrix experiment was rerun under the strictest modern rules — analysis plans frozen in advance, in one case the entire analysis software written and tested before anyone looked at the data — the effect mostly disappeared.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "This is the case's central twist: a null replication record undermines the anomaly reading and at the same time matches MPI's own decline prediction. By itself it cannot separate the hypotheses — which is why the falsifiability question exists."
      strongestObjection: "\"Predominantly\" is doing work: Flores's first two preregistered studies, with outside participants and her own equipment checks, stayed significant under a permutation analysis — the record is messier than a clean null."
      whatWouldChangeOurMind:
        - Further adversarial blind-analysis replications, in either direction.
        - A significant result under a full blind-analysis protocol would remove the 'strictest tests are null' pattern.
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "Accurate as a sequence of published outcomes: Lucadou's positives; Walach 2020's effect, whose significance broke down under improved analyses; Grote's 2015 positive followed by his own nulls and a post-hoc-only signal; the 2021 consensus failures; and Flores's three positives followed by a preregistered study in which experimental sessions fell below control, then a null. Whether there was ever a real effect to decline is not part of this claim."
    confidence: moderate
    treatment:
      plainLanguage: "Across four decades, the matrix effect has behaved like a bar of wet soap: strong in early reports, weaker or absent in stricter reruns, once reversed outright, and when something did show up later, it tended to show up somewhere else — different cells, different analyses, different variables."
      importance: major
      diagnosticity: low
      diagnosticitySummary: Regression to the mean produces this trajectory from null data filtered by publication. The pattern is at home in both rival explanations, which is what makes the attribution question necessary.
      strongestObjection: '"Decline and displacement" is a narrative laid over a small, varied set of studies with different designs, power and analyses; no prespecified measure of decline has been defined and then applied across the series.'
      whatWouldChangeOurMind:
        - A quantitative, prespecified decline and displacement measure applied across the full corpus.
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: "The framework is published in a serious foundations venue and is internally coherent as far as reviewed. Its cost is candour about lost power: without Hilbert-space structure it assigns no probabilities to outcomes, so it constrains data only qualitatively."
    confidence: moderate
    treatment:
      plainLanguage: 'The model is not hand-waving about "quantum consciousness": there is a published axiomatic framework that keeps the algebraic structure of quantum theory (observables that cannot be measured together, entanglement between parts of a system) while dropping its physical constants, and MPI is a special case of it. Whether that formalism describes reality is a separate question from whether it exists and is coherent.'
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A coherent formalism proves availability, not truth. Its main evidential role is to make MPI's predictions derivable rather than ad hoc.
      strongestObjection: By discarding the quantitative machinery, the framework keeps quantum theory's vocabulary while giving up nearly all of its predictive risk — no derivation says how large any effect should be, or when.
      whatWouldChangeOurMind:
        - A derivation in the framework yielding quantitative, parameter-fixed predictions for a matrix experiment.
        - A demonstrated internal inconsistency in the axiom system.
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: 'As a statement of what the model says, this is verbatim in the 2007 paper, which also derives the corollaries: decline that is faster when the original effect was stronger, sign reversal, and reappearance "in different observables and/or between different parts of the system." Whether the axiom is true of nature is the attribution question, not this claim.'
    confidence: high
    treatment:
      plainLanguage: The model's core rule is that these correlations can never be used to send a message. A perfectly replicable psi experiment would be a message channel — so the model says perfect replication cannot happen, and it published this consequence before the stricter replications were run. The decline effect, usually psi research's embarrassment, is here a theorem.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: "This is what sets MPI apart from both conventional scepticism and conventional psi advocacy: it predicted, in print and in advance, that stricter protocols would show weaker effects. The prediction is real; the trouble is that the null hypothesis makes the same one."
      strongestObjection: 'A prediction shared with the null hypothesis earns no credit: regression to the mean also "predicts" that stricter, larger replications show weaker effects. The distinctive content — displacement structure, faster decline after stronger effects — has never been tested against a prespecified measure.'
      whatWouldChangeOurMind:
        - A prespecified test of the model's distinctive fine structure (displacement patterns, decline-rate reciprocity) succeeding or failing.
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: Documented as the design's stated rationale in the theorists' own words. The matrix experiments are therefore not an arbitrary paradigm but the model's self-nominated benchmark, so their replication record is the primary evidence for and against MPI.
    confidence: high
    treatment:
      plainLanguage: Lucadou did not just explain away failed replications — he designed an experiment his theory says should work anyway. If no single number counts as "the result," no signal can be coded, so the no-transmission rule is not violated and the correlations are allowed to show up as a surplus of significant cells scattered through a matrix.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Cuts both ways. It makes the matrix record binding on MPI in a way generic psi results are not — and it means the blind-analysis failures land on the model's own chosen ground.
      strongestObjection: A design that predicts "transitory, jumping, unexpected" patterns in a large matrix describes what multiple testing produces from pure noise; it turns the multiplicity problem into the predicted signature, which is why dependence-aware statistics decide the matter here.
      whatWouldChangeOurMind:
        - Proponent agreement on a dependence-aware standard for what counts as a matrix 'hit'.
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: What supports the thesis is thin. Walach 2020 was called fragile by its own authors; Flores's three positives include one with the author as sole participant, and her later two studies failed; the large online study treats dependent cells as independent and generates its control series differently. The strictest test was null, the founding counts are conceded inflated, and every conventional mechanism the rival needs is documented in this corpus.
    confidence: moderate
    treatment:
      plainLanguage: "The featured thesis: the matrix experiments really did catch something — a real connection between minds and machines that by its nature cannot be pinned down — and the fading, shifting record is that something behaving as the theory says it must."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself. Everything below it on the ladder exists to test it against the conventional account.
      strongestObjection: "The explanation is unfalsifiable in practice as deployed: successes confirm the correlations and failures confirm the elusiveness — while the conventional account explains the same record with mechanisms already caught operating in it."
      whatWouldChangeOurMind:
        - Success or failure of prespecified displacement predictions in adversarial replications.
        - Dependence-preserving reanalysis of the founding or the 2023 online datasets keeping (or losing) their surpluses.
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each mechanism is documented in or near this corpus: dependence inflation (conceded of the founding method by its replicator), analytic flexibility (Grote 2017's post-hoc-only significance; a source contrast that depends on the analysis chosen), error-driven false positives (Maier and Dechamps), publication bias (Bösch 2006). What keeps this short of well supported: no one has shown that these mechanisms reproduce the specific published record, and the strongest neighbouring simulation (Bierman 2016) explained about 60% of a ganzfeld effect, not all of it."
    confidence: moderate
    treatment:
      plainLanguage: 'The conventional steelman: nothing was ever there. Dependent variables made "significant cells" cheap, flexible analysis and selective publication made early positives likely, and when protocols tightened, results regressed to the nothing they came from. Each of those mechanisms has been caught operating somewhere in this literature.'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: The direct rival to the featured thesis. If it holds, MPI's central evidence dissolves; if it can be shown insufficient under adversarial conditions, what remains is genuinely anomalous.
      strongestObjection: Walach et al. 2020 was large, two-laboratory and evaluated against ten thousand simulated experiments, and still reported a surplus; Flores's first two preregistered studies stayed significant under a permutation analysis built to answer the dependence critique. The mundane account predicts stricter methods kill the effect — mostly they did, but not cleanly everywhere.
      whatWouldChangeOurMind:
        - A selection-and-dependence simulation calibrated to the actual matrix corpus reproducing (or failing to reproduce) its published record.
        - A significant matrix result under full blind analysis, which this explanation predicts should not occur.
  - claimId: MPI-C009
    verdict: provisionally_supported
    reasoning: "The first half now rests on the primary text: the thesis replicating the founding method concludes that its Z score overestimates results because the variables are dependent, and that permutation analysis lowered them. The second half — that dependence-aware reanalysis diminishes the founding results themselves — is inferred, because no reanalysis of the 1986–2006 datasets has been published."
    confidence: moderate
    treatment:
      plainLanguage: 'The sharpest technical objection: counting significant cells only means something if the cells are independent. The psychological variables in these matrices correlate with each other, so "significant" cells come in bundles. Analyses that respect this shrink the headline numbers.'
      importance: major
      diagnosticity: high
      diagnosticitySummary: It attacks the load-bearing statistic of the founding experiments. If it holds in full, the program's origin story weakens from "anomaly detected" to "artefact detected."
      strongestObjection: In Flores's own studies the permutation analysis lowered the surplus but did not remove it, and the model's author holds that the objection applies only to causal signals — the critique shrinks the founding results but has not, on its own terms, zeroed out the program.
      whatWouldChangeOurMind:
        - An independent, published dependence-aware reanalysis of the 1986–2020 matrix datasets.
  - claimId: MPI-C010
    verdict: mixed
    reasoning: "The pattern is documented: the proponents read their consensus failures as likely part of the systematic nature of such effects; the model's author, as the thesis reports him, holds that the dependence objection applies only to causal signals, and the thesis adds that every replication must introduce something new; and when a preregistered no-decline prediction failed, the thesis listed the decline effect among the explanations. But the program did expose itself to that failable prediction, the axiom forbids any stable psi channel, and the 2021 authors conceded the paradigm is not replicable."
    confidence: moderate
    treatment:
      plainLanguage: "The falsifiability tension, stated as a claim about scientific practice rather than philosophy: if heads confirms the theory and tails confirms it too, the theory has stopped taking risks. The live question is whether MPI's proponents have ever specified an outcome they would accept as a refutation — and whether the model's structure permits one."
      importance: major
      diagnosticity: high
      diagnosticitySummary: This is the crux that decides how much the replication record can ever mean. If MPI has no bindable predictions, the case ends in philosophy; if its fine structure can be prespecified and tested, the case returns to the laboratory.
      strongestObjection: "MPI is falsifiable in principle and has been in practice: the axiom forbids any stable psi channel, the matrix surplus was a positive prediction, a doctoral study preregistered a no-decline prediction that could and did fail, and the decline-rate and displacement corollaries could be prespecified tomorrow. The insulation is a habit of interpretation, not a theorem of the model."
      whatWouldChangeOurMind:
        - Proponents publishing binding disconfirmation criteria — or explicitly declining to.
        - A prespecified fine-structure test whose outcome proponents accept as evidence either way.
  - claimId: MPI-C503
    verdict: mixed
    reasoning: The abstract reports exactly this split, at the final cumulative matrix. But the paper emphasises a second analysis, the average over cumulative matrices, on which the pseudo-random arm is also significant (p = 0.002); and that arm was seeded from the timing of participants' swipes, so it was neither deterministic nor independent of their behaviour. The split rests on one of two analyses and on effect-size thresholds the pseudo-random arm narrowly misses.
    confidence: moderate
    treatment:
      plainLanguage: The large online replication was reported as finding the effect with a genuinely random source (atmospheric noise) but not with a computer's pseudo-random generator — the split quantum-flavoured theories want. Read in full, the paper shows the split on one of its two main analyses, not the other, and its pseudo-random generator took its seed from participants' own finger movements.
      importance: supporting
      diagnosticity: moderate
      diagnosticitySummary: "If it held, it would be one of the few forward-looking contrasts in the case: MPI-family theories expect the source to matter, the conventional account expects it not to. As reported, it cannot carry that weight."
      strongestObjection: The authors judge by power and minimum-effect criteria fixed in their method, on which only the true-random arm passes on both analyses; a split on those criteria is still a split.
      whatWouldChangeOurMind:
        - A preregistered equal-power comparison with a pseudo-random sequence fixed before the session.
        - A dependence-preserving reanalysis of the 2023 data keeping or erasing the contrast.
