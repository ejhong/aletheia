  synthesis: >-
    The ledger clearly establishes the documentary architecture of MPI more
    strongly than its empirical truth. Its no-transmission axiom, associated
    decline and displacement prediction, and correlation-matrix design were
    stated explicitly rather than invented after the latest failures. The
    observed record also has the broad shape MPI describes: early positive
    reports were followed by weaker, null, reversed, or analytically displaced
    results. Two preregistered consensus-protocol replications were null,
    Grote's fully blind independent experiment was null, and Flores's program
    went from three positive studies to two planned-analysis failures, with a
    later positive appearing only after post hoc pooling. Thus the decline
    pattern itself is well supported.

    The strongest case for MPI is that a published prediction of unstable,
    migrating effects was followed by just such instability, while some
    anomalous-looking results survived elementary statistical correction. Most
    importantly, MPI-E018 reports that dependence-aware permutation analysis
    retained substantial surpluses in Flores studies 1–3; in study 1, only 2 of
    10,000 permuted matrices reached the observed correlation count. The 2020
    two-laboratory study also reported a positive result, although its authors
    later described it as fragile. These records prevent a clean conclusion that
    every positive matrix result has already been reduced to an identified
    artifact.

    The opposing case is stronger overall. The methodologically strictest
    prospective tests produced null results, whereas positive findings are
    concentrated in older, flexible, post hoc, internally related, or
    dependence-sensitive analyses. One of Flores's three positive studies used
    the experimenter herself as its sole participant. The online study treated
    4,096 dependent matrix cells as the sample, used procedurally different
    experimental and control sessions, and did not directly test a difference
    between generators. Its advertised true-random versus pseudo-random split
    also disappears on the paper's average analysis, where both arms are
    significant in the same direction. Ordinary regression, selection, analytic
    flexibility, dependence, and publication processes therefore provide a
    provisionally adequate account, although the ledger does not contain a
    complete quantitative reconstruction of every result.

    Most importantly, the observed decline is not diagnostically distinctive:
    noisy effects selected for initial significance decline under replication
    even without psychophysical entanglement. MPI has not supplied and passed a
    prespecified quantitative test of its claimed reciprocity between initial
    strength and reproducibility, nor a binding prediction of where displaced
    effects should appear. Proponents' treatment of preregistered failures as
    manifestations of the model substantially insulates the central attribution
    from the very experiments nominated to test it. A general scientific prior
    against a novel non-local psychophysical process raises the evidentiary
    threshold, but the verdict does not depend on that prior: the internal
    contrast between fragile positives and rigorous nulls already limits the
    case to weak support.

    The sensitivity record is MPI-E018, the only first-hand, dependence-aware
    positive reanalysis in the ledger. Removing it would eliminate the strongest
    answer to the statistical-dependence critique and would change the case
    verdict from weakly_supported to contradicted; the present verdict therefore
    does not survive its removal and hangs substantially on that one qualified
    evidence line.
  steelman: This assessment does not explain why Flores study 1 retained 316
    above-threshold correlations when its dependence-aware permutation matrices
    averaged 163 and only 2 of 10,000 permutations reached the observed count,
    with studies 2 and 3 reportedly retaining surpluses as well. No evidence
    record demonstrates a conventional mechanism that reproduces those corrected
    within-program results while also generating their later decline.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: MPI-E001 records that Lucadou's 1986–2006 experiments were reported
      as producing excess experimental-session correlations, and successor
      publications consistently describe them that way. MPI-E002 supplies a
      later positive result from the same research program but does not directly
      verify the original series. The strongest opposing consideration is that
      the founding texts and raw data were not examined, so this establishes the
      history of the reports more securely than the validity of their
      significance calculations.
    confidence: moderate
  - claimId: MPI-C002
    verdict: established
    reasoning: MPI-E003 documents two null preregistered consensus-protocol
      replications, MPI-E004 a null independent blind analysis of 200
      participants, and MPI-E006 null results for all three preplanned analyses
      in an earlier study. Together these directly establish that preregistered
      and blind tests have predominantly failed. The strongest opposing
      consideration is Flores's partial replication record, but its permutation
      analysis was adopted after earlier analysis of the data and therefore does
      not overturn the claim about strict prospective tests.
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: MPI-E003, MPI-E005, MPI-E006, and MPI-E019 document sequences in
      which initial significance was followed by null, reversed, or post hoc
      findings. MPI-E014 describes the same broad instability across the
      surrounding parapsychology literature. The strongest opposing
      consideration is that instability alone does not distinguish MPI from
      regression, selection, or sampling noise, but that attribution issue does
      not negate this observational claim.
    confidence: high
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: MPI-E010 establishes that Generalized or Weak Quantum Theory is an
      axiomatized framework extending complementarity and entanglement to
      arbitrary systems while dropping ordinary quantum theory's Hilbert-space
      machinery and Planck's constant. The associated MPI theory records show
      that the framework is applied to psychophysical correlations. The
      strongest opposing consideration is that the evidence record does not
      directly set out pragmatic information as a mathematically operational
      ordering quantity, and the framework supplies no quantified probability or
      effect-size predictions.
    confidence: moderate
  - claimId: MPI-C005
    verdict: established
    reasoning: MPI-E009 quotes the no-transmission axiom and the published
      derivation that attempted replication should wipe out apparent effects,
      potentially making them reverse, disappear, or move to other observables.
      This establishes the model's stated entailment before the later 2017–2021
      replication failures. The strongest opposing consideration is that a
      theory paper establishes what MPI says, not whether the entailment
      describes nature.
    confidence: high
  - claimId: MPI-C006
    verdict: established
    reasoning: "MPI-E011 directly states the matrix design's rationale: register
      many possible correlations so that transient and displaced patterns can
      appear without furnishing a stable signal. MPI-E012 supplies contextual
      confirmation that proponents presented the method as an answer to the
      repeatability problem. The strongest opposing consideration is that both
      records describe proponents' intentions and do not establish that the
      design actually separates anomalous correlations from statistical
      multiplicity."
    confidence: high
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: "MPI-E002 and especially MPI-E018 provide some positive evidence:
      significant matrix surpluses were reported, and several Flores surpluses
      persisted under dependence-aware permutation. Against this, MPI-E003 and
      MPI-E004 are rigorous prospective nulls, while MPI-E020 and MPI-E022
      expose serious weaknesses in later positive evidence. The records do not
      demonstrate the specifically non-local psychophysical attribution rather
      than selection, procedural artifacts, or noise; a prior against a novel
      non-local mechanism further raises the required evidentiary standard. The
      strongest opposing consideration to the negative assessment remains the
      corrected study-1 surplus in MPI-E018, which has not been reduced to a
      demonstrated artifact."
    confidence: moderate
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: MPI-E006 demonstrates analytic flexibility within a single
      matrix-family dataset, MPI-E015 documents strong small-study and
      publication-bias patterns in the broader REG literature, and the strict
      null replications fit regression and selection accounts. MPI-E009 and
      MPI-E022 add a concrete dependence problem capable of overstating matrix
      significance. The strongest opposing consideration is MPI-E018, where
      correcting for dependence did not erase the surpluses in three Flores
      studies, while MPI-E016 shows that modeled research practices did not
      explain an entire neighboring database. Because no evidence record jointly
      models the complete matrix record, sufficiency is provisional rather than
      established.
    confidence: moderate
  - claimId: MPI-C009
    verdict: mixed
    reasoning: MPI-E018 directly confirms that matrix cells are not independent and
      shows that an old control comparison understated the appropriate null
      count, while MPI-E022 identifies the same assumption in the 2023 analysis.
      However, MPI-E018 did not reanalyze Lucadou's founding 1986–2006 datasets,
      and the Flores study-1 surplus remained large after permutation. The
      strongest opposing consideration is therefore that the dependence premise
      is supported but the claim that a dependence-aware reanalysis
      substantially diminishes the founding results has not been directly
      demonstrated.
    confidence: moderate
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: MPI-E003 records proponents concluding that the matrix paradigm is
      not replicable while interpreting its failed replications as part of the
      effect's systematic nature. MPI-E011 anticipates that the design can never
      fully overcome decline, so positive outcomes support anomalous correlation
      while central null outcomes remain compatible with the model. The
      strongest opposing consideration is MPI-E013, which shows that at least
      one field prediction can be operationalized and was acknowledged as
      unsupported, and MPI-E009 contains quantitative strength–reproducibility
      language that could become falsifiable. No formal elicitation has yet
      established the universal assertion that proponents would reject every
      feasible disconfirming outcome.
    confidence: moderate
  - claimId: MPI-C503
    verdict: mixed
    reasoning: MPI-E008 confirms that the last-datapoint analysis was significant
      for Random.org and nonsignificant for Mersenne Twister. MPI-E021 shows
      that the paper's average analysis instead found a significant Mersenne
      Twister result with the same experimental-positive and control-negative
      pattern as the true-random arm. The study never directly tested the two
      generators against each other, and its swipe-timestamp seeding further
      weakens the interpretation of Mersenne Twister as a deterministic control.
      The strongest opposing consideration is the genuine last-datapoint
      contrast, but significance in one arm and not another does not establish
      that the experimental–control difference depended on source type.
    confidence: high
