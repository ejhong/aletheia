  synthesis: "The ledger separates three rungs cleanly, and they do not support
    one another equally. On the observation rung, the record is comparatively
    clear. The original Lucadou-group matrix series and the 2020 two-lab report
    claimed surplus experimental-versus-control correlations (C001), while the
    preregistered consensus-protocol replications and Grote's fully blinded
    200-participant run returned nulls on their primary analyses (C002). Within
    and across series, initially positive patterns weakened, reversed, or moved
    to other cells and post-hoc variants (C003; Grote 2015–2021; Flores studies
    1–3 versus 4–5). That decline-and-displacement pattern is real as a
    literature fact. On the mechanism rung, the theory content is also clear as
    text: Generalized Quantum Theory exists as a published weak-quantum
    axiomatization (C004); the no-transmission axiom is stated in 2007 and is
    used there to derive decline, sign-change, and displacement in advance of
    the later failures (C005); and the matrix design is explicitly offered as
    the model's own way to harvest unexploitable, jumping correlations (C006).
    None of that textual clarity is empirical support for psychophysical
    entanglement. The attribution rung is where the featured hypothesis lives,
    and there the evidence is thin. C007 requires that the early positives and
    subsequent instability be produced by genuine non-local correlations of the
    MPI kind. Against that stand (i) dependence among psychological variables
    that violates the independence assumptions of the founding significance
    counts, with Monte Carlo and permutation work diminishing those counts and
    confirming that matrix cells are not independent observations (C009; Flores
    thesis and Filk appendix); (ii) a broader micro-PK literature already
    consistent with tiny heterogeneous effects, small-study bias, analytic
    flexibility, and at least one documented coding-error false positive (C008;
    Bösch, Bierman's partial QRP coverage, Maier & Dechamps, Grote's own
    post-hoc salvage); and (iii) the proponents' own habit of reading both hits
    and misses as model-consistent, so that the nominated paradigm's failure is
    absorbed as \"the systematic nature of such effects\" (C010; Walach 2021).
    Residual positives remain—Flores studies 1–2 under permutation, the 2020
    surplus before analysis variants, the 2023 online last-datapoint true-RNG
    arm—but each is qualified by shared equipment and personnel, experimenter-
    as-participant design, non-deposited data, cell-as-sample testing, or
    alternative analyses in which the pseudo-RNG arm is also significant.
    Conventional selection and dependence mechanisms are jointly sufficient for
    the observed arc; MPI's distinctive content is not required. The case
    verdict is therefore weakly_supported for the featured hypothesis that MPI
    correctly describes a law-like decline of real mind–matter correlations: the
    observational pattern matches what MPI advertises, but the same pattern is
    the expected signature of a null effect under flexible analysis, and the
    model's own best tests have not produced a stable, dependence-aware,
    preregistered surplus that would force the anomalous reading. A verdict
    hanging primarily on the failed strict replications plus the dependence
    critique would soften if either were removed, but would not reverse without
    new positive evidence under binding protocols."
  steelman: "Filk's dependence-aware permutation appendix still finds a large
    surplus of high correlations in Flores studies 1–3 against reshuffled
    physical data (study 1: 316 cells ≥0.12 versus permuted mean 163, only
    2/10,000 matches), which is not explained by the old control-matrix artifact
    and has not been shown to be a procedural confound; a proponent can rightly
    treat that residual, together with the still-untested 2007
    strength–reproducibility reciprocity prediction, as an unpaid empirical debt
    for the pure-noise account."
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: Multiple secondary descriptions (Walach 2020/2021, Grote 2021) and
      the 2006 proceedings line consistently state that Lucadou-group matrices
      yielded more significant psychological–physical correlations in
      experimental than control sessions. The claim is about what was reported,
      not whether the reports survive dependence-aware reanalysis; the strongest
      opposing consideration is that original raw data remain unpublished and
      the characterizations are partly second-hand.
    confidence: high
  - claimId: MPI-C002
    verdict: established
    reasoning: Walach et al. 2021's two preregistered consensus-protocol
      replications were both non-significant on the nonparametric randomization
      test, and Grote 2021's fully pre-written blind analysis of 200
      participants fell inside the random distribution; Grote 2017's three
      preplanned analyses were likewise null. The strongest opposing
      consideration is incomplete power in the smaller 2021 arm and Grote's two
      p≈0.06 secondary results, which do not overturn the primary nulls.
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: 'Within-experimenter and within-program arcs show the instability the
      claim describes: Grote 2015 significant then 2017/2021 null on preplanned
      tests; Walach 2020 surplus then 2021 failures; Flores studies 1–3 surplus
      then studies 4–5 null or reversed under planned analysis, with only
      post-hoc pooling recovering a positive. Kennedy 2003 documents the same
      class of pattern field-wide. The strongest opposing consideration is that
      some later positives (Flores permutation leftovers; 2023 online arm)
      exist, so "not stable" is not "never reappears."'
    confidence: high
  - claimId: MPI-C004
    verdict: established
    reasoning: Atmanspacher, Römer & Walach 2002 publish an explicit weak-quantum
      axiomatization retaining complementarity and entanglement without
      Hilbert-space structure, and the 2007 JCS paper instantiates that frame
      for psychophysical systems with pragmatic information as the ordering
      quantity. The claim is descriptive of the published formalism, not a claim
      that the formalism is empirically true; the opposing consideration is only
      that dropping quantitative quantum machinery also drops sharp effect-size
      predictions.
    confidence: high
  - claimId: MPI-C005
    verdict: established
    reasoning: The 2007 JCS text states the no-transmission axiom verbatim and
      derives from it, in advance of the later nulls, that apparent effects will
      be wiped out under replication attempts, may change sign or displace to
      other observables, and that stronger effects should decline faster. This
      record fixes the prediction as ex ante model content rather than retrofit.
      The strongest opposing consideration is that the derivation is qualitative
      and supplies no prespecified metric for how fast or where displacement
      must occur.
    confidence: high
  - claimId: MPI-C006
    verdict: established
    reasoning: The same 2007 paper explicitly recommends harvesting evasion by
      registering many correlations at once so that psi appears as transitory,
      jumping matrix patterns, and binds that design to the decline problem.
      Later program practice treats the matrix as the model's home test. The
      opposing consideration is authorial self-description rather than
      independent methodological consensus, which does not undercut the claim as
      stated about design intent.
    confidence: high
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: Attribution to genuine MPI-type non-local correlations rests on early
      reported surpluses and a few dependence-aware leftovers (Flores/Filk
      studies 1–3; 2020 fragile surplus; 2023 true-RNG last-datapoint arm), but
      is undercut by preregistered and blind nulls on the model's own paradigm,
      cell-dependence inflating significance counts, experimenter-as-sole-
      participant design in one positive study, non-deposited online data, and
      conventional mechanisms sufficient for the same arc. The strongest
      opposing consideration is exactly those Filk permutation surpluses, which
      have not been fully explained away as artifact.
    confidence: moderate
  - claimId: MPI-C008
    verdict: well_supported
    reasoning: Bösch 2006 finds tiny heterogeneous micro-PK effects with strong
      small-study/publication-bias signatures; Bierman 2016 shows QRPs can
      account for a large fraction of a flagship psi meta-effect; Maier &
      Dechamps document a coding-error false positive inside correlational
      micro-PK; Grote 2017 shows a preplanned-null dataset yielding p=0.012 only
      after a post-hoc variant; and matrix-cell dependence supplies an
      in-paradigm inflation route. Jointly these suffice for early positives
      plus decline without anomaly. The strongest opposing consideration is
      Bierman's residual significance after modeled QRPs in ganzfeld, which may
      not transfer to the smaller matrix corpus.
    confidence: moderate
  - claimId: MPI-C009
    verdict: well_supported
    reasoning: Flores's work and Filk's appendix state directly that the 45×45 (and
      by extension similar) matrix entries are not independent because
      psychological variables intercorrelate, and that control-style counting
      overstated surplus relative to a permutation null; Monte Carlo simulations
      are reported to diminish the earlier significant results. The claim's
      founding-result half is supported by that program-internal critique even
      though Filk reanalyzed Flores's replications rather than the 1986–2006 raw
      files. The strongest opposing consideration is that studies 1–3 still beat
      the permutation null, so dependence reduces but does not automatically
      erase every surplus.
    confidence: moderate
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: Under the NT axiom, both stable replication and failed replication
      are model-consistent (signal forbidden; decline expected), and Walach et
      al. 2021 explicitly read their own preregistered nulls as "likely part of
      the systematic nature of such effects" while retaining the model—the
      insulation pattern the claim names. The matrix rationale itself concedes
      it will not convince every sceptic. The strongest opposing consideration
      is that field predictions (e.g., Watt & Tierney documentation effect) are
      in principle operationalizable, so insulation is a deployment habit rather
      than a formal impossibility of any test.
    confidence: high
  - claimId: MPI-C503
    verdict: mixed
    reasoning: The 2023 preprint's last-datapoint analysis does show a significant
      experimental–control difference with Random.org and not with Mersenne
      Twister, matching the claim's surface statement, but the paper's average-
      across-cumulative-matrices analysis is significant for the pseudo-RNG arm
      as well, both arms share the experimental-positive/control-negative sign
      pattern, the pseudo-RNG was swipe-seeded rather than a pure deterministic
      control, no direct generator-contrast test is reported, and the t-test
      treats 4,096 fragmented cells as the sample under the same independence
      problem raised against the founding work. The strongest opposing
      consideration is the headline true-RNG p-value at large N, which remains
      directionally interesting if a session-level reanalysis preserved a
      generator difference.
    confidence: moderate
