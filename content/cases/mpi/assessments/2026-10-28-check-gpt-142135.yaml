      quantitatively defined ordering quantity, so the full compound claim is
      less well evidenced than the existence of GQT itself.
    confidence: moderate
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: MPI-E009 directly quotes the no-transmission axiom and the published
      derivation that attempts to improve or replicate an exploitable effect
      will wipe it out, change its sign, or move it to other observables. This
      establishes the model's stated prediction and shows that it preceded the
      major 2017–2021 failures; it does not establish that the prediction is
      true. The strongest opposing consideration is that the source provides no
      quantitative bridge showing that no-transmission logically requires a
      specified rate or form of decline.
    confidence: moderate
  - claimId: MPI-C006
    verdict: established
    reasoning: MPI-E011 explicitly states that the design registers many
      simultaneous correlations so that psi can appear as transient, jumping
      patterns without yielding a stable signal. This directly documents both
      the construction and the intended MPI rationale of the correlation-matrix
      experiment. The strongest opposing consideration is that this is the
      theorists' own methodological description, but independent attestation is
      unnecessary for establishing what they designed the experiment to test.
    confidence: high
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: Dependence-aware surpluses in Flores studies 1–3 provide the
      strongest support, supplemented by the fragile 2020 result and the
      qualified 2023 online result. None of these records identifies non-local
      psychophysical correlation as the cause, and some involve unblinded, post
      hoc, self-participant, or cell-dependence concerns. The strongest opposing
      consideration is the convergence of the preregistered proponent-led
      failures and Grote's fully blind null result, which is the expected
      pattern under an ordinary null without establishing MPI's attribution.
    confidence: moderate
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "MPI-E006 demonstrates analytic flexibility within this program,
      MPI-E015 supports publication-bias and small-study explanations in the
      neighboring REG literature, and MPI-E024 establishes the matrix-cell
