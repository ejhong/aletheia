    confidence: high
  - claimId: MPI-C504
    verdict: established
    reasoning: MPI-E024 directly explains that 2,025 matrix entries are generated
      from only about 90 variables, some structurally intercorrelated, so the
      cells cannot be independent tests. The whole-experiment permutation
      procedure in MPI-E018 preserves precisely this dependence and confirms its
