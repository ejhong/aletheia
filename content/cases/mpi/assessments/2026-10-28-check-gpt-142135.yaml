      detailed demonstration concerns Flores's 45-by-45 implementation, but the
      same structural issue applies to the described founding design when many
      cells are generated from a few intercorrelated variables.
    confidence: high
  - claimId: MPI-C010
    verdict: provisionally_supported
    reasoning: "MPI-E003 documents proponents interpreting two preregistered
      failures as likely part of the systematic nature of the effect, while
      MPI-E011 anticipates that the nominated design cannot overcome decline
      completely. Together these show the central insulating move in actual
      deployment: positive outcomes support anomalous correlation and nulls can
