    reasoning: MPI-E003 supplies two nonsignificant preregistered consensus-protocol
      replications, MPI-E004 supplies a nonsignificant fully blind
      200-participant replication, and MPI-E006 reports null results for all
      three preplanned analyses in another study. These records directly
      establish that strict replications have predominantly failed. The
      strongest opposing consideration is the partial Flores record, but its
      positive permutation analyses were not shown to have been preregistered
