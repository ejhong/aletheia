  synthesis: >-
    The record firmly establishes the descriptive decline pattern but only
    weakly supports MPI's explanation of it. Lucadou's early program was
    reported as producing excess correlations, although the underlying data have
    not been independently reanalyzed and the original characterization is
    partly second-hand. Later evidence is much stronger: two preregistered
    consensus-protocol replications were nonsignificant, Grote's fully blind
    200-participant analysis fell within its random distribution, and Grote's
    earlier study produced null results on every preplanned analysis while a
    significant result appeared only post hoc. Flores's sequence likewise moved
    from three positive studies to two null or reversed studies, with
    significance recovered only through post hoc pooling. Thus instability under
    replication is not merely alleged; it is a well-supported feature of this
    program.

    The strongest case for MPI is that decline and displacement were stated in
    the theory literature before the most rigorous later failures, rather than
    invented solely in response to them. The matrix design was expressly
    intended to accommodate transient effects, and Flores's dependence-aware
    permutation analysis retained substantial surpluses in studies 1–3,
    including a large study-1 excess. A fragile positive 2020 result and the
    2023 online experiment add further positive observations, although the
    latter's headline generator split applies only to its last-datapoint
    analysis. These results prevent the evidence from being summarized as an
    entirely featureless sequence of nulls.

    The strongest case against MPI is methodological and comparative. The
    cleanest preregistered and blind tests were null, while positive results are
    disproportionately associated with fragile analyses, post hoc choices,
    nonindependent matrix cells, or procedurally nonequivalent controls. The
    2023 analysis treated 4,096 cells generated from a small set of variables as
    its sample, and its other analysis found significance in the pseudo-random
    arm as well. Ordinary regression, selection, dependence, and analytic
    flexibility therefore reproduce the qualitative pattern without requiring
    non-local psychophysical correlations. This conventional account is only
    provisionally supported, however: no supplied record performs a complete
    dependence-aware reanalysis of Lucadou's 1986–2006 data, and corrected
    surpluses in the Flores studies remain unexplained.

    Consequently, the evidence gives weak support rather than confirmation to
    the featured hypothesis. MPI successfully describes a pattern, but the same
    pattern is expected when initially selected positives regress under stricter
    methods, and the model supplies no quantitative probability, effect
    trajectory, or binding displacement location that discriminates those
    explanations. The negative attribution judgment also partly reflects the
    prior scientific implausibility of an unmeasured non-local psychophysical
    mechanism relative to demonstrated statistical failure modes; the records
    alone do not prove the mechanism impossible. Proponents' treatment of
    preregistered failures as manifestations of the theory further limits
    empirical updating, although fine-structure predictions could still make the
    model testable if fixed in advance.

    The sensitivity record is MPI-E018. Removing it would eliminate the
    strongest dependence-aware positive evidence and move the balance
    substantially closer to contradiction; the weakly_supported verdict
    nevertheless survives, supported at a lower level by the reported early and
    modern positives. The verdict therefore does not hang on that single record.
  steelman: "MPI-E018 leaves a specific anomaly unanswered: after whole-experiment
    permutation preserved the matrix dependence, Flores study 1 still had 316
    correlations at or above 0.12 against a permutation average of 163, with
    only 2 of 10,000 permuted matrices reaching 316, and studies 2 and 3
    reportedly retained surpluses as well. This assessment does not identify the
    procedural or statistical mechanism that generated those corrected
    excesses."
