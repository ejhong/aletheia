      proponents' binding criteria."
    confidence: moderate
  - claimId: MPI-C503
    verdict: established
    reasoning: MPI-E008 and MPI-E021 directly confirm that the 2023 paper's
      last-datapoint analysis reports a significant experimental–control
      difference for Random.org and no significant difference for Mersenne
