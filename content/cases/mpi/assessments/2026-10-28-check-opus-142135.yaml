  synthesis: >-
    The ledger separates three questions that the source literature tends to run
    together, and the verdict depends on keeping them apart.

    On observation, the record is clear. The founding series was reported as
    positive (C001), though only secondhand. Every analysis the ledger documents
    as preregistered or blind came back null (C002). These include the model's
    own team's consensus-protocol replications, Grote's preplanned 2017 analyses
    and his fully blind 2021 study. Within each program that ran repeated
    studies, early surpluses gave way to nulls, one reversal and post-hoc
    rescues (C003). On mechanism, MPI's no-transmission axiom and its
    decline-or-displacement corollary were in print by 2007 (C005). The matrix
    design was openly built to exploit evasion (C006).

    The featured hypothesis lives or dies on attribution (C007), and the lower
    rungs cannot lend it support. The null-plus-artefact account predicts the
    same decline, so a decline MPI foretold does not favour MPI over its rival.
    Support has to come from where the two accounts come apart, and at most such
    points the record runs against MPI.

    First, outcome tracks protocol. No analysis documented as preregistered or
    blind found a surplus. Positives keep appearing, as late as 2023, in
    analyses without those protections. The conventional account predicts this
    split directly; the 2007 derivation, which ties decline to replication
    attempts as such, does not. Second, fixed data can lose significance under
    better statistics. By its own authors' account, the 2020 surplus 'broke down
    in reasonably improved methods of analysis'. A decline driven by replication
    attempts does not explain that. Third, the largest dataset's positive (C503)
    rests on a test that treats 4,096 dependent cells (C504) as independent
    observations. Its control was also generated by a different procedure, and
    its true-versus-pseudo split vanishes on the paper's other primary analysis.
    Fourth, MPI's candidate signatures are unconfirmed. Source dependence is
    compromised, documentation suppression was tested only at hopeless power,
    and the strength-reproducibility reciprocity is untested. A proponent can
    absorb all of this by counting preregistration, blinding and reanalysis as
    further 'pinning down'. But then MPI predicts nothing the null does not
    (C010), and the 'law' becomes a restatement of what noise does.

    Steelmanning MPI: the one dependence-aware analysis readable at first hand,
    Filk's permutation of Flores's thesis data, leaves large surpluses in
    studies 1 to 3. None of C008's four listed mechanisms obviously reaches
    them. Bierman's ganzfeld simulation shows that a realistic QRP model can
    leave a remainder. And MPI is not strictly unfalsifiable, since a sustained,
    exploitable success would refute its axiom. Steelmanning the rival: those
    studies were not preregistered and shared equipment and experimenter. One
    had the experimenter as sole participant. The thesis itself reports causal
    correlations in parts of its raw data, and a whole-experiment permutation
    would not remove such coupling. That residual is why C008 is only mixed and
    why C007 is contradicted at moderate rather than high confidence. It is also
    why the founding anomaly (C009) stays open.

    The verdict also draws on the low prior plausibility of macroscopic
    psychophysical entanglement, which is background rather than ledger
    evidence. The framework MPI uses discards the quantitative machinery behind
    quantum entanglement's empirical record. That prior reinforces the verdict
    but does not create it.

    Sensitivity: the single most influential record is MPI-E003, the proponents'
    own preregistered nulls. It also carries their reading of failure as
    'systematic'. Without it, the strict-null record would rest on one
    independent experimenter's two studies. An experimenter-effect reading of
    the nulls (positives from the proponents' circle, nulls from outside it)
    would then be harder to exclude. The verdict survives its removal, on
    Grote's blind and preplanned nulls, the 2020 breakdown and the compromised
    positives, but with a thinner margin. No single record carries it alone.
  steelman: "Filk's independent re-computation of Flores's thesis data (MPI-E018)
    is not explained by this assessment. His null pairs each experiment's
    psychological data with another experiment's physical data, so it keeps
    exactly the cell dependence the conventional critique relies on. Against
    that null, study 1's experimental matrix shows 316 correlations at or above
    0.12 versus a permutation mean of 163. Only 2 of 10,000 permuted matrices
    reach that count, and studies 2 and 3 also exceed their nulls. These were
    replications on Lucadou's original equipment. The surpluses take the form of
    the 'transitory, jumping unexpected and statistically unlikely patterns' the
    2007 design rationale anticipated. This assessment lists vulnerabilities: no
    preregistration, a shared experimenter, a self-tested study 3, and the
    thesis's own mention of causal correlations in its raw data. But it
    identifies no mechanism demonstrated to produce a surplus of roughly 150
    cells over a dependence-preserving null. The ledger also contains no audit
    of these data for within-session coupling. A proponent would add that MPI's
    most falsifiable prediction in print, that stronger initial effects decline
    faster, has never been tested. So this verdict has not engaged the model's
    sharpest content."
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    reasoning: "Three later papers agree that the founding series was reported as
      positive. Walach et al. 2021 supplies the anchor ('more significant
      correlations than expected by chance and more than seen in a control
      matrix'). Grote 2021 cites Lucadou 2006 among the original positive
      reports, and the 2023 preprint refers to 'the initial significant
      results'. Nothing in the ledger disputes that this is what was reported;
      whether the surplus is real is the business of MPI-C009 and MPI-C504. The
      strongest opposing consideration is provenance: no one has read Lucadou
      2006 or the German-language 1986-1987 papers at first hand, the raw data
      are unpublished, and the best attestation says 'more than' the control
      rather than 'significantly more', so the claim's wording slightly outruns
      its source. MPI-E002 is a 2020 replication and does not bear on what the
      1986-2006 series reported."
    confidence: moderate
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: Every analysis the ledger documents as preregistered or blind is
      null. These are Walach et al.'s two OSF consensus-protocol replications
      (64 participants at power 0.88; 40 at 0.69), Grote's 2021 fully blind
      study of 200 participants, and Grote's three preplanned 2017 analyses
      (combined p = 0.315). The nulls come from both the model's originating
      team and an independent experimenter, so experimenter identity is an
      unlikely explanation, and 'predominantly' understates a record with no
      documented preregistered success. The strongest opposing consideration is
      corpus size (four primary tests, one at power 0.69 and one with 20
      participants), plus the post-hoc p = 0.012 and two secondary p = 0.06
      results that proponents can read as displacement; the ledger also does not
      record whether the positive 2020 study was itself preregistered. For the
      featured hypothesis the nulls are expected under MPI's own decline axiom,
      so their force is less that they refute MPI than that they leave no robust
      effect to explain.
    confidence: high
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "Instability is documented inside each program that ran repeated
      studies. Walach 2020's surplus, later called 'significant but fragile',
      was followed by two preregistered nulls. Grote went from a significant
      2015 result (not a strict matrix design) to preplanned nulls in 2017 and a
      blind null in 2021. Flores went from surpluses in studies 1-3 to a null
      study 5 and a reversed study 4C, recovering significance only by post-hoc
      pooling, and Kennedy 2003 describes the same pattern field-wide.
      'Weakened' and 'shifted to different analyses' are directly shown;
      'changed sign' rests on one study, and shifts to particular variables or
      cells are described rather than documented with numbers. The strongest
      opposing consideration is that the claim's vocabulary of shifting patterns
      can carry MPI's interpretation into an observation: under a null,
      non-recurring significant cells and post-hoc finds elsewhere are what
      fluctuation in a large dependent matrix plus analytic flexibility produce,
      so the observation is secure but neutral between the rival attributions."
    confidence: high
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: "MPI-E010 documents an axiomatized 'weak' quantum theory in
      Foundations of Physics that keeps complementarity and entanglement for
      arbitrary systems while dropping Hilbert-space structure and Planck's
      constant. The 2007 paper casts MPI's predictions explicitly as
      consequences of Generalized Quantum Theory (MPI-E009), so the framework
      exists and MPI is expressed within it. Two elements are thin: the source
      record shows the 2002 paper confirmed only through Crossref, and no
      evidence record documents pragmatic information serving as the 'ordering
      quantity' in MPI's instantiation. The strongest opposing consideration is
      that 'extension of entanglement' can mislead. The generalization keeps the
      word but discards the quantitative structure behind quantum entanglement's
      empirical signatures, so GQT cannot say how large a matrix surplus should
      be; the formalism gives the hypothesis coherence, not evidence."
    confidence: moderate
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: "The 2007 paper states the axiom ('Entanglement correlations cannot
      be used for transmitting signals or controllable causal influences'). It
      derives that an apparent effect 'will be wiped out' by attempts to
      corroborate it through replication, may 'change sign or disappear
      altogether, or else show up again in different observables', and will
      decline faster the stronger it began (MPI-E009); these predictions predate
      the 2017-2021 failures. The step to decline comes from the ban on
      'controllable causal influences', which a replicable correlation with a
      controllable intention would be, not from no-signalling as such (in
      physics, no-signalling entanglement correlations replicate perfectly,
      which is background, not ledger evidence); sign change and displacement
      are permitted rather than strictly entailed. Confidence is moderate
      because 'in advance of any data' holds only within the model: the same
      passage calls the decline effect 'well known and often experienced', so
      decline was a known explanandum. The strongest opposing consideration is
      that the prediction is disjunctive and unquantified, so apart from the
      reciprocity clause it forbids little."
    confidence: moderate
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: "The rationale is in the theorists' own words: 'one should make
      positive use of the evasion phenomenon' by 'simultaneous registration of
      as many different correlations as possible', with psi expected as
      'transitory, jumping unexpected and statistically unlikely patterns in the
      correlation matrix' (MPI-E011). A chapter in the 2015 Praeger volume is
      cited as presenting the method as 'a new light upon the repeatability
      problem' (MPI-E012, context only, full text unread). The strongest
      opposing considerations are historical and logical. The rationale is
      attested here in 2007, two decades after the first experiments, so whether
      it preceded or followed the early results is not documented. By the
      model's own logic the protection is also incomplete: a reliably
      replicating aggregate surplus would itself be exploitable, which is why
      the same passage concedes the decline will 'never' be overcome
      completely."
    confidence: high
  - claimId: MPI-C007
    verdict: contradicted
    reasoning: "The decline cannot carry this attribution, because the
      null-plus-artefact account predicts it equally; support must come where
      the accounts diverge, and there the record mostly runs against it. No
      analysis documented as preregistered or blind found a surplus, the
      proponents' own included (MPI-E003; also E004, E006). The strongest modern
      positive lost significance under improved analysis of the same data
      (MPI-E002), which replication-driven decline does not predict. The largest
      dataset's positive treats dependent cells as independent against a
      differently generated control, with no true-versus-pseudo split on its
      other primary analysis (MPI-E021, E022), and the only field test was null
      at hopeless power (MPI-E013). The strongest opposing consideration is
      MPI-E018: a dependence- preserving permutation leaves Flores's study 1 at
      316 cells against a null mean of 163 (2 in 10,000), with studies 2 and 3
      also above their nulls. Those studies were unregistered, shared
      experimenter, included a self-tested study, and come from a thesis
      reporting causal correlations in its raw data (MPI-E020), but no artefact
      has been shown; that residual, plus reliance on low priors for macroscopic
      psychophysical entanglement (background, not ledger evidence), keeps
      confidence moderate."
    confidence: moderate
  - claimId: MPI-C008
    verdict: mixed
    reasoning: Each listed mechanism is documented acting on part of the record.
      Analytic flexibility appears in Grote 2017's post-hoc rescue (p = 0.012
      after preplanned nulls) and Flores's post-hoc pooling of studies 4-5;
      dependence appears in the design itself (MPI-C504) and in the online
      replication's cells-as-sample test (MPI-E022). Publication bias and QRP
      inflation are documented in the parent micro-PK and ganzfeld literatures
      (MPI-E015, E016), and a coding error in a neighbouring correlational line
      (MPI-E017). But the claim asserts joint sufficiency for the whole record,
      and no record demonstrates that. The strongest opposing consideration is
      the Flores studies 1-3 surplus, which survives a dependence-preserving
      permutation by a wide margin (MPI-E018) in a thesis that reported all five
      of its studies; dependence, regression and publication bias do not
      obviously reach it, and the mundane candidates that might (within-session
      causal coupling, an experimenter-participant, coding error) are not on
      this claim's list. Bierman 2016 adds that a realistic QRP model left a
      significant remainder in a neighbouring database, and publication bias has
      little purchase on a modern program that published its own nulls.
    confidence: moderate
  - claimId: MPI-C009
    verdict: weakly_supported
    reasoning: "The only direct support is one unreferenced sentence in the 2023
      preprint's introduction, by the thesis author (MPI-E007). It says the
      psychological variables were highly intercorrelated, that the resulting
      dependence 'may have influenced the initial significant results', and that
      results 'diminished' once simulations were added. No numbers, method or
      table for Lucadou's 1986-2006 data appear in the ledger, those raw data
      are unpublished, and the thesis pages read analyse only the thesis's own
      replications (MPI-E018). The direction is plausible on mechanism, since
      cell dependence (MPI-C504) inflates naive significance counts. The
      strongest opposing consideration is the one dependence-aware correction
      readable at first hand: in study 1 the permutation null (163) sat only
      modestly above the old control count (142) and the surplus stayed highly
      significant. So 'substantially diminish' is shown for no dataset in the
      ledger, and the anchor's 'these studies' is ambiguous; most of the thesis
      is unread, so the claim rests on a summary until a reanalysis is found."
    confidence: low
  - claimId: MPI-C504
    verdict: established
    reasoning: "The premise is a statistical fact about the design, stated and
      explained by the thesis's independent validator. The 2,025 cells come from
      about 90 variables, some partly redundant (more left-key presses imply
      fewer right-key presses), so cells built on intercorrelated variables are
      themselves correlated and significant cells arrive in bundles (MPI-E024).
      The thesis author separately reports that the psychological variables were
      highly intercorrelated (MPI-E007). The online replication's 4,096 cells,
      built from four variables per side cut into sixteen pieces, are bound more
      tightly still (MPI-E022). The strongest opposing consideration is scope,
      not truth: the premise shows that naive cell-counting is invalid, not how
      far any particular surplus shrinks, and Filk's dependence-aware analysis
      left large surpluses standing. That the founding matrices share this
      structure is inferred from their described design, not read in Lucadou
      2006."
    confidence: high
  - claimId: MPI-C010
    verdict: well_supported
    reasoning: "The insulation is built into the theory text and visible in
      practice. The 2007 derivation lets an effect be 'wiped out', 'change
      sign', 'disappear altogether' or 'show up again in different observables'
      (MPI-E009), and the design rationale concedes the decline will 'never' be
      overcome completely (MPI-E011). The 2020 surplus was published as evidence
      for anomalistic correlations, while the 2021 preregistered failures were
      read as 'likely part of the systematic nature of such effects' rather than
      against the model (MPI-E003); the thesis attributed its null studies to
      procedural factors (MPI-E019). The strongest opposing consideration is
      that MPI carries disconfirmable content not yet put at adequate risk: the
      strength-reproducibility reciprocity in print since 2007, source
      dependence, and the documentation effect Watt and Tierney operationalised
      (MPI-E013). A sustained, exploitable success would also contradict the
      axiom outright. Confidence is moderate because 'no feasible outcome' is a
      strong universal resting on a handful of interpretive acts, and no
      proponent has yet been asked for binding disconfirmation criteria
      (MPI-R004 is unrun)."
    confidence: moderate
  - claimId: MPI-C503
    verdict: established
    reasoning: The paper reports exactly this, verbatim, for its last-datapoint
      analysis (version 1, PDF p. 14). Random.org gives Welch t = 3.8112, alpha
      = 0.00013, power 94%; Mersenne Twister gives t = 1.813, alpha = 0.06987,
      power 67%. Version 2 reports the same analyses with different rounding,
      and the claim is correctly scoped to one analysis. The strongest opposing
      consideration concerns what the report is worth, not whether it was made.
      On the average analysis the pseudo-random arm is significant too (p =
      0.0029), with the same experimental-positive, control-negative pattern in
      both arms. The arms were never contrasted directly, the pseudo-random
      generator was seeded from swipe timing, and both tests treat 4,096
      dependent cells as independent against a control produced by a different
      procedure (MPI-E021, MPI-E022). As local truth the claim is secure; as
      evidence for source-dependent psi it carries little weight.
    confidence: high
