  synthesis: |-
    The verdict holds at weakly supported. Reading the online replication in full, and the parts of Flores's thesis that bear on these questions (its concluding chapter, its study-4 discussion and its independent validation appendix), cuts against the clean story each side tells.

    On the observation rung nothing moves. The founding reports (MPI-E001) remain author reports with unpublished raw data. The strictest designs — the two preregistered consensus replications (MPI-E003) and Grote's blind analysis (MPI-E004) — are null. Within Flores's thesis the surplus appears in studies 1–3 and is absent or reversed in studies 4–5 (MPI-E019): the decline pattern of MPI-C003 in miniature.

    The dependence critique is now two claims. Its premise (MPI-C504) is confirmed at first hand: the matrix cells are not independent (MPI-E024). Its consequence for the founding results (MPI-C009) is not in the record. No reanalysis of Lucadou's 1986–2006 data has been published; the statement that those results "diminished" is one sentence in the introduction of the 2023 online-replication preprint, which cites no reanalysis. The only dependence-aware analysis whose numbers can be read, in Flores's exact replications, shows the surplus surviving (MPI-E018). MPI-C504 is well supported; MPI-C009 is unresolved.

    The attribution rung still fails, with its residue reshaped. The thesis's positives come from the original equipment and one experimenter, and one of the three had a single participant, the author (MPI-E020). The online replication reports its true-versus-pseudo-random split (MPI-C503) on only one of its two primary analyses. On the other, the pseudo-random arm is significant too; both arms show the same sign pattern; the arms are never compared directly; and the test takes 4,096 fragmented cells as independent observations (MPI-E021, MPI-E022). The report is accurate; a dependence on the random source is not shown. Every conventional mechanism in MPI-C008 remains documented in or beside the corpus, though none has been shown to reproduce the record quantitatively.

    The highest-value next steps are desk work: re-analyse the online game's data at session level with a direct contrast between generators (MPI-R006), and the founding datasets under the same standard (MPI-R002).
  steelman: "The pattern was predicted, not fitted, and the surplus has survived where the critics' sharpest tool was applied. The 2007 theory paper put decline, sign change and displacement in print before the consensus-protocol and blind-analysis failures. The matrix design was a risky positive prediction, and in its inventors' hands it delivered. In Flores's exact replications with Lucadou's equipment, an independent re-computation found the experimental matrices well above 10,000 permutations that respect the dependence among cells, which is the very correction the conventional account relies on. The later failures came as protocols were fixed and repeated, which is when the model says the correlations should withdraw. And no conventional mechanism has been shown, quantitatively, to reproduce the published record: the best questionable-practice simulation nearby explains about sixty percent of a different effect. Until the founding data are re-analysed under a valid null, or the model's fine structure is tested as a prediction, the conventional account is a sufficient story, not a demonstrated one."
claimAssessments:
  - claimId: MPI-C001
    verdict: provisionally_supported
    reasoning: "That these reports exist and say what they say is documented through their successors' descriptions; the 2006 full text has not been read for this case. Whether the surpluses were computed against a valid null is contested: the matrix cells are not independent (MPI-C504, MPI-E024), and the founding analyses counted them as if they were. No dependence-aware reanalysis of the 1986–2006 data is in the record, so their size under a valid null is unknown: not shown to shrink away, not shown to hold."
    confidence: moderate
    treatment:
      plainLanguage: In the founding experiments, participants pressed keys trying to "influence" a random event generator. Nobody scored hits in the ordinary sense — instead, the experimenters counted how many correlations between behavior variables and machine variables came out statistically significant, and reported far more of them than chance or control runs should give.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: If the surpluses are statistically sound, something needs explaining — but the something could still be analytic artifact rather than anomaly. If they are unsound, the whole program's foundation shifts to the later, stricter replications.
      strongestObjection: The founding analyses counted significant cells against an independence assumption the data violate. Where the correction has since been applied, to Flores's exact replications, the old control comparison understated the chance level; the founding data themselves have never been re-run under it, so their reported significance cannot be taken at face value.
      whatWouldChangeOurMind:
        - A dependence-aware reanalysis of the original 1986–2006 datasets, in either direction.
        - Publication or archiving of the original raw data, which would make such a reanalysis possible.
  - claimId: MPI-C002
    verdict: well_supported
    reasoning: "The strongest-designed tests are unambiguous: Grote's 200-participant blind analysis fell \"well within the expected random distribution,\" and the proponents' own two consensus-protocol replications were null. The partial exceptions — Walach 2020, Flores's first three thesis studies, and the 2023 online replication — were not run under a frozen blind-analysis protocol like Grote's, and the record shows no preregistered analysis for any of them."
    confidence: high
    treatment:
      plainLanguage: When the matrix experiment was rerun under the strictest modern rules — analysis plans frozen in advance, in one case the entire analysis software written and tested before anyone looked at the data — the effect mostly disappeared.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "This is the case's central twist: a null replication record undermines the anomaly reading and simultaneously matches MPI's own decline prediction. By itself, this observation cannot separate the hypotheses — which is why the falsifiability crux (MPI-C010) exists."
      strongestObjection: "\"Predominantly\" is doing work: Walach et al. 2020 reported a significant effect, Flores's exact replications kept a surplus under permutation analysis, and the 2023 online replication reported one with a true random source. The record is messier than a clean null."
      whatWouldChangeOurMind:
        - Further adversarial blind-analysis replications, in either direction.
        - A significant result under a Grote-style full blind-analysis protocol would remove the 'strictest tests are null' pattern.
  - claimId: MPI-C003
    verdict: well_supported
    reasoning: "Descriptively accurate as a sequence of published outcomes: Lucadou's positives; Walach 2020's \"significant but fragile\" effect; Grote's 2015 positive followed by his 2017 and 2021 nulls; the two 2021 consensus-protocol failures. Flores's thesis repeats the sequence inside one program: a surplus in studies 1–3, none or a reversal in studies 4–5 (MPI-E019). What \"decline\" presumes — that there was ever a real effect to decline — is not part of this claim."
    confidence: moderate
    treatment:
      plainLanguage: "Across four decades, the matrix effect has behaved like a bar of wet soap: strong in early reports, weaker or absent in stricter reruns, and when something did show up later, it tended to show up somewhere else — different cells, different analyses, different variables."
      importance: major
      diagnosticity: low
      diagnosticitySummary: Regression to the mean produces exactly this trajectory from null data filtered by publication. The pattern is equally at home in both rival explanations, which is what makes the attribution rung necessary.
      strongestObjection: '"Decline and displacement" is a narrative imposed on a small, heterogeneous set of studies with different designs, power, and analyses; no prespecified metric of decline has ever been defined and then measured across the series.'
      whatWouldChangeOurMind:
        - A quantitative, prespecified decline/displacement metric applied across the full corpus (see research agenda).
  - claimId: MPI-C004
    verdict: provisionally_supported
    reasoning: "The framework is published in a serious foundations venue and is internally coherent as far as reviewed. Its cost is candor about lost power: without Hilbert-space structure it assigns no probabilities to outcomes, so it constrains data only qualitatively."
    confidence: moderate
    treatment:
      plainLanguage: 'The model is not hand-waving about "quantum consciousness": there is a published axiomatic framework that keeps the algebraic structure of quantum theory (non-commuting observables, entanglement between parts of a system) while dropping its physical constants, and MPI is a special case of it. Whether that formalism describes reality is a separate question from whether it exists and is coherent.'
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A coherent formalism proves availability, not truth. Many consistent theories describe nothing. Its main evidential role is to make MPI's predictions derivable rather than ad hoc.
      strongestObjection: By discarding the quantitative machinery, GQT keeps quantum theory's vocabulary while giving up nearly all of its predictive risk — the entanglement here is an analogy wearing an axiom system, and no derivation says how large any effect should be, or when.
      whatWouldChangeOurMind:
        - A GQT derivation yielding quantitative, parameter-fixed predictions for a matrix experiment.
        - A demonstrated internal inconsistency in the axiom system.
  - claimId: MPI-C005
    verdict: well_supported
    reasoning: 'As a statement about what the model says, this is verbatim in the 2007 paper, which also derives the corollaries: decline that is faster when the original effect was stronger, sign reversal, and reappearance "in different observables and/or between different parts of the system." Whether the axiom is true of nature is the attribution question, not this claim.'
    confidence: high
    treatment:
      plainLanguage: The model's core rule is that these correlations can never be used to send a message. A perfectly replicable psi experiment would be a message channel — so the model says perfect replication cannot happen, and published this consequence before the stricter replications were run. The decline effect, usually psi research's embarrassment, is here a theorem.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: "This is what distinguishes MPI from both conventional skepticism and conventional psi advocacy: it stakes out, in print and in advance, the prediction that stricter protocols will show weaker effects. The prediction is real; the trouble is that the null hypothesis makes the same one (MPI-C008)."
      strongestObjection: 'A prediction shared with the null hypothesis earns no credit: regression to the mean also "predicts" that stricter, larger replications show weaker effects. The distinctive content — displacement structure, strength–reproducibility reciprocity — has never been tested against a prespecified metric.'
      whatWouldChangeOurMind:
        - A prespecified test of the model's distinctive fine structure (displacement patterns, decline-rate reciprocity) succeeding or failing.
  - claimId: MPI-C006
    verdict: well_supported
    reasoning: "Documented as the design's stated rationale in the theorists' own words. This matters structurally: the matrix experiments are not an arbitrary paradigm but the model's self-nominated benchmark, so their replication record is the primary evidence line for and against MPI."
    confidence: high
    treatment:
      plainLanguage: Lucadou did not just explain away failed replications — he designed an experiment his theory says should work anyway. If no single number counts as "the result," no signal can be coded, so the no-transmission rule is not violated and the correlations are allowed to show up as a surplus of significant cells scattered through a matrix.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Cuts both ways. It makes the CMM record binding on MPI in a way generic psi results are not — and it means the blind-analysis failures land on the model's own chosen ground.
      strongestObjection: A design that predicts "transitory, jumping, unexpected patterns" in a large matrix describes what multiple testing produces from pure noise; the design converts the multiplicity problem into the predicted signature, which is precisely why dependence-aware statistics are decisive here.
      whatWouldChangeOurMind:
        - Proponent agreement on a dependence-aware analysis standard for what counts as a matrix 'hit' (see research agenda).
  - claimId: MPI-C007
    verdict: weakly_supported
    reasoning: The positives are real but thin. Walach 2020 was called "significant but fragile" by its own authors. Flores's three positive thesis studies kept their surplus under permutation, but they share equipment and experimenter, and one had a single participant, the author (MPI-E018, MPI-E020). The online replication's test assumes its 4,096 cells are independent (MPI-E022). Against them stand Grote's null blind analysis and the null consensus replications, with every conventional mechanism documented in the corpus.
    confidence: moderate
    treatment:
      plainLanguage: "The featured thesis: the matrix experiments really did catch something — a real connection between minds and machines that by its nature cannot be pinned down — and the fading, shifting record is that something behaving exactly as the theory says it must."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself. Everything below the ladder exists to test it against MPI-C008.
      strongestObjection: "The explanation is unfalsifiable in practice as deployed: successes confirm the correlations and failures confirm the elusiveness, so no outcome of the very experiments the model nominated can count against it — while the mundane account (MPI-C008) explains the same record with mechanisms already caught operating in it."
      whatWouldChangeOurMind:
        - Success or failure of prespecified displacement-structure predictions in adversarial replications.
        - Session-level re-analysis of the existing matrix datasets, founding and recent, restoring or eliminating their surpluses.
  - claimId: MPI-C008
    verdict: provisionally_supported
    reasoning: "Each component mechanism is documented in or near this corpus: non-independent cells (MPI-E024, MPI-E022), analytic flexibility (Grote 2017's post-hoc-only significance), error-driven false positives (Maier & Dechamps), publication-bias sensitivity (Bösch 2006). What keeps this short of well supported: no one has shown quantitatively that these mechanisms reproduce the published record; where a dependence-aware null was applied to Flores's exact replications, the surplus survived; and the strongest QRP simulation nearby (Bierman 2016, ganzfeld) explained about 60% of that effect, not all of it."
    confidence: moderate
    treatment:
      plainLanguage: 'The conventional steelman: nothing was ever there. Intercorrelated variables made "significant cells" cheap, flexible analysis and selective publication made early positives likely, and when protocols tightened, results regressed to the nothing they came from. Every one of those mechanisms has been caught red-handed somewhere in this literature.'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: The direct rival to MPI-C007. If it holds, MPI's central evidence line dissolves; if it can be shown insufficient under adversarial conditions, what remains is genuinely anomalous.
      strongestObjection: Walach et al. 2020 was large, two-lab and evaluated against 10,000 simulated experiments, and still reported a surplus; in Flores's exact replications the surplus survived a permutation null that respects the dependence among cells. The mundane account predicts stricter methods kill the effect — mostly they did, but not cleanly everywhere.
      whatWouldChangeOurMind:
        - A QRP/dependence simulation calibrated to the actual CMM corpus reproducing (or failing to reproduce) its published record.
        - A significant matrix result under full blind analysis, which this explanation predicts should not occur.
  - claimId: MPI-C009
    verdict: unresolved
    reasoning: No evidence record carries this claim. No dependence-aware reanalysis of Lucadou's 1986–2006 data has been published. Its anchor is one sentence in the introduction of the 2023 online-replication preprint, saying that when simulations were incorporated "the results from these studies diminished"; the sentence cites no reanalysis and gives no numbers. The earlier characterization of Flores's Monte Carlo work (MPI-E007) is second-hand, through that same preprint. Where a dependence-aware null can be read, in Flores's own replications rather than the founding data, it lowered the chance baseline but the surplus survived (MPI-E018).
    confidence: low
    treatment:
      plainLanguage: "The consequence of the dependence problem: if the founding experiments were re-run under statistics that respect how the cells depend on one another, would their surplus shrink or vanish? A paper from inside the program says so in one sentence, but no such reanalysis has been published, and where the correction has been applied to later replications the margin shrank without disappearing."
      importance: major
      diagnosticity: high
      diagnosticitySummary: If the founding surpluses shrink away under a valid null, the program's origin story weakens from "anomaly detected" to "artifact detected"; if they hold, the conventional account loses its sharpest tool against them.
      strongestObjection: The premise (MPI-C504) is not in dispute, and the program's own move to permutation statistics concedes that the founding significance counts were computed against the wrong null. Their reported significance overstates the evidence by some amount whether or not a reanalysis is ever published.
      whatWouldChangeOurMind:
        - An independent, published dependence-aware reanalysis of the 1986–2006 matrix datasets.
        - Publication of the founding raw data.
  - claimId: MPI-C504
    verdict: well_supported
    reasoning: "Stated directly by the thesis's independent validator, with the structural reason: the 2,025 cells of a 45 × 45 matrix come from about 90 variables, some of them partly redundant (MPI-E024). The program adopted permutation analysis for this reason (MPI-E018). That the founding matrices share the structure rests on their described design, a few variables on each side generating many cells, not on a reading of the 2006 paper."
    confidence: high
    treatment:
      plainLanguage: 'Counting "significant cells" only means something if the cells are independent. In these experiments they are not: a few behavior variables and a few machine variables generate hundreds or thousands of cells, so significant cells come in bundles, and the chance level for the count cannot be worked out as if each cell were a separate test.'
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: The premise makes every independence-based significance count in the corpus suspect, founding and recent. By itself it does not say how much any surplus is worth under a valid null; that is MPI-C009 for the founding data, and what MPI-R006 would measure for the online game.
      strongestObjection: Comparing experimental matrices with control runs built the same way already shares the dependence structure, so a surplus over control need not depend on the independence assumption. Filk's own comparison partly answers this, since in study 1 the permutation null sat above the old control count.
      whatWouldChangeOurMind:
        - A demonstration that a particular matrix analysis's null already accounted for the dependence among cells, which would exempt that analysis from the critique.
  - claimId: MPI-C010
    verdict: mixed
    reasoning: "The pattern is real and quotable: the proponents' response to their own consensus-protocol failures was that failure is \"likely part of the systematic nature of such effects.\" But the charge is not airtight — the model does expose itself at the aggregate level (a stable exploitable psi signal anywhere would refute the NT axiom), it nominated the matrix design as a positive prediction that could have kept failing from the start, and the 2021 authors did conclude the paradigm is \"not replicable,\" which is a concession, not an evasion."
    confidence: moderate
    treatment:
      plainLanguage: "The falsifiability tension, stated as a claim about scientific practice rather than philosophy: if heads confirms the theory and tails confirms it too, the theory has stopped taking risks. The live question is whether MPI's proponents have ever specified an outcome they would accept as a refutation — and whether the model's structure permits one."
      importance: major
      diagnosticity: high
      diagnosticitySummary: This is the crux that decides how much the replication record can ever mean. If MPI has no bindable predictions, the case ends in philosophy; if its fine structure can be prespecified and tested, the case returns to the laboratory.
      strongestObjection: "MPI is falsifiable in principle and partly in practice: the NT axiom forbids any stable psi channel (a risky universal), the matrix surplus was a positive prediction, and specific corollaries — decline faster when initial effects are stronger, displacement into related observables — could be prespecified and tested tomorrow. The insulation is a habit of interpretation, not a theorem of the model."
      whatWouldChangeOurMind:
        - Proponents publishing binding disconfirmation criteria (see research agenda) — or explicitly declining to.
        - A prespecified fine-structure test whose outcome proponents accept as evidence either way.
  - claimId: MPI-C503
    verdict: well_supported
    reasoning: "As a report of what the paper's last-datapoint analysis found, it is accurate and now says so: t = 3.811 (p = 0.00013) with the true random source, t = 1.813 (p = 0.0699) with the Mersenne Twister, in the paper's own discussion. What the report does not show is a dependence on the random source. On the paper's other primary analysis, the average over cumulative matrices, the pseudo-random arm is significant too (p = 0.0029). Both arms show positive experimental means and mostly negative control means; the arms are never compared directly; the pseudo-random generator was seeded from swipe timing; and the test takes 4,096 dependent cells as its sample (MPI-E021, MPI-E022)."
    confidence: high
    treatment:
      plainLanguage: People worldwide played an online game, trying to "mentally influence" a character whose world was driven by random numbers — from a true random source (atmospheric radio noise) or a computer's pseudo-random algorithm. Theories in MPI's family expect genuine randomness to matter. On one of its two main analyses, the paper found an effect with the first and not the second; on the other, both sources showed one. The reported split is real; a difference between the sources is not established.
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A real dependence on the random source would be one of the few results MPI-family theories and the null hypothesis disagree about. The reported split does not establish one, because it holds on one analysis only, rests on comparing two thresholds rather than the arms, and uses a test that assumes independent cells; so as it stands it separates the hypotheses little.
      strongestObjection: On the analysis the paper presents as its result — all sessions in one matrix — the true-source arm meets every criterion the paper states and the pseudo-random arm meets none, with an effect half as large.
      whatWouldChangeOurMind:
        - A direct test between the arms on the raw data, at session level (MPI-R006).
        - A preregistered, equal-power factorial comparison of true and pseudo-random sources (MPI-R003).
