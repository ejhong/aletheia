caseAssessment:
  verdict: weakly_supported
  whatIsClaimed: Psi phenomena are real but are non-local, meaning-dependent correlations between an observer and a physical system — not signals or forces. Because such correlations can never be used to transmit information (the "no-transmission" axiom), any experiment that could turn them into a reliable signal will find them declining, changing sign, or displacing to unmonitored variables. Correlation-matrix experiments, which spread the effect across many variable pairs instead of one outcome channel, are claimed to reveal these correlations as a surplus of significant matrix cells relative to control runs.
  whereDisagreementLives: "Not over whether decline happens — everyone agrees psi effects have never replicated stably. The crux is why. MPI says decline is the lawful signature of a real but unexploitable correlation, and points to matrix experiments where the effect appeared, moved, and faded roughly as the model expects. The conventional account says the initial effects were never real: intercorrelated variables inflated the count of significant cells, flexible analysis and publication bias supplied the early positives, and regression to the mean supplied the decline. Both stories fit a declining effect; they part company over the initial positives and over the fine structure of where effects reappear."
  whatWouldSettleIt: Adversarial, preregistered correlation-matrix replications with blind-analysis protocols, dependence-aware statistics agreed by both sides in advance, and prespecified quantitative predictions for the decline and displacement structure, endorsed by MPI's proponents as binding. Repeated failure of those predictions in adequately powered blind tests would strip MPI of its distinctive content; their repeated success under conditions that exclude analytic flexibility would be extraordinary. Meanwhile, existing data re-analysed at session level would show what the published surpluses are worth. A stable, exploitable psi signal anywhere would refute the model outright, by its own axiom.
  bestConventionalExplanation: "No anomalous correlation exists. Matrix cells are built from a few intercorrelated variables, so counting significant cells as if each were independent overstates the evidence — a point the program's own validators concede. Early positives are what analytic flexibility, optional stopping and selective publication produce from null data; decline is regression to the mean; displacement is multiplicity, since with enough cells something is always significant somewhere. Each mechanism is documented in or beside this corpus: a coding error behind one micro-PK effect, a post-hoc contrast rescuing a null study, significance that \"broke down in reasonably improved methods of analysis\" by the replicators' own account, and a large online replication whose test takes 4,096 dependent cells as its sample. The strictest test, a fully blind analysis of 200 participants, found nothing. Its residue: in Flores's exact replications the surplus survived a permutation null, and those authors were not naive statisticians."
  components: []
  researchPriority:
    level: medium
    reason: The decisive tests are cheap — re-analysis of existing matrix data under a valid null, an equal-power true-versus-pseudo-random contrast, and binding fine-structure predictions. But the proponents concede the paradigm does not replicate on demand, which caps the expected yield.
