id: MPI-001
slug: mpi
title: "Elusive by Law?"
subtitle: "Does the Model of Pragmatic Information correctly predict that mind–matter correlations must decline whenever an experiment tries to pin them down — or is the decline just what noise does?"
domain: "Parapsychology · Quantum foundations · Research methodology"
status: active
summary: >-
  Most anomalous-phenomena claims die by failing to replicate. Walter von Lucadou's Model of Pragmatic Information (MPI) is built the other way around: it predicts the failure. Treating psi events as entanglement-like correlations that can never carry a usable signal, it holds that any protocol capable of exploiting an anomalous effect will see that effect decline or migrate elsewhere. The model's own proposed test — the correlation-matrix experiment — has a forty-year record of proponent successes, partial replications, and rigorous preregistered failures. The question is whether that record traces a law of nature or the ordinary statistics of a null effect dressed in quantum language.
