# Canon layer. Claims extracted from the "Entangled Minds and Pragmatic
# Information" synthesis document and rebuilt against independently verified
# primary sources, 2026-08-22. reviewState is honest provenance: nothing here
# has been hand-checked by a human yet.
#
# Ladder note: this case is unusual because the featured hypothesis predicts
# the *absence* of stable replication. The rungs are separated so that the
# documented decline pattern (observation), the model's content (mechanism),
# and the contest over what explains the pattern (attribution) cannot lend
# each other unearned support.

# ── Observation rung ─────────────────────────────────────────────────────────

- id: MPI-C001
  statement: >-
    The original correlation-matrix experiments conducted by Lucadou's group (1986–2006) reported significantly more significant correlations between psychological and physical variables in experimental sessions than in control sessions.
  theme: program
  rung: observation
  claimType: statistical
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document — CMM experiment series; verified against Walach 2020/2021 descriptions"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Walach et al. 2021, introduction (describing the predecessor experiments)"
    quote: >-
      Indeed, von Lucadou's previous experiments were supportive of this idea and produced more significant correlations than expected by chance and more than seen in a control matrix.
    sourceId: SRC-WALACH-2021
  parentClaimIds: []
  dependsOnClaimIds: []

- id: MPI-C002
  statement: >-
    Preregistered and blind-analysis replications of the correlation-matrix experiment have predominantly failed to reproduce the excess-correlation effect.
  theme: replications
  rung: observation
  claimType: statistical
  reviewState: ai_extracted
  origin:
