    date: "2026-08-22"
  sourceAnchor:
    locator: "Grote 2021, abstract; Walach et al. 2021, abstract"
    sourceId: SRC-GROTE-2021
  parentClaimIds: []
  dependsOnClaimIds: []

- id: MPI-C003
  statement: >-
    Reported effects in the correlation-matrix program have not remained stable under replication: initially significant patterns weakened, changed sign, or shifted to different variables, cells, or analyses in subsequent studies.
  theme: prediction
