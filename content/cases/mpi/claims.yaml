# ── Mechanism rung ───────────────────────────────────────────────────────────

- id: MPI-C004
  statement: >-
    Generalized Quantum Theory provides a formally explicit extension of complementarity and entanglement beyond physics, and MPI instantiates it for psychophysical systems using pragmatic information as the ordering quantity.
  theme: theory
  rung: mechanism
  claimType: mechanistic
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document — GQT formalism; verified against Atmanspacher et al. 2002 and JCS 2007 full texts"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Atmanspacher, Römer & Walach 2002, Foundations of Physics 32(3)"
    sourceId: SRC-ATMANSPACHER-2002
  parentClaimIds: []
  dependsOnClaimIds: []

- id: MPI-C005
  statement: >-
    MPI's no-transmission axiom entails, in advance of any data, that anomalous correlations will decline, change sign, or displace whenever an experimental protocol would allow them to be exploited as a stable signal.
  theme: prediction
  rung: mechanism
  claimType: mechanistic
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document — NT axiom; verified verbatim against JCS 2007 full text"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "von Lucadou, Römer & Walach 2007, pp. 10–11"
    quote: >-
      Entanglement correlations cannot be used for transmitting signals or controllable causal influences.
    sourceId: SRC-LUCADOU-ROMER-WALACH-2007
  parentClaimIds: [ MPI-C004 ]
  dependsOnClaimIds: []

- id: MPI-C006
  statement: >-
    The correlation-matrix design was constructed as MPI's own proposed test: by spreading potential effects across many variable pairs with no single outcome channel, it is intended to detect entanglement correlations without enabling signal transmission.
  theme: program
  rung: mechanism
  claimType: methodological
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document — CMM rationale; verified verbatim against JCS 2007 full text"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "von Lucadou, Römer & Walach 2007, p. 12"
    quote: >-
      In order to reduce the decline effect, one should make positive use of the evasion phenomenon. This can be done by simultaneous registration of as many different correlations as possible. Psi effects will then show up as transitory, jumping unexpected and statistically unlikely patterns in the correlation matrix.
    sourceId: SRC-LUCADOU-ROMER-WALACH-2007
  parentClaimIds: [ MPI-C005 ]
  dependsOnClaimIds: []

# ── Attribution rung ─────────────────────────────────────────────────────────

- id: MPI-C007
  statement: >-
    The pattern of early positive results, decline, and displacement in the correlation-matrix program is produced by genuine non-local psychophysical correlations of the kind MPI describes.
  theme: attribution
  rung: attribution
  claimType: interpretive
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document — central thesis"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  parentClaimIds: []
  dependsOnClaimIds: [ MPI-C005, MPI-C006 ]

- id: MPI-C008
  statement: >-
    Regression to the mean, analytic flexibility, publication bias, and statistical dependence among matrix variables are jointly sufficient to explain the correlation-matrix record — the early positives and the decline — without any anomalous correlation.
  theme: conventional
  rung: attribution
  claimType: interpretive
  reviewState: ai_extracted
  origin:
    ref: "Critical literature import 2026-08-22 — Bösch 2006, Bierman 2016, Maier & Dechamps 2022, Flores 2021/2023"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  parentClaimIds: []
  dependsOnClaimIds: []

- id: MPI-C009
  statement: >-
    Intercorrelation among the psychological variables violated the independence assumptions of the original correlation-matrix analyses, and dependence-aware reanalyses substantially diminish the founding excess-correlation results.
  theme: conventional
  rung: attribution
  claimType: methodological
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — Flores 2021 thesis and Flores & Rapazote-Flores 2023"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Flores & Rapazote-Flores 2023, introduction"
    quote: >-
      It was found that psychological variables exhibited high intercorrelations, and simulations provided a means to overcome the statistical dependence that may have influenced the initial significant results. When simulations of data were incorporated, the results from these studies diminished.
    sourceId: SRC-FLORES-2023
  parentClaimIds: [ MPI-C008 ]
  dependsOnClaimIds: []

- id: MPI-C010
  statement: >-
    As deployed by its proponents, MPI is insulated from disconfirmation: successful replications are read as entanglement correlations and failed replications as the predicted decline, so no feasible outcome of its own nominated experiments is treated as evidence against the model.
  theme: falsifiability
  rung: attribution
  claimType: interpretive
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document — falsifiability discussion; sharpened against Walach 2021's own interpretation of its null results"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Walach et al. 2021, abstract and discussion"
    quote: >-
      The replication problem and this failed replication is likely part of the systematic nature of such effects.
    sourceId: SRC-WALACH-2021
  parentClaimIds: []
  dependsOnClaimIds: [ MPI-C005 ]

