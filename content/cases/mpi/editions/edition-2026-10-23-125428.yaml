  The thesis's "three of five significant" studies were registered in advance, but as exploratory studies. The permutation analysis behind the positives had no method specified in the registrations. The registered analysis is one the author says overestimates results. One of the three positive studies had a single participant, the researcher, and the two studies that added a second generator did not confirm the prediction. The preprint's split between "true" and "deterministic pseudo-random" sources is weaker than the case described. The pseudo-random generator was seeded from the participants' own swipe timestamps. Its arm was significant under the paper's averaged analysis. No test of the difference between the arms is reported, and the paper's tests treat 4,096 matrix cells built from four variables a side as independent samples. Against that, the dependence critique now rests on a primary, pre-data source: the program's own 2016 registration says the cells are not independent and that this makes results look more significant. Grote's blind analysis, read in full, also split its random source; both arms were null.

