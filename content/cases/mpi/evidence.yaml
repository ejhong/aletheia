- id: MPI-E020
  title: "The program's own 2016 registration: matrix cells are not independent, which makes results look more significant"
  claimIds: [MPI-C009]
  sourceId: SRC-FLORES-2021
  direction: supports
  strength: moderate
  sourceStatement: >-
    Study 1's registration, filed before data collection and reproduced in
    the thesis, explains why a permutation analysis is preferable to the
    Z Difference test used in the earlier studies: "Also Z Difference and 2
    * 2 analyses are based on the assumption that each event (correlation)
    is independent, which is not true for these studies. The effects of
    dependencies are difficult to predict, but one of the most common
    effects is increased variance relative to the assumption of
    independence - which makes an outcome appear more significant than is
    actually the case."
  editorInference: >-
    The first half of MPI-C009, that the founding analyses' independence
    assumption is violated, is stated in the program's own registration in
    2016, before any of the critical replications reported. That is a
    primary, pre-data statement, stronger than the successor preprint's
    summary the claim was anchored on. The second half, that a
    dependence-aware reanalysis of the founding datasets substantially
    diminishes them, is not shown here. The thesis reanalyses its own
    replications, not Lucadou's original data, and reports that the
    permutation analysis lowered the counts compared with the original
    method (MPI-E007).
  exactLocator: "p. 317 (Appendix 4, registration form for Study 1; PDF pages as the reading tool numbers them)"
