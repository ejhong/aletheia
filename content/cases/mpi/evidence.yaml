- id: MPI-E001
  title: "Lucadou's original matrix experiments report excess correlations"
  claimIds: [MPI-C001]
  sourceId: SRC-LUCADOU-2006
  direction: supports
  strength: moderate
  sourceStatement: >-
    The 2006 proceedings paper presents the Model of Pragmatic Information
    and Lucadou's correlation-matrix experiments, reported by the author and
    his co-workers as producing more significant psychological–physical
    correlations in experimental sessions than expected by chance or seen in
    control matrices.
  editorInference: >-
