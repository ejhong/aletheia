- id: MPI-E021
  title: "Grote 2018: permuted data reproduce the post-hoc oscillation (p = 0.328)"
  claimIds: [MPI-C505]
  sourceId: SRC-GROTE-2018
  direction: supports
  strength: moderate
  sourceStatement: >-
    Grote generated 1,000 random permutations of the experiment's 12,571
    data points and fitted the same decaying oscillation to each: "The main
    experimental result as presented in Maier et al. ( 2018 ) lies at ω =
    0.0018 (red square) with 386 results of the 1,000 simulated data sets
    having larger ω -values than that." Restricting to fits no worse than
    the original, "the variation in the data motivating the hypothesis
    under test, would show up just by chance with a probability of p =
    0.328 under a null hypothesis." He reports the result held using the
    single control data set and a pseudo-random generator, and notes that
    "A constant oscillation of an original effect size always leads to a
    decline of oscillations in a cumulative z-score plot, as more data goes
    into the z-score calculation."
  editorInference: >-
    The one quantitative decline signature offered from this data set falls
    within what reshuffled data produce, and the commentary names why a
    single control run cannot test it. The last quotation bears on the
    whole decline literature: a cumulative score's swings shrink as data
    accumulate whether or not anything real is there, which is part of why
    the decline pattern (MPI-C003) cannot by itself favour MPI.
  exactLocator: "Frontiers in Psychology 9: 1350, main text (Figure 1 and the paragraphs before and after it)"
  limitations:
    - "Tests one post-hoc pattern in one experiment; it does not address the correlation-matrix record."
