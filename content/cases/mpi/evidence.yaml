- id: MPI-E025
  title: "Maier et al. 2018 on Maier & Dechamps: a strong micro-PK effect, then a strong null in its preregistered replication"
  claimIds: [MPI-C502]
  sourceId: SRC-MAIER-2018
  direction: supports
