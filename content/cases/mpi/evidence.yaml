- id: MPI-E019
  title: "Flores 2021: one of the three positive studies had a single participant, the researcher"
  claimIds: [MPI-C007]
  sourceId: SRC-FLORES-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    Study 3's design is described as the same as Study 1's "with the
    difference that there is only one participant in this study." The next
    lines (letter-spaced in the extracted text, paraphrased here) identify
    that participant as the researcher, who ran the 200 registered sessions
    herself, alone in the room, on different days. The conclusion chapter
    reports Study 3 significant under the permutation analysis (p = 0.0003,
    p. 284). It also notes that causal correlations appeared in parts of the
    raw data.
  editorInference: >-
    The design was registered in advance and openly reported, and the
    single-participant question is a legitimate one for this paradigm. But
    a study in which the experimenter is the only subject has no
    separation between the person who knows the hypothesis and the person
    producing the behavioural data. It cannot count as an independent
    replication of a mind–matter effect. Of the "three of five" positives,
    therefore, two came from conventional samples.
