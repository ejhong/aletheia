  title: "Flores 2021: the two later studies show no surplus, and one reverses"
  claimIds: [MPI-C003]
  sourceId: SRC-FLORES-2021
  direction: supports
  strength: moderate
  sourceStatement: >-
    Studies 4 and 5 added a second random generator, which the thesis
    calls a true RNG, beside the original one and dropped the separate control runs. The thesis's
