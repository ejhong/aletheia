- id: MPI-E021
  title: "Flores & Rapazote-Flores 2023: on the paper's second headline analysis, both random sources are significant"
  claimIds: [MPI-C503]
  sourceId: SRC-FLORES-2023
  direction: undermines
  strength: moderate
  sourceStatement: >-
    The abstract reports for the pseudo-random (Mersenne Twister) arm, at the
    final cumulative matrix: "The Welch’s T-test resulted in a value of
    1.813, with a corresponding p-value of 0.069" (p. 1). The methods say the
    authors "gave particular emphasis to results associated with the last
    datapoint and average datapoints" (p. 9). On the second of these, the
    average over the cumulative matrices, the same arm gives a significant
    result: "the T-test resulted in a value of 2,972, yielding a p-value of
    0,002 for the average analysis across the 23 datapoints" (p. 12); for
    Random.org the average analysis gave "a T-test value of 3,941,
    accompanied by a p-value of 8,13E-5" (p. 11).
  editorInference: >-
    The split between a true and a pseudo-random source, which the abstract
    reports and this case had presented as theoretically suggestive, holds
    for one of the paper's two emphasised analyses and not for the other.
    On the average analysis both arms differ significantly from control;
    the authors keep the split by appeal to effect-size and power
    thresholds the pseudo-random arm narrowly misses. A contrast that
    appears or vanishes with the choice between two analyses of the same
    data is not yet evidence that the source matters.
  exactLocator: "pp. 1–12 (abstract; methods; Results A.1–A.2)"
  limitations:
    - "The authors' own reading keeps the split, on their power and minimum-effect criteria; this record does not show those criteria are wrong, only that the significance contrast depends on the analysis."
