    A concession from researchers who work inside micro-PK and take MPI
    seriously enough to try to repair it: as they read the model, a failed
    replication cannot count against it, which is the substance of
    MPI-C010. It is their reading, not the model's author's — von Lucadou's
    own statement of what would refute the model is MPI-E023.
  exactLocator: "Frontiers in Psychology 9: 379, Additional Analysis (opening paragraphs)"
