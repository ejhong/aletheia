- id: MPI-E024
  title: "Grote 2021: the blind experiment split its random source in two, and both halves were null"
  claimIds: [MPI-C503]
  sourceId: SRC-GROTE-2021
  direction: context
  strength: weak
  sourceStatement: >-
    Grote's blind-analysis experiment assigned each participant at random,
    unknown to participant and experimenter, either to bits generated in
    real time or to hardware-random words combined with a Mersenne Twister
    stream and pre-recorded 15–30 minutes earlier. "When splitting the main
    analysis (for the upper matrix) into the two types of random data used,
    the p -values are p = 0.5876 for the real-time random data (RT-bits),
    and p = 0.4321 for the XOR’d and pre-recorded random data (XPR-bits)."
  editorInference: >-
    This is the corpus's only blinded comparison of random sources inside a
    matrix experiment, and it shows no difference because neither arm
    shows anything. It is not the same contrast as Flores's: both of
    Grote's arms contain hardware randomness, and they differ in
    pre-recording and pseudo-random mixing. But it is the design precedent
    for an equal-power source comparison (MPI-R003): randomised,
    concealed from participant and experimenter, and analysed blind.
  exactLocator: "p. 14 (Results, Experiment 1)"
  limitations:
    - "Each arm had about 100 participants; a null split inside a null overall result has little power to show a difference."
