# ── The strict replications ──────────────────────────────────────────────────

- id: MPI-E003
  title: "Nailing Jelly: two preregistered consensus-protocol replications fail"
  claimIds: [MPI-C002, MPI-C003]
  sourceId: SRC-WALACH-2021
  direction: supports
  strength: strong
  sourceStatement: >-
    Following a consensus protocol deposited on OSF before commencement, two
    independent replications of the 2020 experiment were run with the same
    equipment: 64 participants (post-hoc power 0.88) and 40 participants
    (power 0.69), analyzed by a nonparametric randomization test with 10,000
    iterations. "Neither of the two experiments was significant." The
    authors conclude "that the matrix experiment in and of itself is not a
    replicable paradigm in PSI research."
  editorInference: >-
    The proponents' own team, on the model's own chosen benchmark, under a
    protocol they froze in advance — the cleanest confirmation that the
    excess-correlation effect does not replicate on demand. Note the
    interpretive move that follows in the same abstract: the failure is
    read as "likely part of the systematic nature of such effects," which
    is the falsifiability crux (MPI-C010) in action.
  exactLocator: "JSE 35(4): 788–828, abstract and Tables 1–2"
  limitations:
    - "Power for the second replication was low (0.69); the first was adequately powered."
    - "Standard power analysis is itself contested under a model that denies stable effects — the authors provide theirs only post hoc."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (full text read)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

- id: MPI-E004
  title: "Grote 2021: full blind analysis of 200 participants finds nothing"
  claimIds: [MPI-C002]
  sourceId: SRC-GROTE-2021
  direction: supports
  strength: strong
  sourceStatement: >-
    An independent conceptual replication built from scratch tested 200
    participants under a blind-analysis protocol in which the complete
    analysis software was written and tested before the data were analyzed;
    the unblinding was performed live at the 2019 Parapsychological
    Association convention. "The main result was found to be not
    statistically significant and fell well within the expected random
    distribution of possible results." Two secondary/post-hoc analyses each
    yielded p = 0.06.
  editorInference: >-
    The methodologically strictest test in the corpus, by an experimenter
    independent of Lucadou's group, on the model's nominated paradigm:
    null. Under the conventional account this is the expected result; under
    MPI it is absorbed as decline — which is why this record weighs more
    against MPI-C007 than any single positive weighs for it.
  exactLocator: "JSE 35(2): 287–310, abstract"
  limitations:
    - "The two p = 0.06 secondary results are reported by the author as suggestive anecdota, not confirmations."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (DOI + journal page)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

