- id: MPI-E024
  title: "Guiard 2005: the decline-and-displacement postulate gives no criterion that separates a PK process from chance"
  claimIds: [MPI-C010]
  sourceId: SRC-LUCADOU-GUIARD-2005
  direction: supports
  strength: moderate
  sourceStatement: >-
    In his reply, Guiard addresses the postulate that an attempted signal
    makes the correlation vanish or change unpredictably, possibly showing
    up in other parameters of the random process. He writes: "Man muss nur
    lange genug irgendwelche Parameter aus den Prozessdaten berechnen,
    irgendwann wird sich ein Parameter als signifikant erweisen" and that
    "um nicht in den Verdacht der Selbstimmunisierung zu geraten, sollte
    Lucadou ein präzises Kriterium angeben, mit dem ein PK-Prozess von
    einem üblichen Zufallsprozess unterschieden werden kann. Diese präzise
    Formulierung des MPI steht noch aus" (p. 27). On the matrix
    experiment's constant correlation density, which Lucadou says may not
    itself be used as the observed criterion, Guiard concludes: "Damit
    hätte er aber das einzige Kriterium zur Unterscheidung zwischen einem
    PK-Prozess und einem reinen Zufallsprozess abgelehnt" (p. 28).
  editorInference: >-
    In English: "One need only compute enough parameters from the process
    data and one of them will eventually prove significant"; "to avoid the
    suspicion of self-immunisation, Lucadou should give a precise criterion
    by which a PK process can be distinguished from an ordinary random
    process. This precise formulation of the MPI is still outstanding"; and
    "he would thereby have rejected the only criterion for distinguishing a
    PK process from a purely random one." This is MPI-C010's charge made by
    a named critic, in print, to the model's author, and aimed at the
    matrix experiment's own statistic. Guiard also records agreement with
    Lucadou that ordinary accumulation is allowed where no signal can be
    sent (p. 29), so the dispute is narrower than a blanket charge of
    unfalsifiability.
  exactLocator: "Zeitschrift für Anomalistik 5 (2005), PDF pp. 27–28 (journal pp. 119–120, section 'Falsifizierbarkeitsprobleme wegen Hauptsatz 2')"
  limitations:
    - "A critic's argument, not a test; Lucadou's answer to this rejoinder, if any, was not searched for."
