- id: MPI-E022
  title: "Flores & Rapazote-Flores 2023: the 'pseudo-random' arm was seeded from participants' swipes"
  claimIds: [MPI-C503]
  sourceId: SRC-FLORES-2023
  direction: undermines
  strength: moderate
  sourceStatement: >-
    Of the Mersenne Twister generator the paper writes: "It is
    deterministic, but we utilized participant" finger swipes "to provide a
    timestamp seed, ensuring true non-deterministic random values" (p. 8).
  editorInference: >-
    The Mersenne Twister remains a deterministic algorithm: given its seed,
    its output is fixed. What the seeding changes is where the seed comes
    from. Because it was taken from the timing of the participant's own
    swipes, the sequence was not fixed before the session and is causally
    linked to the behaviour it was then correlated with. That does not
    erase the difference between an algorithm and an atmospheric-noise
    source, and it does not by itself show any statistical dependence
    between the two sets of variables; it does mean the arm was not the
    clean "predetermined sequence" condition the contrast is usually taken
    to test. The paper does not say whether the seed was set once per
    session or at each swipe; if at each swipe, the physical values would
    be a function of swipe timing, one of the psychological variables,
    which is an ordinary route to correlation. The stronger point against
    the claim is MPI-E021's: the reported split itself depends on which
    analysis is read.
  exactLocator: "p. 8 (Methods, Mersenne Twister)"
  limitations:
    - "The word 'finger' falls outside the quoted spans because the PDF's text layer drops the 'fi' ligature."
    - "How the seed was applied is not stated; the possible classical pathway is an inference, not a finding."
    - "The authors' phrase 'true non-deterministic random values' is their description; it is not shown here that timestamp seeding makes the sequence non-deterministic in any sense beyond the unpredictability of the seed."
  reviewState: ai_extracted
  origin:
    ref: "Flores & Rapazote-Flores 2023, Qeios v2 PDF read in full 2026-10-25"
