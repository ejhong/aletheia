- id: MPI-E007
  title: "Flores 2021: three of five studies significant, under an analysis adopted after the registered one"
  claimIds: [MPI-C007, MPI-C009]
  sourceId: SRC-FLORES-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    A doctoral thesis at Edinburgh's Koestler Unit ran five replication
    studies, the first two exact replications using Lucadou's own RNG,
    software and protocol. For Study 1, under the registered method, the
    thesis reports that "hypothesis 1 is accepted as more significant
    correlations were produced in the experimental session than in the
    control condition with the original method used by von Lucadou" — and
    in the same passage that "This Z showed to overestimate results." It
    records that "Two years later the first Z analysis, a permutation
    analysis was introduced to replace the original method of control." In
    the conclusion chapter (pp. 283–288, letter-spaced text, paraphrased
    here) the thesis reports Studies 1, 2 and 3 significant under the
    permutation analysis (p = 0.0002, 0.0002 and 0.0003 for the upper-right
    region of the matrix); the prediction not verified in Study 4 and no
    significant results in Study 5 (for Study 4 the thesis says the
    hypothesis has to be rejected, p. 240); and significance again only when the Study 4 and 5
    data were pooled post hoc (chapter 8). It also records agreeing with the
    physicist Thomas Filk that, once the data are permuted, the 900-cell
    upper-right analysis has no relevance (pp. 284–285).
  editorInference: >-
    This replaces the earlier reading of this record, which took the
    three-of-five from the successor preprint's summary and said the
    positives "survive her own dependence-aware analyses". Read in full, the
    positives are weaker than that. The registered analysis is the one the
    author herself says overestimates. The permutation analysis behind the
    three positives was introduced later. Its methods were not specified in
    the registration (MPI-E018). One of the three positive studies had a
    single participant, the researcher (MPI-E019). The two studies that
    added a second generator did not confirm the prediction. The record
    still qualifies the clean-null narrative: these are reported positives
    from a team that published its own nulls. But it gives the anomaly
    reading less than the case previously credited.
  exactLocator: "pp. 166–167 (quoted passages); conclusion chapter pp. 276–291 and p. 240 (paraphrased; PDF pages as the reading tool numbers them)"
  limitations:
    - "Thesis examination rather than journal peer review; the five studies share equipment, personnel, and analytic choices, so they are not five independent confirmations."
    - "The conclusion chapter and most results text extract as letter-spaced characters, so the per-study results are paraphrased with page locators rather than quoted; they can be checked against the PDF."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (ERA record + Flores 2023 preprint); rewritten 2026-10-23 from the thesis full text, read through scripts/site.ts read"
    extractedBy: "Fable (AI agent); revised by Claude Opus 5.5 (operator), session 2026-10-23-session-site-124118"
    runId: "2026-10-23-session-site-124118"
    date: "2026-10-23"

