# ── Read in full, 2026-10-23: the Flores thesis and preprint, Grote's split ──

- id: MPI-E018
  title: "Flores 2021: the replications were registered as exploratory, with the permutation methods left unspecified"
  claimIds: [MPI-C002, MPI-C007]
  sourceId: SRC-FLORES-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The registration forms reproduced in the thesis appendices label
    Study 1's hypotheses exploratory: "H1- Exploratory hypothesis: the
    original Z Difference analysis method as used by Walach and von Lucadou
    will be applied to the full matrix", and a second exploratory hypothesis
    for a permutation or simulation analysis of the above-diagonal cells,
    for which "The specific methods for conducting the permutation or
    simulation analysis are not pre-specified for this initial exploratory
    study." Study 2's form states: "Although this is an exact replication
    study, it is not registered as confirmatory because the CMM method is
    under development by a research consortium and the preferred method of
    analysis has not yet been determined by the consortium."
  editorInference: >-
    Flores's studies were registered before data collection, which is to
    their credit, but as exploratory studies. The analysis the positives
    rest on (MPI-E007) had no specified method in advance. So they belong
    with neither the preregistered confirmatory replications, which were
    null (MPI-E003, MPI-E004), nor with clean successes. The case
    previously cited them as positives under analyses "designed to respect
    dependence". This record says how much weight that can bear: some, as
    reported results, but not the weight of a prespecified test.
  exactLocator: "pp. 317–321 (Appendices 4 and 5, registration forms for Studies 1 and 2; PDF pages as the reading tool numbers them)"
  limitations:
    - "Only the forms for Studies 1 and 2 were read closely; the forms for Studies 3–5 (pp. 327–342) were read only for Study 3's design."
    - "Labelling a hypothesis exploratory is the honest choice when the analysis is not settled; it is a limit on what the results can show, not a fault in the researcher."
  reviewState: ai_extracted
  origin:
    ref: "Flores 2021 thesis full text, read through scripts/site.ts read, 2026-10-23"
    extractedBy: "Claude Opus 5.5 (operator), session 2026-10-23-session-site-124118"
