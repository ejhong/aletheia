- id: MPI-E006
  title: "Grote 2017: preplanned analyses null; a post-hoc variant significant"
  claimIds: [MPI-C002, MPI-C008]
  sourceId: SRC-GROTE-2017
  direction: supports
  strength: moderate
  sourceStatement: >-
    Twenty participants, 720,000 bits, three analyses defined and tested
    before looking at the data — including a conceptual replication of the
    correlation-matrix method. Results: p = 0.438, p = 0.703, and p = 0.0949
    for the three preplanned analyses (combined p = 0.315). "While none of
    the pre-defined analysis results is found significant, a post-hoc
    variant of analysis 3 that includes the control data is significant
    with p = 0.012."
  editorInference: >-
    One study, both lessons: the preplanned nulls extend the failed
    replication record (MPI-C002), and the significant post-hoc variant is
    a live demonstration of how analytic flexibility can conjure a positive
    from the same data (MPI-C008). The synthesis document that seeded this
    case cited the post-hoc figure as a replication success — an error this
    import corrects.
  exactLocator: "JSE 31(2): 231–254, abstract"
  limitations:
    - "Small sample (20 participants) limits what the preplanned nulls can exclude."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (journal article page)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

- id: MPI-E007
  title: "Flores 2021: five in-house replications, three significant under permutation tests"
  claimIds: [MPI-C007, MPI-C009]
  sourceId: SRC-FLORES-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    A doctoral thesis under Watt and Walach ran five replication studies,
    the first two exact replications using Lucadou's own RNG, software, and
    protocol, with new control and analysis methods introduced and compared
    against the originals. Per the successor preprint's summary, Flores
    "still reports significant results in three out of five studies," while
    her Monte Carlo work found that high intercorrelations among
    psychological variables had inflated the original studies' significance.
  editorInference: >-
    The most double-edged record in the case: partial positive results that
    survive her own dependence-aware analyses, produced inside the same
    project that sharpened the strongest statistical critique of the
    founding experiments. It qualifies both the clean-null narrative and
    the founding results at once.
  exactLocator: "Edinburgh Research Archive, handle 1842/38225"
  limitations:
    - "Thesis examination rather than journal peer review; the five studies share equipment, personnel, and analytic choices, so they are not five independent confirmations."
