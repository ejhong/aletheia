- id: MPI-E021
  title: "Flores & Rapazote-Flores 2023: the 'pseudo-random' arm was seeded from participants' swipe timestamps"
  claimIds: [MPI-C503]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    Physical variables were generated as follows: "In the experimental
    session, each participant’s finger swipe communicated with the RNG,
    generating four random numbers per swipe". Of the Mersenne Twister the
    paper says: "It is deterministic, but we utilized participant finger
    swipes to provide a timestamp seed, ensuring true non-deterministic
    random values." Among the psychological variables correlated with those
    numbers is timestep, the "time between the player's last two moves."
  editorInference: >-
    The contrast the case had described, a true random source against a
    deterministic one, is not what was run. By the authors' account, the
    second arm was a pseudo-random algorithm reseeded from the participant's
    own swipe timing, which they intended to make non-deterministic. This
    matters both ways. As a test of the quantum-flavoured prediction that
    only genuine indeterminacy should carry an effect, the arm is
    ambiguous. As a control, it links participant behaviour to the
    "physical" numbers by an ordinary route, through the seed. The text
    does not say whether the generator was reseeded at every swipe or once
    per session, or how control-session numbers were seeded.
  exactLocator: "pp. 6–7 (Physical Variables; Mersenne Twister; Qeios version 1, PDF pages as the reading tool numbers them)"
  limitations:
    - "A good pseudo-random generator reseeded from a timestamp should show no usable correlation with that timestamp; this record shows a design ambiguity, not that an artifact occurred."
