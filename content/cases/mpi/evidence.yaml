# ── 2026-10-27 operator session (2026-10-27-session-site-132125) ─────────────
# The thesis and the online replication read at full text, where the case had
# characterized them from a later preprint's one-paragraph summary.

- id: MPI-E018
  title: "Flores 2021, independent validation appendix: the matrix cells are not independent, and studies 1–3 keep their surplus under permutation"
  claimIds: [MPI-C009, MPI-C007]
  sourceId: SRC-FLORES-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The thesis's Appendix 11 is an independent re-analysis of Flores's raw
    data by the physicist Thomas Filk, using programs he wrote himself. It
    states the dependence problem directly: "The 45 × 45 = 2025 entries in
    the correlation matrices are not independent." It then compares each
    study's experimental matrix with 10,000 matrices built by pairing each
    experiment's psychological data with the physical data of a different,
    randomly chosen experiment. For study 1 (213 experiments), the
    experimental matrix has 316 correlations at or above 0.12; the control
    matrix has 142; the permuted matrices average 163, and 2 of the 10,000
    reach 316 (p. 400). Filk reports that comparing against permuted
    physical data from the experiment or from the control run makes almost
    no difference, which "justifies that in study 4 and 5 no control runs
    were made but only experimental runs" (p. 398).
  editorInference: >-
    This is the only dependence-aware analysis in the ledger whose numbers
    can be read at first hand, and it cuts both ways. It confirms the
    critique's premise: the cells are not independent. In study 1 the
    permutation null (163) sits above the old control count (142), so a
    control-based comparison overstated the surplus. But the surplus
    survives the correction by a wide margin in study 1, and, in the
    appendix's table, in studies 2 and 3 as well. What it does not do is
    reanalyse Lucadou's 1986–2006 data. MPI-C009 says those founding
    results shrink, but the appendix analyses only the thesis's own
    replications.
  exactLocator: "Edinburgh Research Archive PDF (FloresA_2021.pdf), Appendix 11, PDF pp. 395–400"
  limitations:
    - "Filk co-authored papers on Generalized Quantum Theory (Atmanspacher, Filk & Römer 2006; Filk & Römer 2011, as listed in the thesis bibliography), and the thesis describes him as knowledgeable on the matrix method; the appendix is an independent re-computation, not an adversarial audit."
    - "Studies 1–3 used the original equipment and shared the experimenter; study 3 had one participant (MPI-E020). Their surpluses are not three independent confirmations."
    - "The passages read report no preregistration of the permutation analysis. The thesis says the method was adopted from the 2017 consensus protocol after the data had already been analysed with the earlier Z-score formula (PDF pp. 241–242)."
  reviewState: ai_extracted
  origin:
    ref: "Flores 2021 thesis PDF, Appendix 11 (PDF pp. 391–400) read through scripts/site.ts read, 2026-10-27"
    extractedBy: "Claude Opus 5.5 (operator), session 2026-10-27-session-site-132125"
    runId: "2026-10-27-session-site-132125"
    date: "2026-10-27"

