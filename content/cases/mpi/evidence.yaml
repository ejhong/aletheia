- id: MPI-E021
  title: "Flores & Rapazote-Flores 2023: on the paper's average analysis, the pseudo-random arm is significant too"
  claimIds: [MPI-C503]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The paper reports two analyses for each generator: the last datapoint
    (all sessions in one matrix) and the average over cumulative matrices
    built in steps of 250 sessions. In the Mersenne Twister arm the
    last-datapoint result is not significant (t = 1.813), but the average
    analysis is: "Specifically, the T-test resulted in a value of 2,972,
    yielding a p-value of 0,0029 for the average analysis across the 23
    datapoints" (p. 11). Both arms show the same sign pattern: "The average
    correlations from experimental sessions are always positive, while
    most control session averages are negative" (p. 10). Of the Mersenne
    Twister the paper says: "It is deterministic, but we utilized
    participant finger swipes to provide a timestamp seed, ensuring true
    non-deterministic random values" (p. 7).
  editorInference: >-
    The headline split (significant with a true random source, not with a
    pseudo-random one) holds only for the last-datapoint analysis. On the
    paper's other primary analysis, both generators differ from control in
    the same direction: in both, the experimental mean is positive and the
    control mean mostly negative. The paper never tests whether the two
    generators differ from each other, and one result being significant
    while the other is not does not show a difference between them. And
    because the pseudo-random arm was seeded from the participant's swipe
    timing, it is not a deterministic comparison condition, whatever the
    generator's algorithm.
  exactLocator: "Qeios 0PAHC2 v1 (27 Dec 2023), PDF pp. 7–11 (at pp. 7, 10 and 11)"
  limitations:
    - "The paper cannot settle whether the shared sign pattern reflects a procedural difference between experimental and control sessions or an effect common to both arms. The raw data are available only on request."
