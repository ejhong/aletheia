- id: MPI-E008
  title: "Flores & Rapazote-Flores 2023: large online replication splits by RNG type"
  claimIds: [MPI-C007]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: weak
  sourceStatement: >-
    An online-game implementation with 726 participants and ~10,900 sessions
    found a significant experimental–control difference for the 64×64 matrix
    with the Random.org true-random source (Welch's t = 3.811, p = 0.00013,
    power 94%) but not with the Mersenne Twister pseudo-random generator
    (t = 1.813, p = 0.070, power 67%).
  editorInference: >-
    Directionally interesting for quantum-flavored theories, which want
    genuine indeterminacy to matter (see MPI-C503) — but an unreviewed
    preprint with an uneven power split between the two arms, and the
    gamified online protocol departs far from the laboratory paradigm.
  limitations:
    - "Preprint; not peer reviewed."
    - "The pseudo-RNG arm had lower achieved power, so the split is weaker evidence than the headline p-values suggest."
  reviewState: ai_extracted
