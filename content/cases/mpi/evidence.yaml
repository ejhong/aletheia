- id: MPI-E022
  title: "Flores & Rapazote-Flores 2023: the pseudo-random arm was also significant under the averaged analysis"
  claimIds: [MPI-C503]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The paper reports two analyses for each generator: the full-sample
    matrix (its headline result) and the average over 22 or 23 cumulative
    matrices. For the Mersenne Twister, "the T-test resulted in a value of
    2,972, yielding a p-value of 0,0029 for the average analysis across the
    23 datapoints." The authors summarise: "Results from both RNGs show, on
    average, statistically significant outcomes". They classify the
    Mersenne Twister result as not significant by their own combined rule,
    which requires p below 0.05, power of at least 0.9 and an effect above
    a computed minimum (0.0716; the averaged effect was 0.0656).
  editorInference: >-
    "Significant with the true source, null with the pseudo-random one"
    holds for the full-sample analysis only. Under the paper's other
    reported analysis, both arms clear p < 0.05 in the same direction, and
    the split rests on a power-and-effect-size rule. No test of the
    difference between the arms is reported. The defensible reading is
    that both arms leaned the same way, the true-random arm more strongly.
    That is weaker than a dissociation.
  exactLocator: "pp. 11–14 (Results A.2 and B; Qeios version 1, PDF pages as the reading tool numbers them)"
  limitations:
    - "The averaged analysis pools cumulative matrices that share data (each includes all earlier sessions), so its p-value is not independent of the full-sample result."
