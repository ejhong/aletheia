# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit and read against the listed
# claims; sourceStatement (what the source says) is kept separate from
# editorInference (what we infer).

# ── The founding program ─────────────────────────────────────────────────────

- id: MPI-E001
  title: "Lucadou's original matrix experiments report excess correlations"
  claimIds: [MPI-C001]
  sourceId: SRC-LUCADOU-2006
  direction: supports
  strength: moderate
  sourceStatement: >-
    The 2006 proceedings paper presents the Model of Pragmatic Information
    and Lucadou's correlation-matrix experiments, reported by the author and
    his co-workers as producing more significant psychological–physical
    correlations in experimental sessions than expected by chance or seen in
    control matrices.
  editorInference: >-
    This is the founding evidence line of the whole program. Its weight
    depends entirely on whether the significance counting survives the
    dependence critique (MPI-C009), which had not been formulated when these
    analyses were run.
  limitations:
    - "Full text not examined for this import; results characterization follows the descriptions in Walach et al. (2020, 2021) and Grote (2021)."
    - "Author's own experiments, pre-preregistration era; the original 1986–1987 series was published mainly in German-language venues."
    - "Original raw data have not been published for independent reanalysis."
  reviewState: ai_extracted
  origin:
    ref: "MPI synthesis document; cross-checked against successor-paper descriptions"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

- id: MPI-E002
  title: "Walach et al. 2020: a large two-lab replication reports a significant surplus"
  claimIds: [MPI-C001, MPI-C007]
  sourceId: SRC-WALACH-2020
  direction: supports
  strength: moderate
  sourceStatement: >-
    A two-laboratory replication with rebuilt hardware and software and a
    45×45-variable matrix (2,025 cells) reported evidence for anomalistic
    correlations between human behavior and a random event generator,
    evaluated against 10,000 simulated experiments.
  editorInference: >-
    The strongest positive result in the modern record — and qualified by
    its own authors a year later, who described it as "a significant but
    fragile effect, as significance broke down in reasonably improved
    methods of analysis" (Walach et al. 2021). Both halves belong in the
    ledger.
  exactLocator: "Psychology of Consciousness 7(2): 173–188"
  limitations:
    - "Co-authored by the model's originator."
    - "Significance was not robust across analysis variants, per the authors' own successor paper."
