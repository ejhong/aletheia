- id: MPI-E020
  title: "A preregistered prediction of no decline, made inside the program, fails"
  claimIds: [MPI-C002, MPI-C003]
  sourceId: SRC-FLORES-2021
  direction: supports
  strength: moderate
  sourceStatement: >-
    The preregistration protocol for the thesis's Study 4, dated April 2018,
    states: "Hypothesis 1: replicates the CMM predicting no decline or small
    decline effect will occur comparing with previous two studies." It
    fixes the test for the full matrix: "If analyses to all matrix, 2025
    cells obtain significant results, CMM hypothesis is confirmed for the
    entire matrix." (p. 333). The concluding chapter (p. 286, letter-spaced
    in the PDF and paraphrased here) reports that with the original
    generator the prediction was not verified — experimental sessions
    produced fewer significant correlations than the permutation control,
    a strong negative Z — and lists possible explanations: a new
    researcher, his presence in the room, instructions delivered
    differently, organisational closure not achieved, fewer sessions,
    boredom, and the decline effect itself. Study 5, its exact replication,
    had no significant results (p. 287).
  editorInference: >-
    A rare thing in this literature: a prediction written down in advance,
    inside the program, that the effect would not decline — and the effect
    then declined and reversed. It extends the run of failed preregistered
    replications and adds a sign change to the instability record. It bears
    on the falsifiability crux both ways: the program did expose itself to
    a failable test, and when the test failed, the failure was read through
    a list of explanations in which the decline effect itself stands
    beside the experimenter, the instructions and the participants'
    engagement — the model was not counted as having failed.
  exactLocator: "p. 333 (Appendix 7, preregistration of Study 4); outcome in the concluding chapter at PDF pp. 286–287"
  limitations:
