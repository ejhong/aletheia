- id: MPI-E011
  title: "The matrix design's stated rationale: use evasion, don't fight it"
  claimIds: [MPI-C006]
  sourceId: SRC-LUCADOU-ROMER-WALACH-2007
  direction: supports
  strength: strong
  sourceStatement: >-
    "In order to reduce the decline effect, one should make positive use of
    the evasion phenomenon. This can be done by simultaneous registration of
    as many different correlations as possible. Psi effects will then show
    up as transitory, jumping unexpected and statistically unlikely patterns
    in the correlation matrix. Clearly, by such measures it will never be
    possible to overcome the decline effect completely and to convince every
    sceptic."
  editorInference: >-
    The design rationale concedes in advance that the paradigm will not
    produce skeptic-proof replication — a candor that reads either as
    theoretical consistency or as a pre-announced excuse, depending on the
    attribution rung. Either way, it binds MPI to the matrix record as its
    best available test.
  exactLocator: "JCS 14(4), at p. 12 of the text"
  limitations:
    - "Same source and authors as MPI-E009; not an independent attestation."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (full text read)"
    extractedBy: "Fable (AI agent)"
