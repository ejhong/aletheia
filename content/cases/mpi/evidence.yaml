- id: MPI-E018
  title: "Flores 2021: the founding method's Z score overstated results because the variables are dependent"
  claimIds: [MPI-C009]
  sourceId: SRC-FLORES-2021
  direction: supports
  strength: moderate
  sourceStatement: >-
    Discussing her first exact replication, which she analysed both with
    Lucadou's original method and with a permutation test, the thesis
    concludes that "it is clear that the original Z overestimates results,
    due to the dependency of the variables" (p. 186). Of the permutation
    analysis it writes: "It is clear that the results from the second Z
    score, using the permuted data set, lowered the results" (p. 182) — while
    the experimental sessions still produced more significant correlations
    than control.
  editorInference: >-
    The dependence critique stated in the primary text, by a replicator
    working inside the program under one of its theorists, about the very
    method the founding experiments used. It carries the claim's first half
    — the original counting was inflated — directly. Its second half, that
    dependence-aware reanalysis diminishes the founding results themselves,
    remains inferred: the thesis reanalyses its own replication data, not
    the 1986–2006 datasets.
  exactLocator: "pp. 182–186 (Chapter 5, discussion of Study 1)"
  limitations:
    - "Concerns the thesis's own Study 1 data analysed with the founding method, not a reanalysis of Lucadou's original datasets."
    - "The permutation p-values for the upper-right block of the matrix are disputed in the thesis itself: its concluding chapter (pp. 284–285, letter-spaced, paraphrased) reports the view of Thomas Filk and others that, once the data are permuted, the 900 'future' cells no longer hold future data and so carry no special weight — a position the author says she sympathises with."
  reviewState: ai_extracted
  origin:
    ref: "Flores 2021 thesis, full PDF read 2026-10-25"
