- id: MPI-E023
  title: "Flores & Rapazote-Flores 2023: 4,096 cells from four-by-four variables, treated as the sample"
  claimIds: [MPI-C007]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    Experimental random numbers are drawn swipe by swipe, while "in the
    control session, all random numbers are produced at once, independent
    of participant intervention" (p. 5). The 64×64 matrix is made by cutting
    each session's series into sixteen segments: "Without fragmentation, the
    matrix resolution would be limited to 4x4 (4 psychological variables
    with 4 physical variables)" (p. 9). The main test is "a comparison
    between the distribution of correlations derived from experimental and
    control sessions using Welch’s T-test" (p. 9). The power analysis then
    takes "a sample size represented by the matrix cells amounting to
    4,096" (p. 14). The Monte Carlo check shuffled the physical variables
    only, and "the current study employed 100 simulations" (p. 10).
  editorInference: >-
    The online study's power analysis counts its 4,096 matrix cells as the
    sample, and its main test compares the distributions of cell
    correlations between experimental and control sessions; a Welch test
    takes its observations as independent. The cells are built from four
    psychological and four physical variables cut into segments, so they
    may well be dependent — the same kind of dependence that inflated the
    founding counts. The paper does not discuss whether the cells are
    independent, and this record does not show that their dependence
    changes the result: it is a suspected weakness, not a demonstrated
    error. The experimental and control series are also generated by
    different procedures, so a difference between them need not be
    anomalous. The paper, read in full, describes no preregistration. None
    of this shows the result is an artefact; it shows the result has not
    yet been tested in the way the program's own critique requires.
  exactLocator: "pp. 5–14 (Methods; Statistical analysis; Results A.4)"
  limitations:
    - "Design observations, not a reanalysis; the raw data are available only on request and no independent reanalysis has been published."
    - "Whether the paper's Monte Carlo step, which shuffles only the physical variables, was used to calibrate the test against the cells' dependence is not clear from the text; this record does not assume it was not."
  reviewState: ai_extracted
