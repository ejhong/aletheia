- id: MPI-E023
  title: "Lucadou 2005: MPI is falsifiable — by a reliable signal, which he predicts would always contain a sensory leak"
  claimIds: [MPI-C010]
  sourceId: SRC-LUCADOU-GUIARD-2005
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    In his English abstract (PDF p. 2) von Lucadou states that the MPI's
    predictions differ from the null hypothesis and that the model can in
    principle be falsified by existing or future experimental data. In the
    section on falsifiability (p. 10) he writes: "Daher ist das MPI also nicht
    unfalsifizierbar, wie Guiard suggeriert"; the demonstration of reliable
    signal transmission by PK or ESP "würde es sofort zu Fall bringen". He
    continues: "Jedes Psi-Experiment, bei dem zuverlässig Information vom
    Sender auf den Empfänger übertragen werden kann, enthält ein
    sensorisches Leck", adding in parentheses that this includes fraud.
  editorInference: >-
    In English: "So the MPI is not unfalsifiable, as Guiard suggests"; a
    reliable signal "would bring it down at once"; and "every psi
    experiment in which information can be reliably transmitted from sender
    to receiver contains a sensory leak." The model's author does name a
    refuting outcome, which is the strongest reply to MPI-C010. But in the
    same breath he predicts that any experiment showing that outcome will
    have a conventional flaw — so the named refutation is, in his framing,
    already assigned to a leak. It is also not an outcome of the matrix
    experiment the model nominated (MPI-C006), which is the scope MPI-C010
    is about.
  exactLocator: "Zeitschrift für Anomalistik 5 (2005), PDF p. 10 (journal p. 102, section 'Das MPI, Makro-PK und seine Falsifizierbarkeit'); the English abstract's summary is at PDF p. 2"
  limitations:
    - "One statement, from 2005; the model's later formulations (2007, 2015) were not checked for a different or more specific criterion."
    - "Translation is the editor's; the German is quoted verbatim."
    - "Lucadou also says in the same section that MPI makes statements about haunting cases, sitter groups and social conflict; whether those yield bindable predictions is not assessed here."
