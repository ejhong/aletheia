  direction: supports
  strength: moderate
  sourceStatement: >-
    The thesis reports the answer given by the model's author to the
    objection that dependent variables inflate the count: "Lucadou (2016)
    considers this argument to be true only in the situations where causal
    signals hold." It goes on: "the model predicts that the value of
    significant correlations will decline in the case of replications. For
    this reason, some novelty has to be introduced in each replication."
    (p. 183)
  editorInference: >-
    Two moves that together make the matrix record hard to hold against the
    model. A statistical objection is declared to apply only to causal
    signals — the kind of effect the model says psi is not — so the
    inflation it identifies need not count; and each replication is to
    differ from the last, so no study repeats another closely enough for its
    failure to count as a failure to replicate. The 2023 online study makes
    the same appeal to novelty when it explains its own departures from the
    earlier design. Neither move is unreasonable inside the theory; both
    reduce what a null can show.
  exactLocator: "p. 183 (Chapter 5, discussion of Study 1)"
  limitations:
    - "Second-hand: the thesis's report of Lucadou's position; the 2016 source it cites was not identified or read for this record."
    - "A supervisee's summary of the model's author, not a statement in a reviewed publication by him."
