# ── The conventional steelman's own evidence ─────────────────────────────────

- id: MPI-E015
  title: "Bösch 2006: micro-PK meta-analysis — tiny effects, huge heterogeneity, publication bias"
  claimIds: [MPI-C008]
  sourceId: SRC-BOSCH-2006
  direction: supports
  strength: strong
  sourceStatement: >-
    A meta-analysis of 380 REG-intention studies found a very small but
    significant overall effect, extreme heterogeneity, and a strong
    small-study effect, concluding that publication bias appears to be the
    easiest and most encompassing explanation for the primary findings.
  editorInference: >-
    The base-rate backdrop for the whole case: the broader literature the
    matrix experiments grew from is consistent with selection processes
    acting on null effects. Radin and colleagues' published rebuttal (same
    issue) contests the smallest-studies weighting — the dispute is noted,
    not resolved, here.
  exactLocator: "Psychological Bulletin 132(4): 497–523"
  limitations:
    - "Targets classical hit-rate micro-PK, not the matrix paradigm itself."
    - "A published comment (Radin et al. 2006) disputes the meta-analytic weighting choices."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (Crossref, incl. comment/reply)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

- id: MPI-E016
  title: "Bierman 2016: QRP simulation explains much — not all — of a flagship psi effect"
  claimIds: [MPI-C008]
  sourceId: SRC-BIERMAN-2016
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    Simulating questionable research practices at empirically observed
    frequencies against the ganzfeld meta-analytic database, the authors
    conclude "that QRPs are capable of explaining about 60% of the effect
    size reported in the GF meta-analysis," that the reported significance
    "is likely inflated by QRPs, though results are still significant
    (p = 0.003) with QRPs," and that a good fit with no anomalous effect
    required unrealistic QRP parameter values.
  editorInference: >-
    Cuts both ways, and is filed that way: it quantifies how far QRPs
    really go (a long way), and it documents that in the best-studied
    neighboring database they did not, under this model, cover the whole
    distance. Applying either lesson to the much smaller matrix corpus is
    an extrapolation.
  exactLocator: "PLOS ONE 11(5): e0153049, abstract and discussion"
  limitations:
    - "Ganzfeld telepathy data, not matrix experiments; QRP frequencies were borrowed from psychology surveys under an untested assumption of comparability."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (full abstract and conclusions read)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

