- id: MPI-E022
  title: "Maier & Dechamps, quoted in Maier et al. 2018: true nulls cannot be told from decline under MPI"
  claimIds: [MPI-C010]
  sourceId: SRC-MAIER-2018
  direction: supports
  strength: moderate
  sourceStatement: >-
    Summarising von Lucadou's model, the authors write that "the novelty of
    a finding is complementary related to its likelihood of confirmation"
    and that the effect "might unsystematically re-appear on other
    indicators that were not initially studied." They then quote their own
    paper, then in press: "the theoretical problem with this approach
    however is that real null effects documented by replication failures of
    spurious findings cannot be distinguished from decline effects. The
    consequence is that with the standard scientific replication approach
    micro-psychokinesis effects cannot be scientifically studied."
