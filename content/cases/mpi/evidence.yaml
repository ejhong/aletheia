- id: MPI-E023
  title: "Flores & Rapazote-Flores 2023: a 4,096-cell matrix built from four variables a side, tested as 4,096 samples"
  claimIds: [MPI-C007]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The 64×64 matrix was built from four psychological and four physical
    variables: "240 elements of each variable were fragmented in 16 groups
    of columns with 15 elements per column, for each of the 4 variables."
    Experimental and control matrices were compared with a Welch t-test on
    the distributions of their cell correlations, and the minimum effect
    size was computed with the "sample size represented by the matrix cells
    amounting to 4.096". The Monte Carlo step shuffled the physical
    variables only, and "the current study employed 100 simulations". Its
    results are reported as statistical power.
  editorInference: >-
    The newest positive in the case uses the same kind of analysis the
    program's own 2016 registration warned against (MPI-E020). Its 4,096
    cells are 16 fragments each of four variables a side, and they are
    treated as independent samples. Cells that share a variable, or that
    share fragments of one participant's correlated behaviour, are not
    independent. Treating them as if they were understates the standard
    error, by an amount the paper does not estimate. A permutation p-value
    for the experimental–control difference, which would respect that
    structure, is not reported. This is the operator's reading of the
    methods as described, not a reanalysis; the raw data are available
    from the authors on request.
  exactLocator: "pp. 8–12 (Building correlation matrix; Statistical analysis; Results A.4; Qeios version 1, PDF pages as the reading tool numbers them)"
  limitations:
    - "An inference from the described methods; how much the dependence inflates this particular result is unknown without the data."
  reviewState: ai_extracted
