- id: MPI-E007
  title: "Flores 2021: five preregistered in-house replications — three significant, one of them with the author as sole participant; the last two not"
  claimIds: [MPI-C007, MPI-C002]
  sourceId: SRC-FLORES-2021
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The thesis states of its first study: "All study was pre-registered, and
    all details previously defined before the beginning of collecting data."
    (p. 185; a preregistration protocol for each of the five studies is
    printed in Appendices 4–8). Its table for Study 3 is captioned as showing
    "significant correlations from study with only one participant" (p. 211);
    the text on p. 210 says the author was that participant, contributing all
    200 sessions. The concluding chapter (pp. 283–288, letter-spaced in the
    PDF and so paraphrased here, not quoted) reports: under the permutation
    analysis, Studies 1, 2 and 3 were significant for the upper-right block
    of the matrix (p = 0.0002, 0.0002 and 0.0003) and for the whole matrix;
    in Study 3 causal correlations appeared in parts of the raw data; in
    Study 4, run with the original generator, experimental sessions produced
    fewer significant correlations than the permutation control, and the new
    true-random generator produced more only at the p = 0.05 threshold, so
    that the prediction was not verified; Study 5, an exact replication of
    Study 4, had no significant results. A post hoc analysis pooling Studies
    4 and 5 by generator (p. 289) was reported significant.
  editorInference: >-
    The record behind the phrase "three of five significant" is narrower
    than the phrase. The three positives are the first three studies, the
    third of which had one participant — the experimenter herself — and
    traces of causal correlation in its raw data; the two later studies,
    preregistered like the rest, failed, the first of them with a reversal.
    The positive tally survives only by counting the self-participant study
    or by pooling the failures after the fact. This replaces the record's
    earlier wording, which took the tally from the 2023 preprint's summary
    rather than from the thesis.
  exactLocator: "pp. 185–211 (Study 1 discussion; Table 6-3); concluding chapter at PDF pp. 283–289"
  limitations:
    - "Thesis examination rather than journal peer review; the five studies share equipment, personnel, and analytic choices, so they are not five independent confirmations."
    - "The concluding chapter's text layer is letter-spaced, so its results are paraphrased from the PDF rather than quoted; a reader should check them against pp. 283–289."
    - "The upper-right block's permutation p-values are themselves disputed in the thesis (see MPI-E018's limitations)."
  reviewState: ai_extracted
  origin:
    ref: "Flores 2021 thesis, full PDF read 2026-10-25 (replaces the 2026-08-22 wording drawn from the 2023 preprint's summary)"
    extractedBy: "claude-opus-5-5 (operator), session 2026-10-25-session-site-123805"
    runId: "2026-10-25-session-site-123805"
    date: "2026-10-25"

