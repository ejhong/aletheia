# ── The theory's content ─────────────────────────────────────────────────────

- id: MPI-E009
  title: "The NT axiom and the decline derivation, in the theorists' own words"
  claimIds: [MPI-C005]
  sourceId: SRC-LUCADOU-ROMER-WALACH-2007
  direction: supports
  strength: strong
  sourceStatement: >-
    "Entanglement correlations cannot be used for transmitting signals or
    controllable causal influences." From this the paper derives: an
    apparent causal effect "will be wiped out, if one tries to corroborate
    it by improving statistics through attempts at replicating the effect.
    This is the well known and often experienced decline effect. The
    decline effect will be faster, if the original effect was stronger: the
    reciprocity of effect strength and reproducibility is a further
    prediction of Generalized Quantum Theory." Correlations "may even
    change sign or disappear altogether, or else show up again in different
    observables and/or between different parts of the system."
  editorInference: >-
    Establishes that the decline/displacement predictions are genuinely in
    print (2007) rather than retrofitted to the 2017–2021 failures. Note
    the strength–reproducibility reciprocity: a distinctive, testable piece
    of fine structure that no replication has yet targeted with a
    prespecified metric.
  exactLocator: "JCS 14(4): 50–74, at pp. 10–12 of the text"
  limitations:
    - "A theory paper: this record evidences what the model predicts, not that the predictions are true."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (full text read)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
    date: "2026-08-22"

- id: MPI-E010
  title: "GQT: the formal framework in a physics-foundations venue"
  claimIds: [MPI-C004]
  sourceId: SRC-ATMANSPACHER-2002
  direction: supports
  strength: moderate
  sourceStatement: >-
    The paper axiomatizes a "weak" quantum theory retaining complementarity
    and entanglement for arbitrary systems while dropping Hilbert-space
    structure and Planck's constant, explicitly anticipating macroscopic,
    non-physical applications.
  editorInference: >-
    The formalism is real and published where physicists could object to
    it. What it purchases in generality it pays for in predictive force:
    without quantified probabilities, GQT cannot say how big a matrix
    surplus should be — only that unexploitable correlations may exist.
  exactLocator: "Foundations of Physics 32(3): 379–406"
  limitations:
    - "Framework, not evidence: no empirical result in this record bears on whether psychophysical entanglement exists."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (Crossref)"
    extractedBy: "Fable (AI agent)"
