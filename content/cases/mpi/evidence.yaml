# ── Field test and background patterns ───────────────────────────────────────

- id: MPI-E013
  title: "Watt & Tierney 2013: MPI's first field test returns null, underpowered"
  claimIds: [MPI-C007]
  sourceId: SRC-WATT-TIERNEY-2013
  direction: qualifies
  strength: weak
  sourceStatement: >-
    A three-year, sixteen-country collaborative study — described by its
    authors as the first systematic test of the MPI — used a waiting-list
    design on spontaneous RSPK-type cases, predicting that cases viewed and
    documented in detail would show reduced anomalous experiences relative
    to undocumented cases. Of 43 referrals, 14 cases completed the study
    (6 documented). "Analysis of the two formal study hypotheses did not
    provide support for the predictions of the MPI, and it was concluded
    that this aspect of the research was of limited success due to low
    statistical power."
  editorInference: >-
    The only attempt to test MPI's documentation-suppresses-phenomena
    prediction outside the laboratory. As evidence it is nearly mute — 14
    cases cannot decide anything — but it demonstrates that the model's
    field predictions are operationalizable, which matters for MPI-C010.
  exactLocator: "JCS 20(11–12): 205–220, abstract"
  limitations:
    - "Severely underpowered (14 completed cases against the planned sample)."
    - "Referral flow collapsed for documented sociological reasons (rise of amateur ghost-hunting groups), confounding the recruitment base."
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 (author proof read in full)"
    extractedBy: "Fable (AI agent)"
    runId: "mpi-case-2026-08-22"
