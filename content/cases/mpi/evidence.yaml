# ── Added 2026-10-24 (operator session 2026-10-24-session-site-120419) ──────
# The attempts to make decline a testable signature, and the published
# argument over whether MPI can be falsified.

- id: MPI-E018
  title: "Dechamps & Maier 2019: a preregistered decline-as-oscillation prediction does not beat random simulations"
  claimIds: [MPI-C504]
  sourceId: SRC-DECHAMPS-MAIER-2019
  direction: supports
  strength: strong
  sourceStatement: >-
    From two earlier smoker studies (297 participants) that showed a strong
    early micro-PK effect and then a decline, the authors fitted a dampened
    harmonic oscillation and extrapolated it as a prediction for 203 newly
    tested smokers, preregistered (the paper cites osf.io/wn5b7, p. 27).
    Three preregistered statistics compared the new data with 10,000
    simulated datasets generated on the same random generator. Area between
    curves: "Of all 10,000 simulations, 18.71% revealed a smaller area
    between them and the prediction" (p. 16). Turning point: "In sum, 19.42%
    of simulations showed a smaller distance for their turning points to the
    prediction" (p. 17). End point: "Of all simulations, only 5.28% showed a
    smaller distance to the prediction" (p. 17). The authors summarise:
    "Even though the experimental data are closer to the prediction than
    most simulations", they did not stand out significantly (p. 18).
  editorInference: >-
    This is the nearest thing in the record to a prospective, quantitative
    test of decline fine structure: a shape for the decline stated before
    the data and scored against an ensemble of chance runs. On the
    preregistered statistics it failed. It is not a test of MPI itself —
    the authors say their systematic oscillation departs from MPI's
    unsystematic decline (MPI-E019) — so its weight falls on the project of
    turning decline into a checkable prediction, not on the model's core.
  exactLocator: "JSE 33(3): 406–434, PDF pp. 16–18 (Main Results; Discussion of the Main Analyses), p. 27 (note 1)"
  limitations:
    - "One study of 203 new participants; the authors attribute the null partly to a prediction too undistinctive to separate random from non-random data."
    - "Tests an extension proposed by the Munich group, not a prediction the MPI's own theorists endorsed in advance."
    - "The preregistration itself (osf.io/wn5b7) was not read; that the three statistics were preregistered is the paper's account."
  reviewState: ai_extracted
  origin:
    ref: "Dechamps & Maier 2019, full text retrieved through scripts/site.ts read (LMU open-access copy), main results and discussions read, 2026-10-24"
    extractedBy: "Claude Opus 5.5 (operator), session 2026-10-24-session-site-120419"
    runId: "2026-10-24-session-site-120419"
    date: "2026-10-24"

- id: MPI-E019
  title: "Dechamps & Maier 2019: post hoc trajectory measures distinguish the data from simulations, by the authors' account"
  claimIds: [MPI-C504]
  sourceId: SRC-DECHAMPS-MAIER-2019
  direction: qualifies
  strength: weak
  sourceStatement: >-
    After the preregistered tests, the authors looked for other ways "of
    assessing the development of the effect on a post hoc basis" (p. 26) —
    the highest Bayes factor reached, the energy of the Bayes-factor curve,
    and a Fourier transform of it — and report: "Both these methods could
    reliably distinguish between an experimental sample and a control group
    or simulated data at a 1% level" (p. 26). They place their proposal
    against the MPI: "There is one critical difference from the MPI,
    however: We predict that the interplay between effect and countereffect
    leads to a systematic pattern in the development of the effect itself;
    in principle, this is something that can be predicted and tested"
    (p. 26). They describe MPI's authors as concluding that psi effects are
    "not accessible to reproducibility-oriented research" (p. 25).
  editorInference: >-
    The post hoc measures are the authors' reason to think the oscillation
    idea still has life, and they are recorded here for fairness. They were
    chosen after the preregistered tests did not separate the data from
    chance, which is the pattern of analytic flexibility the conventional
    account (MPI-C008) warns of; they become evidence only when frozen and
    applied to new data (MPI-R006). The passage on MPI is a third party's
