- id: MPI-E022
  title: "Flores & Rapazote-Flores 2023: the significance test takes the 4,096 matrix cells as its sample"
  claimIds: [MPI-C007]
  sourceId: SRC-FLORES-2023
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The 64×64 matrix is built from four psychological and four physical
    variables: "240 elements of each variable were fragmented in 16 groups
    of columns with 15 elements per column, for each of the 4 variables"
    (p. 8). The experimental and control matrices are compared "using
    Welch's T-test, assuming the normal distribution of the data" (p. 8).
    The power analysis takes as its "sample size represented by the matrix
    cells amounting to 4.096" (p. 12). The control data are produced
    differently from the experimental data. During play, each swipe calls
    the generator for four numbers (p. 6). The control session "runs
    automatically on the participant's device after the completion of the
    experimental session without their knowledge" (p. 5). The Monte Carlo
    check uses 100 shuffles of the physical variables (p. 9).
  editorInference: >-
    The test treats the 4,096 cells as independent observations. They are
    built from four variables on each side, each cut into sixteen pieces.
    This is the dependence problem the program's own critique raised
    against the founding experiments (MPI-C504), and the reported p-value
    and power assume it away. The control is also produced by a different
    procedure, so a systematic difference between the matrices need not be
    a mind–matter effect. Neither point shows that the result is an
    artifact, but both mean its p-value cannot be taken at face value.
  exactLocator: "Qeios 0PAHC2 v1 (27 Dec 2023), PDF pp. 5–12 (at pp. 5, 6, 8, 9 and 12)"
  limitations:
    - "The paper does not say how often the Mersenne Twister was reseeded, or exactly how the control session requested its numbers, so how far the two procedures differ is not fully known."
    - "The raw data are not deposited (available on request, per v2 p. 19), so the dependence cannot be checked independently."
