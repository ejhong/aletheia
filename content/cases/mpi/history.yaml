# Change history, append-only.

- date: "2026-08-22"
  change: >-
    Case seeded from the "Entangled Minds and Pragmatic Information"
    synthesis document (runId mpi-case-2026-08-22): the document was read in
    full and mined for claims, evidence, and sources; every citation was
    then independently re-verified against Crossref, publisher pages, or
    retrieved full text before import. Primary texts read in full during
    verification: von Lucadou, Römer & Walach 2007 (JCS), Walach et al.
    2021 ("Nailing Jelly"), Watt & Tierney 2013 (author proof), Kennedy
    2003, Flores & Rapazote-Flores 2023, and the Bierman 2016 abstract and
    conclusions.
  reason: "Real citations only: a synthesis document may not carry assessments second-hand."
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-22"
  change: >-
    Two mischaracterizations in the seeding synthesis document identified
    and corrected on import. (1) It presented Grote 2017 as a successful
    CMM replication citing p ≈ 0.012; the published abstract shows all
    three preplanned analyses null (p = 0.438, 0.703, 0.0949; combined
    p = 0.315) with p = 0.012 arising only from a post-hoc variant — the
    corrected reading appears in MPI-E006. (2) It described the
    Walach-group replication line as consistently successful; the group's
    own 2021 paper reports two preregistered consensus-protocol failures
    and describes the 2020 effect as "significant but fragile," with
    significance breaking down under improved analyses — carried in
    MPI-E002/E003. A citation discrepancy for the founding MPI paper
    (1995 EJP 11:58–75 vs a circulating "1994 EJP 5" form) is recorded
    unresolved on SRC-LUCADOU-1995.
  reason: >-
    The epistemic rules require observation before interpretation and
    forbid imported characterizations from carrying assessments when the
    primary record says otherwise.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-22"
