# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license. This case currently
#            may carry plates that are context only: real apparatus of the
#            kind the experiments use, never a result and never a portrait.

- id: IMG-MPI-COVER
  role: cover
  file: /images/cases/mpi/cover.jpg
  alt: >-
    Hand-tinted engraving in verdigris tones of an open book lying in a
    meadow beneath a cloud that holds a diagram of linked nodes, while a
    pale sulfur-yellow butterfly flies free above.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-22"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph,
    chromolithograph plate from a vintage natural-history atlas. An
    allegorical emblem for a case titled "Elusive by Law?" in the domain of
    Parapsychology · Quantum foundations · Research methodology: a symbolic,
    typological composition suggesting the question — Does the Model of
    Pragmatic Information correctly predict that mind–matter correlations
    must decline whenever an experiment tries to pin them down — or is the
    decline just what noise does? — without depicting any real site,
    artifact, or dataset as documentation. Fine copperplate cross-hatching
    and stipple engraving beneath soft, translucent hand-applied watercolor
    washes. Full color in subdued antique mineral pigments — verdigris and
    muted teal, grey-green shadows, one pale sulfur-yellow accent on the
    butterfly — over warm-black ink linework on aged warm cream paper
    (#f6f1e8). Colors muted and slightly faded as if printed in 1870; never
    saturated modern digital color, no gradients, no glow. Darwin-era
    natural-history journal plate aesthetic, generous plain paper margins,
    quiet composition. Absolutely no text, no labels, no captions, no border
    frame lines. Unmistakably a hand-tinted engraving — stylized editorial
    artwork, not photorealistic, no photograph.

