# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license. This case currently
#            carries no plates: the candidate imagery (lab equipment photos,
#            portraits) added nothing evidential, and the epistemic rules
#            forbid decorating an evidence ledger with imagery that could be
#            mistaken for the record.

- id: IMG-MPI-COVER
  role: cover
  file: /images/cases/mpi/cover.jpg
  alt: >-
    Engraved illustration of a hooded figure swinging a butterfly net from
    which the butterfly has already escaped, holding an oversized copper
    key, beside an empty open box, an idle microscope, and a small globe.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v1
  model: "gpt-image-1"
  prompt: >-
    19th-century scientific expedition lithograph, copperplate engraving. An
    allegorical emblem for a case titled "Elusive by Law?" in the domain of
    Parapsychology · Quantum foundations · Research methodology: a symbolic,
    typological composition suggesting the question — Does the Model of
    Pragmatic Information correctly predict that mind–matter correlations
    must decline whenever an experiment tries to pin them down — or is the
    decline just what noise does? — without depicting any real site,
    artifact, or dataset as documentation. Fine cross-hatching and stipple
    shading, hand-engraved linework. Monochrome deep warm-black ink (#201b12)
    on aged warm cream paper (#f6f1e8), with one restrained oxidized-copper
    (#9a5b33) accent on the compositional focal point. Darwin-era
    natural-history journal plate aesthetic, generous plain paper margins,
    quiet composition. Absolutely no text, no labels, no captions, no border
    frame lines. Unmistakably an engraving — stylized editorial artwork, not
    photorealistic, no photograph.
