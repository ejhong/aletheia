# Research agenda: designed so that every project moves specific claims in
# either direction. The recurring theme is prespecification — the one
# methodological ingredient this controversy has consistently lacked on the
# theory side (what exactly does MPI forbid?) and, until recently, on the
# statistics side (what counts as a matrix hit under dependence?).

- id: MPI-R001
  title: "Adversarial blind-analysis matrix replication with binding fine-structure predictions"
  summary: >-
    A Grote-style blind-analysis replication (complete analysis software
    frozen and tested before unblinding) designed jointly by MPI proponents
    and critics, with two additions: dependence-aware statistics agreed in
    advance, and quantitative decline/displacement predictions — where the
    effect should reappear, and how fast it should fade — endorsed by
    proponents as binding on the model. Either outcome is informative:
    success under blinding would be extraordinary; failure of the
    fine-structure predictions strips MPI of its distinctive content.
  claimIds: [MPI-C002, MPI-C007, MPI-C010]
  track: small_grant
  effortTier: lab
  informationGain: >-
    The single most decisive project available: it converts the
    falsifiability crux from philosophy into an experiment.

- id: MPI-R002
  title: "Dependence-aware reanalysis of the founding matrix datasets"
  summary: >-
    Obtain (or reconstruct from published tables) the 1986–2006 Lucadou
    datasets and the 2015–2020 Walach-group data, and re-run the
    excess-correlation analyses under permutation and Monte Carlo methods
    that respect the intercorrelation of psychological variables — the
    critique reported from inside the program (Flores) but never published
    as a standalone, reviewed reanalysis of the founding results. Desk
    work, decisive for the program's origin story in either direction.
  claimIds: [MPI-C001, MPI-C009]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Highest information per unit cost in the case: either restores the
    founding anomaly under sound statistics or reduces it to artifact.

- id: MPI-R003
  title: "True-RNG versus pseudo-RNG factorial matrix experiment"
  summary: >-
    The 2023 online replication reported the effect with an
    atmospheric-noise source but not a pseudo-RNG — the split
    quantum-flavored theories require — but at uneven power, on only one of
    its two emphasised analyses, and with the pseudo-random arm seeded from
    participants' swipe timing (MPI-E021, MPI-E022). Run the comparison as a
    preregistered factorial design with equal power per arm: same
    participants, interleaved sources, blind analysis, and a pseudo-random
    arm whose sequence is fixed before the session and owes nothing to the
    participant's actions. MPI-family theories predict source-dependence;
    every conventional account predicts none.
  claimIds: [MPI-C503, MPI-C007]
  track: either
  effortTier: lab
  informationGain: >-
    One of the few places where MPI and the null hypothesis disagree about
    a forward-looking, easily measured contrast rather than about the past.

- id: MPI-R004
  title: "Elicit and publish binding disconfirmation criteria from MPI's proponents"
  summary: >-
    A structured elicitation exercise (adversarial-collaboration format,
    published protocol): ask the model's living proponents to specify, in
    advance, experimental outcomes they would accept as evidence against
    MPI — and publish either the criteria or the documented inability to
    produce them. The 2021 "Nailing Jelly" discussion concedes the paradigm
    is not replicable while retaining the model; this project forces the
    question of what, concretely, remains at stake.
  claimIds: [MPI-C010]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Settles the falsifiability claim about scientific practice directly,
    whichever way it comes out — and any criteria produced become the
    protocol for MPI-R001.

- id: MPI-R005
  title: "Powered replication of the documentation-effect field test"
  summary: >-
    Watt & Tierney's 2013 waiting-list design on spontaneous RSPK-type
    cases was the right test at hopeless power (14 completed cases). Rerun
    it with the recruitment lessons they documented — multi-year horizon,
    clinical referral partnerships, preregistered analysis — to test MPI's
    distinctive field prediction that detailed documentation suppresses
    reported phenomena relative to undocumented controls.
  claimIds: [MPI-C007, MPI-C501]
  track: small_grant
  effortTier: field
  informationGain: >-
    Tests the model outside the laboratory paradigm it was accused of
    retrofitting; a well-powered null would close the field-evidence
    escape route, and a positive would be the strangest result in this
    file.

- id: MPI-R006
  title: "Independent, dependence-aware reanalysis of the 2023 online matrix dataset"
  summary: >-
    The largest positive matrix report (726 participants, 10,964 sessions)
    rests on a Welch test and a power analysis that treat its 4,096 cells as
    independent, though they come from four psychological and four physical
    variables cut into segments; its control series are generated by a
    different procedure from its experimental ones, and its true-versus-
    pseudo-random split depends on which of two analyses is read (MPI-E021,
    MPI-E023). The raw data are available from the authors on request.
    Request them and rerun the comparison with a null distribution built by
    permuting whole sessions, so that the dependence among cells is kept,
    and with control series generated the same way as experimental ones.
  claimIds: [MPI-C007, MPI-C503]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    A surplus that survives a session-level permutation null would be the
    strongest positive in the matrix record; one that vanishes would leave
    the program's positives confined to studies co-authored by the model's
    author or run on his equipment. A split between the two random sources that survives would
    revive the one forward-looking contrast in the case.
