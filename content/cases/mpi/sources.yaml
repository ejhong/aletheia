- id: SRC-WALACH-2020
  title: "Evidence for anomalistic correlations between human behavior and a random event generator: Result of an independent replication of a micro-PK experiment"
  authors: ["Walach, H.", "Horan, M.", "Hinterberger, T.", "von Lucadou, W."]
  year: "2020"
  sourceType: paper
  identifier: "Psychology of Consciousness: Theory, Research, and Practice 7(2): 173–188. DOI: 10.1037/cns0000199"
  verification: ai_verified
  verificationNote: "DOI, authorship, and bibliographic details confirmed via Crossref; results characterization cross-checked against the authors' own summary in Walach et al. 2021."
  reliabilityNotes:
    - "APA journal, peer-reviewed; the largest positive matrix report."
    - "Co-authored by the model's originator; the 2021 successor paper describes this effect as 'significant but fragile' with significance breaking down under improved analyses."

- id: SRC-WALACH-2021
  title: "Nailing Jelly: The Replication Problem Seems to Be Unsurmountable. Two Failed Replications of the Matrix Experiment"
  authors: ["Walach, H.", "Kirmse, K. A.", "Sedlmeier, P.", "Vogt, H.", "Hinterberger, T.", "von Lucadou, W."]
  year: "2021"
  sourceType: paper
  identifier: "Journal of Scientific Exploration 35(4): 788–828. DOI: 10.31275/20212031"
  verification: ai_verified
  verificationNote: "Full text retrieved and read during the 2026-08-22 verification batch. Crossref registers the publication date as January 2022 (Winter 2021 issue)."
