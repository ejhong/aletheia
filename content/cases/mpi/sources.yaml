  authors: ["von Lucadou, W.", "Römer, H.", "Walach, H."]
  year: "2007"
  sourceType: paper
  identifier: "Journal of Consciousness Studies 14(4): 50–74"
  verification: ai_verified
  verificationNote: "Full text retrieved and read during the 2026-08-22 verification batch; quotes in the evidence records are verbatim from that text."
  reliabilityNotes:
    - "The clearest statement of the NT axiom, the decline prediction, and the matrix-design rationale, by the model's three principal theorists."
    - "A theory paper: it asserts, but does not itself test, the predictions."

- id: SRC-ATMANSPACHER-2002
