# Source records. Verification labels are honest about who checked what:
#   verified     — the document itself is held in the project library
#   ai_verified  — citation located and checked against the publisher, DOI
#                  registry, or full text by an AI agent (2026-08-22 batch);
#                  no human re-check
#   unverified   — cited second-hand; locator unconfirmed
#
# Import note: every citation in this file was independently re-verified
# against Crossref, publisher pages, or retrieved full text before import.
# The synthesis document that seeded this case misdescribed several results
# (see history.yaml); nothing was imported on its authority alone.

- id: SRC-LUCADOU-1995
  title: "The Model of Pragmatic Information (MPI)"
  authors: ["von Lucadou, W."]
  year: "1995"
  sourceType: paper
  identifier: "European Journal of Parapsychology 11: 58–75 (no DOI)"
  verification: ai_verified
  verificationNote: >-
    No DOI or publisher page exists for this volume. Citation confirmed
    against three independent reference lists (the Psi Encyclopedia's
    Lucadou entry, Lucadou's own counseling-center literature list, and the
    Walach et al. 2021 reference list). A discrepant citation ("1994,
    EJP 5, 261–283") circulates — Watt & Tierney 2013 use it — and has not
    been resolved; the 1995/11/58–75 form is the majority citation.
  reliabilityNotes:
    - "The canonical English statement of the model, by its author."
    - "Full text not held; content characterized here via the 2007 JCS paper and later restatements."

- id: SRC-LUCADOU-2006
  title: "Self-Organization of Temporal Structures — A Possible Solution for the Intervention Problem"
  authors: ["von Lucadou, W."]
  year: "2006"
  sourceType: paper
  identifier: "AIP Conference Proceedings 863: 293–315. DOI: 10.1063/1.2388760"
  verification: ai_verified
  verificationNote: >-
    DOI and bibliographic details confirmed via Crossref. Full text not
    examined; its results characterization in this case follows the
    descriptions in Walach et al. (2020, 2021) and Grote (2021), which cite
    it among the original positive matrix reports.
  reliabilityNotes:
    - "Conference proceedings (AIP 'Frontiers of Time' volume), not standard peer review."
    - "Author's own report of his experiments; the original 1986–1987 German-language series is described second-hand."

- id: SRC-LUCADOU-ROMER-WALACH-2007
