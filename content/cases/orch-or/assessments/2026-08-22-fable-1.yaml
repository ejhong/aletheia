  synthesis: >-
    AI-generated draft assessment. No human has reviewed the verdicts below.

    The headline thesis is a conjunction and should be scored as one. It needs
    the physics (gravity-related collapse is real), the biology (microtubules
    hold a suitable quantum state long enough), and the bridge (that collapse
    is the conscious moment). Two of those three currently have experimental
    results pointing at them; the third has never been measured at all.

    Reading the ladder from the bottom up. The observation rung is in better
    shape than the theory's reputation suggests, and this is the genuine news
    of 2023–2026: the Princeton exciton-diffusion measurement and the Howard
    superradiance work are real results in real venues, and they support
    ORCH-C013 — microtubules are not passive scaffolding — at
    well_supported. That rung should be conceded to proponents without
    hedging, because conceding it costs the skeptical case nothing. Collective
    excitonic transport in an ordered aromatic lattice is expected
    condensed-matter physics, found in light-harvesting complexes and
    engineered chromophore arrays. It licenses further investigation and
    establishes nothing about computation, entanglement, or collapse.

    The mechanism rung is where the argument actually fails, and it fails by
    absence rather than by contradiction. ORCH-C010 — sufficient coherence
    duration and extent — is the single load-bearing claim of the entire case,
    and nothing in the evidence base measures it. The gap is quantitative and
    large: roughly 6.6 nm and femtosecond-to-picosecond physics measured,
    versus milliseconds across many tubulins required. The two decoherence
    figures in the literature are calculations that disagree by seven to eight
    orders of magnitude, and the proponents' own favorable estimate
    (10⁻⁵–10⁻⁴ s) still falls one to two orders short of the theory's
    requirement. A defender is entitled to say this is unmeasured rather than
    refuted; that is correct, and it is why this assessment says unresolved
    rather than refuted. But thirty years of unmeasured is itself a fact about
    the research program, and the theory's failure to publish a falsifiable
    threshold means new results get absorbed rather than scored.

    The anesthesia arm is the most tractable part and currently the most
    unfavorable to the strong claim, which is a distinction worth keeping
    clear. The broad proposition — microtubule-modulating drugs change
    anesthetic susceptibility — is supported by four agents across three
    studies. The directional proposition that Orch OR actually needs is
    contradicted: the strongest and only independent study found chronic
    stabilization increasing sensitivity, and the destabilizer vinblastine
    moving sensitivity the same direction as the stabilizer, which no
    stability-based account predicts. Add the specificity problem from inside
    the flagship experiment — picrotoxin, a convulsant, affecting the assay
    comparably to anesthetics — and the honest position is that this arm has
    generated real phenomena and no discrimination between explanations. Note
    also that the two supporting behavioral results share a senior author and
    program, so the "independent replication" claim in the case editor's own
    primer does not hold.

    The physics arm has taken the clearest experimental damage. The Gran Sasso
    null result excluded the natural parameter-free Diósi–Penrose model, and
    the experimenters themselves judged Orch OR "highly implausible" when
    built on the simplest version of gravity-related collapse. McQueen's
    rebuttal is technically correct — Penrose's heuristic criterion makes no
    radiation prediction, so the bound does not reach it — and this assessment
    accepts it, which is why ORCH-C030 is unresolved. It should be recorded
    that this defense is costly: it preserves the theory by locating it
    outside the reach of the best experiment addressed to it.

    The non-computability rung is scoped low deliberately, and this assessment
    regards that scoping as its most important judgment. Recent AI results are
    well verified — an independently confirmed Erdős disproof, Lean-verified
    and officially-graded IMO performance — and they bear on Penrose's
    motivation for seeking non-computable physics, not on the microtubule
    mechanism. Critics who treat AI mathematics as refuting Orch OR and
    proponents who treat the Gödel argument as supporting it are making the
    same error in opposite directions. Even total refutation of ORCH-C040
    would leave ORCH-C002, ORCH-C010, ORCH-C013, and ORCH-C030 untouched.

    Where this leaves the comparison with the conventional alternative. For
    anesthesia specifically, the conventional account wins on the currently
    available evidence, and it wins on the dimension that matters most —
    target-level causal manipulation. The β3(N265M) result is the highest-
    quality causal evidence anywhere in this case and nothing comparable
    exists for tubulin. That comparison is not close today. It is also not
    permanent: the same paper's conclusion that volatile agents act through a
    broader target spectrum is a real opening, and the knock-in experiment
    that would exploit it is designable now.

    Overall: unresolved, with the load clearly located. The case does not turn
    on decoherence arguments, on Gödel, or on AI mathematics. It turns on one
    unmeasured number, and the striking thing after thirty years of
    controversy is that measuring it is a funded-postdoc problem for an
    ultrafast spectroscopy group rather than a conceptual impasse. The second
    most striking thing is that the theory has not said what value would
    count as failure.

claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    reasoning: >-
      A conjunction whose middle term has never been measured. No attached
      record tests it as a whole; each bears on at most one conjunct. Note the
      structural asymmetry — refutation needs only one rung to fail while
      confirmation needs all of them, so negative resolution is the more
      likely outcome even absent any prior.
    confidence: high

  - claimId: ORCH-C002
    verdict: weakly_supported
    reasoning: >-
      Endpoints of the proposed chain exist (anesthetics alter microtubule
      optics; tubulin sits on an anesthetic pathway; a stabilizer shifts
      anesthetic latency) but the chain does not, and the "quantum-coherent"
      qualifier is entirely unmeasured. The picrotoxin specificity result and
      the independent opposite-direction stabilizer finding both cut against.
      Real evidence for a weaker claim than this one.
    confidence: moderate

  - claimId: ORCH-C003
    verdict: well_supported
    reasoning: >-
      Strongest causal evidence in the case at the level of target-specific
      manipulation, and assessed on that basis rather than on which side it
      favors. Two honest limits: the β3 result covers intravenous agents and
      transfers poorly to volatiles, and the claim's universal quantifier
      ("fully accounted for", "without any quantum contribution") is not
      established by successful conventional explanations, since a
      universally-quantified negative cannot be confirmed by accumulation.
    confidence: moderate

  - claimId: ORCH-C030
    verdict: unresolved
    reasoning: >-
      The natural parameter-free stochastic completion is experimentally dead;
      the heuristic ℏ/E_G criterion the claim states has never been tested and
      makes no radiation prediction. Unresolved is accurate. The defense is
      costly in a way worth recording: survival by underspecification.
    confidence: high

  - claimId: ORCH-C040
    verdict: unresolved
    reasoning: >-
      Possibly not empirically decidable as worded. AI systems producing
      correct novel mathematics does not address whether a knowably sound
      algorithm captures understanding, since nobody claimed algorithms cannot
      generate true theorems. The counter-argument (performance versus
      framework extension) is an argument rather than a measurement and so
      cannot raise credibility either. Genuinely open, and the formal-logic
      dispute remains technical and live.
    confidence: moderate

  - claimId: ORCH-C010
    verdict: unresolved
    reasoning: >-
      The load-bearing gap. No coherence time, dephasing time, or entanglement
      witness has been measured in any microtubule. The nearest measurements
      quantify adjacent observables — an excitation diffusion length and a
      fluorescence quantum yield — and the competing decoherence figures are
      both calculations, disagreeing by seven to eight orders of magnitude,
      with even the favorable one falling short of the requirement.
    confidence: high

  - claimId: ORCH-C011
    verdict: provisionally_supported
    reasoning: >-
      Two independent lines support the claim as worded: measured anesthetic
      reduction of microtubule exciton diffusion, and independent
      photolabeling of β-tubulin with functional consequences in vivo. Held at
      provisional by the modest effect size, two agents only, and the absence
      of any specificity panel — the picrotoxin result means this may be
      general pharmacological perturbability rather than anesthesia-specific.
    confidence: moderate

  - claimId: ORCH-C012
    verdict: mixed
    reasoning: >-
      Broad proposition well supported (four agents move anesthetic
      susceptibility); directional proposition contradicted. Stabilizer and
      destabilizer shifting sensitivity the same direction is unexplained by
      any stability account and suggests general cellular disruption. Every
      available reconciliation subtracts predictive content from the original
      claim.
    confidence: high

  - claimId: ORCH-C013
    verdict: well_supported
    reasoning: >-
      Multiple methods converge from partly independent groups: exciton
      diffusion exceeding Förster prediction, superradiant collective states
      with a confirming quantum-yield measurement, and electrical activity
      work. The honest caveat is interpretive rather than evidential — this is
      expected condensed-matter physics in an ordered lattice, and it is the
      rung most often mistaken for vindication of the whole theory.
    confidence: high

  - claimId: ORCH-C020
    verdict: well_supported
    reasoning: >-
      Peer-reviewed in a strong journal, open access, quantitative, with
      internal structure-dependence controls. Assessed as a measurement, which
      is all it is: the inferred length is about one tubulin dimer and the
      modeling includes an incoherent-migration comparison, so it cannot be
      upgraded into a coherence result. Unreplicated, and Hameroff and Penrose
      are co-authors.
    confidence: high

  - claimId: ORCH-C021
    verdict: provisionally_supported
    reasoning: >-
      Measured quantum-yield trend matches the collective-state model, from a
      substantially independent group. Held at provisional because the paper is
      predominantly theoretical with an indirect bulk-fluorescence confirmation.
      The widely-quoted "tens of seconds" is a radiative lifetime of a modeled
      dark state, not a coherence time — a distinction routinely lost in
      secondary discussion.
    confidence: moderate

  - claimId: ORCH-C022
    verdict: unresolved
    reasoning: >-
      Unreplicated for over a decade from a single laboratory lineage, with a
      bespoke apparatus and a lower-profile venue than commonly cited. And even
      if replicated, resonance structure is a classical observable rather than
      a quantum witness, so the claim's ceiling is lower than its rhetorical
      use implies. Currently a research target, not a rung to build on.
    confidence: moderate

  - claimId: ORCH-C023
    verdict: provisionally_supported
    reasoning: >-
      Blinded, tolerance-controlled, large standardized effects, direction
      reproduced across species. Held at provisional by N = 8, males only,
      non-counterbalanced design, single-concentration latency rather than
      dose–response, and the fact that both studies share a senior author and
      program — a within-program replication, not independent confirmation.
    confidence: moderate

  - claimId: ORCH-C024
    verdict: well_supported
    reasoning: >-
      Assessed on methodology, not on which side it favors: independent,
      randomized, blinded, four agents, full concentration–response curves,
      narrow non-overlapping confidence intervals. The author-acknowledged
      limitations (vehicle control, blood-gas changes, chronic regimen) weaken
      the interpretation without touching the measurement.
    confidence: high

  - claimId: ORCH-C025
    verdict: provisionally_supported
    reasoning: >-
      Large orderly effect, randomized, leading journal, with polarizability
      explicitly matched — closing the obvious classical explanation. Held at
      provisional by single-study status and the isoflurane-background
      confound. Its reach is much shorter than its appeal: it localizes
      nothing, and radical-pair mechanisms are an established alternative
      class.
    confidence: moderate

  - claimId: ORCH-C026
    verdict: mixed
    reasoning: >-
      The measurement is largely uncontested and genuinely unusual — a
      consciousness-dependent signal with no conventional MRI correlate. The
      entanglement-witness interpretation is contested by a leading NMR
      methodologist, the authors' reply is not obviously wrong, and no
      independent replication exists. This project cannot adjudicate the
      technical NMR question. Scoping matters: microtubules are not
      implicated by this experiment at all.
    confidence: moderate

  - claimId: ORCH-C031
    verdict: well_supported
    reasoning: >-
      Nature Physics, world-class low-background facility, prediction derived
      quantitatively in advance, model's own co-originator among the authors,
      source data published, exclusion scope stated in the authors' own words.
      About as clean as an experimental constraint gets.
    confidence: high

  - claimId: ORCH-C041
    verdict: well_supported
    reasoning: >-
      Unusually well anchored for a recent claim because the mathematics is
      independently checkable: the Erdős disproof is attested by an
      unaffiliated mathematician who builds on it, and the IMO results are
      Lean-verified and officially graded. The documented false-positive
      history in this area is a reason to anchor on primary mathematics rather
      than announcements, which this case does — not a reason to doubt the
      verified instances. Diagnosticity for the headline thesis remains low by
      scoping.
    confidence: high
