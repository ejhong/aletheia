  synthesis: "The featured hypothesis is a conjunction, and the record treats its
    conjuncts very differently. The physics conjunct (ORCH-C030) has had its
    most natural, parameter-free stochastic completion experimentally excluded
    by the best measurement in the case (ORCH-C031); Penrose's own lifetime
    criterion survives only because it makes no radiation prediction, which is
    survival by underspecification rather than by evidence. The biology conjunct
    (ORCH-C010) has never been measured in either direction: the only two
    numbers on the record are calculations disagreeing by seven to eight orders
    of magnitude, and even the proponent estimate falls one to two orders of
    magnitude short of the theory's own required timescale. A thesis whose
    load-bearing rungs are respectively excluded-in-natural-form and
    never-measured cannot be graded above unresolved; that verdict is a
    substantive finding about the evidence base, not indecision. Steelmanning
    the proponent side: microtubules demonstrably exhibit collective electronic
    dynamics a passive-scaffolding model does not predict (ORCH-C013, ORCH-C020,
    ORCH-C021), anesthetics measurably perturb that physics (ORCH-C011), and
    moving microtubules moves anesthetic endpoints in animals (ORCH-C012,
    ORCH-C023); the xenon nuclear-spin potency gap (ORCH-C025) is a genuine
    anomaly for a pharmacology with no quantum degrees of freedom. Steelmanning
    the skeptical side: every positive measurement sits orders of magnitude from
    the required regime in both time and space; the specificity control inside
    the flagship experiment itself (picrotoxin) undercuts the anesthesia
    reading; the methodologically strongest and independent animal study found
    the opposite direction, with a destabilizer agreeing with a stabilizer — a
    pattern that points at general cellular disruption; the conventional account
    holds causal, target-level genetic evidence (ORCH-C003) that no microtubule
    experiment approaches; and the theory has never published the numerical
    thresholds that would let a measurement count against it. The AI-mathematics
    results (ORCH-C041) are real and well verified, but they bear only on the
    Gödelian motivation (ORCH-C040), not on any microtubule, anesthesia, or
    collapse claim — and that scoping judgment is among the most important
    things this case establishes. On the present record: unresolved, with a
    clear map of which experiments would move it."
