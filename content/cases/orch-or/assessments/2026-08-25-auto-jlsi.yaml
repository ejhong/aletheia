    consciousness-adjacent endpoint, and ORCH-E031 reports that no known channel
    or combination suffices even for immobility with inhaled agents. That
    unresolved residue is a real opening, but it is an opening for any
    alternative and points at microtubules no more than at anything else —
    ORCH-E033 illustrates the same problem, a genuine dissociation whose authors
