    confidence: high
    reasoning: "No attached record tests the conjunction of gravitational collapse,
      a microtubule state of the required duration and extent, and identity of
      that collapse with a conscious moment. Photophysics results speak to
      nanometre, femtosecond-to-picosecond transport; anesthesia results speak
      to behavioral latencies with no quantum variable recorded; the Gran Sasso
      search constrains a stochastic collapse model with no biology in it. The
      strongest opposing consideration is prior-based and labeled as such:
      thirty years without a measurement of the middle term, plus experimental
      death of the most natural collapse completion, make the conjunction look
      like a poor bet — but a poor bet is not a failed test, and the claim as
      worded has not been subjected to one."
