  synthesis: >-
    The featured hypothesis is a conjunction, not a mood: gravitational
    objective reduction must be real physics, neuronal microtubules must hold a
    coherent or entangled state long enough and wide enough to be that physics,
    and the collapse of that state must be the conscious moment — with general
    anesthesia working substantially by breaking the same state. No attached
    record tests the conjunction. The honest case-level grade is therefore
    unresolved, and that grade is a finding about missing discriminators rather
    than a diplomatic average of mixed lower rungs. Confirming the thesis would
    require every conjunct; refuting it would require only one. Neither has
    happened. The biological observations that revived the topic between 2023
    and 2026 are real and should not be talked past. Kalra et al. inferred
    electronic excitation diffusion of about 6.6 nm in polymerized microtubules,
    beyond what their Förster comparison explained, and saw etomidate and
    isoflurane shorten that length. Babcock et al., from a substantially
    independent group, measured fluorescence quantum yield rising with
    hierarchical tryptophan organization in the direction a
    collective-superradiance model predicts. Those results jointly support the
    claim that microtubules are not passive scaffolding. They do not support the
    claim that microtubules compute. The measured length is roughly one tubulin
    dimer and the physics is femtoseconds to picoseconds. Orch OR needs tens of
    milliseconds across many tubulins, ideally many neurons. That gap is many
    orders of magnitude in both time and space, and nothing in the ledger closes
    any of it. No density-matrix observable, dephasing time, or entanglement
    witness has been reported in physiological microtubules at 37 °C. Tegmark's
    decoherence calculation and the Hagan–Hameroff–Tuszyński reply disagree by
    seven to eight orders of magnitude; both are models, and even the
    proponents' revised 10⁻⁵–10⁻⁴ s figure falls short of a ~25 ms moment. Until
    that number is measured, "warm and wet kills it" and "warm quantum biology
    saves it" are calculations arguing with each other.

    Steelman for the hypothesis. Microtubules turned out to be optically and
    electrically collective, which a scaffolding model did not predict.
    Anesthetics really do bind tubulin and alter a measured optical property.
    Acute epothilone B, blinded and tolerance-controlled, delayed isoflurane
    loss of righting reflex in rats and then mice with large standardized
    effects. Xenon isotopes that differ only by nuclear spin differ in potency
    by 40 to 50 percent at identical calculated polarizability — a quantum
    degree of freedom with no classical polarizability explanation. The
    conventional account, for all its receptor-level power with etomidate and
    propofol, itself reports that volatile agents act through a broader target
    spectrum and that no known channel or combination of channels suffices for
    inhaled-agent immobility. Penrose's published criterion is a
    characteristic-lifetime relation, not the stochastic master equation Gran
    Sasso killed, so the physics conjunct is untested rather than refuted. The
    Gödelian motivation, even if one rejects it, is not a premise of the
    microtubule mechanism; killing the motivation would leave every biological
    claim where it stands.

    Steelman against. The theory has absorbed each new photophysics result
    without ever publishing the coherence time, coherence length, or
    participating degrees of freedom that would let a measurement count as pass
    or fail. That is a defect in specification, not evidence of content, but it
    is why thirty years of work has not produced a scoring test. The most
    natural completion of the collapse physics — the parameter-free
    Diósi–Penrose model — was excluded by a dedicated underground radiation
    search that included Diósi among the authors; surviving by being less
    specified than the model that was tested is not a positive result. On
    anesthesia, the same Kalra experiment found picrotoxin, a convulsant,
    affecting the assay comparably to two anesthetics, which collapses
    specificity. An independent, randomized, blinded concentration–response
    study found chronic epothilone D making mice more sensitive to isoflurane,
    not less, and found the destabilizer vinblastine moving sensitivity the same
    direction — a pattern no stability rule predicts and one that ordinary
    cellular disruption explains. No microtubule result approaches the causal
    standard of the GABA_A β3(N265M) point mutation, which abolishes etomidate
    and propofol immobility. The Kerskens zero-quantum-coherence signal, even if
    it survived Warren's methodological rejection and independent replication,
    does not implicate microtubules. AI systems have now produced independently
    checked research-level mathematics, including a disproof of a 1946 Erdős
    conjecture and officially graded IMO gold; those results bear only on
    motivation, but they shrink the residue of supposedly non-computable
    performance that sent Penrose looking for new physics in the first place.

    The rungs come apart cleanly, which is the structurally important fact.
    Collective microtubule photophysics can be well supported while
    physiological coherence remains unmeasured, while anesthetic action through
    microtubules is mixed, while gravitational objective reduction is
    unresolved, and while the Gödel argument is low-diagnosticity for the
    mechanism. Public argument in both directions keeps sliding between those
    rungs. The case does not move until someone specifies a density-matrix
    observable in physiological microtubules, measures its dephasing at 37 °C,
    and tests whether anesthetics suppress it in proportion to clinical potency
    — or until a mesoscopic superposition experiment tests whether collapse
    lifetime scales as ℏ/E_G. Positive biology without the physics, or positive
    physics without the biology, would each leave the conjunction unproven. That
    is not caution as a default. It is what the ledger warrants.
