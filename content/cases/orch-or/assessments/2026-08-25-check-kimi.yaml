  synthesis: "The featured hypothesis is a conjunction — gravitational collapse
    physics, a coherent microtubule state of the right duration and extent, and
    the bridge that collapse is the conscious moment — and the evidence map
    shows its conjuncts in very different states. The physics conjunct
    (ORCH-C030) has never been tested as stated: its most natural stochastic
    completion was excluded under Gran Sasso (ORCH-C031), leaving Penrose's
    criterion alive only by being less specified than the model that was killed,
    which is survival by underspecification rather than support. The biological
    conjunct (ORCH-C010) is the crux and is simply unmeasured: no coherence
    time, dephasing time, or entanglement witness has been recorded in any
    microtubule, and the only two numbers on record are calculations disagreeing
    by seven to eight orders of magnitude, with even the proponents' revised
    figure falling one to two orders short of the ~25 ms requirement. What has
    been measured — collective excitonic transport over ~6.6 nm and superradiant
    quantum-yield trends — genuinely establishes that microtubules are
    electronically nontrivial (ORCH-C013), but operates on femtosecond physics
    over roughly one dimer, many orders of magnitude from the claim in both time
    and space. The anesthesia arm contains the case's only real empirical fight:
    acute epothilone B delays loss of righting reflex (ORCH-C023) and xenon
    potency splits by nuclear spin (ORCH-C025), but the flagship optical assay
    responds comparably to a convulsant, the independent and methodologically
    strongest animal study found stabilization increasing sensitivity with a
    destabilizer moving the same way (ORCH-C024), and the conventional account
    holds target-level causal evidence (β3 N265M) no microtubule experiment
    approaches — though that evidence is strongest for intravenous agents and
    weakest exactly where Orch OR experiments operate, per the volatile-agent
    residue Eger documented. Steelmanning the proponent: warm quantum biology
    has overturned confident decoherence calculations before, the xenon result
    has no classical polarizability explanation, and the theory at least
    attempts the explanatory gap the conventional account concedes. Steelmanning
    the skeptic: thirty years without measuring the central quantity, no
    committed threshold by which any result could count as pass or fail, and
    every positive finding explicable as ordinary cell biology. Unresolved here
    is substantive — the absence of a discriminating measurement — with the
    structural note that a conjunctive theory resolves negatively long before it
    could resolve positively."
