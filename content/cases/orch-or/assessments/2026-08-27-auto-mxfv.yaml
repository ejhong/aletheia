  synthesis: "Orch OR is a conjunction and must be graded as one: gravitational
    objective reduction has to be real (ORCH-C030), neuronal microtubules have
    to hold a suitable quantum state for roughly the length of a conscious
    moment (ORCH-C010), and that reduction has to be the conscious moment
    (ORCH-C001). The observation rung remains respectable — ORCH-E001 and
    ORCH-E004 are quantitative, partly independent measurements — but what they
    license is only that microtubules are electronically and radiatively
    nontrivial (ORCH-C013), ordinary condensed-matter behaviour in an ordered
    aromatic lattice, and this is the rung most often mistaken for vindication
    of the whole theory. The mechanism rung is still where the argument most
    likely fails, and the two new tabulation records sharpen rather than soften
    that. ORCH-E036 puts both sides' published numbers in one table and shows
    that no unconditional proponent estimate reaches the theory's own 25 ms
    exemplar — the proponents' own recalculation (ORCH-E008) is two to three
    orders short, and the only routes to physiological timescales are an
    explicitly conditional actin-gel assumption or an inference from the
    unreplicated single-laboratory resonance work behind ORCH-C022. ORCH-E035
    adds the complementary defect: the corpus is arithmetically consistent in
    its parameter values but commits nowhere to a coherence length, an
    entanglement structure, or a pass/fail threshold, and its physical carrier
    changed under critique, so the 1996 and 2014 formulations are not one theory
    for evidential purposes. The physics conjunct stays damaged by ORCH-E017 and
    ORCH-E018 and survives only via ORCH-E019, trading a refuted specific model
    for an untested vague one. On anesthesia, the flagship experiment's own
    convulsant comparison (ORCH-E003) shows the assay is not
    anesthesia-specific, and the best-designed independent animal study
    (ORCH-E013) has a stabilizer and a destabilizer shifting sensitivity the
    same way. The rival account is strong where narrow (ORCH-C003 via ORCH-E015)
    and incomplete where exhaustive (ORCH-C004, given ORCH-E030 and ORCH-E031);
    that residue is an opening for any alternative, not for microtubules
    specifically. Sensitivity: the record whose removal would most change this
    case is ORCH-E013, which is the only independent, blinded, full
    concentration–response animal study and the main reason ORCH-C012 is mixed
    rather than provisionally supported. Without it the anesthesia arm would
    look cleaner, but the case verdict survives unchanged, because the verdict
    rests on an absence — no coherence time, dephasing time, or entanglement
    witness has ever been measured in a microtubule — and no single record can
    remove an absence."
