  synthesis: 'The assessment of Orch OR requires evaluating a strictly conjunctive
    hypothesis: if either the gravitational collapse physics or the biological
    physiological coherence fails, the thesis fails. Steeling the proponent
    direction: the classical "warm, wet, and dead" dismissal of microtubules is
    no longer supported by the evidence. The records demonstrate that
    microtubules possess nontrivial collective optical properties, including
    superradiance (ORCH-E004) and enhanced exciton diffusion (ORCH-E001).
    Furthermore, tubulin is an on-pathway target for some anesthetics
    (ORCH-E009), these anesthetics can perturb microtubule photophysics
    (ORCH-E002), and unexplained anomalies like the xenon spin effect
    (ORCH-E014) indicate that classical pharmacology may be incomplete. Steeling
    the skeptical direction: the classical account boasts a standard of causal
    evidence Orch OR lacks entirely, such as a single point mutation abolishing
    intravenous anesthetic immobility (ORCH-E015). Even the biological anomalies
    are beset by specificity issues, as convulsants mimic anesthetics in the key
    optical assay (ORCH-E003), and an independent behavioral study shows
    microtubule stabilization increasing rather than decreasing anesthetic
    sensitivity (ORCH-E013). More critically, the Gran Sasso null result
    (ORCH-E017) cleanly refuted the parameter-free stochastic Diósi-Penrose
    model, forcing the physics conjunct into a highly underspecified retreat
    (ORCH-E019). Overall, the case remains unresolved because the absolute core
    of the theory—physiological quantum coherence at the millisecond scale
    across many tubulins (ORCH-C010)—is entirely unmeasured. The empirical
    debate currently consists of calculations arguing with one another
    (ORCH-E007 vs ORCH-E008), while experimental photophysics operates on
    femtosecond scales over single nanometers. Sensitivity: the single evidence
    record whose removal would most change this case verdict is ORCH-E017
    (Donadi 2021 Gran Sasso null result), which provides the only rigorous
    empirical constraint on the physics conjunct. However, the headline verdict
    of unresolved survives its removal, because the verdict hangs completely on
    the unmeasured biological coherence time (ORCH-C010).'
