    verdict: unresolved
    confidence: high
    reasoning: "No attached record tests the conjunction of gravitational collapse,
      a microtubule state of the required duration and extent, and identity of
      that collapse with a conscious moment. Photophysics results measure
      collective electronic behavior at nanometre and femtosecond-to-picosecond
      scales; anesthesia results measure behavioral latencies with no quantum
      variable; Gran Sasso constrains a stochastic completion of collapse
      physics with no biology in it. The load-bearing middle term has never been
      measured in either direction, so unresolved names an absence of a
      discriminating test rather than a split between confirming and refuting
      evidence. Strongest opposing consideration: a conjunction that must be
      right about unconfirmed physics, an unmeasured biological state, and the
      collapse–experience bridge, and that has not published a prospective
      coherence threshold, is structured so that it can absorb new results
      indefinitely — a specification defect that keeps the claim unresolved
      rather than weakly supported."
