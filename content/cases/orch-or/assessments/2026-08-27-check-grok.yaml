  synthesis: >-
    The featured hypothesis is a three-part conjunction: gravitational objective
    reduction is real physics, neuronal microtubules hold a coherent or
    entangled state of the duration and extent Orch OR requires, and that
    collapse is the conscious moment — with a separable anesthesia claim that
    general anesthetics abolish consciousness substantially by disrupting the
    microtubule state. No attached record tests the conjunction. The case
    therefore cannot presently be scored as supported or as refuted; it is
    unresolved because the load-bearing quantities have not been measured, not
    because confirming and disconfirming tests have cancelled.

    Steelman for the hypothesis. Microtubules are no longer inert beams. Kalra
    et al. report electronic excitation diffusing about 6.6 nm in polymerized
    microtubules, beyond the Förster account they tested, with
    polymerization-state dependence that argues against a trivial artifact;
    Babcock et al., from a substantially independent group, report fluorescence
    quantum yield rising with hierarchical tryptophan organization as a
    collective-superradiance model predicts. Emerson et al., from an anesthesia
    laboratory with no Orch OR commitment, photolabeled β-tubulin and found
    microtubule stabilizers shifting tadpole immobilization. Acute epothilone B
    delayed isoflurane loss of righting reflex in rats and mice with large
    standardized effects, blinded, with a tolerance control. Xenon isotopes that
    differ only in nuclear spin differ in anesthetic potency by tens of percent
    at identical calculated polarizability — a quantum degree of freedom with no
    classical polarizability explanation. The conventional account, however
    strong on intravenous agents, does not identify a channel or combination
    sufficient for inhaled immobility, and it offers no principled account of
    why any classical pattern is experienced. Penrose's published criterion is a
    characteristic lifetime τ ≈ ℏ/E_G, not the stochastic master equation Gran
    Sasso constrained, so the physics conjunct is untested rather than dead. AI
    medal-level mathematics challenges the Gödelian motivation without touching
    mechanism.

    Steelman against. The measured photophysics lives at one tubulin dimer and
    femtosecond-to-picosecond timescales; the theory needs milliseconds across
    many tubulins. That gap is many orders of magnitude in both time and space,
    and nothing in the ledger closes any of it. No density-matrix observable,
    dephasing time, or entanglement witness has been recorded in physiological
    microtubules at 37 °C. The two decoherence calculations disagree by seven to
    eight orders of magnitude, and even the proponents' unconditional revision
    (10⁻⁵–10⁻⁴ s) falls short of the ~25 ms exemplar; the gap is bridged only by
    conditional assumptions or unreplicated resonance work. Kalra's own assay is
    moved comparably by picrotoxin, a convulsant, which is a direct hit on
    anesthetic specificity. An independent laboratory, using full
    concentration–response curves, found chronic epothilone D and the
    destabilizer vinblastine both increasing isoflurane sensitivity — the
    opposite of the public stabilizer-protects-consciousness story, and a
    pattern no stability rule predicts. A single GABA_A β3 point mutation
    abolishes etomidate and propofol immobility and profoundly reduces hypnosis:
    target-level causal evidence no tubulin experiment approaches. Gran Sasso,
    the highest-quality experiment in the file, found none of the spontaneous
    radiation the natural parameter-free Diósi–Penrose model predicts and, with
    Diósi among the authors, judged Orch OR highly implausible on that
    completion. Surviving by being less specified than the model that was tested
    converts a refuted precise theory into an untested vague one. The
    distinctive Bandyopadhyay resonances remain unreplicated for over a decade.
    The Kerskens MRI result does not implicate microtubules and is contested as
    an entanglement witness. The theory has published consistent parameter
    arithmetic but no prospective pass/fail coherence threshold, so new
    photophysics is absorbed rather than scored.

    The rungs come apart cleanly, which is the structurally important fact.
    Collective microtubule electronics (ORCH-C013, ORCH-C020) can be well
    supported while physiological coherence at consciousness-relevant scales
    (ORCH-C010) remains unmeasured, gravitational OR (ORCH-C030) remains
    untested, anesthetic action through a quantum-coherent microtubule state
    (ORCH-C002) remains at best thinly evidenced, and classical multi-target
    pharmacology (ORCH-C003) remains well supported for the intravenous agents.
    Evidence for one rung is not evidence for the next. Diagnosticity of the
    Gödel/AI theme is low in both directions: refuting ORCH-C040 would leave
    every microtubule and anesthesia claim where it stands; vindicating it would
    not select microtubules as the implementer.

    Sensitivity. The case verdict is overdetermined by absences — above all the
    missing physiological coherence measurement — rather than hanging on one
    thread. The single attached record whose removal would most change the
    argumentative shape is ORCH-E001 (Kalra 6.6 nm diffusion), which currently
    supplies the strongest biological observation and the anesthetic-optical
    bridge. Without it, ORCH-C013 and ORCH-C020 lose their best support and the
    biological half returns toward speculation. The case verdict would still be
    unresolved, because ORCH-C010 would remain unmeasured and ORCH-C030
    untested. The verdict survives.
