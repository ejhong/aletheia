  synthesis: "Orch OR is a conjunction — collapse physics (ORCH-C030), a
    long-lived coherent microtubule state (ORCH-C010), and the bridge that
    collapse is the conscious moment (ORCH-C001) — and the ledger's central
    finding is that the middle conjunct has never been measured in either
    direction. What the evidence does establish sits asymmetrically around that
    hole. On the theory's side, microtubules are demonstrably not passive
    scaffolding (ORCH-C013, well supported): excitation diffuses ~6.6 nm beyond
    Förster prediction (ORCH-C020), collective optical behavior is corroborated
    by a partly independent group (ORCH-C021), anesthetics measurably perturb
    that photophysics (ORCH-C011), and behavioral anomalies exist — acute
    epothilone B delays loss of righting reflex in two species (ORCH-C023) and
    spin-bearing xenon is 40–50% weaker at identical calculated polarizability
    (ORCH-C025). On the other side, every discriminating record is adverse or
    null: the natural parameter-free Diósi–Penrose model is experimentally dead
    (ORCH-C031, methodologically the best experiment in the case); the only
    independent, dose-resolved animal study found chronic stabilization
    increasing anesthetic sensitivity, with a destabilizer moving the same
    direction (ORCH-C024) — falsifying the stabilizer-protects-consciousness
    generalization, though not the acute result; the flagship optical
    experiment's own picrotoxin control undercuts anesthetic specificity
    (ORCH-E003); and even proponent decoherence arithmetic falls one to two
    orders of magnitude short of the theory's own requirement (ORCH-E036). The
    strongest steelman for the theory: warm quantum biology is established
    elsewhere, the measured collective states show disorder resilience,
    volatile-agent pharmacology is admittedly unfinished (ORCH-E031), the
    conventional account explains mechanism but not experience, and the crux
    quantity is unmeasured rather than refuted — \"warm and wet kills it\" is a
    calculation, not a datum. The strongest steelman against: thirty years
    without measuring the central quantity, a theory that absorbs each new
    result without ever publishing a pass/fail threshold, a physics conjunct
    that survives Gran Sasso only by being less specified than the model tested,
    and target-level causal evidence on the conventional side (the β3(N265M)
    knock-in) that no microtubule experiment approaches. Where my grading leans
    on priors I flag it: the expectation that millisecond coherence in 37 °C
    cytosol is improbable is a prior, not a record; the ledger warrants
    \"unresolved,\" not \"contradicted.\" Verdict: unresolved — a substantive
    finding that the disagreement lives in one unmeasured gap, with the
    evidentiary trend adverse and the conjunctive structure meaning the theory
    will resolve negatively long before it could resolve positively.
    Sensitivity: the single record whose removal would most change this
    assessment is ORCH-E013 (Li et al. 2025), the only anesthesia result that
    discriminates rather than accumulates and the main reason ORCH-C012 is mixed
    rather than proponent-leaning. The case verdict survives its removal — the
    headline conjunction remains unresolved because ORCH-C010 stays unmeasured
    and ORCH-C030 untested — but ORCH-C012 would likely move to provisionally
    supported and the balance would shift from \"unresolved with adverse trend\"
    toward \"unresolved with live anomalies.\" The verdict therefore hangs not
    on one thread but on one absence: the coherence measurement ORCH-R001 would
    provide."
