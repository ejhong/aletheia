  synthesis: "The featured hypothesis is a conjunction of three separable parts: a
    law of physics (collapse lifetime scaling as ℏ/E_G), a biological state
    (coherent or entangled microtubule states of order tens of milliseconds
    across many tubulins at 37 °C), and an identification of that collapse event
    with a conscious moment. Not one evidence record in this file tests the
    conjunction; each bears on at most one conjunct, and the middle term has
    never been measured in either direction. \"Unresolved\" is therefore a
    description of the file rather than a hedge: the discriminating measurement
    (a prespecified coherence or entanglement witness under physiological
    conditions) has not been performed by anyone, for or against. Steelman for
    the hypothesis: microtubules turned out to be electronically nontrivial in
    ways a passive-scaffold model does not predict (ORCH-E001, ORCH-E004);
    β-tubulin is a photolabeled anesthetic target found by a laboratory with no
    Orch OR commitment (ORCH-E009); anesthetics measurably shorten exciton
    diffusion (ORCH-E002); nuclear-spin isotopes of a chemically identical noble
    gas differ 40–50% in potency (ORCH-E014), which is awkward for a
    pharmacology containing no quantum degrees of freedom; the conventional
    account's own flagship review concedes no channel or combination suffices
    for inhaled immobility (ORCH-E031); and the strongest physics test genuinely
    does not reach Penrose's own criterion (ORCH-E019). Steelman against: the
    load-bearing quantity is not merely unmeasured but unreached on paper by
    anyone's arithmetic — the proponents' own corrected estimate of 10⁻⁵–10⁻⁴ s
    (ORCH-E008) falls two to three orders short of the theory's own 25 ms
    exemplar, and ORCH-E036 records that the only proponent routes to
    physiological timescales are an explicitly conditional actin-gel estimate
    and an unreplicated single-laboratory inference. The demonstrated transport
    is roughly one tubulin dimer on femtosecond-to- picosecond physics. The
    natural parameter-free stochastic completion of the collapse physics is
    experimentally dead (ORCH-E017). The anesthesia arm's specificity control
    failed inside its own flagship experiment (picrotoxin, ORCH-E003), and the
    only fully independent concentration–response animal study ran the opposite
    way with a destabilizer moving sensitivity the same direction as a
    stabilizer (ORCH-E013). The conventional rival holds target-level causal
    evidence (ORCH-E015) that no microtubule study approaches. These steelmen
    are compatible because they attach to different rungs, and the rungs come
    apart cleanly: the Gödelian motivation (ORCH-C040/ORCH-C041) is not a
    premise of the mechanism; the photophysics is not a coherence measurement; a
    positive collapse result would not select microtubules. My expectation that
    resolution will ultimately be negative leans on general decoherence physics
    in warm, ionically screened media — a prior, not a record in this file, and
    I flag it as such. Sensitivity: the single record whose removal would most
    change this case is ORCH-E013 (Li et al. 2025). Without it the anesthesia
    arm reads as a coherent if unproven program — stabilizer produces resistance
    in rats, mice, and tadpoles — and ORCH-C012 would rise from mixed to
    provisionally supported, with ORCH-C002 following. The case verdict
    nonetheless survives its removal, because the verdict rests on an absence
    (ORCH-C010) rather than on any single contrary thread. That is unusual
    robustness, and it has an exact converse: one competent measurement could
    move this case decisively in either direction, which is why the priority
    assignment in the dossier is correct."
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: No record tests the conjunction, and its middle term — a microtubule
      quantum state of the required duration and extent — has never been
      measured. The physics conjunct's most natural completion is experimentally
      excluded (ORCH-E017) and the biology conjunct is unreached even by
      proponent arithmetic (ORCH-E008, ORCH-E036), so the expected direction of
      resolution is negative, but expectation is not evidence and no null
      measurement exists. The strongest opposing consideration to my grading it
      "unresolved" rather than lower is that a conjunction whose parts are each
      unconfirmed, one of whose natural implementations is dead, and which
      publishes no acceptance criterion (ORCH-E035) may deserve worse than a
      neutral token; I keep unresolved because the decisive experiment is cheap,
      specified, and simply has not been run.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The chain's endpoints are evidenced — tubulin binding (ORCH-E009),
