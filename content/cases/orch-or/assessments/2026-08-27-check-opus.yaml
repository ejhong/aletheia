      self-inflicted: the claim survives the best available test by being less
      specified than the model tested, converting a refuted precise theory into
      an untested vague one, which is not a position from which to claim
      vindication. On the current file this is genuinely open and, importantly,
      open on a track with no biology in it."
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: moderate
    reasoning: 'The attached records cannot settle this claim, because producing
      correct novel theorems by any means does not bear on whether a knowably
      sound algorithm captures mathematical understanding — nobody ever held
