      anesthetic endpoint yet explained has been explained classically and no
      quantum contribution to cognition has ever been demonstrated, which makes
      this claim highly plausible on priors; I record that as a prior rather
      than as evidence, which is exactly why the verdict is unresolved rather
      than supported."
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: "No experiment has tested the ℏ/E_G lifetime scaling itself, so there
      is no positive evidence for the claim as worded; the one high-quality
      experiment (ORCH-E017) excluded a stochastic completion that Penrose's
