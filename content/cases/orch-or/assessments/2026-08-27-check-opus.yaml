  - claimId: ORCH-C003
    verdict: well_supported
    confidence: moderate
    reasoning: 'The β3(N265M) knock-in abolishes etomidate and propofol immobility
      and profoundly reduces their hypnotic effect (ORCH-E015) — target-level
      causal manipulation of a kind no microtubule result in this file
      approaches, and the claim is worded to restrict that strong evidence to
      the intravenous agents. Two honest limits are on the record: the same line
      separates endpoints, with the consciousness-adjacent measure reduced but
      not abolished (ORCH-E030), and the mutation barely touches volatile
      agents. The strongest opposing consideration is ORCH-E031, in which senior
      figures of the conventional literature report that no channel or
      combination suffices for inhaled immobility; that is why I grade
      confidence moderate rather than high, since "substantially accounted for"
