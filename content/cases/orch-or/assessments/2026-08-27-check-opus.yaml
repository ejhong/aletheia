  - claimId: ORCH-C012
    verdict: mixed
    confidence: moderate
    reasoning: "Read as an intervention-level statement, the claim is well
      evidenced: four microtubule-modulating drugs across two independent
      laboratories all shifted isoflurane susceptibility (ORCH-E011, ORCH-E012,
