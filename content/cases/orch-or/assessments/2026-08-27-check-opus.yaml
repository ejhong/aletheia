      epothilone D produced resistance in tadpoles but hypersensitivity in mice.
      The strongest opposing consideration in the other direction is that
      regimen and compound genuinely differ between the discordant studies, so
      the contradiction may be pharmacological rather than conceptual; that
      possibility is real but each reconciliation offered subtracts predictive
