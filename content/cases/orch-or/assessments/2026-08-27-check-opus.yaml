  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: "This is a universally quantified negative over a domain nobody has
      measured: the coherence quantity at ORCH-C010 is unmeasured, so neither
      this claim nor its rival can be graded on it. Unabsorbed anomalies remain
      on the record — the xenon nuclear-spin potency split (ORCH-E014) and the
      admitted insufficiency of known channels for inhaled immobility
