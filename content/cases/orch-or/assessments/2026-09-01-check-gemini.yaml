  synthesis: >-
    The "Collapse, Not Computation?" case file presents a remarkably segmented
    scientific dispute where the individual observational rungs cleanly separate
    from the headline thesis. To steelman the proponent case: Orch OR
    successfully predicted non-trivial optical and excitonic properties of
    microtubules long before they were experimentally verified. Between 2023 and
    2026, those properties moved from speculative to established, with groups
    confirming phenomena like superradiance and multi-nanometer exciton
    diffusion. Furthermore, clinical anesthetics have been shown to measurably
    perturb these optical properties, and microtubule-stabilizing drugs
    demonstrably alter clinical anesthetic latency thresholds in mammals. The
    theory uniquely attempts a unified physical mechanism for both conscious
    experience and its phenomenal existence, a frontier where classical network
    neuroscience remains largely silent.

    To steelman the conventional case: The standard classical framework
    possesses causal, single-target molecular evidence of a caliber that Orch OR
    wholly lacks. A single engineered point mutation in the GABA_A receptor β3
    subunit abolishes the immobilizing effects of propofol and etomidate,
    creating a clean causal anchor. In contrast, Orch OR's behavioral evidence
    relies on blunt pharmacological interventions (like epothilones) that cause
    wholesale metabolic and cellular disruptions. Crucially, independent
    laboratories have found that both microtubule stabilizers and destabilizers
    can shift anesthetic sensitivity in the exact same direction, fatally
    undermining any simple quantum-structural stability rule.

    The overall verdict is strictly unresolved because the entire theory
    balances on an unmeasured gap. There is zero direct experimental evidence
    for macroscopic quantum entanglement or physiological coherence times in
    living microtubules at the 25-millisecond scale required by the theory.
    Currently, proponents and critics are merely trading theoretical models—one
    side calculating femtosecond decoherence, the other up to millisecond
    coherence. The case's sensitivity relies critically on ORCH-E001 (Kalra
    2023, exciton diffusion, underlying ORCH-C020). If this foundational
    photophysics record were removed, the biological arm of Orch OR would
    instantly regress from "plausible but unproven" to entirely unsupported, and
    the case verdict would collapse from unresolved to contradicted. The verdict
    hangs heavily on this single thread. Without a prespecified coherence
    threshold or a rigorously controlled potency series, the headline thesis
    remains a provocative foundational architecture draped over standard
    nanometer-scale condensed-matter physics.
