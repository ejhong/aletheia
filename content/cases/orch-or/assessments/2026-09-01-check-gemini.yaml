  synthesis: >-
    The "Collapse, Not Computation?" case presents a striking structural
    asymmetry: the biological and physical components of Orch OR have advanced
    as independent scientific inquiries, but their conjunction remains entirely
    unverified. To steelman the proponent side: modern measurements show
    biological microtubules are not passive structural beams. Recent
    photophysics experiments demonstrate ordered collective electronic
    behaviors, including exciton diffusion over ~6.6 nm (Kalra 2023, ORCH-E001)
    and superradiant quantum-yield enhancement (Babcock 2024, ORCH-E004).
    Moreover, clinical anesthetics measurably dampen this exciton transport, and
    acute administration of a microtubule-stabilizing drug (epothilone B)
    significantly delays anesthetic-induced unconsciousness in live animals.
    Concurrently, xenon isotopes with nuclear spin are functionally less potent
    anesthetics than their spin-zero counterparts at identical polarizabilities,
    hinting at a quantum-sensitive mechanism in cognition.

    However, steelmanning the skeptical side reveals fatal gaps in the theory's
    conjunctive tissue. The central load-bearing proposition (ORCH-C010)—that
    physiological microtubules can sustain quantum coherence or entanglement for
    milliseconds across multiple tubulins—has never been measured. Theoretical
    calculations from proponents and critics alike place decoherence times
    vastly shorter than the theory requires (10^-13s to 10^-5s versus the ~25ms
    needed). The biological effects of anesthetics on microtubules lack
    specificity, as the convulsant picrotoxin dampens the same optical assay in
    a nearly identical manner. Furthermore, rigorous independent tests show
    microtubule destabilizers and chronic stabilizers moving anesthetic
    sensitivity in the exact same direction, severely undermining the simple
    structural-stability narrative. On the physics side, the Gran Sasso
    underground experiment cleanly eliminated the natural parameter-free
    Diósi-Penrose spontaneous collapse model (Donadi 2021, ORCH-E017). Finally,
    the classical alternative provides target-specific causal evidence that Orch
    OR currently lacks: a single point mutation in the GABA_A receptor
    profoundly diminishes propofol hypnosis (Jurd 2003, ORCH-E015).

    Sensitivity: The single evidence record whose removal would most alter this
    case is the Kalra 2023 exciton diffusion measurement (ORCH-E001). Without
    this modern empirical hook linking anesthetics to microtubule photophysics,
    the biological half of Orch OR devolves back to pure theoretical
    speculation, which would downgrade the anesthesia mechanism claim from
    weakly supported to contradicted. However, because the missing physiological
    coherence measurement (ORCH-C010) is what ultimately defines the overall
    case outcome, the headline verdict of "unresolved" survives its removal.
