  - claimId: ORCH-C001
    verdict: unresolved
    confidence: high
    reasoning: No evidence record in the file directly tests the conjoint claim that
      each conscious moment is a Penrose‑type gravitational reduction of a
      quantum state orchestrated across tubulin. The physics conjunct
      (ORCH-C030) is unconfirmed, the biological conjunct (ORCH-C010) has no
      coherence measurement at relevant scales, and the identification of the
      collapse with subjective experience has not been probed experimentally.
      Supportive data (e.g., microtubule photophysics, tubulin anesthetic
      binding, epothilone effects) are compatible with much weaker and classical
      interpretations, while the strongest contrary constraint is that the only
      precise gravity‑collapse model tested has been excluded (ORCH-C031). The
      strongest opposing consideration is that after three decades, the theory
      still lacks a prespecified quantitative threshold for coherence or
      entanglement that would let experiments score it decisively.
