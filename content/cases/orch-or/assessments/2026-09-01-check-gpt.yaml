      indirect and non‑unique marker of collective states, and replication in
      diverse systems is still limited. The strongest opposing consideration is
      that similar superradiant behavior has been engineered in non‑neural
      protein scaffolds and virus capsids, implying geometric ordering rather
      than neural specialness drives the effect.
