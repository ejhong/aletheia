      isoflurane sensitivity and that both a stabilizer and a destabilizer move
      sensitivity in the same direction. The strongest opposing consideration is
      that regimen (chronic vs. acute) and compound differences (epothilone D
      vs. B) plus physiological confounds (blood pH/CO2 changes) complicate
      direct comparison to the Wellesley studies, so mechanistic interpretation
