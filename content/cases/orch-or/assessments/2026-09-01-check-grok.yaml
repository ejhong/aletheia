  synthesis: "The featured hypothesis is a conjunction, not a mood: gravitational
    objective reduction is a physical fact, neuronal microtubules hold a
    coherent or entangled state of the required duration and extent, that
    collapse is the conscious moment, and general anesthetics abolish
    consciousness substantially by disrupting that state. No evidence record in
    this file tests the conjunction. Records test at most one conjunct, and the
    load-bearing middle term — physiological coherence on the order of tens of
    milliseconds across many tubulins (ORCH-C010) — has never been measured in
    either direction. That absence, not a tie between two mature empirical
    camps, is why the case verdict is unresolved rather than mixed. Steelman for
    the hypothesis. Microtubules are not inert beams. Kalra et al. report
    electronic excitation diffusing about 6.6 nm in polymerized microtubules,
    beyond a Förster account even after tryptophan–tyrosine corrections, with
    polymerization dependence and protofilament independence that argue against
    a simple artifact; Babcock et al., from a substantially independent group,
    find fluorescence quantum yield rising with hierarchical tryptophan
    organization as a collective-state model predicts. Anesthetics shorten that
    transport; Emerson et al., from an anesthesia laboratory with no Orch OR
    commitment, photolabeled β-tubulin and found microtubule stabilizers
    shifting anesthetic immobilization in tadpoles. Acute epothilone B delayed
    isoflurane loss of righting reflex in rats and mice with large standardized
    effects. Xenon isotopes that differ by nuclear spin, at identical calculated
    polarizability, differ in potency by tens of percent — a quantum degree of
    freedom with no classical polarizability explanation. The conventional
    genetics is incomplete exactly where Orch OR experiments usually sit: the
    GABA_A β3(N265M) mutation only slightly reduces enflurane and halothane,
    Jurd et al. themselves conclude that volatiles act via a broader target
    spectrum, hypnosis in the same knock-in is reduced but not abolished, and
    Eger et al. report that no ligand- or voltage-gated channel, and no
    combination of them, suffices for inhaled immobility. Orch OR at least
    nominates a timescale and an account of why activity is experienced.
    Steelman against. The 6.6 nm, femtosecond-to-picosecond photophysics is
    roughly one tubulin dimer; the theory needs milliseconds across many
    tubulins. Neither Kalra nor Babcock measured a coherence time, dephasing
    time, or entanglement witness; Babcock's \"tens of seconds\" is a radiative
    lifetime of a modeled dark eigenstate, not environmental decoherence.
    Tegmark calculated 10^-13 to 10^-20 s; Hagan, Hameroff and Tuszyński,
    modeling a different state, got 10^-5 to 10^-4 s, still short of the ~25 ms
    exemplar; a corpus tabulation finds no unconditional proponent estimate that
    meets the requirement. Gran Sasso, the highest-quality experiment in the
    file, found none of the spontaneous radiation predicted by the natural
    parameter-free Diósi–Penrose model and, with Diósi among the authors, judged
    Orch OR \"highly implausible\" on that completion. Penrose's τ ≈ ℏ/E_G
    criterion survives by not making the radiation prediction —
    underspecification, not confirmation. On anesthesia, picrotoxin affected the
    Kalra assay comparably to the anesthetics; an independent laboratory found
    chronic epothilone D and the destabilizer vinblastine both increasing
    isoflurane sensitivity, which no stability rule predicts; and a single
    GABA_A residue change abolishes etomidate and propofol immobility, causal
    evidence no tubulin manipulation in this file matches. The Bandyopadhyay
    triplet-of-triplet resonances remain unreplicated for over a decade. The
    Kerskens entanglement reading is contested by Warren and does not implicate
    microtubules. Independently verified AI mathematics pressures the Gödelian
    motivation without touching mechanism. The theory keeps consistent tau × N
    arithmetic but publishes no pass/fail coherence threshold, and it changed
    physical carriers in 2014. The rungs come apart. Collective microtubule
    electronics can be well supported while physiological coherence remains
    unmeasured and the headline cannot rise above its weakest required conjunct.
    Conventional intravenous genetics can be well supported without proving an
    exhaustive negative. Exclusion of one collapse completion can be well
    supported without refuting Penrose's heuristic criterion. Non-computability
    results are low-diagnosticity for biology and physics. Sensitivity: the
    single record whose removal would most change the balance is ORCH-E017
    (Donadi et al. 2021). It is the strongest experimental constraint on a
    load-bearing conjunct; without it, objective-reduction physics would look
    wholly untested rather than \"natural stochastic version excluded, heuristic
    criterion untested.\" The case verdict would still be unresolved: ORCH-C010
    remains unmeasured, no collapse event or density-matrix witness has been
    recorded in physiological microtubules, and the anesthesia arm remains
    directionally mixed. The unresolved verdict does not hang on one thread; it
    is overdetermined by independent gaps."
