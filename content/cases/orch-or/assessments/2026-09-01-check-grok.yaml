  synthesis: >-
    The featured hypothesis is a conjunction, and the evidence records test at
    most one conjunct each. That structure, not a split between confirming and
    refuting results, is why the case is unresolved. Collective microtubule
    photophysics is real. Kalra et al. inferred electronic energy diffusion of
    about 6.6 nanometres, beyond a Förster account even after
    tryptophan-tyrosine corrections, and Babcock et al. found fluorescence
    quantum yield rising with hierarchical tryptophan organization as a
    collective-superradiance model predicts. Those measurements retire any
    picture of microtubules as inert beams. They do not close, or even address,
    the gap Orch OR must cross: from roughly one tubulin dimer on
    femtosecond-to-picosecond physics to a coherent or entangled state lasting
    tens of milliseconds across many tubulins and ideally many neurons. No
    record specifies a density-matrix observable in physiological microtubules,
    measures its dephasing at 37 °C, or shows anesthetics suppress it in
    proportion to clinical potency. Tegmark's 10^-13 to 10^-20 s and Hagan's
    10^-5 to 10^-4 s remain calculations about different modeled states; even
    the proponents' unconditional revision falls short of their own ~25 ms
    exemplar. Until that number exists, warm-and-wet-kills-it and
    warm-quantum-biology-saves-it are arguments about an unmeasured quantity.

    Steelman for the hypothesis. Microtubules are optically and electrically
    nontrivial. Anesthetics perturb a measured microtubule optical property. A
    brain-penetrant microtubule stabilizer delays isoflurane loss of righting
    reflex in rats and mice. Xenon isotopes that differ by nuclear spin, not
    calculated polarizability, differ in anesthetic potency. The conventional
    account still offers no principled explanation of why any classical activity
    is experienced, and Eger et al. 2008 report that two decades of work
    identified no ligand- or voltage-gated channel, nor any combination of them,
    sufficient to mediate inhaled immobility. If a future coherence witness at
    physiological temperature came back positive and tracked anesthetic potency,
    several currently low-diagnosticity observations would point the same way.

    Steelman against. The GABA_A β3(N265M) point mutation supplies causal
    evidence no tubulin experiment approaches: change one residue, lose
    etomidate and propofol immobility. Picrotoxin hits the Kalra assay
    comparably to two anesthetics, stripping the specificity the strong
    anesthesia claim needs. An independent laboratory found chronic epothilone D
    and the destabilizer vinblastine both increasing isoflurane sensitivity,
    which falsifies the public generalization that stabilizing microtubules
    protects consciousness. Gran Sasso excluded the natural parameter-free
    Diósi-Penrose model; Penrose's own criterion survives in part by being less
    specified than the model that was tested. The Gödelian motivation is not a
    premise of the microtubule mechanism, and AI systems now produce
    Lean-verified and independently checked research-level mathematics. The
    rungs come apart cleanly. Evidence that microtubules harvest excitation is
    not evidence that they compute, entangle, or collapse.

    Sensitivity. The single evidence record whose removal would most change this
    assessment is ORCH-E017, the Gran Sasso null that excludes the
    parameter-free Diósi-Penrose model. It is the highest-quality experimental
    constraint on any conjunct of the thesis. Removing it would leave the
    physics half entirely untested rather than partially excluded. The
    unresolved verdict would survive without it: the biological middle term
    ORCH-C010 would remain unmeasured, the anesthesia arm would remain mixed,
    and the conjunction would still lack a discriminating test. The verdict does
    not hang on one thread; it is overdetermined by independent gaps.
