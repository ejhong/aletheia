  synthesis: "The featured hypothesis is a conjunction, and this ledger's real
    achievement is showing how cleanly its rungs separate. At the bottom the
    case is in genuinely good shape: microtubules display collective electronic
    behavior a passive-scaffold model does not predict (ORCH-C013, ORCH-C020,
    ORCH-C021), anesthetics really do bind tubulin and perturb microtubule
    photophysics (ORCH-C011), and microtubule-modulating drugs really do shift
    anesthetic sensitivity in animals (ORCH-C012). None of that was established
    a decade ago, and none of it should be controversial now. The case fails
    upward at exactly one point: the load-bearing middle term, ORCH-C010 — a
    coherent or entangled microtubule state of millisecond duration across many
    tubulins — has never been measured in either direction. What exists instead
    is two calculations seven to eight orders of magnitude apart, the
    proponents' own recalculation falling one to two orders short of the
    theory's stated requirement (ORCH-E036), and a measured transport length of
    6.6 nm on femtosecond-to-picosecond physics. The physics conjunct fares no
    better on direct experimental contact: the strongest experiment in the case,
    the Gran Sasso search (ORCH-E017), excluded the natural parameter-free
    Diósi–Penrose model, and Penrose's own criterion survives only by being too
    underspecified to make the excluded prediction — untested, not vindicated.
    The proponent steelman is real: warm quantum biology has precedent, the
    epothilone-B behavioral effect is blinded and cross-species, the xenon
    nuclear-spin split has no classical polarizability explanation, the
    conventional account concedes a paradox on inhaled-agent immobility
    (ORCH-E031) and offers no account of experience itself, and absence of
    measurement is genuinely absence rather than disproof. The skeptic steelman
    is at least as strong: thirty years without measuring the central quantity,
    no published pass/fail threshold, a carrier changed in 2014, each new result
    absorbed rather than scored, a convulsant hitting the flagship assay, the
    best independent animal study running backwards, and target-level causal
    evidence (ORCH-E015) on the conventional side that no microtubule experiment
    approaches. The AI-mathematics line bears on the motivation for the theory,
    not its mechanism, and is correctly low-diagnosticity in both directions.
    Sensitivity: the single record whose removal would most change this verdict
    is ORCH-E017 — without it the physics conjunct reverts from \"natural
    version excluded\" to wholly untested and the case's adverse lean softens
    materially. The verdict survives without it, because unresolved here rests
    on an absence (ORCH-C010 unmeasured) rather than on any single record; this
    case does not hang on one thread, it hangs on a measurement that has never
    been made."
