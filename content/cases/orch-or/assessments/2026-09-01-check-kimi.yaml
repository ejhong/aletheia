  synthesis: "Orch OR is a conjunction, and this assessment grades it as one. The
    physics conjunct (ORCH-C030) is unresolved: the best experiment in the case
    (ORCH-E017) excluded the natural parameter-free stochastic Diósi–Penrose
    model, but Penrose's published criterion makes no radiation prediction and
    has never been tested directly — a survival by underspecification that is
    not positive evidence. The biological conjunct (ORCH-C010) is the crux and
    is unmeasured in either direction: no coherence time, dephasing time, or
    entanglement witness has ever been recorded in a physiological microtubule,
    the two decoherence calculations disagree by seven to eight orders of
    magnitude, and even the proponents' own revised estimate falls short of the
    theory's requirement (ORCH-E036). The bridge — that collapse is the
    conscious moment — has no experimental handle at all. What the 2023–2026
    literature did establish sits one rung lower: microtubules are
    electronically collective beyond Förster prediction (ORCH-C013, C020, C021),
    anesthetics perturb that photophysics (ORCH-C011), and microtubule-active
    drugs move anesthetic sensitivity in animals (ORCH-C012) — but directionally
    incoherently, with the strongest and most independent study (ORCH-E013)
    finding stabilization and destabilization both increasing sensitivity, and
    the flagship assay failing specificity against picrotoxin (ORCH-E003). The
    conventional rival (ORCH-C003) holds target-level causal evidence no
    microtubule study approaches, though its volatile-agent arm is admittedly
    unfinished (ORCH-E031). The AI-mathematics results (ORCH-C041) are real and
    well verified, and bear only on the Gödelian motivation, not the mechanism.
    Steelmanning the theory: the warm-and-wet dismissal was a calculation about
    a state the theory does not propose; collective effects in ordered aromatic
    lattices are genuine physics; the xenon isotope effect is a real quantum
    anomaly in anesthesia, however unlocalized; and the conventional account has
    no principled explanation of experience. Steelmanning the skeptic: thirty
    years without measuring the central quantity, no published pass/fail
    threshold, a carrier change in the 2014 revision, and every tested rung
    coming out sub-diagnostic or negative is a pattern, and the pattern leans
    negative. That lean is partly prior-driven (warm-system decoherence
    expectations) and is labeled as such; on the records alone, the
    discriminating measurement has simply never been performed, so unresolved is
    a substantive finding, not a hedge. Sensitivity: the single record whose
    removal would most move this case is ORCH-E013 (Li et al. 2025), the only
    discriminating rather than accumulating result in the most testable theme.
    Without it, ORCH-C012 would read as one-directional proponent evidence and
    ORCH-C002 would firm from weakly toward provisionally supported. The case
    verdict survives its removal: the headline thesis remains unresolved because
    its load-bearing middle term remains unmeasured, and no single anesthesia
    record carries the conjunction. This verdict does not hang on one thread; it
    hangs on an absence."
claimAssessments:
  - claimId: ORCH-C001
