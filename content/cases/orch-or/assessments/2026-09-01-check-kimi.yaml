    reasoning: "The headline thesis is a three-way conjunction, and no record in
      this case tests more than one conjunct at a time: the photophysics
      measures femtosecond-to-picosecond transport, the anesthesia studies
      measure behavior with no quantum variable, and Gran Sasso constrains a
      stochastic collapse model with no biology in it. The load-bearing middle
      term (ORCH-C010) has never been measured in either direction, and the
      physics criterion (ORCH-C030) remains untested as stated, so unresolved is
      a statement about the absence of a discriminating test rather than a split
      between confirming and refuting evidence. The strongest opposing
      consideration is prior-based and labeled as such: a theory requiring an
      unconfirmed law of physics and an unmeasured biological state, with thirty
      years of no measurement and no published pass/fail threshold, arguably
      warrants a grade weaker than unresolved. That argument has real force, but
      it leans on priors and on the theory's specification defect rather than on
      any record refuting the claim as worded."
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The records establish the endpoints of the proposed chain but not
      the chain: anesthetics measurably alter microtubule photophysics
