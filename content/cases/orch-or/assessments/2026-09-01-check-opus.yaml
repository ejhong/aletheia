      validated result would implicate bulk water proton spins, not
      microtubules."
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: "The claim states what a specific experiment found and excluded, and
      the record supports it precisely: a dedicated ultra-low-background
