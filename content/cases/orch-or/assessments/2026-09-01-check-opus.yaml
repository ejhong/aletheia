      an outside laboratory, the length is inferred from concentration-dependent
      quenching rather than imaged, and the specific reduced values (~5.6 and
      ~5.8 nm) were carried into this ledger from a secondary reading rather
      than verified. The strongest opposing consideration is independence:
      Hameroff, Penrose, Craddock and Tuszyński are co-authors, so the most
      important experiment for the theory is a collaboration including its
      authors rather than an outside test of it."
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The measured quantum-yield trend across geometric regimes matches
      the superradiance model's prediction and the group is substantially
      independent of the Hameroff–Penrose line, which is what keeps this above
      weak. It stays below well_supported because the paper is predominantly
      theoretical with a bulk-fluorescence confirmation, and quantum yield is an
      indirect witness that several mechanisms can raise. The strongest opposing
      consideration is the availability of an ordinary explanation: Dicke-type
      collective emission has been engineered in ordered protein scaffolds with
      no cognitive relevance, so geometric regularity rather than neural
      specialness may be doing all the work — and the widely quoted \"tens of
      seconds\" is a modeled radiative lifetime, not a coherence time."
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: "A specific published measurement exists (ORCH-E005), so the claim is
      not unevidenced, but it rests on one laboratory lineage, a bespoke
      apparatus spanning an unusually wide frequency range, a low-profile venue,
      and thirteen years without protocol-level replication — including the same
      group's unreplicated 100 μs coherence report. Related work from that
      lineage is not independent corroboration. The strongest opposing
      consideration cuts against building anything on this: sustained
      non-replication of a striking result, in a field where the comparison case
      (photosynthetic coherence, 2007) was replicated many times over, is weak
      evidence against and strong reason to treat this as a research target
      rather than a rung."
  - claimId: ORCH-C023
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Both experiments are peer-reviewed with blinded LORR measurement, a
      tolerance control, and large standardized effects (d = 1.9 rats, d = 0.8
      mice), and the direction reproduced across species — that is real support
      for the behavioural effect as worded. It cannot rise higher because N = 8
      in the main rat analysis, males only, no counterbalanced crossover,
      latency at a single high concentration rather than a
      concentration–response curve, and both studies share a senior author and
      program, so this is within-program replication of direction. The strongest
      opposing consideration is that the independent study measuring the
      better-specified quantity (ORCH-E013) found sensitivity shifting the other
      way, and the authors themselves concede the mouse effect is small against
      inter-animal variability.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: moderate
    reasoning: Randomized, blinded, independent of the Wellesley program, four
      agents including a destabilizer and an opioid control, and full
      incremental concentration–response curves with narrow non-overlapping
      confidence intervals — methodologically the strongest animal study in the
      ledger, and I grade it on that basis rather than on which side it favours.
      The author-acknowledged limitations (saline vehicle for poorly soluble
      compounds, LORR rather than MAC, isoflurane only, altered blood pH and
      CO₂) weaken the interpretation without touching the measurement. The
      strongest opposing consideration is that it remains a single unreplicated
      study with a chronic regimen and a different compound from the acute
      epothilone-B work, so it constrains the general stability rule rather than
      refuting the acute finding directly.
  - claimId: ORCH-C025
    verdict: weakly_supported
    confidence: low
    reasoning: "The published means show a large, orderly split at the spin boundary
