  - claimId: ORCH-C022
    verdict: unresolved
    confidence: low
    reasoning: "A published, specific measurement exists (ORCH-E005), but it comes
      from a single laboratory lineage using bespoke apparatus across an
      unusually wide frequency range, in a low-profile venue, with no
      independent protocol-level replication in the years since — and the same
      group's related 2013 coherence claim is likewise unreplicated. The Sahu
      work is the same group and is not corroboration. The strongest opposing
      consideration for anyone inclined to accept it is the comparison the case
      itself draws: photosynthetic coherence results from 2007 were replicated
      many times and founded a field, whereas thirteen years of silence around
      this one is weak evidence against its reliability. Even if replicated,
      electromagnetic resonance structure is a classical observable and would
      not witness coherence or entanglement."
  - claimId: ORCH-C023
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Both experiments are peer-reviewed, both used blinded LORR scoring,
      both controlled for isoflurane tolerance, and the standardized effects are
      large (d = 1.9 rats, d = 0.8 mice), with the direction reproducing across
      species (ORCH-E011, ORCH-E012). The strongest opposing consideration is
      that this is a within-program replication, not an independent one: the two
      studies share a senior author, the rat analysis rests on N = 8 males, the
      design was not a counterbalanced crossover, and the mouse paper itself
      concedes the 29 s effect is small against inter-animal variability and
      cites the contradictory independent study. A latency shift at a single 4%
      concentration also does not establish a shift in the
      concentration–response curve, which is the quantity Li 2025 measured and
      found running the other way."
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: moderate
    reasoning: "This gets the anesthesia theme's strongest grade on methodology, not
      on which side it favors: independent of the Wellesley program, randomized,
      blinded, four agents including a destabilizer and an opioid control, full
      incremental concentration–response curves, and narrow non-overlapping
      confidence intervals (ORCH-E013). The vinblastine result — a destabilizer
      shifting sensitivity the same way as a stabilizer — is the informative
      part, since no microtubule-stability account predicts it. The strongest
      opposing consideration is that the authors acknowledge saline was an
      imperfect vehicle for poorly soluble compounds and that epothilone D
      altered blood pH and CO₂, which supplies a physiological route to the
      shift; the chronic regimen also differs from the acute Wellesley dosing,
      so this constrains the generalization without refuting the acute result."
  - claimId: ORCH-C025
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The original finding is striking and well designed on its face — 80
      randomized mice, four isotopes, identical calculated polarizability, a
      40–50% potency gap (ORCH-E014) — and the frozen re-analysis found that a
      spin step describes the four means far better than a linear mass trend,
      with the magnitude asymmetry across the spin boundary hard to produce by a
      smooth mass confound (ORCH-E038). I downgrade from the case's provisional
      grade because two newer records undermine it directly: no replication,
      extension, or antecedent exists after eight years of citation (ORCH-E039),
      and the public record does not state whether the dispersions are SD or
      SEM, gives no enrichment or blinding details, and the headline xenon-alone
      values are calculated from co-administration with 0.50% isoflurane rather
      than measured (ORCH-E040). The strongest opposing consideration is that
      the frozen identification test tripped on intercept-versus-mass
      conditioning, so the dataset cannot support a two-covariate inferential
      test in either direction."
  - claimId: ORCH-C026
    verdict: mixed
    confidence: low
    reasoning: "A real and unusual signal was recorded in living human brains with
      heartbeat-evoked timing, no conventional MRI correlate, and an apparent
      dependence on conscious awareness (ORCH-E020), and the claim as worded is
      careful to attribute the entanglement reading to the experimenters rather
      than assert it. The interpretation is the disputed part, and the dispute
      is substantive: Warren, from a position of NMR methodological authority,
      argues the data justify no such claim and reflect only that living tissue
      is complex and multicompartmental (ORCH-E021), with the authors' reply
      unresolved on the public record. The strongest opposing consideration is
      that heterogeneous living tissue is precisely the regime where classical
      multi-compartment effects mimic exotic ones, and no phantom validation or
      independent reproduction exists. Note also that even a validated result
      implicates no microtubule."
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: "The claim is a precise report of what a high-quality experiment
      found, and the exclusion is stated in the authors' own abstract: an
      ultra-low-background germanium search at Gran Sasso found no spontaneous
      radiation, tightened the mass-density cutoff bound by about three orders
      of magnitude, and rules out the natural parameter-free Diósi–Penrose model
      (ORCH-E017). The prediction was quantitatively derived beforehand and
      Diósi himself co-authored, which makes the null unusually informative. The
      strongest opposing consideration is scope rather than validity: the bound
      constrains one stochastic master equation and a parameter range,
      non-Markovian and non-local variants have been proposed to evade the
      radiation prediction, and the ℏ/E_G scaling itself remains unmeasured — so
      the claim should not be read as excluding all gravity-related collapse."
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: high
    reasoning: "The verification here is unusually good for a recent claim: the
      Erdős disproof is attested by an independent working mathematician who
      states it in his own arXiv paper and sharpens the exponent (ORCH-E022),
      AlphaProof's IMO solutions were machine-checked in Lean with methodology
      peer-reviewed in Nature (ORCH-E023), and the 2025 gold performance was
      graded by IMO coordinators under contest conditions (ORCH-E024). The
      strongest opposing consideration is the documented false-positive history
      of this evidence line — an October 2025 round of AI Erdős claims collapsed
      as already-solved, and a Christmas 2025 claim was withdrawn within hours
      (ORCH-E027) — which is why anchoring on Sawin rather than on company
      announcements matters. The Zahavy position paper (ORCH-E025) contests what
      these results mean, not that they occurred, and the claim as worded
      asserts only the latter."
