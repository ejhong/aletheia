  synthesis: "The featured hypothesis is a conjunction — gravitational objective
    reduction is real physics, neuronal microtubules host a coherent state of
    the required duration and extent, and that collapse constitutes the
    conscious moment — and the evidence ledger contains no record that tests the
    conjunction. It tests conjuncts, unevenly. The physics conjunct has been
    attacked with the best experiment in the file: the Gran Sasso germanium
    search (ORCH-E017), performed with the model's own co-originator among the
    authors, excluded the natural parameter-free Diósi–Penrose completion.
    Penrose's bare ℏ/E_G criterion escapes that bound only by being a lifetime
    relation rather than a dynamical model, which is a survival by
    underspecification, not a result. The biological conjunct has genuinely
    improved: Kalra's 6.6 nm exciton diffusion and Babcock's quantum-yield
    enhancement make \"microtubules are passive scaffolding\" false, and
    Emerson's β-tubulin photolabel puts tubulin on an anesthetic pathway. But
    every one of those measurements is adjacent to, not identical with, the
    quantity the theory needs. The distance is quantitative and enormous: one
    dimer versus many tubulins, femtoseconds-to-picoseconds versus tens of
    milliseconds. Nothing in the ledger measures a dephasing time or an
    entanglement witness in a microtubule, and the tabulation at ORCH-E036
    records that not even an unconditional proponent-side calculation reaches
    the theory's own exemplar. Steelmanning the proponents: the standard
    dismissal (\"warm and wet, 10⁻¹³ s\") is itself a calculation about a state
    both sides now agree was not the proposed one, so the field's confident
    closure has always been rhetorical; the xenon nuclear-spin split and the
    Kerskens signal are unexplained; and Eger's review concedes the classical
    account cannot yet explain even inhaled immobility. Steelmanning the
    critics: the conventional side has the one thing this case lacks —
    target-level causal control, where a single residue change removes a drug's
    action — while the microtubule side's own flagship experiment reports a
    convulsant perturbing the assay like an anesthetic, and the most
    methodologically complete animal study found stabilizer and destabilizer
    moving sensitivity the same way. Verdict is unresolved because the decisive
    observable has never been recorded in either direction, not because the two
    sides are evenly matched; the conjunctive structure means the honest
    expectation is negative resolution long before positive. Sensitivity: the
    record whose removal would most change the picture is ORCH-E013 (Li 2025),
    which alone converts the anesthesia arm from contradictory to coherent. The
    case verdict survives its removal, because that verdict rests on an absence
    — no coherence measurement anywhere in the ledger — that no single record
    supplies or withdraws."
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: "No evidence record in the file tests the conjunction; each bears on
      at most one conjunct, and the load-bearing middle term (ORCH-C010) has
      never been measured in either direction. The physics conjunct's most
      natural implementation is experimentally excluded (ORCH-E017) while
      Penrose's own criterion remains untested, and the biology conjunct is
      separated from the demonstrated photophysics by many orders of magnitude
      in time and space. The strongest opposing consideration is structural
      rather than empirical and cuts against the claim: as ORCH-E035 documents,
      the corpus publishes parameter values but no acceptance criterion, so no
      measurement can currently count as a failure — a defect that makes
      \"unresolved\" partly a statement about the theory's specification rather
      than about nature. I note that background plausibility, not the records,
      is what makes the negative direction feel more likely."
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: "Real evidence exists for the chain's endpoints — anesthetics alter a
      measured microtubule optical property (ORCH-E002), tubulin lies on an
      anesthetic pathway (ORCH-E009), acute epothilone B shifts LORR latency
      (ORCH-E011) — but nothing in the ledger measures the \"quantum-coherent\"
      state the claim names, so the qualifier doing the most work is entirely
      unmeasured. The strongest opposing consideration is that the specificity
      control inside the flagship experiment failed: picrotoxin, a convulsant,
      perturbed the same assay comparably (ORCH-E003), which is what one expects
      if the assay reports perturbability by small hydrophobic molecules rather
      than anesthesia. Add the independent contradictory animal result
      (ORCH-E013) and the far stronger receptor-level causal evidence for the
      rival account (ORCH-E015), and what survives is support for a much weaker
      claim than this one."
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: high
    reasoning: "ORCH-E015 supplies exactly the target-level causal manipulation the
      claim asserts: the β3(N265M) knock-in abolishes etomidate and propofol
      immobility and profoundly reduces their hypnotic effect, a standard of
      evidence no microtubule record here approaches. The claim is carefully
      hedged (\"substantially\", \"for the intravenous agents\"), and the hedges
      are what the evidence supports. The strongest opposing consideration is
      internal to the conventional literature: Eger et al. report that no
      ligand- or voltage-gated channel, and no combination, suffices for inhaled
      immobility (ORCH-E031), and Zeller's endpoint mapping shows the
      consciousness-adjacent endpoint is reduced but not abolished in the same
      line (ORCH-E030). The TREK-1 precedent also warns that genetic
      anesthetic-target findings can fail replication."
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: "This is a universally quantified negative over a domain that has
      never been measured, so accumulating classical successes cannot establish
      it. The ledger contains two unabsorbed anomalies — the xenon nuclear-spin
      potency split (ORCH-E014) and the incoherent epothilone directions
      (ORCH-E011/E013) — plus the classical literature's own admission that no
      known channel combination explains inhaled immobility (ORCH-E031). The
      strongest opposing consideration is parsimony, and it is strong: no
      quantum-coherent contribution to any cognitive function has ever been
      demonstrated, and the burden properly sits with the challenger. I flag
      explicitly that anyone grading this above unresolved would be pricing a
      prior rather than reading these records."
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: "The ℏ/E_G scaling has never been measured; the only dedicated
      experiment (ORCH-E017) tested a stochastic completion that predicts
      spontaneous radiation, found none, and excluded the parameter-free
      version, and the experimenters themselves judged Orch OR \"highly
      implausible\" when built on that completion (ORCH-E018). McQueen's point
      that Penrose's criterion is a lifetime relation making no radiation
      prediction (ORCH-E019) is accepted here, which is why the verdict is not
      \"contradicted\". The strongest opposing consideration is that this escape
      is not a virtue: the claim survives by being less specified than the model
      that died, and the proposed direct test (ORCH-R007) requires a regime
      beyond current capability, so the claim sits uncomfortably close to
      presently_untestable."
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: low
    reasoning: "The attached records cannot settle this claim as worded: producing
      correct novel mathematics (ORCH-E022/E023/E024) does not bear on whether a
      knowably sound algorithm captures mathematical understanding, since nobody
      claimed algorithms cannot generate true theorems, and the Zahavy position
      paper (ORCH-E025) is an argument, not a measurement. The formal-logic
      dispute over the disputed steps remains live rather than resolved. The
      strongest opposing consideration is the one the case editor's own audit
      concedes (ORCH-E026): every concrete example Penrose offered that was
      testable has settled against him, and the survivors are the untestable
      ones — a pattern consistent with an unfalsifiable claim. Absent an agreed
      operationalization of \"understanding\", a verdict of presently_untestable
      would be nearly as defensible as this one."
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: moderate
    reasoning: "This is the crux, and the finding is an absence: not one record
      measures a dephasing time, coherence time, or entanglement witness in a
      microtubule under any conditions. The two numbers in the literature are
      calculations that disagree by seven to eight orders of magnitude
      (ORCH-E007, ORCH-E008), and the tabulation at ORCH-E036 records that the
      proponents' own unconditional estimate falls two to three orders short of
      their own exemplar, with the gap bridged only by conditional assumptions
      or by unreplicated single-laboratory resonance work. The strongest
      opposing consideration is that this asymmetry arguably warrants a verdict
      below unresolved: every record touching the claim points the same
      direction, and none supports it. I stop at unresolved because all of that
      evidence is calculation about disputed model states, and because Hagan's
      objection that Tegmark modeled the wrong physical state is accepted on the
      record."
  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Two experimentally distinct lines support the claim as worded: Kalra
      measured etomidate and isoflurane shortening exciton diffusion
      (ORCH-E002), and Emerson independently photolabeled β-tubulin with an
      anthracene anesthetic and mapped the site (ORCH-E009), the latter from an
      anesthesia laboratory with no Orch OR commitment. The claim says nothing
      about coherence, consciousness, or specificity, which is why it clears the
      bar its parent does not. The strongest opposing consideration is that the
      Kalra result is unreplicated, has the theory's authors among its
      co-authors, reports a modest ~13% effect at 50 μM with free concentration
      unestablished, and that picrotoxin perturbed the same assay comparably
      (ORCH-E003) — so the observed effect may not be an anesthetic effect at
      all in any meaningful sense."
  - claimId: ORCH-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Read strictly as worded, the claim is about whether
      microtubule-modulating drugs shift anesthetic susceptibility, and they
      demonstrably do: Li 2025 reports significant EC50 shifts with
      non-overlapping confidence intervals for epothilone D, vinblastine, and
      paclitaxel (ORCH-E013), and the Wellesley studies report large latency
      shifts with epothilone B (ORCH-E011/E012). The strongest opposing
      consideration is that the operative variable may not be microtubule
      stability: a destabilizer and a stabilizer moved sensitivity the same
      direction, epothilone D altered blood pH and CO₂, and these drugs perturb
      transport, metabolism, and cellular integrity wholesale. I therefore
      separate the claim's local truth (drugs move the endpoint) from the
      directional version the case elsewhere grades \"mixed\", which the
      vinblastine result falsifies."
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: moderate
    reasoning: "Two methodologically distinct measurements from partly independent
      groups converge: an excitation diffusion length that the authors report
      Förster theory does not sufficiently explain (ORCH-E001), and a
      quantum-yield enhancement tracking hierarchical organization as a
      collective-state model predicts (ORCH-E004). Polymerization-dependence
      with protofilament-independence in the Kalra work is the kind of structure
      control that argues against artifact. The strongest opposing consideration
      is interpretive rather than evidential: collective excitonic behavior in
      an ordered aromatic lattice is expected condensed-matter physics,
      engineered in virus capsids and light-harvesting complexes with no
      cognitive content, so \"a passive scaffolding model does not predict
      this\" is a low bar and the claim's diagnosticity for the headline thesis
      is near zero. Neither measurement has been replicated outside its
      originating collaboration."
  - claimId: ORCH-C020
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The measurement is peer-reviewed, open-access, quantitative, and
      stated in the paper's own abstract, with internal structure-dependence
      controls (ORCH-E001, ORCH-E002). I grade it below the case's own
      \"well_supported\" because it is a single unreplicated experiment in which
      the diffusion length is inferred from concentration-dependent quenching
