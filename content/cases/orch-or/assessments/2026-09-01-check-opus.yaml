      ~5.8 nm) were relayed from the paper body rather than verified by the
      import. The strongest opposing consideration is independence: Hameroff,
      Penrose, Craddock, and Tuszyński are co-authors, so the most important
      experiment for the theory is a collaboration including the theory's
      authors rather than an outside test — a real qualification on an
      unreplicated result, though not a reason to doubt the number."
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: low
    reasoning: The measured quantum-yield trend matches the superradiance model's
