  synthesis: "The featured hypothesis is a conjunction — gravitational objective
    reduction is real physics, neuronal microtubules host a coherent state of
    the required duration and extent, and that collapse constitutes a conscious
    moment — and it fails or succeeds on its weakest conjunct. Reading only the
    attached records, the second conjunct (ORCH-C010) has never been measured in
    either direction, and the third has no attached test at all. That is why the
    case verdict is unresolved rather than contradicted: the crux is an absence,
    and an absence cannot be converted into refutation by accumulating adjacent
    negatives. It is also why the verdict is nowhere near supported: not one
    record in the ledger measures a dephasing time, a coherence length, or an
    entanglement witness in a microtubule, so the theory's central quantity
    remains a matter of two calculations disagreeing by seven to eight orders of
    magnitude, neither anchored to an observation. Steelmanning the proponent
    side properly: the 2023–2024 photophysics is real and partly independent,
    microtubules are demonstrably not passive scaffolding, tubulin sits on an
    anesthetic pathway for at least one compound class, a brain-penetrant
    stabilizer moves anesthetic latency with a large standardized effect across
    two species, the xenon nuclear-spin result has no classical polarizability
    explanation on offer, and the Gran Sasso bound demonstrably tests a
    stochastic completion that Penrose's published criterion does not entail.
    Steelmanning the skeptical side: the anesthesia arm's flagship experiment
    failed its own specificity control when a convulsant moved the assay
    comparably; the methodologically strongest and only genuinely independent
    animal study found stabilization increasing anesthetic sensitivity, with a
    destabilizer moving it the same way; the conventional account holds
    target-level causal evidence — one engineered residue abolishing a drug's
    action — that no microtubule study approaches; the natural parameter-free
    collapse model is experimentally dead; and on the corpus's own published
    numbers no unconditional proponent decoherence estimate reaches the theory's
    own requirement. Two structural facts dominate the roll-up. First, the
    ladder genuinely decomposes: the non-computability rung is motivation, not
    mechanism, and the AI-mathematics results — however solid — move nothing
    below it. Second, the theory publishes parameter values but no acceptance
    criteria (ORCH-E035), so each new measurement is absorbable rather than
    scorable. That is a specification defect, not disconfirmation, but it is the
    reason thirty years of work has produced no verdict-moving number.
    Sensitivity: the single record with the most leverage is ORCH-E013 (Li
    2025). Removing it would lift ORCH-C012 from mixed toward provisionally
    supported and would remove the sharpest independent challenge to the
    anesthesia arm. The case verdict survives its removal unchanged, because the
    verdict rests on the unmeasured crux at ORCH-C010, not on any undermining
    record — a robustness that is itself the case's most informative feature,
    and one that cuts against both camps."
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: No attached record tests the conjunction; the photophysics measures
      nanometre-scale transport, the anesthesia work measures behavioural
      latencies with no quantum variable, and the collapse experiment contains
      no biology. The undermining records (ORCH-E007, ORCH-E017, ORCH-E018,
      ORCH-E036) bear on individual conjuncts and are mostly calculations or
      bounds on a specific completion, so they do not license "contradicted."
      The strongest opposing consideration is that a conjunction with three
      unconfirmed limbs, one of them unmeasured after thirty years and the
      others' friendliest published estimates falling short of the theory's own
      requirement, is already in poor standing — an argument I weight partly on
      priors and label as such.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: The endpoints of the proposed chain have support — anesthetics alter
      a measured microtubule optical property (ORCH-E002), tubulin is
      photolabeled on an anesthetic pathway (ORCH-E009), acute epothilone B
      shifts LORR latency (ORCH-E011) — but the middle term named in the claim,
      a quantum-coherent state, has never been measured, so the qualifier that
      makes this claim distinctive is wholly unevidenced. Against it stand the
      picrotoxin specificity failure inside the flagship experiment (ORCH-E003)
      and the independent contradictory animal result (ORCH-E013). The strongest
      opposing consideration is that every supporting record is equally well
      explained by ordinary cell biology plus a rival account (ORCH-C003)
      holding causal evidence of a class this claim cannot match.
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: moderate
    reasoning: "The β3(N265M) knock-in abolishes etomidate and propofol immobility
      and profoundly reduces their hypnotic effect (ORCH-E015) — target-level
      causal manipulation, which is the highest evidential grade present
      anywhere in this case, and the claim is deliberately scoped to the
      intravenous agents for exactly that reason. Endpoint dissociation within
      the same line (ORCH-E030) sharpens rather than undermines it, since the
      mutation's cleanest effect is on a spinal endpoint while hypnosis is
      reduced but not abolished. The strongest opposing consideration is
      ORCH-E031: the field's own flagship review reports that no channel, and no
      combination of channels, suffices to explain immobility from inhaled
      agents — so \"substantially accounted for\" is on firm ground for
      intravenous agents and considerably softer for the volatiles that most
      Orch OR experiments use."
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: "A universally quantified negative over a domain whose key variable
      has never been measured cannot be graded above unresolved on the evidence
      supplied; accumulating conventional successes raises plausibility without
      entailing exhaustiveness. Two unabsorbed anomalies sit in the ledger — the
      xenon nuclear-spin potency split (ORCH-E014) and the incoherent stabilizer
      directions (ORCH-E011/ORCH-E013) — alongside ORCH-E031's concession that
      the classical account has not closed even the immobility endpoint. The
      strongest opposing consideration is parsimony: no quantum-coherent
      contribution to any cognitive function has ever been demonstrated, and
      grading this unresolved arguably prices a hypothesis space that nothing
      yet occupies — a judgment that rests on priors rather than on any attached
      record."
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: "No experiment in the ledger tests the ℏ/E_G lifetime scaling itself;
      the Gran Sasso null (ORCH-E017) excludes a stochastic completion that, as
      McQueen correctly notes (ORCH-E019), Penrose's characteristic-lifetime
      criterion does not entail. So the claim as worded is neither confirmed nor
      refuted — it is untested, and R007 records that the required mesoscopic
      regime is beyond current capability, which puts this close to the
      presently_untestable boundary. The strongest opposing consideration is
      methodological and I accept it: surviving an experimental bound by being
      less specified than the model that was tested is not evidence for the
      surviving version, and the class of gravity-collapse models specified
      enough to test keeps narrowing."
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: low
    reasoning: "The attached records cannot settle this: the AI results (ORCH-E022,
      ORCH-E023, ORCH-E024) establish that machines produce correct novel
      mathematics, which was never the point at issue, since the claim concerns
      whether a knowably sound algorithm captures mathematical understanding.
      The qualifying records (ORCH-E025, ORCH-E026) are arguments, not
      measurements, and one is the case editor's own essay. The strongest
      opposing consideration is structural rather than empirical — the claim has
      retreated toward formulations no achievement can touch, and Eugene's own
      audit concedes that Penrose's testable examples have mostly settled
      against him — which raises the live possibility that the statement is not
      empirically decidable in the form given."
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: moderate
    reasoning: "This is the case's load-bearing gap and the finding is a genuine
      absence: no record measures a dephasing time, coherence length, or
      entanglement witness in a microtubule, and the two photophysics results
      measure adjacent quantities (an exciton diffusion length modeled with an
      incoherent comparison; a modeled dark-state radiative lifetime that is
      routinely misread as a coherence time). The tilt is negative rather than
      neutral: Tegmark's 10⁻¹³–10⁻²⁰ s, Reimers's 10 fs–30 ps for anything
      coupled to electronic motion, and the proponents' own unconditional
      10⁻⁵–10⁻⁴ s all fall short of the ~25 ms requirement (ORCH-E007,
      ORCH-E008, ORCH-E036). The strongest opposing consideration against
      grading it contradicted is that these are all calculations about disputed
      model states, they disagree among themselves by eight orders of magnitude,
      and the 2023–2024 lattice results show the relevant environment is less
      well characterized than the modelers assumed."
  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Two partly independent lines support the claim as worded: Emerson et
      al. photolabeled β-tubulin near the colchicine site with functional
      consequences in vivo (ORCH-E009), and Kalra et al. measured etomidate and
      isoflurane shortening exciton diffusion (ORCH-E002). Both have real limits
      — the Emerson anesthetic is a research compound with an immobility
      endpoint, and the Kalra effect is a single unreplicated ~13% shift from a
      paper co-authored by the theory's principals, with the specific reduced
      values unverified in this ledger. The strongest opposing consideration is
      the picrotoxin result inside that same paper (ORCH-E003): a convulsant
      moving the assay comparably means the observation is currently consistent
      with general perturbability of microtubule photophysics by small
      hydrophobic molecules."
  - claimId: ORCH-C012
    verdict: mixed
    confidence: moderate
    reasoning: 'The literal proposition — microtubule-modulating drugs shift
      anesthetic susceptibility in animals — is well evidenced across four
      agents and two programs, but the attribution to microtubule stability as
      the operative variable is contradicted by the data pattern: chronic
      epothilone D and the destabilizer vinblastine shift sensitivity in the
      same direction (ORCH-E013), opposite to acute epothilone B (ORCH-E011,
      ORCH-E012). "Mixed" here is a substantive finding about that split, not a
      hedge. The strongest opposing consideration for either camp is that these
      drugs perturb transport, metabolism, cellular integrity and — as the Li
      study documents — blood pH and CO₂, so the whole literature may be
      measuring general cellular disruption rather than anything about
      microtubules as such.'
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: moderate
    reasoning: "Two substantially different observables from partly independent
      groups point the same way: excitation diffusion exceeding the authors'
      Förster expectation with polymerization-dependence but no
      protofilament-number dependence (ORCH-E001), and a measured fluorescence
      quantum-yield trend matching a collective-eigenstate prediction
      (ORCH-E004). The structure-dependence argues against artifact, and the
      claim as worded is modest — collective dynamics beyond passive
      scaffolding, not coherence or computation. My confidence is partly
      calibrated by general condensed-matter background, which I flag:
      cooperative optics in ordered aromatic arrays is expected physics. The
      strongest opposing consideration is precisely that: nothing here requires
      more than conventional quantum chemistry of an ordered lattice, and the
      strongest single measurement remains unreplicated and
      proponent-co-authored."
  - claimId: ORCH-C020
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The 6.6 nm figure and the anesthetic reduction are both stated in
      the abstract of a peer-reviewed, open-access paper with internal structure
      controls, which is real support for the measurement as worded. I grade it
