  synthesis: >-
    The Orch OR hypothesis attempts to resolve the hard problem of consciousness
    by synthesizing quantum gravitational state reduction with cytoskeletal
    biophysics and anesthetic pharmacology. When evaluated strictly against the
    recorded evidence ledger, the architecture of the theory displays an
    unbridged chasm between demonstrated microscopic photophysics and
    macroscopic neural function. On the proponent side, genuine progress has
    established that microtubules are electronically and optically collective
    rather than passive mechanical scaffolds: Kalra et al. (2023) demonstrated
    tryptophan exciton migration over 6.6 nm (surpassing Förster predictions),
    and Babcock et al. (2024) confirmed enhanced fluorescence quantum yield
    matching superradiance models. Furthermore, general anesthetics demonstrably
    bind β-tubulin (Emerson et al. 2013) and modulate exciton diffusion (Kalra
    et al. 2023), while acute administration of epothilone B prolongs the
    latency to anesthetic-induced loss of righting reflex in rodents (Khan et
    al. 2024, Huang et al. 2026). At the foundations of anesthesia, anomalies
    like the xenon isotope effect (Li et al. 2018)—where nuclear spin alters
    anesthetic potency despite identical electronic polarizability—demonstrate
    that quantum degrees of freedom can influence anesthesia, while classical
    multi-target pharmacology still lacks a demonstrated sufficient set of ion
    channels to explain volatile anesthetic immobility (Eger et al. 2008).


    However, the skeptical evidence decisively severs the proposed causal chain.
    On the biological substrate, study ORCH-S001 reveals that no unconditional
    proponent calculation of microtubule decoherence time meets the theory's 25
    ms requirement; the proponents' own most favorable estimate (Hagan et al.
    2002) tops out at 10^-4 s, still two orders of magnitude too fast, while
    critics calculate environmental decoherence in the femtosecond-to-picosecond
    regime. On the physics foundation, dedicated underground radiation searches
    at Gran Sasso (Donadi et al. 2021) rule out the parameter-free Diósi–Penrose
    collapse model, and Derakhshani et al. (2022) show that this directly
    refutes Orch OR's 2014 nuclear-displacement scenario under standard collapse
    models. In anesthetic pharmacology, Jurd et al. (2003) demonstrated direct
    target-level causality for conventional mechanisms: a single point mutation
    in the GABA_A β3 subunit abolishes etomidate and propofol immobility and
    profoundly impairs hypnosis in vivo. Crucially, the Kalra et al. optical
    assay lacks anesthetic specificity, as the convulsant picrotoxin produces an
    identical reduction in exciton diffusion, and independent in vivo
    investigations find that chronic stabilizer treatment increases rather than
    decreases anesthetic sensitivity (Li et al. 2025).


    In terms of sensitivity, the single evidence record whose removal would most
    alter this assessment is ORCH-E036 (tabulating the published decoherence
    estimates in Study ORCH-S001). If removed, the decoherence gap would revert
    to an informal dispute between Tegmark (2000) and Hagan et al. (2002);
    nevertheless, the case verdict of weakly_supported solidly survives without
    it because Donadi et al. (2021) still constrains the collapse physics and
    Jurd et al. (2003) establishes conventional receptor sufficiency for
    intravenous agents.
