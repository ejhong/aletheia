  synthesis: >-
    The featured hypothesis is a tight conjunction: Penrose objective reduction
    at τ ≈ ℏ/E_G, of a quantum state orchestrated across neuronal microtubule
    tubulins, with general anesthetics abolishing consciousness substantially by
    disrupting that state rather than only by classical receptor and circuit
    action. The supplied record supports several peripheral and intermediate
    claims while leaving the load-bearing conjuncts unproven or constrained, so
    the case as a whole is only weakly supported.

    On the biological substrate, microtubules are electronically nontrivial.
    Kalra et al. 2023 report exciton diffusion of about 6.6 nm in polymerized
    microtubules, beyond a simple Förster account, and Babcock et al. 2024
    report quantum-yield enhancement consistent with collective tryptophan
    superradiance. Those results underwrite ORCH-C013 and the optical half of
    ORCH-C011. They do not measure coherence time, entanglement, or any density-
    matrix witness at physiological temperature. Tegmark’s decoherence estimates
    and the Hagan–Hameroff–Tuszyński recalculation disagree by orders of
    magnitude, yet even the proponents’ unconditional figure (10⁻⁵–10⁻⁴ s) falls
    short of the ~25 ms gamma-band exemplar the theory needs; only conditional
    gel-screening or unreplicated resonance inferences close the gap on paper.
    Study ORCH-S001 confirms that no unconditional proponent estimate meets the
    requirement and that the corpus lacks a pre-committed pass/fail coherence
    threshold. ORCH-C010 therefore remains unresolved, and with it the
    orchestration half of ORCH-C001.

    On collapse physics, Donadi et al. 2021 exclude the natural parameter-free
    Diósi–Penrose stochastic model via a null spontaneous-radiation search;
    Derakhshani et al. 2022 apply that bound to Orch OR scenarios and call the
    simplest gravity-related implementations highly implausible. McQueen’s reply
    correctly notes that Penrose’s τ ≈ ℏ/E_G criterion is not itself a
    radiation- predicting master equation, so ORCH-C030 is not refuted
    outright—but the escape converts a testable model into an underspecified
    heuristic. The physics conjunct is unresolved and experimentally pressured.

    On anesthesia, the asymmetry is decisive. Jurd et al. 2003 show that a
    single GABA_A β3(N265M) point mutation abolishes immobilizing action of
    etomidate and propofol and profoundly reduces hypnosis—target-level causal
    evidence no microtubule result in the record matches. Emerson et al. 2013
    place β-tubulin on an anesthetic pathway for a research anthracene, and
    Kalra link clinical agents to reduced exciton diffusion, but the same assay
    is perturbed by the convulsant picrotoxin, so specificity is unshown. Acute
    epothilone B delays isoflurane LORR in one program (Khan, Huang); chronic
    epothilone D and the destabilizer vinblastine both increase sensitivity in
    an independent lab (Li 2025). The stabilizer literature does not cohere into
    a rule that protecting microtubules protects consciousness. Xenon
    nuclear-spin isotopes appear less potent at matched polarizability (Li
    2018), a genuinely hard classical- polarizability result, yet the effect
    does not localize to microtubules, has never been replicated, and fails a
    pre-registered two-covariate identification test on its own four means
    (ORCH-S002). Classical multi-target pharmacology (ORCH-C003) is well
    supported for intravenous agents and remains the default for volatiles’
    broader spectrum; the exhaustive “no quantum contribution” claim (ORCH-C004)
    overreaches and stays unresolved.

    Non-computability motivation (ORCH-C040) is undercut as a practical
    scoreboard by verified AI research-level mathematics (ORCH-C041) while
    remaining philosophically open under “escalator” reframings; it does not
    evidence microtubule collapse. The disputed ZQC-MRI report (ORCH-C026) would
    be landmark if validated, but it neither implicates microtubules nor
    survives Warren’s methodological objection without independent replication.

    Steelman against the hypothesis: warm wet decoherence, missing coherence
    measurement, classical causal genetics for IV anesthetics, mixed and non-
    specific MT–anesthesia behavioral data, and exclusion of the simplest
    gravity-collapse completions. Steelman for it: electronic nontriviality of
    MTs is real; volatile anesthesia is not exhausted by any single channel;
    nuclear spin modulates xenon potency without a settled classical account;
    and Penrose OR as pure τ ≈ ℏ/E_G has not been directly timed. Those gaps
    keep the hypothesis alive as a research program. They do not add up to
    positive support for the full conjunction. The verdict is therefore
    weakly_supported: peripheral mechanism fragments exist; the
    conscious-moment-as-Orch-OR claim and the strong quantum-anesthesia claim do
    not clear the evidential bar set by the record.
  steelman: Xenon isotopes with nonzero nuclear spin are markedly less potent
