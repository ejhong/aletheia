  synthesis: >-
    The featured hypothesis is a tight conjunction: (i) gravitationally induced
    objective reduction on timescale τ ≈ ℏ/E_G, (ii) of a quantum state
    orchestrated across tubulin in neuronal microtubules at physiologically
    relevant duration and extent, and (iii) that general anesthetics abolish
    consciousness substantially by disrupting that state rather than only via
    receptors and circuits. The supplied record supports several peripheral and
    observational pieces while leaving the load-bearing conjuncts either
    unmeasured, undercut, or better explained classically.

    Microtubules are electronically nontrivial. Kalra et al. 2023 report
    excitation diffusion over ~6.6 nm beyond simple Förster expectation, reduced
    by etomidate and isoflurane; Babcock et al. 2024 report quantum-yield
    enhancement consistent with collective tryptophan states. Emerson et al.
    2013 photolabel β-tubulin with a research anesthetic and show stabilizer
    pretreatment alters immobilization in tadpoles. These establish ORCH-C013
    and parts of ORCH-C011/C020 as real biophysics and pharmacology, not
    scaffolding-only. They do not establish millisecond coherence, entanglement
    across many tubulins, or gravitational OR. The measured scales are
    nanometers and (in models) femtoseconds to at most the proponents' own
    unconditional 10⁻⁵–10⁻⁴ s — short of the ~25 ms exemplar. Study ORCH-S001
    tabulates that no unconditional proponent decoherence estimate meets the
    theory's stated requirement; conditional actin-gel and unreplicated
    resonance inferences are the only routes to physiological times. Tegmark's
    calculation is about a disputed state, but the gap remains unclosed by
    measurement (ORCH-R001 unrun). ORCH-C010 is therefore unresolved-to-negative
    on the record, and the biological half of ORCH-C001 inherits that failure.

    On collapse physics, Donadi et al. 2021 exclude the natural parameter-free
    Diósi–Penrose stochastic model; Derakhshani et al. 2022 apply that bound to
    Orch OR scenarios and call the simplest gravity-related implementations
    highly implausible. McQueen 2023 correctly notes that Penrose's heuristic τ
    ≈ ℏ/E_G need not entail the radiation searched for, so ORCH-C030 is not
    strictly refuted — it is relocated to an untested, less specified form. That
    is not positive support. ORCH-C031 is established as a measurement; its
    implication for the headline hypothesis is damaging to the best-specified
    physics carrier and only weakly escaped.

    Anesthesia is the practical test. Jurd et al. 2003 supply target-level
    causal evidence the microtubule arm lacks: a single GABA_A β3 point mutation
    abolishes immobilizing action of etomidate and propofol and profoundly
    reduces hypnosis. That anchors ORCH-C003 as well supported for intravenous
    agents. Volatiles retain a broader-target opening the authors themselves
    note, which is why ORCH-C004's universal "fully, without any quantum
    contribution" overreaches and stays unresolved. The Orch OR anesthesia claim
    (ORCH-C002) needs more than tubulin binding and optical perturbation.
    Kalra's picrotoxin comparison (convulsant, opposite pharmacology) undercuts
    specificity. Acute epothilone B delays isoflurane LORR in the Wellesley
    program (large effect in rats, smaller in mice); independent chronic
    epothilone D and vinblastine at MGH both increase sensitivity, including a
    destabilizer moving the same way as a stabilizer — inconsistent with a
    simple "stabilization protects the conscious state" rule and compatible with
    nonspecific cellular disruption. No experiment measures a quantum MT
    variable co-varying with unconsciousness. Xenon nuclear-spin isotope
    differences (Li et al. 2018) are a genuine puzzle for purely classical
    polarizability accounts, but the dataset is a single unreplicated four-arm
    study, S002 shows the design cannot cleanly separate spin from a narrow mass
    range under pre-set identification rules, and nothing in the experiment
    implicates microtubules. Kerskens ZQC-MRI is disputed by Warren,
    unreplicated, and silent on tubulin.

    Non-computability (ORCH-C040) is interpretive motivation, not mechanism. AI
    systems have produced verified novel research-level mathematics and
    medal-level IMO performance (ORCH-C041 well supported); Penrose-side replies
    reframe the claim as open-ended framework generation ("escalator") and
    abduction gaps (Zahavy). That dispute does not evidence MT OR.

    Steelmanning the affirmative: collective MT optics, anesthetic–tubulin
    contact, residual volatile-mechanism incompleteness (Eger-type paradoxes on
    immobility), and a spin-sensitive xenon effect jointly keep a non-classical
    contribution conceivable. Steelmanning the negative: the conjunction
    requires sustained orchestrated coherence at neural timescales and
    gravitational OR as the conscious event, plus anesthetic action
    substantially through that state; the record has neither a coherence witness
    nor a causal genetic or potency- series test that co-segregates MT quantum
    observables with behavior at unchanged receptors, while classical
    multi-target pharmacology has residue- level causal proof for major IV
    agents. Shared authorship (Kalra includes Hameroff/Penrose; Wellesley
    reviews cite their own epothilone line), unreplicated resonance claims, and
    editorial overstatement of "independent confirmation" further discount the
    affirmative synthesis. The hypothesis as stated is therefore only weakly
    supported: component observations exist; the
    orchestrated-collapse-and-anesthetic-disruption package does not clear its
    own evidential bar. Verdict hangs most on the absence of ORCH-C010 support
    together with the strength of ORCH-C003; if a physiological coherence
    witness at required scale appeared, the case would reopen regardless of
    present anesthesia asymmetries.
  steelman: The xenon isotope potency step (spin-bearing isotopes markedly less
    potent at matched calculated polarizability), still unexplained by standard
