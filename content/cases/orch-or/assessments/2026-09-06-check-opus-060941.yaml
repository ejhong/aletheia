  synthesis: "The featured hypothesis is a conjunction: a physics conjunct
    (gravitationally induced collapse on a τ ≈ ℏ/E_G schedule), a biology
    conjunct (a coherent state across many tubulins persisting for tens of
    milliseconds at 37 °C), and an anesthesia corollary. A conjunction is no
    stronger than its weakest term, and on this record both structural terms are
    unsupported by measurement. Nothing in the evidence set is a coherence
    measurement in a physiological microtubule. The rung is occupied entirely by
    duelling calculations: Tegmark's 10⁻¹³–10⁻²⁰ s (ORCH-E007), which Hagan et
    al. correctly show was computed for a soliton the theory does not propose
    (ORCH-E008), and the proponents' own corrected figure of 10⁻⁵–10⁻⁴ s — still
    short of the 25 ms exemplar by two to three orders (ORCH-E036). The only
    proponent-side numbers reaching physiological timescales are explicitly
    conditional (actin-gel screening) or inferred from single-laboratory
    resonance work that has stood unreplicated for over a decade (ORCH-E005,
    ORCH-R005). On the physics side the natural parameter-free Diósi–Penrose
    model is experimentally excluded (ORCH-E017) and the experimenters
    themselves call the committed tubulin scenarios \"highly implausible\"
    (ORCH-E018); McQueen's escape (ORCH-E019) is valid but converts a refuted
    model into an untested one, which is not evidence for the theory. What
    genuinely survives is a lower-level, more modest finding: microtubules are
    electronically nontrivial (ORCH-C013), anesthetics do bind tubulin and
    perturb its photophysics (ORCH-C011), and manipulating microtubules does
    move anesthetic susceptibility (ORCH-C012). None of that is quantum. The
    anesthesia arm is further damaged from inside its own flagship experiment —
    picrotoxin, a convulsant, perturbs the assay comparably (ORCH-E003) — and
    the animal literature does not cohere: acute epothilone B delays loss of
    righting reflex (ORCH-E011/E012, one program), while an independent,
    better-powered study finds chronic epothilone D and the destabilizer
    vinblastine both increasing sensitivity (ORCH-E013). Meanwhile the classical
    rival has what Orch OR lacks: single-residue causal evidence (ORCH-E015).
    The non-computability rung is decorative rather than load-bearing and has
    aged badly (ORCH-E022/E023), though Zahavy's abduction argument (ORCH-E025)
    keeps it from being closed. Net: a handful of real, interesting anomalies,
    no established mechanism, and the theory's own quantitative commitments
    unmet on its own literature."
  steelman: "The xenon isotope result remains unexplained by anything in the
    classical account recorded here: four chemically identical isotopes with
    identical calculated polarizability (3.60 Å) show a 40–50% potency gap that
    tracks nuclear spin, and the frozen re-analysis (ORCH-E038) shows the four
    means form a step across the spin boundary — 29 percentage points for one
    mass unit at 131→132, against 6 and 2 within the spin-matched pairs — a
    shape no smooth mass-dependent confound (diffusion, solubility) produces.
    Lipid solubility and polarizability, the workhorses of conventional
    anesthetic pharmacology, predict no difference at all. My assessment records
    this as unreplicated and poorly auditable, but it does not explain it, and a
    proponent is entitled to say that a spin-sensitive, therefore quantum,
    degree of freedom is doing real pharmacological work in an intact mammal."
