  synthesis: "The featured hypothesis is a conjunction: a physics conjunct
    (gravitationally induced collapse at tau ~ hbar/E_G) and a biology conjunct
    (a coherent tubulin state of the right duration and extent), plus an
    anesthesia corollary. The record supports neither conjunct and supports
    several of their weaker cousins. On the biology side, the supporting
    evidence is real but narrow: microtubules are electronically nontrivial
    (ORCH-C013), with exciton diffusion beyond a naive Foerster expectation,
    collective tryptophan optics from a partly independent group, and
    anesthetics measurably perturbing those optics. None of this touches
    coherence time, which is the quantity the theory needs. ORCH-E036 is the
    pivotal record: on the corpus's own published numbers, the proponents'
    unconditional recalculation reaches 10^-5 to 10^-4 s against a 25 ms
    exemplar, and the only routes to physiological timescales are an explicitly
    conditional actin-gel assumption and a coherence-time inference from
    single-laboratory resonance measurements unreplicated for over a decade. On
    the physics side, Gran Sasso excludes the natural parameter-free
    Diosi-Penrose model, and the experimenters themselves conclude that the
    atomic-nuclei separation geometry the 2014 revision committed to is ruled
    out under that formulation. McQueen's escape is legitimate but purchases
    survival by relocating the theory outside the reach of the only experiment
    that addressed it. ORCH-E035's finding that the corpus publishes parameter
    values but no acceptance criteria makes that pattern structural rather than
    incidental. The anesthesia arm fares worst where it matters most. Its
    flagship in vitro result fails specificity inside its own paper (picrotoxin,
    a convulsant, produced a comparable effect), the acute epothilone-B
    behavioral result is confined to one research program, and the one
    independent, blinded, full concentration-response study found stabilizer and
    destabilizer both shifting sensitivity the same way — a pattern no
    stability-based account predicts. Meanwhile the rival account holds
    target-level causal evidence of a quality nothing on the microtubule side
    approaches. The steelman for the conventional side is not that it is
    complete: Eger 2008 reports no channel or combination sufficient for
    inhaled-agent immobility, and Jurd/Zeller show hypnosis only partly
    abolished, so ORCH-C004 fails as stated. The residual gap is real; the
    record simply does not show that microtubule quantum coherence fills it."
  steelman: The xenon isotope result remains unexplained by anything in this
    record. Four chemically identical isotopes with identical calculated
    polarizability produced a 40-50 percent potency gap, and the re-analysis
    shows the gap is a step across the spin boundary (29 percent atmosphere for
    one mass unit, versus -6 and +2 within spin classes) that no smooth
    mass-dependent confound in diffusion or solubility can generate. No
    classical pharmacology on this ledger predicts or accommodates a
    nuclear-spin dependence of anesthetic potency. A proponent is entitled to
    say that a quantum degree of freedom is doing observable work in anesthesia,
    and that no one has produced the mass-matched null that would dispose of it.
