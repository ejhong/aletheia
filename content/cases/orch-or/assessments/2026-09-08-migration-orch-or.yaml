  - claimId: ORCH-C012
    verdict: mixed
    reasoning: 'Evidence-only, and "mixed" is precise here rather than a hedge — the broad proposition is well supported while the directional version is contradicted. Four microtubule-modulating drugs have now been shown to move isoflurane susceptibility in animals, which supports the claim as worded. But the directions do not cohere into a stability rule: acute epothilone B produced resistance in rats (+69 s, d = 1.9) and mice (+29 s, d = 0.8); chronic epothilone D produced markedly greater sensitivity (LORR EC50 0.75% vs 0.97% saline); the destabilizer vinblastine also increased sensitivity (0.74% vs 0.98%) — the same direction as the stabilizer, which no simple stability account predicts; and paclitaxel produced a small shift toward resistance (1.05% vs 0.98%). The two resistance results share a senior author and program; the contradictory results are independent. The simple proposition "stabilizing microtubules protects consciousness from anesthetics" is falsified in that form.'
