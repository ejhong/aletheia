  synthesis: "Orch OR is a conjunction and has to be graded as one: gravitational objective reduction must be real (ORCH-C030), neuronal microtubules must hold a suitable quantum state for roughly the duration of a conscious moment (ORCH-C010), and that reduction must be the conscious moment (ORCH-C001). The observation rung is respectable — ORCH-E001 and ORCH-E004 are quantitative and partly independent — but what they license is only that microtubules are electronically and radiatively nontrivial (ORCH-C013), which is ordinary condensed-matter behaviour in an ordered aromatic lattice and is the rung most often mistaken for vindication of the whole theory. The mechanism rung remains where the argument most likely fails: ORCH-E036 shows no unconditional proponent-side estimate reaches the theory's own 25 ms exemplar, and ORCH-E035 shows the corpus fixes parameter values but no pass/fail threshold for any direct coherence test, so a future measurement could be absorbed either way. The physics conjunct stays damaged by ORCH-E017 and ORCH-E018 and survives only via ORCH-E019, trading a refuted specific model for an untested vague one. On anesthesia, the flagship experiment's own convulsant comparison (ORCH-E003) shows the assay is not anesthesia-specific, and the best-designed independent animal study (ORCH-E013) has a stabilizer and a destabilizer shifting sensitivity in the same direction. The xenon line remains non-localizing and, after ORCH-E037 through ORCH-E040, thin: calculated headline values, dispersions of unstated type, a design that cannot support a two-covariate test, and eight years without replication — with ORCH-E038 defending only the shape of the pattern. Sensitivity: the record whose removal would most change the case is ORCH-E013, the only independent, blinded, full concentration–response animal study and the main reason ORCH-C012 is mixed rather than provisionally supported. Without it the anesthesia arm would look cleaner, but the case verdict survives unchanged, because the verdict rests on an absence — no coherence time, dephasing time, or entanglement witness has ever been measured in a microtubule — and no single record can remove an absence."
