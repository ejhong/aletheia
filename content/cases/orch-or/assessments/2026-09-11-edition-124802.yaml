caseAssessment:
  verdict: unresolved
  whatIsClaimed: That each conscious moment is a Penrose objective reduction — a gravitationally induced collapse at time τ ≈ ℏ/E_G — of a quantum state orchestrated across tubulin proteins in neuronal microtubules, and that general anesthetics abolish consciousness substantially by disrupting that state rather than only by acting on receptors and circuits.
  whereDisagreementLives: "Not in whether quantum mechanics operates inside proteins (it does, trivially, in all chemistry), and no longer in whether microtubules are electrically and optically interesting (measurements now say they are). The disagreement lives in a specific unmeasured gap: between demonstrated collective electronic transport over roughly one tubulin dimer — about 6.6 nm, on femtosecond-to-picosecond physics — and the long-lived, spatially extended coherent or entangled state Orch OR requires, of order tens of milliseconds across many tubulins and neurons. No experiment has specified a density-matrix observable in physiological microtubules, measured its dephasing at 37 °C, and shown anesthetics suppressing it in proportion to clinical potency; and the theory's own corpus has never published the threshold that would let such a measurement count as pass or fail. A second, smaller disagreement lives one level down, in metrology: the leading optical observable is not yet stable enough to correlate against anything, since its effect size spans nearly an order of magnitude and its sign flips at the tryptophan-selective wavelength depending on how scattering is subtracted. On the physics side the disagreement has relocated from \"has the model been excluded?\" (the parameter-free stochastic version has, twice) to \"does any dynamics that reproduces Penrose's rate survive the radiation and acceleration-noise bounds?\" — a question that is now answerable at a desk."
  whatWouldSettleIt: Five things, none of which requires believing the theory first. (1) A prespecified coherence or entanglement witness measured in physiological microtubules at 37 °C, with the required dephasing time, coherence length and participating degrees of freedom published by proponents in advance — without which any number can be absorbed either way. (2) Before that, closure of the scattering ambiguity in the microtubule quantum-yield observable, so that a single value and sign exist at 280 and 295 nm. (3) An anesthetic potency series against that observable spanning at least eight agents, including nonimmobilizers, picrotoxin and hydrophobic non-anesthetic controls, with free aqueous concentration measured and the predicted correlation registered in advance. (4) A tubulin anesthetic-pocket knock-in animal that abolishes anesthetic binding while preserving polymerization and transport, with baseline receptor function verified unchanged — the only design that could give the microtubule account causal evidence of the quality the β3 receptor result already has. (5) On a wholly separate track, a mesoscopic superposition test of whether collapse lifetime scales as ℏ/E_G, plus the desk calculation of whether the one construction known to reproduce that rate exactly is already excluded by the Gran Sasso, Majorana and LISA Pathfinder bounds. Positive results on the biology without the physics, or the physics without the biology, would each leave the conjunction unproven.
  bestConventionalExplanation: "Classical neural computation in a warm, wet, decohering brain: cognition implemented in membrane potentials, ion channels, synaptic weights and network dynamics, with consciousness an organizational property of that activity rather than a quantum-physical event. On the anesthesia side the conventional account is multi-target molecular pharmacology, and it has causal evidence Orch OR does not: a single point mutation in the GABA_A receptor β3 subunit (N265M) abolishes the immobilizing action of etomidate and propofol and profoundly reduces their hypnotic effect, while volatile agents act through a broader distributed set of channel and circuit targets. On this account the microtubule findings are ordinary cell biology and ordinary condensed-matter physics: an ordered aromatic lattice has collective photophysics whether or not anything computes with it, small hydrophobic molecules perturb that photophysics whether or not they are anesthetics (which is why a convulsant does it too), and microtubule-modulating drugs change anesthetic sensitivity through transport, metabolism and cellular integrity — which is the most natural reading of a stabilizer and a destabilizer shifting sensitivity in the same direction. The account requires no new physics and explains why anesthetic endpoints fractionate into hypnosis, amnesia, immobility and analgesia. Its two acknowledged gaps are that it offers no principled account of why any of this activity is experienced, and that for the inhaled agents it has not yet named a sufficient molecular target or reproduced the Meyer–Overton correlation from one."
