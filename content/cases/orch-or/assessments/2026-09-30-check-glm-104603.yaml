  synthesis: "This case is a study in rung separation, and the assessment confirms
    the separation is real rather than rhetorical. The observation rung is
    genuinely healthy: microtubules measurably move electronic excitation beyond
    what Förster models predict (Kalra 2023), show collective optical behavior
    partly corroborated outside the proponent lineage (Babcock 2024, Gassab
    2026A), and anesthetics demonstrably bind tubulin and perturb microtubule
    physics, with one large blinded behavioral effect (epothilone B delaying
    LORR). Two of the case's strongest records are outright negative for the
    featured hypothesis's natural completions: the Gran Sasso null and its
    independent Majorana replication exclude the parameter-free Diósi–Penrose
    model, while the classical account holds target-specific causal knockout
    evidence (β3 N265M) that no microtubule experiment approaches. The decisive
    gap sits at the mechanism rung: not one record measures a coherence time, an
    entangled state, or a collapse event in the structure the theory names. The
    theory's own literature contains no unconditional decoherence estimate
    meeting its 25 ms requirement — the proponents' best number is one to two
    orders short — and no published pass/fail threshold exists for any
    prospective test, which is why each new photophysics result gets absorbed
    rather than scored. The anesthesia arm is actively self-contradicting:
    stabilizer and destabilizer drugs shift anesthetic sensitivity the same way
    in the most methodologically complete study, the flagship photophysics assay
    cannot distinguish anesthetics from a convulsant, and the one genuinely
    independent stabilizer study ran the opposite direction. Steelmanning the
    proponent side: the xenon isotope anomaly and the consciousness-dependent
    zero-quantum-coherence signals are real, published observations the
    classical record does not explain, and the authors' quantitative reply to
    Warren remains unrebutted. Steelmanning the skeptic side: twenty-five years
    of arguing over coherence without a single measurement, an excluded natural
    collapse model, and a motivational argument (non-computability) whose
    testable instances have mostly settled against it. Unresolved is therefore a
    substantive finding, not a hedge: the evidence supports a lively research
    program and does not support the thesis it was gathered for."
  steelman: "The Kerskens zero-quantum-coherence result plus the authors'
    quantitative reply: Warren's classical intermultiple-quantum-coherence
    mechanism, when recomputed at the authors' sequence parameters, can produce
    at most ~0.13% of initial magnetization even under best-case assumptions,
    the observed signals exceed that bound, and the ZQC correlation-distance
    signature played no role as gradient moments were varied — yet no
    independent group has run the phantom-validation experiment that would
    adjudicate the exchange. If the authors' recalculation stands unrefuted, the
    record contains a heartbeat-timed, consciousness-dependent human brain
    signal that no classical mechanism in the ledger can generate, and nothing
    in this assessment explains it."
