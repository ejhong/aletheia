caseAssessment:
  verdict: unresolved
  whatIsClaimed: That each conscious moment is a gravity-induced collapse of a quantum state spread across tubulin proteins in neuronal microtubules, and that anesthetics abolish consciousness by breaking that state. The collapse is Penrose's objective reduction, timed by τ ≈ ℏ/E_G; the rival view holds that receptors, channels and circuits suffice.
  whereDisagreementLives: "In one unmeasured gap: microtubules demonstrably move electronic energy about one tubulin dimer within picoseconds, but nobody has measured the millisecond-long, many-tubulin coherent state the theory needs. The theory has never published the threshold that would make such a measurement pass or fail. On the physics side, the live question is whether any dynamics reproducing Penrose's rate survives the underground radiation and spacecraft acceleration-noise limits."
  whatWouldSettleIt: Measuring how long quantum coherence actually lasts in microtubules at body temperature, against a pass/fail threshold proponents publish in advance, would settle the biological half. An anesthetic potency series against the optical signal counts only once its scattering ambiguity is closed. A tubulin knock-in mouse that cannot bind anesthetic would give causal evidence. The physics needs its own test of whether collapse lifetimes scale as ℏ/E_G.
  bestConventionalExplanation: "Classical neural computation: cognition lives in membrane potentials, synapses and network dynamics, and consciousness is an organizational property of that activity, not a quantum event. For anesthesia, the account is multi-target pharmacology, with causal evidence Orch OR lacks. One point mutation in the GABA_A receptor β3 subunit abolishes the immobilizing action of etomidate and propofol and sharply reduces their hypnotic effect, while volatile agents act on a broader set of targets. On this account the microtubule findings are ordinary physics and cell biology. An ordered aromatic lattice has collective photophysics whether or not anything computes with it. Small hydrophobic molecules, convulsants included, perturb it. Microtubule drugs shift anesthetic sensitivity through transport, metabolism and cell health, which is the natural reading of a stabilizer and a destabilizer acting alike. Its acknowledged gaps are that it offers no account of why any of this is experienced, and no sufficient molecular target for inhaled agents."
  components:
    - label: Collective electronic and optical behaviour of microtubules
      state: well_supported
      note: Measured in more than one laboratory, though the size of the main optical effect depends on how light scattering is corrected. This is physics of an ordered lattice, not computation.
    - label: Quantum coherence lasting a conscious moment
      state: unresolved
      note: Never measured. Two calculations differ by eight orders of magnitude or more, and the proponents' own best unconditional estimate falls short of their 25 ms requirement.
    - label: Anesthesia by breaking a microtubule quantum state
      state: weakly_supported
      note: Anesthetics do affect tubulin and animal latency. But a convulsant moves the same assay, the best independent study runs the other way, and no quantum variable was measured.
    - label: Gravitational collapse as physics
      state: unresolved
      note: Two underground experiments exclude the simplest version, and a spacecraft noise limit tightens the squeeze. Penrose's lifetime rule itself is untested, and how collapse happens is still disputed.
    - label: Non-classical signals in the living brain
      state: mixed
      note: A consciousness-linked MRI signal whose authors answered the proposed classical explanation. Nobody else has reproduced it, and it implicates no microtubule.
    - label: The non-computability motivation
      state: unresolved
      note: Machines now produce verified new mathematics, while the reply about inventing frameworks stands. Either way this bears on why the theory was proposed, not on microtubules.
