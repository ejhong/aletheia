  synthesis: >-
    The featured hypothesis is a conjunction: physiologically relevant quantum
    states must exist in neuronal microtubules, anesthetic effects must
    substantially operate by disrupting those states, and Penrose-style
    gravitational reduction must turn them into conscious moments. The evidence
    supports several lower-rung observations without supporting those required
    transitions. Purified microtubules transport electronic excitation farther
    than the cited Förster model predicts, polymerization changes optical yield,
    anesthetics perturb microtubule photophysics, and tubulin can be an
    on-pathway anesthetic target. Acute epothilone B also delays isoflurane loss
    of righting reflex in two species. These findings defeat the description of
    microtubules as merely inert scaffolding and justify targeted experiments on
    their biophysics and pharmacology.

    The strongest affirmative interpretation is that these observations form a
    converging pattern: collective optical behavior, anesthetic sensitivity,
    direct tubulin binding, animal behavioral effects, and the xenon isotope
    anomaly all point toward physics omitted from a receptor-only narrative. The
    contested brain MRI signal and a prospective Meyer–Overton prediction add
    potentially discriminating routes. Nevertheless, none of these records
    measures physiological millisecond coherence, entanglement across tubulins,
    a quantum computation in a neuron, gravitational collapse, or a
    correspondence between collapse events and conscious moments. Crossing from
    electronic activity to coherence, and from coherence to objective reduction
    and consciousness, is therefore unsupported.

    The negative case is more diagnostic at the load-bearing rungs. The
    available unconditional proponent decoherence estimate remains roughly two
    to three orders of magnitude below the tens-of-milliseconds requirement,
    while competing calculations are shorter still. Radiative and subradiant
    lifetimes in later models are expressly not thermal dephasing times. For
    anesthesia, a GABA_A point mutation provides target-specific causal evidence
    for major intravenous agents, whereas the microtubule experiments have not
    isolated a quantum variable. Picrotoxin perturbs the flagship optical assay,
    and the strongest independent animal study found a brain-penetrant
    stabilizer and a destabilizer both increasing isoflurane sensitivity. That
    contradicts the proposed directional stability rule, although it does not
    exclude some ordinary tubulin contribution. On the physics side, several
    detector technologies exclude the natural Markovian Diósi–Penrose
    implementations through radiation or mechanical-noise bounds. Penrose's bare
    lifetime relation survives because it lacks the dynamics those experiments
    test, but survival by underspecification is not affirmative evidence.

    Accordingly, the specific Orch OR stack is contradicted by the supplied
    evidence even though several peripheral microtubule and quantum-biological
    observations are supported. This verdict does not deny quantum chemistry in
    biology or claim that classical neuroscience is exhaustive. It says that the
    records run against indispensable versions of the stated mechanism and
    provide no direct evidence for its defining collapse event. The single
    record whose removal would most change the case verdict is ORCH-E036,
    because it most clearly shows that no unconditional proponent estimate meets
    the theory's own coherence requirement. The verdict survives its removal:
    ORCH-E007 and ORCH-E008 still leave an enormous or material timing
    shortfall, while the anesthesia contradictions and independent
    collapse-model bounds remain.
  steelman: "The strongest unanswered proponent argument is the prospective
    Meyer–Overton prediction: suppression of a defined microtubule optical or
    coherence observable should scale with clinical potency across chemically
    diverse anesthetics, while matched nonimmobilizers should not suppress it.
    The supplied experiments test no adequate potency series, so they do not
    answer this prediction; a successful preregistered result would connect
    microtubule photophysics to what makes a compound anesthetic rather than
    merely hydrophobic."
