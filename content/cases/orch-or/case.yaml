id: ORCH-001
slug: orch-or
title: "Collapse, Not Computation?"
subtitle: "Do conscious moments occur when quantum states orchestrated in neuronal microtubules reach a gravitational collapse threshold — and does anesthesia work by breaking them?"
domain: "Neuroscience · Quantum biology · Anesthesiology · Foundations of physics"
status: active
summary: >-
  Orch OR is not one claim but a stack of them: Penrose's proposal that
  quantum superpositions collapse objectively when their gravitational
  self-energy makes spacetime geometry ill-defined, joined to Hameroff's
  proposal that neuronal microtubules are where biology does this. Between
  2023 and 2026 the biological half stopped being purely speculative —
  microtubules turned out to move electronic excitation further than Förster
  theory predicts, anesthetics measurably shorten that transport, and a
  microtubule-stabilizing drug delays anesthetic unconsciousness in rats.
  None of those results measured a quantum coherence time, an entangled
  state, or a collapse event. Meanwhile an underground experiment killed the
  most natural version of the collapse physics, an independent laboratory
  found the anesthesia effect running the opposite direction, and AI systems
  began solving research-level mathematics of the kind that motivated the
  whole theory. The interesting thing about this case is how cleanly its
  rungs come apart.
whatIsClaimed: >-
  That each conscious moment is a Penrose objective reduction — a
  gravitationally-induced collapse at time τ ≈ ℏ/E_G — of a quantum state
  orchestrated across tubulin proteins in neuronal microtubules, and that
  general anesthetics abolish consciousness substantially by disrupting that
  state rather than only by acting on receptors and circuits.
whereDisagreementLives: >-
  Not in whether quantum mechanics operates inside proteins (it does,
  trivially, in all chemistry), and no longer in whether microtubules are
  electrically and optically interesting (measurements now say they are). The
  disagreement lives in a specific unmeasured gap: between demonstrated
  collective electronic transport over roughly one tubulin dimer (~6.6 nm,
  femtosecond-to-picosecond physics) and the long-lived, spatially extended
  coherent or entangled state that Orch OR requires (milliseconds, across
  many tubulins and neurons). No experiment has specified a density-matrix
  observable in physiological microtubules, measured its dephasing at 37 °C,
  and shown anesthetics suppress it in proportion to clinical potency. Until
  that number exists, both "warm and wet kills it" and "warm quantum biology
  saves it" are calculations arguing with each other rather than measurements.
whatWouldSettleIt: >-
  Four experiments, none of which requires believing the theory first: a
  prespecified coherence or entanglement witness measured in physiological
  microtubules at 37 °C; an anesthetic potency series against that observable
  including nonimmobilizers, picrotoxin, and hydrophobic non-anesthetic
  controls with free drug concentration measured; a tubulin anesthetic-pocket
  knock-in mouse that removes anesthetic binding while preserving
  polymerization and transport, testing whether behavior and the optical
  signal move together; and — on a wholly separate track — a mesoscopic
  superposition experiment testing whether collapse lifetime scales as
  ℏ/E_G. Positive results on the biology without the physics, or the physics
  without the biology, would each leave the conjunction unproven.
bestConventionalExplanation: >-
  Classical neural computation in a warm, wet, decohering brain: cognition
  implemented in membrane potentials, ion channels, synaptic weights, and
  network dynamics, with consciousness an organizational property of that
  activity rather than a quantum-physical event. On the anesthesia side, the
  conventional account is multi-target molecular pharmacology, and it has
  causal evidence Orch OR does not: a single point mutation in the GABA_A
  receptor β3 subunit (N265M) abolishes the immobilizing action of etomidate
  and propofol and profoundly reduces their hypnotic effect, while volatile
  agents act through a broader distributed set of channel and circuit
  targets. This account requires no new physics, explains anesthetic
  fractionation into hypnosis, amnesia, immobility, and analgesia, and treats
  microtubule effects — where real — as ordinary cell biology
  (cytoskeletal integrity, axonal transport, metabolism) rather than as
  quantum computation. Its acknowledged gap is that it offers no principled
  account of why any of this activity is experienced.
