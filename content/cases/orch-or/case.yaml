id: ORCH-001
slug: orch-or
title: "Collapse, Not Computation"
subtitle: "Do conscious moments occur when quantum states orchestrated in neuronal microtubules reach a gravitational collapse threshold — and does anesthesia work by breaking them?"
domain: "Neuroscience · Quantum biology · Anesthesiology · Foundations of physics"
status: active
summary: >-
  Orch OR is not one claim but a stack of them: Penrose's proposal that quantum superpositions collapse objectively when their gravitational self-energy makes spacetime geometry ill-defined, joined to Hameroff's proposal that neuronal microtubules are where biology does this. Between 2023 and 2026 the biological half stopped being purely speculative — microtubules turned out to move electronic excitation further than Förster theory predicts, anesthetics measurably shorten that transport, and a microtubule-stabilizing drug delays anesthetic unconsciousness in rats. None of those results measured a quantum coherence time, an entangled state, or a collapse event. Meanwhile an underground experiment killed the most natural version of the collapse physics, an independent laboratory found the anesthesia effect running the opposite direction, and AI systems began solving research-level mathematics of the kind that motivated the whole theory. The interesting thing about this case is how cleanly its rungs come apart.
