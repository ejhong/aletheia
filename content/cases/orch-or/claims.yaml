# Canon layer. Claims extracted 2026-08-22 from Eugene's two essays and the
# deep-research report, with every underlying citation independently checked
# before import. reviewState is honest provenance: nothing here has been
# hand-checked by a second human.
#
# ASSESSMENT DISCIPLINE FOR THIS CASE. Orch OR is a topic where the
# mainstream prior is loud, and a loud prior is easy to smuggle into an
# evidence assessment. So on every claim below, `credibility` and
# `credibilitySummary` answer one narrow question only — do the specific
# records attached to THIS claim support THIS statement as worded — and
# nothing else. Judgments that depend on background plausibility, base rates,
# or the state of the wider field are confined to `diagnosticitySummary` and
# `strongestObjection`, where they are labeled as such. The consequence is
# deliberate and will look odd in both directions: several observation-rung
# claims are `well_supported` while the thesis they are offered in support of
# is `unresolved`, and the skeptical claims get the same treatment.
#
# TERMINOLOGY DISCIPLINE. These are five different propositions and the case
# never lets them collapse into each other:
#   quantum effects in microtubules  ≠  quantum coherence in microtubules
#   ≠  entanglement in microtubules  ≠  quantum computation in neurons
#   ≠  Penrose gravitational collapse.
# Most of the public controversy consists of silently crossing those signs.

