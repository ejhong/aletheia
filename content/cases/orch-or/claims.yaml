    it is assessed as well supported on that basis irrespective of which side
    it favors.
  diagnosticity: high
  diagnosticitySummary: >-
    Highly diagnostic for one implementation and, importantly, not for all of
    them. It removes the most natural stochastic completion of gravity-
    related collapse, which is a serious blow to the physics conjunct and was
    read by the experimenters themselves as making Orch OR "highly
    implausible" when built on that completion. It does not touch Penrose's
    original heuristic criterion, which makes no radiation prediction — a
