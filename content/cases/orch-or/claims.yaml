- id: ORCH-C010
  statement: >-
    Neuronal microtubules under physiological conditions sustain coherent or
    entangled quantum states of sufficient duration (order tens of
    milliseconds) and spatial extent (across many tubulins) to support the
    computation Orch OR requires.
  plainLanguage: >-
    The load-bearing gap of the entire case. Everything above needs this;
    nothing below establishes it. It is worth being precise about the size of
    the gap: the best measured electronic transport in microtubules extends
    about 6.6 nanometres, roughly one tubulin dimer, on femtosecond-to-
    picosecond physics. Orch OR needs milliseconds across many tubulins and
    ideally many neurons. That is a shortfall of many orders of magnitude in
    both time and space, and no experiment has closed any of it.
  theme: microtubule-physics
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "Orch OR deep-research report — the 'Unproven' row of the executive-summary table and the direct-coherence-measurement roadmap section"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"
  credibility: unresolved
  credibilitySummary: >-
    Evidence-only, and the finding is an absence rather than a conflict. Not
    one record in this case measures a coherence time, a dephasing time, or
    an entanglement witness in a microtubule. The two positive photophysics
    results measure adjacent but distinct quantities: Kalra et al. measured
    an excitation diffusion length and explicitly modeled incoherent energy
    migration as a comparison, and Babcock et al. measured fluorescence
    quantum yield against a collective-eigenstate model — where the striking
    "tens of seconds" figure is a modeled radiative lifetime of a dark state,
    not a decoherence time, a distinction that is routinely lost in
    summaries. The two decoherence numbers in the literature are both
    calculations, not measurements, and they disagree by seven to eight
    orders of magnitude (Tegmark: 10⁻¹³–10⁻²⁰ s; Hagan et al.: 10⁻⁵–10⁻⁴ s)
    — and even the proponent figure falls one to two orders short of what
    this claim asserts. Unresolved is the accurate label, and it is the
    field's own assessment too.
  diagnosticity: high
  diagnosticitySummary: >-
    The single highest-value measurement target in the case. A clean null at
    physiological temperature and ionic strength would come close to
    settling the biological half negatively; a positive result at the
    required timescale would be a landmark in biophysics independent of
    consciousness. It is also the claim whose absence most distorts public
    discussion, since both "the brain is warm and wet" and "warm quantum
    biology solves it" are assertions about this unmeasured number.
  parentClaimIds: [ORCH-C001]
  dependsOnClaimIds: [ORCH-C013]
  strongestObjection: >-
    Prior-based objection, labeled: decoherence estimates for warm, wet,
    ionically screened environments generally come out very short, and
    thirty years of looking has produced no measurement in the required
    range. Independent of priors, the sharper objection is that the theory
    has not committed to the numbers that would make this claim testable —
    no published required coherence time, coherence length, or entanglement
    structure — so "sufficient duration and extent" currently has no agreed
    operational meaning, and each new photophysics result gets absorbed
    rather than scored.
  whatWouldChangeOurMind:
    - "2D electronic spectroscopy or photon-echo measurement of a defined density-matrix observable in polymerized microtubules at 37 °C, with isotope substitution, temperature series, denatured-protein and disorder controls to separate electronic from vibrational coherence."
    - "A comparison series — purified tubulin, polymerized microtubules, microtubules plus physiological MAPs, crowded cytosol-like solution, isolated axons, live neurons — showing whether polymerization protects coherence or whether it collapses on contact with physiological conditions."
    - "A published quantitative Orch OR requirement, so that a measured number could count as pass or fail."

