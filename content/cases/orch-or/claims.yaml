- id: ORCH-C041
  statement: >-
    AI systems have produced correct, novel, research-level mathematics,
    including the disproof of a 1946 Erdős conjecture in discrete geometry
    and medal-level performance at the International Mathematical Olympiad.
  plainLanguage: >-
    The newest challenge to the argument that started Orch OR. Machines are
    now doing mathematics that was open, hard, and not in the literature: an
    internal OpenAI model disproved Erdős's unit-distance conjecture, and
    DeepMind systems reached silver- and then officially-graded gold-medal
    standard at the IMO. Critics read this as computation doing what Penrose
    said computation could not.
  theme: non-computability
  rung: observation
  tier: featured
  claimType: observation
  importance: major
  reviewState: ai_extracted
  sourceAnchor:
    locator: "Sawin 2026, arXiv:2605.20579 — abstract"
    quote: >-
      This improves on very recent work of a team at OpenAI, who proved the
      same result with an inexplicit exponent greater than 1, drastically
      improving on the best previous lower bound and disproving a conjecture
      of Erdős.
    sourceId: SRC-SAWIN-2026
  origin:
    ref: "Jhong, 'The Erdős Unit Distance Problem and Penrose Understanding' (2026); milestones independently verified via arXiv, Nature, and the official ICML and DeepMind pages"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"
  credibility: well_supported
  credibilitySummary: >-
    Evidence-only, and unusually well anchored for a claim this recent
    because the mathematics is independently checkable. The Erdős result is
    attested not by the announcing company but by an independent working
    mathematician who states it in his own arXiv paper and builds on the
    construction; it was checked by outside mathematicians, a companion paper
    was written by nine of them, and the exponent has since been made
    explicit (n^1.014). The IMO results are stronger still on verification:
    AlphaProof's proofs were machine-checked in Lean and the methodology was
    peer-reviewed in Nature, and the 2025 gold-standard performance (35/42,
    five of six problems) was officially graded by IMO coordinators under the
    same criteria and time limit as student contestants. One honest caveat on
    the record: this evidence line has a documented false-positive history —
    an October 2025 round of AI Erdős claims collapsed when the solutions
    turned out to be in the literature, and a Christmas 2025 claim on Erdős
    Problem 333 was withdrawn within hours after a 1977 resolution by Erdős
    himself was identified.
  diagnosticity: low
  diagnosticitySummary: >-
    Deliberately low, and this is the scoping the case most wants readers to
    see. These results bear on ORCH-C040 — the Gödelian MOTIVATION for
    seeking non-computable physics — and not on any microtubule or anesthesia
    claim. Even taken at their strongest they leave ORCH-C002, ORCH-C010,
    ORCH-C013, and ORCH-C030 exactly as they were. Within the
    non-computability theme their force is also contested on grounds that
    have nothing to do with AI capability: Penrose's claim concerns whether a
    knowably sound algorithm captures mathematical understanding, and
    producing correct theorems does not speak to it, since nobody ever
    claimed algorithms cannot generate true theorems. The strongest reading
    of these results as evidence is not "Penrose refuted" but "the residue of
    allegedly non-computable performance keeps shrinking."
  parentClaimIds: [ORCH-C040]
  dependsOnClaimIds: []
  strongestObjection: >-
    Two objections, and the first is the one Penrose's defenders actually
    press. (1) Performance is not understanding, and the relevant distinction
    is between results inside a framework and the invention of the framework:
    a novel construction disproving a stated conjecture is, on the taxonomy
    of DeepMind's own position paper, mechanized deduction wrapped in
    search — dazzling execution within a framework humans built. Eugene's
    essay makes the sharper version: the claim was never that individual
    insights are permanently non-computable but that the capacity to keep
    generating them is — "the escalator, not the steps" — so each formalized
    insight becoming computable in hindsight is predicted by the view rather
    than damaging to it. (2) Training-distribution: a system trained on
    essentially all human mathematics producing a result inside that
    distribution is interpolation in an enormous space, which is not the act
    of extension at issue. Against both, the honest counter-objection is that
    an argument which no possible achievement can touch has purchased its
    safety at the price of its content.
  whatWouldChangeOurMind:
    - "An AI system producing a framework extension — a move not licensed by the existing formalism that then becomes the new formalism — which is the test both Eugene's essay and the DeepMind position paper name as the real one."
    - "Sustained autonomous resolution of open problems at a rate and depth that makes the 'interpolation in a large space' reading untenable."
    - "Conversely: a demonstration that current systems' novel results all reduce to recombination within the training distribution would blunt this evidence line considerably."
