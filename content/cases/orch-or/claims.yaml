- id: ORCH-C030
  statement: >-
    Quantum superpositions of sufficiently different mass distributions
    collapse objectively, with a characteristic lifetime τ ≈ ℏ/E_G set by the
    gravitational self-energy of the mass-distribution difference.
  plainLanguage: >-
    Penrose's physics, independent of any biology. This is the conjunct that
    makes Orch OR unusual among consciousness theories: its core mechanism is
    testable in a tabletop physics experiment with no brains involved, and
    mainstream quantum-gravity groups are building experiments that would
    test it for their own reasons.
  theme: collapse-physics
  rung: attribution
  tier: featured
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Penrose 1996, General Relativity and Gravitation 28(5); via the deep-research report's objective-reduction section"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"
  credibility: unresolved
  credibilitySummary: >-
    Evidence-only, and this is a case where precision about what was tested
    matters more than the headline. The Gran Sasso experiment (ORCH-C031)
    searched for the spontaneous radiation that a stochastic Diósi–Penrose
    collapse model predicts from charged particles, found none, tightened the
    bound on the effective nuclear mass-density size by about three orders of
    magnitude, and — in the paper's own words — "rules out the natural
    parameter-free version of the Diósi–Penrose model." That is a genuine
    experimental refutation of a specific completion. It is not a refutation
    of the claim as worded here, because Penrose's published criterion is a
    characteristic-lifetime relation rather than a stochastic master equation
    and does not entail the radiation prediction the experiment looked for.
    No experiment has yet tested the ℏ/E_G scaling directly. So: one natural
    implementation experimentally dead, the underlying claim unconfirmed and
    untested.
  diagnosticity: high
  diagnosticitySummary: >-
    Decides one of the two conjuncts of the headline thesis, and does so on a
    track with no biology in it — which is why this is the cleanest part of
    the whole case. Worth being explicit about the limit of its force in the
    other direction: a positive collapse result would establish that the
    mechanism Orch OR invokes exists, and would say nothing whatever about
    whether microtubules use it.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    A methodological objection that applies regardless of one's priors, and
    the one McQueen himself raises against his own side: escaping an
    experimental bound by retreating to an incompletely specified version of
    the theory is not positive evidence for that version. Penrose OR survives
    Gran Sasso partly because it is underspecified, and underspecification is
    not a virtue. Meanwhile the class of gravity-related collapse models that
    are specified enough to test is being narrowed by experiment.
  whatWouldChangeOurMind:
    - "A mesoscopic superposition experiment (Bose–Einstein condensate, or levitated/nanomechanical system) in which collapse lifetime does or does not scale as ℏ/E_G with mass and separation varied while environmental decoherence is independently characterized."
    - "A fully specified, radiation-free dynamical completion of Penrose OR that makes distinct quantitative predictions — which would make this claim testable rather than merely unrefuted."
    - "Further spontaneous-radiation bounds extending the exclusion across the parameter range realistic Orch OR calculations require."

- id: ORCH-C040
  statement: >-
    Human mathematical understanding is not the execution of any knowably
    sound formal algorithm.
  plainLanguage: >-
    The Gödelian argument that motivated Penrose to look for non-computable
    physics in the first place — stated in the weaker form he retreated to in
    "Beyond the Doubting of a Shadow," which is compatible with humans being
    Turing machines whose consistency we cannot establish from within. This
    is the rung where the recent AI-mathematics results bite, and the scoping
    matters: it is a claim about minds, not about microtubules.
  theme: non-computability
  rung: attribution
  tier: featured
  claimType: interpretive
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Jhong, 'The Erdős Unit Distance Problem and Penrose Understanding' (2026); Penrose, Shadows of the Mind, via the same essay"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"
  credibility: unresolved
  credibilitySummary: >-
    Evidence-only, and the honest position is that this claim is not the kind
    of thing the attached records can settle. The undermining records
    (ORCH-C041) establish that AI systems now produce correct, novel,
    research-level mathematics — a Lean-verified silver-medal IMO
    performance, an officially-graded gold-medal performance, and the
    disproof of a 1946 Erdős conjecture confirmed by independent
    mathematicians. What none of them establishes is the thing at issue: the
    claim concerns whether a knowably sound algorithm captures mathematical
    understanding, and producing correct mathematics by any means does not
    address it, because the claim was never that algorithms cannot generate
    true theorems. Cutting the other way, the qualifying record
    (SRC-ZAHAVY-2026) is an argument from inside DeepMind, not a measurement,
    and arguments do not raise credibility. On the formal-logic side the
    dispute remains live and technical rather than resolved. So: heavily
    discussed, genuinely unresolved, and possibly not empirically decidable
    in the form stated.
  diagnosticity: low
  diagnosticitySummary: >-
    Deliberately scoped low, and this is the most important scoping judgment
    in the case. This claim is the historical MOTIVATION for Orch OR, not a
    premise of its mechanism. Even a decisive refutation would leave every
    microtubule and anesthesia claim exactly where it stands — the biology
    would simply lose its original reason for having been proposed. And even
    decisive vindication would not select microtubules as the implementer:
    Penrose's argument says some non-computable physics is involved
    somewhere, not where. Critics and proponents both routinely treat this
    rung as if it settled the case; it does not, in either direction.
  parentClaimIds: [ORCH-C001]
  dependsOnClaimIds: []
  strongestObjection: >-
    A structural objection independent of any AI result, and the one Eugene's
    own essay presses hardest: the argument has retreated continuously into
    territory where verification is impossible. Every concrete example
    Penrose offered that was testable has largely settled against him — most
    cleanly the composed pawn-fortress chess position the Penrose Institute
    released in 2017, which modern engines handle correctly. The examples
    that have aged best (Platonic perception, aesthetic judgment, the
    knowing-why gap) are the ones hardest to test. Whether that pattern shows
    depth or unfalsifiability is exactly what the reader has to decide, and
    the essay declines to decide it for them.
  whatWouldChangeOurMind:
    - "An AI system producing a genuine framework extension — a move not licensed by the existing formalism that then becomes the new formalism — rather than a novel result inside an existing framework. This is the test Eugene's essay proposes and the Erdős result explicitly does not meet."
    - "Resolution of the Koellner / Corradini–Galvan technical dispute over whether the disputed steps of Penrose's argument are legitimate when restricted to arithmetic formulas."
    - "A precise, agreed operationalization of 'understanding' that distinguishes it from performance — absent which this claim may not be empirically decidable at all."

