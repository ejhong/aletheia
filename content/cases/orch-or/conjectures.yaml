# On-the-record editorial conjectures. A conjecture carries no evidential
# weight anywhere on this site: it does not touch any claim's credibility,
# and the evidence ledger is assessed as if this file did not exist. Its
# job is the opposite — to make the site's own editors falsifiable.

- id: ORCH-J001
  by: "Eugene (ejhong)"
  date: "2026-08-23"
  statement: >-
    Orch OR is substantially correct: consciousness involves quantum
    processes in neuronal microtubules terminated by Penrose objective
    reduction, and anesthesia works substantially by dampening those
    quantum effects.
  confidence: >-
    High — stated as founder's intuition, explicitly not derived from the
    evidence ledger, which currently grades the corresponding claims
    (ORCH-C001, ORCH-C002) unresolved and weakly supported.
  rationale: >-
    Recorded from the founder's "Orch OR Ascending" essay (April 2026,
    research/), which states the reasons in full. In brief: the theory
    earns its strangeness on multiple independent fronts at once. It is
    the only account that attempts the hard problem rather than declaring
    experience emergent-and-leaving-it-there; entanglement across tubulin
    networks gives a clean physical mechanism for the binding problem
    without a homunculus; the no-cloning theorem dissolves the
    teleportation "which copy is me" paradox that plagues computational
    views; OR is a genuine third option between determinism and
    randomness, turning Penrose's Gödelian insight into a positive
    mechanism; the physics is independently motivated (gravitational OR
    is a serious quantum-foundations proposal regardless of
    consciousness); E_G = ℏ/τ yields ~25–40 ms collapse times matching
    gamma-band conscious moments where most theories give no principled
    basis for any frequency; discrete OR events fit the psychophysics of
    granular integration windows; microtubules predate neurons, giving
    phylogenetic continuity down to single-celled cognition; and
    Meyer–Overton anesthetic action through hydrophobic tubulin pockets
    explains why chemically diverse agents with no common receptor
    produce unconsciousness in proportion to lipid solubility. The
    forward path is two-track and staked below: anesthesia experiments
    watching for quantum effects dampened in proportion to clinical
    potency (Hameroff's two 2020 falsifiable claims), and the Fuentes
    program — Bose–Einstein condensate and related superposition
    experiments (Howl, Penrose & Fuentes 2019; the 2025 spin-based
    consortium white paper) — testing Penrose OR directly at the collapse
    timescale the formula predicts.
  predictedFindings:
    - "A validated coherence witness in microtubules under physiological conditions showing quantum effects persisting far beyond naive warm-wet-noisy decoherence estimates."
    - "Anesthetics dampen microtubule quantum observables (excitation diffusion, delayed luminescence, resonance patterns) in proportion to clinical potency, while structurally similar non-anesthetics do not — replicated under preregistered protocols."
    - "The microtubule-stabilizer anesthesia effects (epothilone) and the xenon nuclear-spin isotope potency split survive independent preregistered replication."
    - "BEC or levitated-superposition experiments detect state reduction on the τ ≈ ℏ/E_G timescale Penrose's formula predicts, as superposed masses scale up."
  disconfirmers:
    - "A validated physiological coherence measurement (ORCH-R001-class) finds decoherence times orders of magnitude too short, with sensitivity demonstrated on positive controls — the microtubule substrate claim should then be marked refuted."
    - "Preregistered anesthetic potency series show no correlation between clinical potency and any microtubule quantum observable, or the epothilone and xenon-isotope anomalies fail replication — the anesthesia pathway claim should then be dropped, not relocated."
    - "Fuentes-program superposition experiments reach the mass scales where τ ≈ ℏ/E_G predicts collapse and observe standard unitary quantum mechanics — gravitational OR is then wrong and the theory's physical foundation fails."
  decisiveTestIds: [ORCH-R001, ORCH-R002, ORCH-R004, ORCH-R007]
  status: open
