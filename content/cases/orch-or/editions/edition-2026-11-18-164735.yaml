article: |-
  Orch OR, the theory of Roger Penrose and Stuart Hameroff, proposes that [each conscious moment is a gravity-triggered collapse of a quantum state spread across tubulin proteins in neuronal microtubules]{claim=ORCH-C001}, and that anesthetics work by breaking that state. The evidence so far splits cleanly. Microtubules turn out to be electronically and optically livelier than a passive scaffold should be, and anesthetics measurably perturb them. But nobody has measured the thing the theory needs: quantum coherence lasting tens of milliseconds in a warm brain. Meanwhile three underground detectors have ruled out the simplest, parameter-free version of the collapse physics, though not Penrose's lifetime rule itself. The theory stands unresolved. It is not refuted, because its central quantity has never been measured. It is not supported, because nothing yet measured is that quantity. What remains open is a short list of experiments, almost none of them run.

  ## Five claims, not one

  Arguments about Orch OR slide between quantum effects in microtubules, quantum coherence in them, entanglement across them, quantum computation in neurons, and Penrose's gravitational collapse. The first is trivially true, since all chemistry is quantum; the last is an open proposal in the foundations of physics. Evidence for one is not evidence for the next.

  Keeping them apart produces verdicts that look odd until you see why. That [microtubules have collective electronic behaviour a passive scaffold would not show]{claim=ORCH-C013} is well supported. That [they hold coherent quantum states long enough and widely enough for the theory's computation]{claim=ORCH-C010} is unresolved: not contradicted, but unmeasured. The headline needs both, and cannot rise above the weaker of the two.

  ## What microtubules actually do

  {plate:IMG-ORCHOR-P01}

  The pivotal experiment comes from Gregory Scholes's ultrafast spectroscopy laboratory at Princeton. By watching how tryptophan fluorescence changes as a quencher is added, the group infers that [electronic excitation travels about 6.6 nanometres through polymerized microtubules, further than standard energy-transfer theory accounts for, and that the anesthetics etomidate and isoflurane shorten that distance]{claim=ORCH-C020}. Hameroff and Penrose are among the co-authors, so this is a collaboration that includes the theory's originators, not an outside test.

  A partly independent group at Howard University reports that [fluorescence efficiency rises as tubulin is organized into larger structures, as a model of collective 'superradiant' tryptophan states predicts]{claim=ORCH-C021}. A 2026 measurement in pig tubulin reproduces the direction of that rise at 280 nanometres. Microtubules are not inert beams, and that is worth knowing whatever anyone thinks about consciousness.

  Now the limits. 6.6 nanometres is roughly one tubulin dimer, the unit pictured above, and the physics runs in femtoseconds to picoseconds. Orch OR needs milliseconds, across many tubulins. The superradiance work's 'tens of seconds' are radiative lifetimes: they measure how weakly a state couples to light, not how long it survives jostling by its surroundings. The newest modelling of the same geometry includes no water, ions or molecular vibrations, and its authors write that their results do not imply microtubules use quantum correlations for neural processing at all.

  The optical signal itself is not yet stable. Microtubules scatter ultraviolet light strongly. In the 2026 dataset the polymerization effect at 280 nanometres ranges from about +6% to about +47%, depending on which of two defensible scattering corrections is used, and at 295 nanometres, the wavelength most selective for tryptophan, the two corrections disagree on its sign. The same modellers report that [adding realistic structural disorder sharply cuts the collective enhancement relative to an idealized lattice]{claim=ORCH-C063}. Anyone who correlates this signal with anesthetic potency before fixing the scattering problem risks measuring the correction rather than the physics.

  What would settle the central question is a coherence time measured at body temperature. What exists instead is two calculations. Max Tegmark puts microtubule decoherence at 10⁻¹³ to 10⁻²⁰ seconds, against neural timescales of 10⁻³ to 10⁻¹ seconds. Hagan, Hameroff and Tuszyński reply that he modelled the wrong physical state, and get 10⁻⁵ to 10⁻⁴ seconds instead — still two to three orders of magnitude short of the roughly 25-millisecond conscious moment the theory names. This site's survey of the theory's own literature finds no published pass/fail threshold for any direct coherence test, and a change of physical carrier in 2014, from protein shape changes to collective dipoles.

  Anirban Bandyopadhyay's group in Japan offers what it presents as the bridge from molecules to brains: [self-similar 'triplet of triplet' resonance patterns in tubulin, in microtubules, and in part of a neuron]{claim=ORCH-C022}. Resonance is a classical observable, so even a real pattern would not show coherence, and no outside laboratory has reproduced it in more than a decade.

  ## The anesthesia experiments, in both directions

  {plate:IMG-ORCHOR-P02}

  This is the part of the case that can be tested now, and it has a real empirical fight in it.

  The evidence for starts with the finding that [anesthetics bind tubulin and change microtubule photophysics]{claim=ORCH-C011}. An anesthesia laboratory at Penn with no stake in the theory finds that an anthracene anesthetic photolabels β-tubulin, and that microtubule stabilizers raise the dose needed to immobilize tadpoles. Then comes the behavioural result from Wellesley: [a single dose of the stabilizer epothilone B delays isoflurane-induced loss of the righting reflex by 69 seconds in rats and 29 seconds in mice]{claim=ORCH-C023}. The rat study is blinded and controls for tolerance, but uses eight male rats; the mouse study, from the same laboratory, calls its own effect modest against the variation between animals.

  The evidence against comes from an independent group at Massachusetts General Hospital, in a randomized, blinded study with full dose–response curves. It finds that [two weeks of the stabilizer epothilone D makes mice more sensitive to isoflurane, and the destabilizer vinblastine does the same]{claim=ORCH-C024}. The authors describe epothilone D as the epothilone that crosses into the brain. Paclitaxel, another stabilizer, shifted the mice the other way, but only marginally.

  Two questions are tangled here. That [drugs which stabilize or destabilize microtubules change how easily animals are anesthetized]{claim=ORCH-C012} is well supported: every study finds a shift. But any drug that disturbs cells could produce one. What would favour a microtubule role is a consistent direction, [stabilizers giving resistance and destabilizers sensitivity]{claim=ORCH-C126}, and on that the record is mixed. Most stabilizer results point the expected way; the best-designed one does not.

  The mechanism behind the direction has also weakened. In the rat study's published peer review, a reviewer wrote that the authors had not shown destabilization, and that the simplest explanation was epothilone B blocking or occupying isoflurane's binding pocket on tubulin. The authors agreed and revised every reference to stability disruption in the paper. That keeps tubulin on the anesthetic pathway as a binding site, but no longer makes the delay evidence that stability matters. And the Penn laboratory's in-vitro data indicate that propofol and isoflurane themselves promote tubulin polymerization, much as a stabilizer does; its authors conclude that anesthetics may destabilize in either direction.

  The sharpest objection comes from inside the Princeton experiment. It also tests picrotoxin, a convulsant and pharmacologically the opposite of an anesthetic, and reports a comparable effect on the same assay. If a convulsant and two anesthetics all move the signal, the assay may be measuring how easily small oily molecules perturb microtubules, not anything specific to anesthesia. The test that would decide this — eight or more agents, solubility-matched non-anesthetics, free drug concentrations measured, the predicted correlation registered in advance — has not been run.

  ## A quantum anomaly that points elsewhere

  One result is genuinely strange: [xenon isotopes that carry nuclear spin are weaker anesthetics than spin-zero isotopes, although their calculated polarizability is identical]{claim=ORCH-C025}. It comes from a randomized study of 80 mice published in *Anesthesiology*, and there is no classical-chemistry explanation to hand. This site's own re-analysis finds the shape striking — one mass unit across the spin boundary changes potency by about 30 points, two within a spin pair by a few — but the result thin: its headline values are calculated from mixtures, its error bars are of unstated type, its data cannot statistically separate spin from mass, and in eight years nobody has repeated it.

  Spin also points at spin-sensitive chemistry, not at microtubules. Researchers proposing radical-pair chemistry, in which the spins of paired electrons steer a reaction, have taken up the same four numbers, and model the idea that [a magnetically sensitive radical pair modulates how fast microtubules assemble]{claim=ORCH-C044}. That is a parameter fit, not a measurement, but it offers a mechanism for chemically opposite microtubule drugs acting alike. It implies a cheap test nobody has run: does the xenon isotope effect change with magnetic field?

  ## The physics, tested underground

  Penrose's contribution stands apart from the biology. He proposes that [superpositions of sufficiently different mass distributions collapse on their own, with a lifetime set by the gravitational self-energy of the difference]{claim=ORCH-C030}: τ ≈ ℏ/E_G.

  If gravity collapses wavefunctions in the standard random way, charged particles should faintly emit X-rays. A team including Lajos Diósi, co-originator of the model, looked with a germanium detector under Gran Sasso and [found nothing, ruling out 'the natural parameter-free version of the Diósi–Penrose model']{claim=ORCH-C031}. The independent [Majorana Demonstrator found no such radiation either, in 37.5 kilogram-years of enriched germanium]{claim=ORCH-C047}. In 2026 the XENONnT dark-matter collaboration searched a different element with a different kind of detector: [its xenon data showed no collapse radiation and pushed the model's limit about five times past the germanium result]{claim=ORCH-C125}. All three are negative. Two theorists on the xenon paper also worked on the Gran Sasso search, so the three share their theoretical input, though not their detectors.

  The philosopher Kelvin McQueen presses an escape: Penrose's criterion is a lifetime rule, not a random-noise equation, and predicts no radiation. That is correct, and it is why this claim is unresolved rather than refuted. The xenon authors mark the same boundary: they tested only the white-noise version, and say variants with coloured or dissipative noise remain to be probed. But the escape is getting costly.

  - A reanalysis of LISA Pathfinder data finds that [the spacecraft's measured acceleration noise between free-falling test masses forces the model's cutoff length above the size of any nucleus]{claim=ORCH-C046}. The radiation searches now give tighter numbers, but this one comes through a mechanical channel that an argument about radiation does not reach.
  - Diósi reports that [a construction he developed with Tilloy reproduces Penrose's rate exactly]{claim=ORCH-C066}. Whether that dynamics is already excluded is a calculation someone could do at a desk.
  - Diósi writes that the rate carries an unspecified constant, and that [he and Penrose agree on the collapse time but disagree on how collapse happens]{claim=ORCH-C069}.

  The lifetime rule itself is untested, and every dynamics proposed to realize it is being squeezed.

  ## The living-brain signal

  One experiment claims to see non-classical behaviour directly. [Zero-quantum-coherence MRI of living human brains picks up heartbeat-timed signals that depend on conscious awareness, which the experimenters read as witnessing entanglement]{claim=ORCH-C026}. Warren S. Warren, a leading NMR methodologist, replies that living tissue is complex and imprecisely characterized by MRI. The authors calculate that the classical mechanism he proposes could reach at most 0.4% of the initial magnetization, far below what they observe — an answer in their own words, with formulas derived for chemical solutions. Nobody else has run the sequence, and even fully validated, the result would implicate no microtubule: the quantum systems measured are the spins of protons in water.

  ## The argument that started it

  Penrose came to microtubules from Gödel: in its weaker form, the argument is that [human mathematical understanding is not the execution of any knowably sound algorithm]{claim=ORCH-C040}, so something in the brain's physics must be non-computable. Machines now press on it. [An AI model has disproved a 1946 Erdős conjecture, confirmed and improved by an independent mathematician, and AI systems have reached Lean-verified silver and officially graded gold at the International Mathematical Olympiad]{claim=ORCH-C041}. The Penrose-side reply, echoed by a co-author of DeepMind's AlphaProof, is that these systems deduce inside existing frameworks but cannot jump to new premises. An essay by Eugene Jhong, who started this case, concedes that Penrose's testable examples have mostly gone against him, and defends 'the escalator, not the steps'.

  **This bears on why the theory was proposed, not on whether it is true.** Refute the Gödel argument and every microtubule claim stands where it was; vindicate it and microtubules gain no special claim to be what does the non-computing.

  ## The live accounts, side by side

  - **Orch OR.** Predicts coherence at 37 °C lasting tens of milliseconds, anesthetic suppression of it that scales with clinical potency, and collapse lifetimes that scale as ℏ/E_G.
  - **Interesting condensed matter, nothing more.** Predicts coherence lost within femtoseconds to picoseconds, optical effects moved by any small oily molecule (convulsants included), and no potency correlation.
  - **Classical multi-target pharmacology.** Predicts that receptor genetics keeps explaining the drugs one by one, and that microtubule drugs act through transport, metabolism, cell health or occupying a binding site.
  - **Spin chemistry without microtubules.** Predicts that the xenon isotope effect changes with magnetic field, and that isotope or redox manipulations shift microtubule assembly.
  - **Non-classical brain, other site.** Predicts that the MRI signal replicates in other hands and survives tests on calibrated phantoms, with no dependence on microtubules.
  - **Collapse physics on its own.** Predicts that ℏ/E_G scaling shows up, or fails to, in levitated-particle or condensate experiments, whatever the brain does.

  ## The conventional account, taken seriously

  On anesthesia, the conventional account has causal evidence Orch OR lacks. [A single engineered change in the GABA_A receptor β3 subunit abolishes the immobilizing action of etomidate and propofol and sharply reduces their hypnotic effect]{claim=ORCH-C003}. Nothing comparable exists for tubulin.

  Its limits are the proponents' opening. The same mutation barely affects volatile anesthetics, and senior anesthesia researchers report that two decades of work found no channel, or combination of channels, sufficient for immobility under inhaled agents. So [the stronger claim that anesthesia and cognition are *fully* classical]{claim=ORCH-C004} is unresolved. Proponent modelling reportedly predicts several volatile agents' potencies from how they bind to tubulin, in effect reproducing the Meyer–Overton rule linking potency to solubility in oil, and a proponent commentary asserts that [no other candidate target has a published model that does the same]{claim=ORCH-C057}. That assertion has no survey behind it and the modelling has never been tested prospectively, but no rival model is on the table either. Nor does the conventional account say why any of this activity is experienced; Orch OR attempts to, but attempting an explanation is not evidence for it.

  ## What would settle it

  - **A coherence measurement in microtubules at 37 °C**, against a pass/fail threshold proponents publish in advance. A clean null near the requirement would close the biological half.
  - **A stable optical signal**, then an anesthetic potency series with non-anesthetic and convulsant controls. A slope tracking clinical potency would be hard to explain conventionally; controls moving the signal as much would close this line of argument.
  - **A tubulin knock-in mouse** that cannot bind anesthetic but still builds normal microtubules, with receptor function unchanged.
  - **A preregistered multicentre epothilone replication**, with acute and chronic dosing side by side and brain drug levels measured.
  - **A direct test of ℏ/E_G scaling** in mesoscopic superpositions, plus the desk calculation of whether the one dynamics known to give Penrose's rate is already excluded.
  - **A magnetic-field test of the xenon isotope effect.** If the effect shifts with the field, the anomaly belongs to spin chemistry, not microtubules.

  None of these requires believing the theory first, and almost none has been run.
