    wide microtubule nanowire and 1-μm-wide axon initial segment of a
    neuron," and describes the finding as suggesting a scale-free
    organizational principle spanning those levels.
  editorInference: >-
    Offered by proponents as the scale-bridging mechanism Orch OR needs to
    get from molecular events to whole-brain conscious moments, which would
    make it important if it held up. Two things hold it back and they compound
