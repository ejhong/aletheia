# Evidence ledger. `sourceStatement` is confined to what the source itself
# states or shows — quoted or closely paraphrased from text this import
# actually read. `editorInference` is where any reading, weighing, or
# extrapolation goes. Where a figure comes from a paper body this import did
# not read directly, that is said on the record rather than smoothed over.
#
# Supporting and undermining records are interleaved by topic rather than
# segregated, so the ledger reads as one argument rather than two briefs.

# ── Microtubule photophysics ───────────────────────────────────────────────

- id: ORCH-E001
  title: "Electronic excitation diffuses ~6.6 nm in microtubules, beyond Förster prediction"
  claimIds: [ORCH-C020, ORCH-C013]
  sourceId: SRC-KALRA-2023
  direction: supports
  strength: moderate
  exactLocator: "Abstract; Kalra et al. 2023, ACS Central Science 9(3): 352–361"
  sourceStatement: >-
    The abstract states: "By studying how the quencher concentration alters
    tryptophan autofluorescence lifetimes, we demonstrate that electronic
    energy can diffuse over 6.6 nm in microtubules"; that "this diffusion
    length is not sufficiently explained by accepted Förster resonance energy
    transfer models, even after accounting for the contribution of
    tryptophan-tyrosine interactions"; and concludes that "microtubules are,
    unexpectedly, effective light harvesters." Diffusion was observed to
    depend on polymerization state but not on protofilament number.
  editorInference: >-
    This is the strongest single piece of experimental support for the
    biological half of Orch OR, and its limits are as important as its
    content. The measured length scale is roughly one tubulin dimer, and the
    quantity measured is an excitation diffusion length, not a coherence
    time — the paper's modeling explicitly includes an incoherent
    energy-migration comparison. Structure-dependence (polymerization matters,
    protofilament architecture does not) argues against artifact. Treated
    here as strong evidence that microtubules are electronically nontrivial
    (ORCH-C013) and as no evidence at all for the millisecond coherence
    ORCH-C010 requires.
  limitations:
    - "Diffusion length is inferred from concentration-dependent quenching, not directly imaged."
    - "Not replicated by an independent laboratory as of this import."
    - "Purified in vitro microtubules, not neurons: no MAPs, no cytosolic crowding, no membrane environment."
    - "Independence caveat: Hameroff, Penrose, Craddock, and Tuszyński are all co-authors, so this is a collaboration including the theory's authors rather than an outside test of it."
  reviewState: ai_extracted
  origin:
    ref: "Kalra et al. 2023 abstract, read via PubMed (PMID 36968538); bibliographic record verified via Crossref"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

- id: ORCH-E002
  title: "Etomidate and isoflurane reduce microtubule exciton diffusion"
  claimIds: [ORCH-C020, ORCH-C011, ORCH-C002]
  sourceId: SRC-KALRA-2023
  direction: supports
  strength: moderate
  exactLocator: "Abstract, final sentences; specific reduced values from the Results as reported in the deep-research report"
  sourceStatement: >-
    The abstract states: "We also demonstrate that the presence of the
    anesthetics etomidate and isoflurane reduce exciton diffusion." The
    concluding sentence is that these results "may have implications in
    various physiological processes, including in anesthetic action." The
    deep-research report gives the reduced diffusion lengths as approximately
    5.6 nm (etomidate) and 5.8 nm (isoflurane) at 50 μM against the 6.6 nm
    baseline; those specific values are from the paper body, which this
    import did not read directly, and are recorded here as reported rather
    than as verified.
  editorInference: >-
    A direct experimental link between clinical anesthetics and a measured
    microtubule physical property — the observation that makes the anesthesia
    arm of Orch OR worth testing rather than merely worth asserting. The
    effect is modest, roughly a 13% reduction if the reported values are
    right, and the concentration is at or above the clinical range. Crucially
    this establishes that anesthetics perturb microtubule photophysics
    (ORCH-C011) without establishing that the perturbation has anything to do
    with unconsciousness; the specificity control in the same paper
    (ORCH-E003) is what stops this from carrying more weight.
  limitations:
    - "Two agents only; no potency series, no nonimmobilizer controls, no hydrophobic non-anesthetic controls."
    - "Free aqueous concentration not established, so effective exposure is uncertain."
    - "Specific reduced values not verified against the paper body by this import."
    - "In vitro purified microtubules; no demonstrated relationship to any behavioral endpoint."
  reviewState: ai_extracted
  origin:
    ref: "Kalra et al. 2023 abstract (verified) plus Results figures as relayed by the deep-research report (unverified)"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

- id: ORCH-E003
  title: "Picrotoxin, a convulsant, produced a comparable effect on the same assay"
  claimIds: [ORCH-C011, ORCH-C002]
  sourceId: SRC-KALRA-2023
  direction: undermines
  strength: moderate
  exactLocator: "Kalra et al. 2023, Results — reported via the deep-research report's specificity discussion"
  sourceStatement: >-
    The deep-research report states that the same study found picrotoxin — a
    GABA_A antagonist and convulsant, pharmacologically the opposite of an
    anesthetic — reducing tryptophan quenching comparably to the anesthetics
    tested. This detail is from the paper body rather than the abstract and
    was not directly verified by this import; it is recorded because it is
    the single most important qualification on ORCH-E002 and omitting it
    would misrepresent the experiment.
  editorInference: >-
    If a convulsant and two anesthetics all suppress the assay, then what is
    being measured is the perturbability of microtubule photophysics by
    small hydrophobic molecules, not something specific to anesthesia. This
    is the sharpest available objection to the anesthesia arm and it comes
    from inside the theory's own flagship experiment rather than from
    critics — which is to the authors' credit for reporting it. It does not
    show the anesthetic effect is spurious; it shows the experiment as
    performed cannot distinguish an anesthesia-specific mechanism from
    general pharmacological perturbation. Only a potency series with proper
    controls can.
  limitations:
    - "Detail not directly verified against the paper by this import; carried as reported by the deep-research report."
    - "A single comparison compound, not a systematic specificity panel — the absence of specificity is not itself established, only unaddressed."
  reviewState: ai_extracted
