    - "Resonance structure is a classical electromagnetic observable, not a quantum coherence or entanglement measure."
    - "Bespoke measurement apparatus spanning an unusually wide frequency range; sensitive to setup artifacts."
    - "Published in a considerably lower-profile venue than the primer's misattribution to Scientific Reports implies."
