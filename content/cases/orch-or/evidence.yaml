# ── Decoherence: the calculations that disagree ────────────────────────────

- id: ORCH-E007
  title: "Tegmark: microtubule decoherence 10⁻¹³–10⁻²⁰ s, far too fast for neural relevance"
  claimIds: [ORCH-C010, ORCH-C001]
  sourceId: SRC-TEGMARK-2000
  direction: undermines
  strength: moderate
  exactLocator: "Abstract; Tegmark 2000, Physical Review E 61(4): 4194–4206"
  sourceStatement: >-
    The abstract reports calculated decoherence timescales for superposed
    neural states — specifically "for superpositions of neuron firing
    (coherent or not)" and "for either separated coherent states of a single
    tubulin or for two tubulins in the same state" — in the range 10⁻¹³ to
    10⁻²⁰ seconds, against dynamical timescales of neural processes of
    10⁻³ to 10⁻¹ seconds. The conclusion drawn is that "the degrees of
    freedom of the human brain that relate to cognitive processes should be
    thought of as a classical rather than quantum system."
  editorInference: >-
    For twenty-five years this has been the reason most neuroscientists
    considered the question closed, and the gap it reports — ten to seventeen
    orders of magnitude — is large enough that no amount of refinement at the
    margins would close it. Its evidential status should be stated plainly
    though: it is a calculation about a modeled state, not a measurement of a
    microtubule, and its force depends entirely on whether the state it
    modeled is the state the theory proposes. That is precisely what the
    Hagan reply contests, which is why this is graded moderate rather than
    strong.
  limitations:
    - "A theoretical calculation, not a measurement; no microtubule was observed."
    - "Models specific superposed states whose correspondence to the Orch OR proposal is disputed by Hagan et al. 2002."
    - "Predates the ordered-lattice and collective-state work of 2023–2024, which changes some of the assumed environment."
    - "Assumes environmental coupling parameters that the proponent reply argues are inappropriate for ordered biological structures."
  reviewState: ai_extracted
  origin:
    ref: "Tegmark 2000 abstract, read via PubMed (PMID 11088215); bibliographic record verified via Crossref"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

- id: ORCH-E008
  title: "Hagan, Hameroff & Tuszyński: revised estimate 10⁻⁵–10⁻⁴ s — still short of requirement"
  claimIds: [ORCH-C010]
  sourceId: SRC-HAGAN-2002
  direction: qualifies
  strength: moderate
  exactLocator: "Abstract; Hagan, Hameroff & Tuszyński 2002, Physical Review E 65(6): 061901"
  sourceStatement: >-
    The abstract states that the authors "critically examine the assumptions
    made in [Tegmark's] model and re-examine the decoherence times for
    superposed states of microtubule tubulins," and that "correction of
    Tegmark's assumptions yields decoherence times of 10⁻⁵ to 10⁻⁴ seconds"
    — up to seven to eight orders of magnitude longer than Tegmark's figures.
    The paper enumerates several specific objections, the most consequential
    being that Tegmark modeled a soliton in superposition along the
    microtubule rather than the superposed protein conformations of the
    Orch OR proposal.
  editorInference: >-
    The central objection lands: the two papers computed decoherence for
    different physical states, so the seven-to-eight-order-of-magnitude gap
    between them is partly an artifact of modeling different things. That is
    a genuine correction and it is why "the brain is warm and wet, therefore
    no" is an inadequate argument. But this record is filed as `qualifies`
    rather than `supports` because even the proponents' own revised number
    does not reach their requirement: 10⁻⁵–10⁻⁴ s is one to two orders of
    magnitude short of the ~25 ms conscious moment the theory needs. Two
    calculations disagreeing by orders of magnitude, neither anchored to a
    measurement, is the actual state of this rung — and it is why ORCH-C010
    is assessed as unresolved rather than refuted.
  limitations:
    - "Also a calculation, not a measurement."
    - "Authored by two of the theory's principals; not an independent reanalysis."
    - "Even the favorable estimate falls one to two orders of magnitude short of the theory's own requirement."
    - "The competing estimates have never been adjudicated by experiment, which is the only thing that would settle them."
  reviewState: ai_extracted
  origin:
    ref: "Hagan et al. 2002 abstract, read via PubMed (PMID 12188753); bibliographic record verified via Crossref"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

# ── Anesthesia: molecular target ───────────────────────────────────────────

- id: ORCH-E009
  title: "β-tubulin identified as a direct anesthetic target with functional consequences in vivo"
  claimIds: [ORCH-C011, ORCH-C012]
  sourceId: SRC-EMERSON-2013
  direction: supports
  strength: moderate
  exactLocator: "Abstract; Emerson et al. 2013, JACS 135(14): 5389–5398"
  sourceStatement: >-
    The abstract reports that the general anesthetic 1-aminoanthracene
    photolabeled β-tubulin, identified by mass spectrometry, with binding
    localized near the colchicine site; that the compound inhibited
    microtubule polymerization in vitro; and that pretreatment of tadpoles
    with the microtubule stabilizers epothilone D and discodermolide
    increased the concentration of anesthetic required to produce
    immobilization. The authors conclude that microtubules are "on-pathway
    targets" for this class of anesthetic.
  editorInference: >-
    The best causal molecular evidence in the case that tubulin can lie on an
    anesthetic pathway, and it is strengthened rather than weakened by its
    provenance: this comes from an established anesthesia-mechanisms
    laboratory with no Orch OR commitment, which found the result while
    asking a different question. Two limits on its reach. The anesthetic is a
    research compound rather than a clinical volatile, so generalization is
    not established. And the epothilone-D direction here — stabilization
    producing anesthetic *resistance* — is opposite to the chronic
    epothilone-D result in mice (ORCH-E013), which is one more reason the
    stabilizer literature does not cohere into a rule.
  limitations:
    - "1-aminoanthracene is a research anesthetic; results may not generalize to clinical volatile or intravenous agents."
    - "Tadpole immobilization endpoint, which is an immobility rather than hypnosis measure."
    - "Binding near the colchicine site implies ordinary pharmacological interaction; nothing quantum is measured or implied."
    - "The authors' own conclusion is the modest 'on-pathway targets', not a mechanism claim."
  reviewState: ai_extracted
  origin:
    ref: "Emerson et al. 2013 abstract, read via PubMed (PMID 23484901); bibliographic record verified via Crossref"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

