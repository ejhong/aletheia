# ── Study ORCH-S002: xenon isotope potency, spin versus mass ────────────────

- id: ORCH-E037
  title: "Study re-analysis: the xenon isotope dataset fails its own pre-set identification test, but not for the reason expected"
  claimIds: [ORCH-C025]
  sourceId: SRC-ORCH-S002
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    Weighted least squares on the four published isotope arms, under criteria
    frozen before any number was read, gives a variance inflation factor of
    3.25 — below the pre-set failure threshold of 5 — so spin-versus-mass
    collinearity (r = -0.832) is real but not disabling. The scaled
    design-matrix condition number is 302.4 against a pre-set threshold of 30,
    which trips the frozen identification-failure rule. The source of that
    ill-conditioning is intercept-versus-mass rather than spin-versus-mass:
    atomic mass spans five units around 131.5, under 4 per cent relative
    variation, leaving the mass coefficient at -0.43 with a standard error of
    1.92 and the intercept with a standard error of 254. Per the
    pre-registration, no spin p-value is reported as evidential.
  editorInference: >-
    The confound the agenda proposal worried about is not the one that bites.
    Li et al. did place two isotopes on each side of the spin boundary, which
    is more design than the proposal credited them with, and that is why spin
    and mass are not fatally collinear. What defeats the regression is that
    the mass range is far too narrow for a linear mass term to be
    distinguished from a constant. ORCH-C025 should be read as resting on a
    dataset that cannot support a two-covariate inferential test either way,
    rather than as a claim refuted by one.
  exactLocator: "Study ORCH-S002, finding 1 (analysis code published beside the study file)"
  limitations:
    - "The freeze set a condition-number threshold without naming a scaling convention; the study applied the stricter uncentred convention, and records that the centred convention (4.89) would not have tripped the rule."
