# ── Anesthesia: the animal experiments, both directions ────────────────────

- id: ORCH-E011
  title: "Epothilone B delays loss of righting reflex by 69 s in rats (d = 1.9)"
  claimIds: [ORCH-C023, ORCH-C012, ORCH-C002]
  sourceId: SRC-KHAN-2024
  direction: supports
  strength: moderate
  exactLocator: "Abstract; Khan et al. 2024, eNeuro 11(8): ENEURO.0291-24.2024"
  sourceStatement: >-
    The abstract reports that rats given a low dose of epothilone B
    (0.75 mg/kg subcutaneous) three hours before exposure to 4% isoflurane
    "took an average of 69 s longer to become unconscious as measured by
    latency to LORR," a statistically significant difference with Cohen's
    d = 1.9, described in the paper as a "large" normalized effect size. The
    authors state the delay "cannot be explained by tolerance to
    isoflurane," having tested for it, and note the result is "consistent
    with the hypothesis that anesthetic binding to MTs is a critical step in
    the mechanism of isoflurane-induced LORR."
  editorInference: >-
    The cleanest behavioral result on the proponent side: blinded, with a
    tolerance control, and a large standardized effect. What it does not do
    is discriminate between explanations — no quantum variable was measured,
    and epothilone B changes microtubule stability, axonal transport,
    metabolism, and cellular integrity all at once, each of which offers a
    conventional route to altered anesthetic latency. The abstract's closing
    framing about "a quantum physical state of neural MTs" is the authors'
    interpretive gloss and is not a result of the experiment.
  limitations:
    - "N = 8 in the main analysis; male rats only."
    - "Not a counterbalanced crossover — every animal received the drug phase after the pre-drug phase."
    - "Latency at a single high isoflurane concentration (4%), not a full concentration–response curve."
    - "No microtubule quantum variable measured; drug effects on transport and metabolism are uncontrolled alternatives."
    - "LORR is a behavioral proxy, and anesthetic endpoints fractionate."
  reviewState: ai_extracted
  origin:
    ref: "Khan et al. 2024 abstract, read via PubMed (PMID 39147581); bibliographic record verified via Crossref"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

