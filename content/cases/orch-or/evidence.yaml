- id: ORCH-E004
  title: "Superradiant collective tryptophan states predicted and quantum-yield enhancement measured"
  claimIds: [ORCH-C021, ORCH-C013]
  sourceId: SRC-BABCOCK-2024
  direction: supports
  strength: moderate
  exactLocator: "Abstract; Babcock et al. 2024, J. Phys. Chem. B 128(17): 4035–4046"
  sourceStatement: >-
    The abstract states that theoretical analysis "predicts the formation of
    strongly superradiant states due to collective interactions among
    organized arrangements of up to >10^5 Trp UV-excited transition dipoles
    in microtubule architectures, which leads to an enhancement of the
    fluorescence quantum yield (QY) that is confirmed by our experiments."
    It further reports that these states are "remarkably resilient to
    disorder" and persist "at room temperature," with the brightest states
    having radiative lifetimes of "hundreds of femtoseconds" and the darkest
    "tens of seconds."
  editorInference: >-
    Partly independent corroboration that microtubules are optically
    collective, from a group outside the Hameroff–Penrose line — which
    matters for ORCH-C013. The "tens of seconds" figure is the one that
    travels in secondary discussion and it is routinely misread: it is the
    radiative lifetime of a modeled dark collective eigenstate, a measure of
    how weakly a state couples to the light field, not a decoherence time. A
    state can be radiatively dark for seconds and dephase in femtoseconds.
    On the quantity Orch OR actually needs, this paper is silent.
  limitations:
    - "Predominantly theoretical; the experimental component is a bulk fluorescence quantum-yield measurement, which is an indirect witness of collective states."
    - "Quantum yield can be raised by several mechanisms; the collective-state interpretation is model-dependent."
    - "Superradiance is cooperative light–matter coupling, a different physical process from the state reduction Orch OR requires."
    - "In vitro; no anesthetic manipulation and no neural preparation."
  reviewState: ai_extracted
  origin:
    ref: "Babcock et al. 2024 abstract, read via PubMed (PMID 38641327); bibliographic record verified via Crossref"
    extractedBy: "Fable (AI agent)"
    runId: "orch-or-import-2026-08-22"
    date: "2026-08-22"

