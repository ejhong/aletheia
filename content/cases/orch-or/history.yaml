- date: 2026-09-09
  change: |-
    The editorial conjecture file retired (ORCH-J001, by "Eugene (ejhong)", dated 2026-08-23, status open). The card leaves the case page. Its propositions are the ledger's: ORCH-C001 (each conscious moment is an orchestrated objective reduction in microtubules) and ORCH-C002 (anesthetics act substantially by disrupting a quantum-coherent microtubule state); its decisive tests are ORCH-R001, ORCH-R002, ORCH-R004 and ORCH-R007; its rationale is the founder's essay "Orch OR Ascending", a founding input of this case (ORCH-IN002), which the file said states the reasons in full. Banked here, as the file recorded them, are the founder's stake and the tests he named.
    Statement: "Orch OR is substantially correct: consciousness involves quantum processes in neuronal microtubules terminated by Penrose objective reduction, and anesthesia works substantially by dampening those quantum effects."
    Confidence: "High — stated as founder's intuition, explicitly not derived from the evidence ledger, which currently grades the corresponding claims (ORCH-C001, ORCH-C002) unresolved and weakly supported."
    Predicted findings: (1) "A validated coherence witness in microtubules under physiological conditions showing quantum effects persisting far beyond naive warm-wet-noisy decoherence estimates." (2) "Anesthetics dampen microtubule quantum observables (excitation diffusion, delayed luminescence, resonance patterns) in proportion to clinical potency, while structurally similar non-anesthetics do not — replicated under preregistered protocols." (3) "The microtubule-stabilizer anesthesia effects (epothilone) and the xenon nuclear-spin isotope potency split survive independent preregistered replication." (4) "BEC or levitated-superposition experiments detect state reduction on the τ ≈ ℏ/E_G timescale Penrose's formula predicts, as superposed masses scale up."
    What would prove it wrong: (1) "A validated physiological coherence measurement (ORCH-R001-class) finds decoherence times orders of magnitude too short, with sensitivity demonstrated on positive controls — the microtubule substrate claim should then be marked refuted." (2) "Preregistered anesthetic potency series show no correlation between clinical potency and any microtubule quantum observable, or the epothilone and xenon-isotope anomalies fail replication — the anesthesia pathway claim should then be dropped, not relocated." (3) "Fuentes-program superposition experiments reach the mass scales where τ ≈ ℏ/E_G predicts collapse and observe standard unitary quantum mechanics — gravitational OR is then wrong and the theory's physical foundation fails."
  reason: "Founder direction (2026-09-09, in session): a bet with a stated confidence and a disconfirmer is a claim, graded honestly against the evidence, not a registry beside the ledger; the essays are founding inputs and their propositions enter as claims. What the founder believed ahead of the evidence, and what he staked it on, belongs in the append-only changelog (AGENTS.md §7, amendment of 2026-09-01). The conjecture carried no evidential weight, so no standing changes; the file's text remains in git history."
