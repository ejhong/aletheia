- date: "2026-08-23"
  change: >-
    Site v1.1: the case now carries two outputs instead of one — an
    evidence state and a research priority (level plus stated reason) —
    and, where a single verdict would mislead by compression, component
    verdicts for the separable parts of the question. Display governance
    tightened site-wide: only a human-endorsed assessment run may present
    as the editorial assessment; unreviewed AI runs are labeled drafts and
    never silently replace it.
  reason: >-
    "Weak evidence, strong reason to investigate" is this site's signature
    category; a single verdict cannot express it. Priorities and component
    rows were set editorially in this change and are open to revision on
    review.
  actor: "Eugene (direction); applied by Fable (AI agent)"
  aiAssisted: true

- date: "2026-08-23"
  change: >-
    ORCH-C003 split. The former claim graded "well supported" a statement
    whose own summary conceded its universal quantifier was not
    established ("fully accounted for... without any quantum-coherent
    contribution"). C003 now carries only the narrow, well-evidenced core
    (classical pharmacology substantially accounts for anesthetic
    unconsciousness, with causal evidence for intravenous agents), and the
    exhaustive version is a new claim ORCH-C004, graded unresolved. The
    error was flagged independently by an external model review and by
    the 2026-08-23 multi-model assessment experiment, in which both
    role-conditioned advocate runs and two of five judges declined to
    endorse the compound wording.
  reason: >-
    Atomic-claims rule: a receptor-level result must not silently
    underwrite a universally quantified negative about consciousness.
  actor: "Eugene (direction); applied by Fable (AI agent)"
  aiAssisted: true

