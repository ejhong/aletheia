  change: "Corrections applied from PR #281 panel review (GPT-5.6 Sol seat: stale record locators in ORCH-R011 to ORCH-R015): ORCH-R011.summary — \"Randomized, blinded loss-of-righting-reflex dose–response in mice for spin-0 and spin-bearing xenon isotopes, run inside a controllable-field enclosure with arms at geomagnetic field, at a field an order of magnitude higher, and at a field about two orders above geomagnetic (i.e. above the upper limit of the field range recorded at ORCH-C102), with field strength logged and the predicted isotope ordering preregistered for each arm. Cheapest decisive discriminator in the case: a field dependence of the isotope effect would support the radical-pair mechanism at ORCH-C101 and is orthogonal to Orch OR, since no microtubule coherence is required; no field dependence at fields well above the model's stated agreement range would falsify the published fit and return the xenon anomaly to unexplained, further reducing what ORCH-C025 can do for ORCH-C002. My searches did not locate such an in vivo experiment; that is an unresolved retrieval question rather than a finding of absence.\" → \"Randomized, blinded loss-of-righting-reflex dose–response in mice for spin-0 and spin-bearing xenon isotopes, run inside a controllable-field enclosure with arms at geomagnetic field, at a field an order of magnitude higher, and at a field about two orders above geomagnetic (i.e. above the upper limit of the field range over which the published radical-pair fit holds (SRC-SMITH-2021)), with field strength logged and the predicted isotope ordering preregistered for each arm. Cheapest decisive discriminator in the case: a field dependence of the isotope effect would support the radical-pair mechanism proposed in SRC-SMITH-2021 and is orthogonal to Orch OR, since no microtubule coherence is required; no field dependence at fields well above the model's stated agreement range would falsify the published fit and return the xenon anomaly to unexplained, further reducing what ORCH-C025 can do for ORCH-C002. My searches did not locate such an in vivo experiment; that is an unresolved retrieval question rather than a finding of absence.\"; ORCH-R012.summary — \"Blinded in vitro and cell-culture comparison of microtubule density and polymerization kinetics under matched chemical concentrations of nuclear-spin-bearing 67Zn versus zero-spin zinc isotopes, crossed with pharmacological modulation of reactive-oxygen-species removal and with field-shielded versus geomagnetic conditions. An isotope difference at matched chemistry, and a field dependence that tracks it, would support the mechanism at ORCH-C103 and ORCH-C104 and give the 'same-direction stabilizer and destabilizer' result at ORCH-C024 a redox-mediated reading with its own predictions; a null on both would leave general cellular disruption as the better account of ORCH-C024 and would remove this rival from the anesthesia arm.\" → \"Blinded in vitro and cell-culture comparison of microtubule density and polymerization kinetics under matched chemical concentrations of nuclear-spin-bearing 67Zn versus zero-spin zinc isotopes, crossed with pharmacological modulation of reactive-oxygen-species removal and with field-shielded versus geomagnetic conditions. An isotope difference at matched chemistry, and a field dependence that tracks it, would support the mechanism at ORCH-C044 and its zinc-isotope prediction (SRC-ZADEHHAGHIGHI-2022) and give the 'same-direction stabilizer and destabilizer' result at ORCH-C024 a redox-mediated reading with its own predictions; a null on both would leave general cellular disruption as the better account of ORCH-C024 and would remove this rival from the anesthesia arm.\"; ORCH-R013.summary — \"From the published literature alone, compute whether the least-decoherence semiclassical construction recorded at ORCH-C109 — which reproduces the conjectured rate with the prefactor fixed — predicts spontaneous radiation and momentum diffusion at levels reached by the Gran Sasso search (ORCH-C031), the independent germanium search (ORCH-C106, ORCH-C107), and the LISA Pathfinder acceleration-noise bound (ORCH-C105); and whether its regularization scale can be pushed above the bounded values without altering the rate. If it is already excluded, the physics conjunct is refuted in every dynamics so far proposed for it and the escape at ORCH-E019 buys nothing; if it survives, the surviving parameter window should be stated numerically, which is what a decisive mesoscopic test (ORCH-R007) would then have to reach.\" → \"From the published literature alone, compute whether the least-decoherence semiclassical construction recorded at ORCH-C066 to ORCH-C068 — which reproduces the conjectured rate with the prefactor fixed — predicts spontaneous radiation and momentum diffusion at levels reached by the Gran Sasso search (ORCH-C031), the independent germanium search (ORCH-C047; its Diósi–Penrose reading at ORCH-E049), and the LISA Pathfinder acceleration-noise bound (ORCH-C046); and whether its regularization scale can be pushed above the bounded values without altering the rate. If it is already excluded, the physics conjunct is refuted in every dynamics so far proposed for it and the escape at ORCH-E019 buys nothing; if it survives, the surviving parameter window should be stated numerically, which is what a decisive mesoscopic test (ORCH-R007) would then have to reach.\"; ORCH-R014.summary — \"Ask the group that already has the machinery to extend its radiative-loss Lindblad treatment (ORCH-C112) to include solvent, ionic and vibrational baths at 310 K, and to publish, before any spectroscopy is run, the predicted dephasing time, coherence length and participating degrees of freedom, together with the value of a named density-matrix witness that would count as pass and the value that would count as fail. This is the pass/fail threshold the case's own audit found missing from the corpus (ORCH-E035, ORCH-E036), and it is the prior question to the expensive experiment at ORCH-R001: without it, any measured number can be absorbed either way.\" → \"Ask the group that already has the machinery to extend its radiative-loss Lindblad treatment (recorded at ORCH-E072 and ORCH-E073, SRC-GASSAB-2026) to include solvent, ionic and vibrational baths at 310 K, and to publish, before any spectroscopy is run, the predicted dephasing time, coherence length and participating degrees of freedom, together with the value of a named density-matrix witness that would count as pass and the value that would count as fail. This is the pass/fail threshold the case's own audit found missing from the corpus (ORCH-E035, ORCH-E036), and it is the prior question to the expensive experiment at ORCH-R001: without it, any measured number can be absorbed either way.\"; ORCH-R015.summary — \"Re-measure the tubulin-dimer versus taxol-stabilized-microtubule quantum yield in cuvette and integrating-sphere geometries, with independent turbidity measurement, inner-filter controls, matched buffers and a measured polymer fraction, at both 280 and 295 nm excitation. The target is to replace the bounded estimate at ORCH-C119 with a single value and to fix the sign at 295 nm (ORCH-C120), and to repeat the non-anesthetic additive control of ORCH-C121 alongside a convulsant and a hydrophobic nonimmobilizer. Until this is closed, an anesthetic potency series against this observable (ORCH-R002, ORCH-R009) risks measuring the scattering correction rather than the physics.\" → \"Re-measure the tubulin-dimer versus taxol-stabilized-microtubule quantum yield in cuvette and integrating-sphere geometries, with independent turbidity measurement, inner-filter controls, matched buffers and a measured polymer fraction, at both 280 and 295 nm excitation. The target is to replace the bounded estimate recorded at ORCH-E075 with a single value and to fix the sign at 295 nm (ORCH-E076 through ORCH-E079), and to repeat the non-anesthetic additive control reported in SRC-GASSAB-2026A alongside a convulsant and a hydrophobic nonimmobilizer. Until this is closed, an anesthetic potency series against this observable (ORCH-R002, ORCH-R009) risks measuring the scattering correction rather than the physics.\"."
