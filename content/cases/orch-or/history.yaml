# Change log. Corrections found during import are recorded individually
# rather than folded into a single "verified citations" line, because which
# citations failed and how is the useful information.

- date: "2026-08-22"
  change: >-
    Case created. Eighteen featured claims across three rungs — five
    attribution, four mechanism, nine observation — with twenty-nine evidence
    records, thirty sources, and eight research opportunities, drawn from the
    case editor's two essays ("Orch OR Ascending", April 2026, and "The Erdős Unit Distance
    Problem and Penrose Understanding", May 2026) and a commissioned
    deep-research report on the theory's claims, evidence, replication status,
    and experimental roadmap.
  reason: >-
    Orch OR is a case where the public argument and the evidential situation
    have come apart. The debate is still conducted as though the question were
    "can quantum effects survive in a warm wet brain," while the actual
    evidence has moved to a much narrower and more tractable gap. Mapping the
    rungs separately is the main contribution.
  actor: "Fable (AI agent) under Eugene (ejhong)"
  aiAssisted: true

- date: "2026-08-22"
  change: >-
    Verified all thirty sources independently before import — DOIs
    resolved through the Crossref API, abstracts and author lists read
    through PubMed, publisher pages, the arXiv API, or the official
    conference program. No citation was imported on the deep-research
    report's authority alone.
  reason: >-
    Deep-research reports fabricate and garble references, and this one
    supplied most of the case's raw material. Four discrepancies were found,
    which is roughly the rate that justifies the policy.
  actor: "Fable (AI agent)"
  aiAssisted: true

