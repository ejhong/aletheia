 computed in a Markovian radiative-loss model with no thermal bath, disorder suppressing long-range coherence, and a cross-lab quantum-yield experiment whose polymerization magnitude spans nearly an order of magnitude on the scattering correction, with free L-tryptophan quenching the same observable — a second instance of the ORCH-E003 specificity problem. The Kerskens–Pérez reply, which the report could not reach but whose text was supplied here, is added so that ORCH-C026 is no longer comment-without-reply. Candidates whose text was not shown (Turin 2014, the Bandyopadhyay-group Symmetry paper, arXiv:2512.15393, the radical-pair review PDF) stay out with routes. No edition candidate: nothing here removes the absence on which the verdict rests, and the new rival account is on the record for a later telling to weigh."
