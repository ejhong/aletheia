  change: >-
    Study ORCH-S002 collected: four rows, five findings, criteria hash 4fa792b878fa re-verified unchanged from the freeze. The pre-committed analysis code is published beside the study file. Four findings enter the ledger. ORCH-E037 (qualifies C025): the frozen identification-failure rule trips, so no spin p-value is reported as evidential — but the variance inflation factor is 3.25, below the threshold of 5, and what actually fails is the scaled condition number at 302.4, whose source is intercept-versus-mass rather than spin-versus-mass, because atomic mass varies by under 4 per cent. ORCH-E038 (supports C025, weak): descriptively, a spin step fits the four means far better than a linear mass trend, since the within-spin-class mass slopes are small and of opposite sign while the one-mass-unit step at the class boundary is 29 per cent atmosphere. ORCH-E039 (undermines C025): no replication, no extension, and no pre-2018 isotope-resolved report exists across 37 forward citations, 24 backward references, three preprint servers and two registries. ORCH-E040 (undermines C025): the reported dispersions are of unstated type and the headline xenon-alone values are calculated rather than measured.
  reason: >-
    Executing ORCH-R010 at desk cost, per the pre-registration that merged in PR #152. The freeze's own recorded expectation is scored in the findings as right on the verdict and wrong on the mechanism: it predicted spin/mass collinearity would defeat the regression, and the defeating collinearity turned out to be intercept/mass instead. Because the ill-conditioning has that source, the study can name the decisive missing experiment precisely — a spin-zero isotope lighter than 129, such as 124Xe or 126Xe, which the current design lacks entirely and which would separate "lighter is more potent" from "spinless is more potent" directly.
