# rather than folded into a single "verified citations" line, because which
# citations failed and how is the useful information.

- date: "2026-08-22"
  change: >-
    Case created. Eighteen featured claims across three rungs — five attribution, four mechanism, nine observation — with twenty-nine evidence records, thirty sources, and eight research opportunities, drawn from the case editor's two essays ("Orch OR Ascending", April 2026, and "The Erdős Unit Distance Problem and Penrose Understanding", May 2026) and a commissioned deep-research report on the theory's claims, evidence, replication status, and experimental roadmap.
