- date: "2026-08-22"
  change: >-
    CORRECTION recorded, not adopted as evidence: the primer states that
    anesthetics shorten delayed luminescence in tubulin while structurally
    similar non-anesthetics do not, attributing this to Zoghi et al. 2025.
    The full accessible abstract of that conference paper says nothing about
    anesthetics. The claim is therefore not carried anywhere in this case,
    and the discrepancy is recorded on both the source and evidence records.
  reason: >-
    This would have been a useful specificity result had it existed —
    precisely the kind of claim that is tempting to import on trust. If a
    fuller presentation contains it, it can be added when the document is in
    hand.
  actor: "Fable (AI agent)"
  aiAssisted: true

