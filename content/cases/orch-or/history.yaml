- date: "2026-08-22"
  change: >-
    Recorded as a substantive overstatement in the case editor's primer, and
    corrected in the case's assessment: the primer states that Hameroff's two
    2020 predictions "have been confirmed by multiple independent
    laboratories (Princeton, UCF, NIMS Japan, and Wellesley)." The
    anesthesia-potency prediction has not been independently confirmed. The
    two epothilone-B studies share a senior author and research program, and
    the one genuinely independent stabilizer study (Li et al. 2025, Mass
    General) found the effect running the opposite direction.
  reason: >-
    The editor's own essay is the article's backbone, so its central
    empirical overstatement had to be handled explicitly rather than
    inherited. Independence of replication is the specific thing this case
    tracks most carefully.
  actor: "Fable (AI agent) under Eugene (ejhong)"
  aiAssisted: true

- date: "2026-08-22"
  change: >-
    Added the non-computability theme covering Penrose's Gödelian motivation
    and the recent AI-mathematics results offered against it, at the case
    editor's request. Scoped explicitly to the motivation rung: ORCH-C040 and
    ORCH-C041 are assessed as low-diagnosticity for the headline thesis, and
    both claims state that neither refutation nor vindication would move the
    microtubule, anesthesia, or collapse claims.
  reason: >-
    Critics present AI mathematical performance as refuting Orch OR and
    proponents treat the Gödel argument as supporting it. Both inferences
    skip a rung. Making the scoping visible in the ladder is more useful than
    adjudicating the philosophy.
  actor: "Fable (AI agent) under Eugene (ejhong)"
  aiAssisted: true

