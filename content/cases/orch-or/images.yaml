# One generated cover (editorial artwork, never evidence) and two real
# Commons plates. Licenses and credits were auto-filled from the Commons API
# by scripts/add-commons-image.mjs, which refuses files whose license does not
# permit reuse; both are CC BY-SA 4.0.
#
# Note on what the plates are: both are structural renderings derived from
# crystallographic and cryo-EM data, not photographs or micrographs. The
# `depicts` fields say so, because a reader should not mistake a model of a
# protein for an image of one.

- id: IMG-ORCHOR-COVER
  role: cover
  file: /images/cases/orch-or/cover.jpg
  alt: >-
    Hand-tinted engraving in muted violet-grey: a robed figure sleeps while
    an antique-gold shaft of light falls from a brain and a microtubule
    lattice above, with a faceted polyhedron and a stoppered flask nearby.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-22"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph,
    chromolithograph plate from a vintage natural-history atlas. An
    allegorical emblem for a case titled "Collapse, Not Computation?" in the
    domain of Neuroscience · Quantum biology · Anesthesiology · Foundations of
    physics: a symbolic, typological composition suggesting the question — Do
    conscious moments occur when quantum states orchestrated in neuronal
    microtubules reach a gravitational collapse threshold — and does anesthesia
    work by breaking them? — without depicting any real site, artifact, or
    dataset as documentation. Fine copperplate cross-hatching and stipple
    engraving beneath soft, translucent hand-applied watercolor washes. Full
    color in subdued antique mineral pigments — muted violet-grey and indigo
    forms, one antique-gold shaft of light — over warm-black ink linework on
    aged warm cream paper (#f6f1e8). Colors muted and slightly faded as if
    printed in 1870; never saturated modern digital color, no gradients, no
    glow. Darwin-era natural-history journal plate aesthetic, generous plain
    paper margins, quiet composition. Absolutely no text, no labels, no
    captions, no border frame lines. Unmistakably a hand-tinted engraving —
    stylized editorial artwork, not photorealistic, no photograph.
  claimIds: []

- id: IMG-ORCHOR-P01
  role: plate
  file: /images/cases/orch-or/plates/tubulin-dimer-1jff.png
  alt: >-
    Ribbon diagram of the tubulin alpha-beta dimer, the lower subunit in gold
    and the upper in red, each shown with a bound nucleotide at its interface:
    GTP in the alpha subunit and GDP in the beta subunit.
  source: commons
  license: "CC BY-SA 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/4.0"
  credit: "Thomas Splettstoesser (www.scistyle.com), via Wikimedia Commons"
  plateNumber: 1
  mediaType: "structural rendering"
  depicts: >-
    A molecular ribbon rendering of the tubulin αβ heterodimer, generated from
    Protein Data Bank entry 1JFF, with the bound GTP and GDP nucleotides
    labeled. This is a structural model derived from diffraction data, not a
    micrograph. The dimer is the repeating unit of the microtubule lattice and
    is roughly 8 nm along its long axis — the scale at which the electronic
    energy diffusion of ORCH-C020 was measured.
  provenance:
    photographer: "Thomas Splettstoesser (www.scistyle.com)"
    date: "2015-06-16"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Tubulin_dimer_1JFF.png"
    originalTitle: "File:Tubulin dimer 1JFF.png"
  claimIds: [ORCH-C020, ORCH-C013]

- id: IMG-ORCHOR-P02
  role: plate
  file: /images/cases/orch-or/plates/fragment-of-sus-scrofa-microtubule-stabilized-with-taxol-and.jpg
  alt: >-
    Composite scientific figure. Top: two rendered views of a microtubule wall
    fragment, one marked as about 24 nanometres across and one showing the
    lattice seam. Middle left: a schematic of a 13-protofilament microtubule
    with numbered protofilaments and tubulin dimers adding at the plus end.
    Middle right: alpha- and beta-tubulin with the peloruside A and taxol
    binding sites arrowed. Bottom: a stabilized protofilament labelled "no
    depolymerization" beside a normal one that depolymerizes, and the chemical
    structures of peloruside A and taxol.
  source: commons
  license: "CC BY-SA 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/4.0"
  credit: "Ykust, via Wikimedia Commons"
  plateNumber: 2
  mediaType: "composite structural figure"
  depicts: >-
    A composite figure of microtubule architecture and stabilizer binding,
    built from structural data on the pig (Sus scrofa) microtubule: the
    approximately 24 nm wall fragment and lattice seam, the 13-protofilament
    arrangement with dimers adding at the plus end, the taxol and peloruside A
    binding sites on β-tubulin, and the contrast between a stabilized
    protofilament that does not depolymerize and a normal one that does. These
    are renderings and schematics from structural data, not micrographs. Taxol
    (paclitaxel) is one of the four microtubule-modulating drugs whose effects
    on anesthetic sensitivity are recorded at ORCH-C024.
  provenance:
    photographer: "Ykust"
    date: "2023-11-27"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Fragment_of_Sus_scrofa_microtubule_stabilized_with_taxol_and_peloruside.jpg"
    originalTitle: "File:Fragment of Sus scrofa microtubule stabilized with taxol and peloruside.jpg"
  claimIds: [ORCH-C024, ORCH-C012, ORCH-C013]
