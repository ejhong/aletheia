# Research agenda, adapted from the deep-research report's experimental
# roadmap. Ordered by information gain per unit effort rather than by
# ambition. Two properties were required of every entry: it must be runnable
# by a laboratory with no commitment to Orch OR, and it must have a
# prespecifiable negative outcome. Anything that could only confirm was left
# out.

- id: ORCH-R001
  title: "Measure a coherence witness in physiological microtubules at 37 °C"
  summary: >-
    The measurement the field has been arguing about for twenty-five years
    without making. Use 2D electronic spectroscopy or photon-echo methods to
    quantify a defined density-matrix observable — dephasing time, coherence
    length — in polymerized microtubules under physiological temperature and
    ionic strength. Run the comparison series that makes the number
    interpretable: purified tubulin, polymerized microtubules, microtubules
    with physiological MAPs bound, crowded cytosol-like solution, and if
    feasible isolated axons. Include isotope substitution, a temperature
    series, and denatured-protein and disorder controls to separate electronic
    from vibrational coherence. Publish the target threshold before
    collecting data.
  claimIds: [ORCH-C010, ORCH-C013, ORCH-C001]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Decisive either way, and the only entry here that is. Every argument on
    this rung currently runs on two calculations that disagree by seven to
    eight orders of magnitude, neither anchored to a measurement. A clean
    null at physiological conditions would come close to settling the
    biological half of Orch OR negatively; a positive result at the required
    timescale would be a landmark in biophysics regardless of what anyone
    concludes about consciousness. This is the highest-value experiment in
    the case and it needs an ultrafast spectroscopy group, not a
    consciousness researcher.

- id: ORCH-R002
  title: "Anesthetic potency series against a microtubule optical observable, with the controls that matter"
  summary: >-
    Extend the Kalra protocol from two agents to a prospective series of at
    least eight, spanning volatile agents, intravenous agents, and xenon,
    with the controls whose absence currently sinks the specificity argument:
    nonimmobilizers (F6, F8), the convulsant picrotoxin, and hydrophobic
    non-anesthetics matched for lipid solubility. Measure free aqueous
    concentration rather than nominal dose. Preregister the predicted
    correlation between clinical potency and suppression of the observable —
    Craddock et al. 2017 already stated it, so the prediction exists in the
    literature and can be tested prospectively rather than fitted after.
  claimIds: [ORCH-C011, ORCH-C002, ORCH-C020]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Directly resolves the objection that currently does the most damage to
    the anesthesia arm: in the flagship experiment, picrotoxin — a
    convulsant — affected the assay comparably to the anesthetics. If potency
    correlation appears across a proper series with nonimmobilizers behaving
    as they should, the microtubule anesthesia hypothesis becomes serious
    science. If nonimmobilizers and hydrophobic non-anesthetics suppress the
    signal just as well, the assay is measuring general pharmacological
    perturbability and this line closes.

- id: ORCH-R003
  title: "Tubulin anesthetic-pocket knock-in mouse"
  summary: >-
    Do for tubulin what Jurd et al. did for the GABA_A β3 subunit. Use the
    Emerson et al. photolabeling data to define the anesthetic binding pocket
    on β-tubulin, then engineer a knock-in that abolishes anesthetic binding
    while preserving polymerization dynamics, axonal transport, and viability.
    Test whether behavioral anesthetic sensitivity and the anesthetic-induced
    photophysical change move together. Include the essential negative
    control: verify baseline GABA_A responses are unchanged, so any effect
    cannot be attributed to receptor pharmacology.
  claimIds: [ORCH-C002, ORCH-C011, ORCH-C012, ORCH-C003]
  track: small_grant
  effortTier: lab
  informationGain: >-
    The only design in this agenda that could give the microtubule hypothesis
    causal evidence of the same quality the conventional account already
    has — which is precisely the asymmetry that currently decides the
    anesthesia comparison. Co-segregation of anesthetic resistance with loss
    of the optical effect, at unchanged receptor function, would be very hard
    to explain conventionally. Unchanged anesthesia despite abolished tubulin
    binding would substantially refute the strong claim. Expensive and slow,
    but this is the experiment that would end the argument.

- id: ORCH-R004
  title: "Preregistered multicenter replication of the epothilone anesthesia experiments"
  summary: >-
    Resolve the flat contradiction between the Wellesley epothilone-B results
    and the Massachusetts General epothilone-D and vinblastine results.
    Test epothilone B and D head-to-head, acute and chronic regimens, in the
    same laboratories under one protocol: randomized counterbalanced
    vehicle/drug crossover, both sexes, full LORR concentration–response
    curves plus MAC rather than latency at a single concentration, measured
    brain drug concentration, and blood-gas monitoring given the documented
    pH and CO₂ changes. Preregister a prediction about which manipulations
    should raise and which should lower potency.
  claimIds: [ORCH-C012, ORCH-C023, ORCH-C024]
  track: either
  effortTier: lab
  informationGain: >-
    Two independent laboratories currently report microtubule stabilization
    moving anesthetic sensitivity in opposite directions, and a destabilizer
    moving it the same way as a stabilizer. Until that is sorted out, no
    inference from this literature is safe in either direction. The
    preregistered directional prediction is the load-bearing part: it forces
    the hypothesis to commit in advance, which is what would convert this
    line from a set of accommodatable results into a test.

- id: ORCH-R005
  title: "Independent replication of the Bandyopadhyay resonance measurements"
  summary: >-
    Have a laboratory outside the Bandyopadhyay lineage attempt the
    triplet-of-triplet resonance measurements on tubulin, microtubules, and
    neuronal preparations, with published protocols, raw data, and blinded
    analysis. This is a replication study rather than a new experiment, and
    it is overdue: the group's distinctive results have stood unreplicated
    for over a decade, including the 2013 report of 100-microsecond coherence
    in single microtubules at warm temperature.
  claimIds: [ORCH-C022, ORCH-C013]
  track: publication_prize
  effortTier: lab
  informationGain: >-
    Resolves the field's largest replication gap at modest cost. A successful
    replication would establish an unusual scale-free physical property of
    neural structures worth investigating on its own terms; a failure would
    remove a frequently-cited pillar from the proponent case. The comparison
    the case editor's own primer draws is the right one: the photosynthetic
    coherence results of 2007 were replicated many times over and founded a
    field. Thirteen years without replication is itself informative.

- id: ORCH-R006
  title: "Validate the zero-quantum-coherence brain protocol against known ground truth"
  summary: >-
    Before interpreting consciousness correlations, establish what the
    Kerskens protocol actually witnesses. Run it on engineered phantoms with
    known coupling structure, then ex vivo tissue, then living brain, testing
    specifically whether the classical intermolecular multiple-quantum-
    coherence mechanism Warren proposes can reproduce the reported signals.
    Have an independent group implement the pulse sequence and signal
    processing from the published description. Only then test whether the
    signal depends on microtubule integrity — which is the step that would
    connect this line to Orch OR at all, since the original experiment does
    not.
  claimIds: [ORCH-C026, ORCH-C001]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Highest-variance item on the agenda. Validated non-classical function in
    a living human brain would be among the most important results in
    neuroscience, independent of Orch OR; a demonstration that classical
    multi-compartment effects reproduce the signal would close a line that is
    currently generating strong public claims on contested evidence. Either
    outcome is worth having, and the ordering matters — phantom validation
    first, consciousness correlation last.

- id: ORCH-R007
  title: "Test the ℏ/E_G collapse scaling in mesoscopic superpositions"
  summary: >-
    Test Penrose's collapse criterion directly rather than testing a
    stochastic completion of it. Using levitated nanoparticles,
    nanomechanical resonators, or the Bose–Einstein condensate scheme of
    Howl, Penrose & Fuentes, vary mass and separation to determine whether
    collapse lifetime scales as ℏ/E_G, with environmental decoherence
    independently characterized. The point is to measure the relation the
    theory actually asserts — which the Gran Sasso experiment, for all its
    quality, did not.
  claimIds: [ORCH-C030, ORCH-C031, ORCH-C001]
  track: either
  effortTier: lab
  informationGain: >-
    Tests one of the two conjuncts of the headline thesis on a track with no
    biology in it, and would be pursued by quantum-gravity groups for their
    own reasons — the cleanest separation of concerns available in this case.
    It would also close the escape route that currently keeps ORCH-C030
    unresolved: Penrose OR survives Gran Sasso by not being the model that
    was tested, and this measures the criterion itself. Scaling is the
    acknowledged obstacle; the required regime is beyond current
    capabilities.

- id: ORCH-R008
  title: "Desk study: extract a falsifiable quantitative specification from the Orch OR literature"
  summary: >-
    A literature-only exercise with an unusually high ratio of value to cost:
    read the Orch OR corpus and determine what, if anything, it commits to
    numerically — required coherence time, coherence length, number of
    participating tubulins, entanglement structure, predicted anesthetic
    potency correlation coefficient. Where the literature is silent,
    document the silence. Where proponents have given numbers, collect them
    and check whether they are mutually consistent and whether the 1996
    conformational-qubit formulation and the later collective-dipole
    formulation make the same demands.
  claimIds: [ORCH-C001, ORCH-C010, ORCH-C002]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Addresses the defect that makes every other item on this agenda harder to
    interpret: without a published threshold, no measurement can count as
    pass or fail, and each new photophysics result gets absorbed rather than
    scored. Cheap, needs no laboratory, and would either produce the
    specification the field lacks or document that the theory does not
    currently have one — which is itself the most useful finding available at
    desk cost.
