  title: Zinc-isotope and ROS-modulation test of the radical-pair route to microtubule density
  summary: Blinded in vitro and cell-culture comparison of microtubule density and polymerization kinetics under matched chemical concentrations of nuclear-spin-bearing 67Zn versus zero-spin zinc isotopes, crossed with pharmacological modulation of reactive-oxygen-species removal and with field-shielded versus geomagnetic conditions. An isotope difference at matched chemistry, and a field dependence that tracks it, would support the mechanism at ORCH-C044 and its zinc-isotope prediction (SRC-ZADEHHAGHIGHI-2022) and give the 'same-direction stabilizer and destabilizer' result at ORCH-C024 a redox-mediated reading with its own predictions; a null on both would leave general cellular disruption as the better account of ORCH-C024 and would remove this rival from the anesthesia arm.
