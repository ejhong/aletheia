- id: ORCH-R015
  title: Close the scattering ambiguity in the microtubule quantum-yield observable before any potency series
  summary: Re-measure the tubulin-dimer versus taxol-stabilized-microtubule quantum yield in cuvette and integrating-sphere geometries, with independent turbidity measurement, inner-filter controls, matched buffers and a measured polymer fraction, at both 280 and 295 nm excitation. The target is to replace the bounded estimate recorded at ORCH-E075 with a single value and to fix the sign at 295 nm (ORCH-E076 through ORCH-E079), and to repeat the non-anesthetic additive control reported in SRC-GASSAB-2026A alongside a convulsant and a hydrophobic nonimmobilizer. Until this is closed, an anesthetic potency series against this observable (ORCH-R002, ORCH-R009) risks measuring the scattering correction rather than the physics.
  claimIds:
    - ORCH-C021
    - ORCH-C011
  track: either
  effortTier: lab
  informationGain: Makes the collective-optics observable metrologically stable enough that a preregistered anesthetic potency correlation against it could count as pass or fail.
