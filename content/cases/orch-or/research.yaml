- id: ORCH-R013
  title: "Desk audit: is the dynamics that reproduces ħ/E_Δ already excluded by the bounded channels?"
  summary: From the published literature alone, compute whether the least-decoherence semiclassical construction recorded at ORCH-C066 to ORCH-C068 — which reproduces the conjectured rate with the prefactor fixed — predicts spontaneous radiation and momentum diffusion at levels reached by the Gran Sasso search (ORCH-C031), the independent germanium search (ORCH-C047; its Diósi–Penrose reading at ORCH-E049), and the LISA Pathfinder acceleration-noise bound (ORCH-C046); and whether its regularization scale can be pushed above the bounded values without altering the rate. If it is already excluded, the physics conjunct is refuted in every dynamics so far proposed for it and the escape at ORCH-E019 buys nothing; if it survives, the surviving parameter window should be stated numerically, which is what a decisive mesoscopic test (ORCH-R007) would then have to reach.
  claimIds:
    - ORCH-C030
    - ORCH-C031
    - ORCH-C046
    - ORCH-C047
  track: publication_prize
  effortTier: desk
  informationGain: "Prices the under-specification escape precisely: either every proposed dynamics for the Penrose rate is bounded, or a stated surviving window becomes the target for the next experiment."
