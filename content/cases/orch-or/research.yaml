- id: ORCH-R014
  title: Publish, in advance, a 310 K thermal-bath dephasing prediction for the same 1JFF tryptophan geometry
  summary: "Ask the group that already has the machinery to extend its radiative-loss Lindblad treatment (recorded at ORCH-E072 and ORCH-E073, SRC-GASSAB-2026) to include solvent, ionic and vibrational baths at 310 K, and to publish, before any spectroscopy is run, the predicted dephasing time, coherence length and participating degrees of freedom, together with the value of a named density-matrix witness that would count as pass and the value that would count as fail. This is the pass/fail threshold the case's own audit found missing from the corpus (ORCH-E035, ORCH-E036), and it is the prior question to the expensive experiment at ORCH-R001: without it, any measured number can be absorbed either way."
  claimIds:
