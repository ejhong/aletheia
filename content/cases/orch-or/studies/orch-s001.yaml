# Study freeze — pre-registration only (two-PR discipline; see the
# Studies entry in docs/DECISIONS.md). Zero rows by design: the criteria
# below are judged before anyone knows what the data will say, and any
# later edit to them fails the build. Collection follows in a second PR.
id: ORCH-S001
title: The quantitative commitments of the Orch OR literature
question: What numerical commitments does the Orch OR literature actually
  make — collapse/integration times, gravitational self-energy configurations,
  participating tubulin counts, required versus estimated coherence times,
  oscillation frequencies, predicted quantitative relations — who supplied
  each number, on what stated basis, and do the 1996 conformational-qubit
  and the 2014 collective-dipole formulations make mutually consistent
  demands?
researchIds:
  - ORCH-R008
claimIds:
  - ORCH-C001
  - ORCH-C010
  - ORCH-C002
criteria:
  frozenOn: 2026-08-26
  inclusion:
    - Publications 1994-2026 by Orch OR's proponents (Penrose, Hameroff, and
      coauthors) that state a quantitative parameter of the proposed
      mechanism — collapse or integration time, gravitational self-energy
      (E_G) configuration such as superposed mass and separation, number of
      participating tubulins or neurons, coherence time required or claimed
      available, oscillation or beat frequency, or a predicted quantitative
      relation (e.g. an anesthetic potency correlation).
    - Critique or reanalysis papers that recompute or quantitatively evaluate
      one of those committed quantities (e.g. decoherence-time estimates,
      feasibility calculations, parameter-space constraints engaging Orch
      OR's stated scenarios) — entering under identical rules, tagged by
      side.
    - Experimental papers enter only where a specification paper invokes
      their numbers as meeting or setting a requirement; the row records the
      invocation, tagged as measurement-invoked, and grades nothing about
      the measurement itself.
    - Refereed publications enter as full rows; books and arXiv-only or
      otherwise unrefereed items enter flagged, never silently mixed.
  exclusion:
    - Qualitative statements of the theory with no number attached (context,
      not rows); documented silences are findings, not rows.
    - Popular accounts, talks, interviews, and commentary without new
      quantitative content.
    - Animal and behavioral anesthesia experiments (they test the theory but
      specify none of its parameters).
    - Bounds on generic collapse models (GRW, CSL) that do not engage Orch
      OR's committed parameters or scenarios.
    - Secondary summaries restating another included paper's numbers without
      new quantitative content (§3.10 — one specification is one row, not
      many).
  searchProtocol: "Run only after this freeze, by the executing agent's web
    search plus direct retrieval of primary documents (arXiv, publisher DOI
    resolution, PubMed Central); deep-research assistants not used. Literal
    queries: [Orch OR quantitative requirements coherence time]; [Hameroff
    Penrose 1996 orchestrated reduction microtubules tubulins 25 ms 500 ms];
    [orchestrated objective reduction gravitational self-energy E_G tubulin
    number]; [Tegmark importance quantum decoherence brain processes];
    [Hagan Hameroff Tuszynski decoherence biological feasibility
    recalculation]; [Hameroff Penrose 2014 review Orch OR beat frequencies
    EEG megahertz]; [Craddock anesthetic terahertz oscillations tubulin
    clinical potency correlation]; [Hameroff 1998 Orch OR testable
    predictions]; [orchestrated objective reduction not biologically
    feasible]; [Orch OR Diosi Penrose spontaneous radiation underground
    constraint tubulin scenarios]. Per-candidate follow-up: resolve the
    DOI or arXiv identifier to the primary document; every cell is verified
    against the primary document before entering the table; searches that
    return nothing are reported as failed searches (§3.11)."
