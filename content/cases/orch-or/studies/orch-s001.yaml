method: "One row per (publication, parameter) pair. Each row quotes the
  paper's stated value with an exact locator (page, section, table, or
  equation) in the row citation; the stated-as column records whether the
  number is a requirement, an estimate, an invoked measurement, an
  assumption, or a prediction — taken from the paper's own wording, never
  inferred (§3.9). The formulation column ties each number to the 1996
  conformational-qubit formulation, the 2014 collective-dipole formulation,
  or both, so the consistency question the study exists to answer is
  answerable from the table. Cross-paper comparisons are recorded as rows
  only where a paper itself makes the comparison; the study's own
  consistency assessment appears in the findings, in plain language, with
  no invented precision (§3.13). Parameters ORCH-R008 names that the corpus
  never fixes — coherence length, entanglement structure, a numerical
  potency correlation coefficient — are documented as silences in the
  findings (§3.11). Proponent and critique rows are graded by identical
  rules. Either outcome publishes: a specification the field can test, or
  a documented absence of one, which ORCH-R008 notes is itself the most
  useful finding available at desk cost."
columns:
  - publication
  - side
  - formulation
  - parameter
  - stated value
  - stated as
  - stated basis
  - notes
rows:
  - cells:
      publication: Penrose 1994, Shadows of the Mind (book)
      side: proponent
      formulation: both
      parameter: collapse-time criterion
      stated value: >-
        Objective reduction occurs on a timescale set by the gravitational
        self-energy of the superposition difference — the criterion the 1996
        papers write as E = hbar/T and later papers as tau ~ hbar/E_G.
      stated as: requirement (theoretical criterion)
      stated basis: theoretical proposal (quantum gravity)
      notes: >-
        Book not retrieved under the frozen protocol; the criterion is quoted
        here as restated verbatim in Hameroff & Penrose 1996 (verified row
        below), and the locator to the book itself is unverified.
    citation:
      text: "Penrose, Shadows of the Mind, Oxford University Press, 1994, Chapter 6"
      verification: unverified
  - cells:
      publication: Hameroff & Penrose 1996 (Math. Comput. Simulation 40)
      side: proponent
      formulation: 1996 conformational-qubit
      parameter: preconscious integration time T
      stated value: >-
        "We estimate T the coherence time from research by Libet and others
        ... to be about 500 ms ... Hence T = 500 ms (half second) seems
        appropriate from experimental results for at least some functionally
        significant transitions."
      stated as: estimate (input assumption)
      stated basis: cited neurophysiology (Libet et al.; 100-200 ms estimates also noted)
      notes: The 25 ms gamma-synchrony variant is introduced in the 1996-1998 companions.
    citation:
      text: "Hameroff & Penrose, 'Orchestrated reduction of quantum coherence in brain microtubules', Math. Comput. Simulation 40 (1996) 453-480"
      doi: "10.1016/0378-4754(96)80476-9"
      url: "https://www.alice.id.tue.nl/references/hameroff-penrose-1996.pdf"
      locator: "Section 5.1"
      verification: ai_verified
  - cells:
      publication: Hameroff & Penrose 1996 (Math. Comput. Simulation 40)
      side: proponent
      formulation: 1996 conformational-qubit
      parameter: tubulin superposition displacement r
      stated value: >-
        "We assume the tubulin conformational movement displaces its mass by a
        distance r which is 1/10 the 2 nm radius of the tubulin monomer, or
        0.2 nm."
      stated as: assumption
      stated basis: stated without derivation
      notes: >-
        This is the displacement the 2014 revision retires — the revised
        geometry keeps only femtometer-scale nuclear separation (see the 2014
        rows).
    citation:
      text: "Hameroff & Penrose, Math. Comput. Simulation 40 (1996) 453-480"
      doi: "10.1016/0378-4754(96)80476-9"
      url: "https://www.alice.id.tue.nl/references/hameroff-penrose-1996.pdf"
      locator: "Section 5.1"
      verification: ai_verified
  - cells:
      publication: Hameroff & Penrose 1996 (Math. Comput. Simulation 40)
      side: proponent
      formulation: 1996 conformational-qubit
      parameter: required tubulins n_t for T = 500 ms
      stated value: >-
        Three mass-distribution treatments (Fig. 6) — as protein spheres:
        "6 x 10^13 tubulins"; as granular arrays of (carbon) atomic nuclei
        (nucleus radius 2.5 fermi): "~10^9 tubulins"; as granular arrays of
        nucleons: "5 x 10^9 tubulins".
      stated as: estimate (derived)
      stated basis: E = hbar/T in absolute units, G = 1, tubulin = 110,000 nucleons
      notes: >-
        The carbon-nuclei treatment (highest E_G per tubulin, fewest tubulins)
        is the one all later papers carry forward.
    citation:
      text: "Hameroff & Penrose, Math. Comput. Simulation 40 (1996) 453-480"
      doi: "10.1016/0378-4754(96)80476-9"
      url: "https://www.alice.id.tue.nl/references/hameroff-penrose-1996.pdf"
      locator: "Sections 5.1.1-5.1.3 and Fig. 6"
      verification: ai_verified
  - cells:
      publication: Hameroff & Penrose 1996 (J. Consciousness Studies 3)
      side: proponent
      formulation: 1996 conformational-qubit
      parameter: required tubulins n_t for T = 500 ms
      stated value: >-
        "For T = 500 msec, we get a rough estimate of 10^9 tubulins required
        for Orch OR."
      stated as: estimate (derived)
      stated basis: same calculation as the Math. Comput. Simulation companion
      notes: Companion statement of the same specification.
    citation:
      text: "Hameroff & Penrose, 'Conscious events as orchestrated space-time selections', J. Consciousness Studies 3(1) (1996) 36-53; archived author copy"
      url: "https://web.archive.org/web/20010405084240/www.consciousness.arizona.edu/hameroff/penrose1.html"
      locator: "section 'The size of the conscious event' (archived text)"
      verification: ai_verified
    independenceNote: >-
      Same authors, same calculation, same year as the Math. Comput.
      Simulation paper — one specification published twice, counted once
      for any corroboration purpose.
  - cells:
      publication: Hameroff 1998 (Phil. Trans. R. Soc. A 356)
      side: proponent
      formulation: 1996 conformational-qubit
      parameter: required tubulins for faster events; event energy
      stated value: >-
        "For T = 25 ms (e.g. 40 Hz oscillations), Nt = 2 x 10^10 tubulins"
        (Fig. 7 caption); 5 x 10^9 tubulins for 100 ms appears in the same
        scheme; the superposed energy for one proposed 25 ms Orch OR event is
        "only 10^-28 J, or 10^-10 eV".
      stated as: estimate (derived)
      stated basis: same E = hbar/T scaling as 1996
      notes: >-
        Also states the timescale menu explicitly — 25 ms (40 Hz), 100 ms
        (EEG alpha), 500 ms (Libet's preconscious threshold). Appendix B
        lists the paper's testable predictions.
    citation:
      text: "Hameroff, 'Quantum computation in brain microtubules? The Penrose-Hameroff Orch OR model of consciousness', Phil. Trans. R. Soc. A 356 (1998) 1869-1896"
      doi: "10.1098/rsta.1998.0254"
      url: "https://www.alice.id.tue.nl/references/hameroff-1998.pdf"
      locator: "Fig. 7 caption and surrounding text"
      verification: ai_verified
    independenceNote: >-
      Same authorial lineage as the 1996 papers; arithmetic continuation of
      the same specification, not independent corroboration.
  - cells:
      publication: Hameroff 1998 (Phil. Trans. R. Soc. A 356)
      side: proponent
      formulation: 1996 conformational-qubit
      parameter: clocking frequency and computational capacity
      stated value: >-
        "Coherent excitation frequencies on the order of 10^9-10^11 Hz"
        (Frohlich excitations as the clocking mechanism); nanosecond
        switching in microtubule automata "predicts roughly 10^16 operations
        per second" per neuron, "about 10^27 brain operations per second".
      stated as: model assumption (frequency); capacity estimate (operations)
      stated basis: Frohlich coherent-pumping theory; automata simulations
      notes: >-
        The Frohlich mechanism these numbers assume is the specific target of
        the McKemmish/Reimers energetics critique rows below.
    citation:
      text: "Hameroff, Phil. Trans. R. Soc. A 356 (1998) 1869-1896"
      doi: "10.1098/rsta.1998.0254"
      url: "https://www.alice.id.tue.nl/references/hameroff-1998.pdf"
      locator: "microtubule-automata section (running text)"
      verification: ai_verified
  - cells:
      publication: Tegmark 2000 (Phys. Rev. E 61)
      side: critique
      formulation: n.a. (24 nm soliton/kink model)
      parameter: environmental decoherence time
      stated value: >-
        "The decoherence time scales (~10^-13 - 10^-20 s) are typically much
        shorter than the relevant dynamical time scales (~10^-3 - 10^-1 s),
        both for regular neuron firing and for kinklike polarization
        excitations in microtubules." Microtubule kink superposition
        decoheres in ~10^-13 s from the nearest ion alone.
      stated as: critique calculation
      stated basis: >-
        ion-scattering decoherence formulas applied to a kink of charge
        ~940 elementary charges on a D = 24 nm tube, superposed at separations
        much larger than D
      notes: >-
        Both Hagan et al. 2002 and the 2014 review state this model (24 nm
        soliton separation) is not the Orch OR superposition; Tegmark's
        published numbers are tabulated here as he stated them.
    citation:
      text: "Tegmark, 'Importance of quantum decoherence in brain processes', Phys. Rev. E 61 (2000) 4194-4206; kink-model details in the companion article 'Why the brain is probably not a quantum computer', Information Sciences (2000)"
      doi: "10.1103/PhysRevE.61.4194"
      url: "https://www.sciencedirect.com/science/article/pii/S0020025500000517"
      locator: "abstract; companion article Eq. (22) context"
      verification: ai_verified
  - cells:
      publication: Hagan, Hameroff & Tuszynski 2002 (Phys. Rev. E 65)
      side: proponent
      formulation: 1996 conformational-qubit (as defended)
      parameter: recalculated decoherence time
      stated value: >-
        "Recalculation after correcting Tegmark's equation for differences
        between his model and the 'Orch OR' model (superposition separation,
        charge vs. dipole, dielectric constant) lengthens the decoherence
        time to 10^-5 - 10^-4 s."
      stated as: recalculation (proponent-side estimate)
      stated basis: Tegmark's own formula with Orch OR stipulations substituted
      notes: >-
        Still two to three orders of magnitude short of the 25 ms exemplar,
        as the authors' conditional rows below acknowledge by seeking further
        screening mechanisms.
    citation:
      text: "Hagan, Hameroff & Tuszynski, 'Quantum computation in brain microtubules: Decoherence and biological feasibility', Phys. Rev. E 65 (2002) 061901"
      doi: "10.1103/PhysRevE.65.061901"
      url: "https://ar5iv.labs.arxiv.org/html/quant-ph/0005025"
      locator: "abstract (arXiv:quant-ph/0005025)"
      verification: ai_verified
  - cells:
      publication: Hagan, Hameroff & Tuszynski 2002 (Phys. Rev. E 65)
      side: proponent
      formulation: 1996 conformational-qubit (as defended)
      parameter: conditional decoherence time with screening
      stated value: >-
        With counterion Debye screening and actin-gel ordered water enlarging
        the decoherence-free zone by an order of magnitude: "a revised
        decoherence time for the microtubule bundle of 10^-2 - 10^-1 s."
      stated as: conditional estimate
      stated basis: >-
        assumed ordered-water/actin-gelation screening; metabolic pumping
        analogy to laser operation
      notes: >-
        This is the only proponent-side number in the corpus that reaches the
        physiological exemplar, and it is explicitly conditional on the
        gel-screening assumptions.
    citation:
      text: "Hagan, Hameroff & Tuszynski, Phys. Rev. E 65 (2002) 061901"
      doi: "10.1103/PhysRevE.65.061901"
      url: "https://ar5iv.labs.arxiv.org/html/quant-ph/0005025"
      locator: "abstract and gelation section (arXiv:quant-ph/0005025)"
      verification: ai_verified
  - cells:
      publication: McKemmish, Reimers, McKenzie, Mark & Hush 2009 (Phys. Rev. E 80)
      side: critique
      formulation: 1996 conformational-qubit
      parameter: feasibility of coherent conformational switching
      stated value: >-
        "It is shown that the tubulins do not possess essential properties
        required for the Orch OR proposal, as originally proposed, to hold
        ... no reformation of the proposal based on known physical paradigms
        could lead to quantum computing within microtubules."
      stated as: critique finding
      stated basis: >-
        experimental literature on microtubule assembly/dynamics; energetics
        of GTP-hydrolysis-driven conformational change; Frohlich-condensate
        analysis
      notes: >-
        The quantitative body sits behind the publisher paywall and was not
        retrieved under the protocol; the numerical content enters via the
        Reimers 2014 row and via the 2014 review's concession that
        GTP-driven synchronized oscillations "would be prohibitive in terms
        of energy requirements and heat produced".
    citation:
      text: "McKemmish et al., 'Penrose-Hameroff orchestrated objective-reduction proposal for human consciousness is not biologically feasible', Phys. Rev. E 80 (2009) 021912"
      doi: "10.1103/PhysRevE.80.021912"
      locator: "abstract"
      verification: ai_verified
  - cells:
      publication: Hameroff & Penrose 2014 (Phys. Life Rev. 11, review)
      side: proponent
      formulation: 2014 collective-dipole
      parameter: superposition separation geometry (revised)
      stated value: >-
        "The only tubulin conformational factor required in Orch OR is
        superposition separation at the level of atomic nuclei, e.g. 2.5
        Fermi length for carbon nuclei (2.5 femtometers) ... Tubulin
        switching in Orch OR requires neither GTP hydrolysis nor significant
        conformational changes, depending on collective London force dipoles,
        or magnetic spin dipoles in quantum channels of aromatic rings."
      stated as: requirement (revised specification)
      stated basis: reply to McKemmish et al.; Mossbauer-recoil nuclear displacement argument
      notes: >-
        Explicitly concedes the 2009 energetics critique of the earlier
        conformational mechanism and retires it — the 1996 papers' 0.2 nm
        displacement assumption is acknowledged as "admittedly, though
        unintentionally, misleading".
    citation:
      text: "Hameroff & Penrose, 'Consciousness in the universe: A review of the Orch OR theory', Phys. Life Rev. 11 (2014) 39-78"
      doi: "10.1016/j.plrev.2013.08.002"
      url: "https://captain-of-my-ship.com/wp-content/uploads/A_review_of_the_Orch_OR_theory.pdf"
      locator: "Section 5.6 (response to McKemmish et al.)"
      verification: ai_verified
  - cells:
      publication: Hameroff & Penrose 2014 (Phys. Life Rev. 11, review)
      side: proponent
      formulation: 2014 collective-dipole
      parameter: required tubulins and event energy for tau = 25 ms
      stated value: >-
        "With 2 x 10^10 tubulins for 25 ms Orch OR, EG would be roughly
        10^-10 eV (10^-29 joules)"; the relevant tau "has been assumed to
        correlate with physiological EEG parameters, i.e. 10 to several
        hundred milliseconds".
      stated as: estimate (derived) and input assumption (tau range)
      stated basis: tau = hbar/E_G with carbon-nucleus-radius separation
      notes: >-
        Arithmetically consistent with the 1996 numbers (500 ms x 10^9 =
        25 ms x 2 x 10^10); the carrier changed, the arithmetic did not.
    citation:
      text: "Hameroff & Penrose, Phys. Life Rev. 11 (2014) 39-78"
      doi: "10.1016/j.plrev.2013.08.002"
      url: "https://captain-of-my-ship.com/wp-content/uploads/A_review_of_the_Orch_OR_theory.pdf"
      locator: "Sections 5.5-5.6 and Fig. 11"
      verification: ai_verified
    independenceNote: >-
      Same authorial lineage as every proponent row above; internal
      consistency across the lineage is not independent corroboration.
  - cells:
      publication: Hameroff & Penrose 2014 (Phys. Life Rev. 11, review)
      side: proponent
      formulation: 2014 collective-dipole
      parameter: beat-frequency mechanism for EEG timescales
      stated value: >-
        Conscious moments are proposed as "beat frequencies |E1 - E2|/h" of
        faster microtubule vibrations: "'Normal' Orch OR conscious moments
        every 25 ms in '40 Hz' gamma synchrony ... every 12.5 ms in 80 Hz
        'high gamma' ... every 250 ms (4 Hz delta wave EEG)" (Fig. 11), with
        the underlying events possibly "on a faster timescale, for example in
        megahertz".
      stated as: proposal (mechanism revision)
      stated basis: superposition of nearly-degenerate stationary states; Bandyopadhyay resonances
      notes: >-
        Decouples the EEG-scale conscious-moment rate from the single-event
        coherence-time requirement — the required coherence time per event
        drops to the invoked-resonance timescales in the next row.
    citation:
      text: "Hameroff & Penrose, Phys. Life Rev. 11 (2014) 39-78"
      doi: "10.1016/j.plrev.2013.08.002"
      url: "https://captain-of-my-ship.com/wp-content/uploads/A_review_of_the_Orch_OR_theory.pdf"
      locator: "Section 5.5 and Fig. 11 (p. 64)"
      verification: ai_verified
  - cells:
      publication: Hameroff & Penrose 2014 (Phys. Life Rev. 11, review)
      side: measurement-invoked
      formulation: 2014 collective-dipole
      parameter: coherence times invoked from resonance measurements
      stated value: >-
        "Bandyopadhyay's group has found 10 kHz resonance, i.e. 10^-4 seconds
        coherence times"; megahertz resonance is read as "suggesting
        coherence times of 10^-7 s"; the resonances are reported "in
        gigahertz, megahertz and kilohertz ranges ... particularly prominent
        in low megahertz (e.g. 8.9 MHz)".
      stated as: invoked measurement, with the coherence-time reading being the review's inference
      stated basis: Sahu et al. 2013 conductance-resonance experiments (invoked)
      notes: >-
        The resonance-to-coherence-time step is the review's inference, not a
        stated result of the invoked paper (AGENTS.md 3.9). The primary
        measurement paper (Sahu et al., Biosens. Bioelectron. 47, 2013, doi
        10.1016/j.bios.2013.02.050) was not independently retrievable under
        the protocol, and ORCH-R005 records that these results have stood
        unreplicated outside the originating group.
    citation:
      text: "Hameroff & Penrose, Phys. Life Rev. 11 (2014) 39-78 (invoking Sahu et al. 2013)"
      doi: "10.1016/j.plrev.2013.08.002"
      url: "https://captain-of-my-ship.com/wp-content/uploads/A_review_of_the_Orch_OR_theory.pdf"
      locator: "Sections 4.5 and 5.6"
      verification: ai_verified
    independenceNote: >-
      The invoked measurements come from a single laboratory lineage
      (Bandyopadhyay group); the invocation adds no independent source.
  - cells:
      publication: Reimers, McKemmish, McKenzie, Mark & Hush 2014 (Phys. Life Rev. 11, comment)
      side: critique
      formulation: 2014 collective-dipole
      parameter: Frohlich-condensate coherence and electronic decoherence bounds
      stated value: >-
        "Significant classical effects of Frohlich condensation did not
        manifest unless the system was very far from thermal equilibrium,
        with component parts needing to be at temperatures in excess of
        500 K for room-temperature operation ... the observed decoherence
        times for quantum processes involving electronic motion are usually
        in the range of 10 fs to 30 ps. A qubit with dynamics even slightly
        coupled to electronic motion would not retain quantum coherence on
        the 25 ms timescale required for Orch OR."
      stated as: critique estimate
      stated basis: the authors' prior Frohlich-condensation analyses; observed electronic decoherence ranges
      notes: >-
        Also asserts the revised qubit list (London-force dipoles, magnetic
        spin dipoles, nuclear spins) is offered "without suggesting how any
        of these phenomena could in fact be used to make a relevant qubit".
        The same-issue Hameroff-Penrose reply redefines the qubit as
        oscillating London-force dipoles in gigahertz-to-kilohertz resonance
        rings whose interference beats give EEG rhythms.
    citation:
