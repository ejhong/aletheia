findings:
  - statement: "The frozen identification-failure rule TRIPS, so this study reports no spin
      p-value as evidential — but it trips for a reason the freeze did not anticipate.
      The variance inflation factor is 3.25, comfortably BELOW the pre-set threshold of
      5, so spin-versus-mass collinearity (r = -0.832) is real but not disabling: the
      study happens to place two isotopes on each side of the spin boundary, which is
      what makes the two hypotheses separable at all. What fails is the scaled
      design-matrix condition number, 302.4 against a threshold of 30, and its source is
      intercept-versus-mass, not spin-versus-mass. Atomic mass spans five units around
      131.5, under 4 per cent relative variation, so a linear mass term is barely
      distinguishable from a constant. That is why the mass coefficient is unstable
      (-0.43 with a standard error of 1.92) while the intercept carries a standard error
      of 254."
    evidenceId: ORCH-E037
  - statement: "Setting the frozen rule aside and describing what the four published means
      look like: a spin term fits them far better than a linear mass term. On the
