method: "Every included source yields one row per isotope arm. Extraction is
  performed twice in separate passes with the second pass blind to the first
  pass's numeric fields (the agent re-opens the source and re-reads the locus
  without consulting the prior row); mismatches are resolved by a third read and
  the discrepancy is logged. Independence: rows sharing a cohort_id (same
  animals, same experimental series, same institutional batch as stated in
  methods) are treated as one experiment; overlapping publications are collapsed
  to the most complete report and the collapse is recorded. Potency values are
  converted to a common scale as percent-atmosphere for 50% endpoint effect,
  with the conversion arithmetic shown per row; dispersions are propagated, and
  where only SEM and n are given, SD is reconstructed. Primary analysis:
  weighted least squares of potency on (a) spin-present indicator and (b) mass
  number, weights = inverse variance, run three ways — spin only, mass only,
  both. Pre-committed diagnostics: variance inflation factor, design-matrix
  condition number, and the correlation between the spin indicator and mass
  number across arms. Identification is declared FAILED if VIF > 5 or condition
  number > 30, in which case the study reports that the dataset cannot
  distinguish the hypotheses and refuses to report a spin p-value as evidential.
  Secondary: leave-one-isotope-out refits, a rank-order check (Spearman of
  potency against mass), and a sensitivity fit substituting nuclear spin quantum
  number I (0, 1/2, 3/2) for the binary indicator. If fewer than four
  independent isotope arms survive extraction, no regression is run and the
  study reports the tabulation plus an explicit statement of
  non-identifiability. All code, extracted table, and search log are published;
  the pre-committed expectation recorded in knownCandidates is scored as correct
  or incorrect in the abstract."
