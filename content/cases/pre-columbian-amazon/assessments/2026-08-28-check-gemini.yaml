  synthesis: "The scientific ledger on the pre-Columbian Amazon resolves centuries
    of polarization by structurally isolating the evidence into a heterogeneous
    mosaic. A compelling case for a heavily populated, extensively engineered
    Amazon is supported by incontrovertible physical evidence:
    canopy-penetrating LiDAR has uncovered hundreds of geometric earthworks with
    projections running into the tens of thousands (AMZ-E001), while regional
    excavations and geochronological dating confirm continuous, complex
    settlement systems overlapping the European contact horizon (AMZ-E004,
    AMZ-E017). The long-standing ecological objection that the basin could not
    support staple crops is dismantled by findings of intensive, year-round
    maize monoculture and hydraulic engineering in the Llanos de Mojos
    (AMZ-E014), alongside basin-wide traces of anthropogenic dark earths and
    domesticated tree clustering (AMZ-E012). Conversely, the strongest evidence
    for the \"sparse Amazon\" comes from massive site-distribution models and
    cumulative paleoecological sampling. Spatial analyses of over 7,300 sites
    overwhelmingly identify river proximity as the dominant predictor of
    settlement (AMZ-E010), while extensive soil coring across fourteen
    terra-firme regions consistently fails to detect signatures of large-scale
    agriculture, recurrent fire, or persistent clearing (AMZ-E011). Furthermore,
    the most spectacular demographic projections (into the multi-millions) are
    demonstrably fragile, resting heavily on togglable assumptions about
    simultaneous site occupation and household size (AMZ-E002), or relying on
    habitat-density methodologies later rejected by their own authors
    (AMZ-E009). The synthesis of these seemingly opposing datasets is a mosaic
    environment: densely populated, highly engineered corridors along major
    rivers and savannas, embedded within a vastly larger matrix of lightly
    touched wilderness. This resolves the historiographical debate around Gaspar
    de Carvajal's 1542 chronicle. Manuscript analysis separates his qualitative
    descriptions of bustling riverbanks from the wildly inflated warrior counts
    added in specific copyist lineages (AMZ-E005). Combined with documented
    post-contact population collapses of up to 88% due to disease and slaving
    (AMZ-E008), a localized, qualitative vindication of Carvajal emerges without
    requiring an impossible basin-wide ecumenopolis. The single evidence record
    whose removal would most alter this case is AMZ-E010 (McMichael et al.'s
    7,363-site analysis). Without its basin-wide statistical confirmation that
    interfluves were sparsely populated, the negative soil core data (AMZ-E011)
    could easily be dismissed as a spatial sampling error, and the temptation to
    extrapolate densely populated hotspots across the entire Amazon would be
    mathematically unchecked. The mosaic verdict survives without it, sustained
    by the core records, but its overarching structural limits would be severely
    weakened."
