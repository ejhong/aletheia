      modeled total of 24,000–30,000 earthworks based on block extrapolation.
      These figures are quoted verbatim in the evidence ledger. The main
      objection is that the total monument count is an extrapolation rather than
      a direct census, but the claim accurately characterizes it as such, so as
      stated it is established."
  - claimId: AMZ-C005
