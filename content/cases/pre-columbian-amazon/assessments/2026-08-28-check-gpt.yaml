  synthesis: >-
    The dossier makes a strong case against both extreme poles—pristine
    wilderness and a uniformly dense, basin-wide civilization—and converges on a
    heterogeneous mosaic: populous, engineered corridors embedded in a more
    lightly occupied forest matrix. That mosaic is anchored archaeologically by
    large earthwork and settlement systems in multiple regions (Aquiry:
    AMZ-C004; southern rim: AMZ-C006; Belterra, Marajó, Upper Xingu: AMZ-C011)
    and environmentally by clear evidence of intensive subsistence engineering
    in some areas (Casarabe maize monoculture, dark earths, raised fields:
    AMZ-C007, AMZ-C008). These records decisively falsify the old
    ecological-impossibility thesis: Amazonian landscapes could and did sustain
    substantial, sedentary, politically organized populations well before and
    into the contact era.

    Counterbalancing that, basin-scale distributional evidence shows that such
    intensively transformed landscapes were not everywhere. Site-distribution
    modeling over 7,363 locations identifies river distance as the dominant
    predictor, with interfluves markedly sparser (AMZ-C013), and a 14-region
    phytolith/charcoal synthesis finds little to no signal of intensive
    agriculture, recurrent burning, or strong anthropic soil modification across
    most sampled terra-firme settings in western/interfluvial Amazonia
    (AMZ-C014). These are not perfect samples—they inherit survey-access and
    coring-coverage biases—but together they robustly support spatial
    heterogeneity. AMZ-C016’s interpretive mosaic claim accurately synthesizes
    this pattern and is well-supported by its dependency chain.

    On Carvajal specifically, the record supports a split verdict. Manuscript
    comparison shows that his most extreme figures—tens of thousands of warriors
    and multi-league-long villages—are confined to one manuscript family and
    absent from Oviedo’s version, which still depicts a densely settled river
    world but with more modest numbers (AMZ-C002). This undermines the numerical
    claims without touching the qualitative geography. Independent
    sixteenth‑century witnesses (Nunes, Ursúa accounts) then report dense
    settlements, large maize stores, substantial roads, and valued ceramics on
    the same reaches (AMZ-C003), while archaeological records document
    contact‑horizon or later occupation in multiple corridor systems (AMZ-C006,
    AMZ-C011). This triangulation makes it provisionally well-founded to treat
    Carvajal as broadly reliable about the existence and organization of
    populous riverine societies in specific sectors, while discounting the
    unstable high-end numbers (AMZ-C017). The decisive corridor-level spatial
    test has not yet been run, which rightly keeps this verdict at
    “provisionally_supported” rather than higher.

    Demographically, the case is appropriately cautious. It exposes how headline
    “millions” estimates are highly assumption-sensitive (Aquiry: AMZ-C005) and
    how widely cited basin totals share methodological lineages rather than
    being independent measurements (AMZ-C012). Summed radiocarbon distributions
    consistent with logistic growth to carrying capacity (AMZ-C015) modestly
    support the view that there was no widespread endogenous pre-contact
    collapse, but that inference rests on a single proxy family and remains
    provisional. Where documentary reconstructions exist, they demonstrate
    catastrophic but regionally variable declines driven by epidemics, slaving,
    missionization, forced labor, revolt, and flight (AMZ-C010). These
    mechanisms are more than adequate to explain the disappearance of populous
    riverine worlds between 1542 and later, quieter accounts.

    Steelmanning skepticism, several key components remain model- or
    proxy-dependent: population estimates rest on potentially fragile
    assumptions about site contemporaneity and people per house; soil cores
    sample small areas, and forest succession can erase signals; known-site
    databases are strongly biased toward rivers. It is therefore possible that
    future LiDAR and promise-blind interfluve surveys will materially expand or
    contract both the dense-corridor footprint and the matrix’s occupation
    density. Likewise, the Carvajal corridor test could undercut his qualitative
    reliability if the predicted populated reaches do not align with independent
    archaeology. Nonetheless, given the current evidence, the central mosaic
    picture and a nuanced, partial vindication of Carvajal’s qualitative account
    are both well-supported.

    Sensitivity-wise, AMZ-C013 (river-distance as strongest predictor) and
    AMZ-C014 (negative palaeoecological signal in many terra-firme regions) are
    the most load-bearing for the mosaic conclusion; removing either would
    weaken but not destroy the heterogeneity verdict, because independent
    archaeological clustering and historical accounts would still imply
    corridor-heavy occupation. For the Carvajal credibility assessment, AMZ-C003
    is the single most pivotal: without independent sixteenth‑century
    confirmation of a populous middle Amazon, his account would stand largely
    alone, and AMZ-C017’s verdict would likely drop to “mixed.” Overall,
    however, no single record’s removal collapses the case: the verdict of a
    heterogeneous, strongly human-shaped but not uniformly dense pre‑contact
    Amazon, and a qualitatively credible but numerically unreliable Carvajal, is
    robust given the present dossier.
claimAssessments:
  - claimId: AMZ-C001
    verdict: established
    confidence: high
    reasoning: This claim is purely about the content of Carvajal’s chronicle, not
      about its accuracy, and secondary scholarship explicitly confirms that
      both manuscript branches describe populous riverbank settlements,
      substantial stores, roads, fine ceramics, and multi-settlement polities
      interspersed with reported empty stretches. Denevan’s bluff-model
      discussion and Lopes et al.’s quotations corroborate these qualitative
      elements. The strongest opposing consideration is the lack of a direct,
      fully collated critical edition of all witnesses in this case file, but
      since the claim confines itself to what both branches share, the evidence
      is sufficient to treat it as established.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: "Denevan’s manuscript comparison is explicit and verbatim: the
      Medina/Muñoz branch includes the extreme warrior counts and village
      lengths, while Oviedo’s does not, though it retains one figure of about
      5,000 warriors and the general picture of crowding. This directly supports
      the claim that the famous largest numbers are textually unstable whereas
      the qualitative description is shared. The main objection is that Oviedo
      might have edited out numbers he considered implausible, so absence in his
      version does not prove absence in the lost autograph; nonetheless, the
      stated fact about divergent manuscript content is firmly established."
  - claimId: AMZ-C003
    verdict: established
    confidence: high
    reasoning: Lopes et al. (2024) documents Nunes’s 1538 incursion into Machiparo
      and the ten Ursúa accounts, and summarizes them as describing dense
      settlement, very large maize stores, substantial straight roads “like the
      Incas”, and rich fisheries along the same middle Amazon reaches. This
      provides strong, independent corroboration of Carvajal’s qualitative
      social geography. The key caveat is that all these expeditions traverse
      the same favorable corridor, so their agreement does not extend to the
      whole basin, but it does firmly establish the existence of such a world on
      those reaches.
