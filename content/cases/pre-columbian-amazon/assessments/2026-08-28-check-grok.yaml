  synthesis: >-
    The featured hypothesis is a conjunction, not a single meter reading:
    immediately pre-contact Amazonia held large sedentary, politically organized
    populations in the millions along major rivers; those societies engineered
    ground at scale; Carvajal's 1542 chronicle is substantially accurate
    testimony to that world; and Old World epidemics, slaving, missions, and
    displacement emptied it fast enough that later silence records collapse
    rather than original emptiness. The evidence ledger does not underwrite that
    package as a unit. It underwrites a decomposed successor, and the
    decomposition is the finding.

    Steelman for the hypothesis. Invention is a poor explanation of the
    qualitative river world. Diogo Nunes in 1538 and the ten Ursúa accounts of
    1560, written for different crowns by men who mostly detested one another,
    repeat dense settlement, vast maize stores, long straight travelled roads,
    and renowned ceramics on the same middle-Amazon reaches Carvajal described;
    none of them repeats his giant arithmetic (AMZ-E007). Contact-horizon
    archaeology is no longer an empty set: an 1,800 km southern-rim arc of
    fortified villages dates to about AD 1250–1500 (AMZ-E004); Belterra Plateau
    towns with dark earths, ponds, and trodden roads run from about AD 1300 into
    seventeenth-century colonization (AMZ-E017); Marajó's Cacoal site attests
    Marajoara permanence to 1650 (AMZ-E018); Upper Xingu plaza-and-road layouts
    matching living Kuikuro villages are occupied to about 1770 (AMZ-E019).
    Casarabe phytoliths and hydraulic works show that at least one Amazonian
    urban system ran year-round maize monoculture on a replumbed savannah
    (AMZ-E014). Where colonial reconstruction permits counting, decline is
    catastrophic and multi-causal: Napo–Aguarico falls from roughly
    49,000–51,000 to about 6,000 by 1700 (about 88 percent), Mainas about
    two-thirds, by epidemics, slave raids, missionization, forced service,
    revolt, and flight (AMZ-E008). A quiet bank in 1690 is not evidence of a
    quiet bank in 1542. Biome-scale radiocarbon sums grow logistically toward
    carrying capacity until Europeans arrive, with the terminal drop attributed
    to sampling bias compounded by collapse, not a pre-contact endogenous crash
    (AMZ-E020). Against this record the old ecological-impossibility argument is
    finished.

    Steelman against. The most famous Carvajal figures — 50,000, 10,000, and
    8,000 warriors, villages four or five leagues long — live in the
    Medina/Muñoz branch and not in Oviedo, which keeps the crowded world and one
    figure of about 5,000 (AMZ-E005). Trusting the kind of world he described
    while refusing his arithmetic is therefore not a compromise; it is what the
    witnesses themselves force. The 2026 Aquiry LiDAR result is morphologically
    decisive and chronologically the wrong century: 432 documented earthworks
    and a 24,000–30,000 regional prediction (AMZ-E001) sit under a demographic
    peak dated AD 100–300 (AMZ-E003), and the paper's own single-family
    alternative collapses the 1.25–3 million headline roughly fivefold
    (AMZ-E002). Spending early grandeur as 1542 corroboration is the chronology
    error the ledger is built to block. Denevan publicly rejected the
    habitat-density method behind his own 5.1–6.8 million figure while still
    holding at least 5 to 6 million reasonable on other grounds (AMZ-E009) — a
    number outliving its argument, not a census. Across 7,363 recorded sites,
    distance from a river is the dominant occupation predictor and interfluves
    are sparser (AMZ-E010). Cumulative phytolith and charcoal work across
    fourteen western and interfluvial regions finds little to no annual
    cropping, clearing, anthropic soils, tree enrichment, or recurrent fire in
    most sampled terra firme (AMZ-E011). Raised-field dating in the Llanos de
    Mojos shows intermittent flood-risk construction, not a permanent
    breadbasket (AMZ-E015, AMZ-E016). The modern domesticated-tree gradient is
    confounded by five post-Columbian centuries (AMZ-E013). Corridor travelers
    and corridor archaeologists will agree about corridors; that agreement does
    not license a basin.

    What survives every filter is AMZ-C016's mosaic: substantial sedentary
    populations, engineered subsistence, and settlement systems along favored
    rivers, floodplains, savannas, and bluffs, embedded in a much more lightly
    occupied forest matrix. That is mixed support for the featured conjunction,
    not a hedged shrug. The pristine-wilderness conjunct is contradicted. The
    basin-wide dense, politically integrated civilization conjunct is weakly
    supported. Carvajal's qualitative social geography is provisionally
    supported and his extreme numbers are not. Collapse is well documented where
    records exist and unmeasured on the Solimões reaches the dispute actually
    lives on. Proportions — how much corridor, how much matrix — remain the live
    unknown; structure does not. Sensitivity: AMZ-E011 is the single record
    whose removal would most change the case, because it is the strongest
    negative-space check on extrapolating spectacular corridors across the
    basin. Without it, corridor archaeology plus independent chronicles would
    more easily license a denser reading and the verdict would drift toward
    provisionally_supported for a more maximalist package. Mixed survives the
    cut: AMZ-E010's river-distance gradient, the model-dependence of the
    censuses, the Aquiry chronology gap, and the manuscript split still prevent
    treating the conjunction as a unit. The unrun Carvajal corridor test
    (AMZ-R001) is the cleanest remaining discriminator, and until it is run the
    qualitative half of C017 should stay provisional rather than be spent as
    settled vindication.
claimAssessments:
  - claimId: AMZ-C001
    verdict: established
    confidence: high
    reasoning: "The claim is about what Carvajal's chronicle contains, not whether
      the world it describes was real. Denevan 1996 and Lopes et al. 2024 quote
      both manuscript branches carrying populous riverbank settlements, food
      stores, roads, ceramics, and empty stretches, and AMZ-E006 notes that a
      bluff geography of dense reaches alternating with empty ones is
      independently the archaeological pattern. The primary relación itself was
      not fetched, so the content claim rests on those secondary quotations,
      which are explicit and consistent on the qualitative picture. Strongest
      opposing consideration: a starving missionary chronicler had incentives to
      magnify marvels and hostility, but that objection goes to veracity
      (AMZ-C017), not to whether the text says these things."
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: "AMZ-E005 quotes Denevan verbatim: Oviedo has no 50,000, 10,000, or
      8,000 warriors and no villages four or five leagues long, and one mention
      of 5,000 warriors. That is a concrete textual observation, not an
      interpretive dispute, and it is what licenses treating the qualitative
      geography and the extreme arithmetic as separable. Strongest opposing
      consideration: absence from Oviedo's redaction does not prove absence from
      Carvajal's lost original — Oviedo may have trimmed figures he disbelieved
      — so the instability cuts against relying on the numbers either way, which
      is already the claim's point."
  - claimId: AMZ-C003
    verdict: established
    confidence: high
    reasoning: "AMZ-E007 documents Nunes reaching Machiparo in 1538 and ten Ursúa
      accounts from 1560 describing the middle Solimões as densely inhabited,
      maize stores as infinite, roads as broad, good, and Inca-like except for
      the walls, and ceramics of high quality. Fortifications and organized
      warfare are correctly excluded from the verified common set. None of these
      witnesses carries Carvajal's extreme counts. Strongest opposing
      consideration: all travelled the same favored corridor, and later
      chroniclers may have read earlier accounts; demonstrated philological
      dependence would collapse the independence this claim rests on."
  - claimId: AMZ-C004
    verdict: established
    confidence: high
    reasoning: "AMZ-E001 verifies the study's own figures: 432 earthworks from 10
      ALS lines, only 36 previously known, a fivefold LiDAR gain over satellite
      detection on the same lines, an about 183,000 km² circumscription, and an
      approximately 24,000–30,000 extrapolation. The claim as stated reports
      that documentation and that prediction, not an independent census.
      Strongest opposing consideration: the regional total is a
      block-extrapolation from sampled densities, and AMZ-E003 dates the Aquiry
      peak to AD 100–300, a millennium before Orellana — chronology and
      extrapolation limit what the monuments can be spent as, they do not
      falsify the measurement claim."
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: "AMZ-E002 quotes the paper's own architecture: 25–60 percent
      simultaneous use times 300 people per earthwork yields 1.25–3 million; the
      single-family reading of about 25 m house foundations yields
      250,000–600,000, or 315,000–760,000 with canopy correction. The claim
      grades the estimate's sensitivity, not the ancient population, and the
      fivefold span is in the source. Strongest opposing consideration: the
      authors label the single-family reading very unlikely and argue that 300
      matches later village sizes and workforce needs, so the span is an honest
      error bar rather than a refutation of the higher path."
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: "AMZ-E004 verifies both halves of the statement: an 1,800 km stretch
      of southern Amazonia occupied by earth-building cultures in fortified
      villages about Cal AD 1250–1500, and a 500,000–1,000,000 figure the
      authors themselves derive from contemporaneity, ethnographic conversion,
      and MaxEnt-projected extrapolation (21,340 calculated UTB inhabitants
      scaled first to 463,555 then to 1,087,150). Unlike Aquiry, these dates
      overlap the contact horizon. Strongest opposing consideration: MaxEnt
      suitability is not occupation, and the upper million is a model projection
      from a sampled basin, not a count."
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: "AMZ-E014 verifies intensive year-round maize monoculture, drainage
      canals, newly documented savannah farm ponds, and 178 phytolith samples
      from 18 profiles recording the singular and ubiquitous presence of Zea
      mays. That is direct subsistence evidence, not an inference from monument
      scale. Strongest opposing consideration: the Casarabe florescence
      (500–1400 CE) ends before European contact, so the system licenses
      capability in one savannah hydrology, not a general 1542 breadbasket."
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: "Dark earths, ponds, and trodden roads at Belterra (AMZ-E017),
      raised-field complexes (AMZ-E015, AMZ-E016), and the Levis et al. 2017
      finding that domesticated species increase on and around archaeological
      sites (AMZ-E012) jointly document long-term landscape engineering.
      AMZ-E013 is a first-class qualifier, not a footnote: post-Columbian
      activities are argued to have played the larger role in the observed
      floristic patterns. Strongest opposing consideration is exactly that
      confounder — present-day forest composition cannot be read straight back
      as a 1491 map."
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: moderate
    reasoning: "AMZ-E015 proposes raised fields as flood-risk works built only where
      there were no alternatives; AMZ-E016 dates intermittent use from as early
      as AD 570–770 in a few separate construction events and challenges
      continuous cultivation. Together they discipline the chain from earthwork
      scale to agricultural output to population. Strongest opposing
      consideration: the dating is from specific Bermeo-area fields, while the
      separate Casarabe drained-field system (AMZ-C007) shows genuinely
      intensive cultivation — the correction is local, not a general law of
      Amazonian earthworks."
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: "AMZ-E008's Table 1 and mechanism passages give Napo–Aguarico
      49,000–51,000 to about 6,000 by circa 1700 (87.8–88.2 percent, ratio
      8.3:1) and Mainas 62.3–63.6 percent, through epidemics, enslaving raids,
      missionization, excessive service, the 1635 revolt, and flight from major
      rivers. The mixed-mechanism list matters: people were taken, gathered, and
      they left, so emptiness later does not imply emptiness in 1542. Strongest
      opposing consideration: these are upper-Amazon and Andean-foothill
      provinces with mission records; carrying their ratios to the
      Solimões/Machiparo reaches is itself an extrapolation."
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: "Three independent contact-horizon records converge: Belterra sites
      from about AD 1300 to seventeenth-century colonization, with dark earths,
      ponds, and trodden roads (AMZ-E017, strong); Cacoal dated 1300–1650
      attesting Marajoara permanence at Portuguese contact (AMZ-E018, strong);
      Upper Xingu settlements inhabited 500–1770 CE in layouts matching living
      Kuikuro villages (AMZ-E019, moderate, a news feature). These are the sites
      that pass the chronology filter Carvajal actually needs. Strongest
      opposing consideration: they are corridor and hotspot regions archaeology
      samples best, and the Xingu terminal dates rest on secondary reporting
      pending primary publication."
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: "AMZ-E009 is decisive on the claim as stated: Denevan rejects the
      habitat-density method that produced 5.1–6.8 million because habitat
      densities were too variable for meaningful averages, yet still believes at
      least 5 to 6 million reasonable. That is the documented case of a number
      outliving the argument that generated it, and it reframes published totals
      as model families rather than independent censuses. Strongest opposing
      consideration: retiring one scholar's method does not by itself invalidate
      documentary, dark-earth-scaling, or radiocarbon-proxy families, each of
      which must be audited on its own dependencies."
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: "AMZ-E010, from 7,363 AmazonArch locations, finds distance from a
      river the most important predictor at 21.5 percent permutation importance
      and interfluves more sparsely populated than river-proximate areas. This
      is the single most discriminating basin-scale pattern in the ledger: it
      contradicts both a pristine wilderness and a uniformly dense occupation,
      and it predicts the corridor-heavy world the chronicles describe.
      Strongest opposing consideration: known-site databases inherit
      survey-effort bias toward accessible rivers, so part of the gradient is
      discovery, not ancient behavior, and the model cannot fully escape that."
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: "AMZ-E011 verifies the five-point little-to-no-evidence list — annual
      crops, significant clearing, anthropic soils, enrichment of favored trees,
      recurrent extensive fires — for most sampled terra-firme settings in a
      cumulative fourteen-region phytolith and charcoal program concentrated in
      western and interfluvial Amazonia. This is the strongest negative-space
      check on extrapolating spectacular regions across the basin. Strongest
      opposing consideration: soil-core sampling is spatially tiny, negative
      signals count only where the proxy could have detected the activity, and
      post-abandonment forest recovery can erase earlier disturbance, so little
      evidence in samples is not little activity everywhere."
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: low
    reasoning: "AMZ-E020 reports that summed radiocarbon dates over the 1,700 years
      before colonization fit logistic growth toward carrying capacity, with the
      terminal proxy decline attributed to sampling bias compounded by
      post-European collapse and dispersal rather than a pre-contact endogenous
      crash. That is one aggregate SPD study, explicitly a relative-change
      proxy, not a census. Strongest opposing consideration: regional signals
      can diverge from the biome curve — agricultural decline in parts of the
      Llanos de Mojos beginning AD 1300–1450 is the named counterexample — so
      the aggregate does not preclude regional pre-contact reorganization."
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: "Dense nodes are independently documented by earthworks and
      settlement systems (AMZ-C004, AMZ-C006, AMZ-C007, AMZ-C011); the thin
      matrix by the river-distance gradient and terra-firme palaeoecology
      (AMZ-C013, AMZ-C014); and the eyewitness accounts describe exactly this
      alternation (AMZ-C001, AMZ-C003). Neither pristine wilderness nor
      wall-to-wall civilization survives that conjunction; the mosaic structure
      does. Strongest opposing consideration: both the spectacular nodes and the
      sparse cores are biased samples, so the mosaic's proportions — how much
      corridor, how much matrix — could still move substantially as
      promise-blind coverage improves."
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Qualitative geography is shared across manuscript branches
      (AMZ-C002), independently echoed by Nunes and Ursúa (AMZ-C003), and
      commensurate with contact-horizon archaeology in southern-rim, Belterra,
      Marajó, and Xingu systems (AMZ-C006, AMZ-C011), while the extreme counts
      are textually unstable. That is a earned split, not a hedge. It remains
      provisional because the decisive location-specific test — classifying
      populated and empty reaches from the manuscripts alone, then comparing
      contact-horizon intensity against matched controls — has not been run.
      Strongest opposing consideration: corridor-and-preservation bias could
      manufacture the vindication, since Orellana travelled the richest reaches
      and archaeology samples those same reaches best."
  - claimId: AMZ-C018
    verdict: well_supported
    confidence: moderate
    reasoning: "Hancock's first-party statement that America Before devoted seven
      chapters and more than 90 pages to Amazonian discoveries, including the
      Acre geoglyphs, is on the record, and AMZ-E021 verifies that Ancient
      Apocalypse: The Americas S2.E1 (2024-10-16) lists Pärssinen and Ranzi as
      themselves. The claim as stated is advocacy genealogy, not an empirical
      result about pre-Columbian Amazonia, and it carries no weight for or
      against any other claim here. Strongest opposing consideration:
      highlighting one popularizer risks confusing narrative credit with
      evidential support, and the book's page-level handling of Carvajal was not
      collated against the manuscript split in AMZ-C002."
