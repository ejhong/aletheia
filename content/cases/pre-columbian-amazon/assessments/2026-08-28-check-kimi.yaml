    reasoning: "The claim asserts only what the chronicle contains, and that is
      verified through scholarship that quotes and collates both manuscript
      branches (Denevan 1996; Lopes et al. 2024). Both transmission families
      carry the qualitative picture — populous stretches alternating with empty
