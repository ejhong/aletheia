  synthesis: "The featured hypothesis is a bundle, and this record separates it
    cleanly. Established beyond serious dispute: Amazonian societies engineered
    landscapes at scale (earthworks, dark earths, drained-field maize systems —
    C004, C007, C008); fortified, planned settlement systems occupied the
    southern rim and several corridors into the contact era itself (C006, C011);
    Carvajal's extreme numbers are features of one manuscript branch while his
    qualitative picture is common to both (C002); and where colonial records
    permit counting, collapse of 62–88% within 160 years is documented with
    named, plural mechanisms (C010). The pristine-wilderness model is
    contradicted. The well-supported core is the mosaic (C016): river distance
    dominating occupation probability across 7,363 sites (C013) and the
    fourteen-region palaeoecological negative space (C014) on one side,
    monumental and agricultural hotspots on the other. That structure survives
    any plausible shift in proportions, which is why I grade the case
    well_supported rather than mixed or provisional. Steelmanning the
    maximalist: nothing in this record refutes millions basin-wide; the 1.25–3M
    Aquiry estimate and Denevan's retained 5–6M remain live models, the
    domesticated-forest signal spans the basin, and an 88% documented collapse
    ratio makes a crowded 1542 fully compatible with a quiet 1690. Steelmanning
    the skeptic: every positive pillar samples the same favored corridors
    archaeology can reach; the only near-representative sampling (the soil
    cores) finds little; the most spectacular dates are centuries removed from
    1542; and the numbers Carvajal is famous for demonstrably grew in
    transmission — the maximalist picture needs every extrapolation to break its
    way. Carvajal's qualitative vindication (C017) is provisionally supported,
    not more, because the decisive location-specific test (R001) has not been
    run and corridor bias could manufacture the observed agreement. Sensitivity:
    removing AMZ-E007, the Nunes/Ursúa independent-witness record, would most
    change this verdict — C017's positive half would drop to weakly_supported,
    left resting on corridor-compatible archaeology alone, which is precisely
    the manufactured-agreement objection. The case verdict itself survives that
    removal, because the mosaic and the collapse documentation stand on
    archaeology and palaeoecology independent of any chronicle; but the case's
    headline — that the friar described a real world — would then hang on one
    thread, and this assessment says so."
