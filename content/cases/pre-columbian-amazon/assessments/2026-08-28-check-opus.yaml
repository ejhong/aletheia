  synthesis: "The hypothesis as filed is a compound: (a) large sedentary organized
    populations on the major rivers before contact, (b) landscape engineering at
    scale, (c) Carvajal as substantially accurate testimony, (d) post-contact
    collapse and dispersal explaining the emptier later record. These parts do
    not carry equal weight of evidence, and the honest roll-up must say so
    rather than average them. Part (b) is effectively established by the records
    here: Casarabe drained-field maize with 178 phytolith samples across 18
    profiles (AMZ-E014), Belterra dark earths, ponds and trodden roads
    (AMZ-E017), the Aquiry LiDAR corpus (AMZ-E001), and southern-rim fortified
    villages (AMZ-E004). Part (a) is well supported in specific, dated places —
    the southern rim at AD 1250–1500 and the Santarém, Marajó and Xingu systems
    running into or past contact — but the basin-wide, politically integrated
    version is not evidenced at all; the biggest numbers on offer are model
    outputs whose spans (AMZ-E002's fivefold collapse under the paper's own
    alternative reading; AMZ-E009's author-retracted method) exceed the quantity
    in dispute. Part (d) is well supported where records permit counting
    (AMZ-E008), with the important structural point that flight, capture and
    mission aggregation move people without killing them — so an empty 1690 bank
    is not a measurement of 1542. Part (c) is the genuinely provisional element:
    the qualitative picture is echoed by Nunes and the Ursúa accounts on the
    same reaches (AMZ-E007), the extreme numbers are textually unstable
    (AMZ-E005), and the spatial test that would convert corroboration into
    confirmation has not been run. Steelmanning the skeptic: every corroborating
    line samples the same favored corridors that Orellana travelled and that
    archaeologists can reach; AMZ-E010's river-distance gradient partly encodes
    discovery effort; AMZ-E011 shows most sampled terra firme without
    cultivation, clearing or anthropic soils; and the Aquiry florescence is a
    millennium too early to be spent on 1542 (AMZ-E003). Steelmanning the
    proponent: the skeptical position has already conceded the
    ecological-impossibility thesis, its negative palaeoecology is spatially
    minute relative to the areas it generalizes over, and no manuscript-critical
    result touches the mundane, non-marvellous features (roads, storehouses,
    ceramics) that three unconnected expeditions independently report. What
    survives is precisely the mosaic of AMZ-C016 — dense engineered corridors in
    a lightly occupied matrix — with proportions open. Sensitivity: removing
    AMZ-E007 (Lopes et al. 2024) would do the most damage, because it is the
    sole record establishing independent corroboration of Carvajal's world;
    without it AMZ-C003 vacates and AMZ-C017 falls to
    weakly_supported/unresolved, since the archaeology alone establishes that
    such a world could exist on those reaches, not that this witness described
    it truly. The case verdict survives that removal at provisionally_supported
    only for the mosaic and collapse components; the Carvajal component does
    not."
