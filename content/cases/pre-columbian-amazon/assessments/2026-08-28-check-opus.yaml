  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: The documented component — 432 earthworks from 4,430 km of ALS lines,
      of which only 36 were previously known, a fivefold gain over satellite
      detection — is a direct measurement reported verbatim (AMZ-E001), and
      morphology detection by LiDAR is a mature, low-inference technique. The
      claim states the 24,000–30,000 figure explicitly as a prediction from
      block extrapolation, which is what the paper does, so the claim as worded
      is accurate. The strongest opposing consideration is that the
      extrapolation assumes comparability of unflown blocks to flown ones, and
      the paper is weeks old with no independent replication or rebuttal; the
      disclosed funding tie to this site's founder is a reason for caution about
      emphasis, though not about the instrument readings themselves.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: "The sensitivity is not an outside criticism but the paper's own
      arithmetic, quoted verbatim in AMZ-E002: 300 people per average earthwork
      times an assumed 25–60% simultaneous-use fraction gives 1.25–3 million,
      while the single-family house reading gives 250,000–600,000
      (315,000–760,000 with canopy correction). That a stated assumption swings
      the output roughly fivefold is a fact about the model, and the claim
      asserts only that. The strongest opposing consideration is that the
      authors label the single-family reading \"very unlikely\" and defend the
      300-person figure from later village sizes and labour requirements — so
      the lower bound is an error bar, not a competing estimate. Either way,
      this is a model output, not a census."
  - claimId: AMZ-C006
    verdict: well_supported
