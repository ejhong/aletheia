  synthesis: >-
    The case's central thesis — a strongly heterogeneous pre-contact
    Amazon, with dense engineered corridors and hotspots embedded in a
    lightly occupied matrix — is carried from two directions at once,
    which is what makes it robust. From the positive side: earthwork
    systems at enormous scale (AMZ-C004), contact-horizon settlement
    continuity at Santarém, Marajó, and the Xingu (AMZ-C011), engineered
    subsistence where the carrying-capacity objection was strongest
    (AMZ-C007), and independent sixteenth-century testimony converging on
    the same crowded corridors (AMZ-C001, AMZ-C003). From the negative
    side: the river-distance occupation gradient across 7,363 sites
    (AMZ-C013) and the sparse palaeoecological record of the sampled
    interfluves (AMZ-C014) cap the maximalist reading. The two verdict
    claims differ in maturity: the mosaic (AMZ-C016) is well supported
    because both its halves are; the Carvajal rehabilitation (AMZ-C017)
    is provisional because its decisive, location-specific test — the
    preregistered corridor comparison (AMZ-R001) — has not been run, and
    corridor-plus-preservation bias remains a live alternative
    explanation for the agreement so far. The demography stays
    deliberately ungraded beyond its model structure: the honest state of
    the population question is a set of assumption-driven envelopes
    (AMZ-C005, AMZ-C012), not a number. Nothing in this assessment
    depends on the founder-funded 2026 study beyond its structural
    findings, and its population model is carried at its most
    assumption-exposed reading.
