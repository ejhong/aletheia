  synthesis: >-
    The central hypothesis that pre-Columbian Amazonia supported large,
    sedentary, politically organized societies that engineered extensive
    landscapes and experienced catastrophic post-contact collapse is well
    supported across multiple independent lines of evidence. Archaeological
    survey, LiDAR mapping, and zooarchaeological analysis demonstrate complex,
    labor-intensive earthworks, causeways, canals, and agricultural
    infrastructure across southwestern Amazonia, the Llanos de Mojos, the
    southern rim, and the Santarém plateau. Several prominent systems—including
    the Belterra plateau, Marajó Island, and the Upper Xingu—exhibit direct
    occupational and cultural continuity spanning from the late prehistoric
    sequence directly into the European contact era. Furthermore, Carvajal's
    1542 chronicle is independently corroborated in its broad qualitative
    geography of dense riverine populations, vast stores, and connecting roads
    by Diogo Nunes (1538) and the 1560 Ursúa expedition accounts, while textual
    analysis clarifies that the most implausible troop counts and settlement
    lengths are late manuscript amplifications absent from the Oviedo tradition.
    Post-contact collapse is documented by regional demographic reconstructions
    showing 60–90% depopulation via compound epidemic waves, slaving, mission
    concentration, and flight into interior zones.

    However, a rigorous reading requires rejecting totalizing caricatures. The
    data decisively refute the notion of a uniform, basin-wide "megalopolis" of
    tens of millions. Comprehensive paleoecological syntheses of phytolith and
    charcoal records from interfluvial terra-firme forests demonstrate minimal
    clearing, little crop cultivation, and sparse human presence away from river
    bluffs, floodplains, and fertile savannas. Pre-Columbian Amazonia was a
    heterogeneous mosaic: dense, engineered polities flourished along riverine
    bluffs, enriched alluvial margins, and specialized savannas, embedded in a
    sparsely inhabited forest matrix. Chronological discipline is equally
    essential; spectacular phenomena like the Casarabe urbanism (ending ca. AD
    1400) and the Aquiry geoglyph peak (AD 100–300) cannot be treated as direct
    snapshots of 1542. In terms of sensitivity, the single evidence record whose
    removal would most threaten the contact-era synthesis is AMZ-E017 (Stenborg
    et al. 2018), which establishes large-scale sedentary occupations with dark
    earths, roads, and earthworks on the lower Amazon extending continuously up
    to seventeenth-century contact. Without it, the case would rely more heavily
    on upper-basin and peripheral sequences, but the verdict nonetheless
    survives due to corroborating late-horizon occupations in the Upper Xingu,
    Marajó, and the southern rim, coupled with multiple independent
    sixteenth-century chronicles.
