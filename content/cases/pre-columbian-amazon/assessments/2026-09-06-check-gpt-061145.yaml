  synthesis: >-
    The supplied record supports a substantial qualitative revision of an
    uniformly sparse, minimally modified pre-Columbian Amazon, but it does not
    establish the featured hypothesis in its full demographic and chronological
    specificity. Multiple measurement streams document major earthworks,
    fortified villages, hydraulic agriculture, fisheries, dark earths, roads,
    and settlement systems in several regions. Late occupations along the
    southern rim, at Belterra, on Marajó, and in the Upper Xingu show that
    significant systems existed near, into, or beyond European contact. The
    evidence for a heterogeneous geography is especially coherent: the
    archaeological-site model concentrates occupation near rivers, while the
    phytolith and charcoal synthesis finds little intensive-use signal in most
    of its sampled terra-firme settings. These records are compatible rather
    than contradictory if Amazonia contained populous corridors and engineered
    enclaves embedded in a lightly occupied matrix.

    The historical case for Carvajal is also materially stronger than reliance
    on his chronicle alone would be. Nunes and the Ursúa expedition accounts
    reportedly reproduce dense settlement, food stores, roads, and ceramics on
    the middle-Amazon reaches, while the manuscript comparison shows that
    Carvajal's most spectacular numbers are absent from the Oviedo branch. This
    supports the qualitative social geography while undercutting literal use of
    the famous warrior and village-size figures. The ten Ursúa narratives
    nevertheless share one expedition and therefore are not ten independent
    replications; Nunes supplies the more important independent witness.
    Archaeological evidence from other Amazonian regions establishes ecological
    and organizational possibility but cannot by itself verify what Carvajal
    encountered along his precise route.

    The strongest case against the full hypothesis concerns population magnitude
    and chronological linkage. The Aquiry earthworks are impressive, but their
    proposed demographic peak falls around AD 100–300, roughly a millennium
    before Orellana, and the population estimate varies sharply with
    simultaneity and occupancy assumptions. The southern-rim estimate likewise
    depends on contemporaneity, ethnographic conversion formulae, and geographic
    projection. Denevan's rejection of the method that generated his influential
    5.1–6.8 million estimate shows that continued belief in a similar total is
    not an independent measurement. Consequently, “millions immediately before
    contact” remains plausible but unestablished by this record. Nor do the
    supplied studies directly demonstrate basin-wide political integration.

    Regional colonial reconstructions provide a credible mechanism for rapid
    disappearance: the documented Napo–Aguarico and Mainas declines were severe
    and involved epidemics, raiding, missionization, forced service, revolt, and
    flight. Yet applying those ratios to the middle and lower Amazon remains an
    extrapolation. The record therefore supports large sedentary populations,
    extensive engineering, a river-focused mosaic, and severe post-contact
    collapse, while leaving the basin-wide census and the exact
    Carvajal-to-later-emptiness reconciliation open. That structural combination
    warrants a mixed verdict rather than unresolved or fully supported.

    The single most sensitivity-critical record is AMZ-E007, because the Nunes
    and Ursúa testimony is the principal evidence independently connecting
    Carvajal's qualitative descriptions to the same middle-Amazon setting.
    Removing it would reduce AMZ-C017 to provisional inference from a textually
    unstable chronicle and archaeological analogues elsewhere. The case verdict
    would nevertheless remain mixed: the archaeological landscape and
    regional-collapse components would survive, while the Carvajal component
    would become appreciably weaker.
  steelman: The record does not explain why Nunes, Carvajal, and the Ursúa
    expedition, separated in time and allegiance, described the same
    middle-Amazon reaches in similarly concrete terms—dense settlements, immense
    food stores, travelled roads, and specialized ceramics—before later
    observers encountered a much emptier landscape. No contact-horizon corridor
    test or province-by-province collapse reconstruction supplied here
    determines whether that convergence and subsequent disappearance have any
    comparably specific explanation other than rapid colonial collapse.
