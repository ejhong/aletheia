  synthesis: >-
    The record provisionally supports the featured hypothesis, but only in its
    heterogeneous, corridor-focused form rather than as a claim that most of the
    Amazon was densely settled. Archaeological measurements establish
    substantial earth-building settlements, intensive engineered subsistence,
    roads, ponds, canals, dark earths, and fisheries in several regions. Late
    dates from the southern rim, Belterra, Marajó, and the Upper Xingu place
    significant settlement systems at or beyond the contact horizon. River
    distance is also the strongest recorded occupation predictor, while the
    phytolith and charcoal synthesis finds little intensive-use signal in most
    sampled terra-firme settings. Taken together, these positive and negative
    observations support a mosaic of densely used corridors and favorable
    landscapes embedded in a lightly occupied matrix.

    Chronology prevents the most spectacular discoveries from being treated as
    direct confirmation of Carvajal. The Aquiry demographic peak is dated to AD
    100–300, and Casarabe ends around AD 1400; both demonstrate ecological and
    organizational possibility but not conditions in 1542. The southern-rim
    sites and contact-era systems carry greater weight for the immediate
    pre-contact proposition. Nor are the demographic estimates independent
    censuses: the Aquiry earthwork count, chronology, and population sensitivity
    all come from one new study and shared sample, while its population range
    changes markedly with occupancy and household assumptions. The southern-rim
    estimate likewise depends on contemporaneity, ethnographic conversion, and
    spatial extrapolation. Denevan's rejection of his own habitat-density method
    leaves basin-wide “millions” plausible but not measured by this record. That
    numerical component is therefore substantially less secure than the
    existence of large regional populations.

    Carvajal's qualitative account receives meaningful corroboration from Nunes
    and the Ursúa materials, especially for dense settlements, food stores,
    roads, and ceramics on the middle Amazon. These are not wholly independent
    replications: the ten Ursúa narratives derive from one expedition, Nunes
    survives through a later letter and modern edition, and route
    identifications remain uncertain. Nevertheless, their convergence is
    stronger than reliance on Carvajal alone. The unstable extreme numbers
    should be excluded, and archaeology has not yet tested his populated and
    empty reaches against contact-horizon deposits corridor by corridor.

    The collapse component is supported directly by Newson's reconstruction of
    severe but uneven upper-Amazon declines through epidemics, raiding,
    missions, forced service, revolt, and flight. Steelmanning the contrary
    case, those provinces do not establish the same timing or magnitude for the
    middle and lower Amazon, environmental proxies are spatially sparse, and
    intermittent raised-field use cautions against converting every earthwork
    into permanent intensive agriculture. Conversely, the combination of
    contact-era settlement, independently reported populous reaches, and
    documented colonial depopulation makes later emptiness compatible with
    collapse rather than evidence that earlier settlement was impossible.

    Sensitivity is greatest to AMZ-E008, the only supplied evidence record that
    quantitatively reconstructs colonial decline and its mixed mechanisms.
    Removing it would leave archaeological occupation and Carvajal corroboration
    intact but would deprive the featured reconciliation of its principal direct
    collapse evidence; the case verdict would then fall from
    provisionally_supported to mixed. The collapse leg therefore hangs heavily
    on one geographically limited record, and no general prior about colonial
    mortality is used here to bridge that evidentiary gap.
  steelman: "The strongest unanswered pro-hypothesis argument is the corridor
