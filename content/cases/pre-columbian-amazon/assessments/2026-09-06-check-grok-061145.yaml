  synthesis: >-
    The featured hypothesis is a compound of four linked propositions: large
    sedentary, politically organized riverine populations on the order of
    millions immediately before contact; landscape engineering at scale;
    substantial qualitative accuracy of Carvajal’s 1542 account; and rapid
    post-contact collapse (epidemics, raiding, missionization, displacement)
    explaining the emptier Amazon seen by later travelers. The supplied record
    supports a constrained, regionally uneven version of this package far more
    than either a uniformly dense “garden Amazonia” or a near-empty wilderness.

    Engineering and sedentary complexity are documented in multiple independent
    measurement programs. Casarabe maize monoculture with drainage canals and
    farm ponds (C007), landscape-scale fish weirs and pond systems in the Llanos
    de Mojos (C019, C026), southern-rim fortified earthwork villages dated ~AD
    1250–1500 with model populations of roughly 0.5–1 million for that arc
    (C006), Aquiry earthwork densities from 2024 LiDAR with tens of thousands of
    predicted structures (C004), dark earths, raised fields, and anthropogenic
    forest patterning (C008), and contact-era continuity at Belterra, Marajó
    Cacoal, and Upper Xingu (C011) collectively refute any claim that complex,
    engineered, sedentary lifeways were absent. Raised-field use was
    intermittent and flood-risk-driven in sampled complexes (C009), which
    qualifies permanent-intensive readings without erasing engineering.

    The spatial structure that emerges is heterogeneous, not basin-filling.
    Across 7,363 sites, distance from river is the dominant occupation predictor
    and interfluves were more sparsely occupied (C013). Cumulative phytolith and
    charcoal work across fourteen lowland regions finds little to no annual
    cropping, clearing, anthropic soils, tree enrichment, or recurrent fire in
    most sampled terra-firme settings (C014). That negative mosaic, together
    with the positive riverine, bluff, savanna, and floodplain record,
    underwrites C016: substantial sedentary systems along favored corridors
    embedded in a much lighter forest matrix. Basin-wide “millions” remain
    model-family constructs sharing assumptions rather than independent censuses
    (C012); Denevan rejected the habitat-density method behind his influential
    5.1–6.8 million figure while retaining an order-of-magnitude belief; the
    Aquiry 1.25–3 million headline collapses several-fold under the paper’s own
    single-family sensitivity and peaks a millennium before Orellana (C005,
    E003). Radiocarbon SPDs fit logistic growth toward carrying capacity before
    contact, with terminal decline attributed to sampling bias plus
    post-European collapse rather than a pre-contact crash (C015), but SPDs are
    relative proxies, not headcounts.

    Carvajal’s qualitative social geography—populous, road-linked, store-rich
    riverbank polities alternating with empty stretches—is textually real (C001)
    and materially corroborated by independent sixteenth-century witnesses
    (Nunes; Ursúa accounts) on the same middle-Amazon reaches (C003), while the
    most extreme warrior and league-length figures are manuscript- branch
    unstable and absent from Oviedo (C002). Contact-horizon occupation at
    Belterra and related systems (C011) makes wholesale fabrication less
    economical than selective accuracy. Extreme counts should not be treated as
    census data (C017). Collapse is documented in upper-Amazon provincial
    reconstructions with large but uneven declines by mixed mechanisms (C010);
    extension to Carvajal’s middle/lower corridor remains partly inferential.
    C018 is genealogical advocacy history and carries no empirical weight.

    Steelman against the hypothesis: sparse terra-firme sampling, survey-effort
    bias toward rivers, model-sensitive demography, early (not contact-era)
    dates for some grand earthwork peaks, and post-Columbian confounding of
    modern forest composition can be read as showing spectacular but localized
    complexity rather than millions of networked riverine people whose sudden
    disappearance explains later emptiness—Carvajal could still be inflated
    traveler rhetoric. Steelman for the hypothesis: independent hostile
    sixteenth-century witnesses repeat the mundane load-bearing features of his
    geography; late pre-contact and contact-era settlement systems with dark
    earths, roads, and engineered subsistence exist along major corridors; and
    regional depopulation ratios plus SPD terminal decline make rapid emptying a
    documented process, not a special plea. Weighing only the supplied record,
    the mosaic-plus-collapse-plus-qualitative-Carvajal reading is provisionally
    supported; the strongest numerical and basin-uniform glosses are not.
    Sensitivity: AMZ-E007 (Nunes/Ursúa independent testimony) is the single
    record whose removal most damages the Carvajal pillar of the compound
    hypothesis; without it C017 falls toward weakly supported and the case
    verdict would likely soften to mixed. Engineering, mosaic structure, and
    regional collapse would still stand, so a weaker positive case survives, but
    the full four-part hypothesis would not retain the same grade.
  steelman: Independent sixteenth-century witnesses (Nunes 1538; multiple Ursúa
    1560 accounts) describe the same dense middle-Amazon settlement geography,
    vast food stores, long straight travelled roads, and renowned ceramics
    Carvajal reported, and no preregistered contact-horizon corridor test has
    yet falsified his populated-versus-empty reach map against archaeology along
    the 1541–42 route.
