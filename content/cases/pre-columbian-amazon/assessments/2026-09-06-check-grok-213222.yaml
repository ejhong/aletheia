  synthesis: >-
    The featured hypothesis is a conjunction: large sedentary riverine
    populations immediately before contact; landscape engineering at scale;
    substantial accuracy of Carvajal’s 1542 qualitative geography; and rapid
    post-contact collapse explaining later emptiness. The supplied record
    supports a heterogeneous, engineered Amazonia far more strongly than a
    pristine empty wilderness, but does not yet lock every conjunct at
    contact-era scale.

    Earthworks and settlement systems are the hardest positive evidence. LiDAR
    over southwestern Amazonia documents hundreds of previously unknown
    earthworks and motivates a large Aquiry cultural area with tens of thousands
    of predicted structures (AMZ-C004); the southern rim shows fortified
    earth-building villages across ~1,800 km dated ~AD 1250–1500 (AMZ-C006);
    Casarabe maize monoculture with drainage canals and farm ponds is multiproxy
    (AMZ-C007); fish weirs, causeways, and pond networks plus year-round
    interfluvial zooarchaeology document landscape-scale fisheries (AMZ-C019,
    AMZ-C026); dark earths, raised fields, and anthropogenic forest patterning
    recur in multiple regions (AMZ-C008). Several major systems remain occupied
    into or past contact—Belterra to seventeenth-century colonization, Marajó
    Cacoal to ~1650, Upper Xingu layouts to ~1770 (AMZ-C011)—so the “immediately
    before contact” clause is not empty.

    Carvajal’s qualitative load-bearing features (populous riverbank reaches,
    stores, roads, ceramics, multi-settlement territories, alternating empty
    stretches) are independently echoed by Nunes and the Ursúa accounts on the
    same middle-Amazon corridor (AMZ-C001, AMZ-C003). Extreme warrior and
    league-length figures are manuscript-unstable and absent from Oviedo
    (AMZ-C002), so numerical maximalism should be discarded while the social
    geography remains testable. Colonial reconstructions show catastrophic but
    uneven decline by mixed mechanisms—epidemics, raids, missions, flight—in
    upper-Amazon provinces (AMZ-C010), and radiocarbon SPDs fit pre-contact
    logistic growth with terminal decline attributed to sampling plus collapse
    rather than a pre-European crash (AMZ-C015).

    Counterweights are real and structural. River distance dominates occupation
    probability; interfluves were more sparsely occupied (AMZ-C013). Cumulative
    phytolith/charcoal work finds little annual cropping, clearing, anthropic
    soils, or recurrent fire across most sampled terra-firme settings
    (AMZ-C014). Raised-field use is intermittent and risk-mitigation rather than
    continuous intensive farmland in key dated complexes (AMZ-C009). Aquiry’s
    demographic peak sits a millennium before Orellana (AD 100–300), so it is
    superb against ecological-impossibility arguments but weak as direct 1542
    corroboration. Population headlines are model families sharing
    contemporaneity, house-count, and extrapolation assumptions; the Aquiry
    paper’s own single-family sensitivity collapses its 1.25–3 million figure
    roughly fivefold (AMZ-C005), and Denevan rejected the habitat-density method
    behind his influential basin total while retaining only an
    order-of-magnitude belief (AMZ-C012). Basin-wide “millions” and fully
    networked political organization are therefore not measurements.
    Post-Columbian land use confounds modern domesticated-tree concentration
    (AMZ-C008). Hancock platforming (AMZ-C018) is genealogical noise with zero
    empirical weight.

    The defensible roll-up is AMZ-C016’s mosaic: substantial sedentary,
    engineered societies along favored rivers, floodplains, savannas, and
    bluffs, embedded in a lighter forest matrix; Carvajal’s qualitative picture
    is provisionally credible and not refuted by later emptiness; collapse is
    documented where records exist and is a plausible reconciling mechanism. The
    maximalist wording of the case question outruns the contact-horizon
    demography and the still-unexecuted corridor test. Hence provisionally
    supported rather than well_supported or established: the revisionist core
    holds; the census and full political-network claims remain assumption-bound.
  steelman: Independent sixteenth-century witnesses (Nunes 1538; multiple Ursúa
