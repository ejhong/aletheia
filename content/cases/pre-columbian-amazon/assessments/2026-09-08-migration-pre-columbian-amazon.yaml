caseAssessment:
  verdict: well_supported
  whatIsClaimed: That immediately before European contact the Amazon basin held large, sedentary, politically organized populations — millions of people — living in networked settlement systems along the major rivers; that they engineered their landscape at scale (raised fields, causeways, canals, fish weirs, anthropogenic forests, dark-earth soils); that Carvajal's 1542 account is substantially accurate eyewitness testimony to that world; and that Old World epidemics, slave raiding, missionization, and displacement destroyed and dispersed it fast enough that the emptier Amazon met by later travelers is a record of collapse, not proof the earlier account was false.
  whereDisagreementLives: "Not over whether complex Amazonian societies existed — earthworks, dark earths, and planned settlements are established beyond argument. The live cruxes are proportion and inference: how representative the populated corridors were of the basin (river-proximity is the dominant predictor of known occupation, and many sampled interfluves and western terra-firme settings show little intensive modification); whether population estimates survive their own assumptions (the largest recent figure falls roughly fivefold under the paper's own alternative house-count reading); how much of Carvajal is textual bedrock versus transmission artifact (the most famous warrior counts appear in the Medina manuscript branch but not Oviedo's); and whether spectacular but much earlier sites are being silently spent as evidence about 1542."
  whatWouldSettleIt: "A preregistered Carvajal corridor test: classify his populated and empty reaches from the manuscript witnesses alone, model route and palaeochannel uncertainty, then compare contact-horizon archaeological intensity in predicted corridors against matched controls — before consulting the archaeological layers. Alongside it: representative surveys of interfluves chosen blind to archaeological promise, a synoptic manuscript-witness table separating what all Carvajal versions share from what only one branch carries, and demographic estimates re-derived under a common assumption set so that model families stop masquerading as independent censuses."
  bestConventionalExplanation: "The modern skeptical position is not the old ecological-impossibility argument; it concedes major regional societies and argues limits. Orellana traveled the richest corridors — precisely the environments where settlement concentrated and where archaeology preferentially looks and preserves — so substantial corroboration there cannot license basin-wide extrapolation. Sampled western and interfluvial palaeoecology shows large areas without intensive cultivation, clearing, or soil modification. The famous population totals are model outputs whose assumptions (site contemporaneity, persons per earthwork, extrapolation domains) do most of the work. And Carvajal's extreme figures are textually unstable across manuscript branches, consistent with a truthful observer whose numbers grew in the telling. On this view the mosaic is real but modest: dense hotspots, thin matrix, and a chronicle that is qualitatively honest and numerically unreliable."
