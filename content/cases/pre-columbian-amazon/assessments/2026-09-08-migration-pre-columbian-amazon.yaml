  synthesis: "The central thesis — a strongly heterogeneous pre-contact Amazon, with dense engineered corridors and hotspots set in a lightly occupied forest matrix — continues to be carried from both directions. Positively: earthworks at enormous scale (AMZ-C004, AMZ-E001), contact-horizon continuity at Santarém, Marajó, and the Xingu (AMZ-C011), engineered subsistence where the carrying-capacity objection was strongest (AMZ-C007, AMZ-E014), and independent sixteenth-century testimony converging on the same corridors (AMZ-E007). Negatively: the river-distance gradient across 7,363 sites (AMZ-E010) and the thin palaeoecological signal in sampled interfluves (AMZ-E011) cap maximalist readings. The new fisheries material (AMZ-C019, AMZ-C026, AMZ-E022) adds a genuinely diagnostic nuance: it shows some interfluvial areas could support year-round sedentary populations via engineered aquatic resources, which softens — without overturning — the strict river-distance reading of the matrix. Demography remains a set of assumption-driven envelopes (AMZ-C005, AMZ-C012, AMZ-E002, AMZ-E009), not a number. Sensitivity: the single record whose removal would most change the case is AMZ-E007; without it, the Carvajal rehabilitation (AMZ-C017) would drop toward weakly supported because independent contact-era corroboration would vanish, but the case verdict itself survives on the archaeological legs alone. No single thread carries the mosaic conclusion."
