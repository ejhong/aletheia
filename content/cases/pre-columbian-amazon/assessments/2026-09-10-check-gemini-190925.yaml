  synthesis: >-
    The central question posed by this case is whether Gaspar de Carvajal's 1542
    account of a populous, highly organized riverine world along the Amazon was
    an outright fabrication, an absurd exaggeration, or the genuine observation
    of a complex human landscape that underwent catastrophic early post-contact
    collapse. Synthesizing the 25 claims and associated evidence records, the
    case demonstrates that Carvajal's qualitative description of dense,
    sedentary, road-connected settlements along favored river stretches is well
    supported. The traditional mid-twentieth-century paradigm of the Amazon as
    an unengineered, pristine wilderness incapable of supporting dense
    populations has been decisively inverted by remote sensing, monumental
    earthwork surveys, dark-earth pedology, and archaeobotanical data across the
    Llanos de Mojos, the southern Amazonian rim, the Belterra Plateau, and the
    Upper Xingu. Crucially, independent sixteenth-century accounts from Diogo
    Nunes (1538) and the Pedro de Ursúa expedition (1560) confirm the same key
    structural features Carvajal described—dense populations, organized
    settlements, extensive food reserves, and overland road networks—on the
    identical middle-Amazon reaches, without reproducing his extreme warrior
    counts. At the same time, the ledger firmly rejects the opposite extreme of
    a wall-to-wall Amazonian civilization: cumulative paleoecological coring
    (Piperno et al. 2024), spatial distribution modeling across thousands of
    archaeological sites (McMichael et al. 2025), and predictive earthwork
    surfaces (Walker et al. 2023, Peripato et al. 2023) consistently show that
    river distance is the paramount predictor of settlement and that roughly 80%
    of the basin, especially deep interfluvial terra firme, was sparsely settled
    and lightly altered.

    The strongest argument against taking Carvajal at face value remains the
    wild textual instability of his numerical claims: the extreme counts of
    10,000 to 50,000 warriors and multi-league settlements exist only in the
    Medina/Muñoz manuscript branch and are completely absent from Oviedo's
    earlier witness, indicating that these figures are rhetorical or
    transcriptional amplifications rather than censuses. Furthermore, basin-wide
    demographic calculations are notoriously vulnerable to compounding model
    assumptions, as demonstrated by the fivefold drop in the 2026 Aquiry
    population model when family densities are varied, and William Denevan's
    explicit retraction of his own widely cited habitat-density methodology.
    Nevertheless, region-specific colonial records (Newson 2003) document
    depopulation collapses of 62% to 88% via interacting waves of epidemics,
    slaving raids, and forced displacement, providing a documented historical
    mechanism for how riverine populations could vanish between
    sixteenth-century incursions and later exploration. In terms of sensitivity,
    the single evidence record whose removal would most alter this case verdict
    is AMZ-E007 (the independent corroboration of middle Amazon settlement by
    Nunes and Ursúa's chroniclers). If AMZ-E007 were removed, Carvajal's
    corridor accounts would stand without contemporary textual cross-validation,
    leaving the historical leg heavily dependent on an isolated Dominican
    chronicle. However, the broader structural case verdict—that pre-Columbian
    Amazonia hosted dense, engineered, sedentary corridors within a mosaic
    landscape—would survive without AMZ-E007 on the strength of archaeological,
    LiDAR, and paleoecological evidence alone.
  steelman: If extensive interfluvial populations relied on agroforestry and
    perishable wooden architecture whose physical and pedological traces are
    rapidly erased by secondary tropical forest succession—as demonstrated in
    the Upano Valley by Bush et al. (2025)—then negative phytolith, charcoal,
    and earthwork signals from sparse sediment cores may reflect taphonomic
    erasure rather than genuine pre-Columbian emptiness.
