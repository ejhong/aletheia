  synthesis: "The featured hypothesis — that Carvajal described a real, populous
    river world that died between the visits — splits into three evidential legs
    of unequal weight. The strongest leg is the heterogeneous pre-Columbian
    Amazon: LiDAR-documented earthwork landscapes (AMZ-C004), fortified
    southern-rim villages dated to within two centuries of contact (AMZ-C006),
    Casarabe maize monoculture and landscape-scale fisheries (AMZ-C007,
    AMZ-C019, AMZ-C026), settlement systems occupied into the contact era
    (AMZ-C011), and — crucially — the counter-evidence itself (AMZ-C013,
    AMZ-C014, AMZ-C020, AMZ-C029), which confines sparsity mainly to interfluves
    and model surfaces rather than the river corridors Carvajal sailed. Together
    these make his kind of world locally plausible and invert the old
    ecological-impossibility argument. The second leg, his qualitative
    credibility, is genuinely but only provisionally supported: Nunes in 1538
    and the ten Ursúa accounts independently repeat the mundane load-bearing
    features on the same reaches (AMZ-C003), the bluff model predicts exactly
    his populated-then-empty alternation, and the extreme figures are shown to
    be manuscript-branch artifacts (AMZ-C002) — but the direct
    corridor-versus-archaeology test (AMZ-R001) has never been run, and the
    grandest regional archaeology (Aquiry peak AD 100-300) is a millennium too
    early to corroborate 1542 specifically. The third leg, the disappearance, is
    mechanistically documented (AMZ-C010, AMZ-C023) but geographically borrowed
    from upper-Amazon mission provinces. The case also honestly audits its
    demography: Denevan's self-rejection (AMZ-C012) and the Aquiry fivefold
    sensitivity span (AMZ-C005) are displayed rather than hidden, and the
    funding disclosure on the 2026 paper is disclosed with the population model
    given its most skeptical defensible reading. Sensitivity: the single most
    consequential record is AMZ-E007 (Lopes et al. 2024, the independent
    sixteenth-century Nunes/Ursúa corroboration). Without it, AMZ-C003 fails and
    AMZ-C017 loses its only contact-horizon multi-witness support, resting on a
    single contested manuscript plus chronologically mismatched or off-route
    archaeology; the case verdict would fall to weakly_supported, while the
    heterogeneity and collapse-mechanism legs would survive independently — the
    case degrades but does not collapse. Provisionally_supported is therefore a
    substantive finding, not a hedge: the burden of proof has inverted against
    the pristine-wilderness reading, but the decisive tests — the Carvajal
    corridor test (R001), the province-by-province middle-Amazon collapse
    reconstruction (R005), the promise-blind matrix survey (R003), and the blind
    stratified LiDAR calibration of the competing earthwork models (R006) —
    remain unrun. The steelman below records what a proponent can still rightly
    press."
  steelman: "The independent corroborating witnesses — Diogo Nunes in 1538, before
    Orellana, and the ten Ursúa accounts of 1560 — describe the middle Solimões
    as one of the most densely inhabited stretches of the river-mar, with
    Inca-style roads and \"infinite\" maize stores, at exactly the contact
    horizon; and no evidence record in this ledger documents contact-horizon
    archaeological emptiness on those specific reaches — the negative signals
    (Piperno's terra firme cores, Peripato's 0-1% cells, Walker's two-thirds
    dominance of other site types) all come from interfluves and other regions,
    while Newson documents 88% regional declines by 1700. A proponent can
    rightly say: every direct observation of the middle Amazon near 1542 in this
    ledger supports Carvajal, every emptiness measurement was taken somewhere
    else, and the province-by-province collapse reconstruction that would
    explain the later silence (AMZ-R005) has never been run where the dispute
    actually lives."
