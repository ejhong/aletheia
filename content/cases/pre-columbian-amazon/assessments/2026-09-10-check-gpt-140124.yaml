  synthesis: >-
    Interpreted narrowly, the featured hypothesis is that Carvajal encountered
    genuinely populous and organized societies along particular Amazonian
    reaches and that later depopulation helped produce the much emptier
    historical landscape. That proposition is provisionally supported, but the
    stronger ideas of a continuously urbanized river or a uniformly populous
    basin are not. The strongest affirmative structure begins with the
    manuscript comparison: AMZ-C002 establishes that spectacular warrior and
    village figures are unstable between manuscript branches, allowing the
    qualitative description to be evaluated separately from dubious numbers.
    AMZ-C003 then supplies the most diagnostic corroboration: independent
    sixteenth-century testimony reports dense middle-Amazon settlement, large
    stores, travelled roads, and abundant resources. Archaeology independently
    demonstrates that large, planned, engineered settlement systems were
    environmentally possible and, in several regions, persisted into contact or
    colonial times. AMZ-C010 documents severe regional post-contact losses
    through epidemics, raiding, missionization, forced service, revolt, and
    flight, providing a measured mechanism by which occupied river corridors
    could later appear sparse.

    The strongest contrary case is spatial and chronological. Much spectacular
    evidence is not evidence for Carvajal's 1542 corridor: the Aquiry peak is
    dated around AD 100–300, Casarabe ends around AD 1400, and southern-rim or
    Upper Xingu systems are geographically remote. The only quantified collapse
    reconstruction concerns Napo–Aguarico and Mainas, so applying it to the
    middle and lower reaches is an extrapolation rather than a demonstrated
    local sequence. No evidence record supplies the decisive reach-by-reach
    comparison between Carvajal's populated and empty passages and contact-
    horizon archaeology. Moreover, AMZ-C013 and AMZ-C014 support genuinely lower
    occupation in interfluves and little intensive-use signal across most
    sampled terra-firme settings. These results favor a heterogeneous mosaic,
    not a basin-wide vanished civilization. Population totals are particularly
    insecure: the Aquiry and southern-rim estimates depend on contemporaneity,
    demographic conversion, and spatial extrapolation, while Denevan expressly
    rejected the method behind his own influential basin estimate.

    The verdict therefore rests on convergence among independent testimony,
    contact-era settlements, and a documented regional collapse mechanism, not
    on headline population numbers or scientific consensus. I do not use a
    general prior about colonial epidemics to fill the missing middle- and
    lower-Amazon chronology. Sensitivity is greatest to AMZ-E007, the
    independent Nunes and Ursúa testimony. Removing that record would eliminate
    the closest corroboration of Carvajal on the same broad reaches; the present
    verdict would not survive and would fall to weakly_supported, because
    archaeology elsewhere would then establish only plausibility rather than the
    account's qualitative reliability.
  steelman: "The decisive pro-hypothesis prediction remains untested:
    contact-horizon archaeological intensity should be systematically higher in
    Carvajal's independently classified populated reaches than in his empty
    reaches and matched controls, even after route and palaeochannel uncertainty
    are modeled."
