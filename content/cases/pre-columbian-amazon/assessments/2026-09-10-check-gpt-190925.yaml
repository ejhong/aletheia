  synthesis: >-
    The evidence provisionally supports the featured hypothesis in its local,
    qualitative form: Carvajal could have encountered populous and organized
    societies along particular Amazonian reaches that were subsequently
    diminished, dispersed, or relocated. It does not establish his extreme
    numbers, continuous dense occupation, or a basin-wide civilization. The
    strongest Carvajal-specific evidence is AMZ-E007: near-contemporary,
    nominally independent testimony concerning the middle Amazon reports dense
    settlement, large food stores, travelled roads, and notable ceramics. This
    convergence is harder to explain as Carvajal's invention than his account
    alone would be. AMZ-E005 simultaneously shows why his quantitative claims
    cannot be accepted at face value: the largest warrior and village figures
    occur in one manuscript branch and are absent from the other.

    Archaeology makes the reported kind of social world physically plausible but
    does not yet verify Carvajal reach by reach. AMZ-E004 documents fortified
    settlements along a long southern arc near the contact period, while
    AMZ-E017 and AMZ-E018 place substantial Belterra and Marajoara systems into
    seventeenth-century colonization. AMZ-E019 adds a lower-weight,
    secondary-source indication of Upper Xingu continuity to about 1770.
    Engineered maize production, raised fields, fisheries, dark earths, roads,
    ponds, and earthworks rebut a strong ecological prior that Amazonian
    environments could not sustain substantial sedentary societies.
    Nevertheless, much spectacular evidence is not contact-horizon evidence: the
    Aquiry demographic peak in AMZ-E003 is dated roughly a millennium before
    Orellana, and the Casarabe florescence also ended before contact.

    The disappearance component is credible but geographically incomplete.
    AMZ-E008 documents catastrophic and uneven declines in Napo–Aguarico and
    Mainas through epidemics, raids, missionization, forced service, revolt, and
    flight. These mechanisms could empty exposed river corridors without
    requiring a single uniform epidemic wave. The strongest contrary point is
    that these reconstructions concern upper-Amazon provinces, not a
    province-by-province record for the exact middle-Amazon reaches at issue.

    Evidence for sparse interfluves is not an embarrassment to the qualified
    hypothesis; it defines its limits. AMZ-E010 and AMZ-E011 support a mosaic of
    favored riverine or engineered hotspots embedded in a lightly occupied
    matrix, although both site databases and soil cores have sampling and
    detectability problems. This directly contradicts any basin-wide dense
    Amazon reading while remaining compatible with Carvajal's own reported
    alternation of populated and empty reaches.

    The single record whose removal would most change the verdict is AMZ-E007.
    Without its independent eyewitness convergence, the physical archaeology and
    regional collapse evidence would still establish that such societies existed
    and could disappear, but would not connect them strongly enough to
    Carvajal's particular middle-Amazon observations. The present verdict would
    therefore not survive at the same level and would fall to weakly_supported;
    the Carvajal-specific case hangs substantially, though not the broader
    heterogeneous-Amazon model, on that record.
  steelman: "A proponent can demand the unperformed corridor test: if reach
    classifications frozen from both Carvajal manuscript branches predict a
    significantly denser AD 1400–1650 archaeological record in his “populated”
    reaches than in matched “empty” reaches, that risky spatial correspondence
    would directly validate his qualitative reporting. No evidence record
    provides that comparison, so this assessment does not answer the
    prediction."
