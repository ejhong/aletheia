  synthesis: >-
    The ledger evidence overturns the twentieth-century default of a uniformly
    poor, empty Amazon incapable of complex societies, while simultaneously
    refusing a basin-wide civilization narrative. Multiple independent
    measurement programs document dense, engineered, and sometimes fortified
    settlement systems along favored corridors: southwestern Aquiry earthworks
    at high density (AMZ-C004), an 1,800 km southern-rim arc of late
    pre-Columbian fortified villages (AMZ-C006), Casarabe maize monoculture with
    hydraulic infrastructure (AMZ-C007), and contact-horizon continuity at
    Belterra, Marajó Cacoal, and Upper Xingu (AMZ-C011). Landscape engineering
    (dark earths, raised fields, managed fisheries, domesticated-tree
    concentrations) is real in multiple regions (AMZ-C008, AMZ-C009, AMZ-C019,
    AMZ-C026), though tree-composition signals carry a documented post-Columbian
    confound (AMZ-E013) and raised-field use was intermittent rather than
    permanently intensive. Against this, basin-wide statistical and proxy work
    shows occupation strongly predicted by river distance (AMZ-C013), little to
    no intensive-agriculture or clearing signal in most sampled terra-firme and
    western interfluve settings (AMZ-C014), and machine-learning extents for
    earthworks/dark earths that remain limited relative to other site types
    across most of the basin (AMZ-C020, AMZ-C029 context). The resulting picture
    is the mosaic stated in AMZ-C016: substantial sedentary populations and
    engineered subsistence embedded in a lightly occupied forest matrix.

    Carvajal’s qualitative social geography — populous, road-connected,
    food-storing riverine societies alternating with empty stretches — is
    textually real (AMZ-C001), partially independent of the unstable extreme
    warrior and league-length figures confined to one manuscript branch
    (AMZ-C002), and independently echoed for the middle Amazon by Nunes and the
    Ursúa corpus (AMZ-C003). Contact-era occupation of major systems and
    documented catastrophic but uneven colonial declines via mixed mechanisms
    (AMZ-C010, AMZ-C023) make local emptying after 1542 demographically and
    historically available. Extreme basin-wide population headlines remain
    model-family dependent and assumption-sensitive (AMZ-C005, AMZ-C012);
    radiocarbon SPDs fit pre-contact logistic growth without requiring an
    endogenous pre-1492 crash (AMZ-C015). The featured hypothesis that Carvajal
    described a real world that later emptied is therefore locally and
    qualitatively provisionally supported, while his numbers are not counts and
    his representativeness of the whole basin remains the open parameter. No
    single evidence record forces a stronger basin-wide verdict; the mosaic is
    the evidence-warranted position. Sensitivity is highest to the
    contact-horizon continuity package (AMZ-C011) and the independent
    sixteenth-century riverine testimony (AMZ-C003): remove either and the
    bridge from earthwork grandeur to Carvajal’s 1542 world weakens materially,
    though the heterogeneous landscape finding would survive.
  steelman: Independent mid-sixteenth-century witnesses (Nunes 1538 and the ten
    Ursúa accounts) repeatedly describe dense settlement, vast food stores, long
    straight roads, and renowned ceramics on the same middle-Amazon reaches
    Carvajal named, yet the ledger still lacks a preregistered, contact-horizon
    archaeological intensity test that maps those specific populated versus
    empty reaches onto dated sites — leaving the strongest multi-witness textual
    prediction of a real, later-emptied riverine world only partially closed by
    existing excavation programs.
