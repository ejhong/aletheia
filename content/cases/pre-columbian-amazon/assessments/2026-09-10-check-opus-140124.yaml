  synthesis: "The case as framed by the ledger has two separable components, and
    they do not stand equally. The first — that pre-Columbian Amazonia was a
    strongly heterogeneous human landscape, with engineered, densely occupied
    corridors and hotspots embedded in a much more lightly used forest matrix —
    is well supported and, unusually, supported from both directions by
    independent method families. Positive: LiDAR earthwork counts in the
    southwest (AMZ-E001), an 1,800 km arc of fortified southern-rim villages
    dated AD 1250–1500 (AMZ-E004), Casarabe drainage canals, farm ponds and
    ubiquitous maize phytoliths (AMZ-E014), landscape-scale fishery
    infrastructure and 17,000+ fish remains at an interfluvial mound (AMZ-E022),
    and dark-earth settlement systems at Santarem and Marajo occupied into the
    colonial period (AMZ-E017, AMZ-E018). Negative: 7,363 sites with river
    distance as the dominant predictor (AMZ-E010), a fourteen-region phytolith
    and charcoal synthesis finding little intensive-use signal in most sampled
    terra firme (AMZ-E011), and machine-learning extents described by their own
    authors as limited albeit impressive. Both signals are biased — site
    databases toward accessible rivers, soil cores toward a tiny sampled volume
    (AMZ-C021) — but the biases run in opposite directions, and the mosaic
    reading survives both. The second component is the case's actual founding
    question: that Carvajal described a real world on the middle Amazon which
    was subsequently emptied. Here the ledger is thinner than the first
    component's strength suggests. The corroboration on Carvajal's own reaches
    is documentary (Nunes 1538, ten Ursua accounts, AMZ-E007), not
    archaeological; the spectacular archaeology is either a millennium too early
    (Aquiry peak AD 100–300, explicitly flagged in AMZ-E003), ends roughly 140
    years before Orellana (Casarabe, AMZ-E037), or lies off-route (southern rim,
    Llanos de Mojos). Contact-horizon continuity is demonstrated at Santarem,
    Marajo and the Upper Xingu — none of them the Machiparo or Omagua provinces
    at issue. The collapse mechanism is real and quantified, but only for
    upper-Amazon provinces with mission records (AMZ-E008); its extension
    downriver is extrapolation, and Newson's own fade-out and flight findings
    show collapse was interactive rather than a uniform wave. Meanwhile every
    population number in the ledger — Aquiry, southern rim, Upper Xingu,
    Denevan's basin totals — is exposed as a family of shared modelling
    assumptions rather than independent measurement, a point the ledger makes
    honestly against its own headline (AMZ-E002, AMZ-E009). Steelmanning the
    sceptic: nothing here archaeologically demonstrates a 1542 population on the
    Solimoes, and the account's extreme figures survive in only one manuscript
    branch. Steelmanning the proponent: the sceptic must explain why three
    mutually hostile sixteenth-century sources independently report the same
    mundane features on the same reaches, and why detection failure is not the
    simpler explanation for the archaeological silence. Provisionally supported
    is the warranted verdict: the environment-cannot-support-it argument is
    dead, the mosaic is well established, and Carvajal's qualitative picture is
    plausible and partly corroborated — but the specific corridor claim remains
    untested by the direct method (AMZ-R001) that would settle it. Sensitivity:
    the single record whose removal would most change the case verdict is
    AMZ-E007, the Nunes/Ursua corroboration; without it the only independent
    testimony to Carvajal's own reaches disappears and the founding hypothesis
    would drop to unresolved, since all remaining archaeology is off-route or
    off-epoch. The mosaic finding (AMZ-C016) survives its removal untouched; the
    Carvajal-specific verdict does not."
  steelman: Bush et al. 2025 at Upano shows that a long forest-recovery interval
    largely eradicated the influence of pre-Columbian occupations from the
    ecological record while the later Colonial signal persisted in the very same
    profiles. That is a documented, time-graded erasure mechanism operating
    precisely against detection of late pre-contact populations. No evidence
    record in this ledger calibrates how much occupation the phytolith,
    charcoal, and pollen proxies would miss for a population that vanished
    around 1550–1650 on alluvial, frequently reworked floodplain terrain — the
    exact taphonomic setting of Carvajal's riverbank villages. A proponent can
    therefore say that the negative interfluvial and terra-firme record
    (AMZ-C014, AMZ-C020) has never been shown capable of detecting the thing it
    is used to rule out, and that the ledger contains no excavation program on
    the Machiparo–Omagua reaches that has looked and failed to find. Absence of
    a contact-horizon signal there is currently absence of fieldwork, and my
    downgrade of the corridor claim rests on a silence whose informativeness is
    unmeasured.
