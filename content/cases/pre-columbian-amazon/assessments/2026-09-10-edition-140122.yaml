caseAssessment:
  verdict: well_supported
  whatIsClaimed: That immediately before European contact the Amazon held large, sedentary, politically organized populations living in settlement systems along the major rivers and favoured savannas; that they engineered their landscape at scale (raised fields, canals, farm ponds, fish weirs, dark-earth soils, managed forests); that Carvajal's 1542 account is substantially accurate eyewitness testimony to the qualitative shape of that world; and that Old World epidemics, slave raiding, missionization and flight destroyed and dispersed it fast enough that the emptier Amazon met by later travellers records collapse rather than proving the earlier account false.
  whereDisagreementLives: "Not over whether complex Amazonian societies existed — earthworks, dark earths, planned settlements and engineered fisheries are established. The live cruxes are proportion, inference and time. Proportion: how representative Carvajal's corridor is of a basin in which river distance is the dominant predictor of known occupation and most sampled interfluves show little intensive modification — with both the positive and negative records drawn from biased samples. Inference: whether any population figure survives its own assumptions (the Aquiry headline falls roughly fivefold under the paper's own alternative; the Xingu and southern-rim figures are ethnographic conversions from a handful of surveyed clusters), and how much of Carvajal is textual bedrock versus transmission artifact. Time: the most spectacular landscapes — the Aquiry peak (AD 100–300) and Casarabe (AD 500–1400) — predate contact, so the case must separate a pre-European disappearance from the post-contact one, and the contact-horizon evidence that actually bears on 1542 is a smaller set (southern rim, Belterra, Marajó, Xingu — the last with its late terminus resting on a secondary source)."
  whatWouldSettleIt: "A preregistered Carvajal corridor test: classify his populated and empty reaches from the manuscript witnesses alone, model route and palaeochannel uncertainty, then compare contact-horizon (AD 1400–1650) archaeological intensity in predicted corridors against matched control reaches. Alongside it: the 39-lake pollen synthesis read from its primary and mapped against his corridor and the radiocarbon curve, to decide whether abandonment on the main river began before or after 1492; interfluve surveys on a frame chosen blind to archaeological promise, with proxy-sensitivity controls; a classification of the 432 Aquiry earthworks by type and date to find any that postdate AD 1400; a synoptic manuscript-witness table; and demographic estimates re-derived under a common assumption set so that model families stop masquerading as independent censuses."
  bestConventionalExplanation: "The modern skeptical position is not the old ecological-impossibility argument; it concedes major regional societies and argues limits. Orellana travelled the richest corridors — precisely where settlement concentrated and where archaeology preferentially looks and preserves — so substantial corroboration there cannot license basin-wide extrapolation. Sampled western and interfluvial palaeoecology shows large areas without intensive cultivation, clearing or soil modification, and machine-learning prediction over known sites finds the earthwork and dark-earth extents limited relative to the basin. The famous population totals are model outputs whose assumptions do most of the work, and their originator withdrew the method behind the most-cited figure. The largest engineered landscapes had already declined centuries before contact, so some of the later forest is pre-European regrowth. And Carvajal's extreme figures are textually unstable across manuscript branches, consistent with a truthful observer whose numbers grew in the telling. On this view the mosaic is real but modest: dense hotspots, thin matrix, two disappearances, and a chronicle that is qualitatively honest and numerically unreliable."
