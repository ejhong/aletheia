  synthesis: "The case verdict is well_supported for the heterogeneous-mosaic thesis (AMZ-C016) and for the qualitative rehabilitation of Carvajal (AMZ-C017), carried from both directions. Positively: independent sixteenth-century witnesses on the same reaches (AMZ-E007); manuscript evidence that the extreme numbers are transmission-level (AMZ-E005); contact-horizon settlement systems on the friar's own river and its rim (AMZ-E017, AMZ-E018, AMZ-E004, AMZ-E019); and engineered subsistence where the carrying-capacity objection was strongest (AMZ-E014, AMZ-E022). Negatively: the river-distance gradient across 7,363 sites (AMZ-E010) and thin intensive-use signals in sampled terra firme (AMZ-E011) cap maximalist readings. The new primaries sharpen the chronology rather than the verdict: AMZ-E037 dates Casarabe to AD 500–1400 and AMZ-E003 dates the Aquiry peak to AD 100–300, so the two most spectacular engineered landscapes do not overlap 1542 and cannot be spent as contact-era corroboration; the case now carries a pre-contact disappearance alongside the documented post-contact one (AMZ-E008), and AMZ-C015's growth-to-contact reading is held provisional pending AMZ-R006 because the competing pollen-based finding is not yet in the ledger from its primary. The Heckenberger 2008 source record shows the Xingu '1770' clause of AMZ-C011 rests on journalism (AMZ-E019); the Belterra and Marajó legs are primary and strong. Demography remains assumption-driven envelopes (AMZ-E002, AMZ-E004, AMZ-E009, AMZ-E035/E036), not a number. Sensitivity: the single record whose removal would most change the case verdict is AMZ-E017 (Belterra Plateau, ca. AD 1300 to seventeenth-century colonization, on the lower Amazon Orellana descended). Without it, contact-horizon continuity on the main river would rest on the Marajó estuary and a secondary Xingu source, AMZ-C011 would fall to provisionally_supported, and AMZ-C017 and the 'died between the visits' reading would lose their strongest archaeological leg — the case would drop toward mixed. Removal of AMZ-E007 is the second-largest sensitivity: it would strip the independent corroboration and lower AMZ-C017 toward weakly_supported while leaving the mosaic verdict intact."
  steelman: "The strongest argument for the fuller vindication — that Carvajal saw a populous world at something like the scale he implies, and that the later silence is entirely post-contact — is a sampling argument this assessment cannot yet answer. Everywhere canopy-penetrating LiDAR has been flown at scale it has multiplied the known record by an order of magnitude (432 earthworks where 36 were known, AMZ-E001; Belterra's settlement limits expanded, AMZ-E017), so every present density estimate is a lower bound by an unknown factor. The negative evidence, meanwhile, is doubly weak: the sparse-west conclusion rests on about a cubic metre of sediment for two million square kilometres (AMZ-C021), and forest recovery demonstrably erases pre-Columbian signals while sparing colonial ones (AMZ-C022), so an absent signal from 1542 is expected even where people lived. Add three independent witnesses across twenty-two years agreeing on the same reaches (AMZ-E007), documented 88 percent collapse where records exist (AMZ-E008) with flight from the exposed main-river banks as a stated mechanism, and a basin-wide radiocarbon curve that shows no pre-European decline (AMZ-E020), and the honest inference is that the mosaic's 'thin matrix' is an artifact of where we have looked and what has survived. This assessment holds the mosaic because the river-distance gradient persists inside the sampled record and because the biggest engineered landscapes are dated well before contact; it does not have the promise-blind interfluve survey (AMZ-R003) that would answer the sampling argument directly."
