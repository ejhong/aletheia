  synthesis: "The thesis graded here is the heterogeneous one: substantial sedentary populations, engineered subsistence and settlement systems along favored corridors and hotspots, set in a much more lightly occupied forest matrix, with Carvajal qualitatively credible and numerically unreliable. It is carried from both directions. Positively: earthworks at enormous scale (AMZ-E001), fortified southern-rim villages dated AD 1250–1500 (AMZ-E004), settlement systems occupied into the seventeenth and eighteenth centuries at Santarém, Marajó and the Xingu (AMZ-E017, AMZ-E018, AMZ-E019), engineered year-round maize and fisheries where the carrying-capacity objection was strongest (AMZ-E014, AMZ-E022), and independent 1538 and 1560 witnesses converging on the same middle-Amazon reaches Carvajal described (AMZ-E007). Negatively: the river-distance gradient across 7,363 sites (AMZ-E010) and the thin intensive-use signal in fourteen sampled regions (AMZ-E011) cap the garden-Amazon reading, while the sampling critique (AMZ-C021) and time-graded erasure (AMZ-C022) keep those negatives from being read as proof of emptiness. Demography stays a set of assumption-driven envelopes (AMZ-E002, AMZ-E009), and the new basin-wide comparator (AMZ-E038, AMZ-E039) shows earthwork totals themselves differ several-fold between published models; the tree-species corroboration (AMZ-E040, AMZ-E041) is from one research network and counts once. Neither the invention reading nor the pristine wilderness survives the record; what the record cannot yet fix is the matrix density that separates the mosaic from the modest skeptic, and it cannot yet place contact-horizon archaeology on Carvajal's own reaches, since the dated systems lie downstream and to the south. Sensitivity: the single evidence record whose removal would most change the case verdict is AMZ-E007. Without it the Carvajal leg (AMZ-C017) drops to weakly supported, because every remaining corroboration is archaeological, off his route, or earlier than him, and the case verdict would fall to provisionally supported for the founding question even though the archaeological mosaic (AMZ-C016) would stand. On the matrix side, AMZ-E010 plays the equivalent role: without it the lightly occupied half rests on contested soil cores alone."
  steelman: "Every witness who saw the middle Amazon before the epidemics — Nunes in 1538, Carvajal in 1542, the ten Ursúa chroniclers in 1560 — reports the same specific, unglamorous features on the same reaches: stores of maize, long straight roads compared to Inca roads without walls, ceramics of known reputation, dense settlement. These witnesses wrote for different crowns, disliked one another, and did not copy one another; convergence on mundane detail is exactly what shared exaggeration does not produce. Nothing in the ledger contradicts them for those reaches — the negative evidence comes from interfluves and the west, not from the Solimões bluffs. Where colonial records permit counting, decline of 62–88 percent within a century and a half is documented, by mechanisms — flight from exposed river locations, gathering into missions, slave raids — that empty riverbanks specifically; every lower-Amazon settlement system dated so far runs to the seventeenth century and then stops; and the basin-wide radiocarbon proxy grows to the eve of contact with no endogenous crash. On this argument the burden lies on the skeptic to explain why corridor eyewitnesses should be discounted when nothing contradicts them where they stood, and this assessment has no record that does so; it holds Carvajal at provisionally supported only because the direct corridor test has not been run."
