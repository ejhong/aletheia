caseAssessment:
  verdict: well_supported
  whatIsClaimed: "That Gaspar de Carvajal's 1542 chronicle describes a real world — populous, organized, road-connected riverine societies along specific reaches of the Amazon; that Amazonian environments could and did support large sedentary populations with engineered subsistence, at scales revealed by LiDAR earthworks, dark earths, raised fields, canals and fish weirs; and that Old World epidemics, slave raiding, missionization and flight destroyed and dispersed that world fast enough that the emptier Amazon met by later travelers records a collapse rather than proving the earlier account false. The version this assessment grades is the heterogeneous one: dense corridors and hotspots embedded in a lightly occupied forest matrix, with Carvajal qualitatively credible and his extreme numbers a transmission artefact."
  whereDisagreementLives: Not over whether complex Amazonian societies existed — earthworks, dark earths, engineered savannas and planned settlements are established beyond argument. The live cruxes are proportion and inference. How representative were the populated corridors of the basin, when river distance is the dominant predictor of known occupation and most sampled interfluves show little intensive modification — yet the negative sampling is thin and the pre-Columbian signal erodes with time? Do population estimates survive their own assumptions, when the largest recent figure falls roughly fivefold under the paper's own alternative reading, the field's most influential estimator rejected his own method, and earthwork totals differ several-fold between predictive models? How much of Carvajal is textual bedrock versus transmission artefact, when the most famous warrior counts sit in one manuscript branch only? And are spectacular but much earlier or geographically distant sites — the Aquiry peak of AD 100–300, the Casarabe world ending around 1400, the lower-Amazon systems — being silently spent as evidence about the reaches Carvajal saw in 1542?
  whatWouldSettleIt: "A preregistered Carvajal corridor test: classify his populated and empty reaches from the manuscript witnesses alone, model route and palaeochannel uncertainty, then compare contact-horizon archaeological intensity in his populated corridors against matched controls — before consulting the archaeological layers. Alongside it: a synoptic manuscript-witness table separating what every Carvajal branch shares from what one branch carries; promise-blind interfluve surveys with proxy-sensitivity controls to measure the matrix density directly; a probability-stratified, blind LiDAR sample to calibrate the competing earthwork totals; demographic estimates re-derived under a common assumption set; and province-by-province collapse timelines extended to the Solimões, so that the reconciliation argument stops borrowing ratios from provinces with records."
  bestConventionalExplanation: "The modern skeptical position is not the old ecological-impossibility argument; it concedes major regional societies and argues limits. Orellana travelled the richest corridors — the bluff-and-channel settings where settlement concentrated and where archaeology preferentially looks and preserves — so corroboration there cannot license basin-wide extrapolation. Sampled western and interfluvial palaeoecology shows large areas without intensive cultivation, clearing or soil modification, and predictive modeling over known sites finds the spectacular earthworks and dark earths a limited, if impressive, fraction. The famous population totals are model outputs whose assumptions — site contemporaneity, persons per earthwork, extrapolation domains — do most of the work, and the estimators themselves have said so. Carvajal's extreme figures are textually unstable across manuscript branches, consistent with a truthful observer whose numbers grew in the telling. On this view the mosaic is real but modest: dense hotspots, thin matrix, and a chronicle that is qualitatively honest and numerically unreliable, describing a world that was both smaller than legend and then genuinely destroyed."
