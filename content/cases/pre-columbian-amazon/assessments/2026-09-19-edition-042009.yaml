caseAssessment:
  verdict: well_supported
  whatIsClaimed: "That Gaspar de Carvajal's 1542 chronicle describes a real world — populous, organized, road-connected riverine societies along specific reaches of the Amazon; that Amazonian environments could and did support large sedentary populations with engineered subsistence, at scales revealed by LiDAR earthworks, dark earths, raised fields, canals and fish weirs; and that Old World epidemics, slave raiding, missionization and flight destroyed and dispersed that world fast enough that the emptier Amazon met by later travelers records a collapse rather than proving the earlier account false. The version this assessment grades is the heterogeneous one: dense corridors and hotspots embedded in a lightly occupied forest matrix, with Carvajal qualitatively credible and his extreme numbers a transmission artefact whose direction of travel between the manuscript branches is not yet fixed."
  whereDisagreementLives: Not over whether complex Amazonian societies existed — earthworks, dark earths, engineered savannas and planned settlements are established beyond argument. The live cruxes are proportion and inference. How representative were the populated corridors of the basin, when river distance is the dominant predictor of known occupation and most sampled interfluves show little intensive modification — while the critiques of that negative sampling, and the erasure argument that would discount it, are held in this ledger on anchors without admitted records? Do population estimates survive their own assumptions, when the largest recent figure falls roughly fivefold under the paper's own alternative reading, the field's most influential estimator rejected his own method, and earthwork totals differ several-fold between predictive models? How much of Carvajal is textual bedrock versus transmission artefact, when the most famous warrior counts sit in one manuscript branch only and the other branch was, by its compiler's own statement, supplemented from Orellana's mouth? And are spectacular but much earlier or geographically distant sites — the Aquiry peak of AD 100–300, Upano ending by 600 CE, the Casarabe world ending around 1400, the lower-Amazon systems — being silently spent as evidence about the reaches Carvajal saw in 1542?
  whatWouldSettleIt: "A preregistered Carvajal corridor test: classify his populated and empty reaches from the manuscript witnesses alone, model route and palaeochannel uncertainty, then compare contact-horizon archaeological intensity in his populated corridors against matched controls — before consulting the archaeological layers. Alongside it: a synoptic manuscript-witness table separating what every Carvajal branch shares from what one branch carries, and marking which Oviedo passages derive from Orellana's oral account; promise-blind interfluve surveys with proxy-sensitivity controls to measure the matrix density directly; the Biblioteca Nacional manuscript reading that fixes the 1650 Omagua headcount; an erasure-decay calibration against sites with dated abandonments, so the Upano argument stops standing in for four-century-old signals; a probability-stratified blind LiDAR sample to calibrate the competing earthwork totals; demographic estimates re-derived under a common assumption set; and province-by-province collapse timelines extended to the Solimões."
  bestConventionalExplanation: "The modern skeptical position is not the old ecological-impossibility argument; it concedes major regional societies and argues limits. Orellana travelled the richest corridors — the bluff-and-channel settings where settlement concentrated and where archaeology preferentially looks and preserves — so corroboration there cannot license basin-wide extrapolation. Sampled western and interfluvial palaeoecology shows large areas without intensive cultivation, clearing or soil modification, and predictive modelling over known sites finds the spectacular earthworks and dark earths a limited, if impressive, fraction. The famous population totals are model outputs whose assumptions — site contemporaneity, persons per earthwork, extrapolation domains — do most of the work, and the estimators themselves have said so. Carvajal's extreme figures are textually unstable across manuscript branches that are not independent of one another, consistent with a truthful observer whose numbers changed in the telling; his contemporary endorsements are of his character, not his counts. On this view the mosaic is real but modest: dense hotspots, thin matrix, and a chronicle that is qualitatively honest and numerically unreliable, describing a world that was both smaller than legend and then genuinely destroyed."
