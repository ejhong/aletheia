  synthesis: "The thesis graded is the heterogeneous one: substantial sedentary populations, engineered subsistence and settlement systems along favored corridors and hotspots, set in a much more lightly occupied forest matrix, with Carvajal qualitatively credible and numerically unreliable. It is carried from both directions by admitted records. Positively: earthworks at enormous scale (AMZ-E001), fortified southern-rim villages dated AD 1250–1500 (AMZ-E004), settlement systems occupied into the seventeenth and eighteenth centuries at Santarém, Marajó and the Xingu (AMZ-E017, E018, E019), engineered year-round maize and a year-round interfluvial fish diet where the carrying-capacity objection was strongest (AMZ-E014, E022), and independent 1538 and 1560 witnesses converging on the same middle-Amazon reaches Carvajal described (AMZ-E007), with the extreme figures shown to be branch-specific (AMZ-E005). Negatively: the river-distance gradient across 7,363 sites (AMZ-E010) and the thin intensive-use signal in fourteen sampled regions (AMZ-E011) cap the garden-Amazon reading. Demography stays a set of assumption-driven envelopes (AMZ-E002, E009); the basin-wide comparator (AMZ-E038, E039) shows earthwork totals differ several-fold between models; the tree-species corroboration (AMZ-E040, E041) is from one research network and counts once. Six featured limits claims — the fisheries infrastructure (C019), the site-type and probability-surface modelling (C020, C029), the soil-core sampling critique (C021), the Upano erasure (C022) and the epidemic fade-out mechanism (C023) — are held on anchors with no admitted evidence record and are graded unresolved; the qualifiers that would keep the negatives from being read as proof of emptiness are therefore statements, not records, and the lightly-occupied half of the thesis rests on E010 and E011 with their own stated limitations. The Upano chronology (AMZ-E073, E074, E115) dates the erased occupation to 300–600 CE with reoccupation to 1200 CE, so even if the erasure claim is admitted it speaks to a millennium-old signal, not to the four-century-old signal of a riverbank depopulated in the 1600s; AMZ-R008 is the test. The Medina 1894 records newly admitted on the chronicle change how the textual leg is read without changing its grade: Oviedo's own statement that he supplemented the friar's text orally from Orellana and his companions (AMZ-E089) means the two manuscript branches are not independent witnesses, so the branch comparison (E005) establishes that the figures are unstable but not which way they moved; the earliest lie-charge, Gómara's 'mentirosa', targeted Orellana's relación and the Amazons episode, not the populous settlements (AMZ-E080, E082, E099, E100); Herrera's history follows Carvajal almost to the letter (AMZ-E093), so later Spanish narratives are redactions, not corroboration; and the contemporary endorsements — Oviedo's two arrow wounds and reputation (E105, E106, E113, E114), the friar's truth-oath (E091), Medina's 'complete faith' limited to voyage events with caveats for supernatural attribution and partisanship for Orellana (E109, E110, E111) — are credibility of the witness, not tests of content, and add no diagnostic weight. Achmatowicz's geographic-route assessment (AMZ-E072, E077) converges with C017 but is abstract-only and silent on the qualitative-versus-numerical split. Neither invention nor pristine wilderness survives the record; what it cannot yet fix is the matrix density that separates the mosaic from the modest skeptic, or contact-horizon archaeology on Carvajal's own reaches. Sensitivity: the single evidence record whose removal would most change the case verdict is AMZ-E007. Without it the Carvajal leg (C017) falls to weakly supported — every remaining corroboration is archaeological, off his route, earlier than him, or about his character — and the founding question's verdict would fall to provisionally supported even though the archaeological mosaic (C016) would stand. On the matrix side AMZ-E010 plays the equivalent role: without it the lightly occupied half rests on the fourteen-region synthesis alone."
  steelman: "Every witness who saw the middle Amazon before the epidemics — Nunes in 1538, Carvajal in 1542, the ten Ursúa chroniclers in 1560 — reports the same specific, unglamorous features on the same reaches: stores of maize, long straight roads compared to Inca roads without walls, ceramics of known reputation, dense settlement (AMZ-E007). These witnesses wrote for different crowns and, on the admitted reading, did not copy one another; convergence on mundane detail is what shared exaggeration does not produce, and the one feature that does not converge — the giant warrior counts — is exactly the feature the manuscript branches show to be unstable (AMZ-E005). Proponents read that pattern as the signature of a truthful observer whose numbers moved in transmission; they note that the 1894 editor who collated the branches judged the chronicle, limited to the events of the voyage, worthy of complete faith (AMZ-E109), and that the earliest charge of lying, Gómara's, was aimed at the captain's narrative and at the Amazons, never at the towns (AMZ-E080, E099) — so the invention account, on their reading, was born from a marvel and later transferred to the settlements without new grounds. A scholar working from a different direction, testing the chronicle's geographic reference points and league distances against the river, reads the manuscript as a trustworthy source (AMZ-E072); proponents take that as an independent check on the friar's honesty, though this ledger has read only the abstract. Nothing admitted contradicts the witnesses where they stood: the negative palaeoecology is from interfluves and the west, not from the Solimões bluffs. Where colonial records permit counting, decline of 62–88 percent within a century and a half is documented, by mechanisms — flight from exposed river locations, gathering into missions, slave raids — that empty riverbanks specifically (AMZ-E008); every lower-Amazon settlement system dated so far runs into the seventeenth century or later (AMZ-E017, E018, E019); and the basin-wide radiocarbon proxy grows to the eve of contact with no endogenous crash (AMZ-E020). On this argument the burden lies on the skeptic to explain why corridor eyewitnesses should be discounted when nothing contradicts them where they stood, and this assessment has no record that does so; it holds Carvajal at provisionally supported only because the direct corridor test has not been run, the dated contact-era systems lie off his route, and the manuscript branches have not yet been collated to show which way the figures moved."
