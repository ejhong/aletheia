  synthesis: >-
    The central question posed by this case is whether Gaspar de Carvajal's 1542
    chronicle of a populous, politically organized, and landscape-transforming
    Amazonian river world was a fabulation, a gross exaggeration, or an
    eyewitness account of a society that collapsed shortly after contact. Across
    archaeology, ethnohistory, paleoecology, and historical demography, the
    evidence decisively rejects the twentieth-century paradigm of Amazonia as an
    untouched, uniformly pristine wilderness incapable of supporting dense
    sedentary populations. At the same time, it firmly resists the romantic
    counter-claim of an unbroken, basin-wide civilization. The ledger strongly
    supports an intermediate, structurally heterogeneous model: dense,
    sedentary, highly engineered settlement corridors—concentrated along
    floodplains, river-bluff junctions, and seasonal savannas—embedded within a
    vast, lightly occupied terra-firme forest matrix.

    The argument for Carvajal's qualitative credibility is substantial. Multiple
    independent sixteenth-century accounts (Nunes in 1538, the ten chroniclers
    of the 1560 Ursúa voyage) describe the exact same riverine hallmarks
    Carvajal reported on the middle Amazon: dense riverside settlements,
    fortified towns, massive food stores, paved roads, and sophisticated
    ceramics (AMZ-C003). Crucially, Carvajal's own text reports long empty
    stretches alternating with populated zones, matching the geomorphological
    "bluff model" where dense settlements cluster where main channels impinge on
    high bluffs (AMZ-C001). Furthermore, late pre-Columbian archaeology confirms
    that major settlement systems across the southern rim (AMZ-C006), the
    Belterra Plateau, Marajó, and the Upper Xingu (AMZ-C011) were densely
    populated, architecturally planned, and inhabited up to and through early
    European contact. Catastrophic post-contact collapse is empirically
    documented in regional mission archives, where populations plummeted by 62%
    to 88% through synergistic epidemics, slave raiding, and displacement
    (AMZ-C010, AMZ-C023).

    However, the skeptical critique retains immense force regarding Carvajal's
    quantitative reliability and the extent of the interfluves. Denevan's
    collation proves that the most extreme figures (armies of 50,000 warriors,
    multi-league towns) exist only in the Medina/Muñoz manuscript tradition and
    are absent in Oviedo, showing Carvajal's numbers to be textually unstable
    and rhetorical rather than census counts (AMZ-C002). Furthermore,
    demographic models extrapolating millions of inhabitants across southwestern
    Amazonia or the southern rim hinge entirely on unverified assumptions of
    site contemporaneity and household sizes, collapsing fivefold under minimal
    sensitivity adjustments (AMZ-C005, AMZ-C012). On the landscape side,
    multi-region soil core syntheses and predictive modeling demonstrate that
    river distance remains the primary predictor of occupation (AMZ-C013), with
    80% of the basin showing near-zero probability of earthworks (AMZ-C029) and
    cumulative terra-firme phytolith profiles showing closed canopies without
    crop agriculture, fire, or anthropic dark earths (AMZ-C014).

    In terms of sensitivity, the single evidence record whose removal would most
    alter this case verdict is AMZ-E011 (Piperno et al. 2024, summarizing 14
    regions of negative paleoecological signals in terra-firme settings).
    Removing AMZ-E011 would leave the case for a sparse interfluvial matrix
    reliant almost entirely on predictive machine-learning surfaces, making the
    model highly vulnerable to Clement et al.'s sampling critique (AMZ-C021) and
    the Upano paleoecological erasure finding (AMZ-C022). Nevertheless, even
    without AMZ-E011, the heterogeneous mosaic verdict survives, sustained by
    empirical site-distribution modeling (AMZ-E010), intermittent-use
    raised-field dynamics (AMZ-E016), and the spatial clustering of known
    monumental earthworks.
  steelman: Centuries of post-abandonment forest succession in the Upano Valley
    largely eradicated all pre-Columbian paleoecological signals from soil
