  synthesis: "The case's featured hypothesis — that Carvajal described a real,
    organized riverine world that largely died between his descent and the later
    silence — decomposes into three independently supported legs. First, the
    qualitative social geography: witnesses from hostile expeditions under
    different crowns (Nunes 1538, the ten Ursúa accounts of 1560) repeat the
    mundane load-bearing features — dense riverbank settlement, vast food
    stores, long straight roads, renowned ceramics — on the same middle-Amazon
    reaches, without repeating his extreme numbers, which the manuscript-branch
    comparison shows to be textually unstable (AMZ-C002, C003, C017). Second,
    the archaeology establishes that such worlds existed into or near the
    contact era (Belterra to the seventeenth century, Cacoal to 1650, Upper
    Xingu to ca. 1770) and that engineered, populous societies were normal in
    favored corridors and savannas (Casarabe, the Aquiry earthworks, the
    southern rim, Upano) — while the same survey record documents genuinely
    sparse interfluves (McMichael's 7,363-site model, Piperno's fourteen-region
    synthesis, Peripato's 0–1% basin majority, Walker's extent limits). Third,
    the collapse mechanism is documented where records exist: 88% and 62–64%
    regional declines by circa 1700 through interacting epidemics, raids,
    missionization, and flight (Newson), with fade-outs making collapse an
    interactive process rather than a single wave. Sensitivity: the single
    record whose removal would most change this case is AMZ-E007 — without the
    Nunes/Ursúa corroboration, the Carvajal-credibility leg (AMZ-C017) drops to
    provisionally supported, resting on manuscript-branch comparison and
    bluff-model plausibility alone; the heterogeneity core (AMZ-C016) survives
    on archaeology that does not touch any text. Demographic numbers are the
    soft tissue: every audited headline is model-sensitive (the Aquiry fivefold
    span, the southern rim's stated assumptions, Denevan's self-rejection), so
    the defensible finding is magnitudes, not censuses. The
    basin-wide-civilization reading is the position this ledger's evidence
    actually weighs against; the pristine-wilderness reading is contradicted for
    corridors and hotspots but not for the forest matrix, which remains the
    least-measured parameter in the case. The 2026 population model's funding
    disclosure is handled correctly by giving the estimate its most skeptical
    defensible reading rather than discarding the underlying LiDAR
    measurements."
  steelman: Three expeditions under different flags and patrons two decades apart
    — Nunes (1538), Orellana (1542), and ten separate Ursúa chroniclers (1560) —
    independently converge on the same mundane particulars (wide straight roads,
    vast maize stores, renowned ceramics) for the same middle-Amazon reaches, a
    specificity hostile genre convention is unlikely to produce by coincidence;
    and no contact-horizon archaeological survey of Carvajal's actual route
    (research item AMZ-R001) has ever been run, so nothing in this ledger
    directly tests his populated reaches against the ground. Until that test
    exists, the convergent-testimony case for his qualitative social geography
    is unrebutted, and the sparse-interfluve evidence does not bear on the
    riverine corridors he actually described.
