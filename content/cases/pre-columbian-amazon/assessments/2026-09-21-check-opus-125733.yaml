  synthesis: "The case as framed has two legs, and they are not equally strong.
    The first leg — that pre-Columbian Amazonia was a strongly heterogeneous
    human landscape, with engineered, densely settled corridors embedded in a
    lightly occupied matrix (AMZ-C016) — is carried by convergent evidence of
    two opposite signs, which is what makes it robust. On the positive side:
    LiDAR documenting 432 earthworks with only 36 previously known (AMZ-E001),
    an 1,800 km arc of fortified villages dated AD 1250–1500 by the excavators'
    own radiocarbon (AMZ-E004), phytolith-documented year-round maize with
    drainage canals and farm ponds in the Llanos de Mojos (AMZ-E014), 17,000
    fish remains showing year-round interfluvial exploitation (AMZ-E022), and
    dated occupation into the seventeenth and eighteenth centuries at Santarém,
    Marajó and the Upper Xingu (AMZ-E017, AMZ-E018, AMZ-E019). On the negative
    side, and equally load-bearing: river distance as the dominant occupation
    predictor across 7,363 sites (AMZ-E010) and a fourteen-region
    phytolith/charcoal synthesis finding little to no intensive-use signal in
    most sampled terra firme (AMZ-E011). These do not conflict; they jointly
    specify a mosaic. That leg I would call well supported on its own. The
    second leg — that Carvajal described a real world which then died — is
    weaker and is what caps the case verdict. Its strongest support is AMZ-E007:
    Diogo Nunes in 1538 and ten Ursúa-expedition accounts in 1560, writing for
    different interests, independently report dense settlement, vast maize
    stores, straight roads and renowned ceramics on the same middle Solimões
    reaches. That is genuine corroboration of the qualitative picture, and
    AMZ-E005 shows the notorious numbers live in only one manuscript branch, so
    the account can be credited qualitatively without crediting the counts. But
    the corroboration is textual, not archaeological: the ledger contains no
    contact-horizon excavation programme on the specific corridor Carvajal
    descended, and the preregistered reach-by-reach test (AMZ-R001) is
    unperformed. The collapse mechanism is likewise borrowed: Newson's 88% and
    62–64% declines (AMZ-E008) are upper-Amazon mission provinces, extended to
    the middle and lower river by extrapolation that the ledger itself flags.
    Chronology cuts the same way — the Aquiry peak is AD 100–300 (AMZ-E003), a
    millennium before Orellana, and Casarabe ends ~1400 CE, so the most
    spectacular earthwork evidence is not contact-era evidence. Several
    limits-side claims (AMZ-C020, AMZ-C021, AMZ-C022, AMZ-C029) carry verified
    source anchors but no dedicated evidence record, which weakens the skeptical
    counterweight symmetrically rather than helping either side. Sensitivity:
    removing AMZ-E007 would change the case verdict most. The heterogeneity leg
    survives it untouched, but the Carvajal leg would then rest almost wholly on
    Denevan's manuscript collation plus general archaeological plausibility, and
    I would drop AMZ-C017 to unresolved and the case to mixed. The case
    therefore hangs on one thread for one of its two legs, and that should be
    said plainly."
  steelman: "Bush et al. 2025 (AMZ-C022) found that forest recovery largely erased
    the pre-Columbian signal at Upano while the later Colonial signal persisted
    — which means absence of contact-era archaeological and palaeoecological
    confirmation along Carvajal's middle-Solimões corridor is exactly what a
    proponent should predict even if his description were wholly accurate. Those
    settlements were built of pole and thatch on an actively migrating
    whitewater floodplain, over reaches later occupied by colonial missions and
    modern towns; the material signature most likely to survive is ceramics and
    dark earth, and the ledger contains no systematic contact-horizon survey of
    those specific reaches at all. My assessment penalises the Carvajal leg for
    missing archaeology it has no positive reason to expect to find, and I have
    no measurement that distinguishes \"not there\" from \"not looked for, and
    would not have survived.\" Denevan's bluff model (AMZ-E006) sharpens the
    point into an untested prediction: dense reaches alternating with empty
    ones, precisely where channels impinge on bluffs — a spatial pattern
    Carvajal reports and nobody has yet checked against his route."
