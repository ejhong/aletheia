  synthesis: >-
    The evidence provisionally supports the featured hypothesis in its
    restrained form: Carvajal probably encountered populous, organized riverine
    societies in particular reaches, but his largest numerical claims are
    unreliable, the pattern was not basin-wide, and the ledger has not directly
    demonstrated that the specific societies he saw were the ones later erased.
    The strongest route-specific evidence is AMZ-E007: Nunes and the
    Ursúa-expedition accounts independently report dense middle-Amazon
    settlement, large food stores, travelled roads, and abundant resources. This
    is substantially more diagnostic than archaeological demonstrations that
    Amazonian environments could support complex societies. AMZ-E005
    independently establishes that famous extreme figures occur in one
    manuscript branch but disappear from the Oviedo branch, supporting
    qualitative credibility without treating those figures as counts.

    The archaeological case is structurally strong but geographically and
    chronologically heterogeneous. AMZ-E004 documents a late pre-Columbian
    fortified settlement arc, while AMZ-E017 through AMZ-E019 show several
    substantial systems persisting into European contact or later. AMZ-E014,
    AMZ-E015, AMZ-E016, and AMZ-E022 demonstrate engineered agriculture and
    aquatic-resource use, rebutting a simple ecological impossibility argument.
    Conversely, AMZ-E010 and AMZ-E011 indicate that occupation was concentrated
    toward rivers and that many sampled terra-firme settings lack signals of
    intensive use. Those negatives support a mosaic rather than a continuous
    civilization, although survey accessibility, sparse coring, and proxy
    sensitivity remain serious limitations.

    Steelmanning the hypothesis, the convergence of independent
    sixteenth-century witnesses, contact-era settlement archaeology, and
    documented colonial depopulation makes invention an unnecessarily strong
    explanation. AMZ-E008 supplies measured regional declines of roughly 62–88
    percent and multiple mutually reinforcing mechanisms, making a dramatic
    post-contact transformation entirely credible. Steelmanning the skeptical
    position, that reconstruction concerns Napo–Aguarico and Mainas rather than
    the precise middle-Amazon reaches at issue; many spectacular archaeological
    examples are elsewhere or centuries earlier; and no preregistered comparison
    yet matches Carvajal's populated and empty reaches against contact-horizon
    archaeology. Thus the local truth of AMZ-C010 does not by itself prove the
    featured corridor was emptied, and the local truth of early earthwork claims
    does not corroborate what Carvajal saw in 1542.

    The sensitivity hinge is AMZ-E007. Removing that record would eliminate the
    ledger's strongest independent, approximately route-matched corroboration of
    Carvajal's qualitative social geography, leaving mainly ecological
    possibility, analogical archaeology, and geographically displaced collapse
    evidence. The case verdict would then fall to mixed and therefore does not
    survive removal of AMZ-E007. Several catalog claims are also unresolved here
    because no evidence record states their results; that is an
    evidentiary-ledger limitation, not evidence that those claims are false.
  steelman: "The strongest unanswered pro-hypothesis argument is Carvajal's
    alternating spatial map of populated and empty reaches: a route-blind
    contact-horizon survey finding greater archaeological intensity in his
    populated corridors than in matched empty corridors would provide uniquely
    specific corroboration that neither ecological analogies nor regional
    population models currently supply."
