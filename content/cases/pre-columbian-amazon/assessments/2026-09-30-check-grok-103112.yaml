  synthesis: "The ledger evidence overturns the twentieth-century default of a
    uniformly poor, near-empty Amazon incapable of complex societies, while
    equally rejecting any basin-wide continuous civilization. Multiple
    independent lines establish dense, engineered, and politically organized
    occupations along favored corridors and hotspots into or near the contact
    era: LiDAR and survey document thousands of earthworks and fortified
    villages across southwestern and southern-rim Amazonia (C004, C006),
    Casarabe maize monoculture with hydraulic infrastructure (C007), dark earths
    and managed forests (C008), year-round interfluvial fisheries (C026), and
    settlement systems on the Belterra Plateau, Marajó, and Upper Xingu occupied
    to the seventeenth or eighteenth century (C011). Carvajal’s 1542 qualitative
    picture of populous riverbank settlements, stores, roads, ceramics, and
    multi-settlement territories alternating with empty stretches is
    corroborated by independent sixteenth-century witnesses (Nunes and the Ursúa
    accounts, C003) and matches the bluff-model geography of dense reaches at
    channel-bluff junctions (C001). His extreme warrior and village-length
    figures are textually unstable, present only in one manuscript branch
    (C002), so they cannot be treated as counts; the qualitative social
    geography remains credible (C017). Post-contact decline is documented as
    catastrophic yet uneven and multi-causal in upper-Amazon provinces (C010),
    with settlements still occupied at contact then emptying. Simultaneously,
    basin-scale predictors and palaeoecological syntheses show river distance
    dominating occupation probability and little to no intensive annual-crop,
    clearing, or anthropic-soil signal across most sampled terra-firme and
    interfluvial settings (C013, C014). Population numbers remain model-family
    constructs sharing assumptions rather than independent censuses (C005, C012,
    C015). The resulting picture is precisely the heterogeneous landscape stated
    in C016: substantial sedentary engineered populations along rivers,
    floodplains, savannas and bluffs, embedded in a lightly occupied forest
    matrix. This makes Carvajal’s kind of world locally real and later emptied,
    without requiring either pristine wilderness or uniform high density.
    Chronology caveats matter: Aquiry peak density is a millennium before
    Orellana, and some raised-field use was intermittent flood-risk mitigation
    rather than permanent intensive farmland. Open tests (route-matched
    archaeology, promise-blind interfluve densities, dependency-corrected
    demography) remain, but the directional inversion of the old impossibility
    argument is already secured by the measurements and replications in the
    ledger. Verdict hangs on the convergence of archaeology, ethnohistory, and
    negative palaeoecology rather than any single spectacular site or number."
  steelman: The still-unexecuted preregistered Carvajal-corridor test leaves his
    specific populated-versus-empty reach map unverified against contact-horizon
    archaeological intensity; a null spatial match would reduce qualitative
    credibility to generic plausibility without route-level confirmation.
