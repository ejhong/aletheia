  whatIsClaimed: "That Carvajal's 1542 chronicle describes a real world — populous, organized riverine societies on specific reaches — that epidemics, slave raids, missions and flight then destroyed and dispersed. The version graded is the heterogeneous one: engineered corridors and hotspots in lightly occupied forest, with Carvajal credible in kind and unreliable in number."
  whereDisagreementLives: "The live dispute is proportion: how representative the dense river corridors were of a basin whose interfluves look lightly used. It turns on whether the sparse-forest findings survive critiques of their sampling and the erasure argument, both stated in papers this site has not yet checked. It also turns on whether population totals survive their own assumptions, which manuscript branch the famous numbers belong to, and whether early or distant sites are being spent as evidence about 1542."
  whatWouldSettleIt: "A preregistered corridor test comparing Carvajal's populated and empty reaches, classified from the manuscripts alone, against AD 1400–1650 archaeology and matched controls. Beside it: a passage-by-passage collation of the manuscript branches; surveys of interfluvial forest chosen blind to archaeological promise; the 1650 Omagua headcount read from manuscript; and a calibration of how fast forest recovery erases human signals."
  bestConventionalExplanation: "The modern skeptic concedes major regional societies and argues limits. Orellana travelled the richest corridors: the bluff-and-channel settings where settlement concentrated, and where archaeology looks and preserves. Corroboration there cannot license basin-wide extrapolation. Sampled interfluvial and western soils show little cultivation, clearing or soil modification, and river distance dominates the known site record. The famous population totals are model outputs whose assumptions do most of the work, as their authors say. Carvajal's extreme figures are unstable across manuscript branches that are not independent, consistent with a truthful observer whose numbers changed in the telling. On this view the mosaic is real but modest: dense hotspots, a thin matrix, and a chronicle honest in kind and unreliable in number, describing a world smaller than legend and then genuinely destroyed."
