  synthesis: "The central thesis of \"The Emptied Amazon\" posits that the
    pre-Columbian Amazon was neither an untouched, uniform wilderness incapable
    of supporting dense populations nor a wall-to-wall civilization, but rather
    a profoundly heterogeneous social landscape. In this mosaic, densely
    populated, politically organized, and hydraulically engineered societies
    flourished along major river bluffs, floodplains, and seasonal savannas,
    while vast interfluvial terra-firme tracts remained lightly utilized and
    relatively sparse. Gaspar de Carvajal's 1542 chronicle of the Orellana
    expedition, long dismissed as fabulation, emerges from this ledger as
    qualitatively credible: independent sixteenth-century accounts from Diogo
    Nunes (1538) and the Pedro de Ursúa expedition (1560) confirm dense towns,
    vast food stores, straight roads, and fine ceramics along the Solimões
    corridor. Simultaneously, manuscript collation reveals that Carvajal's most
    staggering troop figures and settlement lengths derive from the Medina/Muñoz
    textual tradition rather than Oviedo's primary redaction, showing that while
    his numerical counts are textually unstable, his qualitative social
    geography is remarkably sound. Modern LiDAR and archaeological surveys
    corroborate extensive monumental earthworks, defensive enclosures, and
    raised fields from southwestern Amazonia to the Llanos de Mojos, the
    southern rim, and the Belterra Plateau, with multiple systems sustaining
    populations well into the contact era. Conversely, cumulative
    palaeoecological coring and predictive spatial models demonstrate that
    distance to rivers is the paramount predictor of occupation, with almost
    eighty percent of the basin exhibiting near-zero probability for monumental
    earthworks and negative phytolith/charcoal signatures in sampled
    interfluves. Following European arrival, regional reconstructions such as
    Linda Newson's document catastrophic declines of sixty to nearly ninety
    percent through combined epidemics, slave raids, and flight, providing a
    clear mechanism for the swift transition from Carvajal's crowded river
    corridor to later silence. The single evidence record whose removal would
    most challenge this case is AMZ-E007 (Lopes et al. 2024), which provides
    decisive, independent sixteenth-century documentary corroboration of
    Carvajal's qualitative Solimões geography. Without AMZ-E007, the historical
    bridge between early contact narrative and late prehistoric archaeology
    would lean much more heavily on retrospective modeling, yet the verdict
    robustly survives because primary archaeological datings at Belterra,
    Cacoal, and the Upper Xingu independently confirm large, planned settlements
    flourishing directly into the early colonial horizon."
  steelman: Palaeoecological soil and lake coring across interfluvial terra firme
    represents only a few hundred sample points across millions of square
    kilometers, and as Bush et al. (2025) demonstrated at Lake Cormorán,
    multi-century forest succession can completely erase the floristic
    composition of intensive pre-Columbian land use, leaving the vast,
    unexcavated interfluves potentially harboring unmeasured agroforestry
    systems that modern proxies fail to capture.
