  synthesis: "The case's positive leg rests on independent, methodologically
    diverse measurements that converge on the same picture: LiDAR documenting
    432 earthworks and a delimited 183,000 km² Aquiry region (C004), fortified
    rim villages dated AD 1250–1500 (C006), Casarabe maize monoculture built on
    engineered drainage and ponds (C007), a 17,000-remain interfluvial
    zooarchaeological assemblage proving year-round resources (C026), and
    settlement sequences occupied into the contact era itself at Belterra,
    Cacoal and the Upper Xingu (C011). The negative leg — that much of the basin
    really was lightly occupied — is likewise multi-threaded: the 7,363-site
    river-distance model (C013), the fourteen-region phytolith/charcoal
    synthesis (C014), Walker's \"limited, albeit impressive\" predicted extents
    (C020), and Peripato's 80%-at-0–1% probability surface (C029) all point one
    way, though each carries sampling or model caveats and Clement's reply
    documents how thin the core coverage is. The collapse leg is documented
    regionally and with mixed mechanisms (C010), while the Upano protracted
    decline around 550 CE (C088) shows Amazonian societies could empty without
    Europeans — cutting against any purely colonial-collapse story and against
    reading later forest silence as proof of earlier emptiness. On Carvajal, the
    qualitative social geography is corroborated by witnesses hostile to one
    another who do not repeat his extreme numbers, which survive in only one
    manuscript branch (C002, C003, C017), and the bluff model predicts exactly
    his dense-reach/empty-reach alternation. Steeling the skeptics: every
    population total here is model-dependent, published models disagree
    severalfold, route identifications remain tentative, and the one dated
    resident seventeenth-century headcount for the Omagua corridor is unread.
    Steeling the proponents: no sparse-area record samples Carvajal's own
    corridor, so the documentary convergence has never been field-tested where
    it matters. The verdict is well_supported rather than established because
    the mosaic's matrix-density parameter and the corridor-level test (AMZ-R001,
    AMZ-R003) both remain unmeasured; it is well_supported rather than mixed
    because the supporting records are numerous, independent in method, and
    verbatim-verified, while the contrary readings are caveats, not
    counter-results."
  steelman: "The ledger contains no archaeological or palaeoecological negative
    from Carvajal's own middle-Amazon corridor: every sparse-area record
    (Piperno's soil cores, Walker's site-type model, Peripato's 0–1% probability
    stratum) samples interfluves and regions off his route, and the
    corroborating witnesses (Nunes 1538, the ten Ursúa accounts of 1560)
    describe vast maize stores and Inca-style roads on the same reaches from
    mutually hostile parties writing for different crowns. A proponent can
    therefore say the case's sparse-matrix evidence never tested the one
    corridor where the dispute lives, and that the single dated resident witness
    able to contradict the populated picture — Laureano de la Cruz's 1650 Omagua
    headcount, whose manuscript numeral the 1900 edition's OCR leaves ambiguous
    (AMZ-R007) — remains unread."
