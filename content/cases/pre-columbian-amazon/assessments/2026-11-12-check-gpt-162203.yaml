  synthesis: >-
    The evidence provisionally supports the featured hypothesis in a
    geographically restricted form: Carvajal probably encountered populous,
    organized riverine societies in particular reaches, and severe post-contact
    disruption provides a credible explanation for why later observers
    encountered a different landscape. It does not establish his extreme
    numbers, a continuously settled Amazon, or a single basin-wide collapse. The
    most diagnostic corroboration is AMZ-E007: Nunes and the Ursúa expedition
    accounts independently reproduce mundane components of the middle-Amazon
    picture, including dense settlement, large food stores, travelled roads, and
    renowned ceramics, without reproducing Carvajal's spectacular figures.
    AMZ-E005 separately shows that the largest warrior totals and longest
    villages occur in one manuscript branch but not the Oviedo branch. This
    supports the qualitative-versus-numerical distinction in AMZ-C017 rather
    than treating the chronicle as either wholly accurate or wholly invented.

    Archaeology makes such societies environmentally and organizationally
    credible. Contact-era or near-contact occupation is documented at Belterra,
    Cacoal, the Upper Xingu, and across the southern rim, while Casarabe
    agriculture, Llanos fisheries, dark earths, roads, ponds, and fortified
    settlements demonstrate several workable forms of intensive landscape use.
    The strongest case against overextension is equally substantial. Several
    spectacular systems peaked centuries before 1542; population totals depend
    on contemporaneity assumptions, household conversions, and extrapolation;
    and sampled terra-firme regions often lack intensive-use signals. River
    distance predicts occupation, while earthwork models assign most of the
    basin very low earthwork probability. Those results support a mosaic of
    dense corridors and lightly occupied forest, not a basin-wide urban
    civilization. Low earthwork probability must not itself be confused with low
    human population, because the same records identify other site types and
    dark earths outside the principal earthwork zones.

    The collapse bridge is credible but incomplete. AMZ-E008 establishes
    catastrophic, uneven decline in Napo–Aguarico and Mainas through epidemics,
    raids, missionization, forced service, revolt, and flight. It does not
    directly reconstruct the middle and lower Amazon reaches described by
    Carvajal, while the more detailed fade-out mechanism in AMZ-C023 lacks a
    dedicated evidence record. Upano also demonstrates that abandonment could
    precede Europeans by a millennium, so later forest cannot automatically be
    assigned to colonial depopulation. Conversely, no evidence here supplies a
    comparably strong alternative explanation for the repeated sixteenth-
    century middle-Amazon reports.

    Sensitivity is concentrated in AMZ-E007. Its removal would most change the
    case verdict because it is the only strong record directly joining
    Carvajal's qualitative picture to other sixteenth-century testimony on the
    same general reaches. Without it, archaeology would still establish local
    plausibility and regional collapse, but the verdict would fall to mixed
    rather than remain provisionally supported; the current case therefore does
    not survive at the same grade without that record.
  steelman: The ledger does not test the decisive reach-by-reach prediction that
    Carvajal's reported populated corridors contain systematically stronger AD
    1400–1650 archaeological signals than his reported empty reaches and matched
    control corridors; a positive blinded test would directly vindicate the
    featured hypothesis beyond the regional analogies assessed here.
