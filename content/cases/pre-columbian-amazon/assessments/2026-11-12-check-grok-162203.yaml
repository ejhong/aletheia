  synthesis: "The ledger supports a heterogeneous pre-Columbian Amazon rather than
    either pristine emptiness or basin-wide dense civilization, and it makes
    Carvajal's qualitative riverine social geography locally credible while
    leaving his extreme counts textually unstable and his route-wide
    representativeness untested. Independent sixteenth-century witnesses (Nunes;
    the Ursúa corpus) repeat the load-bearing mundane features—dense settlement,
    food stores, travelled roads, renowned ceramics—on the middle-Amazon reaches
    Carvajal described, without repeating the Medina/Muñoz extreme warrior and
    village-length figures that are absent from Oviedo. That textual split is
    decisive for the numbers: they are branch-specific and should not be treated
    as census. Archaeology supplies the environmental and demographic
    possibility structure. Southwestern Amazonia and the southern rim host large
    earthwork systems (Aquiry LiDAR counts and extrapolations; de Souza's 1,800
    km fortified-village arc dated ~AD 1250–1500); Casarabe practiced engineered
    year-round maize monoculture with drainage and farm ponds; San Joaquín weirs
    and pond associations, plus Loma Salvatierra zooarchaeology, document
    managed interfluvial fisheries; dark earths, raised fields, and
    domesticated-tree concentrations record long-term landscape engineering,
    tempered by post-Columbian confounding of the modern floristic signal and by
    intermittent rather than continuous raised-field use. Critically, several
    major settlement systems (Belterra Plateau, Marajó Cacoal, Upper Xingu) were
    occupied into or through the contact era, so the world Carvajal could have
    seen was not confined to early-first- millennium florescences such as the
    Aquiry peak (AD 100–300). Regional colonial reconstructions document
    catastrophic but uneven decline (Napo–Aguarico ≈88%; Mainas 62–64%) through
    mixed epidemics, raids, missionization, forced service, revolt, and flight,
    with fade- outs and reintroduction rather than a single uniform wave—enough
    to turn crowded river corridors into the emptier later record without
    requiring pre-contact endogenous collapse. The same survey science that
    fills in the hotspots keeps finding a sparse matrix: river distance
    dominates occupation probability across 7,363 sites; cumulative phytolith
    and charcoal work finds little intensive terra- firme agriculture or
    clearing in most sampled western and interfluvial settings; machine-learning
    and presence models predict earthwork and dark-earth extents as limited
    (albeit impressive) and place ~80% of the basin in 0–1%
    earthwork-probability cells, while other site types are predicted to
    dominate more than two-thirds of Amazonia. Basin- wide population headlines
    remain model families sharing assumptions (Denevan rejected his own
    habitat-density method; Aquiry's own sensitivity collapses the headline
    roughly fivefold). Summed- radiocarbon proxies fit logistic growth toward
    carrying capacity before contact, with terminal decline attributed to
    sampling bias plus post-European collapse. The joint picture is therefore
    neither invention nor continuous metropolis: dense, engineered, often
    contact- era corridors and savanna/bluff hotspots embedded in a lightly
    occupied forest matrix, with documented post-contact emptying of many
    riverine provinces. Carvajal's kind of world is locally well supported; his
    extreme numbers are not; basin-wide uniformity is contradicted by the
    sparse-matrix evidence. The largest remaining gap is the still-unrun
    preregistered corridor test matching his populated versus empty reaches to
    contact-horizon archaeology, and the still-thin documentary collapse
    timelines for the exact middle- Amazon reaches he described."
  steelman: No preregistered, probability-corridor comparison of Carvajal's own
    populated versus empty reaches against contact-horizon (AD 1400–1650)
    archaeological intensity has been executed, so the strongest spatial
    prediction of his qualitative geography remains untested on the ground; a
    proponent can rightly treat the independent sixteenth- century textual
    corroboration and the existence of contact-era systems elsewhere as
    insufficient substitutes for that direct route match, and can note that
    middle/lower-Amazon province-level collapse magnitudes are still borrowed
    from upper-Amazon reconstructions rather than measured where the 1542
    narrative actually lives.
