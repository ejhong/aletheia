lastReviewed: "2026-08-28"
researchPriority:
  level: high
  reason: >-
    The decisive test is unusually concrete and mostly desk-executable:
    the Carvajal corridor comparison needs manuscript work, route
    modeling, and existing survey data rather than new excavation, and
    canopy-penetrating LiDAR coverage is expanding yearly. Few contested
    historical claims offer this clean a preregistered discriminator.
components:
  - label: "Basin-wide pristine-wilderness model"
    state: contradicted
    note: "Untenable against earthworks, dark earths, and settlement systems; survives only as a description of some interfluves."
  - label: "Heterogeneous mosaic — dense engineered corridors in a lightly occupied matrix"
    state: well_supported
  - label: "Carvajal's qualitative social geography (populous organized river corridors)"
    state: provisionally_supported
    note: "Independently echoed by 1538/1555 and 1560–61 accounts; corridor test pending."
  - label: "Carvajal's literal extreme numbers (50,000 warriors; villages leagues long)"
    state: weakly_supported
    note: "Textually unstable — present in the Medina/Muñoz manuscript branch, absent from Oviedo's."
  - label: "Basin-wide dense, politically integrated civilization"
    state: weakly_supported
    note: "Strong regional systems are established; synchronous basin-wide integration is not."
