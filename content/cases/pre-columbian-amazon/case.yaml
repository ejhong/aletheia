slug: pre-columbian-amazon
title: "The Emptied Amazon"
subtitle: "In 1542 Gaspar de Carvajal described a crowded, organized river world along the Amazon. Later centuries found forest and silence. Was he inventing, exaggerating — or describing a world that died between the visits?"
domain: "Amazonian archaeology · Ethnohistory · Historical demography"
status: active
summary: >-
  For most of the twentieth century the Amazon was archaeology's standard example of an environment too poor to support complex societies, and the earliest eyewitness account — the Dominican friar Gaspar de Carvajal's chronicle of the 1541–42 Orellana voyage, with its populous riverbank settlements, food stores, roads, and organized war fleets — was filed under exaggeration. LiDAR surveys, dark-earth soil science, and regional excavation programs have now inverted the burden of proof: southwestern Amazonia alone contains tens of thousands of monumental earthworks, the Llanos de Mojos supported drained-field maize agriculture and engineered fisheries, and settlement systems on the southern rim and Upper Xingu were fortified, planned, and occupied into the contact era. Yet the same survey work keeps finding genuinely sparse interfluves. The evidence increasingly favors neither the pristine wilderness nor a basin-wide civilization, but a strongly heterogeneous human Amazon — dense, engineered corridors and hotspots embedded in lightly occupied forest — and it makes Carvajal's kind of world locally plausible while leaving his numbers textually unstable and his representativeness the open question.
