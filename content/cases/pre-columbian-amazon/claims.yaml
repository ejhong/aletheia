- id: AMZ-C001
  statement: >-
    Carvajal's chronicle of the 1541–42 Orellana descent describes populous riverbank settlements, large food stores, travelled roads, fine ceramics, and multi-settlement political territories along extended reaches of the Amazon — interspersed with stretches he reports as empty.
