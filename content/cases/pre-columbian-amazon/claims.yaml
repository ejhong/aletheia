- id: AMZ-C010
  tier: featured
  statement: >-
    Region-specific colonial reconstructions document catastrophic but
    uneven post-contact decline: the Napo–Aguarico population fell from
    roughly 49,000–51,000 to about 6,000 by circa 1700 (≈88%), and
    Mainas declined 62–64%, through differing mixtures of epidemics,
    slave raids, missionization, forced service, revolt, and flight.
  plainLanguage: >-
    Where records let us count, about nine in ten people of one river
    province were gone within 160 years — killed by disease, taken by
    slavers, gathered into missions, or fled. The crash was real,
    regional, and had many causes, not one.
  theme: collapse
  rung: observation
  claimType: historical
  importance: major
  credibility: well_supported
  credibilitySummary: >-
    Verified verbatim from Newson 2003 (Table 1 and mechanism passages),
    which restates her 1995 book-length reconstruction. Decline ratios
    and the named mechanisms are the source's own.
  diagnosticity: high
  diagnosticitySummary: >-
    This is the bridge between Carvajal's crowded 1542 and the emptier
    later Amazon: if decline of this scale and speed is documented where
    records exist, populous corridors becoming quiet ones needs no
    exaggeration hypothesis. It also blocks lazy uniform "90% everywhere"
    modeling — the two provinces differ by 25 points.
  sourceAnchor:
    locator: "Newson 2003, Revista de Indias 63(227), Table 1 and pp. following"
    sourceId: SRC-NEWSON-2003
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    The reconstructed provinces are Andean-foothill and upper-Amazon
    regions with mission records; extending their ratios to the middle
    and lower Amazon is itself an extrapolation.
  whatWouldChangeOurMind:
    - "Comparable documentary reconstructions for the Solimões/Machiparo reaches themselves."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §6 — verified batch1 item 3"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

- id: AMZ-C011
  tier: featured
  statement: >-
    Several major settlement systems were occupied into the contact era
    or beyond: the Belterra Plateau sites near Santarém from ca. AD 1300
    to seventeenth-century European colonization (with dark earths,
    ponds, and trodden roads); Marajó's Cacoal site AD 1300–1650; and
    Upper Xingu settlements inhabited to ca. 1770 with layouts matching
    living Kuikuro villages.
  plainLanguage: >-
    Some of the archaeology lines up in time with the eyewitnesses —
    towns that were still lived in when Europeans arrived, and in the
    Xingu, village plans that today's Kuikuro communities still use.
    "Lost civilization" is the wrong frame; some of it is continuity.
  theme: collapse
  rung: observation
  claimType: measurement
  importance: major
  credibility: well_supported
  credibilitySummary: >-
    Santarém/Belterra verified verbatim (Stenborg et al. 2018); Cacoal
    verified verbatim (Schaan 2000, "atesta a permanência da cultura
    Marajoara" at Portuguese contact); the Xingu range (500–1770 CE,
    Kuikuro-pattern layouts) verified from a Science news feature — a
    secondary source, held to that weight pending the primary reports.
  diagnosticity: high
  diagnosticitySummary: >-
    Contact-horizon dating is what separates evidence about Carvajal's
    world from evidence about capability a millennium earlier. These are
    the sites that pass that filter.
  sourceAnchor:
    locator: "Stenborg, Schaan & Figueiredo 2018, J. Field Archaeology 43(1) — abstract"
    quote: "numerous archaeological sites, dating from ca. A.D. 1300 up to the time of European colonization in the seventeenth century, have been found in an upland area known as the Belterra Plateau, south of the present-day city of Santarem"
    sourceId: SRC-STENBORG-2018
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    These are the corridor and hotspot regions archaeology samples best;
