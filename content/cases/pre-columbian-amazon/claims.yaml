- id: AMZ-C001
  tier: featured
  statement: >-
    Carvajal's chronicle of the 1541–42 Orellana descent describes
    populous riverbank settlements, large food stores, travelled roads,
    fine ceramics, and multi-settlement political territories along
    extended reaches of the Amazon — interspersed with stretches he
    reports as empty.
  plainLanguage: >-
    The earliest eyewitness account of the Amazon describes a crowded,
    organized river world in some stretches and nobody at all in others.
    This claim is about what the account says — whether it was right is
    graded separately.
  theme: carvajal
  rung: observation
  claimType: historical
  importance: headline
  genealogy:
    firstKnown: "1542"
    originDescription: >-
      Gaspar de Carvajal's relación of the Orellana voyage, written by the
      expedition's Dominican chaplain; transmitted in two main manuscript
      branches (Medina/Muñoz and Oviedo) whose numeric content differs
      materially.
    originSourceId: SRC-CARVAJAL-1542
  credibility: established
  credibilitySummary: >-
    That the account contains these descriptions is documented directly by
    the scholarly literature that quotes and compares its manuscript
    witnesses (Denevan 1996; Lopes et al. 2024, which reproduces the
    ceramics praise verbatim). Both branches carry the qualitative
    picture.
  diagnosticity: moderate
  diagnosticitySummary: >-
    An account describing a populous Amazon is not a populous Amazon: the
    claim's weight depends entirely on the independent tests — other
    16th-century accounts (AMZ-C003) and contact-horizon archaeology
    (AMZ-C011). It is the case's anchor document, not its verdict.
  sourceAnchor:
    locator: "Denevan 1996, Annals AAG 86(4), pp. 662–663 (manuscript comparison); Lopes et al. 2024 (verbatim quotations)"
    sourceId: SRC-DENEVAN-1996
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    A missionary chronicler on a starving expedition had reasons to
    magnify both the marvels and the hostility of the lands traversed, and
    the account's most dramatic numbers demonstrably grew in one
    transmission branch (AMZ-C002).
  whatWouldChangeOurMind:
    - "A synoptic manuscript-witness table showing the qualitative picture itself (not just the numbers) diverging materially between branches would force re-anchoring every downstream claim."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §2 — verified V/A ledger 2026-08-28"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

- id: AMZ-C002
  tier: featured
  statement: >-
    The account's most extreme figures — 50,000, 10,000, and 8,000
    warriors, and villages four or five leagues long — appear in the
    Medina/Muñoz manuscript branch but not in Oviedo's version, which
    preserves the populous-settlement picture and one figure of about
    5,000 warriors.
  plainLanguage: >-
    The famous huge numbers are only in one family of manuscript copies.
    The other family describes the same crowded world — with far smaller
    numbers. So the numbers are shaky in a way the general picture is not.
  theme: carvajal
  rung: observation
  claimType: historical
  importance: major
  credibility: established
  credibilitySummary: >-
    Denevan's manuscript comparison states this directly, verified
    verbatim: "There is no mention of 50,000 or 10,000 and 8,000 warriors
    as there is in the Medina (and Muñoz) versions… nor of villages 4 or 5
    leagues in length. There is one mention of 5,000 warriors in the
    Oviedo version."
  diagnosticity: high
  diagnosticitySummary: >-
    This single textual fact reorganizes the whole Carvajal debate: it
    licenses trusting the qualitative account while refusing the extreme
    counts, and it undercuts both wholesale-vindication and
    wholesale-dismissal readings at once.
  sourceAnchor:
    locator: "Denevan 1996, pp. 662–663"
    quote: "There is no mention of 50,000 or 10,000 and 8,000 warriors as there is in the Medina (and Muñoz) versions… nor of villages 4 or 5 leagues in length. There is one mention of 5,000 warriors in the Oviedo version"
    sourceId: SRC-DENEVAN-1996
  parentClaimIds: [AMZ-C001]
  dependsOnClaimIds: []
  strongestObjection: >-
    Absence from Oviedo's redaction does not prove the figures were
    absent from Carvajal's lost original — Oviedo may have trimmed
    numbers he disbelieved. The instability cuts against relying on the
    figures either way.
  whatWouldChangeOurMind:
    - "A full collation of the Muñoz/T'Serclaes–Medina/Oviedo witnesses locating where each figure enters the transmission."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §2 — verified A04"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

- id: AMZ-C003
  tier: featured
  statement: >-
    Independent sixteenth-century testimony — Diogo Nunes's 1538 entry
    into the Machiparo province (recorded in a letter of 1553 or 1554 to
    João III) and the ten accounts of the 1560 Ursúa expedition —
    describes dense settlement, vast food stores, long straight travelled
    roads, and renowned ceramics on the same middle-Amazon reaches
    Carvajal described.
  plainLanguage: >-
    Carvajal isn't the only witness. A Portuguese soldier got there four
    years before him, and a Spanish expedition passed through eighteen
    years after — and their surviving accounts describe the same kind of
    world in the same places.
  theme: carvajal
  rung: observation
  claimType: historical
  importance: major
  credibility: established
  credibilitySummary: >-
    Verified against Lopes et al. 2024, which documents the Nunes journey
    ("Diogo Nunes alcança a província de Machiparo em 1538"), the Ursúa
    expedition's ten accounts (Vazquez, Almesto, Altamirano the fullest),
    the "infinite" maize stores, and the roads "ao modo dos Incas do
    Peru, exceto pelas paredes." Fortifications and organized warfare are
    NOT among the verified common elements and are deliberately excluded.
  diagnosticity: high
  diagnosticitySummary: >-
    Independent repetition of mundane features by hostile, unconnected
    expeditions is the strongest available check on invention. It does
    not validate Carvajal's numbers — none of these accounts carries his
    extreme figures — but it makes the qualitative world he described
    much harder to dismiss as fantasy.
  sourceAnchor:
    locator: "Lopes et al. 2024, Bol. Mus. Goeldi 19(2) e20230072"
    sourceId: SRC-LOPES-2024
  parentClaimIds: [AMZ-C001]
  dependsOnClaimIds: []
  strongestObjection: >-
    All these expeditions travelled the same favored corridor; agreement
    among corridor travelers cannot establish anything about the basin
    beyond it, and later chroniclers may have read earlier accounts.
  whatWouldChangeOurMind:
    - "Philological evidence that the Ursúa chroniclers relied on Carvajal's text rather than observation would collapse the independence this claim rests on."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §2 — verified A17 (corrected)"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

- id: AMZ-C004
  tier: featured
  statement: >-
    Canopy-penetrating LiDAR flown over 4,430 km in 2024 documented 432
    earthworks (396 previously unknown) in southwestern Amazonia; the
    2026 study delimits an Aquiry cultural area of roughly 183,000 km²
    and predicts approximately 24,000–30,000 earthworks within it.
  plainLanguage: >-
    Lasers that see through the forest canopy found five times more
    monuments than satellite imagery had, and the study estimates the
    region holds tens of thousands — as many as had been guessed for the
    whole Amazon.
  theme: earthworks
  rung: observation
  claimType: measurement
  importance: headline
  credibility: established
  credibilitySummary: >-
    All figures verified verbatim against the open-access paper: 432
    documented ("of which only 36 were previously known"), the 5× LiDAR
    multiplier over satellite detection, the ~183,000 km² circumscription,
    and the 24,000–30,000 extrapolation with its block structure.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Decisive against ecological-impossibility arguments; weak as direct
    evidence about 1542, because the earthwork florescence is dated a
    millennium earlier (see the dating qualifier in the evidence). LiDAR
    detects morphology; excavation and dating establish history.
  sourceAnchor:
    locator: "Pärssinen et al. 2026, Nature — abstract and results"
    sourceId: SRC-PARSSINEN-2026
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    The 24,000–30,000 figure is an extrapolation from sampled densities
    across assumed-comparable blocks, not a count; the authors themselves
    condition wider implications on similar concentrations being found
    elsewhere.
  whatWouldChangeOurMind:
    - "LiDAR lines flown across the assumed low-density periphery finding densities far from the extrapolation would revise the total in either direction."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §3 — verified A01"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

- id: AMZ-C005
  tier: featured
  statement: >-
    The 2026 study's proposal of 1.25–3 million people at the Aquiry
    peak (AD 100–300) is highly model-sensitive: it rests on an assumed
    simultaneous-use fraction and roughly 300 people per average
    earthwork, and the paper's own one-family-per-house alternative
    yields about 250,000–600,000 (315,000–760,000 with canopy
    correction).
  plainLanguage: >-
    The headline "millions" number depends on how many people you assume
    each monument implies. Read one assumption differently — as the paper
    itself shows — and the number falls roughly fivefold. The monuments
    are certain; the census is not.
  theme: demography
  rung: mechanism
  claimType: statistical
  importance: headline
  credibility: established
  credibilitySummary: >-
    The sensitivity structure is stated in the paper itself, verified
    verbatim: "Only if the very unlikely estimation that each
    approximately 25-m long house foundation (mound) belonged to a single
    family were true would the population be about 250,000–600,000
    people…". This claim grades the estimate's architecture, not the
    ancient population.
  diagnosticity: high
  diagnosticitySummary: >-
    Whether southwestern Amazonia held three million people or a third of
    a million at its peak controls how much weight the region can bear in
    basin-wide demographic arguments — and this claim shows that question
    is currently decided by an assumption, not a measurement.
  sourceAnchor:
    locator: "Pärssinen et al. 2026, Nature — population estimation section"
    quote: "Only if the very unlikely estimation that each approximately 25-m long house foundation (mound) belonged to a single family were true would the population be about 250,000-600,000 people without the invisibility effect of laser penetration, which would raise the population, in this case, to approximately 315,000-760,000."
    sourceId: SRC-PARSSINEN-2026
  parentClaimIds: [AMZ-C004]
  dependsOnClaimIds: []
  strongestObjection: >-
    The authors argue the 300-person figure matches later village sizes
    and workforce requirements, and label the single-family reading "very
    unlikely" — the sensitivity range is not a refutation, it is the
    honest error bar.
  whatWouldChangeOurMind:
    - "Excavation-based household archaeology at a sample of dated earthworks establishing occupants-per-structure empirically."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §3 — verified A01; funding disclosure A02"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

