- id: AMZ-C012
  tier: featured
  statement: >-
    Published basin-wide population estimates are model families sharing
    assumptions rather than independent measurements: Denevan himself
    later rejected the habitat-density method behind his influential
    5.1–6.8 million figure — while still holding "at least 5 to 6
    million" reasonable on other grounds.
  plainLanguage: >-
    A dozen published population numbers are not a dozen independent
    counts — many descend from the same assumptions. The field's most
    cited estimator publicly abandoned his own original method while
    keeping his bottom line. A number can stay plausible after the
    argument that produced it fails.
  theme: demography
  rung: mechanism
  claimType: methodological
  importance: major
  credibility: established
  credibilitySummary: >-
    Verified verbatim from Denevan 2003: "Consequently I now reject the
    habitat-density method I used in the past to estimate a Greater
    Amazonia population in 1492 of from 5.1 to 6.8 million… I
    nevertheless still believe that a total of at least 5 to 6 million is
    reasonable."
  diagnosticity: high
  diagnosticitySummary: >-
    Reframes the entire demography debate: the published range (~1M to
    >10M) reflects competing model families, so progress requires
    dependency-corrected re-derivation, not quoting more totals.
  sourceAnchor:
    locator: "Denevan 2003, Revista de Indias 63(227):175–188 — conclusion and abstract"
    quote: "Consequently I now reject the habitat-density method I used in the past to estimate a Greater Amazonia population in 1492 of from 5.1 to 6.8 million."
    sourceId: SRC-DENEVAN-2003
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    Method retirement by one scholar does not itself invalidate other
    estimate families (documentary, dark-earth scaling, radiocarbon
    proxies) — each has to be audited on its own dependencies.
  whatWouldChangeOurMind:
    - "A published dependency graph of major estimates showing more independence among them than this claim assumes."
  reviewState: ai_extracted
  origin:
    ref: "amazon-precolumbian brief §5 — verified A10"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

- id: AMZ-C013
  tier: featured
  statement: >-
    Across 7,363 recorded archaeological sites, distance from a river is
    the most important predictor of pre-Columbian occupation, and
    interfluvial areas were more sparsely populated than areas close to
    rivers.
  plainLanguage: >-
    Map every known ancient site and the pattern is blunt: people
    concentrated along the water. The deep between-rivers forest holds
