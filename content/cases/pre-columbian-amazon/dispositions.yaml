- key: text:casarabe ad 500 1400 src prumers 2022 xingu depopulation after 500 400 bp src heckenberger 2008 pre european regrowth only via src reading 2021
  kind: edition
  disposition: excluded
  reason: The report proposes a 'Two disappearances' section. Two of its three legs are verified from primaries (Casarabe ends ca. AD 1400; Xingu depopulation only after ~500–400 BP), but the leg that would change the case's judgment — the basin-wide pollen signal of pre-European abandonment competing with AMZ-C015 — is verified here only from a press release. Deepening the record without changing the article is the correct outcome of this pass; an edition candidate should wait for AMZ-R006.
  reopenIf: Bush et al. 2021 main text is read and its site geography mapped (AMZ-R006); then the collapse section should be redrafted to carry both pre- and post-contact decline explicitly.
  observed: Casarabe AD 500–1400 (SRC-PRUMERS-2022); Xingu depopulation after ~500–400 BP (SRC-HECKENBERGER-2008); pre-European regrowth only via SRC-READING-2021.
