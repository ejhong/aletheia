article: |
  In the summer of 1542, a starving Dominican friar floated down a river no European had ever descended, keeping notes. Gaspar de Carvajal was the chaplain of Francisco de Orellana's accidental expedition — fifty-odd men in a makeshift brigantine who had set out to find cinnamon and ended up crossing South America by water. What he recorded was not wilderness. [His chronicle describes populous riverbank settlements running for leagues, storehouses of food, travelled roads leading inland, fine ceramics, and multi-settlement political territories — alternating with stretches he reports as empty]{claim=AMZ-C001}.

  For most of the twentieth century, educated opinion held that he was lying, or at best embellishing. The Amazon of the textbooks was a "counterfeit paradise": soils too poor, protein too scarce, floods too brutal for anything beyond small shifting villages. An eyewitness account of crowded riverbanks was an embarrassment to be explained away. And later travellers, arriving a century and more afterward, found mostly what the textbooks predicted: forest, and silence.

  This case is about what happened when the instruments caught up with the argument — and about the discipline required to say precisely how much of the friar's world they have found, and *when* that world existed.

  ## Five answers to one question

  The founding question offers three verbs — inventing, exaggerating, describing a world that died — and the evidence now supports setting five accounts side by side, because two of them were not on the table when the question was first asked.

  - **He invented it.** The old reading: the later, emptier Amazon is the baseline, and the friar magnified marvels for patrons. This account predicts no contact-era settlement systems on the reaches he described, and no independent witnesses agreeing with him.
  - **He described a real world that died between the visits.** Populous, organized riverine polities existed in 1542; numbers grew in the telling; Old World disease, slave raids, missions and flight emptied the banks before the next chroniclers arrived. This account predicts contact-horizon archaeology on his corridor, independent early witnesses, and documented collapse mechanisms.
  - **A mosaic, not a metropolis.** Dense, engineered corridors and hotspots embedded in a lightly occupied forest matrix. This account accepts Carvajal's corridor and denies that it represents the basin; it predicts a strong river-distance gradient in occupation and thin signals in sampled interfluves.
  - **Two disappearances.** The most spectacular engineered landscapes — the Acre geoglyph tradition, the Bolivian savanna cities — had already declined centuries before Europeans came; part of the silence predates contact. This account predicts that the flagship archaeology does not overlap 1542, and that some forest regrowth began before Europeans.
  - **The garden Amazon.** Many millions of people, continentally integrated, seen truly and at scale by the friar. This account predicts that every new survey multiplies the known record and that the sparse-matrix reading is a sampling artifact.

  The ledger below is arranged so a reader can see what each account gets right, and what each still owes.

  ## The account, and its two texts

  Before weighing Carvajal against archaeology, there is a problem inside the text itself. His chronicle survives in two main manuscript families, and they do not say the same things. [The most famous numbers — 50,000 warriors, 10,000, 8,000, villages four and five leagues long — appear in the Medina/Muñoz branch but not in Oviedo's version, which preserves the same crowded world with one figure of about 5,000 warriors]{claim=AMZ-C002}. Whatever else is true, the extreme figures are textually unstable in a way the qualitative picture is not. This alone reshapes the founding question: "exaggerating" may describe the copyists as much as the friar. A serious reading of Carvajal was never "believe him" or "dismiss him"; it is: trust the kind of world he described, refuse his arithmetic.

  And his description does not stand alone. [A Portuguese soldier, Diogo Nunes, had entered the same Machiparo province four years before Orellana, and the ten surviving accounts of the 1560 Ursúa expedition independently describe dense settlement, maize stores one chronicler called infinite, long straight roads "in the manner of the Incas of Peru, except for the walls," and ceramics of famous quality]{claim=AMZ-C003} — on the same middle-Amazon reaches, from witnesses who were not copying one another and mostly detested each other. None of them repeats Carvajal's giant numbers. All of them repeat his world. Two limits travel with this: Nunes's testimony survives only as a letter of 1553 or 1554 to the Portuguese king, known through a modern edition; and fortifications and organized warfare are *not* among the verified common elements — those remain Carvajal's alone in this record.

  The pattern he reports — crowded reaches alternating with empty ones — is itself a testable prediction. The geographer William Denevan's bluff model holds that riverine occupation was "sporadic rather than continuous, with large settlements mostly located where main river channels impinged against bluffs." That is the geography of the account, empty stretches included. It turns a 480-year-old credibility dispute into a spatial hypothesis, which is why this case's first research item is a preregistered corridor test: classify his populated and empty reaches from the manuscripts alone, model the route's uncertainty — [tributary identifications still carry explicit question marks in the scholarship]{claim=AMZ-C024} — and only then check contact-horizon archaeology against them.

  ## What the lasers found

  {plate:IMG-AMZ-P01}

  The modern turn began when researchers noticed geometric ditches emerging from deforested pasture in the Brazilian state of Acre — and accelerated when LiDAR, laser scanning that strips the canopy from the terrain model, went looking under the trees. In 2026 the survey program led by Martti Pärssinen and Alceu Ranzi published its reckoning: [flying 4,430 kilometres of laser lines, it documented 432 earthworks where satellite imagery had found a fraction of that — 396 of them previously unknown — and projected roughly 24,000 to 30,000 monuments across a 183,000-square-kilometre cultural region it names the Aquiry]{claim=AMZ-C004}. That is as many earthworks in one corner of the basin as had once been guessed for all of Amazonia.

  {plate:IMG-AMZ-P02}

  Two honesty notes belong here. First: the study proposes a peak population of 1.25 to 3 million people — but [that figure is an assumption engine: it rests on a guessed fraction of earthworks in simultaneous use and roughly 300 people per monument, and the paper's own one-family-per-house alternative yields about 250,000 to 600,000]{claim=AMZ-C005}. The authors call that alternative "very unlikely"; the fivefold span is theirs, the emphasis is ours. The monuments are certain; the census is a model. Second, and larger: the Aquiry florescence is dated to roughly AD 100–300. It is decisive evidence that Amazonian environments could carry monument-building societies — and weak evidence about what Orellana saw fourteen centuries later. This case refuses to spend ancient grandeur as contact-era corroboration.

  **Transparency.** The 2026 study's funding statement reads, in its own words: "The project and data collection were funded by a grant from E. Jhong (USA)." That is this site's founder. The Athanatos Foundation, with which he is associated, is acknowledged for administrative assistance. Readers should know this — and should notice that it is exactly why this case presents the paper's population claim at its most assumption-exposed, not its most headline-friendly.

  ## Which of it overlaps 1542?

  The founding question is about a particular century, so the archaeology has to be sorted by date before it is weighed. Sorted, it falls into two piles.

  The first pile is spectacular and *early*. The Aquiry peak is AD 100–300. In the Llanos de Mojos of Bolivia, [the Casarabe culture — the savanna society whose planned centres and canals are the strongest case for Amazonian urbanism — is dated to roughly AD 500 to 1400]{claim=AMZ-C027}. Its end precedes Orellana by about 140 years. The dating rests on 144 radiocarbon dates but on stratigraphic control from only four sites, and the authors themselves flag two anomalously early dates; still, nothing in the record places Casarabe at contact.

  The second pile is smaller and *contemporary*. [An 1,800-kilometre arc of the southern Amazon rim was occupied by earth-building societies in fortified villages around AD 1250–1500]{claim=AMZ-C006} — squarely across the contact horizon — with a population model of 500,000 to a million that the authors state depends on site contemporaneity, ethnographic conversion formulae and model-projected extrapolation. And [several major settlement systems ran into the contact era and beyond: the Belterra Plateau sites near Santarém from about AD 1300 to seventeenth-century colonization, with dark earths, ponds and trodden roads; Marajó's Cacoal site to about 1650, in the very years the Portuguese were settling the island's east coast; and Upper Xingu settlements reported as inhabited to about 1770, their plaza-and-road layouts matching the villages living Kuikuro communities build today]{claim=AMZ-C011}. Santarém is on the lower Amazon; Orellana passed it. The Belterra record is the strongest primary evidence in this ledger that a populous system on the friar's own river was still standing when the next Europeans arrived.

  One clause in that claim is held at secondary weight. The 1770 Xingu terminus comes from a science-news feature summarizing the Heckenberger–Kuikuro program; the program's 2008 primary report gives no such date, and states that [after roughly 500 to 400 years ago — about 1450 to 1550 — early European colonialism resulted in substantial depopulation]{claim=AMZ-C041}, with settlement patterns continuing beyond that in many areas. The Xingu is real, contact-era, and continuous in form; exactly how late its large centres held their populations is not yet fixed from a primary. What that primary does give is a number: [the team estimates the regional Upper Xingu population at 50,000 or more — over 2.5 persons per square kilometre]{claim=AMZ-C037}, derived from only two surveyed clusters, ethnographic persons-per-settlement conversions, and an inferred fifteen or more clusters across the region. The authors call the figure conservative; a reader should hear "model" — the same assumption family that runs through every population figure in this case.

  The Xingu point deserves its own sentence: some of this is not a lost world at all, but a continuous one — collapsed in numbers, unbroken in pattern.

  ## Engineered ground

  {plate:IMG-AMZ-P03}

  The subsistence question — *what could they all have eaten?* — was always the strongest scientific objection, and it now has at least one direct answer. [In the Llanos de Mojos, the Casarabe culture ran intensive year-round maize agriculture on a savanna it had replumbed: drainage canals for the wet season, farm ponds for the dry, documented by phytoliths — microscopic plant silica — in 178 samples from the fields themselves]{claim=AMZ-C007}. Because Casarabe ended around 1400, this is evidence about capacity, not about 1542. More broadly, [dark earths, raised-field complexes, human-made forest islands, and concentrations of domesticated tree species on and around archaeological sites record long human engineering of Amazonian ground]{claim=AMZ-C008}.

  {plate:IMG-AMZ-P04}

  The savanna's waters were engineered too, and this matters because "they couldn't have gotten enough protein" was for decades the respectable core of the impossibility argument. [Zigzag weirs and straight causeways cross the San Joaquín floodplains, and most of the 382 detected ponds sit within thirty-five metres of one — V-shaped structures built to concentrate fish as the floods receded]{claim=AMZ-C019}. And the diet is in the ground, not just the infrastructure: [one monumental mound fifty kilometres from the Mamoré River, occupied AD 500–1400, yielded more than seventeen thousand fish remains, including dry-season species like lungfish that persist in small water bodies — year-round aquatic harvest far from the big river]{claim=AMZ-C026}. Honest limits travel with both: the weir study's authors postulate rather than demonstrate the fish-concentrating function; the mound's refuse holds few large river fish, and one site is an existence proof, not a census. But the specific claim the old skepticism rested on — that the interfluves could not feed sedentary people through the year — now has documented counterexamples in both engineering and bone.

  Engineering is not a census, and the record itself insists on the distinction. [The raised fields of the Bolivian lowlands, dated by radiocarbon and luminescence, show intermittent use in a few separate construction events from as early as AD 570–770 — plausibly flood-risk works built "only in those areas where there were no alternatives," not a permanently intensive breadbasket]{claim=AMZ-C009}. And the domesticated-forest signal carries a first-class qualifier of its own: a published technical comment argues that five post-Columbian centuries of human activity "are likely to have played a larger role than pre-Columbian ones" in the modern distribution of useful trees. Both readings are in this record on equal footing.

  ## How many people?

  The honest answer to the famous question is that the published numbers — one million, five, six, ten — are not competing measurements. They are competing models, and several descend from the same assumptions. The field's most influential estimator said so himself: [Denevan publicly rejected the habitat-density method behind his own 5.1–6.8 million figure — "too much variability in densities in each habitat" — while still judging "at least 5 to 6 million" reasonable on other grounds]{claim=AMZ-C012}. A number can outlive the death of the argument that produced it; a reader deserves to know when that has happened. Every regional figure in this case — the Aquiry's 1.25–3 million, the southern rim's half-million to million, the Xingu's fifty thousand — belongs to the same family: count the sites, assume how many stood at once, multiply by an ethnographic head-count, extrapolate to the unsurveyed. The honest error bars are wide, and the research item that would narrow them is a re-derivation of every estimate under a common assumption set.

  What the aggregate evidence does support: [summed radiocarbon dates for the whole biome fit a population growing logistically toward carrying capacity over the 1,700 years before European colonization]{claim=AMZ-C015}. On that proxy there is no basin-wide sign that Amazonian societies were already dying out on their own before the caravels. But the authors themselves read the proxy's terminal decline as sampling bias compounded by post-European collapse, and a radiocarbon curve is a relative signal of activity, not a head-count. It is graded provisionally here for a reason given in the next section.

  ## The disappearance — and the one before it

  If Carvajal described a real world, where did it go? The documented answer, where colonial records permit counting, is brutal and specific. [In the Napo–Aguarico province, an estimated 49,000–51,000 people in the early contact period became about 6,000 by 1700 — an 88 percent collapse; neighbouring Mainas lost roughly two-thirds — through differing regional mixtures of epidemics, slave raids, missionization, forced labour, revolt, and flight]{claim=AMZ-C010}. Note the mechanism list: people did not only die in place. They were taken, gathered into missions, and — in the reconstruction's own words — "most opted to flee from exposed locations along the major rivers." Nor did disease move as one wave: [in sparsely settled lowlands epidemics commonly "faded out," and it was the raids and the missions that kept reintroducing them]{claim=AMZ-C023}. A riverbank empty in 1690 is not evidence it was empty in 1542; it may be evidence of everything that happened in between. The limit is that these ratios come from upper-Amazon provinces with mission records; extending them to the Solimões reaches Carvajal described is an extrapolation this case's research agenda proposes to test province by province.

  But the record also carries a disappearance that owes nothing to Europe. The Aquiry peak passed a thousand years before Orellana; Casarabe ended around 1400. Whatever emptied those landscapes, it was not smallpox. A pollen-based approach exists that can date abandonment directly: across dozens of Amazonian lake records, [the pollen of *Cecropia* — a fast-growing pioneer tree — is tracked as an indicator of site abandonment and early forest regrowth]{claim=AMZ-C040}. What those records say about *when* regrowth began, and whether it began on Carvajal's corridor or off it, is exactly what this case has not yet verified from the primary text; it is the second research item, and its outcome decides whether "died between the visits" is the whole story for the main river or only part of it. Until it is run, the radiocarbon proxy's "growth to contact" stands as provisionally supported, not established.

  ## The sparse Amazon

  Everything above could be true and the maximalist picture still false, and the negative evidence is part of this case's spine, not an afterthought. [Across 7,363 recorded archaeological sites, distance from a river is the single strongest predictor of pre-Columbian occupation, and the interfluves were more sparsely populated than land near rivers]{claim=AMZ-C013}. And [where scientists have sampled the soils of the western and interfluvial Amazon — fourteen regions in cumulative synthesis — most terra-firme profiles show diverse closed-canopy forest with little to no sign of annual crops, significant clearing, anthropic soils, enrichment of favoured trees, or recurrent fire]{claim=AMZ-C014}. The skeptics of the "garden Amazon" are not defending the old impossibility thesis; they are defending proportions. [Predictive modelling over the known sites finds the earthwork and dark-earth extents "limited, albeit impressive," with humbler site types predicted to dominate more than two-thirds of Amazonia]{claim=AMZ-C020}.

  The Bolivian excavators have answered in print that their results "put to rest" arguments that western Amazonia was sparsely populated. This case records the rejoinder and gives it little weight: the Llanos de Mojos is a seasonally flooded savanna on Andean-derived soils, not the terra-firme forest the phytolith work samples. The two findings are about different ground.

  Where the argument genuinely bites is sampling — and both sides' samples are biased, quantifiably. [The "sparse west" rests on some three hundred soil cores clustered in five small areas — about 1.17 cubic metres of sediment standing in for two million square kilometres]{claim=AMZ-C021}. Site databases, for their part, inherit every decade of survey effort spent near navigable rivers. And a negative palaeoecological result decays with age: [in the Upano Valley, "a long period of forest recovery largely eradicated the influence of Pre-Columbian occupations" on the ecological record, even as the later colonial-period signal persisted in the same profiles]{claim=AMZ-C022}. The older the activity, the less an absent signal means. The case logs both biases rather than choosing one, and its third research item is the direct measurement neither side has made: interfluve surveys on a sampling frame chosen blind to archaeological promise.

  ## What would change our mind

  This edition's verdicts are provisional in specific, listed ways.

  - **Toward the maximalist account:** a corridor test showing contact-horizon settlement intensity tracking Carvajal's populated reaches *and* promise-blind interfluve surveys finding occupation densities approaching riverine ones. Then the matrix is not thin, and the mosaic is a survey artifact.
  - **Toward the skeptical account:** a null corridor test — contact-horizon archaeology no denser on his populated reaches than on his empty ones — or a synoptic manuscript collation showing the qualitative bedrock itself varies across branches.
  - **Toward two disappearances:** pollen records from lakes on the main-stem corridor showing forest regrowth onset centuries before 1492. Then the emptying was under way before Orellana, and his crowded reaches were the survivors.
  - **Toward the founding thesis as stated:** province-level collapse reconstructions for the Solimões reproducing the Napo's ratios; and a Xingu terminus fixed from a primary.

  ## Where this case lands

  [The pre-contact Amazon that survives every filter in this record is a strongly heterogeneous one: substantial sedentary populations, engineered subsistence, and settlement systems along favoured river corridors, floodplains, savannas and bluffs, embedded in a much more lightly occupied forest matrix]{claim=AMZ-C016}. The "invented it" account is contradicted: independent witnesses and contact-horizon archaeology on his river forbid it. The garden Amazon is not established: the river gradient, the sampled interfluves, and the model-dependence of every total forbid that too. What remains open is proportions, and time.

  How connected was this world? Here the record splits along the same line. [Regional interaction spheres — shared ceramic traditions, exchange, stable multilingualism — are well documented; the strong hypothesis of a continent-spanning Arawak-dominated integration is assessed in the linguistic literature as resting on "quite weak" evidence, a criticism its author limits to the strong version]{claim=AMZ-C025}. Real connection, bounded extent — the mosaic again, at the level of politics and language.

  And the friar? [Carvajal now looks substantially credible about the qualitative social geography he described — populous, organized, road-connected riverine societies in specific reaches — and untrustworthy about his extreme numbers, which should not be treated as counts]{claim=AMZ-C017}. That is a more interesting vindication than the wholesale kind, because it was earned by discounting everything discountable and testing what was left. It is graded provisionally, not because the evidence points elsewhere, but because the one test that would settle it — his corridors against the ground, classified before looking — has not yet been run.

  ## Credit where the record supports it

  One more genealogical fact belongs in the open. [Years before the 2026 results, Graham Hancock's *America Before* devoted seven chapters — more than ninety pages, by his own account — to the Amazonian discoveries, the Acre geoglyphs among them, and his 2024 series put Pärssinen and Ranzi themselves in front of a mass audience]{claim=AMZ-C018}, at a time when this research was marginal to the mainstream conversation. On this site, outsider status is not evidence — in either direction. Hancock's larger lost-civilization thesis is not what this evidence establishes, and the mainstream's numerical skepticism about Carvajal has been partly vindicated by the manuscript work. But a truthful genealogy records who kept the question alive while the instruments were catching up, and this is such a record.
