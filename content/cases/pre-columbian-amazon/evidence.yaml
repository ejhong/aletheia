- id: AMZ-E038
  title: "Comparator: a basin-wide 10–24k undiscovered-earthwork prediction beside the Aquiry 24–30k regional prediction — part 1"
  claimIds:
    - AMZ-C004
  sourceId: SRC-PERIPATO-2023
  direction: context
  strength: moderate
