- id: AMZ-E002
  title: "The paper's own single-family sensitivity collapses the population headline roughly fivefold"
  claimIds: [AMZ-C005]
  sourceId: SRC-PARSSINEN-2026
  direction: supports
  strength: strong
  sourceStatement: >-
    "If, as said, about 25–60% (4,165–10,000) of these earthworks were in
    use in 100–300 ad, and if an average earthwork required 300 people to
    build and maintain it, we arrive at a total population of about
    1.25–3 million." And: "Only if the very unlikely estimation that each
    approximately 25-m long house foundation (mound) belonged to a single
    family were true would the population be about 250,000–600,000 people
    without the invisibility effect of laser penetration, which would
    raise the population, in this case, to approximately 315,000–760,000."
  editorInference: >-
    The estimate's span across its own stated assumptions — roughly
    fivefold — is the honest error bar, and it is what this case displays
    rather than the headline alone.
  exactLocator: "Nature, 2026-07-29, population estimation section (verified verbatim 2026-08-28)"
  limitations:
    - "The authors label the single-family reading 'very unlikely'; the sensitivity is theirs, the emphasis is ours."
  reviewState: ai_extracted
  origin:
    ref: "verification ledger A01"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
