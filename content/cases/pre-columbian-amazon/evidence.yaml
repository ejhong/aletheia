  editorInference: "Editor's comparison: SRC-PARSSINEN-2026 predicts roughly 24,000–30,000 earthworks within a ~183,000 km² Aquiry area alone — more than Peripato's upper bound for the entire basin, over an area about twice Peripato's high-probability rectangle. The two are not strictly commensurable (different earthwork definitions, data, and estimators; Peripato's 2023 model predates the 2026 LiDAR), so this does not undermine what AMZ-C004 states the 2026 study predicts. It does show that earthwork totals differ several-fold between published models, which AMZ-R004-style dependency work should address. Zero diagnosticity for the truth of C004 as worded; logged as the comparator the report sought."
