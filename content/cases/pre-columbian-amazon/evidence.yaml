- id: AMZ-E007
  title: "Nunes (1538) and the Ursúa accounts (1560) independently describe the populous middle Amazon"
  claimIds: [AMZ-C003]
  sourceId: SRC-LOPES-2024
  direction: supports
  strength: strong
  sourceStatement: >-
    "Diogo Nunes alcança a província de Machiparo em 1538, invadindo
    aldeias e capturando indígenas… Em 1560, seria a vez da expedição de
    Pedro de Ursúa… contando com dez relatos, sendo os de Vazquez,
    Almesto e Altamirano os mais completos." The accounts describe the
    middle Solimões as "uma das áreas mais densamente habitadas do
    rio-mar"; maize stores among the Yaguamales as "infinita"; straight
    roads "mui largos e bons, que eram ao modo dos Incas do Peru, exceto
    pelas paredes"; and turtle/fish abundance "na casa dos milhares."
  editorInference: >-
    Independent witnesses, hostile to one another and writing for
    different crowns, repeat the mundane load-bearing features of
    Carvajal's picture. None of them repeats his extreme numbers.
  exactLocator: "Bol. Mus. Goeldi 19(2) e20230072 (verified verbatim 2026-08-28)"
  limitations:
    - "Nunes's testimony survives as a letter of 1553/54 known through Porro's modern edition."
    - "Fortifications and organized warfare are NOT among the verified common elements; the turtle-corral detail belongs to Acuña (1639)."
  reviewState: ai_extracted
  origin:
    ref: "verification ledger A17 (corrected)"
    extractedBy: "claude-fable-5 (cursor session)"
    runId: "amz-case-build-2026-08-28"
    date: "2026-08-28"

