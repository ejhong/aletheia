  change: "Intake from report proposals/2026-09-17-report-pre-columbian-amazon-134558/report.md: 2 source(s), 6 evidence record(s), 5 claim(s), 2 research item(s) verified and added (proposal 2026-09-17-draft-pre-columbian-amazon-135349, verification 2026-09-17-verify-pre-columbian-amazon-140447); 58 candidate(s) rejected with reasons in dispositions.yaml."
  reason: "Admitted after verification: SRC-ROSTAIN-2024, SRC-ACHMATOWICZ-2018, AMZ-E073, AMZ-E074, AMZ-E075, AMZ-E076, AMZ-E072, AMZ-E077, AMZ-C061, AMZ-C062, AMZ-C063, AMZ-C064, AMZ-C065, AMZ-R007, AMZ-R008; everything else proposed was refused or blocked with a reason in dispositions.yaml. The drafter's rationale for the proposal, written before verification and describing what it proposed: This pass reads five texts. (1) Medina's 1894 introduction to the Carvajal Relación (the ledger's SRC-CARVAJAL-1542, now shown): it documents Orellana's own lost 1543 relación and the origin of the 'mentirosa' charge, Medina's judgement that the T'Serclaes and Oviedo texts are one author's, the incomplete Muñoz copy, the second-hand basis of Oviedo's endorsement, Oviedo's oral debt to Orellana, Carvajal's truth-oath and Medina's two caveats, and Herrera's near-verbatim dependence on Carvajal. (2) Markham 1859 (front matter and introduction): its Orellana text is Herrera's, not Carvajal's; it fixes the Ursúa expedition at Machiparo at New Year 1561, glosses Machiparo as near the Putumayo, records the Omagua/El Dorado rumour that preceded 1560, and summarizes Jesuit reports of smallpox at Borja (1660) and Portuguese slave raids on the Omagua after 1640 — all secondary and weighted as such. (3) Laureano de la Cruz's 1651/53 account, listed by the report as an unopened lead but retrieved here in full: a Franciscan resident among the Omagua for three years to October 1650 describes a province of 34 small villages, a smallpox epidemic that by his count killed a third at one village, the absence of chiefs, and Portuguese parties on the river — the first seventeenth-century witness on Carvajal's own corridor to enter this ledger; the headcount figure is garbled in the OCR and is flagged, not asserted. (4) Rostain et al. 2024 (full author manuscript): Upano occupation dated ca. 500 BCE to 300/600 CE with Huapula reoccupation 800–1200 CE, which bounds how far AMZ-C022's time-graded-erasure point can be spent against contact-era negatives. (5) Achmatowicz 2018 (abstract only): a scholarly assessment of Carvajal as a trustworthy source. Claims are split one proposition each; secondary sources enter with weak or moderate strength and explicit limitations. No edition change: the disappearance section should, after verification, acknowledge Laureano as the Omagua-reach witness, but the current telling is not shown wrong. Blocked routes (Oviedo lib. L, Acuña, Fritz, Harris 2017, Prümers 2022, Gómara) are logged with the pages Medina supplies."
