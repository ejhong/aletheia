# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license, presented as numbered
#            museum plates.

- id: IMG-AMZ-COVER
  role: cover
  file: /images/cases/pre-columbian-amazon/cover.jpg
  alt: >-
    Hand-tinted engraving of a pale gold river winding through dense green
    forest canopy seen from above, faint circular and square enclosure
    lines showing through the foliage on both banks, and a small open
    handwritten chronicle with a quill resting on a rock ledge in the
    lower corner.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-28"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph. A great
    river seen from high above, winding through dense engraved forest
    canopy; beneath the canopy along its banks, faint geometric
    enclosures — circles, squares, long causeway lines — show through the
    foliage like a memory of settlement. In one lower corner, small on a
    stone ledge, an open handwritten chronicle with a quill laid across
    it. An allegorical emblem, never a depiction of any real site,
    survey, or LiDAR dataset. Fine copperplate cross-hatching beneath
    soft watercolor washes. Full color in subdued antique mineral
    pigments — deep viridian and forest-green canopy, a pale ochre-gold
    river meander, faint umber earthwork lines, one small vermilion
    accent on the chronicler's ribbon marker — on aged cream paper.
    Absolutely no text, no labels, no captions, no border frame lines.

