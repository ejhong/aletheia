# Research agenda for AMZ-001 — decisive tests, ordered by information gain.

- id: AMZ-R001
  title: "The Carvajal corridor test: preregistered comparison of his populated and empty reaches against contact-horizon archaeology"
  summary: >-
    Classify every reach of the 1541–42 route as populated or empty from
    the manuscript witnesses alone — before consulting archaeological
    layers — with route and palaeochannel uncertainty modeled as
    probability corridors — tributary identifications remain tentative
    in the scholarship (the "Río de la Trinidad" carries an explicit
    question mark in the recovered literature). Then compare contact-horizon
    (AD 1400–1650) archaeological intensity in his populated corridors
    against matched control reaches. Freeze the reach classifications,
    matching protocol, and outcome measure first; collect second.
  claimIds: [AMZ-C001, AMZ-C017]
  track: either
  effortTier: desk
  informationGain: >-
    Converts a 480-year-old credibility dispute into a falsifiable spatial
    prediction. A positive result would be the strongest possible
    vindication of the account's qualitative reliability; a null would
    cap it — either way the largest open question in this case closes.

- id: AMZ-R002
  title: "Synoptic manuscript-witness table for the Carvajal account"
  summary: >-
    A passage-by-passage collation of the Muñoz/T'Serclaes–Medina and
    Oviedo witnesses, separating what every branch shares (the
    qualitative bedrock) from what only one branch carries (the famous
    figures), with each downstream citation in the literature re-anchored
    to the branch it actually quotes.
  claimIds: [AMZ-C002]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Every argument about "what Carvajal said" currently depends on which
    edition a scholar happened to cite; the table would end that
    ambiguity permanently and likely reclassify several famous claims.

- id: AMZ-R003
  title: "Promise-blind interfluve surveys: measuring the matrix, not the hotspots"
  summary: >-
    Survey transects (LiDAR plus ground-truthing plus gridded soil
    coring) across interfluvial blocks selected by a sampling frame blind
    to archaeological promise, to estimate occupation density where
    neither discovery bias nor spectacular-site selection operates —
    with proxy-sensitivity controls so negative results count only where
    the method could have detected occupation.
  claimIds: [AMZ-C013, AMZ-C014, AMZ-C016]
  track: small_grant
  effortTier: field
  informationGain: >-
    The mosaic model's open parameter is the matrix density; both the
    positive record (sites) and negative record (sparse cores) are
    currently biased samples. This is the direct measurement.

- id: AMZ-R004
  title: "Dependency-corrected re-derivation of Amazonian population estimates"
  summary: >-
    Group every published basin and regional estimate into its model
    family (habitat-density, ethnographic back-projection, documentary,
    settlement/house-count, dark-earth scaling, radiocarbon proxy),
    identify shared assumptions, and re-derive the families under a
    common assumption set with explicit sensitivity envelopes —
    Denevan's self-rejection (AMZ-C012) and the Aquiry fivefold span
    (AMZ-C005) as the template.
  claimIds: [AMZ-C005, AMZ-C012]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Would replace the misleading spread of "competing censuses" with an
    honest map of which numbers are actually independent — probably
    narrowing the defensible range substantially.

- id: AMZ-R005
  title: "Province-by-province collapse timelines for the middle and lower Amazon"
  summary: >-
    Extend Newson-style documentary reconstruction (epidemics, slave
    raids, missionization, relocation, flight — dated and sourced per
    province) from the upper-Amazon provinces where it exists to the
    Solimões reaches Carvajal described, testing quantitatively whether
    documented decline and relocation suffice to turn his 1542 into the
    emptier later record.
  claimIds: [AMZ-C010, AMZ-C017]
  track: either
  effortTier: desk
  informationGain: >-
    The reconciliation argument currently borrows regional ratios from
    provinces with records; establishing them where the dispute actually
    lives would close the loop — or break it.

- id: AMZ-R006
  title: "Two proxies, one trajectory: map the 39 Bush et al. pollen records against Carvajal's corridor and the radiocarbon SPD"
  summary: Open Bush et al. 2021 (Science 372:484–487) in full with Database S1; tabulate for each of the 39 lakes its location, its onset of forest-pollen recovery, and whether it lies on the main-stem/major-tributary corridors Carvajal described or in interfluves and southern savannas. Then compare against the regional breakdown of the summed radiocarbon distribution in SRC-ARROYOKALIN-2021 to determine whether the disagreement between proxies is basin-wide or a matter of where each samples.
  claimIds:
    - AMZ-C015
    - AMZ-C016
  track: publication_prize
  effortTier: desk
  informationGain: Settles whether the pre-European abandonment signal is concentrated off Carvajal's corridor (leaving AMZ-C015 and the 'died between the visits' reading intact for the main river) or extends to riverine sites (which would force a mixed pre- and post-contact collapse account into the edition).
  origin:
