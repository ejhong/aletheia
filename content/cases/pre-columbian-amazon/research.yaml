# Research agenda for AMZ-001 — decisive tests, ordered by information gain.

- id: AMZ-R001
  title: "The Carvajal corridor test: preregistered comparison of his populated and empty reaches against contact-horizon archaeology"
  summary: >-
    Classify every reach of the 1541–42 route as populated or empty from
    the manuscript witnesses alone — before consulting archaeological
    layers — with route and palaeochannel uncertainty modeled as
    probability corridors — tributary identifications remain tentative
    in the scholarship (the "Río de la Trinidad" carries an explicit
    question mark in the recovered literature). Then compare contact-horizon
    (AD 1400–1650) archaeological intensity in his populated corridors
    against matched control reaches. Freeze the reach classifications,
    matching protocol, and outcome measure first; collect second.
  claimIds: [AMZ-C001, AMZ-C017]
  track: either
  effortTier: desk
  informationGain: >-
    Converts a 480-year-old credibility dispute into a falsifiable spatial
    prediction. A positive result would be the strongest possible
    vindication of the account's qualitative reliability; a null would
    cap it — either way the largest open question in this case closes.

- id: AMZ-R002
  title: "Synoptic manuscript-witness table for the Carvajal account"
  summary: >-
    A passage-by-passage collation of the Muñoz/T'Serclaes–Medina and
    Oviedo witnesses, separating what every branch shares (the
    qualitative bedrock) from what only one branch carries (the famous
    figures), with each downstream citation in the literature re-anchored
    to the branch it actually quotes.
  claimIds: [AMZ-C002]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Every argument about "what Carvajal said" currently depends on which
    edition a scholar happened to cite; the table would end that
    ambiguity permanently and likely reclassify several famous claims.

- id: AMZ-R003
  title: "Promise-blind interfluve surveys: measuring the matrix, not the hotspots"
  summary: >-
    Survey transects (LiDAR plus ground-truthing plus gridded soil
    coring) across interfluvial blocks selected by a sampling frame blind
    to archaeological promise, to estimate occupation density where
    neither discovery bias nor spectacular-site selection operates —
    with proxy-sensitivity controls so negative results count only where
    the method could have detected occupation.
  claimIds: [AMZ-C013, AMZ-C014, AMZ-C016]
  track: small_grant
  effortTier: field
  informationGain: >-
    The mosaic model's open parameter is the matrix density; both the
    positive record (sites) and negative record (sparse cores) are
    currently biased samples. This is the direct measurement.

- id: AMZ-R004
  title: "Dependency-corrected re-derivation of Amazonian population estimates"
  summary: >-
    Group every published basin and regional estimate into its model
    family (habitat-density, ethnographic back-projection, documentary,
    settlement/house-count, dark-earth scaling, radiocarbon proxy),
    identify shared assumptions, and re-derive the families under a
    common assumption set with explicit sensitivity envelopes —
    Denevan's self-rejection (AMZ-C012) and the Aquiry fivefold span
    (AMZ-C005) as the template.
  claimIds: [AMZ-C005, AMZ-C012]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Would replace the misleading spread of "competing censuses" with an
    honest map of which numbers are actually independent — probably
    narrowing the defensible range substantially.

- id: AMZ-R005
  title: "Province-by-province collapse timelines for the middle and lower Amazon"
  summary: >-
    Extend Newson-style documentary reconstruction (epidemics, slave
    raids, missionization, relocation, flight — dated and sourced per
    province) from the upper-Amazon provinces where it exists to the
    Solimões reaches Carvajal described, testing quantitatively whether
    documented decline and relocation suffice to turn his 1542 into the
    emptier later record.
  claimIds: [AMZ-C010, AMZ-C017]
  track: either
  effortTier: desk
  informationGain: >-
    The reconciliation argument currently borrows regional ratios from
    provinces with records; establishing them where the dispute actually
    lives would close the loop — or break it.

- id: AMZ-R006
  title: Blind, probability-stratified LiDAR test of the competing earthwork-density predictions
  summary: Select LiDAR survey blocks at random within strata defined by the 2023 basin-wide probability surface (0–1%, 1–10%, 10–25%, ≥25%) and, inside the Aquiry area, by the 2026 study's regional model — choosing blocks before any archaeological knowledge of them is consulted and registering the selection. Fly and inspect each block with a fixed detection protocol and independent expert confirmation, then record earthworks per km² per stratum. Compare the observed densities with the densities each model implies for those strata. Observed densities in the 0–1% stratum at or near zero and rising monotonically with predicted probability would support the basin-wide model's calibration claims (proposed at intake and not admitted) as calibrated; systematic under-prediction inside the Aquiry area would favour the 2026 regional total in AMZ-C004 over the basin-wide one, and the reverse would favour the lower. Either result narrows the several-fold spread between published earthwork totals that AMZ-E038 records.
  claimIds:
    - AMZ-C029
    - AMZ-C004
  track: small_grant
  effortTier: field
  informationGain: Directly calibrates two predictive models whose totals differ several-fold, using sampling chosen blind to promise — the earthwork counterpart of AMZ-R003, and the only way to tell whether the 24–30k regional figure and the 10–24k basin figure can both be right.
  origin:
    ref: report 2026-09-10-report-pre-columbian-amazon-183738
    extractedBy: claude-fable-5-1
    runId: 2026-09-10-draft-pre-columbian-amazon-184613
    date: 2026-09-10

- id: AMZ-R007
  title: Read the Biblioteca Nacional manuscript of Laureano de la Cruz to fix the Omagua headcount garbled in the 1900 edition
  summary: "Object: the 62-folio manuscript of Laureano de la Cruz's 'Nuevo descubrimiento del río de Marañón' in the Biblioteca Nacional de España (the 1900 Madrid editor's source), and a page image of p. 94 of the 1900 edition. Measurement: the exact numeral the author gives for the men found in the Omagua province ('no hallamos ... indios cabales'), which the Internet Archive OCR renders as '10', together with any marginal or textual variants; secondarily, confirm the 34-village count and the 200-league extent. Decision rule: if the manuscript reads a figure in the low thousands (as a tertiary snippet gives, ≤5,000), the province held roughly 1,000–2,500 households in 1650 and the proposed claim on Laureano's 34 villages can carry a number; if it reads tens or hundreds, the Omagua corridor was near-empty a century after Carvajal and the murdered-world reading of AMZ-C017 gains a dated resident witness; either way the result moves AMZ-C010's geographic reach (Solimões vs upper-Amazon provinces) and supplies the 1650 point in the province timeline. Also record whether Laureano gives any village count for the reaches below the Putumayo mouth he did not visit."
  claimIds:
    - AMZ-C017
    - AMZ-C010
  track: small_grant
  effortTier: desk
  informationGain: Converts an OCR-uncertain figure into the only seventeenth-century resident headcount for Carvajal's Omagua reach; distinguishes 'a province of a few thousand' from 'a province of a few hundred' in 1650, which is the magnitude the modest-skeptic and murdered-world accounts disagree about.
  origin:
    ref: report 2026-09-17-report-pre-columbian-amazon-134558
    extractedBy: claude-fable-5-1
    runId: 2026-09-17-draft-pre-columbian-amazon-135349
    date: 2026-09-17
- id: AMZ-R008
  title: Calibrate palaeoecological erasure against time since abandonment using sites with dated occupation ends
  summary: "Object: sediment or soil profiles adjacent to Amazonian occupation sites whose end dates are archaeologically fixed — Upano (occupation ending 300–600 CE, with Huapula reoccupation to ~1200 CE), Casarabe (~1400 CE), Belterra Plateau near Santarém (to the seventeenth century), Marajó Cacoal (to ~1650) and Upper Xingu (to ~1770). Measurement: in each profile, the presence and magnitude of anthropogenic indicators (crop phytoliths, charcoal influx, soil-nutrient and pottery-fragment signals, disturbance-taxon pollen) in the occupation-age horizons versus the post-abandonment and Colonial horizons, scored by a common protocol, then plotted against years since abandonment. Decision rule: if sites abandoned 350–400 years before present retain clear occupation signals while Upano's ~1,000-year-old signal is lost, then the erasure documented at Upano (AMZ-C022) is time-dependent and cannot be used to discount contact-era palaeoecological negatives in reaches depopulated in the 1600s, strengthening AMZ-C014's negatives for those reaches; if signals are also largely erased at the ~400-year sites, AMZ-C022 applies generally and AMZ-C014's negatives in terra-firme settings are weakened as evidence of absence; an intermediate result yields a decay curve that grades the negatives by age."
  claimIds:
    - AMZ-C022
    - AMZ-C014
  track: either
  effortTier: lab
  informationGain: Turns the 'time-graded erasure' argument from an analogy into a measured decay function, deciding how much weight contact-era palaeoecological absence can bear.
  origin:
    ref: report 2026-09-17-report-pre-columbian-amazon-134558
    extractedBy: claude-fable-5-1
