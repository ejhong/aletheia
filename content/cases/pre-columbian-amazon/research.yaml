  summary: "Re-read SRC-PARSSINEN-2026 and its supplement to classify the 432 documented earthworks by type and by any available dates; determine whether Mound Villages (Iriarte et al. 2020: ~AD 1000–1650) are counted among them and how many carry dates after AD 1400. Obtain Iriarte et al. 2020 (JCAA 3(1), doi:10.5334/jcaa.45) from the open PDF to fix the type chronology."
  claimIds:
    - AMZ-C004
    - AMZ-C005
    - AMZ-C017
  track: either
  effortTier: desk
  informationGain: Determines whether southwestern Amazonia contributes any contact-horizon evidence to the founding question or only an AD 100–300 demonstration of environmental capacity, and refines what fraction of the 24,000–30,000 projection belongs to which era.
