  synthesis: >-
    The ladder is strong at its lowest rung and thins fast. The canonical
    POSS-I marks are real features of surviving photographic material —
    confirmed physically by the case's own critics (TRN-C001) — and
    independent software recovers both the canonical events and most of
    the public catalog (TRN-C004). The central disagreement begins exactly
    one rung higher, at TRN-C020: whether any substantial subset of marks
    was produced by light entering the telescope during the original
    exposures. Against that, Hambly & Blair supply the case's most
    load-bearing mundane mechanism (TRN-C007): both major digitizations
    descend from a shared copy positive, so cross-dataset agreement proves
    nothing about the original negatives, and the sharp profiles of the
    1950 nine (TRN-C002) sit in the known morphological neighborhood of
    emulsion artifacts. The strongest proponent response is no longer the
    PSF argument alone (TRN-C102, plausible but uncalibrated): it is the
    2026 Hamburg work — analogous candidates outside the Palomar copy
    lineage (TRN-C010), some reportedly carrying the coma signature of
    light through the optics (TRN-C011). If the coma discriminant survives
    blind validation, specific candidates move from "mark" to "flash"
    without touching the Palomar originals; it has not yet been
    blind-validated, so it is weight-bearing but not yet weight-proven.
    The ensemble evidence sorts cleanly by replication type, and that
    sorting is the case's most instructive lesson: the Earth-shadow
    deficit (TRN-C005) and nuclear-window association (TRN-C006) replicate
    under independent statistics on the same 107,875-row working catalog
    (Doherty) and persist under internal ML artifact-scoring (Bruehl et
    al. 2026), but the shadow deficit fails in more heavily vetted subsets
    with the background's non-uniformity modeled (Watters et al.), and the
    nuclear effect vanishes in the one fully independently constructed
    catalog once nightly coverage is modeled (Hayes). Correlations that
    survive re-analysis but not reconstruction are, provisionally,
    properties of the catalog rather than the sky. Even taken at face
    value, the nuclear association is direction-ambiguous (fallout on
    emulsions predicts it as readily as glints), and the attribution rungs
    above near-Earth reflection — artificiality (TRN-C022),
    extraterrestrial origin (TRN-C023) — currently have no evidence stream
    of their own at all. The honest roll-up: unresolved, not refuted. The
    marks are real; their maker is unknown; and the decisive missing
    observation is physical provenance — a blind examination of the
    original telescope negatives (TRN-R001), followed in priority by blind
    validation of the coma test (TRN-R003) and a preregistered shadow
    analysis across independently built catalogs (TRN-R005).

