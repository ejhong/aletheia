  synthesis: >-
    The featured hypothesis joins two propositions the evidence keeps apart:
    that at least some pre-Sputnik single-exposure marks were made by light
    entering the telescope, and that that light was sunlight from artificial
    objects near Earth. The observational floor is solid and is not where the
    dispute lives. Nine star-like marks sit on surviving glass of the 12 April
    1950 POSS-I red plate at the reported positions, physically confirmed by the
    case's principal critics and recovered by an independent detection pipeline;
    they are absent from the overlapping plate six days later and from deeper
    modern surveys. A second multi-source event on 19 July 1952 is recovered
    independently and remains absent to magnitude 25.5. Those 1950 marks are
    systematically sharper than equal-brightness stars. Independent software
    finds the canonical events and most of a published candidate list in the
    same scans. None of this is seriously contested. It is compatible with every
    live reading, from emulsion chemistry to orbiting hardware.

    Steelman the conventional account. Photographic plates manufacture star-like
    dots without any sky event; the GRB-era archival campaign spent two decades
    learning that lesson and never confidently confirmed one optical transient.
    Hambly and Blair reconstructed a concrete, undisputed genealogy: DSS and
    SuperCOSMOS are scans of separate copy negatives printed from one shared
    intermediate positive, so a single copying flaw would appear in both modern
    datasets and look independently confirmed. Their classifier groups the 1950
    nine with artifacts. Watters et al. show that candidate positions are
    spatially heterogeneous, edge-concentrated, and cluster-prone in the manner
    of plate and scan defects; that the Earth-shadow analysis assumes a uniform
    background the data violate; and that the nuclear-window timing largely
    tracks Palomar's observing schedule. Hayes, rebuilding a catalog from
    scratch rather than re-analyzing contested rows, keeps the canonical
    detections and loses the nuclear association once nightly coverage is
    modeled. Correlations that survive inside one working catalog and dissolve
    when the catalog is reconstructed are not yet properties of the sky. The
    copy-defect rate has never been measured, which is an unpaid quantitative
    debt, not a license to ignore the pathway.

    Steelman incident light. A sub-second flash on a fifty-minute exposure has
    no time to accumulate seeing and tracking blur, so sharpness is exactly what
    a real flash should look like — the morphology argument points both ways
    until period emulsions are calibrated. The shared-ancestor mechanism proves
    possibility, not occurrence, and it cannot reach another observatory.
    Busko's Hamburg search uses a different telescope, emulsion, archive, and
    digitization and finds analogous appear-once candidates; on a 0.6-m
    reflector chosen for strong off-axis coma, those candidates reportedly carry
    the optical fingerprint of light through the telescope. Scratches do not
    know where the optical axis is. If that discriminant survives a blind corpus
    test against known defects and deliberately produced flashes, TRN-C020 moves
    for a population the Palomar copy chain cannot explain. It has not been so
    tested. The original POSS-I telescope negatives have never been examined at
    the candidate coordinates.

    Until those two observations exist — blinded originals, and a shadow or
    equivalent orbital signature in independently extracted catalogs — every
    rung above "the marks exist on plate material" remains conditional. The
    headline claim of pre-Sputnik artificial objects is therefore unresolved,
    not weakly supported: no calibrated measurement yet requires photons from
    the sky, let alone from manufactured hardware. Extraterrestrial origin is
    not presently testable at all. The honest product of this case is a research
    agenda.
