  synthesis: "This case resolves, on the present record, into a ladder whose
    bottom rungs are settled and whose crux is untouched. That the marks exist
    on surviving plate material is established — by the critics themselves,
    under their own microscope, in their own archive — and independent software
    recovers them. That both digitizations descend from a shared intermediate
    positive is well supported and quietly destroys the \"two independent
    datasets\" argument. Everything above is open: incident light (TRN-C020) is
    genuinely unresolved; near-Earth origin (TRN-C021) rests on a shadow deficit
    that replicates only inside one contested catalog lineage; the featured
    claim (TRN-C022) inherits all of that and adds nothing of its own. Steelman
    for the sky: the 1950 nine are real, simultaneous, and sharp in exactly the
    way sub-second flash physics predicts; the classifier condemning them was
    trained on a \"spurious\" class defined by absence of a modern counterpart —
    the very definition of a transient — so its artifact verdict may be
    circular; the ensemble correlations reproduce under independent code and
    persist after ML artifact-scoring; and the Hamburg lineages escape the
    Palomar copy mechanism entirely, with a reported coma signature that surface
    chemistry should not be able to fake. Steelman for chemistry: two decades of
    GRB-era archival hunting produced a bestiary of star-like plate impostors
    and zero confirmed transients — a prior I use for calibration, not as a
    record here; all nine canonical marks sit in the artifact morphology
    neighborhood; similar one-plate detections occur on neighboring fields; the
    population's edge concentration and clustering look like plate and scan
    artifacts; and every ensemble signal dissolves when the catalog is rebuilt
    rather than re-analyzed — Hayes's independent extraction with exposure
    modeling is the single most probative negative result. The structural fact
    dominating the case is that the decisive observation has never been made: no
    one has examined the original telescope negatives at the candidate
    positions, blind, to record at which copying generation each mark first
    appears. No correlation on an unvalidated catalog can substitute for that.
    Notably, the strongest new positive line (TRN-C011) is simultaneously the
    weakest link — one unvalidated preprint — alongside the preliminary TRN-C010
    and the schedule-confounded TRN-C006. Verdict: unresolved, with the unusual
    property that the instruments capable of resolving it are specified,
    affordable, and sitting in archives."
