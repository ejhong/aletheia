  synthesis: "The case has an unusually clean structure: a secure observational
    floor, a contested statistical middle, and an unbridged gap at exactly the
    rung the headline needs. The floor is genuinely secure. The nine 1950 marks
    were physically confirmed on glass by the case's principal critic, an author
    of one of the digitizations, and recovered 8/9 by a from-scratch outside
    pipeline; the 1952 triple was recovered 3/3 by that same pipeline. Nobody
    should be arguing about whether the marks exist, and the record shows nobody
    is. But every one of those confirmations reads descendants of a shared
    photographic ancestor (TRN-C007), and that genealogy — reconstructed by the
    people who ran the digitization program, and undisputed by the proponents —
    dissolves the strongest cheap argument for reality. \"Present in two
    independent scans\" is not independent confirmation when the scans are
    cousins. The decisive discriminator, imaging the original telescope
    negatives blind and recording at which copy generation each mark first
    appears, has never been performed in seventy-five years. That single fact
    dominates the case: the evidence base is not merely thin at the crux, it is
    structurally incapable of settling the crux, and both camps know it.
    Steelmanning the skeptics: the GRB-era archival searches spent two decades
    producing star-like impostors and zero confirmed archival transients; the
    canonical nine sit in the morphological neighborhood where a trained
    classifier puts spurious detections; the candidate population is spatially
    heterogeneous, edge-concentrated, and clustered in ways plates and scanners
    are known to produce; and the two headline ensemble correlations reproduce
    when the analysis is rerun on the same rows and vanish when the rows are
    rebuilt or the exposure denominator is modeled. That last pattern is the
    single most informative structural fact in the ensemble literature:
    replication type, not replication count, sorts the results. Steelmanning the
    proponents: the sharpness argument genuinely cuts both ways — a sub-second
    flash on a fifty-minute exposure should be sharper than seeing-blurred
    stars, and no one has exposed period emulsion to controlled flashes to draw
    the discriminating curve, so the critics' best morphological argument is
    uncalibrated; the Hambly-Blair classifier defines its spurious class by
    absence of a modern counterpart, which is the defining property of a real
    transient, so it is partly circular by construction; the copy-defect
    mechanism is a demonstrated pathway with no measured occurrence rate; and
    the Hamburg work sits entirely outside the Palomar lineage, where the copy
    mechanism cannot reach, with a physically principled discriminant (coma from
    off-axis optics) that chemistry has no reason to imitate. Neither side has
    closed. The honest reading is that the mundane account is favored by base
    rates and by the copy genealogy, while the two highest-diagnosticity
    positive lines — the coma signature and independent-archive rates — are each
    a single unblinded preprint. Verdict unresolved, not as a hedge but as a
    description: the discriminating observations exist, are cheap relative to
    their information gain, and have simply not been made."
