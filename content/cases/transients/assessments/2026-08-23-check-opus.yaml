    reasoning: "This is the highest-diagnosticity positive line in the case and also
      its thinnest: a single unblinded single-author preprint, on a telescope
      selected because its coma is strong, with no published confusion matrix
      against known stars, deliberately generated flashes, or the defect
      bestiary, and with the author himself stating the data do not establish
      the light's physical origin. The physical logic is sound — an off-axis
      optical fingerprint is something photons through the telescope have and
      surface chemistry has no reason to imitate — which is why I rate it
      supported at all rather than unresolved. The strongest opposing
      consideration is that directional asymmetry is a common failure mode of
      scratches, dust shadows, drying marks and scan artifacts, and that an
