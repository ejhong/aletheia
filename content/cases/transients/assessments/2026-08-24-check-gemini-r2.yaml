  synthesis: >-
    The "Before Sputnik?" case investigates whether anomalous, single-exposure
    star-like points on historical photographic plates are mundane artifacts or
    genuine optical flashes—potentially from near-Earth artificial objects. The
    case structure is a ladder of dependency, and it breaks precisely at the
    crux of physical origin.

    Steelmanning the proponent side, the fundamental anomalies are real and
    robust. The canonical 1950 and 1952 marks physically exist on the surviving
    plates, are sharply defined in a manner consistent with sub-second flashes,
    and are reliably recovered by independent extraction pipelines. Recent
    microscopy of the original telescope negatives decisively places the 1950
    sources on the original glass, completely neutralizing the strongest
    skeptical mechanism—that the marks were introduced during a shared
    intermediate copying stage. Furthermore, independent plate lineages (the
    Hamburg archive) exhibit analogous transients, some of which tentatively
    show off-axis optical coma, a physical signature that surface chemistry
    cannot easily fake. Within the proponents' working catalog, intriguing
    statistical correlations—such as an Earth-shadow deficit—survive
    machine-learning vetting and replication by independent statisticians.

    Steelmanning the skeptic side, historical photographic plates are inherently
    noisy chemical mediums. Two decades of archival searches for gamma-ray
    bursts repeatedly demonstrated that seemingly perfect "transients"
    frequently dissolve into emulsion flaws under scrutiny. While the new
    microscopy confirms the marks are on the original negative, the independent
    microscopist leaned heavily toward the emulsion-defect interpretation based
    on morphology, and the manuscript itself concedes that microscopy cannot
    physically differentiate a chemical flaw from a brief flash. Moreover, the
    ensemble statistics that drive the near-Earth and nuclear hypotheses
    collapse under closer inspection: the Earth-shadow deficit vanishes when the
    catalog's profound spatial non-uniformity is properly modeled, and the
    nuclear timing effect disappears when observation scheduling and independent
    source extraction are applied. 

    Ultimately, the headline claims of pre-Sputnik artificial satellites and
    near-Earth reflections (TRN-C022, TRN-C021) remain entirely unresolved
    because the foundational physical crux (TRN-C020)—whether the marks were
    made by photons or plate chemistry—cannot currently be answered. The
    available evidence presents an intriguing historical anomaly, but it is
    deeply intertwined with the well-documented failure modes of historical
    photographic emulsions and the inherent biases of the unvalidated working
    catalog.
