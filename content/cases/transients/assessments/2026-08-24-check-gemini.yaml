      visually confirmed under a microscope on the Edinburgh glass copy by
      skeptical critics, and independently recovered by a separate software
      pipeline. The strongest opposing consideration is that similar marks
      appear on neighboring plates, suggesting a systemic plate phenomenon
      rather than a unique sky event, but this does not dispute their physical
      presence.
