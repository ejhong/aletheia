  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: Hayes’s from-scratch pipeline, with no access to the VASCO team’s
      codes or candidate list, recovers 8/9 of the 1950 sources, 3/3 of the 1952
      triple, and roughly two-thirds of the published 5,399-candidate catalog
