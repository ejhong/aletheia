  synthesis: >-
    The dossier cleanly separates three layers: (1) secure observations about
    plate marks and catalog construction, (2) the crux of whether any marks are
    genuine incident light (TRN-C020), and (3) attribution to near-Earth
    reflective objects and artificial/ET technology (TRN-C021, TRN-C022,
    TRN-C023). The lowest layer is strong: the canonical April 1950 nine and
    July 1952 triple exist on surviving glass copies and in independent
    source-extraction pipelines (TRN-C001, TRN-C003, TRN-C004, TRN-E001–E003,
    TRN-E007–E008). This establishes that the phenomenon to be explained is real
    features of plate material, not software glitches.

    The next layer is image morphology and copy genealogy. Hambly & Blair show
    all nine 1950 marks are systematically sharper than stars and land squarely
    in the morphology space where the SuperCOSMOS classifier places spurious
    detections (TRN-C002, TRN-E003–E004). They also reconstruct the copying
    chain: both DSS and SuperCOSMOS scans descend from copy negatives made off a
    single intermediate positive of the original Schmidt negative, so a defect
    introduced at that shared stage would appear “independently” in both
    digitizations (TRN-C007, TRN-E005). This convincingly undercuts the “two
    independent scans” argument and provides a concrete, plausible mundane
    pathway. However, no one has yet measured the rate at which such copy-stage
    star-like defects are produced, so this remains a qualitative mechanism, not
    a quantitative explanation (TRN-R007).

    Proponents reply that sub-second flashes are also expected to be sharper
    than long-exposed stellar PSFs (TRN-C102, TRN-E006). That physics is
    qualitatively reasonable: stars accumulate seeing and tracking blur, a short
    flash does not. But crucially, there is still no calibration experiment on
    period-appropriate emulsions (TRN-R002), so the sharpness measurement is
    presently direction-ambiguous: it clearly indicates “not an ordinary star,”
    but cannot discriminate flash from artifact.

    Ensemble statistics are the main support for near-Earth interpretations: an
    Earth-shadow deficit (TRN-C005) and a nuclear-test temporal association
    (TRN-C006). Within the original 107,875-row working catalog, these effects
    have been replicated by independent code (TRN-E010) and appear to survive
    machine-learning artifact scoring (TRN-E015) and some environmental controls
    (TRN-E017). Yet Watters et al. show that the underlying feature distribution
    is highly non-uniform (edge/corner concentrations and geometric clusters),
    invalidating the simple uniform background assumed in the shadow study; they
    find no significant shadow deficit when those inhomogeneities are modeled
    and when vetted subsets are used, and they tie most of the nuclear
    correlation to the Palomar observing schedule (TRN-E011). Hayes’s
    independent pipeline, which rebuilds a much larger candidate set from
    scratch and explicitly models nightly sky coverage, finds no significant
    nuclear-window effect (TRN-E009). This pattern is key: correlations
    reproduce robustly conditional on a single, unvalidated working catalog, but
    do not generalize when the catalog is independently reconstructed. That
    strongly limits the evidential weight of TRN-C005 and TRN-C006 toward
    TRN-C021.

    The most important genuinely new positive developments come from the Hamburg
    archive. Busko’s preliminary search finds analogous single-exposure
    candidates on Hamburg Schmidt plates, a telescope and emulsion chain wholly
    independent of Palomar (TRN-C010, TRN-E013). This shows that “appear-once,
    star-like marks” are not unique to the POSS-I copies; however, the study has
    not yet published injection/recovery calibrations or a controlled
    false-positive rate, so it cannot yet distinguish “common astrophysical
    flashes” from “common plate defects at multiple observatories.” More
    consequentially, Busko’s second preprint reports that some Hamburg
    candidates exhibit the off-axis coma expected of real point sources imaged
    through the telescope but supposedly not of plate-surface artifacts
    (TRN-C011, TRN-E014). If this coma discriminant is real and survives blind
    validation against a controlled corpus of known defects and synthetic
    flashes (TRN-R003), it would directly support TRN-C020 for those Hamburg
    candidates and, by analogy, make a sky-origin interpretation for some
    Palomar marks more plausible. Yet at present the coma result is
    single-author, preprint-stage, and unvalidated; no confusion matrix versus
    defects and engineered flashes exists. It is therefore provisionally
    supportive but not decisive.

    Putting these threads together, the pivotal claim that at least some
    disputed marks are genuine photons recorded during the original exposure
    (TRN-C020) remains unresolved. On the “artifact” side, we have strong,
    archive-specific mechanisms (TRN-C007) and morphology placing the 1950 nine
    in the known spurious-detection region (TRN-C002), plus a long history of
    GRB-era archival searches where similar-looking candidates almost always
    evaporated as defects (TRN-C101). On the “real-light” side, we have: (a)
    theoretical plausibility that real sub-second flashes are sharp; (b) at
    least one additional multi-source event (the 1952 triple, TRN-C003); (c)
    preliminary evidence for analogous candidates at another observatory
    (TRN-C010); and (d) an unvalidated but promising coma-based signature
    (TRN-C011). No line clearly dominates yet, and the single most decisive
    proposed test—blind high-resolution examination of the original Palomar
    negatives to determine at which generation each mark first appears
    (TRN-R001)—has not been published. The proponent group reports having looked
    at the originals, but without a public, blind, generation-resolved protocol,
    that cannot yet change the evidential balance.

    Attribution rungs above TRN-C020, especially “near-Earth reflective”
    (TRN-C021) and “pre-Sputnik artificial object” (TRN-C022), therefore inherit
    all of this uncertainty and add further dependencies on the contested
    ensemble statistics. With the Earth-shadow deficit and nuclear correlations
    now clearly catalog-dependent and with no corroborated orbital signatures
    (e.g., repeated events tracing orbits) from independent pipelines, there is
    insufficient evidence to elevate TRN-C021 beyond unresolved. Consequently,
    the stronger artificial and extraterrestrial versions (TRN-C022, TRN-C023)
    are also unresolved and presently speculative; they do not have a direct
    evidential stream of their own.

    Overall, the case is neither debunked nor established. The most conservative
    reading is that we are looking at a mixture of plate and copy defects, with
    perhaps a small number of genuine fast transients whose nature remains
    obscure. The research agenda is correctly focused on: (1) blind,
    generation-resolved inspection of the original POSS-I negatives (TRN-R001);
    (2) flash-profile calibration (TRN-R002); (3) blind validation of the coma
    discriminant (TRN-R003); and (4) preregistered, multi-pipeline ensemble
    tests on independently built catalogs (TRN-R004–R005, TRN-R008). Until those
    are done, the headline hypothesis “before Sputnik?”—that pre-1957 artificial
    objects were detected in orbit—remains an intriguing but unsupported
    possibility, not an established fact.
