      fields show low false-positive rates in small regions, indicating the
      canonical detections are not software artifacts unique to the original
      pipeline. The strongest opposing consideration is that both pipelines
      operate on the same digitized plate products, so agreement does not
      address whether the underlying marks originate on the original negative or
      in later copying or scanning stages.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: Within the ~107,875-object VASCO working catalog, independent
      statistical analysis by Doherty reproduces the reported Earth-shadow
      deficit (TRN-E010), and ML artifact-scoring suggests the deficit is
      strongest among candidates judged less artifact-like (TRN-E015). However,
      Watters et al. show that the necessary assumption of a uniform background
      is violated—the candidates are highly non-uniform, concentrated toward
      plate edges and corners and in clusters—and find no significant deficit
      once this is modeled properly in closely related datasets (TRN-E011).
      Because the shadow signal has not yet been demonstrated on independently
      constructed catalogs and appears sensitive to catalog definition and null
      modeling, it cannot be regarded as either clearly present or clearly
      absent. The strongest opposing consideration is that when more heavily
      vetted subsets and realistic background models are used, the deficit
      disappears, suggesting it may be an artifact of catalog composition and
      simplistic null assumptions.
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: The nuclear-window association is statistically significant in the
      original VASCO working catalog using both frequentist and Bayesian
      approaches (TRN-E010, TRN-E019), appears to persist after ML artifact
      scoring (TRN-E015), and is not trivially explained by geomagnetic
      sensitivity variations in plate performance (TRN-E017). Yet Hayes’s
      analysis on an independently extracted catalog that explicitly models
      nightly survey coverage finds no significant effect (TRN-E009), and
      Watters et al. argue that the original signal is dominated by the
      observing schedule rather than sky behavior (TRN-E011). Additionally, even
      if real, the correlation is mechanistically ambiguous (fallout
      contamination vs glints). The strongest opposing consideration is that
      when the disputed step of candidate selection is independently redone and
      exposure is modeled, the association vanishes, implying the original
      effect may be a catalog artifact.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Busko’s preliminary Hamburg study reports appear-once, star-like
      candidates in rapidly repeated plate pairs from an observatory, telescope,
      emulsion stock, and digitization lineage wholly independent of Palomar
      (TRN-E013). This supports the existence of analogous single-exposure
      candidates beyond the POSS-I copies, and thus cannot be explained by the
      specific Palomar copy-genealogy mechanism. However, the sample is small
      (41 plates), explicitly preliminary, and lacks published false-positive
      and completeness calibrations, leaving defect contamination vs real-sky
      events unresolved. The strongest opposing consideration is that every
      plate archive is known to have star-like emulsion and handling defects, so
      without a rate-based comparison against matched controls, these candidates
      could simply reflect generic plate failure modes.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Busko’s coma-aberration study reports that Hamburg transient
      candidates on a telescope with strong off-axis coma exhibit the expected
      directional coma signatures of light passing through the optics, which
      plate-surface defects are argued not to replicate naturally (TRN-E014).
      This provides a plausible physical discriminant between incident-light
      images and post-exposure artifacts. Nevertheless, the analysis is
      single-author, preprint stage, and has not been blind-validated against a
      labeled corpus of known defects and engineered short flashes (TRN-R003),
      so its specificity and sensitivity remain unknown. The strongest opposing
      consideration is that, absent such validation, it is not yet proven that
      no class of plate or copy defects can mimic coma-like asymmetry, nor that
      analyst expectations did not bias candidate selection and classification.
