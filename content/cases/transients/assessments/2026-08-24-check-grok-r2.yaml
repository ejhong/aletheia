  synthesis: >-
    The case is a ladder, and the rungs do not share a verdict. At the floor the
    dispute is over. Nine star-like marks sit on the surviving glass of POSS-I
    field E0070 at the published positions, confirmed by the hypothesis's
    principal critics under a microscope, recovered by a from-scratch pipeline,
    and — in an unpublished but fully read microscopy — present on the original
    Caltech negative that was physically inside the Palomar Schmidt on 12 April
    1950. A second multi-source event on 19 July 1952 is peer-reviewed,
    independently recovered, followed to magnitude 25.5, and not confined to
    later copy material. Independent software is not manufacturing the
    detections. Those observational claims are established or well supported,
    and they are compatible with every hypothesis in the file.

    The conventional account steels itself as follows. Photographic emulsion
    manufactures star-like dots without a sky event; two decades of GRB-era
    archival searches learned this the hard way and never confidently confirmed
    one optical transient. The nine 1950 marks are systematically sharper than
    stars of equal brightness, which is the SuperCOSMOS neighborhood of spurious
    detections. DSS and SuperCOSMOS are not independent witnesses: they descend
    from a shared intermediate positive, so a single copying flaw would print
    into every modern dataset. The celebrated Earth-shadow deficit and
    nuclear-window excess replicate when analysts re-run statistics on the VASCO
    working catalog and dissolve when the catalog itself is rebuilt or the
    background is allowed to be the spatially heterogeneous, edge-concentrated
    mess the plates actually are. An independent microscopist, pointed at the
    nine objects by the copy-defect paper's own author, found them un-star-like
    and judged emulsion defects reasonable, noting their location in a plate
    corner where defects congregate. On this reading the Hamburg candidates are
    what you get when you search a second archive of old emulsion, and reported
    coma is an unblinded classifier looking at the thing it was built to find.

    The case for light steels itself differently. A sub-second flash on a
    fifty-minute exposure is supposed to be sharper than a star; the critics'
    morphology argument is therefore direction-ambiguous until someone
    calibrates period emulsion against controlled flashes. Copy defects cannot
    reach the original 1950 glass, cannot reach the 1952 triple if Yang's
    registration holds, and cannot reach Hamburg at all. Multiple point sources
    appearing together and vanishing within an hour are an awkward accident for
    chemistry and a natural one for glints. If even a subset of Hamburg
    candidates carry the telescope's off-axis coma, scratches have been ruled
    out for those objects, because chemistry does not know where the optical
    axis is.

    Neither steelman currently wins. Microscopy, the observation this case
    waited seventy-five years to make, cannot tell a flash from a flaw in the
    original emulsion; the crux (TRN-C020) narrowed from "original or copy?" to
    "sky or chemistry on the original?" and stayed open. Ensemble geometry
    remains a property of one contested catalog. The headline claim — artificial
    objects near Earth before Sputnik — and the maximal extraterrestrial reading
    sit above unresolved gates and have no evidence of their own. The honest
    case-level verdict is therefore unresolved: the marks are real features of
    plate material, their photon-versus-defect origin is not settled, and
    nothing yet requires a pre-Sputnik manufactured population.
