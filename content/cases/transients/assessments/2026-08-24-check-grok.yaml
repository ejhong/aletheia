  synthesis: >-
    The featured hypothesis stacks two readings the popular story fuses: that at
    least some pre-Sputnik single-exposure marks are photons that entered the
    telescope, and that those photons were sunlight glints from artificial
    objects near Earth. The evidence records settle neither. They do settle a
    floor and a conventional mechanism. Nine marks exist on surviving glass of
    the 12 April 1950 plate at the reported positions and are absent from the
    overlapping plate and from deeper modern surveys; the case's principal
    critics physically confirmed them, and an independent pipeline recovers
    eight of nine plus the July 1952 triple. That observational floor is
    compatible with every story in the file. The same critics documented that
    DSS and SuperCOSMOS are cousin scans of copy negatives printed from one
    intermediate positive, so dual-digitization agreement is not independent
    confirmation. The shared-ancestor pathway is well supported as mechanism and
    unpaid as rate: no census shows how often copying mints star-like fakes.

    Steelman the exotic reading. A flash shorter than seeing and tracking should
    look sharper than a star, so the Hambly–Blair sharpness result is
    direction-ambiguous until period emulsions are calibrated. Multiple
    simultaneous point sources across arcminutes are an uncomfortable accident
    for chemistry. The Palomar copy story cannot touch Hamburg, and Busko's
    reported coma pattern is in principle a photon fingerprint chemistry should
    not know. If the working-catalog Earth-shadow deficit were reproduced in
    independently extracted populations, geometry would begin to favor
    sunlight-reflecting objects at geosynchronous-like altitude.
    Machine-learning scoring that leaves both ensemble effects standing among
    candidates judged likelier-real is a genuine internal-robustness result,
    even though the labels are expert judgments rather than physical ground
    truth.

    Steelman the mundane reading. Two decades of archival gamma-ray-burst
    searches produced a bestiary of star-like impostors and no confidently
    confirmed plate transient. Sharpness is already where SuperCOSMOS puts
    spurious detections. The 1950 and 1952 events are not even morphologically
    the same. Spatial statistics of the working catalog — edge concentration,
    geometric clusters — look like plate and scan artifacts, and Watters et al.
    show the uniform-background null that generates the shadow deficit is false.
    Both headline correlations reproduce when the VASCO rows are re-analysed and
    fail when the catalog is rebuilt or the observing schedule is modelled.
    Radioactive fallout predicts the nuclear window as well as glints do.
    Hamburg still lacks a false-positive rate against matched controls; the coma
    discriminant is a single unblinded preprint whose author declines to claim
    origin.

    The ladder breaks at TRN-C020. Every exotic reading is conditional on marks
    having been made by light during the original exposures. Until blinded
    inspection of the original telescope negatives records the generation at
    which each canonical mark first appears, and until a preregistered shadow
    test is run on catalogs nobody's thumb has touched, the headline claim is a
    research agenda rather than a result. Artificiality is a further inference
    with no independent evidence stream; extraterrestrial origin is not
    presently testable at all.
