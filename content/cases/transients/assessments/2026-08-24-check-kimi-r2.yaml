  synthesis: >-
    The case separates cleanly into three layers, and the 2026-08-24 microscopy
    manuscript re-sorted all three. The floor is settled: the canonical marks
    exist on physical plate material, confirmed by the critics themselves
    (E002), recovered by an independent pipeline (E008), and now reported on the
    original 1950 telescope negative (E022). The middle layer — the copy-defect
    mechanism (C007) — remains true as a genealogy but has been stripped of its
    sharpest use: for the two flagship events, "it's in two cousins" is answered
    with the grandparent, pending peer review of what is still an unpublished,
    unblinded, author-group registration. What remains is the crux, C020, and
    the manuscript is its own strongest evidence that the crux is stuck:
    microscopy cannot separate a sub-second flash from an intrinsic emulsion
    flaw, and the examining microscopist — directed by the copy-defect
    argument's own author — leaned defect, citing the plate-corner location.

    Steelman for light: the marks are on the original glass; nine appeared
    simultaneously within ten arcminutes and a bright triple vanished within
    fifty minutes; sub-second flashes are physically expected to look exactly
    this sharp (E006); a fully independent plate lineage shows analogous
    candidates reportedly carrying the coma signature of light through real
    optics (E014); and no second-site plate exists, so the absence of parallax
    is not evidence against. Steelman for chemistry: two decades of GRB-era
    archival searches produced star-like defects routinely and zero confirmed
    flashes; the marks sit in the classifier's artifact neighborhood (E004) and
    in a defect-prone corner; every ensemble correlation replicates only inside
    the contested working catalog and dissolves under independent extraction
    (E009) or proper nulls (E011); and the candidate population swings 500-fold
    with extraction choices (E008), marking it a construction product until
    TRN-R004 says otherwise.

    The verdict is unresolved, and narrowly so: the case is one blind validation
    (TRN-R003) and one flash-calibration experiment (TRN-R002) from moving in
    either direction. The artificial-origin headline (C022) stands two rungs
    above the stuck crux; the extraterrestrial reading (C023) is presently
    untestable by anything on the table. Consensus and prestige count for
    nothing here; the live instruments are measurement, not opinion.
