      uniform, which any single mechanism must eventually explain. Well
      supported on the digitized record, held at moderate confidence by the
      single-team, single-lineage character of the evidence."
  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: "Hayes 2026 documents the recovery rates — eight of nine from 1950,
      three of three from 1952, 63.9% of the published 5,399-candidate catalog —
      with benchmark control fields and synthetic-injection tests, which cleanly
      kills the \"one team's software bug\" hypothesis. The claim as stated is
      about reproducible detection in shared imagery, and that is demonstrated.
      The strongest opposing consideration is scope: the independent pipeline
      reads the same digitized descendants of the same photographic copies, so
      it cannot speak to physical origin, and the 500-fold spread between his
      2.85-million-candidate sweep and the vetted 5,399 shows how completely the
      \"population\" depends on extraction choices. That undermines ensemble
      claims built on the catalog, not the recovery result itself."
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: "The deficit is real arithmetic against a discredited expectation.
      Independent statistics on the author-supplied catalog reproduce it
      (Doherty: 0.46% observed against ~1.4% geometric expectation, holding in a
      center-of-plate subset), and ML artifact-scoring reportedly leaves it
      significant and largest among the likeliest-real candidates. But Watters
      et al. show the uniform-random background that defines the 1.4%
      expectation is false for these data — the features are spatially
      heterogeneous, edge-concentrated, with geometric clusters — and find no
      significant deficit under a derived null or in heavily vetted subsets; the
      proponents' rebuttal argues statistical power rather than offering a
      counter-demonstration. The strongest opposing consideration to the
      skeptical reading is that removing visually recognizable artifact classes
      strengthens the signal, which a pure artifact population would not
      obviously do. Reproducible conditional on the working catalog,
      unestablished beyond it: mixed is the substantive grade."
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: "The correlation splits cleanly by replication type. Independent
      statistics on the original rows reproduce it (Doherty: RR 1.45, p = .011;
      permutation p = .006), it persists after ML artifact-scoring and Kp
      control, and it survives — attenuated to p = .037 — a Bayesian reanalysis
      with temporal autocorrelation. But the one fully independent extraction
      with nightly sky coverage modeled finds nothing (Hayes: IRR 1.03, p =
      .71), and Watters et al. trace the signal to the Palomar observing
      schedule. The strongest opposing consideration to the artifact reading is
      that Hayes's independent catalog averages ~7,250 mostly-noise candidates
      per night, which could dilute a weak real effect below detectability, and
      that the Cann negative-control work closes some confounders. Note also
      that even a real correlation is direction-ambiguous — fallout on plates
      predicts it as well as glinting objects. A signal that replicates within
      one lineage and fails across it is most plausibly a property of the
      sample: mixed, leaning fragile."
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: A single independent researcher searching rapid same-night plate
