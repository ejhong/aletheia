  - claimId: TRN-C021
    verdict: unresolved
    confidence: moderate
    reasoning: "The only direct geometric support is the Earth-shadow deficit, which
      is mixed at best (see TRN-C005): reproducible on the working catalog
      against a naive expectation, absent under a defensible null and in vetted
      subsets. The strongest opposing consideration to a skeptical dismissal is
      the simultaneity argument: nine points within ten arcminutes in half an
      hour, and a triple within ten arcseconds, strain most distant-source
      astrophysics — if the flashes were real. But that premise is TRN-C020,
      which is unresolved, and Watters et al. document geometric clusters and
      edge concentration among the features themselves, so clustered marks are
      also what plate and scan artifact populations produce. This rung is
      hostage to TRN-C020 and to a shadow analysis nobody has run on an
      independently built catalog; unresolved is the warranted grade."
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "This is the crux, and the evidence genuinely splits. Against
      incident light: all nine canonical marks fall in the classifier's artifact
      morphological neighborhood, both digitizations descend from a shared copy
      stage where one defect could enter every modern dataset, and the GRB-era
      archival searches supply a sobering prior on star-like plate marks (a
      background-rate calibration, noted as prior rather than record evidence).
      For incident light: sub-second flash physics predicts exactly the observed
      sharpness, the skeptical classifier is arguably trained to label any real
      transient as artifact by construction, the copy-defect mechanism has a
      demonstrated pathway but an unmeasured occurrence rate, and the Hamburg
      coma report is a real physical discriminant that chemistry should not
      trivially mimic — though it is a single unblinded preprint. The strongest
      opposing consideration to \"real light\" is the morphology-plus-genealogy
      combination; the strongest opposing consideration to \"artifact\" is that
      the mundane mechanism's base rate has never been measured and the coma
      line is untouched by it. With the decisive blind examination of the
      original negatives never performed under a public protocol, unresolved is
      the honest verdict."
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: "Hambly and Blair reconstructed the contact-printing genealogy —
      original negative to intermediate glass positive to second-generation copy
      negatives, with DSS and SuperCOSMOS scanning independent copies of the
      same positive — from the archival record and direct institutional
      knowledge of the SuperCOSMOS program, and the proponents do not dispute
      it. The claim is mechanistic and narrow, and as such it is well supported:
      it correctly reframes \"found in two digitizations\" as inheritance from a
      common ancestor. The strongest opposing consideration is that it
      establishes possibility, not occurrence: no census of star-like copy-stage
      defects exists (TRN-R007), and the mechanism says nothing about candidates
      on independent plate lineages such as Hamburg's. That limits its reach,
      not its truth."
  - claimId: TRN-C001
    verdict: well_supported
    confidence: high
    reasoning: "This is the case's secure floor by adversarial convergence: reported
      by the proponents, physically confirmed on the Edinburgh glass copy by the
      principal critics, and recovered eight-of-nine by an independent pipeline.
      The claim is carefully scoped to surviving copy material, which is exactly
      what was inspected. The strongest opposing consideration is not to
      existence but to uniqueness and absence: Hambly and Blair found similar
      one-plate-only marks on the neighboring field E0086, suggesting a general
      plate property, and deep GTC imaging turned up possible counterparts
      attributable to chance projection, mildly softening \"absent from deeper
      modern surveys.\" Those caveats bear on interpretation, not on the
      presence of the marks, so the claim stands well supported — just short of
      \"established\" because the absence clauses carry residual wrinkle and the
      original negative has never been examined."
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: "The measurement is common ground: SuperCOSMOS profile statistics put
      all nine marks in the sharp tail (roughly η between −3 and −1), consistent
      with microscopic inspection, and the proponents embrace rather than
      contest the numbers — the camps fight over the interpretation, not the
      data. As a measurement claim it is well supported. The strongest opposing
      consideration is that it rests on one team's profile statistics measured
      on the digitized copy lineage, never re-measured on original material, and
      its diagnostic value is nil until the flash-profile calibration (TRN-R002)
      exists — sharpness currently cannot separate flash from artifact. That
      limits what the claim implies, not whether it is true as stated."
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: "The triple is peer-reviewed with deep modern follow-up (GTC to
      magnitude 25.5 in 2023), and Hayes's independent pipeline recovers all
      three sources, so the core observation — three ~16th-magnitude points,
      gone within the hour, nothing there now — is solidly documented on the
      digitized material. The strongest opposing consideration is provenance and
      uniformity: everything passes through the same Palomar copy lineage as the
      1950 event, no physical inspection of the 1952 plate material has been
      published, the characterization comes entirely from the proponent team,
      and the isolated source's star-like profile sits awkwardly beside the
