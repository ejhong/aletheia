  synthesis: "This case stratifies cleanly, and the stratification is the finding.
    The bottom rungs — the marks exist on physical plate material (TRN-C001,
    TRN-C003) and independent software recovers them (TRN-C004) — are the most
    secure items in the record precisely because the case's fiercest critics
    established them. But a physical mark is compatible with every hypothesis on
    the table, so that security buys the proponents nothing by itself. The
    skeptical superstructure is strong and mostly mechanism-grade: the copy
    genealogy (TRN-C007) is well supported and cleanly dissolves the \"two
    independent digitizations\" argument; the canonical nine sit morphologically
    with artifacts; and both ensemble correlations (TRN-C005, TRN-C006) exhibit
    the case's tell — they replicate under independent statistics on the
    authors' own rows and dissolve when the catalog is independently rebuilt
    with coverage modeled (Hayes) or the null distribution is corrected
    (Watters). A correlation that survives re-analysis but not re-construction
    is most plausibly a property of the sample. Steelmanned further, the skeptic
    inherits the GRB era's base rate: two decades of archival transient hunting
    produced a bestiary of star-like defects and not one confirmed event. The
    proponent position, steelmanned, is not nothing. The sharpness that convicts
    the marks as artifacts is also what sub-second flash physics predicts, and
    the calibration experiment that would arbitrate has never been run; the
    skeptical classifier is arguably circular, since its \"spurious\" training
    class is defined by absence of a modern counterpart — the very definition of
    a transient; the mundane keystone is a demonstrated pathway with an
    unmeasured base rate, no one having counted how often copying mints
    star-like fakes; and the Hamburg line (TRN-C010, TRN-C011) sits outside the
    Palomar genealogy entirely, where the copy mechanism cannot reach, with a
    reported coma signature chemistry should not mimic. Every one of those
    positive items is preliminary in the same way: single-author, unblinded,
    uncalibrated. Two structural facts arbitrate. First, the decisive
    observation — blind examination of the original telescope negatives,
    recording at which copy generation each mark first appears — has never been
    made under any public protocol; the proponent group's reported examination
    exists only as an unseen manuscript in preparation, and every published
    argument on both sides concerns copies of copies. Second, even under the
    strongest proponent reading the ladder tops out at \"real flashes, plausibly
    near-Earth\": artificiality (TRN-C022) needs geometry and repeatability no
    record supplies, and extraterrestrial origin (TRN-C023) has no
    discriminating test on the table at all. The verdict is unresolved as a
    substantive finding, not a default: the record contains genuine replications
    and genuine failures to replicate pointing in opposite directions, with the
    highest-information tests identified and unrun."
claimAssessments:
  - claimId: TRN-C022
