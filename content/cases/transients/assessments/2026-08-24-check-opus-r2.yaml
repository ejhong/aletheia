      calibration it will mean something.'
  - claimId: TRN-C011
    verdict: weakly_supported
    confidence: low
    reasoning: The physical logic is genuinely strong — an off-axis coma pattern is
      something incident light stamps and surface chemistry has no reason to
      know about — and this is the only proposed test that could establish
      TRN-C020 without touching the Palomar originals. But the evidence is a
      single-author preprint on a telescope selected for strong coma, with no
      blind validation against known defects and deliberately produced short
      flashes, no demonstration that defect classes never mimic directional
      asymmetry, and no protection recorded against the analyst knowing which
      images were candidates; the author himself states the data do not
      establish the light's physical origin (TRN-E014). The strongest opposing
      consideration is that classifier-style results in exactly this
      configuration — chosen instrument, unblinded labels, no confusion matrix —
      have a poor track record, so the claim should be treated as a promising
      hypothesis awaiting TRN-R003, not as a result.
