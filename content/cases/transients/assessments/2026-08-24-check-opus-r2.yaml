      is TRN-E024's own admission that microscopy cannot separate flash from
      intrinsic emulsion defect at the single-source level, which means the
      observation everyone waited for returned a null on the actual question."
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: "As stated, this is a claim about photographic genealogy and
      possibility, not occurrence, and it is documented by an author of the
      SuperCOSMOS program reconstructing the atlas copying procedure (TRN-E005)
      and is not disputed by the proponents. It correctly dissolves the \"two
      independent digitizations\" argument. Two limits, neither contradicting
      the claim as written: no one has measured the star-like defect rate at any
      copy generation (TRN-R007), and TRN-E023 reports that for the two
      canonical events the marks appear above the shared stage, so the
      mechanism's reach — though not its truth — is now confined to the
      uninspected catalog bulk. The strongest opposing consideration is that the
      genealogy rests on one paper by one institutionally invested group and has
      not been separately audited."
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: "This is the rare claim in a contested case confirmed by the opposing
      camp: Hambly and Blair put the Edinburgh glass under a microscope and
      found the nine at the reported positions (TRN-E002), an independent
      pipeline recovers eight of nine (TRN-E008), and microscopy of the original
      Caltech negative reports all nine at their published coordinates
      (TRN-E022). Absence from the six-days-later overlapping plate and from
      deeper modern surveys is reported consistently across proponent and
