      significance: the same inspection found comparable one-plate-only marks on
      the neighbouring field E0086, which is what a defect population would also
      produce — but that bears on TRN-C020, not on this claim as stated."
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: The measurement is quantitative (SuperCOSMOS profile statistics, all
      nine in the sharp tail, joint probability of order 0.1^9 under the stellar
      distribution; TRN-E003), consistent with the same team's microscope
      inspection, corroborated qualitatively by independent microscopy of the
      original glass describing the features as point-like and marginally
      sharper than stars with sharp edges (TRN-E022), and explicitly accepted by
      the proponents who dispute only its interpretation. It is held below
      "established" because it comes from a single measurement team on a single
      digitization lineage and no independent re-derivation of the profile
      statistics has been published. The strongest opposing consideration is
      that "sharper than stellar" is the SuperCOSMOS classifier's known artifact
      neighbourhood, which makes the measurement's direction, though not its
      validity, contestable.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: Peer-reviewed with 10.4-m follow-up to magnitude 25.5 (TRN-E007),
