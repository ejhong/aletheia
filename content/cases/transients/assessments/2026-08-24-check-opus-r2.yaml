  - claimId: TRN-C020
    verdict: unresolved
    confidence: high
    reasoning: "The evidence is close to symmetrically balanced and the file
      documents why. Against: the marks group morphologically with unmatched
      detections (TRN-E004), sit in a plate corner where defects congregate, and
      the GRB-era archival record is a long list of star-like impostors; an
      experienced microscopist looking at the original glass called emulsion
      defects a reasonable attribution (TRN-E024). For: sharpness is exactly
      what a sub-second flash should produce (TRN-E006), the digitization and
      copy-stage pathways are now excluded for the flagship events (TRN-E022),
      and a coma signature has been reported outside the Palomar lineage
