      reconcile.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: moderate
    reasoning: "Hayes documents 8/9, 3/3, and 3,450 of 5,399 (63.9%) at median 0.94
      arcsec separation, with control-field false-positive rates and synthetic
      injection tests (TRN-E008) — this cleanly retires the \"one team's
