  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: "The arithmetic reproduces under independently written code on the
      author-supplied catalog (0.46% umbral against ~1.4% geometric expectation;
      TRN-E010) and survives ML artifact-scoring, strengthening among
      higher-probability candidates (TRN-E015). But the word \"deficit\" is
      defined by the expectation, and TRN-E011 shows the uniform-random
