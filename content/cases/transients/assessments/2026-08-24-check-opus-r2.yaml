  synthesis: "The case is built as a ladder and the ladder holds: the lower rungs
    are secure and nearly non-diagnostic, and the diagnostic rungs are open.
    That the nine April 1950 marks and the July 1952 triple exist as physical
    features of plate material is as close to settled as archival astronomy gets
    — asserted by proponents, confirmed on glass by the case's principal
    critics, recovered by a from-scratch pipeline that never touched the
    proponents' code, and now reported present on the original Caltech negative.
    Nothing about that discriminates between chemistry and sky. The crux is
    TRN-C020, and the honest reading of the new microscopy is that it has
    narrowed rather than resolved it. Two of the three manufacture pathways —
    digitization and the shared intermediate positive — are removed for the two
    flagship events, which strips TRN-C007 of its reach exactly where it was
    sharpest, while leaving it fully in force over the ~100,000 uninspected
    rows. What replaces it is a pathway the skeptics always had in reserve and
    never needed until now: an intrinsic emulsion defect on the original. The
    manuscript concedes that single-source morphology cannot separate that from
    a sub-second flash, and its own microscopist, directed to the objects by the
    copy-defect argument's author, leaned defect. Steelmanning the proponents:
    sharpness genuinely is expected of a sub-second flash on a fifty-minute
    exposure, the artifact classifier's \"spurious\" training class is defined
    by the very property that defines transient candidates, the phenomenon now
    appears in an archive with no shared photographic ancestry, and a physical
    incident-light discriminant (coma) has been proposed. Steelmanning the
    skeptics: two decades of GRB-era plate searches produced a bestiary of
    star-like impostors and not one confirmed transient; the ensemble
    correlations replicate within the working catalog and dissolve whenever the
    extraction step is independently varied or the null distribution is computed
    properly; and much of the supporting corpus is single-author unreviewed
    preprints from an increasingly correlated author network, which inflates
    apparent replication count without adding independent information. My
    judgment that TRN-C022 carries a heavy prior cost — no plausible 1950s human
    capability places reflective objects at geosynchronous altitude — rests on
    background, not on any evidence record here, and is stated as such. The
    case's remaining discriminating power lies where the agenda now puts it:
    blind validation of the coma signature, ensemble statistics on catalogs
    rebuilt from raw scans, a copy-stage defect base rate, and prospective
    two-station imaging."
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: moderate
    reasoning: 'No evidence record bears on this claim except through TRN-C020 and
      TRN-C021, both of which are open, and the geometric argument that would
      carry it (the shadow deficit) is contested at the level of dataset
      definition. TRN-E020 sharpens the problem from the proponent side: a
      natural near-Earth population would satisfy TRN-C021 while removing any
      reason to say "artificial," so even a successful near-Earth result would
      not deliver this rung. The strongest opposing consideration is a prior
      rather than a record — placing reflective objects at geosynchronous-like
      altitudes before 1957 has no known human pathway, so the claim demands
      evidence far stronger than single-exposure marks on aging emulsion. I
      record it as unresolved rather than contradicted because nothing in the
      file positively excludes it.'
  - claimId: TRN-C023
