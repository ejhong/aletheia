  synthesis: "The case is unusually well-structured, and the structure is what
    decides it. The lowest rungs are as secure as archival evidence gets: the
    nine 1950 marks were physically confirmed on glass by the case's principal
    critics (TRN-E002), their sharpness was measured and is accepted by both
    camps (TRN-E003), and an independently written pipeline recovers 8/9, 3/3,
    and roughly two-thirds of the published catalog (TRN-E008). But every one of
    those results is compatible with both hypotheses in the dispute — they
    establish that marks exist and that software is not hallucinating them, not
    that photons made them. Diagnostic weight sits entirely on TRN-C020, and
    TRN-C020 rests on an observation nobody in the record has made under
    conditions anyone can audit: high-resolution, blinded inspection of the
    original telescope negatives with the copying generation of first appearance
    recorded. Hambly and Blair supplied a concrete pathway by which a single
    flaw on a shared intermediate positive prints into both modern digitizations
    (TRN-E005), which demolishes the strongest cheap argument for reality; they
    did not supply a rate, which leaves the mundane account owing a number it
    has never paid. The ensemble layer behaves diagnostically. Both headline
    correlations replicate when independent code is run on the proponents' rows
    (TRN-E010) and persist under ML artifact-scoring inside the same rows
    (TRN-E015), yet the shadow deficit loses significance once the demonstrably
    non-uniform background is modeled and once vetting tightens (TRN-E011), and
    the nuclear window vanishes in the one catalog rebuilt from scratch with
    nightly coverage as exposure (TRN-E009). Effects that survive re-analysis
    but not re-extraction are, on prior experience with survey catalogs, more
    often properties of the sample than of the sky — though that is a prior, not
    a demonstration, and Hayes's own catalog was built with loose parameters
    that could dilute a weak real signal. Note also that the nominal replication
    count overstates independence: Doherty later joined the proponent group,
    Bruehl and Villarroel author across the ML and original papers, and Cann
    analyzes the same 107,875 rows. Cann's sensitivity-invariance result
    (TRN-E017) is the right kind of work — it closes a specific confounder — but
    closing one route to spuriousness is not evidence of reality. Steelmanning
    the proponents: sharpness genuinely cuts both ways and no calibration curve
    exists; the 1952 triple has peer review and deep follow-up; and the Hamburg
    line lies wholly outside the Palomar copy genealogy, where the coma
    discriminant, if it survives blinding, would be a physical incident-light
    detector rather than another statistic. Steelmanning the skeptics: two
    decades of GRB-era archival searches produced a defect bestiary and zero
    confirmed transients; the candidate population is edge-concentrated like
    scan artifacts; and even a surviving nuclear correlation is predicted
    equally well by fallout on emulsion. On the evidence records supplied, the
    featured hypothesis is neither established nor refuted — but \"unresolved\"
    here should not be read as an even split. The burden sits on an untaken
    measurement, and the mundane account currently explains more of the record
    with fewer new entities."
