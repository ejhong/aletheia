      right idea — plate chemistry has no knowledge of the optical axis — which
      is why this is the highest-value open line in the case. But the
      discriminant has not been blind validated against known defects and
      deliberately produced short flashes, the analyst was not shielded from
      knowing which images were candidates, and no confusion matrix exists;
