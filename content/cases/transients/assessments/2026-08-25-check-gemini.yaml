  synthesis: >-
    The hypothesis that pre-Sputnik photographic plates record real optical
    flashes from near-Earth objects rests on two evidentiary pillars: the
    canonical multi-transient events of 1950 and 1952, and the ensemble
    statistics of a ~107,000-object working catalog. On the first pillar, the
    physical reality of the marks on the emulsion is now firmly established.
    Recent unpublished microscopy locates the 1950 marks on the original
    telescope negative, decisively bypassing the strongest mundane explanation—a
    shared copy-stage defect—for those specific events. However, this same
    microscopy confirms that the morphological distinction between a sub-second
    flash and an intrinsic emulsion defect is currently irresolvable at the
    single-source level. An independent microscopist consulting on the
    examination concluded that emulsion defects remain a reasonable attribution.
    The crux thus remains fully open: the marks exist, and they were not born in
    digitization or copying, but whether they were made by photons or chemistry
    is unsettled.

    On the second pillar, the ensemble statistics (Earth-shadow deficit, nuclear
    test timing) are highly sensitive to catalog construction. Replications run
    on the authors' original candidate rows consistently reproduce the claimed
    signals, but independent source extraction and spatial modeling dissolve
    them entirely, suggesting the correlations may be properties of an
    unvalidated dataset and the observatory's schedule rather than the sky. 

    Steelman for the proponents: The canonical marks are real, reside on the
    original glass, and exhibit the sharp morphology expected of genuine
    sub-second flashes. New independent evidence outside the Palomar lineage
    shows similar transients and, crucially, reports coma aberrations—an optical
    signature of incident light that plate chemistry cannot naturally mimic. 

    Steelman for the critics: Archival astronomy is replete with star-like
    emulsion artifacts. The canonical marks' sharp profiles map perfectly to
    known spurious defects, and the population-level claims evaporate when
    subjected to independent extraction and basic controls for spatial
    clustering. 

    With the central crux unresolved and the ensemble evidence heavily disputed,
    the headline claim of pre-Sputnik artificial objects is entirely
    unsupported, and its extraterrestrial extension is presently untestable. The
    case now hinges on upcoming blind validations of the coma discriminant and
    prospective multi-station simultaneous imaging.
