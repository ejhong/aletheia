  synthesis: "The observational floor of this case is solid and should not be
    relitigated. Multiple independent routes — the discovery papers, Hambly and
    Blair’s microscope inspection of the Edinburgh glass, Hayes’s from-scratch
    pipeline, and the unpublished Yang and Villarroel registration of the April
    1950 original negative — establish that the canonical marks are physical
    features of plate material, not scanner glitches or one team’s software. The
    July 1952 triple is likewise recovered independently and has deep modern
    non-detections. The nine 1950 images are systematically sharper than stars
    of equal brightness; that measurement is common ground. The Palomar copy
    genealogy is also common ground: DSS and SuperCOSMOS really do share an
    intermediate positive, so “present in two digitizations” is not independent
    confirmation. Those results (C001–C004, C007) are the load-bearing facts.
    They do not decide the featured hypothesis. That hypothesis requires a
    further step still not taken: that at least some marks were made by light
    that entered the telescope during the original exposure (C020), then that
    the light came from near-Earth reflectors (C021), then that those reflectors
    were artificial (C022). Each step is a different claim. Evidence for a lower
    rung must not be allowed to climb. Steelman the conventional account.
    Photographic emulsions manufacture star-like dots; two decades of GRB
    archival searches never confidently confirmed one optical transient.
    Hambly’s classifier places all nine 1950 marks in the morphological
    neighborhood of spurious detections. The 1950 field sits in a plate corner,
    where defects congregate. The microscopist who looked at the Caltech
    original — directed there by Hambly — judged emulsion defects a reasonable
    attribution, and the manuscript itself states that single-source microscopy
    cannot separate a brief flash from an intrinsic emulsion flaw. The
    Earth-shadow deficit and nuclear-window correlation reproduce only inside
    the VASCO working catalog; they lose significance when Watters models the
    real spatial background or when Hayes rebuilds the catalog and the nightly
    exposure. A correlation that is a property of one team’s rows is not a
    property of the sky. Fallout contamination predicts the nuclear timing as
    well as glints do. The Hamburg and coma results are single-author preprints
    without published false-positive rates or blind validation. That is a
    coherent, empirically grounded account, and it currently explains more of
    the contested catalog than the exotic reading does. Steelman the
    light-and-glint account. A sub-second flash on a fifty-minute exposure is
    supposed to look un-star-like: sharp, round, unsmeared. Judging such marks
    against a stellar training set will label real flashes as artifacts by
    construction. Presence on the original 1950 glass, if the unpublished
    registration holds, retires the copy-defect story for the flagship event;
    the 1952 triple is likewise not confined to cousin copies. Nine simultaneous
    points, and a bright triple that faded more than ten magnitudes in an hour,
    are awkward as independent emulsion accidents. Candidates of the same
    morphological type appear on Hamburg plates that share no Palomar ancestor,
    and a subset is reported to carry the telescope’s off-axis coma — a
    signature chemistry should not know how to draw. Independent statisticians
    reproduce the shadow deficit and nuclear timing on the working catalog, and
    both effects strengthen among candidates a classifier scores as more likely
    real. If those patterns survived a preregistered analysis on independently
    extracted catalogs, they would be the geometric fingerprint of a sunlit
    near-Earth population. Neither steelman wins on present evidence. The Yang
    microscopy, which this case waited seventy-five years for, answered
    “original or copy?” and could not answer “flash or flaw.” That is why C020
    remains unresolved rather than mixed: the discriminating observation has not
    been completed, not that two completed observations disagree. C021 inherits
    that gap and adds a second, catalog-definition fight over the shadow
    geometry. C022 has no evidence stream of its own. C023 is not in an
    evidential contest at all. The case therefore stays unresolved at the level
    it was built to test. What would move it is specified in the agenda: a
    blinded repeat of the original-negative registration, a flash-versus-defect
    calibration on period emulsion, blind validation of the coma discriminant,
    and shadow or timing analyses run on catalogs nobody’s thumb has touched."
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: moderate
    reasoning: Nothing in the record places manufactured objects near Earth before
      October 1957. Every path to this headline claim runs through TRN-C020 and
      TRN-C021, both themselves unresolved, and the ensemble patterns offered as
      geometric support (shadow deficit, nuclear timing, alignments) remain
      catalog-bound and contested. Even a demonstrated near-Earth reflector
      would still leave open Cann’s natural dusty-plasma reading, so
      artificiality is a further inference with no independent evidence stream.
      The strongest opposing consideration is simply that the physical basis —
      incident light from a sunlit orbital population — has not been
      established; until it is, this claim is not weakly supported but
      unevidenced.
  - claimId: TRN-C023
    verdict: presently_untestable
    confidence: high
    reasoning: No observation now on the table can bear on extraterrestrial origin.
      The claim sits above TRN-C022, which is itself unresolved, and even a
      proven pre-Sputnik artificial object would still require a separate
      historical and engineering argument ruling out secret human programs,
      unknown natural reflectors, and measurement error. Unresolved would imply
      an open evidential contest; nothing here is contesting, because nothing
      can yet reach the question. The strongest opposing consideration is the
      entire GRB-era archival-transient literature, which repeatedly dissolved
      star-like plate marks into emulsion defects — but that consideration still
      addresses lower rungs, not this one.
  - claimId: TRN-C021
    verdict: unresolved
    confidence: moderate
    reasoning: "A near-Earth reflective origin is the one reading that would make an
      Earth-shadow deficit and simultaneous multi-point flashes geometrically
      natural, but the deficit (TRN-C005) replicates only inside the VASCO
      working catalog and is disputed once spatial non-uniformity is modeled,
      and the multi-point events only constrain distant astrophysics if the
      marks are real light (TRN-C020), which is the open crux. Cann’s post-storm
      dusty-plasma paper, if it held, would actually support this rung while
      undercutting artificiality, yet it inherits the same unvalidated catalog
      and is a single-author preprint. The strongest opposing consideration is
      Watters et al.: after discarding the false uniform-background assumption,
      they find no significant shadow deficit in more heavily vetted subsets, so
      the geometric case currently rests on the least-vetted data."
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: This is the gate the rest of the ladder depends on, and it has not
      been walked through. Presence of the 1950 nine on the original Caltech
      glass (TRN-E022) would retire scanner and copy-stage origins for that
      event if the unpublished registration holds, and Hamburg candidates plus a
      reported coma signature (TRN-E013, TRN-E014) sit outside the Palomar copy
      lineage entirely; but the same microscopy manuscript states that a brief
      flash and an emulsion defect produce the same sharp little dot, and its
      own microscopist — sent to the objects by Hambly — leaned defect. Hambly’s
      morphology classifier groups the nine with artifacts, the GRB-era searches
      never confirmed an archival optical transient, and the coma discriminant
      has not been blind-validated. The strongest opposing consideration is that
      every positive indicator is either direction-ambiguous (sharpness) or
      preliminary (Hamburg/coma), while the one test this case waited
      seventy-five years for explicitly cannot finish the job.
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: "Hambly and Blair reconstruct the atlas-copying procedure from the
      archival record and SuperCOSMOS institutional knowledge: an intermediate
      glass positive was contact-printed from each original, and both DSS and
      SuperCOSMOS scan second-generation copy negatives descended from that
      shared positive. The genealogy itself is not disputed by the proponents,
      and it cleanly defeats the cheap argument that agreement of two modern
      datasets proves a sky event. The strongest opposing consideration is that
      a shared-ancestor pathway proves possibility, not occurrence — no
      star-like copy-stage defect rate has been measured — and the unpublished
      Yang registration, if it holds, removes this mechanism’s reach over the
      two flagship events without touching the ~100,000 uninspected catalog
      candidates. Assessed as stated, the mechanism claim stands."
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: "The nine marks exist on surviving glass at the reported positions,
      are absent from the overlapping plate exposed six days later, and have no
      counterparts in deeper modern surveys. Villarroel et al. 2021 reported
      them; Hambly and Blair physically confirmed them on the Edinburgh copy
      under a microscope; Hayes’s independent pipeline recovers eight of the
      nine. Skeptics and proponents agree on this floor and disagree only about
      what made the marks. The strongest opposing consideration is not to
      existence but to uniqueness: Hambly also found similar one-plate-only
      detections on neighboring field E0086, which fits a defect population at
      least as well as a sky population, but that does not unmake the nine marks
      on E0070."
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: "SuperCOSMOS profile statistics place all nine 1950 candidates on the
      sharp side of the stellar distribution (roughly −3 ≲ η < −1), with a joint
      draw from the stellar profile population of order 0.1⁹; microscope
      inspection agrees they are more concentrated and circular than stars of
      similar brightness. Proponents do not dispute the measurement; they
      dispute only its meaning, arguing that a sub-second flash on a
      fifty-minute exposure should look exactly this sharp. The strongest
      opposing consideration is interpretive, not observational: in the
      SuperCOSMOS classification vocabulary, “sharper than stellar” is the known
      neighborhood of spurious detections, and no one has yet exposed
      period-appropriate emulsion to controlled flashes to draw the calibration
      curve that would split flash from artifact."
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: "Solano et al. 2024 report three ~16 mag point sources within 10
      arcsec on the 19 July 1952 exposure, gone on the consecutive exposure
      about fifty minutes later and absent through 2023 GTC imaging to magnitude
      25.5; Hayes independently recovers all three. That is a second
      multi-source, rapidly vanishing event on the same plate family, with
      modern follow-up. The strongest opposing consideration is that almost
      everything known still passes through the digitized Palomar copy lineage
      and the proponent team: no published inspection of the original 1952
      negative exists, the Yang examination was of a Harvard copy plus the
      survey digitization, and the isolated source’s star-like profile already
      shows the two “canonical” events are not morphologically uniform."
  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: Hayes 2026, built from scratch with sigma-clipped detection, PSF
      filtering, and cross-epoch rejection, recovers eight of nine April 1950
      sources and three of three July 1952 sources, and matches 3,450 of
      Solano’s 5,399 published candidates (63.9%) at a median 0.94 arcsec. That
      kills the “one team’s private code” objection. The strongest opposing
      consideration is that reproducible detection in shared source imagery is
      exactly what a defect population would also produce, and Hayes’s
      full-footprint sweep generated 2.85 million candidates against Solano’s
      5,399 — a 500-fold swing that shows how little the population’s headline
      size means and how completely every later ensemble statistic inherits its
      extraction cuts.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: "On the author-supplied ~107,875-object catalog the deficit is real
      and reproducible: Doherty independently codes 0.46% of sources in the
      umbral cone against a ~1.4% geometric expectation, and Bruehl et al. find
      the deficit persisting and even largest among ML-scored “likelier-real”
      candidates. Watters et al. show the uniform-random background assumption
      is false — features are edge-concentrated and spatially heterogeneous —
      and find no significant deficit in more heavily vetted subsets; the
      proponents’ reply is about power, not a counter-demonstration on a cleaned
      catalog. The strongest opposing consideration is therefore dataset
      definition: the signal is a property of the working catalog under a false
      null, not a demonstrated property of the sky, and no independently
      extracted catalog has yet reproduced it."
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: "Independent statistics on the original rows reproduce the
      association (Doherty: RR 1.45, p = .011; permutation p = .006; it also
      survives ML artifact-scoring and a Kp control), so it is not a VASCO
      coding error. The one fully independent extraction, Hayes’s, is null once
      nightly sky coverage is modeled (IRR 1.03, p = .71), and Watters traces
      the original timing largely to Palomar’s observing schedule. Even if the
      correlation were real it is direction-ambiguous: radioactive fallout on
      emulsions predicts it as well as glinting objects do. The strongest
      opposing consideration is Hayes: a correlation that survives only inside
      one team’s working sample, and vanishes when the disputed
      source-extraction step is actually varied, is more likely a property of
      the sample than of the sky."
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: Busko’s search of rapid same-night pairs from the Hamburg 1.2-m
      Schmidt — different telescope, emulsion, archive, and digitization — finds
      appear-once candidates with systematically narrow FWHM, and because
      Hamburg shares no ancestor with Palomar the copy-defect mechanism
      (TRN-C007) cannot reach them. That is the first evidence the phenomenon
      exists outside one plate family. The strongest opposing consideration is
      that every plate archive has defects, the initial sample is 41 plates
      labeled preliminary by its own author, and no false-positive rate against
      matched control pairs or injection/recovery calibration has been
      published, so “the sky did this at both observatories” and “old emulsions
      fail similarly everywhere” remain indistinguishable.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: On Hamburg 0.6-m plates chosen for strong off-axis coma, Busko
      reports that candidate transient images carry the coma pattern expected of
      point sources recorded through the optics — a signature scratches and
      chemistry should not naturally reproduce — and the paper itself states the
      data do not establish the physical origin of the light. If the
      discriminant survived blind validation it would be the closest thing this
      case has to an incident-light detector and would move specific candidates
      onto TRN-C020 without the Palomar originals. The strongest opposing
      consideration is that nobody has shown defects never mimic directional
      asymmetry, the classifier has not been frozen against a labeled corpus of
      known flashes and known defects, and a single unblinded preprint cannot
      yet carry the weight the case is tempted to place on it.
