  synthesis: "The case is cleanly stratified, and the correct roll-up respects the
    ladder rather than the headline. The floor is established: the canonical
    marks exist on physical plate material (TRN-C001, TRN-C003), confirmed by
    the skeptics' own microscopy and an independent extraction pipeline
    (TRN-C004). The first mechanical challenge — the copy-genealogy argument
    (TRN-C007) — is itself well supported as a mechanism, but its sharpest
    application has now been blunted: the Yang & Villarroel microscopy
    manuscript (TRN-E022/E023) places all nine 1950 sources on the original
    telescope negative, which removes the shared-copy-stage pathway for the
    flagship events while leaving it fully in force for the ~107,875 uninspected
    catalog rows. That result narrows the crux without settling it, because the
    same manuscript concedes, against its own interest, that single-source
    microscopy cannot separate a sub-second flash from an intrinsic emulsion
    defect (TRN-E024), and its own microscopist — directed to the nine objects
    by the copy-defect argument's own author — leaned defect. So TRN-C020 —
    light through the telescope during the original exposure — remains genuinely
    open, and everything above it (near-Earth origin, artificial objects,
    extraterrestrial artifacts) is unresolved or presently untestable by
    construction. The ensemble evidence does not break the tie. The Earth-shadow
    deficit (TRN-C005) and nuclear-window correlation (TRN-C006) replicate on
    the author-supplied catalog (Doherty) and persist under ML artifact scoring
    (Bruehl et al.), yet dissolve under the only fully independent extraction
    with schedule modeling (Hayes) and under the Watters reanalysis of
    background assumptions; that split — reproducible within the lineage,
    failing across it — is exactly the signature of a catalog-bound property,
    though it does not prove the catalogs are artifact-dominated. The steelman
    for the sky side is now concrete: the marks are on the original glass, they
    are sharp in the way physics says short flashes should be, analogous
    candidates exist in a wholly independent plate lineage (TRN-C010), and the
    Hamburg coma signature (TRN-C011) is, on paper, a genuine physical
    discriminant between photons and chemistry. The steelman for the chemistry
    side is that every element of that chain is provisional: the microscopy
    manuscript is unpublished, unblinded, and unreviewed; the coma classifier
    has never been validated against a labeled corpus of known defects and known
    flashes; no copy-stage or emulsion defect base rate has ever been measured
    (TRN-R007); and the two-decade GRB archival search produced star-like
    impostors routinely and no confirmed transient. Weighing only the records
    here: the marks are real features of the original plates, but \"flash or
    flaw\" is undecided on the evidence, the geometric correlations are
    lineage-bound, and the headline attribution has no load-bearing support.
    Unresolved — with the discriminating power now visibly concentrated in
    TRN-R003 (blind coma validation), TRN-R005 (preregistered multi-catalog
    shadow analysis), and TRN-R002 (flash calibration), and with the historical
    events' single clean escape (simultaneous second-site parallax) permanently
    closed."
