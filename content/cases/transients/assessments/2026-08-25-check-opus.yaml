      flagship events but, by its own authors' account, cannot separate flash
      from original-emulsion defect — so the mundane space contracted without
      emptying, and the decisive calibration (TRN-R002) and blind coma
      validation (TRN-R003) remain undone."
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: "The genealogy is reconstructed from archival practice by an author
      who helped build SuperCOSMOS, is internally coherent with contact-printing
      workflow, and is not disputed by the proponents — who instead argue about
      its reach. As a mechanistic claim about what a shared intermediate
      positive permits, it stands. The strongest opposing consideration is scope
      rather than truth: TRN-E023 shows the mechanism cannot explain the two
      canonical events, since the 1950 nine are on the original negative and the
      1952 triple appears in the original survey digitization, and no census has
      ever measured how often the copying stage actually mints star-like defects
      (TRN-R007). The pathway is well established; its occurrence rate is
      unmeasured, and the claim as stated wisely asserts only the former."
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: 'This is the best-attested proposition in the case: reported by the
      proponents, physically confirmed on the Edinburgh glass by the principal
      critics, recovered by a from-scratch independent pipeline (8 of 9), and
      now located on the original Caltech negative. Adversarial confirmation on
      physical material is the strongest form of support available here, and no
      record contests it. Two minor qualifications keep it from being trivial:
      the independent pipeline recovers eight rather than nine, and the deep GTC
      imaging shows possible faint counterparts that the discovery paper itself
      says could be chance projections, so "absent from deeper modern surveys"
      is true at survey depth but not absolutely. The strongest opposing
      consideration is not to existence but to significance — Hambly & Blair
      found similar one-plate-only marks on the neighbouring field, which fits a
      defect population as comfortably as a sky population.'
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: "The measurement is quantitative (SuperCOSMOS profile statistics, all
      nine in the sharp tail, joint draw probability of order 0.1^9), was made
      by the skeptical side, is accepted by the proponents, and is corroborated
      qualitatively by the original- plate microscopy, which describes the
      features as point-like and marginally sharper than stellar images with
      sharp edges and no elongation. The claim as stated is about morphology,
      not about cause, and is not seriously contested. The strongest opposing
      consideration is calibration scope: the profile statistics come from the
      digitized copy lineage rather than the original negative, and the
      microscopy's \"marginally sharper\" is a weaker phrasing than
      \"systematically sharper and more concentrated,\" so the magnitude of the
      effect is better established than its exact form. Note also the internal
      tension the case is honest about — the 1952 isolated source profiles like
      a comparison star, so the canonical events are not morphologically
      uniform."
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: Peer-reviewed with modern 10.4-m follow-up reaching magnitude 25.5,
      and the three detections are independently recovered by the Hayes
      pipeline, which removes private-software error as an explanation for the
      digitization-level marks; the microscopy manuscript further places the
