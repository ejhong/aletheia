  - claimId: TRN-C004
    verdict: well_supported
    confidence: moderate
    reasoning: "Hayes documents recovery rates with benchmark controls, synthetic
      injections, and a quantified false-positive rate (~0.2 per 10-arcmin
      control field), and the 63.9% match to Solano's published catalog at 0.94
