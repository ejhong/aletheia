      analysis; without a measured rate against controls, the finding
      establishes that the search method returns candidates, not that a
      phenomenon crosses archives. If "analogous" is read as "the same
      phenomenon" rather than "the same appearance," support drops to weak.
  - claimId: TRN-C011
    verdict: weakly_supported
    confidence: low
    reasoning: This is potentially the highest-information line in the case —
      chemistry does not know where the optical axis is — but the evidence is a
      single unblinded, single- author preprint (reported accepted, unconfirmed
      against the journal) using an instrument selected because its coma is
      strong, with no published confusion matrix against known stars, known
      defects, and deliberately produced short flashes. The author himself
      states the data do not establish the physical origin of the light. The
      strongest opposing consideration is that no one has yet shown emulsion or
      handling defects cannot mimic directional asymmetry, and the analyst was
      not protected from knowing which images were candidates — both failure
      modes the blind corpus test (TRN-R003) exists to close. I grade this below
      TRN-C010 because the claim's content is an interpretive signature rather
      than a detection, and signatures of this kind are exactly where unblinded
      analysis fails.
