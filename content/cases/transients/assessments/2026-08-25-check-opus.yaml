  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: The raw counts reproduce under independently written code on the
      author-supplied catalog (0.46% umbral, 0.45% in a centre-of-plate subset),
      and the effect persists and strengthens among ML-scored likelier-real
      candidates — those are real internal robustness results. But the claim's
      operative word is "deficit," which is defined relative to the ~1.4%
      geometric expectation, and Watters et al. show the uniform- random
      background that expectation assumes is demonstrably false for these data,
      with no significant deficit surviving in more heavily vetted subsets. The
      proponents' reply concerns statistical power, not a counter-demonstration
      on a clean sample. The strongest opposing consideration to a purely
      negative reading is that the vetted subsets are twenty-fold smaller and
      were built for another purpose, so the null is not decisive either — hence
      mixed rather than contradicted.
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: "The split is exactly along the replication-type axis: independent
      statistics on the same rows reproduce the association (RR 1.45, p = .011;
      permutation p = .006), it survives ML artifact-scoring and a Kp control,
      and an open Bayesian reanalysis with temporal autocorrelation retains an
      attenuated version — but the one independent extraction with nightly sky
      coverage as exposure is flatly null (IRR 1.03, p = .71), and Watters
      attributes the original signal largely to the observing schedule. A
      \"rate\" claim requires a denominator, and the denominator is precisely
      what is disputed. The strongest opposing consideration to dismissing it is
      that Hayes's independent catalog averages ~7,250 mostly-noise candidates
      per night, which could dilute a real weak effect below detectability. Note
      also that the correlation is direction-ambiguous even if real: fallout
      contamination of emulsions predicts it as well as glints do, and the
      Bayesian reanalysis's strongest term is a UAP-report lag, which should
      lower rather than raise confidence in a physical reading."
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: One independent researcher, using a different archive, telescope,
      emulsion stock and digitization, reports appear-once candidates on rapid
      same-night Hamburg plate pairs with systematically narrow FWHM — genuinely
