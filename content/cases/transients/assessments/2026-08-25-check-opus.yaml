      geometric signature with no plausible plate-chemistry analogue; that test
      has not been run, so the claim sits open rather than refuted.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "This is a genuine standoff, not a default. Against: the marks group
      morphologically with spurious detections (TRN-E004, though its
      \"spurious\" training class is defined by the very property that defines a
      transient candidate, a circularity the record itself flags), plate
      archives are known to manufacture star-like marks at contaminating rates,
      and the microscopist who examined the original Caltech glass — directed
      there by the copy-defect argument's own author — judged emulsion defects a
