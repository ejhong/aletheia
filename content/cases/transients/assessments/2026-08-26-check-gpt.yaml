  synthesis: >-
    Across the full record, the featured hypothesis chain remains broken at
    several rungs. The observational floor is strong: the April 1950 nine and
    July 1952 triple are clearly real, localized features on plate material,
    confirmed by both critics and proponents and now by microscopy of the
    original 1950 negative. Independent pipelines detect them in the same
    digitized data, so neither software artifacts nor scanner glitches explain
    them. However, "dot on emulsion" is compatible with sky flashes and with
    intrinsic plate flaws.

    The crux is TRN-C020: whether any disputed mark was made by light entering
    the telescope during the original exposure. Here the evidence is genuinely
    bilateral. On the skeptical side, the nine 1950 marks are systematically
    sharper than stars and fall squarely in a morphology regime where the
    SuperCOSMOS classifier expects artifacts; Hambly & Blair’s random-forest
    classifier assigns them spurious-like labels, and their plate inspection
    shows a rich defect population and analogous one-plate-only events nearby.
    The genealogy evidence (TRN-C007) is persuasive as a mechanism: both major
    digitizations share a copy ancestor, so defects introduced there can
    masquerade as replicated sources; for the bulk catalog, that remains a major
    concern. Watters et al. further show that the ensemble candidate
    distribution is highly non-uniform and strongly edge/cluster concentrated, a
    pattern natural for plate/scan artifacts and incompatible with the simple
    uniform background assumed in the shadow analysis.

    On the proponent side, two lines challenge a pure-defect account. First is
    physics: sub-second flashes should be sharper than 50-minute star trails;
    sharpness is therefore consistent with flashes, not uniquely with defects,
    and no flash-profile calibration yet exists to separate the two. Second, and
    more substantial, is independent-archive work at Hamburg. Busko’s searches
    in a completely distinct plate, emulsion, and digitization lineage report
    analogous single-exposure candidates (TRN- C010) and, critically,
    coma-shaped images aligned with the telescope’s off-axis aberration pattern
    (TRN-C011). That morphology is hard to reconcile with purely local chemistry
    or scratches and would, if blind-validated, be direct evidence of incident
    light for those candidates. However, these Hamburg results are single-author
    preprints without blind testing; they remain provisional.

    The original-versus-copy question has partly resolved. Yang & Villarroel’s
    microscopy shows all nine 1950 sources on the original negative, and the
    1952 triple is not confined to copy material. This undercuts the specific
    use of TRN-C007 against the canonical events, but not its relevance for the
    wider catalog. Crucially, the same manuscript concedes that microscopy
    cannot distinguish a short flash from an intrinsic emulsion defect, and the
    microscopist consulted judged the features plausibly as defects. Thus, after
    seventy-five years, the strongest direct test narrows the dispute but does
    not settle it: the canonical marks are on the original exposure, but sky
    versus chemistry remains ambiguous.

    Above this, the ensemble-statistics layer is structurally weak. Both the
    Earth-shadow deficit (TRN-C005) and nuclear-test correlation (TRN- C006)
    replicate numerically when independent statisticians re-run the analysis on
    the same ~107k-row working catalog and even persist among ML-scored “more
    real” candidates. Yet Watters et al. demonstrate that the background is
    non-uniform and that most features belong to an unvalidated,
    star-contaminated subset; their reanalysis finds no significant shadow
    deficit once realistic nulls are used and shows the nuclear correlation
    largely traces the observing schedule. Hayes’s independently built catalog,
    with exposure modeling, finds no significant nuclear effect. In aggregate,
    the ensemble patterns appear to be properties of one contested catalog and
    workflow, not robust signatures of sky phenomena.

    Because TRN-C020 (incident light) is unresolved, the near-Earth
    interpretation (TRN-C021) remains unestablished: its main geometric support,
    the shadow deficit, is catalog- and model-dependent, and multiple-transient
    alignments or clusters can be produced by both real glints and structured
    artifacts. The headline claim of pre-Sputnik artificial objects (TRN-C022)
    therefore has no firm evidential base in this record; all plausible routes
    to it require both real flashes and a trustworthy orbital signature, neither
    of which is demonstrated. The maximal extraterrestrial-attribution claim
    (TRN-C023) is correctly classified as presently_untestable: even a proven
    artificial pre- Sputnik object would still need a separate origin analysis.

    Overall, then, the case resolves as follows. The canonical events are real
    features on original plates, and similar marks exist elsewhere, but present
    evidence cannot distinguish, in a non-circular way, between rare plate
    defects and true optical flashes. The ensemble correlations do not survive
    changes in catalog construction and background modeling. Independent-archive
    coma evidence is promising but not yet validated. Under these conditions,
    the most honest roll-up for the core “pre-Sputnik reflective objects” thesis
    is unresolved: intriguing, with real anomalies in the data, but not yet
    supported to the level of establishing either incident light or a near-Earth
    population. Future progress hinges on calibrated flash morphology, blind
    coma tests, quantitative defect rates, and, prospectively, multi-station
    imaging of new events.
