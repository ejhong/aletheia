      non-uniform, edge- and cluster-biased—and, after deriving an appropriate
      null, they find no significant deficit (TRN-E011). The effect has not been
      shown in more strictly vetted subsets or across independent catalogs, and
      there is no preregistered multi-pipeline test. The strongest opposing
      consideration is this dependence on a single, unvalidated working catalog
      and an oversimplified background assumption; under altered catalog
      construction and nulls, the signal evaporates."
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: "Analyses working directly on the VASCO 107k-candidate catalog, using
      independently written code, reproduce an elevated transient rate in
      nuclear-test windows with modest but nontrivial significance (TRN- E010),
      and ML-scored “more real” candidates still show a stronger association
