      the original team’s software or implementation details. While the total
      candidate count is extremely sensitive to parameter choices (millions vs
      thousands), the core overlap is clear and substantial. The strongest
      opposing consideration is that both pipelines operate on the same
      digitized DSS data, so reproducibility here does not speak to physical
      origin or to copy-stage defects, only to software independence.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: "Within the original ~107,875-row VASCO working catalog, an apparent
      Earth-shadow deficit is robustly reproduced: Doherty’s independent code
      finds similar fractions and significance levels, and ML-filtering
      strengthens the effect among higher-scored candidates (TRN-E010, TRN-
      E015). However, Watters et al. demonstrate that the uniform background
