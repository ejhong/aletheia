      matched controls: every plate archive has defects, and similar-looking
      candidates are not yet distinguished from similar emulsion failure."
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: Busko reports that transient-candidate images on the Hamburg 0.6-m
