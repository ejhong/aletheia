  synthesis: >-
    The featured hypothesis fuses two propositions the record must keep apart:
    that at least some pre-Sputnik single-exposure marks were made by light
    entering the telescope, and that the light was sunlight glinting from
    artificial objects near Earth before October 1957. The first is the gate;
    the second is the headline. Neither is established, and the headline is not
    even reached. What is established is the floor. Nine star-like marks sit on
    surviving glass of the 12 April 1950 POSS-I red plate, absent six days later
    and from deeper modern surveys; critics confirmed them under a microscope,
    an independent pipeline recovers eight of nine, and an unpublished
    inspection of the original Caltech negative finds all nine on the emulsion
    that was in the telescope. A second multi-source event on 19 July 1952 is
    recovered independently and remains blank to magnitude 25.5. Independent
    software is not the source of the detections. Those facts are compatible
    with every reading in the case, from emulsion holes to manufactured
    reflectors, and they do not climb.

    Steelman the conventional account. Photographic emulsions mint star-like
    impostors; two decades of archival GRB searches learned this the hard way
    and never confidently confirmed one plate transient. The nine 1950 marks are
    systematically sharper than stars of equal brightness and fall where a
    morphology classifier trained on unmatched detections puts artifacts. The
    two modern digitizations that seemed to give independent confirmation are
    cousins: DSS and SuperCOSMOS descend from a shared intermediate positive, so
    one copying flaw can enter every later dataset. The inspecting microscopist,
    pointed at the nine objects by the copy-defect argument's own author, found
    them un-star-like, noted their corner-of-plate location, and judged emulsion
    defects a reasonable attribution. Ensemble correlations that look like
    orbital geometry or nuclear timing reproduce only inside the VASCO working
    catalog and dissolve when the catalog is rebuilt or the background the
    plates actually have is used. On this reading the interesting dispute is
    plate forensics, and the exotic ladder never gets off the ground.

    Steelman the light reading. A sub-second flash on a fifty-minute exposure is
    supposed to look sharper than a star; the critics' morphology argument is
    then directionless until someone calibrates period emulsion against
    controlled flashes. The copy-genealogy keystone loses the two flagship
    events if the Yang registration holds: the 1950 nine are on the original
    glass, and the 1952 triple is not confined to copy material. Analogous
    appear-once candidates then show up on Hamburg plates, a different
    telescope, emulsion, archive, and digitization, where the Palomar copying
    chain cannot reach. On a telescope chosen for strong off-axis coma, a subset
    of those candidates is reported to carry the optical fingerprint of light
    that passed through the instrument — a signature chemistry and scratches
    should not know. Multiple simultaneous point sources across arcminutes are
    an awkward accident for random defects if the marks are photons. The
    conventional account's unpaid quantitative debt remains unpaid: no one has
    measured the star-like defect rate per copying stage, and its simplest form
    does not touch Hamburg.

    The honest remainder is narrower than either camp's rhetoric. "Original or
    copy?" now has an answer for the two events the case is fought over, pending
    review of an unpublished, unblinded registration. "Sky or chemistry?" does
    not, and the observation seventy-five years in the waiting cannot provide
    it: at single-source resolution a brief flash and an emulsion flaw are the
    same sharp dot. Every rung above incident light is therefore conditional.
    The Earth-shadow deficit and the nuclear-window excess are real properties
    of one working sample and are not yet shown to be properties of the sky;
    even a surviving nuclear correlation would be direction-ambiguous between
    fallout on plates and glinting objects. Artificiality is a further inference
    with no evidence stream of its own, and extraterrestrial origin is not
    presently testable at all. The live discriminants are a coma classifier that
    has not been blind-validated, ensemble statistics on catalogs nobody's thumb
    has touched, and — for any future event — simultaneous imaging from two
    stations. Until one of those is run, the featured hypothesis is an open
    physical question, not a discovery and not a debunking.

    Sensitivity: TRN-E014 (Busko's coma result) is the single record whose
    removal would most change the texture of the case, because it is the only
    physical signature in the file that plate-surface chemistry should not
    naturally produce and the only positive line that sits outside the Palomar
    copy family. Without it, the incident-light reading of TRN-C020 rests on an
    uncalibrated sharpness argument plus uncalibrated Hamburg examples, and the
    conventional account of the Palomar events is correspondingly stronger. The
    unresolved case verdict survives that removal: presence on the original 1950
    negative still blocks a pure copy-defect win, Hayes still finds no nuclear
    effect in an independent extraction, and microscopy still cannot classify a
    single source. The verdict does not hang on one thread. It hangs on the
    absence of a validated discriminant.
