  synthesis: >-
    The featured hypothesis asks whether at least some pre-Sputnik
    single-exposure marks are genuine telescope-recorded flashes, and on the
    strong reading whether those flashes were sunlight from artificial objects
    near Earth before October 1957. The evidence records settle the floor and
    leave every rung above it open. The April 1950 nine and the July 1952 triple
    are real features of plate material: critics confirmed the nine on Edinburgh
    glass, an independent pipeline recovers both flagship events, and an
    unpublished microscopy manuscript reports all nine on the original Caltech
    negative and the 1952 triple on a Harvard copy co-located with the original
    survey digitization. That is enough to retire scanner glitches and, for
    those two events if the registration survives review, the shared-copy
    pathway. It is not enough to retire chemistry. The same manuscript states
    that a brief flash and an emulsion flaw produce the same sharp compact dot,
    and the microscopist directed to the nine objects by the copy-defect paper's
    own author judged defects a reasonable attribution in a plate corner.
    Seventy-five years of waiting for the original-glass test therefore narrowed
    the dispute from "original or copy?" to "flash or flaw?" without answering
    it.

    Steelman the conventional account. Photographic emulsion mints star-like
    impostors; two decades of archival gamma-ray-burst searches never
    confidently confirmed one optical transient. Hambly and Blair reconstructed
    a concrete copying genealogy that makes dual-digitization agreement cheap
    for the uninspected catalog, measured the 1950 nine in the morphological
    neighborhood their classifier assigns to spurious detections, and showed
    similar one-plate-only marks on a neighboring field. Ensemble claims live
    and die with dataset definition: independent statistics on the
    author-supplied 107,875-row catalog reproduce an Earth-shadow deficit and a
    nuclear-window relative risk, but Watters et al. find no significant shadow
    deficit once the data's edge-concentrated, non-uniform background is
    modeled, and Hayes's from-scratch extraction finds no nuclear effect once
    nightly coverage is the exposure. A correlation that survives only inside
    one working sample is a property of that sample until shown otherwise. Even
    a real nuclear timing would be direction-ambiguous, because fallout on
    plates predicts it as cleanly as glinting objects do.

    Steelman the incident-light account. A sub-second flash on a fifty-minute
    exposure should look sharper than a star, so the morphology cut points both
    ways until someone calibrates period emulsions. Nine (or three) simultaneous
    point sources that never return, even at magnitude 25.5, are an awkward
    accident for uncorrelated holes. Hamburg plates — different telescope,
    emulsion, archive, and digitization, sharing no ancestor with Palomar — show
    analogous appear-once candidates, and a subset is reported to carry the
    telescope's off-axis coma, a fingerprint chemistry should not know. If that
    discriminant survived blind validation against known defects and controlled
    flashes, specific candidates would move from mark to
    light-through-the-optics without any Palomar negative. It has not been so
    validated. The shadow geometry, were it recovered in independently built
    catalogs, would then begin to argue for a sunlight-reflecting near-Earth
    population; it has not been.

    Climbing further is unwarranted. Near-Earth origin is conditional on
    incident light and on a contested catalog statistic. Artificiality is
    conditional on both and is not implied by a natural near-Earth reflector
    even if one existed. Extraterrestrial origin is not presently testable.
    General priors from plate-defect literature and the null GRB-era campaign
    make a mundane reading the more economical default; that is a prior, not a
    measurement of the star-like defect rate at each copying stage, which nobody
    has published. Sensitivity: TRN-E022 (original-glass microscopy of the 1950
    nine) is the single record whose removal would most change the balance,
    because without it the copy-defect pathway remains fully live for the events
    the dispute is actually fought over. The case verdict would still be
    unresolved: Hamburg and the unvalidated coma line would keep incident light
    open, and nothing in the remaining file would establish pre-Sputnik
    artificial objects. The verdict does not hang on one thread. What would
    settle the crux is still what the agenda says: blind validation of the coma
    discriminant, independently extracted catalogs run through a preregistered
    shadow test, and purpose-built simultaneous imaging for any future event.
