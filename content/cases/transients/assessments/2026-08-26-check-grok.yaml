  synthesis: >-
    The featured hypothesis is a ladder, and the evidence is allowed to support
    only the rung it actually touches. At the floor the record is unusually
    solid. Nine point-like marks exist on the 12 April 1950 Palomar material at
    the published positions: the discovery paper reported them, the principal
    critics confirmed them under a microscope on surviving glass, an independent
    pipeline recovered eight of nine, and an unpublished but fully read
    microscopy manuscript locates all nine on the original Caltech negative. A
    second multi-source event from 19 July 1952 is peer-reviewed with deep
    modern follow-up, recovered independently, and likewise not confined to
    later copy generations. The 1950 marks are systematically sharper than stars
    of equal brightness. Independent software finds the same detections in the
    same scans. None of that is seriously contested, and none of it decides what
    made a mark.

    Steelman the conventional account. Photographic emulsions manufacture
    star-like impostors; two decades of archival searches for gamma-ray-burst
    flashes never confidently confirmed one optical transient. SuperCOSMOS
    profile statistics put all nine 1950 marks in the morphological neighborhood
    where a trained classifier assigns spurious detections. DSS and SuperCOSMOS
    are not independent witnesses: they descend from a shared intermediate
    positive, so a single copying flaw can appear in both modern datasets. The
    microscopist who examined the original 1950 glass — directed to the nine
    objects by the copy-defect paper's own author — found them un-star-like,
    noted a plate-corner location where defects congregate, and judged emulsion
    defects a reasonable attribution. Above the individual events, the
    celebrated ensemble patterns (Earth-shadow deficit, nuclear-test timing)
    reproduce when independent statisticians re-analyse the VASCO working
    catalog and dissolve when the catalog itself is rebuilt or the background's
    spatial non-uniformity is modelled. On this reading the correlations are
    properties of unvalidated rows and of Palomar's schedule, not of the sky.

    Steelman the incident-light account. A sub-second flash on a fifty-minute
    exposure should look sharper than a star that accumulated seeing and guiding
    blur, so the morphology argument is direction-ambiguous until someone
    calibrates period emulsions. The copy-genealogy argument, whatever its force
    against the uninspected hundred thousand, no longer reaches the two flagship
    events if the Yang registration holds: those marks are on the grandparent,
    not only on two cousins. Hamburg plates — different telescope, emulsion,
    archive, and digitization — show analogous appear-once candidates, and a
    subset reportedly carries the coma signature of light that passed through
    the optics. Chemistry and scratches do not know where the optical axis is;
    photons do. Those Hamburg results are single-author preprints, uncalibrated
    against false-positive rates and unvalidated blind, but they sit outside the
    Palomar copy family and are the only physical discriminant currently on the
    table.

    Neither steelman currently wins. Presence on the original emulsion retires
    scanner and copy-stage origins for the canonical events and leaves
    flash-versus-flaw in the original emulsion, which single-source microscopy
    cannot split. The Earth-shadow deficit is the best geometric test of a
    near-Earth reflecting population, and it is not established beyond one
    working catalog. Artificial objects before Sputnik (TRN-C022) remain a
    headline with no secured path through the two unresolved rungs beneath it;
    extraterrestrial origin (TRN-C023) is not presently testable at all. The
    case verdict is therefore unresolved: the marks are real features of plate
    material, the mundane mechanisms are real, and whether any prespecified
    subset was made by photons entering a telescope in the 1950s is still an
    open empirical question. Sensitivity: removing TRN-E022 (original-glass
    microscopy of the 1950 nine) would most change the character of the
    assessment, because it would restore the copy-defect account's full reach
    over the flagship events. The unresolved verdict would survive that removal.
    The verdict does not hang on one thread; it is held open by several
    independent gaps (unvalidated coma, catalog-conditional statistics,
    uncalibrated flash profiles, and the flash-versus-defect
    indistinguishability of single-source morphology).
