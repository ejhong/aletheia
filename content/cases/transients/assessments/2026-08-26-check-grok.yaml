      the claim as stated, however, is the genealogy and the possibility, which
      remain intact.
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: "Villarroel et al. reported the nine; Hambly and Blair physically
      confirmed them on the Edinburgh glass copy; Hayes recovered eight of nine;
      Yang and Villarroel report all nine on the original Caltech negative at
      the published positions. Absence from the overlapping plate six days later
      and from deeper modern surveys is likewise uncontested by critics. The
      strongest opposing consideration is not existence but uniqueness: similar
      one-plate-only marks on neighboring field E0086 show the phenomenon is a
      property of plates generally, which fits defects at least as well as the
      sky."
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: Hambly and Blair place all nine in the sharp tail of the SuperCOSMOS
      stellar profile distribution (joint probability of order 0.1^9),
      microscope inspection agrees they are more concentrated and circular than
      stars of like brightness, and the unpublished original-glass exam reports
      the same sharp-edged compactness. Proponents accept the measurement and
      invert only its meaning. The strongest opposing consideration is that no
      flash-profile calibration on period emulsions exists, so sharpness does
      not yet discriminate flash from artifact, and in SuperCOSMOS vocabulary
      the sharp tail is the known neighborhood of spurious detections.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: Solano et al. 2024 report three ~16 mag sources within 10 arcsec on
      one 19 July 1952 exposure, gone within about fifty minutes and absent to
      magnitude 25.5 in 2023 GTC imaging; Hayes recovers all three; Yang reports
      the triple on a Harvard copy and in the original survey digitization. That
      is a second multi-source vanishing event with modern non-detection. The
      strongest opposing consideration is that the original 1952 negative was
      not itself examined, everything still passes through the Palomar digitized
      lineage, and the isolated source's star-like profile makes the two
      canonical events morphologically non-uniform.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: Hayes's from-scratch pipeline, with sigma-clipped detection, PSF
      filtering, and synthetic-injection controls, recovers eight of the 1950
      nine, all three of the 1952 triple, and 3,450 of Solano's 5,399 (63.9
      percent) at a median 0.94 arcsec. Private-software artifact is therefore
      not a live explanation of the canonical marks. The strongest opposing
      consideration is that independent extraction from the same digitized
      copies is exactly what a defect population would also produce, and the
      2.85-million versus 5,399 spread shows the population's headline size is a
      vetting choice.
  - claimId: TRN-C005
    verdict: mixed
    confidence: high
    reasoning: Doherty reproduces 0.46 percent of sources in the umbral cone against
      a ~1.4 percent geometric expectation on the author-supplied catalog, and
      Bruehl et al. find the deficit stronger among candidates scored
      likelier-real by a visual-label ML model. Watters et al. show the
      uniform-background assumption is false — counts rise toward edges and
      corners, with geometric clusters and voids — and find no significant
      deficit in more heavily vetted subsets. The strongest opposing
      consideration is that every positive replication is conditional on the
      same unvalidated working catalog, while the critique that rebuilds the
      null from the data's actual spatial structure dissolves the signal.
  - claimId: TRN-C006
    verdict: mixed
    confidence: high
    reasoning: Independent statistics on the original 107,875-row catalog reproduce
      a nuclear-window relative risk of 1.45 (Doherty p = .011; permutation p =
      .006); ML artifact-scoring and a Kp control leave a signal, and a public
      Bayesian reanalysis finds an attenuated occurrence-level association.
      Hayes's independently extracted catalog with nightly coverage as exposure
      is null (IRR 1.03, p = .71), and Watters traces the original timing to the
      Palomar schedule. The strongest opposing consideration is that the one
      analysis which varies source extraction and models exposure finds nothing,
      and even a real correlation would be direction-ambiguous between fallout
      on plates and any sky population.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: "Busko's preliminary search of 41 Hamburg same-night plate pairs
