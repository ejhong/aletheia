  - claimId: TRN-C021
    verdict: unresolved
    confidence: moderate
    reasoning: "The near-Earth reading is carried almost entirely by the
      Earth-shadow deficit in TRN-C005, which replicates only inside the VASCO
      working catalog and is absent once spatial non-uniformity is modeled.
      Simultaneous multi-source flashes would argue against most distant
      astrophysical sources if they were real light, but that premise is exactly
      TRN-C020. The strongest opposing consideration is Watters et al.: the
      deficit is computed against a uniform background the features do not
      follow, and it fails in the subsets vetted hardest against plate and scan
      artifacts."
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: Presence of the 1950 nine on the original Caltech negative eliminates
      scanner and copy-stage origins for those events, and Hamburg candidates
      plus reported coma supply an independent-lineage argument the Palomar
      genealogy cannot touch. Against this, Hambly's classifier groups the nine
      with artifacts, the inspecting microscopist judged emulsion defects
      reasonable, and the microscopy manuscript itself states that a flash and a
      flaw look the same at the single-source level. The strongest opposing
      consideration is that the long-awaited original-plate test narrowed the
      question without answering it, while the only claimed optical discriminant
      remains unvalidated.
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: Hambly and Blair reconstruct contact printing through a shared
      intermediate positive from the archival record and SuperCOSMOS
      institutional knowledge; proponents do not dispute the genealogy, and it
      cleanly defeats "present in two independent digitizations" as confirmation
      for the uninspected catalog. The strongest opposing consideration is that
      a pathway is not an occurrence rate, and TRN-E023 removes this mechanism's
