      the question TRN-R006 exists to answer.'
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: "A single-author preprint (reported accepted at Scientific Reports
      but unconfirmed against the journal) reports that Hamburg candidate images
      carry the off-axis coma pattern of light that passed through the telescope
