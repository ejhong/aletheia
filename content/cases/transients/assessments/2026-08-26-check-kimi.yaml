      blind-validated: no one has shown that defect classes never mimic
      directional asymmetry, and the analyst was not blinded to which images
      were candidates — the two failure modes TRN-R003 is designed to exclude.
      The strongest opposing consideration is therefore not contrary evidence
      but absent evidence, and the author himself states the data do not
      establish the light's physical origin; if blind validation succeeds this
      becomes the most important positive record in the case, and if it fails
      the strongest new positive line closes."
