  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: 'The measurement is common ground: SuperCOSMOS profile statistics put
      all nine marks in the sharp tail (TRN-E003, strong), two microscope
      inspections qualitatively concur ("more concentrated and circular"; "sharp
      edges, no elongation" — TRN-E002, TRN-E024), and the proponents embrace
