  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: "Directly demonstrated: a from-scratch pipeline with
      synthetic-injection benchmarks and control fields recovers 8 of 9 April
      1950 sources, 3 of 3 July 1952 sources, and 63.9% of the public catalog
