  synthesis: "The verdict is unresolved, and it is a finding, not a shrug. What
    seventy-five years of argument and one new microscopy campaign have settled
    is the floor: the canonical marks are physical features of plate material —
    confirmed on the Edinburgh glass by the case's own critics (TRN-E002),
    recovered by a from-scratch pipeline (TRN-E008), and now reported on the
    original 1950 negative itself (TRN-E022, unpublished and unblinded). What
    remains unsettled is the crux: whether any mark was made by light arriving
    during the exposure (TRN-C020). The skeptical case at full strength is
    formidable. Photographic chemistry manufactures star-like dots without the
    sky's permission; two decades of GRB archival searches found such impostors
    routinely and never confirmed one archival transient. The nine canonical
    marks sit in the morphology classifier's artifact neighborhood (TRN-E004);
    the two \"independent\" digitizations share a photographic ancestor
    (TRN-E005); the ensemble correlations replicate only inside one contested
    catalog lineage and dissolve under independent extraction and proper nulls
    (TRN-E009, TRN-E011); and the microscopist who examined the original plate —
    directed to the objects by the copy-defect argument's own author — leaned
    emulsion defect, citing the defect-prone plate corner (TRN-E024). Its unpaid
    debts: no measured star-like defect rate at any copying stage (TRN-R007),
    and a classifier whose \"spurious\" class is defined by the same
    absence-of-counterpart property that defines transients. The proponent case
    at full strength is not negligible. Sub-second flashes should look sharper
    than stars (TRN-E006, plausible but uncalibrated); the copy-defect mechanism
    is retired for the two flagship events if the registration holds (TRN-E023);
    Hamburg offers an independent lineage (TRN-E013) and a physical
    incident-light signature in coma (TRN-E014, unvalidated); and the ensemble
    effects replicate conditionally under independent code and ML vetting
    (TRN-E010, TRN-E015). Its unpaid debts: no blind validation of the coma
    discriminant, no flash calibration curve, no ensemble result that survives
    catalog reconstruction. Structurally, the test the case waited seventy-five
    years for — the original negatives — was finally performed and returned
    neither verdict: the manuscript itself states microscopy cannot separate a
    flash from an emulsion flaw at the single-source level. The dispute has
    narrowed from \"original or copy?\" to \"flash or flaw in the original
    emulsion?\", and per-source morphology cannot answer that. Discriminating
    power now sits in exactly four places: blind coma validation (TRN-R003),
    flash-profile calibration (TRN-R002), preregistered multi-catalog shadow
    statistics (TRN-R005), and prospective multi-station imaging (TRN-R009).
    Until one reports, every rung above TRN-C001 is conditional, the headline
    claim TRN-C022 stands two unresolved rungs above the data, and TRN-C023 is
    untestable in principle today. Sensitivity: the single record whose removal
    would most change this assessment is TRN-E022 — the report that all nine
    canonical marks sit on the original glass. It is unpublished, unblinded,
    author-group work; without it, the copy-defect argument (TRN-C007) regains
    full reach over the flagship events and the case reverts to the prior
    standoff with a heavier skeptical tilt. The verdict nonetheless survives its
    removal: TRN-C020 was unresolved before it and remains unresolved after it —
    what TRN-E022 changes is where the crux sits, not whether it is settled.
    This verdict does not hang on one thread; the \"original, not copy\"
    sub-finding currently does, and the record should say so."
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: moderate
    reasoning: "No evidence record bears on artificiality directly; every path runs
      through TRN-C020 (real incident light) and TRN-C021 (near-Earth origin),
      both unresolved, and the ensemble statistics offered in support replicate
      only within the contested working-catalog lineage. The strongest
      consideration in the claim's favor is that the conjunction of simultaneous
      sharp multi-source events, a conditional shadow deficit, and the new
      report of marks on the original glass is collectively awkward for a
      pure-chemistry reading — but \"awkward\" is not diagnostic, and TRN-E020
      now sketches a natural near-Earth reflective medium (storm-trapped icy
      dust aggregates) that would satisfy the geometry without any manufactured
      object. The strongest opposing consideration is general background rather
      than any plate: no launch capability existed before October 1957, so a
      demonstrated near-Earth reflective population would force an extraordinary
      choice — which is why this is unresolved rather than contradicted, and
      nowhere near supported."
  - claimId: TRN-C023
    verdict: presently_untestable
    confidence: high
    reasoning: 'This verdict is a structural finding, not a default. The claim has
      no evidence stream of its own: it inherits everything from TRN-C022, which
      is unresolved, and even a proven pre-Sputnik artificial object would still
      require a separate origin argument excluding secret human programs, dating
      error, and unknown natural reflectors. The strongest opposing
      consideration is the conditional one — if artificiality were demonstrated
      before any human launch capability existed, "extraterrestrial" would
      become the live default — but that conditional cannot currently be reached
      by any observation on the table or in the research agenda. No proposed
      test (microscopy, coma validation, ensemble statistics, even multi-station
      imaging) bears on origin; grading this unresolved would falsely imply an
      open evidential contest where nothing is yet contesting.'
  - claimId: TRN-C021
    verdict: unresolved
    confidence: moderate
    reasoning: "The claim inherits TRN-C020's openness and adds one direct geometric
      test of its own — the Earth-shadow deficit — which replicates on the
      author-supplied catalog (TRN-E010) but fails under a proper non-uniform
      background null and in more heavily vetted subsets (TRN-E011), and has
      never been run on an independently constructed catalog. The strongest
      consideration in its favor: multiple point flashes appearing
      simultaneously across ~10 arcminutes are genuinely difficult for distant
      astrophysical sources (which would need coordinated flaring), so if the
      flashes were real, a near-Earth population becomes plausible — and
      TRN-E020's preregistered storm-recovery profile, though weak, points the
      same way. The strongest against: the near-Earth reading currently rests on
      the least-vetted data, and the one time the disputed extraction step was
      varied (TRN-E009, for the nuclear window) the signal vanished."
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "The evidence pulls genuinely in both directions and the decisive
      discriminators have never been run. Against incident light: the canonical
      marks occupy the known morphological neighborhood of artifacts (TRN-E003,
      TRN-E004), the microscopist who inspected the original plate leaned
      emulsion defect and flagged the defect-prone plate corner (TRN-E024), and
      the GRB-era base rate shows star-like plate defects are routine while
      confirmed archival transients are zero. For incident light: sub-second
      flashes are expected on physical grounds to be sharp (TRN-E006), the marks
      are now reported on the original negative rather than in the copy chain
      (TRN-E022), and Hamburg candidates reportedly carry the coma signature of
      light through the optics (TRN-E014). The strongest opposing consideration
      to a positive verdict is the circularity in the artifact classifier's
      training labels — but its mirror image is equally true: the flash-profile
      argument has never been calibrated on period emulsion (TRN-R002), and the
      coma discriminant has never been blind-validated (TRN-R003). Narrowed by
      the microscopy, not settled."
  - claimId: TRN-C007
    verdict: established
    confidence: high
    reasoning: "The genealogy is documented from the archival copying procedure and
      the SuperCOSMOS program's own institutional knowledge (TRN-E005), and the
      proponents do not dispute it — it is the one structural point both camps
      share. It cleanly defeats \"present in two independent digitizations\" as
