  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: "The correlation splits cleanly by replication type. It reproduces
      with independent statistics on the original rows (TRN-E010: RR 1.45,
      permutation p = .006), persists under ML artifact-scoring (TRN-E015) and
      geomagnetic control, and survives a Bayesian autocorrelation-aware
      reanalysis in attenuated form (TRN-E019). But the one fully independent
      extraction with nightly sky coverage modeled as exposure finds nothing
      (TRN-E009: IRR 1.03, p = .71), and TRN-E011 traces the timing to the
