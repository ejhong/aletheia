  synthesis: "The case separates into a settled floor, a narrowed crux, and a
    contested superstructure, and the unresolved verdict is a substantive
    finding about that structure, not a default. The floor: the marks are real
    features of plate material, confirmed by the critics' own glass inspection
    (TRN-C001), recovered by outside software (TRN-C004), and now reported on
    the original 1950 negative itself; the 1952 triple is comparably real
    (TRN-C003); and the two digitizations genuinely share a photographic
    ancestor (TRN-C007) — a mechanism, not an occurrence. The crux, TRN-C020, is
    open in both directions with live evidence on each side. Steelman the
    proponent reading: sub-second flashes on fifty-minute exposures should look
    exactly like these marks — sharp, round, un-starlike; the copy-defect
    account is now reportedly dead for both flagship events, leaving an
    unexplained residue on original glass; the microscopist's defect-lean is
    arguably a steady-star default, printed against the manuscript's own
    interest; and Hamburg supplies an untouched lineage carrying a reported coma
    signature that surface chemistry should not be able to fake. Steelman the
    skeptical reading: two decades of GRB-era archival hunting produced
    star-like defects routinely and never one confirmed transient; the canonical
    nine sit in the classifier's artifact neighborhood and in a plate corner
    where defects congregate; microscopy cannot separate flash from flaw by its
    own authors' admission; and neither side's mechanism has a measured base
    rate — the copy-stage defect rate and the flash-profile calibration curve
    are both unmeasured. Above the crux, the ensemble signals (TRN-C005,
    TRN-C006) replicate only within the contested 107,875-row lineage and
    dissolve under proper nulls or independent extraction, so TRN-C021 rests on
    the least-vetted data, TRN-C022 has no direct evidence stream, and TRN-C023
    is presently untestable. The decisive observations are specified but
    unperformed: blind coma validation, flash calibration, preregistered
    multi-catalog shadow analysis. Sensitivity: removing TRN-E011 (the Watters
    reanalysis) would most change this assessment — it is the only comprehensive
    attack on the dataset definitions beneath both ensemble signals, and without
    it TRN-C005 and TRN-C006 would likely read as provisionally_supported and
    the near-Earth rung would become the live frontier rather than a contested
    one. The case verdict nonetheless survives that removal, because TRN-E009's
    independent-extraction null and the untouched crux still gate every rung
    above; the close second, TRN-E022, would restore the copy-defect account's
    reach over the canonical events, but the pre-microscopy status quo was
    likewise unresolved. This verdict hangs on no single thread."
