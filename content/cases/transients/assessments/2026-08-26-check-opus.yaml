  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: "Read literally, the descriptive half of the claim holds: independent
      code on the author-supplied catalog reproduces 0.46% in the umbral cone
      against a ~1.4% geometric expectation (TRN-E010), and the pattern
      strengthens among ML-scored likely-real candidates (TRN-E015). But the
      word \"deficit\" imports the comparison, and Watters et al. (TRN-E011)
