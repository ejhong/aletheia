      to comparison stars, unlike the sharp 1950 nine, so the two canonical
      events are not morphologically uniform — awkward for any single-mechanism
      story, flash or defect."
  - claimId: TRN-C004
    verdict: well_supported
    confidence: moderate
    reasoning: "Hayes's from-scratch pipeline documents recovery of 8/9 and 3/3
      canonical sources plus 63.9% of the 5,399 published candidates at 0.94
      arcsec median separation, with control-field false positive rates and
      synthetic-injection benchmarking (TRN-E008). That is a clean refutation of
      \"one team's software bug.\" Confidence is moderate because this rests on
      a single single-author preprint, and because the same work shows how
      fragile the notion of \"the catalog\" is — a full-footprint sweep with
