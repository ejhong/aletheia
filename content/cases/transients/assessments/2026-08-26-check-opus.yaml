  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: 'One independent researcher, using plate-pair differencing rather
      than catalog crossmatching, reports appear-once candidates with
      systematically narrow FWHM on Hamburg Schmidt plates digitized by APPLAUSE
      (TRN-E013) — an archive sharing no ancestry with Palomar, so immune to the
      copy-defect pathway. The evidential value is real but thin: 41 plates,
      explicitly labeled preliminary, single author, unreviewed. The strongest
      opposing consideration is decisive for confidence: without a
      false-positive rate against matched controls and injection/recovery
      calibration, "the sky did this at two observatories" and "old emulsions
      fail similarly everywhere" make identical predictions, and the second is
      the better-attested hypothesis given the GRB-era base rate. This is the
      axis along which the case can actually move, which makes the missing
      calibration the most costly gap in the record.'
  - claimId: TRN-C011
    verdict: weakly_supported
    confidence: low
    reasoning: "The claim as stated is compound, and its two halves have very
      different support. The first — that a subset of Hamburg candidates shows
      the coma pattern expected off-axis — is reported by a single unblinded
      author on a telescope chosen because its coma is strong (TRN-E014), with
