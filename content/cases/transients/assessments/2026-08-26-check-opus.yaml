      origin. The second — that plate-surface artifacts should not naturally
      reproduce this signature — is asserted, not demonstrated: no defect class
      has been tested against the discriminant, and no confusion matrix exists.
      The strongest opposing consideration is that this is nonetheless the most
      diagnostically valuable line in the case, and the physical intuition
      (chemistry does not know where the optical axis is) is sound; if it
      survives the blind corpus test it would move TRN-C020 substantially. Until
      then the claim as stated outruns its evidence."
