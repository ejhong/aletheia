      false-positive rates calibrated against matched controls for typical plate
      defects.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The reported presence of coma aberration in Hamburg candidates
      provides the most powerful physical discriminant for incident light in the
      entire case. However, it remains a single-author preprint whose optical
      classifier has not yet been subjected to a blind validation test against
      known plate artifacts that could mimic asymmetric distortion.
