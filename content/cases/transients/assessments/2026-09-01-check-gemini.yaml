      code. However, because this pipeline extracts from the identical digitized
      copy descendents, it cannot determine whether it is reliably extracting
      celestial flashes or reliably extracting shared plate defects.
  - claimId: TRN-C005
    verdict: mixed
    confidence: high
    reasoning: The Earth-shadow deficit strongly replicates when analyses are run
      strictly against the authors' ~107,875-object working catalog, even
      post-ML vetting. It completely fails, however, in the Watters reanalysis,
      which demonstrates that the base catalog wildly violates the
      uniform-random spatial background assumption required to make the shadow
      deficit statistically significant.
  - claimId: TRN-C006
    verdict: mixed
    confidence: high
    reasoning: The nuclear-test timing correlation successfully replicates when
      recalculating the original working catalog. Yet it vanishes entirely into
      statistical insignificance when an independent pipeline extracts the data
      and properly models the nightly survey coverage and observing schedule,
      suggesting the correlation is a scheduling and extraction artifact rather
      than a physical phenomenon.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Busko's preprint successfully identifies similar transient candidates
