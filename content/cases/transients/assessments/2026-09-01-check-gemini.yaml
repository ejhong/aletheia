  synthesis: >-
    The "Before Sputnik?" case remains at a stark diagnostic impasse. Evaluating
    the evidence requires cleanly separating the existence of the physical marks
    from their physical origin, and their physical origin from the contested
    statistical behaviors of the broader catalogs. 

    To steelman the proponent case: The canonical single-exposure marks are
    indisputably real physical features, visually confirmed on the glass
    (TRN-E002), mathematically sharp (TRN-E003), and robust to independent
    software extraction (TRN-E008). Crucially, recent microscopy places the 1950
    flagship marks on the original telescope negative (TRN-E022), definitively
    closing the skeptical theory that they were introduced during a shared
    plate-copying stage. Furthermore, the phenomenon is not isolated to Palomar;
    analogous marks appear in Hamburg Observatory plates (TRN-E013) where they
    reportedly exhibit coma aberration (TRN-E014)—the specific optical footprint
    of photons passing through a telescope, a signature plate chemistry cannot
    natively mimic.

    To steelman the skeptical case: The entire evidentiary base rests on a
    photographic medium notorious for manufacturing star-like defects. The
    flagship marks' extreme sharpness places them precisely in the morphological
    neighborhood of emulsion artifacts (TRN-E004). The proponents' own
    manuscript acknowledges that microscopy cannot distinguish a sub-second
    flash from a primary emulsion flaw (TRN-E024). More devastatingly, the
    ensemble evidence used to argue for a near-Earth orbit (shadow deficit) or
    artificiality (nuclear timing) evaporates when the catalog is independently
    reconstructed or when basic background non-uniformities and observatory
    schedules are modeled (TRN-E009, TRN-E011). 

    The single evidence record whose removal would most change the shape of this
    case is TRN-E022 (Yang & Villarroel's microscopy of the original negative).
    Without it, the shared copy-stage mechanism (TRN-E005) remains a fully
    sufficient, mundane explanation for the canonical Palomar events. Even with
    TRN-E022 present, the overall verdict of "unresolved" survives, because
    while TRN-E022 proves the marks are on the original negative, it explicitly
    fails to prove they were made by incident light (TRN-C020). Resolution now
    depends entirely on blind validation of the Hamburg coma discriminant and
    future multi-station simultaneous imaging.
