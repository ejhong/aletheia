  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: The 1952 triple transient is peer-reviewed, supported by deep modern
      follow-up imaging confirming the absence of the sources today, and
      recovered by an independent pipeline. However, no independent physical
      inspection of the original 1952 plate material has been published, leaving
      it vulnerable to the same copy-defect hypotheses that plagued the 1950
      event prior to recent microscopy.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: The Hayes pipeline definitively demonstrates that independent,
      from-scratch software can recover the canonical events and a majority of
