    confidence: high
    reasoning: No evidence record directly supports artificial objects pre-Sputnik;
      every constructive route depends on both real incident light (TRN-C020)
      and a near-Earth reflective origin (TRN-C021). TRN-C020 remains unresolved
      because morphology and microscopy cannot yet separate flashes from defects
      on the original emulsion, and TRN-C021 is at best weakly indicated, with
      its main geometric support (TRN-C005) strongly challenged by Watters and
      sensitive to catalog choices. On the positive side, the existence of
      sharp, clustered events on original plates and some persistent
      catalog-level patterns keep the possibility open. The strongest opposing
      consideration is that all ensemble correlations sit on a heavily
      contaminated, lineage-bound catalog and that no observation yet demands an
      artificial explanation over plate chemistry or natural near-Earth
      mechanisms.
  - claimId: TRN-C023
