  synthesis: >-
    Across the whole dossier the core factual base is solid at the lowest rung
    and increasingly contested higher up. The existence and basic properties of
    the canonical events are well documented: nine star-like points on the 1950
    plate and a bright triple in 1952 have been recovered by independent
    pipelines, confirmed on glass copies by the main skeptics, and now, for the
    1950 event, reported directly on the original telescope negative. TRN-C001
    and TRN-C003 are thus well-supported as observations. TRN-C002’s sharpness
    finding is also strong: all nine 1950 marks are systematically sharper than
    stars, with vanishingly small probability under the stellar profile
    distribution. These marks are real emulsion features with atypical
    morphology.

    That base does not, however, determine origin. Hambly & Blair’s copy
    genealogy (TRN-C007, strongly supported) showed why agreement between DSS
    and SuperCOSMOS was not independent. The Yang & Villarroel microscopy
    (TRN-C024, provisionally supported) weakens that mechanism’s applicability
    to the two flagship events by putting all nine 1950 marks on the original
    negative, and shows the 1952 triple is not confined to a single copy
    lineage. Yet TRN-E024 makes clear that even with original-plate access,
    microscopy cannot distinguish a brief flash from an intrinsic emulsion
    defect; an experienced, archive-side microscopist explicitly favored a
    defect interpretation for the 1950 nine. The flash-versus-defect crux
    encoded in TRN-C020 therefore stays unresolved: we have genuine, unusually
    sharp dots on the original emulsion, in a plate corner rich in blemishes,
    with no physically discriminating signature yet validated.

    Population-level arguments for a near-Earth, reflecting population
    (TRN-C021) are likewise inconclusive. The headline Earth-shadow deficit
    (TRN-C005) and nuclear-test timing (TRN-C006) are real patterns when one
    accepts the VASCO working catalog: Doherty and the ML study reproduce them,
    and Cann’s geomagnetic analyses close at least one simple environmental
    confound. But Watters et al. show that the spatial distribution and vetting
    of that catalog violate key assumptions; the deficits vanish or weaken in
    more carefully vetted subsets, and the nuclear association largely tracks
    the observatory schedule. Hayes’s fully independent extraction, with
    explicit exposure modeling, finds no significant nuclear effect at all. The
    consistent pattern is that ensemble signatures are highly sensitive to
    catalog construction: they persist under re-analysis of the same rows and
    often disappear when the rows themselves are rebuilt. That makes them weak
    foundations for asserting TRN-C021.

    The most promising new positive line is the Hamburg work: Busko’s detection
    of analogous single-exposure candidates on independent plates (TRN-C010) and
    especially the coma-aberration signature (TRN-C011) which, if validated,
    would be a direct indicator that some candidates are genuine light through
    the optics. However, these results are single-author preprints without blind
    validation; no confusion matrix against a labeled set of known flashes and
    known defects exists yet. As a result, they can only provisionally support
    TRN-C020 and do not yet compel a verdict.

    Climbing further, there is effectively no direct evidence for artificiality
    (TRN-C022) once the near-Earth rung is bracketed, and none at all that can
    presently discriminate human-made from extraterrestrial origin (TRN-C023).
    The Cann “dusty plasma” proposal illustrates that even if a near-Earth
    reflective population exists, natural mechanisms remain viable. Given that
    TRN-C020 itself is unresolved and that the strongest geometric evidence
    (TRN-C005) is lineage-bound and mixed, the case-level headline reduces to:
    some pre-Sputnik plates show real, sharp, one-off point-like features on the
    original emulsions, but current evidence cannot decide whether any were made
    by sky photons, much less by artificial near-Earth objects. The overall
    verdict is therefore unresolved, with the decisive progress likely to come
    from (1) blind validation of the coma discriminant; (2) preregistered,
    multi-pipeline ensemble tests on independently built catalogs; and (3)
    prospective multi-station imaging for any future fast transients.
claimAssessments:
  - claimId: TRN-C022
