      strongest opposing consideration is that the measurement was made on the
      digitized copy lineage and that, in SuperCOSMOS classification vocabulary,
      "sharper than stellar" is the known neighbourhood of spurious detections —
      a point about interpretation that does not undo the observation.
  - claimId: TRN-C003
    verdict: well_supported
