    reasoning: "No evidence record establishes artificial objects near Earth before
      October 1957. Every path runs through TRN-C020 and TRN-C021, both
      themselves unresolved, and the ensemble patterns offered in support are
      contested and lineage-bound. Cann's dusty-plasma reading, if anything,
      supplies a natural near-Earth alternative that would cut against
      artificiality even if the flashes were real. The strongest opposing
      consideration is the 1950 and 1952 multi-point events: if those marks were
      genuine simultaneous flashes, distant astrophysics is strained and
      something nearby is implied — but that premise is unproven, and nearby
      would still not mean manufactured."
