  synthesis: "The featured hypothesis fuses two questions the evidence must keep
    apart: whether any pre-Sputnik star-like marks were made by light entering a
    telescope, and whether any such light came from artificial objects near
    Earth. The lowest observational rungs are secure. The April 1950 nine exist
    as physical emulsion features, confirmed by the principal critics on glass
    copy material and recovered by an independent extraction pipeline; the July
    1952 triple is independently recovered and absent from deep modern imaging.
    Those facts are compatible with every live explanation and therefore do not
    climb. The conventional account is strongest as mechanism, not as a closed
    identification of any flagship event. Photographic emulsions manufacture
    star-like impostors; two decades of archival GRB searches never confidently
    confirmed one optical transient; Hambly and Blair reconstructed a shared
    intermediate-positive copying stage that collapses the cheap argument from
    two digitizations; the nine 1950 marks sit in the sharp morphological
    neighborhood their classifier assigns to spurious detections; and the
    Earth-shadow and nuclear-window correlations reproduce inside the VASCO
    working catalog while dissolving when the catalog is rebuilt or when a
    non-uniform spatial background is modelled. Steelmanned, this is a defect
    population whose ensemble patterns are properties of one unvalidated sample
    and of Palomar scheduling, not of the sky. Steelmanned the other way,
    several mundane closures have failed exactly where the fight is hardest. If
    the Yang and Villarroel registration holds, the nine 1950 sources are on the
    original telescope negative, so the shared-copy pathway cannot explain the
    canonical event; the 1952 triple is likewise not confined to copy material.
    Sub-second flashes are expected to look sharper than stars on a long
    exposure, which makes the morphology argument cut both ways until a
    calibration exists. Analogous appear-once candidates show up on Hamburg
    plates, which share no Palomar ancestor, and a subset is reported to carry
    off-axis coma — a telescope fingerprint chemistry should not know. Those
    positives are real and they are thin: the original-plate exam was not blind
    and cannot, by its authors' own statement, split a flash from an intrinsic
    emulsion flaw; the Hamburg search is preliminary and uncalibrated; the coma
    discriminant has not been blind-validated. Every rung above incident light
    is therefore conditional. Near-Earth geometry rests on a catalog-bound
    shadow deficit. Artificiality has no independent evidence at all, and even a
    demonstrated nearby reflector would still face a natural dusty-plasma
    alternative. Extraterrestrial origin is not presently reachable. The case
    verdict is unresolved because the discriminating measurement has not been
    made, not because the two sides are of equal weight on every point.
    Sensitivity: removing TRN-E022 (original-glass microscopy of the 1950 nine)
    would most change the structure, restoring the copy-defect account's full
    reach over the flagship event. The unresolved verdict survives that removal,
    because Hamburg, morphology ambiguity, and catalog-level failure to
    replicate would still leave incident light and artificiality unestablished.
    The verdict does not hang on one thread."
