  synthesis: >-
    The "Before Sputnik?" case evaluates an ambitious multi-tiered hypothesis:
    that isolated star-like marks on pre-1957 photographic plates represent real
    celestial optical flashes, and specifically glints from artificial
    near-Earth objects. The observational bedrock at the lowest tier is
    rock-solid. Star-like marks physically exist on surviving POSS-I copy plates
    and original negatives for the canonical April 1950 and July 1952 events
    (TRN-C001, TRN-C003, TRN-C024). Furthermore, independent source extraction
    confirms these marks are not artifacts of proprietary software or digitizer
    glitches (TRN-C004), and inspection of the original 1950 glass negative
    retires the intermediate copy-stage defect hypothesis for that specific
    event (TRN-C007).


    However, the critical physical crux—whether these marks were produced by
    real photons entering the telescope optics during exposure
    (TRN-C020)—remains unresolved and tilts toward mundane explanations. The
    1950 marks are systematically sharper than stellar images (TRN-C002). While
    proponents argue that sub-second optical flashes naturally avoid seeing and
    tracking blur, microscopic inspection by professional plate examiners
    attributes them to intrinsic emulsion flaws located near the plate corner
    where defects cluster (TRN-E024). The only empirical evidence indicating
    optical transmission through the telescope is the report of coma aberration
    on Hamburg Schmidt plates (TRN-C011, TRN-E014), but this observation is
    preliminary, single-authored, and unvalidated by blind testing.


    The upper rungs of the attribution ladder collapse under scrutiny. Proponent
    arguments that these events originate from near-Earth orbits (TRN-C021) or
    artificial pre-Sputnik objects (TRN-C022, TRN-C023) rely on ensemble
    statistics—the Earth-shadow deficit (TRN-C005) and nuclear-test correlations
    (TRN-C006). Independent reanalyses demonstrate that these signals are
    artifacts of the Palomar observing schedule, non-uniform spatial defect
    clustering, and stellar contamination (Watters 2026, Hayes 2026). When
    evaluated against independent pipelines and proper exposure denominators,
    the statistical signals disappear. Sensitivity analysis indicates that
    TRN-E014 (the Hamburg coma report) is the single record whose removal would
    most weaken the case; without it, there is no evidence whatsoever of optical
    transmission, reducing the hypothesis to contradicted. The current weakly
    supported verdict easily survives without it.
  steelman: The reported detection of off-axis comatic aberration matching
    telescope optical geometry in Hamburg transient candidates (TRN-E014),
    alongside the July 1952 triplet where point sources match stellar PSFs
    rather than sharp defects and vanish within an hour down to magnitude 25.5
