    as emulsion features on the original 1950 telescope negative at published
    positions. That combination retires scanner artifacts and, for the two
    canonical events, the shared-copy-defect route (TRN-C007 remains true as
    genealogy but loses its reach over the flagships). The middle rung is the
    crux, and the case's most important document honestly caps it: microscopy
    cannot distinguish a sub-second flash from an intrinsic emulsion defect, the
    microscopist who inspected the plate leaned defect, the sharp-profile
    observation is direction-ambiguous until someone calibrates flash profiles
    on period emulsions (TRN-R002), and the one physical discriminant on the
    table — the Hamburg coma signature — is an unvalidated single-author result
    on a different archive. So TRN-C020, whether light actually entered the
    telescope, is genuinely contested with substantive measurements on both
    sides, and the featured hypothesis inherits that contest. The top rungs fare
    worst: the ensemble correlations (shadow deficit, nuclear windows) reproduce
    only on the original, unvalidated 107,875-row catalog and dissolve or turn
    insignificant under independent extraction and schedule normalization
    (Hayes, Watters), while their defenses stay inside the same candidate
    lineage (Doherty, Bruehl ML). Nothing in the record bears directly on
    artificiality, let alone extraterrestrial origin, and Cann's dusty-plasma
