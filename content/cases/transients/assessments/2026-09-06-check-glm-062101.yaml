    reason to invoke artifacts. Steelmanning the skeptics: an expert
    microscopist, directed to the marks by Hambly, attributed them to emulsion
    defects in a corner field where defects congregate, and no validated
    positive discriminant exists anywhere in the record. Steelmanning the
