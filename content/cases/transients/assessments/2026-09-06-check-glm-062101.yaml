    readings survive the evidence as it stands; neither closes the other out.
    Verdict: mixed, with the honest summary being that the phenomenon is real
    plate features whose physical origin — flash or flaw — no supplied
    measurement yet determines."
  steelman: "The coma-aberration result (TRN-C011, TRN-E014) is the argument for
    the hypothesis this assessment cannot answer: off-axis coma is a property of
