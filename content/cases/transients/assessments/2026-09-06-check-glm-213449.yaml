      calibration or injection/recovery testing, so candidate rate against
      matched controls is unmeasured and "similar phenomenon" is
      indistinguishable from "similar defect susceptibility." The strongest
      opposing consideration is that old emulsions fail in similar ways
      everywhere, and nothing yet published excludes it.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: Busko 2026B reports the coma aberration pattern expected for off-axis
      point sources through the telescope optics on 532 Hamburg plate pairs
      (TRN-E014) — potentially the highest-value discriminant in the case. But
      it is a single-author preprint with an unvalidated classifier, no blind
      test against known defects or generated flashes,
