  synthesis: "The evidence in this record supports a three-tier structure that
    must not be collapsed. The bottom tier is solid: the two canonical
    multi-source events are real features of physical plate material — the April
    1950 nine are confirmed independently on Edinburgh copy glass (TRN-E002),
    recovered by a from-scratch pipeline (TRN-E008), and reported present on the
    original Caltech negative itself (TRN-E022); the July 1952 triple is
    peer-reviewed with deep non-detection follow-up (TRN-E007). The middle tier
    — that these marks are incident light recorded through the telescope
    (TRN-C020) — is genuinely unresolved, and the record's most probative
    document says so: the Yang & Villarroel microscopy manuscript itself states
    that microscopy cannot separate a sub-second flash from an intrinsic
    emulsion defect, and its own microscopist, directed to the objects by
    Hambly, leaned defect. The sharpest positive discriminant (Busko's coma
    signature) is unvalidated; the sharpest negative (Watters) shows the
    ensemble statistics dissolve under proper backgrounds and schedule
    normalization, while Doherty and Bruehl show they survive on the original
    catalog lineage — a split that tracks whose catalog rows are used, which is
    exactly the unvalidated step. The top tier — sunlight reflections from
    artificial objects near Earth before Sputnik (TRN-C021, C022, C023) — has no
    direct affirmative evidence anywhere in this record: the shadow deficit is
    contested, the nuclear correlation is direction-ambiguous (fallout
    contamination predicts it as well as glints), and Cann 2026c actively offers
    a natural near-Earth mechanism that would decouple any near-Earth population
    from artificiality. Steelmanning the skeptical side: the copy-defect
    genealogy, the classifier circularity objection, the schedule-driven timing,
    and the microscopist's defect attribution together make \"mundane plate
    pathology\" a coherent account of everything measured so far. Steelmanning
    the proponents: the canonical events are real, sharp, independently
    recovered, on original glass, and the one physical discriminant that could
    separate flash from flaw (coma) points toward incident light on an
    independent archive. Neither side's account currently explains all the
    measurements; the flash-profile calibration (TRN-R002), the blind coma
    validation (TRN-R003), and the catalog reconstruction (TRN-R004) are the
    identified experiments that would move this case, and none has been run.
    Unresolved is therefore a substantive finding, not a hedge: the record
    contains real measurements on both sides and a decisive unperformed test."
  steelman: "The coma-aberration result on Hamburg Doppel-Reflektor candidates
    (TRN-E014, TRN-C011) is the proponents' strongest unrebutted card: it is a
    proposed physical signature — directional off-axis aberration shaped by the
    telescope's own parabolic optics — that emulsion and copy artifacts should
    not naturally reproduce, observed on an independent telescope, emulsion
    stock, archive, and digitization lineage that the
    shared-intermediate-positive copy-defect mechanism (TRN-C007) cannot reach
    at all. Combined with the confirmed presence of all nine 1950 marks on the
    original Caltech emulsion (TRN-E022) and the sharp-profile physics argument
    (TRN-E006), an artifact-only account must currently explain, without
    calibration data, why marks on two unrelated optical systems carry
    through-the-optics morphology. This assessment does not answer that
    argument; it only notes the discriminant has never been blind-validated
    against a defect bestiary, which is precisely the unperformed experiment
    (TRN-R003) a proponent is entitled to demand."
