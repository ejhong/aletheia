  synthesis: >-
    The record establishes several low-rung observations without establishing
    the featured attribution. The April 1950 marks exist on surviving copy
    material, and the Yang–Villarroel microscopy manuscript reports all nine at
    the registered positions on the original telescope negative. Their unusually
    sharp profiles are also a reproducible measurement. The July 1952 triple is
    recovered by an independent extraction pipeline and appears on surviving
    copy material, although its original negative was not directly inspected.
    These findings exclude scanner or late copy-chain creation for the 1950
    marks, but they do not exclude defects intrinsic to the original emulsion.
    The microscopy manuscript explicitly acknowledges this ceiling, and its
    quoted microscopist regarded original-emulsion defects as a reasonable
    interpretation, especially given the plate-corner location. Thus, physical
    presence on the original plate is not equivalent to proof that light entered
    the telescope.

    The strongest case for incident light instead comes from the independent
    Hamburg archive. Candidates have been reported on plates from different
    telescopes and a separate emulsion and digitization lineage, and a subset
    reportedly carries the field-dependent coma expected from light passing
    through the telescope optics. That is a mechanistically relevant signature,
    not merely another catalog correlation. It provisionally supports the
    proposition that at least some disputed pre-Sputnik marks record incident
    light. The positive result nevertheless remains a single-author,
    unblind-validated preprint: no confusion matrix against the full defect
    population or deliberately generated flashes is supplied. The initial
    Hamburg search also lacks calibrated false-positive rates and matched
    archive controls. Consequently, the weak version has meaningful but
    provisional support rather than decisive confirmation, while the two
    canonical Palomar events remain individually ambiguous between flashes and
    original-emulsion flaws.

    The near-Earth case is substantially weaker. The reported Earth-shadow ratio
    and nuclear-window elevation are reproducible when analysts reuse the same
    approximately 107,875-row working catalog, and ML scoring suggests that
    visually obvious defects alone do not remove them. These are not independent
    samples. The shadow result depends on a disputed uniform background model,
    while the nuclear association becomes null under an independently extracted,
    exposure-adjusted analysis and is vulnerable to the Palomar schedule. The
    proponents reasonably object that the skeptical datasets or looser
    extraction may be underpowered or noisy, but that leaves a methodological
    dispute rather than a validated geometric distance indicator. Sharpness,
    alignments, and temporal disappearance do not measure distance, and even a
    real near-Earth population could be natural under the dusty-aggregate
    mechanism proposed in the record.

    Steelmanning the positive case, original-plate confirmation removes the
    once-prominent shared-copy explanation for the 1950 event; independent
    Hamburg candidates remove the Palomar genealogy entirely; coma offers a
    physical optical-path diagnostic; and the shadow, nuclear, ML, and
    geomagnetic patterns form a potentially coherent population-level picture.
    Steelmanning the negative case, every Palomar dot can still be an
    original-emulsion feature, the independent archive lacks defect-rate
    calibration, the coma discriminator has not been tested blind, and the
    ensemble findings share a contested catalog whose construction can create
    both spatial and temporal structure. No supplied record identifies an
    object, measures parallax, establishes reflected sunlight, or distinguishes
    natural from artificial reflectors. The low prior for unrecorded pre-Sputnik
    artificial objects—and especially extraterrestrial artifacts— reinforces
    caution, but the attribution verdict rests primarily on this evidentiary gap
    rather than on that prior.

    The single record whose removal would most change the assessment is
    TRN-E014, the Hamburg coma report. Without it, direct support for TRN-C020
    would fall from provisional to unresolved because the Palomar microscopy
    cannot distinguish photons from original-emulsion defects and the other
    Hamburg report supplies examples without a physical discriminator. The
    overall mixed verdict survives removal: the firmly established plate
    observations, competing defect evidence, and unsupported attribution ladder
    would still pull in different directions, although the positive
    incident-light branch would become markedly weaker.
  steelman: The reported Hamburg candidates carry the off-axis coma pattern
    predicted by the telescope's optics in an archive wholly independent of
    Palomar. Post-exposure emulsion marks have no demonstrated mechanism for
    reproducing that field-position-dependent optical signature, and the
    supplied record contains no blind defect-corpus test that rebuts it. If the
    pattern is validated, it establishes that at least a subset of these
    single-exposure detections arose from light passing through a telescope,
    leaving their short duration and physical source genuinely unexplained.
