  synthesis: >-
    The evidence establishes the lowest observational rungs much more securely
    than the featured attribution. The April 1950 marks exist at the reported
    coordinates, are absent from the comparison exposure and modern surveys, and
    have now been reported on the original telescope negative itself. Their
    unusual sharpness is also a robust measurement. The July 1952 triple is
    reproducible in the survey imagery and an independent extraction pipeline,
    although its original negative has not received the same direct examination.
    These findings rule out scanner-only explanations and, for the 1950 event,
    remove a defect introduced solely in the downstream copy chain. They do not
    establish that the marks were made by incident light: the original-plate
    manuscript expressly says microscopy cannot distinguish a brief flash from
    an intrinsic emulsion defect, while its microscopist considered defects
    reasonable and noted the defect-prone plate corner.

    The strongest evidence that at least some pre-Sputnik marks record light
    through a telescope instead comes from Hamburg, an independent archive and
    optical system. The reported field-dependent coma among a subset of
    candidates is a physically relevant discriminant that ordinary plate-surface
    blemishes should not naturally reproduce. Together with the preliminary
    recovery of analogous candidates on Hamburg plates, it provisionally
    supports the weak version of the hypothesis. Against that, the coma analysis
    is a single-author preprint without blind validation, calibrated confusion
    rates, or demonstrated exclusion of directionally asymmetric defects. The
    Hamburg work therefore does not yet validate the Palomar events and leaves
    the core result hanging on a promising but immature measurement.

    The population statistics offer, at most, weak support for a near-Earth
    interpretation. The raw Earth-shadow deficit and nuclear-window elevation
    are reproducible when analysts reuse the same 107,875-row catalog, and an
    internal ML score does not eliminate them. These are not independent
    samples: TRN-E010, TRN-E015, TRN-E019, and the Cann analyses inherit the
    same contested candidate lineage. Watters challenges the spatial null,
    source validation, and observing schedule, while the independently extracted
    Hayes catalog does not reproduce a significant nuclear effect after exposure
    modeling. Likewise, the morphology classifier and the sharp-profile
    measurement are not independent evidence because the former interprets the
    latter's features. Consequently, neither sunlight reflection at
    geosynchronous-like distance nor artificiality follows securely. A proposed
    natural dusty-plasma population further shows that even a genuine near-Earth
    signal would not uniquely imply technology, and nothing in the record
    specifically identifies extraterrestrial artifacts.

    The strongest case for the hypothesis is thus that original-emulsion
    multiple events coexist with apparently optics-imprinted candidates in an
    independent archive and suggestive geometric population patterns. The
    strongest contrary case is that every canonical dot remains compatible with
    an original-emulsion flaw, the only optical discriminant is unvalidated, and
    the ensemble effects depend on an unvalidated catalog and disputed null
    models. This warrants a mixed verdict: preliminary support for some
    light-through-the-telescope events, but no adequate support for the strong
    artificial-object attribution. The single evidence record whose removal
    would most change the verdict is TRN-E014. Without its coma result, the
    present mixed verdict would not survive; the case would shift to unresolved
    because no remaining record discriminates incident light from
    original-emulsion defects for any individual event.
