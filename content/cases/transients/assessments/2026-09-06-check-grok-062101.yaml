  synthesis: >-
    The featured hypothesis has two nested layers: (1) that at least some
    pre-Sputnik single-exposure star-like plate marks are genuine optical
    flashes that entered the telescope, and (2) the strong reading that those
    flashes are sunlight glints from artificial near-Earth objects. The supplied
    record settles several lower rungs while leaving the decisive
    optical-versus-defect distinction open, so the overall case remains
    unresolved rather than weakly supported or mixed in a balanced-statistical
    sense.

    Canonical detections are real features of surviving plate material.
    Independent physical inspection of the ROE glass copy (TRN-E002) and an
    independent extraction pipeline (TRN-E008) recover the April 1950 nine and
    the July 1952 triple; the Yang & Villarroel microscopy (TRN-E022) further
    places all nine 1950 marks on the original Caltech negative itself. That
    fact retires pure digitization or late-copy artifacts for the flagship
    events and qualifies the shared-intermediate-positive genealogy (TRN-C007 /
    TRN-E005) as a live concern only for the uninspected bulk catalog. Sharpness
    of the 1950 marks relative to stars is common ground (TRN-E003), yet the two
    camps offer incompatible readings—artifact morphology classifier (TRN-E004)
    versus the physical expectation that sub-second flashes should be sharper
    (TRN-E006)—with no emulsion flash-calibration curve yet in existence. The
    1952 triple, by contrast, shows near-stellar profiles, so the two canonical
    events are morphologically non-uniform.

    Population statistics (Earth-shadow deficit, nuclear-window elevation)
    replicate on the author-supplied 107 875-row working catalog under
    independent code (TRN-E010, TRN-E015) but vanish or become schedule-driven
    under independent extraction plus proper nulls (TRN-E009, TRN-E011). The
    Watters–Villarroel exchange (TRN-E011/E012) is a genuine methodological
    standoff over dataset definition and power, not a resolution; both sides
    argue over unvalidated rows. Hamburg candidates (TRN-E013) and the reported
    coma signature (TRN-E014) constitute the strongest positive development
    outside the Palomar copy lineage, yet remain single-author preprints without
    blind validation against the defect bestiary or controlled flashes.
    Microscopy itself cannot finish the job: the same manuscript that places the
    marks on the original emulsion states that single-source morphology cannot
    separate a short flash from an intrinsic emulsion defect and quotes its
    microscopist leaning defect (TRN-E024).

    Steelmanning the positive side: simultaneous multi-source events on one
    plate, recovery by independent pipelines, presence on original glass, and an
    optics-matched coma pattern are collectively harder for a pure random-defect
    model than critics sometimes allow, and the geomagnetic and nuclear
    associations survive some internal robustness checks. Steelmanning the
    negative side: ordinary emulsions are known to produce star-like spurious
    marks, the copy genealogy supplies a concrete pathway for bulk
    contamination, the working catalog has never been externally reconstructed
    from raw scans, schedule and spatial-heterogeneity confounders explain the
    headline correlations once the rows are rebuilt, and the only eye that has
    looked at the physical 1950 emulsion under a microscope defaulted to defect.
    Because the optical-flash claim (TRN-C020) is the load-bearing hinge and
    remains observationally open after the original-plate test, both the weak
    and strong versions of the featured hypothesis stay unresolved. Removal of
    the microscopy package would drop the case further toward copy-artifact
    territory; removal of the coma report would leave almost no positive
    physical discriminant. Neither direction is closed by the present record.
  steelman: The unrebutted report that a subset of Hamburg Schmidt candidates
    display the directional coma aberration pattern expected for off-axis point
    sources that passed through the telescope optics—a signature that ordinary
    plate-surface or emulsion defects have not been shown to reproduce—remains
    the strongest positive physical discriminant the assessment cannot yet
    dismiss or calibrate away.
