  synthesis: >-
    The case turns on a ladder from plate marks to optical flashes through the
    telescope to near-Earth reflectors to artificial (and ultimately
    extraterrestrial) objects before Sputnik. The bottom rungs are now firm.
    Independent physical inspection of glass copies (TRN-E002) and, more
    decisively, microscopy of the original 1950 Caltech negative plus
    co-presence checks for the 1952 event (TRN-E022) establish that the nine
    April 1950 sources and the July 1952 triple are real emulsion features at
    the published positions, present on original material rather than only on
    shared-intermediate copies or scans. Independent extraction pipelines
    recover the canonical events and a large fraction of the published catalog
    (TRN-E008), so the detections are not software-specific. Profile sharpness
    of the 1950 nine is a shared measurement (TRN-E003). The copy-genealogy
    mechanism (TRN-C007/TRN-E005) is real and correctly dissolves naive
    two-digitization arguments for uninspected candidates, yet it no longer
    reaches the two flagship events once they sit on the originals (TRN-E023).

    The crux claim TRN-C020—that at least some marks record light that entered
    the telescope during exposure—remains unresolved. Presence on the original
    emulsion eliminates post-exposure copying and digitization routes but does
    not distinguish a sub-second flash from an intrinsic emulsion defect; the
    microscopy manuscript itself states the two produce qualitatively similar
    single-source signatures and quotes its own microscopist leaning defect
    (TRN-E024). Sharpness is direction-ambiguous: it is expected both for short
    flashes (TRN-E006) and for certain artifacts (TRN-E004). The
    highest-leverage positive discriminant is the reported coma aberration on
    independent Hamburg plates (TRN-C011/TRN-E014), a signature plate-surface
    defects should not naturally reproduce; yet it is a single-author preprint
    without blind validation against known defects or controlled flashes, and it
    does not yet validate any Palomar event. Population statistics that could
    tip the balance—the Earth-shadow deficit and nuclear-window elevation—are
    contested at the dataset-definition layer. They reproduce on the
    author-supplied ~107k working catalog (TRN-E010, TRN-E015) but vanish or
    become schedule-driven under independent extraction with exposure modeling
    (TRN-E009) and under spatial-null reanalysis of related public sets
    (TRN-E011); the rebuttal (TRN-E012) defends power without supplying external
    ground truth. Preliminary Hamburg candidates (TRN-C010) break the Palomar
    copy lineage but lack rate calibration against matched controls.

    Higher rungs inherit the unresolved status of TRN-C020. Even if some
    fraction are genuine through-telescope flashes, the step to
    geosynchronous-like near-Earth reflectors (TRN-C021) rests on the disputed
    shadow geometry and temporal correlations plus a candidate natural
    dusty-plasma mechanism (TRN-E020) that would satisfy near-Earth origin
    without artificial objects. Artificial pre-Sputnik objects (TRN-C022) and
    especially extraterrestrial technological artifacts (TRN-C023) have no
    positive discriminating evidence in the record; they remain speculative
    extrapolations. Sensitivity is high to TRN-E022/E024 (the original-plate
    microscopy package): removing it re-opens the copy-defect escape for the
    canonical events and weakens the entire ladder; even with it, the verdict
    stays unresolved because flash-versus-defect is explicitly beyond
    microscopy. The evidence therefore warrants unresolved for the featured
    hypothesis as a whole: the weak version (genuine optical flashes) is open
    and testable but not yet settled; the strong version (artificial near-Earth
    objects) is unsupported. Open agenda items—blind coma validation,
    flash-profile emulsion calibration, preregistered multi-pipeline shadow and
    nuclear tests, and multi-station simultaneous imaging—exist precisely
    because the present record cannot close the question.
  steelman: The coma-aberration pattern reported on independent Hamburg Schmidt
    plates (TRN-E014) is a physical signature expected for off-axis point
    sources that passed through telescope optics and that surface emulsion or
    copy defects should not naturally reproduce; if blind-validated, it would
    establish genuine through-telescope flashes on a separate archive, plate
    stock, and digitization lineage, independent of every Palomar copy-genealogy
    and catalog-vetting dispute.
