    nine sources on the original glass. That is where progress stops, and the
    proponents' own manuscript says so (TRN-E024): microscopy cannot separate a
    sub-second flash from an intrinsic emulsion defect at the single-source
    level, and the microscopist who actually looked — directed to the objects by
