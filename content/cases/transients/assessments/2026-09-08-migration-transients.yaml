  synthesis: "The case remains bottom-heavy: the observation rung is as secure as photographic evidence permits, while everything above it is argued rather than measured. The nine 1950 marks are physical emulsion features confirmed by critics on the Edinburgh copy (TRN-E002), recovered by an independent pipeline (TRN-E008), and reported present on the original Caltech glass (TRN-E022). That last record removed the copy-chain defect route (TRN-C007, TRN-E005) as an explanation for the two flagship events (TRN-E023), but did not settle the crux: TRN-C020 has merely narrowed from 'original or copy?' to 'flash or flaw in the original emulsion?', and the manuscript's own authors concede microscopy cannot decide that, with their microscopist leaning defect (TRN-E024). Sharpness (TRN-C002) is credible but weakly diagnostic — both camps read the same measurement (TRN-E003, TRN-E004, TRN-E006) their own way, with no controlled flash calibration. The ensemble claims split cleanly by replication type: they survive reanalysis of the same author-supplied rows (TRN-E010, TRN-E015, TRN-E019) and fail independent extraction and a corrected null (TRN-E009, TRN-E011) — a pattern that indicts the catalog, not the sky. The attribution rung inherits all of this; TRN-E020's natural icy-aggregate route means even a vindicated near-Earth geometry would not select the artificial branch, and nothing bears on extraterrestrial origin at all. Sensitivity: the single record whose removal would most change the case is TRN-E022 — without it, TRN-C024 collapses to untested and the copy-chain hypothesis regains its reach over the canonical events. The case verdict of unresolved survives its removal; the case does not hang on one thread, though TRN-C024 does, and that is stated at the claim level."
