caseAssessment:
  verdict: unresolved
  whatIsClaimed: At least some single-exposure, star-like detections on pre-Sputnik photographic plates are genuine optical flashes recorded through the telescope — and, on the strong version of the hypothesis, sunlight reflections from artificial objects near Earth before October 1957.
  whereDisagreementLives: "Not over whether the marks exist — critics physically confirmed the canonical nine on surviving glass — but one rung up: whether any substantial, prespecified subset was made by light entering the telescope during the original exposures rather than introduced afterwards in the emulsion, the copying chain, or digitization; and whether any ensemble signal (Earth-shadow deficit, nuclear-test timing) survives independent catalog construction rather than merely independent re-analysis of the same contested rows."
  whatWouldSettleIt: Demonstrate, blind and independently, that canonical pre-Sputnik candidates are present on the original telescope negatives with optical signatures that distinguish incident light from plate defects; then reproduce the Earth-shadow deficit or another orbital signature in an independently extracted candidate population. The first result would establish real flashes; the second would begin to establish a near-Earth reflective population. Artificiality would still require more.
  bestConventionalExplanation: "Photographic archives manufacture star-like marks without any sky event: emulsion flaws, development chemistry, handling damage, and — critically for POSS-I — defects introduced on the shared intermediate positive from which both major digitizations descend, so that a single copying flaw appears \"independently\" in two modern datasets. Two decades of archival searches for gamma-ray-burst flashes found such star-like defects routinely and never confidently confirmed one archival optical transient. The ensemble correlations, on this account, are properties of an unvalidated working catalog and the observatory's scheduling, not of the sky; and the candidate population's spatial statistics (edge concentration, geometric clusters) look like plate and scan artifacts. The account's main unpaid debt is quantitative: the star-like defect rate per copying stage has never been measured, and the Hamburg candidates with reported optical-aberration signatures sit outside its simplest form."
  components: []
  researchPriority:
    level: medium
    reason: Blind examination of the original POSS-I negatives (TRN-R001) is archive-scale work that would settle the copy-defect question decisively — but a null mostly closes the file, so expected yield is asymmetric.
