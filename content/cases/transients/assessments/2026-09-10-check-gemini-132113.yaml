  synthesis: >-
    The "Before Sputnik" hypothesis posits that star-like transient marks on
    1950s photographic sky-survey plates record real optical flashes from
    reflective objects—potentially artificial or natural—in near-Earth orbit
    prior to the space age. Structurally, the evidentiary foundation separates
    into three distinct tiers: physical plate reality, optical provenance, and
    orbital attribution.

    On the bottom tier (physical plate reality), the evidence is robust.
    Independent microscopic inspections (Hambly & Blair 2024; Yang & Villarroel
    2026) and automated pipeline re-extractions (Hayes 2026) establish that the
    canonical April 1950 nine-transient event and the July 1952 triple transient
    are physical features present on surviving glass copy plates and on the
    original telescope negatives themselves. This physical confirmation
    eliminates modern digitization artifacts and downstream copy-stage flaws
    (TRN-C007) for the primary canonical events.

    However, the case encounters severe friction when climbing to optical
    provenance (TRN-C020). The sharpness of the 1950 detections—all displaying
    profiles significantly more concentrated than standard stellar images—is
    interpreted by skeptics as indicative of emulsion flaws (Hambly & Blair
    2024) and supported by the Caltech archive microscopist who evaluated them
    as probable plate-corner defects (Yang & Villarroel 2026). Proponents
    counter that sub-second optical flashes naturally bypass tracking blur,
    producing sharper profiles (Villarroel et al. 2025). The strongest positive
    indicator of celestial photons is Busko's (2026b) detection of optical coma
    aberrations matching telescope geometry on Hamburg plates, though this
    finding remains an unvalidated preprint.

    The top tier—near-Earth orbital attribution (TRN-C021, TRN-C022)—suffers the
    greatest empirical collapse. The headline population statistics that
    initially motivated near-Earth glints dissolve under rigorous scrutiny.
    Watters et al. (2026) showed that the purported Earth-shadow deficit in the
    ~107,875-object catalog is an artifact of an erroneous uniform background
    null applied to edge-clustered plate defects, while the nuclear-testing
    correlation is substantially explained by the Palomar observing calendar and
    fails to replicate in independently extracted catalogs (Hayes 2026). Without
    the shadow deficit or verified orbital parallax, the inference that these
    marks represent sunlight glints from objects near Earth lacks empirical
    support.

    In sensitivity terms, the single evidence record whose removal would most
    alter this assessment is Watters et al. 2026 (TRN-E011). Without Watters's
    demonstration that the Earth-shadow deficit and nuclear correlation are
    methodological and scheduling artifacts, the ensemble statistics would stand
    provisionally replicated (via Doherty 2026 and Bruehl et al. 2026),
    elevating the near-Earth hypothesis to a "mixed" verdict. With TRN-E011
    included, the attribution ladder breaks decisively above the plate-emulsion
    level, leaving the overall case weakly supported.
  steelman: The strongest argument for the featured hypothesis this assessment
    does not answer is the reported presence of off-axis optical coma
    aberrations matching telescope mirror geometry in Hamburg transient
