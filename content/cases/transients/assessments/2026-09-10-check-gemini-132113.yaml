      mirror geometry, a signature that photographic defects should not
      physically mimic.
    confidence: moderate
  - claimId: TRN-C101
    verdict: established
    reasoning: Decades of historical plate archive research, including searches for
      optical counterparts to gamma-ray bursts, demonstrate that emulsion flaws,
      chemical spots, dust, and handling damage routinely create star-like point
      images on single plates. Independent pipeline processing by Hayes (2026)
      generated 2.85 million raw candidates across POSS-I, underscoring the
      overwhelming background of spurious defect detections before strict
      filtering. The strongest opposing consideration is that multi-parameter
      morphological filters can eliminate extended or irregular blemishes,
      though microscopic pinhole defects remain difficult to distinguish from
      point sources.
    confidence: high
  - claimId: TRN-C007
    verdict: established
    reasoning: Historical documentation and plate genealogy show that the DSS and
      SuperCOSMOS scans of POSS-I were made from glass copy negatives printed
      from a shared intermediate glass positive (Hambly & Blair 2024).
      Consequently, any physical blemish or dust particle introduced onto that
      intermediate positive necessarily replicates in both modern digital
      datasets. The strongest opposing consideration is that this shared
      mechanism does not apply to the 1950 and 1952 canonical events, which have
      now been verified on original telescope negatives (Yang & Villarroel
      2026).
    confidence: high
  - claimId: TRN-C001
    verdict: established
    reasoning: The physical presence of nine star-like point sources on surviving
      glass copy material of field E0070 from 12 April 1950 is verified by both
      proponent (Villarroel et al. 2021) and independent skeptical teams (Hambly
      & Blair 2024). Their complete absence on an overlapping exposure six days
      later and in deep modern CCD imaging is common ground. The strongest
      opposing consideration relates to whether they represent celestial photons
      or chemical emulsion flaws, but their physical existence on the glass
      plate is undisputed.
    confidence: high
  - claimId: TRN-C024
    verdict: provisionally_supported
    reasoning: Microscopic examination of the original 12 April 1950 POSS-I negative
      at the Caltech archives confirmed that all nine cataloged sources are
      physically present in the emulsion at their published coordinates (Yang &
      Villarroel 2026). While this finding settles the copy-stage artifact
      hypothesis for this event, the result is reported in an unreviewed
      preprint conducted by the proponent team without blinded re-registration.
      The strongest opposing consideration is the lack of independent, blinded
      outside verification of the original plate coordinates.
    confidence: moderate
  - claimId: TRN-C002
    verdict: established
    reasoning: SuperCOSMOS profile measurements by Hambly & Blair (2024) confirmed
      that all nine April 1950 sources have profile statistics falling on the
      extreme sharp side of the plate's stellar distribution (-3 < eta < -1),
      with a joint probability of order 10^-9 under a stellar PSF. Both camps
      accept this empirical measurement, disputing only whether sharpness
      reflects non-optical plate flaws or sub-second flashes that did not
      integrate tracking jitter. The strongest opposing consideration is that
      seeing and PSF width vary radially across wide Schmidt plates, though the
      statistical extremity of these nine profiles relative to local stars
      remains clear.
    confidence: high
  - claimId: TRN-C102
    verdict: well_supported
    reasoning: Theoretical optical physics implies that long photographic exposures
      accumulate seeing blur, guiding errors, and telescope tracking jitter over
      tens of minutes. An unresolved optical flash lasting less than a second
      experiences only an instantaneous speckle pattern and zero guiding
      integration, meaning it should naturally produce a sharper, rounder
      photographic profile than a long-exposure star image. The strongest
      opposing consideration is that non-linear photographic reciprocity failure
      and light scattering in thick emulsions during intense sub-second
      exposures have not been empirically calibrated against period emulsions.
    confidence: moderate
  - claimId: TRN-C003
    verdict: established
    reasoning: The 19 July 1952 triple transient is peer-reviewed and verified on
      POSS-I survey material, showing three ~16th magnitude point sources within
      10 arcseconds that vanished on an exposure taken 50 minutes later and
      remain absent in modern imaging down to magnitude 25.5 (Solano et al.
      2024). Independent pipeline processing independently recovered all three
      sources (Hayes 2026). The strongest opposing consideration is that the
      original glass negative has not been examined under a microscope by an
      independent team to rule out micro-defects.
    confidence: high
  - claimId: TRN-C004
    verdict: well_supported
    reasoning: Hayes (2026) independently built an automated source-extraction and
      cross-matching pipeline that successfully recovered eight of the nine 1950
      sources, all three 1952 sources, and 63.9% of Solano's 5,399 published
      transient candidates. This demonstrates that candidate extraction does not
      depend on proprietary software or candidate lists from the original
      research group. The strongest opposing consideration is that Hayes's
      uncalibrated full sweep yielded 2.85 million total candidates, showing
      that candidate retention is highly sensitive to detection thresholds.
    confidence: high
  - claimId: TRN-C005
    verdict: mixed
    reasoning: Independent statistical re-analysis of the author-supplied
      107,875-object catalog reproduced the reported raw deficit of candidates
      within the geometric Earth shadow (0.46% observed vs ~1.4% geometric
      expectation; Doherty 2026). However, Watters et al. (2026) showed that the
      geometric null model fails because candidate distributions are heavily
      clustered near plate edges and corners; deriving a spatially corrected
      null distribution eliminates the statistical significance of the deficit.
      The strongest opposing consideration is that ML filtering for
      high-confidence real candidates was reported by Bruehl et al. (2026) to
      preserve and strengthen the shadow deficit.
    confidence: moderate
  - claimId: TRN-C006
    verdict: mixed
    reasoning: The correlation between transient candidate counts and atmospheric
