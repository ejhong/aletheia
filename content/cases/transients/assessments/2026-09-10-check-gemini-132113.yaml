      opposing consideration is that machine-learning scoring of candidate
      likelihood by Bruehl et al. (2026) found the shadow deficit persisted
      among candidates rated most likely to be real.
    confidence: moderate
  - claimId: TRN-C020
    verdict: unresolved
    reasoning: Microscopic inspection confirmed that the nine canonical 1950 marks
