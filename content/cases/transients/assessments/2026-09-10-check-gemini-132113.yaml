      better than known high-energy astrophysical transients.
    confidence: high
  - claimId: TRN-C021
    verdict: weakly_supported
    reasoning: The inference that transient candidates were produced by sunlight
      reflected from objects physically near Earth rested primarily on the
      reported deficit of candidates within the modeled Earth umbral shadow.
      Methodological audit by Watters et al. (2026) demonstrated that when
