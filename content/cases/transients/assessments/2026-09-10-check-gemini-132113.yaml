      and Hayes (2026) found no statistically significant correlation in an
      independently extracted candidate catalog. The strongest opposing
      consideration is that Bayesian hierarchical modeling accounting for
      temporal autocorrelation still finds a modest marginal association with
      nuclear test timing (Sinkkoinen 2026).
    confidence: moderate
  - claimId: TRN-C103
