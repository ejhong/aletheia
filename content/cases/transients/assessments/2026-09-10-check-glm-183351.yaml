  synthesis: "The case has a clean bottom rung and a genuinely open middle. That
    the marks are real features of plate material is established: the critics'
    own physical inspection of the Edinburgh glass copies (TRN-E002) and the
    proponents' microscopy of the original Caltech negative (TRN-E022) agree the
    nine 1950 sources exist as emulsion features, and a from-scratch independent
    pipeline (TRN-E008) recovers both canonical events and most of the published
    catalog. That the marks were made by light entering the telescope during the
    exposure (TRN-C020) — the rung on which everything above it depends — is
    unresolved. The pivotal sharpness measurement (TRN-E003) is common ground,
    but one camp reads it as an artifact signature (TRN-E004, itself vulnerable
    to a training-circularity objection) and the other as flash physics
    (TRN-E006), with no calibration separating the distributions; the coma
    signature (TRN-E014) is the most diagnostic positive result in the case but
    has never been blind-validated; and the proponents' own manuscript concedes
    single-source microscopy cannot classify the features while quoting its
    microscopist leaning toward emulsion defects (TRN-E024). The ensemble
    statistics that would carry the near-Earth attribution replicate under
    independent code on the original rows (TRN-E010) and persist under ML
    artifact scoring (TRN-E015), but fail under independent extraction with
    exposure modeling (TRN-E009) and under Watters' corrected null and
    observing-schedule normalization (TRN-E011); the proponents' rebuttal
    defends the power of a working catalog that was never validated against star
    contamination and scan artifacts, so the deadlock is real rather than
    rhetorical. Above the near-Earth rung the ladder does not earn its climbs:
    artificiality rests on weak qualifying records, and the extraterrestrial
    interpretation is conceded unfalsifiable by its own advocates (TRN-E083).
    Steeling the artifact side: the copy-genealogy argument dissolved the
    two-digitization robustness claim and, for the ensemble catalog, remains
    fully live; Hayes's 500-fold extraction dependence shows the population is a
    construct of vetting choices; and the nuclear and geomagnetic correlations
    have never survived an independently built catalog. Steeling the pro side:
    the shadow deficit survives independent-code replication and ML filtering,
    one measured confounder (airglow) was tested and closed, and Hamburg yields
    narrow-profile, coma-bearing candidates beyond the reach of the copy-defect
    mechanism — a conjunction no single published artifact account explains
    end-to-end. Equally, no single-mechanism account, mundane or exotic,
    explains why the 1950 nine are sharply non-stellar while the 1952 triple
    looks stellar. Unresolved is the warranted verdict; the decisive tests
    (blind coma validation, independent catalog reconstruction, preregistered
    shadow analysis) are well defined and within reach."
  steelman: "The Earth-shadow deficit is the strongest unanswered line: it was
    reproduced with independently written analysis code (0.46% of sources
    in-shadow against a ~1.4% geometric expectation), it persists and
    strengthens among ML-scored most-likely-real transients, it survives the one
    measured confounder-closure test performed in this case (plate-sensitivity
    invariance across geomagnetic storms on 12,510 reference exposures), and it
    comes with a declination excess near the celestial equator of exactly the
    kind a near-Earth belt population predicts. Independently of Palomar, the
    Hamburg plates — a different telescope, emulsion stock, archive, and
    digitization lineage that the copy-defect mechanism cannot touch — yield
    analogous narrow-profile candidates, a subset showing the coma signature
    expected of light that actually passed through optics. No skeptical record
    in this ledger explains that conjunction: Watters' null addresses dataset
    construction on related datasets, Hayes's null addresses the nuclear
    correlation with a dilution-limited noise-dominated catalog, and neither
    touches Hamburg at all. A proponent could rightly ask what single mundane
    mechanism simultaneously produces a geometric shadow deficit, coma-bearing
    non-Palomar candidates, and sharper-than-stellar profiles — and no such
    account has been published."
