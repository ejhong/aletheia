      plate-aware controls. This supports the local computational result, not
      the conclusion that the cells locate real orbiting objects. The strongest
      opposing consideration is that the analysis uses the same contested
      catalog and a single assumed altitude, with several large excesses
      supplied by very few plates and projected locations changing when altitude
      changes.
    confidence: moderate
  - claimId: TRN-C122
    verdict: provisionally_supported
    reasoning: TRN-E079 directly confirms that a random control sample of 897
      positions produced three clusters with an average silhouette of 0.50,
      meeting the authors' stated threshold. This validates at least one
      instance of the claim and shows that the threshold alone does not
      discriminate transient structure from the survey footprint. The strongest
      opposing consideration is that only three control draws were performed and
      no null distribution was generated, so the full asserted 0.50–0.60 range
      and its generality are only sparsely supported.
    confidence: moderate
  - claimId: TRN-C117
    verdict: weakly_supported
    reasoning: TRN-E038 directly states the proposed
      millimetre-versus-centimetre-to- metre size discrepancy, but the larger
      sizes are outputs of assumed altitudes, reflectivities, flash durations,
      and specular geometry rather than measurements. The strongest opposing
      consideration is TRN-E020's mechanism in which millimetre grains aggregate
      into metre-scale reflective structures, meaning particle size and
      aggregate optical size need not be the same quantity. Because that
      mechanism was not directly modelled, exclusion of dusty plasma is
      premature.
    confidence: low
  - claimId: TRN-C118
    verdict: weakly_supported
    reasoning: TRN-E072 confirms that the authors' selected toy-model comparison
      assigns all five listed features simultaneously only to their NHI
      scenario. This is a residual-fit argument over a hand-selected model set,
      not a discriminating test, and several inputs are themselves mixed or
      unresolved. The strongest opposing consideration is TRN-E073's
      acknowledgment of omitted natural phenomena, reinforced by TRN-E020's
      concrete natural near-Earth alternative and the artifact explanations for
      the catalog-level features.
    confidence: low
