  - claimId: TRN-C022
    verdict: unresolved
    reasoning: No evidence record demonstrates artificial hardware near Earth before
      October 1957; the claim inherits dependence on unsettled lower rungs
      (light origin and near-Earth distance) that themselves lack secure
      support. Cann's dusty-plasma micrometeoroid mechanism (TRN-E020) supplies
      a natural alternative that would satisfy near-Earth glints without
      artificial objects if the lower rungs held. Strongest opposing
      consideration is simply the total absence of positive identification or
      independent orbital evidence for any pre-Sputnik artificial reflector
      population.
    confidence: high
  - claimId: TRN-C023
    verdict: presently_untestable
    reasoning: Extraterrestrial technological origin is a further existence claim
      stacked on TRN-C022 and is not addressed by any measurement, spectrum,
      trajectory, or multi-station parallax in the ledger. Even a confirmed
      artificial pre-Sputnik reflector would leave terrestrial secret technology
      versus extraterrestrial origin underdetermined by the available plate
      data. Strongest opposing consideration is that the claim is definitionally
      beyond the resolving power of single-archive photographic morphology and
      contested ensemble correlations.
    confidence: high
  - claimId: TRN-C021
    verdict: unresolved
    reasoning: "Near-Earth (geosynchronous-like) sunlight glints are the
      interpretive step that would convert real optical flashes into the
      featured hypothesis, but the geometric shadow-deficit evidence is
      contested: it appears on the author working catalog and some internal
