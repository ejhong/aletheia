    confidence: moderate
  - claimId: TRN-C101
    verdict: well_supported
    reasoning: Decades of archival optical-transient searches (summarized in Watters
      et al., TRN-E011) failed to yield confident real events, Hambly & Blair
      directly document emulsion holes, bubbles, and scratch-like marks on the
      relevant copy plates (TRN-E002), and the VASCO workflow itself removed
      thousands of artifacts while still describing the working sample as
      false-positive-rich (TRN-E016). Rates need not be huge to contaminate
      single-exposure searches that define candidates by modern non-detection.
      Strongest opposing consideration is that defect rate alone does not prove
      any specific canonical mark is a defect.
    confidence: high
  - claimId: TRN-C007
    verdict: established
    reasoning: "Hambly & Blair reconstruct the atlas contact-printing chain:
      intermediate glass positive from each original negative, then
      second-generation copy negatives from that positive, with DSS and
      SuperCOSMOS scanning independent copies that share the positive ancestor
      (TRN-E005). This is plate-archive fact, not interpretation. Strongest
      opposing consideration is TRN-E023's qualification that presence on the
      original negative removes this pathway for the two inspected flagship
      events — which limits reach, not the genealogy claim as stated."
    confidence: high
  - claimId: TRN-C001
    verdict: established
    reasoning: Independent physical inspection of the ROE glass copy confirms nine
