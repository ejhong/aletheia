  synthesis: "The featured hypothesis — that star-like pre-Sputnik plate
    transients record real optical flashes from objects near Earth — sits on a
    five-rung attribution ladder. Only the bottom rungs are secured by the
    evidence records. The April 1950 nine and July 1952 triple are real emulsion
    features at the published positions on surviving plate material (TRN-C001,
    TRN-C003), independently recovered by a from-scratch pipeline (TRN-C004),
    and, for the 1950 event, present on the original Caltech telescope negative
    itself (TRN-C024, TRN-E022). The DSS/SuperCOSMOS
    shared-intermediate-positive genealogy is established (TRN-C007, TRN-E005),
    so dual-digitization agreement never proved sky origin; the microscopy
    result retires that pathway only for the two inspected flagship events.
    Sharpness of the nine relative to stars is common ground (TRN-C002,
    TRN-E003), but both artifact classifiers (TRN-E004) and flash-physics
    arguments (TRN-E006, TRN-C102) claim it, and no period-emulsion flash
    calibration exists. Ordinary star-like emulsion and copy defects are real
    contaminants at non-negligible rates (TRN-C101), and the microscopist who
    saw the 1950 original leaned defect while noting plate-corner location
    (TRN-E024). That same record states the decisive ceiling: single-source
    microscopy cannot separate a sub-second flash from an intrinsic emulsion
    flaw. The crux claim TRN-C020 (light entered the telescope) is therefore
    unresolved. Hamburg candidates and reported coma (TRN-C010, TRN-C011) are
    the strongest independent positive line, because they sit outside the
    Palomar copy chain and because directional optical aberration is a genuine
    physical discriminant in principle — yet both remain single-author
    preliminary preprints without blind validation against defect corpora or
    controlled flashes. Ensemble statistics that would climb the ladder to
    near-Earth origin (shadow deficit TRN-C005; nuclear-window TRN-C006; Kp and
    alignments TRN-C103/C104) replicate on the author-supplied ~107,875-row
    working catalog and survive some internal ML artifact scoring, but collapse
    or lose significance under independent extraction with exposure modeling
    (TRN-E009), proper spatial nulls and observation-day normalization
    (TRN-E011), and dataset-definition audits showing heavy star-proximity
    contamination. Higher rungs — artificial pre-Sputnik objects (TRN-C022) and
    extraterrestrial technology (TRN-C023) — have no positive supporting
    measurements; a natural dusty-plasma near-Earth mechanism has even been
    proposed from within the same catalog lineage (TRN-E020). Steelmanning the
    positive side: presence on originals plus multi-source simultaneity plus
    preliminary off-archive coma is non-trivial and not fully dissolved by
    copy-defect talk. Steelmanning the negative side: unvalidated working
    catalogs, schedule-driven timing, morphology consistent with known artifact
    classes, and an expert eye on the physical plate favoring defects leave the
    light-versus-flaw and near-Earth steps unproven. The case therefore does not
    warrant affirming or denying the featured near-Earth-flash hypothesis; the
    decisive remaining tests are blind coma validation, flash-profile
    calibration on historical emulsions, preregistered multi-pipeline shadow and
    nuclear analyses on independently rebuilt catalogs, and prospective
    multi-station imaging. Sensitivity: removing TRN-E022 would reopen full
    copy-stage explanations for the canonical events and tilt the case more
    strongly toward artifact, but the overall unresolved verdict on the featured
    hypothesis would survive because TRN-C020 would remain open even more
    clearly and the ensemble correlations would stay contested."
  steelman: "Busko's Hamburg coma-aberration report remains the strongest
    unanswered positive: transient candidates on an independent telescope,
    emulsion, and archive exhibit the directional off-axis PSF signature
    expected only for light that passed through the optics, a pattern surface
    blemishes and post-exposure emulsion defects should not naturally reproduce,
    and no blind-validated counterexample corpus has yet closed that
    discriminant."
