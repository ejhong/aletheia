    confidence: moderate
  - claimId: TRN-C020
    verdict: unresolved
    reasoning: Original-negative microscopy places the 1950 nine on the emulsion
      that was in the telescope (TRN-E022), ruling out pure digitization and
      shared-copy-only origins for those events, and Hamburg coma (TRN-E014) is
      a physical signature of light through optics if validated. The same
      microscopy record states that flash and intrinsic emulsion defect produce
      qualitatively similar single-source signatures, and the inspecting
      microscopist leaned defect. Strongest opposing consideration is that
      ceiling plus the Hambly morphology classifier grouping the marks with
