  synthesis: "The featured hypothesis asks whether pre-Sputnik POSS-I star-like
    single-exposure marks record real optical flashes from near-Earth objects.
    The evidence ladder must be climbed rung by rung. On the observation rung
    the canonical events are real features of surviving plate material: the
    April 1950 nine are confirmed on Edinburgh glass copies (Hambly & Blair)
    and, per the Yang & Villarroel microscopy manuscript, on the original
    Caltech telescope negative itself; the July 1952 triple is recovered on copy
    material and in the original survey digitization; independent extraction
    (Hayes) recovers eight of nine and three of three without VASCO software.
    Profile sharpness of the 1950 nine is a shared measurement, not a dispute.
    The plate-copy genealogy (shared intermediate positive for DSS and
    SuperCOSMOS) is established and correctly dissolves naive “two
    digitizations” robustness for the bulk catalog, yet it no longer explains
    the two flagship events if the original-negative registration holds. That
    leaves the crux, TRN-C020: light that entered the telescope versus an
    intrinsic emulsion defect on the original. Microscopy cannot separate those
    two signatures at the single-source level; the inspecting microscopist
    leaned defect; no flash-profile calibration on period emulsions exists; and
    the Hamburg coma-aberration discriminant, while the strongest positive
    physical line, remains a single-author unvalidated preprint confined to a
    different archive. Population statistics (Earth-shadow deficit,
    nuclear-window relative risk, Kp anticorrelation, hotspots, alignments)
    reproduce on the author- supplied ~107,875-row working catalog and
    strengthen under the group’s own ML filter, yet fail or dissolve under
    Watters’ background-null and schedule-normalization critique and under
    Hayes’ independent extraction with exposure modeling. Dataset definition,
    not mere coding, is the contested step. Consequently the near-Earth glint
    interpretation (TRN-C021) remains conditional on an unsettled optical-origin
    claim and on contested ensemble geometry; artificial pre-Sputnik objects
    (TRN-C022) and extraterrestrial technology (TRN-C023) have no positive
    discriminating evidence and the latter is conceded unfalsifiable by
    proponents. The case is therefore unresolved at the hypothesis level:
    genuine multi-source events exist on original emulsion, mundane copy-stage
    and digitization artifacts are insufficient for the flagships, yet
    flash-versus-defect and near-Earth-versus-plate-chemistry are both still
    open. A verdict of weakly_supported would over-credit the contested catalog
    statistics; contradicted would ignore the original-plate and
    independent-archive positives. Sensitivity is high to the Yang microscopy
    package and to Watters’ null-distribution work; neither alone collapses the
    case, but together they keep the central rung open. Decisive next
    measurements are blinded original- plate re-inspection, flash-profile
    calibration, blind coma validation, and preregistered multi-pipeline shadow
    and nuclear tests on independently extracted catalogs."
  steelman: Hamburg Schmidt candidates exhibit the off-axis coma pattern expected
    only for light that passed through the telescope optics—an optical
    discriminant plate-surface defects should not reproduce—and the same class
    of sharp single-exposure marks appears on an independent emulsion,
    telescope, and digitization lineage that the POSS-I copy- genealogy
    mechanism cannot reach; if that coma signature survives blind validation
    against known defect classes, the light-through- optics rung is established
    outside Palomar and the near-Earth glint reading of the shadow geometry
    becomes the leading residual explanation for a real photon population.
