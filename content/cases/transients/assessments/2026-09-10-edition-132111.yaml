  synthesis: "The case is bottom-heavy: the observation rung is as secure as photographic evidence permits, and everything above it is argued rather than measured. The nine 1950 marks are physical emulsion features confirmed by the critics on the Edinburgh copy (TRN-E002), recovered by an independent pipeline (TRN-E008), and reported present on the original Caltech glass (TRN-E022). That last record removes the copy-chain defect route (TRN-C007, TRN-E005) as an explanation for the two flagship events (TRN-E023) if its registration survives review, but it does not settle the crux: TRN-C020 narrows from 'original or copy?' to 'flash or flaw in the original emulsion?', and the manuscript's authors concede microscopy cannot decide that, with their own microscopist leaning defect (TRN-E024). The conventional mechanism (TRN-C101) is well supported as a pathway by records linked to neighbouring claims but has no measured base rate. Sharpness (TRN-C002) is credible and weakly diagnostic: both camps read the same measurement (TRN-E003, TRN-E004, TRN-E006) their own way, no controlled flash calibration exists, and the 1952 triple's star-like profile (TRN-E007) spoils a uniform story for either side. The ensemble claims split cleanly by replication type — they survive reanalysis of the author-supplied rows (TRN-E010, TRN-E015, TRN-E019) and fail independent extraction and a corrected null (TRN-E009, TRN-E011) — a pattern that indicts the catalog rather than the sky. The only physical discriminant on the table is the Hamburg coma signature (TRN-E014), unvalidated. The attribution rung inherits all of this; TRN-E020's natural icy-aggregate route means even a vindicated near-Earth geometry would not select the artificial branch, and nothing bears on extraterrestrial origin. Sensitivity: no single record's removal changes the case verdict, which is robustly unresolved; the record whose removal most changes the shape of the case is TRN-E022 — without it TRN-C024 collapses to untested and the copy-chain hypothesis regains full reach over the canonical events — with TRN-E011 second, since without it the two ensemble claims would rise from mixed to provisionally supported."
  steelman: "The strongest argument for the thesis that this assessment does not answer is the direction of the machine-learning stratification (TRN-E015): among the 107,875 candidates, the Earth-shadow deficit is largest in the subset scored most likely to be real, and the highest-probability candidates are the ones most concentrated in nuclear windows. A pure-defect population has no reason to know where Earth's shadow falls, and no reason for its likelier-real members to know it better than its likelier-fake members; the artifact account predicts the opposite gradient or none. Add that the phenomenon recurs, with the same narrow profiles, on Hamburg plates that share no ancestor with Palomar's (TRN-E013), that a subset there carries the off-axis coma pattern only light through the optics should produce (TRN-E014), and that both canonical multiplets are on original or original-digitization material (TRN-E022) rather than born in copying — and the proponents can say that every test yet applied that could have gone against them has gone their way, while the negative results (TRN-E009, TRN-E011) concern catalogs the critics themselves did not validate. The assessment's reply — that the ML labels are expert judgments on the same disputed imagery and that the whole analysis stays inside the contested catalog — is a provenance objection, not an explanation of the gradient. That gradient stands unexplained."
