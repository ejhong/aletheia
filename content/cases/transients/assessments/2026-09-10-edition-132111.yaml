caseAssessment:
  verdict: unresolved
  whatIsClaimed: At least some single-exposure, star-like detections on pre-Sputnik photographic plates — including nine on one April 1950 exposure and three on one July 1952 exposure — are genuine optical flashes recorded through the telescope; on the strong version of the hypothesis, they are sunlight reflections from artificial objects near Earth before October 1957.
  whereDisagreementLives: "Not over whether the marks exist — critics physically confirmed the canonical nine on surviving glass, and the proponents report them on the original negative — but one rung up: whether any mark was made by light entering the telescope during the original exposure rather than being a flaw born in the emulsion, a question per-source microscopy has now been shown unable to answer. Above that, whether any ensemble signal (Earth-shadow deficit, nuclear-test timing, geomagnetic dependence, linear alignments) survives independent catalog construction rather than merely independent re-analysis of the same contested rows; and, if any near-Earth signal survives, whether the objects are manufactured or natural."
  whatWouldSettleIt: Blind-validate a physical incident-light discriminant — the coma-aberration signature, or a calibrated flash-profile curve on period emulsion — and apply it to the canonical Palomar marks; that would establish or exclude real flashes. Then reproduce the Earth-shadow deficit in candidate catalogs built independently from the scans under a preregistered, spatially heterogeneous null; that would begin to establish a sunlit near-Earth population. Artificiality would still require a behavioural or physical signature the ledger does not yet contain, and extraterrestrial origin would require more than that.
  bestConventionalExplanation: "Photographic archives manufacture star-like marks without any sky event: emulsion holes, bubbles and development spots, handling and copying damage, and — critically for POSS-I — defects on the shared intermediate positive from which both major digitizations descend, so that one copying flaw appears 'independently' in two modern datasets. The critics' own inspection found such blemishes on both copy plates and 'transients' on the comparison plate too; the catalog pipeline removed thousands of artifacts and still describes its working sample as heavily contaminated; the microscopist who examined the original 1950 negative found the marks un-star-like and in a defect-prone plate corner, and judged emulsion defects a reasonable attribution. On this account the ensemble correlations are properties of an unvalidated working catalog and the Palomar observing schedule, the candidate population's spatial statistics (edge and corner concentration, geometric clusters and voids) are the signature of plate and scan artifacts, and the sharpness of the nine is the sharpness of defects. Its unpaid debts are quantitative and specific: the star-like defect rate per copying stage has never been measured; it has no ready explanation for the machine-learning gradient in the shadow deficit; and the Hamburg candidates with reported coma signatures sit outside its simplest form."
