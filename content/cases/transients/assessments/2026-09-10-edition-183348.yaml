  synthesis: "The case is bottom-heavy. The observation rung is as secure as photographic evidence permits: the nine 1950 marks are physical emulsion features confirmed by the critics on the Edinburgh copy (TRN-E002), recovered by an independent pipeline (TRN-E008), and reported present on the original Caltech glass (TRN-E022), which removes the copy-chain defect route (TRN-C007, TRN-E005) as an explanation for the two flagship events (TRN-E023). It does not settle the crux: TRN-C020 has narrowed from 'original or copy?' to 'flash or flaw in the original emulsion?', and the microscopy authors concede their method cannot decide that, with their own microscopist leaning defect (TRN-E024). Sharpness (TRN-C002) is credible and weakly diagnostic — TRN-E003, TRN-E004 and TRN-E006 read the same measurement three ways with no calibration. The ensemble claims split cleanly by replication type: they survive reanalysis of the author-supplied rows (TRN-E010, TRN-E015, TRN-E019, TRN-E025, TRN-E052) and fail independent extraction and a corrected null (TRN-E009, TRN-E011); the new modelling preprint concedes part of the background objection (TRN-E051) and the hotspot preprint's own negative control meets its non-randomness criterion (TRN-E079). This pattern indicts the catalog, not yet the sky. The attribution rung inherits all of it: TRN-E074 assumes rather than tests near-Earth origin; TRN-E020's natural-aggregate route means even a vindicated geometry would not select the artificial branch, and TRN-E038 excludes it only through a selection-biased size model (TRN-E062/E063); the proponents themselves call the intelligence reading unfalsifiable (TRN-E083). Sensitivity: the single record whose removal would most change the case is TRN-E011 — it is the only strong record against the shadow deficit, and without it TRN-C005 rises to provisionally supported and TRN-C021 with it, moving the near-Earth version of the hypothesis from unresolved toward weakly supported while leaving TRN-C020 untouched. Runner-up is TRN-E022, whose removal collapses TRN-C024 to untested and restores the copy-chain hypothesis's reach over the canonical events. The case verdict survives the removal of either; no single thread carries it."
  steelman: Nine sharp, round marks lie within ten arcminutes of one another on one fifty-minute exposure, on the original telescope negative, and not on the overlapping plate taken six days later; a second event puts three sixteenth-magnitude points within ten arcseconds that vanish within the hour and never return to magnitude 25.5 — a ten-magnitude drop — and the most isolated of the three has a profile indistinguishable from a star (TRN-E007). The defect account offers no measured base rate for spatially clustered, star-like flaws on original negatives (TRN-R007 unfilled), and it must explain why the ensemble signals strengthen rather than weaken under a classifier trained to remove defects (TRN-E015, TRN-E052/E053), why plate sensitivity is invariant to the geomagnetic activity that the candidate rate tracks (TRN-E017), and why an independent archive with no shared ancestry shows candidates with narrow profiles and the coma signature of light through the optics (TRN-E013, TRN-E014). No single defect mechanism in the ledger accounts for clustering, sharpness, filter-strengthening and cross-archive recurrence together. This assessment does not answer that conjunction; it holds that each element is individually undercut (unblinded, uncalibrated, same-catalog, unvalidated) and that a conjunction of undercut elements is not yet evidence.
