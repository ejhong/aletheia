caseAssessment:
  verdict: unresolved
  whatIsClaimed: At least some single-exposure, star-like detections on pre-Sputnik photographic plates are genuine optical flashes recorded through the telescope — and, on the strong version of the hypothesis, sunlight reflections from artificial objects near Earth before October 1957, with an extraterrestrial origin proposed as the only toy model fitting all reported features.
  whereDisagreementLives: "Not over whether the marks exist — critics physically confirmed the canonical nine on copy glass and the proponents report them on the original negative — but one rung up: whether any mark was made by light entering the telescope rather than by a flaw in the emulsion (microscopy cannot tell, by the proponents' own account); whether any ensemble signal (Earth-shadow deficit, nuclear-test timing, Earth-projected hotspots) survives independent catalog construction and a non-uniform background null rather than merely independent re-analysis of the same contested rows; and, if the near-Earth geometry held, whether anything distinguishes artificial reflectors from natural ones."
  whatWouldSettleIt: Blind-validate a physical incident-light discriminant (the coma-aberration signature) against known defects and deliberately produced flashes, and calibrate flash profiles on period emulsion, so that individual marks can be classified as light or flaw; then reproduce the Earth-shadow deficit, or another orbital signature, in an independently extracted candidate population under a preregistered null that models the plate background as observed. The first would establish real flashes; the second would begin to establish a near-Earth reflective population. Artificiality would need an independent size or structure argument not built on a bright-source-excluded catalog; extraterrestrial origin has no test on the table.
  bestConventionalExplanation: "Photographic archives manufacture star-like marks without any sky event: emulsion flaws, development chemistry, handling damage and — for POSS-I specifically — defects introduced on the shared intermediate positive from which both major digitizations descend, so that a single copying flaw appears 'independently' in two modern datasets. The critics' own inspection found emulsion holes, bubbles and scratch-like marks on the copy plates and appear-once detections on the neighbouring field; the microscopist who examined the original 1950 negative judged emulsion defects a reasonable attribution and noted the field lies in a plate corner where defects congregate. The ensemble correlations, on this account, are properties of an unvalidated working catalog — 91% of whose rows were earlier flagged as lying within 5 arcseconds of catalogued stars — together with the Palomar observing schedule and a plate background that rises toward corners and edges; they reproduce when the rows are reused and vanish when the catalog is rebuilt. Hotspot and clustering results project per-plate defect rates onto whatever Earth cell a fixed-altitude geometry assigns them, and the paper's own random controls meet its clustering criterion. The account's unpaid debts: no measured base rate for star-like defects per copying stage or on original emulsion, and no reach over an independent archive whose candidates reportedly carry the optical signature of light through the telescope."
  components:
