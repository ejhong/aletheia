  synthesis: "The featured hypothesis asks whether at least some star-like
    single-exposure marks on pre-Sputnik POSS-I plates record real optical
    flashes from near-Earth objects. The evidence records establish the lowest
    observational rungs with high reliability while leaving the decisive
    physical-origin and attribution rungs unresolved, so the case as a whole
    remains unresolved rather than weakly supported or mixed. Physical presence
    of the two canonical multiple-source events is now secure: the nine April
    1950 marks exist on surviving glass copies (E002) and, per the Yang &
    Villarroel microscopy preprint, on the original telescope negative itself
    (E022), while the July 1952 triple is recovered on copy material and in the
    original survey digitization (E007, E022). Independent source-extraction
    pipelines recover both events and a large fraction of the published
    candidate list from the same digitized lineage (E008), and profile
    statistics confirm the 1950 nine are systematically sharper than stars of
    comparable brightness (E003). The plate-copy genealogy is likewise
    established (E005): DSS and SuperCOSMOS descend from a shared intermediate
    positive, so common-mode copy defects can appear in both modern datasets.
    These facts retire scanner artifacts and pure software ghosts for the
    flagship events and make the marks real emulsion features. They do not,
    however, establish that the features were produced by light that entered the
    telescope. The same microscopy manuscript that places the nine on the
    original glass explicitly states that single-source morphology cannot
    distinguish a sub-second flash from an intrinsic emulsion defect (E024), and
    the inspecting microscopist leaned toward defects. Sharpness is therefore
    ambiguous: it is consistent both with short flashes (E006 physics argument)
    and with the artifact class assigned by a random-forest classifier trained
    on unmatched detections (E004). Ordinary emulsion and copying defects are
    known to generate isolated star-like points at non-negligible rates (E011
    and the broader GRB-era archival literature summarized therein), so
    contamination remains a live null. Population statistics that could favor a
    near-Earth reflective population—the Earth-shadow deficit and nuclear-test
    window excess—are reproduced on the author-supplied 107875-row working
    catalog (E010, E015) yet disappear or become insignificant under independent
    extraction with exposure modeling (E009) or after proper nulls that reject
    spatial uniformity (E011). The Watters reanalysis further shows that the
    bulk of the working-catalog rows lie near catalog stars and that the nuclear
    correlation tracks the Palomar observing schedule. Proponent rebuttals
    defend catalog power (E012) but do not supply external validation or a
    preregistered multi-pipeline reconstruction. Preliminary Hamburg results
    (E013, E014) offer the only material outside the Palomar copy chain and
    report coma consistent with off-axis optics, yet remain single-author
    preprints without blind validation against known defects or controlled
    flashes; they cannot yet carry the case. Higher rungs—artificial objects,
    extraterrestrial artifacts, specific altitude shells, NHI-only toy-model
    fit—are either presently untestable or rest on the unresolved lower rungs
    and contested catalog. Because the hypothesis requires both
    light-through-optics (C020) and near-Earth origin (C021), and because
    neither has been secured against the defect null by a decisive,
    independently replicated measurement, the ledger warrants unresolved.
    General priors on photographic-plate defect rates and the absence of any
    pre-Sputnik artificial population calibrate skepticism but are not required
    for the verdict; the internal contradictions among the supplied evidence
    records suffice. Sensitivity is high to the single most comprehensive
    undermining record (E011): without it the ensemble statistics would look
    provisionally supportive and the case verdict would shift toward
    weakly_supported; with it the statistics remain contested and the origin
    question stays open. The microscopy ceiling (E024) is nearly as
    load-bearing: it converts what was framed as a decisive original-plate test
    into a non-discriminating one."
  steelman: The unvalidated but directionally positive Hamburg coma-aberration
    signature on an independent telescope, emulsion, and digitization lineage
    (E014), which if confirmed by blind testing against controlled flashes and
    the full defect bestiary would supply a physical discriminant for
    light-through-optics that the Palomar originals themselves cannot provide
    and that no defect model currently reproduces.
