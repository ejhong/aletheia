      unresolved status of C020 and C021. Natural near-Earth mechanisms (E020)
      remain unexcluded even if flashes are real, and the nuclear and shadow
      correlations are contested. Strongest opposing consideration is the
      complete absence of any independent dynamical or multi-station
      confirmation that would be required to elevate reflective debris above
      emulsion defects.
