  synthesis: >-
    The hypothesis needs two rungs that the ledger keeps apart. The first is
    that light entered the telescope (C020). The second is that the light was
    sunlight reflected from objects near Earth (C021). The records secure the
    observation rung beneath both and decide neither, so the case is unresolved.

    The observation rung is solid. The critics confirmed the nine 1950 marks on
    the Edinburgh copy (E002). An independent pipeline recovers eight of them
    and the whole 1952 triple (E008). An unreviewed manuscript places all nine
    on the original negative (E022). C020 is unresolved as a finding, not as a
    default. That same manuscript concedes that microscopy cannot tell a flash
    from an original-emulsion defect, and the one outside eye leaned toward
    defect (E024). Sharpness is ambiguous without a flash calibration (E003,
    E006). Coma is unvalidated and has been reported only on Hamburg plates
    (E014).

    C021 rests on the Earth-shadow deficit (C005). The deficit reproduces on the
    working rows (E010, E015). It loses significance under Watters's null, which
    allows for an uneven background (E011). The proponents concede spatial
    effects (E051), and their shell fits are poor (E055). The analogous
    nuclear-window signal vanished in the one independently extracted catalog
    that models exposure (E009). The deficit has never faced that test. Its
    umbra also lies near the ecliptic, where a depletion of transients is
    separately reported (E030). That overlap is a confound nobody has separated
    (my inference).

    For the hypothesis: - The deficit has the required sign and survives a
    centre-of-plate cut. - Nine marks share one ~10-arcminute region, where
    Hayes's pipeline finds ~0.2 false positives
      per control field.
    - Coma, the right kind of test, came back positive.

    Against the hypothesis: - The 1950 field is a defect-prone plate corner, and
    the neighbouring plate has comparable
      marks (E002, E024).
    - Ensemble signals that vanish under independent extraction behave like
    catalog properties. - At least 91% of ensemble features came from a set
    earlier removed for proximity to catalog
      stars (E011).
    - Defects are ubiquitous on plates (a prior).

    Above C021: - Artificiality has no discriminating evidence (C022). -
    Extraterrestrial origin is conceded unfalsifiable by its proponents (C023,
    E083). - The size-based exclusion of the natural dusty-plasma alternative
    fails on the ledger's own
      record of that mechanism (C117, E020).
    That nothing human orbited before October 1957 is background, not a finding
    of these records.

    Sensitivity: removing E011 would most change the verdict. The deficit would
    then face only the proponents' own concession (E051). A defect cannot know
    where Earth's shadow falls, so an uncontested deficit would bear on C020 and
    C021 together. The case would likely move to weakly_supported. The verdict
    does not survive intact without E011: on the near-Earth rung it hangs
    substantially on that one record.
  steelman: "Reflectors inside Earth's umbra cannot glint, so the shadow deficit
    is a directional prediction made in advance. The working catalog deviates
    exactly that way, threefold: 0.46% of candidates fall in the umbral cone
    against ~1.4% expected. Independent code reproduces this. A centre-of-plate
    subset that sidesteps the edge excess gives the same result (0.45%). The
    deficit is larger among ML-favoured candidates (E010, E015, E052). An uneven
    background explains why such a deviation might not be significant, but not
    why it points into the shadow. My ecliptic point names a possible channel,
    not a mechanism. No record identifies a process that would empty the umbra.
    The test that would settle it has never been run: the deficit on an
    independently extracted catalog, against a preregistered null that allows
    for an uneven background (TRN-R005)."
