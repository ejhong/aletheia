  synthesis: "The case verdict is unresolved: the marks are real plate features, but nothing yet decides whether any was made by light through the telescope rather than by an emulsion flaw. The observation level is secure. The 1950 nine are confirmed by the critics on the Edinburgh copy (TRN-E002, on TRN-C001) and recovered by an independent pipeline (TRN-E008, on TRN-C004). They are reported on the original Caltech negative (TRN-E022, on TRN-C024), which removes the copy-chain route of TRN-C007 (TRN-E005) for the two flagship events (TRN-E023). The crux TRN-C020 has narrowed from original-or-copy to flash-or-flaw. The microscopy authors concede their method cannot decide it, and their microscopist leaned defect (TRN-E024). Sharpness (TRN-C002, TRN-E003) is a sound measurement read two ways (TRN-E004, TRN-E006) without calibration. The two mechanisms that would decide the crux, flash sharpness (TRN-C102) and defect rates (TRN-C101), are both held on their anchors alone. The coma signature (TRN-E014, on TRN-C011) is the one physical discriminant, and it is unvalidated. The population claims split by replication type. They survive reanalysis of the author-supplied rows (TRN-E010 and TRN-E015 on TRN-C005 and TRN-C006; TRN-E052 on TRN-C129). They fail an independent extraction and a corrected null (TRN-E009 on TRN-C006; TRN-E011 on both). The modelling preprint concedes part of the background objection (TRN-E051, on TRN-C005), and the hotspot paper's random controls meet its clustering criterion (TRN-E079, on TRN-C122). That pattern indicts the catalog, not yet the sky. Attribution inherits all of it. TRN-E074 assumes near-Earth origin, and TRN-E020 offers a natural route sharing the geometry (both on TRN-C021). TRN-E038's exclusion of that route (TRN-C117) rests on a size inference its authors call biased by bright-source exclusion (TRN-C111; TRN-E062, TRN-E063). The proponents call the intelligence reading unfalsifiable (TRN-E083). The single record whose removal would most change the case is TRN-E011, the only strong record against the shadow deficit. Without it TRN-C005 would rise to provisionally supported and TRN-C021 with it, leaving TRN-C020 untouched; the case verdict would survive."
  steelman: Nine sharp, round marks lie within ten arcminutes of one another on one fifty-minute exposure. They are reported on the original telescope negative (TRN-E022) and are absent from the overlapping plate six days later (TRN-E002). A second event puts three sixteenth-magnitude points within ten arcseconds that vanish within the hour and never return to magnitude 25.5 (TRN-E007). The proponents read the nine marks' sharpness as what a sub-second flash should leave on a long exposure (TRN-E006). The defect account has no measured rate for clustered, star-like flaws on original negatives (TRN-C101 is held on its anchor). The defect account must also explain several things together. The shadow and nuclear-window signals persist and grow under a classifier trained to remove defects (TRN-E015; TRN-E052 and TRN-E053 on TRN-C129). One environmental route to a spurious timing pattern tests negative (TRN-E017, on TRN-C006). An archive with no shared ancestry shows narrow-profiled candidates (TRN-E013) that carry, on the author's reading, the coma signature of light through the optics (TRN-E014). No single defect mechanism in the record accounts for clustering, sharpness, filter-strengthening and cross-archive recurrence together. This assessment does not answer that conjunction. It holds that each element is separately undercut — unblinded, uncalibrated, same-catalog, unvalidated — and that a conjunction of undercut elements is not yet evidence.
