caseAssessment:
  verdict: unresolved
  whatIsClaimed: Some one-time, star-like marks on 1950s Palomar survey plates were real flashes of light through the telescope, and in the strong version, sunlight glints off artificial objects orbiting before Sputnik. Proponents go further and propose an extraterrestrial origin, which they themselves call unfalsifiable.
  whereDisagreementLives: The dispute is whether any mark was made by light entering the telescope rather than by a flaw in the emulsion — something microscopy cannot decide and no calibration yet measures. Both sides accept the marks exist; the flagship nine are confirmed on copy glass and reported on the original negative. The population patterns — fewer candidates in Earth's shadow, timing near nuclear tests, clusters over Earth — hold on the proponents' own catalog, and the two tested independently did not survive. If the near-Earth geometry held, nothing yet separates artificial reflectors from natural ones.
  whatWouldSettleIt: Blind-test the coma signature — the distortion telescope optics stamp on real light — against known defects and deliberate flashes, and calibrate how flashes look on period emulsion. Those would decide light versus flaw. Then reproduce the Earth-shadow shortfall on an independently built catalog, under a preregistered null that models the plate background as it is. Artificial origin would need a size or structure argument not built on a catalog that excluded bright sources. Extraterrestrial origin has no test on the table.
  bestConventionalExplanation: "Photographic archives make star-like marks without any sky event: emulsion flaws, development chemistry and handling damage. For this survey, defects on the shared intermediate positive from which both major digitizations descend mean one copying flaw appears “independently” twice. The critics found emulsion holes, bubbles and scratch-like marks on the copy plates, and appear-once detections on the neighbouring field. The microscopist who examined the original 1950 negative judged emulsion defects a reasonable attribution, in a plate corner where defects gather. On this account, the population patterns belong to an unvalidated working catalog, at least 91% of whose rows were earlier set aside as lying near catalogued stars. The observing schedule and a plate background that rises toward corners and edges do the rest. The patterns reproduce when the rows are reused and vanish when the catalog is rebuilt. The account's unpaid debts: no measured rate for star-like defects, and no reach over an independent archive whose candidates reportedly carry the optical signature of real light."
