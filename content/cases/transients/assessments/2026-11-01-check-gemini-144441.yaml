  synthesis: >-
    The "Before Sputnik" hypothesis posits that star-like transient point
    sources on 1950s photographic survey plates record optical flashes from
    reflective objects in orbit near Earth before the launch of Sputnik 1.
    Evaluating this claim requires an attribution ladder: (1) physical marks
    exist on plate media; (2) marks were produced by optical photons entering
    the telescope optics; (3) the light originated from objects near Earth; and
    (4) the objects were artificial or extraterrestrial.

    The proponent case presents genuine, intriguing anomalies. The canonical
    April 1950 nine-transient cluster and July 1952 triple transient are
    physically confirmed on surviving glass plates and original telescope
    negatives, absent in subsequent exposures and deep modern CCD imaging. Their
    recovery across independent digitizations and automated pipelines confirms
    they are not modern scanning or software artifacts. Furthermore, sub-second
    flashes naturally bypass minutes of seeing, wind-shake, and tracking errors,
    providing a physical mechanism for why the 1950 marks are systematically
    sharper than normal stars. Crucially, preliminary evaluations of an
    independent archive (Hamburg Observatory) report transient candidates
    displaying off-axis optical coma aberration—a signature expected of real
    light entering telescope optics that surface defects cannot naturally
    reproduce.

    However, the skeptical counter-case undermines every higher rung of the
    ladder. Star-like emulsion and copying flaws are endemic on historical
    plates, occurring at rates sufficient to contaminate single-exposure
    catalogs. When an experienced microscopist inspected the original April 1950
    plate, the candidates—situated in a defect-prone corner—were judged to be
    emulsion flaws, with microscopy inherently unable to separate sub-second
    flashes from chemical blemishes. At the ensemble level, the statistical
    arguments disintegrate: the Earth-shadow deficit disappears when replacing a
    uniform geometric assumption with an empirical null accounting for spatial
    plate heterogeneity, the nuclear-test temporal correlation vanishes under
    independent candidate extraction and tracking of Palomar's observing
    schedule, and spatial clustering silhouette scores are matched by random
    controls.

    Sensitivity: The single evidence record whose removal would most change this
    case verdict is TRN-E014 (optical coma aberration in Hamburg plates). If
    TRN-E014 is removed, the case loses its only affirmative empirical evidence
    for optical photons passing through telescope optics, pushing the overall
    verdict toward contradicted. With TRN-E014 retained, the possibility of an
    optical origin remains viable, leaving the featured hypothesis weakly
    supported.
  steelman: The presence of off-axis optical coma aberration matching telescope
    optics on fast transient candidates in Hamburg Observatory plates, which
    plate-surface chemistry and emulsion flaws cannot naturally replicate.
