  synthesis: >-
    The evidence securely establishes a phenomenon at the lowest observational
    rung but does not securely establish the featured near-Earth interpretation.
    The April 1950 marks are not software inventions or scanner artifacts:
    independent inspection confirmed them on copy material, and TRN-E022 reports
    all nine on the original telescope negative. The July 1952 triple is also
    reproducible in independent source extraction and remains absent from deep
    later imaging. These findings remove several easy dismissals, but they do
    not distinguish photons recorded during exposure from defects intrinsic to
    the original emulsion. The microscopy manuscript explicitly says that it
    cannot make that distinction, and its microscopist regarded emulsion defects
    as a reasonable attribution.

    The strongest case for incident light is independent of Palomar. Hamburg
    plates contain analogous candidates, and TRN-E014 reports the
    field-dependent coma expected when light passes through the telescope
    optics. If that discriminant survives blind tests against known defects, it
    would establish that at least some archival candidates are optical events.
    At present it is a single-author, unvalidated result and does not validate
    any Palomar mark. Conversely, the defect alternative has measured substance
    rather than being a generic possibility: laboratory studies found
    substantial rates of star-like faults on other emulsions, and more than one
    hundred look-alikes were found in the neighboring Palomar copy-plate
    overlap. Those rates do not directly measure original POSS-I 103a-E
    negatives, but they make contamination a demonstrated search problem.

    The best evidence for physical proximity to Earth is the Earth-shadow
    deficit. Its stated count was reproduced with independent code on the exact
    working catalog and strengthened after internal artifact scoring. The
    opposing evidence is equally structural: the catalog lacks physical
    validation, its spatial background is heterogeneous, and TRN-E011 reports
    that a more appropriate null removes the deficit. That critique used related
    rather than identical datasets, so it does not close the dispute. The
    nuclear-window association likewise reproduces on the supplied rows but
    becomes null under independent extraction and exposure modeling. Alignment
    and hotspot findings are genuine reported analyses, yet their survey-wide
    trials factors, projection-altitude dependence, and plate-aware nulls remain
    unresolved.

    Accordingly, the record is mixed: real physical marks are established,
    incident-light flashes are provisionally indicated outside Palomar, and a
    near-Earth population has suggestive but catalog-dependent evidence. Nothing
    here establishes artificial objects, still less extraterrestrial artifacts.
    The sensitivity record is TRN-E011. Removing it would most strengthen the
    near-Earth case because the exact-catalog shadow replication would lose its
    principal proper-null challenge, but the mixed verdict survives: intrinsic
    emulsion defects, the unvalidated Hamburg discriminator, and the absence of
    parallax or independently extracted shadow replication would remain.
  steelman: The strongest unanswered pro-hypothesis point is that the exact
    107,875-row catalog's Earth-shadow deficit was reproduced with independent
    code and strengthened after artifact scoring, whereas the published
    no-deficit analysis used related rather than identical datasets. No record
    applies a preregistered, plate-heterogeneous shadow null to an independently
    extracted catalog, so the principal geometric prediction specific to
    sunlight-reflecting near-Earth sources has not received its decisive test.
