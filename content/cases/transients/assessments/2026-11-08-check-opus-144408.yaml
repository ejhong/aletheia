  synthesis: >-
    The ledger settles the bottom of the ladder and nothing above it. The nine
    April 1950 marks are physical features of surviving plate material. The
    critics' own inspection, an independent pipeline and the discovery report
    all confirm them (C001, established). A single unblinded preprint places
    them on the original negative (C024, provisionally supported). The July 1952
    triple is an equally well documented observation (C003). If the
    original-plate registration holds, the copy-chain mechanism (C007), true as
    genealogy, no longer reaches the flagship events. The crux then narrows to
    C020: was each mark a flash, or a flaw in the original emulsion?

    At that crux the per-object evidence is exhausted. Both readings predict
    non-recurrence, sharpness (C002) and presence on the original. The
    microscopy paper says microscopy cannot separate the two, and it reports
    that its own microscopist leaned toward defects (E024). Star-like flaws that
    pass automated filters occur in quantity on Palomar copies and on an
    independent Hamburg archive (C101). The one per-object test for light
    passing through the optics is Busko's coma signature (C011). It comes from
    another telescope, rests on eleven visually identified events and has not
    been blind-validated.

    The hypothesis therefore stands or falls on population statistics, and these
    split along a revealing line. Analyses that keep the 107,875 working rows
    reproduce the Earth-shadow deficit (Doherty's independent code, the group's
    ML scoring). They also reproduce the nuclear-window association (the same
    two, plus Sinkkoinen's Bayesian model). Analyses that change the rows or the
    null lose these effects. The only independent extraction loses the nuclear
    signal under an exposure model (E009). A heterogeneity-corrected background
    on related datasets loses both (E011). The successes replicate arithmetic on
    one catalog; the failures question what that catalog measures. Neither side
    has run the version that would decide: a corrected null on an independently
    built catalog (R004, R005, R008). Hence C005 and C006 are mixed.

    The remaining population results are weaker still. The geomagnetic
    dose-response (C103) has no direct evidence record. The hotspot result
    (C119) is sensitive to the survey footprint, and the authors' own random
    controls meet their clustering criterion (C122). The altitude band (C108) is
    a spread of estimators, not an estimate. Above C021 the ladder is empty. No
    record discriminates artificial from natural reflectors (C022). The
    proponents call the intelligence reading unfalsifiable (C023). The size
    argument used to dismiss the one natural near-Earth mechanism misdescribes
    it (C117).

    Steelman for: plate flaws cannot know where Earth's shadow falls. Yet the
    deficit survives a centre-of-plate cut and grows when defect-like rows are
    removed, the opposite of what a defect-borne edge artifact predicts. Coma
    oriented like that of neighbouring stars is, if validated, a signature an
    emulsion cannot forge.

    Steelman against: the deficit's baseline is a uniform null, which the
    critics show is false for this kind of catalog. The only extraction the
    proponents did not build loses the nuclear signal. Over a hundred
    look-alikes of the canonical nine sit in one overlap strip of the
    neighbouring plate. With a defect base rate that high, the statistics must
    earn 'at least some are real light' rather than assume it.

    Why unresolved rather than mixed or weakly supported: the lines for and
    against do not test the same thing. Same-row reproductions and changed-row
    failures fit two stories equally well. One is 'a property of the catalog';
    the other is 'a real signal diluted by noise or lost in smaller subsets'. So
    there is no head-to-head contest to call balanced. The per-object crux also
    has no test yet applicable to Palomar plates.

    A prior, disclosed as such, from general background: nothing human-made was
    in orbit before October 1957, and no natural population of flashing
    reflectors is known at these altitudes. That makes the attribution rungs
    expensive, but it does not set this verdict.

    Sensitivity: the record whose removal would most change the verdict is
    TRN-E011, the Watters et al. reanalysis. Without it, the shadow deficit
    would stand reproduced and robust to a centre-of-plate cut and to ML
    filtering. Its only challenge would be the proponents' own concession about
    stripes and edge effects (E051). C005 would move to provisionally supported,
    C020 and C021 would gain population-level support, and the case would shift
    to weakly supported. The verdict therefore leans materially on one critique
    whose datasets are proxies for, not copies of, the working catalog. No other
    single record's removal changes the verdict. Without E010 the ensemble
    effects rest largely on in-group analyses. Without E014 the coma line
    disappears. Without E022 the flagship marks revert to possible copy defects.
    Each removal moves the balance; none resolves it.
  steelman: "Plate flaws have no access to the geometry of Earth's shadow at
    20,000–36,000 km on a given night. Yet the working catalog shows a shortfall
    inside the modelled umbra: 0.46% against a ~1.4% geometric expectation. An
    outside analyst reproduced it with independent code. It is essentially
    unchanged in a centre-of-plate subset (0.45%). It grows rather than shrinks
    as the ML score strips out defect-like rows (E010, E015, E052, E053). The
    leading critique attributes the deficit to defects crowding plate edges and
    corners, measured against a uniform null. If that were the cause, cutting to
    plate centres or removing defect-like detections should weaken it; neither
    manipulation does. The heterogeneity-corrected null that erases the deficit
    was derived on related public datasets. It has never been applied to the
    107,875 rows themselves. This assessment notes that the filter is the
    group's own and that spatial cuts come with it. It does not explain why the
    deficit survives the two manipulations the artifact account says should
    dissolve it."
