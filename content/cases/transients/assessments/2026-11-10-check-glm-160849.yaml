      — the load-bearing step — has not been independently checked, the
      inspection was not blinded, and the figures could change in review.
      Provisional support is exactly what the evidence warrants.
    confidence: moderate
  - claimId: TRN-C002
    verdict: well_supported
    reasoning: "The sharpness measurement is common ground: SuperCOSMOS profile
      statistics place all nine on the sharp side of the stellar distribution
      with joint probability of order 0.1⁹, reported by the critics themselves
      (TRN-E003) and confirmed qualitatively under the microscope (TRN-E022).
      The bitter dispute is over interpretation — artifact-like classifier
      scores versus the sub-second-flash physics argument — not over the
      measurement. The strongest opposing consideration is that emulsion
      nonlinearity makes fainter sources naturally narrower, complicating the
      comparison baseline."
    confidence: high
  - claimId: TRN-C003
    verdict: well_supported
    reasoning: "The triple is peer-reviewed with 71 years of non-detection including
