  synthesis: "The case splits cleanly by rung, and the split is the finding. At
    the observation rung the evidence is unusually strong and largely supplied
    by the critics' side: the nine April 1950 marks are physically present on
    the Edinburgh copy glass (TRN-E002), on the original telescope negative
    itself per the microscopy manuscript (TRN-E022), are recovered by a fully
    independent extraction pipeline (TRN-E008), and their sharper-than-stellar
    profiles are common ground between the camps (TRN-E003). The July 1952
    triple is likewise peer-reviewed with deep non-detection follow-up. Whatever
    these marks are, they are not scanner ghosts. At the mechanism rung the two
    rival accounts are both incomplete: the copy-stage genealogy (TRN-C007) is
    real but demonstrably cannot reach the two flagship events, while the flash
    account cannot clear the hurdle its own proponents report — microscopy
    cannot separate a sub-second flash from an emulsion defect (TRN-E024), the
    inspecting microscopist leaned defect, and the one physical discriminant
    that could break the tie (the Hamburg coma signature, TRN-C011) is an
    unvalidated single-author preprint. At the attribution rung the ensemble
    statistics are contested in both directions with real replication on each
    side: Doherty independently reproduces the shadow deficit and nuclear-window
    correlation on the authors' own rows (TRN-E010) and ML artifact-scoring
    leaves both intact (TRN-E015), yet Hayes's independent extraction dissolves
    the nuclear effect (TRN-E009) and Watters shows the shadow result fails once
    the false uniform-background assumption is corrected (TRN-E011). The highest
    rungs are carried almost entirely by the proponents' own model-dependent
    elaborations: the 20,000–35,000 km altitude range is by the authors' own
    statement not a confidence interval, the NHI toy-model claim presupposes
    features contested elsewhere, and the extraterrestrial-artifact claim is
    conceded unfalsifiable by the proponents themselves. The honest roll-up: the
    marks are real, their origin as light-through-the-optics versus emulsion
    defect is genuinely unresolved, the near-Earth population statistics are
    contested with no decisive winner, and the artificial/extraterrestrial
    attribution has no independent support at all. The case is therefore mixed,
    not unresolved: real structure at the bottom, active contradiction in the
    middle, and no test yet run that could promote or kill the top. The decisive
    missing measurements — flash-profile calibration on period emulsion, blind
    validation of the coma discriminant, and a preregistered shadow analysis on
    independently extracted catalogs — are all identified in the agenda and none
    has been performed."
  steelman: "The strongest unanswerable argument for the featured hypothesis is
    the coma aberration reported on Hamburg Doppel-Reflektor transients
    (TRN-C011, TRN-E014): a directional off-axis distortion consistent with
    light that passed through the telescope's parabolic optics, recorded on an
    archive outside the Palomar copy genealogy that the copy-defect mechanism
    cannot reach. No skeptic has examined this discriminant at all, no defect
    mechanism that reproduces position-matched coma has been proposed, and
    Busko's classifier has never been blind-tested — the observation sits
    unrebutted and untested in both directions. Combined with the fact that all
    nine canonical 1950 marks sit physically on the original emulsion with sharp
    edges and no elongation, a proponent can rightly say: the one physical
    signature that would prove incident light exists, points positive, and the
    only reason it is not decisive is that nobody has run the validation
    experiment (TRN-R003)."
claimAssessments:
  - claimId: TRN-C022
    verdict: weakly_supported
    reasoning: The claim depends on TRN-C020 (flash vs defect, unresolved) and
      TRN-C021 (near-Earth reflections, contested), so it inherits at most weak
      support. The ensemble correlations that would indicate a near-Earth
      population replicate on the original rows and survive ML artifact-scoring,
      but Hayes's independent extraction and Watters's reanalysis undercut them,
      and Cann's natural dusty-plasma proposal shows that even a real near-Earth
      population need not be artificial. Nothing in the record independently
      establishes artificiality; the residual support is the persistence of the
      ensemble signals under one artifact filter.
    confidence: low
  - claimId: TRN-C023
    verdict: presently_untestable
    reasoning: No evidence record in the case bears on extraterrestrial origin
      specifically; the only support is the NHI toy-model fit (TRN-E072), which
      presupposes contested features and is hedged by its own authors. The
      proponents' hotspot paper states the intelligence interpretation is
      "unfortunately not falsifiable" (TRN-E083), and no discriminating test
      between artificial and natural near-Earth reflectors — or between
      near-Earth and anything else — has been run. This is a testability
      verdict, not a truth verdict.
    confidence: moderate
  - claimId: TRN-C021
    verdict: mixed
    reasoning: "Support comes from the Earth-shadow deficit (replicated on the
      original rows by Doherty, strengthened under ML filtering) and the absence
      of any competing natural mechanism that fits all ensemble features.
      Opposition is strong: Watters derives a proper null on the non-uniform
      background and finds no significant deficit, and the modeling preprint
      concedes the background non-uniformity partially. The nuclear-window
      correlation, if real, is also direction-ambiguous (fallout contamination
      predicts it too). Both directions have genuine, methodologically
      substantive evidence."
    confidence: low
  - claimId: TRN-C020
    verdict: mixed
    reasoning: "The part of the claim excluding the copying chain and digitization
      is now supported for the two canonical events: the nine marks are on the
      original negative (TRN-E022) and the 1952 triple appears in the original
      survey digitization, disfavouring the copy-plate hypothesis for those
      specific sources (TRN-E023). But the core assertion — light during the
      original exposure rather than an intrinsic emulsion defect — is expressly
      beyond microscopy by the manuscript's own statement (TRN-E024), the
      classifier groups the marks with artifacts, and the one positive
      discriminant (coma) is unvalidated and applies only to Hamburg. Partially
      established, core unresolved."
    confidence: low
  - claimId: TRN-C007
    verdict: well_supported
    reasoning: "The genealogy is documented by Hambly, the SuperCOSMOS authority,
      from the archival copy-production records: both modern datasets descend
      from independent copy negatives printed from one shared intermediate
      positive (TRN-E005). The Yang & Villarroel microscopy qualifies the
      argument's reach over the two flagship events but does not touch the
      genealogical fact, which remains a live contamination route for the
      ~100,000 uninspected catalog candidates. The strongest opposing
      consideration is only that no measured occurrence rate for copy-stage
      star-like defects exists yet."
    confidence: high
  - claimId: TRN-C001
    verdict: established
    reasoning: The nine marks are physically confirmed on the Edinburgh copy glass
      by the skeptical authors (TRN-E002, strength strong), recovered by an
      independent pipeline (TRN-E008), confirmed on the original telescope
      negative by microscopy (TRN-E022), and their absence from the overlapping
      plate and deep modern surveys is undisputed in the literature. The only
      opposing consideration — that physical presence does not settle origin —
      bears on TRN-C020, not on this observation claim as stated.
    confidence: high
  - claimId: TRN-C024
    verdict: provisionally_supported
    reasoning: The microscopy manuscript reports all nine sources on the Caltech
      original glass at their published positions, with registration against
      field stars, and it is candid against its own side's interest throughout
