  synthesis: >-
    The evidence securely establishes a phenomenon at the lowest descriptive
    rung, but not the featured near-Earth interpretation. The April 1950 marks
    are present on surviving glass copies, independently recovered in scans,
    sharper than comparison stars, and—according to the Yang and Villarroel
    preprint—present on the original telescope negative. The July 1952 triple is
    likewise recovered by an independent pipeline and absent from the adjacent
    exposure and deep subsequent imaging. These are therefore not inventions of
    the original extraction software. The original-negative result also removes
    a shared-copy-stage defect as the explanation for the April event, although
    that mechanism remains established and relevant to the uninspected catalog.

    The strongest case for real incident light is the independent Hamburg work.
    Analogous candidates occur in a separate observatory lineage, and a subset
    reportedly exhibits the field-dependent coma expected from light passing
    through the telescope. If that morphological discriminator is valid,
    ordinary post-exposure marks are inadequate. The sharp profiles of the April
    sources are also physically compatible with brief flashes that avoid
    accumulated guiding blur. At the population level, the numerical
    Earth-shadow deficit and nuclear-window association are reproducible when
    independent code is applied to the original working catalog, and both
    strengthen after the proponents' quality filtering. This is the strongest
    coherent positive case.

    The strongest skeptical case is equally concrete. Archival plate searches
    outside this controversy measured routine star-like faults, while the
    original-plate microscopist considered intrinsic emulsion defects a
    reasonable explanation for the April marks. Microscopy cannot distinguish
    such defects from flashes, and the flash-sharpness argument lacks the
    necessary historical-emulsion calibration; reciprocity effects may even work
    in the opposite direction. The Hamburg coma classifier has not been blindly
    tested against known defects. More importantly for the near-Earth rung, the
    shadow result depends on a disputed, unvalidated working catalog and a
    geometric background that Watters et al. found non-uniform. The nuclear
    association disappears in the independently extracted Hayes catalog after
    exposure and schedule modeling. No record supplies parallax, measured
    motion, a distance, or a validated optical signature tying any Palomar mark
    to a nearby reflector.

    Thus real plate features are established, incident light has suggestive but
    conflicting support, and near-Earth reflection remains unresolved.
    Artificial and extraterrestrial attribution add unsupported rungs rather
    than following from the observations. The single record whose removal would
    most change the case assessment is TRN-E014, because it is the only positive
    record offering a potentially physical incident-light discriminator in an
    independent archive. Without TRN-E014 the positive case would be materially
    weaker, but the overall verdict would still be unresolved rather than
    contradicted because the original-negative events and disputed population
    patterns would remain unexplained.
  steelman: "The specific positive observation this assessment does not explain is
    the reported field-angle-dependent coma in Hamburg transient candidates:
    post-exposure emulsion or scanning defects should not naturally acquire the
    telescope's off-axis optical aberration. No blinded defect corpus or
    independent remeasurement in the ledger has shown that this signature is
    spurious, and validating it would establish incident light in an independent
    pre-Sputnik archive."
