  synthesis: >-
    The featured hypothesis is that star-like transients on 1950s plates record
    real optical flashes from objects near Earth. It spans two rungs of the
    ledger's ladder: C020, light entering the telescope, and C021, sunlit
    objects near Earth. The evidence sorts by rung more cleanly than the public
    argument does.

    The bottom rung is settled. The April 1950 nine are physical features of
    surviving glass. The critics' own inspection confirmed them, an independent
    pipeline recovered them, and, pending review, they are present on the
    original negative (C001, C024). The July 1952 triple is equally secure as an
    observation (C003). That retires scanning and copy-chain explanations for
    the canonical events. The copy genealogy itself (C007) stays true for the
    uninspected catalog. Sharpness is common ground (C002), but the premise that
    would make it a flash signature (C102) is undecided. One physical effect
    predicts sharper flash images and another predicts shallower ones, and
    nothing has been calibrated.

    Everything therefore turns on C020, and the record cannot yet decide it. The
    proponents' own microscopy concedes that inspecting a single source cannot
    separate a flash from an emulsion flaw (E024). The bridge must therefore
    come from population statistics or from an optical signature.

    The statistics all run on one working catalog that no one has independently
    rebuilt. On those rows the shadow deficit and the nuclear association
    reproduce under independent code and survive artifact scoring (E010, E015).
    Against them, a reanalysis on related datasets that models the non-uniform
    background removes both (E011). The one independently extracted catalog
    returns a null for the nuclear effect once nightly coverage is modelled
    (E009). The coma signature (C011) is the best discriminant on offer, but it
    is unvalidated and comes from a different telescope. The defect account has
    a viable mechanism and an outside base rate (C101), not a demonstration that
    these marks are flaws.

    I call this unresolved rather than mixed for two reasons. Most items on both
    sides establish only that their own account is viable. The discriminating
    tests (R002, R003, R004, R005, R204) are specified and feasible.

    C021 inherits C020 and adds altitude modelling that fits poorly and finds a
    deficit at every altitude tested. My further reluctance there is a disclosed
    prior, not a recorded finding: no known population of reflectors occupied
    those altitudes before 1957. The artificial and extraterrestrial rungs
    (C022, C023) have no evidential support of their own. The toy-model argument
    (C118) is accommodation by an unconstrained hypothesis. The size argument
    excluding the natural dusty-plasma alternative (C117) misdescribes that
    mechanism.

    Steelman for: the shadow deficit is the one observation a defect population
    has no evident way to produce. It holds in a center-of-plate subset and
    strengthens as defect-like candidates are filtered out.

    Steelman against: the nine sit in a plate corner where defects congregate,
    and the overlapping plate carries its own unpaired point sources (E002). The
    one outside microscopist leaned defect. The only ensemble test that varied
    the extraction step came back null.

    Sensitivity: the record whose removal would most change this verdict is
    TRN-E011. Without it, the shadow deficit would stand as an internally
    replicated geometric signal, opposed only by the source group's own
    concession about stripes and edges (E051). I would then move C005 to
    well_supported, and C020, C021 and the case to weakly_supported. The verdict
    does not survive that removal intact. It hangs substantially on one critique
    run on datasets related to, but not identical with, the working catalog.
    That is why an independent reconstruction and a preregistered shadow test
    (R004, R005) are the highest-value next steps.
  steelman: "The Earth-shadow deficit is the one observation in this case that an
    emulsion-defect population has no evident way to produce, and this
    assessment does not explain it. On the working catalog it reproduces under
    independently written code: 0.46% of candidates fall in the umbral cone
    against about 1.4% expected. It holds at 0.45% in a center-of-plate subset,
    where corner and edge excesses should not reach. It persists against
    per-plate random controls at every assumed altitude. It grows stronger
    rather than weaker as an artifact classifier strips out defect-like
    candidates, which is the pattern a real sunlit population diluted by flaws
    would show. The reanalysis that dissolves it used related datasets some
    twenty times smaller. No record identifies a specific plate, schedule or
    time-of-night mechanism that yields a deficit centred on the modelled umbra,
    and the time-of-night channel raised in this assessment is a hypothesis, not
    a finding. Rating C005 mixed records the dispute; it does not answer the
    observation."
