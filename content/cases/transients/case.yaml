id: TRN-001
slug: transients
title: "Before Sputnik?"
subtitle: "Do star-like transients on 1950s photographic sky-survey plates record real optical flashes from objects near Earth before the first satellite?"
domain: "Astronomy · Archival surveys"
status: active
summary: >-
  The first Palomar Observatory Sky Survey photographed the sky in the 1950s, before any artificial satellite existed. The VASCO project, led by astronomer Beatriz Villarroel, has cataloged star-like point sources that appear on single exposures and never again — including nine at once in April 1950 and a bright triple in July 1952 — and proposed that some are sunlight glints from reflective objects near Earth. The skeptical literature answers with plate chemistry: emulsion defects, a shared copying stage that can print one flaw into every modern dataset, and ensemble statistics that dissolve under stricter vetting. The case is unusually rich in genuine replications, genuine failures to replicate, and one decisive observation nobody has made.
