    exposed six days later and from deeper modern surveys.
  plainLanguage: >-
    The canonical event, reduced to what nobody disputes: nine dots exist
    on the physical plate material — they are not scanner glitches — they
    appeared together, and nothing at those positions has ever been seen
    again.
