# ── Mechanism rung ──────────────────────────────────────────────────────────

- id: TRN-C007
  statement: >-
    The DSS and SuperCOSMOS digitizations of POSS-I derive from separate
    glass copy negatives that share a common intermediate positive, so a
    defect introduced at the shared copy stage can appear in both modern
    datasets without existing on the original telescope negative.
  plainLanguage: >-
    The conventional account's keystone, stated as a mechanism rather than
    a vibe: "it's in two independent scans" sounds like independent
    confirmation, but the two scans are cousins — they share a photographic
    ancestor, and a flaw in that ancestor propagates to both descendants.
  theme: plate-forensics
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "transients research report — proposed AST-C022/C023"
    extractedBy: "Fable (AI agent)"
    runId: "transients-import-2026-08-22"
    date: "2026-08-22"
  credibility: well_supported
  credibilitySummary: >-
    Hambly & Blair reconstruct the atlas-copying procedure (contact
    printing through an intermediate glass positive) from the archival
    record and their own institutional knowledge of the SuperCOSMOS
    program; the genealogy itself is not disputed by the proponents.
  diagnosticity: high
  diagnosticitySummary: >-
    Defeats the strongest cheap argument for reality ("present in two
    independent digitizations") and defines what the decisive test must
    be: the original negatives, not more copies. It does not, by itself,
    show that any particular mark is a copy defect.
  parentClaimIds: [TRN-C020]
  dependsOnClaimIds: []
  strongestObjection: >-
    A shared-ancestor pathway proves possibility, not occurrence: no one
    has yet measured how often copy-stage defects of star-like appearance
    actually arise, and the mechanism does not touch candidates found on
    independent plate lineages such as Hamburg's.
  whatWouldChangeOurMind:
    - "A defect census across original/positive/copy generations quantifying the star-like defect rate at each stage (TRN-R007)."
    - "Examination of the original negatives: marks present there would make the copy-genealogy point moot for those events (TRN-R001)."

