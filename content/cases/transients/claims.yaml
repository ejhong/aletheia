    date: "2026-08-22"
  credibility: well_supported
  credibilitySummary: >-
    Unusually solid for this literature: reported by the proponents
    (Villarroel et al. 2021), physically confirmed on the Royal Observatory
    Edinburgh glass copy by the case's principal critics (Hambly & Blair
    2024), and recovered by an independent detection pipeline (Hayes 2026).
    Skeptics and proponents agree the marks exist; they disagree about what
    made them.
  diagnosticity: low
  diagnosticitySummary: >-
