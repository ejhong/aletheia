# Canon layer. Claims extracted by an AI agent (Fable) from the transients
# research report (research/ folder) and the independently verified source
# literature, 2026-08-22. reviewState is honest provenance: nothing here has
# been hand-checked by a human yet.
#
# The ladder deliberately separates five propositions the popular story
# fuses: (1) the marks are real features of the plate material, (2) they
# were made by light entering the telescope, (3) the light came from objects
# near Earth, (4) those objects were artificial, (5) they were
# extraterrestrial. Evidence for one rung must not silently climb.

