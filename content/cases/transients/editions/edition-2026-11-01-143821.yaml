rationale: |-
  This edition adopts a new draft assessment. The case verdict (unresolved) does not change; three claim verdicts do. The panel of 30 September split on exactly these three, and in each case the draft had held the claim on its source anchor with no evidence record, while most seats graded it from records filed elsewhere. This session read the primary texts and gave each claim its own records.

  The defect rate (TRN-C101) moves from unresolved to well supported. The critics' published paper reports laboratory rates of star-like emulsion faults that scale to 83–475 per plate-sized area, the same order as the catalog's 167 candidates per plate. Hambly and Blair found more than a hundred look-alikes of the nine 1950 marks on the neighbouring plate. And the proponents' own peer-reviewed alignment paper concedes that some defects resemble stars and that the catalog's false-positive share is unknown. Two records set its limits and are told in the article: close inspection removed nearly all such defects in the gamma-ray-burst searches, and the microdot, the best-known star-like defect, is not reported on the Palomar emulsion. The claim's anchor was also replaced. It had quoted a sentence about the outcome of the gamma-ray-burst searches, which says nothing about a rate.

  Flash sharpness (TRN-C102) moves from unresolved to provisionally supported. Its direction follows from optics and no one disputes it, but its size has never been computed. The seeing paper the proponents cite puts frozen seeing at milliseconds for small apertures, not at a second. Faint images on plates are narrower anyway, and the proponents grant that sharpness alone cannot separate flash from flaw. Its diagnosticity falls from high to low.

  The alignments (TRN-C104) move from unresolved to well supported as a report. The aligned-transients paper (PASP 2025) has now been read in full; until this session it had been characterized from its title and a critic's summary. It reports five shortlisted lines at 2.5σ to 4σ per image. It also says it cannot compute a survey-wide chance probability, that its three-point lines are not significant, and that plate defects cannot be excluded without a microscope. The article now gives the alignments a short section of their own with those qualifications. It drops the sentence saying this site had not read the paper.

  Smaller changes. Two reviewer notes on the previous edition are taken: the unexplained phrase "preregistered null" and the figure "catalogs nobody's thumb has touched" are replaced with plain descriptions. Two research items are added: a survey-level null for the alignment search, and a fault count on the Palomar emulsion itself. A search of arXiv and the web for work since 30 September found nothing new on the case beyond a revised version of the September hotspot preprint, which was not re-read.

