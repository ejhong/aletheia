article: |
  The first great photographic atlas of the sky carries marks nobody has yet explained. On glass plates exposed at Palomar Observatory in the early 1950s, years before any satellite flew, astronomers have catalogued star-like points that appear on one exposure and never again. The boldest reading is that some were sunlight glinting off artificial objects in orbit before Sputnik. The evidence so far establishes less, but not nothing. The marks are physically real, and the most famous ones are reported on the original telescope negative rather than a later copy. Statistical patterns in the population hold up in the proponents' own catalog but not in one rebuilt from scratch. What remains open is the question under all the others: whether any of these marks was made by light at all, rather than by a flaw in the photographic emulsion.

  ## Nine lights, one night

  On 12 April 1950 the 48-inch Schmidt telescope on Palomar Mountain exposed a red-sensitive plate for about fifty minutes. Seventy years later the VASCO project (Vanishing and Appearing Sources during a Century of Observations), led by astronomer Beatriz Villarroel, reported [nine star-like points on that plate, within about ten arcminutes of one another, absent from the overlapping plate taken six days later and from far deeper modern surveys]{claim=TRN-C001}. The discovery paper named an unknown plate contamination as its first candidate explanation. It offered brief sunlight reflections from objects near geosynchronous orbit as another, if contamination could be excluded.

  {plate:IMG-TRN-P01}

  A second event followed: [three points of about 16th magnitude, within ten arcseconds of one another, on a plate from 19 July 1952, gone from the next exposure within the hour and absent from all later imaging down to magnitude 25.5]{claim=TRN-C003}. The project has since built a working catalog of about 107,875 single-exposure candidates from the Palomar plates, and most of the argument now happens there.

  ## Four accounts of a dot

  Every explanation must account for the same thing: a small, round, dark grain on glass.

  **Plate defects.** Emulsion does not need the sky to make a dot, whether the flaw was born in the original plate or added when copies were printed. Critics argue that [ordinary emulsion, copying and scanning flaws make star-like marks often enough to contaminate any search for one-time flashes]{claim=TRN-C101}. The account predicts candidates that resemble known defects and gather in plate corners and edges, and population patterns that fade when the catalog is rebuilt.

  **Artificial glints.** The proponents hold that [some marks are sunlight reflected from objects near Earth, at roughly geosynchronous height]{claim=TRN-C021}, and that [artificial objects able to make them were in orbit before Sputnik 1]{claim=TRN-C022}. The strong form adds that [they were extraterrestrial technology]{claim=TRN-C023}. It predicts sharp images, fewer candidates inside Earth's shadow, groupings, and signals that strengthen as defects are filtered out.

  **Natural bodies near Earth.** One preprint accepts real near-Earth flashes but proposes icy dust clumping into metre-scale aggregates after geomagnetic storms; meteoroid debris is another natural candidate. Either shares the shadow prediction and differs on size and makeup.

  **Exotic physics.** A dark-matter proposal takes the flashes' reality as its premise and says nothing about defects. It inherits the central question rather than answering it.

  Most of the evidence cannot separate the second account from the third. Beneath all of them lies one question: [whether any mark was made by light entering the telescope during the exposure]{claim=TRN-C020}, rather than added later in the emulsion, the copying or the scan.

  ## What nobody disputes

  Start with what the critics concede. Hambly is an astronomer at the Royal Observatory Edinburgh and an author of one of the survey's two major digitizations. He put Edinburgh's glass copy under a microscope, and the nine marks are there at the reported positions; they are not scanner glitches. [An outside researcher's pipeline, written without the discoverers' software or lists, recovers eight of the nine, all three from 1952, and about two-thirds of the 5,399-candidate public catalog]{claim=TRN-C004}. The marks are real. The question is what makes a mark.

  {plate:IMG-TRN-P02}

  ## The case for defects

  Hambly and his coauthor Blair give the conventional account its strongest form. Their inspection found emulsion holes, bubbles and scratch-like marks on the copy plates, and appear-once detections on the neighbouring field too.

  They measured that [the nine 1950 marks are sharper and more concentrated than stars of the same brightness, all nine on the sharp side of the plate's distribution]{claim=TRN-C002}. The odds of that, if they were stars, are of order one in a billion. A classifier files them with spurious detections. But its spurious class is defined by having no modern counterpart, which is also what defines a transient, so a real flash would be labelled artifact-like by construction.

  Then comes the family tree of the copies. Two modern digitizations both show the candidates, and that agreement seemed to rule out simple flaws. But both [descend from copy negatives printed from the same intermediate positive, so one flaw made at that step would appear in both]{claim=TRN-C007}. “Two independent datasets” turns out to mean two cousins.

  {plate:IMG-TRN-P03}

  This has happened before. From the 1970s to the 1990s astronomers searched old plates for flashes from gamma-ray bursts. One such search of nearly four thousand Harvard plates counted the star-like flaws in its control regions: from about half a flaw to twelve per hundred square centimetres, depending on the plate series, enough to put several on a plate the size of Palomar's. On one plate, the unexplained star-like spots matched the number that rate predicted. A lens dismissed nearly all such suspects. But, as the critics recount, a few star-like candidates survived every test, different groups examining the same plate reached different verdicts, and two decades of searching ended without one confirmed flash.

  The account still carries two debts. Nobody has counted star-like flaws on this survey's own glass, or how many would survive inspection. And it cannot reach plates outside the Palomar family.

  ## The original glass

  Only the original negative sits above the shared copy. A preprint by J. Yang and Beatriz Villarroel, not yet peer reviewed, reports microscopy of the negative that was in the telescope on 12 April 1950, now at the Caltech archive, registered star by star against the digitization. It finds [all nine 1950 sources on the original negative at their published positions]{claim=TRN-C024}, and the 1952 triple on a Harvard copy and in the original digitization. For the flagship events, the cousins are answered by the grandparent. The copying argument keeps its force only for the hundred thousand uninspected candidates.

  There the good news stops, for everyone. The study states that microscopy cannot tell a brief flash from a flaw born in the emulsion, because single dots of both kinds look alike. Hambly himself directed the microscopist who examined the plate to the nine. The microscopist found them un-star-like and judged emulsion defects a reasonable attribution, noting that the field lies in a plate corner, where defects are commoner. The study prints that opinion against its own interest. The clean escape would be the same flash caught at a second observatory at the same instant, and it is closed: no such plate exists.

  The examination was not blind and has not been repeated outside the group. “Original or copy?” has an answer for these events; “sky or chemistry?” does not.

  ## The case for light

  The proponents answer the sharpness finding with physics. A star sits on the plate for the whole exposure, smeared by air, wind and tracking. They argue that [a flash under a second long escapes most of that smearing and should look sharper and rounder than a star]{claim=TRN-C102}. The gamma-ray-burst searchers were not agreed on this. One line of argument held that flash images should be shallower than stars, because emulsion records a brief, intense burst of light less efficiently than the same light spread over time. Another held that they should be steeper, for the proponents' reason. Both effects may act at once, and nobody has exposed period emulsion to controlled flashes to see which wins. Even the critics list it as unanswered, beside its twin: whether some flaws, too, are sharper than stars. Until both are measured, sharpness is the case's most-cited observation and its least decisive.

  The stronger development comes from outside Palomar. Ivo Busko, a retired Space Telescope Science Institute developer, searched same-night plate pairs from Hamburg Observatory. He reports [appear-once candidates with narrow profiles on a different telescope, emulsion, archive and digitization]{claim=TRN-C010}. The copying argument cannot touch them. Without a candidate rate against matched controls, though, “the same phenomenon” and “the same weakness of old emulsions” look alike.

  His follow-up uses a Hamburg telescope with strong coma, the small comet-shaped smear its optics give to off-axis light. He reports that [candidate images carry the coma pattern expected of light through the optics]{claim=TRN-C011}. Scratches and chemistry do not know where the optical axis is; light does. If validated blind against known defects and deliberately made flashes, this would be a detector of real light usable on any archive. It has not been validated, and the paper says its data do not establish where the light came from.

  ## The statistics

  Above the single events sits an argument from the whole catalog. Every result here so far comes from the proponents' working catalog or from rows they supplied; who reproduces what is the record's most informative feature.

  ### The shadow

  [The catalog shows fewer candidates inside Earth's shadow at geosynchronous height than geometry expects — about 0.46% of candidates against the 1.4% that the shadowed share of the sky predicts]{claim=TRN-C005}. A sunlit reflector goes dark in the shadow; a defect does not. It is the best geometric evidence either near-Earth account has, and they share it.

  A statistician working from the proponents' supplied rows with his own code reproduces it; he later joined the group. A machine-learning study scoring candidates for defect-likeness finds [the shortfall stronger at every assumed altitude once defect-like rows are removed]{claim=TRN-C129}. A modelling preprint fits the shortfall's shape to shells at different heights and gets a poor fit. It states [a characteristic height of about 20,000–35,000 km]{claim=TRN-C108}, which its authors call a spread across choices, not a confidence interval.

  Against this, Watters and colleagues, several of whom work in UAP-research organizations, show that the even spread of candidates the test assumes is false. Candidates rise toward plate corners and edges and gather in clusters and voids. Against a baseline that allows for that bunching, in closely related datasets, the shortfall is not significant. At least 91% of the rows used belong to a set once removed for lying within 5 arcseconds of catalogued stars. The proponents reply that the critics' subset is twenty times smaller and underpowered. Their modelling preprint concedes part of the point, cutting its sky region to avoid empty stripes and edge effects that “may influence the results.” And the filter that strengthens the signal is the group's own classifier, trained on its own visual judgments. Removing defect-like rows sharpens any signal that defects dilute, whether or not what remains is sky.

  ### The bombs

  [Candidate rates are higher within a day of atmospheric nuclear tests — a relative risk of about 1.45]{claim=TRN-C006}. On the supplied rows it survives weather and moonlight controls, a permutation test and the machine-learning filter. An open Bayesian reanalysis that allows for day-to-day correlation also finds it, though weaker. Another preprint reports that [candidate rates fall with geomagnetic activity, and that allowing for this strengthens the nuclear link]{claim=TRN-C103}; its figures have not been checked here. A companion test finds that star counts and limiting magnitude do not change with storms, closing one route to a spurious pattern.

  But the one catalog rebuilt from whole-plate scans, by Hayes, finds no significant effect once nightly sky coverage is modelled. The relative risk is 1.35 with an interval that includes no effect, and 1.03 in the exposure-weighted model. Watters traces the timing mostly to the observing schedule. The hotspot preprint also reports, in a passage not yet checked here, that [all 203 high-probability candidates from the night before the Castle Yankee test project onto Pacific regions]{claim=TRN-C125}. Those are one night's plates, which a direct audit could examine.

  The pattern is the tell: the correlations reproduce on the proponents' catalog and fade when the catalog is rebuilt. That does not prove them artifacts; it makes the catalog the battleground. And even a surviving nuclear link would fit fallout reaching the plates as well as glinting objects.

  ### Hotspots and lines

  The newest result projects high-probability candidates along the line of sight onto a shell at 35,786 km and asks which patch of Earth each hangs over. [Sixteen of 137 patches hold more candidates than the group's random control, after correcting for testing many patches at once]{claim=TRN-C119}. Most lie over the eastern Pacific west of southern Mexico and over the southern Gulf of Mexico. [Fourteen draw their excess from at least two plates]{claim=TRN-C132}; [two adjacent patches draw theirs from a single plate]{claim=TRN-C133}.

  Three things limit it. Every location depends on the assumed height; at the 20,000 km the companion fit prefers, the candidates fall elsewhere. A plate rich in defects sends its excess wherever the geometry points. And [random positions put through the same clustering procedure meet the authors' threshold for non-random clustering]{claim=TRN-C122}, in only three control runs.

  A refereed paper by the group reports [groups of candidates lying in straight lines, as a tumbling object glinting several times might leave]{claim=TRN-C104}. Its shortlist holds five groups; three have four or five points. The authors say some members may not be point sources, and that their odds are worked out one image at a time, with no correction for how many boxes on how many plates were searched. Checking the shortlist, the critics found that 8 of its 24 members lie within two arcseconds of objects the catalog's builders had set aside as probably catalogued sources. On plates whose candidates already bunch along sharp edges, they add, lines are no surprise.

  ## Which near-Earth?

  Suppose the near-Earth geometry held. The modelling preprint argues that [dusty-plasma grains a millimetre across cannot make the centimetre-to-metre reflecting surfaces its brightness model infers]{claim=TRN-C117}. That size estimate rests on assumed height, mirror-like reflection, flash duration and reflectivity. It also rests on a catalog that excluded bright sources, which, the authors concede, biases sizes downward. The same preprint finds [no robust link between candidate dates and annual meteor showers]{claim=TRN-C116}, which counts against meteoroid debris as the source.

  It then argues that [among the models it tried — natural bodies, dusty plasma, non-human intelligence — only the last fits all five reported features]{claim=TRN-C118}. The five are sharp profiles, groupings, the shadow shortfall, nuclear timing, and the geomagnetic pattern. That is a fit among a hand-picked set, built on features contested at the catalog level, and the authors add that nature can always surprise us. The hotspot paper's authors call their own intelligence reading “unfortunately not falsifiable.” Nothing in the record tests an extraterrestrial origin. Even a proven pre-Sputnik object would need a separate argument before that word earned its place.

  ## Where the support thins

  The marks are on the plates, and independent software finds them: settled. The flagship nine are on the original negative: reported, awaiting review. Flaws make star-like marks on survey plates: measured elsewhere, unmeasured on this survey's glass. The population patterns describe the sky: contested, surviving only in the catalog where they were found. Some mark was made by light: unresolved, and everything above depends on it. The light came from near Earth: unresolved. Artificial objects orbited before Sputnik: the headline, unresolved. They were extraterrestrial: not testable now, by its proponents' own account.

  ## What would change our mind

  Toward light:
  - a blind test of the coma signature that separates deliberately made flashes from the full range of defects;
  - a calibration on period emulsion showing the nine marks match sub-second flashes and not flaws;
  - a shadow shortfall in an independently extracted catalog, against a baseline fixed in advance that allows for candidates bunching toward plate edges.

  Toward defects:
  - star-like flaws counted on this survey's own glass at the rates the catalog needs, surviving inspection;
  - the Castle Yankee-night candidates concentrated on one or two plates, with edge clustering and defect shapes;
  - the coma test failing;
  - Hamburg-style candidate rates that match defect rates on matched controls;
  - alignments turning up as often in scrambled versions of the same plates.

  Between the two near-Earth accounts: an altitude fit that includes the objects' orbital motion, which the present model leaves out, and survives independent shadow code; and a size estimate that does not depend on excluding the brightest candidates.

  Microscopy of single dots has done what it can. Three things still discriminate: the coma signature, statistics on catalogs extracted independently with tests fixed in advance, and, for any future flash, simultaneous imaging from two or more stations. That last turns one ambiguous dot into a measured distance or a local artifact.
