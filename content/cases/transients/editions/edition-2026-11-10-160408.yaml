rationale: |-
  The panel split on three claims the last draft had graded unresolved because no evidence record was attached to them: the rate of star-like plate flaws, the expectation that a sub-second flash looks sharper than a star, and the reported alignments. This edition reads their sources. A 1998 search of Harvard plates for gamma-ray-burst flashes measured star-like fault rates, at levels that would put such faults on every survey plate, and recorded that the earlier literature expected flash images to be shallower than stars as often as sharper. The critics' published paper adds their account of that era and their check of the alignment shortlist. The alignments paper itself was read in full for the first time. Its publisher then walled the text against further reads, so the five records quoting it are entered provisional and carry no weight until the text is read again.

  What changed in the judgment: the flaw-rate claim moves from unresolved to provisionally supported; the alignments claim, a claim that alignments are reported, from unresolved to provisionally supported; the flash-sharpness claim stays unresolved, now on evidence of a rival expectation rather than on no evidence. The case verdict and components stand; the crux component's note now says flaw rates are measured only on other plates and flash sharpness is disputed in principle.

  What changed in the telling: the defect account's debt is restated (a rate exists for other plates, not for this survey's glass); the case for light gives the older rival expectation; the alignments are told from the paper and the critics' check rather than from a paper unread; two new research items are named; and three reviewer notes on the last edition are taken: plain words for "proper null", "catalogs nobody's thumb has touched" replaced with a literal description, and the meteor-shower test introduced with the debris it would exclude.

