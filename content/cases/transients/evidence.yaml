- id: TRN-E011
  title: "The Watters reanalysis: no shadow deficit, schedule-driven timing, unvalidated datasets"
  claimIds: [TRN-C005, TRN-C006, TRN-C020]
  sourceId: SRC-WATTERS-2026
  direction: undermines
  strength: strong
  sourceStatement: >-
    Using two previously published datasets closely related to those in the
    Villarroel et al. studies: the uniform-random background assumption
    essential to the Earth-shadow analysis is false (feature counts are
    spatially heterogeneous, rising toward plate corners and edges, with
    geometric clusters and voids); after deriving the proper null
    distribution there is no statistically significant shadow deficit; the
    nuclear-test correlation becomes insignificant after normalizing by the
    number of observation days and is almost completely determined by the
    Palomar observing schedule; at least 91% of the features used in the
    ensemble studies belong to a set earlier removed for lying within 5
    arcsec of catalog stars; a third of the reported linear-cluster
    features were not confidently distinguished from catalog stars; and it
    has not been shown that any features in these datasets represent
    optical transients.
  editorInference: >-
    The most comprehensive undermining record in the case: it attacks the
    dataset definitions underneath both headline correlations, not just
    the statistics on top. Its force depends on how well its
    closely-related-but-not-identical datasets proxy the actual working
    catalog — the exact point the proponents' rebuttal presses.
  exactLocator: "Abstract, §4–7 (read via arXiv 2601.21946; published as PASA, DOI 10.1017/pasa.2026.10230)"
  limitations:
    - "Works from related public datasets rather than the exact 107,875-row working catalog used in the disputed papers."
    - "The vetted subsets it favors are much smaller; the proponents argue the resulting power loss can hide a real effect (TRN-E012)."
  reviewState: ai_extracted
  origin:
