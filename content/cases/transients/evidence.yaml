    the author labels the findings preliminary.
  editorInference: >-
    If it holds up, this is the first appearance of the phenomenon outside
    the Palomar plate-copy genealogy — the copy-defect mechanism
    (TRN-C007) cannot reach it. What it does not yet have is a measured
    candidate rate against matched controls, so "similar phenomenon" and
    "similar defect susceptibility" remain indistinguishable.
