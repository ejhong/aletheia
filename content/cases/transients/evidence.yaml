- id: TRN-E003
  title: "Profile statistics: all nine 1950 marks are sharper than stars"
  claimIds: [TRN-C002]
  sourceId: SRC-HAMBLY-BLAIR-2024
  direction: supports
  strength: strong
  sourceStatement: >-
    SuperCOSMOS profile statistics for the nine candidates all fall on the
    sharp (negative) side of the zero-mean stellar distribution, roughly
    −3 ≲ η < −1; the joint probability of drawing nine such values from the
    stellar profile distribution is of order 0.1⁹. Under the microscope the
    marks appear more concentrated and circular than stellar images of
    similar brightness.
  editorInference: >-
    The measurement itself is common ground between the camps; only its
    interpretation divides them. This record carries the observation;
    TRN-E004 and TRN-E006 carry the rival readings.
