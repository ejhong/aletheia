- id: TRN-E024
  title: "Yang & Villarroel manuscript: microscopy cannot tell a flash from an emulsion defect, and its own microscopist leaned defect"
  claimIds: [TRN-C020]
  sourceId: SRC-YANG-VILLARROEL-2026
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    The manuscript states that "microscopy of individual point-like
    features cannot by itself separate a short-duration flash from an
    intrinsic emulsion defect, because the two scenarios produce
    qualitatively similar signatures at the single-source level." Its
    footnote quotes the microscopist who inspected the Caltech plate —
    directed to the nine objects by Mr. Hambly: the features "were not
    stellar in appearance," with sharp edges and no elongation, and "in
    my experience, it is reasonable to attribute these anomalies to
    emulsion defects," noting the field lies in a corner of the plate
    where such defects are more common. The manuscript argues this
    reading reflects a natural bias — comparison against steady stars
    favours the defect interpretation over sub-second emission — and
    reports that the multi-observatory parallax test is infeasible for
    these two events, since no simultaneous second-site plate of
    comparable depth exists. It concludes that resolving the events'
    nature requires population-level statistics and, for future events,
    purpose-built multi-station imaging.
  editorInference: >-
    The honest ceiling of the decisive test, reported by the test's own
    authors. The case had framed the original-plate examination as the
    observation that could collapse the dispute in either direction; this
    record establishes that it cannot — the crux (TRN-C020) narrows from
    "original or copy?" to "flash or flaw in the original emulsion?", and
    single-source morphology cannot answer that. The microscopist's
    defect-leaning opinion is the closest thing this case has to an
    independent eye on the physical evidence, and it is recorded at face
    value alongside the manuscript's argument that it embeds a
    steady-star default. Discriminating power now rests with the coma
    signature (TRN-C011, TRN-R003), rebuilt population statistics, and
    prospective multi-station imaging (TRN-R009).
  limitations:
    - "Unpublished and unreviewed."
    - "The microscopist's assessment is quoted from private correspondence reproduced in the manuscript's footnote; the microscopist is not named in the text read."
    - "The plate-corner location cuts both ways and the manuscript says so: defects congregate in corners, and the reading was made without considering transient phenomena."
  reviewState: ai_extracted
  origin:
    ref: "Manuscript supplied by the authors' group, read in full; see SRC-YANG-VILLARROEL-2026 verificationNote"
    extractedBy: "Fable (AI agent)"
