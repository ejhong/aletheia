- id: TRN-E020
  title: "Cann 2026c: preregistered post-storm recovery profile, and a natural near-Earth mechanism"
  claimIds: [TRN-C021, TRN-C022]
  sourceId: SRC-CANN-2026C
  direction: qualifies
  strength: weak
  sourceStatement: >-
    A preregistered test of transient detection rates after geomagnetic
    storms reports rates suppressed to 55% of baseline on days 7–21 and
    raised to 309% of baseline on days 25–45 (p = 0.00066, Wilcoxon
    rank-sum), which combined with the earlier dose-response result the
    paper puts at 3.6–4.7 sigma by Fisher's method, the range reflecting
    sensitivity to an independence assumption. It proposes a candidate
    mechanism: storm-enhanced electromagnetic trapping of charged
    micrometeoroid dust near L ≈ 6.6, then aggregation of icy cometary
    grains as cold plasmaspheric conditions return. A flux-dilution
    argument gives a partially reflective icy aggregate 1–4 m across as
    sufficient to reach the observed plate magnitude at 42,000 km. The
    paper states that multi-site replication is required.
  editorInference: >-
    Recorded as qualifying rather than supporting because of what it does
    to the ladder rather than what it adds to it. The case has been framed
    as chemistry versus artificial reflectors; this proposes a third
    family — real near-Earth objects that are natural. If it held, it
    would leave TRN-C021 (near-Earth origin) standing while removing the
    reason to believe TRN-C022 (artificial objects), and it would explain
    the population's disappearance after 1957 without invoking anyone's
    hardware. Its weight is low: single author, preprint, unreplicated,
    a candidate mechanism by the paper's own description, and the same
    catalog lineage as everything else in the ensemble dispute. The
    preregistration is a genuine methodological credit in a case where
    the absence of preregistration is a recurring finding.
  limitations:
    - "Not peer reviewed; single author; the paper itself calls for multi-site replication."
    - "Third preprint by the same author in this case and not independent of the other two — it treats SRC-CANN-2026 as having established that the transients are real, which this case does not accept."
    - "Same 107,875-object catalog as the analyses it extends, so like them it cannot bear on whether the candidates are sky events at all (TRN-C020)."
