# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit; sourceStatement (what the
# source says) is kept separate from editorInference (what we infer).
#
# Replication independence matters unusually much in this case, so each
# record's limitations state which kind of "independent" it is: independent
# statistics on the same catalog, independent extraction from the same
# digitized lineage, independent physical copy, or independent observatory.

- id: TRN-E001
  title: "The April 1950 nine-transient discovery report"
  claimIds: [TRN-C001]
  sourceId: SRC-VILLARROEL-2021
  direction: supports
  strength: moderate
  sourceStatement: >-
    Nine point sources appeared within half an hour in a region of ~10
    arcminutes on a red-sensitive POSS-I plate from April 1950; all nine
    are absent from earlier and later photographic images and from modern
    CCD surveys several magnitudes deeper. Deep Gran Telescopio Canarias
    imaging (r ~ 26) shows possible counterparts that could equally be
    chance projections. The paper itself names an unknown type of plate
    contamination as one explanation, and fast (<0.5 s) solar reflections
    from objects near geosynchronous orbit as another, if contamination
    can be fully excluded.
  editorInference: >-
    The discovery paper is more cautious than the popular retellings: its
    own first-listed explanation is contamination, and the exotic reading
    is explicitly conditional on excluding it — a condition that remains
    unmet.
  exactLocator: "Abstract (read via arXiv 2106.11780)"
  limitations:
    - "Proponent-team report; the transient interpretation and the incidence-rate comparison have not been independently reviewed against a defect model."
    - "Based on digitized copies; the original telescope negative was not examined."
