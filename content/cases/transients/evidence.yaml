- id: TRN-E009
  title: "Independent extraction finds no significant nuclear-window effect"
  claimIds: [TRN-C006]
  sourceId: SRC-HAYES-2026
  direction: undermines
  strength: strong
  sourceStatement: >-
    Applying nuclear-test temporal windows to the independently extracted
    catalog over 368 POSS-I observation nights gives a post-test
    calendar-day relative risk of 1.35 ([+1] window) that is not
    statistically significant (95% CI 0.91–2.00, Fisher p = .17) and is
    schedule-sensitive; a negative binomial model of nightly counts with
    nightly patch coverage as exposure is null (IRR = 1.03, 95% CI
    0.89–1.18, p = .71), as are all asymmetric windows tested.
  editorInference: >-
    The single most probative negative result for the nuclear correlation,
    because it varies the disputed step (source extraction) and models the
    observing schedule — the two main confound channels. A correlation
    that replicates on the original rows but not in an independently built
    catalog looks like a property of the catalog.
  exactLocator: "Abstract, §III.4, Table 2 (read via arXiv 2604.04810)"
  limitations:
    - "The independent catalog was built with preliminary parameters and averages ~7,250 candidates per night — mostly noise — so a real but weak effect could be diluted below detectability."
    - "Preprint; single author."
  reviewState: ai_extracted
  origin:
    ref: "transients research report — source-mining layer"
