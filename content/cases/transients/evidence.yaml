  claimIds: [TRN-C006, TRN-C005]
  sourceId: SRC-CANN-2026B
  direction: supports
  strength: moderate
  sourceStatement: >-
    Testing 12,510 Harvard exposures and 638 Palomar fields against the Kp
    geomagnetic index, the paper reports no significant trend in reference
    populations (stellar counts, limiting magnitude) with storm intensity,
    and constrains atmospheric airglow to ≤12% of the reported POSS-I
    transient suppression at 95% confidence. It presents this as a general
    protocol for artifact control in historical plate archives.
  editorInference: >-
    Does the useful negative work that most of this literature does not:
    it names a specific environmental confounder that could manufacture
    the temporal patterns, tests it against reference populations, and
    reports that it does not survive. That does not make the nuclear-window
    correlation real — it removes one way of making it spurious, which is
    a different and smaller thing. Recorded here because the
    artifact-versus-signal question in this case has largely been argued
    rather than measured, and this is a measurement.
  exactLocator: "arXiv:2604.16470, abstract"
  limitations:
