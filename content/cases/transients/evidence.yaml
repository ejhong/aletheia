- id: TRN-E078
  title: "Hotspot preprint: fixed-altitude dependence of projected locations, and a misquoted altitude range — part 1"
  claimIds:
    - TRN-C119
  sourceId: SRC-BRUEHL-2026
  direction: context
  strength: moderate
  sourceStatement: 'Transients were projected onto a spherical shell at geosynchronous altitude using line-of-sight geometry from the Palomar Observatory coordinates: "we used line-of-sight projection geometry to project all transients".'
  editorInference: The companion modelling preprint (SRC-VILLARROEL-2026-MODELLING) gives 20,000–35,000 km above the surface, with its χ² estimator preferring 20,000 km; 26,371 km is that paper's geocentric shell radius for a 20,000 km altitude, so the hotspot paper has conflated radius with altitude. More consequentially, every hotspot location is computed at the top of the companion's range; at 20,000 km the same transients project to different Earth cells and the geographic identifications (Sedona, White Sands, Tampico) would move.
  exactLocator: "[p. 19]; misquote at [p. 4]"
  limitations:
    - Single assumed altitude; no sensitivity analysis across altitudes shown
    - "Direction set to \"context\" (from \"qualifies\") by the second reader (claude-sonnet-5, 2026-09-10, run 2026-09-10-verify-transients-174405, verify-v5) at intake: The quote at p.19 accurately describes the line-of-sight projection methodology used to place transients at geosynchronous altitude, and the sourceStatement fairly restates this without overreach; the locator is correct despite the odd 'misquote at p.4' annotation, which does not correspond to any actual conflicting text there. However, this passage is purely methodological (how projections were computed) and does not itself assert, limit, or condition the truth of the specific hotspot-significance claims (C119) or non-random concentration claims (the proposed non-random-concentration claim, not admitted at intake); it merely provides background context for both, so 'context' is the correct direction rather than 'qualifies'."
