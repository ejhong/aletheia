  claimIds: [TRN-C011, TRN-C020]
  sourceId: SRC-BUSKO-2026B
  direction: supports
  strength: moderate
  sourceStatement: >-
    Working with 532 plate pairs (1934–1957) from the Hamburg 0.6-m
    Doppel-Reflektor — chosen because its parabolic optics produce strong
    off-axis coma — the author reports that transient candidate images
    exhibit the coma aberration pattern expected from off-axis point
