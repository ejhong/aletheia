- id: TRN-E004
  title: "Automated morphology classification groups the marks with artifacts"
  claimIds: [TRN-C020, TRN-C002]
  sourceId: SRC-HAMBLY-BLAIR-2024
  direction: undermines
  strength: moderate
  sourceStatement: >-
    A random-forest classifier trained on Gaia-confirmed stars,
    Pan-STARRS-confirmed galaxies, and unmatched (likely spurious)
    detections assigns the putative transients artifact-like morphology;
    the authors conclude the sources are likely spurious artifacts of the
    photographic emulsion.
  editorInference: >-
    The strongest published argument that the sharpness observation points
    down the artifact branch. Note its dependence structure: the classifier
    is built on the same profile statistics as TRN-E003, so this is an
    interpretation layer over the same measurement, not a second
    independent detection.
  exactLocator: "§2.3, Tables 1–3, and conclusions (read via arXiv 2402.00497)"
  limitations:
    - "The training set's 'spurious' class is defined by absence of a modern counterpart — the very property that defines transient candidates — so a real transient population would also be labeled artifact-like by construction; the proponents press exactly this circularity objection."
    - "Morphological similarity to artifacts is not a demonstration that any specific mark is one."
