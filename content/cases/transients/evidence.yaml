  sourceId: SRC-DOHERTY-2026
  direction: supports
  strength: moderate
  sourceStatement: >-
    Using the original 107,875-object dataset supplied by the authors and
    independently written analysis code, the nuclear-window contingency
    result reproduces (relative risk 1.45, p = .011), survives negative
    binomial regression with precipitation, lunar-illumination, and
    cloud-cover controls (IRR 1.80 all transients; 3.98 sunlit-only), and
