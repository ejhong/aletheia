- id: TRN-E041
  title: "Hotspot preprint: 16 of 137 Earth-projected 5°×5° cells show Bonferroni-significant transient excess"
  claimIds:
    - TRN-C119
  sourceId: SRC-BRUEHL-2026
  direction: supports
  strength: moderate
  sourceStatement: Projecting p ≥ 0.70 transients (11,418) and plate-aware controls (23,814) onto a 35,786 km shell and binning in 5°×5° Earth-fixed cells, the source reports that of 137 cells with ≥5 expected transients, 16 cells "exhibited a significant excess of transients relative to random control" expectations under Bonferroni-corrected conditional binomial tests (Table 1), concentrated in the eastern Pacific west of southern Mexico/Central America, the southern Gulf of Mexico, and one cell in the southwestern US.
  editorInference: The excess is relative to the group's own per-plate random control, and the absolute O/E ratios are largest (up to 17.9) in cells fed by one to three plates (Supplemental Table 1). ChatGPT is stated to have assisted sample preparation and the tests. A plate whose defect rate is high would project its excess to whatever Earth cell the fixed-altitude geometry assigns it, so hotspot significance is not a test of the sky.
  exactLocator: "[p. 5], Table 1 [p. 31]"
  limitations:
    - Fixed 35,786 km projection; locations shift with altitude
    - Same working catalog and ML filter as all group results
    - Control is the group's own construction
