  sourceStatement: >-
    Because the nine 1950 sources are present on the original negative,
    and the 1952 triple appears in the original survey digitization and
    not only on copy material, the manuscript concludes this "disfavours
    the copy-plate-artefact hypothesis of Hambly & Blair (2024) for these
    specific sources, since the features are not confined to the copy
    material." It frames registration against the original digitization
    as "the actual discriminant" for that hypothesis: a feature intrinsic
    to the original exposure appears there; a feature born in copying
    would appear only in copy material.
