- id: TRN-E005
  title: "The plate-copy genealogy: DSS and SuperCOSMOS share an ancestor"
  claimIds: [TRN-C007]
  sourceId: SRC-HAMBLY-BLAIR-2024
  direction: supports
  strength: strong
  sourceStatement: >-
    Atlas copy production used contact printing: an intermediate glass
    positive was made from each original POSS-I negative, and
    second-generation copy negatives were printed from that positive. The
    DSS and SuperCOSMOS data used in the transient studies are independent
    scans of independent copy negatives that were generated from the same
    copy positive of the one original negative.
  editorInference: >-
    This dissolves the "found in two independent digitizations" argument
    that made the candidates look robust: a defect on the shared
    intermediate positive would propagate into both datasets. It
    simultaneously defines the decisive test — only the original negatives
    sit above the shared stage.
  exactLocator: "§2 (read via arXiv 2402.00497)"
  limitations:
    - "Establishes a pathway, not an occurrence rate; no census of star-like copy-stage defects exists (TRN-R007)."
