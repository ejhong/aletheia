  title: "Analogous candidates on Hamburg Observatory plates"
  claimIds: [TRN-C010]
  sourceId: SRC-BUSKO-2026A
  direction: supports
  strength: moderate
  sourceStatement: >-
    A search of rapidly repeated (≈30 minutes apart) same-night plate
    pairs from the Hamburg Observatory 1.2-m Großer Schmidtspiegel,
    digitized by the APPLAUSE archive, finds evidence of transients
    similar to those reported by the VASCO project on POSS plates,
    including systematically narrow FWHM relative to stellar point-spread
