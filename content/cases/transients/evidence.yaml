- id: TRN-E008
  title: "Independent pipeline recovers the canonical events and most of the catalog"
  claimIds: [TRN-C004, TRN-C001, TRN-C003]
  sourceId: SRC-HAYES-2026
  direction: supports
  strength: strong
  sourceStatement: >-
    A from-scratch detection pipeline (sigma-clipped detection, PSF
    filtering, local astrometric refinement, cross-epoch matching against
    POSS-I Blue and POSS-II Red, Pan-STARRS DR1 rejection) recovers 8 of 9
    April 1950 sources and 3 of 3 July 1952 sources, with ~0.2 false
    positives per 10-arcmin control field; a full-footprint sweep yields
    2.85 million candidates, of which 3,450 of Solano's 5,399 published
    candidates (63.9%) are matched at a median separation of 0.94 arcsec.
    None of the unrecovered Solano sources within the footprint has a
    Pan-STARRS DR1 counterpart within 3 arcsec.
  editorInference: >-
    The canonical detections do not depend on the VASCO team's private
    software. The 500-fold gap between his 2.85-million-candidate sweep
    and the vetted 5,399 also demonstrates how completely the "population"
    depends on extraction and vetting choices.
  exactLocator: "Abstract, §III.1–III.2, Tables 1 and Figs. 3–4 (read via arXiv 2604.04810)"
  limitations:
    - "Independent extraction, not independent material: the pipeline reads the same digitized DSS descendants of the same photographic copies."
    - "The full-sky sweep ran with preliminary (looser) parameters; the author flags that a calibrated reprocessing should yield a substantially smaller catalog."
