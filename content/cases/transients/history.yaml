- date: "2026-08-24"
  kind: content
  change: >-
    Plate III added — a three-panel figure showing the POSS-I copy chain (original negative → glass positive → distributed second-generation copy), with the same two scratches inherited through every generation. It is placed in the article beside the copy-ancestry argument (TRN-C007) and appears on the pages for TRN-C007 and TRN-C020. Adding it required amending the image rules: plate provenance previously had to include a public sourceUrl, which no figure supplied directly by a researcher can have. The schema now accepts a second, equally strict form — suppliedBy plus permission, both required together — and the credit line names the supplier on the plate itself.
  reason: >-
    The figure makes visible the mechanism the whole case turns on, which a paragraph of prose conveys poorly. The old rule would have excluded it not because its provenance was unknown but because its provenance was direct, which selects for whatever has already been published rather than for what is checkable. The replacement rule forbids unrecorded provenance just as absolutely, and requires the reader be told the figure came from a party to the dispute.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-24"
  kind: content
  change: >-
    Two sources and two evidence records added from the literature watch: Cann's third preprint (SRC-CANN-2026C, TRN-E020), which preregisters a post-storm transient-recovery profile and proposes a natural mechanism — magnetospherically trapped icy dust at geosynchronous altitude — and Zhitnitsky's dark-matter interpretation (SRC-ZHITNITSKY-2026, TRN-E021). Both are recorded weakly and neither is entered as support: TRN-E020 qualifies, because a natural near-Earth source would leave the near-Earth rung (TRN-C021) standing while removing the reason to believe the artificial one (TRN-C022); TRN-E021 is context only, because it takes the transients' reality as its premise and so inherits the crux (TRN-C020) rather than bearing on it. Three further items in the same watch run were checked and already held: Doherty 2605.01190, Cann 2604.16470 and Bruehl et al. 2604.18799.
  reason: >-
    The case had been framed as plate chemistry versus artificial reflectors. Cann's proposal is a third family — real near-Earth objects that are natural — and a map of a controversy that omits a live third option is not neutral, whatever its verdicts say. Recording it at low weight, with its dependence on the same author's earlier work stated, is the honest form of that correction.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-24"
  kind: content
  change: >-
    The microscopy manuscript arrived. Yang & Villarroel's unpublished "Microscopy assessment of two multiple-transient candidates" — supplied by the authors' group ahead of publication, read in full, deliberately not committed to this repository — is recorded as SRC-YANG-VILLARROEL-2026 with three evidence records. TRN-E022: all nine 1950 sources are present on the original glass at Caltech, and the 1952 triple is not confined to copy material. TRN-E023: the copy-stage defect mechanism therefore cannot explain the two canonical events, though it keeps its force over the uninspected catalog. TRN-E024: microscopy cannot distinguish a sub-second flash from an intrinsic emulsion defect, and the manuscript's own microscopist — directed to the field by Hambly — judged emulsion defects a reasonable attribution. The overview's centerpiece section was rewritten from "the observation nobody has made" to "the observation, finally made," recording that the decisive test returned neither of its two anticipated outcomes: the crux narrows from "original or copy" to "flash or flaw," which single-source microscopy cannot answer. TRN-R001's information gain is revised downward accordingly, and TRN-R009 (multi-station simultaneous imaging, the manuscript's own prospective proposal) is added to the agenda.
  reason: >-
    This is the event the case was structured around, and the ledger's job is to record what the test actually returned rather than the verdict either camp hoped for. Everything is labeled reported-not- established: the manuscript is unpublished, the examination was not blind, and no outsider has repeated the registration.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

