# Change history for the transients case. Append-only.

- date: "2026-08-22"
  change: >-
    Source-mining layer produced: an AI research report ("Adapting the
    Villarroel transient research to Aletheia," research/ folder) mapped
    the VASCO/POSS-I literature onto the Aletheia structure — a proposed
    claim ladder separating five propositions (real plate mark, real
    incident light, near-Earth reflection, artificial object,
    extraterrestrial artifact), a replication-independence taxonomy, and a
    draft research agenda.
  reason: "Structure the topic before importing anything, so evidence for low rungs cannot silently support high ones."
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

