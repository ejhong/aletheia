- date: "2026-08-24"
  kind: content
  change: >-
    Independence note sharpened on SRC-DOHERTY-2026, volunteered by the
    proponent side against interest: the author of the replication was
    initially unconvinced by the transient claims, produced the
    replication from that position, and subsequently joined the group
    while continuing to work semi-independently. Recorded because the
    sequence cuts both ways — it strengthens the replication itself,
    which was performed from outside and while skeptical, and it means
    later output under that name is group-affiliated rather than
    independent. The publication status reported for Busko 2026b
    (accepted at Scientific Reports, in press) is recorded as
    proponent-reported and explicitly NOT confirmed against the journal.
  reason: >-
    Independence rules: how many genuinely independent evidential events
    exist is the load-bearing question in this case, and a correction to
    an independence characterization matters more than another paper.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-24"
  kind: content
  change: >-
    TRN-R001 (blind examination of the original negatives) updated with a
    research-status note: the proponent group reports that the original
    Palomar plates are themselves negatives, that they have already
    examined those originals for the nine April 1950 transients, and that
    a microscopy manuscript is in preparation. That manuscript has not
    been seen and no result from it is recorded. No claim credibility
    changed. The project's framing shifts from "has anyone examined the
    originals" to whether the examination was blind, recorded the
    generation at which each mark first appears, and can be repeated by a
    party outside the group — which argues for preregistering that
    protocol before the manuscript appears.
  reason: >-
    Observation before interpretation: a reported examination is not a
    result, and the decisive test's value depends on blinding and
    independent repeatability rather than on the examination having
    happened.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

