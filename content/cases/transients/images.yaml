# Image records. The cover is AI-generated editorial artwork (labeled as
# such); plates are real photographs from Wikimedia Commons with verified
# licenses. Per project policy, no AI-generated image may ever be a plate,
# and no plate implies the depicted object is evidence for any claim beyond
# its stated "depicts" line.

- id: IMG-TRN-COVER
  role: cover
  file: /images/cases/transients/cover.jpg
  alt: >-
    Hand-tinted engraving of an observer crouched at a brass refracting
    telescope under a deep Prussian-blue night sky, a pale globe on a
    pedestal beside him and one bright star flaring overhead.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-22"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph,
    chromolithograph plate from a vintage natural-history atlas. An
    allegorical emblem for a case titled "Before Sputnik?" in the domain of
    Astronomy · Archival surveys: a symbolic, typological composition
    suggesting the question — Do star-like transients on 1950s photographic
    sky-survey plates record real optical flashes from objects near Earth
    before the first satellite? — without depicting any real site, artifact,
    or dataset as documentation. Fine copperplate cross-hatching and stipple
    engraving beneath soft, translucent hand-applied watercolor washes. Full
    color in subdued antique mineral pigments — deep Prussian blue and slate
    blue in the night sky, silver-cream stars, one small warm brass accent
    on the instrument — over warm-black ink linework on aged warm cream
    paper (#f6f1e8). Colors muted and slightly faded as if printed in 1870;
    never saturated modern digital color, no gradients, no glow. Darwin-era
    natural-history journal plate aesthetic, generous plain paper margins,
    quiet composition. Absolutely no text, no labels, no captions, no border
    frame lines. Unmistakably a hand-tinted engraving — stylized editorial
    artwork, not photorealistic, no photograph.

