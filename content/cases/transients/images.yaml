- id: IMG-TRN-P03
  role: plate
  file: /images/cases/transients/plates/poss1-copy-chain.jpg
  alt: >-
    Three panels of the same POSS-I star field at successive stages of the
    survey's copying chain. Left, labelled "Original glass negative": dark
    stars on a pale background, crossed by two faint linear scratches.
    Centre, "Copy glass positive": the same field tonally inverted, pale
    stars on black, with the same two scratches. Right, "Copy negatives on
    glass, film or paper": three stacked sheets showing the field again in
    negative, the same crossing scratches still present.
  source: user
  license: "Used with permission of the copyright holder"
  credit: "Figure supplied by Beatriz Villarroel (VASCO project); underlying imagery from POSS-I survey material"
  plateNumber: 3
  mediaType: "composite figure"
  depicts: >-
    The generation chain that every published analysis in this case depends
    on. The Palomar survey's original glass negatives were contact-printed
    to glass positives, and those positives printed again to the second-
    generation copies that were distributed to observatories and later
    digitized. The two linear scratches visible in all three panels show
    what the chain does: a feature introduced at any stage is inherited by
    everything printed from it downstream, which is precisely why the
    generation at which a mark first appears settles whether it came from
    the sky (TRN-C020) and why two "independent" digitizations descending
    from a shared positive are not independent (TRN-C007). The scratches
    here are ordinary plate damage, not the disputed transients; no
    candidate source is depicted.
  provenance:
    photographer: "Not established; panels are reproductions of POSS-I plate material"
    suppliedBy: "Beatriz Villarroel (Nordic Institute for Theoretical Physics; VASCO project), by email to the editor, 2026-08-24"
    permission: "Publication permission given by the supplier to the editor, 2026-08-24; recorded here rather than inferred"
    date: "2026-08-24 (supplied)"
  claimIds: [TRN-C007, TRN-C020]
