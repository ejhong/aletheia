  claimIds: []

- id: IMG-TRN-P02
  role: plate
  file: /images/cases/transients/plates/pleiades-large.jpg
  alt: >-
    Wide-field sky-survey image of the Pleiades star cluster: hundreds of
    point-like stars with four bright members wreathed in blue reflection
    nebulosity.
  source: commons
  license: "Public domain"
  credit: "NASA, ESA, AURA/Caltech, Palomar Observatory, via Wikimedia Commons"
  plateNumber: 2
  depicts: >-
    Context only — this image contains no transient candidates and is
    evidence for nothing in this case. The Pleiades star cluster as
    recorded by the Palomar Observatory sky survey (digitized
    Schmidt-plate imagery, released with the 2004 Hubble distance
    measurement), shown solely to illustrate what survey plate imagery
    looks like in general: thousands of star-like points per field, any
    one of which a transient search must distinguish from a defect.
  provenance:
    photographer: "Palomar Observatory sky survey; NASA/ESA/AURA/Caltech release"
    date: "2004-06-01 (release)"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Pleiades_large.jpg"
    originalTitle: "File:Pleiades large.jpg"
  claimIds: []
