# Image records. The cover is AI-generated editorial artwork (labeled as
# such); plates are real photographs from Wikimedia Commons with verified
# licenses. Per project policy, no AI-generated image may ever be a plate,
# and no plate implies the depicted object is evidence for any claim beyond
# its stated "depicts" line.

- id: IMG-TRN-COVER
  role: cover
  file: /images/cases/transients/cover.jpg
  alt: >-
    Engraving of a small telescope on a tripod under a starry sky beside an
    open wooden archive box holding a dark glass plate dotted with stars;
    one bright star with an orange flare hangs in the sky above.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v1
  model: "gpt-image-1"
  prompt: >-
    19th-century scientific expedition lithograph, copperplate engraving. An
    allegorical emblem for a case titled "Before Sputnik?" in the domain of
    Astronomy · Archival surveys: a symbolic, typological composition
    suggesting the question — Do star-like transients on 1950s photographic
    sky-survey plates record real optical flashes from objects near Earth
    before the first satellite? — without depicting any real site, artifact,
    or dataset as documentation. Fine cross-hatching and stipple shading,
    hand-engraved linework. Monochrome deep warm-black ink (#201b12) on aged
    warm cream paper (#f6f1e8), with one restrained oxidized-copper (#9a5b33)
    accent on the compositional focal point. Darwin-era natural-history
    journal plate aesthetic, generous plain paper margins, quiet composition.
    Absolutely no text, no labels, no captions, no border frame lines.
    Unmistakably an engraving — stylized editorial artwork, not
    photorealistic, no photograph.

