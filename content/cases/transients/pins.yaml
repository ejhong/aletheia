# Pinned commitments (docs/AUTOMATION.md). Append-only. Corrections are
# the residue of past mistakes; directives are founder editorial
# commitments recognized in AGENTS.md §7. Pins bind presentation, never
# verdicts. The loader enforces every check on every build.

- id: TRN-PIN001
  kind: correction
  statement: >-
    The microscopist's against-interest opinion stays in the record
    verbatim: the independent examiner who inspected the Caltech plate
    found it reasonable to attribute the anomalies to emulsion defects.
    This is the closest thing the case has to an independent eye on the
    physical evidence, it cuts against the featured hypothesis, and no
    rewrite may launder, soften, or drop it (§3.11: evidence unfavorable
    to the featured hypothesis is recorded).
  origin:
    date: "2026-08-24"
    ref: "TRN-E024 (Yang-Villarroel manuscript intake); the quote survived re-verification against the published preprint, arXiv:2608.26371"
    attribution: "banked commitment (maintainer, from the intake's own candor)"
  checks:
    - type: string_present
      file: evidence.yaml
      value: "reasonable to attribute these anomalies to emulsion defects"

- id: TRN-PIN002
  kind: correction
  statement: >-
    The supplied-provenance and permission history on the microscopy
    source is preserved even now that the preprint is public: who granted
    citation permission, when, by what channel, and where the
    correspondence is held. The panel forced this standard into the
    constitution (§3.15 as amended 2026-08-25), and the record of how the
    source entered the ledger may not be scrubbed as tidying once the
    public version made it unnecessary.
  origin:
    date: "2026-09-01"
    ref: "SRC-YANG-VILLARROEL-2026 verification note; §3.15 amendment history (docs/DECISIONS.md 2026-08-25)"
    attribution: "banked commitment (maintainer)"
  checks:
    - type: string_present
      file: sources.yaml
      value: "granted by Beatriz Villarroel"
