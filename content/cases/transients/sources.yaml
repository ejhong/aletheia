- id: SRC-BRUEHL-VILLARROEL-2025
  title: "Transients in the Palomar Observatory Sky Survey (POSS-I) may be associated with nuclear testing and reports of unidentified anomalous phenomena"
  authors: ["Bruehl, S.", "Villarroel, B."]
  year: "2025"
  sourceType: paper
  identifier: "Scientific Reports 15: 34125. DOI: 10.1038/s41598-025-21620-3"
  url: "https://doi.org/10.1038/s41598-025-21620-3"
  verification: ai_verified
  verificationNote: >-
    DOI, title, authors, and article number verified via the Crossref API
    (2026-08-22 batch). Note: Cann (arXiv 2604.04950) cites this paper with
    the wrong article number (21620, read off the DOI, instead of 34125) —
    an example of why citations here are checked rather than copied.
  reliabilityNotes:
    - "The nuclear-window correlation paper (relative risk ≈ 1.45 for ±1 day of atmospheric tests) on the ~107,875-object working catalog."
