- id: SRC-CANN-2026C
  title: "Storm-Driven Suppression and Post-Storm Enhancement of Photographic Plate Transient Detections at Geosynchronous Altitude: Empirical Evidence and a Candidate Dusty Plasma Mechanism"
  authors: ["Cann, K."]
  year: "2026"
  sourceType: preprint
  identifier: "arXiv: 2604.06234 (submitted 2026-04-04, v1)"
  url: "https://arxiv.org/abs/2604.06234"
  verification: ai_verified
  verificationNote: >-
    Title, sole authorship, submission date, primary category (astro-ph.IM)
    and full abstract read on the arXiv record 2604.06234 (2026-08-24 watch
    batch). Body text not read; all figures below are the abstract's own.
  reliabilityNotes:
    - "Third Cann preprint in this case (with SRC-CANN-2026 and SRC-CANN-2026B) and not independent of them: it builds on the first as an established result and shares the same author and the same 107,875-object catalog lineage."
    - "Preregisters its recovery-profile test — rare in this dispute and worth crediting on its own — but reports the combined significance as a range (3.6–4.7 sigma) that the paper says depends on an independence assumption it does not establish."
