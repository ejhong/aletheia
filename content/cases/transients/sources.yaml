  authors: ["Busko, I."]
  year: "2026"
  sourceType: preprint
  identifier: "arXiv: 2606.08319 (June 2026)"
  url: "https://arxiv.org/abs/2606.08319"
  verification: ai_verified
  verificationNote: >-
    Full text read via arXiv 2606.08319 (2026-08-22 batch).
  reliabilityNotes:
    - "Proposes and applies the most diagnostically important positive test in the case: coma aberration as a physical signature of light that passed through the telescope optics."
