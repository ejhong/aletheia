# Literature watch (docs/MAINTENANCE.md § literature watch).
# Weekly, scripts/watch-literature.mjs runs these queries against arXiv and
# Crossref (OpenAlex optional) and surfaces new items as discovery-only
# proposals under proposals/watch/<runId>/. Nothing lands in sources.yaml
# without human review. Schema: WatchConfigSchema in src/domain/schema.ts.
#
# This case's literature is fast-moving (five of its sixteen sources
# appeared in 2026 alone) and mostly arXiv-first, so arXiv is included
# everywhere. Query strings are kept short: the arXiv search ANDs every
# word. Keyword filters use multi-word phrases: Crossref relevance search
# is loose, and generic single words (plate, emulsion, shadow) let
# unrelated engineering and food-science papers through.

queries:
  - id: vasco-vanishing-sources
    query: "vanishing transients Palomar"
    sources: [arxiv]
    keywordGroups:
      - [POSS, Palomar, "photographic plate", "plate archive", vanishing, transient]
      - [survey, sky, astronom, catalog, candidate, source]
    note: >-
      The core thread: new work on POSS-I vanishing point sources, proponent
      (Villarroel/Solano/Bruehl lineage) or critical (Watters lineage) —
      the canonical-events and population-statistics themes both feed on it.

  - id: villarroel-team
    query: "transients"
    sources: [arxiv]
    authors: [Villarroel]
    note: >-
      Anything new from the hypothesis's principal proponent, so the case
      tracks the VASCO-team literature it must weigh (nine of the sixteen
      sources carry Villarroel as author or co-author).

  - id: plate-archive-transient-searches
    query: "photographic plates transients"
    sources: [arxiv]
    keywordGroups:
      - ["photographic plate", "plate archive", Schmidt, APPLAUSE, emulsion]
      - [transient, vanishing, appear, "point source", candidate]
    note: >-
      Independent searches outside the Palomar plate lineage — the
      Busko Hamburg/APPLAUSE approach (TRN-R006) and follow-ups to the
      coma-aberration discriminant (TRN-C011, TRN-R003).

  - id: plate-defect-forensics
    query: "photographic plate defects astronomical"
    sources: [arxiv]
    keywordGroups:
      - ["photographic emulsion", "photographic plate", "plate defect", "copy plate"]
      - [defect, artifact, artefact, spurious, contaminant, forensic, microscop]
    note: >-
      The strongest mundane mechanism: copy-stage defects in plate
      genealogies (Hambly & Blair, TRN-C007) and any measurement of the
      star-like defect base rate the case says is missing (TRN-R007).

  - id: earth-shadow-ensemble-statistics
    query: "Earth shadow transients"
    sources: [arxiv]
    keywordGroups:
      - ["Earth shadow", "Earth's shadow", "nuclear test", geosynchronous, geostationary]
      - [transient, candidate, catalog, VASCO, POSS]
    note: >-
      The ensemble-statistics thread — shadow-deficit and nuclear-window
      analyses, replications, and catalog-construction critiques
      (TRN-C005, TRN-C006; TRN-R004, TRN-R005, TRN-R008).
