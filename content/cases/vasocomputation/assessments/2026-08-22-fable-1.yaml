  synthesis: >-
    This ladder has an unusual shape: its mechanism rung is stronger than
    its observation rung. The latch-bridge (VASO-C010) is textbook
    physiology; slow breathing's autonomic effect (VASO-C013) is
    review-grade; even the once-exotic read path — vascular state modulating
    neurons (VASO-C012) — now has direct animal evidence. The trouble is at
    the bottom and the top. At the bottom, the anchor phenomenon
    (VASO-C004, the seconds-scale breath-locked release) is pure first-person
    report: the critical report's audit found no time-resolved measurement
    of any release, ever, and the construct critique (VASO-C030) shows that
    even localizing the objects of study is unsolved. The two 1990s EMG
    studies (VASO-C002, VASO-C003) are the rung's best items — genuinely
    localized, genuinely stress-responsive — but they are one aging lineage,
    and their signal is neuromuscular, not vascular. At the top, the
    attribution claims outrun everything below them: no study has found a
    smooth-muscle latch at a tender point (the mechanism is borrowed, not
    observed), and the memory framing of VASO-C021 fails the
    write-store-read test — hysteresis is not yet memory, and the only
    organism demonstrated to store information in a flow network is a slime
    mold. The 2026 attention-inflammation study (VASO-C006) is the case's
    most important new fact: a controlled, preregistered
    cognition-to-periphery channel with no arousal confound. It proves the
    loop's regulatory half exists; it says nothing about latches. The honest
    roll-up: unresolved, not refuted — the featured hypothesis is unusually
    concrete and unusually cheap to test, its two linchpins are grade-D not
    because experiments failed but because they were never run, and the
    keystone experiment (VASO-R001) would move this assessment more than
    everything published to date combined. What would move it most, in
    order: the time-locked release imaging (VASO-R001), the
    latch-at-tender-point study (VASO-R004), and the vascular-memory readout
    experiment (VASO-R005).

