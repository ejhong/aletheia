  synthesis: >-
    The vasocomputation hypothesis — which proposes that muscle knots are
    maintained vascular smooth-muscle latch states, and that vascular tension
    functions as a memory medium participating in mental life — constructs an
    elegant theoretical edifice upon established physiological foundations. The
    evidence records robustly confirm the existence of the lower mechanistic
    components. Smooth muscle utilizes the latch-bridge state to maintain
    tension at a fraction of normal energetic costs (VASO-C010). The
    once-speculative hemo-neural hypothesis now enjoys direct causal support,
    demonstrating that vascular state can instantaneously modulate neural
    activity via mechanosensitive channels (VASO-C012). Furthermore, cognitive
    stressors can selectively increase electrical activity at tender points
    (VASO-C003), and voluntary attention can measurably down-regulate localized
    peripheral inflammation (VASO-C006). Steelmanning the hypothesis,
    vasocomputation brilliantly resolves the metabolic paradox of chronic muscle
    knots — explaining how tension is sustained indefinitely without massive
    energy expenditure — and integrates phenomenological observations into a
    unified biopsychosocial framework where the nervous system writes tension to
    the vasculature, and breath acts as the unlatching mechanism.

    However, constructing a plausible chain of mechanisms does not prove that
    biology actually utilizes them in the proposed manner. The critical weakness
    of the hypothesis is the complete absence of direct experimental evidence
    for its keystone synthesis claims (VASO-C020, VASO-C021). The critical audit
    found zero studies verifying the presence of smooth-muscle latches at tender
    points, nor any objective, time-locked imaging of the seconds-scale
    "release" phenomenon (VASO-C004) that serves as the theory's experiential
    anchor. Furthermore, the observational base itself is fraught; systematic
    reviews demonstrate that manual trigger-point localization suffers from poor
    reliability and lacks a validated reference standard (VASO-C030).
    Steelmanning the conventional skeptical account, every observed feature of
    muscle knots — including the localized EMG chatter, acidity, and the
    subjective feeling of release — is entirely compatible with neuromuscular
    guarding, expectation, and the generalized parasympathetic shift of slow
    breathing. This conventional model requires no extrapolation of unobserved
    vascular mechanisms. Ultimately, until the proposed keystone experiments
    imaging a time-locked release are conducted, the vasocomputation framework
    remains an intricately reasoned and highly testable hypothesis, but one that
    lacks the direct evidentiary links necessary to substantiate its most
    profound claims. The case as a whole is presently unresolved.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: high
    reasoning: The strong form of vasocomputation — that vascular tension stores
      cognitive content — is a theoretical proposal lacking experimental
      validation. While hysteresis exists in biological flow networks, there is
      no evidence demonstrating a write-store-read cycle for specific mental
      content in humans. The strongest opposing consideration is that hysteresis
      in a vessel is not equivalent to biological memory, and showing that
      neurons read out stored vascular state as task-relevant content has never
      been achieved.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: high
    reasoning: The core mechanism is borrowed from vascular physiology and has not
      been observed in the target tissue. A critical audit found no direct
      evidence identifying smooth-muscle latches at tender points or any
      time-locked objective releases. The strongest opposing consideration is
      that all observed features of muscle knots are compatible with the
      conventional model of neuromuscular guarding, making a novel vascular
      mechanism unnecessary without direct proof.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: There are no empirical studies applying prespecified coding rules to
      test the alignment between traditional contemplative anatomies and modern
      vascular structures. The convergence remains a suggestive phenomenological
      parallel. The strongest opposing consideration is that retrospective
      pattern matching guarantees apparent alignment given enough traditional
      maps and modern anatomical features, rendering the claim speculative
      without blinded, preregistered testing.
  - claimId: VASO-C010
    verdict: established
    confidence: high
    reasoning: The latch-bridge state is a foundational, textbook element of
      smooth-muscle physiology established by Hai and Murphy in 1988, supported
      by decades of work. It demonstrates that biology possesses a low-energy,
      history-dependent mechanism for maintaining tension. The strongest
      opposing consideration is that extrapolating this mechanism from general
      vascular preparations to indefinite in vivo holds at specific tender-point
      sites goes far beyond current literature.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: 'The conditional logic is fundamentally sound: because structural
      tissue remodeling operates on timelines of days to weeks, a genuine
      seconds-scale local change must reflect a shift in maintained
      physiological state. However, the premise that objective local releases
      actually occur remains unmeasured. The strongest opposing consideration is
      that the "felt release" may be an entirely central perceptual event
      involving no local tissue change whatsoever, rendering the timeline
      argument moot.'
  - claimId: VASO-C012
    verdict: well_supported
    confidence: high
    reasoning: Once viewed as an exotic proposal, the hemo-neural hypothesis now has
      direct causal backing, including a 2024 Science paper demonstrating that
      blood-pressure pulsations rapidly modulate neuronal activity via
      mechanosensitive channels. This establishes the necessary "read path" for
      vasocomputation. The strongest opposing consideration is that these
      observed effects reflect instantaneous modulation rather than the reading
      of stored, history-dependent information required for actual memory.
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: Systematic reviews confirm that slow breathing and extended
      exhalation reliably induce autonomic shifts toward parasympathetic
      dominance. This establishes breath as a genuine, voluntary lever on the
      autonomic nervous system. The strongest opposing consideration is that a
      generalized systemic relaxation does not prove the existence of localized,
      site-specific unlatching events at tender points.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: Systematic reviews confirm that manual trigger-point palpation
      suffers from poor inter-examiner reliability and lacks a validated
      diagnostic gold standard. This creates a fundamental measurement
      bottleneck for the entire field. The strongest opposing consideration is
      that poor palpation reliability reflects the limitations of the clinical
      exam rather than the absence of the phenomenon, as instrumented measures
      consistently find localized abnormalities.
  - claimId: VASO-C001
    verdict: mixed
    confidence: moderate
    reasoning: While practical experience and community surveys document the
      ubiquity of muscle tenderness across populations, the ontological status
      of discrete, countable "spots" is actively disputed in the peer-reviewed
      literature. The manual exams used to map them suffer from notoriously low
      reliability. The strongest opposing consideration against their
      discreteness is that localized "points" may simply be artifacts of
      clinical training and expectation superimposed on broader regional
      tenderness.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Early 1990s studies detected localized spontaneous EMG activity
      confined to a millimeter-scale nidus at trigger points, demonstrating an
      island of ongoing electrical activity. This has been replicated as a
      general phenomenon in the literature. However, the strongest opposing
      consideration is that the recorded signal is entirely skeletal-muscle
      electrophysiology—such as endplate noise or spindle discharge—providing no
      direct evidence for a vascular mechanism.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: A 1994 study demonstrated that purely cognitive stress can
      selectively increase localized electrical activity at trigger points
      without generalized tensing, serving as a potential "write path." Yet, the
      finding relies on an old, small sample (n=14) from a single research
      lineage. The strongest opposing consideration is that generalized
      sympathetic drive to muscle spindles would produce this identical trace
      without requiring any localized vascular storage.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: high
    reasoning: The breath-assisted release protocol is an anchor of the theory, but
      it relies entirely on first-person practitioner testimony. No time-locked,
      objective measurements of tissue stiffness or perfusion during a felt
      release currently exist. The strongest opposing consideration is that the
      subjective feeling of release may be generated purely by expectation,
      attention shift, and general relaxation, with no local objective changes
      occurring at all.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Microdialysis studies and imaging systematic reviews confirm that
      active sites exhibit objective local differences, including an acidic
      biochemical milieu and abnormal blood flow. This refutes the idea that
      trigger points are pure examiner artifacts. The strongest opposing
      consideration is that small, heterogeneous methodologies risk
      manufacturing apparent objectivity, and the findings (like ischemia) are
      equally compatible with conventional neuromuscular guarding.
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: A 2026 Nature Human Behaviour study provides strong, preregistered
      within-subject evidence that focused attention can regulate peripheral
      acute inflammation. This provides an existence proof for a top-down
      cognitive-to-peripheral channel. The strongest opposing consideration is
      that generalizing from acute vagal immune regulation in healthy skin over
      twenty minutes to the rapid, seconds-scale unlatching of chronic vascular
      tension involves an enormous speculative leap.
