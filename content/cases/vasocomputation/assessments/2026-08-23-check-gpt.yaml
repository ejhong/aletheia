  synthesis: >-
    The dossier lays out a ladder from well-established physiology and autonomic
    regulation up to a speculative synthesis in which vascular smooth-muscle
    latch states underlie muscle “knots” and even participate in memory and
    mental life. The lower rungs are solid. Smooth-muscle latch-bridge behavior
    (VASO-C010) is mainstream vascular physiology, backed by Hai & Murphy’s
    kinetic work (VASO-E003). Slow breathing as a reliable driver of
    parasympathetic tone (VASO-C013) is supported by a systematic review
    (VASO-E009). The hemo‑neural direction — vascular state modulating neuronal
    activity (VASO-C012) — is now more than a hypothesis: Moore & Cao framed it
    conceptually (VASO-E004), and Salameh et al. demonstrate mechanosensitive
    modulation by blood-pressure pulsations (VASO-E005). These results make it
    scientifically plausible that vascular state can influence neural
    computation in real time.

    At the level of the palpable phenomenon, the existence of tender points in
    muscle and fascia (VASO-C001) is supported by clinical experience and some
    survey data (VASO-E015), but the critical report correctly notes that even
    the discreteness and reproducibility of “spots” are contested (VASO-E012).
    Objective correlates nonetheless exist: microdialysis shows an acidic,
    mediator-rich milieu around active trigger points (VASO-E006), and a
    systematic review of imaging (VASO-E007) finds stiffer tissue and altered
    local blood flow (VASO-C005). Needle EMG studies (VASO-E001, VASO-E002)
    demonstrate small islands of spontaneous electrical activity (VASO-C002) and
    task-driven increases during mental stress (VASO-C003), implying ongoing,
    neurally addressable state at these sites. Together, these observations
    undercut the strongest “nothing there but examiner bias” view, even as
    palpation reliability is poor (VASO-C030, VASO-E011).

    Where the featured hypothesis needs to climb further, the evidential floor
    drops away. The key experiential premise — that sustained pressure plus slow
    exhalation produces a seconds-scale, breath-locked local “release”
    (VASO-C004) — rests entirely on first-person and practitioner testimony
    (VASO-E014); no experiment has yet imaged local stiffness or perfusion
    across such events. The conditional argument that a verified seconds-scale
    objective release would imply a change of maintained state rather than
    structural remodeling (VASO-C011) is conceptually sound, but its antecedent
    is empirically untested; this makes it hinge strongly on the unrun keystone
    elastography/Doppler study (VASO-R001). The mechanistic centerpiece — knots
    as latched microvascular states with local ischemia and guarding (VASO-C020)
    — remains a theoretically neat fit but is graded “no direct evidence
    located” by the critical report (VASO-E016): no smooth-muscle latch has been
    demonstrated at a tender point, and no time-resolved release has been
    captured.

    On the broader attribution rung, the weak form of vasocomputation — vascular
    state as one component of the state space shaping neural activity
    (VASO-C021, in its modest reading) — is increasingly plausible given the
    established bidirectional neurovascular coupling and the demonstrated
    ability of attention to modulate peripheral inflammation locally (VASO-C006,
    VASO-E008). But the strong form — that specific vascular latch patterns
    store predictions or “clinging” as contentful memory — has no direct
    write–store–read demonstration (VASO-E017, VASO-R005). Similarly, the
    proposed mapping from contemplative anatomies to a vascular-autonomic
    tension system (VASO-C022) is currently an intriguing but methodologically
    fragile convergence, vulnerable to post-hoc matching in the absence of
    preregistered anatomical coding (VASO-R006).

    Structurally, the case has robust support for three ideas: (1) tender points
    with distinctive neural and biochemical signatures exist, though
    localization is noisy; (2) smooth-muscle latch, slow-breathing
    parasympathetic shifts, and hemo‑neural modulation are real physiological
    phenomena; and (3) cognition and attention can influence specific peripheral
    sites over tens of minutes. What is missing are the two decisive links:
    direct observation of breath-locked, seconds-scale mechanical/perfusion
    changes at releasing knots; and demonstration that microvascular
    smooth-muscle latch is actually the maintained element at these sites.
    Because both linchpin claims are unevidenced rather than weakly evidenced,
    the overall featured hypothesis — “state, not scar,” with vascular latch as
    the core state and a cognitive role for vascular tone — remains unresolved
    on the present record. It is neither well supported nor contradicted; it is
    an empirically sharpened, test-ready conjecture whose fate depends on a
    handful of relatively small, carefully controlled experiments.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: The claim that vascular smooth-muscle tension functions as a memory
      element participating in mental life goes beyond current evidence. The
      weak component — that vascular state modulates neural computation — is
      provisionally supported by the hemo‑neural hypothesis (VASO-E004) and
      mechanosensitive modulation data (VASO-E005), and by studies showing
      cognition and attention alter local peripheral physiology (VASO-E008).
      However, no experiment has demonstrated a full write–store–read cycle in
      which different prior inputs are stored in vascular latch states and later
      retrieved as contentful biases in neural activity (VASO-E017). The
      strongest opposing consideration is that, so far, all demonstrated
      vascular–neural effects appear as instantaneous modulation or generic
      ischemic influence, not durable, content-specific memories.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: The proposal that muscle knots are maintained vascular-autonomic
      latch states rather than structural lesions is an elegant synthesis that
      fits several observations (chronicity, low-energy maintenance, abnormal
      Doppler flow, ischemic-like chemistry) and is compatible with known latch
      physiology (VASO-E003) and hemo‑neural modulation (VASO-E005). Yet no
      study has directly identified latch-state smooth muscle at trigger points,
      nor captured a breath-linked release in stiffness and perfusion
      (VASO-E016). Existing EMG work (VASO-E001, VASO-E002) demonstrates
      localized neuromuscular activity but does not implicate vasculature, and
      objective abnormalities in stiffness, chemistry, and flow (VASO-E006,
      VASO-E007) remain compatible with neuromuscular guarding plus secondary
      ischemia. The strongest opposing consideration is that every load-bearing
      mechanistic step for this claim currently lacks direct in situ evidence.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: The idea that contemplative anatomies of knots and channels are
      first-person maps of the same vascular-autonomic tension system is
      thematically coherent with the hypothesis and phenomenologically
      plausible, given that many traditions emphasise knots, breath, and changes
      in consciousness. However, no preregistered, blinded coding of traditional
      locations against modern anatomy has been conducted, so the apparent
      correspondence is entirely vulnerable to post-hoc pattern matching and
      multiple-degrees-of-freedom alignment. The strongest opposing
      consideration is that with many traditional maps and many anatomical
      structures, some alignments are inevitable by chance, and without strict
      methodology this convergence cannot carry evidential weight.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: The existence of a latch-bridge state in vascular smooth muscle is a
      standard result in smooth-muscle physiology. Hai & Murphy’s kinetic model
      (VASO-E003) and follow-on work show that dephosphorylated cross-bridges
      can remain attached and sustain force with low energetic cost after
      activating signals subside, matching the core of the claim. While
      questions remain about how this mechanism operates over long in-vivo
      timescales or in specific anatomical beds, those uncertainties concern
      extrapolations used by the synthesis, not the basic existence of latch
      behavior. The main opposing consideration is that evidence for latch spans
      minutes to hours in experimental preparations, so using it as an
      indefinite-duration storage element in specific microvascular niches is
      unproven.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The conditional reasoning — that a genuine seconds-scale objective
      release implies a change in actively maintained physiological state rather
      than tissue remodeling — is consistent with well-established remodeling
      timescales for collagen and scar. If a knot’s stiffness and perfusion
      measurably changed within a few seconds, attributing that to structural
      change would be implausible, so the logic is sound. However, the premise
      that such an objective rapid change actually occurs rests purely on
      subjective reports of “releases” (VASO-E014, VASO-C004), and has never
      been empirically confirmed with imaging. The strongest opposing
      consideration is that the felt release could be entirely central — altered
      perception, reduced guarding — with no local tissue change, in which case
      the conditional remains true but empirically vacuous.
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The hemo‑neural hypothesis, in the modest sense that local vascular
      state can modulate nearby neuronal activity, has gained empirical support.
      Moore & Cao (VASO-E004) articulated credible mechanical, thermal, and
      chemical pathways, and Salameh et al. (VASO-E005) provide direct evidence
      that physiological blood-pressure pulsations can modulate central neural
      activity via mechanosensitive channels. These results establish a real
      causal influence of vascular dynamics on neurons, though in the form of
      immediate modulation. The strongest opposing consideration is that such
      effects may be entirely explained by instantaneous mechanical or metabolic
      changes, with no evidence yet that vascular state carries stored,
      content-specific information rather than acting as a generic gain or
      excitability modulator.
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: The claim that slow breathing, especially extended exhalation, shifts
      autonomic balance toward parasympathetic dominance is strongly backed by
      the systematic review from Zaccaro et al. (VASO-E009), which finds
      consistent increases in indices like heart-rate variability and
      respiratory sinus arrhythmia across studies. This positions breathing as a
      reliable voluntary lever on autonomic state, fitting with broader
      cardiovagal physiology. The main opposing consideration is that these data
      concern global autonomic indices in healthy subjects and do not
      demonstrate site-specific effects, so they do not by themselves show that
      a particular arteriole at a tender point unlatches during an exhale.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: The assertion that manual identification of myofascial trigger points
      lacks demonstrated inter-examiner reliability and a validated gold
      standard is supported by the Lucas et al. systematic review (VASO-E011),
      which concludes that manual exams cannot currently be recommended as
      objective diagnostic tests. Quintner et al.’s critique (VASO-E010) further
      underscores conceptual and measurement concerns around the trigger-point
      construct. While objective correlates (EMG nidus, imaging, microdialysis)
      argue against the view that “nothing is there,” they do not negate the
      specific finding that palpation is an unreliable localization method. The
      strongest opposing consideration is that improved imaging-anchored
      protocols might achieve higher reliability, limiting the generalizability
      of past reliability failures.
  - claimId: VASO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: The occurrence of discrete, tender, palpable points in muscle and
      fascia across the population is supported by widespread clinical
      experience and by tender-point surveys from rheumatology, summarized in
      the essay (VASO-E015). Additionally, imaging and biochemical studies that
      find focal abnormalities where examiners palpate (VASO-E006, VASO-E007)
      reinforce that such spots often correspond to objectively distinct sites.
      However, reproducibility and ontological status of sharply delimited
      “spots” are questioned in the critical report (VASO-E012) and in the
      palpation-reliability literature (VASO-E011), tempering the strength of
      the claim. The strongest opposing consideration is that at least some
      apparent discreteness may be an artefact of examiner technique and
      expectation rather than sharply bounded tissue entities.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The presence of sustained spontaneous needle-EMG activity confined to
      a small nidus at trigger points is supported by Hubbard & Berkoff
      (VASO-E001), with later literature referring to similar signals as
      “spontaneous electrical activity.” This provides evidence that certain
      tender sites are maintained as localized electromyographically active
      regions even at rest. The study is, however, small, from a single lineage,
      and the precise generator (endplate vs spindle) remains debated. The
      strongest opposing consideration is that the activity is clearly
      skeletal-muscle in origin, so it supports neuromuscular guarding
      explanations as well as any more exotic vascular-based model.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: McNulty et al. (VASO-E002) report that a cognitive stressor (mental
      arithmetic) selectively increases EMG activity at trigger points while
      adjacent control sites remain comparatively quiet without generalized
      muscle tensing, supporting the claim that a purely mental event can
      increase localized activity. This suggests that the nervous system can
      target these sites specifically, consistent with “addressability.”
      However, the study is small (n=14), from the same research lineage as
      Hubbard & Berkoff, and has not been independently replicated with modern
      tools. The strongest opposing consideration is that sympathetic drive to
      intrafusal or endplate structures within skeletal muscle could fully
      explain the findings without invoking any vascular storage or
      knot-specific mechanism beyond standard neuromuscular physiology.
  - claimId: VASO-C004
    verdict: unresolved
    confidence: low
    reasoning: The claim that sustained pressure plus slow exhalation can produce a
      felt release of a tender point within seconds is currently grounded solely
      in first-person and practitioner testimony (VASO-E014). While such reports
      are widespread and phenomenologically consistent, no imaging or objective
      measurement has yet been performed during felt releases to establish that
      a discrete local mechanical or perfusion change occurs on this timescale.
      Without such data, we cannot separate local physiological events from
      central perceptual and expectation effects. The strongest opposing
      consideration is that generalized relaxation, attention shifts, and
      expectancy could easily generate a convincing subjective sense of
      “release” without any specific local tissue change.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Evidence from Shah et al. (VASO-E006) shows elevated pain- and
      inflammation-related mediators in a more acidic milieu at and near active
      trigger points, and a systematic imaging review (VASO-E007) finds that
      active and latent points differ from healthy tissue in stiffness and
      blood-flow parameters. These converging modalities support the existence
      of measurable local biochemical, mechanical, and hemodynamic differences
      at clinically identified sites. However, studies are small, heterogeneous
      in methods and definitions, and the biochemical changes were not strictly
      confined to the trigger point itself. The strongest opposing consideration
      is that such abnormalities could arise downstream of chronic neuromuscular
      guarding or more diffuse inflammatory processes, so they do not uniquely
      implicate a vascular-latch mechanism.
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The Mizrachi et al. histamine skin-prick study (VASO-E008) provides
      preregistered, within-subject evidence that directing voluntary attention
      to an inflamed skin site reduces the magnitude and duration of the local
      inflammatory response compared with distraction, without changes in
      sympathetic arousal and with increased HRV. This supports the claim that
      attention can modulate localized peripheral physiology via autonomic and
      sensory routes. Nonetheless, the findings are from a single lab in an
      acute skin model with effects over roughly twenty minutes, and they
      concern immune regulation rather than smooth-muscle latch. The strongest
      opposing consideration is that known vagal anti-inflammatory reflex
      pathways can explain the results without implying any role for vascular
      memory or seconds-scale unlatching of local tension.
