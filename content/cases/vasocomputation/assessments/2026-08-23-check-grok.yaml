  synthesis: "The featured hypothesis stacks two claims: that palpable muscle
    knots are latched microvascular-autonomic states rather than lesions
    (VASO-C020), and that vascular tension functions as a memory element in
    mental life (VASO-C021). Neither has a direct test in this file. The
    commissioned critical report assigned grade D — no direct evidence located —
    to both linchpins of C020: an objective seconds-scale release, and
    identification of latch-state smooth muscle at a tender point (VASO-E016).
    Johnson's three hypotheses (VASO-E013) remain a self-published theoretical
    program. That is why the case verdict is unresolved rather than weakly
    supported. Circumstantial coherence is not confirmation when every cited
    observation is also predicted by neuromuscular guarding plus expectation and
    a global parasympathetic shift. Steelman for the hypothesis. Several lower
    rungs are genuine. Vascular smooth muscle maintains force cheaply after
    activation fades (VASO-C010). Slow exhalation shifts autonomic indices
    toward parasympathetic dominance (VASO-C013). Active tender sites differ
    from control tissue in biochemistry, stiffness, and flow (VASO-C005), and
    they host a millimeter-scale island of spontaneous EMG that a purely
    cognitive stressor can selectively increase (VASO-C002, VASO-C003).
    Blood-pressure pulsations modulate neurons through mechanosensitive channels
    in rats (VASO-C012 / VASO-E005). Voluntary attention, without arousal
    change, shrinks a site-specific inflammatory response in a preregistered
    human experiment (VASO-C006). If a knot also showed a time-locked stiffness
    drop and perfusion rise on an exhale, structural accounts would fail
    (VASO-C011) and a history-dependent vascular hold would become the most
    economical remaining mechanism: it would dissolve the classic energy-crisis
    problem, explain years-long persistence at near-zero metabolic cost, and
    give a reason why release answers to breath rather than to stretch. Steelman
    for the conventional account. The EMG nidus is skeletal-muscle
    electrophysiology by every published interpretation, so
    stress-writing-to-the-knot is equally a finding about spindles or endplates.
    Manual trigger-point identification lacks demonstrated reliability and a
    reference standard (VASO-C030), and even the discrete-spot observation is
    internally disputed (VASO-C001). Felt release (VASO-C004) is proponent
    testimony that expectation, attention, and the well-documented generalized
    effect of slow breathing already predict. Instantaneous hemo-neural
    modulation is not stored content; latch hysteresis is not a memory register
    that neurons later read as predictions or clinging (VASO-E017). The
    attention–inflammation result is a vagal immune reflex over tens of minutes,
    not unlatching of an arteriole in seconds. Contemplative channel-knot maps
    have never been coded under blinded rules (VASO-C022). On this reading
    nothing latches and nothing is stored locally: the brain stops guarding,
    globally or regionally, and interpretation supplies the object and the
    release. The entire disagreement therefore funnels into measurements that
    have not been made. Until blinded elastography and Doppler are recorded over
    factorial breath, pressure, sham, and failed-release conditions, and until
    latch biochemistry is measured at the same sites, both accounts remain live.
    Elegance of the stack is not evidence; absence of the keystone experiment is
    not refutation."
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: high
    reasoning: "The claim as stated is the strong form of vasocomputation: latched
      vascular tension stores predictions, held expectations, and clinging. The
      file supplies only the originator's theoretical statement (VASO-E013) and
      an explicit qualification that hysteresis is not memory and that no
      write–store–read cycle with content specificity has been shown
      (VASO-E017). Latch physiology (VASO-C010) and instantaneous
      vascular-to-neural modulation (VASO-C012) make a weak coupling claim
      scientifically live, but they do not show storage of mental content.
      Strongest opposing consideration: every demonstrated vascular effect on
      neurons in this file is instantaneous gain control, which
      history-dependent tone can produce without any later readout of stored
      content."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: high
    reasoning: "No evidence record identifies latch-state microvascular smooth
      muscle at a tender point, and none records an objective local state change
      during a felt release; the critical report grades both linchpins D
      (VASO-E016). Localized EMG, acidic mediator-rich fluid, and stiffness or
      flow differences are compatible with the claim but are equally predicted
      by skeletal-muscle guarding with downstream ischemia. The mechanism is
      borrowed from vascular physiology, not observed in the tissue it is
      supposed to explain. Strongest opposing consideration: the conventional
      neuromuscular-guarding account already covers the instrumented findings,
      and the EMG literature interprets the nidus signal as endplate or spindle
      activity, not vascular smooth muscle."
  - claimId: VASO-C022
    verdict: unresolved
    confidence: high
    reasoning: "The file contains no coded, blinded, or chance-controlled comparison
      of traditional knot maps against vascular, autonomic, or fascial anatomy.
      Shared motifs — knots, breath as tool, untying changes consciousness —
      remain comparative phenomenology and cannot, on this record, identify rtsa
      mdud, granthis, or ashi points with latched vasculature. Strongest
      opposing consideration: with several traditional corpora and many
      anatomical structures, some alignment is guaranteed unless coding rules
      are locked before inspection, and that test has not been run."
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: "Hai and Murphy 1988 (VASO-E003) formalize the latch-bridge state —
      dephosphorylated attached cross-bridges maintaining high stress at low
      phosphorylation — and the record treats this as standard smooth-muscle
      physiology; general background calibrates that later work has not
      overturned the phenomenon, though molecular details continue to be
      refined. The claim as stated is about vascular smooth muscle generally,
      not about tender points, and on that scope the evidence is strong.
      Strongest opposing consideration: the latch literature documents holds
      over minutes to hours in preparations, so treating the mechanism as an
      indefinite, addressable in-vivo store at specific sites is an
      extrapolation this record does not cover."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "As a conditional, the inference is sound: if a tender point
      objectively changes mechanics or perfusion within seconds, that change
      cannot be collagen remodeling or scar, which operate on much longer
      timescales. Those remodeling timescales are calibrated from general
      tissue-biology priors rather than from a cited evidence record in this
      file. The antecedent itself is unmeasured (VASO-C004), so the conditional
      currently decides nothing about knots. Strongest opposing consideration:
      if felt releases are perceptual or central, with no local tissue
      transition, the claim is vacuously true and carries no mechanistic
      weight."
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Moore and Cao 2008 (VASO-E004) stated the hemo-neural hypothesis;
      Salameh et al. 2024 (VASO-E005) then showed that physiological
      blood-pressure pulsations modulate central neurons via mechanosensitive
      channels in rats. That is causal evidence for the claim's \"can modulate\"
      wording in brain tissue, not a demonstration in the periphery, of stored
      information, or of content-specific readout. Strongest opposing
      consideration: ordinary ischemic or metabolic suppression can mimic a
      vascular effect on neurons, so a computational reading still has to be
      separated from perfusion-limited gain — a control this file does not fully
      provide beyond the mechanosensitive result."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: "Zaccaro et al. 2018 (VASO-E009), a systematic review of
      slow-breathing studies in healthy humans, documents reproducible rises in
      respiratory sinus arrhythmia and heart-rate variability and related
      autonomic and CNS changes consistent with a parasympathetic shift. That is
      sufficient for the claim as stated. The review measures global indices,
      not local tissue or tender-point state. Strongest opposing consideration:
      a global autonomic shift is exactly what the conventional account uses to
      explain breath-linked relief without any local latch, so this claim does
      not discriminate."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: "Lucas et al. 2009 (VASO-E011) concluded that manual examination for
      myofascial trigger points has not been shown reliable or valid and lacks a
      reference standard; Quintner, Bove and Cohen 2015 (VASO-E010) argue the
      construct rests on circular reasoning. Those records establish the
      reliability failure and that the construct is contested. The stronger
      ontological reading — that no entity exists — is disputed by a published
      rebuttal noted in the file and by instrumented local abnormalities
      (VASO-C002, VASO-C005). Strongest opposing consideration: poor palpation
      reliability shows the clinical exam is weak, not that nothing is there,
      because EMG, microdialysis, and imaging still find focal abnormality where
      examiners point."
  - claimId: VASO-C001
    verdict: mixed
    confidence: moderate
    reasoning: "Everyday reproducibility and second-hand community tender-point
      counts (VASO-E015) favor common exquisite tenderness, but those statistics
      are unverified in this file and should not carry weight. The critical
      report (VASO-E012) specifically denies that skeptics concede discrete,
      precisely localizable spots, and VASO-C030's reliability findings
      undermine packaging tenderness into countable objects. Strongest opposing
      consideration: the trained examining finger may impose discreteness on a
      more continuous field of tenderness, so ubiquity of ache is not ubiquity
      of well-bounded knots."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Hubbard and Berkoff 1993 (VASO-E001) recorded sustained spontaneous
      needle-EMG confined to a 1–2 mm nidus of trapezius trigger points and
      absent in adjacent non-tender fibers. The finding is peer-reviewed and
      later treated as spontaneous electrical activity, but the study is old,
      small, and single-lab, and the signal generator remains contested.
      Strongest opposing consideration: by every published interpretation the
      trace is skeletal-muscle electrophysiology (endplate noise or spindle
      discharge), not vascular smooth muscle, so using it as evidence for a
      vascular latch reads the result against its own literature."
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "McNulty et al. 1994 (VASO-E002) found that mental arithmetic raised
      EMG at trigger points while adjacent control sites in the same muscle
      stayed comparatively quiet, without generalized tensing. The result is
      directly on point but n=14, three decades old, unreplicated with modern
      instruments, and from the same lineage as VASO-C002 — one line of
      evidence, not two. Strongest opposing consideration: sympathetic drive to
      spindles or endplates produces the same selective trace without any
      vascular storage, and a single aging study cannot carry a general \"brain
      has the knot's address\" claim."
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The only evidence is a first-person practitioner report in the
      proponent essay (VASO-E014), explicitly labeled testimony and rated weak.
      As a claim about felt experience it is internally consistent with bodywork
      lore, but this file contains no controlled, blinded, or time-locked
      measurement of the feeling, let alone of local tissue. Strongest opposing
      consideration: expectation, attention shift, and the genuine global
      parasympathetic effect of slow breathing can produce a letting-go feeling
      with nothing local changing — more testimony cannot close that gap."
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Shah et al. 2008 (VASO-E006) found acidic, mediator-rich fluid at
      active points, also elevated remotely; the audited Mazza et al. 2021
      review (VASO-E007) concluded that imaging parameters can distinguish
      active and latent points from healthy tissue. Multiple modalities cut
      against a pure examiner-artifact story, but samples are small, methods
      heterogeneous, biochemical elevation is not purely local, and localization
      still inherits the palpation problem (VASO-C030). Strongest opposing
      consideration: ischemia and stiffness downstream of guarded skeletal
      muscle would produce the same chemical and Doppler picture, so these
      findings do not identify a vascular latch."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Mizrachi et al. 2026 (VASO-E008) is a preregistered, within-subject
      Nature Human Behaviour study: attending to a histamine skin-prick site
      produced roughly 1.5-fold smaller, faster-resolving responses in about 90
      percent of 57 participants, without arousal differences and with higher
      HRV. That matches the claim as stated. It remains a single-lab, acute-skin
      result whose authors caution that mediators were not measured and chronic
      extrapolation is uncertain. Strongest opposing consideration: the
      demonstrated route is vagal anti-inflammatory regulation over about twenty
      minutes — an existence proof that attention reaches the periphery, not
      evidence that attention unlatches stored vascular tension at a muscle
      knot."
