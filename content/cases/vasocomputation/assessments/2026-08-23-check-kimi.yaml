  synthesis: "The case resolves into a ladder whose bottom rungs are solid and
    whose load-bearing middle is untested rather than contradicted. Established
    rungs: smooth-muscle latch physiology (VASO-C010), the breath–autonomic
    coupling (VASO-C013), and the skeptics' reliability critique (VASO-C030),
    which this assessment treats as a genuine constraint on every study in the
    file that located its object by palpation. Provisionally supported rungs: a
    localized, maintained EMG signature at tender sites (VASO-C002), multi-modal
    objective abnormalities in chemistry, stiffness, and flow (VASO-C005), the
    hemo-neural read path (VASO-C012), and a preregistered demonstration that
    voluntary attention regulates localized peripheral physiology without
    arousal change (VASO-C006). The claims that carry the featured hypothesis —
    the anchor phenomenon (VASO-C004, testimony only), the operational mechanism
    (VASO-C020, grade-D on both linchpins per E016), and the headline thesis
    (VASO-C021, no write–store–read demonstration anywhere) — have no direct
    evidence in either direction. Steelman for the hypothesis: it is unusually
    economical — one borrowed mechanism, the latch, simultaneously answers the
    metabolic-cost problem that crippled the classic energy-crisis model, the
    abnormal Doppler findings, the seconds-scale phenomenology, and the
    stress-writability caught by McNulty in 1994; and each channel the stack
    needs (write, a storage-capable substrate, read-back) now has at least an
    existence proof somewhere in the record. Steelman against: every observation
    in the file is jointly compatible with neuromuscular guarding plus
    expectation plus a generalized parasympathetic shift; the EMG evidence is
    skeletal-muscle physiology on all published interpretations; hysteresis is
    not memory; the anchor phenomenon may be a perceptual event with no local
    tissue correlate; and the observational base itself has an unrepaired
    measurement problem. The strongest skeptical record is E016: the mechanism
    is borrowed from vascular physiology, not observed at a tender point. The
    strongest proponent point is that the conventional account still owes an
    explanation of the millimeter-scale nidus and the local chemistry, and has
    never been forced to produce one because the decisive experiment (VASO-R001)
    is cheap, fully specified, and unrun. Where this assessment leans on priors
    rather than records: the plausibility discount for extrapolating latch
    physiology from minutes-to-hours preparations to months-to-years in-vivo
    holds, and the resemblance discount on the contemplative convergence. The
    verdict is unresolved as a substantive finding: the dispute has narrowed to
    one falsifiable question, and either outcome would be decisive."
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: "As stated, this is the strong thesis — vascular latch states storing
      predictions and clinging with content specificity — and no evidence record
      demonstrates any part of the write–store–read cycle: E013 is the claim's
      self-definition (self-published, unvalidated) and E017 shows the memory
      criterion is unmet, with the closest precedent coming from slime mold, not
      mammals. The weak form (vascular state shapes neural computation) is kept
      live downstream by E005 under VASO-C012, which is why this is unresolved
      rather than contradicted. The strongest opposing consideration is the
      thermostat critique in E017: hysteresis is not memory, and every
      demonstrated vascular effect on neurons is instantaneous modulation, not
      stored content. Because direct evidence is absent in both directions, this
      verdict leans partly on prior plausibility judgments about the
      write–store–read gap."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "E016, the critical report's grade-D audit, is the single most
      important record here: no study has ever demonstrated smooth-muscle latch
      physiology at a tender point, and no time-resolved study has caught an
      objective release — but the same audit frames these as unrun experiments,
      not refutations, and nothing excludes a latch either. The indirect
      supports (abnormal flow in E007, the acidic milieu in E006, maintained
      activity in E001) are all equally compatible with guarding-induced
      compression, so they carry little diagnostic weight. The strongest
      opposing consideration is that the mechanism is borrowed from vascular
      physiology rather than observed in the tissue it explains, and the
      existing EMG evidence is neuromuscular on every published interpretation.
      Unresolved is the honest verdict; the claim is well-posed and decisively
      testable via VASO-R001 and VASO-R004."
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: "No evidence record in the file bears on this claim at all; the
      verdict reflects a total absence of testing rather than conflicting data.
      The parallels (knots, breath as tool, release changing consciousness,
