      generator (endplate potentials versus spindles) remains contested. The
      strongest opposing consideration is that the signal is skeletal-muscle
      electrophysiology by every published interpretation, so it supports
      guarding accounts as readily as vascular ones — taking it as evidence for
      a vascular mechanism reads it against its own literature. Old, small, and
      single-lineage origins keep this provisional.'
  - claimId: VASO-C003
    verdict: weakly_supported
    confidence: moderate
    reasoning: "E002 rests on one peer-reviewed study: n=14, 1994, from the same
      lineage as Hubbard–Berkoff, never independently replicated, with no
      vascular endpoint measured — and the essay's follow-up embellishments
      (relaxation lowering activity, phentolamine quieting the site) trace to
      the same lineage and were not verified. The result is directly on point
      and shows the write half of any storage account in motion, but a single
      small aging study cannot carry this rung. The strongest opposing
      consideration is that sympathetic drive to muscle spindles or endplates
      would produce the identical trace without any vascular storage — \"stress
      writes to the knot\" is a promising signal, not an established fact, and
      its modern replication is built into the stressor block of VASO-R001."
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The only evidence record is E014: first-person testimony from the
      hypothesis's proponent, in an AI-drafted essay, consistent with widespread
      practitioner lore across bodywork traditions. As a claim about felt
      experience, consistent independent-ish reports weakly support that people
