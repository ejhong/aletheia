      first-person cartography: trained interoceptors across millennia reporting
      the same three findings is at least consistent with the hypothesis, and
      VASO-R006 is cheap and decisive in either direction."
  - claimId: VASO-C010
    verdict: established
    confidence: high
    reasoning: "E003 documents the Hai–Murphy latch-bridge model, textbook
      smooth-muscle physiology since 1988 with decades of supporting work; the
      claim as stated is about what smooth muscle can do — maintain force at a
      fraction of energetic cost after activation subsides — not about whether
      it does so at tender points. On that stated claim the evidence is as
      strong as anything in the file. The strongest opposing consideration is
      that the molecular interpretation remains under refinement and that
      documented latch holds run minutes to hours in preparations, not months to
      years in vivo — but that limits the extrapolation to VASO-C020, not the
      truth of this claim. Assessing the claim as stated: established."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The conditional logic is sound: tissue-remodeling timescales (days
      to weeks for collagen and scar) are established background, so a genuine
      seconds-scale local change would have to be a change of maintained state,
      not structure. The verdict endorses the inference, not its antecedent —
      the premise (an objective fast release, VASO-C004) rests on testimony and
      has never been measured. The strongest opposing consideration is vacuity:
      if felt releases are perceptual and central events — reduced guarding,
      reinterpreted sensation — with no local tissue correlate, then nothing
      physical released and the timescale argument has no premise to work on.
      This is the case's hinge claim, and VASO-R001 decides whether it carries
      anything."
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "E005 (Science 2024) directly demonstrates the vascular-to-neural
      direction — blood-pressure pulsations modulating neuronal activity through
      mechanosensitive ion channels in rat preparations and awake animals —
      giving the 2008 Moore–Cao hypothesis (E004, context) a demonstrated
      mechanism sixteen years later, with the Piezo Nobel as supporting
      background. One strong demonstration in brain tissue, however, is more
      than weak and less than well-established: the effect shown is
      instantaneous modulation, not storage, and not periphery. The strongest
      opposing consideration is the ischemic confound: reduced perfusion
      trivially suppresses neural activity metabolically, so any claimed
      hemo-neural information must be separated from ordinary oxygenation
      effects — exactly what VASO-R005 is designed to do."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: E009 is a systematic review (Zaccaro 2018) documenting reproducible
      increases in respiratory sinus arrhythmia and heart-rate variability under
      slow breathing — the claim as stated concerns this global autonomic shift,
      and on that it is solidly supported. The claim is assessed as stated; its
      low diagnosticity for the featured hypothesis is a separate matter. The
      strongest opposing consideration is that a global parasympathetic shift is
      exactly what the conventional explanation also predicts, so this finding
      cannot discriminate between unlatching a specific arteriole and simply
      lowering the whole system's guard — the local, site-specific, time-locked
      effect the case needs has never been measured.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: E011 (Lucas 2009, systematic review, strong) establishes that manual
      trigger-point examination has not been shown reliable or valid and lacks
      an accepted reference standard, and E010 (Quintner 2015) documents that
      the construct itself is contested in the peer-reviewed literature —
      including the Dommerholt–Gerwin rebuttal, which keeps the debate open
      exactly as the claim states. This is the skeptics' strongest ground and it
      constrains every study in the file that localized its object by palpation.
      The strongest opposing consideration is that instrumented measures (the
      EMG nidus, the biochemical milieu, elastography and Doppler differences)
      repeatedly find objective local abnormality where palpation points, which
      pure examiner-artifact accounts struggle to explain — but that undermines
      the strongest "nothing is there" reading, not this claim's narrower
      statements about reliability and contestedness.
  - claimId: VASO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: "That tender points occur commonly across the general population is
      supported by ubiquitous practical experience and by the fibromyalgia-era
      community tender-point exams cited in E015 — though those figures are
      second-hand and unverified in this project, so the verdict leans partly on
      general background rather than the in-file records, which are weak (E015)
