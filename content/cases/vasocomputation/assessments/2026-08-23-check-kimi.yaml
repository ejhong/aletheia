  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: 'E001 documents the Hubbard–Berkoff 1993 finding: sustained
      spontaneous EMG confined to a 1–2 mm nidus at trigger points, absent a
      centimeter away — peer-reviewed and, per the credibility record,
      replicated as "spontaneous electrical activity" in later trigger-point
