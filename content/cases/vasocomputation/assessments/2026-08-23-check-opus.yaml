  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: 'As a conditional, the inference rests on well-established
      tissue-remodeling timescales: collagen and scar do not reorganize in five
      seconds, so a genuine seconds-scale local change would have to be
      something other than structural remodeling. The strongest opposing
      consideration is that "actively maintained state" is not the only
      alternative to structure — fluid redistribution, thixotropic or
      viscoelastic change in ground substance, and mechanical creep under the
      applied probe all operate on seconds and are passive physical processes
      rather than something the nervous system is doing and can stop doing.
      Separately, the antecedent is unverified (C004), so on the present record
      the conditional carries no load; it becomes decisive only if R001 returns
      a positive local transient.'
  - claimId: VASO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: "The claim as stated — local vascular state can modulate nearby
      neuronal activity — is supported by direct causal evidence: E005 reports
      blood-pressure pulsations modulating central neuronal activity through
      mechanosensitive channels in rat preparations and awake animals, which is
      the mechanism Moore and Cao (E004) could only propose in 2008. The
      channel-mediated route matters because it distinguishes the effect from
      trivial metabolic limitation. The strongest opposing consideration is
      generality: this is one demonstration in rodent brain tissue on fast
      timescales, with no peripheral or human evidence in the record, and any
      claimed computational role still has to be separated from ordinary
      ischemic modulation with oxygenation clamped."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: moderate
    reasoning: "E009 is a systematic review reporting reproducible increases in
      respiratory sinus arrhythmia, heart-rate variability, and related
      autonomic and CNS correlates under slow breathing in healthy humans, and
      this matches broad background physiology. The strongest opposing
      consideration is interpretive: at low respiratory rates, RSA and HRV
      amplitudes are strongly driven by the mechanical and baroreflex
      consequences of breathing pattern itself, so elevated indices do not
      cleanly demonstrate a tonic parasympathetic shift as opposed to a rhythmic
      modulation artifact. Even granting the shift, the record documents only
      global cardiovascular effects — no local tissue endpoint — which is why
      this claim is solid but non-diagnostic for the case."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: E011 is a systematic review by a mainstream methodology group
      concluding that manual examination for trigger points has not been shown
