  synthesis: "The case is built as a ladder, and the ladder's structural weakness
    is exactly where the dossier says it is: the rungs that are strong are not
    diagnostic, and the rungs that are diagnostic have no direct evidence in
    either direction. Latch-bridge physiology (C010) and the autonomic effects
    of slow breathing (C013) are solid, but both are mechanism-availability
    facts — arteries latch everywhere and breathing shifts vagal indices in
    everyone, which says nothing about tender points. The hemo-neural read path
    (C012) has genuinely improved since 2008: the Salameh 2024 record supplies
    causal, mechanosensitive vascular-to-neural modulation. But that licenses
    only the weak form of vasocomputation. The middle rungs (C002, C003, C005,
    C006) establish that something localized, electrically maintained,
    chemically abnormal, and cognitively addressable is present — yet every one
    of those signals is at least as well explained by sustained motor drive and
    central guarding, and the EMG evidence is, by its own literature,
    skeletal-muscle electrophysiology. Steelmanning the featured hypothesis: the
    energy-crisis model's metabolic implausibility is a real unsolved problem
    that the latch dissolves at near-zero cost; the Doppler flow abnormalities
    are suggestively vascular; and the hypothesis yields a sharp, falsifiable
    timing signature (perfusion rise preceding stiffness drop) that no
    conventional account predicts. Steelmanning the opposition: no smooth-muscle
    latch has ever been observed at a tender point (E016, grade D); the anchor
    phenomenon (C004) is proponent testimony; the localization base is
    unreliable (C030); and hysteresis is not memory (E017). Crucially, E016 is
    an absence-of-evidence audit from one AI literature search, not a
    disconfirming measurement — which is why the correct verdict is unresolved
    rather than contradicted or weakly supported. C011 makes the dependency
    explicit: if felt releases have no local correlate, the timescale argument
    becomes vacuous and the whole upper structure detaches. The agenda's
    keystone study (R001) and mechanism study (R004) are cheap, specified, and
    decisive in both directions; the case is untested, not untestable."
