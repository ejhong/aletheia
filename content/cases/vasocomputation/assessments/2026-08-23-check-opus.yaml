      supplies the peer-reviewed ontological critique. Both conjuncts of the
      claim — poor demonstrated reliability and active contestation in the
      literature — are therefore well documented. The strongest opposing
      consideration is that the critique was answered point-by-point by
      Dommerholt and Gerwin, and that poor palpation reliability shows the
      clinical exam is weak rather than that nothing is there; instrumented
      findings (E001, E006, E007) repeatedly locate abnormality where palpation
