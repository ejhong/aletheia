      tender points.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: The Lucas et al. systematic review (VASO-E011) provides strong
      evidence that manual palpation of trigger points has poor inter-examiner
      reliability and lacks a validated reference standard, and the Quintner et
      al. critique (VASO-E010) makes a cogent case that the classic
      trigger-point construct is conceptually fragile. While instrumented
      abnormalities at palpated sites (VASO-E006, VASO-E007) argue against the
      strongest “nothing is there” conclusion, they do not repair the
      reliability of manual identification. The strongest opposing consideration
      is that better imaging-anchored localization might show that palpation can
      be calibrated, which would soften the scope of this critique.
  - claimId: VASO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: Everyday experience plus legacy tender-point examinations from
      rheumatology strongly suggest that focal areas of heightened tenderness
      are common in the general population, and the essay plus supporting
      evidence (VASO-E015) are consistent with this. However, the critical
      report notes that even the existence and precise localization of discrete
      “spots” are contested (VASO-E012), and there has been no systematic,
      blinded census using objective tools. The strongest opposing consideration
      is that some apparent discreteness may be an artifact of the examining
      finger and training, as implied by poor palpation reliability (VASO-E011).
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Hubbard and Berkoff (VASO-E001) report sustained spontaneous EMG
      activity confined to a 1–2 mm nidus at palpated trigger points, absent in
      adjacent non-tender tissue, which directly supports a localized,
      maintained neural signal associated with these sites. Later literature has
      generally replicated “spontaneous electrical activity,” albeit with debate
      over its precise origin. The strongest opposing consideration is that this
      is an old, small, single-lineage study, measuring skeletal- muscle
      electrophysiology rather than vascular processes, so it supports a
      maintained state but not specifically a vascular latch.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: McNulty et al. (VASO-E002) show that a cognitive stressor (mental
      arithmetic) selectively increases EMG activity at trigger points while
      nearby control sites remain relatively quiet, implying that central
      processes can modulate specific peripheral loci without gross movement.
      This supports the idea that the nervous system has “addresses” for these
      sites. The strongest opposing consideration is that the study is small,
      old, and unreplicated, and its findings are fully compatible with
      sympathetic drive to muscle spindles or endplates, without any need for a
      vascular storage mechanism.
  - claimId: VASO-C004
    verdict: unresolved
    confidence: low
    reasoning: The claim rests entirely on first-person and practitioner reports
      (VASO-E014) that sustained pressure plus slow exhalation yields a felt
      release within seconds; such phenomenology is widely shared and plausible.
      Yet the dossier explicitly notes that there is no time- resolved imaging
      or other objective measurement of local tissue change during such events
      (VASO-E016), leaving it unknown whether any local, site-specific physical
      release occurs. The strongest opposing consideration is that expectation,
      attentional shifts, and global relaxation from slow breathing could
      readily produce a subjective sense of “release” without any discrete local
      physiological transition.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Shah’s microdialysis work (VASO-E006) and the Mazza et al. imaging
      review (VASO-E007) report that active trigger points differ from control
      tissue in acidity, pain mediators, stiffness, and blood flow, which
      supports the existence of genuine local physiological abnormalities. These
      findings argue against a pure examiner-artifact account. The strongest
      opposing consideration is that the studies are small, heterogeneous,
      sometimes show mediator elevation at remote sites as well, and inherit all
      the localization and construct-validity concerns associated with
      palpation-based trigger-point identification.
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: high
    reasoning: The Mizrachi et al. histamine skin-prick study (VASO-E008) is
      preregistered, within-subject, and shows robust effects of attention on
      local inflammatory response and HRV without changes in sympathetic
      arousal, giving strong evidence that voluntary attention can modulate
      localized peripheral physiology. This fits well with the notion of a
      cognition-to-periphery channel. The strongest opposing consideration is
      that the demonstrated effect pathway is vagal immune regulation over tens
      of minutes in acute skin inflammation, not a seconds-scale release of
      vascular latch in chronic musculoskeletal tissue, so it does not by itself
      support the specific mechanism posited for knots.
