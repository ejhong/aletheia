  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: The systematic review by Zaccaro et al. (VASO-E009) documents
      consistent increases in respiratory sinus arrhythmia and heart-rate
      variability, along with related CNS changes, in response to slow
      breathing—indicating a reproducible shift toward parasympathetic
      dominance. This is convergent with broad autonomic and contemplative
