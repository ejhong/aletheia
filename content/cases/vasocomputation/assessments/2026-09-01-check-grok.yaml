  synthesis: >-
    The featured hypothesis has two floors, and the ledger answers neither. The
    operational floor (VASO-C020) says muscle knots are latched microvascular
    states — cheap, history-dependent holds in arteriolar smooth muscle — rather
    than scars or purely skeletal guarding. The attribution floor (VASO-C021)
    says that same tension is a memory element in mental life, including the
    grasping contemplative traditions call tanha. No evidence record shows latch
    biochemistry at a tender point, no record catches a seconds-scale local
    stiffness or perfusion change time-locked to a felt release, and no record
    demonstrates a content-specific write–store–read cycle in vasculature. That
    is why the case verdict is unresolved: not as a hedge, but because the
    hypothesis has not been tested where it would count, and the available
    traces do not force it.

    Steelman in favor. The latch-bridge is real physiology (VASO-C010,
    VASO-E003): after activating signals subside, dephosphorylated cross-bridges
    can hold force at low energetic cost. If a knot objectively lets go in
    seconds, remodeling timescales make that a change of maintained state, not
    of collagen architecture (VASO-C011). Hubbard and Berkoff recorded
    continuous spontaneous EMG confined to a 1–2 mm nidus and absent a
    centimeter away; McNulty and colleagues then showed mental arithmetic
    raising that nidus without generalized tensing — a discrete, neurally
    addressed, actively maintained island. Shah's sampling found an acidic,
    mediator-rich milieu; imaging reviews report abnormal stiffness and blood
    flow. Slow exhalation is a documented parasympathetic lever (VASO-C013), and
    Mizrachi and colleagues showed voluntary attention shrinking a site-specific
    inflammatory response without arousal change. Salameh 2024 supplies a causal
    mechanical read path from blood-pressure pulsations onto neurons. Assembled,
    a latched arteriole throttling its neighborhood, with secondary skeletal
    guarding on top, is a coherent candidate that would also patch the old
    energy-crisis model, which needed a metabolic bonfire nobody could explain.

    Steelman against. Coherence is not evidence, and every listed finding is at
    home in a conventional account: sustained low-level motor drive, centrally
    maintained and stress-sensitive, plus expectation, attention, and the global
    parasympathetic shift of slow breathing. The EMG is skeletal-muscle
    electrophysiology by every published interpretation in the records; reading
    it as a vascular latch inverts the finding. Manual identification of the
    object of study fails systematic-review reliability tests, and the construct
    is contested for circular reasoning (VASO-C030). The two-key felt release is
    a proponent first-person report (VASO-E014) with no objective local
    correlate. The commissioned audit found no direct evidence for either
    linchpin (VASO-E016). Study VASO-S001 then cut against the
    borrowed-mechanism step itself: energetic economy has never been measured in
    any arteriole (VASO-E019); latch behaviour is not generic even among
    arteries and dropped out one branch order downstream in the one paired
    comparison (VASO-E021); and in pressurized skeletal-muscle arterioles — the
    compartment C020 names — maintained constriction tracked maintained or
    rising LC20 phosphorylation, not a dephosphorylated hold (VASO-E020). The
    mental-life extension additionally confuses hysteresis with memory
    (VASO-E017). Contemplative-map convergence has not been coded under blinded
    rules.

    The conventional account currently covers more of the measured traces with
    less new physiology. Its remaining debt is the localized objective
    abnormalities. The featured account's debt is everything above the latch
    textbook. Sensitivity: VASO-E020 is the single record whose removal would
    most change the texture of this verdict, because it is the only evidence
    that inspects the named caliber and finds the wrong biochemical signature.
    Without it the case would still be unresolved — a pure gap rather than a gap
    plus mismatch — so the verdict survives. It does not hang on one thread; it
    hangs on the continued absence of the keystone measurements.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: high
    reasoning: "The claim as stated is the strong form: vascular latch as a memory
      element storing predictions, expectations, or tanha. VASO-E013 is the
      theory announced by its originator, not a demonstration; VASO-E017
      correctly distinguishes hysteresis from content-specific readout and notes
      that demonstrated vascular effects on neurons so far are instantaneous
      modulation. No record in the ledger shows a write–store–read cycle with
      oxygenation controlled. Strongest opposing consideration: the weak form —
      vascular state shaping neural computation — is now scientifically live via
      VASO-C012, so discarding the entire thesis as empty would overreach; but
      that is not this claim."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "No record identifies smooth-muscle latch physiology at a tender
      point, and VASO-E016 grades both linchpins D. Compatible local findings
      (chemistry, stiffness, flow, EMG) are equally predicted by skeletal
      guarding, and the EMG is neuromuscular. VASO-E019 shows the economy
      argument was never measured in arterioles; VASO-E020 shows pressurized
      skeletal-muscle arterioles holding constriction with maintained or rising
      phosphorylation rather than the latch signature. Strongest opposing
      consideration: VASO-E020 is a mismatch, not a refutation — the stimulus
      was held, the studies were not latch tests — so the hypothesis is untested
      at the site rather than contradicted."
  - claimId: VASO-C022
    verdict: unresolved
    confidence: high
    reasoning: "No evidence record tests this claim. The parallels (knots, breath as
      tool, untying changes consciousness) are real as comparative
      phenomenology, but apparent anatomical correspondence has never been coded
      under prespecified blinded rules and is currently a degrees-of-freedom
      trap. Strongest opposing consideration: independent recurrence of the same
      three claims across traditions is more than nothing and would be
      surprising if wholly invented — yet without VASO-R006 that remains
      suggestion, not evidence."
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: 'VASO-E003 (Hai and Murphy 1988) is foundational: a kinetic
      latch-bridge model reproducing high sustained stress at low myosin
      phosphorylation after activation falls, now textbook vascular physiology.
      The claim is a capability claim ("can"), and that capability is real in
      the preparations where it was shown. Strongest opposing consideration is
      VASO-E021: latch is not generic across vascular smooth muscle, dropped out
      in a downstream muscular branch in the one paired comparison, and has not
      been followed into arterioles, so treating it as an indefinite in-vivo
      storage element at addressable microvascular sites extrapolates beyond the
      literature.'
  - claimId: VASO-C011
    verdict: well_supported
    confidence: high
    reasoning: 'Assessed as the conditional it is: if a tender point objectively
      releases within seconds, the released entity is a maintained physiological
      state, not remodeled structure. Tissue remodeling of collagen or scar on a
      days-to-weeks timescale is established background physiology, so the
      inference from a genuine seconds-scale local change to "state, not
      structure" is sound. Strongest opposing consideration: the antecedent is
      exactly what has never been measured (VASO-C004); if felt releases have no
      local tissue correlate, the conditional becomes vacuously true and carries
      nothing toward VASO-C020.'
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E004 is the 2008 hypothesis paper, not a demonstration.
      VASO-E005 (Salameh 2024) supplies causal evidence that physiological
      blood-pressure pulsations modulate central neurons through
      mechanosensitive channels in rats, which is the mechanical read path the
      claim needs. The demonstrated effect is instantaneous modulation in brain
      tissue, not stored information and not the periphery. Strongest opposing
      consideration: ordinary ischemic or metabolic suppression can look like
      hemo-neural computation unless oxygenation is controlled, so a vascular
      effect on neurons is not yet vascular information."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: "VASO-E009 (Zaccaro et al. 2018 systematic review) documents
      reproducible increases in respiratory sinus arrhythmia and heart-rate
      variability under slow breathing in healthy humans, consistent with a
      parasympathetic shift. That is the claim as stated — a global autonomic
      lever — and it is not seriously in dispute in these records. Strongest
      opposing consideration: a global shift is exactly what the conventional
      explanation also predicts, and nothing in this record shows an exhale
      unlatching a specific arteriole at an identified tender point."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: "VASO-E011 (Lucas et al. 2009 systematic review) concluded that
      manual examination for trigger points has not been demonstrated reliable
      or valid and lacks a reference standard; VASO-E010 (Quintner et al. 2015)
      contests the construct as circular. The claim as worded — lacking
      demonstrated reliability, lacking a validated standard, and contested — is
      therefore accurate. Strongest opposing consideration: poor palpation
      reliability is not absence of a phenomenon, and instrumented correlates
      (EMG nidus, biochemistry, imaging) repeatedly find local abnormality where
      palpation points, which a pure examiner-artifact account must still
      explain."
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Focal tenderness in muscle and fascia is a commonplace clinical and
      practical observation, and that background calibrates plausibility, but
      the ledger's own records are thin: VASO-E015 is weak, second-hand, and
      carries unverified community-exam figures; VASO-E018 is irrelevant to
      existence. VASO-E012 qualifies the claim directly — skeptics dispute not
      only mechanism but whether precisely localizable discrete spots exist.
      Strongest opposing consideration: packaging tenderness into countable,
      examiner-agreed objects is exactly what the reliability literature
      (VASO-C030) failed to validate."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E001 reports sustained spontaneous needle-EMG in a 1–2 mm
      trapezius nidus of all sampled trigger points and none in adjacent
      non-tender fibers, which is direct support for a localized maintained
      electrical state. The study is old, small, and from one lab, and it is the
      only evidence record on this claim. Strongest opposing consideration: the
      recorded activity is skeletal-muscle electrophysiology by every
      interpretation in the record (endplate noise or spindle discharge), not
      smooth muscle, so it supports guarding as readily as any vascular reading
      and cannot be taken as evidence for latch."
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: "VASO-E002 (McNulty et al. 1994, n=14) found mental arithmetic
      increasing EMG at trigger points while adjacent control sites in the same
      muscle stayed comparatively quiet, without generalized tensing. That is
      directly on point for a cognitive write to a specific address. Strongest
      opposing consideration: one small, aging study from the same lineage as
      Hubbard and Berkoff, never replicated in this ledger with modern
      instruments or vascular endpoints, can be produced by sympathetic drive to
      spindles or endplates with no vascular storage at all."
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: "The claim is about a felt release, and VASO-E014 is consistent
      practitioner testimony, including the case author's, that pressure locates
      a knot and slow exhalation is when something lets go in seconds. That is
      evidence of a report, not of tissue change, and it is the only record.
      Strongest opposing consideration: expectation, attention, and generalized
      parasympathetic shift can produce the same feeling with nothing local
      changing, which is why the unrun keystone imaging experiment, not more
      testimony, is what this claim needs."
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E006 (Shah 2008) found pain mediators and acidity elevated at
      active trigger points, and VASO-E007 (Mazza 2021 systematic review,
      characterized second-hand) reports imaging parameters distinguishing
      active and latent points from healthy tissue, including flow
      abnormalities. Multiple modalities arguing in the same direction beat a
      pure artifact story. Strongest opposing consideration: Shah's elevations
      were also remote from the points, samples are small, methods
      heterogeneous, and until localization is blinded these \"objective\"
      findings inherit the reliability problem they are supposed to solve."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E008 is a preregistered within-subject Nature Human Behaviour
      study (57 volunteers, ~1.5-fold smaller and faster-resolving histamine
      responses under internal attention in ~90% of participants, no arousal
      difference, higher HRV). That is a genuine cognition-to-periphery channel
      at a vascular bed. Strongest opposing consideration: it is a single-lab
      acute skin-immune effect over tens of minutes via a known vagal
      anti-inflammatory route, not latch removal in seconds at a tender point,
      and borrowing it as evidence for vascular memory conflates \"attention can
      reach the periphery\" with the synthesis's storage claim."
