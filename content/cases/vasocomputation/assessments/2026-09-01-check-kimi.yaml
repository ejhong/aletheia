  synthesis: "The case is genuinely mixed rather than merely unresolved. The lower
    rungs are real: slow breathing reproducibly shifts autonomic indices
    (VASO-E009); smooth muscle has a latch-bridge mode as textbook physiology
    (VASO-E003); tender sites are not pure nothing, because needle EMG,
    microdialysis-style biochemistry, and imaging reviews repeatedly find local
    abnormality (VASO-E001, VASO-E006, VASO-E007); and the 2026 attention
    experiment is a controlled existence proof that cognition can regulate a
    specific peripheral site without an arousal confound (VASO-E008).
    Steelmanned upward, the featured stack has the right shape: stress can write
    to a millimeter-scale tender nidus without movement (VASO-E002), breath is a
    voluntary autonomic handle, a latch would be metabolically cheap, and if a
    knot truly changes within seconds then remodeling cannot be the thing that
    changed. Steelmanned downward, every load-bearing step after that is either
    unmeasured or constrained. The felt two-key release remains testimony
    (VASO-E014); the commissioned audit found no synchronized time-resolved
    release study and no smooth-muscle latch at a tender point (VASO-E016);
    palpation reliability and reference-standard absence infect the observation
    base (VASO-E011, VASO-E010, VASO-E012); and the new VASO-S001 records make
    the borrowed mechanism less safe than the overview implies: energetic
    economy has not been measured in arterioles (VASO-E019), latch behavior is
    not generic across a vessel and its branch (VASO-E021), and the three
    pressurized skeletal-muscle resistance-vessel rows show maintained
    constriction tracking maintained or rising LC20 phosphorylation rather than
    an economical dephosphorylated hold (VASO-E020). That is not a refutation,
    because those rows held the stimulus present, were abstract-built, and did
    not sample tender points; but it removes the comforting assumption that the
    arteriole compartment is simply unexamined. The strong vasocomputation
    extension is weaker still: the demonstrated hemo-neural effect is fast
    modulation in rat brain, not content-specific storage after input cessation
    (VASO-E004, VASO-E005, VASO-E017). My verdict therefore credits the
    phenomenon and the maintained-state framing, while withholding support from
    the specific claim that knots are latched microvascular states and from the
    claim that vascular tension stores mental content. Sensitivity: the single
    record whose removal would most change the mechanistic center of gravity is
    VASO-E020, because it converts the relevant compartment from “unexamined
    extrapolation” into “examined with a phosphorylation readout and not
    matching the latch signature.” The case verdict survives its
    removal—VASO-E016, VASO-E019, VASO-E021, VASO-E011, and the absence of a
    keystone release still block any stronger verdict—but the negative tilt on
    VASO-C020 would soften, leaving a cleaner unresolved rather than an
    unresolved with direct compartment pressure. This case is not hanging on one
    thread; it is hanging on an unrun experiment, VASO-R001, plus the mechanism
    study VASO-R004."
claimAssessments:
  - claimId: VASO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: "The necessary ingredients now have some empirical reality: Moore and
      Cao stated the read path as a hypothesis (VASO-E004), and the 2024 rat
      work demonstrates fast vascular-mechanical modulation of neurons through
      mechanosensitive channels (VASO-E005). The attention study adds a
      controlled cognition-to-periphery channel (VASO-E008), but not stored
      content. The strongest opposing consideration is VASO-E017: hysteresis is
      not memory, all demonstrated vascular effects on neurons are instantaneous
      modulation or possible metabolic/ischemic confounds, and no experiment has
      shown write, persistence after input cessation, and later content-specific
      readout. As stated—predictions, held expectations, and tanha having a
      vascular implementation—the claim exceeds the evidence."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "The circumstantial fit is real: tender sites can be electrically
      maintained islands (VASO-E001), stress-selective (VASO-E002), chemically
      angry (VASO-E006), and separable on imaging flow/stiffness measures
      (VASO-E007). But the claim as stated requires microvascular smooth-muscle
      latch at tender points, and the direct records attached to this claim are
      undermining: no time-locked objective release and no tender-point latch
      were located (VASO-E016), arteriole energetic economy is unmeasured
      (VASO-E019), and pressurized skeletal-muscle resistance vessels show
      maintained constriction with maintained or rising phosphorylation rather
      than the latch signature (VASO-E020). The strongest opposing consideration
      is that neuromuscular guarding plus expectation explains the EMG and
      release phenomenology without any vascular storage. This is not
      contradicted, because VASO-E020 kept the stimulus present, did not measure
      energetics, and did not sample tender points; but the deciding
      observations have never been made."
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: "The convergence is suggestive as comparative phenomenology, but this
      ledger contains no blinded or preregistered coding of rtsa mdud, granthi,
      or ashi locations against vascular, autonomic, or fascial anatomy. The
      strongest opposing consideration is the degrees-of-freedom problem: with
      many traditional maps and many anatomical structures, some alignment is
      guaranteed unless coding rules are fixed before inspection. Even a
      positive mapping would corroborate rather than establish the mechanism; a
      null would only retire a convergence argument. VASO-R006 is the right
      test, so the claim is testable but currently unearned."
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: "The general capability is textbook smooth-muscle physiology: Hai and
      Murphy's latch-bridge model reproduces economical force maintenance after
      activation falls (VASO-E003). The strongest opposing consideration is not
      whether latch exists but where and for how long: VASO-E021 shows latch
      behavior is not generic across a parent artery and its muscular branch,
      and VASO-E019 shows energetic economy has not been measured in the
      arteriole compartment the knot hypothesis needs. Those records constrain
      extrapolation to addressable microvessels and month-to-year holds; they do
      not overturn the claim as stated, which is that vascular smooth muscle can
      maintain force cheaply after activating signals subside."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The conditional inference is sound: collagen remodeling and scar
      formation operate on days-to-weeks timescales, so a true local change
      completed within seconds would have to be a change of maintained state
      rather than structure. Its antecedent, however, is exactly the unmeasured
      crux: VASO-E014 is first-person testimony and VASO-E016 found no
      synchronized time-resolved release study. The strongest opposing
      consideration is that the felt release may be central and
      perceptual—reduced guarding plus reinterpreted sensation—with no local
      tissue event, making the conditional vacuous. I therefore support the
      logic provisionally while treating its empirical payload as undecided."
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The modal claim that local vascular state can modulate nearby
      neurons has moved from proposal to animal demonstration: VASO-E005 shows
      blood-pressure pulsations modulating central neuronal activity through
      mechanosensitive channels in rats, while VASO-E004 remains the hypothesis
      statement rather than a demonstration. The strongest opposing
      consideration is triviality by metabolism: reduced perfusion suppresses
      neural activity through ordinary energetic limitation, so any claimed
      hemo-neural computation must survive oxygenation clamping and must be
      distinguished from instantaneous gain control. The demonstrated effect is
      also brain, rat, and fast—not peripheral tender-point tissue and not
      stored information. That supports “can modulate,” not yet the stronger
      uses the case builds on it."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: "A systematic review of slow-breathing studies documents reproducible
      increases in respiratory sinus arrhythmia and heart-rate variability with
      related autonomic and CNS changes (VASO-E009), and the attention study
      independently found higher HRV under internal attention (VASO-E008). The
      strongest opposing consideration concerns relevance rather than truth: a
      global parasympathetic shift is exactly what the conventional account also
      predicts, so it cannot by itself explain site-specific unlatching.
      Assessed as stated—slow breathing, especially extended exhalation, shifts
      autonomic balance toward parasympathetic dominance—the claim is well
      supported."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: "The reliability half of the claim is systematic-review-grade: manual
      examination for trigger points has not been shown reliable or valid,
      partly because no accepted reference standard exists (VASO-E011). The
      construct is also genuinely contested in peer review, with Quintner, Bove,
      and Cohen arguing circularity and Dommerholt and Gerwin answering; the
      exchange, not either side alone, marks an open dispute (VASO-E010). The
      strongest opposing consideration is that a weak clinical exam does not
      imply an absent phenomenon, because EMG, biochemical, and imaging records
      still find local abnormalities (VASO-E001, VASO-E006, VASO-E007). That
      objection limits the ontological conclusion but not the methodological
      claim as stated."
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "That people commonly have exquisitely tender sites is supported by
      widespread clinical and practical experience and by the community
      tender-point exams the essay cites, but I am explicitly discounting
      VASO-E015's exact figures because the underlying rheumatology survey was
      not located and the record is second-hand. The critical report also
      corrects the framing: the dispute reaches the reproducibility and ontology
      of the discrete spot, not merely mechanism (VASO-E012), and palpation
      reliability is unproven (VASO-E011). The strongest opposing consideration
      is that tenderness may be real while its packaging into countable,
      localizable objects is partly an artifact of the examining finger. A
      blinded algometry/elastography census remains missing, so common
      tenderness is supported; discrete-object status is only provisional."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Hubbard and Berkoff directly recorded sustained spontaneous
      needle-EMG activity in a 1–2 mm trigger-point nidus with adjacent
      non-tender fibers quiet (VASO-E001), and later literature reportedly
      replicated related “spontaneous electrical activity,” though this project
      did not independently verify that chain. The strongest opposing
      consideration is that the signal is skeletal-muscle electrophysiology by
      every published interpretation—endplate noise or spindle discharge—not
      smooth muscle, and the original study is old, small, and single-lineage.
      The finding therefore supports a maintained local state, but it does not
      discriminate vascular latch from guarding. A modern replication with
      simultaneous vasomotor measurement is still needed.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: "McNulty and colleagues report the key write-side observation: mental
      arithmetic increased EMG at trigger points while adjacent control sites
      stayed comparatively quiet and subjects were not generally tensing
      (VASO-E002). The strongest opposing consideration is evidential thinness:
      n=14, 1994, the same lineage as Hubbard and Berkoff, no vascular endpoint,
      no modern replication, and the relaxation/phentolamine follow-ups were not
      independently verified here. Sympathetic drive to spindles or endplates
      could produce the same selectivity without any vascular memory element.
      The claim is directly evidenced but should be treated as one promising old
      line until replicated under imaging with vascular endpoints."
  - claimId: VASO-C004
    verdict: unresolved
    confidence: moderate
    reasoning: "This is the anchor phenomenon and it remains testimony: pressure
      locates, slow exhale releases, in seconds, is reported first-person by the
      proponent and is consistent with practitioner lore (VASO-E014). The
      strongest opposing consideration is that felt release is a report about
      experience, and expectation, attention shifts, pressure after-sensation,
      and generalized parasympathetic relaxation could produce the same feeling
      with no local tissue transition. VASO-E016 found no synchronized
      time-resolved imaging study, so the claim is neither verified nor refuted.
      It is testable now, not presently untestable: VASO-R001 specifies the
      decisive controls."
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Multiple modalities point to objective local abnormality: active
      trigger-point regions show acidic, mediator-rich sampling including
      bradykinin, substance P, and CGRP (VASO-E006), and an imaging systematic
      review is characterized as finding active and latent points quantifiably
      distinguishable from healthy tissue (VASO-E007). The strongest opposing
      consideration is measurement inheritance: small heterogeneous studies,
      flexible trigger-point definitions, second-hand characterization of the
      review, and Shah's own remote-site elevations mean “instruments find the
      spot” can still import the localization problem identified in VASO-E011.
      Guarding-induced compression could also produce similar downstream
      ischemia and chemistry. The claim supports “something objective is there,”
      not the vascular-latch interpretation."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The Mizrachi study is strong as an existence proof: preregistered
      within-subject experiments found attention to a histamine-prick site
      produced about 1.5-fold smaller, faster-resolving responses in roughly 90%
      of participants, without skin-conductance, heart-rate, temperature, or
      anxiety differences and with higher HRV (VASO-E008). The strongest
      opposing consideration is scope: it is a single-lab, very new, acute skin
      model, the molecular mediators were not directly measured, the authors
      note skin is not directly parasympathetically innervated, and the
      demonstrated route is vagal immune regulation over about twenty minutes
      rather than seconds-scale latch removal at a tender point. Independent
      replication would firm the channel; failure would remove the best
      controlled evidence on this rung. It supports reachability of peripheral
      physiology by attention, not vascular memory."
