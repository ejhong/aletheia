  note: "E020 is the only record in the file that measures the tissue compartment
    VASO-C020 actually names, and removing it would erase the case's sole
    compartment-specific adverse datum, returning C020 to \"unexamined\" rather
    than \"examined and mismatched.\" The case verdict nonetheless survives:
    without E020 the verdict remains unresolved, because it is driven by an
    absence — no positive demonstration of latch at a tender point, and no
    time-locked measurement of a release — rather than by any single supporting
    or undermining record. What changes is the drift: with E020 the trajectory
    is negative, without it neutral. This is unusually robust sensitivity for a
    case this contested, and it is a symptom of the core problem, namely that
    the decisive experiment has never been run in either direction."
