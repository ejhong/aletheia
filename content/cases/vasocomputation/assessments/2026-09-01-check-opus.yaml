  synthesis: "The case is a ladder whose lower rungs are sound and whose upper
    rungs are empty, and the empty rungs are the ones the hypothesis is made of.
    The borrowed premises hold: the latch-bridge is real physiology (E003), slow
    breathing does shift global autonomic indices (E009), vascular mechanics can
    modulate neuronal firing (E005), attention can reach a specific peripheral
    site and change what happens there (E008), and instruments do find local
    abnormality where palpation points (E006, E007). None of these is in
    dispute, and none of them is about knots being latches. The specific
    conjunction the case features — that a tender point IS microvascular smooth
    muscle held in latch — has, by the ledger's own audit, no direct evidence in
    either direction (E016), and the newer study rows have begun to push mildly
    against it: nobody has ever measured energetic cost in any arteriole, so the
    \"cheap hold\" argument rests entirely on conduit-artery preparations
    (E019); the three published pressurized skeletal-muscle arteriole studies
    with the right molecular readout found maintained LC20 phosphorylation and
    Rho-kinase Ca²⁺ sensitization, i.e. sustained activation rather than the
    latch signature (E020); and the one published parent-versus-branch
    comparison found latch behaviour absent one branch order downstream (E021).
    Latch is therefore not generic across the vasculature, and the compartment
    C020 names is the compartment where the signature has not appeared.
    Steelmanning the proponent: none of those three rows was designed as a latch
    test, all held stimulus present throughout (myogenic tone cannot show
    input-free persistence by construction), all were coded from abstracts, and
    a neurohumorally driven latch under sympathetic drive remains untouched by
    them. Steelmanning the skeptic: the entire observational base sits on a
    palpation exam that systematic review found unreliable with no reference
    standard (E011, E010, E012); the EMG lineage is one lab, thirty years old,
    and unambiguously skeletal-muscle electrophysiology (E001, E002); and the
    anchor phenomenon — the seconds-scale release — exists in the ledger only as
    proponent testimony (E014). The timescale argument (C011) is logically clean
    but has no measured premise to act on, and would be vacuous if felt releases
    have no local correlate. The headline thesis (C021) fails the ledger's own
    memory criteria: hysteresis is not read-out, and the best write-store-read
    precedent is a slime mold (E017). Verdict is unresolved not as a hedge but
    because a cheap, fully specified, decisive experiment (R001, R004) has never
    been run, and the first systematic look at the relevant vessel compartment
    returned a mismatch rather than a confirmation. The drift is negative; the
    door is not shut."
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: "As stated this is the strong form — that latch states carry
      predictions and the felt quality of clinging — and no evidence record
      demonstrates any part of the write-store-read cycle with content
      specificity. E013 is the originator's self-published theoretical program,
      explicitly seeking evidence rather than reporting it; E017 argues
      persuasively that the latch literature never addresses the criteria that
      separate memory from hysteresis, and that the nearest genuine
      demonstration is Physarum tube networks, an organism whose plumbing is its
      body. The strongest opposing consideration in the claim's favour is E005:
      the vascular-to-neural read path is now demonstrated causally, so the loop
      is no longer physically impossible, only unbuilt. But every demonstrated
      vascular effect on neurons is instantaneous modulation, and R005 shows the
      decisive experiment is specifiable, so this is unresolved rather than
      untestable."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: 'No record in the file places smooth-muscle latch physiology at a
      tender point, and E016 grades both linchpins D. The three VASO-S001
      findings move the needle against: energetic economy has never been
      measured at arteriole caliber (E019), the published arteriole measurements
      with the right molecular readout show maintained activation rather than
      force held while phosphorylation falls (E020), and latch behaviour is
      vessel-type-specific rather than generic (E021). The strongest opposing
      consideration is that none of those studies was designed as a latch test —
      all were myogenic-tone preparations with the stimulus continuously
      present, coded from abstracts, and unable in principle to show input-free
      persistence — so this is a mismatch, not a refutation, and the Doppler
      abnormalities in E007 remain unexplained by any account. I stop short of
      "contradicted" for exactly that reason; positive support, however, is
      currently zero and entirely compatibility-based.'
  - claimId: VASO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: "No evidence record in this file bears on the claim at all; the
      convergence is asserted in the overview and nowhere measured. The
      structural objection is decisive as things stand: with many traditions,
      many knot inventories, and a dense anatomy, some alignment is guaranteed,
      and the midline observation about sympathetic chains is exactly the kind
      of post-hoc match that prespecified coding exists to defeat. The strongest
      opposing consideration is that independent traditions converging on
      knots-plus-breath-plus-altered-consciousness is a non-trivial coincidence
      that pure cultural diffusion arguments have not obviously explained. R006
      makes it cheaply testable, so the verdict is unresolved rather than
      untestable; the claim currently earns no inferential weight in the case."
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: 'E003 is the foundational kinetic model and the finding — high
      sustained stress at low myosin phosphorylation after activation subsides —
      is standard smooth-muscle physiology; this verdict leans partly on general
      background beyond the single record. The claim as stated is a capability
      claim about vascular smooth muscle, and that capability is real. The
      strongest opposing consideration is E021: the one published
      parent-versus-branch comparison found the behaviour present in rabbit
      femoral artery and absent in its own saphenous branch, attributed to
      motor-protein phenotype and phosphatase differences, so "vascular smooth
      muscle latches" is not a generic property and cannot be read forward to
      arterioles. Established would overstate it given that the molecular
      interpretation is still under refinement and the demonstrated timescales
      are minutes to hours, not the months the synthesis wants.'
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: 'No evidence record supports this directly; the verdict rests on
      background knowledge that collagen remodeling and scar reorganization
      operate on days-to-weeks timescales, which is well established. The
      conditional logic is therefore sound in its main thrust: a genuine
      seconds-scale local change cannot be structural remodeling. The strongest
      opposing consideration is that the state/structure dichotomy is not
      exhaustive — passive viscoelastic creep and stress relaxation under
      sustained probe load, or local fluid displacement, would produce
      seconds-scale mechanical change that is neither remodeling nor an actively
      maintained physiological state the body could "stop doing." And the
      antecedent is unmeasured (C004), so the claim may be true and empty.'
  - claimId: VASO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: "E004 states the hypothesis without testing it, but E005 supplies
      direct causal evidence that blood-pressure pulsations modulate central
      neuronal activity through mechanosensitive channels in rats, and the Piezo
      background makes the mechanism unsurprising. As literally stated —
      vascular and hemodynamic state can modulate nearby neurons — the claim is
      close to trivially true, since perfusion changes alone modulate firing
      through metabolic limitation. The strongest opposing consideration is that
      this triviality is the problem: nothing here distinguishes hemo-neural
      computation from ordinary ischemic or metabolic modulation, the
      demonstration is rat brain rather than human periphery, and one Science
      paper is not a replicated literature. I hold confidence at moderate for
      that reason."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: 'E009 is a systematic review reporting reproducible increases in
      respiratory sinus arrhythmia, HRV, and related autonomic and CNS
      correlates with slow breathing in healthy humans, and E008 independently
      observed higher HRV under internal attention. The strongest opposing
      consideration is interpretive rather than empirical: RSA and time-domain
      HRV rise mechanically with slower, deeper breathing partly through the
      respiratory pump and baroreflex resonance, so "parasympathetic dominance"
      may overstate what the indices license. That caveat does not touch the
      case much, because the claim as worded is about a global autonomic shift,
      which is exactly what the conventional explanation also predicts and
      therefore does not discriminate.'
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: E011 is a systematic review concluding that manual examination for
      trigger points has not been shown reliable or valid and that no accepted
      reference standard exists; E010 is the principal peer-reviewed ontological
      critique; E012 records that even the discrete palpable spot is contested.
      The claim is carefully worded — lacking demonstrated reliability and a
      validated standard, and being contested — and all three parts are directly
      evidenced. The strongest opposing consideration is that Quintner et al.
      drew a point-by-point rebuttal from Dommerholt and Gerwin, and that
      instrumented findings (E006, E007) repeatedly locate objective abnormality
      where palpation points, which pure examiner-artifact accounts must
      explain; but that argues against the strong "nothing is there" reading,
      not against the reliability finding as stated.
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The ledger's support is thin: E015 is proponent testimony plus
      second-hand, unverified fibromyalgia-era community tender-point figures
      that the record itself says should carry no weight until traced, and E018
      is irrelevant hardware news. My verdict leans substantially on background
      — palpation tenderness at predictable sites is a near-universal clinical
      and personal observation. The strongest opposing consideration is E012 and
      the reliability literature: tenderness being common does not license the
      packaging into discrete, countable, localizable objects, which is
      precisely what examiner-agreement studies failed to validate. The census
      (R002) that would settle even this base rung has never been run, which is
      itself a striking fact about the field."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: E001 reports sustained spontaneous needle-EMG activity in a 1–2 mm
      nidus at all trigger points examined and none in adjacent non-tender
      fibers, with amplitude gradients across patient groups — a genuine
      localized finding that survived into later trigger-point literature as
      "spontaneous electrical activity." The strongest opposing consideration is
      that the recorded signal is, on the dominant later interpretation,
      endplate noise, which occurs in normal muscle at motor endplate zones; if
      nidus-finding partly tracks endplate zones, the contrast with "adjacent
      muscle" is less impressive than it reads. The study is also 1993, small,
      single-lab, and measures nothing vascular, so its support for the featured
      hypothesis is limited to establishing that something localized is being
      maintained.
  - claimId: VASO-C003
    verdict: weakly_supported
    confidence: moderate
    reasoning: E002 is directly on point — mental arithmetic raised EMG at trigger
      points while adjacent control sites stayed quiet, without generalized
      tensing — and if it holds it is the most striking observation in the case.
      But it is n=14, from 1994, from the same lineage as E001 (so the two EMG
      records are one line, not two), never replicated with modern
      instrumentation, and the essay's cited follow-ups (relaxation training,
      phentolamine) were not independently verified. The strongest opposing
      consideration is that sympathetic drive to muscle spindles or endplates
      produces this trace with no vascular involvement whatsoever, so even a
      clean replication would not favour the vascular reading over guarding. One
      small unreplicated study cannot support more than a weak verdict.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: The only record is E014, first-person testimony from the hypothesis's
      own proponent in an AI-drafted essay, explicitly labelled as such and
      graded weak. Practitioner lore is broadly consistent with it, but the
      ledger contains no survey, no blinded rater, and no measurement. Read
      narrowly — that people report a felt letting-go within seconds on a long
      exhale under sustained pressure — the claim is probably true and nearly
      unfalsifiable; read as the case needs it, it is unmeasured. The strongest
      opposing consideration is that expectation, attention shift,
      pressure-adaptation of nociceptors, and the global relaxation of slow
      breathing can jointly manufacture the entire experience with nothing local
      changing, which is exactly why R001 rather than more testimony is what
      this claim requires.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Two independent modalities converge: E006 found an acidic,
      mediator-rich milieu at active trigger points, and E007 reports a
      systematic review of 33 imaging studies concluding active and latent
      points are quantifiably distinguishable from healthy tissue on
      biomechanical and flow parameters. Together these defeat the strongest
      examiner-artifact reading. The strongest opposing considerations are
      internal to the records themselves: Shah's own title concedes elevation at
      sites remote from the points (nine volunteers), the imaging review is
      characterized second-hand from the critical report and spans heterogeneous
      techniques and trigger-point definitions, and every included study located
      its object by the unreliable palpation exam of C030. Objective difference
      is supported; its locality and specificity are not."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "E008 is the methodologically strongest record in the file:
      preregistered, within-subject, 57 volunteers across two cohorts, ~1.5-fold
      smaller and faster-resolving wheal and flare under internal attention in
      ~90% of participants, with skin conductance, heart rate, temperature, and
      self-reported anxiety flat and HRV elevated, plus a lidocaine manipulation
      dissociating sensory from top-down routes. That design directly supports
      the claim as stated. The strongest opposing consideration is provenance
      rather than internal validity: one lab, published weeks before extraction,
      molecular mediators not measured by the authors' own admission, an acute
      healthy-skin model, and no independent replication — and the authors note
      the parasympathetic system does not innervate skin directly, leaving the
      effector pathway partly inferred."
sensitivity:
