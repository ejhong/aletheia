  synthesis: >-
    The featured hypothesis is not that people feel tender spots, that vascular
    smooth muscle can latch, or that slow breathing shifts autonomic state.
    Those are lower-rung claims, several of them well supported. The hypothesis
    is the identification of those spots with latched microvascular smooth
    muscle (VASO-C020) and the further claim that vascular tension stores mental
    content (VASO-C021). On the evidence records in this ledger, both
    identifications are unresolved. That is a positive finding about an empty
    cell, not a hedge. Supporting records establish adjacent capabilities and a
    real peripheral phenomenon. They do not observe a latch at a knot, a
    seconds-scale local stiffness or perfusion transition time-locked to
    exhalation, or a write-store-read cycle in which a persistent vascular state
    carries discriminable neural content after its inducing input has ceased.

    Steelman for the hypothesis. Smooth muscle can latch (VASO-C010; Hai and
    Murphy 1988). If a knot objectively let go in seconds, remodeling timescales
    would force a maintained-state reading (VASO-C011), because scar does not
    vanish mid-exhale. Hubbard and Berkoff recorded a millimetre-scale
    electrical nidus in nominally resting muscle, and McNulty and colleagues
    showed a purely cognitive stressor raising that signal selectively — the
    addressability a storage account needs. Shah found an acidic, mediator-rich
    milieu; an imaging review reports stiffness and flow differences at
    nominated sites. Moore and Cao's hemo-neural proposal now has a causal
    demonstration in rat brain via mechanosensitive channels. Mizrachi et al.
    2026 showed voluntary attention shrinking a local inflammatory response
    without arousal change. Write, hold, and read ingredients therefore exist in
    biology, and latch would repair the metabolic implausibility of the classic
    energy-crisis model. Breath as a voluntary autonomic handle then supplies a
    mechanism for the two-key protocol practitioners report. Under this reading
    the conventional account still owes an explanation of discrete electrical
    islands, local chemistry, and abnormal flow without a local hold.

    Steelman against. Every published interpretation of the EMG chatter is
    skeletal-muscle electrophysiology, not vascular. Manual localisation lacks
    demonstrated reliability and a reference standard (VASO-C030). The felt
    release is first-person testimony with no time-locked imaging. The critical
    report's grade-D audit found no study identifying a smooth-muscle latch at a
    tender point and no synchronised release measurement. Study VASO-S001 then
    examined the borrowed mechanism in the named compartment: energetic cost has
    never been measured in any arteriole; pressurized skeletal-muscle arterioles
    hold tone with maintained or rising myosin light-chain phosphorylation, that
    is continued activation rather than a dephosphorylated latch; and latch
    behaviour is not generic even one branch order downstream of a latching
    parent artery. Hysteresis is not memory. Attention-gated histamine wheals
    are a vagal immune reflex over tens of minutes, not an unlatch.
    Contemplative correspondences have never been coded blind. On this reading
    nothing is stored locally: the brain stops guarding, globally or regionally,
    and interpretation supplies the rest.

    The single record whose removal would most change this assessment is
    VASO-E020, the only positive biochemical mismatch in pressurized
    skeletal-muscle arterioles. Without it the mechanism claim would be a pure
    extrapolation into an unexamined compartment rather than an extrapolation
    into a compartment already measured and found to hold by a different
    molecular signature. The case verdict would still be unresolved: the
    keystone imaging experiment has not been run, no latch has been shown at a
    tender point, and no vascular-memory readout exists. The verdict does not
    hang on one thread. It hangs on an empty cell that several independent
    records jointly document. Circumstantial coherence of established parts is
    not weak confirmation of the assembly.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: low
    reasoning: "The ledger contains a theoretical statement (VASO-E013) and an
      explicit negative on memory criteria (VASO-E017): history-dependent tone
      plus instantaneous hemo-neural modulation do not constitute
      content-specific storage. Salameh 2024 makes the weak form — vessels can
      affect neurons — scientifically live, but the claim as stated is the
      strong form, mapping predictions and tanha onto latched tone. No record
      demonstrates write, store, and later readout of discriminable content with
      oxygenation controlled. Strongest opposing consideration: every
      demonstrated vascular effect on neurons in this file is instantaneous gain
      control, which ordinary perfusion physiology already supplies."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: low
    reasoning: "No evidence record reports latch-state biochemistry or vasomotor
      imaging at a tender point. VASO-E016 grades both linchpins D; VASO-E019
      shows the cheap-hold argument has never been measured in any arteriole;
      VASO-E020 shows that in pressurized skeletal-muscle arterioles — the named
      compartment — maintained constriction tracks maintained or rising LC20
      phosphorylation, not a dephosphorylated hold. Adjacent observations (EMG
      nidus, local chemistry, flow differences) are compatible with skeletal
      guarding plus downstream ischemia. Strongest opposing consideration:
      conventional neuromuscular guarding explains the same traces without an
      unobserved vascular mechanism, and E020 is a mismatch rather than a
      designed latch test, so it does not yet contradict the claim."
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: "No evidence record tests alignment of rtsa mdud, granthis, or ashi
      points against chance under prespecified coding rules. The claim is
      comparative phenomenology plus an untested cartography hypothesis, and
      nothing in the ledger converts resemblance into a measured correspondence.
      Strongest opposing consideration: with many traditional maps and many
      anatomical structures, some post-hoc match is guaranteed — the
      degrees-of-freedom trap the claim file itself records — so uncoded
      convergence is not evidence."
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: "Hai and Murphy 1988 (VASO-E003) is strong, textbook-level support
      for the latch-bridge as a capability of vascular smooth muscle: force
      maintained after phosphorylation falls. VASO-E021 qualifies rather than
      contradicts: the one parent-versus-branch comparison found latch in the
      femoral and absent in its own muscular branch, so the capability is real
      but not generic across caliber and motor-protein phenotype. Strongest
      opposing consideration is that minutes-to-hours in large tonic
      preparations do not license indefinite in-vivo holds at addressable
      microvascular sites, which is an extrapolation the synthesis needs but
      which the capability claim as stated does not assert."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The conditional logic is sound on established remodeling biology,
      which is a prior rather than a ledger result: collagen and scar do not
      reorganize in seconds, so an objective seconds-scale local change would be
      a change of maintained state. No evidence record in this file measures
      that antecedent; it rests on VASO-C004's untested felt-release reports.
      Strongest opposing consideration: if felt releases have no local
      mechanical or perfusion correlate, the conditional is vacuously true and
      carries no weight against structural or purely central accounts."
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Moore and Cao 2008 (VASO-E004) is a hypothesis paper. Jammal Salameh
      et al. 2024 (VASO-E005) supplies causal evidence that blood-pressure
      pulsations modulate central neurons via mechanosensitive channels in rats
      — the read path, on rapid timescales, in brain. That is enough for the
      claim as a capability and not enough for storage or for the periphery.
      Strongest opposing consideration: metabolic and ischemic suppression
      already couple vessels to neurons; without oxygenation-controlled
      experiments, hemo-neural computation is not distinguished from ordinary
      perfusion effects, and nothing here is a stored trace."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: "Zaccaro et al. 2018 (VASO-E009) is a systematic review documenting
      reproducible HRV and RSA increases and related autonomic and CNS changes
      with slow breathing in healthy humans. The claim as stated — a global
      parasympathetic shift — is well supported by that literature. Strongest
      opposing consideration: a global shift is exactly what the conventional
      account uses to explain breath-linked relief without any local unlatching,
      so this finding is non-discriminating for the featured hypothesis."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: "Lucas et al. 2009 (VASO-E011) concluded that manual examination for
      trigger points has not been shown reliable or valid and lacks a reference
      standard; Quintner, Bove and Cohen 2015 (VASO-E010) argue the construct is
      circular. Both are on point for the claim as stated, which asserts a
      reliability failure and a contested construct, not the non-existence of
      tenderness. Strongest opposing consideration: instrumented findings (EMG
      nidus, Shah biochemistry, imaging review VASO-E007) repeatedly report
      local abnormality where palpation points, which a pure examiner-artifact
      reading struggles to absorb, and Dommerholt and Gerwin answered Quintner,
      so the ontological half of the dispute is not settled."
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Common focal tenderness is attested by practitioner experience and
      by the essay's second-hand community tender-point figures (VASO-E015,
      weak; underlying survey unverified in this project). VASO-E012, drawing on
      the same reliability literature as VASO-C030, qualifies the claim:
      skeptics dispute the discrete localizable spot itself, not only its
      mechanism. Strongest opposing consideration: countable knots may be
      packaging imposed by trained fingers rather than discrete tissue objects,
      even if regional tenderness is common; that prior about everyday
      palpability is not a ledger measurement."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Hubbard and Berkoff 1993 (VASO-E001) recorded sustained spontaneous
      needle-EMG in a 1–2 mm trapezius nidus and none in adjacent non-tender
      fibers. The claim as stated is that measurement, and later trigger-point
      literature treats spontaneous electrical activity as a replicated sign,
      though this file does not import those replications as separate records.
      Strongest opposing consideration: the sample is old and small, the
      generator is contested (endplate potentials versus spindles), and by every
      published interpretation the signal is skeletal-muscle electrophysiology,
      so it supports guarding at least as readily as any vascular reading."
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: "McNulty et al. 1994 (VASO-E002) reported that mental arithmetic
      raised EMG at trigger points while same-muscle control sites stayed quiet,
      without generalized tensing (n=14). The claim as stated matches that
      result and is the only write-head observation in the file. Strongest
      opposing consideration: a single unreplicated study from the same lineage
      as VASO-E001, three decades old, with no vascular endpoint, can be
      produced by sympathetic drive to spindles or endplates without any stored
      vascular state."
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: "The only record is first-person practitioner testimony, including
      the case author's (VASO-E014, weak). Assessed as stated — a felt release,
      not an objective tissue change — that testimony is some evidence, widely
      echoed in bodywork lore, and uncontrolled for expectation, attention, and
      generalized relaxation. Strongest opposing consideration: a feeling of
      letting-go can be generated centrally with no local stiffness or perfusion
      change, which is why the unrun keystone experiment, not more reports, is
      what this claim needs if it is to carry VASO-C011."
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Shah et al. 2008 (VASO-E006) found pain-associated mediators and
      acidity elevated at active points, also remotely; Mazza et al. 2021 as
      audited (VASO-E007) concluded imaging can distinguish active and latent
      points from healthy tissue, with reproducibility caveats. Multiple
      independent modalities therefore point at local abnormality rather than
      pure examiner artifact. Strongest opposing consideration: small
      heterogeneous studies with palpation-defined sites inherit VASO-C030's
      localization problem, Shah's remote elevations weaken a strictly
      focal-ischemia reading, and the Mazza characterization in this file is
      second-hand from the critical report."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Mizrachi et al. 2026 (VASO-E008) is preregistered, within-subject,
      and reports roughly 1.5-fold smaller, faster-resolving histamine responses
      under site-directed attention in about 90 percent of participants, without
      arousal differences and with higher HRV. That establishes a
      cognition-to-periphery channel in an acute vascular bed. Strongest
      opposing consideration: the demonstrated route is vagal anti-inflammatory
      regulation over about twenty minutes in healthy skin, not seconds-scale
      unlatching of a chronic intramuscular latch, and the result is single-lab
      and new."
