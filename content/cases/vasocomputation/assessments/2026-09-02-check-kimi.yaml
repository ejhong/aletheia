  synthesis: "Steelman for the featured hypothesis: the stack is assembled from
    real parts. Latch physiology is textbook (VASO-E003); the vascular-to-neural
    read path now has a direct causal demonstration (VASO-E005); slow breathing
    is a verified autonomic lever (VASO-E009); tender points carry objective
    local abnormality across three independent modalities — a millimeter-scale
    EMG nidus (VASO-E001), an acidic mediator-rich milieu (VASO-E006), and
    imaging separability surviving systematic review (VASO-E007); the brain can
    write selectively to one tender point without movement (VASO-E002); and
    attention can regulate peripheral tissue at a chosen site without arousal
    change (VASO-E008). The latch reading patches the energy-crisis hole in
    classical trigger-point theory and makes a sharp, falsifiable prediction no
    rival makes: a seconds-scale, exhale-locked local transition with perfusion
    leading stiffness. Steelman against: both linchpins are grade D — never
    observed in either direction (VASO-E016). The anchor phenomenon is proponent
    testimony (VASO-E014). The best local evidence is skeletal-muscle
    electrophysiology, which guarding explains without any vasculature.
    Palpation unreliability (VASO-E011) and the construct critique (VASO-E010)
    soften the entire observation base. Most consequentially, the executed
    evidence map moved the mechanism from \"unexamined downstream\" to
    \"counter-indicated where examined\": energetic economy has never been
    measured in any arteriole (VASO-E019); pressurized skeletal-muscle
    arterioles hold constriction with maintained or rising myosin
    phosphorylation — the opposite of the latch signature (VASO-E020); and latch
    behaviour is not generic across calibers (VASO-E021). Verdict reasoning:
    this is unresolved, not contradicted, because none of VASO-E019–E021 was
    designed as a latch test (maintained stimuli, no withdrawal phase,
    abstract-level extraction) — they mismatch rather than refute — and not
    weakly_supported, because every supportive record is consistency rather than
    observation. The crux is a cheap, specified, unrun experiment;
    \"unresolved\" is the substantive finding, and the ledger's center of mass
    has tilted skeptical since VASO-S001. Sensitivity: removing VASO-E020 — the
    only record bearing on the exact tissue compartment with the exact molecular
    readout — would most change this assessment, returning the arteriole to
    \"simply unexamined.\" The verdict survives: with both linchpins still
    undemonstrated, unresolved stands, but the lean softens from
    skeptical-tilted to fully open. The verdict does not hang on one thread; the
    direction of its tilt does."
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: low
    reasoning: "The claim as stated asserts that vascular tension functions as a
      memory element participating in mental life, and no record demonstrates
      the required write–store–read cycle with content specificity: VASO-E013
      states the theory, VASO-E003 supplies a storage-capable mechanism, and
      VASO-E005 demonstrates only instantaneous modulation. VASO-E017 makes the
      gap precise — biological memory must discriminate between prior inputs and
      be later read out, criteria no vascular study addresses, with the nearest
      precedent in a slime mold. The strongest opposing consideration is that
      the weak form (vascular state shaping neural computation) is now directly
      evidenced in animals, so this is a live extrapolation rather than idle
      speculation. A concrete falsification design exists (VASO-R005), so the
      claim is unresolved rather than presently untestable."
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: "No record demonstrates a smooth-muscle latch at a tender point or an
      objective seconds-scale release; VASO-E016 grades both linchpins D. The
      supportive evidence is consistency, not observation: the acidic milieu and
      Doppler abnormalities (VASO-E006, VASO-E007) fit local ischemia but
      equally fit guarding-induced compression, and the EMG signature
      (VASO-E001, VASO-E002) is skeletal-muscle by every published
      interpretation. The new evidence map tilts against: energetic economy has
      never been measured in any arteriole (VASO-E019), pressurized
      skeletal-muscle arterioles show maintained constriction with maintained or
      rising phosphorylation rather than the latch signature (VASO-E020), and
      latch is not generic across vessel calibers (VASO-E021). The strongest
      opposing consideration is that none of those three studies was a designed
      latch test — stimuli were maintained throughout, so input-free persistence
      could not have appeared even if it exists — making this a mismatch, not a
      refutation. Unresolved, with an explicit skeptical tilt."
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: "The ledger contains no evidence record testing this claim: the
      convergence of Tibetan, Hindu, and Chinese knot maps is described only in
      the overview as comparative phenomenology, and no blinded, preregistered
      coding of traditional locations against modern anatomy has been attempted.
      The strongest opposing consideration is the degrees-of-freedom trap named
      in the claim record — with enough traditional maps and enough anatomical
      structures, some alignment is guaranteed post hoc. Even a strong alignment
      would corroborate rather than establish the mechanism claims, so
      diagnosticity is low. The claim is testable via VASO-R006 and simply
      awaits it."
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: "The claim as stated is a capability — vascular smooth muscle can
      hold force cheaply after activation subsides — and that capability is
      textbook physiology since Hai and Murphy 1988 (VASO-E003), with energetic
      measurements existing in large tonic arterial preparations. The strongest
      opposing consideration is VASO-E021: the one published comparison between
      a vessel and its own downstream branch found latch behaviour present in
      the parent and absent one branch order later, from a single laboratory
      lineage, so the claim must not be read as \"vascular smooth muscle
      generically latches.\" VASO-E019 adds that energetic economy is unmeasured
      at arteriole caliber. These qualify the claim's generality and its
      extrapolation to tender points, not the demonstrated existence of the
      phenomenon, so well_supported with vessel phenotype as a load-bearing
      variable."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The conditional is sound: tissue remodeling takes days to weeks, so
      a genuine seconds-scale local change must be a change of maintained state
      — this leans on general physiological background rather than any ledger
      record, which I flag as prior-based calibration. The antecedent, however,
      is unverified: VASO-E014 is weak first-person testimony and VASO-E016
      confirms no time-locked imaging of a release exists. The strongest
      opposing consideration is that the felt release may be a purely perceptual
      and central event — reduced guarding and reinterpreted sensation — in
      which case the conditional is vacuously true and carries nothing. Assessed
      as stated, the inference holds; its empirical weight awaits VASO-R001."
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E005 demonstrates the claimed capability directly:
      physiological blood-pressure pulsations modulate neuronal activity through
      mechanosensitive ion channels in rat preparations and awake animals,
      giving the 2008 hypothesis paper (VASO-E004) a demonstrated mechanism. The
      strongest opposing consideration is that this is a single 2024 study in
      brain tissue, showing instantaneous mechanosensation rather than storage,
      and that any hemo-neural claim must be distinguished from trivial ischemic
      suppression under oxygenation control — the mechanical-channel finding
      mitigates but does not settle this for all candidate pathways. The
      peripheral extension the case needs (sensory endings wrapped around
      vessels) is biologically plausible but untested. The capability is real;
      its generality and computational significance remain open."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: "VASO-E009 is a systematic review documenting reproducible increases
      in respiratory sinus arrhythmia and heart-rate variability under slow
      breathing — the claim as stated asserts only this global autonomic shift,
      and it is well documented. The strongest opposing consideration is
      diagnostic, not empirical: a global parasympathetic shift is exactly what
      the conventional account also predicts, so this record supports
      guarding-plus-relaxation as readily as the featured hypothesis. The case's
      needed next step — that an exhale unlatches a specific arteriole at an
      identified site — is not part of this claim and has never been measured."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: "VASO-E011 (Lucas et al. 2009) is systematic-review-grade: manual
      trigger-point examination has not been demonstrated reliable or valid,
      partly because no reference standard exists, and this finding is largely
      uncontested. VASO-E010 documents the peer-reviewed construct critique and
      its point-by-point rebuttal — the existence of that open exchange itself
      establishes the contested status the claim asserts. The strongest opposing
      consideration is that instrumented measures (VASO-E001, VASO-E006,
      VASO-E007) repeatedly find focal abnormality where palpation points, which
      pure examiner-artifact readings struggle to explain — but the claim is
      about reliability and contestation, not nonexistence, so it stands."
  - claimId: VASO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: "Ubiquity is attested by near-universal practical experience and by
      the fibromyalgia-era community tender-point exams, though the specific
      figures in VASO-E015 are second-hand and unverified and carry little
      weight. Focality draws support from VASO-E001 (activity absent one
      centimeter away) and the multi-modal abnormalities of VASO-E006 and
      VASO-E007. The strongest opposing consideration is VASO-E012's correction,
      reinforced by VASO-E011: the reproducibility and ontological status of the
      discrete \"spot\" are themselves part of the academic debate, so the
      packaging of real tenderness into countable, localizable objects is the
      soft component. Because the claim as stated includes discreteness,
      confidence is moderate rather than high."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: VASO-E001 is peer-reviewed and directly on point — sustained
      spontaneous activity confined to a 1–2 mm nidus, absent in adjacent
      non-tender muscle — and the claim record notes later replication as
      "spontaneous electrical activity" in the trigger-point literature. The
      study is nonetheless from 1993, small, and from a single lineage, and the
      signal's generator remains contested between endplate potentials and
      spindles. The strongest opposing consideration is that under every
      interpretation the activity is skeletal-muscle electrophysiology, so the
      finding supports guarding accounts as readily as vascular ones — reading
      it as evidence for a vascular mechanism reads it against its own
      literature. As a measurement claim (something localized is electrically
      maintained), it is provisionally supported.
  - claimId: VASO-C003
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The entire rung rests on one study: VASO-E002, n=14, 1994, same
      lineage as Hubbard and Berkoff, never replicated with modern
      instrumentation, with no vascular endpoint, and the claimed follow-ups
      (relaxation lowering activity, phentolamine quieting the site) were never
      independently located. The within-muscle control design — activity rising
      at the trigger point but not a centimeter away during mental arithmetic,
      without general tensing — is clean and directly on point, which keeps this
      above rumor. The strongest opposing consideration is that sympathetic
      drive to muscle spindles or endplates fully explains the trace without any
      vascular storage. A single small unreplicated study warrants
      weakly_supported pending the stressor block of VASO-R001."
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The only record is VASO-E014: first-person testimony from the
      hypothesis's proponent, consistent with widespread practitioner lore,
      measured by no one. As a claim about felt experience, testimony is the
      relevant evidence class and the phenomenon is broadly attested across
      bodywork traditions; as a claim about the two-key causal structure
      (pressure plus exhale, release in seconds), nothing controlled exists. The
      strongest opposing consideration is that expectation, attention shift, and
      generalized relaxation can produce an identical felt release with no local
      tissue change — precisely the alternative VASO-R001 is designed to
      exclude. This is the case's most consequential weak link: the anchor
      phenomenon is also its least instrumented."
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Two independent modalities converge: microdialysis found an acidic,
      mediator-rich milieu at active points (VASO-E006), and a 33-study imaging
      systematic review found active and latent points quantifiably
      distinguishable from healthy tissue on stiffness and flow (VASO-E007).
      Against this: the biochemical study was small (roughly nine volunteers)
      with mediators elevated remotely as well as locally, the imaging
      literature is heterogeneous in technique and definition, the review's
      characterization is second-hand from the critical report, and all of it
      inherits the localization problem of VASO-E011 — instruments can only find
      the spot where palpation points. The findings are mechanism-neutral:
      guarding with downstream ischemia predicts the same chemistry. As an
      existence claim for objective local abnormality, provisionally supported."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E008 is a strong single-lab package: preregistered,
      within-subject, 57 volunteers, effects in roughly 90% of participants
      across two cohorts, no difference in arousal measures, heart-rate
      variability higher under internal attention, and a lidocaine dissociation
      separating sensory from top-down vagal routes. The claim as stated —
      attention toward a site measurably dampens acute inflammation without
      arousal change — is exactly what was demonstrated. The strongest opposing
      consideration is that it is one laboratory, weeks old at assessment time,
      in an acute skin model with molecular mediators unmeasured (the authors'
      own caution), and the demonstrated route is vagal immune regulation over
      twenty minutes, not latch removal in seconds — borrowing it for vascular
      memory conflates channel existence with storage. Provisionally supported
      pending independent replication."
