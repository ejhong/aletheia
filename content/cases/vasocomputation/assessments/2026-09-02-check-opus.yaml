    reasoning: 'No evidence record in this file attaches to this claim in either
      direction; the only warrant offered in the overview is a qualitative
      observation that traditional midline knot locations sit near sympathetic
      chains and dorsal root ganglia. That observation has never been produced
      under prespecified coding rules, so it cannot currently be distinguished
