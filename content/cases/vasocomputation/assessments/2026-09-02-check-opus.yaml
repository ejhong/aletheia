    reasoning: "The weak reading — vascular state is part of the physical state
      space shaping neural computation — has one strong supporting record (E005)
      but that record demonstrates instantaneous mechanosensitive modulation,
      not storage. The strong reading as stated, that latch states implement
      held predictions and clinging, rests entirely on E013, a self-published,
      non-peer-reviewed theoretical program whose own experimental arm was, as
      of the case date, seeking evidence rather than reporting it. E017 states
      the decisive objection well: hysteresis is not memory unless something
      later reads it out with content discrimination, and no write–store–read
      cycle has been demonstrated in mammalian vasculature. The strongest
      opposing consideration is that every demonstrated vascular effect on
      neurons to date is instantaneous gain modulation, which is fully at home
      in conventional neurovascular physiology and requires no storage element."
