  synthesis: "The case is built as a ladder, and the ladder's structural integrity
    is exactly inverse to the interest of its rungs. The bottom two rungs hold:
    slow breathing demonstrably shifts global autonomic indices (E009), smooth
    muscle in at least some vascular preparations demonstrably holds force
    economically after activation falls (E003), voluntary interoceptive
    attention demonstrably regulates a localized peripheral inflammatory
    response without arousal change (E008), and instruments do find something
    objectively abnormal where palpation points (E006, E007). The top two rungs
    — that a muscle knot IS a latched arteriole (C020), and that vascular
    tension stores mental content (C021) — carry no direct evidence in either
    direction, and the ledger contains three records that actively cut against
    the mechanism's transferability. E019 establishes that the \"cheap hold\"
    argument has never been measured in any arteriole, only in large tonic
    conduit preparations at zero transmural pressure. E021 shows latch behaviour
    is not generic to vascular smooth muscle: it was present in a rabbit femoral
    artery and absent one branch order downstream, making vessel phenotype
    load-bearing rather than incidental. E020 is the sharpest: in pressurized
    skeletal-muscle arterioles — the exact compartment C020 names — maintained
    constriction tracks maintained or rising myosin light-chain phosphorylation,
    the signature of sustained activation rather than an economical
    dephosphorylated hold. None of those studies was designed as a latch test
    and all held the stimulus present, so this is a mismatch, not a refutation;
    but it removes the proponent's fallback that the compartment is merely
    unexamined. Steelmanning the other side: the conventional account is not
    without debts. A purely central guarding-plus-expectation story must still
    explain a millimetre-scale electrically active nidus that vanishes a
    centimetre away (E001), a stress-selective rise at that nidus but not at a
    control site in the same muscle (E002), and reproducible flow abnormalities
    (E007). And the skeptical literature's own strongest weapon, the reliability
    critique (E010, E011), is a claim about the clinical exam, not about the
    absence of tissue-level abnormality. So the honest reading is not that
    vasocomputation has been refuted; it is that the one experiment that would
    engage it — time-locked elastography and Doppler across a felt release with
    factorial controls — has never been run, while the flanking mechanistic
    literature has drifted mildly against the borrowed mechanism. Unresolved,
    with a negative tilt on the mechanism and a genuinely open anchor
    phenomenon. Sensitivity: the single most consequential record is VASO-E020,
    the only record in the file with directional mechanistic content about the
    named tissue compartment. Removing it would restore the \"compartment simply
    unexamined\" framing and soften the negative tilt — but the case verdict
    survives unchanged at unresolved, because that verdict rests on an absence
    (no time-resolved release measurement, no latch identified at any tender
    point) that no single record creates. Equivalently, removing E014 would
    strip the anchor phenomenon of its only evidentiary basis and leave C004
    unsupported rather than weakly supported; the case verdict would still be
    unresolved, merely emptier. This case does not hang on one thread; it hangs
    on a missing measurement."
