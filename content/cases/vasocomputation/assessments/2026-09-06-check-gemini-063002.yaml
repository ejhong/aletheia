  synthesis: >-
    The featured hypothesis ("State, Not Scar?") presents a layered theoretical
    framework proposing that myofascial trigger points ("muscle knots") are
    actively maintained microvascular-autonomic latch-bridge states rather than
    structural scars, and that this vascular tone physically implements mental
    prediction and contemplative "clinging" (vasocomputation). Evaluating the
    ledger demonstrates a profound divergence between the lower empirical rungs
    and the upper theoretical architecture. The basic observations that tender
    points are distinct physiological entities have legitimate support: active
    points show measurable biochemical alterations (elevated substance P, CGRP,
    lower pH; Shah 2008, VASO-E006), distinct stiffness and flow profiles on
    ultrasound (Mazza 2021, VASO-E007), and responsiveness to cognitive stress
    (McNulty 1994, VASO-E002). Furthermore, autonomic handles are genuine: slow
    breathing reliably enhances parasympathetic indices (Zaccaro 2018,
    VASO-E009), directed interoception can attenuate local inflammation
    (Mizrachi 2026, VASO-E008), and hemodynamic pulses modulate neuronal firing
    (Salameh 2024, VASO-E005).

    However, the central mechanistic claims—that the contracting entity is
    microvascular smooth muscle locked in a dephosphorylated latch state, and
    that vascular tone functions as a computational memory register—are
    unevidenced and directly challenged by available microvascular data. As
    revealed by Study VASO-S001 (VASO-E019, VASO-E020, VASO-E021), the
    latch-bridge model has been verified only in large conduit arteries at zero
    transmural pressure; in cannulated, pressurized skeletal-muscle arterioles,
    sustained constriction is accompanied by sustained or elevated LC20
    phosphorylation and intracellular calcium, driven by Rho-kinase calcium
    sensitization and actin reorganization rather than dephosphorylated latch
    bridges (Zou et al. 1995, 2000; Moreno-Dominguez et al. 2013). Furthermore,
    persistence after stimulus withdrawal has never been demonstrated in any
    intact vessel preparation, and no study has ever demonstrated a
    smooth-muscle latch at a trigger point (VASO-E016). Finally, mapping
    vascular hysteresis to cognitive memory registers or Buddhist tanha remains
    an unvalidated theoretical conjecture.

    Regarding sensitivity: the single evidence record whose removal would most
    change this verdict is VASO-E020. Removing VASO-E020 would eliminate the
    direct molecular mismatch showing maintained phosphorylation in
    skeletal-muscle resistance microvessels, thereby removing the strongest
    mechanistic objection; nevertheless, the overall verdict of weakly_supported
    comfortably survives its removal, because VASO-E016 and VASO-E019
    independently document an absence of direct empirical evidence connecting
    myofascial knots to smooth-muscle latching.
  steelman: The simultaneous co-occurrence at trigger points of focal spontaneous
    needle-EMG activity, a hypoxic/acidic inflammatory milieu, and selective
    activation by cognitive stressors—all while somatic exhalation and directed
    attention measurably modulate peripheral tissue dynamics—presents a
    coordinated neurovascular phenotype that conventional structural-scar and
    non-specific guarding accounts fail to explain.
claimAssessments:
  - claimId: VASO-C021
    verdict: weakly_supported
    confidence: high
    reasoning: The theoretical proposal that vascular smooth muscle implements
      cognitive memory, held expectations, or Buddhist clinging rests entirely
      on speculative frameworks without direct experimental validation. While
      hemo-neural coupling and attention-mediated immune modulation exist as
      real biological phenomena, biological memory requires a demonstrated
      write-store-read loop that can discriminate prior inputs, which has never
      been shown in mammalian vascular beds. The strongest opposing
      consideration is that interoceptive attention can measurably alter
      peripheral vascular and inflammatory dynamics in vivo (as demonstrated by
      Mizrachi et al.), suggesting that mental states and local vascular control
      are bidirectionally linked.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: high
    reasoning: The proposition that muscle knots are maintained microvascular smooth
      muscle latch-bridge states is an unsupported extrapolation from conduit
      artery physiology to microvascular beds. Study VASO-S001 demonstrates that
      no energetic measurement exists in resistance arterioles, and actual
      microvascular studies show maintained tone is driven by continuous
      activation and Rho-kinase sensitization rather than dephosphorylated latch
      bridges. The strongest opposing consideration is that active trigger
      points clearly exhibit focal ischemia, low pH, and rapid reversible
      stiffness that structural scar tissue cannot account for, leaving an
      actively maintained physiological or vascular spasm mechanism as a viable
      alternative hypothesis.
  - claimId: VASO-C022
    verdict: weakly_supported
    confidence: high
    reasoning: Mapping traditional contemplative cartographies (rtsa mdud, granthis,
      ashi points) directly onto modern vascular-autonomic structures remains an
      interpretive post-hoc analogy. No preregistered, blinded anatomical
      overlap study has been conducted to demonstrate that these traditional
      locations correlate with vascular branch points or autonomic plexuses
      beyond chance expectation. The strongest opposing consideration is that
      empirical acupuncture and traditional trigger-point maps demonstrate high
      phenomenological concordance with modern myofascial tender points,
      suggesting shared experiential observation of peripheral tension nodes.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: The ability of vascular smooth muscle to maintain isometric tension
      at low energetic cost and reduced myosin phosphorylation—the latch-bridge
      state—is a textbook physiological model validated in large arterial
      preparations and single-molecule assays. Biochemical and biophysical
      experiments confirm that dephosphorylated cross-bridges detach slowly,
      maintaining economical force after initial activation peaks. The strongest
      opposing consideration is that this phenotype is not ubiquitous across all
      vascular smooth muscle, failing to appear in downstream muscular branches
      such as the rabbit saphenous artery.
  - claimId: VASO-C011
    verdict: well_supported
    confidence: moderate
    reasoning: Biophysically, permanent collagenous cross-linking and remodeled scar
      tissue cannot physically remodel or resolve within seconds under manual
      pressure and exhalation. A rapid change in mechanical stiffness over
      seconds requires the disassembly of active contractile machinery, altered
      neuromuscular tone, or shifts in hydrostatic and microvascular state. The
      strongest opposing consideration is that non-contractile viscoelastic
      relaxation, thixotropic ground substance thinning, or fascial mechanical
      slippage under load could produce rapid subjective softening without
      requiring cellular unlatching.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: high
    reasoning: Direct evidence confirms that local hemodynamics can modulate
      neuronal excitability; specifically, Salameh et al. demonstrated that
      physiological blood-pressure pulsations drive central neuronal activity
      via mechanosensitive ion channels. This provides a validated biophysical
      mechanism for the mechanical modulation of neural activity by vascular
      state. The strongest opposing consideration is that these findings are
      primarily derived from central rat brain preparations, leaving their
      operation in human peripheral skeletal muscle and cutaneous nociception
      largely unverified.
  - claimId: VASO-C013
    verdict: established
    confidence: high
    reasoning: Extensive physiological literature and systematic reviews confirm
      that paced slow breathing, especially with extended exhalation,
      consistently increases respiratory sinus arrhythmia and heart rate
      variability, shifting autonomic tone toward parasympathetic dominance.
      This pathway represents a reliable, non-invasive physiological handle for
      modulating central autonomic outflow. The strongest opposing consideration
      is that systemic shifts in parasympathetic tone measured by cardiac
      metrics do not guarantee localized or functionally meaningful changes in
      intramuscular resistance arterioles.
  - claimId: VASO-C030
    verdict: established
    confidence: high
    reasoning: Systematic methodological reviews, notably Lucas et al. and the
      critical critique by Quintner et al., confirm that manual palpation of
      myofascial trigger points suffers from poor inter-examiner reliability and
      lacks a validated diagnostic reference standard. The ontological validity
      of the trigger-point construct remains actively contested in the clinical
      and rheumatological literature. The strongest opposing consideration is
      that experienced clinicians and specialized trial groups claim high
      diagnostic concordance when using standardized, highly restricted physical
      examination algorithms.
  - claimId: VASO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: The clinical observation that discrete, exquisitely tender, palpable
      points commonly occur in human myofascial tissues is widely corroborated
      by physical medicine literature and population-level rheumatological
      surveys. Individuals across diverse demographic cohorts regularly exhibit
      localized nodes of heightened mechanical hyperalgesia. The strongest
      opposing consideration is that systematic reviews show palpating examiners
      frequently disagree on the precise boundaries and locations of these
      discrete spots, indicating that their boundaries may be far more diffuse
      or subjective than commonly assumed.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Hubbard and Berkoff's 1993 study provided needle-EMG recordings
      showing focal, sustained spontaneous electrical activity within a 1–2 mm
      trigger-point nidus that was absent in adjacent non-tender fibers. This
      provides an objective electrophysiological basis for localized muscular
      tension. The strongest opposing consideration is that this finding
      originates from a single laboratory, was conducted on a small clinical
      cohort, and the physiological generator of the signal remains disputed
      (favoring endplate noise rather than muscle spindle contractions).
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: McNulty et al. demonstrated in a laboratory paradigm that mental
      arithmetic stress selectively amplified needle-EMG activity at trigger
      points while adjacent muscle fibers remained electrically quiet. This
      directly links psychological stress to focal peripheral muscular
      electrical activity. The strongest opposing consideration is that the
      finding comes from a single 1994 study with a small sample size (n=14)
      that has not undergone modern preregistered replication, and the observed
      activity could be mediated by sympathetic endplate drive rather than
      vascular storage.
  - claimId: VASO-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: First-person reports and extensive manual therapy phenomenology
      document that focal pressure combined with slow exhalation often yields an
      immediate sensation of softening or 'release' within seconds. This
      subjective phenomenon serves as the clinical anchor for many conservative
      manual interventions. The strongest opposing consideration is that this
      phenomenon is substantiated only by subjective testimony and practitioner
      lore, lacking any synchronized time-resolved objective imaging or
      force-displacement measurement to rule out sensory adaptation or
      expectancy bias.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: Shah et al.'s microdialysis studies demonstrate an acidic milieu
      enriched in inflammatory mediators (substance P, CGRP, bradykinin) at
      active trigger points, and Mazza et al.'s systematic imaging review
      indicates measurable alterations in elastographic stiffness and blood
      flow. These convergent instrumented modalities distinguish active trigger
      points from surrounding tissue. The strongest opposing consideration is
      that biochemical elevations were also detected at remote uninvolved sites,
      and imaging studies exhibit significant methodological heterogeneity and
      variable reproducibility.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: high
    reasoning: In a rigorous, preregistered within-subject trial published in Nature
      Human Behaviour, Mizrachi et al. showed that voluntary attention directed
      toward an acute histamine prick significantly reduced wheal and flare size
      compared to distraction, with stable sympathetic arousal. This establishes
      an empirical existence proof that directed attention can modulate
      peripheral inflammatory and vascular responses. The strongest opposing
      consideration is that the experiment evaluated an acute, chemically
      induced cutaneous skin prick rather than chronic myofascial or deep
      muscular tension.
