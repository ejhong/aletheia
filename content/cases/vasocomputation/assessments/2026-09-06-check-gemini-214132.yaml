  synthesis: >-
    The core hypothesis ("State, Not Scar") attempts an ambitious bridge across
    three levels: the physical nature of myofascial trigger points ("knots"),
    the biophysics of vascular smooth muscle (latch-state mechanics), and
    high-level cognitive/contemplative phenomenology (vasocomputation and
    Buddhist "clinging"). When disassembled along its evidentiary joints, the
    empirical support weakens progressively as one ascends from basic physiology
    to systemic interpretation.

    At the foundational level, several peripheral components are well grounded
    in the evidence records: vascular smooth muscle genuinely exhibits a
    latch-bridge phenomenon allowing economical force maintenance (VASO-C010;
    Hai & Murphy 1988), slow exhalation reproducibly shifts systemic autonomic
    balance toward parasympathetic dominance (VASO-C013; Zaccaro 2018), and
    trigger points display local biochemical perturbations and distinct
    needle-EMG activity that can react to cognitive stress (VASO-C002,
    VASO-C003, VASO-C005).

    However, the critical linchpins bridging these domains fail under scrutiny.
    First, the identification of myofascial trigger points is plagued by poor
    inter-examiner reliability and diagnostic contestation (VASO-C030; Lucas
    2009, Quintner 2015). Second, and most damaging to the central mechanistic
    claim (VASO-C020), the latch-bridge mechanism has never been empirically
    demonstrated in skeletal-muscle resistance arterioles. To the contrary,
    Study VASO-S001 (VASO-E019, VASO-E020, VASO-E021) reveals that microvascular
    arterioles maintain constriction via persistent activation (elevated LC20
    phosphorylation and calcium sensitization via Rho-kinase) rather than an
    economical, dephosphorylated latch hold, and latch behavior fails even one
    branch downstream in muscular arteries (Han 2006).

    Furthermore, the claim that vascular tone serves as a cognitive memory
    element or physical implementation of contemplative "clinging" (VASO-C021,
    VASO-C022) remains entirely speculative. While hemo-neural modulation exists
    centrally on millisecond timescales (Salameh 2024), there is no evidence of
    a write-store-read memory loop in peripheral vasculature. The hypothesis
    survives only as a weakly supported, highly speculative framework whose
    primary physical mechanism is currently contradicted by the nearest
    available microvascular data.
  steelman: The rapid, seconds-scale somatic release of localized tenderness under
    sustained pressure and prolonged exhalation is a distinct phenomenological
    event that conventional structural-lesion and slow-fibrotic models cannot
    explain, leaving an open niche for state-dependent autonomic or
    microvascular transition dynamics.
claimAssessments:
  - claimId: VASO-C021
    verdict: weakly_supported
    confidence: high
    reasoning: This interpretive claim extrapolates basic neurovascular coupling
      into a full computational architecture where vascular tone serves as
      cognitive memory and Buddhist 'clinging'. While instant hemo-neural
      mechanosensation is demonstrated centrally in rats (VASO-E005), and
      attention can modulate dermal inflammation over 20 minutes (VASO-E008),
      there is zero experimental evidence demonstrating a peripheral
      write-store-read memory cycle in vascular smooth muscle (VASO-E017). The
      strongest opposing consideration is that biological memory requires
      input-dependent state retention that alters future readout (as seen in
      primitive flow networks like Physarum), but mammalian vascular hysteresis
      has never been shown to carry information or encode expectations.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: high
    reasoning: The hypothesis that muscle knots are maintained microvascular
      smooth-muscle latch states causing local ischemia is undermined by
      available physiological data. While trigger points show altered
      biochemistry (VASO-E006) and spontaneous EMG (VASO-E001), Study VASO-S001
      demonstrates that maintained constriction in skeletal-muscle arterioles
      operates via continuous activation (elevated LC20 phosphorylation and
      Rho-kinase sensitization) rather than an uncoupled latch-bridge state
      (VASO-E020), and no study has ever demonstrated energetic economy or
      input-free persistence in arterioles (VASO-E019). The strongest opposing
      consideration is that trigger points clearly represent an active,
      reversible state rather than permanent structural scarring, leaving open
      the possibility of an alternative active maintaining mechanism.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: high
    reasoning: This interpretive attribution posits that traditional concepts (rtsa
      mdud, granthis, ashi points) are empirical maps of the vascular-autonomic
      tension system generated via trained interoception. No formal
      cross-registration or blinded spatial mapping has been conducted between
      traditional anatomical loci and vascular or autonomic structures
