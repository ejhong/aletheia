  synthesis: "The case has a genuinely solid observation floor and an unevidenced
    mechanism ceiling. At the observation rung, tender points are not nothing:
    Hubbard & Berkoff 1993 found a millimeter-scale island of spontaneous
    electrical activity absent in adjacent muscle, McNulty 1994 showed a purely
    cognitive stressor selectively amplifying that signal, and Shah's
    microdialysis plus the Mazza imaging review show tender sites are chemically
    and mechanically distinct. This genuinely pressures a naive \"scar/damaged
    tissue\" account: something electrically alive, mentally responsive, and
    chemically inflamed is there. Against this floor stands a serious
    measurement problem — Lucas 2009 and Quintner 2015 undermine the construct's
    diagnostics, and E012 corrects the essay's own overstatement that skeptics
    concede the palpable spots — so even the phenomenon layer is softer than the
    essay presents it. The mechanism layer is where the case fails to carry its
    headline. The latch-bridge is real physiology, but the project's own
    frozen-criteria evidence map (VASO-S001) found it demonstrated only in large
    conduit preparations, never energetically measured in any arteriole, absent
    one branch order downstream in the single paired comparison, and —
    critically — the three pressurized skeletal-muscle arteriole studies that do
    exist with the right molecular readout show maintained activation via
    Rho-kinase Ca2+ sensitization, not an economical dephosphorylated hold.
    Persistence after stimulus withdrawal, which a chronic knot requires, has
    never been measured at any caliber. The critical report's grade-D audit
    independently confirms both linchpins are unrun experiments, not
    demonstrated mechanisms. The upper synthesis — vascular state as memory,
    clinging as latch — rests entirely on self-published theory; hysteresis is
    not yet a write–store–read register, and the read path, while now
    mechanistically real (Salameh 2024), demonstrates modulation, not storage.
    The steelman for proponents is real and recorded below; but on this record
    the honest verdict is that the featured hypothesis borrows a mechanism from
    the right science in the wrong vessel class, and its two decisive steps are
    clean, runnable, currently-unanswered experiments."
  steelman: McNulty 1994 demonstrated that a purely cognitive stressor, with no
    movement and no generalized tensing, selectively increased electrical
    activity inside a single tender point while control sites a centimeter away
    in the same muscle stayed quiet — combined with Hubbard & Berkoff's
    millimeter-confined nidus signal and first-person reports of seconds-scale
    breath-locked release, this is a discretely addressable, mentally writable,
    seconds-erasable locus that no structural-lesion account, and no
    diffuse-guarding account, explains; no evidence record in this ledger rebuts
    that selectivity, and the keystone imaging study that would test it has
    never been run.
