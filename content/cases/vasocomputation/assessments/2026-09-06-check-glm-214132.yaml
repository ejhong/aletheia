  synthesis: "The case has a sound base and an unevidenced top. The observation
    rung is real but softer than the featured essay presents it: tender points
    and their instrumented abnormalities (VASO-C002, VASO-C005) have genuine
    measurements behind them, but the EMG line is one laboratory lineage from
    1993-1994, never replicated with modern instrumentation, and the palpation
    that locates the object in every study lacks demonstrated reliability
    (VASO-C030, Lucas 2009) — and the critical report (VASO-E012) corrects the
    essay's claim that only the mechanism is disputed. The middle rungs are
    solid as component claims: the latch-bridge is textbook physiology
    (VASO-C010), hemodynamic modulation of neurons now has direct causal
    evidence (Salameh 2024 under VASO-C012), and slow breathing genuinely shifts
    autonomic balance (VASO-C013). But the assembly is the problem. Study
    VASO-S001 shows the latch phenotype has never been demonstrated in the
    compartment VASO-C020 names, that the nearest available measurements —
    pressurized skeletal-muscle arterioles with LC20 phosphorylation readouts —
    show maintained activation rather than an economical dephosphorylated hold,
    that latch behaviour is not even generic across vessel types, and that
    persistence after stimulus withdrawal is untested at every caliber. The
    critical report's grade-D audit independently finds no direct evidence for
    either linchpin. The memory claim (VASO-C021) additionally lacks any
    write-store-read demonstration; hysteresis is not content-addressable
    storage. The steelman side: something dynamic, centrally coupled, and
    reversible is genuinely present — a purely cognitive stressor selectively
    turning up activity at one tender point and not a centimeter away
    (VASO-C003) is hard to square with scar, and Mizrachi 2026 proves attention
    can regulate a specific peripheral vascular bed. Weighing this, the honest
    verdict for the featured hypothesis is weakly_supported: state, not scar, is
    plausible and partially evidenced; latch-bridge vasocomputation is currently
    an extrapolation across vessel class, caliber, and timescale. Sensitivity:
    the record whose removal would most change the assessment is VASO-E020 (the
    arteriole phosphorylation mismatch) — without it the case would read as
    merely unexamined rather than in tension with its nearest evidence, but the
    weakly_supported verdict survives, since VASO-E016, E019, and E021
    independently carry the undermining. The keystone experiments (VASO-R001,
    R004, R005) are well designed and would decide the case; none has been run."
  steelman: 'The strongest unanswerable argument for the featured hypothesis is
    the McNulty 1994 selectivity result: a purely cognitive stressor, involving
    no movement, measurably increased electrical activity inside a
    millimeter-scale tender point while adjacent control sites in the same
    muscle stayed quiet. A structural lesion cannot respond to mental
    arithmetic; a dynamically maintained, centrally coupled state can — and no
