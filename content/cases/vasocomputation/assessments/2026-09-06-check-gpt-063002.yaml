  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The cited study reports sustained spontaneous needle-EMG activity in
      the 1–2 mm nominated nidus of every studied trigger point and none at
      adjacent non-tender sites, directly supporting the stated measurement
      within that sample. The strongest opposing consideration is that this was
      a small 1993 study from one laboratory, without modern independent
      replication, and trigger-point localization itself is methodologically
      disputed. The result also identifies skeletal-muscle electrical activity,
      not its generator and not a vascular latch.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: In the supplied n=14 study, mental arithmetic increased needle-EMG
      activity at nominated trigger points while nearby sites remained
      comparatively quiet and generalized muscle tensing was not observed. This
      directly supports the local stress-responsivity claim in that experiment.
      The strongest opposing consideration is that it comes from the same
      research lineage as VASO-C002, has not been independently replicated with
      modern instrumentation, and measured no vascular endpoint.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: The sole record is a proponent's first-person and practitioner report
      that pressure combined with a long exhalation produces a felt release
      within seconds. Because the claim concerns a felt event, the testimony is
      relevant, but it does not establish reproducibility, timing, anatomical
      change, or the separate contributions of pressure and breathing. The
      strongest opposing consideration is that expectation, attention, altered
      pain appraisal, probe movement, or generalized relaxation could all
      produce the reported sensation without local tissue release.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Small microdialysis studies report an acidic, mediator-rich
      environment associated with active trigger points, and the imaging review
      reports distinguishable biomechanical and blood-flow parameters. These
      records collectively support measurable tissue differences across the
      three stated domains. The strongest opposing consideration is
      heterogeneous trigger-point definitions and methods, second-hand
      characterization of the imaging review, and biochemical elevations both
      near and remote from nominated points. The findings therefore do not
      establish a uniquely localized lesion or identify vascular latching as
      their cause.
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Preregistered within-subject experiments in 57 volunteers across two
      cohorts found smaller and faster-resolving histamine wheal-and-flare
      responses under internal attention than distraction, closely matching the
      principal measurement claim. Several arousal-related measures did not
      differ, and the lidocaine manipulation supported both sensory and top-down
      contributions. The strongest opposing consideration is that this is one
      very recent laboratory's acute healthy-skin model, while unchanged proxies
      do not prove the complete absence of sympathetic change and HRV itself
      differed between conditions.
