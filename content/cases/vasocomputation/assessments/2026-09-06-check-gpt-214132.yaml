      provides no evidence for site-specific vascular unlatching.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: A systematic review concluded that manual trigger-point examination
      had not demonstrated adequate reliability or validity and lacked an
      accepted reference standard, while a peer-reviewed critique and rebuttal
      establish that the construct is actively contested. The strongest opposing
      consideration is that these findings concern manual diagnosis and the
      classic construct, not whether instrumented imaging can detect genuine
      local abnormalities. The claim accurately states a methodological
      limitation and controversy rather than claiming that tender phenomena do
      not exist.
  - claimId: VASO-C001
