      evidence's narrow scope: rapid central mechanosensation does not establish
      peripheral tender-point signaling, persistent storage, or content-specific
      neural readout."
  - claimId: VASO-C013
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The systematic review reports reproducible changes in respiratory
