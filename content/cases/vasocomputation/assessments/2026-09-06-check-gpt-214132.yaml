  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Small microdialysis studies report an acidic, mediator-rich milieu,
      while the characterized imaging review reports biomechanical and
      blood-flow differences between trigger-point and healthy tissue. The
      strongest opposing consideration is heterogeneity in definitions and
      imaging methods, unreliable localization, and the fact that biochemical
      elevations also occurred remote from the active points. The systematic
      review characterization is also second-hand within this record, so the
      conjunction of biochemical, stiffness, and flow differences remains
      provisional.
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: A preregistered within-subject study across two cohorts directly
      reported smaller and faster-resolving histamine wheal-and-flare responses
      during attention to the affected site, without differences in several
      sympathetic-arousal proxies. The strongest opposing consideration is that
      this is a very recent single-laboratory result in acute healthy skin, with
      no independent replication and no direct measurement of the proposed
      molecular mediators. Higher heart-rate variability also indicates
      autonomic involvement, so “without change in sympathetic arousal” is
      supported only through the measured proxies rather than exhaustive
