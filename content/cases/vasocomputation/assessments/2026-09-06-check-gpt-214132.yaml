      economically as activation declines. The strongest opposing consideration
      is lack of generality: latch behavior differed across vessel types,
      arteriole energetics were not measured, and persistence after complete
      stimulus withdrawal was not tested at vessel level. Thus the capability
      claim is well supported, but it cannot be generalized to every vascular
      bed or to skeletal-muscle microvessels."
  - claimId: VASO-C011
