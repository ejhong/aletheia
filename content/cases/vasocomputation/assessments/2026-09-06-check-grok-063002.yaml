  synthesis: >-
    The featured hypothesis is a multi-storey stack: (1) tender points are real
    local phenomena; (2) they are actively maintained physiological states
    rather than structural scars; (3) the holding element is microvascular
    smooth muscle locked in the latch-bridge state, producing ischemia and
    nociceptor sensitization with secondary skeletal guarding; (4) vascular
    tension thereby functions as content-bearing memory participating in
    prediction, expectation, and contemplative clinging. The supplied record
    supports pieces of the lower storeys and does not support the assembly.

    Latch-bridge physiology is real as a capability in vascular smooth muscle
    (Hai & Murphy kinetic model; conduit-artery economy measurements), so
    VASO-C010 stands. Hemo-neural modulation is no longer merely speculative:
    Moore & Cao stated the hypothesis, and Salameh et al. 2024 demonstrated
    blood-pressure pulsations modulating central neurons via mechanosensitive
    channels, supporting a weak read path (VASO-C012). Slow breathing shifts
    global autonomic balance toward parasympathetic dominance (Zaccaro review;
    VASO-C013). Voluntary interoceptive attention can regulate an acute
    peripheral inflammatory response without arousal change (Mizrachi 2026;
    VASO-C006). Instrumented differences at sites labeled trigger
    points—spontaneous nidus EMG, stressor-selective EMG increase, acidic
    mediator-rich milieu, and imaging distinctions in stiffness and flow—are
    present in the record, though mostly old, small, single-lineage, or
    heterogeneous (C002, C003, C005). The methodological critique of manual
    trigger-point diagnosis is well founded (Lucas; Quintner; C030), which
    softens every claim that locates its object by palpation.

    What the record does not contain is any direct observation that a tender
    point is held by latched microvascular smooth muscle, that an objective
    seconds-scale release is vascular, or that vascular state stores
    discriminable mental content. The critical report’s grade-D audit (E016)
    correctly flags both linchpins as unevidenced. Study VASO-S001 goes further:
    energetic economy has never been measured in any arteriole (E019);
    pressurized skeletal-muscle arterioles show maintained or rising LC20
    phosphorylation with maintained constriction rather than the
    dephosphorylated hold the latch story needs (E020); and latch behaviour is
    already non-generic one branch order downstream of a parent artery, with no
    extension of that comparison into the microcirculation (E021). Persistence
    after stimulus withdrawal is untested at every vessel caliber in the
    collected table. Felt release under pressure-plus-exhale remains
    first-person proponent testimony (E014). Contemplative knot maps have not
    been blinded-coded against vascular anatomy (C022). Johnson’s
    vasocomputation program is a self-published theoretical frame without
    published experimental validation (E013), and hysteresis is not yet
    write–store–read memory (E017).

    Steelmanning the affirmative: discrete electrically active tender islands
    that respond to pure cognitive load, sit in an ischemic-inflammatory milieu,
    and are widely reported to yield under combined pressure and long exhale
    form a coherent pattern that “scar” and purely endplate-noise accounts do
    not fully digest, and biology does ship a cheap history-dependent hold in
    some smooth muscle. Steelmanning the negative: every load-bearing empirical
    step that would make knots latched microvessels—and that would make those
    latches mental memory—is either missing, extrapolated from the wrong
    caliber, or actively mismatched by the nearest arteriole phosphorylation
    data. Consensus and outsider status are irrelevant; mechanisms and
    measurements are what count, and they currently stop short of the featured
    attribution.

    Case verdict is therefore weakly_supported: lower mechanistic ingredients
    and some local abnormalities are real enough to keep the hypothesis alive as
    a research program, but the specific claim that muscle knots are latched
    vascular-autonomic memory elements is an extrapolation without a positive
    demonstration at the named site, and is partly strained by VASO-S001’s
    arteriole findings. Sensitivity: the single most load-bearing record is
    VASO-E020 (pressurized skeletal-muscle arterioles track maintained
    activation, not latch). Removing it would soften the mechanistic mismatch
    and push the case toward unresolved rather than weakly_supported; the
    verdict does not fully survive unchanged without it, because E016/E019 alone
    leave a pure gap, whereas E020 supplies a directional tension against the
    latch reading in the target compartment. Even without E020, however, the
    absence of any direct latch-at-tender-point or objective breath-locked
    vascular release demonstration would still prevent provisionally_supported
    or higher.
  steelman: McNulty 1994’s selective millimeter-scale EMG rise inside tender
    points under pure mental arithmetic, combined with widespread practitioner
    reports of pressure-plus-long-exhale release in seconds and Shah’s
    ischemic-inflammatory milieu, jointly specify a local, autonomically gated,
    addressable hold whose predicted stiffness-drop/perfusion-rise coupling
    time-locked to exhalation has simply never been imaged—leaving a concrete,
    still-unfalsified empirical signature a proponent can rightly demand be run
    before the vascular-latch reading is retired.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: high
    reasoning: The claim asserts that vascular smooth-muscle tension implements
      predictions, held expectations, and contemplative clinging as a memory
      element. The record supplies only Johnson’s self-published theoretical
      program (E013) and the critical report’s demonstration that latch
      hysteresis has not been shown to meet write–store–read memory criteria
      (E017); Moore/Cao and Salameh support modulation, not content-bearing
      storage. Strongest opposing consideration is that weak hemo-neural
      coupling plus real latch physiology make the strong claim conceivable, but
      conceivability without a single discriminable neural-trace readout is not
      evidence.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: Indirect observations—nidus EMG, stressor-selective activity,
      biochemical and imaging distinctions, and the logical force of rapid
      release if objective—favor actively maintained state over scar, and
      secondary skeletal guarding remains compatible. Direct evidence that the
      holding element is microvascular smooth muscle in latch is absent (E016
      grade D), energetic economy is unmeasured in arterioles (E019), and
      pressurized skeletal-muscle arterioles show maintained activation rather
      than dephosphorylated latch (E020). Strongest opposing consideration is
      that “state not scar” could still be true under a non-latch vascular or
      spindle/endplate mechanism even if the named latch stack fails.
  - claimId: VASO-C022
    verdict: presently_untestable
    confidence: moderate
    reasoning: The claim equates Tibetan rtsa mdud, Hindu granthis, and Chinese ashi
      points with first-person maps of the same vascular-autonomic system. No
      evidence record in the case performs blinded anatomical coding or spatial
      alignment tests against vascular branch points or related structures; R006
      remains unrun. Strongest opposing consideration is broad cross-traditional
      convergence on knot-like bodily loci, which is historically real but does
      not identify mechanism without the preregistered mapping the research
      agenda itself requests.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: "Hai & Murphy’s latch-bridge model and multiple conduit-artery
      preparations document high sustained stress at low phosphorylation or low
      energetic cost after activation declines, so the capability as stated
      (“can maintain”) is textbook. VASO-S001 qualifies rather than erases this:
      latch is not generic across vessel phenotypes (femoral vs saphenous), and
      arteriole energetics are unmeasured (E021, E019). Strongest opposing
      consideration is phenotype dependence and the untested
      withdrawal-persistence gap, which limit extrapolation but do not negate
      the demonstrated capability in tonic vascular smooth muscle."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "As a conditional inference—if objective release occurs within
      seconds, the entity released is an actively maintained state rather than
      remodeled scar—the claim is mechanistically sound: connective-tissue
      remodeling does not reverse on a seconds timescale. The antecedent remains
      unestablished objectively; E014 is first-person only and E016 finds no
      synchronized imaging of seconds-scale release. Strongest opposing
      consideration is that a felt release could be attentional,
      reciprocal-inhibition, or sensory gating without any local structural or
      vascular state change."
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Moore & Cao 2008 define the hemo-neural hypothesis without new
      experiment (E004); Salameh et al. 2024 supply direct causal evidence that
      physiological blood-pressure pulsations modulate central neuronal activity
      via mechanosensitive channels (E005). That supports local
      hemodynamic-to-neural modulation on fast timescales. Strongest opposing
      consideration is scope: the demonstration is rat brain mechanosensation,
      not human peripheral storage or content-specific readout at tender points,
      so the claim’s broad wording outruns the site and function shown."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: Zaccaro et al. 2018 systematically review slow-breathing studies in
      healthy humans and find reproducible increases in RSA/HRV and related
      autonomic and CNS changes consistent with parasympathetic shift (E009).
      The claim as stated is about global autonomic balance, which the review
      supports. Strongest opposing consideration is that global indices do not
      establish local, site-specific unlatching at tender points—the further
      inference the featured hypothesis needs and the record does not provide.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: Lucas et al. 2009 conclude manual trigger-point examination lacks
      demonstrated reliability and a validated reference standard (E011);
      Quintner et al. 2015 argue the construct rests on circular reasoning and
      unproven lesion assumptions (E010). Together they substantiate the
      methodological claim. Strongest opposing consideration is the Dommerholt &
      Gerwin rebuttal and the possibility that imaging-anchored localization
      could escape pure palpation failure; the debate is open on mechanism
      alternatives but not on the reliability deficit of manual identification.
  - claimId: VASO-C001
    verdict: mixed
    confidence: moderate
    reasoning: Clinical and practitioner sources treat discrete exquisitely tender
      palpable points as commonplace, and fibromyalgia-era tender-point counts
      are cited second-hand (E015), but E012 and the Lucas/Quintner line
      document that skeptics contest not only mechanism but the reproducibility
      and ontological status of the discrete spots themselves. Unverified
      community medians cannot carry weight. Strongest opposing consideration is
      ordinary clinical ubiquity under foam-roller and palpation practice, which
      may reflect real tenderness heterogeneity even if classic “trigger point”
      packaging fails reliability tests.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Hubbard & Berkoff 1993 reported sustained spontaneous needle-EMG
      activity in a 1–2 mm trapezius trigger-point nidus and none in adjacent
      non-tender fibers (E001). That supports electrically maintained local
      activity as stated. Limitations are decisive for confidence: small sample,
      single lab/era, and a still-contested generator (spindle vs endplate),
      with no vascular endpoint. Strongest opposing consideration is that
      endplate noise or intrafusal activity can explain the signal without any
      vascular latch or storage interpretation."
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: McNulty et al. 1994 found mental arithmetic increased EMG at trigger
      points while adjacent control sites stayed comparatively quiet (E002),
      matching the claim’s selective cognitive modulation. It is the same
      research lineage as Hubbard & Berkoff, n=14, never modernly replicated in
      this record, and without vascular measurement. Strongest opposing
      consideration is sympathetic drive to spindles or endplates under stress,
      which fits the data without vascular memory or a write path into
      smooth-muscle latch.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: The only direct record is first-person and practitioner testimony
      from the proponent essay that pressure plus slow exhalation yields felt
      release within seconds (E014). No synchronized objective stiffness,
      perfusion, or EMG transition time-locked to exhale appears in the ledger
      (E016). Strongest opposing consideration is that expectation, attention,
      and global relaxation readily produce felt “releases” without any local
      state change, so phenomenology alone cannot establish the observation as a
      physiological event.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Shah et al. 2008 found elevated pain/inflammation mediators in a more
      acidic milieu at active trigger-point sites (and remotely) (E006); Mazza
      et al. 2021, as audited, reports biomechanical and blood-flow imaging
      parameters distinguishing active/latent points from healthy tissue with
      reproducibility caveats (E007). Together they support measurable local
      differences. Strongest opposing consideration is small samples, non-local
      mediator elevation, heterogeneous TP definitions, and that
      guarding-induced compression predicts a similar milieu without latch.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: moderate
    reasoning: "Mizrachi et al. 2026 report preregistered within-subject experiments
      (57 volunteers) in which attention toward a histamine skin-prick site
      produced ~1.5-fold smaller, faster-resolving wheal/flare than distraction
      without sympathetic-arousal differences, with sensory and top-down vagal
      contributions (E008). That matches the claim as stated. Strongest opposing
      consideration is narrow scope: acute healthy-skin model, single lab, very
      recent, not trigger points or smooth-muscle latches, and authors note skin
      lacks direct parasympathetic innervation—so the channel is real but not
      the knot mechanism."
