  synthesis: "The supplied record separates cleanly into supported component
    mechanisms, contested or weakly anchored observations of the tender-point
    phenomenon, and an unevidenced assembly of those pieces into the featured
    hypothesis that knots are microvascular latch states carrying mental
    content. Latch-bridge force maintenance at low energetic cost is a real
    capability of some vascular smooth muscle (Hai-Murphy kinetics and
    conduit-artery energetics), local hemodynamics can modulate nearby neurons
    (Moore-Cao proposal plus Salameh mechanosensitive demonstration), slow
    breathing shifts autonomic balance, and voluntary attention can regulate
    peripheral inflammatory responses without arousal change. These lower-rung
    facts are not in serious dispute on the ledger. At the observation layer,
    Hubbard-Berkoff/McNulty EMG shows sustained, stress-modulated electrical
    activity confined to a millimeter nidus, Shah microdialysis and the Mazza
    imaging review show biochemical, stiffness and flow differences at sites
    labeled active trigger points, and first-person reports describe
    seconds-scale felt release under pressure-plus-exhale. Yet the same ledger
    records that manual localization lacks reliability and a reference standard
    (Lucas, Quintner), that even the ontological status of discrete palpable
    spots is contested rather than conceded, and that the two EMG studies form a
    single unreplicated 1990s lineage with no vascular endpoints. The decisive
    gap is the middle and upper floors. No record identifies smooth-muscle
    latch, dephosphorylated hold, or input-free persistence inside a tender
    point; the critical-report matrix grades both “objective seconds release”
    and “releasing element is vascular smooth muscle” as D (no direct evidence).
    Study VASO-S001 then shows the borrowed mechanism is an extrapolation:
    energetic economy has never been measured in any arteriole, pressurized
    skeletal-muscle arterioles exhibit maintained or rising LC20 phosphorylation
    rather than the latch signature of force held while activation falls, and
    the one paired conduit comparison found latch present in femoral artery but
    absent one branch order downstream in saphenous, with no further extension
    into the microcirculation. Persistence after stimulus withdrawal is untested
    at every caliber. Consequently the positive identification of knots as
    latched microvascular states fails; conventional explanations (endplate
    noise, spindle drive, local guarding ischemia, neurogenic inflammation)
    remain compatible with every positive observation. The still-stronger claim
    that vascular tension implements predictions, expectations and contemplative
    clinging has no write-store-read demonstration in mammalian tissue and is
    explicitly marked by the critical report as hysteresis that is not yet
    memory. Contemplative channel-knot maps are offered as convergent
    first-person cartography but rest on untested anatomical correspondence. The
    overall hypothesis is therefore unresolved: its component physiological
    facts are largely real, the clinical phenomenon is real enough to generate
    instrumented differences, yet the specific vascular-latch-plus-memory
    architecture that would unify them has neither direct positive evidence nor
    a successful extrapolation from the vessel classes where latch is actually
    observed. Decisive experiments (keystone imaging of release, paired-caliber
    latch test with withdrawal, write-store-read vascular trace) remain unrun;
    until they return, the ledger cannot move past unresolved."
  steelman: The widely reported two-key phenomenology—pressure locates but does
    not release, while sustained pressure timed to a long exhale produces a
    discrete felt letting-go within seconds, fresher sites faster than chronic
    ones—together with selective EMG rise under pure cognitive load at the
    identical nidus, remains an unexplained, internally consistent pattern that
    no competing account (endplate noise, simple guarding, or neurogenic
    inflammation) has yet reproduced under controlled conditions, and that the
    latch-plus-autonomic-lever model uniquely predicts in advance of the
    still-unrun keystone imaging study.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: The claim asserts that vascular smooth-muscle tension stores and
      participates in mental content (predictions, clinging). The only direct
      sources are the self-published theoretical statements of Johnson and the
      case essay; E017 correctly notes that latch hysteresis fails the
      discrimination and readout criteria of biological memory, and the nearest
      genuine flow-network memory is in Physarum, not mammals. Strongest
      opposing consideration is that weak hemo-neural modulation (C012) is now
      plausible, yet that is far short of content-addressable vascular memory.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: The claim identifies knots as microvascular smooth muscle held in
      latch-bridge, producing ischemia and sensitization plus secondary
      guarding. E016 grades both linchpins (objective seconds-scale release and
      vascular identity of the releasable element) D—no direct evidence;
      E019–E021 show the latch phenotype and its economy have never been
      demonstrated in skeletal-muscle arterioles, where existing phosphorylation
      data instead show maintained activation. Strongest opposing consideration
      is that rapid felt change and local biochemical/flow differences are real
