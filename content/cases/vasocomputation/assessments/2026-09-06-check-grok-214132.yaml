  - claimId: VASO-C022
    verdict: presently_untestable
    confidence: high
    reasoning: No coded, blinded anatomical correspondence between traditional
      rtsa-mdud/granthi/ashi maps and modern vascular or autonomic landmarks
      appears in the record; R006 remains unrun. The claim is therefore an
      untested interpretive assertion of identity. Strongest opposing
      consideration is the phenomenological similarity noted by practitioners,
      which is insufficient without the preregistered spatial test.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: Hai & Murphy 1988 and the conduit-artery energetics rows of S001
      establish that some vascular smooth muscle can maintain force at low
      phosphorylation/ATP cost after activation declines. E021 qualifies that
      the behavior is not generic (absent in the paired saphenous branch) and
      has not been shown in arterioles, yet the claim is only a capability
      statement (“can”), which holds. Strongest opposing consideration is the
      vessel-type and caliber restriction now documented by S001.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The conditional is logically sound: tissue remodeling on structural
      timescales cannot reverse in seconds, so an objectively rapid release
      implies an actively maintained state. It inherits the weakness of C004
      (felt, not instrumented release) and therefore remains provisional until
      the keystone design is run. Strongest opposing consideration is that
      subjective “release” can be produced by sensory or attentional change
      without any local mechanical transition."
  - claimId: VASO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: Moore & Cao 2008 state the hypothesis; Salameh 2024 supplies direct
      causal evidence that blood-pressure pulsations modulate central neurons
      via mechanosensitive channels on rapid timescales. The claim is only that
      local vascular/hemodynamic state can modulate nearby neurons, which is now
      demonstrated, albeit in rat brain rather than human periphery and without
      storage. Strongest opposing consideration is the anatomical and functional
      distance from peripheral tender-point microvessels.
  - claimId: VASO-C013
    verdict: established
    confidence: high
    reasoning: Zaccaro et al. 2018 systematic review documents reproducible
      increases in RSA/HRV and related autonomic shifts with slow breathing in
      healthy humans. The claim is limited to global autonomic balance and does
      not assert local unlatching. Strongest opposing consideration is the
      absence of any tender-point or local-perfusion endpoint in the reviewed
      literature.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: Lucas 2009 and Quintner et al. 2015 supply the peer-reviewed case
      that manual trigger-point examination lacks demonstrated reliability and a
      reference standard and that the classic construct is circular; the
      Dommerholt-Gerwin reply keeps the debate open but does not erase the
      methodological deficit. Strongest opposing consideration is that
      instrumented (imaging/EMG) differences may still track a real local
      phenomenon even if palpation is noisy.
  - claimId: VASO-C001
    verdict: mixed
    confidence: moderate
    reasoning: Tender points are commonly reported and community fibromyalgia-era
      counts exist as second-hand characterization, yet E012 and the reliability
      literature (C030) establish that the discreteness, palpability and
      inter-examiner reproducibility of the spots themselves remain contested.
      Strongest opposing consideration is everyday clinical and self-palpation
      experience, which is real but unquantified by any proper census.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Hubbard & Berkoff 1993 report sustained spontaneous needle-EMG
      activity confined to a 1–2 mm nidus and absent from adjacent non-tender
      fibers. The study is old, small, single-lab, and the generator (endplate
      vs spindle) remains disputed; no vascular measurement was made. Strongest
      opposing consideration is the subsequent literature favoring endplate
      potentials, which still leaves an electrically active nidus but weakens
      the original sympathetic-spindle reading.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: McNulty et al. 1994 (same lineage, n=14) show mental arithmetic
      selectively raising EMG at the trigger-point electrode while adjacent
      control sites stay quiet. The result is intriguing for a “write” process
      but unreplicated with modern methods and lacks any vascular endpoint.
      Strongest opposing consideration is that selective alpha-motor or spindle
      drive under stress explains the data without invoking vascular storage.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: The sole record is first-person and practitioner testimony (E014)
      from the proponent essay; E016 confirms no synchronized objective imaging
      of a seconds-scale mechanical or perfusion transition exists. Felt change
      is widely attested yet fully compatible with expectation, attention, or
      sensory gating. Strongest opposing consideration is the internal
      consistency of the two-key (pressure + exhale) report across
      practitioners, which still awaits instrumentation.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Shah 2008 microdialysis shows elevated acidic, mediator-rich milieu
      at active sites (also remote), and the Mazza 2021 review (via
      critical-report audit) finds biomechanical and blood-flow imaging
      parameters that distinguish labeled trigger points from control tissue,
      with reproducibility caveats. Samples are small and definitions
      heterogeneous. Strongest opposing consideration is that guarding-induced
      compression or neurogenic inflammation produce the same chemical and flow
      signatures without a latch.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: high
    reasoning: Mizrachi et al. 2026 preregistered within-subject experiments (n=57)
      demonstrate that directing attention to a histamine wheal produces
      ~1.5-fold smaller, faster-resolving responses than distraction, without
      sympathetic-arousal differences, via sensory and vagal routes. The result
      is an existence proof of top-down site-specific peripheral regulation.
      Strongest opposing consideration is that the model is acute healthy skin
      over tens of minutes, not chronic muscle latch on seconds timescales.
