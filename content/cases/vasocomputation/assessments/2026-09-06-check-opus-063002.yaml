  synthesis: "The case has a well-built floor, an unmeasured middle, and a
    speculative attic, and the record supplied here documents that structure
    honestly. The floor — that vascular smooth muscle can hold force
    economically as intracellular activation declines (VASO-C010), that
    hemodynamic state can modulate nearby neurons (VASO-C012), that slow
    breathing shifts global autonomic balance (VASO-C013), and that voluntary
    attention can regulate a local peripheral response without sympathetic
    arousal change (VASO-C006) — is genuinely supported, in three of four
    instances by peer-reviewed primary measurement rather than by proponent
    assertion. The attic — that vascular tension implements clinging and stores
    mental content (VASO-C021), and that Tibetan, Hindu and Chinese knot
    anatomies map the same system (VASO-C022) — has no supporting evidence
    record at all; E013 is the originator's own unrefereed program and E017
    correctly notes that hysteresis is not memory absent a demonstrated
    write–store–read loop. The decisive question is the middle floor, VASO-C020.
    Two things count against it, and they are different in kind. E016 records
    that neither linchpin (objective seconds-scale release; a vascular identity
    for the released element) has any located direct evidence — an absence,
    appropriately hedged as one search rather than a systematic review.
    E019/E020, from the frozen study, are stronger: the compartment the
    hypothesis names has been examined with the right molecular readout, and
    pressurized rat cremaster and gracilis arterioles show maintained
    constriction accompanied by maintained or rising LC20 phosphorylation, with
    Rho-kinase Ca2+ sensitisation and actin polymerisation as the authors'
    proposed holding mechanism. E021 adds that latch behaviour is not generic —
    present in rabbit femoral, absent one branch order downstream. So the
    mechanism is not merely unobserved where the hypothesis needs it; the
    nearest available measurements point at a different mechanism for holding
    constriction, and no study at any caliber has withdrawn the stimulus and
    watched. Against this, the phenomenon rung retains real content: discrete
    electrically active nidi (E001), a purely cognitive stressor raising
    activity at the point but not a centimetre away (E002), an acidic
    mediator-rich milieu (E006), and imaging-distinguishable stiffness and flow
    (E007). None of these is vascular measurement, and all of them are located
    by a palpation exam that E011 shows is not demonstrably reliable — a
    measurement problem that degrades supporters and critics alike. \"State, not
    scar\" is the defensible half of the hypothesis; \"latch-bridge in the
    microvasculature\" is the half that is currently borrowed rather than
    observed, and mildly disfavoured where it has been looked for. Hence
    weakly_supported rather than mixed or unresolved. Sensitivity: the single
    record whose removal would most change the verdict is VASO-E020, the
    pressurized skeletal-muscle arteriole finding — it is the only record
    bearing directly on the named compartment and the only affirmative negative
    signal. Without it the verdict would move toward unresolved rather than
    upward, because E019 (no arteriole energetics anywhere) and E016 (no direct
    evidence for either linchpin) independently keep the mechanism unevidenced.
    The verdict survives its removal, but its directionality does not."
  steelman: "The McNulty result stands unexplained by anything in this record: a
    purely cognitive event, with no movement and no generalised tensing,
    produced increased electrical activity confined to a millimetre-scale tender
    point while control sites in the same muscle stayed quiet. No conventional
    account offered here explains why a psychological input writes to a
    spatially specific, persistent site rather than to the muscle as a whole —
    nor why that site carries an acidic, bradykinin- and CGRP-rich milieu with
    abnormal Doppler flow, the exact signature chronic local ischaemia would
    produce. Mizrachi 2026 then shows the return path is real: voluntary
    interoceptive attention, without any change in sympathetic arousal,
    measurably altering vascular-bed physiology at a chosen site. A proponent
    can rightly say the loop's two halves have each been demonstrated
    separately, that the arteriole studies cited against him were myogenic-tone
    experiments that never withdrew the stimulus and so could not have detected
    input-free persistence even if it exists, and that the keystone experiment —
    synchronised elastography and Doppler across a single release event — has
    simply never been run."
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: No evidence record supports this claim directly; E013 is the
      originator's own unrefereed theoretical program and explicitly reports no
      experimental validation. E017 sets the right bar — memory requires state
      that depends on prior input, is later read out, and discriminates among
      prior inputs — and notes that the latch literature addresses none of
      these, with the closest write–store–read precedent coming from Physarum
      tube networks rather than any mammalian system. E005 makes the
      instantaneous read path plausible, which is a different and weaker
      proposition. The strongest opposing consideration to calling this merely
      unresolved rather than contradicted is that R005 specifies a clean
      falsifying design, so the claim is testable and simply untested; I note my
      prior that content-specific storage in smooth-muscle tone is a large ask
      relative to established synaptic and molecular memory substrates.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: 'The "actively maintained state rather than scar" half draws real
      support from E001 (sustained spontaneous activity in a 1–2 mm nidus absent
      adjacently), E006 (acidic mediator-rich milieu) and E007
      (imaging-distinguishable stiffness and flow), and no record here supports
      a structural-lesion alternative either. The vascular-latch specification,
      however, is the load-bearing half and is unevidenced: E016 grades it D,
      E019 finds no energetic measurement in any arteriole, and E020 — the only
      record touching the named compartment — reports maintained or rising LC20
      phosphorylation accompanying maintained arteriolar constriction, with the
      authors attributing the hold to Rho-kinase Ca2+ sensitisation and actin
      polymerisation. The strongest opposing consideration is that all three
      arteriole studies held their stimulus present throughout and none was
      designed as a latch test, so they are a mismatch rather than a refutation;
      a secondary guarding mechanism could also generate every observed
      biochemical and flow abnormality without any vascular latch.'
  - claimId: VASO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: Not one evidence record in the file bears on this claim; it enters as
      an interpretive assertion from the featured essay. The convergence
      argument is intrinsically vulnerable to post-hoc resemblance — traditional
      knot loci are numerous and loosely specified, and modern vascular,
      sympathetic and fascial landmarks are dense, so chance alignment is
      expected. R006's blinded pre-coding design is exactly the right test and
      has not been run. The strongest consideration in the claim's favour is
      that trained interoception plausibly does detect something real and
      reproducible across traditions; that possibility is what keeps this
      unresolved rather than contradicted.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: "The capability is documented across independent preparations in the
      study table: Dillon 1981's founding observation, Wingard 1994/1997
      energetics in swine carotid, Moreland 1987's stress held as
      phosphorylation and Vo fall, and Hammell 2022's molecular reconstitution
      showing force maintained through LC20 dephosphorylation, longer for tonic
      than phasic myosin. Hai & Murphy 1988 is a kinetic model and is correctly
      reclassified as such rather than counted as a demonstration. Two
      qualifications matter: E021 shows the behaviour is not generic — absent in
      rabbit saphenous, present in its parent femoral — and the claim's phrase
      \"after activating signals subside\" is true of intracellular activation
      but not of the external stimulus, which remained present in all thirteen
      vessel-level rows. The strongest opposing consideration is Fulginiti 1993,
      where a slowly-cycling high-stress state arose independent of both calcium
      and LC20 phosphorylation, showing the phenotype can be produced by a
      non-latch route."
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "As a conditional the inference is broadly sound: collagen
      remodelling, fibrosis or scar do not reverse on a seconds timescale, so a
      genuine objective seconds-scale change must be an actively maintained or
      reflexively released state. Two weaknesses keep it from stronger
      endorsement. First, passive viscoelastic phenomena — thixotropic softening
      under sustained load, fluid redistribution, tissue creep — could produce a
      rapid mechanical change that is neither scar nor an actively maintained
      physiological state, so the dichotomy in the claim is not exhaustive.
      Second, the antecedent is unestablished: E016 records no synchronised
      time-resolved imaging of any release event, and E014 is proponent
      testimony. The strongest opposing consideration is that even if the
      inference holds, it does not discriminate vascular smooth muscle from
      skeletal-muscle or neural state, so it carries less for VASO-C020 than the
      case framing implies."
  - claimId: VASO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: "E004 establishes only that the proposition was formulated as a
      hypothesis in 2008, but E005 supplies the demonstration: physiological
      blood-pressure pulsations modulating central neuronal activity through
      mechanosensitive ion channels in rat preparations and awake animals. That
      is direct causal evidence for the vascular-to-neural direction as stated.
      General background on mechanosensitive channels and neurovascular
      signalling makes this plausible independently, which I flag as
      prior-assisted. The strongest opposing consideration is that this rests on
      a single 2024 paper in rat brain, with no replication in the record and no
      evidence for peripheral tissue or for anything beyond instantaneous
      modulation — the claim as stated does not require more, but the hypothesis
      it feeds does."
  - claimId: VASO-C013
    verdict: well_supported
    confidence: moderate
    reasoning: "E009 is a systematic review reporting reproducible increases in
      respiratory sinus arrhythmia, HRV and related autonomic indices with slow
      breathing in healthy humans, and this aligns with well-established
      respiratory-gating physiology of vagal outflow. The claim as stated
      concerns global autonomic balance and is met. The strongest opposing
      consideration is interpretive rather than empirical: RSA and time-domain
      HRV are mechanically inflated by slow, deep breathing itself, so increased
      indices do not straightforwardly demonstrate increased tonic vagal drive —
      and nothing in the review speaks to local tissue effects, which is where
      the featured hypothesis needs the lever to act."
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: E011 (Lucas et al., a systematic review by a mainstream methodology
      group) directly supports both the reliability failure and the absence of
      an accepted reference standard, and E010 documents that the construct is
      contested in the peer-reviewed literature by named critics on grounds of
      circular reasoning and an undemonstrated lesion. The claim is deliberately
      modest — it asserts contestation and absent demonstrated reliability, not
      that trigger points are unreal — and the record meets it. The strongest
      opposing consideration is that Lucas is 2009 and Quintner was answered
      point by point by Dommerholt & Gerwin, so "contested" cuts both ways and
      later reliability work not in this record could have improved the picture;
      that would qualify the claim's currency, not its substance.
  - claimId: VASO-C001
    verdict: weakly_supported
    confidence: moderate
    reasoning: "Support is thin and largely proponent-sourced: E015 is the featured
      essay's own foam-roller observation plus second-hand fibromyalgia-era
      tender-point counts whose underlying survey the project could not locate,
      and the record explicitly warns those figures should carry no weight until
      traced. E012 imports the opposing correction — that the reproducibility
      and ontological status of discrete palpable spots, not merely their
      mechanism, are part of the academic debate — and E011 shows examiners do
      not reliably agree on where they are. What survives is that palpable
      tenderness is commonly elicitable, which is clinically uncontroversial but
      weaker than the claim's \"discrete... points.\" The strongest opposing
      consideration in the claim's favour is that its core is nearly universal
      practitioner and lay experience; the missing census, which R002 would
      supply, is the reason that experience cannot yet be graded higher."
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: low
    reasoning: E001 reports the finding cleanly — sustained spontaneous activity in
      the 1–2 mm nidus of all trigger points examined and none in adjacent
      non-tender fibres, with amplitude higher in patient groups — and the
      design's internal control (adjacent tissue in the same muscle) is its main
      strength. But it is a single small 1993 study from one lab, the sites were
      located by the very palpation exam E011 finds unreliable, and the source
      record notes the signal's generator remains contested. The strongest
      opposing consideration is that if the activity is extrafusal endplate
      noise, needle placement relative to the motor endplate zone rather than
      any trigger-point pathology could account for the near-perfect separation
      between test and control sites.
  - claimId: VASO-C003
    verdict: weakly_supported
    confidence: moderate
    reasoning: "E002 supports the claim as stated, and the within-muscle control
      makes the spatial selectivity striking. Its evidential weight is
      nonetheless low: n=14, 1994, and the same research lineage as E001, so the
      two should be counted as one line rather than two; the record also states
      it has never been replicated with modern instrumentation, and the essay's
      follow-on claims about relaxation training and phentolamine could not be
      traced to a primary citation. The strongest opposing consideration is that
      sympathetic drive to intrafusal fibres or motor endplates fully accounts
      for the observation with no vascular element whatever, so even taken at
      face value it does not discriminate the featured hypothesis from
      conventional guarding."
  - claimId: VASO-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: The claim is carefully worded around a felt release, and at that
      grain E014 plus widespread practitioner lore make it likely true as a
      description of experience. It is, however, testimony from the hypothesis's
      own proponent, in an essay whose text was AI-generated at his direction,
      and no instrumented measurement of any release event exists anywhere in
      the record (E016). The strongest opposing consideration is that
      expectation, attentional reallocation and ordinary pressure-induced
      analgesia can generate a compelling felt release with no local tissue
      transition at all — which is precisely the confound the R001 keystone
      design exists to remove, and until it is run this claim cannot bear
      structural weight.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Two independent-ish lines support it: E006's microdialysis finding
      of bradykinin, substance P and CGRP in a more acidic milieu at active
      points, and E007's systematic review of 33 imaging studies reporting that
      biomechanical and blood-flow parameters distinguish active and latent
      points from healthy tissue. Both carry substantial caveats — Shah had nine
      volunteers and, per its own title, found mediators elevated at remote
      sites too, which weakens the locality reading; and the E007
      characterisation is second-hand from the critical report with the review's
      full text unchecked and heterogeneous point definitions across included
      studies. The strongest opposing consideration is that every one of these
      measurements localises its target by an examination shown unreliable in
      E011, so the \"control tissue\" comparison may be noisier than reported."
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "E008 is the methodologically strongest record in the file:
      preregistered, within-subject, 57 volunteers across two cohorts, ~1.5-fold
      smaller and faster-resolving wheal and flare under internal attention in
      ~90% of participants, with skin conductance, heart rate, temperature and
      self-reported anxiety unchanged, and a lidocaine manipulation dissociating
      a sensory from a surviving top-down route. That directly matches the claim
      including its \"without change in sympathetic arousal\" qualifier.
      Restraint is warranted because it is one lab, published weeks before
      extraction, unreplicated, in an acute healthy-skin model, with molecular
      mediators not measured — the authors' own caution. The strongest opposing
      consideration is that higher HRV under internal attention means autonomic
      state was not fully matched between conditions, so \"without change in
      arousal\" holds for sympathetic indices but not for all autonomic
      variables."
