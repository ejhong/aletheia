  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: "As a capability statement about vascular smooth muscle, this is
      textbook: Hai and Murphy's kinetic model (VASO-E003), the Dillon 1981
      founding observation, the carotid energetics rows measuring economy
      directly, and the 2022 single-molecule reconstitution showing force
