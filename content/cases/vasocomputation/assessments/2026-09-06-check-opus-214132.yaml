  synthesis: "The case has a strong basement, an empty middle floor, and a
    speculative attic, and the record supplied here documents that shape with
    unusual honesty. The basement: the latch-bridge phenotype is real physiology
    (VASO-C010), slow breathing really is an autonomic lever (VASO-C013), and
    hemodynamic state really can modulate neurons on fast timescales (VASO-C012,
    with Salameh 2024 supplying the causal demonstration that Moore and Cao only
    hypothesised). Something measurably abnormal exists at palpated tender sites
    (VASO-C005, VASO-C002, VASO-C003), and attention can regulate peripheral
    physiology at a site without arousal change (VASO-C006). None of that is
    disputed here. The middle floor is the featured hypothesis itself,
    VASO-C020, and it is where the record turns against the case. VASO-E016
    records grade D — no direct evidence located — for both linchpins: that a
    point objectively releases in seconds, and that the released element is
    vascular smooth muscle. VASO-E019 shows the energetic economy argument has
    never been measured in any arteriole, only in conduit carotid preparations
    at zero transmural pressure. VASO-E020 is the sharpest record in the file:
    the tissue compartment the hypothesis names has in fact been examined with
    the right molecular readout, and pressurised skeletal-muscle arterioles show
    maintained or rising LC20 phosphorylation with sustained constriction —
    maintained activation, attributed by one group to Rho-kinase sensitisation
    and actin polymerisation, not an economical dephosphorylated hold. VASO-E021
    adds that latch behaviour is not even generic across vascular smooth muscle:
    it was present in a rabbit femoral artery and absent one branch order later.
    The mechanism is therefore an extrapolation across vessel class and caliber,
    and the nearest evidence points at a different mechanism. Three
    qualifications keep this from being a refutation. First, none of those
    arteriole studies withdrew the stimulus — the study's own fourth finding
    notes persistence after withdrawal is untested at every caliber, so the
    discriminating experiment does not exist. Second, myogenic tone is not the
    same object as a putative pathological knot. Third, the observation rung is
    itself soft: VASO-E011 and VASO-E012 establish that palpation localisation
    is unreliable and that even the discrete spot is contested, so most of the
    supporting measurements locate their object by an unvalidated method, and
    the two EMG studies are one 1990s lineage, never replicated with modern
    instrumentation. The attic — VASO-C021 and VASO-C022 — has no direct
    evidence at all; VASO-E017 correctly separates hysteresis from a
    write–store–read loop, and the contemplative-convergence claim has not even
    had its preregistered coding study run. Weakly supported is the honest
    roll-up: a coherent, testable, mechanistically literate proposal whose
    central empirical steps are unrun, with the one directly relevant published
    measurement pointing elsewhere."
  steelman: No conventional account on offer explains McNulty's core observation —
    a purely cognitive stressor raising electrical activity inside a
    millimetre-scale tender point while control fibres a centimetre away in the
    same muscle stay quiet, with no gross tensing — combined with the widely
    reported phenomenology that such a point yields in seconds, specifically on
    a long exhale, and not to pressure alone. Central sensitisation and skeletal
    guarding predict regional, not millimetre-scale, effects and give no reason
    why exhalation timing should gate release. Crucially, the strongest
    undermining record (VASO-E020) tests myogenic tone under a continuously
    maintained stimulus; every vessel-level row in VASO-S001 kept its stimulus
    present, so the exact prediction the hypothesis makes — force held after
    input stops, at arteriole caliber — has never been measured and remains
    unfalsified rather than falsified.
