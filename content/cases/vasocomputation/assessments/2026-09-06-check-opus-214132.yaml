  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "VASO-E008 describes preregistered within-subject experiments, 57
      volunteers, two cohorts, ~1.5-fold smaller and faster-resolving wheal and
