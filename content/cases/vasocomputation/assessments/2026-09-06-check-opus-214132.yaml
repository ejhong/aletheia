      conductance, heart rate, temperature and anxiety unchanged — matching the
      claim's \"without change in sympathetic arousal\" clause closely.
      Lidocaine dissection of sensory versus vagal routes strengthens the causal
      story. Against confidence: a single lab, published weeks before
      extraction, no independent replication, an acute healthy-skin model, and
      the authors' own caution that molecular mediators were not measured and
      that parasympathetic fibres do not innervate skin directly. Single-lab
      novel results of this kind have a substantial historical failure rate,
      which is the main reason I stop short of well_supported. Note this claim
      supports the case's attention channel, not its vascular latch."
