  synthesis: "The evidence directory is unchanged since the previous run, and the case retains its inverted ladder: the mechanism rung is stronger than either the observations beneath it or the attributions above it. Latch-bridge physiology is real (VASO-E003) and vascular-to-neural mechanosensation is demonstrated in animals (VASO-E005), but both are credible without being diagnostic — conventional physiology predicts them too. The anchor observation, a seconds-scale objective release of a tender point (VASO-C004), remains proponent testimony (VASO-E014), and VASO-E016 records that no time-resolved imaging of any release exists. Where the thesis needs the latch — arterioles — the published record points away from it: pressurized skeletal-muscle arterioles show maintained activation rather than an economical hold (VASO-E020), no arteriole energetic measurement exists (VASO-E019), and latch behaviour vanished one branch order downstream in the only paired comparison (VASO-E021). The observational base is itself softened by the trigger-point localization problem (VASO-E010, VASO-E011, VASO-E012), and the memory attribution fails the write–store–read test (VASO-E017). Sensitivity: the single most consequential record is VASO-E016; the verdict survives its removal as unresolved, because the arteriole-level records independently show the mechanism is extrapolated rather than observed, and no positive release measurement exists anywhere. This remains a research program awaiting its keystone experiments — neither supported nor refuted."
