      strongestObjection: "Hysteresis is not memory: a thermostat's state also depends on its history, but nothing reads it as content. Showing that vascular tone retains information is trivial; showing that neurons later read out that information in a task-relevant way has never been done, and every demonstrated vascular effect on neurons so far is instantaneous modulation, not stored content."
      whatWouldChangeOurMind:
