  synthesis: >-
    The "State, Not Scar" case attempts an ambitious multi-tiered synthesis
    connecting biophysical cross-bridge kinetics, local neurovascular coupling,
    clinical myofascial pain constructs, and contemplative practices into an
    integrated theory of "vasocomputation." Evaluating the evidentiary ledger
    structurally requires separating the validity of the modular components from
    the plausibility of the overarching hypothesis.

    On the supporting side, several foundational rungs are scientifically
    robust. Hai & Murphy (1988) definitively established the latch-bridge state
    as an economical force-maintenance mechanism in vascular smooth muscle. The
    hemo-neural hypothesis has graduated from theoretical speculation (Moore &
    Cao 2008) to causal proof in animal models, where pulsatile vascular forces
    directly drive neuronal firing via mechanosensitive channels (Salameh 2024).
    Furthermore, objective physical and biochemical abnormalities at trigger
    points are documented: active trigger points demonstrate focal stiffening on
    elastography, elevated inflammatory and algogenic neuropeptides on
    microdialysis (Shah 2008), and localized needle-EMG chatter that responds
    dynamically to cognitive stressors (Hubbard & Berkoff 1993, McNulty 1994).
    Finally, systemic autonomic modulation via slow breathing is undisputed
    (Zaccaro 2018), and interoceptive attention has been demonstrated to
    regulate localized inflammatory responses (Mizrachi 2026).

    However, the critical links that assemble these disparate observations into
    a coherent "latched arteriole" model of muscle knots and mental storage
    remain unproven and are actively challenged by the ledger's microvascular
    evidence. As documented in the critical audit (VASO-E016), there is zero
    direct empirical evidence that myofascial trigger points contain latched
    smooth muscle, nor has any synchronized, instrumented study demonstrated
    that a tender point objectively releases in seconds during exhalation.
    Crucially, the dedicated review of arteriolar mechanics (Study VASO-S001;
    VASO-E019, VASO-E020, VASO-E021) reveals severe physiological barriers:
    latch behavior is established primarily in large conduit arteries, whereas
    pressurized resistance arterioles in skeletal muscle maintain tone through
    sustained activation and myosin light-chain phosphorylation rather than
    dephosphorylated latch bridges. Additionally, Doppler abnormalities observed
    near trigger points (Ballyns 2011) interrogate vessels >1 mm rather than the
    microvasculature, and the findings are readily explained by extrinsic
    mechanical compression from skeletal muscle contracture or inflammation.

    Sensitivity analysis: The single evidence record whose removal would most
    alter this assessment is VASO-E020 (pressurized resistance arterioles
    maintain constriction via active phosphorylation rather than latch
    mechanics). Even without VASO-E020, the overall case verdict of
    weakly_supported survives intact, because the positive attribution of muscle
    knots to smooth-muscle latching (VASO-C020) and cognitive storage
    (VASO-C021) rests on Grade D absence of evidence, while the anchor
    phenomenological claim of seconds-scale objective release (VASO-C004)
    remains unsupported by instrumented data.
  steelman: The focal needle-EMG activation triggered selectively at a
    millimeter-scale nidus by mental arithmetic while adjacent muscle fibers
    remain silent, combined with localized retrograde diastolic flow and
    elevated pulsatility in neighboring vessels, provides an empirical
    demonstration of spatially discrete, cognitively gated neurovascular
    dysfunction that purely skeletal or structural models of muscle spasm cannot
    adequately explain.
claimAssessments:
  - claimId: VASO-C021
    verdict: weakly_supported
    reasoning: Extending vascular tone to a substrate for memory, prediction, and
      Buddhist concepts of clinging is purely theoretical and speculative. While
      Moore & Cao (2008) and Salameh (2024) show that hemodynamics modulate
      central neural firing, no empirical data demonstrate information storage
      or content readout in vascular smooth muscle. The strongest opposing
      consideration is that biological memory requires demonstrated input
      discrimination and persistent retrievable state, which has never been
      observed in vascular tissue.
    confidence: high
  - claimId: VASO-C020
    verdict: weakly_supported
    reasoning: The central hypothesis attributing muscle knots to microvascular
      smooth-muscle latching lacks any direct histological, physiological, or
      imaging confirmation in human myofascial tissue. Furthermore,
      microvascular studies collected in VASO-S001 show that skeletal-muscle
      arterioles sustain constriction via continuous activation and
      phosphorylation rather than dephosphorylated latch bridges. The strongest
      opposing consideration is that local hypoxia, acidic milieu, and
      hemodynamic changes can be entirely accounted for by conventional skeletal
      muscle contracture compressing the microvascular bed.
    confidence: high
  - claimId: VASO-C022
    verdict: weakly_supported
    reasoning: Mapping traditional contemplative constructs such as rtsa mdud,
      granthis, and ashi points onto vascular-autonomic physiology is an
      intriguing interpretive hypothesis but currently lacks systematic, blinded
      cartographic verification. Proponents note suggestive clustering along the
      torso midline and limb trajectories, but no quantitative spatial
      comparison against chance baseline has been conducted. The strongest
      opposing consideration is the substantial risk of post-hoc pattern
      matching and confirmation bias when mapping pre-modern somatic
      descriptions onto anatomical structures.
    confidence: moderate
  - claimId: VASO-C010
    verdict: well_supported
    reasoning: The latch-bridge state as a mechanism for maintaining isometric force
      at low cross-bridge phosphorylation and low energetic cost is textbook
      smooth-muscle physiology, robustly validated by Hai & Murphy (1988).
      However, its generalization across all vascular beds is qualified by
      findings showing latch divergence across arterial branch orders and an
      absence of energetic confirmation in resistance arterioles. The strongest
      opposing consideration is that latch mechanics are predominantly
      demonstrated in large conduit arteries rather than resistance
      microvessels.
    confidence: high
  - claimId: VASO-C011
    verdict: provisionally_supported
    reasoning: "The deductive logic of this claim is sound: gross collagenous
      remodeling or structural scarring cannot physically dissolve within
      seconds, meaning any objective seconds-scale mechanical release must
      represent an active physiological state transition. Potential non-vascular
      physiological candidates include rapid changes in fascial hyaluronan
      thixotropy or spinal motoneuron inhibition. The strongest opposing
      consideration is that an objective seconds-scale mechanical release has
      not yet been demonstrated under rigorous, blinded instrumentation."
    confidence: moderate
  - claimId: VASO-C012
    verdict: well_supported
    reasoning: Originally articulated as a theoretical model by Moore & Cao (2008),
      the hemo-neural hypothesis received direct, high-quality experimental
      confirmation from Salameh et al. (2024), demonstrating that blood-pressure
      pulsations modulate central neuronal activity via mechanosensitive ion
      channels. The mechanism is now biologically demonstrated in vivo. The
      strongest opposing consideration is that these empirical demonstrations
      occurred in rodent brain preparations under pulsatile mechanical forces,
      rather than in peripheral somatic tissue under tonic vasospasm.
    confidence: high
  - claimId: VASO-C013
    verdict: established
    reasoning: The ability of slow breathing and prolonged exhalation to enhance
      vagal outflow and shift autonomic balance toward parasympathetic dominance
      is extensively established across decades of cardiovascular physiology.
      Zaccaro et al. (2018) synthesized reproducible increases in respiratory
      sinus arrhythmia and heart-rate variability during paced slow breathing.
      The strongest opposing consideration is that systemic vagal shifts do not
      automatically translate to focal, site-specific autonomic changes at
      peripheral musculoskeletal sites.
    confidence: high
  - claimId: VASO-C030
    verdict: well_supported
    reasoning: Systematic reviews, notably Lucas et al. (2009), consistently find
      that manual palpation for trigger points suffers from poor inter-examiner
      reliability and lacks a validated diagnostic gold standard. The validity
      of the myofascial trigger point construct remains heavily debated in the
      clinical literature, as articulated by Quintner et al. (2015). The
      strongest opposing consideration is that expert examiners within
      specialized research groups occasionally achieve higher localized
      consensus, and modern elastography provides an emerging objective
      correlate.
    confidence: high
  - claimId: VASO-C001
    verdict: well_supported
    reasoning: Focal tender nodules in muscle and fascia are an exceedingly common
      clinical and subjective finding across the human population, as reflected
      across decades of clinical literature and fibromyalgia diagnostic surveys.
      However, population-wide census data are lacking, and the specificity and
      diagnostic boundaries of these nodules remain disputed. The strongest
      opposing consideration is that manual palpation lacks high inter-rater
      reproducibility, leaving the true prevalence of discrete structural
      entities ambiguous relative to generalized somatic hyperalgesia.
    confidence: moderate
  - claimId: VASO-C002
    verdict: provisionally_supported
    reasoning: Hubbard & Berkoff (1993) initially reported continuous, low-amplitude
      spontaneous electrical activity localized to the 1–2 mm trigger-point
      nidus. Simons et al. (2002) confirmed endplate noise at 100% of examined
      trigger points, but demonstrated that it is an endplate-zone phenomenon,
      occurring in 36% of non-tender endplate sites and completely absent
      outside the endplate zone. The strongest opposing consideration is that
      this electrical chatter reflects skeletal motor endplate dysfunction
      rather than any specific vascular smooth-muscle process.
    confidence: moderate
  - claimId: VASO-C003
    verdict: provisionally_supported
    reasoning: McNulty et al. (1994) documented that mental arithmetic significantly
      increased EMG amplitude at trigger-point sites while control sites in the
      same muscle remained relatively quiet in a small sample (n=14). This
      provides evidence of cognitive-sympathetic modulation of focal
      neuromuscular activity. The strongest opposing consideration is that the
      control sites were not verified to lie within the motor endplate zone,
      meaning the differential activity may reflect generic endplate sensitivity
      rather than trigger-point specificity.
    confidence: moderate
  - claimId: VASO-C004
    verdict: weakly_supported
    reasoning: The two-key release phenomenon—immediate softening of a tender point
      under sustained pressure paired with slow exhalation—rests entirely on
      first-person practitioner reports and proponent testimony. No
      instrumented, synchronized physiological trial has recorded this
      seconds-scale transition. The strongest opposing consideration is that
      perceived release can easily arise from sensory adaptation, diffuse
      neuromuscular relaxation, or cognitive expectancy rather than true local
      tissue desensitization or unlatching.
    confidence: moderate
  - claimId: VASO-C005
    verdict: well_supported
    reasoning: Multiple independent imaging and biochemical modalities demonstrate
      that palpated active trigger points differ measurably from surrounding
      muscle tissue, showing elevated neuropeptides and acidity on microdialysis
      (Shah 2008), increased stiff-area dimensions on sonoelastography, and
      altered pulsatility on Doppler (Ballyns 2011, Mazza 2021). The strongest
      opposing consideration is that Doppler resistivity index does not differ,
      blood flow changes do not cleanly classify individual sites due to high
      variance, and neuropeptide elevations are partly systemic.
    confidence: high
  - claimId: VASO-C006
    verdict: well_supported
    reasoning: Mizrachi et al. (2026) demonstrated in preregistered human trials
      (n=57) that attending to a local histamine skin prick attenuated wheal and
      flare reactions 1.5-fold compared to distraction, mediated by vagal and
      sensory routes without changes in sympathetic arousal. This provides
      rigorous proof that focal attention can regulate local peripheral tissue
      responses. The strongest opposing consideration is that this effect
      operates across a 20-minute neuroimmune reflex arc in the skin, which
      provides little mechanistic support for seconds-scale vascular
      smooth-muscle unlatching in muscle beds.
    confidence: high
  - claimId: VASO-C031
    verdict: well_supported
    reasoning: Ballyns et al. (2011) directly demonstrated that pulsatile arteries
      within 1–2 cm of active upper-trapezius trigger points exhibited a
      significantly higher pulsatility index (median 8.3) compared to palpably
      normal control sites in the same muscle (median 3.0, P < .05). The
      strongest opposing consideration is that the measured vessels were
      conduit-caliber arteries (>1 mm) rather than microvessels, and the
      comparison was conducted within symptomatic patients lacking pain-free
      controls.
    confidence: high
  - claimId: VASO-C032
    verdict: well_supported
    reasoning: Ballyns et al. (2011) explicitly documented retrograde diastolic flow
