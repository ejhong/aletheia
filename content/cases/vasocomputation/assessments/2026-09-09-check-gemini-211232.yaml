  synthesis: >-
    The vasocomputation hypothesis attempts to unite disparate phenomena across
    musculoskeletal medicine, autonomic physiology, and contemplative practice
    under the umbrella of vascular smooth-muscle latching. A rigorous accounting
    of the ledger reveals an architecture with solid base foundations but an
    unevidenced and empirically strained upper superstructure.

    On the supporting side, several lower-rung mechanistic and observational
    elements are legitimate, peer-reviewed science. Vascular smooth muscle in
    large conduit vessels possesses a well-established latch-bridge state
    permitting low-energy force maintenance (Hai & Murphy 1988). Hemodynamic
    state can directly influence neuronal firing via mechanosensitive ion
    channels (Moore & Cao 2008; Salameh et al. 2024). Slow breathing reliably
    shifts global autonomic tone toward parasympathetic dominance (Zaccaro et
    al. 2018), and voluntary interoceptive attention can modulate peripheral
    inflammatory responses (Mizrachi et al. 2026). Furthermore, active
    myofascial trigger points demonstrably exhibit distinct local tissue
    signatures, including elevated inflammatory mediators, localized stiffness
    on vibration sonoelastography, and altered arterial Doppler waveforms (Shah
    et al. 2008; Ballyns et al. 2011).

    However, the central bridging claim that myofascial knots are maintained
    microvascular smooth-muscle latches (VASO-C020) fails on current evidence.
    First, needle electromyography at trigger-point nidi records spontaneous
    electrical activity that Simons et al. (2002) mapped directly to motor
    endplate zones, demonstrating that the chatter is neuromuscular rather than
    vascular. Second, workpaper VASO-S001 demonstrates that energetic economy
    has never been verified in microvascular arterioles, and pressurized
    skeletal-muscle resistance arterioles sustain tone via active myosin
    light-chain phosphorylation rather than dephosphorylated latches
    (VASO-E020). Third, the Doppler anomalies observed near trigger points
    (elevated pulsatility, retrograde diastolic flow) occur 1–2 cm away in
    conduit vessels and are equally consistent with extrinsic compression from
    skeletal-muscle contracture or transducer pressure. Finally, the cognitive
    storage claims (VASO-C021) conflate simple biophysical hysteresis with
    computational information processing. 

    Sensitivity analysis: The single evidence record whose removal would most
    change this assessment toward unresolved or provisionally supported is
    VASO-E020. Without the finding that pressurized skeletal-muscle resistance
    arterioles rely on active phosphorylation rather than latch mechanics, the
    vascular latch hypothesis would remain an untested, open possibility rather
    than an extrapolation conflicting with observed microvascular physiology.
    Even without VASO-E020, however, the verdict of weakly supported survives
    because direct positive evidence for smooth-muscle latching at tender points
    remains entirely absent (grade D).
  steelman: The selective exacerbation of needle-EMG chatter at discrete
    trigger-point nidi during mental arithmetic (McNulty 1994), in the absence
    of generalized muscular tensing, demonstrates that focal somatic holdings
    receive targeted autonomic or cognitive inputs, which conventional models of
    purely passive skeletal-muscle contracture fail to explain.
