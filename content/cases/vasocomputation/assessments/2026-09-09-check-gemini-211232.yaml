      consideration is that this demonstrated mechanism reflects transient,
      instantaneous mechanosensation in rat brains rather than computational
      information gating or memory storage in the human periphery.
    confidence: high
  - claimId: VASO-C013
    verdict: established
    reasoning: Systematic review evidence (Zaccaro et al. 2018) confirms that slow
