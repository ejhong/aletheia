  synthesis: "The case is a ladder, and the rungs separate sharply. The
    observation and lever rungs are genuinely solid as stated: a
    millimeter-scale electrically maintained nidus exists at tender points with
    a graded, endplate-zone-anchored prevalence (C002, C034, C035), tender-point
    tissue is measurably angrier, stiffer and more pulsatile than comparison
    tissue (C005, C031, C032, C033), slow breathing shifts autonomic balance
    (C013), and — the strongest single new record — preregistered within-subject
    experiments show voluntary attention regulating a vascular bed's
    inflammatory response without an arousal confound (C006). The latch
    mechanism is real physiology (C010, Hai & Murphy), the read path from
    hemodynamics to neural activity now has a demonstrated molecular mechanism
    (C012, Salameh 2024), and the construct critique (C030) is methodologically
    sound without being fatal, since it attacks the manual exam rather than
    instrumented detection. But the featured hypothesis lives on the two rungs
    above, and there the ledger's own audit (VASO-E016, grade D) finds the
    linchpins unevidenced rather than under-evidenced: no synchronized imaging
    of a seconds-scale release, no smooth-muscle latch ever observed at a tender
    point. Worse, the site's own evidence map (VASO-E019/E020/E021) shows the
    mechanism is an extrapolation across vessel type and caliber: latch behavior
    is not generic, was absent one branch order downstream of a latching parent
    artery, and pressurized skeletal-muscle arterioles hold constriction by
    maintained activation, not an economical dephosphorylated hold. That is a
    mismatch, not a refutation — the relevant preparation has never been run
    with stimulus withdrawal or energetics — but it moves the burden. C020 as
    stated is therefore weakly supported: coherent, testable, and unobserved in
    the compartment it names, with Ballyns's Doppler findings near-zero in
    diagnosticity because the authors themselves rank skeletal-muscle
    compression as an equal candidate cause. C021 (vascular participation in
    mental life, clinging as latch) rests on a self-published theoretical
    program plus an analogy the critical report correctly notes conflates
    hysteresis with memory; it is unresolved, not supported. C022 rests entirely
    on an uncited essay assertion with unaddressed post-hoc matching risk.
    Sensitivity: remove VASO-E016 and the case verdict softens toward
    weakly_supported, but the direction survives — E019/E020 and the
    Lucas/Quintner lines carry the same weight independently. The honest
    structural summary: a real, instrumented phenomenon with a contested
    ontological base, wrapped in a mechanism that is borrowed, plausible, and
    untested exactly where it matters, with a keystone experiment (VASO-R001)
    that has never been run."
  steelman: "The proponent's strongest unanswerable card is the McNulty 1994
    result read jointly with Hubbard & Berkoff 1993: a purely cognitive
    stressor, involving no movement or muscle tensing, selectively turned up
    sustained spontaneous electrical activity inside a discrete 1–2 mm tender
    nidus while adjacent tissue in the same muscle stayed quiet. No account in
    this ledger — damaged tissue, scar, guarding, or neurogenic inflammation of
    a nerve trunk — explains why a purely mental event writes millimeter-scale,
    site-specific electrophysiology into one spot and not a centimeter away.
    That is precisely the \"actively maintained physiological state, writable by
    stress\" the featured hypothesis predicts, and the endplate-zone
    qualification from Simons 2002 does not dissolve it: the prevalence gradient
    (11/11 vs 4/11 vs 0/11) plus stress-selectivity at the tender site
    specifically remains an actively maintained, addressable,
    autonomic-responsive element — the exact signature of \"state, not scar\" —
    with no competing ledger-based explanation of its site selectivity under
    purely cognitive load."
