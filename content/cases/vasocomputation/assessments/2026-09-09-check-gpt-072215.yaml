    confidence: high
  - claimId: VASO-C005
    verdict: well_supported
    reasoning: "VASO-E006 supports biochemical differences, VASO-E023 supports a
      graded stiffness difference, and VASO-E022 supports a group-level
      pulsatility difference near active sites. The imaging review in VASO-E007
