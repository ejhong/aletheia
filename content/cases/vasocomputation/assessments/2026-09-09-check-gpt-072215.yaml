    confidence: low
  - claimId: VASO-C073
    verdict: unresolved
    reasoning: No evidence record measures perfusion and stiffness with sufficient
      temporal resolution during a breath-assisted release, so the asserted
      blood-first ordering remains an untested prediction. VASO-E022 and
      VASO-E023 show hemodynamic and mechanical group differences, but not
