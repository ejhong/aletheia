    confidence: moderate
  - claimId: VASO-C006
    verdict: well_supported
    reasoning: "VASO-E008 closely matches the claim: preregistered within-subject
      experiments found smaller and faster-resolving histamine wheal-and-flare
      responses under directed attention, without differences in several
      measured arousal indices. Replication across two cohorts and the lidocaine
