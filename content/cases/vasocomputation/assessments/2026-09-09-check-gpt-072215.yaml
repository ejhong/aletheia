      consideration is that this is one recent laboratory's acute
      skin-inflammation model, with changed HRV and incompletely identified
      mediators, rather than evidence about chronic knots or direct control of
      vascular smooth muscle."
    confidence: high
  - claimId: VASO-C031
    verdict: provisionally_supported
    reasoning: "VASO-E022 directly reports a significantly higher median Doppler
      pulsatility index near active upper-trapezius sites than near palpably
      normal sites in patients with acute cervical pain. The vessels were within
      the stated distance, although generally larger than the microvessels
      invoked by the latch hypothesis. The strongest opposing consideration is
      VASO-E026: there was no pain-free control group, and large variance made
      pulsatility a poor classifier of site status."
    confidence: moderate
  - claimId: VASO-C032
    verdict: well_supported
    reasoning: VASO-E022 directly records retrograde diastolic flow at 15 palpably
      normal sites, corresponding to 31%, in symptomatic patients with trigger
      points elsewhere. This is a clear descriptive result from the reported
      sample. The strongest opposing consideration is VASO-E026, because these
      “normal” sites were within symptomatic patients and therefore cannot
      establish the prevalence in genuinely healthy muscle.
    confidence: high
  - claimId: VASO-C033
    verdict: well_supported
    reasoning: VASO-E023 directly reports the ordered stiff-area gradient of active
      greater than latent greater than palpably normal upper-trapezius sites,
      with blinded sonographers and substantial separation in that sample. This
      establishes an instrumented contrast without identifying its mechanism.
      The strongest opposing consideration is that sites were first classified
      by subjective palpation and the finding comes from one research lineage
      using a particular vibration-elastography method.
    confidence: high
  - claimId: VASO-C034
    verdict: well_supported
    reasoning: VASO-E032 directly reports endplate noise at four non-trigger-point
      endplate-zone sites, compared with all eleven trigger-point sites. That
      observation supports both occurrence outside trigger points and lower
      prevalence there. The strongest opposing consideration is the small,
      nonrandomized, unblinded sample available only through an abstract, which
      limits generalization of the prevalence gradient.
    confidence: moderate
  - claimId: VASO-C035
    verdict: provisionally_supported
    reasoning: VASO-E032 reports no endplate noise at the sampled taut-band sites
      lying outside the endplate zone, directly supporting the observation in
      that experiment. The result also coheres with the interpretation that the
      electrical signal primarily tracks the motor endplate zone. The strongest
      opposing consideration is that zero events in a small, unblinded sample
      cannot establish the unrestricted statement that such activity never
      occurs at off-zone taut bands.
    confidence: moderate
  - claimId: VASO-C036
    verdict: well_supported
    reasoning: VASO-E024 directly reports no detected resistivity-index difference
      among active, latent, and palpably normal upper-trapezius sites. This is
      an important null result alongside the positive pulsatility finding. The
      strongest opposing consideration is that it derives from one
      within-patient study without healthy controls, so it establishes the
      reported null more securely than a universal absence of RI differences.
    confidence: moderate
