  synthesis: >-
    The ledger supports several components of the proposed architecture but does
    not establish their assembly into the featured hypothesis. On the favorable
    side, vascular smooth muscle demonstrably can maintain force economically
    through latch behavior in some vascular preparations (VASO-C010).
    Hemodynamic pulsations can causally modulate neural activity (VASO-C012),
    slow breathing has reproducible autonomic correlates (VASO-C013), and
    directed attention can alter a local peripheral inflammatory response
    (VASO-C006). Instrumented studies also show that clinically selected
    trigger-point sites can differ from comparison sites: the Ballyns study
    found graded stiff-area differences and a group-level pulsatility
    difference, while the Shah work found an acidic, mediator-rich biochemical
    milieu. Older needle-EMG studies found focal spontaneous activity and a
    site-selective response to psychological stress. Together, these
    observations make a dynamic physiological account more credible than a
    picture in which every tender point is simply inert scar tissue.

    The evidence does not, however, identify vascular smooth-muscle latch as the
    thing holding a knot. The seconds-scale release central to that inference
    has only a proponent's first-person report, with no synchronized stiffness,
    perfusion, EMG, or sham-site measurement. The most compartment-relevant
    audit, VASO-E020, found that maintained constriction in pressurized
    skeletal-muscle arterioles tracked maintained activation rather than the
    economical dephosphorylated signature invoked by VASO-C020. VASO-E021
    further shows that latch behavior is not generic across vascular smooth
    muscle. These results do not exclude a latch after stimulus withdrawal,
    because the experiments were not designed for that question, but they remove
    the assumption that conduit-artery latch physiology transfers
    straightforwardly to the required microvessels. Local Doppler findings are
    also nondiagnostic: one index was null, pulsatility classified sites poorly,
    roughly a third of palpably normal sites showed retrograde flow, and
    ordinary skeletal-muscle compression or inflammation can explain the
    positive findings.

    The construct problem remains consequential. Manual trigger-point
    identification lacks a validated reference standard, although blinded
    sonography shows that palpation-selected classes can possess graded
    instrumented correlates. Endplate noise is enriched at trigger points but
    also occurs at non-tender endplate-zone sites, favoring a conventional
    skeletal-endplate explanation over an exclusively vascular electrical
    signature. The much stronger claim that vascular states encode predictions,
    expectations, or contemplative clinging has no demonstrated write-store-read
    cycle; causal vascular modulation of neurons is not content-bearing memory.
    The three-element perforator model and the identification with contemplative
    maps likewise have no direct evidence records.

    The resulting case verdict is mixed: dynamic local abnormalities and
    ordinary neurovascular coupling are supported, while the distinctive
    vascular-latch attribution, blood-first release sequence, cognitive-memory
    role, and contemplative identity remain unresolved or face contrary
    compartment-level evidence. The sensitivity record is VASO-E020, the only
    record directly examining activation during maintained constriction in the
    named skeletal-muscle arteriole compartment. Removing it would materially
    weaken the negative mechanistic side, but the mixed verdict survives because
    objective release, latch identification, and vascular memory would still be
    undemonstrated, while reliability and alternative-mechanism problems would
    remain.
  steelman: The strongest unanswered argument for the featured hypothesis is the
    reported seconds-scale, site-specific release during combined pressure and
    slow exhalation. No evidence record tests its distinctive prediction that
    local reperfusion begins before a discrete stiffness drop, time-locked to
    the felt release and absent during pressure-only, sham-site, and failed
    attempts; a positive controlled observation of that sequence would directly
    connect breath, vascular change, and mechanical release.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: The evidence demonstrates that vascular dynamics can modulate neurons
      and that some smooth muscle can retain contractile state, but it never
      shows vascular state encoding or later reinstating distinguishable
      cognitive content. VASO-E017 identifies the missing write-store-read test,
      while VASO-E013 and VASO-E038 merely state the theory. The strongest
      consideration for the claim is the causal hemo-neural pathway in
      VASO-E005, but instantaneous neural modulation is not evidence that
      predictions, expectations, or tanha have a vascular implementation.
    confidence: high
  - claimId: VASO-C020
    verdict: mixed
    reasoning: "Biochemical, stiffness, Doppler, and stress-sensitive EMG
      abnormalities are compatible with a maintained local physiological state
      and possible ischemia. They do not distinguish latched vascular smooth
      muscle from skeletal guarding, contracture-mediated compression,
      inflammation, or other reversible tissue states. The strongest adverse
      consideration is VASO-E020: relevant pressurized skeletal-muscle
      arterioles maintained constriction through maintained activation rather
      than the proposed economical latch signature, while VASO-E016 confirms
      that no latch has been observed at a tender point."
    confidence: moderate
  - claimId: VASO-C174
    verdict: unresolved
    reasoning: No evidence record measures a knot as a composite of vessel tone,
      hyaluronan collar, and fascial-sheet tether, nor demonstrates that all
      three retain prior state. The perforator relocation in VASO-E044 is a
      proponent's competing model rather than an empirical identification of
      these elements. The strongest consideration in favor is that failure of a
      single arteriole-latch account motivates a multiscale alternative, but the
      weakness of one model is not evidence for this particular composite.
    confidence: high
  - claimId: VASO-C022
    verdict: unresolved
    reasoning: VASO-E039 supplies only an uncited, post-hoc assertion that
      traditional knot maps cluster in anatomically suggestive regions. No
      blinded coding, common coordinate system, chance baseline, or
      physiological comparison establishes that Tibetan, Hindu, and Chinese
      constructs map to one vascular-autonomic system. The strongest
      consideration for the claim is the asserted geographical resemblance, but
      its flexibility and lack of primary textual anchoring leave it
      nondiagnostic.
    confidence: high
  - claimId: VASO-C010
    verdict: established
    reasoning: VASO-E003 directly supports the capability of vascular smooth muscle
      to maintain high force at low phosphorylation and energetic cost through
      slowly detaching latch bridges. The claim is existential rather than a
      statement that every vessel type latches. The strongest opposing
      consideration is VASO-E021, which shows important vessel-type
      heterogeneity, but that qualification does not negate the demonstrated
      capability.
    confidence: high
  - claimId: VASO-C011
    verdict: provisionally_supported
    reasoning: Conditional on an objective local entity disappearing within seconds,
      ordinary scar remodeling is an implausible explanation, so the timescale
      argument has substantial force. VASO-E035 supports that conditional
      reasoning, but VASO-E014 does not establish its empirical antecedent
      because the reported release is subjective and uncontrolled. The strongest
      opposing consideration, based partly on general physical priors rather
      than a ledger result, is that rapid passive fluid, viscoelastic, or
      geometrical rearrangement need not be an actively maintained physiological
      state.
    confidence: moderate
  - claimId: VASO-C077
    verdict: unresolved
    reasoning: No evidence record in the ledger measures fascial hyaluronan
      viscosity or gliding before and after pressure, movement, or warmth. The
      claim is therefore testable but currently unevidenced here. Its strongest
      favorable consideration is the general plausibility that temperature and
      mechanical loading alter soft-tissue rheology, but that is a prior rather
      than case evidence and does not establish reversible fascial
      densification.
    confidence: high
  - claimId: VASO-C012
    verdict: well_supported
    reasoning: "VASO-E005 provides direct causal evidence that physiological
      blood-pressure pulsations modulate nearby central neurons through
      mechanosensitive channels, establishing the broad “can modulate” claim.
      VASO-E004 supplies the wider proposed mechanical, thermal, and chemical
      pathways but is not itself experimental evidence. The strongest opposing
      consideration is limited scope: the demonstration is in rats, is central
      rather than peripheral, and shows rapid modulation rather than stored or
      content-specific information."
    confidence: high
  - claimId: VASO-C013
    verdict: well_supported
    reasoning: The systematic review in VASO-E009 found reproducible increases in
      respiratory sinus arrhythmia, heart-rate variability, and related
      autonomic changes during slow breathing, supporting a parasympathetic
      shift. The evidence concerns global autonomic correlates rather than
      release of local tender points. The strongest opposing consideration is
      that the ledger does not isolate extended exhalation from slow breathing
      generally, and “parasympathetic dominance” is a stronger interpretation
      than the measured indices alone.
    confidence: moderate
  - claimId: VASO-C030
    verdict: established
    reasoning: VASO-E011 directly concludes that manual trigger-point examination
      has not demonstrated adequate reliability or validity and lacks an
      accepted reference standard. VASO-E010 establishes that the construct is
      actively contested, while VASO-E029 records the same examiner-dependence
      from a proponent imaging group. The strongest opposing consideration is
      that blinded instrumented imaging may identify reproducible tissue
      differences despite unreliable palpation, but that does not rescue the
      manual examination or eliminate the documented controversy.
    confidence: high
  - claimId: VASO-C001
    verdict: weakly_supported
    reasoning: Proponent testimony and introductory clinical framing support the
      existence of tender points, but neither VASO-E015 nor VASO-E028 provides a
      verified general-population census of discrete palpable knots. The
      evidence is especially weak for the words “commonly” and “across the
      general population.” The strongest opposing consideration is VASO-E012,
      reinforced by the reliability review, which notes that reproducibility and
      even the ontological status of the precisely palpable spot are disputed.
    confidence: moderate
  - claimId: VASO-C002
    verdict: provisionally_supported
    reasoning: VASO-E001 supports sustained spontaneous activity in a 1–2 mm
      trigger-point nidus, and VASO-E031–E032 show a prevalence gradient from
      trigger-point sites to non-tender endplate-zone sites to off-zone
      taut-band sites. This supports enrichment at the nidus rather than
      exclusivity to it. The strongest opposing consideration is that the
      matched study was small, nonrandomized, and unblinded, and its findings
      indicate that endplate location itself explains part of the signature.
    confidence: moderate
  - claimId: VASO-C003
    verdict: provisionally_supported
    reasoning: "VASO-E002 directly reports that mental arithmetic increased
      needle-EMG activity at trigger points while nearby controls remained
      comparatively quiet without generalized muscle tensing. It is nevertheless
      a small, old, unreplicated study from the same research lineage as the
      initial EMG work. The strongest opposing consideration is VASO-E031: if
      the control needles were outside the endplate zone, their silence may not
      establish trigger-point selectivity against a properly matched endplate
      control."
    confidence: moderate
  - claimId: VASO-C143
    verdict: unresolved
    reasoning: The stress-induced EMG change in VASO-E002 did not measure local skin
      perfusion, vascular caliber, or vasoconstriction, so it cannot identify
      the event as a regional sympathetic vascular write. A skeletal endplate or
      spindle response remains an adequate alternative. The strongest
      consideration for the claim is the site-selective stress response itself
      and the general prior that sympathetic activity can alter regional
      vascular tone, but the proposed causal bridge was not observed.
    confidence: high
  - claimId: VASO-C004
    verdict: weakly_supported
    reasoning: "VASO-E014 directly reports the claimed subjective experience:
      pressure combined with slow breathing and a long exhale is followed by a
      felt release within seconds. Because the claim says “felt release,”
      testimony is relevant, but it comes from the hypothesis proponent without
      blinded controls or objective localization. The strongest opposing
      consideration is that expectation, attention, pressure-induced sensory
      adaptation, and ordinary relaxation can generate the report without any
      discrete local entity releasing."
    confidence: low
  - claimId: VASO-C039
    verdict: weakly_supported
    reasoning: The pressure-alone necessity claim is supported only by the proponent
      testimony within VASO-E014, which states that pressure locates the knot
