  synthesis: "The case decomposes cleanly into three tiers that the evidence
    treats very differently, and a single verdict token is only honest if it
    registers that split. The bottom tier is solid. That vascular smooth muscle
    can hold force economically at low activation (VASO-C010) is textbook
    physiology anchored by Hai & Murphy; that slow breathing shifts autonomic
    indices (VASO-C013) is systematically reviewed; that hemodynamic state can
    modulate nearby neurons (VASO-C012) moved from hypothesis to demonstration
    with Salameh 2024; that palpation-based trigger-point diagnosis is
    unreliable (VASO-C030) is established by Lucas and conceded even by
    proponents (VASO-E029). The middle tier — that tender points are objectively
    distinct from surrounding tissue — is genuinely supported but circular at
    the root: Ballyns' blinded sonographers found a clean stiff-area gradient
    across active, latent and normal sites (AUC 0.9), and Shah found an acidic,
    mediator-rich milieu, but every site in every such study was selected by the
    palpation whose reliability the same literature impugns, and the Doppler
    signature is partial (RI null, PI a poor classifier, retrograde flow at 31%
    of \"normal\" sites, no pain-free controls). The top tier — that the
    maintained element is latched microvascular smooth muscle, and that such
    latches implement predictions and clinging — has no direct evidence at all.
    VASO-E016 grades both linchpins D. Worse for the hypothesis, VASO-E020
    reports that where the compartment has been examined with the right
    molecular readout, pressurized skeletal-muscle arterioles maintain
    constriction with maintained or rising MLC phosphorylation, i.e. sustained
    activation rather than an economical dephosphorylated hold; VASO-E021 shows
    latch behaviour vanishing one branch order downstream of a parent artery;
    VASO-E019 shows nobody has ever measured arteriolar energetics at all.
    Meanwhile the anchor phenomenon (VASO-C004) is proponent testimony, the
    electrical signature turns out to track the endplate zone at least as well
    as the trigger point (VASO-E031/E032), and the competing accounts — skeletal
    guarding compressing the bed, fascial densification, endplate dysfunction,
    central sensitisation — are named as equally plausible by the very source
    recorded as supporting the ischemia prediction (VASO-E027). So: \"state, not
    scar\" is provisionally supported in its weak form; \"vascular latch\" is
    unevidenced and mildly disfavoured where checked; \"vascular memory
    implements tanha\" is a research programme, not a finding. Mixed is the
    accurate roll-up, not a hedge. The decisive experiments (VASO-R001,
    VASO-R004, VASO-R005) are cheap, specified, and unrun."
  steelman: No competing account predicts the timing signature the hypothesis
    stakes itself on — perfusion rising before stiffness falls, within seconds,
    time-locked to an exhale — and that measurement has never been attempted, so
    the hypothesis has not failed a test it could have failed. Nor does any
    rival explain why a purely cognitive stressor with no gross muscle tensing
    selectively raises electrical activity at a millimetre-scale point a person
    can find by touch, why the one voluntary handle on the autonomic system is
    the reported release key, or why palpated knots are reportedly invisible on
    T1 MRI — a lesion taxonomy predicts a visible lesion, and a maintained
    autonomic state predicts exactly the imaging silence observed.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: "The ledger holds only the originator's own statement of the
      hypothesis (VASO-E013, VASO-E038) and a critique arguing that hysteresis
      is not memory because no write–store–read loop with discriminable prior
      inputs has been demonstrated in mammalian vasculature (VASO-E017). Salameh
      2024 establishes instantaneous vascular-to-neural modulation, which is the
      read path only; nothing addresses storage, content specificity, or the
      mapping onto held expectations and clinging. The strongest opposing
      consideration is that the one genuine flow-network memory precedent is
      Physarum, an organism whose tubes are its motile body — a disanalogy the
      theory must overcome rather than borrow from. This is unresolved rather
      than contradicted: VASO-R005 specifies a clean decisive design that has
      not been run."
    confidence: moderate
  - claimId: VASO-C020
    verdict: unresolved
    reasoning: No record in the ledger identifies smooth-muscle latch at a tender
      point; VASO-E016 grades this linchpin D, and the study workpaper shows the
      mechanism has never been measured in the compartment the claim names — no
      arteriolar energetics anywhere (VASO-E019), latch present in a parent
      artery but absent one branch order down (VASO-E021), and pressurized
      skeletal-muscle arterioles holding constriction via maintained
      phosphorylation and Rho-kinase sensitisation rather than an economical
      dephosphorylated hold (VASO-E020). The circumstantial support — acidic
      milieu, high-pulsatility flow, retrograde diastolic flow — is consistent
      with the claim but non-diagnostic; Ballyns' own authors name skeletal
      contracture compressing the bed, inflammation, geometry and transducer
      pressure as equally plausible causes (VASO-E027), and the vessels
      interrogated were >1 mm and 1–2 cm away. The strongest opposing
      consideration is that the arteriole compartment is not merely unexamined
      but examined-and-mismatched; the strongest point for the claim is that
      none of those preparations withdrew the stimulus, so input-free
      persistence remains untested.
    confidence: moderate
  - claimId: VASO-C022
    verdict: unresolved
    reasoning: The only record is the essay's uncited assertion that traditional
      knots cluster on the midline and limbs where ganglia, sympathetic chains
      and dense fascia lie (VASO-E039), offered with no coding rule, no chance
      baseline and no blinding. Post-hoc anatomical resemblance between rich
      symbolic corpora and any dense bodily structure is cheap; the same maps
      would "align" with lymphatic, neural or musculotendinous geography under
      the same procedure. The strongest opposing consideration is that the
      traditional corpora were also written to serve soteriological and ritual
      schemes with their own internal logic, so convergence on interoceptive
      cartography is not the default explanation of their content. The claim is
      testable and cheap to test (VASO-R006); nothing in the ledger currently
      discriminates.
    confidence: moderate
  - claimId: VASO-C010
    verdict: established
    reasoning: "The latch-bridge model reproduces the measured dissociation of
      sustained stress from myosin light-chain phosphorylation in smooth-muscle
      preparations (VASO-E003), and the phenomenon is standard smooth-muscle
      physiology; the rabbit femoral data in VASO-E021 records sustained stress
      at falling calcium with 42% phosphorylation, an independent instance. The
      claim as worded is a capability claim about vascular smooth muscle, and
      the capability is demonstrated. The strongest opposing consideration is
      generality, not existence: VASO-E021 shows the same laboratory finding the
      behaviour absent in the femoral artery's own saphenous branch, attributed
      to motor-protein phenotype and higher phosphatase activity, so \"vascular
      smooth muscle latches\" must not be read as a property of the tissue
      class. This verdict leans partly on textbook background beyond the two
      ledger records."
    confidence: high
  - claimId: VASO-C011
    verdict: weakly_supported
    reasoning: "As a conditional, half of it is sound: collagen remodelling and scar
      do not reverse in seconds, so an objectively verified seconds-scale
      release would indeed exclude structural remodelling. The other half does
      not follow — \"actively maintained physiological state\" is only one of
      the fast candidates, alongside passive thixotropic or hyaluronan-viscosity
      changes in fascia (the densification account VASO-R008 exists to test),
      reflex skeletal relaxation, and a purely perceptual change in tenderness
      with no local tissue transition at all. The antecedent is also unmet: the
      only imaged change in the ledger is Ballyns' three-case pilot over
      follow-up visits after dry needling (VASO-E030), not a release event, and
      VASO-E035 is the argument restated by its proponent rather than an
      observation. The strongest opposing consideration is that \"state\" and
      \"structure\" are not exhaustive categories on a seconds timescale."
    confidence: moderate
  - claimId: VASO-C012
    verdict: well_supported
    reasoning: "Moore & Cao proposed the modulation route without demonstrating it
      (VASO-E004), but Salameh et al. 2024 supplies direct causal evidence that
      physiological blood-pressure pulsations modulate central neuronal activity
      through mechanosensitive channels on fast timescales (VASO-E005). The
      claim as stated is a modest existence claim about hemodynamic state
      influencing nearby neurons, and that is met. The strongest opposing
      consideration is scope: the demonstration is in rat brain, not human
      peripheral tissue, and shows instantaneous mechanosensation, so it
      licenses nothing about local vascular states biasing peripheral
      nociceptors or about persistence — the uses the synthesis needs."
    confidence: moderate
  - claimId: VASO-C013
    verdict: well_supported
    reasoning: "Zaccaro et al.'s systematic review documents reproducible increases
      in respiratory sinus arrhythmia, HRV and related autonomic/CNS changes
      with slow breathing in healthy humans (VASO-E009), and Mizrachi's within-
      subject experiment independently found higher HRV under the internal-
      attention condition (VASO-E008). The effect is robust and easy to elicit.
      The strongest opposing consideration is interpretive rather than
      empirical: RSA and HRV at slow respiratory rates are partly a mechanical
      consequence of breathing frequency and tidal volume, so \"parasympathetic
      dominance\" is an inference from proxies rather than a direct measure of
      vagal outflow — a caveat the claim's wording (\"shifts autonomic balance
      toward\") mostly absorbs."
    confidence: high
  - claimId: VASO-C030
    verdict: well_supported
    reasoning: Lucas et al.'s systematic review concluded that manual examination
      for trigger points has not been shown reliable or valid and that no
      accepted reference standard exists (VASO-E011); Quintner, Bove & Cohen
      make the peer-reviewed case that the construct rests on circular reasoning
      and an undemonstrated lesion (VASO-E010); and a proponent group concedes
      that results "vary depending on the clinician's training and experience"
      and that the reference standards are subjective (VASO-E029). The claim is
      about the state of the literature, and the literature is as described. The
      strongest opposing consideration is that Dommerholt & Gerwin answered
      Quintner point by point (noted in VASO-E010's limitations), so "contested"
      is right but "refuted" would not be; and Lucas assessed manual palpation
      specifically, leaving instrumented localisation untouched.
    confidence: high
  - claimId: VASO-C001
    verdict: provisionally_supported
    reasoning: "The ledger's direct support is thin: proponent testimony plus an
      uncitedly-sourced recollection of fibromyalgia-era community counts
      (VASO-E015), and a 1986 clinic-derived prevalence figure quoted at second
      hand in an introduction (VASO-E028). That widespread tenderness at
      palpable spots exists is nonetheless close to universal experience and is
      presupposed by an entire clinical literature, so this verdict leans partly
      on background plausibility rather than on the records. The strongest
      opposing consideration is VASO-E012, which explicitly corrects the essay's
      framing: the reproducibility and ontological status of discrete
      localisable spots — not just their mechanism — are part of the academic
      dispute, and the reliability data in VASO-E011 bear directly on the word
      \"discrete.\" Tenderness is well supported; discreteness is not."
    confidence: moderate
  - claimId: VASO-C002
    verdict: provisionally_supported
    reasoning: "As restated here the claim already incorporates the Simons
      qualification and matches the data well: Hubbard & Berkoff found sustained
      spontaneous activity in a 1–2 mm nidus of every trigger point examined
      (VASO-E001), and Simons, Hong & Simons found endplate noise at 11/11
      trigger-point sites, 4/11 non-tender endplate-zone sites and 0/11 off-zone
      taut-band sites (VASO-E031, VASO-E032). Two labs converge on a prevalence
      gradient. The strongest opposing considerations are that both studies are
      small, old and unblinded, that Simons and Hong are avowed proponents of
      the construct, that the abstract alone was available to the extractor, and
      that the signal's generator remains contested — the finding that noise
      tracks the endplate zone first supports a conventional neuromuscular
      account and is electrically silent about vasculature."
    confidence: moderate
  - claimId: VASO-C003
    verdict: weakly_supported
    reasoning: 'One study (n=14, 1994) from the same lineage as Hubbard & Berkoff
      reports the effect, never replicated with modern instrumentation
      (VASO-E002); VASO-E033 is the essay restating it and adds nothing. The
      selectivity claim is the fragile part: Simons 2002 shows endplate noise
      occurs at some non-tender endplate-zone sites, so the "quiet" adjacent
      controls may simply have been off the endplate zone rather than
      demonstrating trigger-point specificity — exactly the confound VASO-R011
      is designed to remove. The strongest opposing consideration is therefore
      that the entire localisation argument may be an artefact of control-site
      placement. If the effect is real it is striking evidence that a mental
      event writes to an addressable site, which is why replication matters more
      here than almost anywhere in the case.'
    confidence: low
  - claimId: VASO-C004
    verdict: weakly_supported
    reasoning: The sole record is first-person and practitioner testimony from the
      hypothesis's proponent, in an essay whose text was AI-generated at his
      direction (VASO-E014), consistent with widespread bodywork lore but
      measured by no one. The claim as worded is modest — a *felt* release —
      which makes it nearly unfalsifiable from testimony alone, since
      expectation, attention, breath-linked analgesia and pressure-induced
      afferent habituation all produce felt changes without any local
