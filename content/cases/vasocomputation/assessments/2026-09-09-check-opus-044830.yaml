  - claimId: VASO-C005
    verdict: provisionally_supported
    reasoning: "Three lines converge: microdialysis showing an acidic, mediator-rich
      milieu at active points (VASO-E006), a systematic imaging review reporting
      biomechanical and flow parameters distinguishing active and latent points
      from healthy tissue (VASO-E007, second-hand), and Ballyns' blinded
      sonoelastography with a clean active > latent > normal stiff-area gradient
      and AUC 0.9 (VASO-E023). Blinding of the sonographers is a real strength
      over the palpation-only literature. The strongest opposing considerations
      are circularity (sites were defined by palpation, so the contrast
      presupposes the classification), the absence of any pain-free control
      group (VASO-E026), the null resistivity index and poor per-site
      classification by Doppler (VASO-E024, VASO-E025), Shah's finding of
      elevated mediators remote from the points as well as near them, and the
      shared NIH lineage of Shah and Ballyns. Group-level differences survive;
      \"a marker\" does not."
    confidence: moderate
  - claimId: VASO-C006
    verdict: provisionally_supported
    reasoning: "Mizrachi et al. is the strongest single experimental record in the
      case: preregistered, within-subject, 57 volunteers across two cohorts,
      ~1.5-fold smaller and faster-resolving wheal and flare under internal
      attention in ~90% of participants, with skin conductance, heart rate,
      temperature and self-reported anxiety unchanged and a lidocaine dissection
      separating sensory from top-down vagal routes (VASO-E008). That design
      directly supports every element of the claim as stated, including the
      no-arousal-change clause. The strongest opposing consideration is that
      this is a single laboratory publishing weeks before extraction, with no
      independent replication, in an acute histamine model in healthy skin, and
      with molecular mediators not directly measured by the authors' own
      admission — plus their caveat that skin lacks direct parasympathetic
      innervation (VASO-E041), which limits mechanistic transfer to knots."
    confidence: moderate
  - claimId: VASO-C031
    verdict: provisionally_supported
    reasoning: "The claim is a faithful restatement of a reported measurement:
      median pulsatility index 8.3 near active sites versus 3.0 near normal
