  - claimId: VASO-C036
    verdict: weakly_supported
    reasoning: The source states plainly that no differences in resistivity index
      were detected between normal, latent and active sites (VASO-E024), so the
      claim reports what was found. But this is a failure to reject in a study
      whose authors attribute large variance to their measurements and whose
      "normal" sites sat within symptomatic muscle close to trigger points
      (VASO-E026) — conditions that would suppress any true contrast. No
      equivalence testing or power analysis is recorded. The strongest opposing
      consideration is therefore that absence of a detected difference in one
      small, confounded, single-laboratory sample is weak grounds for asserting
      that no difference exists; the null is informative mainly as a caution
      against reading the Doppler picture as categorical.
    confidence: low
