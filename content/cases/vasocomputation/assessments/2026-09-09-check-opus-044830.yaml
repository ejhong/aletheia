  - claimId: VASO-C035
    verdict: provisionally_supported
    reasoning: 'The source reports 0 of 11 off-endplate-zone taut-band sites showing
      endplate noise, P = 0.000034 (VASO-E032), which is a clean result and the
      expected one if the signal is endplate-derived. But the claim is stated as
      a universal negative on the strength of eleven sites in ten subjects,
