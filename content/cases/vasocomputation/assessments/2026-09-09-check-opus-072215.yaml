  synthesis: "The ledger has an unusually clean structure: a broad, decently
    evidenced base; a narrow, unevidenced neck; and a speculative crown. The
    base holds. Latch-bridge physiology is real (VASO-E003, plus textbook
    background). Slow breathing is a genuine autonomic lever (VASO-E009).
    Voluntary attention can measurably regulate a peripheral inflammatory
    response without arousal change (VASO-E008, preregistered, two cohorts).
    Local hemodynamics can modulate neurons, first as hypothesis (VASO-E004) and
    now with a demonstrated mechanosensitive mechanism (VASO-E005). Tender
    points carry instrumented correlates — an acidic mediator-rich milieu
    (VASO-E006), larger stiff areas on blinded sonoelastography with AUC 0.8–0.9
    (VASO-E023), higher pulsatility and more frequent retrograde diastolic flow
    near active sites (VASO-E022) — and a discrete electrical nidus whose
    amplitude moves with a purely cognitive stressor (VASO-E001, VASO-E002).
    Something is there, it is not obviously a scar, and mental state touches it.
    The neck is empty. Every step from \"abnormal local physiology at a tender
    point\" to \"microvascular smooth muscle held in the latch-bridge state\" is
    currently unevidenced. VASO-E016 grades both linchpins D. VASO-E019 finds
    that energetic cost — the whole economy argument — has never been measured
    in any arteriole. VASO-E020 is worse than absence: where the right molecular
    readout has been taken in pressurized skeletal-muscle arterioles, maintained
    constriction tracks maintained LC20 phosphorylation and Rho-kinase
    sensitization, not an economical dephosphorylated hold. VASO-E021 shows
    latch behaviour present in a parent artery and absent one branch order
    downstream, so \"vascular smooth muscle latches\" is not a generic property
    inheritable by microvessels. Meanwhile the vascular finding that does exist
    (VASO-E022) is at conduit calibre 1–2 cm away, is not a classifier
    (VASO-E024, VASO-E025), lacks pain-free controls (VASO-E026), and is given
    equal-standing mechanical explanations by its own authors (VASO-E027). The
    anchor phenomenon — objective seconds-scale release — has never been
    measured; VASO-E014 is proponent testimony and VASO-E035 is the inference,
    not the observation. Underneath everything sits the localization problem
    (VASO-E011, VASO-E029, VASO-E012): studies on both sides find their object
    by an examiner-dependent method. The crown (VASO-C021, VASO-C022, VASO-C143,
    VASO-C174) is untested prediction and, on VASO-E017's framing, conflates
    hysteresis with a write–store–read loop. Steelmanning the other way: none of
    this refutes the hypothesis. It is an extrapolation never checked where it
    matters, not a claim shown false, and the proponent has already relocated
    the vascular element (VASO-E044) in response to the audit — a live, revising
    programme rather than a fixed target. Hence unresolved rather than
    contradicted: VASO-R001 and VASO-R004 would decide it and neither has been
    run. Sensitivity: the single record whose removal would most change this
    reading is VASO-E016, the grade-D audit of both linchpins. The verdict
    survives without it, because VASO-E019 and VASO-E020 independently establish
    that the mechanism has not been observed — and looks different — in the
    compartment the hypothesis names, and no positive record anywhere
    demonstrates a latch at a tender point."
  steelman: Nothing in this assessment explains why a purely cognitive stressor
    writes to a specific millimetre-scale address in a nominally resting muscle
    while tissue a centimetre away stays quiet, and why a voluntary autonomic
    manoeuvre — the exhale — is reported to reverse that address in seconds.
    Conventional accounts (endplate dysfunction, guarding, central
    sensitization) offer no reason for spatial addressability and
    breath-sensitivity to co-occur, and the one system in the body that is both
    autonomically addressable at millimetre scale and breath-modulated is the
    microvasculature. The proponent is entitled to say that the reason no latch
    has been found at a tender point is that nobody has ever put a calibrated
    probe, an elastograph and a sensitive Doppler on a knot during a release —
    the experiment does not fail, it does not exist.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: No evidence record supports this claim; the two closest (VASO-E013,
      VASO-E038) are statements of the hypothesis by its originator and its
      relayer, and VASO-E017 argues explicitly that the latch literature does
      not address the write–store–read criteria that would turn physiological
      hysteresis into memory. The nearest empirical precedent offered is
      Physarum, an organism whose flow network is its body. The strongest
      consideration in its favour is that the read half now has a demonstrated
      mechanism (VASO-E005), so the proposal is not physically idle — merely
      untested. VASO-R005 is a well-specified decisive design, so this is
      unresolved rather than presently untestable.
    confidence: moderate
  - claimId: VASO-C020
    verdict: unresolved
    reasoning: "The claim bundles a negative (not damaged tissue) that the ledger
      treats sympathetically with a positive mechanistic attribution (latched
      microvascular smooth muscle) that has no direct evidence: VASO-E016 grades
      it D, VASO-E019 finds no arteriolar energetic measurement anywhere, and
      VASO-E020 — the only record bearing on the named compartment — finds
      sustained activation and Rho-kinase sensitization rather than an
      economical hold. The one supporting hemodynamic record (VASO-E027) is
      given near-zero diagnosticity by its own authors, who name skeletal-muscle
      contracture compressing the bed as an equally plausible cause. Against a
      stronger negative verdict: none of the arteriole studies withdrew the
      stimulus, so they could not have detected input-free persistence even if
      it exists, and the proponent has already moved the candidate vessel bed
      (VASO-E044). Leaning negative on the vascular-latch specification;
      unresolved overall."
    confidence: moderate
  - claimId: VASO-C174
