  - claimId: VASO-C010
    verdict: well_supported
    reasoning: "The claim states a capability, and the capability is established:
      VASO-E003 records the Hai–Murphy kinetic model reproducing high sustained
      stress at low myosin phosphorylation, and this is textbook smooth-muscle
      physiology (background prior explicitly acknowledged, since the ledger
      carries only one primary record). The important qualification is
      VASO-E021: latch behaviour is not generic across vascular smooth muscle,
      being present in rabbit femoral artery and absent in its own saphenous
      branch, attributed to motor-protein phenotype and phosphatase activity.
      That qualifies generality and matters greatly for VASO-C020, but not for
      this claim as worded. Verified in large tonic conduit preparations,
      largely at zero transmural pressure."
    confidence: high
  - claimId: VASO-C011
    verdict: provisionally_supported
    reasoning: "This is a conditional inference, and the inference is close to sound
      on general biophysical grounds: collagen remodelling and scar resolution
      operate over days to weeks, so anything reversing in seconds is a
      maintained state. VASO-E035 is the argument itself rather than an
      observation, and VASO-E030 (three cases, changes across visits after dry
      needling) speaks to a different timescale. The strongest opposing
      consideration is definitional slippage: fascial hyaluronan densification
