  synthesis: "The ledger has a clean tiered structure and the tiers do not share a
    fate. The enabling physiology is real: the latch-bridge is textbook
    smooth-muscle mechanics (VASO-E003), slow breathing does move autonomic
    indices (VASO-E009), hemodynamic state can modulate neurons on fast
    timescales (VASO-E005), and voluntary interoceptive attention can measurably
    damp a peripheral inflammatory response without an arousal change
    (VASO-E008). A tender point is also not nothing: blinded sonoelastography
    separates active, latent and palpably normal sites with AUC ~0.9, Doppler
    pulsatility differs at group level, and the local chemistry is acidic and
    mediator-rich (VASO-E006, VASO-E022, VASO-E023). Against the classic
    account, no lesion has been demonstrated and palpation has no validated
    reference standard (VASO-E010, VASO-E011) — which is why \"state, not scar\"
    is the strongest part of the featured hypothesis. But the featured
    hypothesis is not \"state, not scar\"; it is a specific attribution of that
    state to latched microvascular smooth muscle, plus a claim that such latches
    implement mental content. Both distinctive steps are currently unevidenced.
    VASO-E016 records grade D for each linchpin: no time-resolved imaging of a
    release event, and no study identifying a smooth-muscle latch at a tender
    point. Worse for the attribution, the one caliber-matched literature audit
    found that in pressurized skeletal-muscle arterioles maintained constriction
    tracks maintained LC20 phosphorylation rather than an economical
    dephosphorylated hold (VASO-E020), that no arteriole energetics measurement
    exists at all (VASO-E019), and that latch behaviour vanished one branch
    order downstream of a parent artery (VASO-E021). The mechanism is therefore
    borrowed across both vessel class and caliber, and where it has been looked
    for at the right caliber the readout pointed elsewhere. Steelmanning the
    other way: none of those three records was designed as a latch test, all
    held stimulus present, and the proponent's own second essay has already
    relocated the vascular element to cutaneous perforators (VASO-E044), a shift
    that the ledger has no evidence for or against. Steelmanning the
    conventional side: everything the case reports — spontaneous endplate
    activity, stress-sensitivity, stiffness, ischemic chemistry, satellite
    resolution — is compatible with endplate dysfunction plus skeletal guarding,
    and Simons 2002 shows the electrical signature tracks the endplate zone
    before it tracks the trigger point (VASO-E031, VASO-E032). The upper rungs —
    latches as memory, tanha as vascular tone, contemplative maps as
    interoceptive cartography — rest on proponent statements and an explicit
    argument that hysteresis is not write–store–read (VASO-E017). Weak support,
    entirely indirect, with one designed experiment (VASO-R001/R004) standing
    between the case and a real verdict."
  steelman: No conventional account has explained why a purely cognitive event
    with no movement writes to a millimeter-scale, spatially specific address in
    nominally resting tissue and why a voluntary exhale appears to erase it in
    seconds. That combination — somatotopic addressing, seconds-scale write and
    erase, no volitional motor route — is the signature of an autonomically
    innervated effector, and skeletal guarding requires alpha-motoneuron drive
    that should show as regional, not punctate, EMG. The ledger contains no
    record excluding that inference, and the metabolic discriminator that would
    settle it (a knot that is stiff, electrically active, and metabolically cold
    on FDG-PET, VASO-R013) has never been measured in either direction.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: The only records touching this claim are the originator's own
      statement of the hypothesis (VASO-E013), the essay's relay of it
      (VASO-E038), and an argument that latch hysteresis does not meet the
      write–store–read criteria biological memory requires (VASO-E017). Nothing
      in the ledger tests whether a maintained vascular state can bias later
      neural responses, and the closest demonstrated flow-network memory is in
      Physarum, an organism whose tubes are its own motile body. The strongest
      opposing consideration is that VASO-E005 shows hemodynamics modulating
      neurons instantaneously, which supplies a plausible read path and makes
      the weak form of the idea non-crazy; but instantaneous gain modulation is
      precisely what a memory claim must be distinguished from. The decisive
      experiment (VASO-R005) is designed and unrun.
    confidence: moderate
  - claimId: VASO-C020
    verdict: mixed
    reasoning: "The claim bundles a negative (not damaged or scarred tissue) with a
      positive attribution (latched microvascular smooth muscle causing
      ischemia, with secondary skeletal guarding), and the evidence splits along
      that seam. The negative half is reasonably supported: no lesion has been
      demonstrated, the construct's structural reading is contested (VASO-E010),
      and imaged properties change after intervention (VASO-E030). The positive
      half has no direct evidence at all (VASO-E016 grades it D) and is actively
      counter-indicated where it has been looked for — pressurized
      skeletal-muscle arterioles show maintained activation rather than an
      economical hold (VASO-E020), no arteriolar energetic measurement exists
      (VASO-E019), and latch behaviour was absent one branch order below a
      parent artery (VASO-E021). The strongest opposing consideration to my
      scepticism is that none of those three records was designed as a latch
      test and none withdrew its stimulus, so input-free persistence remains
      untested rather than excluded; VASO-E027 also shows the one Doppler
      primary treats compression by contracture as an equally good explanation
      of the same waveforms."
    confidence: moderate
  - claimId: VASO-C174
    verdict: unresolved
    reasoning: This three-element composite (vessel tone, hyaluronan collar, fascial
      tether) appears only in SRC-JHONG-2026A, an unverified, AI-generated,
      self-published proponent essay with no measurement attached, and the
      source record itself states that nothing may lean on it until it is read.
      As a hypothesis it is arguably more defensible than the single-latch
      account, because it does not require the arteriole compartment that
      VASO-E020 embarrasses, and it predicts distinguishable timescales. But no
      evidence record in the ledger bears on any of the three elements at a
      tender point, and VASO-C077 (densification reversibility) is itself
      unanchored. The strongest opposing consideration is that a three-mechanism
      account is correspondingly harder to falsify and risks absorbing any
      result.
    confidence: low
  - claimId: VASO-C022
    verdict: unresolved
    reasoning: "The single record is VASO-E039, an uncited assertion in the
      proponent essay that traditional maps place knots on the midline and limbs
      where ganglia, sympathetic chains and dense fascia lie, with no coding
      rule and no chance baseline. Post-hoc anatomical resemblance is cheap:
      dense fascia, neurovascular perforators, ganglia and bony prominences are
      widely distributed, so almost any traditional map will overlap something.
      The strongest consideration in the claim's favour is that the essay's
      separate reports of acupoint–perforator coincidence figures (VASO-C123,
      VASO-C157) would, if the primaries survive retrieval, give the convergence
      argument a quantitative footing. Until VASO-R006's blinded coding is run
      this is untested rather than supported or refuted."
    confidence: moderate
  - claimId: VASO-C010
    verdict: well_supported
    reasoning: "VASO-E003 records the Hai–Murphy latch-bridge model and the
      experimental observation it was built to explain: high sustained stress at
      low myosin phosphorylation, i.e. economical force maintenance. This is
      heavily cited, textbook smooth-muscle physiology, and my verdict here does
      lean partly on that general background as well as on the record. Two
      caveats keep it short of established as stated: VASO-E021 shows the
      behaviour is not generic — present in rabbit femoral artery and absent in
      its own saphenous branch, attributed to motor-protein phenotype and
      phosphatase activity — and the claim's phrasing \"after activating signals
      subside\" is stronger than the literature, which describes force held at
      reduced, not absent, activation (VASO-E034 flags exactly this
      overstatement)."
    confidence: high
  - claimId: VASO-C011
    verdict: provisionally_supported
    reasoning: "As a conditional, the inference is sound on well-established
      grounds: collagen remodelling and scar reorganisation operate over days to
      weeks, so an objectively verified seconds-scale local transition cannot be
      structural change. The weakness is not the logic but the antecedent —
      VASO-E016 records that no synchronised time-resolved imaging of a release
      event exists, and VASO-E035 is the argument rather than a measurement. The
      strongest opposing consideration is that \"actively maintained
      physiological state\" is under-specified and does no discriminating work:
      skeletal motor guarding, viscoelastic creep under sustained load, fascial
      hyaluronan viscosity (VASO-C077), and nociceptive gating all satisfy the
      conditional without any vascular latch, and VASO-E030's imaged changes
      occurred over visits, not seconds."
    confidence: moderate
  - claimId: VASO-C077
    verdict: unresolved
    reasoning: "No evidence record in the ledger addresses fascial densification;
      the claim is anchored only to a line in the proponent essay, and the
      primary Stecco literature it invokes has not been retrieved (VASO-R008
      exists precisely to do so). General background — hyaluronan viscosity is
      shear- and temperature-dependent — makes reversibility under pressure and
      warmth plausible, and I flag that this leniency is a prior, not a record.
      The strongest opposing consideration is that plausible reversibility says
      nothing about timescale, and the timescale is the whole issue: if
      densification reverses only over minutes to hours it cannot compete with
      the vascular account for the seconds-scale anchor phenomenon."
    confidence: low
  - claimId: VASO-C012
    verdict: well_supported
    reasoning: 'VASO-E004 establishes only that the hemo-neural hypothesis was
      proposed, but VASO-E005 supplies a direct causal demonstration:
      physiological blood-pressure pulsations modulating central neuronal
      activity through mechanosensitive ion channels in rat preparations and
      awake animals. The claim as stated is deliberately modest ("can
      modulate"), and it is also consistent with uncontroversial background such
      as ischemic suppression of firing. The strongest opposing consideration is
      compartment and species mismatch — brain tissue in rats, not human
      peripheral tissue — and that a demonstration of instantaneous
      mechanosensation licenses nothing about persistent or content-specific
      modulation, which is where the case actually needs it (see VASO-C021).'
    confidence: high
  - claimId: VASO-C013
    verdict: well_supported
    reasoning: "VASO-E009 records a systematic review finding reproducible increases
      in respiratory sinus arrhythmia, heart-rate variability and related
      autonomic and central measures with slow breathing in healthy humans. The
      strongest opposing consideration is interpretive rather than empirical:
      RSA and HRV rise during slow breathing partly as a mechanical consequence
      of respiratory phase and tidal volume, so \"shifts autonomic balance
      toward parasympathetic dominance\" reads a tonic state change off indices
      that are partly entrained artefact — and the claim's specific emphasis on
      extended exhalation is less well documented than slow breathing in
      general. The records also contain no local tissue endpoint, which matters
      for the case but not for this claim."
    confidence: high
  - claimId: VASO-C030
    verdict: well_supported
    reasoning: VASO-E011 records a systematic review concluding that manual
      examination for trigger points has not been demonstrated reliable or
      valid, in part because no accepted reference standard exists; VASO-E010
