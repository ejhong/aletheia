      a vascular latch."
    confidence: moderate
  - claimId: VASO-C005
    verdict: well_supported
    reasoning: "Three independent-ish strands converge: acidic, mediator-rich
      microdialysis chemistry at active points (VASO-E006), a systematic review
      of 33 imaging studies finding biomechanical and blood-flow parameters can
      distinguish active and latent points from healthy tissue (VASO-E007), and
      blinded vibration sonoelastography separating active, latent and normal
      sites with AUC 0.8–0.9 plus a group-level pulsatility difference
      (VASO-E022, VASO-E023). The strongest opposing considerations are serious
      but do not overturn the claim as stated: sites are selected by palpation,
      so the contrast presupposes the classification; Ballyns had no pain-free
      control group and its \"normal\" sites sat in symptomatic muscle
      (VASO-E026); the Doppler indices do not classify individual sites and
      resistivity index shows no difference at all (VASO-E024, VASO-E025); and
      Shah's mediators were elevated remote from the points as well as at them."
    confidence: moderate
  - claimId: VASO-C006
    verdict: provisionally_supported
    reasoning: "VASO-E008 is the strongest single record in the ledger by design
      quality: preregistered within-subject experiments, 57 volunteers, two
      cohorts, ~1.5- fold smaller and faster-resolving wheal and flare under
      internal attention in about 90% of participants, with skin conductance,
      heart rate, temperature and anxiety unchanged, plus a lidocaine dissection
      separating sensory and vagal routes. That directly instantiates the claim,
      including its \"without change in sympathetic arousal\" clause. It falls
      short of well_supported only because it is one lab, published weeks before
      this assessment, with molecular mediators unmeasured by the authors' own
      caution and no independent replication in the ledger. The strongest
      opposing consideration for the wider case, noted in VASO-E041, is that the
      demonstrated route is vagal immune regulation over ~20 minutes, not
      seconds-scale local unlatching."
    confidence: moderate
  - claimId: VASO-C031
    verdict: provisionally_supported
    reasoning: "VASO-E022 quotes the source directly: vessels near active sites had
