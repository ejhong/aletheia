    confidence: low
  - claimId: VASO-C073
    verdict: unresolved
    reasoning: "This is a preregistered-style ordering prediction — perfusion rise
      leading stiffness drop — with no data on either side; VASO-E016 records
      that no synchronised time-resolved imaging study of a release event was
      located. I rate it unresolved rather than untestable because VASO-R001 and
      VASO-R016 specify feasible rigs, and VASO-C055 asserts the co-registration
