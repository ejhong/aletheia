  - claimId: VASO-C143
    verdict: unresolved
    reasoning: No evidence record in the ledger bears on this reinterpretation; it
      is a mechanistic proposal in an unverified proponent essay that the
      stress-evoked trigger-point signal is a regional sympathetic
      vasoconstriction written to a skin territory. Its virtue is that it is
      sharply falsifiable — a localised fall in skin perfusion over the tender
      point and not over control skin during mental arithmetic — and cheap to
      test at the surface (VASO-R016). Against it, the phenomenon it
      reinterprets is needle EMG in muscle, and cutaneous vasoconstrictor
      responses to mental stress are ordinarily regional to whole-limb rather
      than punctate, so the claim needs an addressing specificity that
      sympathetic skin physiology is not generally known to provide.
    confidence: low
  - claimId: VASO-C004
    verdict: weakly_supported
    reasoning: The only record is VASO-E014, first-person and practitioner testimony
      from the hypothesis's own proponent, in an essay whose text was
      AI-generated at his direction. For a claim about a *felt* release,
      testimony is the right kind of evidence, and the phenomenon is reported
      widely enough in bodywork practice that dismissing it would be unwarranted
      — but expectation, attention redirection, pressure-induced analgesia and
      post-hoc narrative cannot be separated from it in a single unblinded
      stream of reports. The strongest opposing consideration is that nothing
      distinguishes a felt release from a change in nociceptive gating with no
      tissue event at all, which is exactly the possibility VASO-R001 lists as
      its falsification criterion.
