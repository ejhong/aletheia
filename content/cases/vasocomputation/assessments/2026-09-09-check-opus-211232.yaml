      acute cervical pain. That is a real, blinded-sonographer measurement
      matching the claim's careful scope. The strongest opposing considerations
      are that this is a single study from the same NIH lineage as VASO-E006,
      that the source's own ROC analysis found pulsatility index a poor
      classifier of site type because of large variance (VASO-E024, VASO-E025),
