  synthesis: "The ledger's ladder is inverted: the mechanism rung — latch physiology (VASO-E003), the slow-breathing autonomic shift (VASO-E009), vascular-to-neural mechanosensation in rat brain (VASO-E005) — is better evidenced than either the observations beneath it or the attributions above it, and every one of those mechanism records is credible without being diagnostic, because conventional physiology predicts each of them too. The anchor observation, a seconds-scale release of a tender point on an exhale (VASO-C004), is supported only by proponent testimony (VASO-E014): real evidence for a felt event, none for an objective one, which VASO-E016 records has never been imaged. Where the thesis needs the latch, the record points the other way: pressurized skeletal-muscle arterioles show maintained or rising myosin phosphorylation with constriction rather than an economical dephosphorylated hold (VASO-E020), no arteriole energetic measurement exists so the cheap-hold argument rests on conduit arteries (VASO-E019), and latch behaviour vanished one branch order downstream in the only paired vessel comparison (VASO-E021). The observational base is softened by the localization problem (VASO-E010, VASO-E011, VASO-E012), though the instrumented differences (VASO-E006, VASO-E007) and the stress-reactive millimeter-scale electrical nidus (VASO-E001, VASO-E002) survive it and are what the conventional account must still explain. The memory attribution (VASO-C021) fails the write–store–read test (VASO-E017); the contemplative attribution (VASO-C022) has no record at all. Sensitivity: no single removal flips the case verdict, because each direction lacks decisive evidence independently. The record whose removal would most change the shape of the case is VASO-E020 — without it VASO-C020 would revert from 'examined in its named compartment and mismatched' to merely 'untested', and the arteriole gap would look like neglect rather than a lean. VASO-E016 remains the single most important undermining record, but the verdict survives its removal because VASO-E019–E021 independently show the mechanism is extrapolated across vessel class and caliber rather than observed. Unresolved is a finding, not a default: the decisive experiment (VASO-R001) is specified, cheap and unrun, and both outcomes remain live."
  steelman: The classic energy-crisis account of trigger points has never explained how a skeletal-muscle fiber could remain near-maximally contracted for years without exhausting itself, and the latch is the one known physiological device that holds tension for almost nothing — the puzzle the conventional account cannot dissolve is exactly the puzzle a latch would. The electrical nidus is confined to one to two millimeters and is selectively turned up by mental arithmetic while surrounding muscle stays quiet, which is awkward for a diffuse guarding story and natural for an addressable, autonomically maintained element. Voluntary attention has now been shown, in preregistered human experiments, to regulate a peripheral vascular bed at a chosen site with no change in arousal — the write channel the synthesis needs, demonstrated. Every arteriole study reporting maintained activation held its stimulus present throughout, so none could have detected a state that persists after input stops, which is the only state a knot requires; and the latch-competent versus latch-incompetent motor-protein phenotype has never been surveyed in skeletal-muscle arterioles under chronic sympathetic drive, the condition the hypothesis posits. Finally, the hypothesis makes a distinctive, falsifiable timing prediction that neither guarding nor densification makes — perfusion rises before stiffness falls — and it can be tested for the cost of a small grant. None of this shows that knots are latches; it is the best reason the assessment cannot yet be closed against them.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: "The only records are VASO-E013, the originator's own statement of the hypothesis (self-published, no experimental validation), and VASO-E017, which qualifies it: biological memory requires state dependent on prior input, later readable, and discriminating between prior inputs, and the latch literature addresses none of these. The claim depends on VASO-C010 (real capability, not generic) and VASO-C012 (instantaneous modulation demonstrated, storage not). No record shows content written to and read from vascular state in any mammal."
    confidence: moderate
    treatment:
      plainLanguage: The idea that the tension in your blood-vessel walls is part of how you think and hold expectations — that the felt grip of craving has a vascular address.
      importance: headline
      diagnosticity: indeterminate
      diagnosticitySummary: No experiment separating vascular memory from vascular plumbing has been run; the claim currently cannot discriminate between accounts because nothing tests it.
      strongestObjection: Hysteresis is not memory. A thermostat's state depends on its history, yet it stores no content; nothing in the latch literature shows different prior inputs producing different, later-readable vascular states.
      whatWouldChangeOurMind:
        - "A positive result in the decisive animal experiment (VASO-R005): different induced vascular states biasing later neural responses under identical stimulation with oxygenation and metabolism clamped."
        - A clean negative in the same design — vascular manipulation affecting neural gain only through instantaneous perfusion — would collapse the claim to ordinary neurovascular physiology.
        - Any peer-reviewed demonstration of write–store–read in a mammalian vascular bed.
  - claimId: VASO-C020
    verdict: unresolved
    reasoning: No record supports the claim directly; VASO-E013 states it. VASO-E016 (strong) records that both linchpins — an objective seconds-scale release and a smooth-muscle latch at a trigger point — have no located evidence in either direction. VASO-E019 shows the cheap-hold argument rests on conduit arteries, never measured in any arteriole. VASO-E020 shows that in the pressurized skeletal-muscle arterioles that have been measured, constriction is accompanied by maintained or rising phosphorylation — maintained activation, not a latch — though none was designed as a latch test and all held stimulus present. Indirect support from VASO-C002, VASO-C003 and VASO-C005 fits the guarding account equally. The direct record leans against; nothing is decisive.
    confidence: moderate
    treatment:
      plainLanguage: A knot is a tiny artery clamped shut by its own muscle in a low-energy lock, starving its neighborhood and making the nerves there sore — not damaged or scarred tissue.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself; establishing or excluding a latch at a tender point would decide the case between the vascular, guarding and densification accounts.
      strongestObjection: The compartment the claim names has been examined with the right molecular readout, and what was found there points to a different mechanism for holding constriction; meanwhile the release it must explain has never been shown to be objective.
      whatWouldChangeOurMind:
        - A time-locked imaged release with perfusion rising before stiffness falls, at palpated but not sham sites (VASO-R001).
        - A pressurized skeletal-muscle arteriole holding constriction after stimulus withdrawal with falling phosphorylation and low energetic cost (VASO-R004).
        - Felt releases without local transitions, or densification reversing in seconds with no perfusion change (VASO-R001, VASO-R008), would move the claim toward contradicted.
