    level: high
    reason: The central crux is decidable by a single small-grant experiment that has never been run, both of whose outcomes would be decisive; two cheap desk items would sharpen its discriminating prediction; and the phenomenon is ubiquitous, clinically consequential and, on the ledger's own census finding, wholly uncounted.
