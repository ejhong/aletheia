caseAssessment:
  verdict: unresolved
  whatIsClaimed: "Muscle knots are maintained vascular-autonomic states rather than structural lesions: microvascular smooth muscle held in the latch-bridge state, throttling local blood flow and sensitizing local nerve endings, with secondary skeletal-muscle guarding layered on top — writable by stress, readable as stiffness and ache, releasable by sustained pressure combined with slow exhalation. More broadly, vascular tension functions as a memory element participating in mental life, the physical implementation of what contemplative traditions call clinging, and the traditional anatomies of knots and channels are first-person maps of the same system."
  whereDisagreementLives: "Not over whether people feel tender spots, and not over whether smooth muscle can latch — both are common ground. The crux is whether anything objective happens locally when a knot 'releases' on a slow exhale: does stiffness fall and perfusion rise within seconds, time-locked to the breath, beyond what pressure alone, expectation and generalized relaxation produce — and, if it does, is the releasing element vascular smooth muscle rather than skeletal-muscle guarding or fascial densification? Beneath that sits a second dispute: the latch has been demonstrated in large conduit arteries, and where pressurized skeletal-muscle arterioles have been measured they show maintained activation, not a latch signature. And beneath that, the skeptical literature disputes whether the trigger point is reliably identifiable at all."
  whatWouldSettleIt: "A time-locked imaging experiment: ultrafast shear-wave elastography and sensitive microvascular Doppler over a palpated knot during breath-assisted release, with sites fixed in advance by blinded examiners, calibrated pressure through an instrumented probe, factorial controls (pressure with normal breathing, slow breathing without pressure, sham sites, failed attempts), a button press at each felt release, and a preregistered prediction that stiffness drops and perfusion rises together within seconds of the exhale, exceeding all controls, with perfusion leading stiffness. Felt releases without reproducible local transitions, or equal transitions at shams, would return the knot to the guarding-and-interpretation account. Companion studies decide the mechanism: a paired-caliber, pressurized arteriole preparation with a stimulus-withdrawal phase testing whether latch capacity persists into skeletal-muscle arterioles, and a retrieved densification timescale that tells the keystone experiment whether a stiffness drop without perfusion change is a live alternative."
  bestConventionalExplanation: "Tenderness and its relief need no vascular memory. Tender points are neuromuscular guarding — sustained low-level motor drive and endplate activity in skeletal muscle, centrally maintained and stress-sensitive — possibly with altered fascial gliding from hyaluronan densification between fascial layers. The acidic, mediator-rich milieu follows from compression under guarding as readily as from a throttled arteriole. The felt release is expectation and attention doing what they demonstrably do, riding the genuine but global parasympathetic shift of slow breathing, with pressure altering local sensation; any rapid mechanical change is densification thinning or guarding switching off, not a vessel unlatching. Nothing is stored locally: the brain stops guarding, regionally or globally, and interpretation supplies the rest. A stricter version adds that manual trigger-point identification has poor examiner reliability and no validated reference standard, so part of the observation base may be an artifact of training and expectation. This account requires no new physiology, and the only direct arteriole measurements available fit it better than they fit a latch. Its gap is the set of localized objective findings — spontaneous electrical activity confined to a millimeter-scale nidus that a mental task selectively raises, abnormal local chemistry and blood flow — that a purely central or interpretive story must still account for."
  components:
    - label: "The phenomenon: tender points and their instrumented differences (C001, C005, C030)"
      state: provisionally_supported
      note: Instrumented differences at trigger-point sites (acidic mediator-rich milieu, imaging-distinguishable stiffness and flow) survive systematic review with caveats, but manual localization is unreliable, no reference standard exists, and the mediator elevation was not purely local. The observation base is real but softer than it feels.
    - label: "The neural signature: an electrically maintained, stress-reactive nidus (C002, C003)"
      state: provisionally_supported
      note: One lineage, two small 1990s studies, never replicated with modern instrumentation, no vascular endpoint. What they show — a discrete site maintained by ongoing activity and dialed up by a purely mental task — is the strongest evidence for 'state' and neutral between vascular and neuromuscular accounts.
    - label: "The autonomic lever: breath and attention reach the periphery (C013, C006)"
      state: well_supported
      note: Slow breathing's parasympathetic shift is well documented globally; voluntary attention has been shown to regulate a peripheral inflammatory response at a chosen site without arousal. Neither record touches a tender point or a seconds timescale.
    - label: The latch as physiology (C010)
      state: well_supported
      note: "Textbook smooth-muscle mechanism, but not generic across vascular smooth muscle: present in a parent artery and absent one branch order later in the only paired comparison, with motor-protein phenotype as the deciding variable."
    - label: "The latch at the knot: state not scar, and vascular in particular (C020, C011, C004)"
      state: unresolved
      note: The felt release is testimony; no objective release has been imaged; no latch has been identified at a tender point; pressurized skeletal-muscle arterioles show maintained activation rather than the latch signature; arteriole energetic cost has never been measured. Direct records lean against, but none was a latch test and none imaged a release.
    - label: Vasocomputation and the contemplative maps (C012, C021, C022)
      state: unresolved
      note: The read path (vascular state modulating neurons) has a demonstrated mechanism in rat brain as instantaneous modulation; the memory attribution meets no write–store–read criterion and the contemplative-map attribution has no evidence record at all.
