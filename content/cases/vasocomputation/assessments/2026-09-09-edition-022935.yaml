  - claimId: VASO-C010
    verdict: well_supported
    reasoning: "VASO-E003 (strong): Hai and Murphy's kinetic model reproduces the observed high sustained stress at low myosin phosphorylation — economical force maintenance after activation subsides — in vascular and visceral smooth-muscle preparations, and is textbook physiology. VASO-E021 qualifies without contradicting: in the one paired vessel comparison, the femoral artery latched and its saphenous branch did not, so the capability is real but not generic across vascular smooth muscle. The claim states a capability and the capability is demonstrated."
    confidence: high
    treatment:
      plainLanguage: The muscle in artery walls can grip and then lock, holding tension cheaply long after the signal that told it to squeeze has faded.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Conventional physiology predicts the latch just as well as the featured hypothesis does; that the mechanism exists says nothing about whether it is engaged at a tender point.
      strongestObjection: Latch behaviour depends on vessel type and motor-protein phenotype and disappeared one branch order downstream in the only comparison; extending it to resistance arterioles is an extrapolation.
      whatWouldChangeOurMind:
        - A skeletal-muscle arteriole showing sustained constriction after stimulus withdrawal with falling phosphorylation would extend the claim's reach to the caliber the case needs.
        - A survey finding the non-latching motor-protein phenotype throughout skeletal-muscle arterioles would confine the capability to conduit vessels.
  - claimId: VASO-C011
    verdict: provisionally_supported
    reasoning: No evidence record is anchored to this claim; the verdict leans on physiological priors — structural remodeling takes days to weeks, so a change completing within seconds must be a change of maintained state. The inference is conditional and sound, but its antecedent (an objective seconds-scale release, VASO-C004) is unmeasured per VASO-E016, and its consequent distinguishes state from structure without distinguishing vascular from neuromuscular or fascial states.
    confidence: moderate
    treatment:
      plainLanguage: If a knot really does change in a few seconds, then it was something the body was actively doing, not scar tissue — scar does not dissolve on an exhale.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Decisive against the 'scar' account if its premise is met; neutral among the state-level accounts (latch, guarding, densification).
      strongestObjection: The premise is exactly what has never been measured, and 'state, not structure' is compatible with guarding switching off or fascial hyaluronan thinning, neither of which involves a vessel.
      whatWouldChangeOurMind:
        - Imaging that shows or fails to show an objective seconds-scale change at a felt release (VASO-R001).
        - A retrieved densification timescale showing seconds-scale reversal under pressure (VASO-R008), which would preserve the claim but sever its link to the vascular attribution.
  - claimId: VASO-C012
    verdict: provisionally_supported
    reasoning: VASO-E004 is a hypothesis paper (context only). VASO-E005 (strong) demonstrates that physiological blood-pressure pulsations modulate central neuronal activity via mechanosensitive ion channels in rat preparations and awake animals. The claim as stated — local vascular state can modulate nearby neurons — is demonstrated in one tissue, one species, as instantaneous mechanosensation, not as storage or content-specific readout and not in the human periphery.
    confidence: moderate
    treatment:
      plainLanguage: Blood does not just feed neurons; changes in the vessels can nudge what nearby neurons do.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Necessary for the vasocomputation read path but far from sufficient; modulation is not memory, and nothing here concerns tender points.
      strongestObjection: "Rat brain, instantaneous effects: the demonstration is of a fast mechanical nudge, not of a stored state read back later, and no peripheral analogue has been measured."
      whatWouldChangeOurMind:
        - A peripheral demonstration that sensory neurons respond to local vessel caliber in a tissue relevant to tender points.
        - The decisive experiment (VASO-R005) showing vascular state carries a trace — or showing it acts only through instantaneous perfusion.
