  - claimId: VASO-C010
    verdict: well_supported
    reasoning: "Hai and Murphy's latch-bridge model (VASO-E003, strong) reproduces the textbook observation of high sustained stress at low myosin phosphorylation in smooth-muscle preparations. The evidence map qualifies its scope (VASO-E021): latch behaviour was present in a rabbit femoral artery and absent in its own saphenous branch, so the capability is real but not generic across vascular smooth muscle, and nobody has followed the comparison into arterioles."
    confidence: high
    treatment:
      plainLanguage: The muscle in blood-vessel walls can lock into a low-energy grip and keep holding after the signal that told it to contract has gone.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Conventional physiology predicts this too; the latch's existence in arteries decides nothing about knots unless it is shown in skeletal-muscle microvessels under stimulus withdrawal.
      strongestObjection: The one vessel-versus-branch comparison found latch behaviour vanishing one branch order downstream, attributed to motor-protein isoforms, so the capability cannot be assumed in the resistance vessels a knot would need.
      whatWouldChangeOurMind:
        - A paired-caliber study showing latch capacity persisting into skeletal-muscle arterioles would raise the claim's reach; the same study showing the non-latching phenotype throughout would confine the claim to conduit arteries.
