  synthesis: "The ledger's ladder is inverted: the mechanism rung — latch physiology (VASO-E003), the slow-breathing autonomic shift (VASO-E009), vascular-to-neural mechanosensation in rat brain (VASO-E005) — is better evidenced than either the observations beneath it or the attributions above it, and every one of those records is credible without being diagnostic, because conventional physiology predicts each of them too. The observation base is now anchored in two primaries. Ballyns 2011 gives the stiffness component of VASO-C005 its first blinded-sonographer support (VASO-E023: graded stiff area 0.57/0.36/0.17 cm², AUC 0.9) and a group-level Doppler difference (VASO-E022), but the same source shows the vascular signature is partial — retrograde flow at 31% of palpably normal sites, a null resistivity index, a pulsatility index that cannot classify sites, no pain-free controls, and vessels of conduit caliber 1–2 cm from the point (VASO-E024, VASO-E025, VASO-E026), with the authors themselves listing contracture compression as a co-equal cause of the flow pattern (VASO-E027, which the ledger's second reader rightly notes reads as qualification rather than support). Simons 2002 (VASO-E031, VASO-E032) turns the electrical nidus from an exclusive island into a prevalence gradient that tracks the endplate zone first, which lowers the diagnosticity of VASO-C002 and exposes the control-site problem in VASO-C003. The anchor observation, a seconds-scale release on an exhale (VASO-C004), is supported only by proponent testimony (VASO-E014); the only imaged change in a trigger point is over visits after needling (VASO-E030). Where the thesis needs the latch, the record points the other way: pressurized skeletal-muscle arterioles show maintained or rising phosphorylation (VASO-E020), no arteriole energetic measurement exists (VASO-E019), and latch behaviour vanished one branch order downstream in the only paired comparison (VASO-E021). The memory attribution (VASO-C021) fails the write–store–read test (VASO-E017); the contemplative attribution (VASO-C022) has no record at all. Sensitivity: no single removal flips the case verdict, because each direction lacks decisive evidence independently. The record whose removal would most change the shape of the case remains VASO-E020 — without it VASO-C020 reverts from 'examined in its named compartment and mismatched' to merely 'untested'. VASO-E016 remains the single most important undermining record; VASO-E031 is the record that most changed the reading of the observations, moving the nidus from an addressable element toward a property of the endplate zone. Unresolved is a finding, not a default: the decisive experiment (VASO-R001) is specified, cheap and unrun, and both outcomes remain live."
  steelman: The classic energy-crisis account of trigger points has never explained how a skeletal-muscle fiber could remain near-maximally contracted for years without exhausting itself, and the latch is the one known physiological device that holds tension for almost nothing — the puzzle the conventional account cannot dissolve is exactly the puzzle a latch would. The electrical signature is confined to one to two millimeters and is selectively turned up by mental arithmetic while surrounding muscle stays quiet; that it also appears at four of eleven other endplate-zone sites does not explain why it is present at eleven of eleven trigger points, nor why a stressor picks the tender one. Blinded sonographers find a graded stiff region at exactly the sites examiners palpate, and the arteries nearby behave differently — the footprint a throttled bed would leave, whatever else could leave it. Voluntary attention has now been shown, in preregistered human experiments, to regulate a peripheral vascular bed at a chosen site with no change in arousal — the write channel the synthesis needs, demonstrated. Every arteriole study reporting maintained activation held its stimulus present throughout, so none could have detected a state that persists after input stops, which is the only state a knot requires; and the latch-competent versus latch-incompetent motor-protein phenotype has never been surveyed in skeletal-muscle arterioles under chronic sympathetic drive, the condition the hypothesis posits. Finally, the hypothesis makes a distinctive, falsifiable timing prediction that neither guarding nor densification makes — perfusion rises before stiffness falls — and it can be tested for the cost of a small grant. None of this shows that knots are latches; it is the best reason the assessment cannot yet be closed against them.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: "The only records are the originator's own statement of the program (VASO-E013, context, self-published, no experimental validation) and the critical report's argument that hysteresis is not memory (VASO-E017): biological memory requires input-dependent state, later readout, and discrimination between prior inputs, none of which the latch literature addresses. The read path exists as instantaneous modulation (VASO-E005) and a write channel exists at the scale of minutes (VASO-E008), but no record shows vascular state storing anything and reading it back. Nothing contradicts the claim either; it is untested rather than disconfirmed."
    confidence: low
    treatment:
      plainLanguage: The idea that the tension in your blood vessels is part of how you think and hold expectations — that clinging has a physical location in vessel walls.
      importance: headline
      diagnosticity: indeterminate
      diagnosticitySummary: No evidence record tests it, so it cannot presently move the case in either direction; if the animal experiment (VASO-R005) showed vascular state biasing later neural responses with oxygenation clamped, it would become the most diagnostic claim in the ledger.
      strongestObjection: A latch is a kinetic trap with hysteresis, like a thermostat; nothing shows it stores content-specific information that can be read out later, and the only living flow network shown to do so is a slime mold whose tubes are its own body.
      whatWouldChangeOurMind:
        - An animal preparation in which different induced vascular states produce reliably different later neural response distributions under identical stimulation, with metabolic variables clamped.
        - A clean negative in the same design, showing vascular manipulation affects neural gain only through instantaneous perfusion — which would collapse the claim to ordinary neurovascular physiology.
  - claimId: VASO-C020
    verdict: unresolved
    reasoning: The critical report's audit finds no direct evidence for either linchpin — objective seconds-scale release, or vascular smooth muscle as the releasing element (VASO-E016, strong undermining). The case's own evidence map adds that no arteriole energetic measurement exists (VASO-E019), that pressurized skeletal-muscle arterioles show maintained or rising phosphorylation rather than a latch signature (VASO-E020), and that latch behaviour vanished one branch order downstream in the only paired comparison (VASO-E021). Ballyns 2011 (VASO-E027) records high-resistance flow near trigger points, which the claim predicts, but the authors name contracture compression, inflammation and transducer pressure as co-equal causes and the vessels are conduit-scale; it adds nothing that separates the accounts. The originator's statement (VASO-E013) is context. The verdict is unresolved with the lean against; 'contradicted' would overread studies that never withdrew their stimulus.
    confidence: moderate
    treatment:
      plainLanguage: A knot is a small blood vessel's muscle stuck in its low-energy lock, starving the tissue around it, with ordinary muscle tensing on top — not injured or scarred tissue.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the case's central attribution; demonstrating a smooth-muscle latch at a tender point, or a perfusion-first release signature, would decide the thesis against guarding and densification, and excluding it would collapse the featured hypothesis to the conventional account.
      strongestObjection: Where the arteriole has actually been measured with the right molecular readout, maintained constriction comes with maintained activation, not an economical dephosphorylated hold; the mechanism is borrowed from conduit arteries and has never been observed in the tissue it is supposed to explain.
      whatWouldChangeOurMind:
        - Time-resolved elastography and Doppler showing perfusion rising before stiffness falls at palpated sites, not shams, within seconds of an exhale.
        - A pressurized skeletal-muscle arteriole holding constriction after stimulus withdrawal with falling phosphorylation and measured low energetic cost.
        - A paired-caliber study finding the non-latching motor-protein phenotype throughout skeletal-muscle arterioles, or fascial densification shown to reverse in seconds without perfusion change.
