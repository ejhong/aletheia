  - claimId: VASO-C011
    verdict: provisionally_supported
    reasoning: No evidence record supports the inference directly; the grade rests on the physiological prior that tissue remodeling takes days to weeks, so a change completing in seconds must be a change of maintained state. The only imaged change in a trigger point the ledger holds (VASO-E030, context) is over visits after dry needling in three cases — it shows the measures move, not that they move in seconds. The premise, that a felt release corresponds to an objective local event, is untested (VASO-E016).
    confidence: moderate
    treatment:
      plainLanguage: If a knot really does let go in a few seconds, it must be something the body was actively doing, not damaged tissue — scar does not release on an exhale.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: "Decides state versus structure but not vascular versus guarding versus densification: sustained motor guarding and fascial hyaluronan thinning are both states, so a fast objective release would engage this claim without favoring the latch."
      strongestObjection: The conditional has never been triggered — no time-resolved measurement shows a tender point objectively releasing in seconds — and 'state' includes several non-vascular candidates.
      whatWouldChangeOurMind:
        - Time-resolved imaging showing a stiffness or perfusion transition within seconds of a felt release, which would satisfy the antecedent.
        - Retrieval of the reported 2025 runners' elastography study (VASO-R012) showing palpated points undetectable minutes after pressure alone — a first objective fast-release record, though at minutes rather than seconds.
        - A densification timescale in seconds, which would keep the claim true while removing the vascular reading's exclusivity.
  - claimId: VASO-C012
    verdict: provisionally_supported
    reasoning: Moore and Cao's 2008 paper states the hypothesis without demonstrating it (VASO-E004, context). Jammal Salameh and colleagues (VASO-E005, strong) show blood-pressure pulsations modulating central neuronal activity through mechanosensitive ion channels in rat preparations and awake animals — a demonstrated mechanism for the vascular-to-neural direction, but instantaneous modulation in brain, not storage and not the human periphery.
    confidence: moderate
    treatment:
      plainLanguage: Blood flow and vessel pressure can change what nearby nerve cells do, not just feed them.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Fast mechanosensitive modulation is compatible with every account of knots; it becomes diagnostic only if vascular state is shown to carry a trace that biases later neural responses (VASO-R005).
      strongestObjection: The demonstration is of moment-to-moment modulation in rat brain; the extension to peripheral sensory endings and to stored content is argument, not measurement.
      whatWouldChangeOurMind:
        - Demonstration of mechanosensitive vascular-to-neural modulation in peripheral sensory ganglia or muscle afferents.
        - An animal experiment showing induced vascular states bias later neural responses under identical stimulation, or its clean negative.
  - claimId: VASO-C013
    verdict: well_supported
    reasoning: A systematic review of slow-breathing studies in healthy humans (VASO-E009, strong) finds reproducible increases in heart-rate variability and respiratory sinus arrhythmia consistent with a shift toward parasympathetic dominance. The measurements are global cardiovascular indices; no local tissue or tender-point endpoint exists.
    confidence: high
    treatment:
      plainLanguage: Breathing slowly, especially with long exhales, reliably calms the body's automatic nervous system.
