    verdict: well_supported
    reasoning: "A systematic review of examination-reliability studies (VASO-E011, strong) concludes manual trigger-point examination has not been shown reliable or valid and lacks an accepted reference standard; the Quintner–Bove–Cohen critique (VASO-E010, moderate) argues the construct is circular, and drew a rebuttal. Proponents concede the point in their own discussion section (VASO-E029, weak): palpation remains the reference standard and is subjective."
    confidence: high
    treatment:
      plainLanguage: Experts cannot reliably agree where a trigger point is, there is no gold-standard test for one, and researchers argue about whether the concept is sound.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: It softens the observation base for every account and forces any decisive experiment to solve blinded, instrumented localization first; it does not itself favor guarding over latch, since a vascular mechanism is compatible with the critics' 'it isn't the muscle' instinct.
      strongestObjection: The review assesses manual examination, not instrumented detection; blinded sonoelastography now separates palpated site classes with AUC 0.9, so imaging-anchored localization may escape the problem.
      whatWouldChangeOurMind:
