caseAssessment:
  verdict: unresolved
  whatIsClaimed: "Muscle knots are maintained vascular-autonomic states rather than structural lesions: microvascular smooth muscle held in the latch-bridge state, throttling local blood flow and sensitizing local nerve endings, with secondary skeletal-muscle guarding layered on top — writable by stress, readable as stiffness and ache, releasable by sustained pressure combined with slow exhalation. More broadly, vascular tension functions as a memory element participating in mental life, the physical implementation of what contemplative traditions call clinging, and the traditional anatomies of knots and channels are first-person maps of the same system."
  whereDisagreementLives: "Not over whether people feel tender spots, not over whether palpated points are measurably stiffer, and not over whether smooth muscle can latch — all three are common ground. The crux is whether anything objective happens locally when a knot 'releases' on a slow exhale: does stiffness fall and perfusion rise within seconds, time-locked to the breath, beyond what pressure alone, expectation and generalized relaxation produce — and, if it does, is the releasing element vascular smooth muscle rather than skeletal-muscle guarding or fascial densification? Beneath that sit two further disputes. The latch has been demonstrated in large conduit arteries, and where pressurized skeletal-muscle arterioles have been measured they show maintained activation, not a latch signature. And the electrical signature that made the knot look like a discrete addressable element also appears at a minority of non-tender endplate-zone sites, so whether the brain addresses the knot or the endplate zone is open. Beneath all of it, the skeptical literature disputes whether the trigger point is reliably identifiable at all."
  whatWouldSettleIt: "A time-locked imaging experiment: ultrafast shear-wave elastography and sensitive microvascular Doppler over a palpated knot during breath-assisted release, with sites fixed in advance by blinded examiners, calibrated pressure through an instrumented probe, factorial controls (pressure with normal breathing, slow breathing without pressure, sham sites, failed attempts), a button press at each felt release, and a preregistered prediction that stiffness drops and perfusion rises together within seconds of the exhale, exceeding all controls, with perfusion leading stiffness. Felt releases without reproducible local transitions, or equal transitions at shams, would return the knot to the guarding-and-interpretation account. Companion studies decide the mechanism and the localization: a paired-caliber, pressurized arteriole preparation with a stimulus-withdrawal phase testing whether latch capacity persists into skeletal-muscle arterioles; a repeat of the mental-arithmetic experiment with a matched endplate-zone control site; a retrieved densification timescale telling the keystone experiment whether a stiffness drop without perfusion change is a live alternative; and a Doppler census with pain-free controls, since every existing flow comparison sits inside symptomatic muscle."
  bestConventionalExplanation: "Tenderness and its relief need no vascular memory. Tender points are neuromuscular guarding — sustained low-level motor drive and endplate activity in skeletal muscle, centrally maintained and stress-sensitive — possibly with altered fascial gliding from hyaluronan densification between fascial layers. The electrical signature is endplate noise, a property of the endplate zone that is more prevalent where tissue is tender; a stressor that raises sympathetic drive to endplates would raise it. The acidic, mediator-rich milieu follows from compression under guarding as readily as from a throttled arteriole, and the high-resistance Doppler waveforms near trigger points are, by the imaging authors' own account, as compatible with contracture squeezing the capillary bed as with distal constriction — while a second resistance index shows no difference at all. The felt release is expectation and attention doing what they demonstrably do, riding the genuine but global parasympathetic shift of slow breathing, with pressure altering local sensation; any rapid mechanical change is densification thinning or guarding switching off, not a vessel unlatching. Nothing is stored locally: the brain stops guarding, regionally or globally, and interpretation supplies the rest. A stricter version adds that manual trigger-point identification has poor examiner reliability and no validated reference standard, so part of the observation base may be an artifact of training and expectation. This account requires no new physiology, and the only direct arteriole measurements available fit it better than they fit a latch. Its gap is the set of localized objective findings — a graded stiff region that blinded sonographers can measure, spontaneous electrical activity that a mental task selectively raises at one point, abnormal local chemistry and flow — that a purely central or interpretive story must still account for."
  components:
    - label: "The phenomenon at the fingertip: tender points exist and differ instrumentally (VASO-C001, C005, C030, C031–C033, C036)"
      state: provisionally_supported
      note: Blinded sonoelastography separates active, latent and normal sites in a graded way and local arteries differ on one Doppler index at group level; but a second index is null, retrograde flow appears at 31% of normal sites, there are no pain-free controls, palpation is the unreliable reference standard, and the biochemical elevation was not purely local.
    - label: "The neural signature: a stress-reactive electrical nidus (VASO-C002, C003, C034, C035)"
      state: provisionally_supported
      note: Real and stress-reactive, but a prevalence gradient across the endplate zone rather than an exclusive island; the control sites in both lineage studies may have lain off the endplate zone, and the recorded activity is skeletal-muscle electrophysiology with no vascular measurement.
    - label: "The autonomic lever: breath and attention reach the periphery (VASO-C013, C006)"
      state: well_supported
      note: Slow breathing reproducibly shifts autonomic balance globally, and voluntary attention regulates a peripheral vascular bed at a chosen site without arousal over tens of minutes; neither record concerns tender points, smooth muscle, or seconds.
    - label: The latch and its reach into the compartment the knot needs (VASO-C010, C011)
      state: mixed
      note: Latch-bridge physiology is established in conduit arteries; no arteriole energetic measurement exists, pressurized skeletal-muscle arterioles show maintained activation rather than a latch signature, and latch behaviour vanished one branch order downstream in the only paired comparison. The state-not-structure inference is sound but unanchored to any measured release.
    - label: The hemo-neural read path (VASO-C012)
      state: provisionally_supported
      note: Blood-pressure pulsations modulate neurons through mechanosensitive channels in rat brain — instantaneous modulation, not storage, and not the human periphery.
    - label: "The attributions: knots as latched arterioles, vascular tension as memory, contemplative maps as cartography (VASO-C020, C021, C022)"
      state: unresolved
      note: No direct evidence located in either direction for the two linchpins; the memory claim fails the write–store–read test; the contemplative claim has no evidence record at all. The arteriole record leans against C020 without refuting it.
