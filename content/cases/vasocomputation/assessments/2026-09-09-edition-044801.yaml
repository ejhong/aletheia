  synthesis: "The ledger's ladder is inverted: the mechanism rung — latch physiology (VASO-E003), the slow-breathing autonomic shift (VASO-E009), vascular-to-neural mechanosensation in rat brain (VASO-E005) — is better evidenced than either the observations beneath it or the attributions above it, and every one of those records is credible without being diagnostic, because conventional physiology predicts each of them too. The observation base rests on two primaries. Ballyns 2011 gives the stiffness component of VASO-C005 blinded-sonographer support (VASO-E023: graded stiff area 0.57/0.36/0.17 cm², AUC 0.9) and a group-level Doppler difference (VASO-E022), but the same source shows the vascular signature is partial — retrograde flow at 31% of palpably normal sites, a null resistivity index, a pulsatility index that cannot classify sites, no pain-free controls, and vessels of conduit caliber 1–2 cm from the point (VASO-E024, VASO-E025, VASO-E026) — and its authors list contracture compression as a co-equal cause of the flow pattern (VASO-E027, weighed here as a qualifier rather than support, as the second reader argued). Simons 2002 (VASO-E031, VASO-E032) makes the electrical nidus a prevalence gradient that tracks the endplate zone first, lowering the diagnosticity of VASO-C002 and exposing the unmatched control site in VASO-C003. The anchor observation, a seconds-scale release on an exhale (VASO-C004), is supported only by proponent testimony (VASO-E014); the only imaged change in a trigger point is over visits after needling (VASO-E030). Where the thesis needs the latch, the record points the other way: pressurized skeletal-muscle arterioles show maintained or rising phosphorylation (VASO-E020), no arteriole energetic measurement exists (VASO-E019), and latch behaviour vanished one branch order downstream in the only paired comparison (VASO-E021). The essay-derived records VASO-E033–E043 are derivative restatements, hypothesis statements or interpretation and carry no independent weight; the one that matters is VASO-E039, the sole record on VASO-C022 — an uncited proponent assertion about where the traditional maps place knots, with no coding rule or chance baseline, which leaves that claim untested rather than supported. The memory attribution (VASO-C021) fails the write–store–read test (VASO-E017). Sensitivity: no single removal flips the case verdict, because neither direction holds decisive evidence. The record whose removal would most change the shape of the case is VASO-E020 — without it VASO-C020 reverts from 'examined in its named compartment and mismatched' to merely 'untested'. VASO-E016 remains the single most important undermining record; VASO-E031 is the record that most constrains the reading of the observations. Unresolved is a finding, not a default: the decisive experiment (VASO-R001) is specified, cheap and unrun, and both outcomes remain live."
  steelman: The classic energy-crisis account of trigger points has never explained how a skeletal-muscle fiber could remain near-maximally contracted for years without exhausting itself, and the latch is the one known physiological device that holds tension for almost nothing — the puzzle the conventional account cannot dissolve is exactly the puzzle a latch would. The electrical signature is confined to one to two millimeters and is selectively turned up by mental arithmetic while surrounding muscle stays quiet; that it also appears at four of eleven other endplate-zone sites does not explain why it is present at eleven of eleven trigger points, nor why a stressor picks the tender one. Blinded sonographers find a graded stiff region at exactly the sites examiners palpate, and the arteries nearby behave differently — the footprint a throttled bed would leave, whatever else could leave it. Voluntary attention has now been shown, in preregistered human experiments, to regulate a peripheral vascular bed at a chosen site with no change in arousal — the write channel the synthesis needs, demonstrated. Every arteriole study reporting maintained activation held its stimulus present throughout, so none could have detected a state that persists after input stops, which is the only state a knot requires; and the latch-competent versus latch-incompetent motor-protein phenotype has never been surveyed in skeletal-muscle arterioles under chronic sympathetic drive, the condition the hypothesis posits. Finally, the hypothesis makes two distinctive, falsifiable predictions that neither guarding nor densification makes — perfusion rises before stiffness falls, and the stiff, electrically active spot is metabolically cold — and both can be tested for the cost of a small grant. None of this shows that knots are latches; it is the best reason the assessment cannot yet be closed against them.
