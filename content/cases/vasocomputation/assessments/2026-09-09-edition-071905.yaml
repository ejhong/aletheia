  synthesis: "The ledger's ladder is inverted: the mechanism rung — latch physiology (VASO-E003), the slow-breathing autonomic shift (VASO-E009), vascular-to-neural mechanosensation in rat brain (VASO-E005) — is better evidenced than either the observations beneath it or the attributions above it, and every one of those records is credible without being diagnostic, because conventional physiology predicts each of them too. The observation base rests on two primaries. Ballyns 2011 gives the stiffness component of VASO-C005 blinded-sonographer support (VASO-E023: graded stiff area 0.57/0.36/0.17 cm², AUC 0.9) and a group-level Doppler difference (VASO-E022), but the same source shows the vascular signature is partial — retrograde flow at 31% of palpably normal sites, a null resistivity index, a pulsatility index that cannot classify sites, no pain-free controls, conduit-caliber vessels 1–2 cm from the point (VASO-E024, E025, E026) — and its authors list contracture compression as a co-equal cause of the flow pattern, so VASO-E027 is weighed as a qualifier at zero diagnosticity rather than as support, as its second reader argued. Simons 2002 (VASO-E031, E032) makes the electrical nidus a prevalence gradient that tracks the endplate zone first (11/11, 4/11, 0), lowering the diagnosticity of VASO-C002 and exposing the unmatched control site in VASO-C003. The anchor observation, a seconds-scale release on an exhale (VASO-C004), is supported only by proponent testimony (VASO-E014); the only imaged change in a trigger point is over visits after needling (VASO-E030); and the two-key necessity (VASO-C039) may be contradicted by a located-but-unretrieved 2025 elastography study reported to show release under pressure alone (VASO-R012). Where the original thesis needs the latch, the record points the other way: pressurized skeletal-muscle arterioles show maintained or rising phosphorylation (VASO-E020), no arteriole energetic measurement exists (VASO-E019), and latch behaviour vanished one branch order downstream in the only paired comparison (VASO-E021). The essay-derived records VASO-E033–E043 are derivative restatements or hypothesis statements at zero independent weight; VASO-E039 is the sole record on VASO-C022 and leaves it untested. The records from the second proponent essay (VASO-E044, E045, E047, E050, E051, E052) rest on SRC-JHONG-2026A, which is unverified and by its own note may bear no weight; they are recorded here only to mark that a second vascular account — the stuck perforator (VASO-C174), which drops the latch and relocates the vessel to the superficial fascia — is now on the map with no evidence for or against it and cheap tests (VASO-R015, R016, R017) that would decide it. The memory attribution (VASO-C021) fails the write–store–read test (VASO-E017). Sensitivity: no single removal flips the case verdict, because neither direction holds decisive evidence. The record whose removal would most change the shape of the case is VASO-E020 — without it VASO-C020 reverts from 'examined in its named compartment and mismatched' to merely 'untested', and the perforator relocation loses its motivation. VASO-E016 remains the single most important undermining record; VASO-E031 most constrains the reading of the observations. Unresolved is a finding, not a default: three accounts of the same seconds-long event are specified, the decisive experiments are cheap and unrun, and every outcome remains live."
  steelman: "The classic energy-crisis account of trigger points has never explained how a skeletal-muscle fiber could remain near-maximally contracted for years without exhausting itself; a latch is the one known physiological device that holds tension for almost nothing, and a clenched skin arteriole, which the body demonstrably pays to hold all day, would not even need the economy — so the puzzle the conventional account cannot dissolve is exactly the one both vascular accounts dissolve. The electrical signature is confined to one to two millimeters and is selectively turned up by mental arithmetic while surrounding muscle stays quiet; that it also appears at four of eleven other endplate-zone sites does not explain why it is present at eleven of eleven trigger points, nor why a stressor picks the tender one. Blinded sonographers find a graded stiff region at exactly the sites examiners palpate, and the arteries nearby behave differently — the footprint a throttled bed would leave, whatever else could leave it. Voluntary attention has now been shown, in preregistered human experiments, to regulate a peripheral vascular bed at a chosen site with no change in arousal — the write channel the synthesis needs, demonstrated. Every arteriole study reporting maintained activation held its stimulus present throughout, so none could have detected a state that persists after input stops, which is the only state a knot requires; and the latch-competent versus latch-incompetent phenotype has never been surveyed in skeletal-muscle arterioles under chronic sympathetic drive. The perforator version asks for no new physiology at all: the skin bed is constricted by a deep breath within two seconds by a textbook reflex, opened by a slow exhale, addressed site by site every time a person blushes, and history-dependent after cold — and medicine already recognizes a class of exquisitely tender points where a vessel-nerve bundle pierces a fascial ring, relieved by freeing the ring. Finally, the vascular hypothesis makes distinctive, falsifiable predictions that neither guarding nor densification makes — perfusion rises before stiffness falls; a knot released by hydrodissection without breath; a stiff, active spot that is metabolically cold — and all of them can be tested for the cost of a small grant, one of them with a pencil Doppler in an afternoon. None of this shows that knots are vessels; it is the best reason the assessment cannot yet be closed against them."
