caseAssessment:
  verdict: unresolved
  whatIsClaimed: Muscle knots are maintained vascular-autonomic states rather than structural lesions. In the original form of the claim, the state is microvascular smooth muscle inside the muscle held in the latch-bridge state, throttling local blood flow and sensitizing local nerve endings, with secondary skeletal-muscle guarding layered on top. In a second form from the same proponent, the state is a cutaneous perforator — a small artery, nerve and lymphatic passing together through a ring in the superficial fascia — held constricted by ordinary sympathetic tone, collared by gelled hyaluronan and tethering the fascial sheet, needing no latch at all. In either form the knot is writable by stress, readable as stiffness and ache, and releasable by sustained pressure combined with slow exhalation. More broadly, vascular tension functions as a memory element participating in mental life, the physical implementation of what contemplative traditions call clinging, and the traditional anatomies of knots and channels are first-person maps of the same system.
  whereDisagreementLives: "Not over whether people feel tender spots, not over whether palpated points are measurably stiffer, not over whether smooth muscle can latch, and not even over state versus scar — all three live accounts say a knot is a state. The crux is whether anything objective happens locally when a knot 'releases' on a slow exhale: does stiffness fall and perfusion rise within seconds, time-locked to the breath, beyond what pressure alone, expectation and generalized relaxation produce? Behind it sit three further disputes. Which tissue holds the state: an arteriole inside the muscle (where the published record shows maintained activation, not a latch), a perforator under the skin (where nothing has been measured at all), a stress-sensitive skeletal endplate under central guarding, or gelled fascial hyaluronan? Is the breath necessary — or does pressure suffice, as a located-but-unretrieved elastography study is reported to show? And does the brain address the knot or merely the endplate zone, given that the electrical signature also appears at a minority of non-tender endplate-zone sites? Beneath all of it, the skeptical literature disputes whether the trigger point is reliably identifiable at all."
  whatWouldSettleIt: "A time-locked imaging experiment: ultrafast shear-wave elastography and sensitive microvascular Doppler over a palpated knot during breath-assisted release, with sites fixed in advance by blinded examiners, calibrated pressure through an instrumented probe, factorial controls (pressure with normal breathing, slow breathing without pressure, pressure during an inhale-and-hold, sham sites, failed attempts), a button press at each felt release, and a preregistered prediction that stiffness drops and perfusion rises together within seconds of the exhale, exceeding all controls, with perfusion leading stiffness. Felt releases without reproducible local transitions, or equal transitions at shams and under pressure alone, would return the knot to the guarding-and-interpretation account. A surface variant with laser speckle contrast imaging and end-tidal CO2 discriminates the perforator, hyperventilation and no-local-event readings at once. Companion studies decide the compartment and the localization: a blinded pencil-Doppler coincidence map of tender points against perforators; ultrasound-guided saline hydrodissection at a mapped perforator with no breath; a paired-caliber, pressurized arteriole preparation with a stimulus-withdrawal phase; a repeat of the mental-arithmetic experiment with a matched endplate-zone control site; a small FDG-PET overlay testing whether stiff, active knots are metabolically cold; a retrieved densification timescale; and a Doppler census with pain-free controls, since every existing flow comparison sits inside symptomatic muscle."
  bestConventionalExplanation: "Tenderness and its relief need no vascular memory. Tender points are neuromuscular guarding — sustained low-level motor drive and endplate activity in skeletal muscle, centrally maintained and stress-sensitive — possibly with altered fascial gliding from hyaluronan densification between fascial layers. The electrical signature is endplate noise, a property of the endplate zone that is more prevalent where tissue is tender; a stressor that raises sympathetic drive to endplates would raise it. The acidic, mediator-rich milieu follows from compression under guarding as readily as from a throttled vessel, and the high-resistance Doppler waveforms near trigger points are, by the imaging authors' own account, as compatible with contracture squeezing the capillary bed as with distal constriction — while a second resistance index shows no difference at all. The felt release is expectation and attention doing what they demonstrably do, riding the genuine but global parasympathetic shift of slow breathing, with pressure altering local sensation; any rapid mechanical change is densification thinning or guarding switching off, not a vessel unlatching or a perforator reopening; the sparks practitioners feel are hyperventilation paresthesias, global and CO2-tracking rather than local. Nothing is stored locally: the brain stops guarding, regionally or globally, and interpretation supplies the rest. A stricter version adds that manual trigger-point identification has poor examiner reliability and no validated reference standard, so part of the observation base may be an artifact of training and expectation. This account requires no new physiology, and the only direct arteriole measurements available fit it better than they fit a latch. Its gap is the set of localized objective findings — a graded stiff region that blinded sonographers can measure, spontaneous electrical activity that a mental task selectively raises at one point, abnormal local chemistry and flow — that a purely central or interpretive story must still account for."
