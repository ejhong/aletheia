      state: mixed
      note: Textbook in conduit arteries; in pressurized skeletal-muscle arterioles maintained constriction tracks maintained or rising phosphorylation, no arteriole's energetic cost has ever been measured, and latch behaviour vanished one branch order downstream in the only paired comparison.
    - label: "The autonomic lever: breath and attention"
      state: well_supported
      note: Slow breathing reproducibly shifts autonomic balance globally; voluntary attention regulates a peripheral vascular bed at a chosen site over tens of minutes by a vagal immune route. The local, seconds-scale unlatching or reopening at a tender point that every vascular account adds has never been measured.
