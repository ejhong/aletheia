  synthesis: "The ledger's ladder remains inverted. The mechanism rung is the best evidenced — the latch-bridge model on VASO-C010 (VASO-E003), the slow-breathing autonomic shift on VASO-C013 (VASO-E009), mechanosensitive vascular-to-neural modulation in rat brain on VASO-C012 (VASO-E005) — and each of those records is credible without being diagnostic, because guarding, densification and ordinary physiology predict each of them too. The observation base now rests on three primaries. On VASO-C005 and VASO-C033, Ballyns 2011 gives the stiffness component blinded-sonographer support (VASO-E023: graded stiff area 0.57/0.36/0.17 cm², AUC 0.9), and on VASO-C031 and VASO-C032 a group-level Doppler difference (VASO-E022); the same source shows the vascular signature is partial — no pain-free controls and retrograde flow at 31% of palpably normal sites (VASO-E026, on C005, C031 and C032), indices that cannot classify sites (VASO-E025, on C005), a null resistivity index on VASO-C036 (VASO-E024) — and on VASO-C020 its authors list contracture compression as a co-equal cause of the flow pattern, so VASO-E027 is weighed at zero diagnosticity. Landfald 2025 adds a second laboratory, muscle and method: on VASO-C005 the active/latent stiffness-ratio and area differences (VASO-E070, VASO-E071) reproduce the gradient without any control tissue, which is why those records are context and qualifier rather than support; on VASO-C033 the calf findings are a parallel, not a replication (VASO-E073, VASO-E074, VASO-E076, VASO-E077); on VASO-C030 the authors state the reliability problem in their own words and report that imaging confirmed 71.5% of palpated spots (VASO-E078, VASO-E079, VASO-E081). Croft 1994 gives VASO-C001 its first population record: two people reporting no pain had eleven or more tender points (VASO-E082), in a pain-selected sample (VASO-E083 is context). On VASO-C002, Simons 2002 (VASO-E031) makes the electrical nidus a prevalence gradient rather than an exclusive island, and on VASO-C034 and VASO-C035 (VASO-E032) places the signature in the endplate zone first; read beside VASO-C003's single record (VASO-E002), that exposes an unmatched control site — an inference across claims, stated as one. The anchor observation, a seconds-scale release on an exhale (VASO-C004), is supported only by proponent testimony (VASO-E014). The judgment that changed is on VASO-C039: the two-key necessity now has direct contrary evidence (VASO-E067) — a pressure-only protocol with no breathing instruction anywhere in its methods made about three-quarters of imaged points undetectable after one course and all but two at 24 hours — and no admitted support; it grades contradicted at moderate confidence, the confidence capped because breathing was uncontrolled rather than held, the endpoint is detectability rather than the felt release, and the muscle and population differ. Where the original thesis needs the latch, the record on VASO-C020 points the other way: pressurized skeletal-muscle arterioles show maintained or rising phosphorylation (VASO-E020), no arteriole energetic measurement exists (VASO-E019), and the report's audit finds no latch identified at any tender point (VASO-E016); on VASO-C010 the one paired comparison lost latch behaviour one branch order downstream (VASO-E021). The essay-derived records VASO-E033 to VASO-E043 are restatements or hypothesis statements at zero independent weight; VASO-E039 is the sole record on VASO-C022 and leaves it untested. The records drawn from the second essay (VASO-E044, VASO-E045, VASO-E050, VASO-E051, VASO-E052) rest on SRC-JHONG-2026A, which the ledger has not read; they are treated as absent, and the perforator account (VASO-C174, with VASO-C143 as its write mechanism and VASO-C073 as its timing prediction) sits on the map on its anchor alone. The memory attribution (VASO-C021) fails the write–store–read test (VASO-E017). Sensitivity: no single removal flips the case verdict, because neither direction holds decisive time-resolved evidence. The record whose removal would most change the shape of the case is now VASO-E067: without it the breath-necessity crux reverts to untested and the ledger loses its only objective imaged record of a fast release. VASO-E020 remains the record that most shapes the mechanism rung, and VASO-E031 most constrains the reading of the observations. Unresolved is a finding, not a default: three accounts of the same event are specified, one rung has been graded against its proponents, the decisive experiments are cheap and unrun, and every account survives pressure sufficing."
  steelman: "The classic energy-crisis account of trigger points has never explained how a skeletal-muscle fiber could remain near-maximally contracted for years without exhausting itself; a latch is the one known physiological device that holds tension for almost nothing, and a clenched skin arteriole, which the body demonstrably pays to hold all day, would not even need the economy — so the puzzle the conventional account cannot dissolve is exactly the one both vascular accounts dissolve. The electrical signature is confined to one to two millimeters and is selectively turned up by mental arithmetic while surrounding muscle stays quiet; that it also appears at four of eleven other endplate-zone sites does not explain why it is present at eleven of eleven trigger points, nor why a stressor picks the tender one. Blinded sonographers in two laboratories find a graded stiff region at exactly the sites examiners palpate, and the arteries nearby behave differently — the footprint a throttled bed would leave, whatever else could leave it. Voluntary attention has now been shown, in preregistered human experiments, to regulate a peripheral vascular bed at a chosen site with no change in arousal — the write channel the synthesis needs, demonstrated. Every arteriole study reporting maintained activation held its stimulus present throughout, so none could have detected a state that persists after input stops, which is the only state a knot requires. The runners whose trigger points cleared under thumb pressure were never told how to breathe and their breathing was never recorded; a person under painful sustained pressure tends to exhale, so the study is compatible with the exhale doing the work uninstructed, and the arm that would exclude that reading — pressure applied only during an inhale-and-hold — has not been run. The perforator version, as its proponent states it, asks for no new physiology at all: he reads the skin bed as constricted by a deep breath within two seconds by a textbook reflex, opened by a slow exhale, addressed site by site every time a person blushes, and history-dependent after cold — and he points to a class of exquisitely tender points medicine already recognizes where a vessel-nerve bundle pierces a fascial ring, relieved by freeing the ring; none of that is yet an admitted record here, but none of it is exotic. Finally, the vascular hypothesis makes distinctive, falsifiable predictions that neither guarding nor densification makes — perfusion rises before stiffness falls; release blocked by held breath; a knot released by hydrodissection without breath; a stiff, active spot that is metabolically cold — and all of them can be tested for the cost of a small grant, one of them by adding a respiration belt to a protocol that already exists. None of this shows that knots are vessels; it is the best reason the assessment cannot yet be closed against them."
