    verdict: contradicted
    reasoning: The claim's own truth condition makes it false if pressure alone suffices. In the one retrieved study bearing on it, no breathing instruction, recording or manipulation appears anywhere in the methods or results, and thumb compression in thirty-second bouts made about three-quarters of imaged points undetectable after the first course and all but two at 24 hours (VASO-E067, moderate, undermines). No admitted record supports the claim; its anchor is the proponent's essay. Confidence is capped at moderate because breathing was uncontrolled rather than held — a subject under painful pressure may exhale slowly unprompted — the endpoint is detectability rather than a felt release, and the muscle and population differ from the practitioner reports.
    confidence: moderate
    treatment:
      plainLanguage: Pressing on a knot without changing your breathing does not release it — you need the exhale too.
      importance: major
      diagnosticity: high
      diagnosticitySummary: The breath's necessity is what most cleanly separates an autonomically gated vascular release from guarding that pressure alone can switch off; pressure sufficing removes the cleanest argument that the releasing element answers to autonomic state.
      strongestObjection: "'No breath instruction' is not 'breath held constant': the runners may have exhaled under pressure without being told, and the arm that would exclude it — pressure applied only during an inhale-and-hold — has not been run."
      whatWouldChangeOurMind:
        - Held breath blocking the clearance that free or slow breathing produces in a breath-randomised repeat (VASO-R020) — which would reopen the claim.
        - Equal clearance under held breath, closing it.
        - Release by saline hydrodissection with no breath (VASO-R017), which would confirm the breath is not required.
