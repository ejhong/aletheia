  verdict: unresolved
  whatIsClaimed: "Muscle knots are maintained vascular-autonomic states rather than structural lesions. In the form the case grades, the state is microvascular smooth muscle inside the muscle held in the latch-bridge state, throttling local blood flow and sensitizing local nerve endings, with secondary skeletal-muscle guarding layered on top; the knot is said to be writable by stress, readable as stiffness and ache, and releasable by sustained pressure combined with slow exhalation. The features the admitted evidence carries for that thesis are these: active points differ chemically from surrounding tissue; blinded sonographers in the upper trapezius find a graded region of stiffness — a larger area at active than at latent points, and both classes significantly larger than palpably normal sites — that separates site classes on ROC analysis, from one laboratory with palpation-selected sites and no pain-free controls; a systematic imaging review, characterized second-hand, reports stiffness and flow measures that distinguish points from healthy tissue, and in the calf the more symptomatic class of point is larger, stiffer and more painful than the less symptomatic class; the arteries near trapezius points show partially abnormal flow; a millimeter-scale electrical signature at trigger points is turned up by a purely mental stressor; smooth muscle can hold force cheaply after activation falls in conduit arteries; slow breathing shifts autonomic balance globally; vascular mechanics can modulate neurons in rat brain; and, on the active/latent question, imaged trigger points can become sonographically undetectable within a first round of pressure lasting minutes. What the admitted evidence does not carry, on the two-key claim itself, is the necessity of the breath: the one record admitted there establishes only that a published pressure-only protocol carried no breathing instruction. Held here on its anchor only, in a source the ledger has not read, is a second form from the same proponent: the state is a cutaneous perforator — a small artery, nerve and lymphatic passing together through a ring in the superficial fascia — held constricted by ordinary sympathetic tone, collared by gelled hyaluronan and tethering the fascial sheet, needing no latch. More broadly, and on hypothesis statements alone, vascular tension is said to function as a memory element participating in mental life, the physical implementation of what contemplative traditions call clinging, and the traditional anatomies of knots and channels are said to be first-person maps of the same system."
  whereDisagreementLives: "Not over whether people feel tender spots, not over whether palpated points differ measurably from surrounding tissue at group level — blinded sonographers in two muscles report them stiffer, in a graded way — not over whether smooth muscle can latch, and not over state versus scar: all three live accounts say a knot is a state, and an imaged stiff focus that becomes undetectable within a session of compression is not scar. The crux is whether anything objective happens locally when a knot 'releases' on a slow exhale: does stiffness fall and perfusion rise within seconds, time-locked to the breath, beyond what pressure alone, expectation and generalized relaxation produce? Behind it sit three further disputes. Which tissue holds the state: an arteriole inside the muscle (where the published record shows maintained activation, not a latch), a perforator under the skin (where nothing has been measured at all), a stress-sensitive skeletal endplate under central guarding, or gelled fascial hyaluronan? Is the breath a key at all — the one rung where the ledger holds a natural test it has not admitted as an observation on the claim: a pressure-only protocol with no breathing instruction whose minutes-scale outcomes are recorded against the active/latent question, leaving open whether held breath would have blocked them? And does the brain address the knot or merely the endplate zone, given that the electrical signature also appears at a minority of non-tender endplate-zone sites? Beneath all of it, the skeptical literature disputes whether the trigger point is reliably identifiable at all — and the one study that checked found imaging confirmed about three-quarters of what an examiner palpated, while the stiffness gradient itself was measured at sites the examiner had already chosen."
  whatWouldSettleIt: "A time-locked imaging experiment: ultrafast shear-wave elastography and sensitive microvascular Doppler over a palpated knot during breath-assisted release, with sites fixed in advance by blinded examiners, calibrated pressure through an instrumented probe, factorial controls (pressure with normal breathing, slow breathing without pressure, pressure during an inhale-and-hold, sham sites, failed attempts), a button press at each felt release, and a preregistered prediction that stiffness drops and perfusion rises together within seconds of the exhale, exceeding all controls, with perfusion leading stiffness. Felt releases without reproducible local transitions, or equal transitions at shams and under pressure alone, would return the knot to the guarding-and-interpretation account. The cheapest decisive companion is specified: repeat the runners' single-session compression protocol with breathing recorded and randomized point by point across free breathing, instructed slow exhalation and pressure only during an inhale-and-hold, with sham and untreated arms, cine loops archived and Doppler added — if held breath does not lower clearance, the breath is not a key; if it blocks clearance, breath-gating is real. That study would also supply, as admitted atomic observations, the pressure-only outcome the two-key claim now lacks on its own records. A surface variant with laser speckle contrast imaging and end-tidal CO2 discriminates the perforator, hyperventilation and no-local-event readings at once. Companion studies decide the compartment and the localization: a blinded pencil-Doppler coincidence map of tender points against perforators; ultrasound-guided saline hydrodissection at a mapped perforator with no breath; a paired-caliber, pressurized arteriole preparation with a stimulus-withdrawal phase; a repeat of the mental-arithmetic experiment with a matched endplate-zone control site; a small FDG-PET overlay testing whether stiff, active knots are metabolically cold; a retrieved densification timescale; and a Doppler and elastography census with pain-free controls and sites fixed by instrument rather than thumb, since every existing stiffness and flow comparison sits inside symptomatic muscle at palpation-selected sites."
  bestConventionalExplanation: "Tenderness and its relief need no vascular memory. Tender points are neuromuscular guarding — sustained low-level motor drive and endplate activity in skeletal muscle, centrally maintained and stress-sensitive — possibly with altered fascial gliding from hyaluronan densification between fascial layers. The electrical signature is endplate noise, a property of the endplate zone that is more prevalent where tissue is tender; a stressor that raises sympathetic drive to endplates would raise it. The stiff region blinded sonographers map at a palpated point is contracted fibre and guarding, graded with symptom severity because guarding is graded with symptom severity. The acidic, mediator-rich milieu follows from compression under guarding as readily as from a throttled vessel, and the high-resistance Doppler waveforms near trigger points are, by the imaging authors' own account, as compatible with contracture squeezing the capillary bed as with distal constriction — while a second resistance index shows no difference at all. Sustained pressure switches the guarding off or thins the densified lubricant, which is why a compression protocol with nobody told how to breathe made most latent and a majority of active imaged trigger points undetectable after one round of minutes-long compressions; the felt release on an exhale is expectation and attention doing what they demonstrably do, riding the genuine but global parasympathetic shift of slow breathing, with pressure altering local sensation. Any rapid mechanical change is densification thinning or guarding switching off, not a vessel unlatching or a perforator reopening; the sparks practitioners describe are, on this account, hyperventilation paresthesias, global and CO2-tracking rather than local. Nothing is stored locally: the brain stops guarding, regionally or globally, and interpretation supplies the rest. A stricter version adds that manual trigger-point identification has poor examiner reliability and no validated reference standard — imaging confirmed only about three-quarters of one examiner's palpated spots — so part of the observation base may be an artifact of training and expectation. This account requires no new physiology, and the only direct arteriole measurements available fit it better than they fit a latch. Its gap is the set of localized objective findings — the graded stiff regions blinded sonographers report in two muscles, spontaneous electrical activity that a mental task selectively raises at one point, abnormal local chemistry and flow — that a purely central or interpretive story must still account for."
