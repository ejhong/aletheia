  synthesis: "The ladder stays inverted. The best-evidenced rungs are the mechanism rungs — the latch-bridge model on VASO-C010 (VASO-E003), the slow-breathing autonomic shift on VASO-C013 (VASO-E009), mechanosensitive vascular-to-neural modulation in rat brain on VASO-C012 (VASO-E005) — and each is credible without being diagnostic, because guarding, densification and ordinary physiology predict each of them too. The observation base rests on four primaries. On VASO-C005, Shah 2008 gives the biochemistry (VASO-E006), the Mazza review, characterized second-hand, gives group-level stiffness and flow differences (VASO-E007), and Ballyns 2011 gives two instrumented findings: a group-level Doppler difference (VASO-E022, also on VASO-C031 and VASO-C032) and the vibration-elastography stiff-area gradient — active and latent areas significantly above normal (VASO-E091), the normal-site value (VASO-E090), the active-versus-normal classifier (VASO-E096), the active-versus-latent classifier (VASO-E099) and the overall ROC separation (VASO-E100, VASO-E102), with the abstract's own ROC listing (VASO-E101, VASO-E103) read as context because it assigns the 0.9 to a different pair than the results paragraph does. The two trigger-point means carry VASO-C182 (VASO-E087, VASO-E089; VASO-E093, VASO-E106 and the calf parallel VASO-E085 as context) and the normal-site mean carries VASO-C187 (VASO-E090; VASO-E104, VASO-E105 and VASO-E107), so both grade provisionally supported rather than anchor-only: blinded sonographers, but one laboratory, one vibration frequency, palpation-selected sites, and the same NIH lineage as the biochemistry. The same source caps its own findings — no pain-free controls and retrograde flow at 31% of palpably normal sites (VASO-E026, on VASO-C005, VASO-C031 and VASO-C032), flow indices that cannot classify sites (VASO-E025, on VASO-C005), a null resistivity index on VASO-C036 (VASO-E024); on VASO-C020 its authors list contracture compression as a co-equal cause of the flow pattern, so VASO-E027 is weighed at zero diagnosticity. Landfald 2025 adds a second laboratory, muscle and method on VASO-C005: pain, area and stiffness-ratio differences between active and latent points (VASO-E069, VASO-E070, VASO-E071) and first-round sonographic disappearance of 60% of active and 86% of latent points (VASO-E072), all within symptomatic runners with no control tissue, which is why those records are context and qualifier rather than support; on VASO-C030 the authors state the reliability problem in their own words and report that imaging confirmed 71.5% of palpated spots (VASO-E078, VASO-E079, VASO-E081). On VASO-C001 the ledger separates two propositions the claim bundles: occurrence is documented — Croft 1994 found fixed-site tender points in two people reporting no pain, in a pain-selected subsample (VASO-E082, VASO-E083, both context) — while commonness across the general population is held only on the essay's own report (VASO-E015) and a 1986 clinic estimate quoted second-hand (VASO-E028), with VASO-E012 qualifying even the palpable spot; the claim grades weakly supported at low confidence, its frequency half unmeasured. On VASO-C002, Simons 2002 (VASO-E031) makes the electrical nidus a prevalence gradient rather than an exclusive island, and on VASO-C034 and VASO-C035 (VASO-E032) places the signature in the endplate zone first; read beside VASO-C003's single record (VASO-E002), that exposes an unmatched control site — an inference across claims, stated as one. The anchor observation, a seconds-scale release on an exhale (VASO-C004), is supported only by proponent testimony (VASO-E014). On VASO-C039 the claim's one admitted record (VASO-E067, direction context) establishes that a published pressure-only protocol carried no breathing instruction, recording or manipulation — and nothing more. What that protocol achieved is held on VASO-C005 (VASO-E072), over a course of up to three thirty-second compressions — minutes, not the seconds of the felt release — so it is named here as a lead and not spent as a grade on a claim it is not attached to; the two-key necessity grades unresolved at low confidence, held on its anchor. Where the original thesis needs the latch, the record on VASO-C020 points the other way: pressurized skeletal-muscle arterioles show maintained or rising phosphorylation (VASO-E020), no arteriole energetic measurement exists (VASO-E019), and the report's audit finds no latch identified at any tender point (VASO-E016); on VASO-C010 the one paired comparison lost latch behaviour one branch order downstream (VASO-E021). The essay-derived records (VASO-E033, VASO-E034, VASO-E035, VASO-E036, VASO-E037, VASO-E038, VASO-E041, VASO-E042, VASO-E043) are restatements or hypothesis statements at zero independent weight; VASO-E039 is the sole record on VASO-C022 and leaves it untested. The records drawn from the second essay (VASO-E044, VASO-E045, VASO-E050, VASO-E051, VASO-E052) rest on a source the ledger has not read and are treated as absent; the perforator account (VASO-C174, with VASO-C143 as its write mechanism and VASO-C073 as its timing prediction) sits on the map on its anchor alone, as does densification's reversibility (VASO-C077). The memory attribution (VASO-C021) fails the write–store–read test (VASO-E017). Sensitivity: no single removal flips the case verdict, because neither direction holds decisive time-resolved evidence. The record whose removal would most change the case is VASO-E020: without it the arteriole compartment reverts to unexamined and the original thesis loses its principal contrary finding. VASO-E031 most constrains the reading of the observations. Unresolved is a finding, not a default: three accounts of the same event are specified, the decisive experiments are cheap and unrun, and the one natural test the ledger holds — pressure without breath — awaits a breath-controlled repeat before it can be read on the claim it would decide."
  steelman: "The classic energy-crisis account of trigger points has never explained how a skeletal-muscle fiber could remain near-maximally contracted for years without exhausting itself; a latch is the one known physiological device that holds tension for almost nothing, and a clenched skin arteriole, which the body demonstrably pays to hold all day, would not even need the economy — so the puzzle the conventional account cannot dissolve is exactly the one both vascular accounts dissolve. The electrical signature is confined to one to two millimeters and is selectively turned up by mental arithmetic while surrounding muscle stays quiet; that it also appears at four of eleven other endplate-zone sites does not explain why it is present at eleven of eleven trigger points, nor why a stressor picks the tender one. Blinded sonographers in two laboratories report stiff regions at exactly the sites examiners palpate — graded active above latent above palpably normal in the trapezius, each step now an admitted record — and the arteries nearby behave differently: the footprint a throttled bed would leave, whatever else could leave it. Voluntary attention has been shown, in preregistered human experiments, to regulate a peripheral vascular bed at a chosen site with no change in arousal — the write channel the synthesis needs, demonstrated. Every arteriole study reporting maintained activation held its stimulus present throughout, so none could have detected a state that persists after input stops, which is the only state a knot requires. The one published pressure-only protocol never told its runners how to breathe and never recorded their breathing; a person under painful sustained pressure tends to exhale, so whatever that protocol cleared over its minutes of compression is compatible with the exhale doing the work uninstructed, and the arm that would exclude that reading — pressure applied only during an inhale-and-hold — has not been run. The perforator version, as its proponent states it, asks for no new physiology at all: he reads the skin bed as constricted by a deep breath within two seconds by a textbook reflex, opened by a slow exhale, addressed site by site every time a person blushes, and history-dependent after cold — and he points to a class of exquisitely tender points medicine already recognizes where a vessel-nerve bundle pierces a fascial ring, relieved by freeing the ring; none of that is yet an admitted record here, but none of it is exotic. Finally, the vascular hypothesis makes distinctive, falsifiable predictions that neither guarding nor densification makes — perfusion rises before stiffness falls; release blocked by held breath; a knot released by hydrodissection without breath; a stiff, active spot that is metabolically cold — and all of them can be tested for the cost of a small grant, one of them by adding a respiration belt to a protocol that already exists. None of this shows that knots are vessels; it is the best reason the assessment cannot yet be closed against them."
