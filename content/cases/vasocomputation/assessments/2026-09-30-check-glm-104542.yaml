      unmeasured thing (E016), resting on first-person testimony (E014), and
      fascial densification (C077) supplies a competing state mechanism that
      would satisfy the conditional while changing its content. The strongest
      opposing consideration is that no instrumented seconds-scale release event
      exists anywhere in the ledger, so the conditional has never actually
      fired."
    confidence: moderate
