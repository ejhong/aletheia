  - claimId: VASO-C010
    verdict: well_supported
    reasoning: "Hai & Murphy's latch-bridge model (E003, strong) is foundational,
      heavily cited smooth-muscle physiology reproducing economical force
      maintenance at low phosphorylation. E021 qualifies it usefully: the one
      paired comparison found latch behaviour in a parent artery and absent one
      branch order downstream, so it is not generic across vascular smooth
      muscle, and E019 shows the energetic economy has never been measured in
