  synthesis: "This case splits almost perfectly by rung, and the honest roll-up is
    \"mixed\" rather than a hedge: the lower floors are genuinely supported, the
    central floor is under-evidenced, and the top floors are untested. The
    mechanism rung is real: the latch-bridge (C010) is strong, textbook
    smooth-muscle physiology, qualified by the project's own study VASO-S001,
    which found latch behaviour is vessel-phenotype-dependent, never followed
    downstream, and never energetically measured in any arteriole. The
    hemo-neural read path (C012) moved from hypothesis to demonstrated mechanism
    with Salameh 2024, and the breath lever (C013) rests on a strong systematic
    review. The observation rung is substantially firmer than skeptics allow:
    palpated tender points carry graded, instrumented differences in stiffness
    (blinded sonographers, AUC 0.8-0.9), biochemistry, and group-level Doppler
    flow, and the EMG signature survives its correct endplate-zone
    qualification. Against this, the featured attribution — C020's claim that
    knots are latched microvascular smooth muscle — has grade-D support on both
    linchpins: no seconds-scale objective release has ever been imaged (C073,
    C004), and the one direct look at the compartment the hypothesis names found
    maintained activation rather than an economical latch (E020). The Doppler
    and biochemistry evidence that would seem to support the vascular reading is
    close to zero in diagnosticity, since skeletal-muscle contracture
    compressing the bed fits it equally. The construct critique (C030) is well
    supported and caps everything: any decisive experiment must first solve
    blinded instrumented localization. The upper rungs (C021, C174, C143, C022)
    are hypothesis statements, several anchored only to a source the ledger
    itself marks as unreadable. Sensitivity: the case verdict hangs least on any
    single thread — remove the grade-D audit (E016) and the arteriole audit
    records E019-E021 still carry the same burden, so the verdict survives, with
    reduced confidence. The single most valuable next act is the keystone
    experiment R001, which would decide C011, C004, C020 and C073 in one study,
    in either direction."
  steelman: "The convergent four-way signature remains unrebutted: a palpable
    point that is simultaneously stiffer on elastography, electrically active on
    needle EMG, chemically inflamed/ischemic on microdialysis, and
    hemodynamically abnormal (raised pulsatility, retrograde diastolic flow) on
    Doppler — with no structural lesion ever demonstrated on T1 MRI — while a
    purely cognitive stressor selectively drives the nidus's activity with a
    centimeter-away control site staying quiet (McNulty 1994). No conventional
    account (fibrosis, scar, endplate noise alone, tendinous cores) predicts a
    psychologically writable, mechanically and chemically abnormal, electrically
    maintained spot; a sympathetically maintained state does, and Hubbard and
    Berkoff proposed exactly that in 1993. A proponent can rightly say the
    assessment shows the ingredients exist and the phenomenon is measurable, and
    that nothing in the ledger explains the McNulty site-selectivity or the felt
    seconds-scale release under breath in non-vascular terms — those
    observations stand unrebutted, merely unmeasured."
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: "The only records are the hypothesis's own statement (E013,
      self-published, no experimental validation) and E017's argument that latch
      hysteresis has never been shown to meet write-store-read memory criteria,
      with Physarum as the closest precedent. The read path (E005) demonstrates
      instantaneous mechanosensitive modulation, not storage or content-specific
      readout. The strongest opposing consideration is E017 itself: the claim's
      central step — that a maintained vascular state can carry a specific
      neural trace — has never been demonstrated in any mammalian preparation,
      though nothing contradicts it and R005 is designed to test it."
