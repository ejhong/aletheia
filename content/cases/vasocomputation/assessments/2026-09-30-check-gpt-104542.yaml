      from that study and is accurately supported. The strongest opposing
      consideration is interpretive rather than factual: these “normal” sites
      were in symptomatic patients and therefore do not establish a normal
      population baseline."
    confidence: high
  - claimId: VASO-C182
    verdict: established
    reasoning: VASO-E087 and VASO-E089 directly provide the active- and latent-site
