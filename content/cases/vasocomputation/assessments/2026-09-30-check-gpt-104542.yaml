    confidence: high
  - claimId: VASO-C005
    verdict: well_supported
    reasoning: VASO-E006 supports biochemical differences, while the admitted
      Ballyns records support larger stiff areas and group-level Doppler
      differences at active sites; VASO-E007 reports a broader imaging-review
      residue in the same direction. The finding is therefore supported across
      the three named measurement domains, although not with equally strong or
      independent evidence. The strongest opposing consideration is that much of
      the primary evidence comes from one NIH lineage, uses palpation-selected
      sites, lacks pain-free controls, and shows blood-flow overlap rather than
      a diagnostic vascular signature.
    confidence: moderate
  - claimId: VASO-C006
    verdict: well_supported
    reasoning: VASO-E008 reports preregistered within-subject experiments in which
      attention toward a histamine-prick site reduced and accelerated resolution
      of wheal-and-flare responses without differences in several arousal
      measures. Lidocaine manipulations further supported both sensory and
      top-down contributions. The strongest opposing consideration is that this
      is a very recent single-laboratory acute-skin result, and its vagal immune
      route does not establish direct local vascular control or trigger-point
      release.
    confidence: moderate
  - claimId: VASO-C031
    verdict: established
    reasoning: VASO-E022 directly reports a significantly higher median pulsatility
