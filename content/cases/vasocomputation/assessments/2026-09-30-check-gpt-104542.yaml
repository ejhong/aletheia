    confidence: high
  - claimId: VASO-C187
    verdict: established
    reasoning: VASO-E090 directly reports the mean sonoelastographic area of
      palpably normal sites as 0.17 ± 0.22 cm², exactly matching the claim. The
      claim is limited to a descriptive value from the Ballyns study, so
      independent generalization is not required for its local truth. The
      strongest opposing consideration is that these sites were palpably normal
      locations within symptomatic patients, not normal tissue sampled from
      pain-free controls.
    confidence: high
