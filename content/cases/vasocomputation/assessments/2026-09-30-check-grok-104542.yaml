  synthesis: "The featured hypothesis stacks established smooth-muscle physiology
    and autonomic levers under a contested musculoskeletal construct and then
    leaps to untested vascular memory and contemplative identity. Latch-bridge
    force maintenance at low energetic cost (C010) is textbook and strongly
    evidenced by kinetic models; slow extended exhalation shifts global
    autonomic balance parasympathetically (C013) is likewise well-supported by
    systematic review. Active tender sites show measurable local differences in
    biochemistry, stiffness area on elastography, and some Doppler indices
    versus latent or palpably normal sites within the same symptomatic muscle
    (C005, C031, C032, C182, C187), though the differences are graded,
    classifiers are imperfect, vessels imaged are conduit-scale rather than
    micro, and all comparisons lack pain-free controls. Manual trigger-point
    identification lacks reliability and a reference standard, and the classic
    construct is contested (C030). Spontaneous millimeter-scale EMG activity is
    more prevalent at tender nidi than adjacent non-tender sites (C002) and can
    rise selectively under pure cognitive stress (C003), yet the same activity
    occurs at non-tender endplate-zone sites, so exclusivity fails and the
    generator remains skeletal-endplate or spindle rather than vascular. Felt
    seconds-scale release under pressure-plus-exhale is only first-person
    testimony (C004); the conditional that such speed implies
    state-not-structure (C011) is logically sound but rests on an unmeasured
    premise. Fascial densification reversibility (C077), pressure-alone
    insufficiency (C039), blood-first ordering (C073), composite three-element
    hold (C174), site-selective sympathetic write as blushing (C143), and
    contemplative-map identity (C022) lack non-proponent primary measurements.
    Hemo-neural modulation exists in weak form (C012) via demonstrated
    mechanosensitive channel effects of pressure pulsations, yet storage of
    content-specific predictions or tanha (C021) has no write–store–read
    demonstration and is undermined by the absence of latch energetics or
    dephosphorylated hold in the pressurized skeletal-muscle arterioles the
    hypothesis requires. The central identification of knots as latched
    microvascular smooth muscle producing ischemia plus secondary guarding
    (C020) therefore inherits real lower-rung physiology and real local
    abnormalities but supplies no direct observation of latch, of smooth-muscle
    identity, or of seconds-scale objective release at a tender point; critical
    audits grade both linchpins D. Sensitivity is high to the critical-report
    absence-of-evidence matrix and the arteriole audit: without them the
    vascular attribution would look merely untested rather than mismatched.
    Overall the case is mixed—lower mechanism and observation rungs hold or are
    provisionally supported, the construct is methodologically fragile, and the
    synthesis/attribution rungs remain unresolved or weakly supported.
    State-not-scar is more plausible than pure scar, yet the specific
    vascular-autonomic latch-and-mind implementation is an extrapolation that
    the ledger's own studies have begun to constrain rather than confirm."
  steelman: Consistent multi-practitioner first-person reports of discrete,
    exquisitely tender points that release under sustained pressure timed to a
    long exhale within seconds, accompanied by local warmth or paresthesia and
    sometimes cascading regional softening, remain unexplained by scar or simple
    endplate noise and predict a low-energy, history-dependent, autonomically
    gated hold that no completed imaging study has yet directly tested or
    falsified.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    reasoning: Johnson’s three hypotheses and the essay’s tanha mapping are
      theoretical statements (E013, E038) with no experimental write–store–read
      loop in mammalian tissue. E017 correctly notes that latch hysteresis is
      not yet content-addressable memory and that the nearest genuine
      flow-network memory is Physarum. Salameh 2024 (E005) supplies only
      instantaneous mechanical modulation, not storage. Strongest opposing
      consideration is that the weak hemo-neural form is now plausible while the
      strong cognitive form has zero direct tests.
    confidence: high
  - claimId: VASO-C020
    verdict: weakly_supported
    reasoning: Lower components (latch capability, local ischemia-compatible
      biochemistry and flow abnormalities, secondary guarding) are real, yet
      E016 grades both linchpins—objective seconds-scale release and
      smooth-muscle identity—as D (no direct evidence). E019–E020 show no
      energetic latch measurement in any arteriole and maintained
      phosphorylation rather than dephosphorylated hold in pressurized
      skeletal-muscle arterioles. E027’s Doppler findings are compatible with
      contracture compression equally. Strongest opposing consideration is that
      the state-not-scar reading survives even if the specific vascular latch
      fails.
    confidence: moderate
