  synthesis: >-
    The ledger has plenty of evidence for the lower parts of this case and none
    where the featured hypothesis becomes distinctive.

    At the mechanism rung, the components are real: - Tonic vascular smooth
    muscle can hold force economically as activation falls (E003; C010). - Slow
    breathing shifts global autonomic indices (E009; C013). - Pulsatile
    hemodynamics can drive neurons (E005; C012). - Voluntary attention can
    regulate a peripheral vascular bed without a change in measured arousal
    (E008; C006).

    At the observation rung, trigger points are measurably distinct tissue: -
    They are stiffer on blinded sonoelastography, in a graded order: active >
    latent > normal (the admitted E087–E107 records; C182, C187). - An
    independent group found the same active > latent ordering in another muscle
    (E070, E071, E085). - They carry an endplate-zone electrical signature
    (E001, E031, E032). - They show group-level Doppler and biochemical
    differences (E006, E022). - In one small study they responded selectively to
    mental arithmetic (E002).

    Each of these is also predicted by the conventional accounts: endplate
    dysfunction and sustained contracture compressing the local vascular bed,
    with secondary sensitization. Ballyns's own authors offer that account for
    the high-resistance flow (E027). These findings show that knots are active,
    reversible tissue states worth explaining. They do not distinguish the latch
    account from its rivals.

    Where the records do discriminate, they lean against the latch formulation:
    - The only data on the compartment C020 names show pressurized
    skeletal-muscle arterioles holding tone by maintained or rising myosin
    phosphorylation, not a latch signature (E020). - The one paired comparison
    found latch behaviour in a conduit artery and not one branch order
    downstream (E021). - No energetic measurement exists in any arteriole
    (E019). - The electrical signature tracks the motor endplate zone, not
    anything vascular (E031, E032). - The only instrumented pressure-only
    protocol saw most stiff foci become sonographically undetectable with
    breathing unmanipulated (E067, E072). At face value this contradicts the
    two-key premise (C039).

    The remaining rungs are thin: - The anchor phenomenon, a felt release within
    seconds on the exhale, is uncontrolled proponent testimony (E014), and its
    objective counterpart has never been imaged (E016). - The step from a fast
    release to an actively maintained state (C011) ignores passive mechanisms.
    That point comes from general biomechanics, not from ledger records. - The
    top rung has a read path only in instantaneous form and no write–store–read
    demonstration (E017; C021). - The contemplative-map claim rests on one
    uncited assertion (E039; C022).

    Steelman for the hypothesis: the conventional rival is not established here
    either. Its premise that the stiff focus is sustained contraction with high
    metabolic demand is untested, and no structural lesion has ever been
    demonstrated (E010). Taken together, the observations fit the phenotype a
    low-cost, autonomically writable hold predicts: maintenance without a
    lesion, erasure within minutes under compression, a site-selective write by
    a mental event, and high-resistance flow nearby. The discriminating
    experiments (VASO-R001, VASO-R004, VASO-R013, VASO-R016) are cheap and
    unrun, so the latch has not been excluded where it matters.

    Steelman against the hypothesis: the latch has never been observed at a
    tender point. The compartment where it was checked holds tone another way,
    the signal taken as the knot's is neuromuscular, and pressure alone appears
    to suffice. The proponent's own second essay also moves the vascular element
    to cutaneous perforators (E044). That concession is not evidence, but it
    means "latched smooth muscle" is no longer the proponent's working
    formulation.

    Verdict: unresolved, as a finding rather than a default. The hypothesis's
    discriminating predictions have no data: blood-first timing (C073), a latch
    at a tender point, metabolically cold knots, a localized stress-induced
    perfusion fall (C143), and breath-gated release. The supportive record
    cannot tell the accounts apart. The mechanism-level records lean against the
    latch without testing it where the hypothesis needs it.

    I withhold "contradicted" for three reasons. No study has looked for a latch
    at a knot. The arteriole studies held their stimulus throughout, so they
    could not show persistence after the input stops. The perforator variant is
    untouched by them. I withhold "weakly supported" because no record favours
    the featured account over its rivals.

    Sensitivity: the record whose removal would most change this verdict is
    VASO-E020, the only measurement in the compartment C020 names. Without it
    the verdict survives as unresolved but loses most of its negative lean,
    which would then rest on E019's absence of measurement and E021's single
    paired comparison. The verdict does not hang on one thread; it rests on the
    absence of any discriminating test, not on any single result. E016, which
    the ledger calls its most important undermining record, is not load-bearing
    here, because the absence it reports is visible directly in the records.
  steelman: "My assessment discounts the stiffness, Doppler and biochemical
    abnormalities at trigger points as equally predicted by a contracture or
    energy-crisis account. But that rival's own distinctive premise is untested
    in this ledger: that the stiff focus is sustained sarcomere contraction with
    high local metabolic demand. The observation that would separate the two
    accounts has never been made: a knot that is stiff on elastography,
    electrically active on EMG and metabolically cold on FDG-PET (VASO-R013).
    Add three more observations: stiff foci that become sonographically
    undetectable within minutes of compression (E072), a site-selective rise in
    activity under a purely mental stressor (E002), and the absence of any
    demonstrated structural lesion (E010). A proponent can then rightly say the
    ledger describes a low-cost, stress-writable, rapidly erasable hold, the
    phenotype a latch-like state predicts. No mechanism in the ledger, featured
    or rival, has been shown to supply that maintenance."
