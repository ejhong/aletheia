  synthesis: "The case stays unresolved because its best-evidenced parts decide nothing and its deciding parts are unmeasured. The latch model (VASO-E003, on VASO-C010), slow breathing's autonomic shift (VASO-E009, on VASO-C013) and vascular-to-neural modulation in rat brain (VASO-E005, on VASO-C012) are credible, but guarding and ordinary physiology predict them too. The observation base is real at group level: acidic, mediator-rich chemistry (VASO-E006, on VASO-C005) and graded stiffness at blinded sonography (VASO-E087 and VASO-E089 on VASO-C182; VASO-E090 on VASO-C187). The Doppler signature is partial (VASO-E022 on VASO-C031 and VASO-C032). It is capped by the absence of pain-free controls (VASO-E026) and by a null resistivity index (VASO-E024, on the resistivity claim). The electrical nidus is a prevalence gradient centred on the endplate zone (VASO-E001 and VASO-E031, on VASO-C002). A mental stressor raises it (VASO-E002, on VASO-C003), but against an unmatched control. Palpation is unreliable (VASO-E011, VASO-E010 and VASO-E081, on VASO-C030). Where the original thesis needs the latch, the record points away. On VASO-C020, pressurized skeletal-muscle arterioles show maintained activation (VASO-E020), no arteriole's holding cost has been measured (VASO-E019), and no latch has been identified at a tender point (VASO-E016). On VASO-C010, latch behaviour vanished one branch downstream in the only paired comparison (VASO-E021). The felt release rests on proponent testimony (VASO-E014, on VASO-C004). The two-key necessity (VASO-C039) has one context record (VASO-E067), which establishes only that a pressure-only protocol gave no breathing instruction. What that protocol achieved is recorded on VASO-C005 (VASO-E072) and is not spent on the two-key claim. Palpable points (VASO-C190) are provisionally supported on sibling imaging records. Their commonness (VASO-C191) has no measuring record: VASO-E108 and VASO-E109 are context. The perforator account, densification's reversibility and the blood-first ordering are held on their sources alone. The memory attribution fails the write–store–read test (VASO-E017). No single removal flips the verdict. Removing VASO-E020 would most change the case, returning the arteriole compartment to unexamined."
  steelman: The classic energy-crisis account has never explained how skeletal fibres stay contracted for years without exhausting themselves. A latch holds tension for almost nothing; and on the perforator proponent's reading, a skin arteriole, which the body already keeps constricted by ordinary tone, would not even need the economy. The electrical nidus is millimetre-scale, and a mental stressor raised it at trigger points while nearby control sites stayed comparatively quiet. Its presence at four of eleven non-tender endplate-zone sites does not explain its presence at eleven of eleven trigger points. Blinded sonographers in two laboratories found stiffer regions exactly where examiners palpated, graded active above latent above normal in the trapezius, and nearby arteries behaved differently. Preregistered experiments show attention regulating a peripheral vascular bed at a chosen site without any change in arousal — a demonstrated write channel. Every arteriole study showing maintained activation kept its stimulus on, so none could have detected a hold that outlasts its input, which is the only state a knot needs. The one pressure-only protocol neither instructed nor recorded breathing. Proponents argue that people under painful pressure tend to exhale, and the inhale-and-hold arm that would exclude this has not been run. The vascular accounts also predict something their rivals do not — perfusion rising before stiffness falls — and it is cheap to test. None of this shows that knots are vessels; it is why the verdict cannot close against them.
