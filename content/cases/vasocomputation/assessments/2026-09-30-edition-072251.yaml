    reasoning: Mean stiff areas of 0.57 cm² at active and 0.36 cm² at latent sites on blinded vibration sonoelastography (VASO-E087, VASO-E089, VASO-E104). The calf parallel and further listings are context (VASO-E085, VASO-E093, VASO-E106). One laboratory, one vibration frequency, palpation-selected sites.
    confidence: moderate
    treatment:
      plainLanguage: Stiff regions are larger at points painful on their own than at points painful only when pressed.
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A graded stiffness ordering that all accounts can accommodate.
      strongestObjection: The site classes are defined by the same palpation whose reliability is disputed.
      whatWouldChangeOurMind:
        - Independent replication with instrument-defined sites.
        - The gradient disappearing under blinded site selection.
  - claimId: VASO-C187
    verdict: provisionally_supported
    reasoning: Palpably normal sites measured 0.17 ± 0.22 cm² (VASO-E090, VASO-E104, VASO-E105, VASO-E107), well below trigger-point sites. The normal sites lay in symptomatic muscle, and there were no pain-free controls.
    confidence: moderate
    treatment:
      plainLanguage: Normal-feeling spots in the same muscles had much smaller stiff areas.
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: Supplies the comparison that makes the stiffness gradient; does not decide the mechanism.
      strongestObjection: Wide variance, and the 'normal' tissue sits in painful muscle.
      whatWouldChangeOurMind:
        - Pain-free control values from an independent laboratory.
