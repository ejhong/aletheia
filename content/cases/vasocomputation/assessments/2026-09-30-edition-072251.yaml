caseAssessment:
  verdict: unresolved
  whatIsClaimed: "Muscle knots are maintained vascular-autonomic states, not damaged tissue — in the graded form, latched microvascular smooth muscle throttling local flow, with guarding on top, released by pressure plus slow exhalation. Admitted evidence carries the surroundings: palpated points differ in chemistry, graded stiffness and partly in flow; a stress-sensitive electrical nidus; the latch in conduit arteries; slow breathing's global effect. The breath's necessity and a skin-perforator variant are held on their sources alone; vascular memory in the mind rests on hypothesis statements."
  whereDisagreementLives: "The crux is whether anything objective happens locally when a knot 'releases' on a slow exhale — stiffness falling and perfusion rising within seconds, beyond pressure, expectation and global relaxation. Behind it sit three disputes. Which tissue holds the state: an intramuscular arteriole (where measurements show maintained activation, not latch), a skin perforator (unmeasured), stress-sensitive endplates, or fascial hyaluronan? Is the breath a key at all, given a pressure-only protocol that cleared imaged points with breathing uninstructed? And can palpation reliably find the points?"
  whatWouldSettleIt: "A time-locked imaging study of single releases would settle it: elastography and sensitive Doppler over blinded-located knots, with pressure-only, breath-only, inhale-hold and sham controls. Stiffness and perfusion changing together within seconds of the exhale, blood first, beyond all controls, would favour a vascular state; felt releases with no local change would return knots to guarding. Cheaper companions: the runners' compression protocol repeated with breathing randomised, a blinded tender-point-to-perforator map, and a paired-caliber arteriole study with stimulus withdrawal."
  bestConventionalExplanation: "Tender points are neuromuscular guarding: sustained, centrally maintained, stress-sensitive motor drive and endplate activity in skeletal muscle, possibly with densified fascial hyaluronan. The electrical signature is endplate noise, commoner where tissue is tender and present at some non-tender endplate-zone sites; a stressor raising drive to endplates raises it. The stiff region sonographers map is contracted fibre, graded with symptoms. The acidic chemistry and high-resistance Doppler waveforms follow from contracture compressing the bed, which the imaging authors themselves list as a cause, while a second resistance index shows no difference at all. Pressure switches guarding off or thins the lubricant. That is why a compression protocol with breathing uninstructed made most imaged points undetectable within minutes. The felt release on an exhale is expectation and attention riding slow breathing's global parasympathetic shift. Poor palpation reliability means part of the observation base may be artifact. The account's gap is the localized, blinded, instrumented findings a purely central story must still explain."
