id: VASO-001
slug: vasocomputation
title: "State, Not Scar?"
subtitle: "Are muscle knots maintained vascular-autonomic states — latched smooth muscle — rather than damaged tissue, and does vascular tension participate in the mind?"
domain: "Musculoskeletal medicine · Autonomic physiology · Contemplative science"
status: active
summary: >-
  Anyone with a foam roller can locate dozens of small, discrete, exquisitely
  tender points in their own body — yet the research literature still argues
  about what they are, and partly about whether they exist. The vasocomputation
  hypothesis proposes that these "knots" are not damaged tissue but maintained
  physiological states: vascular smooth muscle held in its low-energy latch,
  writable by stress, readable as stiffness and ache, and releasable through
  the one voluntary handle on the autonomic system — the breath. The idea runs
  from textbook smooth-muscle physiology through a minority hypothesis about
  blood and computation to open speculation about contemplative anatomy. The
  lower rungs are established science; the upper rungs have never been tested;
  and the single experiment that would decide the central crux has never been
  run.
whatIsClaimed: >-
  Muscle knots are latched vascular-autonomic states rather than structural
  lesions: microvascular smooth muscle locked in the latch-bridge state,
  throttling local blood flow and sensitizing local nerve endings, with
  secondary skeletal-muscle guarding on top. More broadly: vascular tension
  functions as a memory element that participates in mental life — the
  physical implementation of what contemplative traditions call clinging.
whereDisagreementLives: >-
  Not over whether people feel tender spots, and not over whether smooth
  muscle can latch — both are common ground. The crux is whether anything
  objective happens locally when a knot "releases" on a slow exhale: does
  local tissue state (stiffness, perfusion) change within seconds, time-locked
  to the breath, beyond what pressure, expectation, and generalized relaxation
  produce — and is any smooth-muscle latch actually present at these sites?
  No study has ever looked, and the skeptical literature disputes whether the
  trigger-point construct is even reliably identifiable.
whatWouldSettleIt: >-
  A time-locked imaging experiment: ultrafast elastography and sensitive
  Doppler over a palpated knot during breath-assisted release, with blinded
  site localization, calibrated pressure, factorial controls (pressure without
  slow breath, breath without pressure, sham sites, failed attempts), and a
  preregistered prediction — stiffness drops and perfusion rises within
  seconds, together, time-locked to the exhale, exceeding all controls. A
  companion study demonstrating (or excluding) smooth-muscle latch physiology
  at tender points would decide the mechanism claim. Either outcome would be
  decisive.
bestConventionalExplanation: >-
  Tenderness and its relief need no vascular memory. The conventional account
  explains tender points as neuromuscular guarding — sustained low-level motor
  drive and endplate activity in skeletal muscle, centrally maintained and
  stress-sensitive — plus altered fascial gliding, with the felt "release"
  produced by some combination of expectation, attention, pressure-induced
  changes in local sensation, and the well-documented generalized
  parasympathetic shift of slow breathing. On this reading nothing latches and
  nothing is stored locally: the brain simply stops guarding, globally or
  regionally, and interpretation supplies the rest. A stricter version adds
  that the trigger-point construct itself has poor examiner reliability and no
  validated objective marker, so the observational base may be partly an
  artifact of training and expectation. This account requires no new
  physiology, which is its strength; its gap is the set of localized objective
  findings (spontaneous EMG confined to a millimeter-scale nidus, abnormal
  local chemistry and hemodynamics) that a purely central or interpretive
  story must still explain.
