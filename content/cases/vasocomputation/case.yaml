id: VASO-001
slug: vasocomputation
title: "State, Not Scar"
subtitle: "Are muscle knots maintained vascular-autonomic states — latched smooth muscle — rather than damaged tissue, and does vascular tension participate in the mind?"
domain: "Musculoskeletal medicine · Autonomic physiology · Contemplative science"
status: active
summary: >-
  Anyone with a foam roller can locate dozens of small, discrete, exquisitely tender points in their own body — yet the research literature still argues about what they are, and partly about whether they exist. The vasocomputation hypothesis proposes that these "knots" are not damaged tissue but maintained physiological states: vascular smooth muscle held in its low-energy latch, writable by stress, readable as stiffness and ache, and releasable through the one voluntary handle on the autonomic system — the breath. The idea runs from textbook smooth-muscle physiology through a minority hypothesis about blood and computation to open speculation about contemplative anatomy. The lower rungs are established science; the upper rungs have never been tested; and the single experiment that would decide the central crux has never been run.
