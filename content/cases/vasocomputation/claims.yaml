# ── Mechanism rung ──────────────────────────────────────────────────────────

- id: VASO-C010
  statement: >-
    Vascular smooth muscle can maintain contractile force for prolonged
    periods at a small fraction of normal energetic cost after activating
    signals subside — the latch-bridge state.
  plainLanguage: >-
    Textbook physiology since 1988: smooth muscle has a ratchet setting.
    Stimulate an artery and the chemical activation spikes and falls back —
    but the force stays, held by dephosphorylated cross-bridges that grip
    without cycling. A cheap, history-dependent hold.
  theme: latch
  rung: mechanism
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Knots of Existence essay — the latch-bridge; Hai & Murphy 1988"
    extractedBy: "Fable (AI agent)"
    runId: "vaso-extract-2026-08"
    date: "2026-08-22"
  credibility: well_supported
  credibilitySummary: >-
    The Hai–Murphy latch-bridge model is standard smooth-muscle physiology
    with decades of supporting work, though the precise molecular
    interpretation is still discussed. What is not established is the
    presence of this mechanism at tender points, or holds on the timescales
    (months, years) the synthesis requires.
  diagnosticity: low
  diagnosticitySummary: >-
    Availability of a mechanism is weak evidence that it is used: the latch
    exists in arteries everywhere, which says nothing about whether knots
    are made of it.
  parentClaimIds: [VASO-C020]
  dependsOnClaimIds: []
  strongestObjection: >-
    Latch physiology is documented in vascular preparations over minutes to
    hours; treating it as an indefinite-duration storage element in vivo, at
    specific addressable sites, extrapolates far beyond the latch literature.
  whatWouldChangeOurMind:
    - "Direct measurement of smooth-muscle biochemical state (myosin light-chain phosphorylation, Ca²⁺) at tender-point vasculature versus control tissue (VASO-R004)."

- id: VASO-C011
  statement: >-
    If a tender point objectively releases within seconds, the released
    entity is an actively maintained physiological state, not remodeled
    tissue structure.
  plainLanguage: >-
    The timescale argument at the heart of the case: structural change in
    tissue — actual remodeling of collagen or scar — takes days to weeks. A
    knot that can vanish mid-exhale must be something the body is actively
    doing and can stop doing. The inference is sound; its premise (the
    objective seconds-scale release) is the thing never yet measured.
  theme: latch
  rung: mechanism
  claimType: interpretive
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Knots of Existence essay — speed of release"
    extractedBy: "Fable (AI agent)"
    runId: "vaso-extract-2026-08"
    date: "2026-08-22"
  credibility: provisionally_supported
  credibilitySummary: >-
    The conditional logic is solid — tissue-remodeling timescales are
    established, so a genuine seconds-scale local change would have to be a
    state change. But the antecedent rests on first-person reports
    (VASO-C004); if felt releases turn out to have no local objective
    correlate, this claim becomes vacuously true and carries nothing.
  diagnosticity: high
  diagnosticitySummary: >-
    The hinge between phenomenology and mechanism: it converts a verified
    fast release into strong evidence against structural accounts (scar
    tissue does not release on an exhale) and toward maintained-state
    accounts of any kind.
  parentClaimIds: [VASO-C020]
  dependsOnClaimIds: [VASO-C004]
  strongestObjection: >-
    The felt release may be a perceptual and central event — reduced
    guarding, reinterpreted sensation — with no local tissue change at all,
    in which case nothing physical released and the timescale argument has
    no premise to work on.
  whatWouldChangeOurMind:
    - "Time-locked elastography/Doppler showing (or failing to show) objective local change within seconds of a felt release (VASO-R001)."

- id: VASO-C012
  statement: >-
    Local vascular and hemodynamic state can modulate the activity of nearby
    neurons — the hemo-neural hypothesis.
  plainLanguage: >-
    Everyone agrees neurons drive blood flow (that coupling is what fMRI
    measures). The minority proposal, made by Moore and Cao in 2008, is that
    the arrow also runs backward: vessels dilating and constricting deform
    tissue, change temperature and chemistry, and neurons carry
    pressure-sensitive channels that can feel it.
  theme: hemo-neural
  rung: mechanism
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "Knots of Existence essay — hemo-neural hypothesis; Moore & Cao 2008"
    extractedBy: "Fable (AI agent)"
    runId: "vaso-extract-2026-08"
    date: "2026-08-22"
  credibility: provisionally_supported
  credibilitySummary: >-
    Still a minority position, but the evidence has moved toward it: Piezo
    mechanosensitive channels earned a Nobel Prize in 2021, and a 2024
    Science study demonstrated blood-pressure pulsations modulating neuronal
    activity through mechanosensitive channels in rats. The demonstrated
    effects are instantaneous modulation in brain tissue, not stored
    information and not the periphery.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Necessary for any vasocomputation reading — without a read-back path
    there is no loop — but instantaneous modulation is equally at home in
    conventional physiology.
  parentClaimIds: [VASO-C021]
  dependsOnClaimIds: []
  strongestObjection: >-
    A vascular effect on neurons is not yet vascular information: reduced
    perfusion trivially suppresses neural activity through metabolic
    limitation, so any claimed hemo-neural computation must be distinguished
    from ordinary ischemic modulation with oxygenation controlled.
  whatWouldChangeOurMind:
    - "The vascular-memory readout experiment (VASO-R005) succeeding or failing under controlled oxygenation."

