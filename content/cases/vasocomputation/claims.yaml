  plainLanguage: >-
    The 1993 Hubbard and Berkoff finding: put a fine needle electrode in a
    trapezius trigger point and you record continuous electrical chatter in
    muscle that is supposedly at rest; move it a centimeter into non-tender
    muscle and the signal vanishes. The knot is an island of maintained
    activity.
  theme: neural-signature
  rung: observation
