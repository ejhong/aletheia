- id: VASO-C021
  statement: >-
    Vascular smooth-muscle tension functions as a memory element that
    participates in mental life: predictions, held expectations, and the
    grasping that contemplative traditions call clinging (tanha) have a
    vascular implementation.
  plainLanguage: >-
    The headline thesis, from Michael Edward Johnson's vasocomputation
    framework: the body's blood-vessel tone is not just plumbing but part of
    the machinery of mind — a distributed medium in which the nervous system
    stores what it is holding onto.
  theme: synthesis
  rung: attribution
  claimType: interpretive
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "Knots of Existence essay — vasocomputation synthesis; Johnson 2023"
    extractedBy: "Fable (AI agent)"
    runId: "vaso-extract-2026-08"
    date: "2026-08-22"
  credibility: unresolved
  credibilitySummary: >-
    The weak form — vascular state is part of the state-space that shapes
    neural computation — is now scientifically live, with direct animal
    evidence for the vascular-to-neural direction. The strong form — that
    latch states store identifiable predictions or mental content — has no
    direct evidence: no experiment has demonstrated the full write, store,
    read-back cycle with content specificity.
  diagnosticity: high
  diagnosticitySummary: >-
    This is the thesis itself; everything below the ladder exists to test it.
  parentClaimIds: []
  dependsOnClaimIds: [VASO-C010, VASO-C012]
  strongestObjection: >-
    Hysteresis is not memory: a thermostat's state also depends on its
    history, but nothing reads it as content. Showing that vascular tone
    retains information is trivial; showing that neurons later read out that
    information in a task-relevant way has never been done, and every
    demonstrated vascular effect on neurons so far is instantaneous
    modulation, not stored content.
  whatWouldChangeOurMind:
    - "An animal experiment showing that an induced, persistent vascular state biases later neural responses toward a previously paired pattern after the initiating input has ceased, with oxygenation controlled (VASO-R005)."
    - "A demonstrated failure: vascular manipulation affecting neural gain only via instantaneous perfusion, with no history dependence once those variables are equalized."

