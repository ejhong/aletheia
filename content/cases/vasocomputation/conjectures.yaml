# On-the-record editorial conjectures. A conjecture carries no evidential
# weight anywhere on this site: it does not touch any claim's credibility,
# and the evidence ledger is assessed as if this file did not exist. Its
# job is the opposite — to make the site's own editors falsifiable.

- id: VASO-J001
  by: "Eugene (ejhong)"
  date: "2026-08-23"
  statement: >-
    Muscle knots are real, actively maintained physiological states — not
    perceptual artifacts and not structural damage — and the decisive clue
    to their nature is that sustained attention plus breath alone, on a
    long exhale, releases them in seconds.
  confidence: >-
    High that the knots are real and that breath-triggered release is a
    genuine physiological event — grounded in years of direct first-person
    experimentation with rolling. Moderate, and stated as intuition, on
    the specific vascular latch-bridge mechanism.
  rationale: >-
    Recorded from the founder's "Knots of Existence" essay (August 2026,
    research/vasocomputation/). The core is self-knowledge available to
    anyone with a foam roller and twenty minutes: the points are discrete,
    exquisitely tender, precisely localizable, and unmistakable — the
    academic dispute over whether they "exist" is not survivable after an
    hour of direct contact with one's own body. The load-bearing
    observation is the release dynamics: pressure locates a knot but
    pressure alone does not release it; release comes with the BREATH,
    on a long exhale, in seconds. That one fact does heavy inferential
    work. Structural remodeling takes days to weeks, so whatever lets go
    mid-exhale must be a state the body is actively holding and can stop
    holding — not scar tissue, not densification alone. And the exhale is
    precisely the one voluntary handle on the autonomic nervous system,
    while smooth muscle is precisely the tissue that cannot be commanded
    voluntarily but responds exquisitely to autonomic state. The
    two-key protocol — pressure as the address, breath as the permission
    — points at an autonomically held grip in the microvasculature, for
    which the latch-bridge state is textbook physiology waiting to be
    looked for in the right place. Recorded as intuition; the predictions
    and disconfirmers carry the accountability.
  predictedFindings:
    - "Imaging a single release event (elastography + Doppler through the same probe) shows a rapid, local change in stiffness and perfusion time-locked to the exhale, on a seconds timescale incompatible with structural remodeling."
    - "Active knots show the state-not-structure signature: stiff on elastography, electrically active on EMG, hemodynamically abnormal on Doppler (retrograde flow, elevated pulsatility), yet largely invisible to structural imaging."
    - "Direct measurement at tender points demonstrates a smooth-muscle latch state (sustained tension at disproportionately low energy turnover — a metabolic cold spot rather than the 'energy crisis' hot spot)."
    - "Breath-and-attention protocols without external pressure produce measurable releases at reachable sites, weaker but of the same physiological kind as pressure-plus-breath."
  disconfirmers:
    - "The keystone imaging experiment (VASO-R001-class), adequately instrumented, finds no local physiological change accompanying clear felt releases — the release is then perceptual, and the maintained-state claim should be marked refuted."
    - "Direct latch-sensitive measurement at tender points, validated on known latch-bridge controls, finds no latch state — the vascular mechanism should then be dropped even if the knots-as-states claim survives by another mechanism."
    - "Time-locking fails: measured tissue changes follow releases by hours-to-days rather than seconds, consistent with remodeling — the breath-as-key inference should then be withdrawn."
  decisiveTestIds: [VASO-R001, VASO-R004]
  status: open
