rvations that carry the undermining detail (retrograde flow at normal sites, null resistivity, endplate noise outside trigger points). No unfeatured claim has an evidence record beyond the essay, so none earns promotion. The crux order adds VASO-R013 (the FDG-PET overlay, the one imaging test that distinguishes a low-energy hold from active contraction or inflammation) after the localization studies, and VASO-R014 (retrieval of the primaries behind the euphoria and adverse-effect claims) near the end; VASO-R007 stays last as executed. The article keeps the incumbent's structure and voice, corrects the contemplative-maps passage and the research-agenda count (fourteen items, not twelve), states the latch as low rather than zero activation where the essay overstates it, adds the metabolic prediction to the what-would-change-our-mind lists, notes the essay's release-euphoria and destabilization reports as catalogued but unmeasured phenomenology, and removes a sentence that narrated the case's own revision of the electrical-nidus reading. Both plates are retained in their seats."
