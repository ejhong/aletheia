- id: VASO-E020
  title: "Study table: in pressurized skeletal-muscle arterioles, maintained constriction tracks maintained activation rather than the latch signature"
  claimIds: [VASO-C020]
  sourceId: SRC-VASO-S001
  direction: undermines
  strength: moderate
  sourceStatement: >-
    Three rows are pressurized skeletal-muscle resistance vessels — rat
    cremaster and gracilis — in which LC20 phosphorylation was measured against
    diameter. In all three, maintained constriction is accompanied by
    maintained or rising phosphorylation rather than by force held while
    activation falls: 27.7% at 30 mmHg rising to 39.6% at 120 mmHg (Zou, Ratz &
    Hill 1995, at 34 degrees C in roughly 100-micrometre arterioles); a
    monophasic rise correlated with instantaneous wall tension (Zou, Ratz & Hill
    2000); and 40% already at 10 mmHg rising to about 55% at 80 mmHg with no
    further change to 140 mmHg (Moreno-Dominguez et al. 2013, which attributes
    the sustained constriction to Rho-kinase-mediated Ca2+ sensitization and
    actin polymerization). The 2000 paper states that spontaneous arteriolar
    tone "represents a state of maintained smooth muscle activation that
    requires increases in [Ca2+]i and myosin light-chain phosphorylation."
  editorInference: >-
    This is the first record in the case bearing directly on the tissue
    compartment VASO-C020 names, and it does not fit the latch picture: at
    arteriole caliber the published measurements show sustained activation, not
    an economical dephosphorylated hold. It is a mismatch rather than a
    refutation — none of the three studies was designed as a latch test, all
    held their stimulus present throughout, and none measured energetic cost.
    What it removes is the assumption that the arteriole compartment is simply
    unexamined; it has been examined with the right molecular readout, and what
    was found there points at a different mechanism for holding constriction.
  exactLocator: "Study VASO-S001, finding 2 (full table on the study page)"
  limitations:
    - "All three rows were built from published abstracts; full texts were not accessible, so temperature is recorded for only one of the three and endothelial status for none."
    - "Myogenic tone is by construction a response to a maintained stimulus, so these studies could not have shown input-free persistence even if it exists."
  reviewState: ai_extracted
  origin:
    ref: "Study VASO-S001 (criteria frozen 2026-09-01, hash fe5e031b8b8f)"
    extractedBy: "Aletheia editorial AI (Claude Opus 5, Cursor cloud agent)"
    runId: "2026-09-01-study-vaso-s001-collection"
    date: "2026-09-01"

