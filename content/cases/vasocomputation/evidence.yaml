  sourceId: SRC-BALLYNS-2011
  direction: supports
  strength: weak
  sourceStatement: 'The source reports that arteries near active and latent sites had highly pulsatile flow with retrograde diastolic flow more often than normal tissue, and that "prominent blood vessels were observed in the close vicinity of trigger points". It offers two explanations for pulsatile flow — increased compliance/volume of the vascular compartment, or increased outflow resistance — and lists possible causes of the latter: "muscle contracture at the trigger point that compresses the capillary/venous bed", anatomic geometry of the trapezius apex, local vasoconstriction due to inflammation, or externally applied pressure from the transducer. It frames its integrated-hypothesis discussion around capillary constriction, ischemia and hypoxia and notes increased vessel presence as a possible angiogenic response.'
