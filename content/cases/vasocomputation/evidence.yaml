    attribute to expressed motor proteins that do not support latch-bridge
    formation, together with greater MLC phosphatase. The pressurized follow-up
    reports the same asymmetry in diameter behaviour. Forward citation chaining
    from both 2006 papers located no study extending the comparison into
    arterioles or the microcirculation.
