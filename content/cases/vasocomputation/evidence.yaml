# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit; sourceStatement (what the
# source says) is kept separate from editorInference (what we infer).

# ── The neural signature ─────────────────────────────────────────────────────

- id: VASO-E001
  title: "Spontaneous EMG activity confined to the trigger-point nidus"
  claimIds: [VASO-C002]
  sourceId: SRC-HUBBARD-BERKOFF-1993
  direction: supports
  strength: moderate
  sourceStatement: >-
    Monopolar needle EMG recorded simultaneously from trapezius trigger
    points and adjacent non-tender fibers found sustained spontaneous
    activity in the 1–2 mm nidus of all trigger points and none in the
    non-tender sites; amplitude was higher in tension-headache and
    fibromyalgia patients than in normals. The authors hypothesized
    sympathetically activated intrafusal (spindle) contractions.
  editorInference: >-
    Whatever a knot is, it is electrically maintained: a discrete island of
    ongoing activity in muscle that is nominally at rest — state, not scar.
  limitations:
    - "1993, small sample, one lab; the signal's generator is still contested (endplate potentials vs spindles)."
    - "The recorded activity is skeletal-muscle electrophysiology; nothing here measures vasculature."
