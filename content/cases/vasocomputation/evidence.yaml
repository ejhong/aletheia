    (1.3e5 N/m2 at 10 min, MLC phosphorylation 42%) against a 40% stress loss in
    its own muscular branch (0.8e5 N/m2, phosphorylation 28%), which the authors
    attribute to expressed motor proteins that do not support latch-bridge
    formation, together with greater MLC phosphatase. The pressurized follow-up
    reports the same asymmetry in diameter behaviour. Forward citation chaining
    from both 2006 papers located no study extending the comparison into
    arterioles or the microcirculation.
  editorInference: >-
    VASO-C010 states a capability, and the capability is real — but the ledger
    should no longer be read as saying that vascular smooth muscle generically
    latches. The one published comparison between a vessel and its own
    downstream branch found the behaviour present in the parent and absent one
    branch order later, which makes vessel type and motor-protein phenotype
    load-bearing variables rather than incidental ones. That nobody has run the
    comparison further down is the specific gap VASO-R004's paired-caliber
    design now exists to close.
