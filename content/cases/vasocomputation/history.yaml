- date: "2026-09-01"
  kind: content
  change: >-
    Study VASO-S001 pre-registered (freeze only, zero rows), executing the new desk research item VASO-R007: an evidence map of every eligible primary report in which sustained vascular force or constriction was measured alongside a contemporaneous readout of activation, cross-bridge cycling, or energetic cost. Criteria hash fe5e031b8b8f. Frozen design decisions, each taken before any data exists: every row carries TWO independent grades (how directly it evidences the phenomenon, and how close its preparation is to a pressurized skeletal-muscle arteriole), so a strong result in a remote tissue cannot be counted as direct support for VASO-C020; the energetic criterion admits oxygen consumption, heat, lactate and phosphocreatine rather than a measured ATPase alone; caliber is recorded with the transmural pressure at which it was measured; and stimulus persistence after withdrawal is a column, because economical maintenance under continuing activation is a different finding from a state that holds on its own. Eight known candidates pre-committed with dispositions, seven resolved to primary documents at freeze and one recorded as an unlocated lead. VASO-R004 amended in the same change to a paired-caliber, pressurized design with an explicit stimulus-withdrawal phase. Collection follows in a separate PR.
  reason: >-
    C020 rests on an inferential step the ledger never checked — latch behaviour exists in vascular smooth muscle, therefore it can hold a skeletal-muscle microvessel shut — and VASO-E016 already grades the vascular linchpin D on an admittedly incomplete search. Whether the published record contains a demonstration at the caliber the hypothesis needs is answerable at desk cost, and is worth answering before VASO-R004 is designed rather than after. Freezing first is what keeps the criteria from being tuned to the answer (§3.12). Prompted by unverified pre-freeze commentary relayed by the founder from another model, preserved verbatim in inbox/processed/2026-09-01-study-vaso-s001-freeze/; its literature assertions are recorded as leads to be verified at collection, not imported as evidence.
  actor: "Aletheia editorial AI (Claude Opus 5, Cursor cloud agent)"
  aiAssisted: true

- date: "2026-09-01"
  kind: content
  change: >-
    Study VASO-S001 collected: sixteen rows, five findings, criteria hash fe5e031b8b8f re-verified unchanged from the freeze. Three findings enter the ledger as evidence. VASO-E019 (undermines VASO-C020): contemporaneous energetic measurement appears only in large tonic conduit arteries at zero transmural pressure and in no arteriole of any bed, and no located study meets all four conditions the study set. VASO-E020 (undermines VASO-C020): the target compartment is not unexamined — three rows are pressurized rat cremaster and gracilis resistance vessels with LC20 phosphorylation measured against diameter, and in all three maintained constriction is accompanied by maintained or rising phosphorylation rather than force held while activation falls. VASO-E021 (qualifies VASO-C010): the one published comparison between a vessel and its own downstream branch found latch behaviour in rabbit femoral artery and absent in the saphenous, and forward citation chaining found nobody extended it into the microcirculation. Persistence after stimulus withdrawal is untested at every caliber; the only persistence result in the table is a purified-myosin reconstitution.
  reason: >-
    Executing VASO-R007 at desk cost, per the pre-registration that merged in PR #125. The result is more informative than the expected null: the inferential step under C020 is confirmed as an extrapolation across vessel class and caliber, but the reason is not that nobody has looked at arterioles — it is that those who looked measured activation and found it sustained, which points at Rho-kinase-mediated calcium sensitization rather than a dephosphorylated latch as the mechanism holding a small vessel shut. Recorded with the limitation that every row was built from a published abstract, no full text being accessible to the collection.
  actor: "Aletheia editorial AI (Claude Opus 5, Cursor cloud agent)"
  aiAssisted: true

