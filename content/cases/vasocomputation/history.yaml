  change: "Intake from report proposals/2026-09-20-report-vasocomputation-112413/report.md: 2 source(s), 18 evidence record(s), 1 claim(s), 1 research item(s) verified and added (proposal 2026-09-20-draft-vasocomputation-113013, verification 2026-09-20-verify-vasocomputation-113521); 18 candidate(s) rejected with reasons in dispositions.yaml."
  reason: "Admitted after verification: SRC-LANDFALD-2025, SRC-CROFT-1994, VASO-E067, VASO-E068, VASO-E069, VASO-E070, VASO-E071, VASO-E072, VASO-E073, VASO-E074, VASO-E075, VASO-E076, VASO-E077, VASO-E078, VASO-E079, VASO-E080, VASO-E081, VASO-E062, VASO-E082, VASO-E083, VASO-C181, VASO-R020; everything else proposed was refused or blocked with a reason in dispositions.yaml. The drafter's rationale for the proposal, written before verification and describing what it proposed: A narrow pass with one decisive retrieval and one incidental one. The 2025 runners' elastography study, which the edition ranks first among unretrieved primaries and names as 'Olewnik 2025', was retrieved in full from PubMed Central: its first author is Landfald (Podgórski and Olewnik follow), it is a prospective single-centre cohort with no control arm, and it reports that after one course of thumb compression, given with no breathing instruction anywhere in its methods, most palpated gastrocnemius trigger points were undetectable by palpation and strain elastography and none of the eliminated points recurred at 24 hours. That is the ledger's first objective imaged record of a fast, persistent change at a palpated knot. It supports VASO-C011 (the change is a change of state, whatever the state), undermines VASO-C039 as written (pressure without breath instruction sufficed), and qualifies VASO-C004; the caveat that breathing was uncontrolled and unrecorded is stated in every record and is the reason the strength is moderate, not decisive. It took no Doppler and had no sham arm, so nothing in it touches the vascular attribution (VASO-C020, VASO-C073) or the perforator picture; the stiff foci it imaged lie inside the muscle belly. Second, the report saw only a snippet of Croft, Schollum & Silman 1994, but I was shown the PMC abstract with Results: two general practices, an 18-site count, medians of six in women and three in men, and depression, fatigue and sleep scores rising with count independently of pain. That gives VASO-C083, C085, C086, C087 and C088 their first primary — with the important limitation, stated in each record, that the examined subsample was selected on reported pain, so the medians are not unselected community medians and the survey cannot speak to 'nearly universal' (VASO-C084, qualified). Six new observation claims are catalogued from the two sources, one proposition each. One correction removes the retrieved study from VASO-R012's title and fixes the attribution. One new research item specifies the test the two retrievals make decisive: the compression protocol repeated with breathing recorded and randomised among free breathing, slow exhale and inhale-and-hold, with an elastography endpoint. I could not write the report's proposed sharpening of VASO-R001/VASO-R003 as a correction because the packet does not show those records' current summary text, and the schema carries no image records, so the CC BY-NC-ND figure is dispositioned blocked with its route. The edition is left unchanged: the verdict does not move, and the article's conditional paragraph on the runners' study should be rewritten only after these records are verified and admitted; the change is load-bearing enough that the next edition pass should do so, and should correct 'Olewnik' to 'Landfald and colleagues' throughout."
