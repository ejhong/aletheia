- date: 2026-09-09
  change: |-
    The editorial conjecture file retired (VASO-J001, by "Eugene (ejhong)", dated 2026-08-23, status open). The card leaves the case page. Its propositions are the ledger's — a tender point that objectively releases within seconds being an actively maintained state, not remodeled tissue (VASO-C011), the latch-bridge physiology beneath it (VASO-C010), pressure alone not releasing a knot where pressure with a slow exhale does (VASO-C039), the exhale as the voluntary handle on the autonomic system (VASO-C013, VASO-C098), the latch-bridge mechanism (VASO-C020) — and its decisive tests are VASO-R001 and VASO-R004; its rationale is the founder's essay "Knots of Existence and Vasocomputation", a founding input (VASO-IN002) and the ledger's source SRC-JHONG-2026. Banked here, as the file recorded them, are the founder's stake and the tests he named.
    Statement: "Muscle knots are real, actively maintained physiological states — not perceptual artifacts and not structural damage — and the decisive clue to their nature is that sustained attention plus breath alone, on a long exhale, releases them in seconds."
    Confidence: "High that the knots are real and that breath-triggered release is a genuine physiological event — grounded in years of direct first-person experimentation with rolling. Moderate, and stated as intuition, on the specific vascular latch-bridge mechanism."
    Predicted findings: (1) "Imaging a single release event (elastography + Doppler through the same probe) shows a rapid, local change in stiffness and perfusion time-locked to the exhale, on a seconds timescale incompatible with structural remodeling." (2) "Active knots show the state-not-structure signature: stiff on elastography, electrically active on EMG, hemodynamically abnormal on Doppler (retrograde flow, elevated pulsatility), yet largely invisible to structural imaging." (3) "Direct measurement at tender points demonstrates a smooth-muscle latch state (sustained tension at disproportionately low energy turnover — a metabolic cold spot rather than the 'energy crisis' hot spot)." (4) "Breath-and-attention protocols without external pressure produce measurable releases at reachable sites, weaker but of the same physiological kind as pressure-plus-breath."
    What would prove it wrong: (1) "The keystone imaging experiment (VASO-R001-class), adequately instrumented, finds no local physiological change accompanying clear felt releases — the release is then perceptual, and the maintained-state claim should be marked refuted." (2) "Direct latch-sensitive measurement at tender points, validated on known latch-bridge controls, finds no latch state — the vascular mechanism should then be dropped even if the knots-as-states claim survives by another mechanism." (3) "Time-locking fails: measured tissue changes follow releases by hours-to-days rather than seconds, consistent with remodeling — the breath-as-key inference should then be withdrawn."
  reason: "Founder direction (2026-09-09, in session): a bet with a stated confidence and a disconfirmer is a claim, graded honestly against the evidence, not a registry beside the ledger; the essays are founding inputs and their propositions enter as claims. What the founder believed ahead of the evidence, and what he staked it on, belongs in the append-only changelog (AGENTS.md §7, amendment of 2026-09-01). The conjecture carried no evidential weight, so no standing changes; the file's text remains in git history."
