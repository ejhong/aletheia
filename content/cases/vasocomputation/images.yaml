# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license, presented as numbered
#            museum plates. Duotone treatment is applied in CSS at display
#            time; the original files are unmodified apart from resizing.

- id: IMG-VASO-COVER
  role: cover
  file: /images/cases/vasocomputation/cover.jpg
  alt: >-
    Engraved illustration of a branching, vessel-like tree with a large knot
    tied in its trunk, shaded in copper, standing between a skeleton and a
    seated meditating figure.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v1
  model: "gpt-image-1"
  prompt: >-
    19th-century scientific expedition lithograph, copperplate engraving. An
    allegorical emblem for a case titled "State, Not Scar?" in the domain of
    Musculoskeletal medicine · Autonomic physiology · Contemplative science:
    a symbolic, typological composition suggesting the question — Are muscle
    knots maintained vascular-autonomic states — latched smooth muscle —
    rather than damaged tissue, and does vascular tension participate in the
    mind? — without depicting any real site, artifact, or dataset as
    documentation. Fine cross-hatching and stipple shading, hand-engraved
    linework. Monochrome deep warm-black ink (#201b12) on aged warm cream
    paper (#f6f1e8), with one restrained oxidized-copper (#9a5b33) accent on
    the compositional focal point. Darwin-era natural-history journal plate
    aesthetic, generous plain paper margins, quiet composition. Absolutely no
    text, no labels, no captions, no border frame lines. Unmistakably an
    engraving — stylized editorial artwork, not photorealistic, no photograph.

- id: IMG-VASO-P01
  role: plate
  file: /images/cases/vasocomputation/plates/thangka-illustration-of-the-points-of-the-body-associed-with.jpg
  alt: >-
    Tibetan medical thangka: a human figure standing over a fine measurement
    grid, arms outstretched, the body covered in dozens of small marked
    points annotated in Tibetan script, with a separate head and mouth study
    to either side.
  source: commons
  license: "CC BY 2.0"
  licenseUrl: "https://creativecommons.org/licenses/by/2.0"
  credit: "dockedship, via Wikimedia Commons"
  plateNumber: 1
  depicts: >-
    A Tibetan medical thangka charting points of the body used for
    bloodletting, moxibustion, and minor surgery, plotted on a proportional
    grid — an example of the traditional body-point cartography whose
    correspondence to modern anatomy the case treats as an open, testable
    question (VASO-C022), not an established equivalence.
  provenance:
    photographer: "dockedship (photograph of the painted scroll)"
    date: "2009-07-23"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Thangka_illustration_of_the_points_of_the_body_associed_with_bloodletting,_moxibustion_and_minor_surgery_(3749587385).jpg"
    originalTitle: "File:Thangka illustration of the points of the body associed with bloodletting, moxibustion and minor surgery (3749587385).jpg"
  claimIds: [VASO-C022]

- id: IMG-VASO-P02
  role: plate
  file: /images/cases/vasocomputation/plates/1021-smooth-muscle-new.jpg
  alt: >-
    Anatomy textbook figure: drawings of spindle-shaped smooth muscle fibers
    from the stomach and eye with branching autonomic neurons labeled, above
    a light micrograph of smooth muscle tissue.
  source: commons
  license: "CC BY 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by/4.0"
  credit: "OpenStax Anatomy & Physiology, via Wikimedia Commons"
  plateNumber: 2
  depicts: >-
    OpenStax Anatomy & Physiology figure of smooth muscle tissue: fiber
    arrangement with autonomic innervation (diagram) and a light micrograph.
    Shown as textbook context for the tissue whose latch-bridge state the
    case examines (VASO-C010) — smooth muscle takes no voluntary commands
    and answers to autonomic state.
  provenance:
    photographer: "OpenStax College (CC BY textbook figure)"
    date: "2016-05-18"
