- id: VASO-R011
  title: Needle EMG at a trigger point versus a matched endplate-zone control site under mental arithmetic
  summary: "Simons 2002 shows endplate noise occurs at non-tender endplate-zone sites, so the silent control sites in Hubbard–Berkoff 1993 and McNulty 1994 may simply have been off the endplate zone. Repeat the McNulty stressor paradigm with the endplate zone located electrically first, placing the control needle in a non-tender endplate-zone site of the same muscle and recording both sites during baseline, serial subtraction, and slow-exhalation recovery. Preregister the contrast: does the stressor raise activity selectively at the trigger point, or at any endplate-zone site?"
  claimIds:
    - VASO-C002
    - VASO-C003
    - VASO-C034
  track: small_grant
  effortTier: lab
  informationGain: Selective rise at the trigger point with a quiet matched endplate-zone control would restore the 'addressable nidus' reading VASO-C003 rests on; a comparable rise at the control would relocate the phenomenon to stress-sensitive endplates generally and remove the localization argument for a discrete maintained element.
