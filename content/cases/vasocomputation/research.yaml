- id: VASO-R015
  title: "Map the staples: blinded coincidence of palpated tender points with pencil-Doppler perforators against chance"
  summary: One blinded examiner marks tender points on a region of scalp, neck, back or hip; a second blinded operator maps cutaneous perforators on the same region by continuous-wave pencil Doppler at fixed light pressure; a third computes spatial coincidence against a chance baseline from randomized point sets. Settles whether ordinary knots sit on perforators (VASO-C101) and whether the most tender sit on the largest trunks; a null returns the vascular hypothesis to the intramuscular compartment or dissolves it.
  claimIds:
    - VASO-C123
    - VASO-C128
    - VASO-C131
  track: small_grant
  effortTier: field
  informationGain: A cheap, afternoon-scale test that either licenses or kills the perforator alternative before any imaging is bought; a positive coincidence above chance would be the first objective anatomical identity for a palpated knot.
  origin:
