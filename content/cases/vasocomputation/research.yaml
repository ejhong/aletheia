- id: VASO-R010
  title: Retrieve the fibromyalgia-era community tender-point-count surveys as a proto-census
  summary: "The essay reports, without citation, that population-based studies using the 18-site fibromyalgia tender-point exam found tender points nearly universal (medians 6 in women, 3 in men) and counts tracking distress and sleep rather than tissue damage. If a primary paper exists — the candidates are the 1990s population surveys of tender-point counts in general-population samples (e.g., the UK and Wichita community studies) — it is the only instrumented prevalence data behind VASO-C001 and the only existing curve of tender-point burden against sex, age, and distress. Desk task: locate the primary papers, retrieve the count distributions, and record whether the exam sites and pressure protocol map onto what the case calls a 'knot'."
  claimIds:
    - VASO-C001
    - VASO-C005
  track: either
  effortTier: desk
  informationGain: Would give VASO-C001 its first population-level, examiner-administered evidence record (currently supported only by proponent testimony and qualified by the reliability critique), would reveal whether tender-point counts already correlate with age, and would tell VASO-R002 what the census must add beyond what rheumatology already measured and abandoned.
