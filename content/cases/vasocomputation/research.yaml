# Research agenda: adapted from the tiered research program in the "Knots of
# Existence" essay, tightened with the critical report's controls (blinded
# localization, factorial design, preregistered predictions, falsification
# criteria). The program funds tests in either direction.

- id: VASO-R001
  title: "The keystone experiment: image a single release event, both directions"
  summary: >-
    Put ultrafast shear-wave elastography and sensitive microvascular
    Doppler (or NIRS) over a palpated knot; apply calibrated constant
    pressure through a load-cell-instrumented probe; have a skilled releaser
    press a button at each felt release while respiration, HRV, and EMG are
    recorded. Sites localized in advance by two blinded examiners with the
    analysis volume predefined. Factorial controls: pressure with normal
    breathing, slow breathing without pressure, sham sites, and failed
    attempts. Add the stressor block: mental arithmetic under the imager,
    predicting local stiffening and perfusion drop during a purely cognitive
    event, then reversal on breath-assisted release. Preregistered
    prediction: stiffness step-drops and perfusion rises together, within
    seconds, time-locked to the exhale, exceeding all controls — with the
    latch-specific ordering that perfusion rises before stiffness falls.
    Falsification: felt releases without reproducible local transitions, or
    equal transitions at shams.
  claimIds: [VASO-C004, VASO-C011, VASO-C020, VASO-C003]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Decides the case's central crux in one study (~$50–150K, one lab, one
    year): either direction is decisive, and a positive stressor block would
    demonstrate the full write–erase cycle in a single session.

- id: VASO-R002
  title: "The knot census: a natural-history atlas of human tension"
  summary: >-
    The dataset that has never existed: several hundred participants across
    the age span, standardized blinded palpation plus pressure algometry
    plus elastography and Doppler sampling at fixed bilateral anatomical
    sites. Report variance and spatial heterogeneity (lumpiness), not just
    means — every prior aging study discarded the heterogeneity as noise.
    Distinguish active from latent points, which separate on flow measures.
    Include the two discriminating populations: young children (if guarding
    is learned, they should be nearly clean) and long-term meditators
    against sedentary controls. Train imaging thresholds on one cohort and
    lock them before validation.
  claimIds: [VASO-C001, VASO-C005]
  track: small_grant
  effortTier: field
  informationGain: >-
    Produces the two curves the field lacks (knot burden by age;
    distribution across the body), converts the ubiquity claim from
    anecdote to data, and supplies the localization protocol every other
    study needs.

- id: VASO-R003
  title: "The factorial intervention trial: separate the probe from the permission"
  summary: >-
    Randomize intensive rolling with breath work against rolling without
    breath instruction, breath work without rolling, and a stretching
    control over 8–12 weeks. Outcomes: knot counts from the census protocol,
    hip range of motion, elastography, HRV, and interoceptive awareness.
    The factorial design cleanly tests the two-key claim — that pressure and
    exhalation are jointly, not separately, sufficient — against the
    conventional prediction that generalized relaxation plus mechanical
    stimulus explains everything.
  claimIds: [VASO-C004, VASO-C013]
  track: small_grant
  effortTier: field
  informationGain: >-
    The most clinically legible study in the program: it either validates a
    cheap, teachable release protocol or shows breath adds nothing local
    beyond relaxation — and buys credibility for the stranger tiers either
    way.

- id: VASO-R004
  title: "Demonstrate (or exclude) a smooth-muscle latch at a tender point"
  summary: >-
    The mechanism study the hypothesis cannot skip: in animal or ex-vivo
    preparations, create candidate tender-point-like regions (sustained
    low-level motor activity; controlled stress paradigms) and measure
    vessel radius, smooth-muscle calcium, myosin light-chain
    phosphorylation, perfusion, and tissue mechanics simultaneously. Make it
    a paired-caliber design rather than a single positive-or-negative
    arteriole test: take a feeding artery and successive arteriole orders
    from the same skeletal-muscle bed, cannulated and pressurized to
    physiological transmural pressure rather than held isometric, so the
    experiment reports whether latch capacity persists, weakens, or
    disappears as vessels get smaller — the boundary condition VASO-S001 has
    now audited in the published record, where latch behaviour was present
    in a parent artery and absent one branch order later. Include an
    explicit stimulus-withdrawal phase: economical force maintenance under
    continuing activation is a different finding from a state that holds
    after its input stops, and only the second is what a knot requires.
    Separately manipulate neural drive and vascular tone (sympathetic
    blockade, nitric-oxide pathway agents) and test whether releasing
    vascular tone precedes normalization of stiffness and nociception. In
    humans, add vasomotor endpoints to the keystone rig — the latch
    prediction is a timing signature: blood first, stiffness second. And run
    the small FDG-PET overlay testing the triple signature no conventional
    lesion carries: stiff on elastography, electrically active on EMG,
    metabolically cold.
  claimIds: [VASO-C010, VASO-C020, VASO-C002]
  track: either
  effortTier: lab
  informationGain: >-
    Turns "the mechanism is borrowed, not observed" into a direct test:
    finding latch-state smooth muscle at tender points would transform the
    case; excluding it would force the featured hypothesis back to
    conventional guarding accounts.

- id: VASO-R005
  title: "The decisive vasocomputation experiment: can vascular state carry a neural trace?"
  summary: >-
    From the critical report, the experiment that separates vascular
    modulation from vascular memory: in an animal preparation with optical
    access, repeatedly evoke a neural pattern while inducing a candidate
    vascular state; stop the input; after a delay, test whether the
    maintained vascular state biases neural responses back toward the
    trained pattern under identical stimulation — with oxygenation and
    metabolic variables clamped, so nonspecific ischemic suppression cannot
    masquerade as memory. Positive result: different induced vascular states
    produce reliably different later neural response distributions.
    Falsification: vascular manipulation affects neural gain only through
    instantaneous perfusion.
  claimIds: [VASO-C012, VASO-C021]
  track: either
  effortTier: lab
  informationGain: >-
    The theory-deciding study: a positive result would establish a genuinely
    new biological memory mechanism; a clean negative would collapse strong
    vasocomputation to ordinary neurovascular physiology.

- id: VASO-R006
  title: "Preregistered anatomical coding of the contemplative knot maps"
  summary: >-
    The unglamorous scholarship the convergence argument needs: translate
    and annotate the rtsa mdud (channel-knot) literature and the granthi
    and ashi-point corpora with scholars fluent in both traditions and
    modern anatomy. Code traditional knot locations into a common coordinate
    system before inspecting modern maps, then test whether they align with
    vascular branch points, sympathetic chains, dorsal root ganglia, or
    dense-fascia geography better than chance — the blinded design that
    separates first-person cartography from post-hoc resemblance.
  claimIds: [VASO-C022]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Either elevates the traditional maps to admissible empirical documents
    or retires the convergence argument as pattern-matching — cheap,
    decisive for its claim, and publishable in either direction.

- id: VASO-R007
  title: "Where has the latch actually been demonstrated? An evidence map by vessel type and caliber"
  summary: >-
    The mechanism rung rested on an inferential step nothing in the ledger
    then checked: latch behaviour exists in vascular smooth muscle,
    therefore it can hold a skeletal-muscle microvessel shut. Build a
    preregistered evidence map of every eligible primary study — located
    through a frozen search strategy, citation chaining, and author-family
    searches — in which sustained force or constriction was measured
    alongside a contemporaneous readout of activation, cross-bridge cycling,
    or energetic cost. Record the vessel and its branch order, the luminal
    diameter and the pressure at which it was measured, the preparation
    (isometric ring versus cannulated pressurized vessel), temperature, the
    stimulus, whether the stimulus was withdrawn, and what the force did
    afterwards. Grade every record twice and independently: how directly it
    evidences the phenomenon, and how close its preparation is to the
    pressurized skeletal-muscle arteriole VASO-C020 needs. Models, reviews,
    and purified-protein reconstitutions are kept in distinct evidence
    classes rather than counted as vessel-level demonstrations. Executed as
    VASO-S001.
  claimIds: [VASO-C010, VASO-C020]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Executed as VASO-S001, the map returned the extrapolation finding and
    the mixed finding together: the demonstration record is concentrated in
    large tonic conduit preparations, no energetic measurement exists in any
    arteriole, pressurized skeletal-muscle arterioles show maintained
    activation rather than an economical dephosphorylated hold, and the one
    paired comparison found latch behaviour in a parent artery but absent
    one branch order downstream — establishing C020 as an extrapolation
    across vessel type and caliber and fixing the boundary condition
    VASO-R004's paired-caliber design now targets. What it could not settle
    is whether knots are vascular; only whether the mechanism has ever been
    observed in the compartment the hypothesis needs it in — and, on the
    located record, it has not.

- id: VASO-R008
  title: "Densification versus latch: does fascial hyaluronan densification account for a reversible, non-vascular release?"
  summary: "The essay invokes the Stecco group's distinction between fascial densification (viscous hyaluronan between fascial sheets, reversible with pressure, movement, and warmth) and true scarring. If densification reverses on a timescale of seconds under sustained pressure, it is a state-not-structure mechanism that needs no vascular smooth muscle, competing directly with the latched-arteriole account. Desk route: retrieve the primary densification literature (Stecco and colleagues on hyaluronan viscosity, temperature dependence, and mechanical reversal), extract the measured or modelled timescale of viscosity change under load and warmth, and record whether any study reports reversal within the seconds-scale window the anchor phenomenon requires."
  claimIds:
    - VASO-C011
    - VASO-C020
  track: either
  effortTier: desk
  informationGain: If densification can reverse in seconds under pressure alone, VASO-C011 (state not structure) survives but the vascular attribution in VASO-C020 loses its claim to be the only fast mechanism, and the keystone experiment (VASO-R001) needs a discriminating prediction — perfusion change with the stiffness drop (vascular) versus stiffness drop without perfusion change (densification). If densification reversal is minutes-to-hours, the vascular account remains the only candidate for a seconds-scale objective release.
  origin:
    ref: report 2026-09-09-inbox-vasocomputation-021828
    extractedBy: claude-fable-5-1
    runId: 2026-09-09-draft-vasocomputation-021940
    date: 2026-09-09
- id: VASO-R009
  title: "Locate the phentolamine trigger-point study: does sympathetic blockade quiet the nidus?"
  summary: "The essay states that later work from the Hubbard–Gevirtz lineage infused trigger-point sites with phentolamine, an alpha-adrenergic antagonist, and substantially quieted the spontaneous EMG activity. The report's works list did not carry this item and no candidate was resolved. Desk route: search the needle-EMG trigger-point literature of the 1990s (Hubbard, Gevirtz, McNulty, Banks and co-authors; journals of pain, psychophysiology, and physical medicine) for a sympathetic-blockade study, retrieve the primary paper, and record the design, n, control condition, and effect. A sympathetic-dependence result would be the strongest existing link between the electrical nidus and autonomic maintenance."
  claimIds:
    - VASO-C002
    - VASO-C003
    - VASO-C020
  track: either
  effortTier: desk
  informationGain: A retrieved primary study showing phentolamine quiets trigger-point EMG would support autonomic maintenance of the nidus (bearing on VASO-C002/C003) and supply the pharmacological arm of VASO-R004, though it would not by itself distinguish vascular smooth-muscle latching from sympathetically driven intrafusal or endplate activity. Failure to locate any such study would show the essay's autonomic-maintenance argument rests on stress-induction alone.
  origin:
