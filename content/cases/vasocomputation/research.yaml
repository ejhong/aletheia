- id: VASO-R013
  title: "FDG-PET overlaid on elastography at palpated knots: is the stiff, electrically active spot metabolically cold?"
  summary: "Small overlay study: palpate and mark knots under blinded examiners, confirm stiffness by shear-wave elastography and spontaneous activity by needle EMG at a subset, then acquire FDG-PET and compare uptake at knot sites with matched non-tender muscle. The latch account predicts uptake at or below surrounding muscle; an energy-crisis (maximally contracting fibers) or inflammatory account predicts elevated uptake. Radiation limits this to a single small study, not a census."
  claimIds:
    - VASO-C020
  track: small_grant
  effortTier: lab
  informationGain: Cold knots would be the first finding that does not fit conventional lesion taxonomies and would specifically favour a low-energy holding state over active contraction or inflammation; hot knots would fit the energy-crisis or inflammatory accounts and remove the essay's distinctive metabolic prediction. Either result moves VASO-C020 in a way no imaging of stiffness or flow can.
  origin:
    ref: report 2026-09-09-inbox-vasocomputation-031907
    extractedBy: claude-fable-5-1
