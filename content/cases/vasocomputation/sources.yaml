- id: SRC-HUBBARD-BERKOFF-1993
  title: "Myofascial trigger points show spontaneous needle EMG activity"
  authors: ["Hubbard, D. R.", "Berkoff, G. M."]
  year: "1993"
  sourceType: paper
  identifier: "Spine 18(13): 1803–1807. DOI: 10.1097/00007632-199310000-00015"
  verification: ai_verified
  verificationNote: >-
    Confirmed via PubMed/Crossref (2026-08-22 batch): sustained spontaneous
    EMG in a 1–2 mm nidus of trapezius trigger points, absent in adjacent
    non-tender fibers; the authors hypothesized sympathetically activated
    intrafusal contractions.
  reliabilityNotes:
    - "Old and small; the signal generator remains contested (later literature favors extrafusal endplate potentials over the authors' spindle hypothesis)."

