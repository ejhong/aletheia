  - force or diameter time course
  - activation readout (LC20 phosphorylation, intracellular calcium)
  - cycling readout (shortening velocity, stiffness)
  - energetic readout (assay named)
  - simultaneity and time resolution of readouts
  - persistence after withdrawal, and relaxation kinetics
  - latch-evidence grade
  - knot-relevance grade
  - notes
