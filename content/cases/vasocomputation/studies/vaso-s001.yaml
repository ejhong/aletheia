method: "One row per experimental preparation, not per paper: a study reporting two
  vessel types under different conditions supplies two rows, and rows sharing an animal
  cohort, tissue batch, or dataset carry an independence note (§3.10). Every cell is
  transcribed from the primary document and cited inline with the standard verification
  label; nothing is completed from memory or from a secondary account. Each row then
  receives TWO independent grades, recorded separately and never combined into a single
  score (§3.13). The latch-evidence grade records how directly the report establishes
  the phenomenon — contemporaneous energetic measurement, biochemical-mechanical
  measurement, functional inference from shortening velocity or stiffness alone,
  molecular reconstitution, or model only. The knot-relevance grade records how close
  the preparation is to what VASO-C020 requires — a pressurized skeletal-muscle
  arteriole or smaller resistance microvessel, another resistance vessel, or a large
  artery, vein, or non-vascular preparation. Keeping the axes apart is the point of the
  table: a carotid ring study can be strong evidence for the phenotype and weak evidence
  for the location, and collapsing that into one verdict is how a well-established
  result in the wrong tissue becomes direct support for a claim about muscle knots. Two
  columns carry the weight the case's own argument turns on. Caliber is recorded as an
  actual luminal diameter WITH the transmural pressure at which it was measured, because
  an isometric ring at nominally zero transmural pressure is a different mechanical
  object from a cannulated vessel regulating its lumen against 40-100 mmHg. Persistence
  is recorded as whether the activating stimulus remained present, what happened to
  force or diameter after it was withdrawn, and over what interval — the distinction
  between economical maintenance under continuing activation and a state that holds on
  its own. The table reports what the literature contains and does not adjudicate
  between papers that disagree; disagreements are recorded as the papers state them.
  Either outcome publishes."
