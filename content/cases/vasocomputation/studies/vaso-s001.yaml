# Study freeze — pre-registration only (two-PR discipline; see the
# Studies entry in docs/DECISIONS.md). Zero rows by design: the criteria
# below are judged before anyone knows what the data will say, and any
# later edit to them fails the build. Collection follows in a second PR.
id: VASO-S001
title: Latch-state evidence by vessel type, caliber, and persistence
question: In which vascular preparations has sustained force or constriction
  been demonstrated while cross-bridge cycling, myosin activation, or energetic
  expenditure declines; does any primary study demonstrate that phenotype in a
  skeletal-muscle arteriole or smaller resistance microvessel under
  physiological temperature and transmural pressure; and where the phenotype is
  demonstrated, does the maintained state survive withdrawal of the initiating
  stimulus?
researchIds:
  - VASO-R007
claimIds:
  - VASO-C010
  - VASO-C020
criteria:
  frozenOn: 2026-09-01
  inclusion:
    - Primary experimental reports, any year, on vascular smooth-muscle
      preparations that record BOTH a force or diameter time course AND at least
      one contemporaneous readout of activation, cross-bridge cycling, or
      energetic cost — LC20 phosphorylation, intracellular calcium, unloaded
      shortening velocity, stiffness, ATPase or ATP turnover, oxygen
      consumption, heat, lactate, or phosphocreatine. The energetic criterion is
      deliberately broad, because much of the canonical economy literature
      derives energy expenditure from oxygen consumption or lactate rather than
      from a measured ATPase, and a narrow ATPase requirement would exclude the
      strongest evidence rather than the weakest.
    - Reports indexed under any vocabulary variant of the phenomenon, whether or
      not they use the word latch — high economy of force maintenance, tonic
      force maintenance, stress-phosphorylation dissociation, slow cross-bridge
      cycling, reduced shortening velocity at maintained force, myosin
      dephosphorylation during sustained contraction, tonic versus phasic smooth
      muscle. The older literature predates the term and would otherwise be
      missed.
    - Reports in which the phenotype was sought and NOT found enter as rows
      under identical rules (§3.11). A vessel class where latch behavior is
      absent is a finding of this table, not an omission from it.
    - Purified-protein, single-molecule, and in vitro motility reconstitutions
      enter as rows, tagged as molecular-reconstitution evidence. They can speak
      to the bridge mechanism and say nothing about vessel class.
    - Mathematical and computational models of latch kinetics enter as rows,
      tagged as model evidence. A model that predicts latch maintenance in a
      named vessel is not a measurement in that vessel.
    - Non-vascular smooth muscle (uterine, airway, gastrointestinal, vas
      deferens) enters only where the report supplies a phenotype or mechanism
      comparison bearing on vessel-type variation; tagged, and never counted
      toward the vessel-class question this study asks.
  exclusion:
    - Reviews, textbook chapters, and commentary with no new primary data. They
      may be used for discovery only, and discovery aids are never cited (§3.7).
    - Reports of maintained force or constriction with no activation, cycling,
      or energetic readout. Sustained tone alone cannot distinguish an
      economical hold from ordinary continued activation, which is the whole
      distinction this table exists to draw.
    - Skeletal-muscle and cardiac-muscle preparations.
    - Clinical, pharmacological, and imaging studies whose endpoint is a whole
      vessel or tissue response with no cross-bridge-level measurement.
    - Secondary reports restating another included study's measurements without
      new data (§3.10 — one experiment is one row, not many); where a row's data
      are shared with another row's, the shared origin is recorded in its
      independence note.
  searchProtocol: "Discovery runs only after this freeze, by the executing agent's
    own web search plus direct retrieval of primary documents (PubMed and PubMed
    Central, Crossref DOI resolution, publisher pages); no deep-research
    assistant is used, and no brief is cited. Literal queries, each run as
    written: [latch bridge smooth muscle force maintenance energetic cost];
    [economy of force maintenance vascular smooth muscle oxygen consumption];
    [stress phosphorylation dissociation arterial smooth muscle]; [latch state
    arteriole resistance vessel]; [skeletal muscle arteriole myosin light chain
    phosphorylation sustained constriction]; [precapillary sphincter smooth
    muscle sustained contraction phosphorylation]; [cannulated pressurized
    arteriole myogenic tone LC20 phosphorylation shortening velocity]; [latch
    bridge absence saphenous artery]; [tonic versus phasic smooth muscle myosin
    dephosphorylation force maintenance]; [smooth muscle ATP consumption
    cross-bridge phosphorylation carotid media]. Citation chaining, forward and
    backward, from each identified anchor paper: Dillon et al. 1981
    (10.1126/science.6893872), Hai & Murphy 1988 (the case's
    SRC-HAI-MURPHY-1988), Wingard et al. 1994 (10.1113/jphysiol.1994.sp020422),
    Han et al. 2006 (10.1152/ajpheart.00977.2005), Call et al. 2006
    (10.1152/ajpheart.00086.2006), Hammell et al. 2022 (10.1085/jgp.202213117).
    Author-family searches: Murphy RA, Eddinger TJ, Ratz PH, Speich JE, Lauzon
    A-M, Paul RJ, Siegman MJ, Butler TM. Every cell is verified against the
    primary document before it enters the table; searches that return nothing
    are reported as failed searches (§3.11)."
