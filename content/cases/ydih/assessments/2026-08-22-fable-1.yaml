  synthesis: >-
    This ladder fails in an instructive place: not at the bottom, where
    several observations are genuine, but at the two mechanism-rung links
    that connect them to the sky. The bottom holds more than skeptics
    sometimes allow: the Greenland platinum anomaly (YDIH-C001) is a real
    measurement from an independent laboratory; the black mats (YDIH-C006)
    are a repeatable field observation; the extinctions (YDIH-C008) are as
    established as anything in the Quaternary. But the two load-bearing
    inferential claims — that the proxies form one isochronous layer
    (YDIH-C010) and that the assemblage is impact-diagnostic (YDIH-C011) —
    have never survived an independently controlled test. The signature
    proxies appear under proponent protocols and vanish under blinded ones
    (YDIH-C030); the one blind test found the boundary unremarkable; the
    chronology audit left three secure sites of twenty-nine; and every
    source-discriminating measurement to date has returned volcanic or
    unresolved, never demonstrably cosmic — a verdict the 2026 correction
    to the flagship platinum paper now makes official in the proponents'
    own words. The attribution rung then inherits all of this and adds its
    own defect: the most checkable distinctive prediction (a Clovis-era
    demographic collapse, YDIH-C023) was tested early and contradicted.
    The 2026 retractions (YDIH-C031) shift weight without deciding
    anything: they removed the hypothesis's two newest confirmations for
    exactly the failure modes — calibration, background sampling, particle
    identification — that the critical literature had documented for
    fifteen years, while making no finding of fabrication. Against all
    this, the case retains a real unresolved residue: no one knows what
    carried the Greenland platinum, and the decisive experiments
    (YDIH-R002, YDIH-R003, YDIH-R004) are cheap, specified, and unrun. The
    honest roll-up: weakly supported — not unresolved, because the
    distinctive evidence has repeatedly failed independent tests, and not
    contradicted, because a genuine anomaly and an untested decisive
    experiment remain. What would move this assessment most, in order: the
    jointly designed blind test (YDIH-R002), the platinum-carrier
    geochemistry (YDIH-R003), and the preregistered synchrony test
    (YDIH-R004).

