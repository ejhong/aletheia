      extinction interval spans millennia, making it impossible to attribute the
      die-off to a single day and perfectly compatible with gradual climate and
      human pressures."
  - claimId: YDIH-C009
    verdict: well_supported
    confidence: high
    reasoning: The absence of a securely dated 12.8 ka crater is well supported. The
