  synthesis: >-
    Across the full dossier, the Younger Dryas Impact Hypothesis (YDIH) in its
    strong form — one or more cosmic impacts or airbursts around 12.8 ka that
    triggered the Younger Dryas cooling, substantially drove the megafaunal
    extinctions, and caused a Clovis population collapse (YDIH‑C020, C021, C022,
    C023) — is weakly_supported at best.

    At the observation level, several ingredients are real. The Greenland GISP2
    platinum anomaly (YDIH‑C001) is well_supported by high-quality ICP‑MS data,
    and continental sedimentary Pt enrichments (YDIH‑C002) are
    provisionally_supported, though measured only by one proponent group and
    without continuous background sampling. Black mats (YDIH‑C006) and a
    concentrated terminal‑Pleistocene megafaunal extinction interval (YDIH‑C008)
    are established. The Younger Dryas cooling and its association with a
    weakened AMOC (YDIH‑C013) are well_supported. These facts constrain any
    theory of late‑glacial North America, and the impact hypothesis legitimately
    attempts to integrate them.

    However, the mechanism rung — especially the diagnostic proxy assemblage
    (YDIH‑C011) and the isochrony claim (YDIH‑C010) — is where the structure
    falters. The nanodiamond reports (YDIH‑C003) and microspherule peaks
    (YDIH‑C004) are both mixed: each is reported in multiple proponent papers
    yet directly contradicted by independent studies and, crucially, by a
    well‑designed blind test that found the boundary unremarkable and larger
    peaks elsewhere. Meltglass (YDIH‑C005) is interesting but under‑constrained,
    with mundane high‑temperature analogues not excluded. Fire claims of an
    extraordinary continent‑to‑hemispheric burn pulse (YDIH‑C007) conflict with
    the fire‑history community’s own charcoal synthesis and have been
    methodologically disputed. Where source‑discriminating geochemistry has been
    applied — Hall’s Cave and Page‑Ladson (YDIH‑E004, E029) — anomalies point to
    volcanism or at least away from a simple impactor signature. The 2026
    correction to the key platinum paper explicitly declares the Pt source
    unresolved (YDIH‑E003). Together, this leaves YDIH‑C011 (diagnosticity of
    the assemblage) weakly_supported: anomalies exist, but none has cleared the
    bar of being reproducibly identified, rare against background, securely
    synchronous, and geochemically extraterrestrial.

    Chronology further weakens the joint inference. The proponents’ Bayesian
    work (YDIH‑E020) shows the reported site dates are consistent with ~12.8 ka
    synchrony, but the prior audit (YDIH‑E019) found only 3 of 29 sites securely
    dated, and the Baffin Bay retraction (YDIH‑E034) illustrates how calibration
    choices can move a “boundary” horizon out of the Younger Dryas entirely.
    Given the inherent century‑scale radiocarbon uncertainties around this
    interval, and that boundaries are often assigned with knowledge of the
    target date, YDIH‑C010 is best rated mixed: synchrony is plausible but not
    demonstrated, and apparent agreement is partly methodological.

    Replication and record quality are decisive cross‑cutting constraints.
    Independent laboratories repeatedly failing to reproduce key peaks and the
    lack of standardized criteria (YDIH‑C030) are well_supported by the Surovell
    replication, Daulton’s TEM work, the 2016 blind test, Pigati’s wetland
    background study, and now the 2026 PLOS retraction notices that document
    misidentification (foraminifera as “spherule fragments”), incomplete
    sampling, and age‑model defects (YDIH‑C031). While retractions do not prove
    the absence of any impact, they remove two of the hypothesis’s freshest
    claimed confirmations, concretely lowering the net evidential weight.

    On the consequence side, the strongest anthropological prediction — a
    continent‑wide human population crash and Clovis termination (YDIH‑C023) —
    is contradicted by radiocarbon‑based demographic curves and specialist
    archaeological review. The extinction contribution claim (YDIH‑C022) and
    climate‑trigger claim (YDIH‑C021) remain weakly_supported at best: the
    timing is too coarse to isolate a single‑day or single‑decade catalyst, and
    conventional mechanisms (deglacial meltwater routing, sea‑ice feedbacks, and
    now a volcanic forcing candidate with its own geochemistry) provide adequate
    triggers without invoking a comet. The Taurid‑debris impactor scenario
    (YDIH‑C012) is a viable astronomical possibility but remains unresolved with
    respect to any Younger Dryas encounter; no physical material ties the
    boundary deposits to this complex.

    Putting these layers together, the headline attribution claim (YDIH‑C020) is
    weakly_supported: there is a live, contested proponent literature, some
    genuine anomalies, and a plausible astronomical scenario, but the crucial
    chain from “anomalies exist” to “they are impact‑diagnostic, synchronous,
    and causally responsible for climate, extinction, and cultural change” is
    not established. Every step where decisive, discriminating measurements have
    been applied either yields terrestrial explanations or leaves the source
    unresolved; replication‑robust, criteria‑locked confirmation of a diagnostic
    impact layer is absent. Conversely, nothing in the present record
    definitively proves that no extraterrestrial event occurred; what is shown
    is that the current YDIH formulation has not met its own evidential burden.
    A jointly designed blinded multi‑lab test and source‑discriminating platinum
    geochemistry, as outlined in the research agenda, would likely move several
    key claims sharply toward either refutation or stronger support.
claimAssessments:
  - claimId: YDIH-C020
    verdict: weakly_supported
    confidence: high
    reasoning: "The integrated attribution claim rests on a long chain: a real,
      diagnostic, and synchronous impact proxy layer; a physically coherent
      impactor scenario; and clear causal links to climate, extinction, and
      cultural change. The record shows real anomalies (especially Pt) and a
      non‑trivial proponent literature, but the proxy layer is not independently
      reproducible (YDIH‑C030), its diagnosticity is weak (YDIH‑C011), synchrony
      is at best mixed (YDIH‑C010), and the strongest archaeological prediction
      (a Clovis population crash) is contradicted (YDIH‑C023). The best opposing
      consideration is that several key tests proponents request — notably a
      jointly designed blind multi‑lab study and comprehensive osmium‑isotope
      work — have not yet been run, so the existing evidence may under‑sample
      the hypothesis’s strongest possible case."
  - claimId: YDIH-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: The extinction of ~35 North American megafaunal genera in a terminal
      Pleistocene window is established (YDIH‑C008), and the interval broadly
      overlaps the Younger Dryas, so an impact contribution is not prima facie
      impossible. However, last‑appearance chronologies only constrain
      extinctions to a ~2,000‑year span (~13.8–11.4 ka), far too coarse to
      isolate a short‑lived impact aftermath, and the same window also contains
      substantial climatic change and human expansion that are independently
      plausible drivers. The strongest opposing consideration is that no
      unambiguous kill mechanism or mortality evidence (e.g., blast or burn
      damage in situ at the boundary) has been demonstrated despite two decades
      of focused impact‑oriented work.
  - claimId: YDIH-C023
    verdict: contradicted
    confidence: high
    reasoning: Radiocarbon‑frequency analyses of ~1,500 Paleoindian dates
      (YDIH‑E026) show no continent‑wide demographic collapse at the putative
      impact horizon, and a detailed archaeological review finds a pattern of
      technological succession (Clovis to Folsom and regional variants), not
      occupational hiatus or cultural extinction (YDIH‑E027). These are direct
      tests of the claim’s core prediction, and both come back negative. The
      strongest opposing consideration is that radiocarbon frequencies and tool
      typologies are indirect proxies for population, potentially smoothing over
      brief downturns, but they are adequate to detect the large, hemispheric
      catastrophe the claim asserts.
  - claimId: YDIH-C021
    verdict: weakly_supported
    confidence: moderate
    reasoning: It is physically conceivable that an impact or airburst could perturb
      freshwater routing, ice‑sheet stability, or atmospheric properties in a
      way that triggers the AMOC weakening behind the Younger Dryas (YDIH‑C013),
      and the proposed Taurid‑debris scenario offers a possible delivery
      mechanism (YDIH‑C012). However, there is no direct evidence that such an
      extraterrestrial perturbation occurred at the relevant time, and deglacial
      meltwater and sea‑ice feedbacks — now joined by a volcanic forcing
      candidate with its own geochemical support (YDIH‑E029) — already provide
      plausible triggers. The strongest opposing consideration is that the
      climate record itself does not show any distinctive signature that
      uniquely demands an impact‑initiated trigger over these terrestrial
      mechanisms.
  - claimId: YDIH-C010
    verdict: mixed
    confidence: moderate
    reasoning: Kennett et al.’s Bayesian modeling (YDIH‑E020) shows that the
      available dates are statistically consistent with a ~100‑year synchronous
      boundary window around 12.8 ka, which gives some positive support. Yet
      Meltzer et al.’s audit (YDIH‑E019) finds that only 3 of 29 claimed sites
      have chronologies adequate to place their proxy layer securely at the
      Younger Dryas onset, and the Baffin Bay retraction illustrates how
      calibration choices can shift a “boundary” horizon outside the Younger
      Dryas entirely (YDIH‑E034). The strongest opposing consideration is that
      boundary assignment and date inclusion were not independent of the
      hypothesis being tested, so apparent synchrony is to some extent
      constructed rather than measured.
  - claimId: YDIH-C011
    verdict: weakly_supported
    confidence: high
    reasoning: "The elements of the assemblage — microspherules, nanodiamond
      reports, platinum enrichments, and meltglass — are individually reported
      at multiple sites, and it is possible in principle for a combined proxy
      set to be impact‑diagnostic. In practice, no component has met the
      necessary criteria: independent, blinded identification; rarity against
      measured background; and geochemistry that rules out terrestrial sources.
      Osmium‑isotope work at Hall’s Cave and Page‑Ladson points to volcanism or
      non‑meteoritic origins (YDIH‑E004, E029), piggyback “impact markers”
      accumulate in ordinary wetlands (YDIH‑E015), and the 2017 platinum paper’s
      correction explicitly concedes that the source is unresolved (YDIH‑E003).
      The strongest opposing consideration is that most isotopic and
      mineralogical discrimination has been applied to only a few sites, leaving
      open the possibility that a truly diagnostic assemblage could yet be
      demonstrated elsewhere."
  - claimId: YDIH-C012
    verdict: unresolved
    confidence: moderate
    reasoning: "Napier’s model (YDIH‑E022) shows that a fragmented giant
      short‑period comet, ancestral to the Taurid Complex, could in principle
      create an environment with many dispersed airbursts and limited crater
      formation, rendering the astronomical scenario viable. However, this
      remains a possibility argument: no direct dynamical or geochemical
      evidence links an actual Taurid‑related debris crossing to Earth at ~12.8
      ka, nor ties any Younger Dryas‑age material to Taurid‑like compositions.
      The strongest opposing consideration is that the impactor description has
      shifted over time mainly in response to negative geological findings
      (e.g., the Hiawatha age), in ways that reduce the expected physical
      signature without adding independent evidence for the event itself."
  - claimId: YDIH-C013
    verdict: well_supported
    confidence: high
    reasoning: Multiple independent paleoproxy lines — including foraminiferal δ18O,
      deep‑water ventilation proxies, and other ocean indicators — converge on a
      weakened Atlantic Meridional Overturning Circulation during the Younger
      Dryas, and this mechanism is widely accepted in neutral reviews
      (YDIH‑E028). Debate remains over the exact freshwater forcing pathways and
      magnitudes, but these uncertainties concern trigger details rather than
      the existence of the circulation change itself. The strongest opposing
      consideration is that proxy interpretations and models still differ over
      the precise structure and timing of AMOC changes, but this affects
      fine‑grained dynamics more than the broad mechanistic consensus.
  - claimId: YDIH-C001
    verdict: well_supported
    confidence: high
    reasoning: The Greenland GISP2 platinum anomaly is documented by a
      high‑resolution ICP‑MS time series from an independent, non‑YDIH
      laboratory (YDIH‑E001), and no substantive challenge to the measurement
      has been raised; the 2026 correction only refines its magnitude and
      duration and emphasizes the unknown source (YDIH‑E003). The signal’s
      ~21‑year span and modest magnitude are consistent with a real but subtle
      geochemical event. The strongest opposing consideration is that such a
      small Pt influx could plausibly be produced by non‑catastrophic processes
      (e.g., ordinary meteoroid ablation or volcanism), so the anomaly’s
      existence alone carries limited diagnostic weight for any specific cause.
  - claimId: YDIH-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Moore et al. (2017) report boundary‑age sedimentary Pt enrichments at
      eleven North American sites, with boundary concentrations roughly an order
      of magnitude above local background (YDIH‑E002), and these measurements
      were not themselves challenged in the 2026 correction. Still, they come
      from a single proponent‑affiliated group, with sampling targeted at
      pre‑identified horizons and without continuous background
      characterization, leaving open questions about how rare such peaks truly
      are. The strongest opposing consideration is the absence of
      independent‑lab replication with more neutral sampling designs, coupled
      with osmium‑isotope evidence at other sites that shows Pt‑group anomalies
      can be volcanic, undermining any default assumption that the observed
      enrichments must be impact‑derived.
  - claimId: YDIH-C003
    verdict: mixed
    confidence: moderate
    reasoning: Proponent teams have reported nanodiamond‑rich layers, including
      claimed lonsdaleite, at Younger Dryas boundary horizons (YDIH‑E010),
      which, if confirmed and shock‑formed, could be impact‑ relevant. However,
      independent TEM work by Daulton et al. failed to find nanodiamonds in
      tested YD sediments and argued that particles called lonsdaleite were
      instead stacked graphene‑like aggregates (YDIH‑E011), directly challenging
      the most diagnostic aspect of the proxy. The strongest opposing
      consideration is that Daulton et al. sampled only some sites and
      preparations, so it remains possible that nanodiamonds exist at other
      localities or under different methods, but boundary specificity and
      lonsdaleite identification are clearly not established.
  - claimId: YDIH-C004
    verdict: mixed
    confidence: high
    reasoning: Magnetic microspherules are abundant in many sediments and are
      reported by proponents to peak at Younger Dryas boundary horizons across
      four continents (YDIH‑E005, E006), supporting the existence of some
      spherule populations. Yet independent replication at seven sites (Surovell
      et al.) failed to find boundary peaks (YDIH‑E007), a later multi‑author
      blind test found little or nothing at the boundary and a larger peak in
      younger sediment (YDIH‑E009), and the Baffin Bay retraction documents
      striking misidentification of “spherule fragments” as foraminifera
      (YDIH‑E034). The strongest opposing consideration is LeCompte et al.’s
      demonstration that protocol differences could cause real spherules to be
      missed and their claimed recovery of boundary spherules using original
      methods (YDIH‑E008), but without standardized criteria and blinded
      multi‑lab success, the alleged boundary‑specific abundance peaks remain
      unproven.
  - claimId: YDIH-C005
    verdict: mixed
    confidence: moderate
    reasoning: Bunch et al. and later proponent work report meltglass and related
      phases whose mineralogy suggests formation at very high temperatures
      (1,700–>2,200 °C) in strata dated near the Younger Dryas onset (YDIH‑E012,
      E013), which is clearly non‑trivial. However, these materials come from
      proponent laboratories, lack blinded independent re‑analysis, and have not
      been shown in securely dated in situ contexts to be uniquely associated
      with the onset rather than with other high‑temperature processes (e.g.,
      lightning, anthropogenic fires, industrial contamination). The strongest
      opposing consideration is that such high temperatures are achievable by
      known terrestrial processes, so without better contextual control and
      geochemical discrimination the melts’ existence does not strongly
      implicate impacts.
  - claimId: YDIH-C006
    verdict: well_supported
    confidence: high
    reasoning: Haynes’s long‑term geoarchaeological work documents widespread black
      mats draping late Rancholabrean surfaces, often directly overlying last
      megafaunal remains and Clovis artifacts (YDIH‑E014), and attributes them
      to wetland processes under a moister Younger Dryas climate. This pattern
      has been repeatedly observed across many sites and is not seriously
      disputed. The strongest opposing consideration is that some impact
      proponents have argued for an alternative origin as fallout, but they have
      not provided sedimentological or geochemical evidence that convincingly
      overrides the established wetland interpretation.
  - claimId: YDIH-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: Wolbach et al. compile multiple combustion proxies and argue for an
      exceptional hemispheric biomass‑burning episode at the Younger Dryas onset
      (YDIH‑E017), giving the fire claim some positive support. Nonetheless, the
      primary independent charcoal synthesis (Marlon et al.) finds no
      continent‑wide fire pulse at that time (YDIH‑E016), and Holliday et al.
      (2020) challenge Wolbach’s proxy selection, statistical tests, and claimed
      exceptionalism (YDIH‑E018). The strongest opposing consideration is that
      charcoal records have limited temporal resolution and could miss a very
      brief, intense burning pulse, but as it stands the evidence for
      “exceptional, synchronous” burning is contested and substantially weaker
      than the more mundane interpretation of climate‑modulated fires.
  - claimId: YDIH-C008
    verdict: established
    confidence: high
    reasoning: The extinction of approximately 35 North American megafaunal genera
      in the late Pleistocene is a robust paleontological fact, and statistical
      analysis of last‑appearance dates indicates a geologically rapid
      terminal‑Pleistocene extinction interval rather than a protracted
      staggered decline (YDIH‑E025). While precise species‑level timing remains
      coarse, this does not affect the basic claim that a substantial megafaunal
      extinction event occurred. The strongest opposing consideration is the
      Signor‑Lipps effect and dating sparsity, which limit resolution and can
      blur the exact shape of the extinction curve, but these do not call the
      extinction itself into question.
  - claimId: YDIH-C009
    verdict: well_supported
    confidence: high
    reasoning: The discovery of the Hiawatha crater initially left its age open
      (YDIH‑E023), but subsequent 40Ar/39Ar and U‑Pb dating of impact‑heated
      materials yields a Late Paleocene age of ~58 Ma (YDIH‑E024), excluding it
      as a Younger Dryas candidate. No other crater securely dated to ~12.8 ka
      has been documented. The strongest opposing consideration is that
      airburst‑only scenarios do not require a crater and that other, smaller
      structures could remain undiscovered or undated, but these do not
      undermine the specific claim that no ~12.8‑ka crater is presently known
      and Hiawatha is far too old.
  - claimId: YDIH-C030
    verdict: well_supported
    confidence: high
    reasoning: "Independent replication attempts have repeatedly failed to reproduce
      the claimed Younger Dryas boundary proxy peaks: Surovell et al. found no
      spherule peaks at seven sites (YDIH‑E007), Daulton et al. found no
      nanodiamonds and disputed lonsdaleite identifications (YDIH‑E011), and a
      blind split‑sample test found the boundary unremarkable with a larger
      spherule peak higher in the section (YDIH‑E009). Additionally, there are
      still no consensus, standardized identification criteria, as highlighted
      by the blind test and by misidentification issues surfaced in the Baffin
      Bay retraction (YDIH‑E034). The strongest opposing consideration is that
      LeCompte et al. identify procedural differences that could account for
      some negative replications and claim successful recovery using original
      protocols (YDIH‑E008), but until those protocols are validated in blinded
      multi‑lab designs, the overall replication record remains strongly
      negative."
  - claimId: YDIH-C031
    verdict: established
    confidence: high
    reasoning: The PLOS ONE retraction notices for the 2025 Baffin Bay and shocked
      quartz papers explicitly list chronology, sampling, and identification
      defects, and document the editorial decision to retract both on 11
      February 2026 (YDIH‑E034, E035). Scientific Reports’ 2026 correction to
      the platinum paper unambiguously withdraws its extraterrestrial‑source
      conclusion while leaving the measurements intact (YDIH‑E003). These
      actions are directly evidenced in journal records and were verified in the
      case file. The strongest opposing consideration is that several authors
      disagreed with the retractions and that the underlying physical hypotheses
      could, in principle, be rehabilitated by future, methodologically sound
      work, but that does not alter the accuracy of the claim about the current
      editorial status and its reasons.
