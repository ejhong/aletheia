  synthesis: >-
    The featured hypothesis is a joint-inference claim, not a single
    measurement. An isochronous, correctly identified, background-beating,
    source-discriminated impact assemblage must exist, and that event must then
    have initiated the Younger Dryas cooling, contributed substantially to the
    megafaunal die-off, and disrupted the Clovis world. Evidence for an early
    rung does not validate later ones. Weighed only against the supplied
    records, the first rung is partly real and the rest of the ladder is not
    standing.

    Steelman for the hypothesis. A Harvard laboratory independent of the
    proponent network measured a genuine multi-decadal platinum anomaly in GISP2
    ice near the onset. Proponent teams have reported platinum enrichments,
    magnetic spherules, nanodiamonds, and high-temperature melt products at
    sites on several continents, and a 2015 Bayesian chronological model finds
    those dates consistent with a roughly century-scale window. Napier's Taurid
    progenitor scenario is a real dynamical proposal in the astronomical
    literature and supplies a physically intelligible way to produce dispersed
    airbursts without a single crater, so the 2022 Paleocene dating of Hiawatha
    is not by itself a logical death blow. LeCompte and colleagues documented
    concrete protocol differences that could cause an independent team to miss
    real spherules. The 2026 retractions document error, misidentification, and
    methodological failure rather than fabrication, several authors disagreed
    with both notices, and editorial actions subtract papers without proving
    that no Pleistocene event occurred. The Younger Dryas trigger remains
    genuinely open in the paleoclimate literature: meltwater routing is not a
    closed demonstration, a 2026 volcanic-forcing study is itself an emerging
    candidate, and the Greenland platinum carrier has never been identified.

    Steelman against. Every time a controlled or source-discriminating test has
    been applied, the distinctive reading has receded. The only blind,
    split-sample spherule test found the boundary unremarkable and a larger peak
    in younger sediment, and it recorded the absence of standardized
    identification criteria. Independent transmission electron microscopy found
    no nanodiamonds in tested sediments and rejected the shock-diagnostic
    lonsdaleite identification as stacked graphene-family sheets. Osmium-isotope
    and highly-siderophile-element work at Hall's Cave returned a volcanic
    signature; a 2026 Page-Ladson study again favored volcanism. The authors of
    the best-known continental platinum paper formally withdrew the claim that
    an extraterrestrial impact was the most plausible source. A site-by-site
    dating audit found only three of twenty-nine claimed localities securely
    placed at about 12.8 ka, and the Baffin Bay retraction exhibited the failure
    mode in public: recommended calibration moved the layer out of the Younger
    Dryas, and claimed cosmic spherule fragments were identified as marine
    foraminifera. The most checkable human prediction — a continent-wide
    population collapse and Clovis termination — is contradicted by a
    compilation of roughly 1,500 archaeological radiocarbon dates and by the
    specialists' reading of a technological transition rather than a demographic
    catastrophe. The exceptional fire pulse appears in a proponent compilation
    and not in the fire-history community's independent charcoal synthesis,
    whose custodians disputed the use made of their data. Known deglacial
    machinery can weaken the Atlantic overturning circulation without a comet,
    and the extinction chronology can confine the die-off only to a
    two-thousand-year window that also contains human expansion and violent
    climate swings.

    Structurally, public argument for the hypothesis repeatedly jumps from "an
    anomaly exists" to "an impact did it," skipping identification, background
    rate, synchroneity without circular boundary assignment, extraterrestrial
    source, energetic sufficiency, and causal responsibility. The 2023
    thirteen-author review concluded the case fails across physics,
    geochemistry, chronology, ecology, and archaeology; the 2024 exchange left
    that verdict formally contested and substantively unrepaired. What is well
    supported is largely ordinary and predicted by every account on the table:
    the Younger Dryas happened, overturning circulation weakened, megafauna died
    over a broad terminal-Pleistocene interval, black mats are wetland deposits,
    and no crater securely dated to 12.8 ka is known. What is not established is
    the chain that turns a handful of real, mostly grade-one observations into a
    comet. That is why the featured hypothesis is weakly_supported rather than
    contradicted — a cosmic encounter is not logically excluded, and the
    Greenland platinum residue is genuine — and why it is not mixed: the
    independent, blinded, and source-discriminating measurements do not split
    evenly. They run against the distinctive claims. The decisive remaining
    tests are the ones already specified in the research agenda: a jointly
    designed, criteria-locked multi-laboratory blind test of the strongest
    surviving sites, and osmium-isotope plus highly-siderophile-element patterns
    measured on the same aliquots as the platinum. Until those are run,
    additional proponent-protocol sites cannot repair a measurement problem that
    only a locked protocol can end.
claimAssessments:
  - claimId: YDIH-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: The thesis requires an isochronous diagnostic boundary layer plus
      causal links to cooling, extinction, and Clovis disruption. Independent
      laboratories have repeatedly failed to reproduce the signature peaks, the
      one blind test found the boundary unremarkable, source-discriminating
      osmium work has pointed to volcanism where applied, the 2017 platinum
      paper's authors withdrew the extraterrestrial-source conclusion, the two
      newest flagship papers were retracted for chronology, sampling, and
      identification defects, and the Clovis-collapse prediction is
      contradicted. The strongest opposing consideration is the unexplained
      Greenland platinum anomaly together with a continuing proponent
      multi-proxy literature and an airburst formulation that does not need a
      crater, so a cosmic event is not logically excluded. That residue does not
      assemble the required causal chain.
  - claimId: YDIH-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: The extinctions are real and overlap the Younger Dryas transition,
      but last-appearance dates confine the die-off only to a roughly
      two-thousand-year window that also contains human expansion and severe
      climate oscillation. No published chronology isolates an instantaneous
      event, and no independently scrutinized kill-mechanism evidence exists at
      the boundary. The strongest opposing consideration is that Faith and
      Surovell's analysis is statistically consistent with a geologically
      concentrated pulse rather than a long staggered decline, which a sudden
      catastrophe could in principle produce. Concentration at millennial scale
      is equally predicted by climate and hunting accounts.
  - claimId: YDIH-C023
    verdict: contradicted
    confidence: high
    reasoning: Buchanan and colleagues found no population trough in roughly 1,500
      archaeological radiocarbon dates across North America, and Holliday and
      Meltzer concluded the record shows Clovis points giving way to Folsom and
      regional successors as a technological transition, not a catastrophic
      termination. The distinctive, checkable human prediction was made, tested,
      and not found. The strongest opposing consideration is that
      radiocarbon-frequency demography conflates population size with
      preservation and research intensity, and poorly sampled regions could hide
      local abandonment. A continent-wide catastrophe of the claimed severity is
      exactly the signal those compilations should see.
  - claimId: YDIH-C021
    verdict: weakly_supported
    confidence: moderate
    reasoning: Atlantic overturning weakening is well supported and can be initiated
      by meltwater routing, sea-ice feedbacks, and possibly volcanism without an
      impact; the 2026 Page-Ladson study offers a rival exotic trigger with
      actual source-discriminating geochemistry. No direct causal chain from a
      cosmic event to the ocean has been demonstrated in the evidence records.
      The strongest opposing consideration is that an impact-initiated ice-sheet
      destabilization remains physically conceivable and an unresolved trigger
      does not automatically privilege ordinary candidates. A trigger that known
      processes render unnecessary must still earn its place with positive
      evidence that has not survived scrutiny.
  - claimId: YDIH-C010
    verdict: mixed
    confidence: moderate
    reasoning: Kennett and colleagues' 2015 Bayesian model finds dates consistent
      with a synchronous window of 12,835–12,735 cal BP, while Meltzer and
      colleagues' 2014 audit found only three of twenty-nine claimed sites had
      chronology adequate to place their proxies at about 12.8 ka. The 2026
      Baffin Bay retraction showed recommended recalibration moving a claimed
      boundary layer out of the Younger Dryas entirely. The strongest opposing
      consideration is that if the Bayesian date set is representative rather
      than selected, consistency with a century-scale isochron would be genuine
      support. The model inherits its date selections and boundary assignments
      from the same event framework being tested, which can manufacture apparent
      synchrony.
  - claimId: YDIH-C011
    verdict: weakly_supported
    confidence: high
    reasoning: No proposed marker has achieved the combination of standardized
      blinded identification, rarity outside the boundary, and geochemistry that
      excludes terrestrial origins. Hall's Cave osmium isotopes indicated
      volcanism, the 2017 platinum paper now concedes the source is unresolved,
      Pigati and colleagues showed candidate markers accumulate in ordinary
      wetlands, and Page-Ladson 2026 again favored a volcanic signature. The
      strongest opposing consideration is that a confirmed multi-proxy
      coincidence of spherules, nanodiamonds, platinum, and melt glass at many
      sites would be hard to dismiss as local terrestrial noise. That
      coincidence has not survived protocols the proponents did not themselves
      control.
  - claimId: YDIH-C012
    verdict: unresolved
    confidence: moderate
    reasoning: Napier 2010 is a real dynamical proposal, and the Taurid Complex
      genuinely exists, so a debris-stream encounter capable of dispersed
      airbursts without a large crater is a viable astronomical scenario in the
      possibility sense. Establishing that such an environment could exist is
      distinct from showing Earth encountered it at 12.8 ka, and no recovered
      material uniquely ties any Younger Dryas deposit to the Taurids. The
      strongest opposing consideration is that the scenario honestly rescues the
      hypothesis from the missing-crater problem and is not inherently
      unscientific. Each reformulation has reduced the expected geological
      signature while retaining hemispheric consequences, which relocates rather
      than meets the burden of proof.
  - claimId: YDIH-C013
    verdict: well_supported
    confidence: high
    reasoning: Lynch-Stieglitz's review records multiple independent
      paleoceanographic proxy lines for reduced Atlantic overturning during the
      Younger Dryas, and both camps treat the circulation change as the central
      proximate mechanism. The claim is the explanandum's mechanism, not
      evidence for any particular initiator. The strongest opposing
      consideration is that live technical debate remains over
      freshwater-forcing routing and magnitude, so even this consensus mechanism
      is not a closed book. That debate concerns initiation details, not whether
      overturning weakened.
  - claimId: YDIH-C001
    verdict: well_supported
    confidence: high
    reasoning: Petaev and colleagues produced a high-resolution ICP-MS time series
      from GISP2 showing a real platinum rise and fall near the onset, later
      characterized as spanning about 21 years at roughly 30 ppt average with a
      single-sample peak near 80 ppt. The measurement itself is not seriously
      disputed. The strongest opposing consideration is that the discoverers
      proposed an unusual iridium-deficient extraterrestrial source, and a
      multi-decadal influx is at least compatible with a meteoritic carrier. An
      elemental anomaly is evidential grade one of four, the carrier remains
      unidentified, a contemporaneous comment proposed a non-cataclysmic entry,
      and the 2026 correction formally softened the strongest published
      interpretations.
  - claimId: YDIH-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Moore and colleagues reported fire-assay and ICP-MS platinum at
      eleven North American sites averaging about twelve times local background
      near strata dated to the onset, and the 2026 correction leaves those
      enrichments standing while withdrawing the extraterrestrial-source
      conclusion. The measurements are real but come from a single affiliated
      group sampling around pre-identified horizons without systematic
      above-and-below background control or independent-laboratory replication.
      The strongest opposing consideration is that a continentally distributed
      platinum influx would be an important observation if independently
      replicated with continuous sampling. Targeted sampling cannot by itself
      establish that the peaks are extraordinary.
  - claimId: YDIH-C003
    verdict: mixed
    confidence: moderate
    reasoning: Kennett and colleagues reported cubic and hexagonal nanodiamonds in
      boundary sediments in Science, while Daulton and colleagues found no
      nanodiamonds in tested Younger Dryas sediments and concluded purported
      lonsdaleite was misidentified graphene-family aggregates. Later proponent
      reports keep the existence question open, so a blanket negative would
      overstate the record. The strongest opposing consideration is that genuine
      shock-formed lonsdaleite would be strong impact evidence and proponents
      argue other sites and preparations still show diamonds. The diagnostically
      crucial hexagonal identification has never been independently confirmed,
      and the 2016 blind test reported very low or absent nanodiamond abundance
      at the boundary.
  - claimId: YDIH-C004
    verdict: mixed
    confidence: moderate
    reasoning: Firestone 2007 and Wittke 2013 report spherule peaks at many sites on
      four continents, while Surovell and colleagues found no enrichment at
      seven sites and the 2016 two-laboratory blind test found the boundary
      unremarkable, a larger peak in younger sediment, and no standardized
      identification criteria. The 2026 Baffin Bay retraction added claimed
      spherule fragments that consulted experts identified as marine
      foraminifera. The strongest opposing consideration is LeCompte and
      colleagues' documentation of protocol deviations in size fraction and
      magnetic separation that could cause real spherules to be missed. After
      the one blinded split-sample test again found little at the boundary, the
      pattern is more diagnostic of a methods dispute than of an event.
  - claimId: YDIH-C005
    verdict: mixed
    confidence: moderate
    reasoning: "Bunch and colleagues and the Abu Hureyra study report meltglass
      whose mineralogy is interpreted to require formation temperatures of
      roughly 1,730 to more than 2,200 °C, which would narrow the field of heat
      sources if independently confirmed. Temperature does not name a cause:
      lightning, settlement fires, and industrial slag also reach these regimes,
      and depositional age, in-situ context, and analogue exclusion remain
      unmet. The strongest opposing consideration is that confirmed
      high-temperature phases in securely dated boundary strata at Carolina bays
      and a Syrian tell would be genuinely interesting mineralogy. The materials
      are largely unreplicated, Abu Hureyra carries a 2025 correction, and no
      blinded confirmation is in the evidence records."
  - claimId: YDIH-C006
    verdict: well_supported
    confidence: high
    reasoning: Haynes documented widespread dark organic-rich horizons overlying the
      Rancholabrean surface and frequently draping last in-place megafaunal
      remains and Clovis occupations, a repeatable Southwestern field
      observation. Haynes himself attributed the mats to elevated water tables,
      spring discharge, and organic accumulation during a moist interval, not to
      fallout. The strongest opposing consideration is that their striking
      association with the Rancholabrean termination invites an event-marker
      reading. Black mats occur at many other times and places, and Pigati and
      colleagues showed candidate impact markers concentrate in ordinary
      wetlands, so the facies is predicted by every hypothesis on the table.
  - claimId: YDIH-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: Wolbach and colleagues compiled ice-core combustion aerosols and
      sedimentary charcoal and soot and inferred an extraordinary
      continental-to-hemispheric burning episode on the order of a tenth of
      Earth's biomass. Marlon and colleagues' independent North American
      charcoal synthesis found gradual climate-tracking fire and no
      continent-wide pulse at the onset, and Holliday and colleagues challenged
      the compilation's selection, chronological treatment, and claimed
      exceptionalism. The strongest opposing consideration is that a very short
      pulse could be smoothed out of charcoal databases and that Wolbach
      published a point-by-point reply. The field's own reference synthesis,
      built for unrelated purposes, does not see the extraordinary episode, and
      the data's custodians dispute that reading.
  - claimId: YDIH-C008
    verdict: established
    confidence: high
    reasoning: "Approximately thirty-five genera of North American megafauna are
      gone by the early Holocene, and Faith and Surovell found last-appearance
      data statistically consistent with a concentrated terminal-Pleistocene
      interval rather than a long staggered decline. The extinctions themselves
      are as solid as Quaternary paleontology gets. The strongest opposing
      consideration is not to the claim as stated but to its downstream use:
      last-appearance dates underestimate true extinction times, and the
      assessed window of roughly 13.8–11.4 ka calibrated spans millennia on
      either side of 12.8 ka. The observation is true and simultaneously cannot
      isolate an afternoon-scale event."
  - claimId: YDIH-C009
    verdict: well_supported
    confidence: high
    reasoning: Kenny and colleagues dated Hiawatha to 57.99 plus or minus 0.54
      million years by concordant argon-argon and uranium-lead methods on
      impact-heated minerals, removing the only widely discussed crater
      candidate, and no other structure of the right age has been proposed with
      credible dating. This is a documented absence plus a decisive positive
      dating, not an argument from silence. The strongest opposing consideration
      is that airburst formulations do not require a crater and undiscovered
      structures could exist. The more energy and geographic reach claimed for
      the event, the more diagnostic the absence of any accepted impact
      structure or in-situ shock evidence becomes.
  - claimId: YDIH-C030
    verdict: well_supported
    confidence: high
    reasoning: Surovell and colleagues, Daulton and colleagues, and the 2016
      Holliday blind test are published independent failures to recover the
      claimed peaks; the blind test itself recorded the absence of standardized
      spherule criteria; and the 2026 Baffin Bay retraction identified claimed
      spherule fragments as foraminifera. Peaks reliably appear under proponent
      methods and reliably fail under independent ones. The strongest opposing
      consideration is that LeCompte and colleagues documented protocol
      differences that could lose real spherules, and some independent workers
      reported recovering spherules at shared sites, so the record is a methods
      war rather than a clean sweep. That objection explains failures without
      yet demonstrating blinded, criteria-locked success.
  - claimId: YDIH-C031
    verdict: established
    confidence: high
    reasoning: PLOS ONE retracted both 2025 flagship papers on 11 February 2026 for
      chronology, sampling, identification, and citation defects, including
      calibration that moved a claimed layer out of the Younger Dryas and
      spherule fragments identified as foraminifera; Scientific Reports
      published the Moore and colleagues correction on 6 May 2026 withdrawing
      the extraterrestrial-source conclusion. These are formal editorial actions
      with published notices. The strongest opposing consideration is that
      several authors disagreed with both retractions and that retraction is
      evidence about papers rather than about the Pleistocene. The notices
      document error and misidentification, not fabrication, and they subtract
      claimed confirmations without proving no event occurred.
