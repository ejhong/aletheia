  synthesis: "This case is a chain, and the evidence file permits each link to be
    graded separately. The bottom rungs are real: a genuine ~21-year platinum
    anomaly in GISP2 ice measured by a laboratory independent of the impact camp
    (C001), sedimentary platinum enrichments whose measurements survive their
    own correction (C002), real black mats (C006), real extinctions (C008), and
    a well-dated cooling whose AMOC proximate mechanism is common ground (C013).
    The failure is in the climb from \"an anomaly exists\" to \"an impact did
    it.\" The two load-bearing walls are compromised: synchroneity (C010) rests
    on a Bayesian consistency model that inherits investigator-assigned
    boundaries, against an audit finding 3 of 29 sites adequately dated and a
    2026 retraction showing recalibration moving a \"boundary\" out of the
    Younger Dryas entirely; diagnosticity (C011) has failed every
    source-discriminating test applied — osmium isotopes at Hall's Cave returned
    volcanic, the 2017 platinum paper's authors formally withdrew the
    extraterrestrial attribution, the only blind split-sample test found the
    boundary unremarkable with a larger peak above it, and independent
    microscopy rejected the shock-diagnostic nanodiamond identification.
    Steelmanning the proponents: nineteen years of peer-reviewed output, a
    concrete protocol-based diagnosis of replication failures, a legitimate
    Taurid dynamical scenario, a formally open 2024 exchange, an honestly
    unidentified platinum carrier, and the fact that the decisive
    jointly-designed blind test has never been run — the hypothesis has arguably
    never faced a test both camps signed. Steelmanning the critics: the layer
    appears under proponent protocols and vanishes under everyone else's, which
    is the signature of a methods artifact; the most checkable consequence
    prediction (continent-wide demographic collapse) was tested within a year
    and not found (C023); the crater candidate is 58 million years old; the
    independent fire baseline sees no onset pulse; and the 2026 retraction
    notices read as a checklist of the calibration, sampling, and identification
    failure modes critics diagnosed for a decade. Retractions are evidence about
    papers, not the Pleistocene, and dispersed airbursts cannot be excluded —
    which holds this at weakly_supported rather than contradicted. But a
    hypothesis whose impactor shrinks at every disconfirmation while retaining
    every claimed consequence is spending plausibility, and an unexplained
    platinum anomaly is a residue, not a foundation. Where this verdict leans on
    priors rather than the records — the sufficiency of deglacial AMOC triggers,
    airburst energy scaling — that dependence is flagged in the relevant claim
    reasoning; everything else follows from the file."
