  synthesis: "The featured hypothesis is a conjunction resting on a chain of
    independent links: an anomaly exists, it is correctly identified, it is
    extraordinary against local background, it is securely dated, it is
    synchronous across sites, it is extraterrestrial in origin, it is
    energetically sufficient, and it caused the climate, faunal, and cultural
    changes attributed to it. The evidence records here place the case's failure
    point early — at identification and background (YDIH-C011, YDIH-C004) —
    which means the later links never come into play regardless of how they
    would be judged on their own. Steelmanning the proponents: the Greenland
    platinum anomaly (YDIH-C001) is a real, high-resolution measurement from an
    independent laboratory whose carrier phase has never been identified, and an
    unexplained anomaly is not a refuted one; LeCompte et al.'s protocol
    diagnosis is concrete and testable rather than evasive, so the replication
    failures are not automatically the replicated claim's fault; Napier's Taurid
    scenario is genuine peer-reviewed dynamics; and the 2026 retractions are
    editorial findings about two papers, not measurements of the Pleistocene. It
    is also fair to note that much of the critical literature comes from one
    recurring group of authors, so non-independence cuts both ways in a small
    field. Steelmanning the critics is nonetheless decisive on the present
    record: the single blinded, split-sample, two-laboratory test found the
    boundary unremarkable and a larger spherule peak above it; the diagnostic
    lonsdaleite identification was rejected by independent crystallographers;
    the two occasions on which source-discriminating osmium geochemistry was
    applied returned volcanic; the candidate markers demonstrably accumulate in
    wetlands without any event; the proponents themselves withdrew the
    extraterrestrial-source conclusion from the best-known platinum paper; the
    crater was dated away by two independent methods; and the hypothesis's most
    checkable prediction — a continental demographic collapse (YDIH-C023) — was
    tested and found absent. Because every consequence has an independently
    attested conventional explanation, the hypothesis must earn its place with
    positive impact-diagnostic evidence, and no such evidence currently survives
    blinding. Nothing here proves no object fell; the decisive experiments
    (criteria-locked blind replication, same-aliquot osmium) remain unrun, and
    their absence — not their outcome — is why this is weakly_supported rather
    than contradicted."
claimAssessments:
  - claimId: YDIH-C020
    verdict: weakly_supported
    confidence: high
    reasoning: "As a conjunction the claim is in poor shape: its archaeological
      conjunct is directly contradicted, its fire and extinction conjuncts are
      unsupported at the required resolution, and its distinctive physical
      evidence has never survived blinding or source-discriminating
      geochemistry. A real peer-reviewed proponent literature exists and
      continues, and its defenders answer each specific criticism, but
      aggregation of disputed, largely non-independent primary studies does not
      manufacture strength. The strongest opposing consideration is that none of
      this establishes a negative: no evidence record demonstrates that no
      airburst occurred, and the Greenland platinum carrier is still
      unidentified. The verdict reflects the absence of surviving positive
      evidence, not a demonstration of absence."
  - claimId: YDIH-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The extinctions are real and geologically concentrated, but Faith
      and Surovell's own framing puts the resolved interval at roughly 13.8–11.4
      ka calibrated, which cannot isolate an instantaneous event and equally
      accommodates climate change and human predation. No kill-mechanism
      evidence at the boundary survives independent scrutiny in these records.
      The strongest opposing consideration is Signor-Lipps bias: last-appearance
      dates systematically postdate nothing and predate true extinction, so a
      genuinely abrupt terminal event could be smeared by sampling. Even
      granting that, the claim has no positive discriminating support, and it
      inherits the weakness of the impact claim it depends on."
  - claimId: YDIH-C023
    verdict: contradicted
    confidence: high
    reasoning: "This is the hypothesis's most checkable prediction and it was tested
      directly: ~1,500 archaeological radiocarbon dates show continuity rather
      than a trough at 12.9 ka, and the dedicated Paleoindian review found
      technological succession from Clovis to Folsom with no occupation gap. The
      category error also matters — a projectile-point technocomplex is not a
      population that can be exterminated. The strongest opposing consideration
      is that radiocarbon-frequency demography conflates population with
      preservation and research intensity and is noisy at century scale; but the
      predicted signal was a continent-wide catastrophe, exactly the magnitude
      such proxies should detect. Softer regional-reorganization versions remain
      open but are not distinctively impact predictions."
  - claimId: YDIH-C021
    verdict: weakly_supported
    confidence: moderate
    reasoning: No evidence record demonstrates any causal chain from a cosmic event
      to the overturning circulation; the claim is physically conceivable but
      evidentially idle. Known deglacial processes plus, on the 2026 Page-Ladson
      result, a volcanic candidate with actual source-discriminating
      geochemistry behind it can initiate the circulation change without
      anything from the sky. The strongest opposing consideration is that the
      initiating trigger is genuinely unresolved, and "known processes suffice"
      is a plausibility judgment rather than a demonstration — an open question
      does not privilege the conventional candidates either. But an unnecessary
      trigger must supply positive evidence, and none survives.
  - claimId: YDIH-C010
    verdict: weakly_supported
    confidence: moderate
    reasoning: 'The affirmative case is a single Bayesian model whose inputs — which
      dates enter and which stratum counts as "the boundary" at each site — were
      not chosen independently of the hypothesis, so "consistent with synchrony"
      is substantially weaker than demonstrated synchrony. Against it, an
      independent site-by-site audit found only 3 of 29 localities with dating
      adequate to place the proxy horizon at ~12.8 ka, and the Baffin Bay
      retraction showed the failure mode operating in 2025: recommended
      recalibration moved the claimed layer out of the Younger Dryas entirely.
      The strongest opposing consideration is that circularity is an objection
      to the method, not a demonstration of asynchrony — a properly blinded
      synchrony test (YDIH-R004) has never been run. The claim also inherits the
      prior problem that the peaks being correlated are themselves contested.'
  - claimId: YDIH-C011
    verdict: contradicted
    confidence: moderate
    reasoning: "Every marker for which a discriminating test was actually performed
      came back terrestrial or non-unique: osmium isotopes and
      highly-siderophile patterns at Hall's Cave and Page-Ladson indicate
      volcanic sources, the shock-diagnostic lonsdaleite identification was
      rejected by independent electron microscopists, candidate markers
      including magnetic spherules accumulate in ordinary desert wetlands of
      many ages, and the original authors formally withdrew the
      extraterrestrial-source conclusion from the platinum study in May 2026.
      \"Diagnostic\" is precisely the property these results defeat. The
      strongest opposing consideration is scope: two sites do not settle all
      sites, the Greenland platinum carrier remains unidentified, and the
      melt-glass and shocked-quartz lines have never been independently tested
      in either direction. The verdict therefore contradicts the diagnosticity
      claim as stated, not the weaker claim that some anomalies are
      unexplained."
  - claimId: YDIH-C012
    verdict: weakly_supported
    confidence: low
    reasoning: "Napier's model is real peer-reviewed dynamics and the Taurid Complex
      exists, so a debris-encounter scenario is not ad hoc invention; but a
      possibility argument, model-dependent in its giant-comet fragmentation
      history, is thin support even for the modest claim of viability, and no
      record here tests it against modern Taurid observations. Nothing recovered
      from any Younger Dryas deposit is compositionally tied to a cometary
      stream. The strongest opposing consideration cuts the other way from my
      verdict: the 2023 review asserts the proposed impact scenarios are
      physically inconsistent, and no published version has shown mutual
      consistency of energy, altitude, blast physics, and hemispheric effect —
      which, if sustained, would push this toward contradicted. I mark it weak
      rather than unresolved because the only direct evidence record on the
      dynamics is supportive; the plausibility discount reflects general
      background about airburst energy budgets, not the records."
  - claimId: YDIH-C013
    verdict: well_supported
    confidence: high
    reasoning: Multiple independent paleoceanographic proxy lines converge on
      reduced Atlantic overturning during the Younger Dryas, and a neutral
      review written outside this controversy treats it as the central proximate
      mechanism. This is common ground for both camps and does not discriminate
      between triggers. The strongest opposing consideration is that the
      freshwater-forcing details and the initiation sequence remain genuinely
      debated at decadal resolution, which is why I stop short of "established."
      Nothing in the records challenges the AMOC role itself.
  - claimId: YDIH-C001
    verdict: well_supported
    confidence: high
    reasoning: A high-resolution ICP-MS time series from a premier archive by a
      laboratory with no impact-camp affiliation, with values now formally
      restated in the 2026 correction (~21-year span, ~30 ppt mean, ~80 ppt
      peak); the measurement itself is not disputed anywhere in these records.
      Its interpretation is a separate matter and is explicitly unresolved. The
      strongest opposing consideration is that no independent replication of the
      anomaly in a second ice core appears in the evidence base, so the finding
      rests on one study of one core — which is why I do not call it
      established. Its magnitude is also modest enough to be compatible with
      unremarkable sources.
  - claimId: YDIH-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The fire-assay and ICP-MS numbers at eleven sites are real analytical
      results and the 2026 correction left the measurements untouched while
      withdrawing only the source attribution. But they come from a single
      proponent-affiliated group with no independent-laboratory replication, and
      the sampling targeted horizons pre-identified as the boundary, so the
      "twelve times background" ratio partly measures the sampling design rather
      than the sediment. The strongest opposing consideration in favor of the
      claim is that the enrichments were reported across a wide geographic
      spread and the authors' own correction did not retreat from them.
      Continuous stratigraphic sampling and outside replication would settle it
      quickly.
  - claimId: YDIH-C003
    verdict: weakly_supported
    confidence: moderate
    reasoning: The affirmative report is a one-page Brevia whose identification
      evidence lives in supplements; against it, independent TEM and
      electron-diffraction specialists found no nanodiamonds in tested Younger
      Dryas sediments and concluded the shock-diagnostic hexagonal phase was
      misread stacked graphene-family sheets, and the blind test likewise found
      nanodiamond abundance low or absent at the boundary. The diagnostically
      crucial part of the claim is therefore the part that failed independent
      scrutiny. The strongest opposing consideration is that Daulton et al.
      tested particular sediments and preparations, so their negative does not
      automatically generalize, and later proponent reports at other sites keep
      the existence question formally open. Blinded, criteria-locked TEM on
      shared splits has never been done.
  - claimId: YDIH-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "Spherules are present in these sediments — they are present in most
      sediments — so the contested content is the boundary-specific peak, and
      that peak appears reliably under proponent protocols and disappears under
      independent ones: a seven-site replication found no enrichment, and the
      one blinded two-laboratory split-sample test found the boundary
      unremarkable with a larger peak in younger sediment. The 2026 retraction
      added a concrete identification failure, with claimed spherule fragments
      identified by consulted experts as marine foraminifera. The strongest
      opposing consideration is LeCompte et al.'s documented protocol deviations
      in size-fraction handling and magnetic separation, which could plausibly
      lose real spherules — a testable diagnosis that has never been resolved
      because no criteria-locked joint test has been run. Until it is, the
      claim's affirmative evidence is entirely method-internal."
  - claimId: YDIH-C005
    verdict: weakly_supported
    confidence: low
    reasoning: The melt-glass reports come exclusively from proponent laboratories,
      have no independent replication in either direction, and two of the
      relevant papers carry corrections whose content was not reviewed for this
      case. The phase interpretations underlying the temperature estimates have
      never had blinded confirmation, and at a complex tell site such as Abu
      Hureyra the mundane high-temperature analogues — settlement fires, later
      occupation, lightning — are exactly the hardest to exclude. The strongest
      opposing consideration is that no study in this evidence base has looked
      for these materials and failed to find them, so this line is under-tested
      rather than refuted; genuinely verified >2,000 °C phases in dated in-situ
      context would be a substantial finding. Note also that temperature alone
      identifies a heat regime, not a heat source.
  - claimId: YDIH-C006
    verdict: well_supported
    confidence: high
    reasoning: 'Decades of geoarchaeological fieldwork document dark organic-rich
      horizons overlying the Rancholabrean surface and frequently draping the
      last in-place megafaunal remains and Clovis occupations; this is among the
      most repeatable field observations in the region. The claim as stated is
      purely observational and is not contested by any record here. The
      strongest opposing consideration concerns its use rather than its truth:
      the same documenter attributes the mats to rising water tables and spring
      discharge, and comparable mats occur at many other times and places, so
      they carry no impact-diagnostic content. I stop short of "established"
      only because the evidence base cites essentially one primary synthesis.'
  - claimId: YDIH-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: The independent continental charcoal synthesis, assembled by the
      fire-history community for unrelated purposes, sees burning tracking
      climate across the deglaciation with no continent-wide pulse at the onset
      — a baseline the extraordinary-burning claim has to explain away. The
      proponent compilation's data selection, treatment of chronological
      uncertainty, and statistical exceptionalism were formally challenged by
      workers including two builders of the underlying database, and the
      reanalysis could not reproduce the global-burning interpretation. The
      strongest opposing consideration is that charcoal archives smooth
      chronology and a very brief pulse could in principle be underrepresented,
      and the proponents replied point-by-point in the same volume, leaving the
      exchange formally open. Fires certainly occurred; "exceptional and
      synchronous" is the unsupported word.
  - claimId: YDIH-C008
    verdict: established
    confidence: high
    reasoning: 'The late Pleistocene loss of roughly 35 North American megafaunal
      genera is about as secure as Quaternary paleontology gets, and the cited
      last-appearance analysis is statistically careful about what sparse dating
      can show. The claim as stated — extinctions plus consistency with a
      concentrated terminal-Pleistocene interval — is fully supported. The
      strongest opposing consideration is interpretive rather than factual: the
      "concentrated" interval spans roughly two millennia, so the claim licenses
      nothing about causes and is routinely miscited as though it dated the
      die-off to the impact horizon. Its diagnosticity for this case is
      essentially zero.'
  - claimId: YDIH-C009
    verdict: well_supported
    confidence: high
    reasoning: The Hiawatha age is fixed by direct, dual-method dating — 40Ar/39Ar
      on impact-heated sand and U-Pb on zircon in impact-melt pebbles —
      converging at 57.99 ± 0.54 Ma, published by a team including the crater's
      discoverers; the only proposed candidate structure is thereby removed. The
      broader negative, that no securely dated ~12.8 ka crater is known
      anywhere, is a documented absence rather than an argument from silence,
      since no rival structure with credible dating has been put forward. The
      strongest opposing consideration is that dispersed-airburst formulations
      do not predict a crater at all, so this claim disciplines the argument
      more than it decides it; undiscovered structures also cannot be excluded.
      Its weight grows with the energy and reach claimed for the event.
  - claimId: YDIH-C030
    verdict: well_supported
    confidence: high
    reasoning: "The pattern is documented in the primary literature rather than
      inferred: a seven-site independent study found no spherule enrichment,
      independent TEM found no nanodiamonds, and the one blinded split-sample
      two-laboratory test found the boundary unremarkable while explicitly
      noting the absence of standardized identification criteria — a gap still
      biting in 2026 when retraction reviewers reidentified claimed spherule
      fragments as foraminifera. The strongest opposing consideration is
      genuinely serious: replication failure can be the replicator's fault,
      LeCompte et al. documented specific protocol deviations that could lose
      real spherules, and some outside workers did recover spherules at shared
      sites, so this is a methods war rather than a clean sweep. That caveat
      does not change the first-order fact the claim asserts, and it is exactly
      why criteria-locked joint protocols are the decisive next step."
  - claimId: YDIH-C031
    verdict: established
    confidence: high
    reasoning: "These are formal, published editorial actions — two PLOS ONE
      retraction notices dated 11 February 2026 and a Scientific Reports
      correction dated 6 May 2026 — whose texts were fetched and read, with the
      stated grounds, author dissent, and language changes all matters of public
      record. The claim asserts the actions and their stated reasons, not any
      conclusion about the Pleistocene. The strongest opposing consideration is
      against overreading in either direction: the notices document error,
      misidentification, and sampling and chronology defects, make no finding of
      fabrication, and were formally disputed by most responding authors — while
      that dissent does not restore the papers' evidentiary standing.
      Retractions subtract claimed confirmations; they do not prove a negative."
