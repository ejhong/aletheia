  synthesis: >-
    The Younger Dryas Impact Hypothesis posits a grand causal chain linking a
    cometary encounter to a global boundary proxy layer, continental
    conflagrations, AMOC collapse, megafaunal extinction, and the collapse of
    the Clovis culture. A fair steelman of the proponent position emphasizes
    that several foundational observations are genuine physical phenomena: a
    well-resolved, multi-decadal platinum peak is preserved in the GISP2
    Greenland ice core (Petaev et al. 2013); elevated platinum concentrations
    occur across multiple North American sedimentary sequences (Moore et al.
    2017); cometary fragmentation models (Napier 2010) provide a dynamically
    plausible mechanism for multi-airburst encounters that leave no crater; and
    localized melt products attest to high temperatures. Furthermore, proponents
    argue that negative replication attempts often modified essential separation
    protocols, potentially washing out fragile microspherules.


    Despite these isolated observations, the overarching hypothesis is
    contradicted when evaluated as an integrated causal system. The inference
    chain fails at every structural transition. First, the proxy assemblage
    lacks extraterrestrial diagnosticity: the 2016 blind test demonstrated that
    microspherule peaks occur outside the boundary and lack objective
    identification criteria; nanodiamonds and lonsdaleite were shown under
    transmission electron microscopy to be misidentified graphene/graphane
    sheets (Daulton et al. 2010); candidate spherules concentrate naturally in
    ordinary wetland facies (Pigati et al. 2012); and osmium isotope analyses at
    Hall's Cave and Page-Ladson indicate volcanic rather than extraterrestrial
    origins. Crucially, the 2017 North American platinum paper was formally
    corrected in May 2026 to withdraw its extraterrestrial attribution, and both
    2025 flagship papers (cometary dust and shocked quartz) were retracted in
    2026 for fundamental age-modeling, sampling, and identification defects.
    Second, chronological synchroneity collapses: site audits show that only 3
    of 29 boundary sites have adequate radiometric control (Meltzer et al.
    2014), and Bayesian synchrony claims relied on circular boundary selection.
    Third, the claimed environmental and human consequences are contradicted by
    specialist records: continental charcoal databases demonstrate wildfire
    activity tracked post-glacial climate transitions without an unprecedented
    onset pulse (Marlon et al. 2009); radiocarbon demographic frequencies
    demonstrate continuity rather than human population collapse (Buchanan et
    al. 2008); Clovis transitioned culturally into Folsom without an
    occupational gap (Holliday & Meltzer 2010); and terminal-Pleistocene
    extinctions spanned a broad two-millennium window. Finally, the only
    proposed crater candidate (Hiawatha) was dated to ~58 Ma.


    In terms of sensitivity, the single evidence record whose removal would most
    alter this assessment is the 2016 Holliday et al. multi-laboratory blind
    test (YDIH-E009) or the Meltzer et al. 2014 chronological audit (YDIH-E019).
    Nevertheless, the case verdict of contradicted comfortably survives without
    them: independent archaeological continuity data, regional charcoal
    baselines, nanodiamond misidentifications, volcanic osmium signatures, and
    the 2026 editorial retractions independently refute the causal catastrophe
    model.
