    osmium-isotope geochemistry at Hall's Cave returned a volcanic answer, and
    Pigati et al. showed the candidate markers accumulate in ordinary wetlands
    without any event. The replication link (C030) is the case's most damaging
    structural fact: the signature spherule and nanodiamond peaks appear under
    proponent protocols (Wittke, LeCompte) but vanish under independent
    protocols (Surovell, Daulton) and under the methodologically strongest test
    in the literature, the 2016 blind test, which also documented that no
    standardized identification criteria exist. The chronology link (C010) is
    contested but damaged: the Meltzer audit found adequate dating control at
    only 3 of 29 claimed sites, and the Bayesian answer (Kennett 2015) inherits
    the circularity objection and a 2024 correction. The consequences links fail
    most cleanly of all: the predicted human population crash is absent from
    ~1,500 radiocarbon dates (Buchanan 2008), and Paleoindian specialists find a
    normal technological transition rather than a termination (Holliday &
    Meltzer 2010). The record's newest flagship support was formally withdrawn
    in 2026 — two PLOS ONE retractions and the Moore correction withdrawing the
    extraterrestrial-source conclusion in the proponents' own signed language —
    while the only proposed crater was directly dated to 58 Ma. Against all
    this, the case for the hypothesis rests on a small set of genuine anomalies
    (the GISP2 platinum measurement, proponent-team meltglass and spherule
    reports) plus aggregation of non-independent studies (Sweatman 2021). The
    steelman below names what survives. Sensitivity: the single record whose
    removal would most change the case verdict is E009, the 2016 blind test;
    without it, the replication war would be Surovell-versus-LeCompte, a live
    protocol dispute, and the case verdict would soften from contradicted toward
    weakly_supported or mixed on the layer claims. Even without E009, however,
    the verdict on the full compound hypothesis survives, because the
    diagnosticity failure (E004, E015), the chronology audit (E019), the
    demographic and archaeological negatives (E026, E027), the Hiawatha
    exclusion (E024), and the 2026 retractions (E034–E035) each independently
    undercut links the conjunction needs. The verdict is contradicted rather
    than unresolved because the negative evidence is not mere absence: it
    includes direct failed replications, a failed blind test, discriminating
    geochemistry that returns terrestrial answers, and negative tests of
    distinctive predictions. Confidence is moderate rather than high because a
