  synthesis: >-
    The featured hypothesis is a compound causal claim, not merely the
    proposition that unusual material reached Earth near the Younger Dryas
    onset. It requires a real cosmic event, correctly identified event products,
    adequate dating and intersite synchrony, sufficient energy, and causal links
    to cooling, extinction, fire, and cultural change. The record supports
    several local observations: the GISP2 platinum anomaly is real; platinum
    enrichments were measured at eleven North American sites; black mats are
    widespread; terminal-Pleistocene megafaunal losses were geologically
    concentrated; and reduced or reorganized Atlantic overturning was a
    proximate mechanism of Younger Dryas cooling. Those local truths do not
    establish the later links in the proposed chain.

    The strongest affirmative case combines the independent Greenland platinum
    signal, reported continental platinum and microspherule peaks, reported
    high-temperature melts, the Bayesian chronology, and a dynamical model in
    which fragmented comet debris could create dispersed airbursts without one
    large crater. This combination supplies a conceivable scenario and several
    observations deserving explanation. The missing crater is not fatal to an
    airburst formulation, and the Surovell replication failure has a concrete
    proponent rebuttal concerning particle-recovery protocols. Chronological
    smoothing could also obscure a short fire or demographic disturbance. These
    are meaningful defenses rather than reasons to dismiss the hypothesis
    sociologically.

    Nevertheless, the record weighs strongly against the featured compound
    claim. The four-continent isochron is contradicted by the site-level audit:
    only 3 of 29 claimed sites had adequate dating, while the affirmative
    Bayesian result establishes consistency with synchrony only after disputed
    date selection and boundary assignment. Source-discriminating geochemistry
    at Hall's Cave and Page-Ladson found volcanic signatures, demonstrating that
    siderophile-element anomalies are not impact-diagnostic. The platinum-paper
    correction expressly preserved the measurements while withdrawing their
    extraterrestrial attribution. Nanodiamond and microspherule claims face
    direct specialist challenges, independent replication failures, and a
    blinded test that found the boundary unremarkable relative to a younger
    sample. Ordinary wetlands can concentrate candidate markers, while black
    mats themselves are documented as wetland facies. The independent
    continental charcoal synthesis found no onset-specific conflagration, and
    the extraordinary-burning compilation remains methodologically contested.
    Archaeological evidence directly contradicts a continent-wide population
    collapse or catastrophic termination of Clovis: date frequencies continue
    through the boundary, with Clovis giving way to successor technologies
    rather than an occupation hiatus. The extinction chronology spans a broad
    interval and supplies no event-specific causal link.

    Apparent multiplicity of support is also reduced by shared authors,
    laboratories, selected horizons, and sometimes shared sites; reviews and
    argumentative exchanges do not constitute independent replications.
    Conversely, repeated authorship among critics is not itself probative, so
    this verdict rests on the blind design, source-discriminating measurements,
    chronological audit, and direct archaeological tests rather than a vote
    count. The 2026 retractions remove two recent supports but do not prove that
    no event occurred. Overall, an isolated unrecognized airburst remains
    logically possible, but the supplied evidence contradicts the claimed
    synchronous, diagnostic, continent-spanning catastrophe and its bundled
    consequences.

    The single-record sensitivity test is YDIH-E009, the blinded
    microspherule/nanodiamond study. Removing it would most weaken confidence in
    the replication and background-rate judgment because it is the record's
    strongest controlled test. The contradicted verdict survives its removal
    because the independent seven-site failure, nanodiamond re-identification,
    inadequate synchrony, terrestrial geochemical results, fire record, and
    archaeological continuity remain mutually reinforcing.
  steelman: The record does not explain the independently measured, approximately
    21-year GISP2 platinum anomaly near the Younger Dryas onset or identify its
    carrier and source. A proponent can rightly demand source-discriminating
    analysis capable of determining whether that unusual, Ir-deficient platinum
    influx was extraterrestrial and whether it is physically related to the
    sedimentary platinum enrichments reported in North America.
