  synthesis: >-
    The featured hypothesis is a compound causal proposition, not merely the
    claim that unusual material occurs near the Younger Dryas onset. It requires
    a temporally coherent event, markers attributable specifically to
    extraterrestrial impact or airburst, adequate energy and causal pathways,
    and substantial effects on climate, megafauna, and Clovis-era people. The
    supplied record supports several local observations: the corrected GISP2
    platinum anomaly is real; platinum enrichments have been reported in North
    American sediments; black mats are widespread; major megafaunal losses
    occurred during the terminal Pleistocene; and AMOC weakening or
    reorganization is a well-supported proximate mechanism for Younger Dryas
    cooling. None of those local findings, however, establishes the featured
    causal chain.

    Steelmanning the affirmative case, proponents have reported a seemingly
    convergent assemblage of platinum, microspherules, possible nanodiamonds,
    high-temperature products, and combustion proxies at geographically
    dispersed sites. Kennett et al.'s Bayesian model found selected dates
    consistent with a common 12,835–12,735 cal BP interval, LeCompte et al.
    identified concrete protocol differences that could explain one early
    microspherule replication failure, and Napier supplied a theoretical
    fragmented-comet scenario that could yield dispersed airbursts without one
    large crater. The independently measured Greenland platinum anomaly remains
    source-unresolved rather than terrestrial in demonstrated origin, so a
    limited extraterrestrial influx is not excluded.

    The contrary case is structurally stronger. The chronological audit found
    adequate placement at only 3 of 29 claimed sites, while the affirmative
    synchrony model depends on disputed date selection and horizon assignments.
    Independent microspherule and nanodiamond tests returned null or
    misidentification results, and the blinded split-sample test found little at
    the putative boundary but a larger younger peak. Ordinary wetlands can
    concentrate candidate markers, and source-discriminating osmium geochemistry
    at Hall's Cave and Page-Ladson favored volcanic signatures. These findings
    directly contradict the assertion that the assemblage is impact-diagnostic.
    The apparent convergence is also less independent than a paper or site count
    suggests: several affirmative records share authorship networks, protocols,
    selected horizons, and sometimes the same sites, so they cannot be
    multiplied as independent confirmations.

    The proposed consequences fare no better. The neutral charcoal synthesis
    found no continent-wide onset fire pulse, and the exceptional-burning
    compilation remains methodologically disputed. AMOC change is supported, but
    the record supplies no demonstrated impact-to-freshwater or
    impact-to-atmosphere link. The extinction chronology is too coarse to
    identify an instantaneous cause, while archaeological date frequencies show
    continuity and the specialist review describes technological succession
    rather than continent-wide population collapse. The absence of a 12.8-ka
    crater is not decisive against airbursts, but Hiawatha has been decisively
    removed as a candidate. Finally, the two 2025 flagship papers were retracted
    for defects reproducing the controversy's central chronology, sampling, and
    identification problems, and the 2017 platinum paper's authors withdrew its
    extraterrestrial-source conclusion.

    The single record whose removal would most change this assessment is
    YDIH-E009, the 2016 blinded test, because it most directly separates
    target-aware identification from a controlled boundary prediction. Removing
    it would weaken confidence in the negative proxy assessment, but the case
    verdict survives: the chronology audit, independent replication failures,
    terrestrial source discrimination, negative archaeological predictions, and
    lack of a demonstrated climate pathway remain mutually reinforcing. Thus the
    broad hypothesis as stated is contradicted, even though a modest
    extraterrestrial deposition event near the transition remains possible and
    some constituent observations are established.
  steelman: The assessment does not identify what carried the independently
    measured 21-year GISP2 platinum anomaly or why it appeared near the Younger
    Dryas onset. A proponent can rightly demand source-discriminating isotopic
    and carrier-phase analyses of that ice and comparably well-dated archives
    before a limited extraterrestrial influx is excluded.
claimAssessments:
  - claimId: YDIH-C020
    verdict: contradicted
    confidence: high
    reasoning: The record does not sustain the required chain from a synchronous,
      impact-diagnostic layer to climate, extinction, and cultural effects.
      Chronology, proxy specificity, replication, fire, and archaeology each
      supply independent contrary evidence, including direct failure of the
      predicted continent-wide human collapse. The strongest opposing
      consideration is the reported multi-proxy assemblage plus the unresolved
      Greenland platinum anomaly, but those establish neither one event nor the
      asserted consequences.
  - claimId: YDIH-C022
    verdict: contradicted
    confidence: moderate
    reasoning: The extinction record supports a terminal-Pleistocene concentration
      but resolves it only across a broad interval of roughly two millennia, not
      at an instantaneous 12.8-ka horizon. No evidence record connects
      particular last appearances to impact damage, and the underlying event
      attribution is itself unsupported by diagnostic or synchronous markers.
      The strongest opposing consideration is the temporal overlap between the
      extinction interval and the proposed event, but overlap at this resolution
      cannot establish a substantial causal contribution.
  - claimId: YDIH-C023
    verdict: contradicted
    confidence: high
    reasoning: A radiocarbon dataset of about 1,500 archaeological dates found
      continuity rather than the predicted population decline, and the
      archaeological review found no continent-wide occupation gap. It also
      describes Clovis as a technocomplex succeeded by Folsom and regional
      traditions, making technological transition distinct from population
      collapse. The strongest opposing consideration is uneven archaeological
      preservation, but that does not explain the absence of the large,
      continent-wide signal asserted here.
  - claimId: YDIH-C021
    verdict: contradicted
    confidence: moderate
    reasoning: AMOC disruption is supported, but the record contains no measured
      impact-initiated freshwater release or demonstrated atmospheric pathway
      linking an extraterrestrial event to that disruption. Page-Ladson offers
      emerging volcanic evidence as a rival trigger, though it is too new and
      local to establish the alternative by itself. The strongest opposing
      consideration is that the ultimate trigger remains open, leaving an impact
      physically possible; possibility is not evidence that it initiated the
      perturbation.
  - claimId: YDIH-C010
    verdict: contradicted
    confidence: high
    reasoning: The site-by-site audit found only 3 of 29 claimed localities
      adequately dated to place their proxy horizon near 12.8 ka. The
      affirmative Bayesian model shows that selected data are consistent with a
      common interval, but its date selection and boundary assignments are the
      very points in dispute, and the climate onset may precede much of that
      interval. The strongest opposing consideration is the formal
      four-continent synchrony model, but consistency under hypothesis-informed
      assignments does not establish a single isochronous layer.
  - claimId: YDIH-C011
    verdict: contradicted
    confidence: high
    reasoning: Candidate markers occur through ordinary wetland concentration, the
      best blind test found a larger microspherule peak outside the boundary,
      and independent microscopy disputed the diagnostic lonsdaleite
      identification. At two sites, source-discriminating geochemistry favored
      volcanic rather than extraterrestrial material, while the corrected
      platinum paper explicitly leaves the source unresolved. The strongest
      opposing consideration is the geographic and mineralogical variety of
      reported proxies, but shared protocols, authorship, uncertain dating, and
      non-unique terrestrial production prevent that assemblage from being
      diagnostic.
  - claimId: YDIH-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: "Napier's dynamical model supplies a conceivable way for fragmented
      comet debris to generate dispersed airbursts without requiring one large
      crater. It is nevertheless a possibility model: the 12.8-ka encounter is
      posited, no recovered boundary material is tied to the Taurid Complex, and
      no observation in the record validates the proposed progenitor history.
      The strongest opposing consideration to skepticism is that airbursts
      genuinely weaken the evidential force of the missing-crater objection."
  - claimId: YDIH-C013
    verdict: well_supported
    confidence: high
    reasoning: The neutral paleoceanographic review reports multiple independent
      proxies for reduced or reorganized AMOC during the Younger Dryas,
      consistent with the event's North Atlantic climate pattern. This supports
      the proximate climate mechanism without identifying its initiating
      trigger. The strongest opposing consideration is continuing uncertainty
      over the magnitude and routing of freshwater forcing, which limits a
      stronger verdict but does not negate the AMOC inference.
  - claimId: YDIH-C001
    verdict: established
    confidence: high
    reasoning: High-resolution ICP-MS measurements in GISP2 document the corrected
      approximately 21-year platinum anomaly, with an average near 30 ppt and a
      single-sample peak near 80 ppt. The formal correction changes the earlier
      characterization and interpretation, not the existence of the measured
      anomaly. The strongest opposing consideration is that the carrier and
      source remain unknown and the influx is subtle, but neither point
      contradicts this measurement claim.
  - claimId: YDIH-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: One team reported platinum enrichments at 11 sites, with boundary
      samples elevated relative to sampled material above and below, and the
      formal correction did not withdraw those measurements. Confidence is
      limited by target-aware sampling, incomplete continuous backgrounds,
      shared proponent affiliations, and absence of independent laboratory
      replication of these particular results. The strongest opposing
      consideration is therefore methodological rather than a direct
      remeasurement showing that the reported enrichments are absent.
  - claimId: YDIH-C003
    verdict: contradicted
    confidence: moderate
    reasoning: Although proponent studies reported nanodiamonds at multiple sites,
      independent transmission-electron microscopy found none in its tested
      sediments and attributed the claimed lonsdaleite to graphene-family
      aggregates. The blinded study also found very low or absent boundary
      nanodiamond abundance, and no independent confirmation of shock-diagnostic
      lonsdaleite is recorded. The strongest opposing consideration is that the
      negative microscopy examined particular sediments and cannot automatically
      exclude diamonds at every reported site.
  - claimId: YDIH-C004
    verdict: contradicted
    confidence: moderate
    reasoning: The four-continent peak claim comes principally from
      proponent-selected sites analyzed without criteria-locked or blinded
      identification. Independent work found no boundary enrichment at seven
      sites, and the blinded split-sample test found the boundary unremarkable
      relative to a younger sample. The strongest opposing consideration is
      LeCompte et al.'s concrete argument that protocol deviations can lose
      genuine spherules, but recovery under the disputed original protocol does
      not establish the claimed global peak.
  - claimId: YDIH-C005
    verdict: weakly_supported
    confidence: moderate
    reasoning: Proponent-team studies report glass and mineral phases interpreted to
      require temperatures in the claimed range at several localities, including
      Abu Hureyra. The observations remain largely unreplicated, the temperature
      estimates depend on contested phase interpretations, and provenance,
      depositional age, fulgurites, fires, and contamination have not been
      excluded through blinded confirmation. The strongest opposing
      consideration is that the reported mineralogy is potentially unusual and
      has not been directly shown false in the supplied record.
  - claimId: YDIH-C006
    verdict: well_supported
    confidence: high
    reasoning: The dedicated survey documents widespread dark organic horizons
      overlying terminal-Pleistocene surfaces, including last in-place
      megafaunal remains and Clovis occupations at many sites. Its author
      interprets them as wetland and elevated-water-table deposits, which
      challenges an impact interpretation but not this local observational
      claim. The strongest opposing consideration is that the word "frequently"
      is not quantified in the record, preventing an unqualified established
      verdict.
  - claimId: YDIH-C007
    verdict: contradicted
    confidence: high
    reasoning: The independent continental charcoal synthesis found gradual
      deglacial change and no onset-specific continent-wide fire pulse. The
      affirmative compilation reports synchronous combustion proxies and very
      extensive burning, but its selection, chronology, and exceptionalism tests
      were challenged by researchers responsible for the underlying charcoal
      database. The strongest opposing consideration is that archive smoothing
      could obscure a very brief pulse and that the proponents published a
      reply, but the claimed continental-to-hemispheric episode is not
      reproduced by the neutral baseline.
  - claimId: YDIH-C008
    verdict: well_supported
    confidence: moderate
    reasoning: The supplied extinction analysis supports a geologically concentrated
      terminal-Pleistocene loss of North American megafaunal genera rather than
      a long, clearly staggered decline. Its temporal resolution is broad, and
      last-appearance dates are biased later than true last survival by
      preservation and sampling effects. The strongest opposing consideration is
      therefore the sparse species-level chronology, which limits precision but
      does not erase the concentrated extinction pattern.
  - claimId: YDIH-C009
    verdict: well_supported
    confidence: high
    reasoning: "The record identifies no securely dated 12.8-ka crater and directly
      excludes the principal candidate: dual-method dating places Hiawatha at
      57.99 ± 0.54 million years. This is strong support for the claim as
      phrased about current knowledge, not proof that no undiscovered crater
      exists. The strongest opposing consideration is that a multiple-airburst
      hypothesis does not predict a large preserved crater and therefore
      survives this observation."
  - claimId: YDIH-C030
    verdict: well_supported
    confidence: high
    reasoning: Independent investigations repeatedly failed to reproduce boundary
      spherule or nanodiamond peaks, and the blinded study explicitly reported
      no standardized microspherule-identification criteria. These failures span
      different laboratories and methods, although they are not all tests of
      every locality or marker. The strongest opposing consideration is the
      documented protocol dispute raised by LeCompte et al., which shows that
      some null results could reflect recovery differences rather than true
      absence.
  - claimId: YDIH-C031
    verdict: established
    confidence: high
    reasoning: The two PLOS ONE retraction notices directly document the common 11
      February 2026 retraction date and enumerate chronology, sampling, and
      identification defects. The May 2026 Scientific Reports correction
      directly replaces the extraterrestrial conclusion with source-neutral
      language while retaining the platinum measurements. The strongest opposing
      consideration is that most authors disputed the retractions and that
      editorial actions do not disprove a prehistoric event, but neither point
      contradicts the historical claim about what the journals did.
