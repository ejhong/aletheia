  synthesis: >-
    The featured hypothesis asserts a single multi-continent extraterrestrial
    encounter ~12.8 ka that deposited a diagnostic proxy assemblage, ignited
    exceptional fires, destabilized ice margins, forced AMOC reorganization into
    the Younger Dryas, drove substantial megafaunal extinction, and terminated
    Clovis. That claim is a joint-inference chain (E037): each link must hold
    independently, and early observational grades do not automatically validate
    later causal grades. Weighing only the supplied records, the chain breaks at
    multiple load-bearing points.

    On the observational base, the GISP2 platinum anomaly is real and
    independently measured (E001: ~21 yr, ~30 ppt average, ~80 ppt peak), and
    sedimentary Pt enrichments have been reported at multiple North American
    sites (E002). Black mats are widespread and stratigraphically real (E014).
    Megafaunal last-appearance data are consistent with a geologically
    concentrated terminal-Pleistocene pulse within a multi-millennial window
    (E025). AMOC weakening is the well-supported proximate mechanism of the
    cooling itself (E028). A fragmented-comet/Taurid dynamical scenario can in
    principle produce dispersed airbursts without a large crater (E022), and
    Hiawatha is securely excluded at 58 Ma (E024), so absence of a known crater
    is not fatal.

    These points do not rescue the hypothesis. Microspherule abundance peaks
    claimed across four continents fail independent replication (E007 seven-site
    null; E009 blinded splits show boundary unremarkable and a larger post-YD
    peak) and lack standardized identification criteria (E009). Nanodiamond and
    especially lonsdaleite identifications are directly disputed by specialist
    TEM (E011). High-temperature melt products remain largely unreplicated
    proponent reports with open analogue and context problems (E012, E013).
    Independent charcoal synthesis finds no continent-wide fire pulse at onset
    (E016); the proponent burning compilation is formally challenged on
    selection and exceptionalism (E018). Chronology audit shows only 3 of 29
    claimed sites have radiocarbon control adequate for a ~12.8 ka isochron
    (E019); the Bayesian synchrony model (E020) is contested for date-selection
    circularity and carries an unreviewed correction. Source-discriminating Os
    isotopes at Hall's Cave and Page-Ladson return volcanic rather than
    extraterrestrial signatures (E004, E029). The 2017 Pt paper’s own 2026
    correction withdraws the extraterrestrial-source conclusion while leaving
    measurements intact (E003). Archaeological radiocarbon frequencies show no
    demographic crash (E026) and the Clovis–Folsom transition is ordinary
    cultural succession, not termination (E027). Comprehensive independent
    reviews find non-reproducible or non-diagnostic proxies, inadequate
    chronologies, physically inconsistent scenarios, and conventional
    explanations for the claimed consequences (E030, E032); the 2024 exchange
    adds no new primary data (E033). The two 2025 flagship papers were retracted
    for precisely the long-criticized defects—calibration that manufactures
    synchrony, morphological misidentification, missing background sampling,
    incomplete age models (E034, E035)—and the 2017 Pt attribution was corrected
    (E031).

    Steelmanning the affirmative: a real Ir-deficient Pt influx of unknown
    carrier near onset, some multi-site proponent mineralogy if protocols are
    decisive, a viable airburst geometry, and an open freshwater-routing debate
    for AMOC leave room for a limited cosmic contribution. Steelmanning the
    negative: every diagnostic, reproducibility, synchrony, and consequence test
    that has been run independently either fails or is explained by terrestrial
    processes (wetland concentration E015, volcanism, climate-tracking fire,
    human+climate extinction drivers). Paper counts and advocacy certainty
    (E036) are irrelevant; mechanisms, blinded measurements, and source isotopes
    are decisive. The full causal hypothesis is therefore contradicted by the
    supplied record. General priors (impacts are rare; meltwater and volcanic
    forcings are documented) calibrate plausibility but are not required for the
    verdict—the primary failures already suffice. Sensitivity: removal of E032
    (the 2023 comprehensive refutation) would most soften the literature-level
    summary, yet the verdict survives because the independent replication
    failures, chronology audit, isotope results, archaeological nulls,
    correction, and retractions remain.
  steelman: The GISP2 Greenland platinum anomaly remains a real, independently
    measured, Ir-deficient influx of unidentified carrier near the Younger Dryas
