    formal statistical challenge. Chronology audits show only a minority of
    claimed boundary sites are securely dated to the target window; Bayesian
    synchrony models rest on contested date selection and circular boundary
    assignment, defects later repeated in the two 2025 flagship papers that were
    retracted for precisely those chronology, sampling, and misidentification
    failures. No crater of the required age exists; Hiawatha is Paleocene. The
    fragmented-comet scenario is dynamically possible but supplies no recovered
    material or demonstrated encounter. Archaeological radiocarbon frequencies
    and Paleoindian specialist reviews find neither population collapse nor
    technocomplex termination. AMOC weakening itself is well-supported
    paleoceanography and does not require an impact initiator; conventional
    meltwater or volcanic candidates remain viable. Comprehensive
