    tests (Surovell 2009, Holliday 2016) and lack standardized criteria, and
    high-temperature melt glasses lack blinded confirmation or exclusion of
    terrestrial analogues. Black mats are real wetland facies, not impact
    markers. Charcoal compilations claiming exceptional hemispheric burning are
