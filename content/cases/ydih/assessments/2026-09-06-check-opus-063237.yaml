  synthesis: "The featured hypothesis (YDIH-C020) is a conjunction: an exotic
    proxy layer must exist, be correctly identified, be extraordinary against
    background, be securely and synchronously dated, be extraterrestrial in
    origin, be energetically sufficient, and be causally responsible for
    climate, extinction, and cultural change. The supplied record shows at least
    one independent failure at nearly every link, and the failures are not
    symmetric with the successes. The observational base that survives
    independent scrutiny is thin but real: a genuine, non-proponent platinum
    anomaly in GISP2 (C001), real black mats that their own documenter
    attributes to wetland processes (C006), a geologically concentrated
    megafaunal extinction resolved only to a ~2,000-year window (C008), and a
    well-supported AMOC mechanism for the cooling that requires nothing from the
    sky (C013). Every one of these is compatible with no impact at all. The
    links that would convert them into an impact — diagnosticity (C011) and
    synchroneity (C010) — are the ones that fail. Independent labs found no
    boundary microspherule enrichment (Surovell), no nanodiamonds and a rejected
    lonsdaleite identification (Daulton), a blinded two-lab test with an
    unremarkable boundary and a larger peak above it plus no standard
    identification criteria (Holliday 2016), candidate markers accumulating in
    ordinary wetlands of many ages (Pigati), and the one application of
    source-discriminating Os isotopes returning volcanism (Sun; echoed at
    Page-Ladson). Only 3 of 29 claimed boundary sites had chronological control
    adequate to place the horizon at ~12.8 ka (Meltzer), and the Bayesian answer
    assigns boundaries partly by the framework under test. The two directly
    checkable consequence predictions — a continental human population crash and
    a continent-wide fire pulse — were tested against independent datasets and
    not found (Buchanan; Holliday & Meltzer; Marlon). The only proposed crater
    is 58 Myr old. The 2026 editorial record is confirmatory rather than
    decisive: two flagship 2025 papers retracted for calibration, sampling, and
    misidentification defects that mirror critiques made since 2009, and the
    2017 platinum paper's own authors withdrawing the extraterrestrial-source
    conclusion while leaving the measurements standing. Steelmanning the
    proponents: LeCompte's protocol diagnosis is concrete and testable, the
    blind test is essentially one site, Napier's fragmented- comet scenario
    legitimately removes the crater requirement, and the GISP2 anomaly is
    unexplained. None of that supplies the missing item — an anomaly that is
    extraordinary against measured background, blind-identified, independently
    dated, and source-attributed. Sensitivity: the single record whose removal
    would most change this verdict is YDIH-E009, the 2016 blind test; without it
    the microspherule dispute reverts to the Surovell/LeCompte protocol
    stalemate and C004 would rise to mixed. The case verdict survives its
    removal, because the chronology audit, the wetland background result, the
    volcanic osmium results, the Paleoindian and fire null results, the Hiawatha
    dating, and the 2026 editorial actions are independent of it. Absent an
    impact, the verdict is contradicted rather than unresolved: the hypothesis
    made distinctive, checkable predictions and they were checked."
  steelman: "The GISP2 platinum anomaly is a real, quantified, decadal-scale
    influx of Pt-rich material with an anomalously Ir-deficient composition,
    measured by a Harvard group with no stake in the hypothesis, sitting within
    decades of the Younger Dryas onset — and after fifteen years no one has
    identified its carrier phase or produced a terrestrial source that
    reproduces its composition and timing. Neither the Hall's Cave nor the
    Page-Ladson volcanic results address it. Moreover, the decisive experiment
    proponents ask for has never been run: a jointly designed, criteria-locked,
    multi-laboratory blind test with continuous background sampling at
    proponent-selected strongest sites (YDIH-R002/R003). Until that is done,
    \"peaks appear only under proponent protocols\" remains a diagnosis rather
    than a demonstration, and the platinum line remains an unexplained anomaly
    rather than a refuted one."
