    found no standardized identification criteria at all; Pigati (E015) showed
    the candidate markers accumulate in ordinary wetlands, destroying
    background-relative extraordinariness. Chronology: Meltzer's audit (E019)
    found 3 of 29 claimed sites adequately dated, and the 2026 retraction
    notices (E034, E035) document the same failure modes — calibration choices
    producing ages outside the YD, age models omitting available dates, no
    continuous sampling and hence no background — inside the hypothesis's newest
    flagship papers. Origin: the one deployment of source-discriminating osmium
    isotopes to a claimed YD PGE anomaly returned volcanism (E004), a second
    site points the same way (E029), and the proponents themselves withdrew the
    extraterrestrial-source conclusion from the platinum paper (E003).
    Consequences: the distinctive predictions were tested early and failed — no
    demographic crash (E026), technological transition rather than Clovis
    termination (E027), no continent-wide fire pulse in the independent charcoal
    synthesis (E016). The one crater candidate is 58 Ma (E024). Steelmanning the
    other side: the GISP2 platinum anomaly (E001) is a real measurement from an
    independent laboratory in a premier archive with no identified carrier; the
