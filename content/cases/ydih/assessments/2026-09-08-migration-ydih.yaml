caseAssessment:
  verdict: weakly_supported
  whatIsClaimed: Around 12,800 years ago, Earth encountered one or more fragments of an extraterrestrial object — in modern formulations, debris of a disintegrating giant comet — producing impacts and/or airbursts that deposited a synchronous layer of exotic proxies across several continents, ignited widespread fires, destabilized the ice-sheet margin, triggered the Younger Dryas cooling, contributed substantially to the North American megafaunal extinctions, and disrupted the Clovis technocomplex.
  whereDisagreementLives: "Not over whether the Younger Dryas happened, nor whether the megafauna died, nor even whether platinum is genuinely elevated in Greenland ice near the onset — all common ground. The crux is the boundary layer itself: whether the claimed proxies are what proponents say they are (spherules and nanodiamonds versus misidentified terrestrial material), whether they are extraordinary against background rather than ordinary sediment constituents sampled selectively, whether geographically scattered occurrences are actually synchronous within the dating uncertainty, and whether anything in the assemblage is diagnostic of a cosmic event rather than volcanism, wetland chemistry, or wildfire. Independent laboratories have repeatedly failed to reproduce the key peaks; proponents answer that the replicators used the wrong protocols."
  whatWouldSettleIt: "A blinded, preregistered, multi-laboratory test of the strongest surviving sites: continuous stratigraphic sampling well above and below the target horizon, split samples, pre-declared particle-identification criteria, archive-appropriate radiocarbon calibration with the event window fixed before proxy analysis, and source-discriminating geochemistry (osmium isotopes and highly-siderophile-element patterns measured in the same aliquots as the platinum) run against volcanic, meteoritic, and local reference materials. Either outcome would be decisive for the boundary layer — and without the boundary layer, the rest of the hypothesis has nothing to stand on."
  bestConventionalExplanation: "The Younger Dryas needs no comet. Its proximate mechanism — a major weakening or reorganization of the Atlantic overturning circulation — is well supported, and known deglacial processes (meltwater routing from the retreating Laurentide Ice Sheet, sea-ice and ocean feedbacks, and possibly volcanic forcing, for which new geochemical evidence appeared in 2026) can initiate it without an extraterrestrial trigger. The megafaunal extinctions are explained by some combination of climate-driven ecosystem change and human hunting pressure operating over centuries to millennia — the dated record is too coarse to require an instantaneous catastrophe. The Clovis \"collapse\" is a change in projectile-point technology, not a population crash: large radiocarbon compilations show no demographic trough. And the claimed impact proxies have terrestrial candidate explanations at every step — spherules from cosmic background flux, wildfire, and industrial or geological sources; \"nanodiamonds\" that independent microscopy could not confirm; platinum anomalies that osmium isotopes have in at least one case tied to volcanism; black mats that are ordinary wetland deposits. This account's strength is that every ingredient is independently attested; its residue is a genuine, unexplained Greenland platinum anomaly and a scatter of site-level observations awaiting a properly controlled test."
