  synthesis: "The featured hypothesis requires a multi-link causal chain: an
    isochronous, multi-continental boundary layer of proxies that are both
    extraordinary against background and diagnostic of extraterrestrial impact
    or airburst; an astronomically viable dispersed-debris delivery without a
    crater; and energetic and temporal sufficiency to force AMOC reorganization,
    continental burning, megafaunal extinction, and Clovis disruption. The
    evidence records show that several early-rung observations are real in
    isolation—the GISP2 platinum anomaly (YDIH-E001), black-mat stratigraphy
    (YDIH-E014), megafaunal last-appearance concentration within a
    multi-millennial window (YDIH-E025), and AMOC weakening as the proximate
    cooling mechanism (YDIH-E028)—yet every subsequent link fails under
    independent scrutiny. Microspherule abundance peaks fail blind and
    multi-site independent protocols (YDIH-E007, YDIH-E009) and lack
    standardized identification criteria (YDIH-C030); nanodiamond and
    lonsdaleite claims are rejected by specialist TEM re-examination
    (YDIH-E011); melt-glass temperature estimates remain unreplicated and
    non-diagnostic of heat source (YDIH-E012, YDIH-E013); sedimentary platinum
    enrichments, once corrected, no longer claim an extraterrestrial carrier
    (YDIH-E003); and the single best-attested platinum series arrives decades
    after Greenland cooling onset on the shared GICC05 scale (YDIH-E038,
    YDIH-E039). Chronological audits find secure dating at only a handful of the
    claimed boundary sites (YDIH-E019), while Bayesian synchrony models rest on
    contested date selection. Source-discriminating osmium isotopes at two
    localities favor volcanic gas over meteoritic input (YDIH-E004, YDIH-E029),
    and a pre-onset cluster of bipolar volcanic forcing already supplies a timed
    terrestrial candidate (YDIH-E041). Archaeological radiocarbon frequencies
    and lithic records show neither population crash nor technocomplex
    termination (YDIH-E026, YDIH-E027). The 2026 retractions of the two newest
    flagship papers for chronology, sampling, and misidentification defects,
    together with the formal withdrawal of the extraterrestrial-source
    conclusion from the 2017 platinum study (YDIH-E034, YDIH-E035, YDIH-E003),
    remove the most recent purported supports. Comprehensive independent reviews
    spanning physics, geochemistry, chronology, and archaeology find no
    self-consistent case (YDIH-E032). Conventional processes—meltwater or
    volcanic forcing of AMOC, climate-tracking fire regimes, human predation
    plus environmental stress on megafauna, and ordinary cultural
    succession—account for the established observations without requiring a
    cosmic catastrophe. The hypothesis therefore collapses at the diagnosticity,
    synchrony, replication, timing, and consequence links; residual anomalies
    remain interesting but do not reconstitute the chain. Sensitivity analysis
    shows the verdict is robust: even without the single strongest critical
    review the replication failures, platinum lag, isotopic discriminations, and
    editorial actions independently suffice."
  steelman: The still-unidentified carrier phase and ultimate source of the
    multi-decadal GISP2 platinum anomaly (average ~30 ppt, peak ~80 ppt), whose
    elemental ratios match neither standard meteoritic nor common volcanic
    end-members cleanly and which therefore leaves open an exotic, possibly
    cometary-dust influx whose timing, while post-dating onset, could still mark
    a related debris encounter within the broader Taurid Complex scenario.
