  - claimId: YDIH-C020
    verdict: contradicted
    reasoning: "The claim is a conjunction, and the ledger contradicts at least two
      conjuncts by direct test. Paleoindian demographic and archaeological
      records show continuity and normal technological succession at 12.9 ka
      (E026, E027), and the GISP2 platinum, the best-attested candidate impact
      signal, postdates the cooling onset by about 45 years on the same
      timescale (E038, E039). The independent North American charcoal synthesis
      shows no exceptional burning, the specified catastrophe mechanism (E016).
      The event's own evidence is non-diagnostic wherever source-discriminating
      tests were run (E004, E029) and lacks secure isochrony (E019); the
      supporting records are the founding claim and syntheses over the same
      contested primary data (E005, E031, E033), and I gave the critical reviews
      (E030, E032) little weight beyond the primary tests they summarize.
      Strongest opposing consideration: the event leg is not refuted — the
      platinum anomalies are real with unresolved sources and the melt products
      have no independent rebuttal — but the featured claim requires far more
      than an event."
