  synthesis: >-
    The featured claim is a conjunction. It asserts one or more impacts or
    airbursts near 12.8 ka that triggered the Younger Dryas, contributed
    substantially to megafaunal extinction, and disrupted Clovis. It rests on
    two mechanism pillars: that the boundary proxies are diagnostic of an
    extraterrestrial source (C011), and that they form one isochronous layer
    (C010). It also needs an attribution link to the cooling (C021), which turns
    on the platinum timing (C507). I find it contradicted, with high confidence
    for the conjunction as stated, rather than merely unproven. Several of its
    distinctive predictions were tested directly and failed. The best-attested
    surviving anomaly neither discriminates an impact from terrestrial sources
    nor arrives in the right order. No record in the packet is marked
    provisional, so all were weighed.

    Several observations are real: - an independently measured platinum anomaly
    in GISP2 (C001); - North American sediment platinum enrichments whose
    measurements nobody has challenged, though they come from one group (C002);
    - widespread black mats (C006); - a geologically concentrated extinction
    (C008); - AMOC weakening as the proximate mechanism of the cold (C013); - a
    cluster of large bipolar eruptions just before onset (C508).

    The mechanism rung fails on four counts: - Both source-discriminating
    geochemical tests in the ledger, at Hall's Cave and Page-Ladson, returned
    volcanic answers. - The authors of the 2017 platinum paper withdrew its
    extraterrestrial conclusion. - The shock-diagnostic markers failed
    identification (lonsdaleite) or were retracted (shocked quartz). - The
    particle peaks reproduce only under proponent protocols. The independent
    seven-site test and the blinded two-laboratory test found the boundary
    unremarkable (C030). Isochrony rests on 3 of 29 adequately dated sites. Its
    other support is a Bayesian model whose date selection critics call
    circular.

    At the attribution rung, the ledger's best-attested datum sets the trigger
    leg a dilemma. On the timescale that dates the cooling, the platinum arrives
    about 45 years after onset (C507). Work done without sight of the earlier
    analyses reproduced this. If the platinum is the event's fallout, the event
    came too late to start the cooling. If it is not, the event loses its one
    independently measured ice-core datum. The proponents' own sedimentary
    window (12,835–12,735 cal BP) then lies at or beyond the young edge of the
    independently dated onset (~12,870 ± 30). This second horn carries real
    cross-archive uncertainty (E021).

    The human leg failed its first tests: there is no demographic crash and no
    occupation gap (C023). The specified killing mechanism, exceptional
    continental burning, is absent from the purpose-neutral charcoal synthesis
    (C007). Extinction timing at roughly two-millennium resolution cannot
    isolate the horizon (C022). Taken alone, the event leg is better described
    as undiagnosed than refuted: something unusual may have been deposited near
    12.8 ka. The conjunction fails on its causal legs.

    Steelman for the hypothesis: - The carrier of the Greenland platinum is
    unidentified. Its ratios sit near no reference group, and no osmium isotopes
    have been measured on the ice. - The North American platinum horizon stands
    as a measurement. - The melt products have never been independently
    re-examined. - The blind test covered essentially one site. - LeCompte's
    protocol diagnosis of the 2009 null result is concrete. - No rival trigger
    is demonstrated either: the volcanic cluster is a timed forcing, not a shown
    cause.

    Steelman against the hypothesis: - On the ledger's own joint-inference chain
    (E037), no proxy clears every link. - The 2026 retractions repeat the
    chronology and sampling defects critics documented from 2009 onward. - The
    demographic prediction failed within a year of publication.

    The verdict rests on measurements and tests, not on reviews. I gave the
    syntheses on both sides (E030–E033) little independent weight and the
    advocacy site none. Priors enter at four flagged points: the precision of
    depth transfer within Greenland, the ~35-genus count, crater inventories,
    and the model-dependence of giant-comet histories.

    Three results would reopen the event and trigger legs: - a meteoritic osmium
    signature in the platinum-bearing ice or sediments (R003, R006); -
    boundary-confined peaks in a jointly designed blind test (R002); - a
    preregistered synchrony analysis placing a real layer at or before onset
    (R004). None of these would revive the human leg.

    Sensitivity: the single most consequential record is E039, Green et al.'s
    independent timing analysis. Without it, the lag rests on a one-sentence
    aside in Svensson et al. 2020 that depends on a supplementary figure. C507
    would fall to provisional, and the trigger leg would weaken toward weakly
    supported. The case verdict survives, because three other legs each
    contradict the conjunction independently: human consequences (E026, E027),
    diagnosticity (E004, E011, E015, E029), and fire (E016). It does not hang on
    one thread.
  steelman: "This assessment discounts the very-high-temperature melt products; it
    does not explain them. Bunch et al. 2012 report boundary-age meltglass from
    the Carolinas, Pennsylvania and Venezuela. Moore et al. 2020 report
    meltglass from Abu Hureyra in Syria. Both read the phases as requiring
    roughly 1,730 to above 2,200 °C. No record in the ledger shows an
    independent laboratory re-examining those specimens. None demonstrates a
    fulgurite, settlement-fire or industrial origin, or shows the specimens out
    of stratigraphic place. Every terrestrial alternative weighed here addresses
    spherules, platinum or charcoal: wetland concentration, volcanic gas,
    climate-tracking fire. None addresses melting at those temperatures, which
    on general background exceed what biomass fires reach. A proponent can
    rightly say this: if the phase identifications and in-situ boundary context
    survive blind, independent petrography of the same specimens, then
    high-energy heating at the boundary horizon on three continents is an
    observation this verdict leaves standing. That test has not been run."
