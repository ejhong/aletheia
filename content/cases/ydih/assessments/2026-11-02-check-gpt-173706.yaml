  synthesis: >-
    The featured hypothesis is a causal conjunction: a cosmic event must have
    occurred near the relevant time, left identifiable and synchronous evidence,
    and contributed substantially to the cooling, extinctions, and cultural
    disruption. Several observations invoked in that chain are real. The GISP2
    platinum anomaly is established as a measurement, platinum enrichments have
    been reported at multiple North American sites, black mats are widespread,
    terminal-Pleistocene megafaunal extinction was geologically concentrated,
    and some reported melt products have mineralogical interpretations implying
    very high temperatures. A fragmented-comet encounter is also a viable
    theoretical way to produce dispersed airbursts without one large crater. The
    strongest case for the hypothesis combines these observations rather than
    relying on any one of them and argues that imperfect dating and
    heterogeneous preservation are expected for a brief event nearly thirteen
    millennia ago.

    That steelman fails at the links required to turn anomalies into the stated
    attribution. Independent microspherule work repeatedly failed to reproduce
    the founding peaks, while the blind split-sample test found the boundary
    unremarkable and a much larger post-boundary peak. Specialist microscopy
    rejected the reported lonsdaleite identification in tested sediments.
    Wetlands concentrate purported markers through ordinary processes, and
    source-discriminating geochemistry at Hall's Cave and Page-Ladson points to
    volcanic aerosols rather than extraterrestrial material. Thus the proposed
    assemblage is not diagnostic of impact. The chronology is independently
    damaging: only a small minority of audited sites fell in the target window,
    uncertainty-weighted reanalysis weakened the published age-depth results,
    and the supporting Bayesian model established consistency within broad
    uncertainty rather than an independently assigned isochron. Some boundary
    assignments imported the climate transition being explained.

    The causal consequences fare no better. Re-dating places the best-attested
    platinum anomaly about 45 years after Greenland cooling began, so that
    anomaly cannot mark the initiating event on the presented chronology. AMOC
    weakening is well supported as the proximate cooling mechanism, but no
    evidence record connects an impact to its initiation. Independent charcoal
    synthesis finds no exceptional continent-wide onset fire pulse. Megafaunal
    last appearances resolve only a broad terminal-Pleistocene interval, not an
    impact horizon. Archaeological and radiocarbon evidence directly contradicts
    a continent-wide human collapse, instead showing continuity and
    technological succession. Hiawatha is securely dated to about 58 million
    years ago; the absence of a 12.8-ka crater does not exclude airbursts, but
    it removes the only discussed candidate. The 2026 retractions and correction
    do not prove that no event occurred, yet they remove recent support and
    reproduce the same identification, background-sampling, and chronology
    defects found earlier.

    The single record whose removal would most change this assessment is
    YDIH-E039, because it independently confirms that the strongest accepted
    anomaly arrived too late to trigger the cooling. Without YDIH-E039 the
    precise climate-timing conclusion would be less secure, although YDIH-E038
    still reports the lag and the failures of diagnosticity, synchrony,
    combustion, and archaeological consequence remain. The case verdict
    therefore survives its removal and does not hang on one record.
  steelman: The ledger does not identify the carrier or ultimate source of the
    genuine GISP2 platinum anomaly, and it contains no blinded independent
    retest of the reported in-situ melt products requiring temperatures above
    2,200 °C. A proponent can rightly demand source-discriminating isotopes from
    the same ice aliquots and criteria-locked replication of those melts before
    those specific observations are assigned terrestrial origins.
claimAssessments:
  - claimId: YDIH-C020
    verdict: contradicted
    reasoning: The stated conjunction fails across its event-identification,
      chronology, climate-trigger, and human-consequence links. The platinum
      anomaly is too late to initiate the cooling on the synchronized
      chronology, the proxy assemblage is neither reproducibly boundary-specific
      nor impact-diagnostic, and the archaeological record directly contradicts
      a continent-wide collapse. The strongest opposing consideration is that
      several anomalies are genuine and a craterless fragmented-comet scenario
      is physically conceivable, but neither fact establishes occurrence or
      causation.
    confidence: high
  - claimId: YDIH-C022
    verdict: contradicted
    reasoning: YDIH-C008 supports a concentrated terminal-Pleistocene extinction
      interval, but its roughly two-millennium resolution does not align the
      extinctions with a specific impact horizon. No evidence record supplies a
      mechanism or dated extinction response tying a substantial fraction of the
      losses to an impact, while the underlying impact attribution is itself
      contradicted by the proxy and chronology evidence. The strongest opposing
      consideration is the broad temporal coincidence between the extinction
      interval and the proposed event.
    confidence: moderate
  - claimId: YDIH-C023
    verdict: contradicted
    reasoning: The approximately 1,500-date demographic analysis found continuity
      rather than the predicted population crash, and the archaeological review
      found no continent-wide occupation gap. Clovis was a technocomplex that
      transitioned into Folsom and regional successors, not a bounded population
      shown to have been terminated. The strongest opposing consideration is
      that radiocarbon-frequency demography and regional archaeological coverage
      are imperfect, but those limitations are unlikely to conceal the claimed
      continent-wide catastrophe.
    confidence: high
  - claimId: YDIH-C021
    verdict: contradicted
    reasoning: No evidence record identifies an impact-produced freshwater or
      atmospheric perturbation that initiated AMOC disruption. The best accepted
      candidate impact proxy, Greenland platinum, occurs about 45 years after
      cooling began, and source-discriminating sediment geochemistry instead
      favors volcanic aerosols at the tested sites. The strongest opposing
      consideration is that an unrecognized impact signal could predate the
      platinum, so the evidence does not logically exclude every possible impact
      initiation.
    confidence: moderate
  - claimId: YDIH-C010
    verdict: contradicted
    reasoning: The site-by-site audit found only 3 of 29 claimed sites within the
      target window, with two of those problematic, and uncertainty-weighted
      reanalysis left only 2 of 11 modeled sites in that interval. The Bayesian
      response showed that selected ages could be consistent with synchrony
      within roughly century-scale uncertainty, but that is weaker than
      demonstrating one independently assigned isochron; Lake Cuitzeo
      illustrates circular boundary assignment. The strongest opposing
      consideration is the 354-date Bayesian model across four continents, but
      its result depends on contested date selection and horizon definition.
    confidence: high
  - claimId: YDIH-C011
    verdict: contradicted
    reasoning: The proposed assemblage does not uniquely discriminate
      extraterrestrial impact from terrestrial processes. Microspherule and
      nanodiamond identifications failed important independent tests, ordinary
      wetlands concentrate candidate markers, high temperature does not identify
      its heat source, and osmium/HSE patterns at tested sites favor volcanic
      aerosols. The strongest opposing consideration is the coexistence of
      several unusual reported proxies at multiple sites, but their disputed
      identification, background rates, dating, and independence prevent the
      combination from becoming diagnostic.
    confidence: high
  - claimId: YDIH-C012
    verdict: provisionally_supported
    reasoning: Napier supplies a coherent dynamical scenario in which debris from a
      fragmenting giant short-period comet could produce dispersed, crater-poor
      destruction, so viability as a possibility is supported. The paper
      expressly does not establish that the encounter occurred at 12.9 ka, and
      no recovered material links a boundary deposit to the Taurid Complex. The
      strongest opposing consideration is that the scenario was fitted to proxy
      claims, including lonsdaleite and nanodiamonds, that later became
      seriously disputed.
    confidence: moderate
  - claimId: YDIH-C013
    verdict: well_supported
    reasoning: The paleoceanographic review reports multiple independent proxies for
      reduced or reorganized AMOC during the Younger Dryas and connects that
      state to the observed North Atlantic cooling pattern. This supports the
      proximate climate mechanism without identifying the initiating forcing.
      The strongest opposing consideration is continuing uncertainty over the
      freshwater routing and magnitude, which limits trigger attribution but not
      the core AMOC claim.
    confidence: high
  - claimId: YDIH-C001
    verdict: established
    reasoning: High-resolution ICP-MS measurements establish a GISP2 platinum
      anomaly with the corrected approximate duration, mean, and single-sample
      peak stated in the claim. The 2026 correction preserves the measurement
      while withdrawing source-specific interpretation. The strongest opposing
      consideration is that this is one series from one core without replication
      in a second deep Greenland core, but the claim is local to GISP2.
    confidence: high
  - claimId: YDIH-C507
    verdict: well_supported
    reasoning: Svensson et al. place the platinum spike about 45 years after cooling
      began, and Green et al. independently reproduce that relative placement on
      GICC05. Both analyses use the same platinum series and chronology, so they
      are methodological replication rather than independent data. The strongest
      opposing consideration is the proponent argument that the platinum defines
      the onset, but that assumes the synchrony at issue and absolute counting
      error does not erase a within-core relative offset.
    confidence: high
  - claimId: YDIH-C508
    verdict: well_supported
    reasoning: Synchronized Greenland and Antarctic sulfate records document four
      major bipolar volcanic signals in the stated pre-onset interval, and the
      reported cumulative Northern Hemisphere forcing reconstruction exceeds the
      comparison periods from the Common Era. The evidence establishes the
      eruption cluster and the published forcing estimate, not that the cluster
      caused the Younger Dryas. The strongest opposing consideration is that
      similarly large eruptions occur elsewhere and the required climate-model
      causal test has not been performed.
    confidence: high
  - claimId: YDIH-C002
    verdict: provisionally_supported
    reasoning: Measurements from 11 sites reported boundary-layer platinum averaging
      well above sampled local backgrounds, and the 2026 correction did not
      withdraw those measurements. Confidence is limited because the sites were
      studied by one proponent-affiliated group around preidentified horizons
      without independent laboratory replication or sufficiently continuous
      background sampling. The strongest opposing consideration is that the
      author-signed correction explicitly retains compatibility with a
      continentally distributed influx of platinum-rich material.
    confidence: moderate
  - claimId: YDIH-C003
    verdict: contradicted
    reasoning: The original work reported nanodiamonds, including claimed
      lonsdaleite, at multiple boundary sites, but independent specialist TEM
      work found no nanodiamonds in the tested sediments and identified the
      purported lonsdaleite as graphene-family aggregates. The blind test
      likewise found little or none at the boundary and a much larger signal in
      a younger sample. The strongest opposing consideration is that the
      negative tests cover selected sites and preparations rather than every
      reported locality, leaving some ordinary nanodiamond reports unsettled.
    confidence: moderate
  - claimId: YDIH-C004
    verdict: contradicted
    reasoning: Large proponent studies report microspherule peaks on four
      continents, but the seven-site independent attempt reproduced none of the
      founding results and the blind test found the boundary unremarkable
      relative to a younger peak. The methodological rebuttal identifies
      plausible protocol differences, yet it recovers the phenomenon using the
      disputed protocol without criteria-locked blinding. The strongest opposing
      consideration is that those protocol differences could cause false
      negatives, so the particles' existence is less disputed than their
      extraordinary, boundary-specific peaks.
    confidence: moderate
  - claimId: YDIH-C005
    verdict: provisionally_supported
    reasoning: Proponent studies report meltglass and phases interpreted to require
      approximately 1,730 to above 2,200 °C at several near-onset sites, which
      provides positive evidence for the observation as stated. The phase
      identifications, depositional contexts, and ages lack blinded independent
      confirmation, and the Abu Hureyra paper carries a correction whose content
      was not reviewed here. The strongest opposing consideration is not a
      direct failed replication but the unexcluded possibility of fulgurites,
      anthropogenic heating, historical fire, reworking, or contamination.
    confidence: low
  - claimId: YDIH-C006
    verdict: established
    reasoning: "The broad site survey documents widespread organic-rich black mats
      overlying terminal-Pleistocene surfaces, including last in-place
