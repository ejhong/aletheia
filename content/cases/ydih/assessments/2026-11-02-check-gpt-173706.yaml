    confidence: high
  - claimId: YDIH-C007
    verdict: contradicted
    reasoning: The independent continental charcoal synthesis found gradual,
      climate-responsive change and no continent-wide fire pulse specific to the
      Younger Dryas onset. The later exceptional-burning compilation was
      challenged on selection, chronology, statistical exceptionalism, and
      reproducibility by researchers responsible for the underlying charcoal
      database. The strongest opposing consideration is the reported
      combustion-proxy compilation and its published reply, together with the
      possibility that an extremely brief pulse was smoothed in sedimentary
      records.
    confidence: high
  - claimId: YDIH-C008
    verdict: well_supported
    reasoning: Last-appearance analysis supports a geologically concentrated
      terminal-Pleistocene extinction interval for North American megafauna,
      consistent with the broad historical claim. Its resolution is roughly two
      millennia and therefore does not establish extinction at 12.8 ka or
      support any specific cause. The strongest opposing consideration is the
      Signor-Lipps effect and sparse species-level chronology, which make both
      the exact number and timing of losses less precise than the summary
      wording suggests.
    confidence: moderate
  - claimId: YDIH-C009
    verdict: established
    reasoning: No securely dated approximately 12.8-ka crater is supplied anywhere
      in the evidence record, and dual-method direct dating places Hiawatha at
      57.99 ± 0.54 million years. This decisively excludes the only discussed
      candidate crater from the Younger Dryas. The strongest opposing
      consideration is that dispersed airbursts need not leave a large crater,
      so the claim is established without independently disproving that class of
      event.
    confidence: high
  - claimId: YDIH-C030
    verdict: well_supported
    reasoning: Independent work includes a seven-site microspherule replication
      failure, specialist failure to confirm nanodiamonds and lonsdaleite, and a
      blind split-sample test that found little at the boundary. The blind study
      also explicitly reports that no standard criteria exist for
      magnetic-sphere identification. The strongest opposing consideration is
      the concrete proponent argument that protocol deviations can suppress
      recovery, but that dispute reinforces rather than removes the absence of
      agreed standardized criteria.
    confidence: high
  - claimId: YDIH-C031
    verdict: established
    reasoning: The two PLOS ONE notices establish that both named 2025 papers were
      retracted on 11 February 2026 for the specified chronology, sampling,
      attribution, and identification defects. The May 2026 Scientific Reports
      correction explicitly replaced the platinum paper's extraterrestrial
      conclusion with source-neutral language while preserving its measurements.
      The strongest opposing consideration is that authors disputed the
      retractions and that editorial actions do not demonstrate an event's
      absence, but neither point changes the historical claim.
    confidence: high
