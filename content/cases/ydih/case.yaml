id: YDIH-001
slug: ydih
title: "Fire From the Sky"
subtitle: "Did one or more cosmic impacts or airbursts ~12,800 years ago trigger the Younger Dryas cooling, drive the megafaunal extinctions, and disrupt the Clovis world?"
domain: "Quaternary geology · Impact physics · Paleoclimatology · Archaeology"
status: active
summary: >-
  Around 12,800 years ago the last deglaciation abruptly reversed: the Younger Dryas returned the North Atlantic region to near-glacial cold for over a millennium. At about the same horizon, dozens of North American megafaunal genera made their last appearances and the Clovis archaeological tradition gave way to its successors. In 2007 a large team proposed a single dramatic cause: one or more extraterrestrial impacts or airbursts. The hypothesis rests on a claimed boundary layer of exotic materials — magnetic spherules, nanodiamonds, platinum enrichments, high-temperature melt glass — reported at sites on four continents. Nineteen years of dispute have followed: independent replication failures, a rare blind test, a genuine platinum anomaly in Greenland ice whose source remains unidentified, a candidate crater dated 4,500 times too old, a 1,000-page-scale critical review answered by proponent rebuttals, and — in February 2026 — the retraction of the hypothesis's two newest flagship papers, followed in May 2026 by a formal correction that withdrew the extraterrestrial-source conclusion of its best-known platinum study. The observations at the bottom of this case are partly real. What remains unestablished is the chain that turns them into a comet.
