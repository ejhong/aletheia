# ── Mechanism rung ──────────────────────────────────────────────────────────

- id: YDIH-C010
  statement: >-
    The reported proxy peaks at sites across four continents form a single
    isochronous layer dating to approximately 12,835–12,735 cal BP.
  plainLanguage: >-
    The synchroneity claim — the load-bearing wall of the hypothesis. Many
    sites have some unusual material somewhere in their stratigraphy; the
    hypothesis needs the peaks to be the same moment everywhere. Proponents'
    Bayesian modeling says they are; critics say the dating uncertainties
    and boundary assignments make that circular.
  theme: chronology
  rung: mechanism
  tier: featured
  claimType: statistical
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "YDIH research report — event-date claim family; Kennett et al. 2015; Meltzer et al. 2014"
    extractedBy: "Fable (AI agent)"
    runId: "ydih-extract-2026-08"
    date: "2026-08-22"
  credibility: mixed
  credibilitySummary: >-
    A 2015 Bayesian analysis supports a ~100-year synchronous window, but an
    independent 2014 chronological review found only 3 of 29 claimed
    boundary sites had secure dating, and the 2026 Baffin Bay retraction
    showed the failure mode in action: recommended recalibration moved that
    site's "boundary" layer out of the Younger Dryas entirely. Radiocarbon
    uncertainty, reservoir effects, and after-the-fact boundary assignment
    can manufacture apparent synchrony.
  diagnosticity: high
  diagnosticitySummary: >-
    Decisive in both directions: a demonstrated isochron across continents
    would demand an extraordinary common cause; demonstrated asynchrony
    would dissolve the event into unrelated local deposits.
  parentClaimIds: [YDIH-C020]
  dependsOnClaimIds: []
  strongestObjection: >-
    When the event window is defined by the same investigators who assign
    which stratum counts as "the boundary" at each site, synchrony is
    partly an artifact of the assignment: the method labels every horizon
    whose uncertainty overlaps 12.8 ka as the boundary, then reports that
    the boundaries are synchronous.
  whatWouldChangeOurMind:
    - "A preregistered synchrony test with archive-appropriate calibration and boundary assignment blinded to proxy content (YDIH-R004)."

