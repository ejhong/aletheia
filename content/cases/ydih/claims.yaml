- id: YDIH-C009
  statement: >-
    No impact crater securely dated to ~12.8 ka is known anywhere on Earth;
    the Hiawatha crater beneath the Greenland ice, once discussed as a
    candidate, has been directly dated to approximately 58 million years.
  plainLanguage: >-
    The missing-crater problem. When a 31-km crater was discovered under
    Hiawatha Glacier in 2018 with an initially uncertain age, it was widely
    discussed as the possible smoking gun. In 2022, argon and
    uranium-lead dating of sand and pebbles washed out from under the ice
    returned 58 million years — off by a factor of about 4,500. Airburst
    formulations avoid needing a crater; large-impact formulations do not.
  theme: impactor
  rung: observation
  tier: featured
  claimType: existence
  importance: major
