# ── Attribution rung ────────────────────────────────────────────────────────

- id: YDIH-C020
  statement: >-
    One or more cosmic impacts or airbursts around 12,800 years ago
    triggered the Younger Dryas cooling, contributed substantially to the
    North American megafaunal extinctions, and disrupted the Clovis
    technocomplex.
  plainLanguage: >-
    The Younger Dryas Impact Hypothesis itself, as proposed by Firestone and
    colleagues in 2007 and reformulated since: a catastrophe from the sky as
    the common cause of an abrupt climate reversal, a wave of extinctions,
    and an archaeological transition. This case is strictly about this
    geophysical hypothesis — not about any "lost civilization" claims that
    borrow it.
  theme: trigger
  rung: attribution
  tier: featured
  claimType: causal
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "YDIH research report — executive summary; Firestone et al. 2007"
    extractedBy: "Fable (AI agent)"
    runId: "ydih-extract-2026-08"
    date: "2026-08-22"
  credibility: weakly_supported
  credibilitySummary: >-
    A real peer-reviewed proponent literature exists and continues to
    publish, but the hypothesis is not the prevailing explanation in any of
    the relevant fields. Independent replication of its key proxies has
    repeatedly failed, a 2023 cross-disciplinary review concluded the
    physical and stratigraphic case is not self-consistent, its two newest
    flagship papers were retracted in February 2026, and its best-known
    platinum study was corrected in May 2026 to withdraw the
    extraterrestrial-source conclusion. None of that logically excludes a
    cosmic event; it leaves the claim carrying far less weight than
    proponents assign it.
  diagnosticity: high
