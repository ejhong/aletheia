# ── Observation rung ────────────────────────────────────────────────────────

- id: YDIH-C001
  statement: >-
    A platinum anomaly spanning roughly 21 years, averaging ~30 parts per
    trillion with a single-sample peak of ~80 ppt, occurs in the GISP2
    Greenland ice core near the Younger Dryas onset.
  plainLanguage: >-
    The most solid single observation in the case: Harvard geochemists
    measuring Greenland ice found platinum climbing for about 14 years and
    falling over ~7 more, right around the transition. It is real, it is
    published in PNAS, and — after a 2026 correction to how it was being
    characterized — its source remains genuinely unidentified.
  theme: platinum
  rung: observation
  tier: featured
  claimType: measurement
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "YDIH research report — platinum section; Petaev et al. 2013; Moore et al. 2026 correction"
    extractedBy: "Fable (AI agent)"
    runId: "ydih-extract-2026-08"
    date: "2026-08-22"
  credibility: well_supported
  credibilitySummary: >-
    A careful high-resolution ICP-MS time series from a premier archive,
    not seriously disputed as a measurement. What is disputed is everything
    after the measurement: the discoverers proposed an unusual Ir-deficient
    extraterrestrial source; a contemporaneous comment proposed a
    non-cataclysmic meteorite entry; volcanic and other sources remain
    candidates; the carrier has never been identified.
  diagnosticity: low
  diagnosticitySummary: >-
    An elemental anomaly is evidential grade one of four: platinum alone is
    not an impact biomarker, and until the carrier is identified this
    observation supports a cosmic event no more than it supports volcanism
    or an ordinary meteorite ablating in the atmosphere.
  parentClaimIds: [YDIH-C011]
  dependsOnClaimIds: []
  strongestObjection: >-
    A ~21-year influx averaging 30 parts per trillion is a subtle
    geochemical event, not a catastrophe signature: its magnitude is
    compatible with unremarkable sources, and the strongest published
    interpretations have already had to be formally softened once.
  whatWouldChangeOurMind:
    - "Identification of the Pt carrier phase in the ice, with isotopic source discrimination (YDIH-R003)."

