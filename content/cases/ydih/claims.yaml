  dependsOnClaimIds: [YDIH-C010, YDIH-C011]
  strongestObjection: >-
    Every consequence the hypothesis explains has an independently attested
    conventional explanation, and its distinctive physical evidence — the
    boundary layer — has never survived a properly controlled independent
    test. A hypothesis whose event, energy, and impactor keep shrinking to
    evade each disconfirmation (from continent-scale impact to dispersed
    airbursts) risks becoming unfalsifiable while still claiming
    hemispheric effects.
  whatWouldChangeOurMind:
    - "A blinded multi-laboratory replication confirming an extraordinary, isochronous, impact-diagnostic proxy layer (YDIH-R002) — or another clean failure."
    - "Source-discriminating geochemistry tying the platinum influx to extraterrestrial material (YDIH-R003) — or to volcanism."
    - "A securely dated ~12.8 ka crater or unambiguous shock-metamorphosed material in situ."

