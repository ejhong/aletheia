article: |
  Around 12,800 years ago, as the last ice age was loosening its grip, the warming abruptly reversed. Within decades the North Atlantic region fell back into near-glacial cold and stayed there for more than a millennium — the Younger Dryas, named for an arctic wildflower that reappeared in European lake beds where forests had been advancing. Near the same horizon, [some thirty-five genera of North American megafauna — mammoths, mastodons, sabertooth cats, giant ground sloths — made their last appearances]{claim=YDIH-C008}, and the continent's first widespread archaeological tradition, the Clovis technocomplex, gave way to its successors.

  Three great endings, one horizon. In 2007, twenty-six authors led by Richard Firestone proposed in PNAS that they share a cause: [one or more extraterrestrial impacts or airbursts that seeded a boundary layer of exotic materials across the continent, lit vast fires, staggered the ice sheet, and tipped the ocean circulation into collapse]{claim=YDIH-C020}. The idea is dramatic, testable in principle, and has now been fought over for nineteen years — through replication failures, a blind test, formal reviews and counter-reviews, and, in 2026, the retraction of its two newest flagship papers. This case maps that fight. One boundary of the map is drawn firmly at the start: this is the geophysical impact hypothesis only. Claims about lost civilizations that sometimes borrow it are a different subject, held to their own evidence, and not at issue here.

  ## What is actually on the table

  It matters to be precise about what everyone already agrees on. The Younger Dryas happened, abruptly; [its proximate mechanism — a major weakening of the Atlantic overturning circulation, the ocean's heat conveyor — is well supported]{claim=YDIH-C013}. The megafauna died. Clovis points stop being made. None of that is in dispute, and none of it, by itself, needs a comet: meltwater from the retreating ice sheet, sea-ice feedbacks, and other deglacial machinery can falter the circulation unassisted. The hypothesis's distinctive claim is about the trigger — and its distinctive evidence is a physical layer said to lie in the ground at the boundary: magnetic microspherules, nanodiamonds, platinum, melt glass. Everything turns on whether that layer is what proponents say it is.

  ## The layer, examined

  Take the proxies one at a time, observation first, interpretation second.

  {plate:IMG-YDIH-P01}

  The platinum is the strongest thread. In 2013, Harvard geochemists — no connection to the impact camp — found [a genuine platinum anomaly in Greenland ice near the onset: about twenty-one years long, averaging thirty parts per trillion]{claim=YDIH-C001}. In 2017, a proponent team reported [platinum enrichments at eleven North American sites, averaging roughly twelve times background]{claim=YDIH-C002}. Real measurements, both. But an elemental anomaly is the first rung of a four-rung ladder — detected, then non-local, then extraterrestrial, then tied to an event — and the platinum has never climbed past the first rung. Where osmium isotopes and the full pattern of platinum-group elements have been measured together — at Hall's Cave in Texas, and in 2026 at Page-Ladson in Florida — the pattern matched volcanic aerosol, not meteorites. And in May 2026 the 2017 paper's own authors issued a formal correction, withdrawing the claim that an extraterrestrial impact was the most plausible source: the enrichments stand; [their source is officially unresolved]{claim=YDIH-C011}.

  The Greenland spike has since been dated more exactly than its discoverers could date it. Read on the same ice-core timescale as the cooling itself, [it begins about forty-five years after Greenland started to cool]{claim=YDIH-C507}. Ice-core chronologists noted the lag in 2020, and later analyses have confirmed it, the latest, in 2025, made without sight of the others. All of them re-date the same measurements from the same core, and no second core has been measured. But if the lag holds, whatever delivered the platinum arrived decades into the cold and cannot be what started it. The proponents' published answer is that the platinum defines the onset, and that the ice timescale carries a counting error of up to 140 years. The first assumes the coincidence in question; the second shifts the onset and the spike together, since both are read from the same ice, and so leaves the gap between them where it was. The 2025 team went further, arguing that the spike's chemistry sits closest to volcanic gases and that its fourteen-year spread fits a long Icelandic fissure eruption better than a single blast. That argument is weaker than the dating, and its authors concede they cannot rule out an unusual meteorite. What their measurements did settle is narrower: the obvious volcanic suspect, Germany's Laacher See eruption, left pumice almost empty of platinum.

  The signature proxies fare worse. [Nanodiamond-rich layers were reported in Science in 2009]{claim=YDIH-C003}, including the hexagonal form whose shock pedigree would matter — but independent electron microscopists re-examined such material and found no diamonds at all, concluding the "lonsdaleite" was misidentified stacks of graphene-like sheets. [The microspherule peaks]{claim=YDIH-C004} have been fought over longest. An independent seven-site study in 2009 could not reproduce any of the original results; proponents answered that the replicators' protocol lost the spherules. Then came the only blind test in this literature. Its design was agreed at the site in 2007 with two of the original paper's authors: identical sample splits, two laboratories, no one told where the boundary lay. It found little or nothing at the boundary, and a sample from younger sediment holding the claimed proxies at a hundred to ten thousand times the abundance of the rest. [Melt glass said to record temperatures above 2,200 °C]{claim=YDIH-C005} awaits any blinded confirmation and carries its own corrections. And the famous [black mats — dark bands that really do drape the last mammoths and Clovis floors at site after site]{claim=YDIH-C006} — are, by the account of the geoarchaeologist who documented them, wetland deposits: risen water tables and algae as the climate turned, expected under every hypothesis on the table, fallout under none.

  The pattern across the whole assemblage is the case's central fact: [independent laboratories running their own protocols repeatedly fail to find the peaks, and no standardized identification criteria exist for the key markers]{claim=YDIH-C030}. Proponents have a genuine methodological answer — the replications deviated from the original protocol in ways that could lose real spherules — but after nineteen years the situation remains that the layer reliably appears under proponent methods and reliably fails to appear under anyone else's. That is not what an established stratigraphic datum looks like. It is what a methods dispute looks like, and only one kind of experiment ends a methods dispute: both camps agreeing on criteria before anyone looks. It has been run once, at one site, and the boundary lost.

  ## When is "the same time" the same time?

  The hypothesis needs more than materials; it needs simultaneity. A layer deposited in one afternoon across four continents would be extraordinary evidence of an extraordinary cause — which is why [the synchroneity claim]{claim=YDIH-C010} is the load-bearing wall of the whole structure. The dispute here is quietly statistical. Radiocarbon dates come with uncertainties of centuries; sediment samples integrate decades; and if investigators label whichever stratum overlaps 12.8 ka as "the boundary," the boundaries will agree with each other by construction. A 2014 audit of the twenty-nine sites then offered found only three inside the proponents' own window for the onset, two of them problematic. At several, the dates on the layer itself were older or younger. Re-running the proponents' own age–depth regressions with each date's uncertainty taken into account left two of eleven sites in the window. The proponents' 2015 Bayesian model answered that 354 dates from 23 sections are consistent with deposition within about a century. Consistent-with is not demonstrated, and the paper shows why. At one Mexican lake its alternative age models put the layer at about 15,300 or 27,100 years; it set both aside because they did not fit the regional climate record, which assumes the synchrony being tested. The proponents now state their standard plainly: dates need only be not inconsistent with one moment. Their critics ask that the dates demonstrate it. Meanwhile the onset itself is now dated to about 12,870 ± 30 years before present — a target the proxy chronologies must actually hit, not merely approach.

  ## The impactor no one can produce

  What, physically, hit us? The 2007 paper imagined something large and low-density exploding over the ice sheet. No crater turned up. When a 31-kilometer crater was discovered beneath Greenland's Hiawatha Glacier in 2018 with its age initially open, it was widely discussed as the smoking gun — until direct dating in 2022 returned [fifty-eight million years, missing the Younger Dryas by a factor of four and a half thousand]{claim=YDIH-C009}.

  {plate:IMG-YDIH-P02} The modern proponent position, following the astronomer William Napier, no longer needs the crater: [Earth is proposed to have crossed the debris stream of a disintegrating giant comet — the Taurid Complex's parent — producing many dispersed airbursts]{claim=YDIH-C012}. This is a real dynamical scenario from the peer-reviewed astronomical literature, and its author is careful about what it shows: the paper argues such an encounter was reasonably probable, and says in so many words that whether it happened is a matter for Earth scientists. It is also a retreat with epistemic consequences: each reformulation has reduced the physical evidence the event should have left while retaining the hemispheric consequences claimed for it. A hypothesis that adjusts its impactor downward at every disconfirmation, without surrendering any of its effects, is drifting toward unfalsifiability — the airburst does for this theory what the untestable mechanism does for others.

  ## The consequences, audited

  The impact is supposed to have done three things. The cooling: [an impact-initiated trigger for the circulation collapse]{claim=YDIH-C021} is physically conceivable but evidentially idle — known deglacial processes suffice, and no securely established impact marker sits at the moment the cooling began. What the ice does hold at that moment is [a cluster of four large eruptions in the century before the onset, recorded in both Greenland and Antarctica, whose combined forcing, reconstructed from their sulphate, exceeds the most volcanic stretches of the last two thousand years]{claim=YDIH-C508}. The 2026 Florida study points the same way, though it comes from the same laboratory group as the Texas work, and its volcanic layers recur at other depths, the strongest of them just below the boundary. Volcanism is thus a rival trigger with a correctly timed eruption record and an estimated forcing behind it — though no one has yet shown it could tip the climate, and eruptions of that size recur through the glacial record. The extinctions: [the impact's contribution]{claim=YDIH-C022} founders on resolution — the best chronology can confine the die-off only to a two-thousand-year window that also contains human expansion and violent climate swings. The people: here the hypothesis made its most checkable prediction, a continent-wide demographic catastrophe, and [the archaeological record answers no]{claim=YDIH-C023}: roughly fifteen hundred radiocarbon dates show no population trough, and the specialists' review found technological transition — Clovis points giving way to Folsom points — not termination. "Clovis" names a way of making tools, not a nation that could fall.

  {plate:IMG-YDIH-P03}

  And there is the fire. Proponent compilations report [an extraordinary burning episode at the onset — nearly a tenth of the biosphere, by their estimate]{claim=YDIH-C007}; the fire-history community's own continental charcoal synthesis, assembled for unrelated purposes, sees regional fire tracking climate and no continent-wide pulse at all. When the custodians of the database dispute the use made of their data, the honest label is: contested, with the independent baseline against it.

  ## 2026: the record corrects itself

  Then came the year the editorial record moved. In August and September 2025, PLOS ONE published the hypothesis's two most ambitious papers in years — cometary dust in Baffin Bay sediment cores, and shocked quartz offered as the long-missing impact-physics evidence. On 11 February 2026, [both were retracted]{claim=YDIH-C031}. The notices are worth reading in their own words, because they read like a syllabus of this case's methodological themes: radiocarbon calibration inappropriate to the site — which, done correctly, moves the "boundary layer" out of the Younger Dryas entirely; claimed cosmic spherule fragments that consulted experts identified as marine foraminifera; unsampled core sections that make it impossible to say whether the claimed spikes exceed background; citations that do not support their statements, raising concerns about undisclosed AI use in referencing. Three months later came the platinum correction described above. Two things must be said with equal firmness. The notices document error, misidentification, and methodological failure — they make no finding of fabrication, and several authors formally disagreed with both retractions. And retractions are evidence about papers, not about the Pleistocene: they subtract claimed confirmations; they do not prove a negative. Both halves of that sentence are load-bearing, because retractions in this literature cut both ways — against the newest proponent evidence, and against any skeptic tempted to treat editorial actions as if they were data.

  The proponent organization itself, the Comet Research Group, currently tells the public the evidence is "undeniable" and that civilization was nearly erased. The peer-reviewed literature — including the proponents' own, twice retracted and once corrected this year — says no such thing. That gap between the fundraising voice and the published voice is itself a datum this case records.

  ## Where this leaves the hypothesis

  A 2023 thirteen-author review concluded the hypothesis fails across every domain it touches — physics, geochemistry, chronology, ecology, archaeology; proponents published a detailed rejection of the refutation in 2024; the reviewers rebutted. The exchange is formally open, and "debated in the literature" is true. It should not be mistaken for "evenly divided": no independent, blinded, criteria-locked test has ever confirmed the boundary layer, and every discriminating measurement so far has returned terrestrial or unresolved. But the residue is real too. The Greenland platinum anomaly exists and its carrier has never been identified — though it now dates to decades after the onset rather than to the onset itself. The genuinely decisive experiments — a jointly designed blind test of the strongest sites, osmium isotopes on the same aliquots as the platinum, platinum measured in a second Greenland core, whole-section osmium profiles from a laboratory outside both camps, a synchrony test with the circularity removed — are specified in the research agenda below, are not expensive, and have never been run in full. Anomalies can be real while their favored explanation is not established; failed evidence can weaken a hypothesis without proving no event occurred; and an unresolved trigger does not make every candidate trigger equally likely.

  The mammoths are just as extinct either way. What is still falling, nineteen years on, is the question of what — if anything — fell.
