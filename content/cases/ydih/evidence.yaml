# Evidence records: the specific observation/result extracted from a source
# and connected to claims. Direction is explicit and relative to the listed
# claims; sourceStatement (what the source says) is kept strictly separate
# from editorInference (what we infer). Supporting and undermining records
# carry the same structure and seriousness.

# ── Platinum ─────────────────────────────────────────────────────────────────

- id: YDIH-E001
  title: "The GISP2 Greenland platinum anomaly"
  claimIds: [YDIH-C001]
  sourceId: SRC-PETAEV-2013
  direction: supports
  strength: strong
  sourceStatement: >-
    High-resolution (2.5–4.6 year) ICP-MS time series of GISP2 ice identified
    a platinum anomaly near the Younger Dryas onset — per the 2026 corrected
    characterization: spanning ~21 years, average ~30 ppt, single-sample peak
    ~80 ppt — with rising Pt over ~14 years and a fall over ~7, which the
    authors interpreted as consistent with atmospheric deposition of Pt-rich
    dust from an unusual, Ir-deficient, possibly extraterrestrial source
    whose identity could not be established with certainty.
  editorInference: >-
    The best-attested single observation in the case: an independent
    (non-CRG) laboratory, a premier archive, a real geochemical event. It is
    evidential grade one of four — an elemental anomaly with no identified
    carrier — and everything beyond that grade is interpretation.
  exactLocator: "PNAS 110(32): 12917–12920"
  limitations:
    - "The anomaly's source and carrier remain unidentified; a contemporaneous PNAS comment (Boslough 2013) proposed a non-cataclysmic meteorite entry as sufficient."
