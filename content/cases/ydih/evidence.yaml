- id: YDIH-E004
  title: "Hall's Cave: osmium isotopes point to volcanism, not a cosmic source"
  claimIds: [YDIH-C011]
  sourceId: SRC-SUN-2020
  direction: undermines
  strength: strong
  sourceStatement: >-
    Measuring highly siderophile elements and osmium isotopes in a dated
    sediment section at Hall's Cave, Texas, the authors report that "layers
    below, above, and in the YD have" osmium-isotope ratios "consistent with
    incorporation of extraterrestrial or mantle-derived material," that
    "The HSE abundances indicate that these layers contain volcanic gas
    aerosols and not extraterrestrial materials," and that "The most likely
    explanation is that episodic, distant volcanic emissions were deposited
    in Hall's Cave sediments."
  editorInference: >-
    Where source-discriminating geochemistry was first applied to a claimed
    Younger Dryas platinum-group anomaly, it returned a terrestrial answer:
    the osmium isotopes alone could not tell a meteorite from the mantle,
    and the element pattern decided it. That shows "platinum or osmium peak
    = impact" is not a valid inference rule, which is the diagnosticity
    claim's core problem. The same abstract says the signature recurs in
    layers below and above the Younger Dryas, so it is not unique to the
    boundary either.
  exactLocator: "Abstract (Science Advances 6(31): eaax8587; PMC7399481, as held by Europe PMC)"
  limitations:
    - "One site; it does not resolve the origin of the Greenland anomaly or of other localities."
    - "The 2026 Page-Ladson study (YDIH-E029) is by an overlapping author group using the same procedures; the two are one line of work, not two independent confirmations."
  reviewState: ai_extracted
  origin:
