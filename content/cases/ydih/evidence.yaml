- id: YDIH-E009
  title: "The 2016 blind test: little at the boundary, more above it"
  claimIds: [YDIH-C004]
  sourceId: SRC-HOLLIDAY-2016
  direction: undermines
  strength: strong
  sourceStatement: >-
    "Two different labs analyzed identical splits of samples collected at,
    above, and below the ~12.8ka zone at the Lubbock Lake archaeological
    site (LL) in northwest Texas." The design was agreed with two of the
    original paper's authors at the site in 2007: "All agreed that blind
    splits of samples would be collected and one set sent to JK, and the
    other to T. Surovell" (the acknowledgments record that "James Kennett
    carried out some of the lab analyses"). In the split the paper reports, "the
    levels of magnetic microspherules and nanodiamonds are low or
    nonexistent at, below, and above the YDB with the notable exception of
    a sample <11,500 cal years old. In that sample the claimed impact
    proxies were recovered at abundances two to four orders of magnitude
    above that from the other samples." The authors conclude that "no
    standard criteria exist for identification of magnetic spheres" and
    that "the purported impact proxies are not unique to the YDB."
  editorInference: >-
    The single best-designed test in the literature, and the pattern it
    found — boundary unremarkable, bigger peak elsewhere — is what
    background-plus-selective-emphasis looks like. One principal site
    limits its geographic reach; nothing limits its methodological lesson.
  exactLocator: "Abstract; Methods (first paragraph); Acknowledgments (PLOS ONE 11(7): e0155470)"
  limitations:
    - "One site (Lubbock Lake); proponents (Firestone; LeCompte et al.) criticise its sampling intervals, which the paper answers in its Discussion."
    - "The microspherule count in one laboratory's split is, by the abstract's own words, reported elsewhere; this paper reports the other split's spherule and nanodiamond counts."
    - "The paper's conclusions also say one laboratory's data show significantly elevated levels of purported proxies in the post-boundary sample; the test cuts against the boundary's uniqueness, not against the existence of the particles."
  reviewState: ai_extracted
  origin:
    ref: "Holliday et al. 2016, abstract read through scripts/site.ts read (journals.plos.org), 2026-11-02; record first extracted 2026-08-22 from the YDIH research report"
