# ── Chronology ──────────────────────────────────────────────────────────────

- id: YDIH-E019
  title: "Meltzer et al. 2014: 3 of 29 claimed boundary sites fall in the onset window"
  claimIds: [YDIH-C010]
  sourceId: SRC-MELTZER-2014
  direction: undermines
  strength: strong
  sourceStatement: >-
    Examining "the age basis of the supposed Younger Dryas boundary layer at
    the 29 sites and regions in North and South America, Europe, and the
    Middle East in which proponents report its occurrence," the authors
    find that "Several of the sites lack any age control, others have
    radiometric ages that are chronologically irrelevant, nearly a dozen
    have ages inferred by statistically and chronologically flawed
    age–depth interpolations, and in several the ages directly on the
    supposed impact layer are older or younger than ∼12,800 calendar years
    ago. Only 3 of the 29 sites fall within the temporal window of the YD
    onset as defined by YDIH proponents." In their Discussion they add
    that "two of these are problematic," and that at many sites "only
    sediments immediately adjacent to the supposed YDB layer were examined
    for impact indicators."
