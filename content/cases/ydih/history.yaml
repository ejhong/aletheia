- date: 2026-10-20
  change: New edition edition-2026-10-20-130005, adopting a new draft assessment 2026-10-20-operator-130005 (its standing waits for the blind panel).
  reason: The case had not been worked since it was built in August, and its account of the Greenland platinum — told as "the strongest thread" and the residue that keeps the hypothesis alive — omitted the platinum's timing. Four analyses of the same ice-core series on the timescale used for the cooling (Svensson et al. 2020; Abbott et al. 2021 and Holliday et al. 2023, as reported by the fourth; Green et al. 2025, done independently) place the spike about forty-five years after the cooling began, so it cannot be the trigger's fallout. The same ice records a cluster of four large eruptions in the century before the onset (Abbott et al. 2021). This edition adds both, with their limits (one core; forcing is not causation), and the 2025 study's weaker volcanic-source argument; features the two new claims; and adds the second-core platinum test to the research agenda. The rest of the article is unchanged.
