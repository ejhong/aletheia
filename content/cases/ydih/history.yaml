# Change history for the YDIH case.

- date: "2026-08-22"
  change: >-
    Commissioned research report ("Younger Dryas Impact Hypothesis:
    Evidence, Retractions, and Current Scientific Assessment") added to the
    project library: an AI deep-research survey of the proponent and
    critical literatures, the February 2026 PLOS ONE retractions, the May
    2026 platinum correction, the Hiawatha dating, and the methodological
    disputes, with a recommended claims decomposition.
  reason: >-
    Establish the case's primary input before extraction, covering both
    sides of a two-decade dispute in one auditable document.
  actor: "AI deep-research agent, commissioned by Eugene"
  aiAssisted: true

- date: "2026-08-22"
  change: >-
    Case built for Aletheia: 19 featured claims, 6 catalog claims, 37
    evidence records, 41 sources, 5 research opportunities extracted from
    the research report. Citation verification batch run the same day: all
    34 DOIs checked against the Crossref API were found real and correctly
    characterized; the two PLOS ONE retraction notices (e0342613, e0342620,
    both 2026-02-11) and the Scientific Reports platinum correction
    (s41598-026-48937-x, 2026-05-06) were additionally fetched and read in
    full from the journals; the Comet Research Group site was fetched and
    its advocacy language quoted directly. Verification surfaced two
    editorial actions beyond the report: a 2024 correction to Kennett et
    al. 2015 and a November 2025 correction to the Abu Hureyra paper (both
    recorded as unreviewed). Supporting and undermining evidence carried
    with the same structure; the retractions recorded from the notices'
    own text, including author dissent and the absence of any fabrication
    finding. All claims labeled ai_extracted pending human review; first AI
    assessment overlay generated and labeled as an unreviewed draft.
  reason: >-
    Launch case #3 on real, provenance-labeled content: the YDIH is the
    slate's richest test of the platform's core commitments — observation
    kept separate from interpretation, credibility from diagnosticity, and
    retractions recorded honestly in both directions.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-22"
  change: >-
    Embedded the two existing plates (Murray Springs black mat;
    Hiawatha crater map) in the overview article, and added a third:
    a Clovis spear point in the British Museum (CC BY-SA 4.0, Mike Peel).
  reason: >-
    The case already held licensed plates that never appeared in the
    article; a Clovis point makes the archaeological tradition concrete
    without implying an impact.
  actor: "Grok (AI agent), directed by Eugene"
  aiAssisted: true

- date: "2026-08-23"
  change: >-
    Site v1.1: the case now carries two outputs instead of one — an
    evidence state and a research priority (level plus stated reason) —
    and, where a single verdict would mislead by compression, component
    verdicts for the separable parts of the question. Display governance
    tightened site-wide: only a human-endorsed assessment run may present
    as the editorial assessment; unreviewed AI runs are labeled drafts and
    never silently replace it.
  reason: >-
    "Weak evidence, strong reason to investigate" is this site's signature
    category; a single verdict cannot express it. Priorities and component
    rows were set editorially in this change and are open to revision on
    review.
  actor: "Eugene (direction); applied by Fable (AI agent)"
  aiAssisted: true

- date: "2026-08-23"
  change: >-
    Cross-model check run (scripts/cross-model-check.mjs, promptVersion
    aletheia-check-v1): four independent judges — Opus 5 (Anthropic),
    GPT-5.1 (OpenAI), Gemini 3.1 Pro (Google), Grok 4.6 (xAI) — each
    re-assessed the case blind to all prior assessments. Result: unanimous case verdict (weakly_supported) matching the displayed draft; claim agreement 13/19 exact, 5 within one step, 1 split (YDIH-C012, the Taurid-complex progenitor mechanism).
    Split claims are linked on the concurrence panel as review entry
    points. Check runs never display as the case narrative.
  reason: >-
    A verdict corroborated (or contested) blind by four independent
    vendors is information about the evidence file itself; both outcomes
    belong on the public page.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true
