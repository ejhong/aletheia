# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license, presented as numbered
#            museum plates. Duotone treatment is applied in CSS at display
#            time; the original files are unmodified apart from resizing.

- id: IMG-YDIH-COVER
  role: cover
  file: /images/cases/ydih/cover.jpg
  alt: >-
    Hand-tinted engraving of a sage-green plain holding a tusked animal
    skull, a stone mortar, and an upright fluted point, while a faded
    vermilion comet streaks down a buff sky above distant hills.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v2
  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-22"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph,
    chromolithograph plate from a vintage natural-history atlas. An
    allegorical emblem for a case titled "Fire From the Sky?" in the domain
    of Quaternary geology · Impact physics · Paleoclimatology · Archaeology:
    a symbolic, typological composition suggesting the question — Did one or
    more cosmic impacts or airbursts ~12,800 years ago trigger the Younger
    Dryas cooling, drive the megafaunal extinctions, and disrupt the Clovis
    world? — without depicting any real site, artifact, or dataset as
    documentation. Fine copperplate cross-hatching and stipple engraving
    beneath soft, translucent hand-applied watercolor washes. Full color in
    subdued antique mineral pigments — sage and olive-green grassland, buff
    sky, one faded vermilion comet streak — over warm-black ink linework on
    aged warm cream paper (#f6f1e8). Colors muted and slightly faded as if
    printed in 1870; never saturated modern digital color, no gradients, no
    glow. Darwin-era natural-history journal plate aesthetic, generous plain
    paper margins, quiet composition. Absolutely no text, no labels, no
    captions, no border frame lines. Unmistakably a hand-tinted engraving —
    stylized editorial artwork, not photorealistic, no photograph.

- id: IMG-YDIH-P01
  role: plate
  file: /images/cases/ydih/plates/murray-springs-clovis-site-clanton-clay-black-mat-1.jpg
  alt: >-
    Eroded arroyo bank at the Murray Springs Clovis site, Arizona, seen
    through leafless brush: a pale upper sediment unit overlying a visibly
    darker band exposed partway down the cut.
  source: commons
  license: "CC0"
  licenseUrl: "http://creativecommons.org/publicdomain/zero/1.0/deed.en"
  credit: "Ammodramus, via Wikimedia Commons"
  plateNumber: 1
  depicts: >-
    An exposure at the Murray Springs Clovis site in southeastern Arizona,
    one of the type localities where a dark organic-rich "black mat" horizon
    drapes the terminal-Pleistocene surface (YDIH-C006). The photograph
    documents the field setting of the stratigraphy; whether the mat marks
    an impact event or ordinary wet-ground conditions is exactly what the
    case contests.
  provenance:
    photographer: "Ammodramus"
    date: "2016-03-12"
    sourceUrl: "https://commons.wikimedia.org/wiki/File:Murray_Springs_Clovis_site,_Clanton_clay_black_mat_1.JPG"
    originalTitle: "File:Murray Springs Clovis site, Clanton clay black mat 1.JPG"
  claimIds: [YDIH-C006]

- id: IMG-YDIH-P02
