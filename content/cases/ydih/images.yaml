  depicts: >-
    Figure 1 of Kenny et al. (2022): the location and subglacial topography
    of the Hiawatha impact structure in northwest Greenland, with the sample
    sites whose zircon and apatite dates placed the impact at ~58 million
    years ago — removing the structure as a candidate Younger Dryas crater
    (YDIH-C009).
  provenance:
    photographer: "Gavin G. Kenny et al. (CC BY figure from Science Advances)"
