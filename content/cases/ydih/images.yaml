  file: /images/cases/ydih/plates/sciadv-abm2434-f1.jpg
  alt: >-
    Two-panel scientific map: a regional map of northwest Greenland locating
    Hiawatha Glacier, and a color elevation model of the ice-buried circular
    depression with three glaciofluvial sample sites marked by stars.
  source: commons
  license: "CC BY 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by/4.0"
