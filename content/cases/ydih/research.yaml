# Research agenda: adapted from the research report's recommendations. The
# program funds tests in either direction; each item names the claims it
# would move and what an outcome in each direction would mean.

- id: YDIH-R001
  title: "The auditable evidence matrix: every site, every proxy, every date"
  summary: >-
    Reconstruct every site claimed in the major pro-YDIH syntheses into one
    auditable matrix at the site × proxy × chronology level: the actual
    dating uncertainty and stratigraphic thickness around each proxy
    horizon; whether the same specimens, laboratories, or authors appear
    across multiple publications (so replication independence can be
    measured rather than asserted); raw peak-to-background effect sizes
    recomputed from original data where available, replacing the word
    "anomaly" with numbers; and each finding paired with its strongest
    published replication or critique. Correction and retraction status
    tracked dynamically — the 2026 editorial actions demonstrate why
    publication status must be refreshed rather than stored at ingestion.
  claimIds: [YDIH-C004, YDIH-C010, YDIH-C030, YDIH-C031]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Converts a two-decade literature war into an inspectable dataset,
    exposes how much claimed replication is internal to one authorship
    network, and identifies the strongest surviving sites that the decisive
    experiments below should target.

- id: YDIH-R002
  title: "The definitive blind test: multi-laboratory, criteria-locked, jointly designed"
  summary: >-
    The 2016 blind test's design, scaled to decisiveness and armored
    against the objections both sides raised: proponent and critic
    laboratories jointly select the strongest surviving sites and agree on
    sampling and particle-identification criteria in advance; continuous
    stratigraphic sampling well above and below the target horizon; splits
    distributed blinded to the boundary position and to each other's
    results; pre-registered analysis including background rates and
    multiple-comparison handling. Preregistered prediction (proponent):
    extraordinary microspherule/nanodiamond peaks confined to the boundary
    at the agreed sites. Falsification: boundary statistically unremarkable
    against background, or peaks of equal magnitude at non-boundary depths.
  claimIds: [YDIH-C003, YDIH-C004, YDIH-C030]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Ends the protocol war by construction — both camps sign the methods
    before anyone sees results. Either outcome is decisive for the
    boundary-layer observation claims, and with them most of the ladder.

- id: YDIH-R003
  title: "What carried the platinum? Source-discriminating geochemistry on the same aliquots"
  summary: >-
    Move the platinum debate from "is Pt elevated?" to "what carried it?":
    retest well-dated Younger Dryas boundary material for Pt/Ir/Pd/Rh
    abundances plus 187Os/188Os and complementary isotopic source tracers
    measured in the same aliquots, alongside volcanic, meteoritic, and
    local-crustal reference materials — the Hall's Cave design applied to
    the strongest remaining localities, ideally including ice-core archives
    where the Greenland anomaly's carrier phase could be directly sought.
  claimIds: [YDIH-C001, YDIH-C002, YDIH-C011]
  track: small_grant
  effortTier: lab
  informationGain: >-
    Directly discriminates the three live readings of the case's most
    solid observation — meteoritic, volcanic, unresolved — and would
    upgrade or retire the platinum line in one campaign. The 2026
    correction makes this the proponents' own open question.

- id: YDIH-R004
  title: "Preregistered synchrony: date the layer without assuming the event"
  summary: >-
    A chronology project that fixes the rules before seeing the proxies:
    pre-register what age interval counts as the hypothesized event; use
    archive-appropriate radiocarbon calibration and reservoir corrections
    (the Baffin Bay retraction shows the stakes); propagate layer-thickness
    and sedimentation-rate uncertainty through formal age-depth models;
    assign each site's boundary blind to its proxy content; and test
    synchrony probabilistically across sites rather than labeling every
    horizon whose uncertainty overlaps 12.8 ka as "the boundary."
  claimIds: [YDIH-C010]
  track: either
  effortTier: desk
  informationGain: >-
    Tests the hypothesis's load-bearing wall — the isochron — with the
    circularity removed. A surviving synchronous window would be the
    strongest result the hypothesis has ever had; a dissolving one ends
    the single-event formulation.

- id: YDIH-R005
  title: "Independence mapping: who replicated whom?"
  summary: >-
    Map the authorship, funding, laboratory, and specimen-sharing networks
    across the full YDIH literature, coding each claimed replication as
    internal, partially independent, or fully independent — the taxonomy
    the research report proposes and the two 2025 papers' disclosed Comet
    Research Group relationships make feasible. Publish the network with
    the evidence matrix (YDIH-R001) so that "confirmed at N sites" claims
    carry their independence structure on their face.
  claimIds: [YDIH-C030, YDIH-C020]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Cheap, decisive scholarship for a case whose central dispute is whether
    anything has ever been independently confirmed: it would let readers —
    and reviewers — distinguish forty papers from one team writing forty
    papers.
