      physicalist interpretations already accept. Jones & Müller’s classical
      analysis of Wigner’s-friend-type structures (ZW-E004) further shows that
      some “observer puzzles” are not even specifically quantum, reinforcing the
      non-discriminating character of current data. The strongest objection is
      that taxing the absoluteness of observed events arguably presses harder on
      naive physicalism than on observer-relative frameworks, but that is a
      difference in theoretical comfort, not in experimental discrimination.
  - claimId: ZW-C004
    verdict: well_supported
    confidence: high
    reasoning: Müller’s 2020 Quantum paper (ZW-E001) explicitly postulates
      self-states and a universal-induction state-change rule, and proves that
      almost all continuations under this prior look like an apparently
      objective external world governed by simple computable probabilistic laws,
      while quantitatively disfavoring Boltzmann-brain type histories. The main
      caveat, acknowledged by Müller himself in later exposition (ZW-E003), is
      that these theorems are derived in an idealized bit-string model with
      monotone information and uncomputable induction, so they may not yet apply
      to realistic observers who forget or compress, but that qualifies scope
      rather than the correctness of the stated results.
  - claimId: ZW-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: The consistency claim follows almost tautologically from the fact
      that universal induction converges to any computable regularity, including
      those generated by quantum theory, and Müller’s exposition explicitly
      presents this asymptotic consistency (ZW-E001, ZW-E003). He also
      describes, and labels as preliminary, a theorem that Bell inequality
      violations with no-signalling “can sometimes be expected” under additional
      assumptions (ZW-E003). The strongest opposing consideration is that such
      generic consistency is non-selective—it would equally accommodate
      classical or superquantum no-signalling worlds—and that a “sometimes”
      Bell-violation result under heavy assumptions falls well short of a robust
      prediction of specifically quantum nonlocality, which justifies the
      cautious provisional verdict.
  - claimId: ZW-C006
    verdict: provisionally_supported
