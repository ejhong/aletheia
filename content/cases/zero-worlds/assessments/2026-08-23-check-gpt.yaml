  synthesis: >-
    The dossier documents a sharp distinction between what is mathematically
    established and what remains promissory. On the established side, the
    reconstruction theorems (ZW-C001, backed by ZW-E006–E008) rigorously show
    that finite-dimensional complex quantum theory follows from operational
    axioms about information, without postulating Hilbert space. This gives a
    rock-solid “stage two”: once one has a convex operational state space with
    principles like purification and continuous reversible transformations, one
    gets the quantum formalism as a theorem. These results are uncontroversial
    and ontologically neutral; they define a precise target any observer-first
    program must hit.

    Müller’s algorithmic idealism contributes a comparably clear but more
    limited “stage zero/one”: from postulated self-states and an uncomputable
    universal-induction rule, his 2020 paper (ZW-E001) proves that almost all
    continuations of an observer’s data look like membership in a stable world
    governed by simple computable probabilistic laws (ZW-C004). It also proves a
    heavily qualified result that Bell inequality violations with no-signalling
    “can sometimes be expected” (ZW-C005, ZW-E003). These are genuine theorems,
    and they decisively show that an observer-first, zero-worlds ontology can
    output “some” lawful external world instead of merely assuming it. However,
    the model’s idealizations (monotone information, exact universal induction)
    and the extreme non-uniqueness of what induction can learn mean that what is
    recovered is generic computable lawfulness, not specifically quantum
    structure. Müller’s own exposition underscores this: he “hopes” some
    nonclassical aspects of quantum theory will become predictions, and
    explicitly catalogs the Bell result as preliminary and the erasure problem
    as open (ZW-E003).

    The neighboring programs add ambition without yet adding decisive
    derivations. Hoffman’s work yields a well-defined conscious-agent dynamics
    and an interface/fitness theorem, plus a correspondence with a free-particle
    wavefunction (ZW-C006, ZW-E010–E011), but nothing close to a derivation of
    general quantum theory. Wolfram’s observer theory and ruliad ontology
    (ZW-C007, ZW-E012–E014) assert that bounded persistent observers “seem” to
    see quantum mechanics, and there is a formal embedding of ZX-calculus into
    his rewriting systems, but the arguments remain informal and circular at the
    level of defining observers, and embedding already-quantum structure into a
    universal computational substrate shows compatibility, not inevitability.

    On the empirical side, modern Bell tests and Wigner’s-friend-style
    experiments (ZW-C003, ZW-E017–E018, plus the Jones–Müller classical analysis
    ZW-E004) constrain combinations of locality, realism, and absoluteness of
    events, but they do not pick between observer-first and standard physicalist
    quantum theories so long as both reproduce the same Tsirelson-bounded
    correlations. These results define benchmarks (especially the quantitative
    CHSH value and the Tsirelson limit) that any observer-first derivation must
    reach; they do not yet discriminate ontologies.

    The strongest counterweight to the zero-worlds thesis is the physicalist
    “relocated complexity” argument (ZW-C009, supported by ZW-E009 and ZW-E015).
    Universal induction will asymptotically fit any simple computable law;
    without an internal reason to privilege quantum over classical, stochastic,
    or superquantum but no-signalling regularities, the observer-first reversal
    currently explains only why there is some simple law, not why the law has
    the specific quantum features captured by the reconstruction axioms.
    Meanwhile, standard physicalist quantum theory retains a wide and
    uncontested quantitative lead in concrete predictions (Hamiltonians,
    spectra, cross-sections), and ontologically neutral reconstructions already
    deliver much of the advertised explanatory compression without committing to
    idealism.

    The dossier is unusually clear that the crux is mathematical: the
    observer-to-operational bridge (ZW-C010). That problem is indeed well-posed
    and open: can self-state plus induction-type postulates entail a convex
    operational theory satisfying purification, continuous reversibility, and
    the specific Tsirelson-bounded nonlocality embodied in quantum mechanics? A
    positive solution would greatly strengthen the zero-worlds program and
    falsify the “explanatorily idle” charge against it; a rigorous no-go theorem
    or demonstration that the same postulates equally favor non-quantum
    regularities would cement the physicalist steelman.

    On the central ontological claim (ZW-C008), the evidence warrants only
    “presently untestable”: no experiment yet distinguishes zero-worlds from its
    physicalist rival, and the flagship program has not delivered the promised
    quantum derivations. Yet the mathematical and conceptual progress documented
    here shows the program is non-trivial and reasonably healthy as a research
    line. Overall, the case is mixed: strongly established on the existence and
    power of reconstructions and on algorithmic idealism’s world-emergence
    results; weak and unfinished on specifically quantum derivations; and
    neutral empirically between the competing ontologies, pending resolution of
    the bridge theorems in either direction.
