  synthesis: >-
    The featured hypothesis is that no observer-independent physical world is
    fundamental, and that first-person informational states plus a lawlike
    inductive rule are ontologically sufficient, with quantum theory itself
    ultimately derivative. The evidence records license a precise status for
    that thesis, not a draw and not a refutation: presently untestable.
    Loophole-free Bell tests and the local-friendliness experiment constrain
    assumption bundles — local realism; absoluteness of observed events
    conjoined with locality and no-superdeterminism — without separating
    observer-first ontologies from physicalist quantum mechanics, because every
    serious contender already reproduces quantum statistics. Müller's own group
    further deflates the Wigner's-friend structure as not specifically quantum.
    The distinctive first-person predictions live in duplication,
    teletransportation, and simulation scenarios that no record operationalizes
    with preregistered frequencies. And the one result that would convert the
    metaphysics into physics — a derivation of operational quantum structure
    from the observer-first primitives — has not been produced. Müller states
    the quantum reconstruction as a hope; the 2020 Bell foothold is, in his
    words, preliminary because it rests on too many assumptions; Hoffman's
    free-particle correspondence and Wolfram's informal ruliad arguments sit
    below the Spekkens calibration bar of Tsirelson-bounded nonlocality and
    contextuality.

    Steelman the idealist direction. The reversal is not empty philosophy.
    Müller's 2020 theorems show that a stable, apparently objective external
    world governed by simple computable laws can be an output of self-states
    plus universal induction rather than an input, and they dissolve
    Boltzmann-brain and related puzzles by a uniform first-person rule. That is
    a genuine existence proof that "zero worlds underneath" can still underwrite
    the appearance of one world. The reconstruction theorems then show that the
    target is not vague: if the missing left-hand bridge can be built — if those
    same postulates entail a convex operational state space, purification, or
    continuous reversibility — finite-dimensional complex quantum theory would
    follow as a theorem, not a postulate. The architecture is coherent, and the
    physicalist charge that complexity has merely been relocated is itself
    incomplete. Standard quantum theory buys its precision by taking the
    Hilbert-space package as primitive, which is exactly the explanatory debt
    the reconstructions and the observer-first programs are attempts to pay. A
    derivation of the Tsirelson bound, the Born coefficients, or purification
    from first-person postulates would falsify the "explanatorily idle"
    indictment overnight. The steelman is exposed there, and it has bet against
    that mathematics.

    Steelman the physicalist direction. Universal induction is Kolmogorovian at
    the meta-level: it converges to whatever computable law generates the data,
    so it explains why some lawful world appears and not why the world is
    quantum rather than classical, stochastic, or post-quantum. QBism, the
    mature first-person-adjacent framework, imports the Born rule as an
    empirical normative addition to Bayesian reasoning. Spekkens' toy theory
    manufactures interference analogues, no-cloning, teleportation, and
    entanglement-like correlations from classical states plus an epistemic
    restriction, failing exactly at Bell violation and contextuality — which is
    why wave equations and form-matches prove nothing. No observer-first program
    computes a Hamiltonian, a particle spectrum, or a cross-section. The
    operational reconstructions already deliver the advertised explanatory
    compression without any ontological reversal, and they remain ontologically
    neutral. Until the bridge theorems arrive, parsimony of nouns has been
    purchased with an uncomputable transition rule, and the books only look
    cleaner. Reproducing things quantum mechanics already explains settles
    nothing. The case therefore hangs on a precisely posed, currently unsolved
    mathematical question, not on a missing measurement: whether observer-first
    postulates entail the operational principles from which quantum theory has
    already been derived. That obligation has been specified with rare
    precision. On the evidence records, it has not been discharged.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    confidence: high
    reasoning: Three independent reconstructions — Hardy 2001,
      Chiribella–D'Ariano–Perinotti 2011, and Masanes–Müller 2011 — are
      documented in the evidence records as deriving finite-dimensional complex
      quantum theory from operational and informational axioms without taking
      Hilbert space, amplitudes, or the trace rule as primitives. The results
      are long-standing, published in mainstream venues (Hardy as a foundational
      preprint), and uncontested by any party to this case. The strongest
      opposing consideration is that purification and continuous reversibility
      may already encode most of what is distinctively quantum, so the theorems
      compress the formalism rather than explain why nature satisfies those
      axioms; that objection addresses explanatory depth, not the existence or
      validity of the reconstructions as stated.
  - claimId: ZW-C002
    verdict: well_supported
    confidence: high
    reasoning: No evidence record exhibits a derivation of complex Hilbert space,
      the Born rule, or Tsirelson-bounded nonlocality from algorithmic idealism,
      conscious-agent primitives, or the ruliad. Müller’s own exposition frames
      nonclassical quantum structure as a hope and labels the 2020 Bell result
      preliminary; Hoffman’s published mathematics is a free-particle
      form-match; Wolfram’s derivations are informal and his strongest formal
      quantum result is an embedding. The strongest opposing consideration is
      that “not yet derived” is the ordinary condition of a young program, and a
      preliminary Bell theorem shows the direction is not empty — but that
      contests prospects, not the observational claim about what has actually
      been proved.
  - claimId: ZW-C003
    verdict: well_supported
    confidence: high
    reasoning: "Hensen et al. 2015 fix a loophole-free CHSH violation at S = 2.42 ±
      0.20, and Bong et al. 2020 price the conjunction of observer-independent
      facts, locality, and no-superdeterminism more steeply than Bell, yet both
      confirm quantum statistics rather than select an ontology. Jones and
      Müller further show that the Wigner's-friend structure can be recovered
      classically by agent duplication, so it is not even a specifically quantum
      witness. The strongest opposing consideration is that local friendliness
      is not perfectly neutral: it taxes theories committed to absolute observed
      events, a real cost for ordinary physicalism that observer-relative
      frameworks do not pay. That is an asymmetric constraint on assumption
      bundles, not an empirical discrimination of the two ontologies."
  - claimId: ZW-C004
    verdict: well_supported
    confidence: high
    reasoning: "Müller 2020 is a peer-reviewed existence proof, inside an explicit
      self-state plus universal-induction model, that observers should
      asymptotically expect a stable, computable, lawful external world, with
      Boltzmann-brain transitions algorithmically disfavored. The 2026
      formulation restates the same content as two postulates and extends the
      first-person treatment of related puzzles. The strongest opposing
      consideration is scope: the theorems live in an idealized bit-string model
      with monotone information accumulation, exact Solomonoff induction is
      uncomputable, invariance-theorem constants are machine-dependent, and
      Müller himself names forgetting — the erasure problem — as an open
      obstacle to describing actual observers. Those caveats bound the theorem;
      they do not retract it."
  - claimId: ZW-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Both halves of the claim are taken from the framework’s own record:
      universal induction will learn quantum regularities if those regularities
      generate the observer’s data, and the 2020 paper contains a genuine but
      heavily conditioned theorem that Bell violation with no-signalling can
      sometimes be expected. Müller’s exposition is the strongest source, and it
      is the source that applies the word “preliminary.” The strongest opposing
      consideration is that consistency with quantum mechanics is consistency
      with any computable law, so nothing specifically quantum has been
      selected, and a theorem that violation “can sometimes be expected” under
      extra assumptions is not a derivation of quantum statistics or of the
      Tsirelson cap."
  - claimId: ZW-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The Fitness-Beats-Truth theorem and the published correspondence
      between conscious-agent Markov dynamics and the free-particle wavefunction
      are real, citable mathematics, and no record shows a derivation of general
      state spaces, the Born rule, or entanglement structure from those
      primitives. The claim’s negative clause is therefore as well documented as
      its positive one. The strongest opposing consideration is that the
      inference chain breaks twice: selection need not favor veridical
      perception does not imply consciousness is fundamental, and a harmonic
      form-match with one simple quantum object is the inexpensive resemblance
      Spekkens’ toy theory warns against. The mathematics supports an interface
      thesis about perception, not an ontology of physics."
  - claimId: ZW-C007
    verdict: well_supported
    confidence: high
    reasoning: Wolfram’s 2023 essay asserts that general relativity, quantum
      mechanics, and the Second Law follow from computational boundedness plus
      believed persistence, while using the hedged verb “we seem to be able to
      derive” and conceding that identifying persistence is “at least on the
      face of it circular.” The strongest formal quantum result in the orbit is
      the Gorard et al. embedding of ZX-calculus in multiway systems, which
      shows compatibility rather than inevitability, and the ruliad is one vast
      unweighted world of all computation rather than zero worlds. The strongest
      opposing consideration is that informal conceptual derivations can precede
      formalization, so present informality is not a proof of emptiness — but
      the claim as stated is a report of what has been published, and that
      report matches the primary texts.
  - claimId: ZW-C008
    verdict: presently_untestable
    confidence: high
    reasoning: "Nothing in the current record supports or contradicts the no-world
      thesis over its physicalist rival: both accommodate existing data, PBR
