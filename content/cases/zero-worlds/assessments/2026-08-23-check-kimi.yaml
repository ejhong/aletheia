  synthesis: "This case is a rare metaphysical dispute with a scoreboard, and the
    scoreboard currently reads: game in progress, no score for either side. The
    steelman for the observer-first camp is genuinely strong, stronger than
    outsider status would suggest. Müller's algorithmic idealism is not vibes:
    the emergence of a lawful, apparently objective external world from
    self-states plus universal induction is a peer-reviewed theorem (ZW-C004),
    and the framework cleanly dissolves real puzzles (Boltzmann brains) that
    physicalist cosmology handles awkwardly at best. Crucially, the target is
    precisely defined: the reconstruction theorems (ZW-C001) prove that
    finite-dimensional quantum theory follows from operational information
    principles, and Müller co-authored one of the strongest of them. The
    two-stage architecture — observers to operational axioms, axioms to quantum
    theory — has its second stage done and refereed. If stage one is ever
    proven, ZW-C008 converts from metaphysics into the deepest explanation of
    quantum structure available; if it is proven impossible, the physicalist
    steelman (ZW-C009) wins by theorem rather than by default. That is what a
    healthy research program looks like. The steelman against is equally strong,
    and today it is stronger. Universal induction is unselective: it would learn
    a classical, stochastic, or post-quantum world with the same serenity, so
    nothing specifically quantum has been explained — the program's own best
    result, the 2020 preliminary Bell theorem (ZW-C005), is author-flagged as
    resting on too many assumptions, and consistency-with-anything- computable
    is not prediction. Spekkens' toy theory calibrates how cheap quantum
    resemblance is, and both neighbouring programs currently sit below that bar:
    Hoffman's free-particle form-match (ZW-C006) and Wolfram's informal,
    self-admittedly circular derivation claims (ZW-C007). QBism's printed
    concession that the Born rule is an empirical addition shows even the
    friendliest mature framework imports rather than derives the quantum part.
    Meanwhile experiments (ZW-C003) referee without discriminating, because
    every contender predicts the same statistics. The decisive fact, documented
    from inside the flagship program itself (ZW-C002), is that the bridge
    theorem (ZW-C010) does not exist. The featured thesis therefore earns
    presently_untestable rather than contradicted: it accommodates all current
    data, its distinctive predictions live in unrunnable scenarios, and its
    quantum content is conceded underived — but unlike most untestable theses,
    it has handed its opponents a dated, precise kill criterion. My assessment
    leans on the provided evidence records throughout; only the prior that
    uncomputable transition rules are an explanatory cost, and the Spekkens
    calibration of what counts as genuinely quantum, come from general
    background, and both are flagged in the records themselves."
