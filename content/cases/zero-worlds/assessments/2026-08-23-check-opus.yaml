  - claimId: ZW-C009
    verdict: well_supported
    confidence: moderate
    reasoning: "The three conjuncts are separately well evidenced: unselectivity
      follows from the structure of universal induction and is visible in the
      consistency argument itself (ZW-E001/ZW-E003); ontology-free compression
      is delivered by ZW-C001; the quantitative advantage — Hamiltonians,
      spectra, cross-sections — is disputed by no one, and QBism's own flagship
      paper concedes the Born rule is \"an empirical addition\" (ZW-E009). The
      strongest opposing consideration is that \"relocated complexity\" is a
      charge physicalism also faces: standard quantum theory buys precision by
      taking the whole formalism as primitive and offers no non-circular account
      of why the operational axioms hold, so the parsimony ledger is not
      one-sided. Confidence is moderate because the claim's normative core —
      that the ontological reversal is explanatorily idle — is a forward-
      looking bet against bridge theorems, and ZW-C010 shows that bet is live
      and falsifiable rather than secured."
  - claimId: ZW-C010
    verdict: well_supported
    confidence: moderate
    reasoning: "That the problem is open is uncontested; that it is decisive follows
      from the case's two-stage architecture, with stage two proven (ZW-C001)
      and stage one absent (ZW-C002); and Müller's own framing of quantum
      reconstruction as the benchmark makes this near-common-ground. The
      concrete targets named — purification, the Tsirelson bound, Born-rule
      measure selection — are specific enough to be attempted, which is what
      \"precisely posed\" requires. The strongest opposing consideration is the
      one the claim itself flags: the bridge may be neither provable nor
      refutable if \"observer\" cannot be formalized tightly enough for a
      theorem to bind it, which would end the dispute in definitional stalemate
      rather than resolution — Wolfram's admitted circularity is a live instance
      of that failure mode. The secondary weakness is \"would settle most of the
      case\": a negative resolution would strand strong zero-worlds idealism but
      leave weaker observer-first positions, including QBism, untouched."
