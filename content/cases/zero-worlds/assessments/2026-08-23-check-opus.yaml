  - claimId: ZW-C008
    verdict: presently_untestable
    confidence: moderate
    reasoning: 'Nothing in the record supports or contradicts this thesis over
      physicalism: ZW-C003 shows no experiment discriminates them, ZW-C002 shows
      its quantum content is conceded underived, and ZW-E016 (PBR) constrains a
      neighbour of both positions rather than either principal. Its distinctive
