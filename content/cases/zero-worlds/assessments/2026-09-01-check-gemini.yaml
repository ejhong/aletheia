  synthesis: >-
    The case "Zero Worlds?" evaluates whether observer-first ontological
    programs have successfully derived quantum mechanics from their non-material
    primitives. The architecture of the case rests on a stark derivation gap. On
    the right side of this gap, the quantum reconstruction theorems (ZW-C001)
    are established mathematics: E006, E007, and E008 rigorously prove that the
    quantum formalism can be derived from operational axioms. On the left side,
    the flagship observer-first program, Müller's algorithmic idealism, succeeds
    in demonstrating that a stable, lawful external world mathematically emerges
    from first-person states governed by universal induction (ZW-C004, supported
    by E001).

    However, the bridge between these two sides remains unbuilt. As stated in
    ZW-C002, no observer-first program has derived specifically quantum
    structures like the Tsirelson bound or the Born rule. The evidence firmly
    supports this gap: Hoffman's conscious agents achieve only a free-particle
    correspondence (ZW-C006, E010), Wolfram relies on informal derivations and
    embeddings (ZW-C007, E012, E014), and Müller explicitly acknowledges that
    predicting nonclassical quantum aspects remains a "hope" and his
    Bell-violation result is preliminary (ZW-C005, E003). Crucially, empirical
    benchmarks like loophole-free Bell tests and Wigner's-friend experiments
    (E017, E018) constrain theoretical assumptions but do not discriminate
    between physicalist and idealist ontologies (ZW-C003).

    As a result, the featured thesis that no observer-independent world is
    fundamental (ZW-C008) is presently untestable. Steelmanning the idealist
    position, algorithmic idealism accomplishes genuine structural work,
    elegantly dissolving the Boltzmann brain problem and demonstrating that
    objective reality can emerge as a theorem rather than an assumption.
    Steelmanning the physicalist position (ZW-C009), the explanatory parsimony
    claimed by idealists is already delivered by the ontologically neutral
    operational reconstructions; without a specific derivation of quantum
    structure, universal induction merely relocates complexity by unselectively
    accommodating whatever computable regularities exist. Ultimately, the debate
    hinges on a precisely posed mathematical problem: the
    observer-to-operational-axioms bridge theorem (ZW-C010). Until this is
    resolved, the observer-first theories remain interpretive frameworks rather
    than physical derivations.

    Sensitivity: The single evidence record whose removal would most change the
    case verdict is ZW-E003 (Müller's research exposition). This document
    contains the definitive internal concession that the quantum reconstruction
    is incomplete and the Bell result is preliminary. While the overall verdict
    that ZW-C008 is presently untestable would survive without it—because the
    objective absence of a derivation in the broader literature would still be
    apparent—ZW-E003 anchors the case by proving that the gap is acknowledged by
    the founder himself, foreclosing any debate over the flagship program's
    current mathematical reach.
