  synthesis: >-
    The featured hypothesis is that no observer-independent physical world is
    fundamental: first-person informational states plus a lawlike inductive rule
    are the whole inventory, and the apparent world — ultimately including
    complex Hilbert space, the Born rule, and Tsirelson-bounded nonlocality — is
    derivative. Weighing only the evidence records, that thesis is presently
    untestable. The finding is overdetermined, not diplomatic. Loophole-free
    Bell tests and the local-friendliness experiment constrain assumption
    bundles that every serious contender here already rejects or already
    accepts; they confirm quantum statistics, which both ontologies reproduce.
    Distinctive first-person scenarios (duplication, teletransportation,
    simulation shutdown) are not operational laboratory tests with publicly
    comparable frequencies. PBR constrains a neighbour of both positions —
    ψ-epistemic models that posit an underlying physical ontic state — and
    therefore does not touch strong idealism. What would convert the metaphysics
    into physics is a bridge theorem from observer-first primitives to the
    operational axioms from which quantum theory has already been reconstructed.
    That theorem is not in the record, and the flagship's author says so.

    Steelman the idealist direction first. The reversal is not empty. Müller's
    2020 paper proves, in an algorithmic-information model, that self-states
    plus universal induction yield the asymptotic expectation of a stable,
    computable, lawful external world, and that Boltzmann-brain continuations
    are algorithmically disfavored. That is world-as-theorem rather than
    world-as-axiom, published in a mainstream quantum journal. The
    reconstruction literature independently shows that finite-dimensional
    quantum theory need not take Hilbert space as primitive: Hardy,
    Chiribella–D'Ariano–Perinotti, and Masanes–Müller derive it from operational
    and informational axioms, with purification and continuity of reversible
    transformations carrying the distinctly quantum content. The same Müller
    co-authored one of those reconstructions and still names the
    observer-to-axioms half as unfinished — unusual candor, and a precisely
    posed target. A derivation of a convex operational state space, of
    purification, or of S_max = 2√2 from self-states and induction would
    overnight falsify the charge that the ontological reversal is explanatorily
    idle. Hoffman's Fitness-Beats-Truth theorem and free-particle
    correspondence, and Wolfram's ruliad-plus-observer sketch, are weaker
    neighbours, but they illustrate that demoting spacetime is a live research
    family, not a single idiosyncrasy.

    Steelman the physicalist direction at full strength. Universal induction is
    Kolmogorovian at the meta-level: it converges to whatever computable law
    generates the data, so it explains why some lawful world appears and not why
    the world is quantum rather than classical, stochastic, or post-quantum. The
    2020 Bell-with-no-signalling result is a valid theorem its own author labels
    preliminary because it rests on too many assumptions; it does not select the
    Tsirelson bound. Spekkens' toy theory manufactures interference analogues,
    no-cloning, teleportation, and entanglement-like correlations from classical
    states plus an epistemic restriction, failing exactly at Bell violation and
    contextuality — which is why resemblance is not a derivation. QBism, the
    mature first-person framework closest in spirit, treats the Born rule as an
    empirical normative addition to Bayesian reasoning. The reconstructions
    already deliver the available explanatory compression without idealism and
    remain ontologically agnostic. No observer-first program computes a
    Hamiltonian, a particle spectrum, or a cross-section. Wolfram keeps one
    enormous world of all computation underneath and concedes circularity in the
    observer concept; Hoffman’s inference from non-veridical perception to
    consciousness-as-fundamental is a non-sequitur. Complexity has migrated from
    the noun list into an uncomputable transition rule, and the bit model’s
    monotone memory (the erasure problem) means the emergence theorems describe
    an idealization no actual observer instantiates.

    The case therefore hangs on a specified, currently unsolved mathematical
    question, not on an experiment in progress. Until a bridge theorem or a
    no-go arrives, or until a prespecified quantitative deviation is scored in a
    first-person-exotic regime, the zero-worlds inventory has no discriminating
    scientific content. Removing ZW-E001 (Müller 2020: emergence theorems and
    the preliminary Bell result) would most change the texture of the case,
    because it is the only load-bearing formal output of the flagship. The
    presently_untestable verdict would survive that removal: it is independently
    fixed by the conceded derivation gap, the non-discrimination of existing
    experiments, and the non-operational status of the distinctive predictions.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    confidence: high
    reasoning: Three independent theorem sets — Hardy 2001,
      Chiribella–D'Ariano–Perinotti 2011, and Masanes–Müller 2011 — reconstruct
      finite-dimensional complex quantum theory from operational and
      informational axioms without taking Hilbert space, amplitudes, or the
      trace rule as primitives (ZW-E006, ZW-E007, ZW-E008). These results have
      stood for one to two decades in mainstream venues and are not contested by
      any party to this case; they fix stage two of the advertised architecture.
      The strongest opposing consideration is that purification and continuity
      already carry most of what is distinctively quantum, so the
      reconstructions compress the mystery into the axioms rather than creating
      quantum theory ex nihilo — an objection to explanatory depth, not to the
      existence or validity of the theorems. Finite-dimensional scope and the
      absence of Hamiltonians or QFT limit what has been derived without
      disturbing the claim as stated.
  - claimId: ZW-C002
    verdict: well_supported
    confidence: high
    reasoning: No observer-first program in the record derives complex Hilbert
      space, the Born rule, or Tsirelson-bounded nonlocality from its
      primitives, and the concession is internal. Müller’s exposition states a
      hope that some nonclassical aspects “can be shown to be predictions” and
      calls the 2020 Bell result preliminary (ZW-E003); the 2026 Foundations of
      Physics paper treats quantum reconstruction as an open target (ZW-E002).
      Hoffman’s published mathematics is a free-particle form-match (ZW-E010);
      Wolfram’s strongest formal result is an embedding of an already-quantum
      calculus (ZW-E014), with the derivation claim hedged as “we seem to be
      able to derive” (ZW-E012). The Fall–Kondo preprint (ZW-E019) is adjacent
      state-realist context, not an observer-first bridge. The strongest
      opposing consideration is that “not yet derived” is the ordinary condition
      of a young program and that the preliminary Bell theorem shows the
      direction is not empty — which does not convert a documented gap into a
      derivation.
  - claimId: ZW-C003
    verdict: well_supported
    confidence: high
    reasoning: "Hensen et al. violated CHSH loophole-free at S = 2.42 ± 0.20, fixing
      the empirical window between 2 and 2√2 (ZW-E017). Bong et al. price the
      conjunction of absoluteness of observed events, locality, and
      no-superdeterminism more steeply than Bell, but the experimental “friend”
      is a photon path (ZW-E018). Jones and Müller argue that the
      Wigner’s-friend structure can be reproduced classically by duplicating
      agents, so it is not specifically quantum evidence about minds (ZW-E004).
      Theories that already accept quantum statistics cannot be separated by
      experiments that confirm those statistics. The strongest opposing
      consideration is that local friendliness is not perfectly
      ontology-neutral: it taxes theories committed to absolute observed events,
      a cost ordinary physicalism pays more readily than observer-relative
      frameworks. That is a constraint on assumption bundles, not a
      discriminating test of the two ontologies."
  - claimId: ZW-C004
    verdict: well_supported
    confidence: moderate
    reasoning: "The 2020 Quantum paper proves, from self-states and a
      universal-induction law of state change, that observers should expect a
      stable, apparently objective world governed by simple computable
      probabilistic laws, with Boltzmann-brain transitions algorithmically
      disfavored (ZW-E001). The 2026 reformulation as two postulates is
      consistent with that result (ZW-E002). The theorems are published,
      peer-reviewed, and unchallenged as mathematics; they show the reversal can
      output a lawful world rather than assume one. The strongest opposing
      consideration is the acknowledged erasure problem: the bit model
      accumulates information monotonically, forbids forgetting, and is an
      idealization no actual observer instantiates, while exact Solomonoff
      induction is uncomputable and invariance-theorem constants are
      machine-dependent. Those are scope caveats, not retractions, which is why
      the claim is well supported rather than established, and why confidence is
      only moderate given that this run did not re-derive the proofs."
  - claimId: ZW-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: Asymptotic consistency with quantum mechanics follows immediately if
      quantum theory generates the computable regularities in an observer’s
      data, because universal induction learns whatever computable law is there
      (ZW-E001). The 2020 paper also proves a theorem that Bell-inequality
      violation with no-signalling can sometimes be expected; Müller’s own
      exposition calls it “a valid theorem, but ‘preliminary’ because it still
      rests on too many assumptions” (ZW-E003). Both halves are therefore real
      and correctly hedged. The strongest opposing consideration is that
      consistency-with-QM is consistency-with-any-computable-law — classical,
      stochastic, or post-quantum would be learned with equal serenity — and
      that “can sometimes be expected” under extra assumptions is not a
      prediction that correlations must cap at the Tsirelson bound. That is
      exactly why the foothold remains provisional.
  - claimId: ZW-C006
    verdict: well_supported
    confidence: moderate
    reasoning: "The Fitness-Beats-Truth theorem is a published result inside a
      specified evolutionary-game model: fitness-only perceptual strategies
      generically outcompete truth-tracking ones (ZW-E011). Hoffman and Prakash
      2014 define conscious agents as Markov kernels and show that harmonic
      functions of a spacetime chain match the form of the free-particle
      wavefunction (ZW-E010). Neither result derives general quantum theory —
      state spaces, the Born rule, tensor-product composition, or nonclassical
      correlations — and the claim as stated does not pretend otherwise. The
      strongest opposing consideration is that later conscious-agent work is
      advertised as moving toward particle physics, so the gap might close;
      advertised reach is not a derivation, and a form-match with one simple
      quantum object sits well below the Spekkens bar. The further inference
      from non-veridical perception to consciousness-as-fundamental is a
      non-sequitur the claim correctly does not make."
  - claimId: ZW-C007
    verdict: well_supported
    confidence: moderate
    reasoning: Wolfram’s 2023 essay asserts that general relativity, quantum
      mechanics, and the Second Law seem to follow from computational
      boundedness plus belief in persistence, and in the same text concedes that
      identifying persistence “is at least on the face of it circular”
      (ZW-E012). Gorard et al. embed ZX-calculus in multiway systems, which
      shows that the rewriting framework can host an already-quantum calculus,
      not that bounded persistent observers must experience quantum statistics
      (ZW-E014). The ruliad is one vast world containing all computations, not
      zero worlds (ZW-E013). As a description of what the program claims versus
      what it has published, the record is accurate. The strongest opposing
      consideration is that informal arguments in a universal rewriting system
      might yet be tightened into a refereeable derivation of quantum
      statistics; until they are, embedding-plus-hedge is the present state, and
      self-publication without refereeing caps confidence.
  - claimId: ZW-C008
    verdict: presently_untestable
    confidence: high
    reasoning: Nothing in the evidence records supports this ontology over
      physicalism or contradicts it. Existing experiments are reproduced by both
      (ZW-E017, ZW-E018); PBR constrains models that assume an underlying
      physical ontic state, which strong idealism denies, so it does not touch
      the thesis (ZW-E016); McQueen and Müller state the disagreement without
      resolving it (ZW-E005). The quantum half is underived (ZW-C002), and the
      distinctive first-person scenarios are not currently laboratory tests. The
      strongest opposing consideration is that the 2020 emergence theorems show
      a lawful world can be output from self-states and induction, which makes
      the reversal formally possible — possibility is not evidence that the
      actual inventory contains zero worlds. High confidence attaches to the
      status, not to the metaphysics.
  - claimId: ZW-C009
    verdict: well_supported
    confidence: high
    reasoning: "Every component is documented on the proponents’ side of the ledger.
      Universal induction would learn any computable law, so it explains
      appearance of lawfulness rather than quantum structure (ZW-E001, ZW-E003).
      The operational reconstructions already compress the formalism without
      idealism (ZW-E006, ZW-E007, ZW-E008). QBism’s flagship paper treats the
      Born rule as “an empirical addition to Bayesian reasoning itself”
      (ZW-E009). Spekkens shows how much quantum phenomenology is available
      without Bell violation or contextuality (ZW-E015). No observer-first
      program in the record computes a Hamiltonian, spectrum, or cross-section.
      The strongest opposing consideration is that “relocated complexity” cuts
      against physicalism too — standard quantum theory takes the formalism as
      primitive, and physicalism has no non-circular account of why the
      operational axioms hold — and that the steelman is exposed: it predicts
      the bridge theorems will never arrive. That exposure is a virtue of the
      claim, not a present counterexample."
  - claimId: ZW-C010
    verdict: well_supported
    confidence: high
    reasoning: Stage two is established (ZW-C001); stage one is conceded unfinished
      (ZW-C002). Müller contrasts algorithmic idealism with operational setups
      that already embed agents in one physical system and names quantum
      reconstruction as the relevant benchmark (ZW-E002). Concrete targets — a
      convex operational state space, purification, the Tsirelson bound,
      Born-rule measure selection — are well-posed mathematical questions whose
      resolution in either direction would settle most of the attribution
      dispute. ZW-E019, even if sound, would derive operational quantum
      structure from access limits inside a deterministic state-realist
      ontology, which is adjacent context rather than an observer-first bridge.
      The strongest opposing consideration is that “observer” may never be
      formalized tightly enough for a theorem to bind it, yielding a
      definitional stalemate rather than a proof or no-go, which would demote
      the “precisely posed” clause. That risk does not make the current gap any
      smaller or the question any less decisive if it remains well-posed.
