  synthesis: "The case splits cleanly at the two-stage architecture the overview
    identifies. Stage two is proven: three independent theorem sets derive
    finite-dimensional quantum theory from operational-informational axioms
    (ZW-E006–E008), uncontested by any side, with Hardy's one-word
    classical/quantum pivot marking exactly where quantumness enters. Stage one
    — observer-first postulates entailing those operational axioms — is unbuilt,
    and this is not an outsider's accusation but the proponents' own testimony:
    Müller's refereed 2026 paper names quantum reconstruction an open target
    (ZW-E002), his exposition says \"I hope\" and labels the 2020 Bell result
    \"preliminary\" for resting on \"too many assumptions\" (ZW-E003); Hoffman's
    strongest result is a form-match with a free-particle wavefunction
    (ZW-E010), far below the Spekkens bar (ZW-E015); Wolfram's derivation claim
    is self-hedged (\"we seem to be able to derive\") with admitted circularity,
    and his best formal result is an embedding — compatibility, not
    inevitability (ZW-E012, ZW-E014). Steelman for zero worlds: the emergence
    theorems are real refereed mathematics — a lawful objective world as theorem
    rather than axiom, Boltzmann brains dissolved en route (ZW-E001); the
    reconstructions prove quantum theory can fall out of information principles
    at all, so the target is not chimerical; the conditioned Bell theorem is a
    genuine quantum-specific foothold; and Bong's local-friendliness result
    taxes absoluteness of observed events, a cost observer-relative frameworks
    do not pay (ZW-E018). Steelman for physicalism: universal induction would
    learn any computable law with identical serenity, so it explains why some
    lawful world appears but not why ours is quantum; the promised compression
    is already delivered ontology-free by the reconstructions; QBism — the
    friendliest mature framework — concedes the Born rule is \"an empirical
    addition to Bayesian reasoning itself\" (ZW-E009); and no observer-first
    program computes a Hamiltonian, spectrum, or cross-section. Noun-parsimony
    purchased with an uncomputable transition rule relocates complexity rather
    than removing it. The featured thesis (ZW-C008) therefore earns no
    differential support over physicalism from any current evidence — both
    accommodate all data (ZW-C003) — and its quantum content is admittedly
    underived. Yet it is not empty: it owns a precisely posed settlement
    condition (ZW-C010), converting metaphysics into dated mathematics. Hence
    presently_untestable: a status, not a shield. Sensitivity: the single most
    load-bearing record is ZW-E003, the theorist's own words fixing the
    derivation gap. The verdict survives without it — ZW-E002 documents the same
    concession in refereed form, and ZW-E010/E012/E014 independently confirm no
    derivation exists — so the case does not hang on one thread. ZW-E019, an
    unreviewed abstract-only preprint claiming an observer-access derivation of
    the operational formalism inside a state-realist ontology, is
    discovery-grade context: if sound it suggests access-limitation bridges can
    exist, but it is not observer-first and does not touch ZW-C002."
