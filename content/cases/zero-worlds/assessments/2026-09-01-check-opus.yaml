  synthesis: "The case has an unusually clean logical skeleton, and the evidence
    records support that skeleton rather than the headline thesis. Three
    independent theorem sets (ZW-E006, ZW-E007, ZW-E008) establish that
    finite-dimensional quantum theory follows from operational informational
    axioms; nothing in the file contests them, and nothing in them favours any
    ontology. One published, peer-reviewed formal result (ZW-E001) establishes
    that a first-person model with a universal-induction transition rule can
    output an apparently lawful external world rather than assume one. Between
    those two proven halves sits the bridge — observer-first postulates to
    operational axioms — and every record bearing on it, including the flagship
    theorist's own exposition (ZW-E003) and his 2026 reformulation (ZW-E002),
    reports it as unbuilt. Hoffman's strongest asset is a form-match with a
    free-particle wavefunction (ZW-E010) plus a game-theoretic theorem about
    perception (ZW-E011); Wolfram's is a hedged self-published derivation claim
    with an admitted circularity (ZW-E012) and an embedding result whose logical
    force is compatibility only (ZW-E014). Spekkens' toy theory (ZW-E015) sets
    the calibration that disqualifies all of those as quantum derivations, and
    Hensen (ZW-E017) fixes the numeric bar the derivation must hit and cap at.
    Steelmanning the featured side: the reversal is not empty — a lawful world
    genuinely is a theorem in ZW-E001, the Boltzmann-brain dissolution is a real
    dividend, ZW-E004 shows the proponents willing to deflate evidence that
    would have flattered them, and the 2020 Bell foothold is a live seed with a
    specified path to the Tsirelson bound. Steelmanning the rival: universal
    induction learns any computable law, so it predicts \"some lawful world\"
    with equal serenity for classical, stochastic, or post-quantum physics;
    QBism's own concession (ZW-E009) shows the closest mature framework
    importing the Born rule; and no observer-first program computes a
    Hamiltonian, spectrum, or cross-section. Because both ontologies reproduce
    all existing data — ZW-E016 and ZW-E018 confirm the nearest no-go results
    constrain assumption bundles rather than ontologies — the featured thesis as
    stated (ZW-C008) earns only the presently_untestable label, while the crux
    (ZW-C010) is genuinely unresolved rather than merely unexamined.
    Sensitivity: the single most load-bearing record is ZW-E001; without it,
    algorithmic idealism would have no theorem at all and the case would
    collapse toward weakly_supported programmatic speculation. The case verdict
    nonetheless survives its removal, because presently_untestable rests on the
    absence of discriminating evidence — a fact established by ZW-E016, ZW-E017,
    ZW-E018 and by the logic of ZW-C003 — not on the flagship theorem. Removing
    ZW-E003 would soften the documentation of the gap but not close it: ZW-E002,
    ZW-E010, ZW-E012 and ZW-E014 each independently show underivation."
