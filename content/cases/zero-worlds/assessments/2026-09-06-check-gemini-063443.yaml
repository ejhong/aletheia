    from informational and operational principles without postulating Hilbert
    space or complex amplitudes as primitives. Building upon this, Müller (2020)
    formally proved that an observer employing Solomonoff universal induction
    over subjective bit strings will asymptotically infer a stable, computable
    external world, naturally dissolving self-locating paradoxes like Boltzmann
    brains and simulation shutdowns that persistently trouble third-person
    physicalism. Hoffman's Fitness-Beats-Truth theorem further provides
    mathematical support for the proposition that perception does not
    generically track objective truth. However, the steelman for the physicalist
    position demonstrates that an unbridged chasm separates these toy emergence
