  synthesis: >-
    The Zero Worlds hypothesis proposes a radical ontological inversion: that an
    observer-independent physical world does not exist fundamentally, and that
    the regularities of physics emerge asymptotically from first-person
    informational self-states governed by universal induction. When evaluated
    strictly against the recorded evidence, the program demonstrates genuine
    mathematical rigor in its foundations while simultaneously confronting an
    unresolved derivation gap at its core.

    Steelmanning the observer-first program: Müller (2020, 2026) provides a
    mathematically explicit framework showing that universal algorithmic
    induction over an agent's history provably yields an apparently objective,
    computable, stable external reality. Unlike purely verbal idealisms,
    algorithmic idealism achieves non-trivial explanatory work: it provides a
    formal dissolution to persistent anthropic paradoxes—such as Boltzmann
    brains and simulation shutdowns—by demonstrating that lawful continuations
    are algorithmically favored over chaotic disruptions. Furthermore,
    operational quantum reconstructions (Hardy, Chiribella et al.,
    Masanes–Müller) prove that quantum mechanics can be deduced entirely from
    information-theoretic and operational constraints without postulating
    microscopic physical ontology as fundamental. If an observer-first framework
    can bridge its self-states to these operational axioms, it would achieve
    unprecedented ontological parsimony.

    Steelmanning the physicalist critique: Algorithmic idealism currently
    operates on an unselective foundation. Solomonoff induction will
    asymptotically learn any computable sequence of experiences; thus, the mere
    reproduction of regularities explains classical predictability, not the
    specific mathematical structure of our universe. Crucially, as admitted by
    Müller and demonstrated across conscious-agent theory and the Wolfram
    ruliad, no observer-first framework has derived the distinctively quantum
    package—specifically complex Hilbert spaces, the Born rule, and
    Tsirelson-bounded nonlocality—from observer primitives alone. The
    operational reconstructions invoked to justify informational primacy are
    themselves completely ontology-neutral and retain full consistency with
    standard physical realism. Without a formal bridge theorem or accessible,
    discriminating empirical tests beyond exotic thought experiments, the
    ontological demotion of the external physical world remains a speculative
    metaphysical attribution rather than an established scientific conclusion.
    Because the decisive bridge theorem remains open and unproven, the case is
    unresolved.
