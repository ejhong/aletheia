    resting on too many assumptions. Against this, the featured ontological
    thesis (ZW-C008) is interpretation, not yet derivation: nothing in the
    record derives the quantum package — complex Hilbert space, Born rule,
    Tsirelson cap — from observer-first primitives, and the physicalist steelman
    (ZW-C009) lands real blows, most sharply the unselectivity charge (universal
    induction learns any computable law, calibrated by Spekkens's demonstration
    of how much quantum 'look' non-quantum theories can fake) and QBism's own
