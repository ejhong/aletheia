    2.42 ± 0.20) that any derivation must match, and Bong 2020 constrains
    assumption-conjunctions, not ontologies; Jones & Müller even undercut
    reading Wigner's-friend experiments as distinctively quantum. The formal
    half of Müller's program (ZW-C004) is real — a peer-reviewed emergence
    theorem in Quantum — but it lives in an idealized bit-string model with
    monotone information accumulation (the self-acknowledged erasure problem),
    uncomputable exact induction, and no independent rederivation; the Bell seed
