  synthesis: "Zero Worlds decomposes into three tiers with very different
    evidential standing. The first tier is genuinely established: the
    operational reconstruction theorems (ZW-C001) are real, peer-reviewed
    mathematics showing that finite-dimensional quantum theory follows from a
    handful of operational axioms without Hilbert space as a primitive. The
    second tier is the flagship mechanism: Müller's 2020 emergence theorems
    (ZW-C004) prove, within a peer-reviewed model, that observer-first
    postulates yield a stable, apparently objective world governed by simple
    computable laws — the single strongest fact in the case, and the reason the
    verdict is not \"unresolved.\" The third tier is the derivation gap, and
    here the record is unusually clear because it comes from the proponents
    themselves: Müller describes quantum predictions as a \"hope\" and his Bell
    result as \"preliminary\" and resting on \"too many assumptions\" (ZW-C002,
    ZW-C005); Hoffman owns a real theorem and a formal correspondence but no
    Born rule, no tensor products, no nonclassical correlations (ZW-C006);
    Wolfram hedges the derivation verb and concedes circularity in the observer
    concept (ZW-C007). The Spekkens calibration and the Hensen benchmark fix the
    bar at Tsirelson-bounded Bell violation, and nothing in the record reaches
    it; the FALL-2026 preprint derives operational quantum structure but from a
    state-realist ontology, so it is adjacent context, not a counterexample to
    ZW-C002. Empirically, Bell and Wigner's-friend tests constrain conjunctions
    of assumptions, not ontologies (ZW-C003), and no discriminating protocol
    exists (ZW-C503). The physicalist steelman (ZW-C009) — universal induction
    would learn any computable law and so explains nothing specifically quantum;
    the reconstructions already deliver the compression ontology-free; QBism
    itself concedes the Born rule is an empirical addition — is well-grounded in
    the record and unanswered. Steelmanning the other direction: the existence
    of a proven emergence theorem refutes the a priori objection that idealism
    cannot yield objectivity, and the same author standing on both sides of the
    bridge makes the two-stage architecture concrete rather than rhetorical. But
    an ontological thesis claiming quantum theory itself is derivative currently
    outruns its mathematics: one theorem in an idealized bit model with an open
    erasure problem, a heavily-qualified preliminary Bell result, no bridge
    theorem, and no test. Weakly supported is the honest reading."
  steelman: "The strongest unanswered argument for Zero Worlds is that its central
    reversal is already a proven theorem, not an aspiration: Müller's 2020 paper
    demonstrates in a peer-reviewed venue that an observer-first ontology
    derives a stable, lawful, apparently objective external world — dissolving
    the classic a priori objection that idealism cannot explain intersubjective
    regularity — and the same author co-proved one of the three rigorous quantum
    reconstructions, so both endpoints of the proposed bridge (observer-first
    postulates on one side, operational axioms plus quantum formalism on the
    other) already exist in mathematics written by the same hands. Add the
    preliminary Bell-violation-with-no-signalling theorem, the reconstruction
    literature's demonstration that the distinctly quantum content is compressed
    into a single postulate (purification) plus one structural fact
    (continuity), and the erasure/contextuality research agenda: what remains is
    a finite, precisely characterizable gap under active attack by the person
    best placed to close it. My assessment prices the gap as it stands but does
    not answer the demonstration that the observer-first reversal is
    mathematically executable at all, nor does it explain why, if the emergence
    mechanism is sound, the quantum bridge should be assumed unclosable."
