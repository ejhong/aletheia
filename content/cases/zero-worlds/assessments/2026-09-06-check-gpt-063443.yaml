  synthesis: >-
    The record establishes a substantial formal research program but does not
    resolve the featured ontological hypothesis. The strongest positive result
    is ZW-C004: Müller's model starts with self-states and universal induction
    and proves, within an idealized bit-string setting, that an observer should
    asymptotically encounter simple, stable, apparently objective computable
    regularities. This matters because it answers a genuine feasibility
    objection: an observer-first model need not simply assume the appearance of
    a lawful external world. ZW-C005 adds a valid but heavily conditioned result
    under which Bell violation with no-signalling can sometimes be expected.
    Hoffman's mathematical constructions and Wolfram-model embeddings likewise
    show that observer-centred programs can sustain nontrivial mathematics,
    although they are neither replications of Müller's theorem nor derivations
    of quantum theory. Wolfram's ruliad also retains an observer-independent
    computational structure, so it is not direct support for the literal
    zero-world ontology.

    The opposing case is stronger at the quantum and empirical stages. ZW-C001
    establishes that finite-dimensional quantum theory can be recovered from
    operational axiom systems, thereby specifying concrete structural targets
    such as purification and continuous reversible transformations. Yet ZW-C002
    is well supported: none of the named observer-first programs has derived
    complex Hilbert space, the Born rule, composition and entanglement, or the
    Tsirelson bound from its own primitives. Generic universal induction can
    learn a computable quantum regularity if that regularity is already in the
    data; that conditional compatibility does not explain why the regularity is
    quantum rather than classical or more broadly no-signalling. The
    reconstruction papers consequently identify the destination without
    supplying the missing observer-first route to it.

    Nor do the experiments settle the ontology. Bell and local-friendliness
    results constrain conjunctions involving locality, event absoluteness, and
    no-superdeterminism, but ZW-C003 correctly notes that physicalist and
    observer-first interpretations can each reject different assumptions while
    retaining the observed statistics. No distinctive observer-first
    quantitative prediction is tested in the supplied record. The exotic
    first-person scenarios are theoretical discriminators, not presently public
    frequency tests.

    The best case for the hypothesis is therefore a formal compression and
    coherence argument: a sparse first-person model can generate much of the
    appearance of lawfulness and handles certain indexical puzzles naturally.
    The best case against it is that this achievement remains model-bound,
    uncomputable in exact implementation, sensitive to the unresolved erasure
    problem, and nonselective among computable laws. It neither derives the
    observed quantum package nor empirically outperforms world-based quantum
    theories. Calling the ontology contradicted would exceed the evidence,
    because no record establishes that an observer-independent world is
    fundamental. Calling it supported would likewise confuse consistency and a
    partial emergence theorem with evidence that its primitives are all that
    exists. The resulting verdict is substantively unresolved.

    The single evidence record whose removal would most change this assessment
    is ZW-E001, because it contains the principal peer-reviewed emergence
    theorem and the preliminary Bell result. The unresolved verdict survives its
    removal: the remaining records would leave the quantum bridge and empirical
    discrimination absent, although the positive case for formal observer-first
    feasibility would become markedly weaker.
  steelman: Müller's universal-induction theorem derives the high-probability
