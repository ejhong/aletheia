      strongest opposing consideration is that an embedding may become one
      component of a fuller selection theorem, but no such inevitability result
      appears in the supplied record and the principal derivation claims are
      self-published.
  - claimId: ZW-C008
    verdict: unresolved
    confidence: moderate
    reasoning: Müller's theorem supports the logical possibility that
      objective-looking lawful regularity can emerge from self-state dynamics,
      but it does not establish that no observer-independent world exists. The
      record contains no discriminatory experiment and no derivation of the
      quantum package required by the claim's final clause. The strongest
      opposing consideration for a negative verdict is that physicalist
