      address first-person duplication or observer-continuation problems, while
      the file asserts rather than directly documents the comparative
      Hamiltonian, field-theoretic, and precision-prediction advantage."
  - claimId: ZW-C010
    verdict: mixed
    confidence: moderate
    reasoning: A bridge from native observer-first postulates to operational state
      spaces, composition, purification, Born measures, and the Tsirelson bound
