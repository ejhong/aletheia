  synthesis: >-
    The record provides limited but genuine support for Zero Worlds as a
    mathematically coherent research program, not as an established ontology.
    Its principal positive result is ZW-C004: Müller's self-state framework
    reportedly proves, within an idealized algorithmic model, that an observer
    governed by universal induction should asymptotically encounter a stable,
    objective-looking environment with simple computable probabilistic laws.
    This is more than a verbal appeal to emergence because it supplies an
    explicit mechanism and theorem. ZW-C005 adds a heavily conditioned result
    under which Bell violation and no-signalling can sometimes be expected.
    Together, these results weakly support the possibility that world-like
    regularity need not be fundamental.

    The strongest case against the featured hypothesis is the specificity gap.
    ZW-C001 shows that operational reconstructions can recover
    finite-dimensional complex quantum theory once principles such as
    purification, composition, and continuous reversible transformations are
    supplied. Yet ZW-C002 records that none of the named observer-first programs
    has derived those principles, the Born rule, or the Tsirelson bound from its
    native primitives. Universal induction can learn any simple computable
    regularity, so successful accommodation of quantum data would not by itself
    explain why the learned law has quantum rather than classical or
    post-quantum structure. Hoffman's fitness theorem and free-particle
    correspondence establish narrower mathematical results but do not bridge
    that gap. Wolfram's formal result is an embedding of an already-quantum
    calculus into a universal rewriting system, which demonstrates compatibility
    rather than inevitability; moreover, the ruliad retains an
    observer-independent underlying structure and therefore is not direct
    evidence for Müller's zero-world ontology.

    The empirical records likewise do not choose the ontology. Bell and local-
    friendliness experiments sharply constrain conjunctions of assumptions, but
    ZW-C003 is persuasive that they do not discriminate observer-first theories
    from the available physicalist interpretations. The photonic Wigner's-friend
    implementation does not establish a causal role for consciousness or
    first-person states. PBR also constrains only a neighboring class of
    hidden-state models. Thus the experiments define targets that an
    observer-first account must reproduce rather than evidence that observers
    are fundamental.

    The positive Müller records are not independent replications: the 2020
    paper, 2026 formulation, and author webpage belong to one source family, and
    the flagship theorem was not rederived during preparation of this record.
    The reconstruction papers are substantially more independent of one another,
    but they support the bridge's operational endpoint rather than its
    observer-first starting point. Accordingly, the case earns weak support from
    a nontrivial emergence mechanism, while the ontological conclusion in
    ZW-C008 remains unresolved and the promised quantum reconstruction remains
    absent.

    Sensitivity is greatest to evidence record ZW-E001. Removing it would
    eliminate the record's clearest peer-reviewed basis for both lawful-world
    emergence and the preliminary Bell result, leaving mainly the same
    proponent's summaries and narrower neighboring-program results. The
    weakly_supported verdict would not survive that removal; it would fall to
    unresolved, so the present positive verdict hangs substantially on one
    unreplicated formal source.
  steelman: The record supplies no world-based competitor that calculates
    first-person continuation probabilities for duplication, teletransportation,
    simulation shutdown, or Boltzmann-brain scenarios, whereas Müller's
    framework claims principled answers and a theorem explaining why a stable
    lawful external world should appear at all. Precision quantum predictions
    assume such a world-like arena and therefore do not answer this first-person
    explanatory challenge.
