      missing bridge warrants unresolved rather than contradicted.
  - claimId: ZW-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "The record supports the unselectivity objection: universal induction
      can accommodate computable quantum regularities without selecting quantum
      structure, and even QBism treats the Born rule as an empirical addition to
