  synthesis: >-
    The featured hypothesis asserts that first-person self-states plus universal
    induction are ontologically fundamental, that an apparently objective
    external world with simple computable laws emerges as a proven statistical
    regularity in Müller's model, and that the strongest form requires quantum
    theory itself (complex Hilbert space, Born rule, Tsirelson-bounded
    nonlocality) to follow from those observer-first postulates alone. The
    supplied record cleanly separates what has been shown from what has not.
    ZW-C004 and its supporting evidence (ZW-E001, ZW-E002) establish that,
    inside an idealized algorithmic-information model of self-states and
    induction, observers should asymptotically expect a stable external world
    governed by simple computable probabilistic laws, with Boltzmann-brain
    transitions algorithmically disfavored; this is a genuine mathematical
    result, not an assumption, and it dissolves certain first-person puzzles by
    construction. Neighbouring programs supply partial, non-derivational results
    of their own: Hoffman's Fitness-Beats-Truth theorem and a free-particle
    wavefunction correspondence (ZW-C006, ZW-E010, ZW-E011), and Wolfram's
    informal boundedness-plus-persistence claims plus an embedding of
    ZX-calculus (ZW-C007, ZW-E012–E014). None of these reaches the quantum
    package.

    Against that positive core stands the explicit derivation gap. ZW-C002,
    ZW-C005 and ZW-C010, backed by Müller's own statements (ZW-E002, ZW-E003)
    and the reconstruction literature (ZW-C001, ZW-E006–E008), record that no
    observer-first program has derived complex Hilbert space, the Born rule or
    Tsirelson-bounded nonlocality from its primitives. The 2020
    Bell-plus-no-signalling result is labelled preliminary and assumption-heavy
    by its author; quantum reconstruction remains an open research target. The
    operational reconstructions themselves already recover finite-dimensional
    quantum theory from information-theoretic axioms without any observer-first
    ontology, so the explanatory compression promised by demoting the external
    world is already available ontology-free (the core of the physicalist
    steelman ZW-C009, reinforced by QBism's concession that the Born rule is an
    empirical addition and by Spekkens' toy theory as calibration that
    quantum-like phenomena are cheap). Loophole-free Bell tests and extended
    Wigner's-friend no-gos (ZW-C003, ZW-E017, ZW-E018) constrain local realism
    and absoluteness-of-events conjunctions but supply no empirical
    discrimination between observer-first and physicalist readings. PBR further
    closes only a neighbouring ψ-epistemic escape, not the idealist claim.

    Consequently the local mathematical achievements (emergence theorems,
    reconstructions, FBT) stand, yet the attribution that “no
    observer-independent physical world is fundamental” and that quantum theory
    is derivative remains an unbridged interpretive leap. The decisive open
    problem identified in ZW-C010—a bridge theorem from first-person postulates
    to the operational principles (especially purification or continuous
    reversibility) that the reconstructions already convert into quantum
    theory—is precisely unsolved. Until that bridge is built or shown
    impossible, the full hypothesis is unresolved rather than supported or
    contradicted. Sensitivity: removal of ZW-E001 (Müller 2020 emergence
    theorems and preliminary Bell result) would most change the verdict by
    stripping the sole formal demonstration that an observer-first starting
    point can output a lawful world at all; without it the positive half
    collapses and the case would tilt toward weakly_supported or contradicted on
    grounds of pure promissory ontology. The unresolved verdict survives that
    removal only as a thinner stalemate (gap still open, steelman still
    forceful), confirming the present assessment hangs in part on that single
    formal thread. Shared authorship (Müller on both reconstruction and
    idealism) and shared sources do not inflate the gap into a proof; they
    merely make its honesty visible. The record therefore warrants unresolved:
    the demotion is mathematically viable for generic lawfulness, empirically
    non-discriminating, and still short of the quantum package it must
    ultimately deliver.
  steelman: Müller's asymptotic theorems already demonstrate that pure
    first-person universal induction can force the expectation of a stable,
