  synthesis: "The record cleanly separates three layers that the featured
    hypothesis tends to fuse. First, finite-dimensional quantum theory has been
    reconstructed from operational and informational axioms in multiple
    independent theorem sets (ZW-C001, backed by Hardy,
    Chiribella–D'Ariano–Perinotti, and Masanes–Müller). Those reconstructions
    relocate the quantum content into named principles such as purification or
    continuous reversible transformations; they do not take Hilbert space as
    primitive, and they do not require an observer-first ontology. Second,
    Müller's algorithmic idealism is a formally explicit first-person framework
    in which universal induction on self-states yields, as asymptotic theorems,
    the expectation of a stable external world governed by simple computable
    probabilistic laws, with standard indexical puzzles (Boltzmann brains,
    certain simulation and duplication scenarios) dissolving under first-person
    continuation reasoning (ZW-C004, ZW-E001, ZW-E002). That is a genuine
    existence proof that an observer-first starting point can output lawfulness
    rather than presuppose it. Third, and decisive for the featured claim, none
    of the observer-first programs has closed the bridge from its primitives to
    the distinctively quantum package—complex Hilbert space, the Born rule, and
    Tsirelson-bounded nonlocality (ZW-C002). Müller himself labels the 2020
    Bell-with-no-signalling result preliminary and too assumption-laden, and
    frames full quantum reconstruction as an open target (ZW-E002, ZW-E003).
    Hoffman supplies the Fitness-Beats-Truth theorem and a free-particle
    wavefunction correspondence, not general quantum theory (ZW-C006). Wolfram's
    ruliad claims remain informal, with formal results showing
    embedding/compatibility rather than inevitability, plus acknowledged
    circularity in the observer concept (ZW-C007). Empirically, loophole-free
    Bell tests and local-friendliness no-gos constrain conjunctions of
    assumptions but do not select observer-first ontology over physicalist
    readings (ZW-C003). The physicalist steelman therefore lands with force:
    universal induction is unselective among computable measures; the
    explanatory compression already achieved by the operational reconstructions
    is ontology-free; and standard quantum theory retains the quantitative
    machinery the observer-first programs have not reproduced (ZW-C009). The
    case therefore reduces to a precisely posed, currently unsolved mathematical
    question—the bridge from observer-first postulates to the reconstruction
    axioms or to Tsirelson/Born structure (ZW-C010). Until that bridge is proved
    or a hard obstruction is proved, the ontological attribution that no
    observer-independent world is fundamental, and that quantum theory itself is
    derivative of self-states plus induction, remains unresolved rather than
    supported or contradicted. Shared authorship (Müller on both Masanes–Müller
    reconstruction and algorithmic idealism) sharpens rather than closes the
    gap: the same researcher has established the destination and named the
    missing derivation. Sensitivity is high to the gap claims; the emergence
    theorems alone do not entail the featured ontology of our world."
