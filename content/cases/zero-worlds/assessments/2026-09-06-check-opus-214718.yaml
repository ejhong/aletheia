  synthesis: "The record supports a sharply asymmetric picture. What is solidly
    documented is negative or preparatory: three independent axiomatic
    reconstructions recover finite-dimensional quantum theory from operational
    primitives (ZW-C001, the best-attested claim in the file, three
    peer-reviewed or long-cited theorem sets with verbatim abstract anchors); no
    observer-first program has crossed from its own primitives to those
    operational axioms or to the quantum package (ZW-C002, attested by the
    flagship proponent's own words — \"I hope that some nonclassical aspects of
    quantum theory can be shown to be predictions\"); and the two experimental
    benchmarks in the file (Hensen 2015, Bong 2020) constrain conjunctions of
    assumptions but do not discriminate ontologies (ZW-C003), a reading
    reinforced from inside the program by Jones & Müller's argument that
    Wigner's-friend structure is not specifically quantum. The one genuinely
    positive formal result is Müller's 2020 emergence theorem (ZW-C004): within
    an algorithmic-information bit model, an apparently objective lawful world
    is derived rather than assumed. That is a real proof-of-concept for the
    sufficiency direction and should not be dismissed — it is more than
    Wolfram's informally hedged \"we seem to be able to derive\" (ZW-C007) or
    Hoffman's single free-particle form-match (ZW-C006), which the Spekkens
    calibration correctly prices below the bar of Bell violation and
    contextuality. But it is single-author, not independently rederived,
    characterized here at abstract level, resting on monotone information
    accumulation whose repair (the erasure problem) the author lists as open,
    and — decisively — it delivers *a* computable lawful world, not a quantum
    one. That unselectivity is exactly the physicalist steelman's sharpest edge
    (ZW-C009), corroborated by QBism's flagship concession that the Born rule is
    an empirical addition to Bayesian coherence. So the featured thesis
    (ZW-C008) currently has: a demonstrated in-model possibility proof, an
    admitted unbuilt bridge to the distinctively quantum, no empirical
    discriminator, and an articulate rival explanation of its own successes.
    Weakly supported, not refuted, and — per ZW-C010 — genuinely open as
    mathematics rather than untestable in principle."
  steelman: "Müller's 2020 theorem does something no physicalist account has done:
    it explains why an observer should expect a *stable, simple, computable*
    world at all, and dissolves the Boltzmann-brain and simulation-shutdown
    problems that physicalist cosmology has left festering for two decades,
    without inserting a world by hand. Physicalism assumes the lawfulness it
    never derives; the derivation gap this assessment weights so heavily is a
    gap in a young program's *further* ambitions, not a defect in the
    explanatory work it has already done and that its rivals have not
    attempted."
