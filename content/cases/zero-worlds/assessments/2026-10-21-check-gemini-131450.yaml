  synthesis: >-
    The "Zero Worlds" hypothesis asserts an ontological inversion: instead of
    conscious observers emerging within an objective, material cosmos, an
    apparently objective physical reality is derived from the lawful
    continuation of first-person informational states. Structurally, the case
    consists of two established mathematical bodies of work separated by an
    unbridged derivation gap. On one side, quantum reconstruction theorems
    (Hardy 2001, Chiribella et al. 2011, Masanes & Müller 2011) demonstrate that
    finite-dimensional complex quantum mechanics can be derived from operational
    informational axioms without postulating Hilbert spaces or wavefunctions. On
    the other side, Müller's algorithmic idealism proves that an observer
    updating internal self-states via universal Solomonoff induction will
    asymptotically perceive a stable, computable, apparently external world.

    However, the bridge connecting these two results does not exist. No
    observer-first framework—neither algorithmic idealism, Hoffman's
    conscious-agent dynamics, nor Wolfram's ruliad—has derived the distinctively
    quantum package (complex Hilbert space, the Born rule, and Tsirelson-bounded
    nonlocality) from its primitives. Hoffman derives only a formal
    correspondence to a free-particle wavefunction; Wolfram embeds existing
    quantum calculi and stipulates Born path weights; and Müller explicitly
    concedes in print that deriving Bell-inequality violations with
    no-signalling remains an unfinished goal. The physicalist critique is
    logically formidable: universal induction is unselective, converging on any
    computable law, which means it explains computable regularity in general
    rather than quantum mechanics in particular. Furthermore, as conceded in the
    McQueen-Müller adversarial collaboration, the theory cannot yet connect its
    first-person probabilities to repeated, intersubjectively verifiable
    laboratory measurements. The core ontological thesis is therefore presently
    untestable.

    Steelman proponents argue that algorithmic idealism provides the only
    rigorous framework capable of resolving cosmological self-locating paradoxes
    (such as Boltzmann brains) and Wigner's-friend ambiguities without
    multiplying unobservable physical multiverses. Steelman opponents argue that
    operational reconstructions already provide informational compression
    without metaphysical idealism, and physicalism maintains an overwhelming
    predictive advantage across precision Hamiltonians and field theories.

    Sensitivity analysis: The single evidence record whose removal would most
    change this case verdict is ZW-E001 (Müller 2020). If the mathematical proof
    of external-world emergence from universal induction were invalidated or
    removed, algorithmic idealism would lose its only rigorous anchor, and the
    case verdict would collapse from presently untestable into weakly supported
    or contradicted.
  steelman: Algorithmic idealism provides an exact, principled mathematical
    mechanism that eliminates cosmological observer-selection paradoxes and
    Boltzmann brains by showing that transitions out of lawful histories are
