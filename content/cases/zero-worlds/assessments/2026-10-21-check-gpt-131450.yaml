  synthesis: >-
    The evidence establishes a substantial formal research program but does not
    establish its featured ontology. Müller's framework is not merely a verbal
    idealism: ZW-E001 reports asymptotic theorems under which self-states
    governed by universal induction encounter stable, apparently objective,
    computable regularities. This is meaningful evidence that an observer-first
    formalism can represent the appearance of a lawful world without placing
    that world among its primitives. The preliminary Bell-with-no-signalling
    result also provides a genuine, though heavily conditioned, starting point.
    The reconstruction theorems independently show that quantum theory can be
    recovered from sufficiently strong operational principles, so deriving
    physics from nonstandard primitives is not inherently an empty ambition.

    That positive case stops before the crucial ontological conclusion. The
    emergence theorem demonstrates consistency or representational sufficiency
    within a model; it does not show that first-person states are what
    fundamentally exist. More importantly, the records directly document that
    algorithmic idealism has not selected the distinctively quantum package.
    Müller calls genuinely quantum statistics an open test, Hoffman supplies a
    restricted wavefunction correspondence rather than general quantum theory,
    and the Wolfram literature assumes a Born weighting while deriving CHSH
    violation through explicit nonlocality without deriving the Tsirelson cap.
    The reconstruction theorems cannot be transferred across this gap: their
    operational axioms are the destination that observer-first postulates would
    still have to entail.

    The strongest physicalist reading is therefore that these programs currently
    accommodate, learn, or embed structures that conventional quantum theory
    already predicts quantitatively. Spekkens' toy model reinforces the warning
    that quantum-looking equations and phenomena need not supply the
    specifically quantum correlation structure. Conversely, the strongest
    observer-first reply is that the framework addresses first-person and
    self-locating questions that standard operational reconstructions presuppose
    away, and that deriving the appearance of an external world is explanatory
    work even before the quantum bridge is complete. Nothing in the records
    proves that an observer-independent ontology is necessary.

    The resulting case verdict is presently_untestable, not contradicted. Bell
    and local-friendliness experiments constrain conjunctions of locality,
    realism-like assumptions, and absoluteness, but do not choose between the
    competing ontologies. Most decisively, ZW-E021 records agreement between
    critic and proponent that algorithmic idealism cannot yet connect its
    distinctive private probabilities to repeated, intersubjectively assessed
    frequencies. This conclusion relies mainly on the records rather than on a
    prior against idealism, although the general underdetermination of ontology
    by empirically equivalent formalisms informs the calibration.

    Sensitivity: removing ZW-E021 would change the assessment most because it is
    the clearest direct concession concerning operational testability. The
    verdict nevertheless survives without it: ZW-E003 and ZW-E023 leave the
    quantum predictions unfinished, while ZW-E017 and ZW-E018 supply benchmarks
    that do not discriminate the ontologies. Confidence in the testability
    diagnosis would be lower, but the case would not change verdict.
  steelman: "The unanswered pro-hypothesis argument is the self-locating one: in
    exact observer duplication, teletransportation, or simulation shutdown, a
    complete third-person physical description does not itself specify which
    future experience the present subject should anticipate, whereas Müller's
    universal-induction rule supplies a continuation measure from the
    self-state. None of the evidence records derives an equally general
    first-person rule from physicalism or tests the rival probabilities in such
    a scenario."
