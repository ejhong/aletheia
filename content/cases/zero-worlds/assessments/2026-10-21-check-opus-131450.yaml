  synthesis: >-
    The featured hypothesis, ZW-C008, makes two claims at once. The ontological
    claim is that no observer-independent world is fundamental. The sufficiency
    claim is that first-person informational states plus a lawlike inductive
    rule suffice, and that the physical world, 'ultimately including quantum
    theory', is derivative. The ledger locates the hypothesis precisely.

    The observation rung is solid but mostly neutral. Finite-dimensional quantum
    theory has been reconstructed from operational axioms in independent theorem
    sets (C001, established). Those theorems are ontology-neutral, though: they
    supply the destination of the bridge, not support for crossing it. No
    observer-first program has derived the distinctively quantum package (C002),
    and the flagship proponent concedes this in the conclusions of his
    Foundations of Physics paper (E023). The Bell and local-friendliness
    experiments price conjunctions of assumptions without discriminating between
    the ontologies (C003).

    The mechanism rung holds one genuine formal achievement and several weaker
    results. Müller's emergence theorem (C004, E001) shows, inside an idealized
    non-forgetting bit model, that an observer should expect an apparently
    objective world with simple computable laws. Its Boltzmann-brain dissolution
    is challenged in print. Müller defends it with a reply he himself calls
    'valid intuition, but not the exact technical arguments' (E022). His Bell
    result is a valid theorem that he describes as 'preliminary' (C005).
    Hoffman's program owns a real game-theoretic theorem and a free-particle
    form-match (C006). The Wolfram program's most formal quantum paper calls its
    derivation a conjecture, stipulates the Born rule, and obtains CHSH
    violation without the Tsirelson cap (C505, C007). Its ruliad is also one
    vast world, not zero (E013). The case borrows a bar from Spekkens (E015),
    and Müller sets the same bar for himself (E023). By that bar, none of this
    yet reaches genuinely nonclassical statistics.

    Hence weakly_supported. It is not contradicted, because no record proves an
    obstruction. It is not presently_untestable, for two reasons. First, the
    sufficiency component can be confirmed or refuted now by desk mathematics: a
    Tsirelson-capped derivation, a derived purification axiom, or a no-go result
    would each move it. Second, the bare denial of an external world is
    empirically untestable, but so is its realist rival, so that untestability
    is not distinctive. It is not merely unresolved, because E001 is direct, if
    partial, evidence for the sufficiency claim. The reversal demonstrably
    outputs an apparently objective lawful world rather than assuming one, even
    if its simplicity prior does much of the work. Everything distinctive beyond
    generic lawfulness lacks support, and the proponent jointly concedes two
    objections as valid (E021, E022). The support attaches to the program's
    first stage. It does not attach to the denial of an external world, on which
    no record bears.

    Steelman for: physicalism posits quantum structure rather than deriving it,
    and the reconstructions relocate the mystery into axioms whose origin the
    ledger records as open (E007, E008). Only the observer-first framework
    attempts to explain lawfulness itself. It also addresses first-person
    probability in the 'Restriction A' scenarios that Jones and Müller show to
    be a single non-quantum problem (E004). The local-friendliness theorem taxes
    absoluteness of observed events, which this view never assumed (E018).

    Steelman against: universal induction learns any computable measure, so
    learning quantum statistics is not explaining them (C009). The
    reconstructions already deliver the formal compression without the ontology.
    Even QBism imports the Born rule (E009). Only physicalist quantum theory
    yields Hamiltonians, field theory and precision predictions. Finally, the
    framework cannot yet connect its probabilities to repeated, intersubjective
    experiments (E021), an obstacle logically prior to the bridge theorem C010
    names.

    Sensitivity: the single most consequential record is ZW-E001. Without it,
    the hypothesis retains no formal positive support beyond the proponent's own
    description of a preliminary Bell theorem (E003), and the verdict would fall
    to unresolved. The verdict therefore does not survive its removal: the
    'weakly supported' hangs on this one record. That record is itself
    characterized from the abstract and the author's exposition, not from a
    re-derived proof. The downward pressure, by contrast, is redundant: E002,
    E003, E010, E020 and E023 each attest the gap, so no single removal would
    raise the verdict.

    Provenance: no record in the packet is marked provisional. E019 is
    abstract-level context about a state-realist framework and bears on no
    observer-first claim. Records E020 to E023 and claim ZW-C505 were extracted
    by the same model family running this check, so agreement with them is not
    independent confirmation. E021's editorial inference reports a prior grading
    of ZW-C008 as presently untestable. I treated that as editorial inference,
    not evidence, and depart from it for the reasons given above.
  steelman: Jones and Müller (E004) show that extended Wigner's-friend scenarios,
    agent duplication and the Boltzmann-brain problem share one structure,
    'Restriction A'. In each, a world-first physical theory may fail to provide
    a single probabilistic description of the observations of all agents, and
    the difficulty does not depend on quantum mechanics. Physicalist quantum
    theory's quantitative successes therefore do not touch it, and nothing in
    this ledger supplies a physicalist answer to it. Algorithmic idealism is the
    one framework here built to answer it. It makes 'what should I expect to
    experience next?' fundamental (E002), and it derives, rather than posits,
    the expectation of a simple lawful world (E001). This assessment grades the
    hypothesis on whether it derives quantum theory. It never tests whether a
    world-first theory can assign first-person probabilities in Restriction-A
    cases. A proponent rightly points out that the reversal's claimed advantage
    there stands unrebutted and is independent of the quantum gap.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    reasoning: "Three strong records (E006, E007, E008) attest the theorem sets. The
      Chiribella–D'Ariano–Perinotti and Masanes–Müller derivations are refereed
      results that take operational convex frameworks, not Hilbert space,
      complex amplitudes or the trace rule, as primitives. The records are
      abstract-level, so 'rigorous' leans partly on more than a decade of
      independent re-use and refinement of these proofs; that is background
      knowledge, disclosed as such. Strongest opposing consideration: Hardy 2001
      was never refereed, and its axioms, including a minimality ('simplicity')
      assumption, were refined by successors (E008 limitation), so a strict
      reader counts two refereed sets plus a founding derivation; all three are
      also finite-dimensional, leaving Hamiltonians, locality and field theory
      outside (E006). Though locally true, the claim lends ZW-C008 nothing
      directly, because the reconstructions are ontology-neutral and fix only
      the destination of any bridge."
