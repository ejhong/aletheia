  - claimId: ZW-C505
    verdict: well_supported
    reasoning: 'Each element is quoted from the paper: the derivation of quantum mechanics is "our central conjecture"; branch states form an orthonormal basis "by assumption" and probabilities are "given by the multiway Born rule"; CHSH violation is proved "in much the same way" as in deterministic nonlocal interpretations. The Tsirelson clause rests on a search of the full text that found no derivation of the bound; the convergence proof itself was not audited.'
    confidence: moderate
    treatment:
      plainLanguage: The Wolfram program's most formal quantum paper goes further than an embedding — it claims to prove that its branching computations take on the geometry of quantum state space. But its author calls the derivation of quantum mechanics a conjecture, writes in the Born rule rather than deriving it, and gets Bell-type correlations the way any openly nonlocal model does.
      importance: supporting
      diagnosticity: moderate
      diagnosticitySummary: "It locates exactly where the most formal neighbouring program stops: the probability rule and the cap on correlations — the two benchmarks this case uses — are posited or absent, so the paper shows accommodation of quantum mechanics, not selection of it."
      strongestObjection: Stipulating the Born rule is what standard quantum mechanics does too; if the paper's convergence theorem holds, the remaining step may be small, and an outside audit could find the Born form forced by the geometry the paper derives.
      whatWouldChangeOurMind:
        - An outside audit showing the multiway construction forces the squared-amplitude rule and caps correlations at 2√2.
        - Later work in the program deriving either benchmark, which would supersede this paper's conjectural status.
  - claimId: ZW-C008
    verdict: presently_untestable
    reasoning: "Nothing in the current record supports or contradicts the thesis over its physicalist rival, because both accommodate all existing data. The McQueen–Müller exchange makes the reason concrete: with the proponent's assent, the framework's probabilities cannot yet be related to experiments repeated under identical conditions and analyzed from a shared third-person view. Its scientific content is the research program it generates."
    confidence: high
    treatment:
      plainLanguage: "The featured thesis, at full strength: zero worlds. Not \"spacetime is emergent,\" not \"the quantum state is knowledge,\" but no world underneath at all — the observer's informational state and a law of what to expect next are the whole inventory, and everything physics describes is output."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the thesis itself; everything below it on the ladder exists to test it against the physicalist rival.
      strongestObjection: A thesis that no present observation can touch, whose quantum content is conceded to be underived, and whose distinctive predictions live in scenarios (duplication, simulation shutdown, teletransportation) no one can run, does no explanatory work the ontologically neutral reconstructions do not already do.
      whatWouldChangeOurMind:
        - Resolution of the bridge problem in either direction.
        - An operationalized first-person protocol with a prespecified quantitative deviation, and a stated route from private outcomes to shared statistics.
  - claimId: ZW-C009
    verdict: well_supported
    reasoning: "Every component is documented from the proponents' side of the ledger: induction's unselectivity is visible in Müller's own consistency argument; the underived Born rule is conceded, and stipulated in the Wolfram program's formal paper; QBism treats the Born rule as an empirical normative addition; the quantitative gap is disputed by no one. What this claim does not establish is that the bridge can never be built."
    confidence: moderate
    treatment:
      plainLanguage: 'The rival account: the world is real, and the idealists have moved the mystery, not solved it. Their frameworks predict "a lawful world" but borrow the quantum part from experiment; the honest theorems in the neighbourhood need no idealism; and nothing in any observer-first program computes a spectrum, a coupling constant, or a cross-section.'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: 'The direct rival to the featured thesis, and exposed: it predicts the bridge theorems will not arrive. A derivation of the Tsirelson bound or the Born rule from observer-first postulates would falsify its central "explanatorily idle" charge.'
      strongestObjection: '"Relocated complexity" cuts against physicalism too: standard quantum theory buys its precision by taking the entire quantum formalism as primitive, which is the explanatory debt the reconstructions and the observer-first programs try to pay — and the physicalist has no non-circular account of why the operational axioms hold.'
      whatWouldChangeOurMind:
        - An observer-first derivation of any uniquely quantum quantitative structure (Tsirelson bound, Born coefficients, purification).
        - A theorem that universal induction, suitably constrained, favors quantum probability structure over classical.
  - claimId: ZW-C010
    verdict: well_supported
    reasoning: 'That the problem is precise, open, and decisive is common ground: Müller contrasts his framework with operational setups that presuppose jointly embedded agents, names reconstructing genuinely quantum phenomena as its main goal, and says building the formalism in would be methodologically wrong. The contestable part is "would settle most of the case" — a negative resolution would leave weaker observer-first positions standing.'
    confidence: moderate
    treatment:
      plainLanguage: Unusually for a metaphysical dispute, there is an exact statement of what victory looks like. The right-hand half of the derivation — operational axioms to quantum mechanics — is proven. The left-hand half — observer to operational axioms — is not. Prove it and zero worlds becomes physics; prove it impossible and zero worlds becomes decorative.
      importance: major
      diagnosticity: high
      diagnosticitySummary: "This is the crux that converts the attribution dispute into mathematics: it determines how much anything else here can ever mean."
      strongestObjection: 'The bridge may be unprovable rather than provable-or-refutable: "observer" may never be formalized tightly enough for a theorem to bind it — the Wolfram circularity problem, and the McQueen objection about what the probabilities are probabilities of, generalized.'
      whatWouldChangeOurMind:
        - A published observer-to-operational-axioms bridge theorem, a Tsirelson-bound derivation, or a no-go result.
        - A demonstration that the bridge question is ill-posed, which would demote this claim's 'precisely posed' clause.
