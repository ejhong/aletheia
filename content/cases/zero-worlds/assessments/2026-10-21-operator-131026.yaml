  synthesis: "The ladder still separates at the mechanism–attribution joint, and this pass strengthens the observation rung's central fact rather than moving any verdict on the thesis. Three reconstruction theorem sets establish ZW-C001. ZW-C002 now rests on the framework's peer-reviewed statement itself (ZW-E023): quantum phenomena are its test, Bell violation with no-signalling the target, and resembling mathematics explicitly does not count. The Wolfram program, the boldest of the three, turns out to have a more formal quantum paper than the case had weighed (ZW-E020). It claims a convergence proof to projective Hilbert space, but it calls the derivation of quantum mechanics a conjecture, posits the Born rule, and gets CHSH violation from explicit nonlocality. That supports ZW-C505 and the substance of ZW-C007: ambition beyond embedding, with no demonstrated inevitability. At the mechanism rung, ZW-C004's theorems stand, but the McQueen–Müller exchange (ZW-E022) contests the Boltzmann-brain dissolution, and the authors agree further work is owed. The same exchange records, with the proponent's assent, that the framework's probabilities cannot yet be tied to repeated intersubjective experiments (ZW-E021). This is the concrete reason ZW-C008 is presently untestable rather than weakly supported or refuted. The experiments (ZW-E017, ZW-E018) remain benchmarks: every contender predicts their statistics. Sensitivity: removing ZW-E001 would collapse the mechanism rung to aspiration. The case verdict would survive, because it rests on the absence of a bridge theorem, which nothing in the ledger supplies."
  steelman: The thesis's best unanswered argument is that the bar this case applies is one physicalism does not meet either. Standard quantum theory takes Hilbert space and the Born rule as primitives; the reconstructions derive them from operational axioms but cannot say why nature obeys those axioms. An observer-first program that has already derived a lawful, computable external world from two postulates — a real theorem — has paid part of a debt physicalism never acknowledges. Müller states the quantum test in advance and refuses to build the formalism in, which is how a research program exposes itself to failure. Wolfram's program has a formal paper claiming derivations of the path integral and Schrödinger dynamics in its own terms. On this view "not yet derived" is the ordinary condition of young theories, and the realist's own commitments — a world whose existence no observation could ever confirm independently of observers — are no more testable than the idealist's.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    reasoning: "Peer-reviewed theorems in mainstream physics venues, standing for fifteen to twenty-five years and contested by no side of this case. What they establish is conditional: quantum theory follows once the operational axioms are granted."
    confidence: high
    treatment:
      plainLanguage: "The mathematical half of the observer-first dream is real: you do not have to postulate the strange quantum formalism. Assume a handful of plain statements about information — how systems compose, what can be distinguished, that transformations are reversible and continuous, that mixed states can be purified — and quantum mechanics falls out as a theorem."
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: "Load-bearing for the case's architecture but neutral between ontologies: the reconstructions prove the second half of a two-stage derivation while saying nothing about whether the first half — from observers to operational axioms — can be built."
      strongestObjection: The axioms may already smuggle in most of what is distinctly quantum — purification in particular does heavy lifting — so "derived from information principles" is explanatory compression, not creation from nothing; why nature satisfies those principles remains open.
      whatWouldChangeOurMind:
        - A demonstrated flaw in one of the reconstruction proofs (none is currently alleged).
        - A theorem showing the axiom sets are secretly equivalent to postulating Hilbert space outright, which would deflate the compression claim.
  - claimId: ZW-C002
    verdict: well_supported
    reasoning: "Supported from inside every program, now in the flagship's peer-reviewed words: Müller's 2026 conclusions say a successful formalization should predict genuinely quantum phenomena, that his sketched Bell explanation needs further elaboration, and that resembling mathematics does not count. Hoffman's results are correspondences with a free-particle wavefunction. The Wolfram program's formal paper states its quantum derivation as a conjecture and posits the Born rule. No proponent claims the package derived."
    confidence: high
    treatment:
      plainLanguage: "The gap at the center of the case: the programs that demote the external world have not yet earned the physics. Their leading theorist says so in a refereed paper — reproducing genuinely quantum statistics is the framework's test, and it has not been passed. What exists are partial correspondences, a stipulated Born rule in one program, and one preliminary theorem."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: This is the structural fact the whole case turns on. If the gap closes in the idealist direction, the featured thesis acquires real content; while it stays open, "quantum mechanics from the observer" is a research program, not an explanation.
      strongestObjection: "\"Not yet derived\" is the normal condition of ambitious research programs, not evidence against them — general relativity was not derived from Mach's principle either, and the 2020 preliminary Bell theorem shows the direction is not hopeless."
      whatWouldChangeOurMind:
        - Publication of an observer-to-operational-axioms bridge theorem, which would narrow or close the gap.
        - An outside audit showing the Wolfram multiway construction forces the Born rule and the Tsirelson cap from its observer assumptions.
        - A no-go theorem showing observer-first postulates cannot single out quantum structure, which would harden the gap into a wall.
  - claimId: ZW-C003
    verdict: well_supported
    reasoning: "The experimental results are among the most secure in physics. The non-discrimination point is a matter of logic: theories that reproduce quantum statistics cannot be separated by experiments that confirm quantum statistics."
    confidence: high
    treatment:
      plainLanguage: The experiments closest to this dispute referee it without picking a winner. Bell tests rule out local hidden variables; the Wigner's-friend theorem prices observer-independent "facts" — but every serious contender here, idealist or physicalist, already accepts quantum mechanics' predictions, so no current data separates them.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: "Disciplines the debate in both directions: it blocks proponents from citing Bell or Wigner's-friend results as evidence that observation creates reality, and it sets the benchmark — Tsirelson-bounded nonlocality — that any genuine derivation must hit."
      strongestObjection: "The symmetry is imperfect: the Wigner's-friend theorem specifically taxes theories with absolute observed events, a real cost for ordinary physicalism that observer-relative frameworks do not pay — the constraint is not neutral even if it is not a discriminating test."
      whatWouldChangeOurMind:
        - A prespecified, quantitative observer-first deviation from quantum predictions surviving a real experiment — which would move this from benchmark to test.
  - claimId: ZW-C004
    verdict: well_supported
    reasoning: "The emergence theorems are published, peer-reviewed, and unchallenged as mathematics; their caveats are of scope — an idealized bit model without forgetting, uncomputable induction, machine-dependent constants. The claim's second clause is weaker: the Boltzmann-brain dissolution is now contested in print by a realist collaborator, defended by Müller as \"valid intuition, but not the exact technical arguments\", and both authors agree the role of the inaccessible part of a self-state needs further work."
    confidence: moderate
    treatment:
      plainLanguage: "The flagship program is not hand-waving: a 2020 paper in a mainstream quantum journal proves that an observer with nothing but a current informational state and an exact version of Occam's razor should expect to find itself in a stable, lawful world. Its further claim — that you should never expect to be a Boltzmann brain — is defended but now openly contested."
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Proves the reversal is not empty philosophy — a lawful world really can be output rather than input. But emergence of some computable lawful world is what the physicalist expects too, for different reasons, so the theorem does not by itself favor idealism.
      strongestObjection: The bit model packs an observer's entire past into its state and forbids forgetting, which Müller himself calls unmotivated and unrealistic; and a realist critic argues that a Boltzmann brain's full self-state would encode its hostile environment, so the paradox is relocated rather than dissolved.
      whatWouldChangeOurMind:
        - A formulation with forgetting that preserves (or breaks) the emergence theorem — Müller's own stated open problem.
        - A technical treatment of partly inaccessible self-states that settles the Boltzmann-brain exchange either way.
        - A demonstrated error in the 2020 proofs.
  - claimId: ZW-C005
    verdict: provisionally_supported
    reasoning: Both halves are documented in the theorist's own words. The asymptotic consistency result is solid but unselective; the Bell theorem is genuine but, per its author, preliminary, and his 2026 paper repeats that the Bell explanation "needs further elaboration". The characterization follows Müller's hedged framing rather than the stronger glosses that circulate.
    confidence: moderate
    treatment:
      plainLanguage: "Where the flagship program stands on quantum mechanics: it is compatible with quantum physics (because universal induction learns whatever lawful world produces your data), and it has one genuine quantum foothold — a real but heavily conditioned theorem about Bell violations. Compatibility is cheap; the foothold is preliminary; the derivation is missing."
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: The preliminary Bell theorem is the most quantum-specific result any observer-first program owns, which makes it the natural seed for the bridge project — and its "too many assumptions" status is a fair measure of how far the bridge has been built.
      strongestObjection: 'Consistency with quantum mechanics is consistency with anything computable: a classical stochastic world and a post-quantum no-signalling world would be "learned" equally well, and a theorem that Bell violation "can sometimes be expected" under extra assumptions is not a prediction that it must occur with quantum statistics.'
      whatWouldChangeOurMind:
        - Strengthening of the 2020 Bell result to fewer assumptions, or a Tsirelson-bound derivation.
        - A proof that the framework equally 'expects' superquantum no-signalling correlations, which would blunt the foothold.
  - claimId: ZW-C006
    verdict: provisionally_supported
    reasoning: "The Fitness-Beats-Truth theorem and the wavefunction correspondence are published and verifiable as mathematics. Their reach is what is contested: the theorem concerns perception's veridicality under model assumptions, not ontology, and the authors present conscious realism as a hypothesis to be developed. This session's search found no newer Hoffman derivation of quantum theory."
    confidence: moderate
    treatment:
      plainLanguage: 'The consciousness-first neighbour has real mathematics in two places: a theorem that natural selection can favor useful perception over true perception, and a demonstration that a certain network of "conscious agents" reproduces the form of one simple quantum object. Between those results and "consciousness generates quantum physics" lies everything that has not been done.'
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A correspondence with one structural component of quantum mechanics is the kind of resemblance Spekkens' toy theory shows to be inexpensive; it neither confirms nor embarrasses the featured thesis.
      strongestObjection: "The inference chain breaks twice: that selection need not favor veridical perception does not imply consciousness is fundamental, and a Markov chain whose harmonic functions match a free-particle wavefunction does not imply agents underlie physics."
      whatWouldChangeOurMind:
        - A conscious-agent derivation of nonclassical correlations (Tsirelson, not just no-signalling) or of amplitude addition.
        - Publication of the promised particle-physics predictions from decorated-permutation dynamics.
  - claimId: ZW-C007
    verdict: well_supported
    reasoning: "Each element is verified in the primary texts: Wolfram's derivation claim and his circularity admission are verbatim from his essay, and his derivations from observer features are informal. The earlier mixed grade judged the program rather than the report. One clause understated the record: the program's formal quantum paper (Gorard 2020) claims more than an embedding — a convergence proof to projective Hilbert space. But it states the quantum derivation as a conjecture and posits the Born rule, so the claim's substance holds: no demonstrated inevitability."
    confidence: moderate
    treatment:
      plainLanguage: "The computational neighbour makes the boldest derivation claim of the three. The ruliad — the limit of all possible computations — is supposed to look quantum-mechanical to any bounded, persistent observer. What exists on paper: informal essays, a formal paper that builds quantum-like geometry into a rewriting framework but calls the derivation of quantum mechanics a conjecture, and the author's admission that defining an observer is \"at least on the face of it circular.\""
      importance: supporting
      diagnosticity: low
      diagnosticitySummary: A derivation claim that its own formal paper labels conjecture cannot move the case until it becomes checkable; its role is to mark the second place, after Müller, where the observer-to-quantum bridge is promised.
      strongestObjection: "The program's formal output is larger than its critics usually allow: a 62-page paper with claimed proofs of Hilbert-space convergence and derivations of the path integral and Schrödinger dynamics. Judging the program by Wolfram's essays rather than that paper undersells it."
      whatWouldChangeOurMind:
