caseAssessment:
  verdict: presently_untestable
  whatIsClaimed: No observer-independent physical world is fundamental. What exists at bottom are first-person informational states and a lawlike rule — universal induction — fixing what each observer should expect next; the lawful external world is an emergent regularity, provably so within Müller's model. Hoffman's conscious agents and Wolfram's ruliad make the same demotion with different primitives. At full strength, quantum theory itself — complex Hilbert space, the Born rule, Tsirelson-bounded nonlocality — should follow from observer-first postulates alone.
  whereDisagreementLives: The disagreement is over a missing bridge, not over the reconstruction theorems or any experiment. Everyone grants that quantum theory follows from operational axioms, and no experiment separates the ontologies. Do observer-first postulates entail those axioms? Or does universal induction, which would learn any computable law, merely accommodate quantum mechanics? A second dispute, now argued in print between Müller and a realist philosopher, is whether the framework's first-person probabilities have a clear meaning at all.
  whatWouldSettleIt: Mathematics before instruments. A theorem deriving an operational state space — and ultimately the Tsirelson bound, purification, or the Born rule's form — from self-states plus induction would turn the metaphysics into physics; a proof that the postulates cannot single out quantum structure would strand it. For the Wolfram program, an outside audit of whether its multiway construction forces the Born rule and the Tsirelson cap would settle its part. Reproducing quantum-looking mathematics settles nothing.
  bestConventionalExplanation: "The physical world is fundamental, and the observer-first programs have relocated complexity rather than removed it. Universal induction converges to whatever computable law generates the data, so it explains why some lawful world appears but not why the world is quantum rather than classical, stochastic, or post-quantum. The quantum structure is imported from experiment, as QBism imports the Born rule, and as the Wolfram program's formal paper stipulates it for path weights. The explanatory compression the idealists promise is already delivered, with theorems, by the operational reconstructions, which need no idealism. And standard physicalist quantum theory keeps a decisive quantitative advantage: Hamiltonians, field theory, particle spectra, precision predictions. A theory with \"only self-states\" wins economy only if its laws recover that structure; until then the complexity has moved from the noun list into the transition rule."
