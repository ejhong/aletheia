  synthesis: "The case divides cleanly along its own rung structure, and the
    division holds. On the observation rung, the record is strong: the
    reconstruction theorems (ZW-C001) are backed by three independent, published
    theorem sets read at the source level, and the derivation gap (ZW-C002) is
    not an outsider's complaint but is conceded by the flagship program's own
    author in a peer-reviewed paper (ZW-E023) and in his own exposition
    (ZW-E003). The Wolfram program's most extended formal quantum paper states
    its central derivation as a conjecture, states its Born rule without
    deriving it, and obtains CHSH violation from explicit nonlocality (ZW-E020,
    ZW-C505) — which, read against the Spekkens calibration (ZW-E015), is
    exactly the signature of a theory that hosts quantum look-alikes without
    selecting quantum statistics. Hoffman's program owns a real theorem and a
    real correspondence, neither of which reaches the nonclassical bar (ZW-E010,
    ZW-E011). On the mechanism rung, algorithmic idealism has a proven emergence
    theorem in an idealized bit model, but its \"dissolution\" of the
    Boltzmann-brain puzzle is contested in print by its own adversarial
    collaborator and defended as intuition rather than technical argument
    (ZW-E022), and the erasure problem is an acknowledged structural open wound
    (ZW-E023, ZW-C504). On the attribution rung, the featured thesis (ZW-C008)
    has no derivation of quantum structure behind it and, by the joint
    concession of both authors of the adversarial collaboration, no way yet to
    connect its distinctive probabilities to repeatable, intersubjectively
    checked experiments (ZW-E021, ZW-E025). That concession, not any outside
    skepticism, is what fixes the case verdict: the thesis is neither supported
    nor refuted by any measurement on record, and its decisive test is a missing
    theorem (ZW-C010), not a missing observation. Steelmanning the physicalist
    side: the steelman claim (ZW-C009) is well supported by QBism's own
    concession and the unselectivity of universal induction. Steelmanning the
    Zero Worlds side: the emergence theorem is genuine peer-reviewed mathematics
    showing the ontological reversal can output a lawful world, and nothing in
    the ledger proves the postulates cannot be extended — the proponents publish
    their own limitations, which is how a live research program behaves. The
    honest current answer to the case's title question is: not yet, by the
    proponents' own accounting, and no existing experiment can break the tie."
  steelman: "The strongest unanswered argument for the featured hypothesis is that
    the general shape of the bridge theorem has already been achieved once:
    ZW-E019 records a preprint claiming to derive the Born rule, Lüders
    updating, interference, and Tsirelson-bounded Bell violation from structural
    limits on an embedded observer's access to an underlying reality. Nothing in
    this ledger shows that Müller's Self States plus State Change postulates
    cannot play the same access-limitation role; theAccessibility result is
    state-realist only because its author chose that ontology, and the proven
    theorem demonstrates that \"operational quantum from observer limits\" is a
    mathematically live route, not a category error. Combined with the proven
    emergence theorem (ZW-E001) and the fact that Müller himself co-authored one
    of the reconstruction theorem sets (ZW-E006) — so the person best placed to
    know the gap is also best placed to close it — a proponent can rightly say:
    the case shows the bridge is unbuilt, but it contains no no-go theorem, no
    failed derivation, and no experiment that discriminates against
    observer-first ontology. Absence of a bridge theorem is not evidence that no
    bridge exists, and the ledger's own research agenda (ZW-R001–R004) concedes
    that either outcome — proof or obstruction — would be new mathematics not
    currently on record."
