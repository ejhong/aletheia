  synthesis: >-
    The evidence establishes an important but limited positive result: Müller's
    algorithmic idealism is a mathematically explicit observer-first framework,
    and ZW-E001 reports a theorem under which universal induction over
    self-states yields the expectation of a stable, apparently objective world
    governed by simple computable probabilistic laws. This is more than an
    ontological slogan. It demonstrates, within an idealized bit-string model,
    that lawful-world appearance can be an output rather than a primitive
    assumption. The preliminary result that Bell violation with no-signalling
    can sometimes occur also gives the program a genuine mathematical foothold.
    These results support the coherence and research value of the observer-first
    reversal, although ZW-E022 shows that the claimed dissolution of the
    Boltzmann-brain problem remains contested and the framework still has an
    acknowledged erasure problem.

    The decisive negative finding is equally clear. The reconstruction results
    in ZW-E006 through ZW-E008 show that finite-dimensional quantum theory can
    be obtained from operational principles, but none of the supplied evidence
    derives those principles from observer-first postulates. Müller explicitly
    calls genuinely quantum statistics an open test and says that formal
    resemblance is insufficient. Hoffman's records provide an evolutionary
    theorem and a free-particle wavefunction correspondence, not the Born rule,
    composition, or entanglement structure. Wolfram's program contains more
    formal work than a mere embedding: ZW-E024 reports claimed Hilbert-space
    convergence and Schrödinger and path-integral results. Nevertheless, its
    extended quantum paper labels the general derivation a conjecture, states a
    multiway Born rule without a located derivation, and obtains CHSH violation
    through explicit nonlocality without a located Tsirelson bound. Wolfram's
    ruliad is also a vast underlying structure rather than Müller's literal
    zero-world ontology.

    The strongest physicalist case is therefore that the programs presently
    accommodate or learn lawful quantum data without selecting the quantum
    package from their own primitives. Operational reconstructions already
    provide substantial formal compression, while ordinary quantum physics
    supplies the quantitative machinery; that last comparison partly rests on
    general scientific background rather than a dedicated evidence record. The
    observer-first reply is that operational reconstructions assume exactly the
    structural principles needing explanation and do not address private
    first-person continuation problems, whereas Müller's emergence theorem and
    exotic-scenario analyses target that deeper explanatory level.

    The featured ontological thesis is graded presently_untestable rather than
    contradicted. ZW-E025 records the proponent's agreement that the framework's
    probabilities cannot yet be related generally to repeated, intersubjectively
    checked experiments, and the Bell and Wigner's-friend benchmarks do not
    choose between the ontologies. The proposed bridge theorem is mathematically
    investigable and could establish or obstruct quantum sufficiency, but it has
    not been supplied and would not by itself prove that no observer-independent
    world exists. Sensitivity is greatest to ZW-E025: removing it would
    eliminate the most direct concession supporting the present-testability
    verdict. The verdict nevertheless survives, at reduced confidence, because
    ZW-E021 records the same operational deficiency in the adversarial
    collaboration and no evidence record supplies a distinctive, publicly
    checkable prediction.
  steelman: In observer-duplication, teletransportation, simulation-shutdown, and
    Boltzmann-brain cases, universal induction offers native first-person
    continuation probabilities where a single world-based history does not
    identify which future experience is “mine.” This assessment does not show
    that a realist framework supplies equally principled answers or that
    algorithmic idealism's answers fail; the absence of a protocol connecting
    those private probabilities to shared frequencies leaves that proposed
    explanatory advantage unanswered.
