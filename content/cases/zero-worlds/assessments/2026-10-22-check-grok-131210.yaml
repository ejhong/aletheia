  synthesis: >-
    The case separates cleanly into what has been proved, what has been
    conceded, and what remains open. On the observation rung, three independent
    reconstruction theorem sets (Hardy; Chiribella–D'Ariano– Perinotti;
    Masanes–Müller) establish that finite-dimensional complex quantum theory can
    be recovered from operational and informational axioms without taking
    Hilbert space or the Born rule as primitives (ZW-C001). That half of the
    bridge is real mathematics. The other half is not: no observer-first program
    — algorithmic idealism, conscious agents, or the ruliad — has derived the
    distinctively quantum package (complex Hilbert space, Born rule,
    Tsirelson-bounded nonlocality) from its own non-material primitives, and
    Müller himself states in peer- reviewed conclusions that genuinely quantum
    phenomena remain an open technical target and that resemblance of equations
    is not enough (ZW-C002, ZW-E003, ZW-E023). Loophole-free Bell tests and the
    local- friendliness experiment constrain conjunctions of assumptions but do
    not empirically select observer-first ontologies over physicalist readings
    (ZW-C003).

    On the mechanism rung the programs differ sharply in delivery. Müller's
    framework is the only one with proven asymptotic theorems: self-states plus
    universal induction yield an apparently objective external world governed by
    simple computable probabilistic laws, with Boltzmann-brain transitions
    algorithmically disfavored (ZW-C004, ZW-E001). A preliminary
    Bell-plus-no-signalling result exists but is explicitly conditioned on too
    many assumptions (ZW-C005). Hoffman's program owns the Fitness-Beats-Truth
    theorem and a free-particle wavefunction correspondence, nothing approaching
    general quantum structure (ZW-C006). Wolfram's observer theory asserts that
    GR, QM, and the Second Law follow from computational boundedness plus belief
    in persistence, yet the claim is hedged, the observer concept is
    acknowledged as circular, and the program's most extended formal quantum
    paper (Gorard 2020) labels its central derivation a conjecture, states a
    multiway Born rule without deriving the squared form, and obtains CHSH
    violation from explicit nonlocality with no Tsirelson bound found (ZW-C007,
    ZW-C505). Spekkens' toy theory supplies the calibration: interference
    analogues and entanglement-like correlations can be faked classically; Bell
    violation and contextuality cannot.

    On the attribution rung the featured ontological claim — that no
    observer-independent physical world is fundamental and that quantum theory
    is derivative of first-person induction (ZW-C008) — is not established by
    the emergence theorems alone. Those theorems show that a lawful world can
    appear in the model; they do not show that the emergent laws must be
    quantum, nor that the ontology is forced. The framework's own adversarial
    collaboration records that its probabilities do not yet connect to
    repeatable, intersubjective frequencies (ZW-E025). The physicalist steelman
    therefore retains force: universal induction learns any computable
    regularity and so does not select quantum structure; the reconstructions
    already deliver the explanatory compression without ontological reversal;
    and standard quantum theory retains unmatched quantitative reach (ZW-C009).
    The decisive open problem is precisely posed: a bridge theorem from
    observer-first postulates to the operational principles (convex state
    spaces, purification, continuous reversibility) from which the
    reconstructions derive quantum theory, with Tsirelson and Born-rule measure
    selection as concrete targets (ZW-C010). Until that theorem or a no-go is
    proved, the case is unresolved. The verdict hangs primarily on the
    documented derivation gap and on Müller's own published framing of quantum
    phenomena as the framework's unfinished test; remove those admissions and
    the gap claim weakens, but the absence of a completed derivation would
    remain.
  steelman: Müller's 2020 emergence theorems already prove that a stable, simple,
    apparently objective external world with computable probabilistic laws can
    be derived as an asymptotic consequence of pure first-person induction
    without postulating any world underneath, and the same framework dissolves
    Boltzmann-brain and simulation-shutdown puzzles by first-person continuation
    probabilities in a way physicalist third- person counting still finds
    paradoxical; the heavily conditioned 2020 result that Bell violation with
    no-signalling can sometimes be expected is an existence proof that
    nonclassical correlations are not alien to the postulates, and no no-go
    theorem in the record shows that tightening those assumptions cannot reach
    the Tsirelson bound or select the Born measure — so the quantum gap is a
    live research target, not a demonstrated impossibility, while the
    classical-law half of the ontological reversal is already theorem-status.
