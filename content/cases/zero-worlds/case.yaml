id: ZW-001
slug: zero-worlds
title: "Zero Worlds"
subtitle: "Observer-first physics — Müller's algorithmic idealism, Hoffman's conscious agents, Wolfram's ruliad — says the external world is derived, not fundamental. Can any of these programs earn the quantum mechanics they promise to explain?"
domain: "Quantum foundations · Algorithmic information theory · Philosophy of physics"
status: active
summary: >-
  Start with a heresy: suppose there is no external world — not one world, not Everett's many, but zero. Markus Müller's algorithmic idealism builds physics from two postulates about observers and a universal inductive law, and proves that a lawful external world emerges as a theorem rather than an assumption. Donald Hoffman derives the demotion of spacetime from evolutionary game theory; Stephen Wolfram derives it from the structure of all possible computation. Meanwhile a separate, rigorous literature — the quantum reconstruction theorems — shows that quantum mechanics really can be recovered from abstract informational principles. The case turns on the bridge between the two: no observer-first program has yet derived the distinctively quantum part of physics from its own primitives, and its leading proponent says so in print.
