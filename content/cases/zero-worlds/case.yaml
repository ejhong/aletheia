id: ZW-001
slug: zero-worlds
title: "No World Underneath?"
subtitle: "Observer-first physics — Müller's algorithmic idealism, Hoffman's conscious agents, Wolfram's ruliad — says the external world is derived, not fundamental. Can any of these programs earn the quantum mechanics they promise to explain?"
domain: "Quantum foundations · Algorithmic information theory · Philosophy of physics"
status: active
summary: >-
  Start with a heresy: suppose there is no external world — not one world,
  not Everett's many, but zero. Markus Müller's algorithmic idealism builds
  physics from two postulates about observers and a universal inductive
  law, and proves that a lawful external world emerges as a theorem rather
  than an assumption. Donald Hoffman derives the demotion of spacetime from
  evolutionary game theory; Stephen Wolfram derives it from the structure
  of all possible computation. Meanwhile a separate, rigorous literature —
  the quantum reconstruction theorems — shows that quantum mechanics really
  can be recovered from abstract informational principles. The case turns
  on the bridge between the two: no observer-first program has yet derived
  the distinctively quantum part of physics from its own primitives, and
  its leading proponent says so in print.
whatIsClaimed: >-
  No observer-independent physical world is fundamental. What exists at
  bottom are first-person informational states ("self-states") and a
  lawlike rule — universal induction — governing what each observer should
  expect next. The apparently objective external world, with its simple
  computable laws, is an emergent statistical regularity, provably so
  within Müller's formal model. Neighbouring programs make the same
  demotion with different primitives: Hoffman's networks of conscious
  agents render spacetime a species-specific interface; Wolfram's ruliad
  makes physical law a consequence of how computationally bounded,
  persistent observers sample the space of all computation. The strongest
  version of the claim is that quantum theory itself — complex Hilbert
  space, the Born rule, Tsirelson-bounded nonlocality — should ultimately
  follow from observer-first postulates alone.
whereDisagreementLives: >-
  Not over the reconstruction theorems — everyone grants that
  finite-dimensional quantum theory can be rigorously derived from
  operational axioms. And not, currently, over any experiment: loophole-free
  Bell tests and Wigner's-friend no-go results constrain assumption bundles
  without discriminating observer-first ontologies from ordinary physicalist
  quantum mechanics. The crux is the missing bridge: whether the
  observer-first postulates entail the operational principles from which
  quantum theory follows, or whether universal induction — which would learn
  any computable law whatsoever — merely accommodates quantum mechanics the
  way it would accommodate classical physics, leaving the ontological
  reversal explanatorily idle.
whatWouldSettleIt: >-
  Mathematics before instruments. A theorem deriving an operational state
  space — and ultimately the Tsirelson bound, purification, or the Born
  rule's specific coefficients — from self-states plus universal induction
  would convert the metaphysics into physics; a proof that the postulates
  cannot single out quantum structure would strand it. Alternatively, a
  prespecified quantitative deviation from quantum predictions in an
  observer-copying or first-person-exotic regime, with the deviation fixed
  before data collection, would make the program empirically risky in the
  ordinary way. Reproducing things quantum mechanics already explains
  settles nothing — Spekkens' toy theory shows how cheap quantum
  resemblance is.
bestConventionalExplanation: >-
  The physical world is fundamental, and the observer-first programs have
  relocated complexity rather than removed it. Universal induction is
  Kolmogorovian at the meta-level: it converges to whatever computable law
  generates the data, so it explains why some lawful world appears but not
  why the world is quantum rather than classical, stochastic, or
  post-quantum — the quantum structure is currently imported from
  experiment, exactly as QBism imports the Born rule as an empirical
  normative addition. The explanatory compression the idealists promise is
  already delivered, with theorems, by the operational reconstructions —
  which remain ontologically neutral and require no idealism. And standard
  physicalist quantum theory keeps a decisive quantitative advantage:
  Hamiltonians, quantum field theory, particle spectra, precision
  predictions. A theory with "only self-states" wins ontological economy
  only if its laws recover that structure; until then, the complexity has
  moved from the noun list into the transition rule.
