- id: ZW-C502
  statement: >-
    Spekkens' toy theory reproduces a wide variety of quantum phenomena —
    interference analogues, no-cloning, teleportation, entanglement-like
    correlations — from classical states plus an epistemic restriction,
    while explicitly failing to reproduce Bell-inequality violation and
    Kochen–Specker contextuality.
  plainLanguage: >-
    The community's standing caution against being impressed too early:
    most of the quantum "look" is cheap to fake. Any observer-first
    derivation claim has to hit the two things the toy theory cannot —
    which is why this case treats Tsirelson-bounded nonlocality, not wave
    behavior, as the bar.
