- id: ZW-C009
  statement: >-
    The physicalist steelman: observer-first programs relocate complexity
    rather than reduce it — universal induction would learn any computable
    law and so explains nothing specifically quantum; the explanatory
    compression they promise is already delivered, ontology-free, by the
    operational reconstructions; and standard physicalist quantum theory
    retains a decisive quantitative advantage in Hamiltonians, field
    theory, and precision predictions.
  plainLanguage: >-
    The rival attribution: the world is real, and the idealists have moved
    the mystery, not solved it. Their frameworks predict "a lawful world"
    but borrow the quantum part from experiment; the honest theorems in the
    neighbourhood (the reconstructions) need no idealism; and nothing in
    any observer-first program computes a spectrum, a coupling constant, or
    a cross-section.
  theme: conventional
  rung: attribution
  tier: featured
  claimType: interpretive
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "ZW research report — critical assessment section, restated as the strongest available physicalist case"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  credibility: well_supported
  credibilitySummary: >-
    Every component is documented from the proponents' side of the ledger:
    the unselectivity of induction is visible in Müller's own consistency
    argument; the underived Born rule is conceded; the QBism comparison
    (Born rule as empirical normative addition) is in the primary
    literature; the quantitative gap is not disputed by anyone. What this
    claim does not establish is that the bridge can never be built.
  diagnosticity: high
  diagnosticitySummary: >-
    The direct rival to ZW-C008. Note its exposure: it predicts the bridge
    theorems will not materialize. A derivation of the Tsirelson bound or
    the Born rule from observer-first postulates would falsify its central
    "explanatorily idle" charge overnight.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    "Relocated complexity" cuts against physicalism too: standard quantum
    theory buys its precision by taking the entire quantum formalism as
    primitive, which is exactly the explanatory debt the reconstructions
    and the observer-first programs are attempts to pay — and the
    physicalist has no non-circular account of why the operational axioms
    hold.
  whatWouldChangeOurMind:
    - "An observer-first derivation of any uniquely quantum quantitative structure (Tsirelson bound, Born coefficients, purification)."
    - "A theorem that universal induction, suitably constrained, favors quantum probability structure over classical — which would break the unselectivity charge."

- id: ZW-C010
  statement: >-
    The decisive open problem is a bridge theorem: whether observer-first
    postulates entail the operational principles (convex state spaces,
    composition, purification, continuous reversibility) from which the
    reconstruction theorems derive quantum theory — with the Tsirelson
    bound and Born-rule measure selection as the concrete targets — is a
    precisely posed, currently unsolved mathematical question whose
    resolution in either direction would settle most of this case.
  plainLanguage: >-
    Unusually for a metaphysical dispute, there is an exact statement of
    what victory looks like. The right-hand half of the derivation —
    operational axioms to quantum mechanics — is proven. The left-hand half
    — observer to operational axioms — is not. Prove it and zero worlds
    becomes physics; prove it impossible and zero worlds becomes
    permanently decorative.
  theme: gap
  rung: attribution
  tier: featured
  claimType: interpretive
  importance: major
  reviewState: ai_extracted
  origin:
