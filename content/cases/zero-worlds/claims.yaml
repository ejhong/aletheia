- id: ZW-C007
  statement: >-
    Wolfram's observer theory asserts that the core laws of twentieth-century physics — general relativity, quantum mechanics, and the Second Law — follow from two features of observers embedded in the ruliad (computational boundedness and belief in persistence), but the derivations are presented informally, formal results demonstrate embedding rather than inevitability, and Wolfram acknowledges circularity in the observer concept itself.
  theme: programs
  rung: mechanism
  claimType: theory_description
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — both Wolfram essays retrieved and read in full; Gorard et al. 2020 abstract"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Wolfram, 'Observer Theory' (2023), section on physics"
    quote: >-
      We seem to be able to derive—essentially from the structure of the ruliad—the core laws of twentieth-century physics (general relativity, quantum mechanics and the Second Law) just on the basis of two features of us as observers: that we're computationally bounded, and that we believe we're persistent in time.
    sourceId: SRC-WOLFRAM-2023
  parentClaimIds: []
