  statement: >-
    Müller's framework yields in-principle-distinct answers, differing from
    world-based physical theories, for exotic first-person scenarios —
    observer duplication, teletransportation, simulation shutdown,
    Boltzmann brains — none of which is currently accessible as an ordinary
    laboratory test with publicly comparable outcome frequencies.
