      One postulate—purification—singles out quantum theory within this
      class.
    sourceId: SRC-CHIRIBELLA-2011
  credibility: established
  credibilitySummary: >-
    These are peer-reviewed theorems in mainstream physics venues, standing
    for fifteen to twenty-five years, and are not contested by any side of
    this case. What they establish is conditional: quantum theory follows
    once the operational axioms are granted.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Load-bearing for the case's architecture but neutral between
    ontologies: the reconstructions are ontologically agnostic, so they
    prove the second half of a two-stage derivation while saying nothing
    about whether the first half — from observers to operational axioms —
    can be built.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    The axioms may already smuggle in most of what is distinctly quantum —
    purification in particular does heavy lifting — so "derived from
    information principles" is explanatory compression, not creation ex
    nihilo; why nature satisfies those principles remains open.
  whatWouldChangeOurMind:
    - "A demonstrated flaw in one of the reconstruction proofs (none is currently alleged)."
    - "A theorem showing the axiom sets are secretly equivalent to postulating Hilbert space outright, which would deflate the compression claim."

- id: ZW-C002
