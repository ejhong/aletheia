- id: ZW-C009
  statement: >-
    The physicalist steelman: observer-first programs relocate complexity rather than reduce it — universal induction would learn any computable law and so explains nothing specifically quantum; the explanatory compression they promise is already delivered, ontology-free, by the operational reconstructions; and standard physicalist quantum theory retains a decisive quantitative advantage in Hamiltonians, field theory, and precision predictions.
  theme: conventional
  rung: attribution
  claimType: interpretive
  reviewState: ai_extracted
  origin:
    ref: "ZW research report — critical assessment section, restated as the strongest available physicalist case"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  parentClaimIds: []
  dependsOnClaimIds: []

- id: ZW-C010
  statement: >-
    The decisive open problem is a bridge theorem: whether observer-first postulates entail the operational principles (convex state spaces, composition, purification, continuous reversibility) from which the reconstruction theorems derive quantum theory — with the Tsirelson bound and Born-rule measure selection as the concrete targets — is a precisely posed, currently unsolved mathematical question whose resolution in either direction would settle most of this case.
  theme: gap
  rung: attribution
  claimType: mathematical
  reviewState: ai_extracted
  origin:
    ref: "ZW research report — two-stage reconstruction architecture and research agenda; consistent with Müller's own framing of quantum reconstruction as the benchmark"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  parentClaimIds: []
  dependsOnClaimIds: [ ZW-C001, ZW-C002 ]

