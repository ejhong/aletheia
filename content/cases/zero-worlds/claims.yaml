# ── Mechanism rung ───────────────────────────────────────────────────────────

- id: ZW-C004
  statement: >-
    Müller's algorithmic idealism is a formally explicit framework — self-
    states plus a universal-induction law of state change — within which
    the emergence of an apparently objective external world governed by
    simple computable probabilistic laws is a proven asymptotic theorem,
    not an assumption, and standard puzzles (Boltzmann brains, simulation
    shutdown) dissolve by first-person reasoning.
  plainLanguage: >-
    The flagship program is not hand-waving: there is a 2020 paper in a
    mainstream quantum journal with proofs. Start from nothing but "you are
    an observer with a current informational state" and a mathematically
    exact version of Occam's razor, and it follows that you should expect
    to find yourself in a stable, lawful world — and should never expect to
    be a Boltzmann brain, however many of them cosmology produces.
  theme: formalism
  rung: mechanism
  tier: featured
  claimType: mechanistic
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "ZW essay §I–II and research report; verified against the Quantum 4:301 abstract and Müller's own exposition"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Müller 2020, Quantum 4, 301, abstract"
    quote: >-
      Universal induction determines the chances of what any observer sees
      next.
    sourceId: SRC-MULLER-2020
  credibility: well_supported
  credibilitySummary: >-
    The theorems are published, peer-reviewed, and unchallenged as
    mathematics. The honest caveats are scope caveats: the results hold in
    an idealized bit-string model whose information accumulates
    monotonically (Müller's acknowledged "erasure problem"), universal
    induction is uncomputable in exact form, and the invariance theorem
    leaves machine-dependent constants that matter for finite predictions.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Proves the reversal is not empty philosophy — a lawful world really can
    be output rather than input. But emergence of some computable lawful
    world is exactly what the physicalist expects too, for different
    reasons, so the theorem does not by itself favor idealism.
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    The bit model packs an observer's entire past into its state and
    forbids forgetting; Müller himself treats extending the theorems to
    realistic observers who erase and rewrite memory as an open problem —
    until then the emergence theorem describes an idealization no actual
    observer instantiates.
  whatWouldChangeOurMind:
    - "A formulation with forgetting that preserves (or breaks) the emergence theorem — Müller's own stated open problem."
    - "A demonstrated error in the 2020 proofs."

- id: ZW-C005
