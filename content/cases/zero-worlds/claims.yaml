# Canon layer. Claims built from the "Zero Worlds" essay (Substack,
# 2026-07-04, PDF in research/) and the "From 'Zero Worlds' to Quantum
# Worlds" research report, then re-verified against primary sources during
# the 2026-08-22 import (arXiv, publisher pages, and full texts including
# Müller's mpmueller.net/aid exposition and both Wolfram essays).
# reviewState is honest provenance: nothing here has been hand-checked by a
# human yet.
#
# Ladder note: this case is mathematics-forward. The observation rung holds
# facts about what has and has not been proven or measured; the mechanism
# rung holds what each observer-first program actually delivers; the
# attribution rung holds the contest over whether the ontological reversal
# explains anything. The rungs are separated so that real theorems in the
# neighbourhood (the reconstructions) cannot lend unearned support to the
# thesis that needs the missing one.

# ── Observation rung ─────────────────────────────────────────────────────────

- id: ZW-C001
  statement: >-
    Finite-dimensional complex quantum theory has been rigorously reconstructed from operational and information-theoretic axioms — without taking Hilbert space, complex amplitudes, or the trace rule as primitives — in at least three independent theorem sets (Hardy 2001; Chiribella–D'Ariano–Perinotti 2011; Masanes–Müller 2011).
  theme: reconstruction
  rung: observation
  claimType: mathematical
  reviewState: ai_extracted
  origin:
    ref: "ZW research report — reconstruction literature; verified against arXiv/publisher records for all three papers"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Chiribella, D'Ariano & Perinotti 2011, abstract"
    quote: >-
      One postulate—purification—singles out quantum theory within this class.
    sourceId: SRC-CHIRIBELLA-2011
  parentClaimIds: []
  dependsOnClaimIds: []

- id: ZW-C002
  statement: >-
    No observer-first program — algorithmic idealism, conscious-agent theory, or the ruliad — has derived the distinctively quantum package (complex Hilbert space, the Born rule, Tsirelson-bounded nonlocality) from its non-material primitives, and Müller himself identifies Bell violation with no-signalling and efficient quantum computation as unfinished targets for his framework.
  theme: gap
  rung: observation
  claimType: observation
  reviewState: ai_extracted
  origin:
    ref: "ZW research report — central finding; verified against Müller's FoP 2026 paper and his mpmueller.net/aid exposition"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "mpmueller.net/aid ('Algorithmic Idealism' exposition), section on quantum theory"
    quote: >-
      I hope that some nonclassical aspects of quantum theory can be shown to be predictions of algorithmic idealism.
    sourceId: SRC-MUELLER-AID
  parentClaimIds: []
  dependsOnClaimIds: []

- id: ZW-C003
  statement: >-
    Loophole-free Bell experiments and the extended Wigner's-friend no-go experiment constrain conjunctions of assumptions (local realism; absoluteness of observed events with locality and no-superdeterminism) but do not empirically discriminate observer-first ontologies from physicalist interpretations of quantum mechanics.
  theme: benchmarks
  rung: observation
  claimType: observation
  reviewState: ai_extracted
  origin:
