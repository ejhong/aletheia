- id: ZW-C008
  statement: >-
    No observer-independent physical world is fundamental: first-person informational states plus a lawlike inductive rule are ontologically sufficient, and the physical world — ultimately including quantum theory — is derivative.
  theme: attribution
  rung: attribution
