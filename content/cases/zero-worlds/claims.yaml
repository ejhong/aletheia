# ── Mechanism rung ───────────────────────────────────────────────────────────

- id: ZW-C004
  statement: >-
    Müller's algorithmic idealism is a formally explicit framework — self- states plus a universal-induction law of state change — within which the emergence of an apparently objective external world governed by simple computable probabilistic laws is a proven asymptotic theorem, not an assumption, and standard puzzles (Boltzmann brains, simulation shutdown) dissolve by first-person reasoning.
  theme: formalism
  rung: mechanism
  claimType: mathematical
  reviewState: ai_extracted
  origin:
    ref: "ZW essay §I–II and research report; verified against the Quantum 4:301 abstract and Müller's own exposition"
    extractedBy: "Fable (AI agent)"
    runId: "zw-case-2026-08-22"
    date: "2026-08-22"
  sourceAnchor:
    locator: "Müller 2020, Quantum 4, 301, abstract"
    quote: >-
      Universal induction determines the chances of what any observer sees next.
    sourceId: SRC-MULLER-2020
  parentClaimIds: []
  dependsOnClaimIds: []

- id: ZW-C005
  statement: >-
    Algorithmic idealism is asymptotically consistent with quantum mechanics if quantum theory generates the computable regularities in an observer's data, and Müller's 2020 paper proves a preliminary theorem that Bell-inequality violation alongside no-signalling can sometimes be expected — a result he qualifies as resting on too many assumptions.
  theme: formalism
  rung: mechanism
  claimType: mechanistic
  reviewState: ai_extracted
  origin:
    ref: "Verification batch 2026-08-22 — mpmueller.net/aid read in full; Quantum 4:301 abstract"
