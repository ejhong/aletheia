    date: "2026-08-22"
  sourceAnchor:
    locator: "mpmueller.net/aid, discussion of the 2020 paper's Bell result"
    quote: >-
      A preliminary result (a valid theorem, but "preliminary" because it still rests on too many assumptions) which shows that the violation of Bell inequalities, but preservation of the no-signalling principle can sometimes be expected.
    sourceId: SRC-MUELLER-AID
  parentClaimIds: [ ZW-C004 ]
