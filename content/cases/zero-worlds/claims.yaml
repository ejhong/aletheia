    (complex Hilbert space, the Born rule, Tsirelson-bounded nonlocality)
    from its non-material primitives, and Müller himself identifies Bell
    violation with no-signalling and efficient quantum computation as
    unfinished targets for his framework.
  plainLanguage: >-
    The gap at the center of the case: the programs that demote the
    external world have not yet earned the physics. Their own leading
    theorist says so — the quantum reconstruction is a goal, not a result.
    What exists are partial correspondences and one preliminary theorem,
    not a derivation.
