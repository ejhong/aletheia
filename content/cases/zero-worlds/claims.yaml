    expected — a result he qualifies as resting on too many assumptions.
  plainLanguage: >-
    Where the flagship program actually stands on quantum mechanics: it is
    compatible with quantum physics (because universal induction learns
    whatever lawful world produces your data), and it has one genuine
    quantum foothold — a real but heavily-conditioned theorem about Bell
