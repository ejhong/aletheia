- id: ZW-C504
  statement: >-
    Müller identifies the "erasure problem" — his bit model's monotone
    accumulation of information, with no fundamental forgetting — as an
    acknowledged open obstacle, and seeks a formulation permitting
    information deletion from self-states while preserving the
    external-world emergence theorems.
  plainLanguage: >-
    The flagship framework's own listed weak point: real observers forget,
    and the current mathematics does not. Whether the emergence theorem
    survives forgetting is open — and matters, because contextuality and
    Wigner's-friend phenomena may hinge on exactly what cannot be kept in
    one permanent record.
