# Evidence records: the specific result/statement extracted from a source
# and connected to claims. Direction is explicit and read against the listed
# claims; sourceStatement (what the source says) is kept separate from
# editorInference (what we infer).

# ── The flagship program: algorithmic idealism ───────────────────────────────

- id: ZW-E001
  title: "Müller 2020: the emergence theorems and the preliminary Bell result"
  claimIds: [ZW-C004, ZW-C005]
  sourceId: SRC-MULLER-2020
  direction: supports
  strength: strong
  sourceStatement: >-
    The paper postulates that "universal induction determines the chances
    of what any observer sees next," and proves within an algorithmic-
    information-theoretic model that observers should expect to find
    themselves in a stable, apparently objective external world governed by
    simple computable probabilistic laws — with the Boltzmann-brain problem
    dissolved (the transition out of a lawful history is algorithmically
    disfavored) and a preliminary theorem that Bell-inequality violation
    with preservation of no-signalling can sometimes be expected.
  editorInference: >-
    The load-bearing formal result of the whole case: it demonstrates the
    observer-first reversal can output a lawful world rather than assume
    one. Note what it does not contain — any derivation that the emergent
    laws are specifically quantum; the Bell result is the seed of that
    project, not its completion.
  exactLocator: "Quantum 4: 301 (2020)"
  limitations:
