- id: ZW-E017
  title: "Hensen 2015: the loophole-free Bell benchmark (S = 2.42 ± 0.20)"
  claimIds: [ZW-C003]
  sourceId: SRC-HENSEN-2015
  direction: supports
  strength: strong
  sourceStatement: >-
    Entangled electron spins separated by 1.3 km violated the CHSH
    inequality loophole-free: S = 2.42 ± 0.20 over 245 trials, against the
    local-realist bound S ≤ 2 and below the quantum (Tsirelson) bound of
    2√2.
  editorInference: >-
    Fixes the empirical target with a number. Any observer-first
    derivation must yield correlations that exceed 2 and cap at 2√2 —
    exceeding 2 alone would only establish generic nonclassicality, which
    no-signalling boxes also achieve. The gap between those two
    requirements is where most "we get nonlocality" claims quietly live.
  exactLocator: "Nature 526: 682–686 (2015)"
  limitations:
    - "None material for its role here as benchmark; later Bell tests have strengthened the result."
  reviewState: ai_extracted
