- id: ZW-E015
  title: "Spekkens 2007: how much quantum 'look' a non-quantum theory can fake"
  claimIds: [ZW-C009, ZW-C502]
  sourceId: SRC-SPEKKENS-2007
  direction: supports
  strength: strong
  sourceStatement: >-
    A toy theory built from classical states plus a restriction on
    knowledge finds that "a wide variety of quantum phenomena... have
    analogues within this toy theory" — interference-like behavior,
    no-cloning, teleportation, entanglement analogues — while explicitly
    failing to reproduce Bell-inequality violations and Kochen–Specker
    contextuality.
  editorInference: >-
    The calibration standard this case applies to every "quantum-like"
    result in the observer-first literature: wave equations, complex
    numbers, branching, and interference-resemblance are all obtainable
    without quantum mechanics. The bar is the genuinely nonclassical
    correlation structure, and nothing below it counts.
  exactLocator: "Physical Review A 75: 032110 (2007)"
  limitations:
