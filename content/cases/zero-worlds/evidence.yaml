- id: ZW-E011
  title: "The FBT theorem: fitness-only perception generically beats truth-tracking"
  claimIds: [ZW-C006, ZW-C501]
  sourceId: SRC-PRAKASH-2021
  direction: supports
  strength: moderate
  sourceStatement: >-
    Formalizing perceptual evolution in evolutionary game theory and
    Bayesian decision theory, the authors state and prove the
    "Fitness-Beats-Truth (FBT) Theorem": under the model's assumptions, a
    strategy maximizing expected-fitness payoff consistently outcompetes
    one tuned to the true structure of the objective world.
  editorInference: >-
    Supports precisely the interface half of Hoffman's position — that
    perception need not be veridical — and nothing beyond it. The chain
    "selection need not favor truth, therefore consciousness is
    fundamental, therefore quantum mechanics" adds two non-sequiturs to
    one theorem; the case keeps the theorem and prices the additions
    separately.
  exactLocator: "Acta Biotheoretica 69(3): 319–341 (2021)"
  limitations:
