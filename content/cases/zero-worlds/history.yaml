- date: "2026-08-22"
  change: >-
    Verification notes recorded on import. (1) Citation trap: an arXiv
    series titled "Algorithmic Idealism I–III" (2412.20485, 2502.08653, et
    al.) is authored by Krzysztof Sienicki, not Markus P. Müller; it is
    excluded from this case and flagged in watch.yaml so future watch
    reviewers do not conflate the two. (2) Wording calibration: the seed
    report describes Bell violation, no-signalling, and quantum
    computation as future "litmus tests" for algorithmic idealism, while
    Müller's own exposition also records a 2020 theorem that Bell
    violation with no-signalling "can sometimes be expected" — "a valid
    theorem, but 'preliminary' because it still rests on too many
    assumptions." Claims ZW-C002/ZW-C005 carry the calibrated version:
    neither "derived" nor mere aspiration. (3) The ruliad definition
    circulating in the seed documents ("everything that is computationally
    possible") differs slightly from the retrieved 2026 text ("the
    entangled limit of all possible computational processes"); the
    verbatim form is used. (4) The Jones–Müller Wigner's-friend paper is
    cited in the essay by its 2024 arXiv year; the journal version is
    Quantum 10: 2147 (2026) — recorded on SRC-JONES-MULLER-2026.
  reason: >-
    The epistemic rules require observation before interpretation and
    forbid imported characterizations from carrying assessments when the
    primary record says otherwise.
  actor: "Fable (AI agent), directed by Eugene"
  aiAssisted: true

