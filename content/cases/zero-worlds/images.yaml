  model: "gpt-image-1"
  runId: "cover-style-v2-2026-08-23"
  prompt: >-
    Hand-tinted 19th-century scientific expedition lithograph,
    chromolithograph plate from a vintage natural-history atlas. A small
    cloaked observer seen from behind, standing on a tiny island of finely
    engraved ground that frays at its edges into blank paper, holding up a
    lantern whose single beam is the only place a world exists: within the
