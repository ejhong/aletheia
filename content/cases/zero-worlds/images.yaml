# Case imagery. Two kinds, never confused:
#   cover  — AI-generated editorial artwork in the house engraving style,
#            honestly credited; may never depict evidence.
#   plate  — real imagery with provenance and license.
#
# Plates: this case carries none, deliberately. Its evidence is theorems
# and papers — there is no excavation, specimen, or survey plate to show.
# Portraits of the living theorists would cross the "confusing personality
# with hypothesis" line, and generic laboratory photographs depict none of
# the actual evidential content. One future exception worth considering:
# a provenance-clean photograph of a loophole-free Bell-test apparatus
# (e.g. the Delft 2015 setup) as context for ZW-C003, if one with a
# suitable license surfaces on Commons.

