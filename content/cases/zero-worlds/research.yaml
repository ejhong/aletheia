# Research agenda: every project moves specific claims in either direction.
# Unusually for this site, the decisive work is mathematics — the case's
# central uncertainty is a missing theorem, not a missing measurement — so
# the effort tiers skew toward desk work, and "either outcome is
# informative" holds literally: a proof and a no-go result would each
# settle claims.

- id: ZW-R001
  title: "The observer-to-GPT bridge theorem"
  summary: >-
    Starting from a clearly specified first-person theory — Müller's
    self-state model is the cleanest candidate — define interventions,
    repeatable experiments, and operational equivalence entirely in its
    native language, and prove conditions under which persistent
    regularities in self-states induce well-defined preparation,
    transformation, measurement, and composition classes: a convex
    operational state space, derived rather than assumed. This connects
    algorithmic idealism to the mature reconstruction literature instead of
    re-inventing quantum formalism, and Müller already names quantum
    reconstruction as the relevant benchmark. Failure conditions should be
    stated with the theorem: which postulate blocks the construction, and
    why.
  claimIds: [ZW-C002, ZW-C010, ZW-C004]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    The single most decisive project available: it would convert the
    attribution dispute into mathematics, and either outcome — bridge or
    documented obstruction — reshapes the case.

- id: ZW-R002
  title: "Nonclassical composition from first-person postulates: the Tsirelson benchmark"
  summary: >-
    Universal induction is Kolmogorovian at the meta-level, so the hard
    problem is explaining why operational observables should fail to fit a
    single joint probability distribution. Target: a theorem showing that
    first-person restrictions — forgetting, incompatible counterfactual
    continuations, Restriction A — generate contextual operational
    probability spaces, with the decisive benchmark being 2 < S_max = 2√2:
    Bell violation capped at the Tsirelson bound, not merely S > 2. The
    2020 preliminary result (Bell violation with no-signalling "can
    sometimes be expected") is the seed; the project is to shrink its
    assumption set and sharpen its conclusion until it either hits the
    quantum boundary or provably cannot.
  claimIds: [ZW-C005, ZW-C010]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    The Tsirelson bound is the one number that would discriminate a
    specifically quantum emergence from generic contextual or
    no-signalling structure — hitting it would be the strongest result in
    the program's history; proving S_max ≠ 2√2 would be a refutation.

- id: ZW-R003
  title: "Derive one existing reconstruction axiom set — purification first"
  summary: >-
    Rather than deriving Hilbert space at once, choose one proven theorem
    set as the destination and derive its axioms. Candidate mappings:
    persistent intersubjective agreement → causality; observer-state
    compositionality → local tomography; reversible informational
    equivalence → pure-state transitivity; loss of inaccessible
    information / first-person completion → purification. The last is the
    critical one — purification carries the distinctly quantum content in
    the Chiribella–D'Ariano–Perinotti reconstruction and must arrive as a
    genuine theorem, not a metaphor. Masanes–Müller is the natural
    alternative target given the shared author.
  claimIds: [ZW-C001, ZW-C010]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Modularizes the bridge problem into separately winnable pieces;
    even one derived axiom (or one proven obstruction) converts a slogan
    into a result.

- id: ZW-R004
  title: "The measure-selection problem: why should induction favor quantum probability?"
  summary: >-
    Algorithmic idealism currently learns any sufficiently simple
    computable measure — which is exactly the unselectivity the steelman
    exploits. The project: find an invariance or coherence principle
    (self-state encoding invariance, composition of independent
    experiments, symmetry of informational alternatives) under which
    universal induction favors quantum probability structure rather than
    merely learning it post hoc. QBism's SIC representation supplies a
    concrete target: derive, rather than insert, coefficients equivalent
    to the (d+1)p(i) − 1/d form of the quantum law of total probability.
  claimIds: [ZW-C005, ZW-C009]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Directly attacks the steelman's strongest component (ZW-C009's
    unselectivity charge); success would make the Zero Worlds–QBism
    connection mathematically substantive instead of analogical.

- id: ZW-R005
  title: "Formalize forgetting: the erasure problem as a test of the emergence theorems"
  summary: >-
    Müller's bit model accumulates information monotonically; real
    observers forget, compress, and rewrite. Specify a stochastic or
    computable erasure map on self-states and prove whether first-person
    continuation probabilities remain invariant under representational
    loss while the external-world emergence theorems survive. This is the
    program's own named open problem, and it is load-bearing:
    contextuality and Wigner's-friend phenomena may depend precisely on
    the impossibility of one persistent global record.
  claimIds: [ZW-C004, ZW-C504]
  track: publication_prize
  effortTier: desk
  informationGain: >-
    Either strengthens the flagship theorem's claim to describe actual
    observers or shows the emergence result is an artifact of perfect
    memory — a live failure mode for the whole framework.

- id: ZW-R006
  title: "Preregister a genuinely discriminating first-person protocol"
  summary: >-
    The framework's distinctive predictions concern duplication,
    simulation, and private-observation scenarios. To make these science
    rather than metaphysics: a protocol with precisely defined physical
    operations, identified observer-state variables, competing quantitative
    predictions of the form P_ZW(o) = P_QM(o) + Δ with Δ fixed by theory
    before any data, and a stated criterion for how private outcomes become
    statistically assessable without smuggling back a third-person world.
    Until such a calculation exists, the exotic-scenario predictions should
    be described as theoretical discriminators, not tests — publishing that
    boundary honestly is itself the deliverable.
  claimIds: [ZW-C503, ZW-C008, ZW-C010]
  track: either
  effortTier: desk
  informationGain: >-
    Converts the "not currently testable" label on the featured thesis
    from a permanent shield into a dated, auditable status — and any
    protocol produced becomes the case's first genuine experiment.
