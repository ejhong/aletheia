# Source records. Verification labels are honest about who checked what:
#   verified     — the document itself is held in the project library
#   ai_verified  — citation located and checked against the publisher, DOI
#                  registry, arXiv, or retrieved full text by an AI agent
#                  (2026-08-22 batch); no human re-check
#   unverified   — cited second-hand; locator unconfirmed
#
# Import note: every citation in this file was independently re-verified
# against arXiv, publisher pages, or retrieved full text before import.
# The research report that seeded this case is itself AI-generated; nothing
# was imported on its authority alone. One citation trap documented during
# verification: an arXiv series titled "Algorithmic Idealism I–III"
# (2412.20485, 2502.08653, et al.) is by Krzysztof Sienicki, NOT by Markus
# P. Müller, and is deliberately not cited here (see history.yaml).

