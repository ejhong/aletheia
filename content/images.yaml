# Site-level imagery (brand art, textures). All AI-generated records carry
# the prompt, style version, and an honest credit. Generated imagery is
# editorial only — it may NEVER appear as a plate (enforced by the schema).

- id: IMG-SITE-HERO
  role: cover
  file: /images/site/hero.jpg
  alt: >-
    Engraved allegory of unconcealment: parted layers of rock strata opening
    around a beam of light that illuminates a small standing stone.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Aletheia house style"
  styleVersion: style-v1
  model: "Cursor image generation tool, 2026-08-22"
  prompt: >-
    19th-century scientific expedition lithograph, copperplate engraving.
    Allegory of unconcealment: parted layered geological rock strata forming
    a narrow opening, through which engraved rays of light break outward
    toward the viewer, rendered as fine radiating burin lines; the light
    beam gently illuminates a small standing stone at the center. Fine
    cross-hatching and stipple shading throughout. Monochrome deep
    warm-black ink (#201b12) on aged warm cream paper (#f6f1e8), with one
    restrained oxidized-copper (#9a5b33) accent: a faint copper glow within
    the light rays. Darwin-era natural-history journal plate aesthetic,
    generous plain paper margins, quiet and austere composition. No text,
    no labels, no border frame lines. Unmistakably an engraving — stylized
    editorial artwork, not photorealistic.

