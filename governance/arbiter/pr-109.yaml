  - seat: Opus 5 (Anthropic)
    vote: violates
    rules:
      - §3.15
      - §3.8
    reasoning: "The fallback silently substitutes a second model inside `call()` and
      returns only a bare string — no indication of which model actually
      produced the text, and the only trace is an ephemeral `console.error` line
      that never reaches git. Every downstream caller that stamps an assessment
      or run record can therefore only stamp `provider.model` (now
      `claude-fable-5`) while the text may in fact have come from
      `claude-opus-5`, making the mandated model stamp false and breaking
      §3.15's 'any reader can reconstruct which model did what' and §4's
      requirement that overlay assessments be stamped with the runId/model that
      produced them (an inaccurate provenance detail under §3.8). The change
      also converts a previously fail-closed outcome (orch-or, immortality-key
      skipped) into a silently-passing one produced by an undisclosed model,
      which is the sort of check-relaxation §3.15 forbids doing quietly.
      Compounding this, the code comment reverses documented decision #15 on the
      sole authority of an unverifiable in-diff assertion of 'the founder's
      preference (2026-08-27)', with no corresponding update to
      `docs/DECISIONS.md`; a claim of authorization inside the material under
      review is evidence, not warrant. The fix would be small — have `call()`
      report the model actually used (or a `{text, model}` result) so records
      stamp truthfully, and record the decision reversal in DECISIONS.md — but
      as written the change degrades the provenance guarantee."
