      PRs for unanimous scorers (founder tap retained initially; flipping
      freezes to auto-merge-on-pass is a later, separate merge-policy
      amendment)' becomes 'auto-drafted freeze PRs for 4-of-5-high scorers with
      no constitutional objection (founder tap retained initially)'. Two
      guardrails move at once — the concurrence threshold drops from unanimity
      to 4-of-5, and the explicit statement that flipping freezes to auto-merge
      requires a separate merge-policy amendment is deleted — and neither is
      mentioned in the PR body or in the appended DECISIONS entry, which
      describes only the promotion pipe, Genesis, the counterweights, and the
      EXTRACT_MODEL fix. That is precisely the 'weaken the checks in this
      section' prohibition of §3.15, made worse by being undisclosed in a change
      whose stated purpose is something else. The rest of the diff (promotion
      pipe, strongest-unanswered-pro-hypothesis field, sampling gloss audit, the
      honest /method line that existence-checking is not content-checking, the
      append-only DECISIONS entry, the MAINTENANCE.md fallback clarification) is
      unobjectionable and in places strengthens the epistemics; AGENTS.md is
      untouched and no citations are added. Bringing the threshold change out
      into its own explicit, disclosed decision — or restoring the unanimity
      wording and the amendment caveat — would clear this."
