    reasoning: "This is an infrastructure change (schema, pipeline, protocols, UI)
      that adds a 'provisional' review state; it adds no content records and the
      tooling found no citation identifiers in added content lines, so there is
      no fabrication surface here. The new tier does not loosen §3.15's checks:
      `sourceExists()` admits a record only when a resolver-confirmed identifier
      or an answering URL carries metadata matching the record's title, a
      failing identifier blocks outright (\"a failing identifier is a failing
      citation\"), and 403/404/429/connection failures still block as before;
      the second reader is still asked to judge everything judgeable without the
      text (atomicity, relevance, independence), and what it refuses is refused.
      Honesty of labelling is preserved and arguably improved: a provisional
      source is forced to `verification: unverified` by the loader,
      `reviewState: provisional` must carry a block naming what showed
      existence, why the text is unread, the route and the run, and the loader
      rejects a block on any non-provisional/non-rejected record. Weightlessness
      is enforced structurally, not just in prose — `verifiedEvidence` excludes
      provisional records from the strongest-for/against selection, packet claim
      counts split `evidence` from `provisionalEvidence`, and
      edition-v9/check-v2 instruct grading them as absent, with UI badges on the
      evidence card, claim margin and source page. The remaining risk I note (a
      review-note-level concern, not a violation) is that an evidence record's
      verbatim quote enters unchecked; that is disclosed as provisional and
      marked unverified per §3.8, and re-verify promotes or refuses it.
      AGENTS.md is untouched and the DECISIONS entries are recorded founder
      directions, which §3.15 expressly permits."
