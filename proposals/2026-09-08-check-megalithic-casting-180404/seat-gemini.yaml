    reasoning: >-
      Sessa et al. (2026) conducted XRD and SEM-EDX analyses on efflorescence and spalled fragments from the Queen's Chamber and Thieves' Corridor, confirming that the mineral assemblage consists exclusively of halite, calcite, and quartz with no nitrates or widespread gypsum crusts. The claim is a verified, exact report of peer-reviewed laboratory measurements. Strongest opposing consideration: XRD analytical detection limits are typically around 5 wt%, meaning minor or poorly crystalline sulfate phases could be present below detection thresholds.
  - claimId: GEO-C906
