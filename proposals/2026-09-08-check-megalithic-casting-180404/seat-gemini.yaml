    reasoning: >-
      Sessa et al. (2026) show that halite efflorescence is widely documented across numerous natural limestone monuments throughout Egypt, including the bedrock-carved Sphinx, rock-cut tombs at Lisht, Saqqara, and the White Monastery. Furthermore, Klemm & Klemm (2010, cited in Sessa et al.) established that halite is an inherent primary constituent of Giza nummulitic limestone strata deposited in ancient marine environments, invalidating the claim that surface NaCl is anomalous. Strongest opposing consideration: Proponents compared Giza stones against European Gothic cathedrals, which do not exhibit halite efflorescence due to their wet, leaching climates and different geological origins.
  - claimId: GEO-C907
    verdict: established
