    reasoning: >-
      Engelbach's 1922 monograph formed the foundational literature for the dolerite pounding orthodoxy, incorporating his brief personal working trial and heuristic workforce division without formal mass-loss measurement. The statement accurately summarizes the historical origins of the orthodox pounding rate estimate. Strongest opposing consideration: Engelbach's wider interpretation was corroborated by extensive contextual field evidence across Aswan, including thousands of abandoned dolerite pounders, quarry trenches, and characteristic scoop-mark morphology.
  - claimId: GEO-C003
