    reasoning: >-
      The claim is supported only by proponent visual impressions (GEO-E005) without dimensional laser surveys, mechanical modeling, or ergonomic strike testing. The physical ability of an ancient worker to deliver downward pounding strikes in narrow vertical trenches has not been experimentally tested or formally measured on the record. Strongest opposing consideration: Biomechanical constraints in deep, narrow shafts severely restrict arm swing and leverage, making high-cadence percussion substantially less effective at trench bottoms than on open surfaces.
  - claimId: GEO-C502
