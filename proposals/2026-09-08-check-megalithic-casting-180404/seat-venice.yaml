caseAssessment:
  verdict: unresolved
  loadBearing: [GEO-C012, GEO-C020, GEO-C021, GEO-C030]
  weakestLinks: [GEO-C002, GEO-C013, GEO-C003, GEO-C506]
  synthesis: >-
    The ledger supports a genuinely unresolved case, not a safe hedge. The mechanism rung is in
    reasonable shape: natron availability at scale is established by mainstream literature
    (GEO-E010), the ~850 °C pyrotechnology precedent is provisionally supported, and the core
    feasibility claim GEO-C012 rests on self-reported demonstration blocks plus a room-temperature
    C–S–H feasibility study — plausible, but "feasibility is not occurrence," and no independent
    lab has analyzed a single demonstration block. The observational rung is the weakest: the
    visitor scoop-mark failure, the fire-pit anecdote, and the shaft geometry are all
    single-source, unquantified, or proponent-reported. The historical anchors that once carried
    evidential weight have been dismantled from within the ledger's own 2026 verification work:
    the Al-Ma'mun salt report (GEO-C003) has no traceable medieval source and is absent from the
    principal compilation, and the salt discriminator (GEO-C506) fails because halite is now
    documented at the Sphinx and other non-cast Egyptian limestone sites and reported as native
    to Giza nummulitic strata. The attribution rung splits: GEO-C020 is contradicted for the
    alkali-geopolymer recipe by the only study with a positive control (Jana 2007), reinforced by
    Folk & Campbell's in-situ sedimentary features and Freestone & Middleton's independent
    negative — while the revised C–S–H binder remains untested by those negatives but faces the
    bedding/burrow problem that no binder revision answers. GEO-C021 has only partisan positive
    laboratory evidence against a 1971 provenance study, both qualified by a methods critique
    (GEO-C030) that is itself well-supported within its scope. Sensitivity: the single record
    whose removal would most change this assessment is GEO-E020 (Jana 2007). Without it, the
    anti-casting case loses its only demonstration that a casting signature is detectable when
    present — the direct answer to the proponents' blindness argument — and GEO-C020 would
    weaken from contradicted toward mixed, since Barsoum 2006 and MacKenzie 2011 would stand
    against petrography lacking a positive control. The case-level verdict of unresolved
    survives without GEO-E020, because GEO-E018's field observations and the collapsed salt and
    Al-Ma'mun lines independently block any upgrade, but the strongest per-site conclusion would
    hang on that one thread. The ledger's own framing — a striking absence of the settling study
    — is vindicated: the decisive tests (Iwawe Stratum V, Khapia survey, halite-in-bedrock,
    blinded paleomagnetism) are designed and unfunded rather than run.
  steelman: >-
    Two independent techniques on pyramid samples — SEM/TEM (Barsoum 2006) and solid-state
    multinuclear NMR (MacKenzie 2011) — found microconstituents and an amorphous
    calcium-silicate binder phase that their authors read as human intervention, on samples whose
    provenance Egypt's Supreme Council of Antiquities itself disputes; the anti-casting
    petrographic studies (Folk & Campbell, Jana, Freestone & Middleton) examined different
    objects, and no study has ever run binder-aware petrography with a positive control on the
    Barsoum/MacKenzie specimens, so those two pro-casting datasets stand unrebutted on their own
    samples. Jana's decisive negative is scoped to the alkali-aluminosilicate recipe and does not
    test the C–S–H binder MacKenzie actually found. On the Andean side, the only laboratory
    analyses of Pumapunku andesite ever published (peer-reviewed in Materials Letters and
    Ceramics International) report organic matter inside volcanic stone — an observation no
    independent team has ever tested, and Ponce's 1971 provenance attribution predates the
    analytical era and cannot in principle exclude cast-from-same-quarry aggregate. And at Aswan,
    the sole modern quantitative measurement (Marčiš 2023) found a 216 cm³/h pounder removal rate
    whose own mainstream authors concluded pounders alone cannot explain the site — an
    unrefuted quantitative anomaly in the orthodox account that no evidence record in this ledger
    answers.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The umbrella existence claim inherits the split below it: its flagship candidate (Great
      Pyramid) is contradicted for the stated geopolymer recipe, and Pumapunku rests solely on
      proponent-authored analyses. No monument in the evidence records is positively established
      as cast, but the methods critique legitimately blocks quarry-provenance refutations, so
      absence of proof is not proof of absence here. The strongest opposing consideration is the
      positive-control petrography at Giza; the strongest pro consideration is that it was never
      applied to the Andes or to the disputed samples themselves.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Jana 2007 is the decisive record: with a genuine Davidovits geopolymer as positive control,
      it showed casting signatures (Na+K/Al binder enrichment, smooth matrix, air voids) that no
      casing stone exhibits, and that Barsoum's Si-rich spheres occur in natural limestone too.
      Folk & Campbell's in-situ bedding, burrows, and clam sections across many blocks are hard
      to reconcile with any casting recipe. The strongest opposing consideration: Jana's negative
      does not test the revised C–S–H binder (GEO-E017), and the sample-provenance dispute is
      unresolved — but no provenance-secure sample has ever shown a casting signature.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The only positive evidence is two papers by the hypothesis's principal proponents, same
      team and sample set, with questioned sample chain of custody and no blind-tested
      discriminating criteria — and volcanic rocks can naturally host organic and glassy phases.
      Against it stands only Ponce 1971, whose methods predate the critique in GEO-C030 and are
      themselves dated. Both directions carry real but conditional evidence; nothing here
      settles it.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The chemistry (natron + lime → CaCO₃ + NaOH; lime + diatomaceous earth → C–S–H) is
      feasible, and a multi-ton demonstration block is self-reported. The strongest opposing
      consideration is that no independent analysis of any demonstration block exists
      (GEO-E013's own limitation), and GEO-E022 establishes feasibility without any
      archaeological occurrence.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pre-pyramid glassmaking in the relevant temperature range is the cited precedent
      (GEO-E016), but its Badari dating and temperature basis need independent verification, and
      crucible-scale heat is not industrial-scale processing. General background knowledge of
      Bronze Age pyrotechnology calibrates plausibility upward, but the ledger's own support is
      weak.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 from mainstream, uncontroversial peer-reviewed archaeology (Shortland et al. 2006)
      directly establishes the sources and the 7th–9th century decline. The paper says nothing
      about stone-making, so this claim carries no weight toward casting — but as stated, it is
      solid.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The entire support is one unattributed anecdote (GEO-E015) that the project's own
      skeptical review flagged as under-sourced, with no controlled replication. Ash-carbonation
      chemistry is background-plausible, but the discovery-pathway claim as stated hangs on
      nothing stronger than a story.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The H/C/O blindness of PXRF and ICP-MS is chemically factual, and the same-quarry-aggregate
      logic is sound for trace-element matching; the record is human-reviewed and editor-endorsed.
      The strongest opposing consideration is internal: the claim lists XRD among the blind
      methods, yet XRD detects crystalline binder phases (exactly how Folk & Campbell looked for
      zeolite), and Jana 2007 demonstrates binder-aware methods are not blind — so the claim is
      sound only in its trace-element scope, as Fóti himself concedes.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The photogrammetric measurement is real, peer-reviewed, and the only modern quantitative
      datum of its kind. As a measurement claim it stands. The strongest opposing consideration:
      a single team, single granite, single tool configuration, and skilled ancient crews may
      have outperformed the protocol — which bears on interpretation, not on the reported number.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The observation rests on Fóti's anecdotal report with unquantified attempt rates and no
      systematic wear survey of the test block (GEO-E003's limitations). A null result from
      uncontrolled tourist attempts is weak evidence for anything.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The shaft-dimension and biomechanical claims come from a single descriptive source
      (GEO-E005), with no independent survey and no test of whether effective strikes are
      actually impossible from a confined posture. Plausible, but essentially unverified.
  - claimId: GEO-C502
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The characterization of Engelbach's evidential base is explicitly flagged in GEO-E002 as
      taken from Fóti and not yet checked against the 1922/1923 texts, though the source record
      independently notes the one-hour-trial and heuristic basis. The claim is plausible and
      directionally corroborated, but its specific details rest on an unverified second-hand
      account.
  - claimId: GEO-C003
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The ledger's only carrier of the salt-layer report is an uncited proponent webpage
      (GEO-E029), the principal medieval compilation lacks any salt mention (GEO-E027), and the
      date is wrong (GEO-E028). The strongest opposing consideration: al-Suyūṭī is one
      compilation and other Arabic sources remain unread (GEO-R001), so absence is not yet
      exhaustive — the report survives as an untraced assertion, not as attested history.
  - claimId: GEO-C506
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The presence component is confirmed with modern instrumentation — halite is the main
      efflorescence phase (GEO-E030). But the comparative premise fails: halite efflorescence is
      documented at the Sphinx and other non-cast Egyptian limestone sites in the same climate
      (GEO-E031), and halite is reported as native to Giza nummulitic limestone (GEO-E032), with
      no concentration comparison ever run. The claim's discriminative content is undermined
      even as its observational content stands.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A peer-reviewed 2026 instrumental study directly reports exactly what the claim states —
      halite, calcite, quartz only, no nitrates, no widespread gypsum (GEO-E030). The strongest
      opposing consideration: sampling covered only efflorescence and detached fragments with a
      stated XRD detection limit, so the finding is real but bounded in scope.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The claim accurately restates what Sessa et al. attribute to Klemm & Klemm 2010 (GEO-E032),
      including the evaporitic mechanism quote. But the underlying Klemm & Klemm 2010 was not
      read — the support is second-hand through a conservation paper that itself infers
      "inherent components" from uncored detached fragments.
  - claimId: GEO-C594
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides a concrete, documented instance at the case's most-cited monument —
      1995–97 interventions with no available records, a sulfur-rich modern fill, and salt
      re-forming within about two years. The general claim about "almost no" megalithic site is
      plausible but extrapolated from one documented instance plus the absence of published
      histories elsewhere.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is carefully hedged ("have been argued"), and Fóti did make the argument
      (GEO-E014) — so as stated it is accurate but thin. The strongest opposing consideration:
      it is a proponent's interpretive argument that conventional Egyptology has never engaged,
      with no independent re-examination on either side.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As a reporting claim it is accurate: peer-reviewed SEM/petrographic analyses by the
      proponents do report organic matter and features they argue are inconsistent with natural
      volcanic stone (GEO-E006, GEO-E007). The strongest opposing consideration bears on
      diagnosticity, not existence of the report: same team, same sample set, questioned
      provenance, and no blind-tested criteria against natural volcanic analogues.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The abstract verified verbatim (GEO-E035) states every element of the model description:
      Khapia andesite sand, storage at Iwawe Stratum V, the organo-mineral binder, and the
      non-use of the piedras cansadas. As a theory-description claim it is accurately reported.
      The strongest opposing consideration: only the abstract was read (the PDF returned 403),
      and it appears in the proponents' own non-independent venue.