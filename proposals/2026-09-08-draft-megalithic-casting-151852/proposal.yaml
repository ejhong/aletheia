  research:
    - id: GEO-R012
      title: Survey Cerro Khapia (Ccapia) for andesite extraction surfaces and transport-stage blocks
      summary: "Both the orthodox provenance account and the proponents' 2020 model (GEO-E610) place the origin of Tiwanaku/Pumapunku andesite on Cerro Khapia, so quarry geochemistry cannot separate them (GEO-C030). Their field predictions differ: carving predicts extraction fronts with wedge, pounding or fire-setting traces, roughed-out ashlars, and a debris apron; the sand-aggregate model predicts worked scoria or sand deposits with loading features and no extraction fronts. The report attributes to Janusek et al. 2013 (blocked, unverified here) the statement that the Khapia andesite quarries were 'as yet undocumented' as of 2013. Desk phase: locate any post-2013 fieldwork on Khapia extraction surfaces. Field phase: walk and drone-map the flanks facing Iwawe, record any extraction surfaces and the lithology of the 'piedras cansadas' at the foothills, and sample loose material for grain-size and freshness against the Iwawe Stratum V description (GEO-R009)."
      claimIds:
        - GEO-C021
        - GEO-C903
        - GEO-C030
      track: small_grant
      effortTier: field
      informationGain: Documented andesite quarry faces on Khapia with in-transit dressed blocks would sharply undermine the sand-aggregate model and GEO-C021 for the andesite; their demonstrated absence after a systematic survey would be the first genuine orthodox gap in the Andean branch and would raise the stakes of GEO-R009. Either outcome moves GEO-C021 more than any further analysis of the proponents' existing samples.
      origin:
        ref: report 2026-09-08-report-megalithic-casting-125721
        extractedBy: claude-fable-5-1
        runId: 2026-09-08-draft-megalithic-casting-151852
