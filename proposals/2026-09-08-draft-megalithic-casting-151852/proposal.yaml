rationale: "Two of the report's key sources were retrievable this pass where the previous pass could not read them: Nemoy's 1939 translation of al-Suyuti's Tuhfat al-kiram (the archive.org PDF now text-extracted, 22 pages) and Sessa et al. 2026 (Scientific Reports, via the PMC open-access copy). Both are entered as ai_verified sources. Nemoy supplies negative evidence on GEO-C003 — the two al-Ma'mun entries describe fire, vinegar, iron tools, catapults, a well, chambers and a granite basin with rope, and mention no salt — and a scholarly dating of the caliph's Egyptian visit to AH 217 / AD 832, which unblocks the date correction the previous pass deferred. Sessa et al. supply the first in-situ characterization of the Queen's Chamber salt (halite only, by XRD and SEM-EDX), a statement that Na and Cl are probably inherent in the stone matrix, a citation of Klemm & Klemm 2010 for halite as a primary sedimentary salt of Giza nummulitic limestone — the natural-origin comparator GEO-C506 has lacked — and a documented cleaning of the chambers in 1995–1997 whose records are unavailable, a concrete instance for GEO-C594. The Geopolymer Institute page (already indexed) is re-read to record that its al-Ma'mun salt report carries no medieval citation; the earlier rejection of that observation was on direction, so it is re-proposed with a single direction (qualifies GEO-C003). The khufupyramid.dk transcription of Petrie 1883 is re-proposed as a secondary source now that an evidence record cites it. The Davidovits 2020 abstract is re-proposed as evidence with the direction the second reader asked for (supports GEO-C903; a separate weak supports record for GEO-C021). Cooperson, Tunyi & El-hemaly, Janusek et al., Kelany et al., Legon, Demortier, Klemm & Klemm, Hemeda & Sonbol and Isbell & Burkholder were not retrievable (HTTP 403, fetch failure, bot challenge) and remain blocked with routes; nothing from them is quoted. Edition left null: the verified findings deepen the salt line (already the assessment's weakest link) without changing the verdict; two article sentences ('has not been traced to a primary Arabic source', 'which nobody in this record has tested') will need softening in a pass that also lands Cooperson or Klemm & Klemm, and that is recorded as a blocked edition disposition."
