caseAssessment:
  verdict: unresolved
  loadBearing: [DEEP-C002, DEEP-C026, DEEP-C035, DEEP-C057, DEEP-C027, DEEP-C037]
  weakestLinks: [DEEP-C027, DEEP-C005, DEEP-C025, DEEP-C031, DEEP-C054, DEEP-C015]
  synthesis: >-
    The featured question asks how much of the cross-cultural resemblance among bird-men, handled
    objects, navel-names, feathered serpents, civilisers and flood stories belongs to a shared past.
    On the ledger as supplied, that question is not merely open — it is untouched by any evidence
    capable of discriminating the competing histories. All twelve evidence records derive from a
    single source, SRC-JHONG-2026, which is the founder's own self-published, AI-assisted web essay,
    flagged `verification: unverified`, and explicitly designated in the case file as hypothesis
    material rather than evidence. Every record is graded weak; several carry second-reader disputes
    noting that the quoted passage does not in fact bear on the claim it is attached to (E015, E017,
    E022 for DEEP-C037, E023, E024 for DEEP-C015). Roughly two-thirds of the assessed claims have no
    attached evidence record at all. The result is a case whose empirical spine — the 55% bird-person
    figure, the 37% cosmic-serpent figure, the 62.5%/9% lineup rates, the 263-summary flood coding,
    the image-pilot agreement statistics — consists entirely of unaudited self-reports of the
    proponent's own experiments, with method pages and coded data unretrieved. That is not a basis
    for a verdict in either direction on the substantive historical question.
    Steelmanning the deflationary side: the methodological claims (DEEP-C002, DEEP-C026, DEEP-C035,
    DEEP-C065, DEEP-C018) are close to deductive and are, in my judgement, correct — a distribution
    of a broad motif class is compatible with both independent invention and ancient transmission,
    and resemblance alone cannot underwrite claims about a source's identity, date or capabilities.
    The proponent's own reported findings (DEEP-C057, DEEP-C037, DEEP-C038) point the same way:
    the motif bundle does not stand out against documentation-preserving comparisons, and the
    measurement instrument is unstable under control conditions. Steelmanning the transmission side:
    those same self-reports are the only quantitative results available, and one of them
    (DEEP-C027) is prima facie favourable to the civiliser parallel; the deflationary tests coded
    broad narrative categories, which E019 concedes "are not the specific images or place names in
    the claim," so the conjunction proponents actually point to was never the thing measured.
    Both directions therefore rest on the same unaudited instrument. Until the research agenda
    (DEEP-R001 primary wear and excavation literature, DEEP-R002 the source history of the four
    navel names, DEEP-R003 a blind human lineup from source-level passages) returns independent
    text, the honest verdict on the case is unresolved — a statement about the ledger's evidentiary
    emptiness, not a hedge about the world.
  steelman: >-
    The catalogue test that reports the motif bundle "does not stand out" coded broad narrative
    classes — bird-person, cosmic serpent, sacred centre — and the source itself concedes those
    classes "are not the specific images or place names in the claim." What proponents point to is a
    tight conjunction, not three loose classes: a frontal humanoid with a raptor head, arms held to
    the body, gripping a small arched-handle container, appearing at Göbekli Tepe Pillar 43, on
    Neo-Assyrian apkallu reliefs and, in mutated form, in Olmec and Andean staff-bearer imagery. No
    record in this ledger estimates the base rate of that conjunction, and DEEP-C005/DEEP-C025 do not
    speak to it. Until someone measures how often the specific pose-plus-object-plus-arrangement
    co-occurs in a documentation-controlled sample, the deflationary result is a null on a different
    question than the one asked, and that gap is unanswered here.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is close to analytic: an explanation is historical only if it fixes when, where and
      by what route, and resemblance alone fixes none of these. No evidence record in the ledger
      bears on it, so this verdict leans on disciplinary priors in archaeology and art history rather
      than on the supplied records, and I say so explicitly. The strongest opposing consideration is
      that in practice extreme, arbitrary similarity (shared errors, shared idiosyncratic detail) can
      carry probative weight before dates and contexts are in hand — but even there the inference
      runs through an implicit model of what could have arisen independently, which is a claim about
      context.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only attached records, DEEP-E018 and DEEP-E019, are the author's own limitation statements
      and are graded `qualifies`, not `supports`; they narrow the finding rather than corroborate it.
      The claim is thus carried by the source anchor alone — an unaudited self-report of the
      proponent's own experiment, with the coded data and comparison design unretrieved. Its direction
      is against the featured hypothesis, which is worth noting since the source is the hypothesis's
      author and a proponent reporting a null against himself is mildly credibility-enhancing. The
      strongest opposing consideration is E019's own concession that broad narrative categories are
      not the specific images at issue, which makes the null a weak test of the interesting claim.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 are two halves of one sentence in a self-published page reporting the
      author's own AI lineup; the run data are not retrieved and the denominator of "completed
      lineups" is unenumerated, as the record's own limitations note. Even taken at face value the
      figure documents what an AI judge did with modern compressed retellings, which DEEP-R003 was
      written precisely to control for. The strongest opposing consideration is that a 62.5%-vs-9%
      gap is large enough to be hard to produce by pure noise, so the result is probably a real
      property of the instrument — but a real property of an unvalidated instrument fed possibly
      contaminated inputs is not evidence about antiquity.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record in this ledger documents a case of retelling-driven convergence, so the
      verdict rests on background knowledge — the well-attested harmonising effect of translation,
      missionary transmission, and Frazerian comparative synthesis on how myths are summarised — and
      I flag that dependence on priors. The claim as stated is modest ("can become more alike"), an
      existence claim, which makes it easy to satisfy. The strongest opposing consideration is that
      demonstrating the mechanism exists says nothing about how much of any particular observed
      resemblance it explains, and the ledger contains no such quantification.
  - claimId: DEEP-C035
    verdict: well_supported
    confidence: high
    reasoning: >-
      A lost-civilisation account asserts specific propositions about a source's identity, date and
      technical capabilities; similarity between derived motifs underdetermines all three, since the
      same similarity is produced by convergence, by shallow diffusion, and by any of indefinitely
      many possible sources. This is an entailment of the underdetermination point in DEEP-C002 and
      DEEP-C026 and needs no empirical record, though I note the ledger supplies none. The strongest
      opposing consideration is that resemblance can in principle constrain a source's date by
      bracketing the attested instances — but constraining is not establishing, and the claim as
      worded only denies establishment.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      A frequency-and-geography summary of a broad motif class is a marginal distribution; both
      independent invention under shared cognitive and ecological pressures and very old single-origin
      transmission predict wide, patchy spread, so the distribution alone cannot separate them without
      a phylogenetic or spatial-autocorrelation model plus a documentation-bias control. DEEP-E018's
      note on uneven catalogue coverage reinforces this indirectly. The verdict leans partly on
      general statistical reasoning rather than on records in the ledger. The strongest opposing
      consideration is that suitably structured distributional analysis — nested clade structure,
      distance-decay against known migration routes — genuinely can discriminate; the claim survives
      because it says "by itself."
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim follows from the reported 55% and 37% figures plus a sacred-centre class, but those
      figures are themselves unaudited self-reports (DEEP-E013, DEEP-E016), and the only records
      attached here, DEEP-E018 and DEEP-E019, are the author's own coverage caveats. "Widespread" is
      also undefined against a threshold. The strongest opposing consideration is that if the coding
      is broad enough — any bird-person of any kind — near-universality is close to guaranteed by
      construction, making the finding true but uninformative rather than false.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim's own truth condition is that the coded data reproduce 55% of 926 traditions, and the
      coded data have not been retrieved; DEEP-E013 and DEEP-E014 merely restate the page's assertion,
      while the second reader correctly notes DEEP-E015 is a scope caveat rather than support.
      DEEP-E018 records the author's admission that the 2016 catalogue's coverage is uneven,
      particularly for the ancient Near East and Rapa Nui — the very regions the case cares about.
      The strongest opposing consideration is that a self-reported descriptive count from a public
      dataset is cheap to check and unlikely to be fabricated, so the figure is probably roughly
      right; but "probably roughly right" is not verification, and category-boundary choices could
      move it substantially.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Identical footing to DEEP-C005: DEEP-E016 restates the 37% figure from the same unaudited page,
      DEEP-E017 is a scope caveat the second reader flags as not bearing on the number, and
      DEEP-E018/E019 are the author's coverage limitations. No independent access to the coded
      catalogue is on record. The strongest opposing consideration is again that the figure is a
      simple count from a published catalogue and could be checked easily — which is an argument for
      auditing it, not for crediting it now.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record addresses this claim, so the verdict leans on background iconographic
      knowledge, which I flag: the Neo-Assyrian apkallu is a hybrid or masked attendant, the Rapanui
      tangata manu is a ritual office and its image a composite emblem, and shamanic
      bird-transformation is a narrative process — these are different concepts held together only by
      the English gloss. The claim's stated truth condition (that the compared images fall into
      different categories) is therefore plausibly met by the case's own gallery. The strongest
      opposing consideration is that emic categories may not respect this three-way analytic split;
      a tradition could regard mask, hybrid and transformation as one continuum, which would make the
      distinction the analyst's rather than the material's.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record supports this; the only anchor is the page's caption "statue c. 1000–1200 CE,
      carvings later." Background knowledge of the Hoa Hakananai'a literature, in which the dorsal
      birdman reliefs are read as a later addition cutting across the earlier moai surface, makes the
      claim plausible, and I flag that this rests on priors rather than on the ledger. The strongest
      opposing consideration is that "later" in that literature is a stylistic and superposition
      inference, not an absolute date on the carvings, so the interval is not independently fixed —
      and the ledger contains nothing at all on the point.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      That a shared silhouette does not entail a shared use is a straightforward point about
      underdetermination, illustrated within the case itself by the same arched-handle outline being
      read as a bucket, an incense pouch, and an object of unknown function. No evidence record is
      attached; the verdict is conceptual and I mark it as such. The strongest opposing consideration
      is that form and function are not fully independent — a handle implies carrying, a rim implies
      containment — so the questions are separable but correlated; the claim survives because it
      asserts separateness, not independence.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is attached; the claim rests on the page's caption and on background
      Assyriology, in which the banduddû bucket paired with a cone-shaped purifier appears in
      purification ritual contexts. I flag the reliance on priors. The strongest opposing
      consideration is that "supports" is doing quiet work: the ritual texts name a bucket, but the
      inference from named implement to the object depicted in a given relief is an art-historical
      identification, and DEEP-R001 was written precisely because no primary text has been read into
      this ledger.
  - claimId: DEEP-C012
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      This is a negative claim about the state of the literature — that the excavation team has
      published no secure functional identification of the Pillar 43 arched forms — and the ledger
      contains no record verifying it; DEEP-R001 exists to retrieve the Tepe Telegrams posts and
      related papers. Background knowledge that the Göbekli iconography remains interpretively open
      makes it plausible, and I flag that dependence. The strongest opposing consideration is that
      negative claims about a literature are exactly the kind that dissolve on retrieval: a proposed
      identification may well exist in the excavators' commentary without being "secure," and the
      claim's wording lets it survive that, which makes it hard to falsify.
  - claimId: DEEP-C009
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E023 does not report the wear study's findings; it records that the page points readers to
      Vidale & Micheli, and the second reader correctly reclassifies it as context rather than
      support. The claim's truth condition explicitly requires that the published wear-trace study
      report handle wear of that kind, and that paper has not been retrieved. The strongest opposing
      consideration is that the citation is specific and checkable, and functional wear analysis on a
      chlorite handle is an ordinary result, so the claim is likely true — but likelihood from a
      secondary pointer is not the evidence the claim's own wording demands.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is comparative and checkable — Greek omphalos attested in antiquity in the builders'
      own cultural language, Cusco's "navel" gloss recorded by Garcilaso in 1609 well after the fact,
      Te Pito o te Henua recorded by outsiders in the nineteenth century, Göbekli Tepe a modern
      Turkish toponym unconnected to any Neolithic usage — and on background grounds these plainly
      differ in language, date of first record and builder usage. No evidence record establishes any
      of this; DEEP-R002 is the open task. The strongest opposing consideration is that the Rapanui
      and Quechua cases may have deeper indigenous attestation than a modern-recording framing
      concedes, which would narrow but not erase the asymmetry.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      DEEP-E024 is the only record listing this claim, and its quoted text concerns the Kurdish
      "wish hill" gloss and says nothing about the Turkish name being descriptive of the mound's
      form; the second reader flags this as irrelevant to DEEP-C015. The claim's truth condition
      requires documentation that the toponym is descriptive rather than a sacred designation, and no
      such documentation is in the ledger. Background plausibility favours a descriptive reading of
      "pot-bellied hill," but that is a prior, not evidence, and the specific descriptive-versus-sacred
      contrast is exactly what has not been checked.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is deliberately weak — material constraint as a *plausible contributor* — and the
      underlying mechanics are uncontroversial: unsupported projecting limbs in stone are fracture-prone
      during carving, transport and erection, so keeping arms against the body is structurally
      advantageous. No evidence record is attached, so this leans on general materials reasoning,
      which I flag. The strongest opposing consideration is that the same hands-to-abdomen pose recurs
      in wood, ceramic and metal figures where the constraint does not apply, which suggests convention
      or iconography can drive the pose independently; that weakens the constraint's explanatory share
      without falsifying its plausibility as a contributor.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Berossus's Oannes — a fish-bodied sage emerging from the sea to teach the arts — has long been
      aligned with the fish-cloaked apkallu of Mesopotamian art and text, and the correspondence is
      standard rather than idiosyncratic. No evidence record in this ledger substantiates it; the
      verdict rests on background Assyriology and is flagged as such. The strongest opposing
      consideration is that Berossus wrote in Greek in the Hellenistic period and may have
      reformulated or conflated earlier traditions, so "corresponds to" is a scholarly reconstruction
      across a substantial gap, not a documented equivalence in a single source.
  - claimId: DEEP-C028
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The Gate of the Sun's staff-bearer belongs to a pre-literate Andean tradition, so no
      pre-Columbian text names it, and the "Viracocha" label enters through later scholarly
      identification; on those grounds the claim is likely correct. No evidence record in the ledger
      addresses it, so this leans on priors. The strongest opposing consideration is the claim's own
      truth condition, "no pre-modern source names that figure Viracocha": colonial chroniclers such
      as Cieza and Betanzos did associate Tiwanaku with Viracocha's creative acts, and whether any of
      them names *that carving* is precisely the unchecked point that could flip the verdict.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger is attached to this claim at all; it rests solely on the source
      anchor's assertion that the coded summaries "show regional clustering." The claim's truth
      condition names a "stated measure" that has not been retrieved, and clustering results are
      highly sensitive to the coding scheme and distance metric chosen. The strongest opposing
      consideration is that regional clustering of flood-story details is antecedently very likely on
      diffusion grounds alone, so the claim is probably true — but a probably-true claim with zero
      supporting records is unresolved on this ledger, not supported.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      As with DEEP-C031, no evidence record is attached; the split from DEEP-C032 preserved the source
      anchor but no record documents the pilot's output. "Uneven distribution" is also unquantified,
      and the Genesis-associated detail set is not enumerated in anything supplied. The strongest
      opposing consideration is that unevenness is nearly guaranteed for any specific detail set
      across 263 heterogeneous summaries — which makes the claim easy to satisfy but also means its
      being true would carry little information about transmission versus missionary contamination.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 quotes the page directly — "Matching the kinds of objects changed the lineup result" —
      and the second reader accepts the match for this claim while disputing its attachment to
      DEEP-C037. It remains a self-report of an unretrieved pilot whose limitations note incomplete
      runs and cropping effects. The finding is methodologically important because it implies the
      lineup measures object category as much as iconographic resemblance. The strongest opposing
      consideration is that "changed the result" is unquantified: a small rank shift and a total
      reversal are both consistent with the wording, and only the underlying data would distinguish
      them.
  - claimId: DEEP-C037
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only record listing this claim, DEEP-E022, quotes a sentence about kind-matching that says
      nothing about inter-judge agreement, and the second reader flags exactly this mismatch; the
      claim therefore stands on the source anchor's phrase "strong disagreement between judges" with
      no agreement statistics in hand, while the claim's truth condition demands them. Background
      expectation that model judges show poor agreement on open-ended iconographic similarity supports
      plausibility, and I flag that as a prior. The strongest opposing consideration is that "strong
      disagreement" is a qualitative characterisation by the experiment's own author, who has an
      interest in appearing self-critical, and the direction of any bias in such self-reporting is not
      obvious.
sensitivity:
  record: DEEP-E020
  survives: true
  note: >-
    DEEP-E020 (with its twin DEEP-E021) carries the only quantitative result in the ledger that
    points toward the featured hypothesis — the 62.5%-versus-9% civiliser lineup rate. Removing it
    leaves the case verdict unchanged at unresolved, because the deflationary side is not carried by
    any independently verified record either; it would merely reduce the affirmative side from one
    unaudited self-report to none. The deeper fragility is not in any single record but in the
    single source: all twelve evidence records trace to SRC-JHONG-2026, which is unverified and
    designated hypothesis material. Removing that source empties the ledger entirely, and the case
    verdict would then be unresolved for the trivial reason that nothing had been assessed.