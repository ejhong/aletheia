caseAssessment:
  verdict: mixed
  loadBearing: [GEO-C020, GEO-C021, GEO-C004, GEO-C012, GEO-C030]
  weakestLinks: [GEO-C003, GEO-C506, GEO-C013, GEO-C006, GEO-C005]
  synthesis: >-
    The evidence supports neither a general cast-stone attribution nor an
    across-the-board rejection of casting at every monument. The strongest
    attribution record concerns Great Pyramid limestone, where the balance
    points against GEO-C020. Barsoum's SEM/TEM study, GEO-E012, reports genuine
    microstructural observations interpreted as rapid precipitation from a
    basic solution and is the strongest supporting record. Its force is reduced
    by disputed sample provenance, a limited natural comparison set, and
    subsequent reports that the highlighted feature classes also occur in
    natural limestone. Against it, GEO-E018 describes sedimentary bedding,
    fossils, burrows, ripple lamination, block-confined tectonic fractures, and
    other natural features across numerous blocks in situ. GEO-E020 adds the
    particularly important positive-control comparison: a known Davidovits
    geopolymer exhibited binder chemistry and fabric absent from the casing
    stones, while the allegedly anomalous siliceous microconstituents occurred
    in natural limestone as well. GEO-E019 and GEO-E021 provide further
    sample-level negative results. These records do not logically inspect
    every Great Pyramid block, but they make the stated existential attribution
    substantially less likely.

    Pumapunku is less settled. GEO-E006 and GEO-E007 report organic matter and
    microstructures interpreted as evidence of artificial andesite, but they
    are one proponent team's analyses of the same questioned sample set, with
    no independent replication or blind-tested diagnostic criteria. GEO-E008
    associates sandstone with natural quarry sources, although provenance
    alone does not exclude casting from material collected at those sources.
    That qualification gives GEO-C030 a valid narrow core: matching a quarry
    fingerprint is not, by itself, a manufacturing-history test. It does not
    justify the stronger suggestion that materials analysis generally cannot
    identify casting, because GEO-E020 demonstrates that binder-aware
    petrography with a positive control can detect a known artificial matrix.

    The mechanism evidence establishes possibilities more readily than ancient
    occurrence. Natron availability is well supported, and attaining roughly
    850 degrees Celsius is plausible partly from general pyrotechnological
    priors, but the ledger lacks an independently characterized large-block
    replication using a fully specified ancient-feasible process. Likewise,
    the measured dolerite removal rate in GEO-E001 challenges pounders as the
    sole granite-working method under that experiment's conditions, but it
    does not select casting over other supplemental techniques. The salt line
    is weaker still: modern analysis confirms halite in pyramid efflorescence,
    while GEO-E031 and GEO-E032 document the same phenomenon at natural
    Egyptian limestone sites and provide a sedimentary origin. The claimed
    medieval salt-layer report is uncited and absent from the Arabic
    compilation examined.

    Steelmanning the hypothesis, it offers direct laboratory reports at two
    major sites, a chemically feasible family of binders, and a sound warning
    that provenance studies can answer where feedstock originated without
    answering whether it was reconstituted. Steelmanning the conventional
    account, broad in-situ geological structure, natural controls, and a known
    geopolymer positive control collectively outperform isolated,
    provenance-disputed supporting samples. The resulting case verdict is
    mixed: Great Pyramid casting is contradicted on the current balance,
    whereas Pumapunku retains weak but unrebutted direct support. GEO-E020 is
    the single record whose removal would most change this assessment because
    it supplies the only known-cast positive control and directly addresses
    diagnosticity. The mixed verdict survives its removal, however, because
    GEO-E018, GEO-E019, and GEO-E021 still weigh against Great Pyramid casting
    while the unreplicated Pumapunku evidence remains on the supporting side.
  steelman: >-
    The Pumapunku papers report organic matter embedded within andesite and
    microstructures interpreted as an organo-mineral binder, yet no evidence
    record provides a provenance-secure, blinded, independent reanalysis that
    identifies a natural volcanic process, contamination history, or
    restoration material accounting for those same features. That specific
    observation remains the strongest unanswered argument for at least one
    cast monument stone.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The attribution evidence divides by site: several direct petrographic
      records weigh against Great Pyramid casting, while one unreplicated
      Pumapunku sample set points toward artificial andesite. Mechanism and
      quarry-method arguments establish possibility or underdetermination, not
      occurrence. The strongest supporting consideration is the reported
      Pumapunku microstructure; the strongest opposing consideration is the
      natural geological fabric and absent artificial binder reported across
      the pyramid studies.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 reports broad in-situ sedimentary and tectonic features, and
      GEO-E020 finds that known geopolymer binder signatures are absent from
      the tested casing stones while the alleged diagnostic particles also
      occur naturally. GEO-E019 and GEO-E021 add negative sample analyses from
      other investigators. The strongest opposing consideration is GEO-E012,
      which reports unusual microconstituents consistent with reconstitution,
      but its provenance is contested and its diagnostic interpretation is
      directly challenged. Because the claim is existential and sampling is
      incomplete, the contradiction is substantial rather than logically
      exhaustive.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 provide direct analytical support for artificial
      Pumapunku andesite, but they derive from the same proponent team and
      sample set and lack independent replication. GEO-E008 supports natural
      quarry provenance for the sandstone, although that result does not by
      itself distinguish carved stone from reconstitution using same-source
      material. The strongest opposing consideration is the questioned sample
      provenance and absence of blind-tested criteria separating binder
      residues from natural volcanic phases. The evidence also supplies no
      comparable direct positive analysis for the claim's red-sandstone
      component.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006 and GEO-E007 directly establish that published SEM and
      petrographic analyses report the stated organic matter and
      microstructural features and that their authors interpret them as
      inconsistent with natural andesite. The strongest opposing consideration
      is the disputed sample provenance and possibility of natural organic or
      glassy phases, but those issues challenge the authors' inference rather
      than the accurately framed claim that the reports and argument exist.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 quotes the 2020 abstract specifying natural Cerro Khapia
      andesite sand, storage at Iwawe Stratum V, and rejection of the
      quadrangular piedras cansadas as construction material. This directly
      establishes the claim as a description of Davidovits' model, not as
      validation of that model. The strongest opposing consideration is that
      only a proponent-published abstract was examined, but it explicitly
      contains every material element of the descriptive claim.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow methodological point that XRF and ICP-based
      quarry fingerprints omit light-element and binder information and thus
      cannot alone distinguish a natural block from a same-source aggregate
      composite. GEO-E009 shows that a strong provenance match can answer the
      source question without experimentally testing that manufacturing
      distinction. The strongest opposing consideration is GEO-E020, whose
      positive control demonstrates that binder-aware petrography can detect a
      real artificial matrix, so the blindness argument cannot be generalized
      to materials analysis as a whole. The claim is therefore supported as a
      limitation of quarry matching, but its categorical wording about the
      listed methods exceeds the direct validation in the ledger.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large re-agglomerated limestone blocks,
      while GEO-E022 demonstrates room-temperature formation of a C-S-H binder
      from lime and diatomaceous earth. These records establish chemical
      plausibility but do not provide independent characterization of a large
      demonstration block made through a fully specified ancient-feasible
      process. The strongest opposing consideration is the absence of
      independent replication, durability testing, and evidence that the
      required process scales under ancient production constraints.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      GEO-E016 offers a pre-pyramid glassmaking precedent for temperatures
      around 850 degrees Celsius, although its dating and temperature basis
      remain unverified within the evidence record. General pyrotechnological
      background makes charcoal-and-bellows attainment of that temperature
      plausible, so this verdict partly relies on prior knowledge rather than
      strong case evidence. The strongest opposing consideration is that
      crucible-scale temperature attainment does not establish sustained,
      industrial-scale natron processing.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 strongly identifies Wadi el Natrun and al-Barnuj as the main
      ancient Egyptian natron sources for vitreous industries and documents
      their seventh-to-ninth-century decline and replacement by plant ash.
      GEO-E011 supplies compatible compositional context for distinguishing
      natron glass from plant-ash glass. The strongest opposing consideration
      is that these records concern glass and faience rather than stone-making,
      but that limits the claim's implication, not its historical statement
      about natron supply.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 supplies only an unattributed anecdote that rock-like material
      formed in a repeatedly used outdoor fire pit. The strongest opposing
      consideration is the complete absence of controlled replication,
      compositional analysis, or evidence that the product was artificial
      stone rather than ordinary fused, carbonated, or compacted ash.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the stated controlled photogrammetric result of
      approximately 216 cubic centimetres per hour at 85 strikes per minute.
      Because the claim describes that experiment rather than a universal
      ancient rate, the single-study design does not negate it. The strongest
      opposing consideration is that other granite, tool, maintenance, and
      operator configurations could yield different rates.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using dolerite pounders have not
      reproduced a scoop mark, but the assertion is anecdotal and provides no
      attempt count, effort duration, success criterion, or systematic survey.
      The strongest opposing consideration is that informal tourist strikes
      are not a controlled reproduction attempt and cannot establish what
      skilled crews could achieve.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 directly carries the proponent's observation that the shafts are
      roughly sixteen feet deep and too narrow for effective bottom striking.
      The strongest opposing consideration is that neither the dimensions nor
      the biomechanical inference has been independently surveyed or
      experimentally tested.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E002 confirms only that Engelbach's monograph originated the
      pounder account and included a brief personal trial and workforce
      estimates. The more precise assertions about no mass measurement and a
      count-divided-by-four heuristic appear only in an editor inference that
      the record expressly says has not been checked against the monograph.
      That unverified characterization is the strongest supporting
      consideration and simultaneously the principal weakness, leaving the
      full claim unresolved.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E004 traces the salt-layer story only to an unreferenced proponent
      account, and GEO-E029 confirms that the page names no medieval author or
      text. GEO-E027 finds no salt in the examined compilation's two
      al-Ma'mun narratives despite their detailed descriptions of the breach
      and finds, while GEO-E028 corrects the associated date toward 832. The
      strongest opposing consideration is that several other medieval Arabic
      works remain unread, so an account could still be located. On the
      evidence actually supplied, however, the asserted historical report has
      no traceable anchor and the checked narratives contradict its current
      presentation.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms surface NaCl on Great Pyramid interior
      limestone, but the claim also requires anomalously high concentrations
      relative to comparable natural monuments. GEO-E031 reports halite
      efflorescence at Egyptian limestone sites including the bedrock-carved
      Sphinx, and GEO-E032 gives a sedimentary explanation for halite in Giza
      limestone. The strongest supporting consideration is the clear modern
      detection of halite, whereas the lack of quantitative concentration
      comparisons and the contrary Egyptian comparators defeat the stated
      uniqueness premise.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX identification of Na and Cl in the
      efflorescence and XRD identification of only halite, calcite, and quartz
      in the seven analyzed samples, with no nitrates or widespread gypsum
      crust. The strongest opposing consideration is the XRD detection limit
      and restriction to detached, salt-affected material, which leave open
      minor undetected phases. Those limitations do not overturn the
      accurately scoped report of what the analyses identified.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports Na and Cl in detached substrate fragments and cites
      geological work describing halite within Giza stratigraphic layers as a
      precipitate from evaporating marine or lagoonal water. This supports a
      native sedimentary origin, but the underlying Klemm and Klemm study was
      not read directly and the phrase "primary constituent" is stronger than
      the evidence record's clearer formulation, "primary salt." The strongest
      opposing consideration is therefore the second-hand citation and lack of
      direct measurements from protected unworked bedrock in this ledger.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 supplies a concrete example at the Khufu pyramid: 1995–1997
      cleaning and cavity filling are evident, but their intervention records
      are unavailable, and a sulfur-rich modern fill is detectable. This
      establishes a serious restoration confound at one central site but does
      not establish the sweeping prevalence claim that almost no megalithic
      site has a complete history. The strongest opposing consideration is the
      absence of any systematic cross-site restoration audit in the evidence
      records.
  - claimId: GEO-C005
    verdict: established
    confidence: moderate
    reasoning: >-
      GEO-E014 directly establishes that Fóti has argued that the Rekhmire
      scene's scale and apparatus fit mineral or waterglass processing better
      than bronze casting, while also recording the conventional metal-casting
      interpretation. The claim is framed as the existence of that argument,
      not as proof that the reinterpretation is correct. The strongest
      opposing consideration is that the argument comes from one proponent and
      has not been tested through Egyptological analysis of the image and its
      inscriptions.