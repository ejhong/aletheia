  synthesis: >-
    The featured hypothesis that at least some major megalithic monuments contain cast reconstituted stone rather than exclusively carved-and-transported natural rock remains unresolved on the ledger evidence. The two primary attribution targets diverge sharply. For Great Pyramid limestone blocks (GEO-C020), multiple independent petrographic and multi-technique studies (Folk & Campbell in-situ bedding, fossils, worm tubes and tectonic fractures confined to blocks; Harrell & Penrod on the Lauer specimen; Jana's positive-control comparison showing alkali-aluminosilicate binder signatures absent from casing stones while present in genuine Davidovits geopolymer and natural opal-CT lepispheres shared with Tura limestone; Freestone & Middleton on a British Museum fragment) establish natural sedimentary and diagenetic features incompatible with bulk casting or alkali-geopolymer binders. Barsoum 2006 SEM/TEM microconstituents and the later MacKenzie NMR calcium-silicate gel reading supply the strongest non-proponent support, yet sample provenance was publicly disputed by Egyptian authorities, the features are acknowledged as possibly natural, and Jana demonstrates binder-aware methods detect casting signatures when present. Salt observations (GEO-C003, GEO-C506) collapse as discriminators once Sessa et al. document halite as inherent to Giza nummulitic limestone and common at carved-bedrock sites including the Sphinx. Feasibility of reconstitution (GEO-C012) is separately well-supported by modern demos and lime-pozzolan chemistry available with ancient natron and pyrotechnology (GEO-C010, GEO-C011 established), but feasibility is not occurrence. For Pumapunku/Tiwanaku andesite and sandstone (GEO-C021), the sole positive materials evidence is the Davidovits team's own SEM/petrography reporting organics and microstructures (GEO-C004), with no independent replication, contested custody, and a 1971 quarry attribution for the sandstones; the 2020 model (GEO-C903) correctly shifts to uncrushed Khapia sand at Iwawe but remains untested against the excavators' descriptions. GEO-C030 correctly notes that bulk trace-element quarry matching (XRF/ICP-MS) is blind to light-element binder chemistry and therefore cannot alone refute cast-from-same-aggregate stone, yet this methodological limit does not touch binder-aware petrography or the pyramid fossil/bedding evidence. Tool-mark and rate observations at Aswan (GEO-C001 well-supported at 216 cm³/h; GEO-C002/C006/C502 weaker or thin historical base) raise legitimate questions about pure pounding efficiency for granite but do not positively demonstrate casting. Surface-morphology and mural reinterpretations remain anecdotal or single-author. Restoration-history gaps (GEO-C594) further caution against surface readings. Collectively the ledger shows a live materials-science possibility, a correct methods caveat on provenance over-reach, strong negative petrography against the best-studied Egyptian claim, and unreplicated proponent-only positives for the Andean claim. No single monument is established as cast; the absence of the decisive secure-sample, binder-aware, multi-site study noted in the case summary keeps the existence claim open rather than supported or fully contradicted. Steelman both sides: orthodox carving-plus-transport accommodates the petrographic majority and quarry matches but strains on rate/logistics for the largest granite and andesite elements and has not systematically tested the light-element or authigenic-phase predictions; casting accommodates feasibility, some microstructures and morphological oddities but fails the positive-control and fossil/bedding tests on pyramid stone and lacks independent confirmation elsewhere.
  steelman: >-
    The Davidovits-team SEM and petrographic reports of organic matter and non-natural microstructural features inside Pumapunku andesite (plus the parallel Barsoum/MacKenzie microconstituent and C–S–H-gel readings on certain pyramid samples) remain without independent replication or definitive alternative mineralogical explanation on provenance-secure material, leaving open the possibility that a subset of blocks carry a once-wet engineered binder phase that standard quarry-matching never tested.
  sensitivity: >-
    GEO-E020 (Jana 2007 positive-control petrography). Its removal would most weaken the contradiction of GEO-C020 by eliminating the only direct demonstration that a real geopolymer binder signature is detectable and absent; the case verdict would shift from unresolved toward mixed or provisionally_supported for the broader hypothesis, but would not fully reverse because Folk & Campbell in-situ features (GEO-E018), Harrell & Penrod (GEO-E019) and Freestone & Middleton (GEO-E021) would still stand against bulk casting of the examined pyramid stones. The verdict therefore does not hang on a single thread.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The existence claim requires at least one secure positive identification. Pyramid evidence is contradicted by multi-study petrography showing natural features and absent binder signatures; Pumapunku rests solely on unreplicated proponent SEM. Feasibility and methods caveats keep the door open but do not establish occurrence. Strongest opposing consideration is the cumulative natural-limestone diagnostics on the best-sampled monument.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: high
    reasoning: >-
      Folk & Campbell document bedding, fossils, fragile worm tubes and block-confined tectonic fractures across in-situ blocks; Jana's positive-control comparison finds alkali-aluminosilicate enrichment only in genuine geopolymer, not casing stones, while shared opal-CT lepispheres occur in natural Tura limestone; Harrell & Penrod and Freestone & Middleton likewise read examined specimens as natural Mokattam/Tura limestone without zeolite or re-aggregation fabric. Barsoum and MacKenzie anomalies are real but on disputed-provenance samples and are compatible with natural variation or a minority C–S–H reading that Jana did not test. Strongest opposing consideration remains the Barsoum microconstituents if future secure-sample work confirms them as non-natural.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Only the Davidovits-team 2019 SEM/petrography papers report organics and microstructures argued as artificial; the 1971 Ponce quarry attribution for sandstones and the absence of independent replication leave the claim open. The 2020 model refinement does not add new materials data. Strongest opposing consideration is the lack of any non-proponent laboratory confirmation and possible natural glassy/organic phases in volcanic rocks.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a descriptive statement about what the published Davidovits et al. 2019 papers report; the evidence records confirm those papers do report organic matter and microstructural features the authors interpret as inconsistent with natural andesite. Strongest opposing consideration is that the interpretive step (inconsistency) is contested and unreplicated, but the claim itself is about the publications' content.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      The 2020 abstract directly states the model elements (uncrushed Cerro Khapia andesite sand stored at Iwawe Stratum V; piedras cansadas not used as building material). Strongest opposing consideration is that only the abstract was available and the journal is proponent-run, yet the descriptive claim matches the source text.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      XRF and ICP-MS are indeed insensitive to hydrogen, carbon and oxygen, so bulk metallic fingerprints of aggregate-matched cast stone would match quarry stone; Fóti's articulation is correct on that narrow point and is illustrated by the Nash Stonehenge result. Jana shows the limit does not extend to binder-aware petrography or SEM-EDS. Strongest opposing consideration is over-extension of the critique to all analytical methods, which Fóti himself partially concedes.
  - claimId: GEO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Davidovits-group demonstration blocks, Sierra et al. room-temperature lime-diatomaceous-earth C–S–H formation, and the chemical availability of natron plus achievable temperatures establish that reconstituted limestone visually and mechanically similar to natural stone can be produced with ancient-accessible inputs. Scale and durability under pyramid conditions remain unproven, but the claim is only "can be". Strongest opposing consideration is that modern lab or yard demos do not prove ancient industrial practice.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Natron melts near 851 °C; charcoal-and-bellows pyrotechnology sufficient for glass, faience and metal work is archaeologically attested in Egypt well before the pyramids, and Badari-period references supply a temperature precedent. Industrial throughput is a separate scaling question. Strongest opposing consideration is that crucible-scale heat does not automatically equal the sustained volumes needed for monument-scale slurry.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006 document Wadi el Natrun and al-Barnuj as primary ancient Egyptian natron sources for the vitreous-materials industry, with a clear 7th–9th-century AD decline and shift to plant ash. Sayre & Smith supply the compositional typology. Strongest opposing consideration is that the papers address glass/faience, not stone, yet the claim itself is only about natron sources and supply history.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole evidence is an unattributed anecdote in Fóti of rock-like material forming in a long-used fire pit; no controlled replication, quantification or independent observation exists. Ash-carbonation chemistry is plausible in principle but untested here. Strongest opposing consideration is the complete absence of experimental confirmation.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Marčiš et al. 2023 photogrammetric experiment directly measured 216 cm³/h at 85 strikes/min on granite with a dolerite pounder and concluded against pounders as sole method. Single-team limitation acknowledged, yet the figure is the only modern quantitative datum. Strongest opposing consideration is that skilled ancient crews with optimized tools and continuous work might achieve higher sustained rates.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti reports collective visitor failure to reproduce scoop marks on the designated Aswan test block with original pounders; the report is anecdotal, with unquantified attempt rates and no systematic wear survey. Strongest opposing consideration is the lack of controlled or documented experimental protocol.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti describes the shafts as roughly sixteen feet deep and too narrow for effective bottom-of-shaft pounding posture; no independent dimensional survey or biomechanical test is supplied. Strongest opposing consideration is that the geometric and ergonomic claims remain unverified field measurements.
  - claimId: GEO-C502
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Engelbach 1922/1923 is the acknowledged foundation of the pounding orthodoxy; the ledger characterization of a single self-conducted hour-scale trial without mass-removed measurement and a count-divided-by-four workforce heuristic is consistent with the thin methodological base later authors inherited. Direct page-level verification of every detail against the monograph is still pending. Strongest opposing consideration is possible additional unpublished or scattered practical knowledge not captured in the 1922 report.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The sole positive carrier is an uncited statement on the Geopolymer Institute page dating the event to 820 AD; al-Suyūṭī's compilation of the principal medieval Arabic accounts of al-Maʾmūn's breach (Nemoy 1939) describes the opening, finds and chambers in two entries plus a third mention yet contains no reference to salt, halite or wall coatings. Nemoy dates the Egyptian stay to 832. Strongest opposing consideration is that other unread Arabic sources (full Maqrīzī, ʿAbd al-Laṭīf, Vyse extracts) might still contain the report.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Sessa et al. confirm surface halite efflorescence inside the Queen's Chamber, yet the same paper and its citations document halite as a frequent dominant salt at multiple Egyptian limestone monuments including the carved-bedrock Sphinx, and treat NaCl as a primary sedimentary constituent of Giza nummulitic limestone precipitated from marine/lagoonal waters. The uniqueness clause therefore fails; European cathedrals were the wrong comparator. Strongest opposing consideration would be a future bulk-chlorine or concentration comparison showing pyramid interiors anomalously enriched beyond bedrock baselines.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      Sessa et al. 2026 XRD of seven samples and SEM-EDX of efflorescence explicitly identify only halite, calcite and quartz, with no nitrates and no evidence of widespread gypsum crusts. Strongest opposing consideration is the XRD detection limit (<5 wt%) and restriction to surface/detached material, yet the claim accurately reports the published findings.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. cite Klemm & Klemm 2010 for halite as the primary salt within the stratigraphic layers of Giza nummulitic limestones, precipitated from evaporating marine or lagoonal waters; SEM-EDX of detached substrate also found Na and Cl treated as inherent. The statement is second-hand but consistently reported. Strongest opposing consideration is that Klemm & Klemm itself has not been read directly in the ledger.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. supply a concrete instance at the Khufu pyramid: 1995–97 cleaning and cavity-filling interventions lack available documentation, sulfur-rich modern fills are detectable by XRF, and extensive salt efflorescence re-formed within roughly two years after limited 2022 observations. The generalisation to almost no megalithic site having complete published restoration histories is a reasonable inference from the pattern and the research agenda. Strongest opposing consideration is that the claim is broad and the direct evidence is currently one well-documented monument.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti argues that scale and apparatus details in the Rekhmire tomb mural fit mineral/waterglass processing better than the conventional bronze-casting reading; the claim correctly notes that such an argument has been made. No Egyptological engagement or residue confirmation exists. Strongest opposing consideration is the unbroken conventional identification of the scene as metal casting.