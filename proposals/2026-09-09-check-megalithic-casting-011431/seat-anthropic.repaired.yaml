caseAssessment:
  verdict: weakly_supported
  loadBearing: [GEO-C022, GEO-C020, GEO-C021, GEO-C012, GEO-C030, GEO-C004]
  weakestLinks: [GEO-C003, GEO-C506, GEO-C002, GEO-C013, GEO-C006, GEO-C005]
  synthesis: >-
    The ledger separates into three strata that support each other less than the case framing
    implies. The mechanism stratum is in reasonable shape: natron supply at industrial scale is
    established by mainstream work (GEO-E010); ~850 °C is within uncontested ancient
    pyrotechnology; lime-pozzolan and alkali-activated binders demonstrably form stone-like
    solids from plausibly available materials (GEO-E022), against a background of lime mortar
    millennia before the pyramids. Nothing in this stratum is controversial, and nothing in it
    is evidence that any monument was cast. Feasibility is not occurrence, and the ledger's own
    editor note on GEO-E022 says exactly that. The attribution stratum is where the case must be
    won, and there the best-tested target goes against it. For Great Pyramid limestone the record
    holds one independent supporting dataset with real anomalies (Barsoum 2006), whose sample
    provenance was publicly denied by Egypt's antiquities authority and never re-secured, plus a
    partly non-independent NMR paper that quietly replaces the alkali-aluminosilicate geopolymer
    with a calcium-silicate gel. Against it stand in-situ sedimentary and tectonic features
    across many blocks (GEO-E018), an independent multi-technique analysis of a museum casing
    fragment (GEO-E021), and the only study in the exchange carrying a positive control
    (GEO-E020), which showed a genuine Davidovits geopolymer has an unmistakable Na+K/Al binder
    signature that casing stones lack, and that Barsoum's Si-rich spherules occur in ordinary
    limestone as opal-CT. That control also bounds the methods critique (GEO-C030): the
    H/C/O-blindness point is correct for XRF and ICP-MS and correctly denies that a quarry match
    refutes casting, but it does not reach binder-aware petrography, and its inclusion of XRD is
    simply wrong. The observation stratum is weakest and has been eroding under the project's own
    verification: the al-Ma'mun salt report has no nameable medieval author and is absent from the
    principal Arabic compilation; the anomalous-salt premise fails because halite effloresces on
    the carved-bedrock Sphinx and is reported as native to Giza strata; the tourist-pounding,
    fire-pit, shaft-geometry and Rekhmire items are anecdote or unmeasured interpretation. The
    Marčiš rate is a real measurement and a real problem for the orthodox timeline, but a slow
    pounding rate argues for supplementary mechanical techniques long before it argues for
    chemistry. Andean casting (GEO-C021) is the one attribution never directly tested — one team,
    one sample set, no replication, opposed only by a 1971 provenance report — which is why the
    case is weakly_supported rather than contradicted. Sensitivity: the record whose removal
    would most change the case verdict is GEO-E020 (Jana 2007), the only positive-controlled
    study, which both dissolves Barsoum's spherules and caps GEO-C030's protective reach. Without
    it the verdict survives — GEO-E018 and GEO-E021 still carry GEO-C020 negative, though at
    reduced strength (contradicted would soften toward mixed) and the methods critique would go
    largely unanswered. The case verdict is not hanging on one thread, but the Egyptian margin
    narrows appreciably.
  steelman: >-
    Barsoum 2006's hydrated calcite/dolomite-like phases "not known to hydrate in nature" and
    Si:Ca:Mg ratios matching none of six local quarries, together with MacKenzie 2011's
    ²⁹Si/⁴³Ca NMR reading of a Bent Pyramid casing stone as Tura grains in an amorphous
    calcium-silicate gel, have never been tested against a lime-pozzolan (C–S–H) binder
    hypothesis on provenance-secure samples by anyone. Jana's decisive negative was calibrated
    against an alkali-aluminosilicate control and is blind to precisely the binder chemistry the
    proponents' own best data now propose; Freestone & Middleton examined one fragment; Folk &
    Campbell predate the microstructural claim entirely. No study in this ledger has looked for
    a C–S–H binder in a pyramid block and failed to find one.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      As an existence claim across all megalithic monuments this is the case thesis, and it rests
      on two thin legs: the Egyptian limestone line, where direct petrography with a positive
      control weighs against casting, and the Andean line, where support is one non-replicated
      proponent dataset. Cast stone is a real and ancient technology class, so nothing here is a
      priori implausible, but no monument has yet yielded a binder signature on a
      provenance-secure sample under binder-aware methods. The strongest opposing consideration
      is GEO-E020: when a known geopolymer was analysed beside monument stone, the artificial
      specimen was immediately distinguishable, so the "our methods cannot see it" defence does
      not cover the studies that actually looked.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Four undermining records (GEO-E018, E019, E020, E021) examine pyramid and casing stone with
      petrography, XRD, SEM-EDS, IR and a genuine geopolymer control and find natural limestone
      with no aggregate-cement fabric and no binder enrichment; bedding, burrows and intact
      fragile fossils across many in-situ blocks are hard to produce by casting. Support is
      Barsoum 2006, whose sampling permission was publicly denied, plus MacKenzie 2011, which
      shares an author and changes the proposed binder. The strongest opposing consideration is
      that binder change: Jana's negative is alkali-specific and does not test a calcium-silicate
      gel, leaving the revised recipe of GEO-E017 untested — hence moderate, not high, confidence.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Affirmative evidence is GEO-E006 and GEO-E007 — one team, one sample set, two papers,
      restated in 2020 (GEO-E036) — reporting organic matter and microstructures read as
      geopolymeric, with no independent replication and questioned chain of custody. The counter
      is a 1971 provenance attribution of the red sandstones to natural quarries (GEO-E008),
      limited both by its era and by the narrow, correct version of GEO-C030. The strongest
      opposing consideration is that volcanic rocks host glassy and organic phases naturally and
      the discriminating criteria have never been blind-tested; equally, no one has run Jana's
      positive-control design at Pumapunku, so this is closer to untested than refuted.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Read as stated — that published SEM and petrographic analyses report such features and that
      their authors argue for inconsistency with natural volcanic stone — this is simply true of
      GEO-E006 and GEO-E007 in peer-reviewed venues. The claim asserts nothing about
      diagnosticity, and I assess it as written. The strongest opposing consideration is that its
      apparent weight comes from conflating "authors report and argue" with "the features are
      diagnostic"; the two papers are one line of evidence, and diagnosticity is untested.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is a description of a theory, and GEO-E035 quotes the 2020 abstract directly for each
      element: uncrushed natural Khapia andesite sand, storage at Iwawe Stratum V citing Isbell &
      Burkholder 2002, and the explicit statement that the quadrangular piedras cansadas were not
      used as building material. The strongest opposing consideration is that only the abstract
      and landing page were read (the PDF returned 403), so a qualification in the body could
      shift details — a small risk for a claim tied this closely to quoted language.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The core logic is sound and important: PXRF and ICP-MS do not measure H, C or O, they are
      calibrated on natural-rock assumptions, and an elemental quarry match cannot by
      construction separate carved stone from stone cast with that quarry's aggregate — which
      correctly blunts GEO-E009 and GEO-E008 as anti-casting arguments. But the claim overreaches
      by naming XRD, a phase-identification method actually used to look for and exclude zeolite
      binder (GEO-E018), and the ledger records further errors in Fóti's methods table (NMR). The
      strongest opposing consideration is GEO-E020's positive control, which shows binder
      signatures are visible to binder-aware petrography, so this claim licenses far less
      protection than proponents draw from it.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      That a lime- or alkali-bound limestone composite can be made from ancient-accessible inputs
      is well grounded: GEO-E022 shows C–S–H gel forming from lime and diatomaceous earth at room
      temperature, and background knowledge (lime mortar, Roman concrete, Coade stone) makes the
      chemistry unremarkable — I flag that part of this rests on priors. The demanding part —
      large blocks visually indistinguishable from natural stone — is carried only by the
      proponent organisation's self-report (GEO-E013), never independently analysed. The
      strongest opposing consideration is Jana's finding that a genuine Davidovits geopolymeric
      limestone was texturally distinct from natural limestone at the microscale.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The ledger's record here is weak (GEO-E016 is Fóti citing Badari glassmaking with dating
      unverified), so this verdict leans substantially on general background rather than on the
      evidence records: charcoal with forced draught routinely exceeded 1000 °C in ancient copper
      smelting, faience and pottery kilns, making 850 °C uncontroversial. The strongest opposing
      consideration is scale: crucible- and kiln-scale temperatures are not the same as
      sustaining 850 °C over construction-programme tonnages, and the ledger contains no thermal
      or fuel-budget analysis at that scale.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 is mainstream peer-reviewed work identifying Wadi el Natrun and al-Barnuj as the
      primary natron sources for the vitreous-materials industry and documenting the 7th–9th
      century decline and substitution by plant ash — exactly what the claim asserts. Sayre &
      Smith's dual-oxide criterion (GEO-E011) supplies the analytical basis for such timelines.
      The strongest opposing consideration is scope rather than truth: "industrial-scale" is
      established for glass and faience, and the source says nothing about stone, so this claim
      contributes ingredient availability and a supply discontinuity, not casting.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole evidence is GEO-E015, an unattributed anecdote about rock-like material in a
      long-used fire pit, flagged as under-sourced by the project's own skeptical review, with no
      replication attempted (GEO-R007 proposes one). The underlying chemistry is not absurd — ash
      carries CaO and alkali carbonates and carbonation can cement a compacted mass — but that is
      plausibility from priors, not evidence. The strongest opposing consideration is that
      hearths are among the most excavated contexts in archaeology, so incidentally cemented ash
      bodies should be a routine documented find rather than an anecdote if the pathway were as
      productive as claimed.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E001 is a peer-reviewed photogrammetric measurement reporting exactly the stated figure
      and strike rate, with the authors themselves concluding against dolerite pounders as the
      sole method. Confidence is moderate only because it is a single team, tool configuration
      and granite, with no replication (GEO-R002). The strongest opposing consideration is that
      experimental operators with unmaintained tools plausibly underperform trained ancient
      crews, so the number constrains the orthodox timeline less tightly than proponents infer —
      and a slow rate points first to supplementary mechanical techniques, not chemistry.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 is a proponent report with no attempt count, no cumulative-effort measure and no
      wear survey of the test block; "no documented success" is near-guaranteed where nobody
      documents anything, making the claim close to unfalsifiable as framed. It is probably
      locally true in that trivial sense. The strongest opposing consideration is the asymmetry
      with GEO-E001: casual visitor strikes over unknown durations tell us little when a
      controlled experiment measured a nonzero removal rate of 216 cm³/h.
  - claimId: GEO-C006
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E005 is Fóti's unsurveyed description; the ledger states plainly that shaft dimensions
      were never independently measured and the biomechanical claim never tested, and GEO-R013
      exists because both the prospecting-pit and settling-vessel readings are unmeasured
      conjecture. With no geometry and no residue data, neither direction is warranted. The
      strongest opposing consideration against the claim's implicit inference is Engelbach's
      test-shaft reading: prospecting pits need not have been pounded from a standing posture at
      their base and may predate the trench, dissolving the anomaly without any chemistry.
  - claimId: GEO-C502
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The characterisation of Engelbach's evidentiary base — one self-conducted hour-long trial,
      an assumed 8 mm/hour rammer rate, a workforce inferred from groove spacing, and his own
      view that pounders were not used entirely by hand — comes from Fóti, and GEO-E002 states
      explicitly that it has not been checked against the 1922 or 1923 texts. The description is
      internally coherent and the general point about a thin experimental base is plausible. The
      strongest opposing consideration is GEO-C911: Kelany et al. attribute the pounding-only
      conclusion to Röder 1965 on the basis of the mass of hammer stones in the quarry, so the
      orthodoxy does not trace to Engelbach alone and discrediting him would not discredit it.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: low
    reasoning: >-
      The claim's only carrier is an uncited proponent web page that also misdates the event to
      820 (GEO-E029, GEO-E028), while the principal medieval Arabic compilation of al-Ma'mun
      accounts describes the breach in detail — wall thickness, jar of dinars, sarcophagus, worn
      rope — and never mentions salt or any wall coating (GEO-E027). A widely repeated report
      with no nameable author, absent from the leading compilation, is best read as an artifact
      of proponent retelling. The strongest opposing consideration is that this is negative
      evidence within one compilation: al-Maqrīzī's full Khiṭaṭ, ʿAbd al-Laṭīf and the Vyse
      extracts remain unread, which is why confidence is low.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The presence half is now instrumentally confirmed — the efflorescence is halite (GEO-E030)
      — but the claim's discriminating content is comparative, and that fails: halite
      efflorescence is documented at other Egyptian limestone monuments including the Sphinx,
      carved from Giza bedrock, and at rock-cut tombs (GEO-E031), and Klemm & Klemm are cited for
      halite as a primary sedimentary constituent of the Giza nummulitic limestone (GEO-E032).
      The proponents' comparator, European cathedrals, is the wrong lithology and climate
      (GEO-E026). The strongest opposing consideration is that no study has compared
      concentrations quantitatively or tested bulk versus surface distribution, so a genuine
      quantitative anomaly is not strictly excluded — the point of GEO-R010.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E030 quotes the paper directly: XRD of seven samples confirmed only halite, calcite and
      quartz, with no nitrates and no evidence of widespread gypsum, while SEM-EDX of the white
      efflorescence detected only Na and Cl with an R = 0.969 Na–Cl correlation. The claim is a
      faithful restatement of a recent open-access study by a non-proponent conservation team.
      The strongest opposing consideration is the stated sub-5 wt% XRD detection limit and the
      localised sulfur enrichment at P27–P28 on a restored area, so "no gypsum at all" would
      overreach — but the claim says "no widespread gypsum crusts", which the data support.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is carefully scoped to what Sessa et al. report Klemm & Klemm as saying, and
      GEO-E032 quotes exactly that, including the evaporating marine or lagoonal waters mechanism
      and the corroborating Hemeda & Sonbol composition listing halite in Khufu backing blocks;
      it also fits standard sedimentology for shallow-marine carbonate sequences. The strongest
      opposing consideration is that this is a second-hand citation — neither Klemm & Klemm 2010
      nor Hemeda & Sonbol 2020 was read, and "inherent components" was inferred from detached
      fragments rather than cored stone, leaving GEO-R010 as the decisive check.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E034 supplies a strong concrete instance at the case's most-cited monument: 1995–97
      interventions inside Khufu whose documentation is unavailable, visible cleaning and
      cavity-filling, a sulfur-rich modern fill detected by XRF at a restored area, and
      efflorescence that re-formed extensively within about two years. That establishes the
      methodological point that surface-based claims need a documented restoration baseline. The
      strongest opposing consideration is that the claim quantifies over almost all megalithic
      sites on the strength of one exemplar plus project notes, so its generality leans on priors
      about heritage documentation rather than on the systematic audit GEO-R005 would supply.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      As literally worded the claim asserts only that such an argument has been made, which
      GEO-E014 attests; the substantive reinterpretation is a single proponent's reading of scale
      and apparatus, unengaged by Egyptology and with no checked prediction about residues or
      tools. Nothing in the record tests it either way. The strongest opposing consideration is
      that the conventional bronze-casting reading is anchored in accompanying inscriptions and a
      large corpus of comparable metalworking scenes and surviving metallurgical remains, so the
      interpretive burden sits with the revision — which GEO-R008 implicitly concedes.