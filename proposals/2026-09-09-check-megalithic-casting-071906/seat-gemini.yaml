    reasoning: >-
      This claim relies on an informal, anecdotal observation reported by Fóti regarding casual visitor attempts on a display test block at the Aswan quarry. There are no documented strike logs, standardized biomechanical parameters, or measured volumetric assessments recording these tourist attempts. The strongest opposing consideration is that informal, untrained tourist strikes on an unanchored surface do not constitute a controlled experimental test of skilled stone-masonry techniques.
  - claimId: GEO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Field observations by Engelbach (1922) and Fóti document deep, narrow vertical trenches and exploratory pits alongside the Unfinished Obelisk that present severe spatial constraints for human workers attempting full-range downward hammerstone swings. Biomechanical efficiency in confined vertical shafts roughly 0.6–0.8 m wide is inherently limited. The strongest opposing consideration is that ancient quarrymen utilized rammers, dropped weights, or stepped excavation benches rather than unassisted standing hand-pounding at the bottom of narrow shafts.
  - claimId: GEO-C502
    verdict: established
    confidence: high
    reasoning: >-
      The statement accurately details the published contents of Reginald Engelbach's foundational 1922 report on the Aswan Obelisk. Engelbach explicitly records his own one-hour hand trial yielding approximately 5 mm of depth over a small area, admits pounders were unlikely used purely by unassisted hand pounding for deep trenching, and extrapolates overall workforce logistics using an assumed 8 mm/hour rammer rate and trench spacing. The strongest opposing consideration is that subsequent quarry archaeology (e.g., Kelany et al. 2009) expanded upon Engelbach's model with extensive surveys of tool blanks and debitage.
  - claimId: GEO-C003
