  - claimId: GEO-C506
    verdict: contradicted
    confidence: high
    reasoning: >-
      Recent conservation analyses (Sessa et al. 2026) show that halite (NaCl) efflorescence in the Great Pyramid is driven by moisture mobilization of soluble salts naturally embedded in the Eocene nummulitic limestone bedrock. Furthermore, identical halite efflorescence is extensively documented across other Egyptian limestone monuments, including the rock-cut Sphinx, tombs at Lisht, and Saqqara structures that are unquestionably carved from natural bedrock. The comparative premise that the Great Pyramid uniquely exhibits surface NaCl absent from natural limestone monuments is factually false. The strongest opposing consideration is that the proponent literature compares Giza to European cathedrals rather than regional North African marine limestone.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      Sessa et al. (2026), utilizing XRD and SEM-EDX on efflorescence and detached fragments from the Queen's Chamber and Thieves' Corridor of the Khufu Pyramid, explicitly confirmed that the crystalline mineral phases present are restricted to halite, calcite, and quartz, while finding no nitrate phases and no widespread gypsum crusts. The claim accurately reports the peer-reviewed analytical finding. The strongest opposing consideration is that the XRD detection limit was approximately 5 wt%, leaving trace mineral phases undetected.
  - claimId: GEO-C906
    verdict: established
    confidence: high
    reasoning: >-
      The geological literature on the Giza plateau (Klemm & Klemm 2010, cited and corroborated by Sessa et al. 2026) demonstrates that halite is a primary, syngenetic constituent of the local Eocene nummulitic limestone, deposited during the evaporation of marine or lagoonal waters during original rock formation. Sodium and chlorine are present throughout unweathered bedrock strata. The strongest opposing consideration is that secondary groundwater wicking or capillary rise can introduce post-depositional halite into limestone formations.
  - claimId: GEO-C594
