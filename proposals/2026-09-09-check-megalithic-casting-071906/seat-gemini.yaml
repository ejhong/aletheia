    reasoning: >-
      The specific measurement is directly confirmed by Marčiš et al. (2023), who conducted controlled experimental granite pounder trials with photogrammetric tracking, recording an average granite removal rate of 216 cm³ per hour at an operational strike rate of 85 blows per minute. The empirical measurement itself is peer-reviewed and accurately transcribed. The strongest opposing consideration is that an isolated experimental test by modern experimenters may not reflect the maximum efficiency, tooling maintenance, or collective rhythm achieved by specialized ancient quarry workforces.
  - claimId: GEO-C002
    verdict: weakly_supported
