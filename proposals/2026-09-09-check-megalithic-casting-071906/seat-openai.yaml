caseAssessment:
  verdict: mixed
  loadBearing: [GEO-C022, GEO-C020, GEO-C021, GEO-C004, GEO-C030, GEO-C012]
  weakestLinks: [GEO-C003, GEO-C506, GEO-C021, GEO-C012]
  synthesis: >-
    The evidence does not establish that any identified major monument contains
    cast stone, but it also does not uniformly point in one direction across
    every site and proposed binder. The Great Pyramid branch is substantially
    contradicted. Its strongest support is GEO-E012, which reports unusual
    microconstituents in samples attributed to pyramid blocks, supplemented by
    the related NMR result GEO-E017 and general calcium-silicate feasibility in
    GEO-E022. Against that stand broader in-situ geological observations in
    GEO-E018, direct examination of a proponent showcase sample in GEO-E019,
    positive-control comparative petrography in GEO-E020, and an independent
    museum-fragment analysis in GEO-E021. These negative records identify
    ordinary sedimentary structures, natural opal-CT, and an absence of the
    alkali-rich binder fabric actually observed in manufactured geopolymer.
    Their convergence matters more than institutional alignment or publication
    count. The remaining heterogeneity and sample-identity disputes prevent
    extrapolation to every pyramid block, but the examined material favors
    quarried natural limestone.

    The salt argument does not repair that attribution. Modern analysis confirms
    halite efflorescence, yet the comparative assertion that such salt is absent
    from natural limestone monuments is undermined by reports from the Sphinx
    and other Egyptian sites and by a stated sedimentary origin for Giza
    halite. The alleged medieval salt-layer account is presently traceable only
    to an uncited proponent page and is absent from the Arabic compilation
    examined. The narrow methodological point behind GEO-C030 remains valid:
    trace-element quarry matching alone cannot distinguish an intact block from
    a composite made entirely from geochemically matching source material.
    Its broader formulation is not sustained, because XRD and binder-aware
    petrography can examine phases and fabrics, and GEO-E020 demonstrates
    detectability using a manufactured positive control.

    The Pumapunku branch is the strongest counterweight. Proponent analyses
    report internal carbon- and nitrogen-bearing amorphous matter and other
    features interpreted as engineered, and simple surface dirt does not fully
    explain the reported interior occurrence. However, the key andesite
    fragment was selected from loose debris outside the protected monument
    area, was not tied to an identified block, lacked a geological-andesite
    control, and has not been independently replicated. Thus the local report
    of an anomaly is established while its transfer to architectural blocks
    and its interpretation as a binder remain weak.

    The strongest argument against casting is therefore direct petrography of
    Egyptian stones; the strongest argument for it is the combination of the
    revised calcium-silicate NMR interpretation and the unexplained Pumapunku
    interior material. Feasibility evidence shows that some stone-like
    composites can be made from broadly ancient-compatible inputs, but it does
    not establish archaeological occurrence or production at monumental scale.
    Accordingly, the case is mixed rather than supported: its best-tested major
    attribution is contradicted, while another attribution retains weak,
    materially interesting but provenance-insecure support. GEO-E020 is the
    single evidence record whose removal would most change this verdict because
    it uniquely supplies a manufactured positive control. The mixed verdict
    survives without GEO-E020, since GEO-E018, GEO-E019, and GEO-E021 still
    favor natural pyramid limestone, but the Egyptian conclusion would be less
    secure and the positive evidence would weigh more heavily.
  steelman: >-
    The record does not answer the Bent Pyramid NMR result in GEO-E017: a casing
    sample was interpreted as Tura limestone grains cemented by amorphous
    calcium-silicate hydrate, while the strongest positive-control negative
    study tested an alkali-aluminosilicate geopolymer rather than aged C-S-H.
    No blinded comparison against a broad natural quarry suite and an aged
    C-S-H positive control is present.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record securely identifies a cast block from a major
      monument, and the best-tested Great Pyramid branch favors natural
      limestone. Nevertheless, this is a broad existential claim, so negative
      results from selected Egyptian and Stonehenge specimens cannot exclude
      every block or every major monument. The strongest opposing consideration
      is the reported Bent Pyramid NMR anomaly and the Pumapunku interior
      material, neither of which has received a decisive matched-control test.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 through GEO-E021 collectively favor natural limestone, including
      broad in-situ sedimentary observations, direct petrography, and a
      manufactured-geopolymer positive control. GEO-E012 and GEO-E017 provide
      genuine contrary observations, but they use small comparison sets, have
      provenance or independence limitations, and propose different binder
      chemistries. The strongest opposing consideration is GEO-E017's C-S-H
      interpretation, which the alkali-geopolymer control in GEO-E020 did not
      test; confidence is therefore moderate rather than high for this
      existential claim about some blocks.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report petrographic and organic anomalies
      interpreted as artificial stone, but they are one non-independent
      proponent line. For the andesite, GEO-E057 and GEO-E060 show that the key
      fragment was loose, was not tied to an identified architectural block,
      and was not compared with natural Khapia andesite. The strongest opposing
      consideration is that natural quarry provenance and potentially natural
      volcanic amorphous phases remain viable, while no blinded independent
      replication is in evidence.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      The claim is about what published analyses report and how their authors
      interpret it, not about whether that interpretation is correct.
      GEO-E006, GEO-E007, and GEO-E058 directly document reports of
      microstructural anomalies and carbon- and nitrogen-bearing amorphous
      matter, including an interior subsample. The strongest opposing
      consideration is the lack of secure architectural provenance and a
      natural-andesite control, which sharply limits the report's implication
      for casting but does not negate that the report was made.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E057 quotes the analysts' own account that PP1 was selected from loose
      debris outside the protected monument area based on its apparently
      monumental flat surface. It also states that the sampled material was a
      fragment lying on the ground rather than an identified catalogued block.
      The strongest opposing consideration is that being outside the protected
      area does not prove the fragment was unrelated to the monument.
  - claimId: GEO-C918
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E058 directly records the analysts' report that PP1C was cut from the
      fragment's interior and contained similar carbon- and nitrogen-bearing
      amorphous material beneath plagioclase crystals. This establishes the
      stated reporting claim and makes surface-only contamination an incomplete
      account of the analysts' observation. The strongest opposing
      consideration is that EDS did not identify a molecular organic compound,
      and the result still inherits PP1's uncertain provenance.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 reproduces the 2020 model's abstract: natural andesite sand from
      Cerro Khapia was transported to Iwawe, while the quadrangular piedras
      cansadas were said not to have supplied the construction material. That
      directly establishes this claim as a description of the proponents'
      model. The strongest opposing consideration is that only the abstract was
      examined, so the archaeological basis for the model was not verified.
  - claimId: GEO-C030
    verdict: mixed
    confidence: high
    reasoning: >-
      The narrow proposition is sound: XRF and ICP trace-element quarry matching
      cannot by itself distinguish an intact source block from a composite made
      from material carrying the same trace-element fingerprint. The claim
      becomes overbroad by grouping XRD with those methods and implying that
      analytical work is generally blind to casting, because phase-sensitive
      and binder-aware petrography can detect engineered fabrics. GEO-E020 is
      the strongest opposing consideration, as its positive control detected a
      manufactured binder absent from the casing samples.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports large demonstration blocks, while GEO-E022 independently
      establishes that lime and diatomaceous earth can form a C-S-H cementing
      phase at room temperature. These records make production of some
      stone-like limestone composites plausible, but the large blocks are
      self-reported and lack independent mechanical or compositional
      characterization. The strongest opposing consideration is the absence of
      a replicated ancient-input process demonstrating monumental scale,
      durability, and close resemblance to the relevant natural limestone.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 offers a pre-pyramid glassmaking precedent for temperatures near
      850 °C, although its dating and temperature basis have not been
      independently verified in this ledger. General pyrotechnological
      plausibility also favors the ability of charcoal and forced air to reach
      this temperature, so the verdict partly leans on scientific prior
      knowledge rather than strong case-specific evidence. The strongest
      opposing consideration is that achieving a temperature in a small hot
      zone does not demonstrate sustained industrial-scale natron processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as primary
      ancient Egyptian natron sources used by the vitreous-materials industry
      and documents the medieval shift toward plant ash. GEO-E011 supplies the
      compositional framework used to distinguish natron from plant-ash glass.
      The strongest opposing consideration is that these records establish
      natron availability for glass and faience, not its use in manufactured
      stone.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 provides one report of rock-like material forming in a repeatedly
      used outdoor fire pit, which is directionally consistent with the claim.
      It is unattributed, uncontrolled, and lacks chemical or mechanical
      characterization, so it does not yet establish ash-carbonation as the
      cause. The strongest opposing consideration is the complete absence of a
      controlled replication distinguishing artificial stone from ordinary
      fused ash, clinker, or compacted residue.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the controlled photogrammetric result of
      approximately 216 cm³ per hour at 85 strikes per minute. The claim is
      limited to that experimental configuration and does not assert a universal
      ancient quarrying rate. The strongest opposing consideration is that one
      team, granite, pounder configuration, and operator protocol may not
      represent optimized ancient practice.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitor attempts have not reproduced a scoop mark,
      but the number, duration, technique, and documentation of those attempts
      are unspecified. GEO-E002 provides historical context for the pounding
      account without independently documenting the visitor experiment. The
      strongest opposing consideration is that untrained, brief visitor strikes
      are not a controlled test of skilled quarrying and cannot establish
      decades of uniformly unsuccessful attempts.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the shafts' approximate depth and the proponent's
      biomechanical judgment that effective bottom strikes were impossible.
      No independent dimensional survey, posture reconstruction, or experimental
      test is in evidence. The strongest opposing consideration is that the
      shafts may have been worked progressively before reaching their final
      depth or may have served a function not requiring a worker to strike from
      inside the completed opening.
  - claimId: GEO-C502
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E002 supports the general characterization that Engelbach relied on a
      brief self-conducted trial and heuristic workforce estimates. However, its
      exact numerical details are presented in editor inference that expressly
      says they still require checking against the monograph, and no evidence
      record is directly linked to GEO-C502. The strongest opposing
      consideration is that the claim is a detailed compound account whose
      trench-width, rammer-rate, groove-spacing, and non-hand-pounding clauses
      have not all been independently verified here.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only affirmative record is an uncited proponent webpage, while
      GEO-E027 finds no salt reference in the examined compilation's two
      al-Ma'mun breach accounts. GEO-E028 also corrects the associated date from
      the asserted 820 to an Egyptian visit in 832, and GEO-E029 confirms that
      no medieval source is named. The strongest opposing consideration is that
      only one later compilation has been searched, so an unexamined Arabic
      source could still contain the report.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 confirms surface halite at the Great Pyramid but supplies no
      concentration comparison with natural monuments. GEO-E031 reports halite
      efflorescence at other Egyptian limestone sites, including the
      carved-bedrock Sphinx, while GEO-E032 presents halite as inherent to Giza
      nummulitic limestone. The strongest opposing consideration is that no
      controlled quantitative comparison with unworked Giza bedrock has yet
      been performed, so an unusual concentration remains possible even though
      the stated absence from comparators is not supported.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX and XRD identification of halite,
      calcite, and quartz in the sampled efflorescence and detached fragments,
      with no nitrates or widespread gypsum crusts detected. The claim properly
      describes the reported analytical result rather than asserting that no
      minor undetected phase exists. The strongest opposing consideration is
      the stated XRD detection limit, under which minor sulfate phases could
      have escaped detection.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports that Klemm and Klemm identify halite within Giza
      nummulitic limestone strata and interpret it as a precipitate from the
      original marine or lagoonal environment. Detached substrate fragments
      also contained sodium and chlorine, consistent with an inherent source.
      The strongest opposing consideration is that the underlying Klemm and
      Klemm study was not read directly and the modern observations did not
      include cores from unworked bedrock.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides a concrete and relevant example at Khufu: cleaning and
      cavity filling occurred in 1995–97 without available intervention
      records, and modern sulfur-rich fill is analytically visible. That
      establishes restoration uncertainty at one central site and demonstrates
      a real confound for surface evidence. The strongest opposing
      consideration is that one monument cannot substantiate the global
      quantifier that almost no megalithic site has a complete published
      restoration history.
  - claimId: GEO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E014 establishes that Fóti has argued that the Rekhmire scene's scale
      and apparatus fit mineral or waterglass processing better than bronze
      casting, while also recording the conventional metal-casting reading.
      Thus the existence of the proposed reinterpretation is supported, but its
      comparative fit has not been independently assessed. The strongest
      opposing consideration is the absence of engagement from Egyptologists
      or historians of ancient metallurgy and the lack of residue,
      inscriptional, or apparatus evidence favoring mineral processing.