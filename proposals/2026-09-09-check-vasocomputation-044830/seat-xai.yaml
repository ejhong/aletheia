caseAssessment:
  verdict: unresolved
  loadBearing: [VASO-C010, VASO-C011, VASO-C005, VASO-C002, VASO-C030]
  weakestLinks: [VASO-C020, VASO-C021, VASO-C022, VASO-C004]
  synthesis: >-
    The ledger's lower mechanism and observation rungs are largely intact while the featured attribution collapses for want of any direct observation at the tissue compartment it names. Latch-bridge force maintenance after activation falls is textbook smooth-muscle physiology (Hai & Murphy and the kinetic model), slow breathing reproducibly shifts global autonomic balance toward parasympathetic dominance, and local hemodynamics can modulate nearby neurons on rapid timescales (Salameh 2024 mechanosensitive channels). Active tender sites are measurably distinct from nearby tissue in biochemistry (acidic mediator-rich milieu), stiffness (sonoelastography area ordering active > latent > normal), and at least one Doppler index (higher pulsatility, more frequent retrograde diastolic flow). Spontaneous needle-EMG activity is more prevalent at the millimeter nidus than at non-tender sites and is absent from taut-band sites outside the endplate zone; a cognitive stressor can raise that activity selectively. Manual trigger-point identification lacks demonstrated inter-examiner reliability and a validated reference standard, and the construct itself remains contested. These facts jointly support the weak reading that something discrete, electrically maintained, chemically angry, stiffer, and flow-abnormal is present and that "state not scar" is a live possibility once an objective seconds-scale release is shown. They do not support the strong reading that the entity is microvascular smooth muscle held in latch. The critical report's grade-D audit finds no synchronized imaging of a seconds-scale local release under exhalation and no identification of latched smooth muscle at a tender point. The VASO-S001 evidence map shows that energetic economy has never been measured in any arteriole, that pressurized skeletal-muscle arterioles hold constriction under maintained or rising LC20 phosphorylation rather than the latch signature, and that the single paired-caliber comparison found latch behaviour in a parent artery but absent one branch order downstream. Ballyns Doppler vessels are conduit-scale (>1 mm, 1–2 cm away) and the authors themselves list skeletal contracture compression as an equal explanation for high-resistance flow. First-person felt release under pressure-plus-exhale remains uninstrumented testimony. Hemo-neural modulation is real but instantaneous; hysteresis is not yet write–store–read memory, and no experiment has shown vascular state carrying a neural trace. Contemplative map convergence is an uncoded assertion. Consequently the central claim VASO-C020 and its mental-life extension VASO-C021 stand unresolved: the borrowed mechanism is real, the peripheral observations are real, the linking measurements have never been made, and the one compartment-level look already taken points away from economical dephosphorylated hold. The case is therefore not weakly supported overall; it is a stack whose foundation is established science and whose load-bearing middle and upper storeys have simply not been built. Removal of the S001 arteriole findings or the grade-D audit would reopen the extrapolation but would not create positive evidence; the verdict remains unresolved either way because positive evidence was never present. Decisive tests (keystone release imaging with perfusion-before-stiffness ordering, paired-caliber latch assay under stimulus withdrawal, write–store–read vascular memory) are well-posed and still unrun.
  steelman: >-
    The selective, site-specific rise in spontaneous EMG at the tender nidus under a purely cognitive stressor (mental arithmetic) with adjacent fibers remaining quiet, together with the first-person report that the same sites can be released in seconds by pressure timed to a long exhale and that long-standing sites require repeated sessions while fresh ones yield immediately, remains unexplained by any conventional scar, densification, or generalized sympathetic-arousal account and would be the expected signature if an addressable, history-dependent, autonomically writable vascular hold existed.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record demonstrates that vascular smooth-muscle tension stores or participates in predictions, expectations, or clinging; Johnson 2023 states the hypotheses without data, and the critical report correctly notes that latch hysteresis fails the write–store–read criteria of biological memory. The strongest opposing consideration is that even demonstrated hemo-neural modulation (Salameh) is instantaneous gain control, not content-addressable storage.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Direct identification of latched microvascular smooth muscle at a tender point is absent (grade-D audit), energetic economy has never been measured in any arteriole, and pressurized skeletal-muscle arterioles show maintained activation rather than dephosphorylated hold. Biochemistry, stiffness, and partial flow differences plus EMG chatter are compatible with ischemia or guarding but do not select the vascular-latch mechanism over conventional accounts; Ballyns vessels are conduit-scale and the authors list contracture compression as an equal explanation. Strongest opposing consideration is the complete lack of any positive compartment-level latch observation.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole record is an uncited essay assertion that traditional maps cluster on midline and limbs; no blinded coding against vascular or autonomic geography has been performed. Strongest opposing consideration is post-hoc resemblance without a pre-registered spatial test or chance baseline.
  - claimId: VASO-C010
    verdict: established
    confidence: high
    reasoning: >-
      Hai & Murphy 1988 and the subsequent kinetic literature establish that dephosphorylated attached cross-bridges can maintain force at low energetic cost after activating signals fall; this is textbook. VASO-S001 qualifies that the behaviour is not generic across all vessel phenotypes and has not been shown in arterioles, but the claim states a capability, not a universal distribution. Strongest opposing consideration is the femoral-to-saphenous divergence and the absence of microvascular energetic data.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The conditional logic is sound: tissue remodeling operates on days-to-weeks timescales, so an objective seconds-scale local release would imply an actively maintained state. The premise itself (objective seconds-scale release) remains unmeasured; only first-person felt release is recorded. Strongest opposing consideration is that fascial densification or other reversible non-vascular states could also satisfy the conditional if they reverse fast enough.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Moore & Cao proposed candidate mechanical, thermal and chemical pathways; Salameh 2024 supplies direct causal evidence that physiological blood-pressure pulsations modulate central neuronal activity via mechanosensitive channels on rapid timescales. The claim is the weak "can modulate" form, not storage. Strongest opposing consideration is that the demonstration is in rat brain, not human peripheral tender-point tissue, and shows instantaneous rather than stored effects.
  - claimId: VASO-C013
    verdict: established
    confidence: high
    reasoning: >-
      Zaccaro et al. 2018 systematic review documents reproducible increases in RSA, HRV and related autonomic indices under slow breathing in healthy humans, consistent with parasympathetic shift. Strongest opposing consideration is that the evidence is global cardiovascular, not local tissue or tender-point specific.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lucas 2009 systematic review concludes manual examination lacks demonstrated reliability and validity in the absence of a reference standard; Quintner et al. 2015 argue the construct rests on circular reasoning; even the Ballyns proponent group concedes examiner dependence. Strongest opposing consideration is the Dommerholt & Gerwin rebuttal and the possibility that imaging-anchored localization escapes the palpation problem.
  - claimId: VASO-C001
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Clinical and imaging literature treat discrete tender palpable points as common, and Ballyns frames "muscle knots" as a prevalent condition, yet the critical report correctly notes that skeptics dispute the ontological status and reproducibility of the spots themselves, not merely mechanism, and no verified population census exists. Strongest opposing consideration is the Lucas reliability failure and the absence of any pain-free control series establishing base rates.
  - claimId: VASO-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hubbard & Berkoff recorded sustained spontaneous activity in the 1–2 mm nidus absent from adjacent non-tender fibers; Simons 2002 confirms higher prevalence at trigger points than at non-tender endplate-zone sites and absence from off-zone taut-band sites. The original controls were not endplate-matched, so exclusivity is overstated, but the prevalence gradient holds. Strongest opposing consideration is that the generator remains contested (endplate potentials versus spindles) and the signal is skeletal, not vascular.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      McNulty et al. 1994 showed mental arithmetic raising EMG at trigger points while adjacent control sites stayed quiet, without generalized tensing. Sample is small, same lineage as Hubbard–Berkoff, and controls were not demonstrated to be endplate-zone matched; Simons 2002 implies the quiet sites may simply have been off-zone. Strongest opposing consideration is the missing matched-endplate-zone stressor replication.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole direct record is first-person and practitioner testimony of felt release under pressure-plus-slow-exhale within seconds; no synchronized elastography or Doppler time series exists (grade-D audit). Expectation and attention effects are uncontrolled. Strongest opposing consideration is that the objective local event required by the claim has never been instrumented.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Shah microdialysis shows elevated pain/inflammatory mediators in a more acidic milieu; Ballyns vibration elastography yields graded stiff-area (active > latent > normal) with good ROC separation; Doppler shows higher pulsatility and more frequent retrograde flow near active sites. Resistivity index does not differ and pulsatility is a poor individual-site classifier; all comparisons are within symptomatic muscle. Strongest opposing consideration is the lack of pain-free controls and the conduit-scale vessels imaged.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Mizrachi et al. 2026 preregistered within-subject histamine-prick experiments (n=57) show ~1.5-fold smaller, faster-resolving wheal/flare under attention-to-sensation versus distraction, without arousal differences, via sensory and vagal routes. The tissue is acute skin inflammation, not trigger points, and the timescale is tens of minutes. Strongest opposing consideration is that skin lacks direct parasympathetic innervation and the result does not speak to seconds-scale latch release.
  - claimId: VASO-C031
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 reports significantly higher Doppler pulsatility index near active upper-trapezius sites (median 8.3) than near palpably normal sites (median 3.0) within the same symptomatic patients. No pain-free controls; large variance; vessels >1 mm and 1–2 cm distant. Strongest opposing consideration is that the index failed as an individual-site classifier and "normal" sites sit in symptomatic muscle.
  - claimId: VASO-C032
    verdict: well_supported
    confidence: high
    reasoning: >-
      Ballyns 2011 states retrograde diastolic flow in 15 of 49 (31%) palpably normal upper-trapezius sites in patients who have trigger points elsewhere, versus 55% active and 40% latent. The figure is directly measured. Strongest opposing consideration is the absence of pain-free controls, so the 31% may partly reflect spillover.
  - claimId: VASO-C033
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 vibration sonoelastography gives mean stiff areas 0.57 cm² active, 0.36 cm² latent, 0.17 cm² normal with significant ordering and ROC AUCs 0.8–0.9; sonographers blinded to clinical status. Sites pre-selected by palpation; single vibration frequency. Strongest opposing consideration is that the measurement presupposes the palpated classification it then grades.
  - claimId: VASO-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Simons, Hong & Simons 2002 abstract reports endplate noise in four of eleven muscles at endplate-zone sites outside trigger points, lower than the 11/11 rate at trigger-point sites. Unblinded, small n, abstract only. Strongest opposing consideration is the nonrandomized unblinded design and proponent authorship.
  - claimId: VASO-C035
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Simons 2002 reports endplate noise "did not occur in taut band sites outside of an endplate zone" (P = 0.000034). Same small unblinded sample limitations. Strongest opposing consideration is reliance on abstract-level reporting without full per-site data.
  - claimId: VASO-C036
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 explicitly states no differences in resistivity index among active, latent and normal sites. Direct negative result from the same Doppler series that found pulsatility differences. Strongest opposing consideration is that proximity of "normal" sites to trigger points within symptomatic muscle may compress true differences.