promptVersion: "check-v1"
humanReviewed: false
role: check
caseAssessment:
  verdict: unresolved
  loadBearing: [VASO-C020, VASO-C021, VASO-C010, VASO-C011, VASO-C004, VASO-C005]
  weakestLinks: [VASO-C020, VASO-C021, VASO-C143, VASO-C073, VASO-C039, VASO-C022, VASO-C174]
  synthesis: >-
    The ledger has an unusually clean structure: a broad, decently evidenced base;
    a narrow, unevidenced neck; and a speculative crown. The base holds. Latch-bridge
    physiology is real (VASO-E003, plus textbook background). Slow breathing is a
    genuine autonomic lever (VASO-E009). Voluntary attention can measurably regulate a
    peripheral inflammatory response without arousal change (VASO-E008, preregistered,
    two cohorts). Tender points carry instrumented correlates — an acidic mediator-rich
    milieu (VASO-E006), larger stiff areas on blinded sonoelastography with AUC 0.8–0.9
    (VASO-E023), higher pulsatility and more frequent retrograde diastolic flow near
    active sites (VASO-E022) — and a discrete electrical nidus whose amplitude moves with
    a purely cognitive stressor (VASO-E001, VASO-E002). Something is there, it is not
    obviously a scar, and mental state touches it.
    The neck is empty. Every step from "abnormal local physiology at a tender point" to
    "microvascular smooth muscle held in the latch-bridge state" is currently
    unevidenced. VASO-E016 grades both linchpins D. VASO-E019 finds that energetic cost —
    the whole economy argument — has never been measured in any arteriole. VASO-E020 is
    worse than absence: where the right molecular readout has been taken in pressurized
    skeletal-muscle arterioles, maintained constriction tracks maintained LC20
    phosphorylation and Rho-kinase sensitization, not an economical dephosphorylated
    hold. VASO-E021 shows latch behaviour present in a parent artery and absent one
    branch order downstream, so "vascular smooth muscle latches" is not a generic
    property that can be inherited by microvessels. Meanwhile the vascular finding that
    does exist (VASO-E022) is at conduit calibre 1–2 cm away, is not a classifier
    (VASO-E024, VASO-E025), lacks pain-free controls (VASO-E026), and is explicitly
    given equal-standing mechanical explanations by its own authors (VASO-E027).
    The anchor phenomenon — objective seconds-scale release — has never been measured at
    all; VASO-E014 is proponent testimony, and VASO-E035 is the inference, not the
    observation. Underneath everything sits the localization problem (VASO-E011,
    VASO-E029, VASO-E012): studies on both sides find their object by an examiner-dependent
    method. The crown (VASO-C021, VASO-C022, VASO-C143, VASO-C174) is untested prediction
    and, in VASO-E017's framing, conflates hysteresis with a write–store–read loop.
    Steelmanning the other way: none of this refutes the hypothesis. It is an
    extrapolation that has never been checked where it matters, not a claim shown false,
    and its proponent has already relocated the vascular element (VASO-E044) in response
    to the audit — a live, revising programme, not a fixed target. Hence unresolved
    rather than contradicted: VASO-R001 and VASO-R004 would decide it, and neither has
    been run. Sensitivity: the single record whose removal would most change this
    reading is VASO-E016, the grade-D audit of both linchpins. The verdict survives
    without it, because VASO-E019 and VASO-E020 independently establish that the
    mechanism has not been observed — and looks different — in the compartment the
    hypothesis names, and no positive record anywhere in the ledger demonstrates a latch
    at a tender point.
  steelman: >-
    Nothing in this assessment explains why a purely cognitive stressor writes
    to a specific millimetre-scale address in a nominally resting muscle while
    tissue a centimetre away stays quiet, and why a voluntary autonomic
    manoeuvre — the exhale — is reported to reverse that address in seconds.
    Conventional accounts (endplate dysfunction, guarding, central
    sensitization) offer no reason for spatial addressability plus
    breath-sensitivity to co-occur, and the one system in the body that is
    both autonomically addressable at millimetre scale and breath-modulated is
    the microvasculature. The proponent is entitled to say that the reason no
    latch has been found at a tender point is that nobody has ever put a
    calibrated probe, an elastograph and a sensitive Doppler on a knot during a
    release — the experiment does not fail, it does not exist.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record supports this claim; the two closest (VASO-E013, VASO-E038)
      are statements of the hypothesis by its originator and its relayer, and
      VASO-E017 explicitly argues that the latch literature does not address the
      write–store–read criteria that would make a physiological hysteresis into a
      memory. The nearest empirical precedent offered is Physarum, an organism whose
      flow network is its body. The strongest consideration in its favour is that the
      read half now has a demonstrated mechanism (VASO-E005: blood-pressure pulsations
      modulating neurons via mechanosensitive channels), so the proposal is not
      physically idle — merely untested. VASO-R005 is a well-specified decisive design,
      so this is unresolved rather than presently untestable.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The claim bundles a negative (not damaged tissue) that the ledger treats
      sympathetically with a positive mechanistic attribution (latched microvascular
      smooth muscle) that has no direct evidence: VASO-E016 grades it D, VASO-E019
      finds no arteriolar energetic measurement anywhere, and VASO-E020 — the only
      record bearing on the named compartment — finds sustained activation and
      Rho-kinase sensitization rather than an economical hold. The one supporting
      hemodynamic record (VASO-E027) is given zero diagnosticity by its own authors,
      who name skeletal-muscle contracture compressing the bed as an equally plausible
      cause. Against a stronger negative verdict: none of the arteriole studies
      withdrew the stimulus, so they could not have detected input-free persistence
      even if it exists, and the proponent has already moved the candidate vessel bed
      (VASO-E044). Leaning negative on the vascular-latch specification; unresolved
      overall.
  - claimId: VASO-C174
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim, and its sole source
      (SRC-JHONG-2026A) is an unverified, self-published, wholly AI-generated proponent
      essay that the source file itself says nothing may lean on until read. As a
      composite it is strictly weaker and more plausible than the single-mechanism
      VASO-C021 — hyaluronan viscosity and fascial tethering are independently
      documented phenomena in the wider literature — but that plausibility comes from
      background priors, not from anything in this ledger. The strongest opposing
      consideration is that a three-element composite is nearly unfalsifiable as
      stated, since any observed release can be assigned to whichever element fits.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only record is VASO-E039, an uncited assertion in the proponent essay that
      traditional maps place knots on the torso midline and limbs, with no coding rule
      and no chance baseline — the editor's own note concedes it carries essentially
      no diagnostic weight. The supplementary contemplative claims (acupoint/fascial
      coincidence figures) are all second-hand restatements whose primaries were not
      retrieved. The strongest opposing consideration is the base rate of post-hoc
      resemblance: sparse point-sets on a body will align with some anatomical feature
      class by chance, which is precisely why VASO-R006's pre-registered blinded coding
      is the right and currently unexecuted test.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim states a capability, and the capability is established: VASO-E003
      records the Hai–Murphy kinetic model reproducing high sustained stress at low
      myosin phosphorylation, and this is textbook smooth-muscle physiology
      (background prior explicitly acknowledged here, since the ledger carries only one
      primary record). The important qualification is VASO-E021: latch behaviour is not
      generic across vascular smooth muscle, being present in rabbit femoral artery and
      absent in its own saphenous branch, attributed to motor-protein phenotype and
      phosphatase activity. That qualifies generality and matters greatly for
      VASO-C020, but not for this claim as worded ("can maintain"). Verified in large
      tonic conduit preparations, largely at zero transmural pressure.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      This is a conditional inference, and the inference is close to sound on general
      biophysical grounds: collagen remodelling and scar resolution operate over days
      to weeks, so anything reversing in seconds is a maintained state. VASO-E035 is
      the argument itself rather than an observation, and VASO-E030 (three cases,
      changes across visits after dry needling) speaks to a different timescale. The
      strongest opposing consideration is definitional slippage: fascial hyaluronan
      densification (VASO-C077, VASO-R008) would also be "state, not structure" while
      being neither vascular nor autonomically maintained, so the conditional's truth
      buys much less for the featured hypothesis than it appears to. The antecedent —
      an objective seconds-scale release — remains unmeasured.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      VASO-E011 is a systematic review concluding that manual examination for
      myofascial trigger points has not been shown reliable or valid and that no
      accepted reference standard exists; VASO-E010 is the peer-reviewed critique of
      the construct's circularity; VASO-E029 records a proponent group conceding in
      print that palpation and the algometry standards "are still subjective
      measures". The opposing consideration is that Dommerholt and Gerwin answered
      Quintner point by point and the construct debate is live rather than settled —
      but the claim asserts only that reliability is undemonstrated and the construct
      contested, both of which the ongoing exchange itself confirms.
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      That palpable tenderness is common is barely disputed — VASO-E028 records a
      research group treating "muscle knots" as a widespread phenomenon, and VASO-E015
      cites (second-hand, unverified) community tender-point medians of 6 in women and
      3 in men. The word doing the work is "discrete": VASO-E012 records the critical
      report correcting the essay's framing, noting that the reproducibility and
      ontological status of the spots themselves are contested, and VASO-E011 shows
      independent examiners do not reliably agree on where they are. So the phenomenon
      is real at the level of tenderness on pressure and unsettled at the level of
      discrete localizable objects. No census exists (VASO-R002, VASO-R010).
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      As reworded, the claim now matches Simons, Hong and Simons 2002 rather than
      overstating exclusivity: VASO-E032 records endplate noise at 11/11 trigger-point
      sites, 4/11 non-tender endplate-zone sites, and 0/11 off-zone taut-band sites,
      and VASO-E001 records the original nidus finding. The prevalence gradient is
      real. Against it: both studies come from the same small proponent lineage, the
      2002 design is self-described as nonrandomized and unblinded with 10 subjects,
      only the abstract was read, and the phenomenon has never been replicated with
      modern instrumentation by an independent group. Note also that the finding is
      skeletal-muscle electrophysiology and is neutral between the endplate and the
      vascular readings.
  - claimId: VASO-C003
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      One study (VASO-E002, n=14, 1994, same lineage as VASO-E001) reports the
      site-selective rise under mental arithmetic; VASO-E033 is a secondary
      restatement adding nothing. The selectivity — the whole content of the claim —
      is now directly threatened by VASO-E031: if endplate noise occurs at non-tender
      endplate-zone sites, the "quiet" control needles may simply have sat off the
      endplate zone, in which case what the stressor modulates could be endplate
      activity generally rather than a specific tender address. That confound is
      unresolved and is exactly what VASO-R011 is designed to settle. The claim
      survives as a single unreplicated observation with a plausible alternative
      reading of its control condition.
  - claimId: VASO-C143
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on this claim in either direction; it is an
      interpretive re-description of VASO-C003's finding, sourced only to the
      unverified second proponent essay. It is a genuine, cheap, falsifiable
      prediction — a mental stressor should produce a localized fall in skin perfusion
      over the tender point and not over control skin — and laser-Doppler or speckle
      methods could test it tomorrow (VASO-R016). The strongest opposing consideration
      is that the phenomenon it reinterprets was recorded by needle EMG in muscle,
      whereas this account relocates it to a skin territory; nothing yet connects the
      two measurements.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The claim is about a felt release, and the only record is VASO-E014 —
      first-person testimony from the hypothesis's proponent in an AI-generated essay,
      consistent with widespread practitioner lore that the ledger does not otherwise
      document. A subjective endpoint reported by a believing observer under
      self-applied pressure is the configuration most vulnerable to expectation, and no
      blinded or instrumented observation exists anywhere in the case. It is not
      dismissible: the report is specific, reproducible on its face, and cheap to test
      (VASO-R001, VASO-R016). The strongest opposing consideration is the unretrieved
      Olewnik 2025 signal noted in VASO-R012, in which palpated points reportedly
      became undetectable within minutes of pressure alone.
  - claimId: VASO-C039
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached; the claim rests on a single sentence in the
      proponent essay and asserts a negative (pressure alone never suffices) that
      would require the factorial design of VASO-R003 or the hydrodissection test of
      VASO-R017 to establish. The strongest opposing consideration is that it is
      prima facie implausible against the broader manual-therapy literature and against
      the unretrieved Olewnik 2025 report flagged in VASO-R012, where pressure alone
      appears to have abolished palpated points. Two-key necessity is the most
      distinctive and most easily falsified prediction in the whole case, and it has
      not been tested.
  - claimId: VASO-C073
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      This is an untested timing prediction — perfusion rise leading stiffness drop —
      with no evidence record on either side; VASO-E016 explicitly records that no
      synchronized time-resolved imaging study of a release event was located. Its
      virtue is that it is genuinely discriminating: the ordering separates a vascular
      account from a fascial-densification or motor-guarding account, which is why
      VASO-R001 and VASO-R016 both preregister it. The strongest opposing consideration
      is that the prediction presupposes the antecedent event (VASO-C004, VASO-C011)
      that nobody has yet measured objectively, so it may prove vacuous rather than
      false.
  - claimId: VASO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Three modalities point the same way: acidic, mediator-rich milieu (VASO-E006),
      graded stiff-area differences with blinded sonographers and AUC 0.8–0.9
      (VASO-E023), and higher pulsatility with more frequent retrograde flow
      (VASO-E022), with a systematic review reporting the same residue (VASO-E007).
      Four things hold the verdict below well_supported: Shah, Sikdar and Ballyns are
      one NIH lineage rather than independent replications; VASO-E007's
      characterization is second-hand and unchecked; sites are defined by the palpation
      whose reliability VASO-E011 disputes, making the contrast partly circular; and
      the flow findings are group-level only, with a null resistivity index
      (VASO-E024), poor per-site classification (VASO-E025) and no pain-free controls
      (VASO-E026).
  - claimId: VASO-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E008 is the strongest single record in the case: preregistered
      within-subject experiments, 57 volunteers, ~1.5-fold smaller and faster-resolving
      wheal and flare under internal attention in ~90% of participants across two
      cohorts, with skin conductance, heart rate, temperature and self-reported anxiety
      matched — which is precisely the "without change in sympathetic arousal"
      condition the claim specifies — and a lidocaine dissociation separating sensory
      from vagal routes. Confidence is held at moderate because it is a single lab, a
      2026 publication with no replication, and an acute healthy-skin model. VASO-E041
      correctly notes the demonstrated route is vagal immune modulation over ~20
      minutes, which limits what the finding transfers to the knot hypothesis but does
      not weaken the claim as stated.
  - claimId: VASO-C031
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E022 reports exactly this: median pulsatility index 8.3 near active sites
      versus 3.0 near palpably normal sites in the same muscle, P < .05, with
      sonographers blinded to clinical status. It is a single unreplicated study whose
      own ROC analysis found the index a poor classifier because of large variance
      (VASO-E025), and whose "normal" comparison sites lie in symptomatic muscle with
      no pain-free control group (VASO-E026). The claim as worded is careful — patients
      with acute cervical pain, within-muscle comparison, 1–2 cm — and survives those
      caveats; what it does not survive is generalization to microvessels or to
      pain-free people.
  - claimId: VASO-C032
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The 31% figure is directly quoted from the source in VASO-E022 and is a plain
      reported measurement, so local truth is high; the uncertainty is single-study
      and interpretive. VASO-E026 records the authors' own caveat that with no
      pain-free control group they cannot say whether 31% is a normal baseline rate or
      spillover from neighbouring trigger points 5 cm away. Worth noting the claim is
      structurally awkward for the featured hypothesis rather than supportive of it: a
      "signature" present at nearly a third of normal sites is a gradient across
      symptomatic muscle, not a marker of a discrete lesion.
  - claimId: VASO-C033
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E023 reports the full ordering with numbers — 0.57, 0.36 and 0.17 cm² for
      active, latent and normal sites, P < .01, AUC 0.8–0.9 — and the sonographers were
      blinded to clinical status, which is methodologically stronger than most of this
      literature. Against: a single study from one group, a single vibration frequency
      generated by an off-the-shelf massager with frequency-independence unconfirmed,
      shear elasticity not measured, and site selection by palpation, so the measured
      contrast partly presupposes the classification it validates. Nothing in it
      identifies what the stiff tissue is.
  - claimId: VASO-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E032 records endplate noise at endplate-zone sites outside trigger points in
      4 of 11 muscles, P = 0.024, with the endplate zone located electrically rather
      than by guess — a design detail that makes the observation more credible than the
      surrounding literature. Limits: abstract only, 10 subjects, self-described
      nonrandomized and unblinded, and from authors who are the construct's leading
      proponents (which here cuts against their own thesis, mildly increasing
      credibility). Unreplicated. This claim matters out of proportion to its size,
      since it is the specific finding that undermines the exclusivity reading of
      VASO-C002 and VASO-C003.
  - claimId: VASO-C035
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      VASO-E032 reports zero occurrences at off-endplate-zone taut-band sites with
      P = 0.000034, which is a strong within-study result, but the claim is an absolute
      negative resting on one small, unblinded, single-lab examination of 11 muscles
      read from an abstract. Absence at 11 sites cannot license "does not occur" as a
      general biological statement; a low-prevalence phenomenon would look identical.
      Confidence is set low for that reason rather than because of any contrary record —
      there is none in the ledger.
  - claimId: VASO-C036
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      VASO-E024 records the null directly: no differences in resistivity index between
      active, latent and normal sites. Null results from a single study with large
      variance and no reported power analysis are weak evidence of no difference, and
      VASO-E026 notes that the "normal" sites sat in symptomatic muscle close to the
      trigger points, which would bias toward finding no difference. The claim is
      nonetheless worth its place in the ledger: it is the record showing that the
      vascular abnormality at trigger points is partial and index-dependent rather than
      categorical, which is a real constraint on VASO-C005 and VASO-C020.
</br>