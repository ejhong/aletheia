runId: "2026-09-09-check-glm"
model: "GLM 5.3 Flash (Z.ai, via Venice), independent check run"
date: "2026-09-09"
promptVersion: "check-v1"
humanReviewed: false
role: check
caseAssessment:
  verdict: mixed
  loadBearing: [VASO-C020, VASO-C011, VASO-C004]
  weakestLinks: [VASO-C020, VASO-C021, VASO-C143, VASO-C073, VASO-C174]
  synthesis: >-
    The case is a stack whose floors are of very different quality, and the
    honest roll-up is mixed. The observation rung is genuinely strong:
    tender sites are measurably distinct from adjacent tissue in stiffness
    (VASO-C033, blinded sonographers, AUC 0.9), in local biochemistry
    (VASO-E006), and in hemodynamics at group level (VASO-C031, VASO-C032),
    with the honest caveat that the Doppler signature is graded rather than
    categorical (VASO-C036, VASO-E025) and was measured in symptomatic
    patients without pain-free controls. The neural-signature rung is real
    but narrower than the essay presents: endplate noise tracks the
    endplate zone first and the trigger point second (VASO-C034,
    VASO-C035), and the stressor-selectivity of VASO-C003 has never been
    tested against a matched endplate-zone control. The mechanism rung
    splits: the latch-bridge itself is textbook physiology (VASO-C010),
    and slow breathing is a real autonomic lever (VASO-C013), but the
    trigger-point construct's reliability problems (VASO-C030) cap every
    palpation-anchored result, and the critical audit (VASO-E016) shows the
    two linchpins — objective seconds-scale release and vascular identity —
    have never been directly tested. Worse, the one evidence bearing
    directly on the compartment VASO-C020 names shows pressurized
    skeletal-muscle arterioles maintaining constriction by sustained
    activation rather than an economical latch (VASO-E020), and latch
    behaviour was absent one branch order downstream in the only paired
    comparison (VASO-E021); the proponent's own second essay concedes the
    mismatch and relocates the mechanism to cutaneous perforators
    (VASO-E044), leaving VASO-C020 contradicted as stated. The upper rungs
    — knots as mental registers (VASO-C021), contemplative maps as
    interoceptive data (VASO-C022), the three-element composite
    (VASO-C174) — rest entirely on hypothesis statements from
    self-published, AI-generated proponent texts, one of them from a source
    the ledger marks as unread and unverified. Steelmanning the featured
    hypothesis: a maintained, addressable, autonomic-coupled electrical
    nidus that responds selectively to a purely cognitive stressor while a
    centimeter away stays quiet (VASO-E001, VASO-E002) is a genuine
    unexplained observation, and no damaged-tissue account explains it.
    Steelmanning the skeptics: every proponent-specific mechanism claim
    currently borrows its mechanism from a compartment where it has not
    been observed, and the anchor phenomenon rests on proponent testimony
    in AI-written essays. The decisive experiments (VASO-R001, VASO-R016)
    are cheap, well-designed, and have never been run; until they are, the
    defensible verdict is mixed, not either strong pole.
  steelman: >-
    The paired Hubbard–Berkoff and McNulty recordings show a discrete 1–2 mm
    electrical nidus whose sustained activity is absent a centimeter away,
    selectively rises under a purely cognitive stressor without generalized
    muscle tensing, and — per the essay's unretrieved phentolamine and
    relaxation reports — falls under sympathetic blockade and relaxation.
    No damaged-tissue or scar account explains why a tiny, anatomically
    addressable locus should be tonically maintained and bidirectionally
    coupled to autonomic state; only a maintained physiological write target
    does. This assessment does not answer that observation: the
    endplate-zone confound (VASO-E031) is itself an untested hypothesis
    (VASO-R011), so the site-selective stressor response currently has no
    competing explanation in this ledger.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records bearing on this are the hypothesis's own statement
      (VASO-E013, self-published, no experimental validation) and the
      critical report's argument that latch hysteresis has never
      demonstrated a write–store–read loop, with the closest precedent
      being Physarum's flow-network memory (VASO-E017). Nothing in the
      ledger shows vascular state carrying content-specific neural traces,
      and nothing rules it out; the deciding experiment (VASO-R005) has
      not been run. The strongest opposing consideration is E017's
      argument that hysteresis is not memory — but it is an argument from
      absent evidence, not a disproof, so unresolved rather than
      contradicted is warranted.
  - claimId: VASO-C020
    verdict: contradicted
    confidence: low
    reasoning: >-
      As stated, the claim locates the mechanism in microvascular smooth
      muscle held in the latch state, and the only records bearing
      directly on that compartment cut against it: pressurized
      skeletal-muscle arterioles maintain constriction with sustained or
      rising phosphorylation (VASO-E020), latch behaviour was absent one
      branch order downstream of a latching parent artery (VASO-E021), no
      energetic measurement exists in any arteriole (VASO-E019), and no
      study has identified a latch at a trigger point (VASO-E016). The
      proponent's own second essay accepts the mismatch and relocates the
      mechanism to cutaneous perforators (VASO-E044). The strongest
      opposing consideration keeps confidence at low rather than high:
      the arteriole studies were not latch tests, never withdrew their
      stimulus, and were abstract-based, so input-free latch persistence
      in vivo is unexcluded — this is a contradicted-as-formulated
      verdict, not a refuted phenomenon.
  - claimId: VASO-C174
    verdict: unresolved
    confidence: low
    reasoning: >-
      This composite three-element model has no evidence record of any
      kind: its only anchor is a proponent essay whose source record
      (SRC-JHONG-2026A) is unverified with an explicit instruction that
      nothing may lean on it until read. Each component (vessel tone,
      hyaluronan collar, fascial tether) would need separate
      demonstration, and the record is registered as an alternative to
      C021, signalling that the synthesis rung is still internally in
      flux. The strongest opposing consideration is that the claim is a
      model revision, not an observation, so there is nothing here to
      confirm or deny.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only record on this claim (VASO-E039) is an uncited assertion
      about traditional map locations with no coding rule, chance
      baseline, or primary textual source, carrying essentially no
      diagnostic weight by its own editor inference. The claim's strong
      reading — that contemplative anatomies are empirical maps of the
      vascular-autonomic system produced by trained interoception — is a
      convergence argument vulnerable to post-hoc pattern-matching
      (VASO-R006 exists precisely to test it with blinded coding). The
      strongest opposing consideration is that no evidence in the ledger
      connects the traditional maps to any measured physiology; the
      convergence is currently resemblance, not data.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      The latch-bridge state is foundational, heavily cited smooth-muscle
      physiology (VASO-E003, Hai & Murphy 1988), reproduced across
      decades of preparations. The ledger's own audit qualifies it in
      two ways that matter for the case but not for the claim as stated:
      latch behaviour is not generic across vascular smooth muscle —
      absent one branch order downstream in the only paired comparison
      (VASO-E021) — and its energetic economy has never been measured in
      any arteriole (VASO-E019). The strongest opposing consideration is
      therefore scope creep: the capability is real where demonstrated,
      but reading it as a generic property of all vascular smooth muscle
      would overstate the record.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The conditional is sound: structural remodeling takes days to
      weeks, so an objective seconds-scale local release would entail a
      maintained physiological state (VASO-E035 records the inference;
      VASO-E030 shows the imaged measures move after intervention, though
      over visits, not seconds). But the antecedent has never been
      objectively demonstrated — the grade-D audit confirms no
      synchronized time-resolved imaging of a release exists
      (VASO-E016) — so the conditional rests on an unmeasured premise.
      The strongest opposing consideration: if felt releases are
      perceptual or attentional events rather than objective tissue
      transitions, the conditional is vacuously true but vacuous for the
      case; also, fascial densification (VASO-C077) is a competing
      non-vascular state mechanism the ledger has not excluded.
  - claimId: VASO-C077
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger bears on fascial densification
      reversibility; the claim's anchor is the unverified second essay,
      and the desk study that would retrieve the Stecco-group primary
      literature (VASO-R008) has not been run. Plausibility from general
      background is high — hyaluronan viscosity is known to be
      temperature- and load-dependent — but that is a prior, not ledger
      evidence. The strongest opposing consideration is that the
      timescale of reversal under pressure is exactly the discriminating
      variable against the vascular account, and it is currently
      unmeasured.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim as stated — local vascular and hemodynamic state can
      modulate nearby neurons — has direct causal support: blood-pressure
      pulsations modulate neuronal activity via mechanosensitive
      channels in rat preparations and awake animals (VASO-E005,
      strength strong), sixteen years after Moore and Cao proposed the
      hypothesis (VASO-E004, context only). The strongest opposing
      consideration is scope: the demonstration is in rat brain, shows
      instantaneous mechanosensation rather than storage, and says
      nothing about peripheral tender points, where the featured
      hypothesis needs the effect.
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      A systematic review of slow-breathing studies (VASO-E009, Zaccaro
      2018, strength strong) documents reproducible increases in
      respiratory sinus arrhythmia and HRV consistent with
      parasympathetic shift; the essay's own restatement adds zero
      independent weight (VASO-E036). The claim as stated is about the
      global autonomic shift, which is exactly what the evidence
      establishes. The strongest opposing consideration: the evidence
      covers global cardiovascular indices only — the local,
      site-specific unlatching the featured hypothesis layers on top of
      this claim is not supported by it and has never been measured.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      The systematic review of examination-reliability studies (VASO-E011,
      Lucas 2009, strength strong) concludes manual trigger-point
      examination has not been shown reliable or valid for lack of a
      reference standard; the Quintner critique (VASO-E010) supplies the
      peer-reviewed construct critique, answered but not settled by
      Dommerholt & Gerwin; and even a proponent group concedes the
      reference standards are subjective (VASO-E029). The strongest
      opposing consideration is the limitation E011 itself records: the
      critique targets the manual exam, and imaging-anchored localization
      (as in the blinded-sonographer Ballyns design) may escape it, so
      the construct problem does not automatically poison instrumented
      findings.
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The everyday phenomenon is widely attested and the research
      literature treats palpable knots as common (VASO-E028), but the
      critical report records that skeptics dispute the reproducibility
      and even the ontological status of precisely localizable spots,
      not just their mechanism (VASO-E012), no census or age curve
      exists, and the community tender-point statistics cited for
      ubiquity are second-hand and unverified (VASO-E015). The strongest
      opposing consideration is that a hypothesis-generated essay in an
      AI-written text is the main source for the ubiquity figures, so
      the observation rung is softer than the essay presents.
  - claimId: VASO-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hubbard & Berkoff 1993 found sustained spontaneous activity in the
      nidus of all recorded trigger points and not in adjacent
      non-tender fibers (VASO-E001), and the refined claim's
      prevalence-gradient phrasing matches Simons 2002 directly:
      endplate noise at 11/11 trigger-point sites, 4/11 non-tender
      endplate-zone sites, and 0/11 off-zone taut-band sites
      (VASO-E031, VASO-E032). The strongest opposing consideration is
      that Simons 2002 shows the signature is characteristic of but not
      restricted to trigger points, so the exclusivity implied by
      Hubbard–Berkoff's controls likely reflects off-zone control
      placement — the signal is endplate-zone-linked first; also the key
      studies are old, small, unblinded, and abstract-only for the
      Simons arm.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      McNulty 1994 found mental arithmetic raised EMG at trigger points
      while adjacent control sites stayed quiet without generalized
      tensing (VASO-E002), which is a striking selective effect from a
      purely cognitive event. But it is a single n=14 study from the
      same lineage as Hubbard–Berkoff (one line of evidence, never
      replicated), and the Simons 2002 finding means the quiet controls
      may simply have been off the endplate zone — the site-selectivity
      confound that VASO-R011 is designed to remove has never been
      excluded. The strongest opposing consideration is that
      stress-sensitivity of endplates generally would produce the same
      result without any discrete maintained element.
  - claimId: VASO-C143
    verdict: unresolved
    confidence: low
    reasoning: >-
      This is the vascular-write interpretation of the McNulty result,
      and its own specified test — a localized fall in skin perfusion
      over the tender point and not over control skin under mental
      stress — has never been performed; the only anchor is the
      unverified second essay. The EMG data fit equally well with
      sympathetic drive to spindles or endplates without any vascular
      storage, a limitation VASO-E002 records explicitly. The strongest
      opposing consideration is that no vascular endpoint was measured
      in any stressor study, so the interpretation currently rides on
      plausibility alone.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is honest phenomenology — a felt release under pressure
      plus slow exhalation — and the only evidence is first-person and
      practitioner testimony from the proponent's AI-written essay
      (VASO-E014, strength weak), consistent with practitioner lore but
      measured by no one; expectation and attention effects cannot be
      excluded. The unretrieved Olewnik 2025 elastography report, in
      which most palpated points became undetectable under pressure
      alone within minutes, would if confirmed cut against the two-key
      framing. The strongest opposing consideration: testimony from the
      hypothesis's proponent, in AI-generated text, with no blinded or
      instrumented replication of any release event.
  - claimId: VASO-C039
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim that pressure alone does not release a knot rests
      entirely on proponent testimony (SRC-JHONG-2026, via E014), and its
      own truth conditions — pressure-only versus pressure-plus-exhale
      trials at matched sites — have never been run in any controlled
      design the ledger holds. The unretrieved Olewnik 2025 finding
      points the other way for palpated points under pressure alone, and
      the hydrodissection proposal (VASO-R017) exists to test whether
      release without breath is possible at all. The strongest opposing
      consideration is that a no-breath null is exactly what expectation
      structure in a self-experiment would predict regardless of
      mechanism.
  - claimId: VASO-C073
    verdict: unresolved
    confidence: low
    reasoning: >-
      This is the latch-specific timing signature — reperfusion precedes
      stiffness loss — and the grade-D audit records that no
      synchronized time-resolved imaging study of a release event exists
      (VASO-E016); no evidence record supports either ordering. The claim
      is plainly testable (VASO-R016's laser-speckle design tests it
      directly at the surface), so presently_untestable would be wrong.
      The strongest opposing consideration: with zero time-resolved data
      in either direction, this is a preregistered prediction, not a
      finding, and treating it as evidence would beg the question.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Active trigger-point sites differ measurably from comparison
      tissue in biochemistry (VASO-E006, elevated inflammatory
      mediators), stiffness (VASO-E023: graded areas 0.57/0.36/0.17 cm²
      with blinded sonographers, AUC 0.9), and group-level blood flow
      (VASO-E031... specifically VASO-C031/C032 via VASO-E022), with
      systematic-review support (VASO-E007). The strongest opposing
      considerations temper rather than overturn: flow indices do not
      classify individual sites and the resistivity index is null
      (VASO-E025), and every comparison is within symptomatic patients
      with no pain-free control group (VASO-E026), so the "difference"
      may partly reflect spillover within already-abnormal muscle.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Mizrachi 2026 experiments are preregistered, within-subject,
      and show ~1.5-fold smaller, faster-resolving wheal responses under
      directed attention in ~90% of 57 participants, with skin
      conductance, heart rate, skin temperature, and reported anxiety
      matched — satisfying the claim's "without change in sympathetic
      arousal" clause (VASO-E008). The strongest opposing consideration:
      it is a single lab, a very recent publication, an acute histamine
      model in healthy skin, and the demonstrated route is vagal immune
      regulation over ~20 minutes — so it licenses site-specific
      top-down peripheral regulation in general, not seconds-scale
      vascular release at knots.
  - claimId: VASO-C031
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The primary text directly reports that vessels near active sites
      had significantly higher pulsatility index (median 8.3 vs 3.0,
      P < .05) (VASO-E022), anchored with quotes from the open-access
      manuscript. The strongest opposing considerations: the comparison
      is within symptomatic patients with no pain-free controls
      (VASO-E026), the pulsatility index failed ROC classification of
      individual sites due to large variance (VASO-E024, VASO-E025), and
      the interrogated vessels are >1 mm conduit-scale, far from the
      arterioles the featured mechanism names — the group-level
      difference the claim states is solid; the latch reading of it is
      not.
  - claimId: VASO-C032
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The primary reports retrograde diastolic flow in 15 of 49 (31%)
      palpably normal sites versus 55% at active and 40% at latent sites,
      matching the claim's figure exactly (VASO-E022). The strongest
      opposing consideration is the source's own limitation: all sites
      were in symptomatic patients at least 5 cm from trigger points, so
      the 31% rate at "normal" sites is either a true baseline in
      symptomatic muscle or spillover from neighbouring points — the
      study cannot distinguish these, and the graded signature supports
      a vascular gradient, not a knot-specific marker.
  - claimId: VASO-C033
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Vibration sonoelastography stiff-areas separate the three site
      types monotonically (0.57 ± 0.20, 0.36 ± 0.16, 0.17 ± 0.22 cm²,
      P < .01) with blinded sonographers and strong ROC performance
      (VASO-E023) — the cleanest instrumented result in the case. The
      strongest opposing considerations: sites were selected by
      palpation, so the contrast presupposes the contested
      classification, only one vibration frequency was used, and the
      measure says nothing about what the stiff tissue is — contracted
      fibres, guarding, fascia, or vessels remain undiscriminated.
  - claimId: VASO-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Simons 2002 directly reports endplate noise in four of eleven
      muscles at endplate-zone sites outside trigger points (P = 0.024)
      (VASO-E031, VASO-E032), establishing that the electrical signature
      is not exclusive to trigger points. The strongest opposing
      considerations: the study is abstract-only, nonrandomized,
      unblinded, ten subjects, by construct proponents — but the finding
      cuts against the proponents' own exclusivity claim, which
      strengthens its credibility, and it undercuts the Hubbard–Berkoff
      nidus-isolation reading (VASO-E001) that this case's localization
      argument leans on.
  - claimId: VASO-C035
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The same source reports endplate noise "did not occur in taut band
      sites outside of an endplate zone" (P = 0.000034) (VASO-E032),
      which together with C034 implies the signature tracks the
      endplate zone first and the trigger point second — the conventional
      skeletal-endplate reading. The strongest opposing consideration is
      the same as for C034: abstract-only reporting, unblinded design,
      small sample, and proponent authors, though again the result
      constrains the proponents' preferred narrative.
  - claimId: VASO-C036
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The primary states plainly that no differences in resistivity
      index were detected between active, latent, and normal sites
      (VASO-E024), and the authors attribute the similarity partly to
      the proximity of normal sites to trigger points. The strongest
      opposing consideration: this null was obtained within symptomatic
      patients, so a real difference could be masked by spillover, and
      the same paper's group-level pulsatility result shows the vascular
      signature is partial — which is exactly why this null belongs in
      the ledger as a constraint on how categorical the flow signature
      can be.