  synthesis: >-
    The featured hypothesis stacks established smooth-muscle physiology and autonomic levers beneath a set of instrumented local observations, then attributes the common tender-point phenomenon to latched microvascular smooth muscle rather than scar or purely skeletal contracture, and finally extends the same vascular state into a substrate for prediction and clinging. The bottom rungs hold. Latch-bridge force maintenance at low energetic cost after activation falls is textbook (Hai & Murphy kinetic model) and remains well-supported even after vessel-type caveats: the capability exists in conduit arteries, though it is not generic and has never been shown in pressurized skeletal-muscle arterioles of the caliber the hypothesis needs. Slow breathing reproducibly shifts global autonomic balance toward parasympathetic dominance. Voluntary attention can locally damp acute inflammation without measurable arousal change. Trigger points (or their palpation-defined proxies) show spontaneous needle-EMG activity concentrated at a millimeter-scale nidus, raise that activity under a purely cognitive stressor while adjacent sites stay quiet, and differ from surrounding tissue in acidic/mediator biochemistry, vibration-elastography stiff area, and at least one Doppler index (higher pulsatility, more frequent retrograde diastolic flow). These observations collectively favor an actively maintained physiological state over static scar or remodeled connective tissue; the conditional logic that an objective seconds-scale release would confirm state-not-structure is sound. The construct itself is contested: manual identification lacks demonstrated inter-examiner reliability and a validated reference standard, so every localization-dependent finding inherits that softness. The decisive middle step—the attribution of the maintained state specifically to latched vascular smooth muscle producing chronic local ischemia—has no direct positive evidence. No study has imaged a seconds-scale stiffness drop and perfusion rise time-locked to exhalation under controlled pressure; the critical report’s graded matrix assigns grade D (no direct evidence located) to both the objective release and the smooth-muscle identity. Energetic cost has never been measured in any arteriole; pressurized skeletal-muscle arterioles instead show maintained or rising myosin light-chain phosphorylation during sustained constriction, the signature of ongoing activation rather than dephosphorylated latch. The one paired parent-versus-branch comparison found latch present in a conduit artery and absent one order downstream. Doppler vessels interrogated near trigger points are >1 mm and 1–2 cm distant; mechanical compression by skeletal contracture remains an equally listed explanation. The upper rungs—vascular tension as a writable memory element participating in mental life, and contemplative knot maps as first-person cartography of the same system—are presently untested theoretical mappings. Hysteresis is not yet demonstrated write–store–read discrimination of prior inputs in mammalian vessels. First-person release phenomenology and practitioner lore are consistent but unmeasured and expectation-vulnerable. Thus the case is unresolved at its crux: lower physiology and mid-level observations make a maintained, stress-writable, locally abnormal state plausible and “state not scar” the better default than damaged tissue, yet the specific vascular-latch mechanism and its cognitive extension remain extrapolations whose keystone experiment has never been run. Removing the arteriole mismatch or the grade-D audit would not convert absence into presence; the verdict would stay unresolved until synchronized elastography–Doppler of a release event or direct latch biochemistry at a tender point is obtained.
  steelman: >-
    The site-selective EMG rise under pure mental arithmetic (McNulty) together with the consistent first-person report that sustained pressure plus slow exhale produces a felt local release within seconds—while pressure alone or inhale-hold does not—remains unexplained by scar, densification-alone, or generalized relaxation accounts and predicts a local, addressable, autonomically gated hold that no conventional lesion taxonomy currently supplies.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      Johnson’s three hypotheses and the essay’s tanha mapping supply only theoretical framing (E013, E038); no write–store–read demonstration exists that vascular latch state discriminates prior neural patterns and later biases them. E017 correctly notes that hysteresis alone is not autobiographical memory and that the closest flow-network precedent is Physarum. The hemo-neural read path (E005) makes weak modulation plausible but does not establish content-bearing vascular memory. Strongest opposing consideration is the complete absence of any mammalian experiment meeting the memory criteria the critical report enumerates.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      “State not scar” is favored by active EMG, stress writability, biochemical milieu, and stiffness/flow gradients, yet the specific attribution to latched microvascular smooth muscle producing ischemia has zero direct observation (E016 grade D) and faces mismatch in the relevant compartment (E019–E020: no arteriole energetics; pressurized skeletal-muscle arterioles show maintained phosphorylation, not latch). Ballyns Doppler is compatible with downstream resistance but lists skeletal contracture compression as an equal explanation and interrogates conduit-scale vessels (E022, E027). Proponent relocation to cutaneous perforators (E044) further loosens the original intramuscular claim. Strongest opposing consideration is the unrun keystone imaging experiment itself.
  - claimId: VASO-C174
    verdict: presently_untestable
    confidence: low
    reasoning: >-
      The three-element composite (vessel tone, hyaluronan collar, sheet tether) is an alternative mechanistic sketch offered in the second essay with no independent measurements of hysteresis at each timescale or of their joint necessity at a tender point. It functions as a post-hoc refinement rather than a tested claim. Strongest opposing consideration is that no primary data yet distinguish the composite from single-factor latch or densification accounts.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only record is the essay’s uncited assertion that traditional maps cluster on midline and limbs (E039); no blinded coding against chance or modern vascular geography has been performed. Convergence remains pattern-matching until VASO-R006 is executed. Strongest opposing consideration is the risk of post-hoc anatomical resemblance without pre-registered spatial statistics.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hai & Murphy 1988 supplies the kinetic model that reproduces high sustained stress at low phosphorylation—the latch-bridge state—and is textbook vascular smooth-muscle physiology (E003). E021 qualifies generality: latch is not uniform across vessel types and was absent in a downstream muscular branch of the same preparation, yet the capability itself is established in the preparations where it has been measured. Strongest opposing consideration is the still-missing demonstration in pressurized arterioles of skeletal-muscle beds.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The conditional logic is sound: structural remodeling operates on days-to-weeks timescales, so an objective seconds-scale local release would identify an actively maintained state (E035). The premise—an instrumented seconds-scale event—remains unmeasured (E016); first-person reports and a dry-needling pilot over visits (E014, E030) do not substitute. Strongest opposing consideration is that fascial densification or other reversible non-vascular states could also satisfy the conditional if they reverse fast enough under load.
  - claimId: VASO-C077
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim is extracted from the essay’s invocation of Stecco-group densification; no primary viscosity, temperature, or mechanical-reversal measurements under seconds-scale load appear in the evidence ledger. Reversibility with pressure/movement/warmth is plausible from background fascia literature but unanchored here. Strongest opposing consideration is the absence of any timescale data that would let densification compete with or replace a vascular latch for the anchor phenomenology.
  - claimId: VASO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Moore & Cao 2008 state the hypothesis (E004); Salameh 2024 supplies direct causal evidence that blood-pressure pulsations modulate central neurons via mechanosensitive channels on rapid timescales (E005). The demonstration is in rat brain, not human periphery, and shows instantaneous mechanical coupling rather than stored content. Strongest opposing consideration is the still-missing peripheral tender-point and storage-specific tests.
  - claimId: VASO-C013
    verdict: established
    confidence: high
    reasoning: >-
      Zaccaro et al. 2018 systematic review documents reproducible increases in RSA/HRV and related autonomic shifts under slow breathing in healthy humans (E009). The global lever is not in dispute; site-specific unlatching is a separate, untested addition. Strongest opposing consideration is that global indices do not entail local vascular release at a tender point.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lucas 2009 systematic review concludes manual examination for trigger points has not been shown reliable or valid and lacks a reference standard (E011). Quintner et al. 2015 argue circularity and unproven lesion assumptions (E010). Even a proponent imaging group concedes examiner dependence (E029). The debate remains open after Dommerholt & Gerwin rebuttal, yet the reliability deficit itself is well-documented. Strongest opposing consideration is that imaging-anchored localization may partially escape the palpation problem.
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Clinical and imaging literature treat discrete tender palpable points as common (E028 introductory framing; Ballyns cohort selection), and first-person foam-roller ubiquity is widely attested (E015). E012 correctly qualifies that skeptics dispute the ontological status of the spots themselves, not merely mechanism, and no proper knot census exists. Strongest opposing consideration is the unresolved reliability and reference-standard problem (C030) that softens every prevalence claim.
  - claimId: VASO-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hubbard & Berkoff 1993 recorded sustained spontaneous activity in the 1–2 mm nidus of all tested trigger points and none in adjacent non-tender fibers (E001). Simons et al. 2002 qualify exclusivity: endplate noise also occurs at some non-tender endplate-zone sites, though at lower prevalence, and never in taut-band sites outside the endplate zone (E031, E032). The gradient “more prevalent at trigger points” survives. Strongest opposing consideration is that the silent controls in the 1993 study may simply have lain off the endplate zone.
  - claimId: VASO-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      McNulty et al. 1994 showed mental arithmetic selectively elevates EMG at trigger-point sites while adjacent control sites in the same muscle remain quiet (E002). The finding is from the same small lineage as Hubbard–Berkoff and lacks modern replication or vascular endpoints, yet no contradictory record appears. Strongest opposing consideration is the possibility that matched endplate-zone controls would also rise, relocating the effect to stress-sensitive endplates generally (see VASO-R011).
  - claimId: VASO-C143
    verdict: unresolved
    confidence: low
    reasoning: >-
      The interpretation of the McNulty stressor effect as regional sympathetic vasoconstriction written to a skin territory is an untested mechanistic gloss offered in the second essay; no concurrent skin-perfusion measurement under cognitive stress at tender versus control sites exists in the ledger. Strongest opposing consideration is that sympathetic drive to spindles or endplates already fits the EMG data without any vascular intermediate.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole direct record is first-person and practitioner testimony from the proponent essay (E014): pressure locates, breath releases, seconds-scale. No synchronized imaging, load-cell, or sham-controlled measurement confirms an objective local event. Expectation and attention effects cannot be excluded. Strongest opposing consideration is the complete absence of the keystone time-resolved elastography–Doppler dataset.
  - claimId: VASO-C039
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim that pressure alone fails while pressure-plus-slow-exhale succeeds is asserted in the essay without controlled pressure-only versus pressure-plus-exhale trials at matched sites. No evidence record supplies the factorial contrast. Strongest opposing consideration is that any release under combined conditions could still be driven by pressure duration or attention rather than the respiratory gate.
  - claimId: VASO-C073
    verdict: unresolved
    confidence: low
    reasoning: >-
      The blood-first, stiffness-second ordering is a preregistered prediction of the latch account, not an observation; no time-resolved dual imaging of a release event exists (E016). Strongest opposing consideration is that the prediction remains untested and therefore neither supported nor contradicted.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Shah microdialysis shows elevated pain/inflammation mediators and acidity at active sites (E006). Mazza 2021 systematic review and Ballyns 2011 vibration elastography plus Doppler confirm quantifiable differences in stiff area and at least one flow index (E007, E022, E023). Nulls and qualifiers exist (RI no difference, PI poor classifier, 31 % retrograde flow at palpably normal sites, no pain-free controls—E024–E026), so the differences are graded and group-level rather than categorical biomarkers. Strongest opposing consideration is residual dependence on palpation-defined site selection.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Mizrachi et al. 2026 preregistered within-subject experiments demonstrate that attention toward a histamine prick yields ~1.5-fold smaller, faster-resolving wheal/flare than distraction, without arousal differences, in ~90 % of participants (E008). The route is vagal/immune over tens of minutes in healthy skin, not direct vascular latch at trigger points; the existence of a voluntary, site-directed peripheral physiological channel is nonetheless established. Strongest opposing consideration is the timescale and tissue mismatch with the knot-release claim.
  - claimId: VASO-C031
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 reports significantly higher Doppler pulsatility index near active upper-trapezius trigger points than near palpably normal sites in the same muscle (median 8.3 vs 3.0) (E022). Within-patient symptomatic cohort and large variance limit diagnostic use, yet the group difference is directly measured. Strongest opposing consideration is the absence of a pain-free control group and the conduit-scale vessels imaged.
  - claimId: VASO-C032
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 states retrograde diastolic flow in 15 of 49 (31 %) palpably normal sites, versus 55 % active and 40 % latent (E022). The figure is a primary result, not an inference. Strongest opposing consideration is that “normal” sites still lie in symptomatic muscle and may reflect spillover rather than true baseline.
  - claimId: VASO-C033
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 vibration sonoelastography shows mean stiff areas ordered active > latent > normal (0.57, 0.36, 0.17 cm²) with significant pairwise differences and robust ROC AUCs (E023). Sonographers were blinded to clinical status. Strongest opposing consideration is single-frequency vibration and continued dependence on prior palpation for site selection.
  - claimId: VASO-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Simons, Hong & Simons 2002 found endplate noise at endplate-zone sites outside trigger points in four of eleven muscles (E032). The observation directly anchors the claim. Strongest opposing consideration is the small, unblinded, nonrandomized design and abstract-only access.
  - claimId: VASO-C035
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The same Simons 2002 abstract states endplate noise did not occur in taut-band sites outside an endplate zone (E032). Together with C034 this localizes the electrical signature to the endplate zone first. Strongest opposing consideration remains sample size and lack of blinding.
  - claimId: VASO-C036
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 explicitly reports no differences in resistivity index among active, latent, and normal sites (E024). The null is a primary result and correctly narrows the vascular signature to pulsatility/waveform features rather than a global resistive change. Strongest opposing consideration is the same within-patient symptomatic limitation that applies to the positive Doppler findings.