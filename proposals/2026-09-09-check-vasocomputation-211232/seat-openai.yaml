caseAssessment:
  verdict: weakly_supported
  loadBearing: [VASO-C021, VASO-C020, VASO-C010, VASO-C011, VASO-C012, VASO-C005]
  weakestLinks: [VASO-C021, VASO-C020, VASO-C174, VASO-C073, VASO-C143]
  synthesis: >-
    The evidence supports several lower-level components of “State, Not
    Scar,” but it does not establish the featured synthesis. Vascular smooth
    muscle is capable of economical force maintenance through latch-related
    physiology, hemodynamic pulsations can causally modulate neuronal
    activity, slow breathing changes global autonomic indices, and
    instrumented studies find biochemical, stiffness, and some
    hemodynamic differences at clinically identified trigger-point sites.
    These findings make a vascular-autonomic contribution biologically
    plausible. They also support a limited “state” framing: at least some
    clinically identified sites have ongoing electrical or physiological
    abnormalities rather than being defined solely by static anatomy.

    The strongest case for the hypothesis is the convergence of otherwise
    separate observations. A millimeter-scale electrical focus can be
    selectively activated during cognitive stress; active sites show graded
    stiffness and Doppler differences; their chemical milieu is compatible
    with nociceptive sensitization; and smooth muscle possesses a mechanism
    capable of sustaining force economically. A reported seconds-scale
    release during pressure and exhalation would, if objectively confirmed,
    be difficult to reconcile with removal of mature scar tissue. This is a
    coherent and testable causal chain rather than an intrinsically
    unscientific proposal.

    The strongest case against the synthesis is that none of those records
    identifies a latch-state microvessel at a tender point or demonstrates
    the proposed sequence from vascular constriction to ischemia,
    sensitization, guarding, and release. The only evidence bearing directly
    on pressurized skeletal-muscle arterioles reports maintained or rising
    activation during maintained constriction, not the economical
    dephosphorylated signature invoked by the hypothesis. Latch behavior is
    also not generic across vessel types, and arteriole-level energetic
    economy has not been demonstrated. The local Doppler findings are
    gradients rather than diagnostic signatures: resistivity index was
    unchanged, pulsatility classified sites poorly, and retrograde flow
    occurred at about a third of palpably normal sites in symptomatic
    muscle. Mechanical compression by skeletal-muscle contracture,
    inflammation, and measurement pressure remain explicit alternatives.
    Moreover, palpation has no validated reference standard and lacks
    demonstrated reproducibility, weakening every study whose site
    classification begins with manual examination.

    The cognitive extension is substantially less supported than the knot
    hypothesis. Fast vascular-to-neural modulation is not evidence that
    vascular states encode distinguishable predictions, survive withdrawal
    of their inputs, and are later read as memory. No write–store–read
    demonstration connects vascular tension to expectations, clinging, or
    contemplative maps. Similarly, the claimed blood-first ordering during
    release, the regional vasoconstriction interpretation of stress-induced
    EMG, and the proposed vessel–hyaluronan–tether composite remain
    unmeasured.

    Accordingly, the case is weakly supported rather than contradicted:
    several prerequisites and compatible local abnormalities are real, but
    the distinctive attribution remains an extrapolation and faces a
    compartment-specific mechanistic mismatch. The single evidence record
    whose removal would most change this verdict is VASO-E020, because it is
    the closest direct evidence from the vessel compartment named by
    VASO-C020 and points toward sustained activation rather than latch. The
    verdict survives without it: the remaining record would still contain
    no objective seconds-scale release, no identified vascular latch at a
    knot, no discriminating test against guarding or fascial mechanisms,
    and no vascular write–store–read result.
  steelman: >-
    The ledger does not answer the hypothesis's decisive prediction: whether
    a subjectively marked, breath-assisted release is accompanied by a
    site-specific perfusion rise that reproducibly precedes a local stiffness
    drop while matched pressure-only, sham-site, and failed-release trials
    remain unchanged.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The evidence demonstrates that vascular dynamics can modulate neural
      activity, but it does not demonstrate that vascular tension stores
      distinguishable predictions, expectations, or contemplative clinging.
      VASO-E017 identifies the missing write–store–read criterion, while
      VASO-E013 and VASO-E038 merely state the theory. The strongest opposing
      consideration is the direct mechanosensitive vascular-to-neural result
      in VASO-E005, but instantaneous modulation is not memory or
      content-specific mental implementation.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Trigger-point sites have measurable electrical, biochemical,
      mechanical, and partial hemodynamic abnormalities, and vascular smooth
      muscle has latch-related capabilities in some preparations. No record,
      however, identifies latch-state smooth muscle at a knot or establishes
      the complete ischemia–sensitization–guarding sequence. The strongest
      opposing consideration is VASO-E020: pressurized skeletal-muscle
      arterioles maintained constriction with maintained or rising activation
      rather than the proposed economical latch signature.
  - claimId: VASO-C174
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record jointly measures vessel tone, a hyaluronan collar,
      and a fascial-sheet tether at a knot, much less shows that all three
      function as memory elements. Existing Doppler and stiffness findings do
      not identify those anatomical components or their causal order. The
      strongest opposing consideration is the complete absence of direct
      evidence for the hyaluronan-collar and sheet-tether portions of the
      proposed composite.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      VASO-E039 supplies only the proponent essay's uncoded assertion that
      traditional maps cluster in suggestive anatomical regions. There is no
      blinded translation, common coordinate system, chance baseline, or
      physiological comparison showing that the traditions map one shared
      vascular-autonomic system. The strongest opposing consideration is the
      high risk of post-hoc resemblance among broad and culturally distinct
      anatomical vocabularies.
  - claimId: VASO-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      VASO-E003 directly supports economical sustained smooth-muscle force at
      low activation through the latch-bridge model and its underlying
      experimental phenomenon. The claim is existential—vascular smooth
      muscle can do this—not a claim that every vessel does. The strongest
      opposing consideration is VASO-E021, which shows that latch behavior is
      not generic and may disappear between a parent artery and a downstream
      branch.
  - claimId: VASO-C011
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      A reproducible physical disappearance within seconds would strongly
      disfavor literal removal or remodeling of mature scar tissue. It would
      not by itself prove that the released entity was actively maintained,
      because passive viscoelastic rearrangement, fluid displacement, or a
      measurement artifact could also occur rapidly. The strongest opposing
      consideration is that the premise—an objective seconds-scale
      release—has not been measured, and the available report is subjective
      testimony.
  - claimId: VASO-C077
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record presents measurements of hyaluronan viscosity or
      fascial gliding before and after pressure, movement, or warmth. General
      plausibility that connective tissue properties can change with
      mechanical and thermal conditions is a prior, not case evidence for
      this specific claim. The strongest opposing consideration is the lack
      of demonstrated reversibility and timescale in the provided record.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      VASO-E005 provides direct causal evidence that physiological
      blood-pressure pulsations modulate neuronal activity through
      mechanosensitive channels in rat central tissue. This establishes the
      claimed capability, while VASO-E004 supplies its broader theoretical
      context. The strongest opposing consideration is that the demonstration
      concerns rapid central mechanosensation rather than human peripheral
      neurons, persistent vascular states, or stored information.
  - claimId: VASO-C013
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The systematic review in VASO-E009 reports reproducible changes in
      respiratory sinus arrhythmia, heart-rate variability, and related
      indices consistent with increased parasympathetic influence during slow
      breathing. Those findings support the general autonomic claim. The
      strongest opposing consideration is that the evidence does not clearly
      isolate extended exhalation from slow breathing as a whole, and
      “parasympathetic dominance” simplifies a multidimensional autonomic
      response.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      VASO-E011 is a systematic review concluding that manual trigger-point
      examination had not demonstrated adequate reliability or validity and
      lacked an accepted reference standard. VASO-E010 documents substantive
      peer-reviewed contestation of the construct, while VASO-E029 records
      similar concerns from a proponent imaging group. The strongest opposing
      consideration is that these criticisms apply to manual diagnosis and do
      not negate instrumented tissue differences once a site has been
      selected.
  - claimId: VASO-C001
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Proponent testimony and secondary introductory framing support the
      existence of commonly encountered tender points, but the provided
      record contains no verified general-population knot census. The
      fibromyalgia-era prevalence figures in VASO-E015 are second-hand and
      unverified, while pain-syndrome prevalence does not establish discrete
      points across the general population. The strongest opposing
      consideration is the documented unreliability of palpation and the
      resulting dispute over whether examiners reproducibly identify the same
      entities.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E001 reports sustained activity at a millimeter-scale nidus, and
      VASO-E031 records a prevalence gradient of 11 of 11 trigger-point sites,
      4 of 11 non-trigger endplate-zone sites, and no off-zone taut-band
      sites. Together these support the claim's localization and comparative
      prevalence rather than absolute exclusivity. The strongest opposing
      consideration is that the small, old, unblinded studies do not form an
      independent modern replication, and the signal may primarily identify
      motor endplate zones.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E002 directly reports that mental arithmetic increased activity at
      trigger-point electrodes while adjacent controls remained comparatively
      quiet without generalized muscle tensing. The observation is therefore
      supported as stated within the small experiment. The strongest opposing
      consideration is that the control sites may not have been matched to
      the motor endplate zone, so site selectivity could reflect electrode
      placement rather than a trigger-point-specific storage process.
  - claimId: VASO-C143
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The stress experiment measured needle EMG but did not measure local skin
      perfusion, vascular caliber, or sympathetic vasoconstriction. It
      therefore cannot identify the site-selective electrical rise as a
      vascular event written to a skin territory. The strongest opposing
      consideration is the viable alternative explicitly noted in the
      evidence: sympathetic modulation of spindles or motor endplates without
      regional vascular storage.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      VASO-E014 directly records first-person and practitioner reports of a
      felt release within seconds during combined pressure and slow
      exhalation. Because the claim concerns a felt event, such testimony is
      relevant, but it remains unblinded and uninstrumented. The strongest
      opposing consideration is that expectation, attention, normal tissue
      deformation, or generalized relaxation could produce the same reported
      sensation without a discrete local release.
  - claimId: VASO-C039
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      VASO-E014 reports the proponent's observation that pressure locates a
      knot but does not release it, providing weak direct testimony for the
      claim. No factorial comparison establishes that pressure alone is
      ineffective at matched sites. The strongest opposing consideration is
      that an absolute necessity claim cannot be inferred from one
      expectation-sensitive report without controlled pressure-only trials.
  - claimId: VASO-C073
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No provided study synchronizes perfusion and stiffness measurements
      during a breath-assisted release, so the proposed temporal ordering has
      not been observed. Static Doppler abnormalities and intervention
      follow-up over separate visits cannot establish blood-first causation
      on a seconds timescale. The strongest opposing consideration is that
      stiffness change, mechanical decompression, and perfusion could occur
      in the reverse order or simultaneously.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E006 supports biochemical differences, VASO-E023 supports graded
      stiffness differences, and VASO-E022 supports a group-level
      pulsatility difference near active sites. Thus all three measurement
      domains named in the claim have positive evidence. The strongest
      opposing consideration is that blood-flow indices were poor individual
      classifiers, resistivity index was null, controls came from symptomatic
      muscle, and much of the evidence comes from one research lineage.
  - claimId: VASO-C006
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E008 reports preregistered within-subject experiments in which
      attention toward histamine-prick sensations reduced and accelerated
      resolution of wheal and flare responses across two cohorts. Several
      arousal proxies did not differ, supporting the claim's qualification,
      although sympathetic activity was not directly measured. The strongest
      opposing consideration is that this is a recent single-lab acute-skin
      result with altered heart-rate variability and no direct molecular
      measurement.
  - claimId: VASO-C031
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E022 directly reports a significantly higher pulsatility index in
      arteries near active upper-trapezius sites than near palpably normal
      sites in the same symptomatic muscles. The population and spatial
      comparison match the claim closely. The strongest opposing
      consideration is the absence of pain-free controls and the large
      variance that made pulsatility a poor site classifier.
  - claimId: VASO-C032
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E022 directly reports retrograde diastolic flow at 15 palpably
      normal sites, corresponding to 31%, in patients with trigger points
      elsewhere in the muscle. This supports the descriptive claim as stated.
      The strongest opposing consideration is that these were not healthy
      control muscles, so the percentage cannot be interpreted as a
      general-population normal rate.
  - claimId: VASO-C033
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E023 directly reports the ordered stiff-area pattern: active sites
      were larger than latent sites, which were larger than palpably normal
      sites. Blinding of the sonographers and reported discriminatory
      performance strengthen the finding. The strongest opposing
      consideration is that palpation supplied the original classification
      and the single-frequency vibration method did not directly measure
      shear elasticity.
  - claimId: VASO-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E032 directly reports endplate noise at four non-trigger sites
      located within the endplate zone, at lower prevalence than the 11 of 11
      trigger-point sites. This is a close match to the claim. The strongest
      opposing consideration is that the study was small, nonrandomized, and
      unblinded, with only its abstract available to the ledger.
  - claimId: VASO-C035
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E032 directly reports no endplate noise at the examined taut-band
      sites outside the motor endplate zone. The finding also supports an
      endplate-centered interpretation of the electrical signal. The
      strongest opposing consideration is that zero events in a small,
      unblinded sample does not establish universal absence.
  - claimId: VASO-C036
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      VASO-E024 directly reports no detected resistivity-index difference
      among active, latent, and palpably normal upper-trapezius sites. This is
      the relevant negative result and supports the claim within the studied
      sample. The strongest opposing consideration is that a single
      within-patient study with symptomatic-muscle controls may have lacked
      the contrast or precision needed to detect a real difference.