caseAssessment:
  verdict: mixed
  loadBearing: [VASO-C020, VASO-C011, VASO-C002, VASO-C030]
  weakestLinks: [VASO-C174, VASO-C073, VASO-C143, VASO-C022, VASO-C020]
  synthesis: >-
    The case is a ladder whose lower rungs are genuinely solid and whose
    distinctive upper rungs currently float. The latch-bridge (VASO-C010) is
    textbook physiology backed by a strong primary (VASO-E003), with the
    honest qualifier from VASO-S001 that the behaviour is not generic across
    vascular smooth muscle and was absent one branch order downstream in the
    only paired comparison (VASO-E021). The breath lever (VASO-C013),
    attentional regulation of inflammation (VASO-C006), and the measurable
    distinctness of tender-point tissue (VASO-C005, including the blinded
    sonoelastography gradient in Ballyns 2011) are all reasonably supported.
    The neural-signature observations survive, but sharpened rather than
    rescued by Simons 2002: the endplate-zone gradient (VASO-C034) is real
    and cuts against naive nidus exclusivity while leaving a prevalence
    gradient intact. Against this, the two rungs that make the case what it
    is are unevidenced: the critical report's grade-D audit (VASO-E016)
    finds no direct evidence that knots release objectively in seconds or
    that the releasing element is vascular smooth muscle, and the only
    evidence record bearing on the exact compartment VASO-C020 names
    (pressurized skeletal-muscle arterioles, VASO-E020) shows maintained
    activation rather than an economical latch — a mismatch the proponent's
    own second essay concedes and responds to by relocating the mechanism to
    cutaneous perforators (VASO-E044, E045), a move that has no anchored
    evidence either. The contemplative identification (VASO-C022) and the
    memory claim (VASO-C021) rest on proponent statements plus a report
    (VASO-E017) arguing hysteresis is not yet memory. Sensitivity: the
    single record whose removal would most change the case verdict is
    VASO-E016; without it the upper rungs would be merely silent rather than
    actively graded-D, but the verdict of mixed survives, because
    VASO-E019–E021 and the total absence of any affirmative mechanism record
    carry the same load. The honest reading is: a real, instrumented,
    contested phenomenon; a genuinely plausible state-not-structure frame;
    and a specific vascular attribution that is borrowed, not observed, with
    the one decisive experiment never run.
  steelman: >-
    The McNulty 1994 result (VASO-E002) remains unexplained by any
    conventional account: a purely cognitive stressor, with no movement and
    no generalized tensing, selectively raised the electrical signal inside
    a millimeter-scale tender point while adjacent tissue in the same muscle
    stayed quiet. Whatever the generator is, something addresses individual
    tender points from the inside under mental load — a site-specific
    autonomic write, exactly the signature the hypothesis predicts — and no
    experiment has ever measured local perfusion or vascular state during
    that write. The hypothesis's read of this as autonomic maintenance of a
    latched vascular state is therefore untouched by this assessment: the
    keystone imaging study (VASO-R001) has simply never been run, so the
    absence of vascular evidence at knots is absence of looking, not a
    negative finding, and the EMG generator dispute cuts both ways.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records bearing on this are the hypothesis's own statement
      (VASO-E013, E038) and VASO-E017, which argues the latch literature
      satisfies none of the write–store–read criteria for biological memory
      and that the closest precedent is Physarum. VASO-E005 shows vascular
      state can modulate neurons but explicitly not store content. The claim
      is testable (VASO-R005) but has never been tested; no record supports
      or contradicts the tanha identification.
  - claimId: VASO-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      VASO-E016 assigns grade D to both linchpins — no seconds-scale
      objective release has been imaged and no latch has been observed at a
      tender point — and VASO-E019/E020 show the energetic-economy argument
      is an extrapolation across vessel class and caliber, with the only
      compartment-matched measurements showing maintained activation rather
      than latch. Against this, the imaging abnormalities (VASO-E022, E023,
      E027) are compatible with a vascular component but at near-zero
      diagnosticity, since the source itself ranks compression by contracture
      as an equal candidate. The claim is neither demonstrated nor
      refuted; the honest verdict is open.
  - claimId: VASO-C174
    verdict: unresolved
    confidence: low
    reasoning: >-
      This composite three-element account is anchored only to
      SRC-JHONG-2026A, whose verification record states nothing may lean on
      it until it is read; no evidence record in the ledger anchors any of
      the three elements jointly. It also competes with VASO-C021's
      single-element vascular picture rather than extending it. There is
      nothing yet to assess beyond provenance.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only record is VASO-E039, an uncited, unblinded assertion about
      traditional map locations with no coding rule or chance baseline, which
      its own inference grades at essentially zero diagnostic weight. The
      strong identification of these maps as empirical instruments of the
      same vascular-autonomic system awaits exactly the blinded coding
      VASO-R006 proposes. Post-hoc resemblance remains fully live as an
      alternative.
  - claimId: VASO-C010
    verdict: established
    confidence: high
    reasoning: >-
      VASO-E003 anchors the latch-bridge model to Hai & Murphy 1988, a
      foundational and heavily replicated line of smooth-muscle physiology.
      The strongest opposing consideration is VASO-E021: the one paired
      parent-branch comparison found latch behaviour absent one branch order
      downstream, so the capability is vessel-type-dependent and was never
      followed into arterioles. Since the claim asserts a capability of
      vascular smooth muscle rather than universal latching, it stands.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      As a conditional the inference is robust: no known structural
      remodeling reverses in seconds, so an objective seconds-scale release
      would entail a maintained state, and even the competing fascial
      densification route (VASO-C077) is a state, not a scar. The weakness is
      the antecedent: VASO-E016 records that no objective seconds-scale
      release has ever been measured, and VASO-E035 is the argument itself,
      not an observation. The conditional is sound; its antecedent is open.
  - claimId: VASO-C077
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger anchors this claim; its only source
      anchor is the unverified second essay (SRC-JHONG-2026A), which the
      source record says nothing may lean on until read. The proposition is
      plausible against general fascia literature, but that is prior
      knowledge, not ledger evidence, and the research agenda itself
      (VASO-R008) treats the timescale as unretrieved.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is modest — vascular state can modulate nearby neurons — and
      VASO-E005 provides direct causal demonstration via mechanosensitive
      channels, on top of the hypothesis framing in VASO-E004. The strongest
      opposing consideration is scope: the demonstration is rat brain with
      instantaneous modulation, not human periphery and not storage, so it
      supports this claim without supporting the memory claims built on it.
  - claimId: VASO-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      VASO-E009 anchors this to a systematic review finding reproducible
      respiratory sinus arrhythmia and HRV increases under slow breathing.
      The strongest opposing consideration is that the review documents
      global cardiovascular correlates in healthy subjects, not local tissue
      effects — the site-specific unlatching the featured hypothesis adds is
      exactly what no record measures.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      VASO-E011 is a strong systematic review concluding manual trigger-point
      examination has not been shown reliable or valid for want of a reference
      standard, corroborated by VASO-E010 and by a proponent group's own
      concession (VASO-E029). The strongest opposing consideration is that
      the Dommerholt–Gerwin rebuttal keeps the broader construct debate open;
      but the claim as stated — reliability undemonstrated, construct
      contested — is precisely what the record shows.
  - claimId: VASO-C001
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Support is real but soft: VASO-E015 is proponent testimony with
      second-hand, unverified community statistics, and VASO-E028 is
      introductory framing with a 1986 second-hand estimate. VASO-E012
      corrects the framing directly: skeptics dispute the existence and
      reproducibility of the spots themselves, not merely their mechanism,
      and VASO-E011 shows the reference standard is subjective. The
      phenomenon is plausibly common, but the ledger cannot yet establish
      it.
  - claimId: VASO-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E001 gives the core finding and VASO-E031/E032 supply the exact
      comparators the claim's careful phrasing requires: 11/11 at trigger
      points, 4/11 at non-tender endplate-zone sites, 0/11 off-zone taut
      bands. The strongest opposing consideration is that both studies are
      small, one lineage dominates, the generator (endplate vs spindle) is
      contested, and Simons 2002 was unblinded — the prevalence gradient
      holds, but the "addressable nidus" reading is weaker than first
      appears.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      VASO-E002 directly reports the selective stressor effect, but it is
      n=14, from the same lineage as Hubbard–Berkoff (one line of evidence),
      never replicated with modern instrumentation, and its silent controls
      may simply have lain off the endplate zone per the Simons 2002
      gradient. VASO-E033 adds no independent weight. Site-selectivity
      against a matched endplate-zone control has never been tested
      (VASO-R011 exists precisely for this).
  - claimId: VASO-C143
    verdict: unresolved
    confidence: low
    reasoning: >-
      No record tests the specific mechanism: no study measured localized
      skin perfusion over a tender point under a mental stressor. VASO-E002's
      own limitations note that sympathetic drive to spindles or endplates
      fits the EMG data without any vascular write, and the case's neural
      signature was partly qualified by the endplate-zone findings. This is
      one consistent reading among several, evidenced by none.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      VASO-E014 is explicit, honestly labeled first-person testimony from the
      hypothesis's proponent in an AI-generated essay, with expectation and
      attention effects explicitly unexcluded; VASO-E016 confirms no
      synchronized imaging study exists of the release event. The felt
      release is widely reported and internally consistent, but as an
      observation it remains unmeasured, and no objective anchor exists in
      the ledger.
  - claimId: VASO-C039
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger anchors this necessity claim; it
      descends from the same proponent testimony as VASO-C004, and the two-key
      structure is exactly what VASO-R003 and VASO-R017 are designed to
      break or confirm. Notably, the unretrieved Olewnik elastography work
      flagged in VASO-R012 could cut directly against it if pressure alone
      reverses palpated points within minutes.
  - claimId: VASO-C073
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on the ordering; the claim is a preregistered
      prediction, not an observation, and VASO-E016 confirms no synchronized
      time-resolved imaging of a release has ever been performed. Its
      falsification conditions are well specified (stiffness leading or
      simultaneity), which makes it a good prediction but gives it zero
      present evidential weight.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E006 (biochemical milieu), VASO-E007 (systematic review), and
      VASO-E023 (blinded sonoelastography, AUC 0.8–0.9) give the claim real
      instrumented support. The strongest opposing considerations are
      recorded against it: the Doppler signature is graded and partial
      (RI null, PI a poor classifier — VASO-E024/E025), all comparisons are
      within symptomatic patients without a pain-free control (VASO-E026),
      and the Shah lineage is not independent. Measurable difference
      survives at group level; the mechanism does not follow.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E008 is a preregistered, within-subject study with arousal
      controls showing ~1.5-fold attenuated wheal responses under internal
      attention — a strong record for the claim as stated. The opposing
      consideration, flagged in VASO-E041, is route and timescale: vagal
      immune regulation over ~20 minutes in skin that is not
      parasympathetically innervated, which supports the claim but does not
      transfer to seconds-scale latch release.
  - claimId: VASO-C031
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E022 records the primary result directly: median PI 8.3 at active
      versus 3.0 at normal sites, significant at P < .05, from a study with
      blinded sonographers. The opposing considerations are that vessels
      interrogated are >1 mm conduits 1–2 cm from the point, PI had large
      variance and classified sites poorly, and there was no pain-free
      control group (VASO-E026).
  - claimId: VASO-C032
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E022 anchors the exact figures: 31% of palpably normal sites
      showed retrograde diastolic flow versus 55% at active sites. The claim
      as stated is just the occurrence at normal sites, which the source
      states plainly. Its interpretation is genuinely ambiguous — within-
      patient normal sites in symptomatic muscle may reflect spillover rather
      than baseline, per VASO-E026 — but that caps interpretation, not the
      measurement itself.
  - claimId: VASO-C033
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E023 records the graded ordering with quantitative means (0.57 vs
      0.36 vs 0.17 cm²) and strong ROC separation, with blinded sonographers —
      the strongest single measurement record in the case. Opposing
      considerations: single vibration frequency, sites preselected by
      palpation so the contrast presupposes the palpated classification, and
      the measure says nothing about what the stiff tissue is.
  - claimId: VASO-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E031/E032 record the finding directly: endplate noise in 4 of 11
      endplate-zone sites outside trigger points, at lower prevalence than
      the 11/11 at trigger points. The opposing considerations are the
      abstract-only record, the unblinded n=10 design, and proponent
      authorship — though the finding cuts against the authors' own
      exclusivity framing, which counts in its favor.
  - claimId: VASO-C035
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      VASO-E032 records the 0/11 result at off-zone taut-band sites, but an
      absence claim from eleven sites in an unblinded, nonrandomized study of
      ten subjects is fragile; a single sampling artifact would flip it. The
      finding is also the keystone of the conventional endplate-zone reading
      of the electrical signature, so it deserves replication before
      "well_supported."
  - claimId: VASO-C036
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      VASO-E024 records the null directly from the primary: no RI differences
      between site types, with the authors attributing this partly to
      proximity of normal sites to trigger points. The opposing
      consideration is that this is a null in symptomatic patients without a
      pain-free control, so it constrains interpretation of the vascular
      signature rather than the measurement itself.