caseAssessment:
  verdict: weakly_supported
  loadBearing: [VASO-C020, VASO-C010, VASO-C011, VASO-C005, VASO-C004]
  weakestLinks: [VASO-C021, VASO-C073, VASO-C039, VASO-C143, VASO-C022]
  synthesis: >-
    The featured hypothesis stacks three layers: (1) discrete tender points
    are real and instrumentably distinct from surrounding tissue; (2) what
    is held is an actively maintained physiological state rather than scar
    or remodeled structure, specifically microvascular smooth muscle in the
    latch-bridge state producing local ischemia and secondary guarding; (3)
    that vascular state participates in mental life as a writable memory
    element for predictions and clinging. Layer (1) is the strongest. Active
    sites differ from control tissue in local biochemistry (acidic
    mediator-rich milieu), stiffness (graded vibration-elastography areas),
    and some hemodynamic indices (higher pulsatility, more frequent
    retrograde diastolic flow), and needle EMG records sustained spontaneous
    activity concentrated at a millimetre-scale nidus that a purely cognitive
    stressor can selectively raise. These are real measurements, not
    anecdotes, though they sit on a contested diagnostic construct whose
    manual identification lacks demonstrated inter-examiner reliability and
    a validated reference standard. Layer (2) splits. The conditional logic
    that a seconds-scale objective release would imply state-not-structure is
    sound, and textbook latch physiology supplies a low-energy hold that
    could in principle do the job. But the two linchpin empirical steps —
    objective seconds-scale local release under pressure-plus-exhale, and
    identification of latched vascular smooth muscle at a tender point —
    have no direct evidence; a commissioned audit graded both D. Worse, the
    only evidence map by vessel type and caliber finds latch demonstrations
    concentrated in large tonic conduit arteries, no energetic measurement
    in any arteriole, and pressurized skeletal-muscle arterioles holding
    constriction under maintained activation (phosphorylation rising with
    tone) rather than an economical dephosphorylated latch. The one paired
    parent-versus-branch comparison found latch present in the parent and
    absent one order downstream. Doppler abnormalities near trigger points
    are real but graded, conduit-scale, and equally compatible with
    mechanical compression by contracture. The second essay’s own relocation
    of the vascular element from intramuscular arterioles to cutaneous
    perforators concedes the mismatch without supplying new measurements.
    Layer (3) is almost entirely unsupported: hemo-neural modulation of
    neurons by blood-pressure pulsations via mechanosensitive channels is
    now demonstrated in central tissue, and voluntary attention can regulate
    acute peripheral inflammation without arousal change, but neither is a
    write–store–read memory loop, and hysteresis is not autobiographical
    content. Contemplative-map convergence is untested pattern-matching.
    Steelmanning the affirmative: the lower physiology is real, something
    addressable is electrically maintained and stress-writable, and a
    fast local release (if ever imaged) would force state-not-scar even if
    the holder is not latch. Steelmanning the negative: the distinctive
    vascular-latch attribution is an extrapolation across vessel class and
    caliber that the published arteriole record does not fit, the construct
    used to locate the object is unreliable, and the mental-participation
    claim has zero direct evidence. Net: the hypothesis is a coherent
    minority reading of real lower-rung facts, but its load-bearing
    middle and upper claims remain unevidenced or mismatched, so the case
    as stated is only weakly supported. The verdict hangs substantially on
    the absence of the keystone imaging experiment and on the arteriole
    latch audit; a single positive release-imaging study or a positive
    paired-caliber latch demonstration at microvessel scale would move it.
  steelman: >-
    Practitioners and the proponent consistently report a two-key,
    seconds-scale felt release under sustained pressure plus slow exhale
    that does not occur with pressure alone, and a purely cognitive
    stressor selectively raises spontaneous EMG at the tender nidus while
    adjacent fibers stay quiet — an addressable, mentally writable hold
    whose objective local stiffness and perfusion transitions have simply
    never been time-resolved; if those transitions exist and blood leads
    stiffness, the state-not-scar and autonomic-write core would stand even
    if the molecular holder is not classical latch.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: high
    reasoning: >-
      Johnson’s three vasocomputation hypotheses and the essay’s tanha
      identification are theoretical statements with no experimental
      write–store–read demonstration in mammals; the critical report’s
      hysteresis-is-not-memory argument and the Physarum contrast correctly
      mark the gap. Hemo-neural modulation (C012) and attention-regulated
      inflammation (C006) make weak vascular participation in computation
      more plausible but do not establish content-specific vascular memory.
      Strongest opposing consideration: absence of evidence is not
      evidence of absence until VASO-R005 is run.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The claim bundles state-not-scar with a specific vascular-latch
      mechanism. State-not-scar is provisionally coherent if seconds-scale
      release is real, but that release is unmeasured (grade-D audit). The
      latch attribution is undermined by the vessel-type evidence map: no
      arteriole energetics, pressurized skeletal-muscle arterioles show
      maintained activation not dephosphorylated hold, and Doppler
      signatures are conduit-scale and multiply explained. Strongest
      opposing consideration: secondary guarding plus endplate noise plus
      fascial densification can cover the same observations without latch.
  - claimId: VASO-C174
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The three-element composite (vessel tone, hyaluronan collar, sheet
      tether) is a later proponent reframing offered as an alternative to
      single-latch memory; no primary measurements of hysteresis in each
      element at a knot, nor of their joint necessity, appear in the
      ledger. Strongest opposing consideration: if true it would dilute
      rather than rescue the original latch-centric C020/C021 stack, and
      it remains untested either way.
  - claimId: VASO-C022
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      Only an uncited essay assertion that traditional maps cluster on
      midline and limbs supports the claim; no blinded anatomical coding
      against chance baselines exists. Convergence could be real
      cartography or post-hoc resemblance. Strongest opposing
      consideration: without VASO-R006 the claim cannot be adjudicated from
      present records.
  - claimId: VASO-C010
    verdict: established
    confidence: high
    reasoning: >-
      Hai & Murphy 1988 and the subsequent latch literature establish
      economical force maintenance at low phosphorylation in vascular and
      visceral smooth muscle as textbook physiology. The evidence map
      qualifies universality: latch is not generic across vessel type and
      was absent in one muscular branch relative to its parent, and has not
      been shown in arterioles under physiological transmural pressure.
      Strongest opposing consideration: capability in conduit arteries does
      not entail capability at the caliber C020 needs.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      As conditional logic the claim is sound: structural remodeling does
      not reverse in seconds, so an objective seconds-scale local release
      would imply an actively maintained state. The premise (objective
      release on that timescale) is precisely the unmeasured linchpin; the
      essay supplies only first-person phenomenology and a slow dry-needling
      pilot on visit timescales. Strongest opposing consideration: without
      imaged transitions the conditional never fires, and densification or
      reflex inhibition could also reverse fast.
  - claimId: VASO-C077
    verdict: unresolved
    confidence: low
    reasoning: >-
      No primary densification study is in the evidence ledger; the claim
      rests on essay citation of Stecco-group ideas and a research-agenda
      item (R008) that has not been executed. Reversibility under pressure,
      movement, and warmth is plausible from general fascia literature but
      unanchored here. Strongest opposing consideration: even if true, the
      seconds-scale window required to compete with C011/C020 is exactly
      what has not been measured.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Moore & Cao 2008 stated the hypothesis; Salameh et al. 2024
      demonstrated blood-pressure pulsations modulating central neuronal
      activity via mechanosensitive channels on rapid timescales — direct
      causal evidence for the mechanical read path. Limitations: rat brain
      not human periphery, instantaneous modulation not stored content.
      Strongest opposing consideration: modulation of gain is not memory of
      patterns, so C012 supports only the weak form of vasocomputation.
  - claimId: VASO-C013
    verdict: established
    confidence: high
    reasoning: >-
      Zaccaro et al. 2018 systematic review documents reproducible increases
      in RSA/HRV and related autonomic/CNS changes under slow breathing in
      healthy humans, consistent with parasympathetic shift. This is global
      cardiovascular physiology, not local unlatching at tender points.
      Strongest opposing consideration: global shift does not entail
      site-specific vascular release; that addition is untested.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lucas et al. 2009 systematic review concluded manual TP examination
      has not been shown reliable or valid without a reference standard;
      Quintner et al. 2015 argue the construct is circular and the lesion
      undemonstrated. Proponent sources themselves concede examiner
      dependence. The debate is answered but not closed by Dommerholt &
      Gerwin. Strongest opposing consideration: instrumented (imaging)
      localization may escape the palpation reliability problem even if the
      classical construct remains contested.
  - claimId: VASO-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Clinical and research literature treats discrete tender palpable spots
      as common (Ballyns introduction; essay foam-roller phenomenology;
      fibromyalgia-era community exams cited second-hand), and imaging
      finds quantifiable differences at palpated sites. The critical report
      correctly notes that skeptics dispute the spots’ reproducibility and
      ontology, not only mechanism, and no proper knot census exists.
      Strongest opposing consideration: without reliable localization and a
      population census the ubiquity claim remains softer than the essay
      presents.
  - claimId: VASO-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hubbard & Berkoff 1993 found sustained spontaneous needle-EMG in the
      1–2 mm nidus of all trapezius TPs and none in adjacent non-tender
      fibers. Simons, Hong & Simons 2002 qualify exclusivity: endplate noise
      also occurs at some non-tender endplate-zone sites (4/11), though at
      lower prevalence, and not in taut bands off the zone — so the
      signature tracks endplate zone first and TP second. Strongest
      opposing consideration: the generator may be ordinary endplate
      potentials under sympathetic drive, not a distinct vascular-linked
      nidus.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      McNulty et al. 1994 (n=14, same lineage) showed mental arithmetic
      raising EMG at TP sites while adjacent control sites stayed quiet,
      without generalized tensing. Never replicated with modern methods or
      matched endplate-zone controls; no vascular endpoint. Strongest
      opposing consideration: Simons 2002 implies the silent controls may
      have been off-zone, so selectivity to “the knot” versus “any stressed
      endplate” is unproven.
  - claimId: VASO-C143
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The claim reinterprets C003’s selective EMG rise as regional
      sympathetic vasoconstriction written to a skin territory. No ledger
      record measures local skin perfusion over the tender point during a
      cognitive stressor; the interpretation is free-standing. Strongest
      opposing consideration: spindle or endplate sympathetic drive fits
      the EMG data without any vascular write.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Sole support is first-person and practitioner phenomenology in the
      proponent essay (pressure locates, breath-plus-pressure releases in
      seconds). No synchronized elastography/Doppler/EMG study of a release
      event exists; the grade-D audit flags this explicitly. Expectation and
      attention effects are uncontrolled. Strongest opposing consideration:
      the report may be real and still reflect global relaxation or
      densification rather than local vascular unlatch.
  - claimId: VASO-C039
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim asserts pressure alone does not release where
      pressure-plus-slow-exhale does. Only the essay’s assertion supports
      it; no factorial pressure-only versus pressure-plus-exhale trial with
      objective endpoints is in the ledger. Strongest opposing
      consideration: if Olewnik-style elastography under pressure alone
      (flagged in R012, unretrieved) shows rapid stiffness loss, the
      two-key necessity fails.
  - claimId: VASO-C073
    verdict: presently_untestable
    confidence: high
    reasoning: >-
      Blood-first, stiffness-second is a preregistered prediction for the
      unrun keystone experiment (R001/R016). No time-resolved co-registered
      Doppler and elastography of a release event exists. Strongest
      opposing consideration: none from data — the claim is a prediction,
      not an observation.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      Shah microdialysis (acidic mediator-rich milieu), Mazza imaging review,
      Ballyns vibration elastography (graded stiff areas active > latent >
      normal, ROC-capable), and Ballyns Doppler (higher PI, more retrograde
      flow near active sites) establish measurable differences. Qualifiers:
      biochemistry not purely local; RI null; PI poor as individual
      classifier; no pain-free controls; vessels conduit-scale. Strongest
      opposing consideration: differences confirm something is wrong at the
      site but do not identify latched microvessels.
  - claimId: VASO-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Mizrachi et al. 2026 preregistered within-subject experiments (n=57)
      show attention-to-sensation producing ~1.5-fold smaller, faster-
      resolving histamine wheal/flare versus distraction, without SCR/HR/
      anxiety differences, via sensory and vagal routes. Authors note skin
      lacks direct parasympathetic innervation; timescale ~20 min, immune
      not latch. Strongest opposing consideration: existence of an
      attention–periphery channel does not show seconds-scale vascular
      unlatch at knots.
  - claimId: VASO-C031
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 reports significantly higher Doppler pulsatility index
      near active upper-trapezius TPs (median 8.3) than normal sites (3.0)
      in acute cervical pain patients. Limited by within-patient symptomatic
      controls, large variance (PI not a good classifier), and conduit-
      scale vessels 1–2 cm from the point. Strongest opposing
      consideration: compression by contracture or transducer pressure can
      raise pulsatility without distal arteriolar latch.
  - claimId: VASO-C032
    verdict: well_supported
    confidence: high
    reasoning: >-
      Ballyns 2011 directly states retrograde diastolic flow in 15 of
      palpably normal sites (31%) versus 55% active and 40% latent, with
      higher occurrence at active/latent than normal. The claim reports
      that figure accurately. Strongest opposing consideration: “normal”
      sites in symptomatic muscle may reflect spillover, so 31% is not a
      pain-free baseline.
  - claimId: VASO-C033
    verdict: well_supported
    confidence: high
    reasoning: >-
      Ballyns 2011 vibration sonoelastography: mean stiff area 0.57 cm²
      active, 0.36 latent, 0.17 normal (P<.01), active significantly larger
      than latent, ROC AUCs 0.8–0.9. Sonographers blinded to clinical
      status. Strongest opposing consideration: sites pre-selected by
      palpation, single vibration frequency, shear elasticity not measured
      — contrast presupposes the contested classification.
  - claimId: VASO-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Simons, Hong & Simons 2002 abstract: endplate noise in all 11 TP
      sites and in four muscles at endplate-zone sites outside TPs
      (P=0.024). Directly anchors the claim. Small, unblinded,
      abstract-only. Strongest opposing consideration: does not by itself
      refute higher prevalence at TPs, only exclusivity.
  - claimId: VASO-C035
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Same Simons 2002 abstract: endplate noise “did not occur in taut band
      sites outside of an endplate zone” (P=0.000034). Directly anchors the
      claim and supports the conventional endplate-zone reading of the
      electrical signature. Strongest opposing consideration: abstract-only
      unblinded design in proponent hands; full amplitude distributions
      unseen.
  - claimId: VASO-C036
    verdict: well_supported
    confidence: high
    reasoning: >-
      Ballyns 2011 states no differences in resistivity index among active,
      latent, and normal sites, and that blood-flow measures did not
      perform well as classifiers. The null is a primary result, not an
      absence. Strongest opposing consideration: proximity of “normal”
      sites to TPs in symptomatic muscle may compress true differences.