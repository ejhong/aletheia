    - id: GEO-E044
      title: Boulder extraction and widespread fire-setting in the Pharaonic Aswan granite quarries
      claimIds:
        - GEO-C001
        - GEO-C002
      sourceId: SRC-KELANY-2009
      direction: context
      strength: moderate
      sourceStatement: The authors state that during the Pharaonic Period "quarrying largely involved the extraction of loose boulders" from the woolsack morphology, worked with dolerite pounders, and that only when boulders were too small (as for obelisks) or technology improved (Roman Period) was solid bedrock targeted. In the Northern quarries, ashy layers with charcoal mixed with the quarry debris suggest that "fire setting was widely applied in the quarrying process" during the Pharaonic Period, also outside the Unfinished Obelisk quarry, and dolerite tools scattered across these areas suggest their use in pounding and trimming of extracted blocks. New Kingdom debris at the Hatshepsut quarry likewise contains stone-tool fragments and ash.
      editorInference: "Weightless toward the truth of GEO-C001 and GEO-C002 themselves. It fixes what the measured 216 cm³/h can be inferred to stress: a model in which pounders alone cut bedrock channels — the exceptional obelisk case, and Röder's reading — not the general Pharaonic practice of boulder extraction with fire and pounders. My inference."
      exactLocator: "[p. 4] (print p. 90) and [p. 6] (print p. 92)"
      limitations:
        - Survey-level statements; no quantified fire-setting rates or experimental controls.
        - Fire-setting evidence is stratigraphic association of ash with debris, not direct observation of the technique.
      reviewState: ai_extracted
      origin:
        ref: report 2026-09-08-report-megalithic-casting-161414
        extractedBy: claude-fable-5-1
