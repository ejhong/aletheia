    - id: GEO-E038
      title: Engelbach's trench-time estimate uses an assumed rammer rate and a workforce inferred from groove spacing (§§14–15)
      claimIds:
        - GEO-C502
      sourceId: SRC-ENGELBACH-1922
      direction: qualifies
      strength: moderate
      sourceStatement: Engelbach reasons from the trench bottom that the best arrangement is "for each man to have two ‘feet’ marked out for him" along the trench, each man squatting with his back to the obelisk and working one foot while spoiling onto the other; he cites Plate III no. 1 as showing there is just room for a man to squat with a foot between neighbours. For the time taken he writes, "Assuming that, with rammers, the men can extract 8 millimetres in an hour" in each quarter of the double-foot task, the deepest part (4.2 + 1.0 m) gives (4 × 5.2)/(.008 × 12 × 30) = 7.22 months of twelve-hour days, and applies the same formula to Hatshepsut's obelisk (4.4 months), which he compares with her recorded seven months.
      editorInference: In the shown text the workforce arrangement is inferred from trench-floor groove spacing and the 8 mm/h figure is explicitly an assumption, not a measurement; the shown §§22–24 workforce numbers concern levering, computed from moments. No 'count divided by four' heuristic appears anywhere in the shown portions. GEO-C502's account of the workforce estimate is therefore not what the monograph states, so far as the shown text goes. My inference; Engelbach's arithmetic is his.
      exactLocator: §§14–15, pp. 13–15 of the 1922 print (Project Gutenberg HTML, page markers {13}–{15})
      limitations:
        - Text shown through §44; §§45–56 (miscellaneous objects, bibliography) unseen.
        - The 8 mm/h figure is unmeasured by Engelbach's own statement.
