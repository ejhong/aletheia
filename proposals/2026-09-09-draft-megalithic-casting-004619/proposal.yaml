    - id: GEO-E048
      title: Conventional fuel demand — gypsum mortar, copper, bread — offered as an explanation for Old Kingdom wood depletion
      claimIds:
        - GEO-C516
      sourceId: SRC-ASSOCIATES-ND
      direction: qualifies
      strength: weak
      sourceStatement: AERA asks whether its radiocarbon results reflect Old Kingdom deforestation and whether the builders had to scavenge wood "to burn tons of gypsum for mortar, to forge copper chisels", and to bake bread for thousands of labourers, concluding that the giant stone pyramids of the early Old Kingdom "may mark a major depletion of Egypt’s exploitable wood", which may explain the wide scatter of the dates.
      editorInference: GEO-C516 predicts that casting-scale wood-ash demand would leave region-scale deforestation signals dated to construction periods. This page shows the conventional account already expects a construction-era fuel shock from mortar, metallurgy and bread. A deforestation signal at the pyramid age would therefore be predicted by both accounts and cannot by itself discriminate; the claim's test needs a magnitude or a chemical (alkali/ash) signature beyond a fuel-demand signal. The page's suggestion is explicitly speculative. My inference.
      exactLocator: Section 'Conclusions' (webpage, no pagination)
      limitations:
        - Speculative questions, not measurements; no pollen or charcoal record cited.
        - Secondary summary.
