    - id: GEO-E043
      title: Kelany et al. attribute the pounding-only reading to Röder (1965) and report massive charcoal, ash and burnt brick from the 2002 excavation
      claimIds:
        - GEO-C502
      sourceId: SRC-KELANY-2009
      direction: undermines
      strength: moderate
      sourceStatement: The authors state that in the Unfinished Obelisk quarry channels were made directly into the bedrock and that the massive numbers of dolerite hammer stones led Röder (1965) to the conclusion that "the channelling was made by pounding only"; however, in recent excavations (Kelany 2003) "massive amounts of charcoal, ash and burned mud bricks were found", suggesting that heat must have been an important agent in one or more steps of the quarrying process. They add that from the Ptolemaic Period iron tools took over, with chiselled channels and, in the Roman Period, iron wedges.
      editorInference: GEO-C502 says the pounding-stone orthodoxy 'rests principally on Engelbach's 1922 report'. The survey literature attributes the pounding-only conclusion to Röder 1965, and describes the current account as boulder extraction plus fire plus pounding plus later iron. Together with GEO-E701 (Engelbach rejected hand pounding for the trench) this undermines the claim's attribution of the orthodoxy, while leaving its narrower factual points about the 1922 trial intact. My inference.
      exactLocator: "[p. 4] (print p. 90), section 'Quarrying techniques'"
      limitations:
        - Kelany 2003 is an unpublished SCA report; the charcoal/ash quantities are not given.
        - Röder 1965 not read directly.
      reviewState: ai_extracted
