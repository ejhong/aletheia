    - id: GEO-E047
      title: "The Koch Pyramids Radiocarbon Project's own summary: organics from Old Kingdom monuments dated, Great Pyramid placed in the historical era"
      claimIds:
        - GEO-C576
      sourceId: SRC-ASSOCIATES-ND
      direction: undermines
      strength: moderate
      sourceStatement: 'AERA states that in 1984 it radiocarbon-dated material from Egyptian Old Kingdom monuments, that "The average radiocarbon dates were 374 years earlier than expected", and that in spite of this "the radiocarbon dates confirmed that the Great Pyramid belonged to the historical era" studied by Egyptologists. A second round in 1994–95 broadened sampling to Saqqara, Djoser, Giza, 5th/6th Dynasty and Middle Kingdom pyramids plus Lost City bakeries, returning dates 100–200 years older than the Cambridge chronology, with Khufu dates scattered over ~400 years. It explains the offset by an old-wood effect: "recycled wood was burned, for example, in mortar preparation", so charcoal can be centuries older than the mortar it was burned for. Technicians preferred wood and charcoal, with reed and straw also collected.'
      editorInference: GEO-C576 says the pyramid's dating rests on 'wood fragments found on the ground rather than in masonry' and 'no direct dating'. The project's own account describes a programme of radiocarbon dates on organics from the monuments whose interpretation turns on charcoal burned for mortar — i.e. organics in masonry contexts — and concludes the Great Pyramid falls in the historical era. This undermines the claim's characterisation, though the page does not itemise per-sample contexts, and the wide scatter and 374-year offset it reports are genuine complications (in the direction of older, not younger). The 'no direct dating of the limestone' clause is untouched — radiocarbon dates organics, not carbonate. My inference.
      exactLocator: Sections 'Previous estimates', '1984', '1994-1995', 'Comparison 1984/1995', 'The old-wood problem' (webpage, no pagination)
      limitations:
        - Secondary summary; Bonani et al. 2001 not retrieved; sample-by-sample provenance not shown.
        - AERA is an interested party in the conventional chronology.
        - Reported offsets and scatter are themselves unresolved by the page.
      reviewState: ai_extracted
      origin:
