    - id: VASO-R009
      title: "Locate the phentolamine trigger-point study: does sympathetic blockade quiet the nidus?"
      summary: "The essay states that later work from the Hubbard–Gevirtz lineage infused trigger-point sites with phentolamine, an alpha-adrenergic antagonist, and substantially quieted the spontaneous EMG activity. The report's works list did not carry this item and no candidate was resolved. Desk route: search the needle-EMG trigger-point literature of the 1990s (Hubbard, Gevirtz, McNulty, Banks and co-authors; journals of pain, psychophysiology, and physical medicine) for a sympathetic-blockade study, retrieve the primary paper, and record the design, n, control condition, and effect. A sympathetic-dependence result would be the strongest existing link between the electrical nidus and autonomic maintenance."
      claimIds:
        - VASO-C002
        - VASO-C003
        - VASO-C020
      track: either
      effortTier: desk
      informationGain: A retrieved primary study showing phentolamine quiets trigger-point EMG would support autonomic maintenance of the nidus (bearing on VASO-C002/C003) and supply the pharmacological arm of VASO-R004, though it would not by itself distinguish vascular smooth-muscle latching from sympathetically driven intrafusal or endplate activity. Failure to locate any such study would show the essay's autonomic-maintenance argument rests on stress-induction alone.
