rationale: "This is an inbox intake of the founder's own essay (already SRC-JHONG-2026 / VASO-IN002), and the report itself states the footing: supplier's words, discovery material, records only from the works it names. The item does not carry the 'THIS DOCUMENT IS THE LEDGER'S SOURCE' marker, so I have not catalogued the essay's propositions as claims here; if the founder wants that done, the marker is the route. Of the works named, two resolved to DOIs and both are already ledger records. Only Hubbard & Berkoff 1993 returned text (abstract only), which confirms the record is the right work and confirms the observation behind VASO-E001. The abstract also states two things the ledger does not yet carry — higher spontaneous-EMG amplitude in tension-headache and fibromyalgia patients than in normals, and the authors' own attribution of the nidus to sympathetically activated intrafusal (spindle) contractions — so I add two claims and three evidence records from that text, the latter being an autonomic-but-skeletal generator that competes with the vascular version of VASO-C020. Hai & Murphy returned HTTP 403 and is a duplicate anyway. Every other named work is dispositioned; most repeat the prior pass's dispositions, and the newly listed items (fibromyalgia-era community tender-point counts, radical-remission interviews, brown fat, Piezo, sham surgery, wound-healing studies) are handled fresh. The one new item that bears on a ledger claim is the community tender-point-count literature, which is a proto-census for VASO-C001; it is blocked pending a primary paper and gets a desk research item. A url correction is proposed for SRC-HUBBARD-BERKOFF-1993 since the report reached its text at the DOI. No edition change: nothing here alters the telling."
