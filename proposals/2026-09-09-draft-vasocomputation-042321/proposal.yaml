  research:
    - id: VASO-R013
      title: "FDG-PET overlaid on elastography at palpated knots: is the stiff, electrically active spot metabolically cold?"
      summary: "Small overlay study: palpate and mark knots under blinded examiners, confirm stiffness by shear-wave elastography and spontaneous activity by needle EMG at a subset, then acquire FDG-PET and compare uptake at knot sites with matched non-tender muscle. The latch account predicts uptake at or below surrounding muscle; an energy-crisis (maximally contracting fibers) or inflammatory account predicts elevated uptake. Radiation limits this to a single small study, not a census."
      claimIds:
        - VASO-C058
        - VASO-C020
      track: small_grant
      effortTier: lab
      informationGain: Cold knots would be the first finding that does not fit conventional lesion taxonomies and would specifically favour a low-energy holding state over active contraction or inflammation; hot knots would fit the energy-crisis or inflammatory accounts and remove the essay's distinctive metabolic prediction. Either result moves VASO-C020 in a way no imaging of stiffness or flow can.
      origin:
        ref: report 2026-09-09-inbox-vasocomputation-031907
        extractedBy: claude-fable-5-1
        runId: 2026-09-09-draft-vasocomputation-042321
        date: 2026-09-09
    - id: VASO-R014
      title: Retrieve the primaries behind the newly catalogued affective and adverse-effect claims (Britton; Leknes & Tracey; Moseley/Flor)
      summary: "Desk retrieval: the peer-reviewed meditation adverse-effects study from Britton's Brown program (for VASO-C133), Leknes & Tracey's review of the shared neurobiology of pain and pleasure (for VASO-C128/C130's pain-offset reading), and a primary Moseley or Flor paper on somatosensory cortical reorganization in chronic pain (for VASO-C106). Each is named only in the essay; nothing can be anchored to them until their text is read."
      claimIds:
        - VASO-C069
        - VASO-C064
        - VASO-C066
        - VASO-C043
        - VASO-C068
      track: publication_prize
      effortTier: desk
      informationGain: Replaces essay-only anchors with primary sources for five claims, and tells the case whether the affective phenomenology of release (bliss, immobility, destabilization) has any instrumented literature behind it or rests wholly on testimony.
      origin:
        ref: report 2026-09-09-inbox-vasocomputation-031907
        extractedBy: claude-fable-5-1
        runId: 2026-09-09-draft-vasocomputation-042321
        date: 2026-09-09
