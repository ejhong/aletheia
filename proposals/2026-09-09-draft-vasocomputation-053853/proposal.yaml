  research:
    - id: VASO-R015
      title: "Map the staples: blinded coincidence of palpated tender points with pencil-Doppler perforators against chance"
      summary: One blinded examiner marks tender points on a region of scalp, neck, back or hip; a second blinded operator maps cutaneous perforators on the same region by continuous-wave pencil Doppler at fixed light pressure; a third computes spatial coincidence against a chance baseline from randomized point sets. Settles whether ordinary knots sit on perforators (VASO-C101) and whether the most tender sit on the largest trunks; a null returns the vascular hypothesis to the intramuscular compartment or dissolves it.
      claimIds:
        - VASO-C096
        - VASO-C123
        - VASO-C128
        - VASO-C131
      track: small_grant
      effortTier: field
      informationGain: A cheap, afternoon-scale test that either licenses or kills the perforator alternative before any imaging is bought; a positive coincidence above chance would be the first objective anatomical identity for a palpated knot.
      origin:
        ref: report 2026-09-09-inbox-vasocomputation-053800
        extractedBy: claude-fable-5-1
        runId: 2026-09-09-draft-vasocomputation-053853
        date: 2026-09-09
    - id: VASO-R016
      title: "Film a star: laser speckle over a superficial knot with exhale, inhale-hold, sham-site and CO2 controls"
      summary: "Laser speckle contrast imaging over the occiput or upper trapezius during breath-assisted release; mark a knot and a sham site, record respiration, end-tidal CO2, surface EMG and a button press at each felt release; apply calibrated pressure on exhale and, in matched trials, during an inhale-and-hold. Preregistered predictions: local perfusion flash time-locked to exhale and button, absent at sham and under inhale-hold (perforator account); versus global changes tracking CO2 (hyperventilation account)."
      claimIds:
        - VASO-C099
        - VASO-C100
        - VASO-C130
        - VASO-C145
        - VASO-C004
        - VASO-C073
      track: small_grant
      effortTier: lab
      informationGain: Directly discriminates the perforator, hyperventilation and no-local-event accounts of the felt release at the surface, where no depth problem exists, and tests the blood-first ordering with a non-contact method.
      origin:
        ref: report 2026-09-09-inbox-vasocomputation-053800
        extractedBy: claude-fable-5-1
