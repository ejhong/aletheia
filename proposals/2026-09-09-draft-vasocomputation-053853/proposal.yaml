    - id: VASO-R017
      title: "Free a collar without breath: ultrasound-guided saline hydrodissection at a mapped perforator under a tender point"
      summary: In a clinic already performing nerve hydrodissection, place a few milliliters of saline around a Doppler-mapped perforator at its fascial ring beneath a blinded-examiner tender point, with no breath instruction and no manual pressure; record tenderness (algometry), the felt star, and elastography before and after; sham injection adjacent to the bundle as control.
      claimIds:
        - VASO-C129
        - VASO-C096
        - VASO-C039
      track: small_grant
      effortTier: lab
      informationGain: "The cleanest single test of the collared-perforator identification: release without breath refutes the two-key necessity (VASO-C039) and supports VASO-C101; no effect leaves the knot with motor guarding or another account."
