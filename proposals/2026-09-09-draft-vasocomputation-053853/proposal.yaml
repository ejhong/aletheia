    - id: VASO-R018
      title: The knot-free endpoint as a natural experiment, with a sensory exam to exclude a damaged finder
      summary: Recruit practitioners who report having completed the release process; blinded examiner, standardized sites, pressure algometry, light-touch and pinprick sensory exam, Doppler perforator map, elastography, against age-matched controls. A blinded finding of no tender points in a middle-aged adult with normal sensation and normally perfused perforators supports VASO-C124; reduced sensation with constricted perforators supports the hypoesthesia confound VASO-C125.
      claimIds:
        - VASO-C119
        - VASO-C120
        - VASO-C001
      track: either
      effortTier: field
      informationGain: Cheap and decisive for the endpoint prediction, and it cannot be gamed by expectation because the sensory exam separates 'no knots' from 'no finder'.
