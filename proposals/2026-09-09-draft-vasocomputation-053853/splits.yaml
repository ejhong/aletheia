03d25f1c1e728a151145cdb0962b4ab6f2bc8948f30c79921f012fe4d1015027:
  - The passage states, as the alternative ('other road') hypothesis, that the sparks felt as stars at release may be hyperventilation paresthesias — hyperventilation produces exactly the sparks called stars.
  - The passage states that if the sparks are hyperventilation, the perfusion changes are global rather than local to the knot.
  - The passage states that if the sparks are hyperventilation, the perfusion changes are equal at sham sites.
  - The passage states that if the sparks are hyperventilation, the perfusion changes track carbon dioxide rather than the button press marking the felt release.
da0931bf5709361174a2e07dd466f34bf2c1b5c06f05e749bb15c15a3789c8a0:
  - Felt releases migrate upstream along a perforator tree toward its root. (True if the sequence of felt release sites in a session tracks the perforator tree's branching order toward its feeding trunk.)
  - Felt releases queue at the trunk's fascial entry, the root of the tree. (True if, after a session's releases converge, the site where releases accumulate and are replaced by others is the trunk perforator's fascial exit — on the posterior scalp, the occipital artery's entry at the superior nuchal line.)
  - Release runs upstream because a dilation that begins at a branch propagates along the arteriole wall toward the feeding vessel at millimeters to centimeters per second (conducted vasodilation). (True if a felt traveling release is accompanied by a perfusion wave ascending the tree at that speed.)
  - Release runs upstream because a downstream vessel cannot stay open while the trunk feeding it is shut, so cleared areas come back until something upstream is also cleared. (True if locally cleared knots recur until the upstream trunk perforator is released.)
d3560afdeb221e915263308f870ae165cc7da54820081b19d603fad7b11c08d9:
  - The cutaneous perforator bed does not need an economical hold (latch) to keep a knot held.
  - Ordinary sympathetic firing keeps skin vessels constricted all day, at a cost the body plainly pays.
  - The perforator bed is tonically sympathetic and breath-gated on a seconds timescale by established physiology.
  - The thesis can drop the latch as a requirement and keep it as an option, losing the metabolic-cold-spot prediction as a necessary signature.
  - What the perforator bed does need is history dependence, which the skin's vessels have — cold-induced constriction outlasts the cold.
33be6badb3c53c7419a86f53a8893531923d053360eeaa5b20fc2ffcec10568c:
  - Once enough staples in a region (the roots included) are released, the load shifts onto the remaining tethers, which fail in sequence under ordinary body loads — every head turn and every breath — until the separation reaches the bony anchors.
  - Below the threshold, staples can be released one at a time and the sheet stays put; above it, the sheet must find a new configuration.
  - Once the sheet phase is triggered, nothing the person does can call it off; rest and compression do not stop it but reduce the load that drives it, the pain of each tether going, and the time to re-bond.
  - The sheet phase begins at a threshold of cleared knots regardless of technique, not because the technique changed.
3170adcc01ac96f1076562410ba52208425146109472dc74b852698ded0335c3:
  - Gas pockets in tissue migrate upward against gravity.
  - Fluid pockets in tissue move downward with gravity.
  - Folds in a sheet do not respond to gravity (they are indifferent to head position).
  - What a hollow does when the head goes down tells you which of the three (gas, fluid, or fold) you are feeling.
c7f5d31b82b1bd8d6f070952d9d7223d50ccd41a13951f520048b7494f1a7a4d:
  - Prolonged manipulation can leave the skin's nerves hypoesthetic. (True if the passage states that prolonged manipulation can reduce sensation in the skin's nerves.)
  - When the skin's nerves are hypoesthetic, tenderness is not reported even where a perforator is still stuck. (True if the passage states that a damaged finder fails to report tenderness at still-stuck perforators.)
  - The 'damaged finder' state is marked by reduced sensation, uniformly raised pain thresholds, and perforators still constricted on Doppler but silent to the roller. (True if the passage lists these as the signature of the damaged-finder state.)
  - The true knot-free state is marked by normal light-touch and pinprick sensation over the worked regions, normal pressure-pain thresholds, and perforators present on Doppler with normal flow and no tenderness. (True if the passage lists these as the signature of the true knot-free state.)
  - The two states — true knot-free and damaged finder — separate cleanly. (True if the passage states that these two states are cleanly distinguishable by the listed measures.)
90d95aca24b1a5c61b31f728505a8abcc17901c474bf46af9b8d3a454a29cdb2:
  - Langevin and Yandow (2002) found that eighty percent of acupuncture points lie on connective-tissue planes between and within muscles.
  - Langevin and Yandow (2002) found that half of the meridians lie on connective-tissue planes between and within muscles.
7395633c8364ec1dd71c7192b1e16129ed0656bed857c3176a0801d5a27127db:
  - The Neijing describes the jing jin (sinew channels) as twelve superficial pathways of muscle and connective tissue, distinct from the main channels.
  - The defining feature of each sinew channel in the text is that it 'knots' (the character jie, to bind or tie) at specific places along its course.
  - "The places where the sinew channels knot are bony prominences: the occiput, the mastoid, the cheekbone, the shoulder, the hip, the knee, the heel."
  - The Bladder sinew channel knots at the back of the head.
9a3eb88c4558aa6f623cf8c13082c1f5ae4da76eeca9e98b7e7b35aebbb01804:
  - Propagated sensation along a channel travels along the meridian's course at roughly one to ten centimeters per second, far too slow for nerve conduction.
  - Propagated sensation along a channel can be halted by pressing on the line or cooling it.
  - Propagated sensation along a channel is accompanied by a reported rise in skin temperature along the path.
95edf085ea8a4498f78029c2966641399aa593246c087297785a8d1c06ed398f:
  - The superficial fascia is richly innervated (Fede et al. 2022).
  - About a third of the nerve fibers of the superficial fascia are autonomic (Fede et al. 2022).
  - The autonomic nerve fibers of the superficial fascia are concentrated around its vessels (Fede et al. 2022).
13cae2053022676b9f5ced1d8b0087464e2bddfd6f22012fdd679bac93484087:
  - A single dry-needling stimulus in the trapezius raised blood flow at the needled site for fifteen minutes (Cagnie et al. 2012).
  - A single dry-needling stimulus in the trapezius raised oxygen saturation at the needled site for fifteen minutes (Cagnie et al. 2012).
  - The dry-needling stimulus did not change blood flow or oxygen saturation at distant sites (Cagnie et al. 2012).
  - The Cagnie et al. 2012 dry-needling study was conducted in healthy volunteers, so the effect is a needle effect rather than a knot effect.
f46b7c7755615a7b7b670a19955ebd4d52da290c3282d53a6d68791bf0a40dc4:
  - Cutaneous microvascular function declines with age.
  - Resting sympathetic tone rises with age.
  - Knots accumulate with age.
  - The age curves for knot burden and cutaneous microvascular decline have never been laid on top of each other.
2362caab85a220a7bbed3eecf60f91d7381f629365c45364e31dbc7560bab284:
  - Sikdar et al. (2009) used gray-scale ultrasound, vibration sonoelastography, and Doppler to image trigger points in the upper trapezius.
  - Sikdar et al. (2009) found trigger points in the upper trapezius to appear as discrete hypoechoic nodules on ultrasound.
  - Sikdar et al. (2009) found trigger points in the upper trapezius to be stiffer than the surrounding tissue.
  - Sikdar et al. (2009) found abnormal flow around trigger points in the upper trapezius.
41eb6b2d332a479033c733d8a66bfa3a7710dd1d99534d5bb67c42c206c9f6f0:
  - The second family of reported phenomena (separating, hollowing, filling, chains, mazes, air) unfolds over hours and days. (True if practitioner event logs show these phenomena developing on a timescale of hours to days rather than seconds.)
  - The second family of reported phenomena does not respond to rolling at all. (True if practitioner event logs show no change in these phenomena time-locked to rolling sessions.)
03ebee376481cd1c72c18c44c0f0102db8e7e78b8f2cabf62d59c1f5d4df5522:
  - "What holds a knot, on the perforator picture, is a composite of three memory elements rather than one: the vessel's tone, the hyaluronan collar, and the sheet's tether."
  - "The three elements act at three distinct timescales: vessel tone in seconds (neural), the hyaluronan collar in minutes to hours (chemical), and the sheet's tether in days to weeks (mechanical)."
  - Each of the three elements has hysteresis — each stays where it was put after the input that put it there has gone.
  - The three elements are nested, and the outer two (collar and tether) are made of connective tissue.
  - "Together the three make a hold that is cheap, durable, and reversible in a specific order: the vessel opens, then the collar de-gels, then the tether releases."
