caseAssessment:
  verdict: contradicted
  loadBearing: [CCC-C010, CCC-C002, CCC-C004, CCC-C003, CCC-C001]
  weakestLinks: [CCC-C006, CCC-C503, CCC-C505]
  synthesis: >-
    The featured hypothesis is that concentric low-variance circles and compact
    raised-temperature spots in the CMB are conformal imprints of black-hole
    encounters and evaporations from a previous aeon. The observational rung
    splits cleanly. Independent groups (Wehus & Eriksen, Moss/Scott/Zibin,
    Hajian, DeAbreu et al., Bielewicz et al., Bodnia et al.) all reproduce the
    circle-like and spot-like features when they apply the published search
    procedures, so the maps do contain the structures the proponents named
    (CCC-C001). The anomaly claims fail once the null is constructed properly.
    Gurzadyan & Penrose computed significance against pure-Gaussian-plus-noise
    skies; every reanalysis that draws simulations from the full ΛCDM angular
    power spectrum finds the same features at ordinary abundance (CCC-C002,
    CCC-C003). For Hawking points the 99.98% figure collapses to ~87% (~1σ)
    after marginalizing the ring-size choice that was fixed post-inspection
    (Jow & Scott), a purpose-built detector validated on synthetic CCC signals
    finds no significant population (López et al.), and few-pixel temperature
    outliers manufacture concentric low-variance families under the original
    criterion (Bodnia et al.). Standard inflationary ΛCDM plus a-posteriori
    search effects therefore fully accounts for the reported signatures
    (CCC-C010). The methodological pattern is itself established: no search on
    either side used a preregistered or blind protocol (CCC-C011, study table).
    Mechanism costs reinforce the negative case without needing the sky.
    Mass fade-out is required and admitted unconventional with no accepted
    particle-physics implementation (CCC-C005). The entropy reset via
    information loss is contested by a published quantum-entropy argument
    (Eckstein). Erebon dark-matter particles remain a qualitative proposal;
    the only quantitative gravitational-wave calculation places both direct
    and memory-effect backgrounds tens of orders below LIGO reach, and the
    correlated-noise premise Penrose invoked was not reproduced after
    maximum-likelihood waveform subtraction. The theory’s priority (2006
    before the 2010 searches) and the still-unreplicated sky-twist ellipticity
    preference are real but do not rehabilitate significance once the null
    and look-elsewhere corrections are applied. Sensitivity is highest to the
    Bodnia et al. artifact diagnosis and the Jow & Scott marginalization; even
    without either single record the remaining independent ΛCDM-null
    reanalyses still render the anomaly and previous-aeon attribution claims
    untenable. The case verdict is therefore contradicted: the features are
    real outputs of the searches, but they are not anomalous under the
    cosmology the rest of the data support, and they do not constitute
    evidence for an aeon before ours.
  steelman: >-
    The sky-twist test’s reported collapse of concentric low-variance sets
    under mild ellipticity, and the extreme anisotropy of concentric-triple
    centres (≈83% of 1134 centres inside three patches covering ≈3% of searched
    sky), have never been re-run by an independent group against an
    ellipse-specific ΛCDM null or against skies whose ℓ≤7 multipoles are
    conditioned to the observed values; a proponent can still point to those
    two structural regularities as unexplained by the published critical
    simulations.
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    confidence: high
    reasoning: >-
      The claim requires the circles and Hawking points to be both real and
      statistically incompatible with a standard sky, then attributes them to
      previous-aeon black-hole activity. Multiple independent reanalyses
      reproduce the features yet find them typical under ΛCDM-spectrum nulls,
      and look-elsewhere plus few-pixel artifact corrections remove the
      headline significances. Strongest opposing consideration is the still-
      unreplicated sky-twist ellipticity preference and centre anisotropy,
      which do not restore a previous-aeon detection once the null is fixed.
  - claimId: CCC-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Wehus & Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu et al., Jow & Scott,
      López et al., Bodnia et al. and Bielewicz et al. converge on the same
      conclusion: the reported signatures appear at expected rates in proper
      ΛCDM simulations, and a-posteriori choices (null ensemble, ring size,
      thresholds) generated the apparent excesses. Strongest opposing
      consideration is that the sky-twist and centre-clustering tests have not
      been closed with identical independent protocols, leaving minor residual
      open items that do not overturn the overall accounting.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: >-
      Five-plus independent groups using ΛCDM angular-power-spectrum
      simulations find the low-variance concentric families unremarkable;
      Bodnia et al. further show few-pixel spots manufacture the families under
      the original criterion. The founding 6σ used an inadequate pure-Gaussian-
      plus-noise null. Strongest opposing consideration remains the proponents’
      assertion that ΛCDM simulations are the wrong standard because most of
      the CMB is “not random,” which is a methodological preference rather than
      a demonstrated excess under the cosmology fitted by the same maps.
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: >-
      After marginalizing the post-selected ring size, the 99.98% excess falls
      to ~87% (~1σ); a detector validated at 95% retrieval on synthetic Hawking
      points finds no significant population; maximum-resolution searches with
      artifact screening find none. Cross-instrument co-location only shows the
      spots are on the shared sky, expected under any sky-feature hypothesis
      including ΛCDM. Strongest opposing consideration is the residual ~1σ and
      the 2025 mass–temperature relation fragment, neither of which restores
      the original confidence level.
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: >-
      Every independent reanalysis that applied the published search procedure
      reproduces the annular low-variance directions and concentric sets in
      WMAP and Planck maps. The dispute is exclusively about whether those
      real outputs of the procedure are anomalous, not about whether the
      procedure returns them. Strongest opposing consideration is none of
      substance; the existence claim is common ground.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: >-
      Primary sources on both sides state the discrepancy in nearly identical
      terms: Gurzadyan & Penrose simulated pure Gaussian plus instrument noise;
      the critical groups simulated full ΛCDM-spectrum skies. That
      methodological fork, not disagreement about the map pixels, produces the
      significance gap. Strongest opposing consideration is the further claim
      that concentric families cannot be random even under ΛCDM, which is an
      assertion rather than a quantified result against the proper ensemble.
  - claimId: CCC-C011
    verdict: established
    confidence: high
    reasoning: >-
      The study table across twelve searches (2010–2024) and the primary papers
      themselves show that statistic, size window, mask, thresholds and null
      were chosen after data inspection on every side; the sole CCC-derived
      signal fragment appears only in a 2025 unrefereed preprint unused by any
      search. Strongest opposing consideration is that some later critical
      works froze proponent parameters (e.g. DeAbreu), which is still not
      prospective preregistration of a joint protocol.
  - claimId: CCC-C503
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Gurzadyan & Penrose 2013 did report a sharp drop in concentric-set
      prevalence under a sky-twist ellipticity deformation and a radius cutoff
      near 15–20°. No independent group has re-run the identical test against
      an ellipse-specific ΛCDM expectation, so the structural claim stands as
      an unreplicated proponent result rather than a confirmed anomaly.
      Strongest opposing consideration is Bodnia’s demonstration that
      few-pixel artifacts generate concentric families, which could couple to
      the ellipticity comparison in unassessed ways.
  - claimId: CCC-C504
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      An et al. 2020 report the 83%-of-1134-centres-in-~3%-of-sky figure from
      their concentric-triple search; the number is a factual output of that
      pipeline. Bielewicz et al. already linked analogous clustering of low-
      variance rings to large-angular-scale (low-ℓ) features, offering a
      conventional mechanism that has not yet been tested on the exact An et
      al. statistic with conditioned simulations. Strongest opposing
      consideration is therefore that the anisotropy may be another face of
      the known low-ℓ anomalies rather than previous-aeon superclusters.
  - claimId: CCC-C501
    verdict: established
    confidence: high
    reasoning: >-
      Meissner, Nurowski & Ruszczycki 2013 did publish a 99.7% confidence claim
      for ring-type structures relative to artificial maps of the same harmonic
      content; the claim statement is a correct report of that paper. Weight
      toward physical anomaly is limited by group proximity to the CCC program
      and by the same post-hoc statistic issues that affect the broader
      exchange. Strongest opposing consideration is that “same harmonic
      content” comparisons do not settle the ΛCDM-null dispute.
  - claimId: CCC-C509
    verdict: well_supported
    confidence: high
    reasoning: >-
      Jow & Scott measure mean nearest-neighbour separations of the 30 most
      significant Hawking points at the claimed scales and find them within 1σ
      of the Gaussian-sky expectation (0.20 ± 0.03 rad) from 100 simulations.
      The result directly tests and rejects a clustering signature that
      proponents had suggested would support CCC. Strongest opposing
      consideration is the modest simulation count and restriction to the top
      30 points, which still leaves the null result intact at the reported
      precision.
  - claimId: CCC-C523
    verdict: well_supported
    confidence: high
    reasoning: >-
      Bielewicz, Wandelt & Banday show that the large-radius low-variance
      deficit is removed when ℓ ≤ 7 multipoles in the simulations are replaced
      by the data’s best-fit values, tracing the effect to the known anomalous
      low-order multipoles rather than to a new population of rings. Strongest
      opposing consideration is that the low-ℓ anomalies themselves remain
      incompletely explained, so the claim relocates rather than dissolves the
      large-scale oddity.
  - claimId: CCC-C524
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The same Bielewicz analysis finds that low-variance rings cluster in a
      few large sky regions and interprets that pattern as the imprint of
      large-angular-scale CMB features, not of randomly scattered sources.
      This supplies a conventional mechanism for the kind of centre
      concentration later quantified by An et al. Strongest opposing
      consideration is that the statistic and dataset differ from the 2020
      concentric-triple count, so the link is mechanistic analogy rather than
      a direct numerical refutation of the 83%-in-3% figure.
  - claimId: CCC-C005
    verdict: established
    confidence: high
    reasoning: >-
      Penrose’s own 2018 Foundations of Physics paper states that strict CCC
      requires asymptotic mass fade-out and calls it “an admittedly
      unconventional hypothesis”; Tod’s open-problems list treats a concrete
      implementation as unsolved. No accepted particle-physics mechanism is
      supplied in the record. Strongest opposing consideration is the de
      Sitter-group remark that mass is not a Casimir operator when Λ > 0,
      which is a motivational observation, not a derived fade-out dynamics.
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Penrose’s entropy accounting via black-hole information loss plus
      conformal rescaling is the theory’s stated solution to the low-entropy
      initial state; Eckstein 2023 argues that the same information loss
      increases global entropy and undermines the needed renormalisation,
      proposing a unitary variant instead. Tod leaves related issues open.
      Strongest opposing consideration is that the information-loss debate in
      quantum gravity remains unsettled, so neither side’s entropy ledger is
      decisive in isolation.
  - claimId: CCC-C007
    verdict: established
    confidence: high
    reasoning: >-
      Penrose 2018 explicitly introduces Planck-mass, gravitationally
      interacting erebons created at crossover, decaying within an aeon, as
      CCC’s dark-matter candidate and potential LIGO-band impulsive source.
      The claim is a correct description of the theory’s content. Strongest
      opposing consideration is the extreme vagueness of lifetime and spectrum
      (“perhaps,” “or thereabouts”) and Allen’s result that the GW yield under
      the stated emission channel is undetectable, which qualifies the
      laboratory prediction without erasing the theoretical proposal.
  - claimId: CCC-C008
    verdict: established
    confidence: high
    reasoning: >-
      Penrose states flatly that “there is no inflation in CCC” and attributes
      near scale-invariance of CMB fluctuations to erebon decay in the previous
      aeon’s exponential expansion. The claim accurately records the theory’s
      commitment. Strongest opposing consideration is the absence of a derived
      perturbation spectrum from erebon decay (Tod lists it as open) and
      Planck’s precision fit to simple slow-roll inflation, which CCC must
      eventually match or replace.
  - claimId: CCC-C505
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Penrose 2017 did propose that reported LIGO inter-detector noise
      correlations at the gravitational-wave time lag could be erebon-decay
      impulses; that much is documentary fact. The empirical premise was not
      reproduced after maximum-likelihood waveform subtraction (Nielsen et
      al.), and Allen’s calculation places both direct and memory-effect
      backgrounds many orders below detectability under the stated channel.
      Strongest opposing consideration is residual debate over residual
      correlations in broader event sets, which still supplies no positive
      erebon detection.
  - claimId: CCC-C519
    verdict: established
    confidence: high
    reasoning: >-
      Allen 2020 derives Ω_GW(25 Hz) < 2 × 10⁻¹⁰³ for Planck-mass particles
      with lifetime exceeding the Hubble time decaying to two gravitons,
      approximately 95 orders below the LIGO O1+O2 stochastic limit; the claim
      simply restates that calculation. Strongest opposing consideration is
      that the result assumes a homogeneous cosmological population and a
      two-massless-particle channel, so a radically different emission geometry
      could in principle change the number, but no such alternative is
      calculated in the record.