caseAssessment:
  verdict: unresolved
  loadBearing: [DEEP-C002, DEEP-C026, DEEP-C035, DEEP-C057, DEEP-C027, DEEP-C038, DEEP-C037]
  weakestLinks: [DEEP-C009, DEEP-C015, DEEP-C031, DEEP-C054, DEEP-C037, DEEP-C057]
  synthesis: >-
    The ledger as supplied cannot adjudicate the founding question, and the honest verdict
    is unresolved — not as a hedge, but because of a structural fact about the evidence base.
    Every one of the twelve evidence records draws on a single source, SRC-JHONG-2026, which
    the source file itself marks unverified and explicitly classifies as founder-supplied
    hypothesis material whose statements about objects, dates and statistics are secondary
    reports of unaudited experiments. No primary excavation report, wear-trace study,
    toponymic source, catalogue dataset or run log has been retrieved. Of the twenty-four
    claims assessed, sixteen have no evidence record attached at all; the eight that do are
    supported only at "weak" strength by the author's own summaries of his own studies, and
    three of those records carry second-reader objections that they qualify rather than
    support the claim they are filed against. That means the quantitative spine of the case —
    55% bird-persons, 37% cosmic serpents, 62.5%-versus-9% civiliser lineups, 263 coded flood
    summaries, regional clustering — is presently uncheckable in either direction.
    Steelmanning the shared-past reading: the lineup asymmetry, if it replicates on primary
    passages, is a real signal that the resemblance proponents point to is not pure apophenia,
    and the catalogue's own limitation (broad narrative classes are not specific pose-plus-object
    bundles) means the widespread-motif finding does not price the tight iconographic
    conjunctions that motivate the case. Steelmanning the deflationary reading: the case's own
    method claims — that historical meaning requires dates, contexts and differences (C002),
    that distribution alone cannot separate invention from ancient transmission (C026), that
    similarity cannot license claims about a source's identity, date and capabilities (C035) —
    are close to analytic and are the best-supported propositions in the ledger, and the pilot
    findings that AI judges disagree and that kind-matched controls flip lineup outcomes
    undercut the measurement instrument the pro-resemblance case would need. The methodological
    scaffolding is sound; the empirical case, in either direction, is not yet in evidence here.
  steelman: >-
    The V1 civiliser lineup's 62.5%-versus-9% first-rank gap remains unexplained by any
    deflationary mechanism in this ledger: if compressed modern retelling alone manufactured
    the similarity, random hero narratives drawn from the same retelling ecosystem should have
    scored far above 9%. The catalogue result cannot rebut it, because the site's own limitation
    concedes that broad motif classes do not measure the frequency of specific pose-plus-object-
    plus-arrangement bundles — precisely the conjunctions (bird-headed figure beside three
    handled forms) the hypothesis rests on. No record here tests that conjunction rate, and the
    blinded human replication (DEEP-R003) that would settle it has not been run.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached; the verdict leans on general archaeological and
      art-historical priors, which I flag explicitly. As stated the claim is close to
      analytic: a resemblance is compatible with descent, contact, convergence and modern
      retelling alike, so assigning one history requires chronological and contextual data.
      The strongest opposing consideration is that the "true if" condition is unfalsifiably
      strong — a resemblance so arbitrary and detailed that no independent origin is credible
      might warrant a provisional explanation on resemblance alone.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supports this claim: DEEP-E018 and DEEP-E019 are both filed as
      qualifiers and merely report the author's cautions about uneven catalogue coverage and
      about broad classes not matching specific images. The assertion that the three-class
      bundle does not stand out against documentation-preserving comparisons is a result of an
      unretrieved, unaudited analysis. Opposing consideration: the claim is plausible on priors,
      since documentation-preserving nulls typically absorb such co-occurrences, but plausibility
      is not the same as a checked result.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 report the 62.5% and 9% figures, but both are weak self-reports
      by the study's author with run data not retrieved, and the claim's own truth condition
      requires the run data to reproduce the rates. The phrase "completed lineups" implies
      unenumerated incomplete runs, an obvious selection channel. The strongest opposing
      consideration is that the site's own stated limitation — that V1 used compressed modern
      retellings — means even a faithful figure may measure retelling convergence rather than
      similarity of the original accounts.
  - claimId: DEEP-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record bears on this; the verdict rests on general philological and folkloristic
      priors about translation, missionary transmission and comparativist paraphrase homogenising
      narratives, which I flag as prior-driven. The mechanism is well attested in principle and
      the claim is modest ("can"). Opposing consideration: the ledger contains no documented
      before/after pair demonstrating convergence relative to earlier attested versions, which is
      exactly what the claim's truth condition demands.
  - claimId: DEEP-C035
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is a claim about underdetermination and is nearly analytic: identity, date and
      capabilities of a putative source are not entailed by any degree of resemblance among
      derived motifs, since the same resemblance is produced by contact, convergence or later
      retelling. No evidence record is needed for the logic, and none is supplied. The strongest
      opposing consideration is that resemblance can bound a source's date and capability
      indirectly when combined with dating — but that concedes the claim, which is that
      similarity alone cannot.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As qualified by "under stated models," this is a standard identification problem:
      a broad motif's geography is compatible with deep inheritance and with repeated
      independent invention. No evidence record is attached, so the verdict is prior-driven.
      The strongest opposing consideration is real: phylogeographic and spatial-autocorrelation
      methods can sometimes discriminate the two, so the absolute form of "cannot" is defensible
      only for bare distributions with no model of transmission rate or documentation bias.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only attached records, DEEP-E018 and DEEP-E019, are qualifiers noting uneven coverage
      and category breadth; the supporting figures come indirectly via DEEP-E013/E016 (55% and
      37%), themselves weak self-reports, and nothing in the ledger quantifies the sacred-centre
      class at all. "Widespread" is also undefined here. Opposing consideration: broad classes
      like birds and serpents being widespread is antecedently very likely, so the claim is
      probably true even though this ledger has not shown it.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 state the 55%-of-926 figure but are self-reports of an unaudited
      experiment whose coded data and method page were not retrieved, and the claim's truth
      condition is precisely that the coded data reproduce the proportion. DEEP-E015 and
      DEEP-E018/E019 qualify the figure's reach without denying it. The strongest opposing
      consideration is definitional: a "broad bird-person class" liberally coded could yield
      almost any high figure, so the number is only as meaningful as unretrieved coding rules.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 reports the 37% figure and DEEP-E017 scopes it to the selected category and
      dataset; both are weak author self-reports with data not in hand. As with the bird-person
      figure, the claim asks whether the coded data reproduce the proportion, which no record
      here checks. Opposing consideration: the denominator and coding frame are unstated in the
      ledger, and DEEP-E018's coverage caveat bears directly on whether 37% is a stable estimate.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is attached; the verdict rests on iconographic priors — Assyrian
      bird-headed apkallu, feather-costumed dancers, and shamanic transformation imagery are
      conventionally treated as distinct concepts. The claim is a category-hygiene point and its
      truth condition (that the compared images fall into different categories) is prima facie
      met by the case's own gallery. The strongest opposing consideration is that emic categories
      may not respect this etic tripartition: a single tradition can treat costume, hybridity and
      transformation as one idea, which would blunt the claim's force.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record supports this; it rests on the widely reported art-historical reading
      that the dorsal birdman reliefs on Hoa Hakananai'a postdate the moai and belong to the
      later birdman cult, which I flag as a prior rather than a ledger finding. The claim is
      chronologically consequential, since late addition weakens any Rapa Nui–Old World link.
      Opposing consideration: relative carving sequence on this statue is inferred from
      superposition and style, not absolute dating, and the ledger contains no primary record
      of that inference.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached; the claim is a near-analytic methodological point that
      similar silhouettes can serve unrelated functions and identical functions can take
      different shapes. It is also the least contestable of the handled-object claims. Opposing
      consideration: shape and function are not fully independent — an arched handle constrains
      the space of plausible uses — so "separate questions" should be read as "not mutually
      entailing" rather than "unconnected."
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is filed for this claim; the verdict leans on standard Assyriological
      priors, in which the banduddû bucket and mullilu sprinkler appear together in purification
      ritual texts and match the apkallu's depicted attributes. That convergence of text and image
      is the kind of mechanism-plus-context argument the case's own method claims privilege.
      The strongest opposing consideration is that the ledger has retrieved no ritual text,
      lexicon entry or excavation publication, so the identification here is entirely
      prior-driven and could be overstated in strength by the founder's page.
  - claimId: DEEP-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached, but the claim is a negative one about the state of
      publication and is consistent with priors: the Göbekli excavation team has published
      descriptive rather than functional readings of the arched forms on Pillar 43, and the
      research agenda (DEEP-R001) treats the primaries as still unretrieved. Opposing
      consideration: absence in the ledger is not absence in the literature — a secure
      functional identification could exist in the Tepe Telegrams or excavation reports that
      no one here has read, which would falsify the claim as stated.
  - claimId: DEEP-C009
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only attached record, DEEP-E023, is explicitly downgraded to context: it establishes
      that the founder's page cites Vidale & Micheli, not what that study reports, and the
      second reader flags exactly this gap. The claim's truth condition names the published
      wear-trace study, which is unretrieved and reported as blocked. Opposing consideration:
      handle wear from suspension is a mundane and mechanically plausible finding, so the claim
      may well be true; but on this ledger nothing distinguishes it from a secondary paraphrase
      of an unread paper.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached; the verdict rests on the manifest heterogeneity of the four
      cases — a modern Turkish toponym, a Greek cult object attested in antiquity, a
      seventeenth-century Spanish-language gloss by Garcilaso, and a Rapanui phrase recorded by
      outsiders in the nineteenth century. On priors these plainly differ in language, date of
      first record and builder usage, which is all the claim asserts. The strongest opposing
      consideration is that the specific attestation dates and builder-usage status are exactly
      what DEEP-R002 has yet to check, and one of the four could turn out to be early and emic.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      The one nearby record, DEEP-E024, concerns the Kurdish "wish hill" gloss, and its own
      second reader notes it is at best irrelevant to the Turkish name's meaning; no record
      documents the Turkish toponym as descriptive of the mound's form rather than a sacred
      designation. The claim's truth condition requires documentation that the ledger does not
      contain. Opposing consideration: "göbekli" transparently means "bellied/pot-bellied" in
      Turkish, which makes a descriptive reading likely on linguistic priors — but the claim also
      asserts the absence of sacred designation, which is unchecked.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached; the mechanism is materially plausible on priors, since
      subtractive stone carving makes free-standing limbs fragile and keeping arms against the
      torso reduces breakage and undercutting. The claim is deliberately modest — a plausible
      contributor, not the explanation. The strongest opposing consideration is that many stone
      traditions do carve projecting or separated limbs, and the pose also appears in soft media
      and in unrelated poses on the same monuments, so material constraint may be doing little
      of the work in any given case.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record supports this; the identification of Berossus's Oannes with the
      fish-cloaked apkallu (the kulullû/fish-cloaked sage iconography associated with Ea) is
      mainstream in Assyriology and rests on convergent textual and iconographic grounds, which
      I flag as a prior. Opposing consideration: Berossus writes in Greek in the Hellenistic
      period, and the correspondence is a modern scholarly reconstruction across a large
      chronological gap, so "corresponds to" may smooth over real differences between the
      Hellenistic literary figure and the first-millennium ritual figure.
  - claimId: DEEP-C028
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached; on priors the claim is strong, since Tiwanaku left no
      decipherable texts and the Gate of the Sun staff-bearer's naming as Viracocha derives from
      colonial-era Andean sources retrojected by later scholars rather than from any pre-modern
      identification of that specific relief. The claim is important because it removes a named
      civiliser link from the pre-contact record. Opposing consideration: the truth condition is
      a universal negative about pre-modern sources, which no record here has surveyed, and
      colonial chroniclers did associate Tiwanaku with Viracocha traditions generally.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger addresses the flood text-coding pilot at all; the 263
      summaries, the coding scheme and the clustering measure are unretrieved, and the claim's
      truth condition explicitly requires the pilot's coded data. Nothing here permits a verdict
      in either direction. Opposing consideration: regional clustering of narrative details is
      antecedently likely for reasons of language, contact and the compilers' own regional
      sourcing, so the claim is plausible — but plausibility under an unstated measure is not
      support.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      As with the clustering claim, no evidence record bears on it; "uneven distribution of
      details associated with Genesis" is an unaudited self-report whose Genesis-detail list,
      coding rules and unevenness criterion are all absent from the ledger. The claim is
      potentially discriminating — patchy Genesis-specific details alongside generic motifs
      would point to missionary diffusion rather than deep inheritance — which makes the missing
      data consequential. Opposing consideration: the summaries themselves may be
      mission-mediated, so unevenness could be an artefact of the corpus rather than of the
      traditions.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 states directly that matching the kinds of objects changed the lineup result,
      which is on point, but it is a weak self-report with pilot data unretrieved and with the
      page itself noting incomplete runs and cropping. The finding is methodologically important
      because it implies earlier lineup outcomes partly tracked object category rather than
      motif resemblance. Opposing consideration: "changed the result" is unquantified — a
      direction and magnitude are needed before it can bear weight either for or against the
      resemblance case.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record substantiates this: DEEP-E022 is the only pilot record and its second
      reader explicitly notes the quoted line says nothing about inter-judge agreement, so the
      claim's truth condition — low agreement statistics — is untouched by the ledger. General
      priors about the instability of vision-model similarity judgements make the claim credible,
      which I flag as prior-driven. Opposing consideration: the claim is load-bearing in the
      deflationary direction, so leaving it unresolved is not a neutral outcome; it means the
      case cannot yet rely on AI-judge unreliability either.