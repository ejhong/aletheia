  synthesis: >-
    The featured hypothesis is assessed here as the proposition that the distant
    iconographic and narrative resemblances collectively preserve a shared past,
    whether through common inheritance or long-distance transmission, rather
    than merely showing that broad motifs recur. The evidence records do not
    resolve that proposition. The strongest positive item is the self-reported
    civiliser lineup result: DEEP-E020 and DEEP-E021 say claimed partners ranked
    first in 62.5% of completed lineups versus 9% for random pairs. If reproduced
    under blind, source-level, well-matched controls, that contrast would show
    that the selected accounts share more recognizable structure than arbitrary
    narratives. The catalogue reports also place broad bird-person and
    cosmic-serpent classes in 55% and 37% of sampled traditions. Those reports
    establish, weakly, that the proposed pattern is not based on isolated
    examples.

    The opposing case is structurally stronger but still incomplete. The
    catalogue frequencies concern broad categories, and DEEP-E018 and
    DEEP-E019 warn that coverage is uneven and that broad narrative categories
    are not the specific images or names at issue. High prevalence can make
    isolated resemblance less diagnostic, but it does not itself distinguish
    convergence from ancient transmission. The potentially important claim
    that the three-motif bundle fails to stand out against
    documentation-preserving comparisons, DEEP-C057, has no evidence record
    supplying the comparison, statistic, or underlying data. Likewise, the
    asserted regional clustering and uneven Genesis-associated distribution of
    flood details have no supporting records. The image-control result in
    DEEP-E022 weakly shows that matching object kinds changed a lineup outcome,
    highlighting control sensitivity, but the pilot data are absent. No
    evidence record supplies securely linked chronologies, archaeological
    contact routes, inherited fine-grained motif complexes, textual
    genealogies, or a mechanism connecting the distant cases.

    Methodologically, resemblance alone cannot determine a transmitting
    source's identity, date, or capabilities, and broad geographical
    distributions can fit more than one history. Those points prevent the
    current similarities from establishing a shared-past account, but they do
    not contradict one. A genuine inherited pattern could survive all of these
    cautions if detailed, independently coded features clustered beyond
    appropriate null expectations and followed plausible historical pathways.
    Conversely, common motif classes, retelling, material constraints, and
    control sensitivity could generate much of the apparent pattern without a
    common source. The appropriate verdict is therefore unresolved rather than
    weakly supported or contradicted.

    The single evidence record whose removal would most change the balance is
    DEEP-E020, because it supplies the only target-side numerical result that
    appears to discriminate selected civiliser pairings from controls. Removing
    it would leave the 9% random baseline without the claimed-partner rate and
    would weaken the positive steelman. The unresolved verdict survives its
    removal because that result is already unaudited and no independent
    discriminating evidence replaces it.
  steelman: >-
    The ledger does not test the strongest transmission prediction: whether a
    preregistered bundle of fine-grained iconographic and narrative features,
    coded from securely dated primary materials, co-occurs across the distant
    traditions far more often than documentation bias, independent invention,
    and known borrowing models predict, while also following chronologically
    possible contact or inheritance pathways.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim expresses a sound historical-inference principle: resemblance
      is not sufficient to choose among inheritance, contact, convergence, and
      later reinterpretation without chronological and contextual information.
      No evidence record directly tests this proposition, so the verdict leans
      on general methodological background and logical underdetermination rather
      than ledger evidence. The strongest opposing consideration is that an
      exceptionally complex resemblance can carry historical likelihood even
      before every contextual datum is available.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue through uneven coverage and
      the difference between broad categories and specific motifs, but neither
      provides the documentation-preserving comparison or its result. The
      underlying data, null construction, and test statistic are absent, so the
      stated non-standout result cannot be checked. The strongest opposing
      consideration is that the limitation records clearly refer to an actual
      catalogue study, but that indirect context does not establish its central
      result.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the two claimed rates, so they
      provide weak support for the claim as a description of the experiment.
      Both records derive from the same self-report, while the run data,
      denominator, incomplete-run count, passages, and control construction
      were not retrieved. The strongest opposing consideration is the large
      reported contrast between 62.5% and 9%, which would be consequential if
      independently reproduced.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Translation, borrowing, and comparative rewriting are plausible
      mechanisms by which retellings can converge, so the claim is consistent
      with general scientific and historical background. No evidence record
      supplies the documented before-and-after retellings required by the
      claim's stated truth condition, making this verdict prior-dependent. The
      strongest opposing consideration is that translation can also preserve or
      expose differences rather than systematically increasing similarity.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Similarity by itself does not logically identify a source, date that
      source, or demonstrate its capabilities because multiple causal histories
      can produce resemblance. This verdict rests chiefly on the claim's
      inferential structure rather than an empirical evidence record. The
      strongest opposing consideration is that a sufficiently distinctive,
      multi-part resemblance can strongly favor transmission, but even that
      would not by itself establish all three additional particulars.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A geographical distribution of a broadly defined motif is generally
      underdetermined between diffusion and repeated invention unless auxiliary
      chronological, genealogical, or mechanistic constraints are added. The
      ledger provides no explicit competing models, so this verdict relies on
      general model-identifiability reasoning rather than a direct evidence
      record. The strongest opposing consideration is that some distributions
      can become strongly diagnostic when their fine structure is highly
      improbable under an independently specified convergence model.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      DEEP-E018 and DEEP-E019 discuss uneven coverage and category breadth, but
      no evidence record reports frequencies for all three classes or defines
      the threshold for “widespread.” The bird-person and cosmic-serpent
      self-reports bear on two individual classes, while no corresponding
      sacred-centre result is provided. The strongest opposing consideration is
      that the reported 55% and 37% figures do make widespread occurrence
      plausible for two of the three classes.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 directly self-report that 55% of 926 sampled
      traditions received the broad bird-person classification. DEEP-E015,
      DEEP-E018, and DEEP-E019 limit interpretation through category breadth and
      uneven coverage, while the coded catalogue needed to reproduce the
      arithmetic is absent. The strongest opposing consideration is that the
      two direct reports agree exactly on both numerator context and percentage,
      although they are not independent sources.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 directly reports a 37% frequency for the broad cosmic-serpent
      class. DEEP-E017 through DEEP-E019 restrict the result to the selected
      category and unevenly covered dataset, and neither coding records nor
      calculations are available. The strongest opposing consideration is that
      these limitations affect generalizability more directly than they affect
      whether the site's own coded data yielded the stated percentage.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      Bird-headed deities, feather-wearing people, and transformations are
      conceptually distinguishable, but no evidence record identifies the
      compared images or demonstrates that they occupy different categories.
      The claim's explicit truth condition therefore remains unmet in the
      ledger. The strongest opposing consideration is that the three
      descriptions are semantically distinct on their face, making the
      interpretive warning plausible even without object-level evidence.
  - claimId: DEEP-C059
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record provides stratigraphic, stylistic, technical, or
      documentary grounds for dating the birdman carvings later than Hoa
      Hakananai'a's manufacture. The source anchor states the sequence, but
      source anchors are not evidence records under this assessment. The
      strongest opposing consideration is that secondary descriptions may
      consistently recognize separate carving phases, but none has been entered
      as evidence here.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically separate properties: similarly shaped
      objects can serve different purposes, and one function can be realized by
      different shapes. This is a conceptual distinction and does not require
      the compared handled objects to have known functions. The strongest
      opposing consideration is that shape often constrains and predicts
      function, but correlation does not collapse the two questions into one.
  - claimId: DEEP-C044
