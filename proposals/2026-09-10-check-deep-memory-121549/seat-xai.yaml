  synthesis: >-
    The ledger's evidence base is extremely thin and almost entirely self-referential: every record derives from the founder's own webpage (SRC-JHONG-2026), which reports unaudited experiments, secondary captions, and methodological cautions without primary data, run logs, or independent sources in hand. This forces any case-level verdict to rest on two strata. First, a cluster of methodological claims (C002, C026, C034, C035, C018, C065) that correctly insist resemblance is not historical evidence by itself; these are calibrated by ordinary standards of comparative archaeology and mythology rather than by positive ledger measurements, and they stand unopposed. Second, the page's own catalogue and pilot results, reported at weak strength and repeatedly qualified by uneven coverage, incomplete runs, and scope limits (E013–E022, E018–E019). Those results show broad bird-person and cosmic-serpent classes as common (55 % and 37 %), the three-motif bundle failing to stand out against documentation-preserving controls, regional clustering in flood summaries, and AI judges both disagreeing and shifting rankings once object kinds are matched. Taken together they undercut any strong claim that the specific resemblances (bird-men, handled forms, navel names, civilisers, feathered serpents) travel as a coherent deep-time package. At the same time the civiliser lineup self-report (62.5 % vs 9 %) and the persistent visual parallels that opened the case remain unexplained by the same data, leaving room for limited contact, very old diffusion of generic templates, or convergent symbolic solutions. Because the ledger contains no primary excavation reports, wear studies, lexical first-attestations, or blinded human replications, the positive transmission hypothesis cannot be confirmed and the pure independent-invention null cannot be sealed either. The balance is therefore mixed: methodological filters are well placed and the bundle test is negative, yet several motif-level and narrative-level similarities survive as open empirical residue. Stronger verdicts in either direction would require the primaries listed in the research agenda; until they arrive the case correctly stays mixed rather than unresolved or weakly_supported.
  steelman: >-
    The V1 civiliser lineup still yields a 62.5 % first-rank rate for claimed partners against 9 % for random pairs, an above-chance signal that the assessment treats only as a weak self-report and does not dissolve by reference to retelling or generic hero templates.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      No evidence record directly tests the claim, yet it restates a foundational principle of historical and archaeological inference: resemblance without chronology, context, difference and pathway is not explanatory. General scientific background supplies the calibration; nothing in the ledger contradicts it. The strongest opposing consideration would be a demonstrated case in which pure visual likeness alone compelled a unique historical source, but no such case appears.
  - claimId: DEEP-C057
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      E018 and E019 quote the page's own catalogue experiment stating that the three-motif bundle does not stand out against documentation-preserving comparisons, while noting uneven coverage. The result is only a self-report, so the verdict remains provisional. The strongest opposing consideration is that broader or differently coded catalogues might still recover a distinctive co-occurrence once Near Eastern and Rapa Nui gaps are filled.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E020 and E021 report the 62.5 % versus 9 % first-rank rates from the V1 lineup, but both are self-reports of incomplete AI runs whose data are not retrieved. The numerical contrast is the only positive signal; its fragility keeps support weak. The strongest opposing consideration is that compressed modern retellings, rather than the original passages, may have manufactured the elevated rate.
  - claimId: DEEP-C034
    verdict: established
    confidence: high
    reasoning: >-
      No ledger evidence directly documents convergent retellings, yet the claim is a well-attested mechanism in textual criticism and comparative mythology: translation, borrowing and encyclopedic comparison routinely increase surface similarity. Background knowledge of manuscript traditions calibrates the verdict. The strongest opposing consideration would be a demonstration that all attested flood or civiliser variants diverge rather than converge under those processes, which the ledger does not supply.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      The claim is definitional for any lost-civilisation hypothesis: identity, date and capabilities of a source require evidence beyond motif likeness. No record in the ledger offers such additional evidence, and the methodological point stands. The strongest opposing consideration is the possibility that a sufficiently dense and specific cluster of resemblances could itself become diagnostic, but the catalogue results (E018–E019) show no such cluster.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      Geographic ubiquity of a broad class is compatible with both independent invention and deep transmission under standard models; the claim simply records that incompatibility of inference. E016–E019 illustrate the point for serpents without resolving it. The strongest opposing consideration would be a phylogenetic or dating method that uniquely favours one history, absent from the ledger.
  - claimId: DEEP-C056
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      E018 and E019, together with the frequency reports for the component classes, state that the three broad motifs are each widespread in the sampled catalogue. Uneven coverage is acknowledged, so support stays provisional. The strongest opposing consideration is that “widespread” may be an artefact of the 2016 catalogue’s sampling frame rather than a true global baseline.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E013 and E014 quote the 55 % figure; E015, E018 and E019 immediately qualify it as a broad-class baseline with uneven coverage and no pose-level resolution. Pure self-report without data or methods yields only weak support. The strongest opposing consideration is that a cleaned or expanded catalogue could shift the proportion substantially.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E016 states the 37 % cosmic-serpent frequency; E017–E019 qualify scope and coverage. Again only a self-report is present. The strongest opposing consideration is identical to that for the bird-person figure: catalogue artefacts may inflate or deflate the rate.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No direct evidence record addresses the three-way distinction, yet the claim is an ordinary taxonomic caution in iconography: bird-headed deity, feathered person and transformative hybrid are separable. Background knowledge of comparative religion calibrates it. The strongest opposing consideration is that some cultures may intentionally fuse the three, rendering the split artificial for those cases.
  - claimId: DEEP-C059
