    confidence: low
    reasoning: >-
      No evidence record in the ledger speaks to the relative dating of the Hoa Hakananai’a statue body versus its dorsal birdman carvings. The claim remains open pending primary conservation or stylistic reports. The strongest opposing consideration is the founder’s caption asserting later addition, which is unbacked here.
  - claimId: DEEP-C065
