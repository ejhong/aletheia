caseAssessment:
  verdict: provisionally_supported
  loadBearing: [AMZ-C016, AMZ-C017, AMZ-C003, AMZ-C011, AMZ-C010, AMZ-C013]
  weakestLinks: [AMZ-C017, AMZ-C005, AMZ-C037, AMZ-C015]
  synthesis: >-
    The case as framed by the ledger has two separable components, and they do not
    stand equally. The first — that pre-Columbian Amazonia was a strongly
    heterogeneous human landscape, with engineered, densely occupied corridors and
    hotspots embedded in a much more lightly used forest matrix — is well supported
    and, unusually, supported from both directions by independent method families.
    Positive: LiDAR earthwork counts in the southwest (AMZ-E001), an 1,800 km arc of
    fortified southern-rim villages dated AD 1250–1500 (AMZ-E004), Casarabe drainage
    canals, farm ponds and ubiquitous maize phytoliths (AMZ-E014), landscape-scale
    fishery infrastructure and 17,000+ fish remains at an interfluvial mound
    (AMZ-E022), and dark-earth settlement systems at Santarém and Marajó occupied
    into the colonial period (AMZ-E017, AMZ-E018). Negative: 7,363 sites with river
    distance as the dominant predictor (AMZ-E010), a fourteen-region phytolith and
    charcoal synthesis finding little intensive-use signal in most sampled terra
    firme (AMZ-E011), and machine-learning extents described by their own authors as
    "limited, albeit impressive". Both signals are biased — site databases toward
    accessible rivers, soil cores toward a tiny sampled volume (AMZ-C021) — but the
    biases run in opposite directions, and the mosaic reading survives both.
    The second component is the case's actual founding question: that Carvajal
    described a real world on the middle Amazon which was subsequently emptied. Here
    the ledger is thinner than the first component's strength suggests. The
    corroboration on Carvajal's own reaches is documentary (Nunes 1538, ten Ursúa
    accounts, AMZ-E007), not archaeological; the spectacular archaeology is either
    a millennium too early (Aquiry peak AD 100–300, explicitly flagged in AMZ-E003),
    ends ~140 years before Orellana (Casarabe, AMZ-E037), or lies off-route (southern
    rim, Llanos de Mojos). Contact-horizon continuity is demonstrated at Santarém,
    Marajó and the Upper Xingu — none of them the Machiparo or Omágua provinces at
    issue. The collapse mechanism is real and quantified, but only for upper-Amazon
    provinces with mission records (AMZ-E008); its extension downriver is
    extrapolation, and Newson's own "fade out" and flight findings show collapse was
    interactive rather than a uniform wave. Meanwhile every population number in the
    ledger — Aquiry, southern rim, Upper Xingu, Denevan's basin totals — is exposed
    as a family of shared modelling assumptions rather than independent measurement,
    a point the ledger makes honestly against its own headline (AMZ-E002, AMZ-E009).
    Steelmanning the sceptic: nothing here archaeologically demonstrates a 1542
    population on the Solimões, and the account's extreme figures survive in only one
    manuscript branch. Steelmanning the proponent: the sceptic must explain why three
    mutually hostile sixteenth-century sources independently report the same mundane
    features on the same reaches, and why detection failure is not the simpler
    explanation for the archaeological silence. Provisionally supported is the
    warranted verdict: the environment-cannot-support-it argument is dead, the mosaic
    is established, and Carvajal's qualitative picture is plausible and partly
    corroborated — but the specific corridor claim remains untested by the direct
    method (AMZ-R001) that would settle it.
  steelman: >-
    Bush et al. 2025 at Upano shows that a long forest-recovery interval "largely
    eradicated the influence of Pre-Columbian occupations" from the ecological record
    while the later Colonial signal persisted in the very same profiles. That is a
    documented, time-graded erasure mechanism operating precisely against the
    detection of late pre-contact populations. No evidence record in this ledger
    calibrates how much occupation the phytolith, charcoal, and pollen proxies would
    miss for a population that vanished around 1550–1650 on alluvial, frequently
    reworked floodplain terrain — the exact taphonomic setting of Carvajal's
    riverbank villages. A proponent can therefore say that the negative interfluvial
    and terra-firme record (AMZ-C014, AMZ-C020) has never been shown capable of
    detecting the thing it is being used to rule out, and that the ledger contains no
    single excavation program on the Machiparo–Omágua reaches that has looked and
    failed to find. Absence of a contact-horizon signal there is currently absence of
    fieldwork, not absence of people, and my verdict downgrades the corridor claim on
    a silence whose informativeness is unmeasured.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      The content of the chronicle is not seriously in dispute; both Denevan's
      manuscript comparison and Lopes et al.'s verbatim quotations attest the
      populous-settlement, food-store, road, and ceramic descriptions, and the claim
      is careful to include the reported empty stretches. The strongest opposing
      consideration is that the primary text is marked unverified in the source
      ledger, so the claim rests wholly on two secondary witnesses to its content —
      but those witnesses are independent of each other and quote directly.
      Nothing here bears yet on whether the description is accurate.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E005 reproduces Denevan verbatim on the absence of the 50,000/10,000/8,000
      figures and the four-to-five-league villages from the Oviedo branch, with one
      mention of 5,000 warriors retained. This is a checkable textual fact and the
      quotation was verified against an OCR full text. The opposing consideration is
      that the collation rests on a single scholar's reading of the branches with no
      independent synoptic table in the ledger — precisely the gap AMZ-R002 proposes
      to close — so a passage-level surprise is possible though unlikely.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 verifies Nunes's 1538 entry into Machiparo, the ten Ursúa accounts,
      the "infinita" maize stores, and the Inca-like straight roads on the middle
      Solimões, and these are witnesses hostile to one another writing for different
      crowns. Two qualifications matter: "renowned ceramics" is not among the quoted
      verified elements, and the evidence record explicitly withdraws fortifications
      and organized warfare from the common set. Nunes survives only as a 1553/54
      letter through a modern edition, so its independence is documentary rather than
      archival-original. The core of the claim — dense settlement, food stores, roads,
      independently attested — holds.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 432 earthworks over 4,430 km of ALS lines, of which 396 were previously
      unknown, is a direct instrumental measurement and the deforested-block
      comparison (five times more than satellite imagery found) is an internal
      validity check. The 183,000 km² circumscription and the 24,000–30,000
      projection are, as the paper states, block extrapolations from sampled
      densities and inherit whatever the sampled lines misrepresent about the
      unsampled area. Confidence is held at moderate because the paper is weeks old
      at ledger creation, unreplicated and unrebutted, and its funding traces to the
      site's founder — a disclosure the ledger makes and I weight as a reason for
      caution, not dismissal.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is a claim about model sensitivity, and the paper's own text establishes
      it: 1.25–3 million follows from an assumed 25–60% simultaneous-use fraction
      and 300 people per earthwork, while the authors' single-family alternative
      yields 250,000–760,000. A roughly fivefold span across the authors' own stated
      assumptions is the honest error bar. The strongest opposing consideration is
      that the authors label the single-family reading "very unlikely", so quoting
      the span is an editorial emphasis rather than their conclusion — but that
      affects which end is plausible, not whether the estimate is model-sensitive.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      The AD 1250–1500 fortified-village horizon across an 1,800 km southern arc is
      quoted verbatim from the abstract, and the claim's second half — that the
      500,000–1,000,000 figure depends on contemporaneity, ethnographic conversion,
      and MaxEnt projection — is stated by the authors themselves in AMZ-E004. The
      opposing consideration is that "occupied by earth-building cultures" across an
      1,800 km stretch is itself a MaxEnt-assisted generalization from surveyed
      subregions; the dating horizon is firmer than the areal claim. Note this
      horizon is off Carvajal's route.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 gives converging lines: hydraulic infrastructure documented by remote
      sensing and field survey, plus 178 phytolith samples from 18 soil profiles
      showing ubiquitous maize. Convergence of an engineering signature with a
      biological one is stronger than either alone. The strongest opposing
      consideration is that "monoculture" and "intensive year-round" are inferences
      from the ubiquity and singularity of the maize signal rather than direct
      measures of cropping intensity, and phytolith dominance can reflect
      preservation and production differences among taxa.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Dark earths, raised fields, and forest islands are documented across several
      regions by multiple records in this ledger, and Levis et al. verifiably report
      that domesticated species abundance and richness rise on and around
      archaeological sites. The strongest opposing consideration is squarely present:
      McMichael et al.'s Technical Comment (AMZ-E013) argues that five centuries of
      post-Columbian activity likely played the larger role in the observed floristic
      pattern. That contest is unresolved in the ledger and it degrades the tree
      component specifically, not the soil and earthwork components.
  - claimId: AMZ-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Rodrigues et al.'s combined radiocarbon and OSL dating gives direct chronometric
      support for intermittent construction from AD 570–770, and Lombardo et al. 2011
      supplies the independent geomorphic argument that fields were built only where
      no alternatives existed. The opposing consideration is scope: the dating is
      specific to the Bermeo fields, other complexes may differ, and the interpretive
      leap from a few construction events to a general rejection of continuous
      cultivation is the authors' inference. It is a well-evidenced local result
      offered as a regional correction.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Newson's Table 1 figures were checked verbatim, and the claim reproduces both
      the magnitudes and the crucial qualifier that decline proceeded through mixed
      mechanisms — epidemics, slave raids, missionization, forced service, revolt,
      and flight. The unevenness (88% versus 62–64%) is itself part of the finding.
      The strongest opposing consideration, which the evidence record states, is that
      these are upper-Amazon provinces with mission documentation; the pre-contact
      baselines are themselves reconstructions, and neither the figures nor the
      mechanism mix can be assumed to transfer to the middle and lower Amazon.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Belterra and Cacoal components are strong: both date ranges were checked
      verbatim in peer-reviewed sources, and Cacoal explicitly attests Marajoara
      cultural permanence into the Portuguese settlement period. The Upper Xingu
      component is the weak leg — the 1770 terminus rests on a Science news feature
      (AMZ-E019), and the ledger's own note on Heckenberger 2008 states that the
      primary paper "gives no '1770' terminus". The claim as a conjunction is
      therefore true in its load-bearing parts but carries one element sourced to
      journalism pending primary reports.
  - claimId: AMZ-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Denevan's self-rejection of the habitat-density method is quoted verbatim and is
      as clean a demonstration as this literature offers that a widely cited total can
      outlive its own derivation; his continued endorsement of "at least 5 to 6
      million" on other grounds is included, which keeps the claim honest. The
      generalization to all basin-wide estimates being shared-assumption model
      families is broader than the single quote, but it is corroborated within this
      ledger by the explicit assumption disclosures in AMZ-C005, AMZ-C006, and
      AMZ-C037. The opposing consideration is that summed-radiocarbon and
      settlement-count approaches are at least partly methodologically independent of
      habitat-density scaling.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      The statement is a direct report of a quantified model result over 7,363 sites,
      with the 21.5% permutation importance figure verified against the published PDF.
      The strongest opposing consideration is one the evidence record names: site
      databases inherit survey-effort bias toward navigable, accessible, riverine
      terrain, which would inflate exactly this predictor. The result is best read as
      robust about the recorded record and only provisionally about the true
      distribution — but as stated, about 7,363 recorded sites, it is well supported.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The five-part negative finding is quoted almost verbatim from the synthesis, and
      negative results from a cumulative multi-region program are substantive
      evidence, not mere absence. Two considerations pull against it and are in the
      ledger: the Clement reply's charge that roughly 1.17 m³ of sediment from five
      small areas is standing in for two million km² (AMZ-C021), and Bush et al.'s
      Upano demonstration that forest recovery can largely erase a pre-Columbian
      signal (AMZ-C022). Prümers et al.'s "put to rest" rejoinder (AMZ-E030) is
      rhetorical and samples a different environment. The claim holds for what was
      sampled; its extrapolation is contested.
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The logistic fit and carrying-capacity reading are quoted accurately, and the
      authors' attribution of the terminal downturn to sampling bias compounded by
      post-European decline is their stated interpretation. But that attribution is
      the weakest part: it is an interpretive choice about a known SPD taphonomic
      artefact, not an independent test, and the ledger elsewhere hints at a competing
      picture — Bush et al. 2021 is titled for widespread reforestation *before*
      European influence, though only its supplementary methods were read here
      (AMZ-C039, AMZ-C040) so I cannot weigh its result. AMZ-R006 is the right test
      and it is unrun.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This synthesis is supported by convergence of method families that fail
      differently: earthwork LiDAR, fortified-village survey, engineered savannah
      agriculture, contact-era dark-earth settlement, a site-distribution model
      dominated by river distance, and a multi-region negative phytolith record. The
      qualitative shape — hotspots in a lighter matrix — is about as robust as this
      field currently permits. Confidence is moderate rather than high because the
      matrix density, the parameter that fixes how light "lightly occupied" is,
      remains unmeasured by any promise-blind sampling frame; both the positive and
      negative records in the ledger are acknowledged biased samples.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The second half — that the extreme numbers are textually unstable and should not
      be treated as counts — is close to established via AMZ-E005. The first half is
      weaker than the case's confidence suggests: the qualitative corroboration on
      Carvajal's own reaches is documentary (AMZ-E007), the archaeological support is
      either off-route, a millennium too early (AMZ-E003 dates the Aquiry peak to
      AD 100–300), or terminates before contact, and route identifications remain
      tentative in the literature. Denevan's bluff model (AMZ-E006) makes the
      alternating dense-and-empty pattern a testable prediction rather than a
      confirmation. The preregistered corridor comparison (AMZ-R001) has not been run.
  - claimId: AMZ-C018
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hancock's own site verifiably states the "seven chapters, more than 90 pages"
      figure, and the IMDb cast listing verifiably places Pärssinen and Ranzi in
      S2.E1 of the 2024 series. Both are checkable facts about publication and
      broadcast history. The weakness is that first-party self-description and a
      user-editable database are thin sourcing for page counts and framing, and the
      characterization "then-marginal" is an editorial judgement. As the evidence
      record itself states, this claim carries no weight for any empirical proposition
      about the Amazon.
  - claimId: AMZ-C019
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The V-shaped-structure fish-concentration function is quoted verbatim from
      Blatrix et al., and the zigzag weirs, straight causeways, and 382 ponds are
      attested in the source verification note. However, the specific quantitative
      element the claim leads with — that most of the 382 ponds lie within 35 metres
      of such a feature — appears in no quoted passage in the evidence ledger, so that
      spatial statistic is unverified here even though the qualitative system is well
      attested. The functional interpretation is also explicitly the authors'
      postulate ("we postulate"), not a demonstrated hydrological result.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      A count of more than 17,000 identified fish remains from a dated monumental
      mound is a direct zooarchaeological measurement, and the named dry-season taxa
      (lungfish, tiger-fish) supply the mechanism for year-round interfluvial
      exploitation rather than merely asserting it. The strongest opposing
      consideration, noted in the source record, is the paucity of larger-bodied river
      fish, implying limited exogenous input — which supports the interfluvial reading
      but also bounds how much this site tells us about riverine systems.
  - claimId: AMZ-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Both phrases are quoted from the published paper and verified via the PMC copy,
      and the claim is stated carefully as a machine-learning prediction rather than
      an observation. The essential qualification, which the claim's wording preserves,
      is that "other archaeological site types predicted to dominate more than
      two-thirds of Amazonia" is a model output trained on a survey-biased site
      inventory — it constrains the extent of earthworks and dark earths, not the
      extent of human presence, and should not be read as evidence of emptiness.
  - claimId: AMZ-C021
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is about the existence and content of a formal criticism, and the
      critical phrase — 1.17 m³ of sediment standing in "for the 2 000 000 km2 of
      western Amazonia" — was fetched and checked in the reply. That such a critique
      was published is established. The opposing consideration is that this is a
      polemical reply by interested parties in a live dispute, and sample volume alone
      is a crude adequacy metric: what matters is whether the cores were sited where
      the proxy could have detected occupation, which neither side settles here.
  - claimId: AMZ-C022
    verdict: well_supported
    confidence: high
    reasoning: >-
      The quoted sentence is verbatim from a peer-reviewed 2025 paper, and the
      internal contrast the claim preserves — Colonial signal persisting in the same
      profiles where the pre-Columbian one did not — is what makes it evidentially
      interesting rather than merely a null. The strongest opposing consideration is
      scope: this is one valley in the Andean foothills with a distinctive volcanic and
      taphonomic history, and generalizing its erasure rate to lowland terra firme or
      to alluvial floodplains would require calibration that no record here supplies.
  - claimId: AMZ-C027
    verdict: well_supported
    confidence: high
    reasoning: >-
      The AD 500–1400 range is quoted directly from the Prümers et al. abstract and
      rests on 144 radiocarbon dates, 94 of them from the two intensively dated sites.
      The authors' own caveats bound it: stratigraphic control comes from only four
      sites, 22 Chocolatelito dates could not be integrated, and two dates around
      AD 0–220 are flagged as anomalously early. The chronology's terminus is
      load-bearing for this case in a way the claim does not state — it places the
      Casarabe florescence roughly 140 years before Orellana, off the contact horizon.
  - claimId: AMZ-C037
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The figure is accurately attributed: Heckenberger et al. do estimate ≥50,000 at
      >2.5 persons/km², and note 25 calls it conservative. But as a demographic
      proposition rather than a report of an estimate, it is weak — only two clusters
      were surveyed, the ≥15-cluster regional total is extrapolated from centre
      spacing and indigenous knowledge, and the persons-per-settlement conversions are
      ethnographic analogies of exactly the family AMZ-C012 warns against. The
      ledger's own second reader disputes the direction of one supporting record.
      "Conservative" is an authorial characterization, not an error bound.
- id: AMZ-R008
  title: Contact-horizon test excavation on the Machiparo and Omágua reaches
  summary: >-
    Target the specific middle-Solimões reaches named in Carvajal, Nunes, and the
    Ursúa accounts with stratified test excavation and dating aimed at the AD
    1400–1650 window, paired with proxy-sensitivity controls calibrated on the Upano
    erasure result so that a null counts as evidence rather than as silence.
  claimIds: [AMZ-C003, AMZ-C017, AMZ-C016]
  track: small_grant
  effortTier: field
  informationGain: >-
    This is the one missing measurement on which the case's central verdict turns:
    every other line of evidence is either off-route or off-epoch.