    confidence: high
    reasoning: >-
      Prümers et al. (2022) established the chronological boundaries of the Casarabe culture in the Llanos de Mojos as spanning approximately AD 500 to 1400, based on extensive radiocarbon series from sites like Salvatierra and Mendoza. Opposing arguments noting two earlier outliers (AD 0–220) were acknowledged by the original authors as anomalous, leaving the AD 500–1400 range well confirmed.
  - claimId: AMZ-C037
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Heckenberger et al. (2008) explicitly estimated a regional pre-Columbian population of ≥50,000 (>2.5 persons/km²) for the Upper Xingu peer polity based on settlement sizing and ethnographic conversions. The opposing limitation is that this estimate requires extrapolating from two surveyed settlement clusters across more than a dozen unsurveyed clusters and assuming contemporaneity, which the authors acknowledge is an interpretive projection.