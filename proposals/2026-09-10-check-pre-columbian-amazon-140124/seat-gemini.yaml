    confidence: high
    reasoning: >-
      Bush et al. (2025) demonstrated in the Upano Valley that secondary forest regeneration over centuries effectively erased the paleobotanical footprint of dense pre-Columbian settlements, while subsequent colonial-era signatures remained visible. This provides a direct empirical mechanism explaining how dense past occupations can become invisible to standard botanical surveys. The opposing limitation is that this phenomenon has only been rigorously demonstrated in select highland-adjacent valleys.
  - claimId: AMZ-C027
