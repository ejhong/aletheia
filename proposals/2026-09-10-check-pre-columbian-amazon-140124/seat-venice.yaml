caseAssessment:
  verdict: provisionally_supported
  loadBearing: [AMZ-C003, AMZ-C010, AMZ-C011, AMZ-C016]
  weakestLinks: [AMZ-C015, AMZ-C037, AMZ-C018, AMZ-C008]
  synthesis: >-
    The evidence records support a specific structure: a strongly heterogeneous
    pre-Columbian Amazon in which dense, engineered, road-connected riverine and
    savanna societies existed, and in which catastrophic, uneven post-contact
    collapse is independently documented. The positive record is measurement-grade,
    not argumentative: LiDAR-documented earthworks at scale (AMZ-C004), fortified
    settlement systems dated to the contact horizon (AMZ-C006, AMZ-C011), maize
    monoculture and landscape-scale fisheries (AMZ-C007, AMZ-C019, AMZ-C026), and
    independent sixteenth-century witnesses — Nunes in 1538, ten Ursúa accounts in
    1560 — repeating Carvajal's mundane qualitative features for different crowns
    and rival expeditions (AMZ-C003). The collapse record (AMZ-C010) documents 62–88%
    regional declines by mixed mechanisms with dated mechanisms, not assertion.
    Against this, the sparse-Amazon record is equally real: river distance as the
    dominant occupation predictor (AMZ-C013), the fourteen-region phytolith synthesis
    (AMZ-C014), and model predictions that other site types dominate two-thirds of
    Amazonia (AMZ-C020). The case's honest center of gravity is therefore the mosaic,
    and the featured hypothesis — that Carvajal described a real world that died
    between visits — is supported in kind but not yet in degree: his extreme numbers
    are textually unstable (AMZ-C002), his route identifications tentative (AMZ-C024,
    in the agenda), and the direct corridor test (AMZ-R001) and province-level collapse
    reconstruction (AMZ-R005) remain unexecuted. The strongest opposing consideration
    to the emptied-Amazon reading is chronological: the grandest archaeology (Aquiry
    peak AD 100–300, Casarabe to AD 1400) predates Orellana by 140 years to a
    millennium, so early-dated grandeur cannot be spent as contact-era corroboration.
    Sensitivity: the verdict hangs most on AMZ-E007 (the Nunes/Ursúa corroboration).
    Remove it and AMZ-C003 fails, AMZ-C017 loses its only contact-era independent
    witness, and the case degrades from provisionally_supported to weakly_supported —
    the qualitative-credibility conclusion would rest on Carvajal's unverified text
    plus archaeology from other eras and regions. It does not flip to contradicted,
    because the collapse and settlement-continuity records stand independently.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is the convergent
    hostile-witness signature: Nunes entered Machiparo in 1538, four years before
    Orellana, and the ten Ursúa accounts of 1560 — expeditions with rival sponsors,
    no access to Carvajal's manuscript, and no motive to inflate another captain's
    discoveries — independently describe dense settlement, "infinite" maize stores,
    and Inca-like roads on the exact middle-Amazon reaches Carvajal named. Combined
    with Newson's documented 88% collapse in adjacent provinces by 1700 and the
    Belterra/Cacoal/Upper Xingu archaeology showing occupation terminating exactly
    at the European horizon, this is precisely the fingerprint "died between the
    visits" predicts. No evidence record in this ledger documents those same middle-Amazon
    reaches still densely occupied after 1600, and no record rebuts the witness
    convergence itself; the corridor test that could break it has not been run.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The textual content is anchored by two independently verified secondary sources
      (Denevan 1996; Lopes et al. 2024) quoting the populated and empty stretches. The
      primary manuscript itself was never fetched, and the ledger's own reliability
      note warns that the two branches differ materially, so any load rests on the
      branch-specified quotations. Strongest opposing consideration: an unverified
      primary text means a garbled transmission chain cannot be fully excluded.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      Denevan's comparison passage is verified verbatim against a fetched OCR copy and
      states the differential numeric content of the branches explicitly. The claim is
      about what the manuscripts contain, not about which is truer, so it is a
      documentable textual fact. The only caveat is OCR pagination, which does not
      touch the quoted content.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lopes et al. 2024 was fetched and the Nunes and Ursúa passages checked verbatim,
      including the correction pass that fixed a fabricated title while preserving the
      verified quotations. The claim's enumerated features (dense settlement, stores,
      roads, ceramics) are exactly the verified common elements. Strongest opposing
      consideration: Nunes survives only via Porro's modern edition of a 1553/54
      letter, so one of the two independent legs is twice-removed from the original.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 432-earthwork count and 183,000 km² delimitation are verbatim-verified
      measurements; the 24,000–30,000 figure is the paper's own block extrapolation,
      and the claim correctly frames it as a prediction. Strongest opposing
      consideration: the paper is weeks old with no peer-reviewed technical rebuttal
      yet, and its funding statement names this site's founder — absence of critique
      is not independent confirmation.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      The fivefold sensitivity span is quoted from the paper's own population-estimation
      section, including the authors' "very unlikely" characterization of the
      single-family alternative. The claim is a model-sensitivity statement, and the
      model itself supplies the counterevidence. Strongest opposing consideration:
      presenting the sensitivity prominently could read as rhetorical; the authors
      clearly favor the higher branch, and the honest midpoint is genuinely uncertain.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      De Souza et al. 2018 is verbatim-verified for both the 1,800 km fortified-village
      finding and the stated assumptions (contemporaneity, ethnographic formulae,
      MaxEnt projection) behind the 500,000–1,000,000 figure. The claim as stated
      flags its own model dependence, which the source confirms. Strongest opposing
      consideration: the dated window rests on sampled sites while the population
      rides on MaxEnt extrapolation over unsurveyed terrain.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lombardo et al. 2025's abstract, verified verbatim, documents drainage canals,
      farm ponds, and ubiquitous maize across 178 phytolith samples. Strongest
      opposing consideration: Casarabe florescence ends around AD 1400 (AMZ-C027), so
      this demonstrates intensive engineering capacity, not the world of 1542 — but
      the claim as stated makes no contact-era assertion.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Levis 2017's basin-wide concentration of domesticated species on archaeological
      sites is verified verbatim, and the raised-field/forest-island components have
      independent records in the ledger. The Technical Comment (AMZ-E013) is the
      strongest opposing consideration: post-Columbian land use may explain more of
      the floristic pattern, so the causal attribution "pre-Columbian engineering" for
      the tree signal is genuinely contested even though the spatial association stands.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Rodrigues 2015 verbatim-verified the intermittent-use dating from AD 570–770 and
      the few-construction-events reading; Lombardo 2011 independently supplies the
      flood-mitigation proposal. Strongest opposing consideration: the dating is
      Bermeo-specific and the paper itself notes other complexes may differ, so
      generalizing to all Mojos raised fields outruns the sampled evidence.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Newson's Table 1 figures and the mixed-mechanism passages were checked verbatim
      against the fetched article, and the claim carefully scopes itself as
      region-specific. Strongest opposing consideration: these are upper-Amazon
      mission-record provinces; extending the ratios to the middle/lower Amazon is an
      extrapolation the source does not license — which is exactly what AMZ-R005
      targets.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Belterra (Stenborg 2018) and Cacoal (Schaan 2000) are primary-anchored and
      verbatim-verified to the seventeenth century. The Upper Xingu leg to ca. 1770
      rests on a Science news feature held at secondary-source weight, and the ledger
      notes Heckenberger 2008 itself gives no 1770 terminus. Strongest opposing
      consideration: one of three legs of a compound claim is journalistically sourced,
      which caps confidence despite the other two being strong.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      Denevan's self-rejection passage is verbatim-verified and labeled decisive in the
      ledger; the coexistence of method-rejection with order-of-magnitude retention is
      quoted directly. The claim is a documented methodological fact about the estimate
      literature. No meaningful opposing consideration beyond the general point that
      one self-criticism does not indict all model families — which the claim does not
      assert.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      McMichael 2025's 7,363-site model and the 21.5% permutation importance for river
      distance are verbatim-verified, and the interfluve-sparser statement is quoted.
      Strongest opposing consideration, acknowledged in the record itself: site
      databases inherit survey-effort bias toward rivers, so the model partly
      re-encodes where people have looked. That the ledger explicitly forbids citing
      the paper for "distant forests were empty" is the right discipline.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The fourteen-region synthesis is verbatim-verified with honest limitations about
      spatial sparsity and proxy sensitivity. Strongest opposing consideration: Bush
      2025 (AMZ-C022, in this same ledger) shows forest recovery can largely erase the
      pre-Columbian signal while colonial signals persist — meaning an absence of
      phytolith evidence in terra firme is not straightforwardly evidence of absence,
      and Clement's sampling critique (AMZ-C021) compounds the worry. The claim as a
      report of findings stands; its silent inference to emptiness does not.
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The logistic-growth-to-carrying-capacity result and the authors' own attribution
      of the terminal decline to sampling bias plus collapse are verbatim-verified, and
      the claim correctly reports their attribution rather than endorsing it. Strongest
      opposing consideration: SPDs are proxies with stated biases, and the research
      agenda itself flags an unresolved proxy conflict with the Bush 2021 reforestation
      record (only its SI methods are in the ledger), so the aggregate trajectory is
      genuinely contested between proxies.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This synthesis claim depends on AMZ-C004, C006, C007, C011, C013, and C014, all
      of which independently assess well, and its two-sided structure (hotspots in a
      light matrix) is exactly what both the positive and negative records jointly
      show. Strongest opposing consideration: the matrix-density parameter — the
      mosaic's open variable — is currently measured only by biased samples from both
      directions, which is why AMZ-R003 exists; the heterogeneity pattern is supported,
      its precise proportions are not.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The qualitative half is supported by independent contact-era witnesses (AMZ-C003)
      and by Denevan's bluff model predicting precisely the populated-reach/empty-reach
      alternation Carvajal reports; the numeric instability is verbatim-documented
      (AMZ-C002). Strongest opposing consideration: the strongest archaeology in the
      ledger is either a millennium early (Aquiry AD 100–300) or in different regions
      (Mojos, southern rim), so "substantially credible" about the middle Amazon in
      1542 rests chiefly on textual convergence, and the direct corridor test
      (AMZ-R001) has not been run.
  - claimId: AMZ-C018
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hancock's first-party page and the IMDb cast listing are both fetched and
      verbatim-checked, establishing the advocacy genealogy as stated. Strongest
      opposing consideration: this is genealogy, not evidence — the record itself
      carries no weight for any empirical claim about the Amazon, and its inclusion in
      a case file risks guilt-by-association reasoning in either direction.
  - claimId: AMZ-C019
    verdict: well_supported
    confidence: high
    reasoning: >-
      Blatrix 2018's weirs, causeways, 382 ponds, and the fish-concentration function
      were fetched and checked verbatim. The functional interpretation is the authors'
      postulate, which the claim accurately reports as such. Strongest opposing
      consideration: the functional reading rests on spatial association and
      morphology rather than direct capture evidence, though the companion
      zooarchaeology (AMZ-C026) independently confirms year-round aquatic exploitation.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 17,000+ fish remains and the year-round interfluvial exploitation finding are
      verbatim-verified from the fetched PLOS ONE page, with dry-season species
      named. Strongest opposing consideration, from the paper's own caveat: the paucity
      of larger-bodied river fish suggests infrequent exogenous contributions, which
      bounds rather than breaks the year-round claim.
  - claimId: AMZ-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Walker 2023's "limited, albeit impressive" phrasing and the two-thirds dominance
      of other site types are verbatim-verified via the PMC copy. Strongest opposing
      consideration: this is a machine-learning prediction over known sites, inheriting
      the same discovery-bias problems as the site database it trains on, so it is a
      model output rather than a measurement of the matrix.
  - claimId: AMZ-C021
    verdict: established
    confidence: high
    reasoning: >-
      The Clement reply was fetched and the 300-core, 1.17 m³, five-area figures
      verified verbatim; the claim asserts only that the critique was made and is
      arithmetically framed, which the source fully supports. Strongest opposing
      consideration: a sampling-density critique shows a claim is underdetermined, not
      that its conclusion is false — thin sampling can miss real occupation or not,
      depending on signal strength.
  - claimId: AMZ-C022
    verdict: established
    confidence: high
    reasoning: >-
      Bush 2025 was fetched and the forest-recovery-erasure sentence verified verbatim,
      with the time-graded nuance (colonial signal persists) recorded. Strongest
      opposing consideration: the finding is Upano-Valley-specific, so its force is as
      a methodological warning against reading absence-of-signal as absence-of-people
      elsewhere, not as a general result — but the claim as stated is about the Upano.
  - claimId: AMZ-C027
    verdict: established
    confidence: high
    reasoning: >-
      The AD 500–1400 range is verbatim-verified from the open-access Prümers 2022
      abstract, backed by 144 radiocarbon dates. Strongest opposing consideration: the
      record notes stratigraphic control from only four sites and two anomalously early
      dates, so the endpoints carry more uncertainty than the rounded statement
      suggests — though nothing in the ledger challenges the range itself.
  - claimId: AMZ-C037
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The ≥50,000 estimate is verbatim-anchored to Heckenberger 2008 and is genuinely
      the authors' figure, stated as conservative. But the record's own limitations
      show only two clusters were surveyed, with the regional total extrapolated from
      spacing and indigenous knowledge via ethnographic conversion — the same
      assumption family the case flags for AMZ-C005 and AMZ-C006. Strongest opposing
      consideration: the second-reader dispute over whether note 25 supports or merely
      qualifies the figure shows the anchor's load-bearing text is thinner than the
      claim's phrasing, warranting a rung below well_supported.
