  synthesis: >-
    The ledger evidence overturns the twentieth-century ecological-impossibility premise and the pure-invention reading of Carvajal while simultaneously rejecting any basin-wide high-density civilization. Multiple independent measurement records document substantial, engineered, sedentary occupation along favored corridors and in specific hotspots into or near the contact horizon: southern-rim fortified villages dated cal AD 1250–1500 (E004), Belterra Plateau sites with dark earths, ponds and roads occupied from ca. AD 1300 into seventeenth-century colonization (E017), Marajó Cacoal permanence to AD 1650 (E018), and Upper Xingu layouts continuous with living Kuikuro villages into the eighteenth century (E019). Casarabe maize monoculture with drainage canals and farm ponds (E014) and landscape-scale fisheries with weirs and ponds (supported via related zooarchaeology E022) further demonstrate intensive landscape engineering capable of sustaining large local populations, even though the Casarabe florescence itself ends around AD 1400 (E037). River distance is the dominant predictor of occupation across 7,363 sites, with interfluves markedly sparser (E010); cumulative phytolith and charcoal sequences from fourteen regions show little to no annual-crop agriculture, forest clearing, anthropic soils or recurrent fire in most sampled terra-firme settings (E011). These positive and negative signals together establish the heterogeneous mosaic stated in AMZ-C016: dense, organized riverine and savanna corridors embedded in a lightly occupied forest matrix. Carvajal’s qualitative social geography—populous settlements, food stores, roads, multi-settlement territories alternating with empty stretches—is thereby rendered locally plausible (E006, E007) and is independently corroborated by Nunes (1538) and the Ursúa accounts (1560) on the same middle-Amazon reaches (E007). His extreme warrior and village-length figures, however, appear only in one manuscript branch and are textually unstable (E005), so they cannot be treated as census counts (AMZ-C002, AMZ-C017). Post-contact decline is documented as catastrophic yet uneven and multi-causal—epidemics, slave raids, missionization, forced service, revolt and flight—producing 88 % and 62–64 % drops in well-recorded upper-Amazon provinces by ca. 1700 (E008); summed radiocarbon distributions fit logistic growth to carrying capacity before colonization, with the terminal proxy decline attributed to sampling bias plus European-era collapse rather than a pre-contact endogenous crash (E020). Population headlines remain model-family constructs sharing untested contemporaneity and ethnographic-conversion assumptions (E002, E004, E009, E035); Denevan’s own rejection of the habitat-density method that generated his classic 5–6 million figure while still retaining the order of magnitude (E009) is the clearest illustration. The net result is neither pristine wilderness nor continuous metropolis, but a strongly patterned human Amazon whose riverine corridors matched the kind of world Carvajal described and that was subsequently emptied by the interactive colonial processes the documentary record captures. The open parameters are matrix density under promise-blind survey, the precise contact-horizon intensity along Carvajal’s named reaches, and the dependency structure of every published head-count; none of these gaps reverses the directional weight of the measurement and ethnohistoric records already in hand.
  steelman: >-
    No preregistered, high-resolution contact-horizon (AD 1400–1650) settlement-density map yet exists for the exact middle-Amazon probability corridors Carvajal named, so the qualitative match to independent accounts and the bluff-settlement model remains spatially untested at the scale of his day-to-day itinerary; a null result on that corridor test would leave the emptied-world reading without its strongest possible spatial confirmation.
claimAssessments:
  - claimId: AMZ-C001
    verdict: established
    confidence: high
    reasoning: >-
      The claim reports what the chronicle describes; E006 and the source anchors in Denevan 1996 and Lopes et al. 2024 confirm the qualitative features (populous settlements, stores, roads, ceramics, territories alternating with empty stretches). Strongest opposing consideration is manuscript-branch divergence on numbers, but the claim itself is qualitative and holds across branches.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      E005 quotes Denevan’s direct manuscript comparison: the 50 000 / 10 000 / 8 000 warrior figures and 4–5-league villages are absent from Oviedo and present only in Medina/Muñoz; Oviedo retains one figure of about 5 000. No contrary collation appears in the ledger.
  - claimId: AMZ-C003
    verdict: established
    confidence: high
    reasoning: >-
      E007 supplies independent sixteenth-century witnesses (Nunes 1538 via 1553/54 letter; ten Ursúa 1560 accounts) describing dense settlement, vast stores, straight roads and renowned ceramics on the same middle-Amazon reaches. Strongest opposing consideration is that fortifications and organized war fleets are not among the verified shared elements, yet the claim as stated does not require them.
  - claimId: AMZ-C004
    verdict: established
    confidence: high
    reasoning: >-
      E001 directly reports the 2024 LiDAR results: 432 earthworks (396 new) over 4 430 km, an Aquiry area of ~183 000 km², and the 24 000–30 000 extrapolation. E003 adds the AD 100–300 peak dating. The extrapolation is model-based, but the claim accurately states the paper’s figures.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      E002 quotes the paper’s own sensitivity: the 1.25–3 million headline rests on simultaneous-use fraction and ~300 persons per earthwork; the single-family alternative yields 250 000–600 000 (315 000–760 000 with canopy correction). The five-fold span is the authors’ own.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      E004 states the 1 800 km stretch of fortified villages ~cal AD 1250–1500 and the 500 000–1 000 000 estimate while explicitly listing the assumptions (contemporaneity, ethnographic formulae, MaxEnt extrapolation). Those assumptions are real limitations, yet the occupation and dating claims are measurement-grade.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      E014 reports phytolith evidence for ubiquitous maize and the engineered drainage canals plus savannah farm ponds that enabled year-round monoculture. Strongest opposing consideration is that Casarabe ends ~AD 1400 (E037), so it cannot directly illustrate the 1542 contact world, but the claim is about the culture’s practice, not its survival to Orellana.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E012 documents concentration of domesticated tree species on and around archaeological sites; dark earths, raised fields and forest islands are standard in the cited literature. E013 qualifies that post-Columbian land use likely played the larger role in the modern floristic signal, so the pre-Columbian attribution is only partial.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      E016 supplies radiocarbon and OSL dates showing intermittent construction from AD 570–770 linked to flood periods; E015 frames the fields as flood-risk mitigation built only where no alternatives existed. The continuous-cultivation reading is directly challenged by the dating.
  - claimId: AMZ-C010
    verdict: established
    confidence: high
    reasoning: >-
      E008 reproduces Newson’s Table 1 figures (Napo–Aguarico ~88 % decline, Mainas 62–64 %) and the mixed mechanisms (epidemics, raids, missionization, forced service, revolt, flight). Extension beyond the upper-Amazon mission provinces is an extrapolation, but the claim is region-specific.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      E017 (Belterra AD 1300–seventeenth century with dark earths, ponds, roads), E018 (Cacoal AD 1300–1650) and E019 (Upper Xingu to ca. 1770, layouts matching living Kuikuro) independently document occupation into or beyond contact. E019 is secondary journalism, slightly lowering confidence for that sub-claim only.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      E009 quotes Denevan’s explicit rejection of the habitat-density method that produced 5.1–6.8 million while he still holds “at least 5 to 6 million” reasonable on other grounds. The claim correctly distinguishes model-family dependence from independent measurement.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      E010 reports that distance from river is the most important predictor (21.5 % permutation importance) across 7 363 sites and that interfluves were more sparsely populated. Survey-effort bias toward rivers is acknowledged but does not erase the statistical pattern.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      E011 synthesizes fourteen-region phytolith and charcoal results showing little to no annual crops, clearing, anthropic soils, tree enrichment or recurrent fire in most sampled terra-firme settings. E030’s rhetorical “put to rest” claim targets a different environment (Llanos savanna) and is weak against the terra-firme synthesis.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E020 states that summed radiocarbon distributions fit logistic growth to carrying capacity before colonization and attributes the terminal decline to sampling bias plus post-European collapse. SPDs are relative proxies with known biases, so the carrying-capacity reading remains model-dependent.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is the interpretive roll-up of C004, C006, C007, C011, C013 and C014; the supporting measurement records (E001, E004, E014, E017–E019, E010, E011) jointly establish dense engineered corridors and hotspots inside a sparsely occupied matrix. No ledger evidence supports a uniform high-density alternative.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: high
    reasoning: >-
      Qualitative credibility follows from C001–C003 plus contact-era occupations (C006, C011) and the matching bluff-settlement geography (E006, E007); numerical instability is directly shown by E005. E003 correctly notes that early Aquiry grandeur is chronologically distant from 1542, but the claim does not rely on it.
  - claimId: AMZ-C018
    verdict: established
    confidence: high
    reasoning: >-
      E021 and the first-party Hancock site statement document the seven chapters / 90+ pages in America Before (2019) and the 2024 series appearance of Pärssinen and Ranzi. The record is genealogical only and carries zero weight for any empirical Amazon claim.
  - claimId: AMZ-C019
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No dedicated evidence record extracts the Blatrix et al. 2018 weir/pond metrics, but the claim is consistent with the broader Casarabe landscape-engineering package (E014) and with year-round interfluvial fishing at Loma Salvatierra (E022). Direct quantitative support for the 382-pond / 35 m proximity figures is therefore only provisional within this ledger.
  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      E022 reports >17 000 fish remains at Loma Salvatierra (AD 500–1400, 50 km from the Mamoré) demonstrating year-round exploitation of interfluvial aquatic resources, including dry-season small-water-body species. No contrary zooarchaeological record appears.
  - claimId: AMZ-C020
