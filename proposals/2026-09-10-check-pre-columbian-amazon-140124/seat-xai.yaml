    confidence: low
    reasoning: >-
      No evidence record in the ledger quotes or evaluates Walker et al. 2023; the “limited, albeit impressive” phrasing and the two-thirds dominance claim therefore lack weighed support or contradiction inside the provided materials.
  - claimId: AMZ-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record extracts the Clement et al. sampling-volume critique; the 300-core / 1.17 m³ / 2 000 000 km² figures are therefore unweighed within this ledger even though the source itself is verified.
  - claimId: AMZ-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record quotes Bush et al. 2025 on the Upano Valley; the forest-recovery erasure of the pre-Columbian signal versus persistence of the Colonial signal is therefore unassessed here.
  - claimId: AMZ-C027
    verdict: established
    confidence: high
    reasoning: >-
      E037 directly states the Casarabe culture date range as around AD 500 to AD 1400 from the radiocarbon program. E038 supplies only dataset composition (context) and does not alter the range. Stratigraphic control is limited to four sites, but the claim reports the published chronology.
  - claimId: AMZ-C037
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E035 and E036 record Heckenberger et al. 2008’s estimate of a regional population ≥50 000 (>2.5 persons/km²) derived from ethnographic conversion and stated as conservative. The figure rests on the same contemporaneity and persons-per-settlement assumptions flagged for other demographic claims, and only two clusters were directly surveyed.