  verdict: well_supported
  loadBearing: [AMZ-C016, AMZ-C017, AMZ-C001, AMZ-C003, AMZ-C013, AMZ-C011, AMZ-C010]
  weakestLinks: [AMZ-C017, AMZ-C015, AMZ-C010, AMZ-C005]
  synthesis: >-
    The featured hypothesis this ledger actually argues is not "a basin-wide civilization" but a
    strongly heterogeneous pre-contact Amazon — engineered, densely settled corridors and hotspots
    embedded in a lightly occupied matrix — with Carvajal's qualitative social geography rendered
    locally plausible and his numbers set aside. On the evidence records supplied, that composite is
    well supported, and it is well supported precisely because the ledger carries its own
    counter-evidence rather than suppressing it. The positive leg is multi-method and multi-regional:
    canopy-penetrating LiDAR documenting 432 earthworks with 396 previously unknown (AMZ-E001);
    fortified southern-rim villages dated AD 1250–1500 (AMZ-E004); phytolith-documented year-round
    maize agriculture with drainage canals and farm ponds in Mojos (AMZ-E014); landscape-scale
    engineered fisheries and 17,000+ fish remains from an interfluvial mound (AMZ-E022); and three
    independent contact-horizon occupation records at Belterra, Cacoal, and the Upper Xingu
    (AMZ-E017, AMZ-E018, AMZ-E019). These are mechanisms and measurements, not authority, and they
    dispose of the twentieth-century environmental-limitation argument outright. The negative leg is
    equally real: river distance dominates occupation prediction across 7,363 sites (AMZ-E010); a
    fourteen-region phytolith and charcoal synthesis finds little to no intensive-use signal in most
    sampled terra firme (AMZ-E011); machine-learning extents for earthworks and dark earths are
    "limited, albeit impressive" (AMZ-C020); and roughly 80% of the basin sits at 0–1% modelled
    earthwork probability (AMZ-C029). The mosaic reading is what survives both legs; the maximalist
    and pristinist readings each survive only one. Three structural weaknesses remain. First, the
    demographic layer is model output, not measurement: the 2026 paper's own sensitivity spans
    roughly fivefold (AMZ-E002), the southern-rim figure is contemporaneity-plus-extrapolation
    (AMZ-E004), Denevan repudiated the method behind the canonical basin total while keeping its
    order of magnitude (AMZ-E009), and published earthwork totals differ several-fold between models
    (AMZ-E038, AMZ-E039). Second, the chronology does not line up with the featured narrative: the
    Aquiry peak is AD 100–300 (AMZ-E003), a millennium before Orellana, and the ledger commendably
    refuses to spend it as contact-era corroboration. Third, and most consequentially, no evidence
    record in this file supplies contact-horizon archaeology from Carvajal's own middle-Solimões
    corridor. His qualitative credibility rests on textual corroboration (AMZ-E007) plus
    demonstrated feasibility elsewhere — a strong inference, but an inference. AMZ-R001 remains the
    unrun decisive test, and the collapse leg (AMZ-E008) is documented for upper-Amazon provinces
    and extrapolated downstream. Sensitivity: removing AMZ-E007 — the Nunes 1538 and Ursúa 1560
    testimony — would change the case verdict most, because it is the only independent witness set
    on the same reaches; without it AMZ-C017 falls to unresolved and the case verdict drops to
    provisionally_supported. The mosaic claim (AMZ-C016) survives that removal untouched, since it
    rests entirely on archaeology.
  steelman: >-
    Bush et al. 2025 (AMZ-C022) show that in the Upano Valley a long period of forest recovery
    largely eradicated the ecological signature of pre-Columbian occupation while the later Colonial
    signal persisted in the same profiles. If erasure is that time-graded, then both pillars of the
    sparse-Amazon case — the null phytolith and charcoal records (AMZ-C014) drawn from roughly 1.17 m³
    of sediment standing in for two million km² (AMZ-C021), and the absence of contact-horizon
    archaeology from Carvajal's own Solimões corridor — are exactly what a densely settled 1542
    followed by four centuries of regrowth would predict. No record in this ledger tests that
    taphonomic prediction on the corridor itself: nobody has flown Acre-intensity LiDAR or run
    gridded dark-earth coring along the middle Solimões reaches Carvajal, Nunes, and the ten Ursúa
    accounts independently describe. A proponent can therefore hold, without contradicting any
    evidence record here, that the decisive survey has simply never been done where the dispute lives.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is a claim about the content of a text, and both anchoring sources (Denevan 1996's
      manuscript comparison, Lopes et al. 2024's verbatim quotations) attest the populous-settlement,
      food-store, road, ceramic, and territorial-polity content, as well as the interspersed empty
      stretches. The alternation of dense and empty reaches is independently echoed by Denevan's
      bluff model (AMZ-E006), which makes the pattern a spatial prediction rather than rhetoric. The
      strongest opposing consideration is that the primary text was never fetched natively for this
      ledger (SRC-CARVAJAL-1542 is marked unverified), so the claim rests on two secondary quoters —
      but they are independent of one another and quote at length.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 reproduces Denevan's statement verbatim: the 50,000, 10,000 and 8,000 warrior figures
      and the four-to-five-league villages are absent from Oviedo, which retains the populous picture
      and one 5,000-warrior mention. This is a bibliographic fact about extant witnesses, checkable
      and checked. The opposing consideration is provenance quality — verification came via a Wayback
      abstract plus OCR full text, so page locators are OCR pagination — but the substantive
      collation is unambiguous and AMZ-R002 would only sharpen it.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 verbatim documents Nunes reaching Machiparo in 1538, the ten Ursúa accounts of 1560,
      the middle Solimões as among the most densely inhabited reaches, "infinita" maize stores, and
      long straight roads compared to Inca roads. Two witness sets written for different patrons and
      decades apart converging on mundane, non-marvellous details is the kind of corroboration that
      counts. Against it: the evidence record's own limitations note that Nunes survives only as a
      1553/54 letter through Porro's modern edition, that fortifications and organized warfare are
      not verified common elements, and that the turtle-corral detail belongs to Acuña (1639) — so
      the claim's "renowned ceramics" element is the least directly attested clause, and all these
      witnesses share a colonial genre with shared narrative incentives.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 verifies the 432 earthworks (396 new), the 4,430 km of ALS lines, the ~183,000 km²
      circumscription, and the 24,000–30,000 prediction, all as the paper states them; the claim is
      worded as a report of the study and is accurate. The instrument-level finding — five times more
      earthworks than satellite imagery detected on the same lines — is a measurement, not a model.
      The strongest opposing consideration is the extrapolated total: AMZ-E038 and AMZ-E039 show
      Peripato et al. 2023 predicting only 10,272–23,648 undiscovered earthworks for the whole
      6.7-million-km² basin, i.e. less than the 2026 regional figure, and the two are not strictly
      commensurable; add the disclosed funding of the 2026 study by this site's founder, which argues
      for holding the extrapolation at arm's length even while accepting the LiDAR count. AMZ-R006 is
      the right test.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 quotes both branches of the paper's own arithmetic: 1.25–3 million on a 25–60%
      simultaneous-use fraction and 300 people per earthwork, versus 250,000–600,000 (315,000–760,000
      with canopy correction) under one family per house mound. The roughly fivefold span across the
      authors' own stated assumptions is exactly what the claim asserts, so the claim is true as a
      matter of the paper's text. The only opposing consideration is emphasis rather than fact: the
      authors label the single-family reading "very unlikely," so citing the low branch as the honest
      error bar is an editorial choice — but the model-sensitivity assertion itself is not in doubt.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 verifies both halves: the 1,800 km southern-rim occupation by earth-building cultures
      in fortified villages at Cal AD 1250–1500, and the explicit dependency chain behind the
      500,000–1,000,000 figure (site contemporaneity, ethnographic conversion, MaxEnt projection from
      21,340 counted inhabitants to 463,555 and then 1,087,150). The claim's careful statement of
      those dependencies is what makes it defensible. The strongest opposing consideration is that
      contemporaneity across an 1,800 km arc is an assumption doing enormous work; if occupation was
      staggered, the population figure inflates by an unknown factor while the settlement and dating
      results stand.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E014 quotes the phytolith result directly: 178 samples from 18 soil profiles recording the
      singular and ubiquitous presence of maize, alongside documented drainage canals and newly
      identified savannah farm ponds — a mechanism-plus-measurement combination, not an inference
      from monumentality. Independent corroboration for intensive interfluvial subsistence comes from
      AMZ-E022's year-round fish exploitation at Loma Salvatierra. The strongest opposing
      consideration is that "monoculture" is an interpretation of a ubiquitous-maize phytolith signal
      from 18 profiles in one culture area, and that the Casarabe florescence (500–1400 CE) ends
      before contact, so this supports feasibility rather than the contact-era picture.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The landscape-engineering half — dark earths, raised fields, forest islands across multiple
      regions — is corroborated in this ledger by AMZ-E017 (Belterra dark earths, ponds, roads),
      AMZ-E014/E015/E016 (Mojos hydraulic works), and AMZ-E022, and is not seriously contested. The
      domesticated-tree half is weaker: AMZ-E012 states the association, AMZ-E040 and AMZ-E041 add
      53 of 79 species associated with modelled earthwork probability, but the evidence records
      themselves note that Peripato's species list and authorship overlap Levis et al. 2017, so this
      is not independent replication. The strongest opposing consideration is AMZ-E013's technical
      comment: post-Columbian activities over five centuries may have played the larger role in
      shaping observed floristic patterns, and nothing in the ledger separates pre- from
      post-Columbian management.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E016 supplies dated evidence — radiocarbon plus OSL — for intermittent use from AD 570–770
      in a few discrete construction events, and AMZ-E015 supplies the flood-risk-mitigation
      mechanism with the "only where there were no alternatives" wording; the claim's framing as a
      challenge to continuous-intensive-farmland readings is the papers' own. The strongest opposing
      consideration is scope: the dating is specifically Bermeo-area fields, other complexes may
      differ, and AMZ-E014's year-round maize result from the same broad region shows that
      intermittent raised-field use does not imply low-intensity subsistence overall. The two records
      describe different infrastructures and should not be collapsed.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E008 reproduces Newson's Table 1 figures (Napo-Aguarico 49,000–51,000 to about 6,000 by
      circa 1700, 87.8–88.2%; Mainas 62.3–63.6%) and the mixed causal mechanisms including epidemics,
      enslaving raids, missionization, the 1635 revolt, and flight from exposed river locations. As a
      report of a documentary reconstruction it is solid, and the "uneven" framing is faithful. The
      strongest opposing consideration is transferability, flagged in the record's own limitations:
      these are upper-Amazon provinces with mission records, and extending the ratios to the
      middle and lower Amazon reaches that the case actually cares about is extrapolation — which is
      why AMZ-R005 exists and why this is a weak link for the case rather than for the claim.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Two of the three legs are strongly sourced: AMZ-E017 verifies Belterra occupation from ca. AD
      1300 to seventeenth-century colonization with dark earths, ponds, and trodden roads, and
      AMZ-E018 verifies Cacoal at 1300–1650 with explicit Marajoara cultural persistence into the
      Portuguese period. These are independent regions and independent research groups, which matters
      more than count. The strongest opposing consideration is the third leg: AMZ-E019 is a Science
      news feature, not a primary excavation report, so the 500–1770 CE Upper Xingu range and the
      Kuikuro layout continuity are held at secondary weight in the ledger's own judgement — the
      claim would survive its removal but with one fewer region.
  - claimId: AMZ-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E009 is as clean as documentary evidence gets: Denevan explicitly rejects the
      habitat-density method behind his own 5.1–6.8 million estimate, on the stated ground of
      excessive within-habitat density variability, while still holding at least 5 to 6 million
      reasonable. The claim's second half is therefore established. The strongest opposing
      consideration is that the first half — that published estimates generally are model families
      sharing assumptions rather than independent measurements — is a generalization for which this
      ledger supplies one worked example plus two internally-disclosed model dependencies (AMZ-E002,
      AMZ-E004); it is plausible and partially evidenced, not demonstrated, and AMZ-R004 is the test.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E010 verifies both parts verbatim: distance from river as the top predictor at 21.5%
      permutation importance across 7,363 AmazonArch locations, and interfluvial areas modelled as
      more sparsely populated than riverine ones. The result is consistent with independent lines —
      Denevan's bluff model (AMZ-E006), Walker's limited earthwork and ADE extents (AMZ-C020), and
      the 0–1% probability mass over most of the basin (AMZ-C029). The strongest opposing
      consideration is circularity risk, which the record itself names: presence-only site databases
      inherit survey-effort bias toward accessible riverine areas, so a river-distance predictor is
      partly a map of where archaeologists have walked. AMZ-R003's promise-blind sampling frame is
      the only clean way to break that.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E011 quotes the synthesis accurately, including the five-item enumeration of what was not
      found, and the claim is carefully scoped to "most sampled terra-firme settings," which is what
      the paper says. As negative evidence from a purpose-built proxy program it is genuinely
      informative about intensity in the sampled locations. The strongest opposing considerations are
      two records in this same ledger: AMZ-C021's sampling critique (roughly 300 cores, about 1.17 m³
      of sediment, standing in for two million km²) and AMZ-C022's demonstration that forest recovery
      can largely erase a pre-Columbian occupation signal that later Colonial activity leaves intact.
      Together these mean the null is reliable as a statement about the cores and much weaker as a
      statement about the region.
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      AMZ-E020 verifies the logistic fit over 1,700 years and the authors' carrying-capacity
      inference, plus their attribution of the terminal decline to sampling bias compounded by
      post-contact collapse and dispersal. But summed radiocarbon probability distributions are
      relative-population proxies with well-known taphonomic, calibration, and research-agenda
      biases, and the record's own limitation says so; a logistic shape is also exactly what
      accumulating, decay-biased date inventories can produce artefactually. Critically, the
      attribution of the terminal downturn to bias-plus-post-European-collapse rather than an
      endogenous pre-contact crash is an interpretive choice made by the same authors whose model
      supplies the growth curve, with no independent test in this ledger. I weight this claim lightly
      and note that my scepticism about SPD inference draws on general methodological background as
      well as the record itself.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This synthesis is the one proposition in the case that both evidence legs support rather than
      one. Dense engineered occupation is measured at Acre (AMZ-E001), the southern rim (AMZ-E004),
      Mojos (AMZ-E014, AMZ-E022), Santarém (AMZ-E017), and Marajó (AMZ-E018); sparse matrix is
      independently indicated by river-distance dominance (AMZ-E010), the terra-firme proxy nulls
      (AMZ-E011), limited modelled earthwork and ADE extents (AMZ-C020), and roughly 80% of the basin
      at 0–1% earthwork probability (AMZ-C029). The strongest opposing consideration is that the
      matrix term is quantitatively unconstrained: every negative record is a biased or
      erasure-prone sample (AMZ-C021, AMZ-C022) and every positive record is a
      discovery-biased one, so "much more lightly occupied" is an ordering claim with no defensible
      density attached. The ordering survives; the magnitude does not.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The second half — extreme numbers textually unstable and not to be treated as counts — is
      established outright by AMZ-E005. The first half is a real but indirect inference: AMZ-E007
      gives independent sixteenth-century witnesses to the same reaches describing the same mundane
      features, and AMZ-E004, AMZ-E017, AMZ-E018, and AMZ-E019 establish that populous, planned,
      contact-era riverine and bluff societies existed in Amazonia, which removes the
      impossibility objection. The strongest opposing consideration is that no evidence record here
      supplies contact-horizon archaeology from Carvajal's own corridor; AMZ-E003 explicitly warns
      that the spectacular Aquiry evidence peaks AD 100–300, a millennium early, and AMZ-C024's
      tentative tributary identifications mean even locating his reaches is contested. AMZ-R001 is
      unrun, so credibility here rests on textual convergence plus regional feasibility, not on
      matched material evidence.
  - claimId: AMZ-C018
    verdict: well_supported
    confidence: high
    reasoning: >-
      The publication and broadcast facts are documented first-party for the book (Hancock's own
      "seven chapters, more than 90 pages" statement) and by the IMDb cast listing for the 2024-10-16
      episode featuring Pärssinen and Ranzi (AMZ-E021), so the factual content stands. The evidence
      record correctly labels itself genealogy carrying no weight for any empirical claim about the
      Amazon, and I assess it that way. The strongest opposing consideration is the embedded
      characterization "then-marginal earthwork research": on general background, Acre geoglyph
      research was appearing in the peer-reviewed literature well before 2019, so "marginal" is
      editorial framing rather than a documented property, and popular platforming is not evidence of
      priority.
  - claimId: AMZ-C019
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Blatrix et al. 2018 source is recorded as natively fetched with the zigzag weirs,
      arrow-straight causeways, 382 ponds, and the fish-concentrating function of the V-shaped
      structures checked, and the paper's own hedge ("we postulate") is carried into the claim's
      wording. Convergent support for intensive interfluvial aquatic exploitation comes from
      AMZ-E022's zooarchaeology at a nearby mound. The strongest opposing considerations are that no
      dedicated evidence record was filed for this claim in the ledger — it leans on the source anchor
      alone — and that the functional interpretation of the V-structures is inferred from morphology
      and hydrology rather than demonstrated experimentally.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E022 verifies the specifics: more than 17,000 fish remains from Loma Salvatierra, a
      monumental mound 50 km from the Mamoré occupied AD 500–1400, with lungfish and tiger-fish named
      among dry-season small-water-body resources supporting the year-round inference. This is direct
      zooarchaeological measurement of subsistence, which is stronger than inference from
      infrastructure. The strongest opposing consideration is the paper's own caveat recorded in the
      source note: the paucity of larger-bodied river fish suggests infrequent exogenous inputs, so
      the site tells us about local aquatic productivity rather than about integration with the main
      river fishery.
  - claimId: AMZ-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The quoted phrases — "limited, albeit impressive" extents for earthworks and ADEs, and other
      site types dominating more than two thirds of Amazonia — were verified against the PMC copy, so
      the claim accurately reports the study. It also converges with AMZ-C029 and AMZ-E010 on the
      spatial restriction of monumental signatures. The strongest opposing consideration is that this
      is a machine-learning prediction trained on presence-only records with the same accessibility
      bias as every other site database, and that "other site types dominate" is itself a claim of
      widespread non-monumental occupation — so the record cuts against basin-wide earthwork
      maximalism without supporting emptiness.
  - claimId: AMZ-C021
    verdict: well_supported
    confidence: high
    reasoning: >-
      The specific figures — roughly 300 cores in five small areas, about 1.17 m³ of sediment, "to
      represent the 2 000 000 km2 of western Amazonia" — were checked verbatim in the PMC copy of the
      reply, and the claim is worded as a report that the criticism was formally made. As a
      statistical-power objection to region-scale negative inference it is sound on its face. The
      strongest opposing consideration is what it does not establish: demonstrating that a sample is
      thin does not show the sampled signal is wrong, and the phytolith program's own defence is that
      its transects were chosen to be representative rather than random. This claim weakens AMZ-C014's
      reach without supplying any positive occupation evidence.
  - claimId: AMZ-C022
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The quotation is verified and the accompanying nuance is preserved in the source record: the
      Colonial-period signal persisted in the same profiles, so erasure is time-graded rather than
      total. That asymmetry is the claim's real evidential value, because it is a demonstrated
      taphonomic mechanism, not a speculation, and it directly bears on how much AMZ-C014's nulls can
      carry. The strongest opposing consideration is generality: this is one Andean-foothill valley
      with a distinctive volcanic and hydrological history, and one demonstration of erasure does not
      establish that erasure operated in the fourteen lowland regions where the nulls were recorded.
  - claimId: AMZ-C023
    verdict well_supported: null
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Newson's documentary reconstruction supports the interactive-collapse mechanism: "fade outs"
      of epidemics in sparsely settled lowlands, repeated reintroduction of infection via slave raids
      and missionization, and heaviest adult mortality where disease arrived late, together with
      flight from exposed river locations (AMZ-E008). This is a mechanism claim and the mechanism is
      documented rather than assumed, which matters more than any single mortality figure. The
      strongest opposing consideration is that the epidemiological reasoning about fade-out thresholds
      leans partly on general infectious-disease theory as well as on Newson's records, and the
      records themselves are upper-Amazon mission archives whose applicability to the densely settled
      middle Solimões — where fade-out would be less likely — is untested.
  - claimId: AMZ-C029
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The quoted figure and its geographic concentration in northwestern, northern, and central
      Amazonia were checked against the accepted manuscript, and the paper's own accompanying caution
      ("may not have occupied all of Amazonia") is consistent with the claim as stated. It converges
      with AMZ-C020 and AMZ-E010 on restricted monumental extent. The strongest opposing
      considerations are that this is a modelled probability surface built from presence-only data
      with a modelled observability correction, that its own authors' undiscovered-site range
      (AMZ-E038) sits below the 2026 regional prediction and so cannot be assumed calibrated, and that
      low earthwork probability is not low occupation probability — non-earth-building societies leave
      no signal in this model at all.