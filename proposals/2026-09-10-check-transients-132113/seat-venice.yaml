caseAssessment:
  verdict: unresolved
  loadBearing: [TRN-C001, TRN-C002, TRN-C020, TRN-C024, TRN-C007]
  weakestLinks: [TRN-C023, TRN-C104, TRN-C103, TRN-C006]
  synthesis: >-
    This case divides cleanly along its own attribution ladder, and the honest
    roll-up is that the bottom rungs are solid while the upper rungs are not
    built. The observation layer is genuinely strong: the nine April 1950 marks
    were physically confirmed on Edinburgh copy glass by the critics' own plate
    expert (TRN-E002), the sharpness measurement is common ground and carries a
    joint probability of order 0.1^9 under the stellar profile distribution
    (TRN-E003), an independent pipeline recovered the canonical events and most
    of the catalog without the proponents' software (TRN-E008), and the
    Yang & Villarroel microscopy places all nine on the original 1950 emulsion
    itself (TRN-E022). Digitization-artifact explanations for the flagship
    events are dead, and the copy-genealogy mechanism (TRN-C007) is established
    fact — but its reach over the two flagship events is now qualified by the
    original-glass result. The crux, TRN-C020, is genuinely unresolved, and the
    case's own most candid record (TRN-E024) says so: microscopy cannot
    separate a sub-second flash from an emulsion defect, and the microscopist —
    directed to the objects by the copy-defect argument's own author — leaned
    defect. The ensemble layer is where the featured hypothesis should earn its
    keep and does not: the Earth-shadow deficit and nuclear-window correlation
    replicate statistically on the authors' catalog (TRN-E010, TRN-E015) but
    dissolve or become schedule-driven under independent extraction and proper
    nulls (TRN-E009, TRN-E011), and the strongest counter is that the entire
    ensemble runs on an unvalidated ~107,875-row working sample expected to
    contain substantial false positives. The upper attribution rungs have no
    direct evidence at all: nothing in the ledger supports "artificial"
    (TRN-C022) over natural near-Earth objects — Cann's dusty-plasma proposal
    actively competes — and "extraterrestrial" (TRN-C023) is pure speculation.
    The strongest proponent assets are the sharpness statistic, the coma
    signature on independent Hamburg material (TRN-E014), and the phenomenology
    now escaping the Palomar lineage (TRN-E013); the strongest skeptical assets
    are the copy genealogy, the classifier, the microscopist's defect reading,
    and the Watters dataset audit. Neither side has yet made the measurement
    that would decide: a calibrated flash-versus-defect profile curve
    (TRN-R002), a blind-validated coma discriminant (TRN-R003), or a defect
    base rate on original emulsion (TRN-R007). Steelmanning both directions, a
    defect prior without a measured base rate is exactly as much an argument as
    the flash physics is — which is precisely why the verdict is unresolved
    rather than either strong verdict.
  steelman: >-
    The sharpest unanswered proponent argument: no one has measured how often
    emulsion defects on an ORIGINAL telescope negative produce nine
    simultaneously appearing, circular, sharper-than-stellar point sources
    within a 10-arcminute region (TRN-R007 was never performed, and the defect
    classes cited — holes, bubbles, scratches — were catalogued on copy
    material and by visual impression, not quantified against the sharpness
    distribution). The 0.1^9 sharpness joint probability stands unexplained by
    any quantitative defect model, the marks survived examination of the
    original glass, and the only physical incident-light discriminant so far
    attempted (Busko's coma signature, on fully independent Hamburg optics and
    emulsion) points toward light that passed through the telescope. Until a
    defect base rate for sharp star-like marks on original emulsions exists,
    the artifact side holds a possibility argument against a measured
    improbability.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      This existence claim depends on TRN-C020 (light entered the telescope),
      which the case's own microscopy record says cannot presently be decided
      for individual sources, and on TRN-C021, which has mixed support. Even if
      near-Earth flashers exist, nothing in the ledger supports "artificial"
      over natural objects: Cann 2026c supplies a candidate natural mechanism
      that would leave this claim without a reason to believe it. The strongest
      opposing consideration is that the entire ensemble evidence base runs on
      an unvalidated catalog whose correlation signals do not survive
      independent extraction.
  - claimId: TRN-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger discriminates extraterrestrial
      technological origin from any other reading; the claim is two rungs above
      the unresolved crux. Cann 2026c's natural icy-aggregate mechanism, if it
      held, would explain the same observations with no artifacts at all, and
    the multi-observatory parallax test for the historical events is reported
      infeasible. "Unresolved" here means: no evidential contact has been made,
      not a balance of evidence.
  - claimId: TRN-C021
    verdict: mixed
    confidence: low
    reasoning: >-
      The Earth-shadow deficit is the direct geometric test and the evidence
      splits: Doherty's independent-code replication finds 0.46% against 1.4%
      expectation and the Bruehl ML paper reports the deficit persisting and
      strengthening among likelier-real candidates, but Watters shows the
      uniform-random background assumption is false and finds no significant
      deficit under a properly derived null, and the working catalog itself is
      unvalidated. Note also that this claim, as stated, does not require
      artificiality — Cann's natural near-Earth dust would satisfy it — so it
      is the most survivable attribution rung, but the evidence is genuinely
      two-sided.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The marks are real features of the original emulsion (TRN-E022), which
      kills scanning, digitization, and copy-stage explanations for the
      flagship events — but the surviving fork is flash versus intrinsic
      emulsion defect, and TRN-E024 reports that microscopy cannot separate
      them and quotes the microscopist leaning defect. The sharpness
      observation is direction-ambiguous: TRN-E006 gives a physics argument for
      flashes being sharp, but no calibration on period emulsions exists, and
      the two profile distributions may overlap entirely. The Hamburg coma
      signature (TRN-E014) would be a physical incident-light detector, but it
      is unvalidated, applies to different plates, and its own author says the
      data do not establish the light's origin.
  - claimId: TRN-C007
    verdict: established
    confidence: high
    reasoning: >-
      Hambly & Blair reconstruct the copying chain from documentary and
      physical evidence: DSS and SuperCOSMOS scan independent copy negatives
      printed from a shared intermediate positive, so a shared-stage defect
      propagates to both datasets. This is the rare claim strengthened rather
      than weakened by scrutiny — the Yang & Villarroel microscopy qualifies its
      diagnostic reach over the two flagship events (whose marks sit on the
      grandparent material) but leaves the genealogy itself and its force over
      the ~100,000 uninspected catalog candidates fully intact.
  - claimId: TRN-C101
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The supporting facts are direct: Hambly & Blair physically catalogued
      emulsion holes, bubbles, and scratch-like marks on the copy plates and
      found recurring point-like detections on the neighboring field, and the
      random-forest classifier groups the candidates with known artifact
      morphology. What keeps this from "established" is the missing base rate:
      no census of how often star-like marks are created per plate generation
      exists (TRN-R007), so "rates sufficient to contaminate" is demonstrated
      qualitatively, not measured. The classifier's circularity — its spurious
      class is defined by absence of modern counterparts — is the strongest
      opposing consideration.
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: >-
      Triple-confirmed: the discovery paper reports the nine sources absent
      from all later and deeper imaging; the critics' own inspection (Hambly &
      Blair) physically confirmed them on the Edinburgh copy glass at the
      published positions and absent from the six-days-later plate; and the
      microscopy manuscript finds them on the original 1950 emulsion. The
      opposing consideration is only that the discovery paper itself lists
      plate contamination first among explanations — but that bears on
      interpretation, not on the presence/absence observation this claim
      states.
  - claimId: TRN-C024
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The Yang & Villarroel microscopy is the first and only examination of the
      original telescope negative, and it reports all nine sources on the
      physical emulsion at registered positions. It is moderated to
      provisional because it is an unreviewed preprint, the inspection was
      unblinded and performed by the proponents' group, the registration
      analysis is the load-bearing step and has not been independently
      checked, and the microscopist's defect-leaning opinion shows competent
      eyes can read the same features differently. An outside blinded repeat
      is the missing confirmation.
  - claimId: TRN-C002
    verdict: established
    confidence: high
    reasoning: >-
      The measurement is common ground: the critics' own SuperCOSMOS analysis
      found all nine candidates on the sharp side of the zero-mean stellar
      distribution with joint probability of order 0.1^9, confirmed visually
      under the microscope. The interpretation is disputed — sharpness as
      artifact signature (classifier) versus sub-second flash physics (TRN-E006)
      — but the claim as stated is the measurement itself, which has been
      replicated by the skeptical camp. The unresolved flash-profile
      calibration (TRN-R002) limits what it implies, not what it measured.
  - claimId: TRN-C102
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The mechanism is sound textbook optics: stars accumulate seeing and
      guiding blur over minutes-long exposures while a sub-second flash does
      not, so an unresolved flash should be sharper and rounder. What holds it
      below established is that it exists only as argument: no controlled
      flashes have been exposed on period-appropriate Schmidt emulsions
      (TRN-R002 unperformed), the source is a proponent-team preprint, and
      whether the flash and artifact profile distributions are separable — the
      property that would make sharpness diagnostic — is unmeasured.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Peer-reviewed discovery with strong internal controls (consecutive
      exposures fifty minutes apart) and 71 years of non-detection including
      GTC imaging to magnitude 25.5; the independent Hayes pipeline recovered
      all three sources, and the Yang & Villarroel work found the candidate on
      a Harvard copy plate and in the original survey digitization. It stops
      short of established because no independent physical inspection of the
      1952 original negative exists and the morphological profile (star-like,
      unlike the sharp 1950 nine) shows the canonical events are not a uniform
      population any single mechanism obviously covers.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hayes's from-scratch pipeline, benchmarked with synthetic injections,
      recovered 8/9 and 3/3 canonical sources at ~0.2 false positives per
      control field and matched 63.9% of the published 5,399 catalog — genuine
      independent extraction. It is one preprint by one author, the extraction
      reads the same digitized lineage (not independent material), and the
      500-fold gap between his 2.85-million-candidate sweep and the vetted
      catalog cuts both ways: it proves the detections are not
      software-bound while showing how vetting-dependent the "population" is.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The deficit (0.46% observed vs ~1.4% expected) replicates on the original
      catalog with independent code (TRN-E010) and survives ML artifact
      scoring (TRN-E015), but Watters demonstrates the uniform-random
      background assumption underlying the 1.4% expectation is false — feature
      counts are spatially heterogeneous — and finds no significant deficit
      under a properly derived null. The proponents' rebuttal presses the
      smallness and underpowering of Watters's subset. Both statistics and
      dataset are contested on their own terms; this is a live methodological
      dispute, not a settled measurement.
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The sharpest replication split in the case. For it: Doherty reproduces
      RR 1.45 with independent code, it survives negative-binomial regression
      with weather controls and a permutation test, the Bayesian reanalysis
      retains it with autocorrelation modeled, and Cann 2026b closes the
      airglow/sensitivity confounder. Against it: Hayes's independent
      extraction finds no significant effect and shows it is
      schedule-sensitive; Watters shows it is almost completely determined by
      the Palomar observing schedule and that 91% of the ensemble features sit
      within 5 arcsec of catalog stars. A correlation that depends on whose
      extraction it runs on is a property of the catalog until proven
      otherwise.
  - claimId: TRN-C103
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Cann 2026 reports a monotonic dose-response across five Kp bins
      (17.4% to 2.4%) and claims controlling for Kp strengthens the nuclear
      association, and Cann 2026b usefully shows plate sensitivity itself is
      invariant with Kp, closing one artifact route. But it is a
      single-author, unreviewed preprint on the same contested 107,875-row
      catalog, the three Cann preprints are mutually non-independent, and no
      independent team has tested the Kp gradient — Hayes's and Watters's
      extraction-level critiques did not examine it. Supported as reported;
      weakly anchored.
  - claimId: TRN-C104
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The alignment claim rests on the Villarroel 2025 PASP paper (not read in
      full for this record and characterized only via title and secondhand
      discussion) plus Doherty 2026b, whose seven aligned plates at p < 0.03
      are modest, post-hoc in criterion selection, and exposed to
      look-elsewhere inflation; Watters additionally reports a third of
      linear-cluster features were not confidently distinguished from catalog
      stars. The alignments also inherit the contested catalog provenance.
      The pattern is reported and unpublished counterevidence is absent, so
      weakly_supported rather than unresolved, but nothing here is strong.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Busko's Hamburg search is the first appearance of the phenomenon outside
      the Palomar copy genealogy — independent telescope, emulsion, archive,
      and digitization — with systematically narrow FWHM relative to stellar
      PSFs, which the copy-defect mechanism cannot reach. But the author
      labels it preliminary: 41 plates, no false-positive calibration, no
      injection/recovery, and no measured candidate rate against matched
      controls, so "similar sky phenomenon" and "similar defect susceptibility
      of old emulsions" remain indistinguishable. That disambiguation is
      exactly what TRN-R006 exists to deliver.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The coma signature is potentially the highest-information positive
      result in the ledger — a physical discriminant between
      light-through-the-optics and after-the-fact marks on independent
      Hamburg optics — but it rests on a single-author preprint whose
      classifier has not been blind-validated against the defect bestiary,
      and the paper itself states the data do not establish the physical
      origin of the light. Defect classes mimicking directional asymmetry have
      not been excluded, and it validates no Palomar event. The frozen
      confusion-matrix test (TRN-R003) is the gate between provisional and
      strong.