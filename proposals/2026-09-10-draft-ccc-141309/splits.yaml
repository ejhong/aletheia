    - The first suggestion for effects on the CMB sky from the CCC concept was for rings of low variance; these claims were refuted by three independent analyses and further analysis showed no significant results for low-variance rings.
    - The specific CCC claim then changed to being for sets of concentric low-variance rings, and the significance of sets of low-variance rings was not confirmed when tested.
    - There is now a further revision of the stated CCC prediction, to high-gradient rings ('Hawking points') rather than low-variance ones, making it the third version of the assertion for how CCC would manifest itself.
