  answer:
    - Under the conformal cyclic cosmology scenario, the centres of the sets of concentric rings should be distributed randomly on the sky, because the positions of the massive black holes generating them are distributed randomly.
    - Under the conformal cyclic cosmology scenario, within each set of concentric rings only a few rings should have lower variance, since for a significant fraction of its lifetime a black hole does not modify the CMB and rings not related to collisions show typical variance.
    - Sets of rings with systematically lower variance for larger ring radii are observed, clustered in a few relatively large regions of the sky.
    - Clustering of low variance rings in relatively large regions and systematically lower variance at large radii are not consistent with the predictions of the conformal cyclic cosmology scenario.
