    - 'For a Planck-mass erebon, the memory contribution is still very small: compared with the current LIGO limits, Ω_GW(25 Hz) < 6.7×10⁻⁴³ "misses detectability by 35 orders of magnitude".'
    - 'The LIGO limit used for comparison combines O1 and O2 data: for the spectrum Ω_GW(f) = (f/25 Hz) Ω_0, "the 95% uniform-prior confidence limit is" Ω_0 < 4×10⁻⁸.'
afa3c60a3fb03d0b8d2c294f94b1887391093e23c697aceccb082e00b184312b:
