  answer:
    - Stacks of Planck 2018 SMICA temperature and E-mode maps were made around HPs in the temperature map with |â|>2; for (0.01, 0.02) "there were a total of 709 HPs" with |â|>2, and for (0.01, 0.03) there were 730.
    - The temperature stacks exhibit the expected ring structure of the HPs "because they were selected to have these profiles".
    - In the E-mode stacks, "there does not appear to be any corresponding structure" at the locations of the temperature-selected HPs.
    - In addition to finding no statistically significant HP signal in the temperature, "we also find no evidence for a corresponding signal in polarization".
dbc051fc636c7b2c3ce3149c0e119eec2698ff547f5fb5f3af5d3df5f6f5d80e:
