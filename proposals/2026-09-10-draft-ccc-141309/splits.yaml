  answer:
    - The first suggestion for CCC effects on the CMB sky was for rings of low variance, and these claims "were quickly refuted by three independent analyses" which showed the original study had not properly accounted for standard CMB structure.
    - The specific claim then changed to being for "sets of concentric low-variance rings", and when tested, the significance of such sets "was not confirmed".
    - There is now "yet another revision of the stated CCC prediction", to high-gradient rings rather than low-variance ones.
    - The conclusion that the HP excess is a statistical variation could only have been avoided if a much more dramatic set of features had been found, or if "the predictions of CCC could have been made much more precise" before looking at the data.
