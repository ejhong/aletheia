  answer:
    - 'For the 30 most significant HPs at each of the two scales, the mean nearest-neighbour separation in the data is 0.20 rad for (0.01, 0.02) and 0.19 rad for (0.01, 0.03): "we locate the 30 most significant HPs on the sky" and find "⟨ θ NN ⟩ = 0 . 20 rad, and for" the second scale 0.19 rad.'
    - 'The expected distribution comes from 100 simulated Gaussian skies: "we simulate 100 Gaussian CMB temperature maps from the Planck best-fit power spectrum" and compute the nearest-neighbour statistic for the 30 most significant HPs at the corresponding scales.'
    - For both scales, the simulated distribution of the nearest-neighbour statistic "is roughly Gaussian with mean 0 . 20 and σ = 0 . 03", so the data values lie within 1σ of the Gaussian-sky expectation.
    - 'There is no anomalous clustering of HPs on the sky: "we do not find any evidence that HPs exhibit any anomalous clustering".'
6f8ded4255c66a947081ccee03513a1777dbdfdd74bdb9058d24cae4a6f0f757:
