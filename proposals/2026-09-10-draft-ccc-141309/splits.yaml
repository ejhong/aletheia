  runId: 2026-09-10-verify-ccc-142011
  date: 2026-09-10
  answer:
    - The point (l, b) = (105°, 37°), the centre of a set of concentric rings with systematically smaller variances, lies in a region close to the north Ecliptic pole with many extremely low variance rings, and "Any other point in this region shows a similar number" of unusually low variance rings.
    - '"Such a clustering of rings with low variance is not consistent" with the conformal cyclic cosmology scenario, because the massive black holes generating the rings are distributed randomly on the sky, so "the centers of the rings should also be distributed randomly".'
    - Clustering of the rings in relatively large regions "rather indicates effects related to large angular scale features" in the CMB maps.
    - Whereas the conformal cyclic cosmology model "predicts randomly distributed sets of concentric rings" within which few have lower variance, what is observed are sets of rings with systematically lower variance for larger ring radii that are clustered in a few relatively large regions of the sky.
232e84896f116d1e839921a4d299b8c7b191a1506ae40867a3a17197f6fa7940:
