    - Penrose conjectured that the gravitons from erebon decay "might produce a detectable background in the Laser Interferometer" Gravitational-Wave Observatory (LIGO) GW detectors.
    - The calculated spectrum of that GW background from erebon decay is "far too weak to observe with LIGO or other instruments".
