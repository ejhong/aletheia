    - The correlations analyzed are in "the calibration lines in the vicinity of 35" Hz.
    - Correlations are also analyzed in "the residual noise in the data after subtraction of the best-fit theoretical templates".
    - The residual noise for GW151226 and GW170104 "exhibits similar behavior" to that found for GW150914.
65d99340e07e2b24aa85c7f8bdc0777e9235dd54dc36f93c8488c560a515ce92:
