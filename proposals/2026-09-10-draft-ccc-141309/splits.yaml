    - Penrose's argument that the GW spectrum for particle decay can be found using the impulsive Vaidya metric, in which a Schwarzschild spacetime converts to Minkowski along an outgoing null hypersurface, is spherically symmetric; "Such a spherically symmetric particle decay model differs from the axisymmetric model" presented here.
    - Eq. (2.43c) of Blanchet & Damour "shows that for an isotropic source there is no" O(1/r) GW term in the strain.
    - For an isotropic source, "The leading effect in strain is O (1 / r 2 )" and thus is not a GW and is negligible for distant sources.
    - 'The memory effect is obtained specifically because the two outgoing null particles define a preferred axis: "The spacetime has axial rather than spherical symmetry".'
