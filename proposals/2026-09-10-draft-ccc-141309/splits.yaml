    - After subtracting the maximum-likelihood waveform from the data, there are "no statistically significant correlations after subtracting the maximum-likelihood waveform" between the residuals of the two detectors.
    - Although the test statistic and residual data differ, "our findings are consistent with the study of residual data" in the collaboration's own test of general relativity with GW150914.
