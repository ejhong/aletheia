    - For the point (l, b) = (105°, 37°), rings with radii greater than 10° have systematically smaller variance than the mean predicted by simulations of the concordance ΛCDM model.
    - Simulations in which the lowest multipoles (ℓ ≤ 7) are replaced by the corresponding best-fitting values determined from the foreground corrected V-band data for the KQ75y7 sky coverage are more consistent with the observed variance profile of rings centred at (l, b) = (105°, 37°).
    - Substituting only the multipoles up to order ℓ = 3 is not sufficient to reconcile the anomalous low-variance behaviour of large rings centred at (l, b) = (105°, 37°).
    - The large-scale anomalies responsible for the low variance of large rings are not limited to the apparently aligned quadrupole and octopole.
371662aa2d71b134dc43b6920577274d41a0d70ce4e32ac5e30a1f7d109eebc5:
