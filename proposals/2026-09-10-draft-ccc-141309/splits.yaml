  answer:
    - Comparing the observed variance profiles for rings centred at (l,b)=(105°,37°) and (252°,−31°) with ΛCDM simulations over radii from 0 to 90 degrees, "we do not identify any significant number of unusually extreme values" of the variance.
    - This absence of significant extreme variance values is "in good agreement with the conclusions in" Hajian (2011), Moss, Scott & Zibin (2011) and Wehus & Eriksen (2011).
    - Because the analysis is "not limited only to a range of radii from 0 to 20 degrees" as in previous works, the conclusion extends to the full range of ring radii from 0 to 90 degrees.
    - The fast-convolution approach "significantly extends previous studies that were limited" by pixel-based methods to rings centred on a lower resolution grid and radii in the range [0°, 20°].
f484e321f77bdd6df6c6ca2103f6c63bf7688582eee30655948a6d3650664962:
