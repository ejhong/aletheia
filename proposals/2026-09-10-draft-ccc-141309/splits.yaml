    - Stacking the Planck 2018 SMICA E-mode map around all HPs with |â| > 2 at the scales (0.01, 0.02) and (0.01, 0.03) (709 and 730 HPs respectively) shows that while the temperature stacks recover the selected ring structure, "there does not appear to be any corresponding structure in the E -mode stacks", so there is "no evidence for a corresponding signal in polarization".
