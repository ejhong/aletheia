    - 'The Pearson correlation of the maximum-likelihood subtracted residuals near the 7 ms offset is not statistically significant: "the p-value for the ML subtracted residuals is only ∼ 0 . 4" against colored Gaussian noise and off-source LIGO data.'
    - 'The residuals shown in Fig. 1 of the PRL detection paper (non-ML numerical relativity subtraction) do show significant correlation: "the p-value for the correlation of the non-ML waveform residuals is ∼ 0 . 001".'
