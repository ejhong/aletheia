      title: A fair ellipse null for the sky-twist test
      summary: Compute, from ΛCDM simulations masked as the data, the expected annular variance as a function of the full ellipse parameter space (eccentricity, orientation, radius, masked fraction), then re-run the GP13 concentric low-variance search on WMAP9 and Planck 2018 maps for circles and for ellipses of increasing eccentricity, with the low-variance threshold defined relative to that ellipse-specific expectation rather than a per-direction average. The measurement is the abundance of concentric low-variance sets versus eccentricity, for the data and for each simulated sky. If the data show a circularity preference that the simulated skies do not, CCC-C503 is rehabilitated and CCC-C506's objection answered; if the data's eccentricity dependence tracks the simulations, CCC-C503 falls and CCC-C010 gains its one missing piece.
