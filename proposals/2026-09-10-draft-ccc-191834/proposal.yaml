  rationale: "Two sentences in the current article are contradicted by retrieved texts: 'No independent group has ever run the sky-twist test' (DeAbreu et al. 2015 examined it and found it unfair as constructed) and 'no one has ever run the search' for erebon decays (Nielsen et al. 2019 removed the noise-correlation premise; Allen 2020 calculated the signal and found it unobservable). A third passage — the cross-map co-location left standing as undismantled — is not wrong but is now nearly weightless given Jow & Scott's noise result. The Bielewicz low-ℓ account adds a positive conventional mechanism for the ring-centre clustering that the article presents as an open proponent point. Featured claims, crux order, and the assessment verdict are unchanged; the telling is corrected in three places and no new claim ids are cited in prose because provisional ids are renumbered by the verb."
