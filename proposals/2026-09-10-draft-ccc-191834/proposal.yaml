      sourceId: SRC-DEABREU-2015
      direction: undermines
      strength: moderate
      sourceStatement: The source states that GP13 claim a crucial dependence on circularity obtained by a procedure that rotates the sky to produce approximate ellipses, that this 'will entirely change the temperature correlations on the sky', and that the authors 'explicitly tested this and found that the variance profile does indeed depend on the amount of "twist" applied', concluding 'this is not a fair comparison, particularly when using the threshold defined by GP13'. It adds that a proper ellipse study would require computing the expected variance over the full ellipse parameter space, 'much more computationally intensive'.
      editorInference: "This does not re-run the twist test with a fair null; it shows that the test as constructed compares the sky to a differently correlated field under a fixed threshold, which invalidates the inference from the drop. The gap the article describes ('no independent group has ever run the sky-twist test') is narrower than stated: the test has been examined and found methodologically unfair, but never independently re-run with an ellipse-specific null."
      exactLocator: "[p. 7], §3, final two paragraphs (arXiv:1508.05158v3)"
      limitations:
        - DeAbreu et al. report the qualitative dependence of the variance profile on twist but give no figure quantifying how much of GP13's drop it accounts for.
