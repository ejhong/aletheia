  date: 2026-09-10
  answer:
    - The survey and excavations focused on the organization and development of the galactic clusters ~750 to 450 yr B.P.; "Our survey and excavations have focused on the organization" of these clusters.
    - '"After ~500 to 400 yr B.P., early European colonialism resulted in" substantial depopulation and forest expansion.'
    - Twenty-eight prehistoric residential sites have been identified; "We have identified 28 prehistoric residential sites, most or all" of which are associated with two galactic clusters.
    - '"Smaller nonwalled plaza villages are similar in size and form to larger contemporary" villages.'
    - The relation of X6 and X18 to X13 is "similar to the orientation of high-ranking houses in the contemporary Kuikuro village".
721b5fa20ebbddbd5726a772950a26169964fbe29d4ef9784befc631073c215d:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-133640
  date: 2026-09-10
  answer:
    - The distribution of large centers indicates that the "regional peer polity was composed of 15 or more clusters" across an area ≥20,000 km², including sites far to the north and south of the study area.
    - '"We estimate a regional population of" ≥50,000 (>2.5 persons/km²).'
    - 'Note 25 qualifies these figures: "We consider these conservative estimates", with more clusters expected in the vast areas currently uninvestigated, including far northern and southern sites.'
    - Walled towns are estimated to have 800 to 1000 or more persons, "as known ethnographically from adjacent areas" (Nimuendajú, The Apinayé).
    - Smaller nonwalled villages are assigned 250 ± 100 persons each, within clusters estimated at "100 to 150 ha or more of settlement space" and a population in the mid-thousands (≥2500).
08864f2e2169cf22e5c423ee4b4e3ea0c2fa76b34163ac4fca92e9cf42077506:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-133640
  date: 2026-09-10
  answer:
    - The Casarabe culture is dated to around AD 500 to AD 1400, described as the "Casarabe culture (around ad 500 to ad 1400)" in the Llanos de Mojos.
    - In total, "144 radiocarbon dates are available for the absolute chronological dating" of the Casarabe culture, though these come from a limited number of sites.
    - Of the radiocarbon dates, 94 come from the two PABAM sites, "46 from Mendoza and 48 from Salvatierra".
    - Chronological modelling was done by Bayesian analysis of the radiocarbon dates "with OxCal v.4.4.2 and the SHcal20 calibration curve", after two samples were rejected as outliers.
1c818b2c39705f5ca93a71b4db89aa5cef9a5eed6c985785dc7f8e43161d81d1:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-133640
  date: 2026-09-10
  answer:
    - Airborne laser mapping covered six areas with known concentrations of major settlements, "totalling 204 km 2", documenting two large settlement sites and 24 smaller sites.
    - Lidar revealed two remarkably large Casarabe sites, Cotoca at 147 ha and Landívar at 315 ha, "in a dense four-tiered settlement system".
    - The civic-ceremonial architecture of the large sites includes stepped platforms with U-shaped structures, rectangular platform mounds and "conical pyramids (which are up to 22 m tall)".
    - The large settlement sites are "surrounded by ranked concentric polygonal banks" and are connected to lower-ranked sites by straight, raised causeways stretching over several kilometres.
    - '"Massive water-management infrastructure, composed of canals and reservoirs" completes the settlement system in an anthropogenically modified landscape.'
    - '"A 7-km canal brought water from Laguna San José to Cotoca", indicating the scale of landscape management and labour mobilization.'
300821969c8d80e2d790a9fa56914117262671642ff7fec535a91cc212ccfa09:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-133640
  date: 2026-09-10
  answer:
    - The dataset was built by compiling "fossil pollen and charcoal data from 39 lake-sediment records" in Amazonia sensu stricto, excluding peatland or palm swamp settings.
    - Inclusion required that all sites "have a minimum of six fossil pollen samples" within the last 2000 years and appear to be continuous records.
    - Cecropia pollen percentages are shown separately because this tree is "an indicator of site abandonment and early successional forest regrowth".
    - Nine of the 39 records, termed high-resolution sites, are used to provide temporally detailed changes in forest pollen abundances "before, during, and after the Great Dying period (1550-1750)".
1537d5d77380516260dd277e83472dbed49147963b4129b130f851a5664b0360:
