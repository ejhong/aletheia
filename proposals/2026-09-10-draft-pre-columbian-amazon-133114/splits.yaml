  runId: 2026-09-10-verify-pre-columbian-amazon-133640
  date: 2026-09-10
  answer:
    - Airborne lidar mapping covered six areas totalling about 200 km² of the Casarabe culture area.
    - Lidar revealed two remarkably large settlement sites, Cotoca (147 ha) and Landívar (315 ha).
    - The lidar data define a four-tiered hierarchy of Casarabe culture sites.
    - The large settlement sites are connected to lower-ranked sites by straight, raised causeways that stretch over several kilometres.
    - Sites are interconnected by causeways and canals forming clusters encompassing areas from 100 km² to more than 500 km².
c4a3fbdf1bff3586774c93c9742b78329cb056e1afe7e9acc64be2b2efb41a83:
