7a4363e041f2340d6ef2c57cc8706274ef007fd69c492af58a61cbe24b68a440:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-185127
  date: 2026-09-10
  answer:
    - Inspection of 5,315 km² of airborne LiDAR data, originally obtained for estimating aboveground biomass, "revealed 24 unreported earthworks in southern, southwestern, central, and northern" Amazonia.
    - The newly detected earthworks include "a fortified village in southern Amazonia" in the Upper Xingu Basin, defensive and ceremonial geoglyph sites in Acre, features in Amapá, and two riverine earthworks on floodplains in central Amazonia.
    - The inspected LiDAR data also contained nine earthworks "that were already cataloged in archaeological databases".
    - The 33 earthwork records "were seen on 12 of the 861 LiDAR flight lines".
    - Within the inspected LiDAR data, the resulting density was "an estimate of 0.0062 earthworks/km 2".
75f2c33bdeb45ba7270443b0c0a027beded06b75d4dd0e516180b2bd5848c225:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-185127
  date: 2026-09-10
  answer:
    - The model predicts the number of yet undiscovered pre-Columbian structures as 10,272 to 23,648 with 95% probability, "giving an average of 16,187 new sites".
    - Earthworks already documented account for a mere 4–9% of the total, "and that 91 – 96% of Amazonian earthworks remain undiscovered".
    - The statistical analysis was based on "the records of 937 known earthworks complemented by our discoveries" (24 earthworks), with nine selected intensity covariates covering temperature, precipitation, soil, topography, water-table depth and distance to water.
    - Observability covariates (distance to roads and tree cover) were used to describe sample preference, and "the effect of sample selection bias was individually weighted" for each sample.
    - Extrapolating the observed LiDAR density (0.0062 earthworks/km²) to the whole basin gives "over 41,000 earthworks may occur throughout the forest".
    - Because LiDAR covered only 0.08% of Amazonia and "earth-building societies were not evenly distributed across the basin", the naive extrapolation is set aside in favor of more rigorous estimation methods.
4d3ff15d4b1d13d2476cebe189946b91312b32ccddeb842a0a6ded7af78ff66f:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-185127
  date: 2026-09-10
  answer:
    - The predictive model "predicts the number of yet undiscovered pre-Columbian structures as 10,272" to 23,648, with 95% probability, for Amazonia's 6.7 million km² extent.
    - Nearly all the highest-probability cells (≥ 25% predicted probability) occur in a 94,713-km² "rectangle that overlays a significant portion of the Brazilian state of Acre."
b497b95cb66c245b92d5f89ee22e06ecde12b93dbf2e9af576c016fb2d2b8ad8:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-185127
  date: 2026-09-10
  answer:
    - Generalized linear models were used to relate the occurrence and abundance of 79 domesticated tree species "identified across 1,676 forest plots" to the predicted probability of earthwork presence.
    - The occurrence and/or abundance of "53 of the 79 domesticated species showed significant association" with the predictive model of earthwork distribution.
    - The occurrence and/or abundance of 35 domesticated species "increased with the predicted probability of earthwork presence"; the species with the strongest increases include Bertholletia excelsa, Theobroma cacao, and Attalea phalerata.
    - The occurrence and/or abundance of 18 domesticated species decreased with the predicted probability of earthwork presence; the species that "most significantly decreased their responses" are Erisma japura and Oenocarpus bataua.
    - The 53 domesticated tree species significantly associated with earthwork occurrence probability are "likely suggesting past management practices" by pre-Columbian societies.
03b08f6f5738ed783aa80c97d680c30e11b4389f01291840bb14d8a461d001aa:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-10-verify-pre-columbian-amazon-185127
  date: 2026-09-10
  answer:
    - 'Pre-Columbian earthworks have so far been found mainly in cleared land: "pre-Columbian earthworks have mostly been discovered in deforested areas".'
    - 'Observability covariates show that documented earthworks cluster along roads: "previously reported earthworks are mostly found near roads, which facilitate field research".'
    - Of the full set of documented earthworks, "only 9% are located inside indigenous lands and protected areas", whereas 50% of the 24 newly reported earthworks lie in areas with some degree of legal protection.
    - The greatest density of known earthworks lies outside protected areas, "mostly located in the region with the highest historical and current rates of deforestation", called the "Arc of Deforestation".
