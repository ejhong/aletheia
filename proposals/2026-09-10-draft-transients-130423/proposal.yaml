      sourceStatement: The source states that fourteen of the 16 significant cells "showed a transient excess beyond expectations on at least two" plates and 12 on at least three, that the two adjacent cells at 92.5° W (Hotspots 5 and 8) "were associated exclusively with a single plate, XE435", and that requiring plate-level significance leaves 13 cells with ≥2 plates. It concedes that a single plate with many "star-like plate defects (despite ML filtering) could produce an" apparent hotspot in both analyses.
      editorInference: Multi-plate support rules out a single bad plate for most cells but not a shared property of several plates (same emulsion batch, same observing run, same copy generation); the paper does not test plate-run or date clustering. Hotspots 4, 5, 7, 8 — the highest O/E ratios — rest on 1–3 plates each.
