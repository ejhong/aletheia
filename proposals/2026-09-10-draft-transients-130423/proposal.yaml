  research:
    - id: TRN-R010
      title: Leave-one-night-out test of the nuclear-window association among high-probability transients
      summary: Using the Bruehl et al. ML-scored catalog (and, in parallel, Hayes's independently extracted catalog), recompute the ±1-day nuclear-test relative risk after removing the plates exposed on 3 May 1954 (night before Castle Yankee) and 12–13 March 1955, and separately after removing each observing night in turn. Report the per-night distribution of p ≥ 0.90 candidates and test whether the top two nights are outliers in candidate density relative to all POSS-I nights, independent of the nuclear calendar. The hotspot preprint shows 227 of 231 nuclear-associated high-confidence transients come from two tests; if the association vanishes without those nights, TRN-C006 is a two-night plate effect, not a rate effect.
      claimIds:
        - TRN-C006
        - TRN-C122
        - TRN-C123
        - TRN-C124
        - TRN-C103
      track: either
      effortTier: desk
      informationGain: Decides whether the nuclear-window correlation is a population-rate signal or the signature of a handful of anomalous plates; also tests whether those plates are anomalous on non-nuclear grounds (emulsion batch, copy generation, position on plate).
      origin:
        ref: report 2026-09-10-inbox-transients-130416
        extractedBy: claude-fable-5-1
        runId: 2026-09-10-draft-transients-130423
        date: 2026-09-10
    - id: TRN-R011
      title: Robustness of Earth-projected hotspots to altitude, grid, and catalog
      summary: Re-run the Earth-projection excess and cluster analyses (a) at the modelling preprint's own preferred altitude of 20,000 km and at 25,000 km, (b) with shifted grid origins and 2.5°/10° cells, (c) with ≥ 100 random control draws to obtain a silhouette null distribution instead of three draws, and (d) on Hayes's independently extracted candidate list rather than the ML-scored VASCO rows. Report which geographic labels survive each perturbation.
      claimIds:
        - TRN-C118
        - TRN-C120
        - TRN-C121
        - TRN-C105
        - TRN-C106
      track: either
      effortTier: desk
      informationGain: If hotspots move with the assumed altitude or dissolve under grid shifts or on a rebuilt catalog, the geographic clustering is a projection artifact of sky-plane clustering on particular plates; if stable, the clustering rung gains a genuinely new constraint.
