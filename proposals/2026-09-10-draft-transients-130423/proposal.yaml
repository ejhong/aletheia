    - id: TRN-E042
      title: "Hotspot preprint: 16 of 137 Earth-projected 5°×5° cells show a Bonferroni-significant excess"
      claimIds:
        - TRN-C118
      sourceId: SRC-BRUEHL-2026
      direction: supports
      strength: weak
      sourceStatement: The source states that after projecting p ≥ 0.70 transients (Dec > 3°, RA 100–250°) onto a 35,786 km shell and binning against plate-aware random controls, "Of 137 control cells (5° × 5° each) within which" at least 5 transients were expected, "16 cells (11.7%) exhibited a significant excess of transients relative to random control" expectations under Bonferroni-corrected conditional binomial tests; grouped by adjacency "the 16 significant hotspot cells form five spatially distinct regions" (eastern Pacific, southern Gulf of Mexico, SW US, and two isolated Pacific cells). It notes the "control sample itself is biased towards these Pacific regions" and that the cells "should therefore not be interpreted as 16 independent or" uniform hotspots.
      editorInference: An Earth-fixed projection of sky positions at a fixed altitude is a deterministic re-parameterisation of (RA, Dec, time); any excess of candidates on particular plates or plate regions maps to Earth-projected 'hotspots' automatically. Table 1's largest O/E ratios (17.9, 16.6) sit in cells fed by 1–3 plates (Supplemental Table 1). The diagnostic content is therefore the same as the sky-plane clustering question and the result adds no independence.
      exactLocator: "[p. 5] Results; [p. 7]; [p. 6]; [p. 18]; Table 1 [p. 31]"
      limitations:
        - Entirely conditional on the assumed 35,786 km altitude (a different altitude re-maps every position).
        - Same catalog and ML scores; no rebuilt candidate list.
        - Fixed grid; authors call for shifted grids and other cell sizes.
