    - id: TRN-E048
      title: The high-confidence nuclear association reduces to two observing nights
      claimIds:
        - TRN-C006
      sourceId: SRC-BRUEHL-2026
      direction: qualifies
      strength: moderate
      sourceStatement: The source states that of 231 high-probability transients within ±1 day of a test, 203 (87.9%) were all observed on the single night of 3 May 1954 preceding Castle Yankee, and that of the 28 tied to Nevada tests, 24 were tied to the single test of 12 March 1955; because of this, "location specificity was not tested statistically" for the Pacific case and "We did not statistically test location specificity for the Nevada tests".
      editorInference: Roughly 98% of the nuclear-window signal among the team's most trusted candidates comes from plates exposed on two nights. A rate elevation carried by one or two nights is exactly what a bad emulsion batch, a particular observing run, or a copy-generation defect on a handful of plates would produce, and it is what an independent Poisson-per-night model (TRN-E009) would absorb. This is the strongest single qualifier on TRN-C006 the proponents have themselves published; the leave-one-night-out test it invites is proposed as TRN-R201.
      exactLocator: "[p. 11]–[p. 12] Is There Location Specificity…"
      limitations:
        - The paper does not report how many p ≥ 0.90 transients fall on other nights, nor a per-night distribution, so the editor's 'two nights' reading applies only to the ±1-day subset.
      reviewState: ai_extracted
      origin:
