    - id: TRN-E047
      title: "Hotspot preprint: the high-probability nuclear-window sample is dominated by a single plate-night"
      claimIds:
        - TRN-C006
      sourceId: SRC-BRUEHL-2026
      direction: qualifies
      strength: moderate
      sourceStatement: The source reports that 203 of 231 (87.9%) p ≥ 0.90 transients within ±1 day of a nuclear test come from the night before Castle Yankee, "Of the 28 transients associated with these tests" at Nevada 24 come from one test, and that because of this concentration "location specificity was not tested statistically". The authors present the Pacific location of the Castle Yankee transients as location specificity supporting the nuclear association.
      editorInference: For the high-probability subset, the nuclear-window signal reduces to essentially one observing night (3 May 1954) plus one other (12–13 March 1955). A relative risk computed over 107,875 rows and many test windows (TRN-C006) is a different object from two nights' worth of plates; this concentration is what one would expect if a handful of plates carry unusual defect or detection rates, and it is also what one would expect if a real population responded to one very large test. Either way it lowers the effective sample size behind TRN-C006 far below the row count, in line with TRN-E019's point that the association lives in occurrence, not count. The claimed location specificity was, by the authors' statement, not tested.
      exactLocator: "[p. 11]; discussion [p. 16]"
      limitations:
        - Applies to the p≥0.90 subset, not the full working catalog
