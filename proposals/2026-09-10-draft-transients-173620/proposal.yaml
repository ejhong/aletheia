    - id: TRN-E043
      title: "Hotspot preprint: fixed-altitude dependence of projected locations, and a misquoted altitude range"
      claimIds:
        - TRN-C119
        - TRN-C123
      sourceId: SRC-BRUEHL-2026
      direction: qualifies
      strength: moderate
      sourceStatement: The source states that transients were projected onto a spherical shell at geosynchronous altitude using line-of-sight geometry from Palomar and that "all projected locations depended on the assumed fixed altitude". On p. 4 it describes its companion paper's result as suggesting "transients were between 26,371 - 35,786 km above" Earth.
      editorInference: The companion modelling preprint (SRC-VILLARROEL-2026-MODELLING) gives 20,000–35,000 km above the surface, with its χ² estimator preferring 20,000 km; 26,371 km is that paper's geocentric shell radius for a 20,000 km altitude, so the hotspot paper has conflated radius with altitude. More consequentially, every hotspot location is computed at the top of the companion's range; at 20,000 km the same transients project to different Earth cells and the geographic identifications (Sedona, White Sands, Tampico) would move.
      exactLocator: "[p. 19]; misquote at [p. 4]"
      limitations:
        - Single assumed altitude; no sensitivity analysis across altitudes shown
