  answer:
    - The quality-filtered sample is defined by restricting the machine-learning scored transients to p > 0.7, Dec. > 3° and 100° < R.A. < 250°, yielding 11,418 transient candidates and 23,814 control objects.
    - The Earth-shadow deficit becomes stronger at all tested altitudes after applying the quality filtering.
    - At GSO altitude, the deficit increases from 0.517 ± 0.054 in the full sample to 0.768 ± 0.059 in the quality-filtered sample.
6fb74945a2fe3f7f8acfccdb6ccc29f74273e3fd69b4c060e6b9d19f2cfc077e:
  model: claude-fable-5-1
