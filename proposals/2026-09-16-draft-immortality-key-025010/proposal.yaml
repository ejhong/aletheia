    - id: TIK-E028
      title: Ergot lipids in archaeological vessels are read by residue chemists as a cereal marker — including in a ritual context
      claimIds:
        - TIK-C004
        - TIK-C015
        - TIK-C016
        - TIK-C017
      sourceId: SRC-LUCEJKO-2018
      direction: qualifies
      strength: moderate
      sourceStatement: The source presents lipids produced by Claviceps fungi, which it calls "common cereal pests", as a biomarker for the former presence of cereals in vessels; "Out of the 32 vessels analysed by GC/MS, ten vessels" (five Sardinian, four Calabrian, one Sicilian) showed ricinoleic acid, and HPLC/MS matched more than fifty ergot lipid species in them. For the Late Neolithic Sardinian tomb vessels from a ritual-offering context, the authors write that the ergot biomarkers "strongly suggest the use of such pottery for ritual offerings containing cereals". The paper concludes that ergot lipids provide "a unique and relatively recalcitrant chemical signature for cereals".
      editorInference: "Toward TIK-C004 this qualifies rather than undermines: the Pontós report (still unread at the primary) identified ergot fragments, not lipids, and in dental calculus as well as a vessel; but the Lucejko result shows that ergot traces in a cereal vessel — even in a ritual context — are ordinary enough that chemists treat them as a proxy for grain. The diagnostic weight of Pontós therefore rests on whatever distinguishes it from background contamination (concentration, processing, contrast with site-wide grain), none of which the ledger has verified. It also says what a lipid-based assay on Eleusinian ceramics would show: cereal/ergot presence, expected in any barley vessel, not alkaloid processing."
      exactLocator: Abstract; Introduction, para. 2; Results and Discussion, paras. beginning 'Out of the 32 vessels analysed' and 'The information obtained with our analytical approach'; Conclusion — via the PMC open-access copy (PMC5834523)
      limitations:
        - The paper never mentions Pontós, Eleusis, or psychoactive use; the bearing on TIK-C004 is entirely this editor's inference.
        - Different analyte (lipids) and different sites (Italy) from the Pontós identification; a base rate for lipid signatures is not a base rate for sclerotium fragments in calculus.
        - Ten of 32 is a small, non-random sample chosen for cereal-related vessel forms (pithoi, testelli); it is not a survey of ritual vessels.
      reviewState: ai_extracted
      origin:
        ref: report 2026-09-16-report-immortality-key-024154
        extractedBy: claude-fable-5-1
        runId: 2026-09-16-draft-immortality-key-025010
