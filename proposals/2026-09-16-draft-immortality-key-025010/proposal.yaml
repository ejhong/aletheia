  research:
    - id: TIK-R009
      title: Specify lysergamide-targeted analytes, not ergot lipids, for any Eleusinian residue programme
      summary: "Residue chemists already use ergot lipids (ricinoleic-acid triglycerides and estolides) as a marker for cereals in vessels. A lipid-based assay on Eleusinian or Pontós ceramics would therefore report 'barley was here', an expected result for any kykeon vessel, and could not distinguish contaminated grain from a processed preparation. This item asks that TIK-R001 and TIK-R004 be run with targets that could discriminate: LSA, iso-LSA, lysergic acid and their degradation products by UHPLC/Q-TOF-HRMS on interior sherd extracts, with soil and exterior-surface controls, paired with the lipid assay as a cereal control. A lysergamide signal above background, in a vessel whose lipid profile also shows cereal, would move the claim of deliberately prepared ergot in the Eleusinian kykeon (TIK-C007); a cereal-positive, lysergamide-negative result across a curated series would be the first genuine negative at the sanctuary rather than the present untested absence."
      claimIds:
        - TIK-C007
        - TIK-C004
        - TIK-C015
      track: either
      effortTier: lab
      informationGain: "Converts the empty cell at Eleusis into a discriminating test: it prevents a predictable 'ergot present' from being read as a hit and makes a null result informative."
      origin:
        ref: report 2026-09-16-report-immortality-key-024154
        extractedBy: claude-fable-5-1
        runId: 2026-09-16-draft-immortality-key-025010
        date: 2026-09-16
    - id: TIK-R010
      title: Read Juan-Tresserras 2002 (pp. 548–556, 477–481) for what was identified at Pontós and against what background
      summary: "Open the two chapters in Pons i Brun (ed.), Mas Castellar de Pontós (2002), and Juan-Tresserras 2000 (Complutum 11), and record: (i) the identification method for the reported ergot (microscopy of sclerotium fragments, phytoliths, any alkaloid chemistry); (ii) whether the report compares the vessel and dental-calculus finds with grain or flour samples from elsewhere on the site (mills, storage pits) — the contrast that would lift the find above the cereal-marker base rate; (iii) the vessel's form, context and associated residues; and (iv) the excavators' basis (Adroher, Pons & Ruiz de Arbulo 1993, AEspA 66) for the Demeter/Persephone attribution of the sanctuary. A documented site-wide contrast would raise the diagnosticity of TIK-C004 toward TIK-C007; its absence would leave Pontós a barley-vessel with the fungus barley carries."
      claimIds:
        - TIK-C004
        - TIK-C007
      track: publication_prize
      effortTier: desk
      informationGain: Replaces a citation chain with the primary text and decides whether the case's one hard physical datum is diagnostic or background.
      origin:
        ref: report 2026-09-16-report-immortality-key-024154
        extractedBy: claude-fable-5-1
        runId: 2026-09-16-draft-immortality-key-025010
        date: 2026-09-16
    - id: TIK-R011
      title: Audit Kerényi's reading of Phaedrus 250b–c against the text and modern commentaries
      summary: Set Kerényi 1967 (Eleusis, p. 99) beside Plato, Phaedrus 250b–c in Greek and the commentaries of Yunis (2011), Waterfield (2002) and Cosmopoulos (2015), and separately check whether Plutarch fr. 178 Sandbach, Pindar fr. 137 and Sophocles fr. 837 describe an experience during initiation or the afterlife expectations of initiates. Determine whether any ancient text independent of Kerényi's construction attests a transformative experience at initiation. If none does, the antecedent of TIK-C008 is a modern construction and the claim that the 'beatific vision' originates with Kerényi stands; if one does, the phasmata argument is narrowed to Plato alone.
      claimIds:
        - TIK-C008
        - TIK-C018
        - TIK-C019
        - TIK-C020
      track: publication_prize
      effortTier: desk
      informationGain: Decides whether the drug-versus-ritual dispute has a phenomenon to explain, which governs the weight of every mechanism claim above it.
      origin:
        ref: report 2026-09-16-report-immortality-key-024154
        extractedBy: claude-fable-5-1
        runId: 2026-09-16-draft-immortality-key-025010
        date: 2026-09-16
    - id: TIK-R012
      title: Open the other reported ergot-in-vessel and ergot-in-body finds
      summary: "The report names, from a secondary survey that could not be retrieved, further claimed ergot finds: pyxides from the Middle Bronze Age cult area at Portorusso (Otranto) (Aprile & Tiberi 2016), a small vessel from a La Tène burial at Czernikowice, Poland (Łaciak et al. 2023), and the gut contents of Grauballe Man (Stolarczyk et al. 2020), plus the two other archaeological cards the book relies on, a Calvari d'Amposta beer and a Pompeian villa drug-wine (Ciaraldi 2000). Open each primary report and record the analyte (lipids, sclerotia, alkaloids), the context, and whether the analysts distinguished deliberate from incidental presence — in particular any quantitative dose estimate of the Grauballe kind. Together these fix the base rate TIK-R008 needs and test whether Pontós is unique in combining ingestion with a Demeter-linked context."
      claimIds:
        - TIK-C001
        - TIK-C004
        - TIK-C002
      track: publication_prize
      effortTier: desk
      informationGain: Widens or narrows the 'ritual ergot' pattern and supplies models for testing deliberate against incidental presence.
      origin:
        ref: report 2026-09-16-report-immortality-key-024154
        extractedBy: claude-fable-5-1
        runId: 2026-09-16-draft-immortality-key-025010
        date: 2026-09-16
    - id: TIK-R013
      title: Co-administration test of pennyroyal constituents with LSA/iso-LSA
      summary: The 2026 authors propose, and mark as untested, that pulegone and rosmarinic acid from pennyroyal potentiate or prolong the effects of LSA/iso-LSA. The test is a controlled co-administration study — in vitro receptor and MAO-A assays first, then an animal behavioral model — comparing the LSA/iso-LSA mixture alone with the mixture plus pennyroyal extract at ratios matching the reconstructed kykeon. Measured potentiation or prolongation would support the pennyroyal 'entourage effect' claim and bear on whether the full preparation could deliver what TIK-C006 requires; no difference would retire the proposal.
      claimIds:
        - TIK-C032
        - TIK-C006
      track: small_grant
      effortTier: lab
      informationGain: Tests the one mechanism the proponents have added since 2020 before it migrates into the narrative as fact.
      origin:
        ref: report 2026-09-16-report-immortality-key-024154
        extractedBy: claude-fable-5-1
