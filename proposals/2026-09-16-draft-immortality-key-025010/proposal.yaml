    - id: TIK-E033
      title: "The 2026 preprint's fine print: full detoxification only at pH 12.5, 5% w/v, 120 min; ergometrine still present"
      claimIds:
        - TIK-C005
        - TIK-C028
        - TIK-C029
        - TIK-C030
      sourceId: SRC-ANTONOPOULOS-2025
      direction: qualifies
      strength: moderate
      sourceStatement: The source states that LSA and iso-LSA can be generated with complete degradation of toxic ergopeptides "at 5% w/v ergot sclerotia in an initial pH 12.5 lye solution for at least 120 min"; that at initial pH 10.5 or 11.5, across all times and concentrations, "residual toxic ergopeptides were consistently detected"; that in the fully hydrolyzed samples the six predominant ergopeptides and their epimers were absent "while the signals corresponding to ergometrine (Em) and ergometrinine (Emn) were observed"; and that in the ANOVA "Lye pH was the sole significant predictor".
      editorInference: TIK-C005 states the conversion 'can' occur; this record fixes how narrowly. Only the strongest lye, the lowest ergot loading, and the longest reflux gave complete ergopeptide hydrolysis. The persistence of ergometrine (a non-peptide ergot alkaloid, not one of the 'toxic ergopeptides' the claim names) is stated by the source without comment; that ergometrine is pharmacologically active in its own right is this editor's note, not the source's, and belongs to the pharmacological profiling TIK-R003 already calls for.
      exactLocator: Abstract; Results, 'Qualitative analysis of EAs hydrolysis' para. 3 and 'Quantitation' para. 1; 'Modeling and evaluation' para. 1; Discussion, para. 1
      limitations:
        - Preprint text; the published version may differ in wording.
        - Same performance of the experiment as TIK-E008 — not an independent replication.
        - The source does not evaluate the pharmacological significance of residual ergometrine.
      reviewState: ai_extracted
      origin:
