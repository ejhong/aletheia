  answer:
    - "Once the leading questions and spurious parallels are set aside, the hallucinogen theory \"boils down to one key premise\": that Eleusinian initiates had a life-changing 'beatific vision', and \"Everything flows from that.\""
    - 'The premise has no ancient basis: "The beatific vision isn’t in any ancient source. Kerényi invented it."'
    - Kerényi rendered phasmata in Plato's Phaedrus as "'ineffable' and 'holy' 'Phantoms'", and "the three words come from three different ancient writers"; the literal meaning of phasmata is 'things shown', a reference to the sacred deiknumena.
    - "Recent specialists read the phasmata as the deiknumena: \"Cosmopoulos (2015: 23: ‘sculptures illuminated’), Yunis (2011: 151, ‘sacred objects suddenly in view’)\", and Waterfield (2002: 34, 'things shown to us')."
    - Kerényi also misinterpreted Plato's 'blessed sight and spectacle' (μακαρίαν ὄψιν τε καὶ θέαν), translating it as 'beatific spectacle and vision' and arguing "that it’s parallel to a phrase used in mediaeval Christianity", visio beatifica.
    - 'The medieval visio beatifica was not a living experience: "their ‘beatific vision’ wasn’t something you experience while you’re still alive: it’s after death", emerging from the 1320s–1330s Beatific Vision Controversy.'
    - "The conclusion: Plato's 'blessed sight and spectacle' refers to the sacred deiknumena, and \"Kerényi’s Eleusinian raptures are entirely fictional.\""
