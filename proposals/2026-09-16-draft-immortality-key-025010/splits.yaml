  date: 2026-09-16
  answer:
    - Lipids produced by Claviceps fungi, described as "common cereal pests", serve as a biomarker approach for identifying the original presence of Gramineae and indirectly establishing whether vessels were used for cereal storage or processing.
    - '"Out of the 32 vessels analysed by GC/MS, ten vessels" — five from Sardinia, four from Calabria and one from Sicily — exhibited the presence of ricinoleic acid in their fatty acid profiles.'
    - HPLC/ESI-Q-ToF comparison of the lipid profiles of the ten ricinoleic-acid-positive vessels with published ergot profiles "showed an unequivocal correlation, with more than 50 species" that could be related to fungal activity.
    - For the Late Neolithic vessels from the Sardinian tomb, where only animal remains were found and the dromos and anteroom were probably a place for ritual offerings, the ergot biomarkers "strongly suggest the use of such pottery for ritual offerings" containing cereals.
    - The complex and robust chemistry of ergot lipids provides "a unique and relatively recalcitrant chemical signature for cereals" in archaeological vessels, because the low degree of unsaturation of most high molecular weight ergot species protects them from extensive degradation.
31a4fbcc31001c391bf769bfba9b2ffd0229cb5ea3f507afa09a6b8616cdde25:
