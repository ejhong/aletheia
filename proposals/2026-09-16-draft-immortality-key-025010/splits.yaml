  date: 2026-09-16
  answer:
    - '"There’s no evidence of psychedelic drugs at Eleusis."'
    - The ritual drink at Eleusis "was a fairly commonplace porridge" rather than anything unusual.
    - The drink's role in the rite is almost certainly because it "came at the end of a day of fasting", serving as an energy drink for hungry people.
    - 'The most common function attested for kykeons "is medical, as a curative and refreshing draught" (Delatte 1955: 28–29).'
    - "A scholion on the Iliad recipe (sch. B on Il. 11.624) states: \"The drink isn't given for medical treatment, but for refreshment.\""
