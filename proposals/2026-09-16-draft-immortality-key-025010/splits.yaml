  date: 2026-09-16
  answer:
    - 'Ergot fungus, the main candidate for the psychoactive ingredient in the drink, is toxic: it "can cause convulsions, vomiting, diarrhoea, and stroke" and, long-term, gangrene and death.'
    - 'Converting ergot into LSD is extremely difficult: "Using ergot to make LSD is extremely difficult and requires many processes".'
    - Making LSD from ergot requires chemicals "that ancient Greeks definitely did not have access to", including diethylamine and pure hydrazine, the latter being very explosive.
d04191824ed5773715d5bd740b726ad31ade651ea828e30a3541ba15444830ed:
  model: claude-fable-5-1
