  answer:
    - The defining ingredient of a kykeon was barley meal, "well-suited to rites involving Demeter".
    - Two Homeric lists of ingredients (Iliad 11.624–641, Odyssey 10.234–236) "also include honey, wine, and goat cheese".
    - The version of the kykeon used at Eleusis "contained pennyroyal and expressly did not contain wine" (Hymn to Demeter 206–209).
