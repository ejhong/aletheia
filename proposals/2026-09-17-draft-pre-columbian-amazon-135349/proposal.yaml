      sourceStatement: Rostain et al. date the Kilamope/Upano "occupation from around 500 BCE to between 300 and 600 CE", and add that some mounds were "reoccupied after a hiatus by groups of the Huapula culture" between 800 and 1200 CE, followed by Shuar groups.
