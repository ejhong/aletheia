  research:
    - id: AMZ-R007
      title: Read the Biblioteca Nacional manuscript of Laureano de la Cruz to fix the Omagua headcount garbled in the 1900 edition
      summary: "Object: the 62-folio manuscript of Laureano de la Cruz's 'Nuevo descubrimiento del río de Marañón' in the Biblioteca Nacional de España (the 1900 Madrid editor's source), and a page image of p. 94 of the 1900 edition. Measurement: the exact numeral the author gives for the men found in the Omagua province ('no hallamos ... indios cabales'), which the Internet Archive OCR renders as '10', together with any marginal or textual variants; secondarily, confirm the 34-village count and the 200-league extent. Decision rule: if the manuscript reads a figure in the low thousands (as a tertiary snippet gives, ≤5,000), the province held roughly 1,000–2,500 households in 1650 and the proposed claim on Laureano's 34 villages can carry a number; if it reads tens or hundreds, the Omagua corridor was near-empty a century after Carvajal and the murdered-world reading of AMZ-C017 gains a dated resident witness; either way the result moves AMZ-C010's geographic reach (Solimões vs upper-Amazon provinces) and supplies the 1650 point in the province timeline. Also record whether Laureano gives any village count for the reaches below the Putumayo mouth he did not visit."
      claimIds:
        - AMZ-C017
        - AMZ-C010
      track: small_grant
      effortTier: desk
      informationGain: Converts an OCR-uncertain figure into the only seventeenth-century resident headcount for Carvajal's Omagua reach; distinguishes 'a province of a few thousand' from 'a province of a few hundred' in 1650, which is the magnitude the modest-skeptic and murdered-world accounts disagree about.
      origin:
        ref: report 2026-09-17-report-pre-columbian-amazon-134558
        extractedBy: claude-fable-5-1
        runId: 2026-09-17-draft-pre-columbian-amazon-135349
        date: 2026-09-17
    - id: AMZ-R008
      title: Calibrate palaeoecological erasure against time since abandonment using sites with dated occupation ends
      summary: "Object: sediment or soil profiles adjacent to Amazonian occupation sites whose end dates are archaeologically fixed — Upano (occupation ending 300–600 CE, with Huapula reoccupation to ~1200 CE), Casarabe (~1400 CE), Belterra Plateau near Santarém (to the seventeenth century), Marajó Cacoal (to ~1650) and Upper Xingu (to ~1770). Measurement: in each profile, the presence and magnitude of anthropogenic indicators (crop phytoliths, charcoal influx, soil-nutrient and pottery-fragment signals, disturbance-taxon pollen) in the occupation-age horizons versus the post-abandonment and Colonial horizons, scored by a common protocol, then plotted against years since abandonment. Decision rule: if sites abandoned 350–400 years before present retain clear occupation signals while Upano's ~1,000-year-old signal is lost, then the erasure documented at Upano (AMZ-C022) is time-dependent and cannot be used to discount contact-era palaeoecological negatives in reaches depopulated in the 1600s, strengthening AMZ-C014's negatives for those reaches; if signals are also largely erased at the ~400-year sites, AMZ-C022 applies generally and AMZ-C014's negatives in terra-firme settings are weakened as evidence of absence; an intermediate result yields a decay curve that grades the negatives by age."
      claimIds:
        - AMZ-C022
        - AMZ-C014
      track: either
      effortTier: lab
      informationGain: Turns the 'time-graded erasure' argument from an analogy into a measured decay function, deciding how much weight contact-era palaeoecological absence can bear.
      origin:
        ref: report 2026-09-17-report-pre-columbian-amazon-134558
        extractedBy: claude-fable-5-1
        runId: 2026-09-17-draft-pre-columbian-amazon-135349
        date: 2026-09-17
