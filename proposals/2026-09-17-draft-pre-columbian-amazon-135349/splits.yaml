  answer:
    - Archaeological excavations date the Upano Valley "occupation from around 500 BCE to between 300 and 600 CE".
    - The original building of earthen platforms and roads "took place between ca. 500 BCE and 300/600 CE" and was carried out by groups from the Kilamope and later Upano cultures.
    - The hypothesis that the Upano culture came to an abrupt end after a massive Sangay eruption ca. 400–600 CE "has been called into question by the disparity of radiocarbon dates" obtained recently for these levels.
d87b218ae0e304ce8309d7b8ac2652daff601e4474ec26714736c7e1adc64b34:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-17-verify-pre-columbian-amazon-140447
  date: 2026-09-17
  answer:
    - Some mounds were "reoccupied after a hiatus by groups of the Huapula culture" between 800 and 1200 CE.
    - Huapula ceramic is "characterized by decorations based on the corrugated modality using wavy patterns".
    - Huapula ceramic "marks the appearance of modern Jivaroan-speaking populations in the region".
    - Shuar groups "follow the Huapula of whom they are the direct heirs", and since European contact the Upano basin has been occupied by Shuar groups of the Chicham-Aents culture.
904ce8fad2c7e7c324da8729485f35f183da6ce0c42bd456702a1033cefcdb0d:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-17-verify-pre-columbian-amazon-140447
  date: 2026-09-17
  answer:
    - LiDAR analysis, going well beyond the field identification of some individual features, "enabled the detection of over 6,000 platforms within the" 300-km² study area.
    - The platforms have a standard shape that is rectangular (with a few circular), "about 20 x 10 m with a preserved elevation of" 2 to 3 m.
    - Platforms are rarely isolated and typically occur in groups or complexes "of three to six units around a plaza, often with" a central platform.
    - The average density of platforms across the area is 16.6 per km², "but some agglomerated areas have densities above 100" features per km².
016ceedbfd4c6ce6a9ee2cf166c39207db798de49a7e8b6b38529e9f106c5444:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-17-verify-pre-columbian-amazon-140447
  date: 2026-09-17
  answer:
    - Other monumental sites of Amazonia are all more recent than the Upano sites and "significantly less dense in terms of features", and, until proven otherwise, not embedded within such a vast and dense communication network.
    - The two-thousand-year-old society of the Upano valley constitutes "the earliest and largest low-density agrarian urbanism ever documented" in the Amazon so far.
    - Several elements suggest the settlements were exposed to threats, including "peripheral ditches blocking access to some settlements" (e.g. east of Sangay) and obstructed roads near some large complexes (e.g. Copueno).
