    - id: AMZ-E078
      title: Medina quotes Sámano's 1543 letters attesting a very large relación of the voyage sent to court
      claimIds:
        - AMZ-C066
      sourceId: SRC-CARVAJAL-1542
      direction: supports
      strength: moderate
      sourceStatement: Medina prints two letters of the secretary Juan de Sámano to Francisco de los Cobos (Simancas, Estado, leg. 61, fols. 208 and 213). The first, dated 31 May 1543, reports one arrived from Peru who came down a river "por mil ochocientas leguas y salió al Cabo" de Sant Agustín; the second (June 1543) says the memorial and relación of the voyage was not enclosed "porque se traslada y es muy grande". Medina concludes from these that Orellana presented a long relación of his voyage to the Consejo de Indias.
      editorInference: Medina reproduces the letters rather than the relación itself; the archival citations are his and were not checked here. The existence of a separate, self-interested captain's narrative circulating at court in 1543 is a candidate channel for number inflation independent of Carvajal's text — a possibility, not a demonstrated fact.
      exactLocator: Medina 1894, Introducción, pp. xxxiii–xxxiv (archive.org djvu full text of descubrimientod00carvgoog)
      limitations:
        - Secondary transcription of archival letters not seen directly.
        - Medina's inference that the relación reached the Consejo de Indias is his; the letters speak of a memorial being copied for Cobos.
      reviewState: ai_extracted
