rationale: "The report's bounded pass reached seven texts the ledger had never held: the excavators' own note on Pillar 43 (Schmidt 2006), three Tepe Telegrams posts by the excavation team (Pillar 43 with its comments, the enclosure animal emblems, Urfa Man), the abstract and reference list of the Jiroft wear-trace study, the abstract of the Hoa Hakananai'a study, and Berossus's fragments in the Verbrugghe–Wickersham translation; it also reached a blog transcription of Wiggermann 1992 on the banduddû. Each is proposed as a source with evidence records extracted only from the retrieved text, one observation per record, and with new observation-rung claims where the text states a proposition the catalogue lacks (the excavators' 'handle-like attachments' and their rival building reading of the three forms; the Jiroft wear read as hanging against a cloth-covered vertical surface, on one object, with a 'weights' literature behind it; the Rapa Nui sequence komari → birdmen read against ethnohistoric myth; Berossus's fish-bodied, nightly-commuting Oannes in a series of fish-men; Urfa Man's grasping hands, necklace and findspot). The Wiggermann transcription enters as weak support with its secondhand status stated, because a verified observation is not dropped silently; the primary is blocked. Pausanias was not retrievable (HTTP 522) and is blocked; the Wikipedia article is set aside as tertiary, used only to name Symmes 2010 and Kosen 2019 as the route for the toponym claims. No verdicts are proposed; grading belongs to assessments. An edition candidate is offered because the current article's load-bearing sentence — that none of the primary literature the page leans on has been read — is no longer true, and its handled-objects, Rapa Nui, civiliser and hands sections now have primary statements to stand beside the captions."
