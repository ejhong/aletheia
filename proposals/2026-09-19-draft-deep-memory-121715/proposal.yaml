  article: |-
    ## The pattern people see

    Set the pictures out in a row and the resemblance does its work before anyone has made an argument. An eagle-headed figure strides across a palace wall from Nimrud with a bucket in one hand and a cone in the other. A vulture spreads its wings on a Neolithic pillar at Göbekli Tepe, and along the pillar's top edge sit three arched shapes with handles. A seated man on an Olmec boulder from La Venta holds a small bag inside the coils of a crested serpent. Two bird-headed men face one another on the back of a statue taken from Rapa Nui. A netted stone at Delphi marks the navel of the world; so, in their own languages, do places in the Andes and the Pacific. A teacher comes from the sea, brings the arts, and leaves. A flood drowns everyone but a few.

    {plate:IMG-DEEP-P01}

    The eye reads these as kin. The question is whether history does — and how one could tell. The founder's Deep Memory pages ask it without answering it, and their working rule is the one this case adopts: [the historical meaning of a visual resemblance depends on the objects' dates, contexts, differences and possible connections, not on the resemblance alone]{claim=DEEP-C002}. What follows applies that rule to a ledger that has, for the first time, begun to hold the objects' own literature.

    ### How thin the ground is — and where it has thickened

    Until this sitting every evidence record in the ledger came from one source: the founder's own home page, a self-published web essay that describes itself as AI-assisted and reports five investigations its author ran. The method calls this a *self-report* — an author's statement of an unaudited result, with data and code not in hand — and admits it as weak support at most. That source is still the only footing for the five experiments. But the primary literature the page leans on has now been opened in part: the excavators' first published note on Pillar 43 and three posts by the excavation team, the abstract of the wear-trace study of the Jiroft object, the abstract of the published study of the Rapa Nui statue, and Berossus's Oannes fragments in a scholarly translation. Each says something the captions do not, recorded below. What has still not been read: the Assyrian ritual texts in their edition (seen only through a blog transcription of one page), Pausanias and Strabo on Delphi, Garcilaso on Cusco, the first record of the Rapa Nui island name, the full texts behind the two abstracts, and anything on La Venta, Tiwanaku or the flood corpus. Grades are set by the assessment, not here; the article reports what records now exist.

    ## Four accounts, set side by side

    The founding pages name four explanations and insist that more than one can be true in different cases. This edition treats them as the live accounts.

    - **A common source.** The forms and stories descend from one ancestor and were carried outward. In its strongest version — the lost-civilisation account — that ancestor is an unknown society of great age and capability whose emissaries taught the rest. It predicts that specific composites (this pose with this object in this arrangement; this arrival, teaching and departure in this order) recur across the compared cultures more often than chance, and that the oldest examples cluster near the source.
    - **Long-distance contact.** Particular cultures met and exchanged images or stories, with no single ancestor. It predicts dated intermediates, a plausible route, and resemblance strongest where the route runs.
    - **Independent invention, or convergence.** Similar bodies, animals, materials and practical problems make similar forms; similar disasters make similar stories. It predicts that the broad classes are common everywhere, that a handle or a folded hand appears wherever carvers face the same problem, and that specific composites do not travel together more than comparison bundles do.
    - **Later retelling.** Much of the resemblance is made after the fact: by translation, by borrowing after contact, by comparative writers who smooth different stories into one biography, and by selecting matching examples from a very large pool. It predicts that similarity grows between an original account and its modern summary, and that details of a famous version turn up unevenly, where that version was preached.

    The themes follow in turn: what the ledger holds for each account, and what observation would decide between them.

    ## Bird-men

    {plate:IMG-DEEP-P10}

    The gallery runs from the shaft scene at Lascaux — a stick-figure man with a bird's head falling beside a wounded bison, a bird on a staff nearby — through Egyptian gods and Assyrian genii to costumed dancers in the Americas and the birdman cult of Rapa Nui. The founding pages supply the first objection themselves: [the description “bird-man” groups at least three distinct ideas — a deity with a bird's head, a person wearing feathers, and a person transforming into a bird]{claim=DEEP-C004}. If the compared images fall into different ones of these, the parallel is not one resemblance but three weaker ones. No evidence record has yet sorted the images.

    {plate:IMG-DEEP-P05}

    The Rapa Nui example is where dates bite. Hoa Hakananai'a, the basalt moai taken from Orongo, carries on its back two facing birdmen, a ring and girdle, komari and paddles. The claim that matters is that [the birdman carvings were added later than the statue's manufacture]{claim=DEEP-C059}. The published study of the statue, read at abstract level this sitting, gives the sequence: a statue made to stand in the ground, then two komari petroglyphs added, then the bas-relief carvings succeeding them — and it reads those reliefs as a single composition narrating the island's birdman myth as recorded in the nineteenth and early twentieth centuries. So the Rapa Nui leg of the comparison is not only an ocean from Lascaux and Nimrud but later than the statue it decorates, and its reading rests on ethnohistoric text, not on anything prehistoric. The abstract gives no absolute date for the statue and does not itemise the tern, paddles, ring or girdle; those wait on the paywalled body or the British Museum record.

    The catalogue experiment gives the other half. It reports that [a broad bird-person motif class occurs in 55% of 926 sampled traditions]{claim=DEEP-C005}. A *base rate* is how often a thing occurs in the population at large; a motif found in more than half of all sampled traditions is one you would expect to meet in any two cultures picked at random. That number, if it holds, is the strongest reason in the ledger not to be surprised by a bird-man in two places. But the page qualifies its own figure twice, and the ledger records both: the catalogue's coverage is uneven, particularly for the ancient Near East and Rapa Nui — the very regions compared — and broad narrative categories are not the specific images or place names in the claim. That composite, not the class, is what a common-source account needs, and no one has counted it.

    ## The handled objects

    {plate:IMG-DEEP-P02}

    Four objects make the comparison: the three arched forms on Pillar 43, the bucket carried by the Assyrian genii, the carved chlorite objects from the Halil Rud valley in Iran, and the small pouch held by the seated figure on Monument 19 at La Venta. Their outlines rhyme; the founding pages say so, and this edition agrees they are worth close looking. Then the pages make the distinction the theme turns on: [shape and function are separate questions]{claim=DEEP-C065}.

    The four are not on the same footing, and this sitting can say what footing each is on. For the Assyrian object, [ritual context supports a bucket-and-purifier interpretation]{claim=DEEP-C044}: the *banduddû* is [named in ritual texts]{claim=DEEP-C043}. The one text reached for this is a blog's transcription of a page of Wiggermann's 1992 edition, which says the word unquestionably denotes the bucket held by the relief figures, that it was filled with water, and that the exorcist sprinkles that water over the man; it enters as weak support, secondhand, until the printed page is read.

    For the Göbekli forms, the excavators' own record has now been read. Klaus Schmidt's 2006 note describes, above the vulture, three big, similarly carved box-like objects with handle-like attachments, each accompanied by an animal. Ten years later the team's blog offered a reading that is not a handled object at all: the three forms might be the enclosures themselves seen from the side, rectangle for perimeter wall and cupola for roof, each marked with its group's emblematic animal — while admitting this would be an oddly schematic view for a site of naturalistic images, and concluding that no final decision on their meaning is possible. That is the record behind the claim that [the function remains uncertain]{claim=DEEP-C012}. The comparison thus sets a known bucket beside three shapes their diggers do not read as buckets and may read as buildings. Were the forms shown to be containers, the resemblance would gain a rung; were the building reading to prevail, the Göbekli leg would fall away.

    {plate:IMG-DEEP-P04}

    The Jiroft object is the one case where function has been tested physically. The page's caption says the chlorite “handbag” in the National Museum of Iran [shows wear on its handle consistent with having hung on a cord]{claim=DEEP-C009}, and points to the wear-trace study by Vidale and Micheli. The study's abstract, now read, says what the caption says and more: wear on the handle and along the contour, read as long suspension on a cord during which the object was polished by rubbing against a soft surface, most probably a vertical one covered with cloth — an object that hung against something, not a bag carried in the hand — and the authors add that the inference rests on a single object and is far from granted. Their reference list also shows that specialists have classed these objects as “weights”, a reading not in the ledger until now. The caption is faithful; the earlier edition's phrase “hung container” was not what the study says.

    {plate:IMG-DEEP-P03}

    At La Venta, the figure's pouch is [usually read as an incense bag]{claim=DEEP-C010}, and the serpent framing him is [often called the earliest known feathered serpent]{claim=DEEP-C003}. Neither reading has an evidence record.

    What would move the theme: a handle is a practical solution that can recur wherever people carry things. What a common-source account needs, and convergence does not predict, is that the *particular* handle — its attachment, its proportion to the body, its decoration, the figures beside it — recurs across the compared objects more often than across a control set of handled containers from cultures known to be unconnected. The sharper point this sitting adds is that at least two of the four may not be containers at all, so there may be no single functional class to have converged or been transmitted.

    ## Pigs, lizards and other stone animals

    A low body, a raised back and a projecting snout make a boar legible across any distance; splayed limbs and open jaws make a crouching predator. The ledger's observation that the Göbekli Tepe excavation team's discussion of Enclosure C [distinguishes boars from snarling predators]{claim=DEEP-C045} now has both halves from the team's own texts: Schmidt's note reports a snarling predator found in situ on Pillar 27 of Enclosure C, animal and pillar in one piece, and the team's post on animal emblems says boars prevail in that enclosure, as snakes do in A, foxes in B and birds in D. The same post lists “quadruped reptiles” among the species depicted — the excavators' term for what the founder's page, rightly cautious, calls “lizards” only as a proposed identification. Nothing in this theme is graded; the useful next comparison remains with securely identified pig and boar sculptures rather than with whatever looks alike.

    ## The navel of the world

    {plate:IMG-DEEP-P06}

    The linguistic parallel is the most evocative and, on inspection, the most fragile. Delphi's *omphalos* — the netted stone said to mark where Zeus's eagles met — is Greek and ancient. Cusco is glossed as the navel of the Inca world in Garcilaso's account, written after the conquest. Rapa Nui is Te Pito o te Henua, and a smooth stone near Ahu Te Pito Kura carries a name [glossed as “navel of light”]{claim=DEEP-C019}. Göbekli Tepe means “navel hill” in Turkish.

    The founding pages' own claim is the crux: [these are different kinds of evidence, differing in language, date of first record and whether the ancient builders used the name]{claim=DEEP-C018}. None of the four source histories was reached this sitting: Pausanias on the omphalos could not be retrieved, and Garcilaso and the first record of the island name were not opened. The sharpest test is the Turkish name. If [the modern Turkish name Göbekli Tepe describes the shape of the mound]{claim=DEEP-C015}, it is a descriptive toponym given long after the builders were gone. The page adds that [the Kurdish names for the site mean “wish hill”]{claim=DEEP-C016}; the primaries for both glosses have been named but not read, and the second item of the research order traces all four names to their first attestation.

    ## Hands on the belly

    {plate:IMG-DEEP-P07}

    [Arms and hands are carved on the central T-pillars of Enclosure D at Göbekli Tepe]{claim=DEEP-C023}; the shaft is a body and the T a stylised head. Urfa Man, a life-size limestone statue with dark inlaid eyes, [holds its hands over the genitals]{claim=DEEP-C021} — and the excavation team's own description, read this sitting, sharpens the caption: both hands seem to *grasp* the penis; the statue is not from Göbekli Tepe but from construction work at Urfa-Yeni Mahalle, with no find context recorded; the V-shaped lines on the chest are read as a necklace; and the team calls it the oldest known statue of a man. The moai of Ahu Tongariki, carved some ten millennia later, meet their hands low on the abdomen above the belt. The Ponce monolith at Tiwanaku [holds its hands to the chest]{claim=DEEP-C050}, one of them around [a snuff tablet]{claim=DEEP-C051}.

    {plate:IMG-DEEP-P08}

    The founding pages make the observation the eye skips: a hand across the abdomen and a hand at the groin are close in outline but different observations — and a hand grasping is different again from a hand resting. They offer convergence in its plainest form. [Carving limbs against a stone body can protect them from breakage]{claim=DEEP-C046}, so [material constraints are a plausible contributor to the hands-on-body pose]{claim=DEEP-C047}. Equally, [material constraint as a contributor to the pose does not settle its symbolic meaning]{claim=DEEP-C048}: a constraint explains why hands rest against the body, not why at the abdomen rather than the groin or the chest. The deciding observation is a survey of stone figures in the same media from cultures with no possible connection.

    ## Serpents, and the feathered serpent

    {plate:IMG-DEEP-P12}

    Snakes are everywhere in the gallery: coiled around the Olmec figure at La Venta, gripped by the hero on the Jiroft object, projecting in feathered collars from the Temple of the Feathered Serpent at Teotihuacan. The catalogue experiment reports [a broad cosmic-serpent motif class in 37% of sampled traditions]{claim=DEEP-C025} — another high base rate, on the same self-reported footing as the bird-men figure. The feathered serpent of Mesoamerica is a much more specific thing than “snake”, and any comparison worth making has to preserve the feathers, the head, the body's arrangement and its relation to a human figure.

    The page adds the point that governs both catalogue results: [a catalogue's geographical distribution of a broad motif class cannot by itself distinguish independent invention from very old transmission]{claim=DEEP-C026}. Telling them apart takes dated intermediates or a model with stated assumptions. This sitting recorded the first named candidate for an intermediate, from the diggers themselves: asked about Assyrian bird-gods, the Göbekli excavator replied that there is evidence some of the site's imagery survives into later Neolithic seal images, but that there are far too many “missing links” to be sure how far, or with what change of meaning. A local continuity within Anatolia is a testable proposition of a different kind from a chain to Nimrud, and a research item now proposes the test.

    The catalogue experiment's headline is the most consequential thing in the case and the least tested. It reports that [the three broad motif classes — birds, serpents, sacred centres — are each widespread]{claim=DEEP-C056}, and that [their bundle does not stand out against the study's documentation-preserving comparisons]{claim=DEEP-C057}. If the second holds, finding birds, serpents and a sacred centre together in a tradition is no rarer than finding any comparable trio of common motifs — which convergence predicts and a common source does not. But the ledger contains no record supporting that finding, only the page's two qualifications of it. The bundle claim's data are what this edition would most like to see.

    ## The people who brought the arts

    {plate:IMG-DEEP-P09}

    The narrative parallel is as arresting as the visual one. A figure arrives, often from the sea; teaches writing, agriculture, law or craft; changes human life; departs, sometimes promising to return. Oannes in Babylonia, Viracocha in the Andes, Quetzalcoatl in Mexico and Bochica among the Muisca recur in the comparison. The founding pages' caution is that the exact arrival, teaching and departure have to be read in each account, not supplied by a composite biography.

    This sitting read one of them. In Berossus's first fragment, as Syncellus preserves it from Alexander Polyhistor, a monster named Oannes comes up from the Persian Gulf with the whole body of a fish, a human head beneath the fish's head and human feet joined to the tail; it spends its days with men, eating nothing, teaching writing, mathematics, how to build cities, found temples and make laws, how to divide land and plant and harvest — and at the end of each day it goes back to the sea and spends the night there, being amphibious. Its form, the fragment says, has been preserved in sculpture to this day. A later fragment adds four more such fish-men under one king and one named Odakon under another, and the translators' table sets Oannes beside U-An, first of the seven apkallu in a tablet from Uruk. That is the footing now behind the page's claims that [the fish-cloaked figure is the apkallu type the texts actually name]{claim=DEEP-C052} and that [Berossus's Oannes corresponds to it]{claim=DEEP-C053}; the tablet edition itself has not been opened. And it is the clearest instance in the ledger of the retelling mechanism working on a specific original: the Oannes of the fragments does not arrive once, teach and depart promising to return; he commutes nightly and is one of a series. The composite biography is a compression. That is the process [stories can become more alike than their originals through translation, borrowing and comparative writing]{claim=DEEP-C034} describes, seen in one case.

    {plate:IMG-DEEP-P11}

    At Tiwanaku, the staff-bearer with the rayed head in the centre of the Gate of the Sun is often called Viracocha. The page's claim is that [that identification is a modern one]{claim=DEEP-C028}. Unrecorded still.

    The one measured result in this theme is the founder's V1 lineup experiment. AI judges were shown a civiliser account and asked to pick its partner from a lineup; [the claimed partner ranked first in 62.5% of completed lineups, against 9% for random pairs]{claim=DEEP-C027}. That is a real signal under the experiment's conditions, and the only evidence record in the ledger pointing toward a resemblance beyond base rates. The retelling account's reply is now concrete: a lineup of modern summaries measures the similarity of modern summaries, and the ledger holds one original whose shape differs from its summary. The decisive experiment leads this edition's research order: rerun the lineup with human raters on unrecognisable passages from the sources — Berossus via his excerptors, the early Andean chroniclers, Sahagún, Simón — against random hero narratives, coding the Oannes item from the fragment's actual structure, and see whether 62.5% survives.

    The lost-civilisation account attaches to these figures its strongest claims. The page's answer, adopted here on priors, is that [similarity between motifs alone cannot establish a lost-civilisation account's claims about the source's identity, date and capabilities]{claim=DEEP-C035}. Nothing read this sitting supplies evidence of that other kind.

    ## What survives the water

    Flood stories raise several questions at once: whether people remember local disasters, whether particular stories travelled, and whether traditions preserve much older environmental knowledge. The founder's text-coding pilot had an AI code the details of 263 flood-story summaries. It reports that [the coded details cluster by region]{claim=DEEP-C031}, that [details associated with Genesis are unevenly distributed]{claim=DEEP-C054}, and that [generic flood motifs are widespread]{claim=DEEP-C055}.

    Each of the four accounts can live with regional clustering. The uneven distribution of Genesis details is the more pointed finding, because it is what the retelling account predicts — and yet, as the page says, recording a story after contact does not establish that it was borrowed. None of the three claims has an evidence record, and the pilot coded one compiler's summaries rather than a representative collection of original accounts. What would move them: the coded data released and re-coded by human readers against original texts, with the Genesis-associated details dated, where possible, to before or after missionary contact.

    ## Indus and rongorongo

    The companion project compares the sign inventories of two undeciphered scripts and the illustrations used to connect them. Its governing claim is the one this case would apply everywhere: [a visual resemblance between signs of two undeciphered scripts does not establish shared sound, meaning or descent]{claim=DEEP-C036}. The ledger holds the principle and none of the companion's results.

    ## When resemblance becomes evidence

    Can the resemblance people see be measured at all? The founder's three image pilots tried to make AI judges rank objects by likeness. The page reports that [judges disagreed strongly with one another about the same objects]{claim=DEEP-C037}, and that [matching the kinds of objects in a lineup changed the lineup result]{claim=DEEP-C038}.

    The second is the more important. *Diagnosticity* is how much an observation decides between rival explanations. If a lineup that pits a pillar against a moai, a relief and a boulder ranks them one way, and a lineup of pillars against pillars ranks them another, then part of the original resemblance was an artefact of comparing unlike kinds — a finding about every side-by-side gallery, including the one that opens this article.

    ## Where this leaves the question

    Read strictly, the ledger says this. The broad classes — bird-people, cosmic serpents, sacred centres — are reported as each widespread, on the founder's word alone; whether the specific composites are rarer than chance has not been counted. The one positive signal, the civiliser lineup, awaits the test that would separate it from what the retelling account predicts, and the ledger now holds one original — Berossus's Oannes — whose shape is not the composite's. The four navel names remain untraced. The object-level ground has thickened: the diggers call the Göbekli forms handle-like and may read them as buildings; the Jiroft wear is read as hanging against cloth, on one specimen, with a “weights” literature behind it; the Rapa Nui birdmen follow the komari, which follow the statue, and are read against a myth recorded in the nineteenth century; Urfa Man grasps rather than rests. None of this reaches the shared-past hypothesis directly; most of it lowers the specificity of the resemblances it relies on.

    The verdict remains *unresolved*, chosen rather than defaulted to. It means the featured hypothesis — that the resemblances record a shared past — has neither support nor refutation in the ledger. It does not mean the evidence is balanced: such evidence as there is leans, by the founder's own report and now by the objects' own literature, toward base rates, convergence and retelling.

    What would change our mind, in either direction:

    - A blind human lineup of original civiliser passages that beats random pairs by a margin like V1's — or one that does not.
    - A count of specific composites across the compared objects and a kind-matched control set.
    - The four navel names traced to first attestation, with the builders' usage documented or shown absent.
    - The team's later publications on Pillar 43 read for whether the building reading stands; the full texts of the Jiroft and Rapa Nui studies; Wiggermann's page in print.
    - Atakuman's seal corpus checked for the specific Göbekli motifs — the one intermediate class anyone has named.

    The best argument for the shared past that this edition does not answer: the catalogue experiment's null result, by the page's own admission, tests broad classes rather than the specific images in the claim — so the strongest evidence against a common source has not actually been aimed at it — and the lineup signal, whatever its limitations, is a measurement, where the critics have so far offered reasons and one counter-example. Both are fair. Both point to the same thing: the next steps are small, cheap and named, and this case waits on them.
