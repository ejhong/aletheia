    - "The 'Urfa man' has a face, in contrast to the cubic and faceless T-shaped pillars: \"the 'Urfa man' has a face, eyes originally emphasized\"."
    - The statue's eyes were originally emphasised by obsidian inlays, with "segments of black obsidian sunk into deep holes".
    - The statue has ears, but "a mouth, however, is not depicted".
    - Legs are not depicted; instead "below the body there is only a conical plug", which allows the statue to be set into the ground.
    - "The statue's hands are positioned at the genitals: \"Both hands seem to grab his penis\"."
