  answer:
    - 'Under Ammenon the Chaldean the monster Oannes, the Annedotos, appeared from the Persian Gulf, and the sources disagree on the timing: "Alexander Polyhistor" "claims he appeared in the first year, Berossos after forty saroi", while Abydenos makes him the second Annedotos appearing after twenty-six saroi.'
    - During the reign of Daonos, the shepherd from Pautibiblon, four more monsters appeared from the Persian Gulf "with the same form as those mentioned above, a mixture of man and fish".
    - During the reign of Euedorankhos of Pautibiblon there appeared from the Persian Gulf "another man-fish being whose name was Odakon".
    - Odakon "explained in detail what Oannes had originally said in summary fashion"; Abydenos says nothing about him.
09311628a8b67b4a241b5b5739a13519f26d40f8c3e37196037240b2cceebfb7:
