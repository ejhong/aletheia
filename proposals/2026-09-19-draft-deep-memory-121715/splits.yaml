  answer:
    - Table B.2a pairs Berossos's antediluvian kings with the wise monsters he records (Oannes under Aloros, then Annedotos, four monsters, and Odakon); the tables are given as a reference for these, "tables B.2a-b for a list of the monsters Berossos records".
    - "Table B.2b sets Abydenus's list of kings and monsters (Oannes presumed, 2nd Annedotos, Euedokos, Eneugamos, Eneuboulos, Anementos, Anodaphos) beside Berossos's, Abydenus being a historian dependent on Berossos: \"Only Berossos and Abydenos (see chap. 4, table B.2b)\"."
    - A third column from Tablet W 20030,7 lists Mesopotamian kings (Aialu, Alalgar, Ammelu Anna, Ammegal Anna, Enme Ushumgal Anna, Dumuzi, Enmeduranki) alongside their sages, headed "Apkallu (Monsters) UAn U Anduga Enmeduga" and continuing with Enmegalamma, Enmebulugga, Anenlilda, Utuabzu.
    - The tablet column is drawn from Jan van Dijk's publication of the Uruk-Warka inscription finds in the report edited by Lenzen, cited as "Ausgrabungen in Uruk-Warka (1959/1960), Heinrich J. Lenzen (Berlin 1962), 43-61."
