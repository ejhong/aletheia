    - "The 'Urfa Man' is not from Göbekli Tepe: the post answers a common question with \"no, he is not from Göbekli Tepe\"."
    - He was found during construction work in the area of the Pre-Pottery Neolithic site at Urfa-Yeni Mahalle / Yeni Yol, "broken in four nearly equal pieces".
    - Photos of the construction work seem to show that the largely destroyed settlement "featured a small T-shaped pillar", similar to those from Göbekli Tepe's Layer II.
    - The small T-shaped pillar "speaks for a PPN B date, as does the archaeological material recovered" at the site.
