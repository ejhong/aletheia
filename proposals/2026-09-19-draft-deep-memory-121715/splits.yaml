  answer:
    - Oannes taught men the skills necessary for writing and for doing mathematics and for all sorts of knowledge.
    - Oannes taught men how to build cities, found temples, and make laws.
    - Oannes taught men how to determine borders and divide land.
    - Oannes taught men how to plant seeds and then to harvest their fruits and vegetables.
    - In short, Oannes taught men all those things conducive to a settled and civilized life.
