  answer:
    parts:
      - On sonoelastography, active sites (spontaneously painful with palpable myofascial trigger points) had larger trigger point areas (mean ± SD, 0.57 ± 0.20 cm²) than latent sites (0.36 ± 0.16 cm²).
      - Active and latent trigger point sites had significantly higher trigger point areas, assessed by vibration elastography, than palpably normal sites (P < .01).
      - Trigger point areas at active sites were significantly larger than at latent sites (P < .01).
      - The area of reduced vibration amplitude on sonoelastography was measured as an estimate of the size of the stiff myofascial trigger points in the upper trapezius muscles.
