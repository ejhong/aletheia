  answer:
    - 'There is no gold standard technique for detecting myofascial trigger points: "there is no gold standard technique for detecting them".'
    - Manual palpation, despite its use in clinical practice, "has significant inter-observer variability that cannot be meaningfully improved after training", per cited reliability work.
    - Low reliability of MTrP detection also stems from "the absence of universal features that characterize all MTrPs".
    - Because of these limitations, the authors "combined B-mode ultrasonography and strain elastography, which provide high-contrast imaging" between tissues of differing stiffness, alongside palpation.
    - 'In this study elastography primarily served to verify MTrP presence: it "confirmed 71.5% of palpated hard spots as MTrPs", with the remainder corresponding to tendinous cores or musculotendinous junctions.'
