    - 'In 30 amateur runners, 103 gastrocnemius trigger points were identified by palpation (mean 4.7 per person; 3.4 by ultrasonography): "In those 30 participants, 103 MTrPs were identified".'
    - 'Trigger points were treated by thumb compression in 30-s bouts with 10-s rests, up to three rounds: "a strong compression (resulting in pain) transferred by tips of both thumbs" was applied in 30-s intervals, with "10 s of rest was applied to allow for blood re-perfusion".'
    - 'After the first course, most points disappeared from both palpation and strain elastography: "After the first compression course, 75/103 MTrPs were no longer detectable."'
    - 'A further 21 points were visible only on elastography with reduced stiffness and area: "21/103 were visible only on elastography with reduced stiffness", with mean cross-sectional area reduced to 9 mm2.'
    - 'Seven points persisted after the first course: "7/103 remained both palpable and sonographically visible".'
    - At the 24-h follow-up, "none of the 75 eliminated or 21 elastography-only MTrPs recurred".
