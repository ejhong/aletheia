  date: 2026-09-20
  answer:
    - Among the 103 identified MTrPs, 67 were classified as active and 36 as latent; the source states that "67 were classified as active (ATrPs), based on the presence of referred pain, and 36 as latent".
    - Active points had significantly higher VAS scores than latent points, "mean 8.9 vs. 6.1, p < 0.001".
    - Active points had a significantly larger cross-sectional area than latent points, "28 mm 2 vs. 17 mm 2 , p = 0.014".
    - Active points had significantly "greater stiffness ratios (mean 8.5 vs. 6.1, p = 0.006)" compared to latent points.
    - In the discussion the subgroup analysis is summarized as showing that "active points were larger, stiffer, and more painful".
    - After the first round of compression, "60% of ATrPs and 86% of LTrPs were no longer detectable sonographically" (p = 0.021).
    - Before compression, the relative stiffness of the MTrPs "was 4.7 to 13.8 times greater than the surrounding soft tissues" (mean 7.9).
    - Before compression, there was "a significant positive relationship between VAS pain scores and stiffness ratios" of MTrPs (Spearman's rho = 0.61, p = 0.003).
183aab630ee3049c4aa5b2209edc06316a420d9f9cf7675fddf86ca9202a581b:
  model: claude-fable-5-1
  protocol: split-v3
  runId: 2026-09-20-verify-vasocomputation-113521
  date: 2026-09-20
  answer:
    - In the gastrocnemius, "active points were larger, stiffer, and more painful" than latent points, with active MTrPs showing higher VAS scores (mean 8.9 vs 6.1), larger cross-sectional area (28 vs 17 mm²) and greater stiffness ratios (8.5 vs 6.1).
    - Latent points responded more readily to compression and "were more often resolved after the first treatment" (86% of latent vs 60% of active MTrPs no longer detectable sonographically, p = 0.021).
    - Active points required more sessions to deactivate than latent points, with "sessions required for elimination" averaging 1.4 ± 0.5 for active versus 1.1 ± 0.3 for latent MTrPs (p = 0.038).
    - Latent points may represent "earlier or less fibrotic lesions", with MTrP activity level possibly reflecting different stages of myofascial dysfunction.
    - The faster short-term response of latent points to pressure-release therapy is a suggested pattern for which "confirmation in controlled studies is needed".
