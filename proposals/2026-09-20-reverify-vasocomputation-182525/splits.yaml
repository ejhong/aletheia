  answer:
    parts:
      - On sonoelastography, active sites had a mean trigger point area of 0.57 ± 0.20 cm², larger than latent sites at 0.36 ± 0.16 cm² and palpably normal sites at 0.17 ± 0.22 cm² (P < .01); "active sites (spontaneously painful with palpable myofascial trigger points) had larger trigger points".
      - Trigger point areas assessed by vibration elastography were significantly higher at active and latent sites than at normal sites (P < .01), and "active sites were significantly larger than latent sites" (P < .01).
      - Receiver operating characteristic analysis showed that "area measurements could robustly distinguish between active, latent, and normal sites", with areas under the curve of 0.9, 0.8 and 0.8 for the three pairwise comparisons.
      - In the Results, the ROC curves showed trigger point area to be an excellent classifier of active versus normal sites (AUC 0.9) and a fair classifier of latent versus normal sites (AUC 0.79) and active versus latent sites (AUC 0.8); "trigger point area measurements were excellent classifiers of active versus normal sites".
    anchors:
      - quote: active sites (spontaneously painful with palpable myofascial trigger points) had larger trigger points (mean ± SD, 0.57 ± 0.20 cm²) compared to latent sites (palpable trigger points painful on palpation; 0.36 ± 0.16 cm²) and palpably normal sites (0.17 ± 0.22 cm²; P < .01)
        locator: Abstract, Results
      - quote: Active and latent sites had significantly higher areas compared to normal sites ( P < .01), and active sites were significantly larger than latent sites ( P < .01).
        locator: Results
      - quote: Analysis of receiver operating characteristic curves showed that area measurements could robustly distinguish between active, latent, and normal sites (areas under the curve, 0.9 for active versus latent, 0.8 for active versus normal, and 0.8 for latent versus normal, respectively).
        locator: Abstract, Results
      - quote: The ROC curves showed that trigger point area measurements were excellent classifiers of active versus normal sites (cutoff point, 0.35; AUC, 0.9; P < .01), fair classifiers of latent versus normal sites (cutoff point, 0.27; AUC, 0.79; P < .01), and fair classifiers of active versus latent sites (cutoff point, 0.4; AUC, 0.8; P < .01).
        locator: Results
