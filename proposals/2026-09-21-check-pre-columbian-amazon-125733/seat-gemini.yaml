    reasoning: >-
      Medina's (1894) introduction explicitly records that Francisco López de Gómara cited Orellana's relación and branded it 'mentirosa'. The presence of this characterization in Medina's historical commentary is directly verified. Strongest opposing consideration: Gómara's charge targeted Orellana's narrative rather than Carvajal's chronicle directly, and Gómara did not detail his formal evidentiary objections in the cited text.
  - claimId: AMZ-C065
    verdict: established
    confidence: moderate
    reasoning: >-
      Achmatowicz (2018) evaluates Carvajal's manuscript against physical geographic markers and league distances, concluding in his abstract that the text is a trustworthy historical source ("una fuente digna de confianza"). The claim accurately restates the author's scholarly assessment. Strongest opposing consideration: Only the journal abstract is available in the packet, precluding an independent check of the specific internal route reconstructions.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: high
    reasoning: >-
      The qualitative social geography Carvajal described is corroborated by independent sixteenth-century chronicles (AMZ-C003), geographic verisimilitude (AMZ-C065), and archaeological excavations demonstrating contact-era settlements, dark earths, and roads (AMZ-C011). In contrast, his headline numerical figures are textually unstable across manuscript traditions (AMZ-C002) and cannot be treated as censuses. Strongest opposing consideration: Disentangling qualitative social reporting from quantitative inflation is an interpretive choice, as sixteenth-century genre conventions frequently blended factual geography with hyperbole.
  - claimId: AMZ-C004
    verdict: established
    confidence: high
    reasoning: >-
      LiDAR transects across 4,430 km in southwestern Amazonia documented 432 earthworks (396 previously unknown), circumscribed a 183,000 km² Aquiry cultural region, and projected 24,000–30,000 total earthworks. These measurements and model predictions are verified directly from Pärssinen et al. (2026). Strongest opposing consideration: The regional prediction of 24,000–30,000 earthworks is a spatial extrapolation that exceeds earlier basin-wide estimates by an order of magnitude.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      The population model in Pärssinen et al. (2026) is explicitly sensitive to baseline assumptions, requiring an assumed simultaneous-use rate and 300 occupants per earthwork; the paper's own one-family-per-house alternative drops the demographic estimate to 250,000–600,000 (or 315,000–760,000 corrected). This roughly fivefold spread is documented verbatim in the paper. Strongest opposing consideration: The authors explicitly designate the single-family alternative as "very unlikely" based on the large physical footprint (25 m) of the house mounds.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      De Souza et al. (2018) documented an 1,800 km arc of fortified late pre-Columbian village enclosures (Cal AD 1250–1500) along the southern Amazon rim, explicitly noting that their population estimate of 500,000 to 1,000,000 depends on assumed site contemporaneity and MaxEnt modeling. Both the empirical archaeological findings and the explicit modeling dependencies are verified. Strongest opposing consideration: If the ditched enclosures were constructed and occupied sequentially or rotationally over 250 years rather than simultaneously, true peak population would be substantially lower.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Archaeological dating confirms that key complex settlement systems endured into the contact era: the Belterra Plateau was occupied up to seventeenth-century European colonization with dark earths, ponds, and roads (Stenborg et al. 2018); Marajó's Cacoal site dates AD 1300–1650 (Schaan 2000); and Upper Xingu settlements were inhabited to ca. 1770 (Science/Moutinho 2024). Strongest opposing consideration: The Upper Xingu evidence is documented here via a secondary journalistic summary rather than a primary excavation monograph.
  - claimId: AMZ-C061
    verdict: established
    confidence: high
    reasoning: >-
      Primary archaeological excavations and radiocarbon sequences in the Upano Valley establish that the Kilamope and Upano occupations spanned from ca. 500 BCE to 300–600 CE. This chronological sequence is verified directly from Rostain et al. (2024). Strongest opposing consideration: The excavators noted that the full revised stratigraphic sequence would be elaborated in a subsequent paper.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      Remote sensing, regional excavation, and 178 phytolith samples from 18 soil profiles in the Llanos de Mojos demonstrate that the Casarabe culture engineered extensive canals and farm ponds to support intensive year-round maize monoculture. These findings are directly verified from Lombardo et al. (2025). Strongest opposing consideration: The Casarabe culture collapsed around AD 1400, over a century prior to Spanish arrival, meaning its intensive agrarian regime cannot be directly mapped onto the contact-era world Carvajal encountered.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      Extensive anthropogenic dark earths, raised fields, and forest islands demonstrate long-term pre-Columbian landscape engineering, and modern botanical surveys show domesticated tree species concentrating near archaeological sites (Levis et al. 2017, Peripato et al. 2023). Strongest opposing consideration: McMichael et al. (2017) demonstrated that five centuries of post-Columbian human activities and indigenous management represent a major confounding factor in modern tree distributions.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      OSL and radiocarbon dating of raised fields in the Bermeo region of the Llanos de Mojos show intermittent construction and episodic use beginning AD 570–770, supporting a model of flood-risk mitigation built only where dry land was unavailable rather than continuous permanent farming. This dynamic is verified by Rodrigues et al. (2015) and Lombardo et al. (2011). Strongest opposing consideration: These findings derive from a single localized complex in Bermeo and may not characterize all wetland agricultural regimes across the Bolivian lowlands.
  - claimId: AMZ-C019
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Satellite imagery and ground survey in the Llanos de Mojos document landscape-scale fisheries consisting of zigzag weirs, causeways, and 382 ponds configured to capture fish during seasonal flood recession, verified in Blatrix et al. (2018) and corroborated by zooarchaeological analysis at Loma Salvatierra (AMZ-C026). Strongest opposing consideration: While fully described and verified in the source catalog, no standalone evidence card in evidence.yaml was linked directly to C019.
  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      Zooarchaeological excavation at Loma Salvatierra analyzed over 17,000 fish remains, demonstrating sustained, year-round harvesting of interfluvial aquatic taxa (including lungfish and swamp eels adapted to dry-season ponds) 50 km from the nearest major river. This empirical record is verified from Prestes-Carneiro et al. (2019). Strongest opposing consideration: The scarcity of large fluvial fish remains suggests reliance on localized wetlands rather than integration into regional riverine trade networks.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      Denevan (2003) explicitly published a rejection of his own earlier habitat-density methodology for estimating Greater Amazonia's pre-contact population (5.1–6.8 million), citing excessive micro-environmental variability, while maintaining that 5 to 6 million remained reasonable on other grounds. This methodological repudiation is directly verified. Strongest opposing consideration: While Denevan discarded his specific formula, other modeling approaches (such as radiocarbon demographic proxies) continue to yield aggregate estimates within the same order of magnitude.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Summed radiocarbon probability distributions across the Amazon biome fit a logistic demographic growth curve approaching carrying capacity in the centuries immediately preceding colonization, with terminal drops reflecting sampling biases and post-contact collapse rather than pre-contact decline (Arroyo-Kalin & Riris 2021). Strongest opposing consideration: Summed radiocarbon dates are aggregate proxies heavily distorted by taphonomic loss and modern archaeological discovery biases, representing relative activity rather than absolute population counts.
  - claimId: AMZ-C010
    verdict: established
    confidence: high
    reasoning: >-
      Newson's (2003) historical demographic reconstructions document precipitous, uneven declines in the early colonial Upper Amazon: Napo-Aguarico lost ~88% of its population (falling to ~6,000 by 1700), while Mainas fell 62–64%, driven by complex interactions of disease, enslavement, missionization, and flight. Strongest opposing consideration: These documented collapse ratios derive from peripheral Upper Amazon mission regions and cannot be automatically extrapolated to the lower and middle river corridors.
  - claimId: AMZ-C023
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Archival and demographic analyses indicate that colonial epidemics in dispersed lowland populations frequently experienced localized "fade outs," requiring continuous re-introduction by slave expeditions and missions, resulting in an interactive collapse rather than a single uniform disease wave (Newson 2003). Strongest opposing consideration: Reconstructing early colonial epidemiology in non-literate, mobile populations relies partially on qualitative missionary narratives rather than continuous vital statistics.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      A predictive model analyzing 7,363 archaeological sites across Amazonia found distance from a river to be the single most important predictor of pre-Columbian human occupation (accounting for 21.5% of model permutation importance), demonstrating that interfluves were markedly less populated than river corridors (McMichael et al. 2025). Strongest opposing consideration: The site database inherits unavoidable geographic biases from historical survey efforts focused disproportionately along accessible navigable waterways.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      A cumulative synthesis of soil phytolith and charcoal records across 14 regions in western and interfluvial Amazonia revealed persistent closed-canopy forest without evidence of annual crop cultivation, anthropic soils, recurrent burning, or enrichment of economic palms across sampled terra-firme settings (Piperno et al. 2024). Strongest opposing consideration: Soil cores sample an infinitesimal physical volume of the vast Amazonian interfluvial forest, meaning localized agricultural clearings could remain undetected between sampling points.
  - claimId: AMZ-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Machine-learning models of site distributions conclude that the spatial extents of earthworks and anthropogenic dark earths are "limited, albeit impressive," predicting that other, less monumental site types dominate over two-thirds of the Amazon basin (Walker et al. 2023). Strongest opposing consideration: Machine-learning outputs reflect existing training data, which under-sample densely forested or remote interfluvial sectors.
  - claimId: AMZ-C021
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Clement et al. formally criticized the empirical basis for declaring western Amazonia empty, demonstrating that the synthesis rested on roughly 300 soil cores clustered in five small areas—totaling merely 1.17 cubic meters of sediment—to represent two million square kilometers. The claim accurately restates this published methodological critique. Strongest opposing consideration: Paleoecological core analysis relies on stratigraphic environmental representativeness rather than cumulative sediment volume to reconstruct regional canopy and fire histories.
  - claimId: AMZ-C022
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Paleoecological coring in the Upano Valley showed that prolonged forest succession largely erased pre-Columbian anthropogenic signatures from the ecological profile, while subsequent colonial-era impacts remained clearly visible (Bush et al. 2025). Strongest opposing consideration: Upano underwent an early multi-century abandonment hiatus (ca. 600–1200 CE), meaning its prolonged ecological recovery cannot be uncritically assumed for settlements abandoned only during European contact.
  - claimId: AMZ-C029
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Peripato et al. (2023) established that nearly 80% of Amazonia has a predicted probability of earthwork occurrence between 0% and 1% per 1 km² cell, with high-probability zones heavily concentrated in a southwestern arc and northern/central/northwestern areas remaining largely devoid of predicted earthworks. Strongest opposing consideration: Earthwork visibility models rely on current deforestation and survey windows that may underestimate concealed features beneath mature canopies in under-surveyed basins.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      This claim synthesizes the entire ledger: late pre-Columbian Amazonia was neither a pristine wilderness nor a wall-to-wall civilization, but a pronounced human mosaic of dense, engineered agricultural and urban systems along major rivers, savannas, and bluffs, embedded within a sparsely occupied interfluvial forest matrix. Strongest opposing consideration: Advocates of high-density models contend that low-impact interfluvial agroforestry was ubiquitous and that post-abandonment ecological recovery has masked extensive inland human modification.
  - claimId: AMZ-C018
    verdict: established
    confidence: high
    reasoning: >-
      Graham Hancock's 2019 book America Before dedicated seven chapters and over 90 pages to Amazonian archaeology, and his 2024 Netflix docuseries featured researchers Martti Pärssinen and Alceu Ranzi, bringing southwestern Amazonian earthworks to a massive global audience. The publication and broadcast details are fully documented. Strongest opposing consideration: While factually accurate regarding media genealogy, Hancock's advocacy contains speculative lost-civilization narratives that are rejected by mainstream archaeologists.