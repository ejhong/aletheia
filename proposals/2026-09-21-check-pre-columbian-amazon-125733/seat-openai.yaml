      raised-field system.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record directly documents the 382 ponds, their
      proximity to weirs or causeways, or the proposed fish-concentrating
      function of the V-shaped structures. AMZ-E022 establishes year-round
      fishing in the wider Llanos de Mojos but does not establish this engineered
      floodplain system. The strongest favorable consideration is that such
