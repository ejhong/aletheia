  - claimId: AMZ-C009
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E016 directly dates intermittent Bermeo raised-field use from as early
      as AD 570–770 and associates construction with a few separate flood
      episodes. AMZ-E015 independently presents the flood-risk mitigation model
      and the claim that fields were built where alternatives were unavailable.
      The strongest opposing consideration is geographic scope: these findings
