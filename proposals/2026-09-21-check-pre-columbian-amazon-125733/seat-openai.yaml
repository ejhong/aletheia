      summed radiocarbon distributions are biased relative-population proxies,
      not direct demographic measurements or proof of carrying capacity.
  - claimId: AMZ-C010
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E008 directly supplies the Napo–Aguarico and Mainas starting and ending
      estimates, the corresponding decline percentages, and a mixture of
      epidemics, raids, missionization, forced service, revolt, and flight.
      Because the claim is explicitly region-specific, the evidence matches its
      geographic scope. The strongest opposing consideration for broader use is
      that these upper-Amazon provinces cannot automatically represent the
      middle and lower Amazon.
  - claimId: AMZ-C023
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      AMZ-E008 supports the broad conclusion that depopulation was an interactive
      process involving epidemics, raids, missionization, coercion, revolt, and
      flight rather than one uniform event. It does not document the claim's
      specific propositions about epidemic fade-outs, repeated reintroduction,
      or especially heavy adult mortality where disease arrived late. The
      strongest opposing consideration is therefore the absence of an evidence
      record for most of the stated mechanism.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E010 directly reports a model using 7,363 sites in which river distance
