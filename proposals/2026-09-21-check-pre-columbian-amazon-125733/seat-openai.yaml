  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E020 reports that the summed radiocarbon proxy fits logistic growth
      over the 1,700 years before colonization and that the authors attribute
      its terminal decline to sampling bias compounded by colonial-era decline
