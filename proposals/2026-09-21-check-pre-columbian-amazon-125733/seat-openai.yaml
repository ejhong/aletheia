  synthesis: >-
    The evidence provisionally supports a bounded version of the featured
    hypothesis: Carvajal probably encountered substantial, organized riverine
    populations in particular reaches, and severe post-contact disruption could
    have made those reaches appear far emptier to later visitors. It does not
    establish his extreme numbers, continuous dense occupation along the river,
    or a basin-wide civilization. The strongest direct evidence is AMZ-E007:
    accounts associated with Nunes in 1538 and the Ursúa expedition in 1560
    independently reproduce mundane features of the middle-Amazon picture,
    including dense settlement, large food stores, travelled roads, and abundant
    subsistence resources. This convergence is harder to dismiss as Carvajal's
    solitary invention than his chronicle would be on its own. AMZ-E005
    simultaneously shows why the famous warrior and village figures cannot be
    treated as stable observations: the most extreme values occur in one
    manuscript branch and are absent from Oviedo's version.

    Archaeology makes such a social landscape ecologically and institutionally
    plausible. Late fortified settlements extended across the southern rim
    (AMZ-E004), while Belterra, Cacoal, and Upper Xingu provide evidence of
    substantial settlement systems persisting into the contact era or later
    (AMZ-E017–E019). Casarabe agriculture, raised fields, engineered fisheries,
    and year-round interfluvial fishing demonstrate several workable
    subsistence mechanisms, although many examples substantially predate 1542.
    The counterevidence is equally structural rather than anecdotal: river
    distance predicts occupation in the site database (AMZ-E010), and
    palaeoecological sequences show little intensive-use signal in many sampled
    terra-firme settings (AMZ-E011). The resulting picture is a mosaic of
    corridors and hotspots within a much lighter matrix, not either pristine
    uniform wilderness or universal urbanization.

    The decisive historical bridge remains incomplete. AMZ-E008 documents
    catastrophic, multicausal decline in Napo–Aguarico and Mainas, but extending
    those ratios and mechanisms to Carvajal's middle-Amazon reaches is an
    extrapolation. No evidence record performs a route-resolved comparison
    between his populated and empty reaches and AD 1400–1650 archaeology.
    Likewise, ancient Aquiry grandeur is strong evidence against ecological
    impossibility but is about a millennium too early to corroborate the
    contact-era account directly. Population totals remain model-sensitive, as
    AMZ-E002 and AMZ-E009 make especially clear.

    The strongest skeptical construction is therefore that Carvajal and nearby
    expeditions encountered real but discontinuous concentrations, exaggerated
    their scale, and later observers saw ordinary regional turnover amplified
    by colonial disruption. The strongest favorable construction is that
    independent same-reach testimony, contact-era settlement systems, and
    documented catastrophic decline are the surviving fragments of precisely
    the emptied river world in question. Sensitivity is concentrated in
    AMZ-E007: removing that record would leave strong general plausibility but
    little independent, same-reach corroboration of Carvajal, lowering the case
    to weakly supported. The present verdict therefore does not survive at the
    same level without AMZ-E007.
  steelman: >-
    The strongest unanswered pro-hypothesis argument is the route-level
    prediction that Carvajal's independently classified populated reaches will
    contain substantially more AD 1400–1650 settlement evidence than his empty
    reaches and matched controls. No evidence record reports that test; a
    positive result would convert generic Amazonian plausibility into direct
    validation of his qualitative eyewitness geography.
claimAssessments:
  - claimId: AMZ-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 describes a riverine settlement model of concentrated bluff
      occupation alternating with sparse stretches, and its inference identifies
      that as the pattern attributed to Carvajal. AMZ-E005 and AMZ-E007 indirectly
      confirm that his transmitted picture included large settlements and the
      mundane features repeated by other witnesses. The strongest opposing
      consideration is that no evidence record directly reproduces the full
      claimed list of food stores, roads, ceramics, political territories, and
      empty reaches from the chronicle itself.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 directly states that the 50,000, 10,000, and 8,000 warrior figures
      and villages four or five leagues long occur in the Medina/Muñoz versions
      but not Oviedo, which retains one figure of 5,000. This matches the claim's
      manuscript distinction exactly. The strongest opposing consideration is
      that the comparison was verified through an OCR copy rather than a new
      synoptic collation of the manuscripts.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina's rendering of Oviedo saying that he learned
      additional particulars orally in Santo Domingo from Orellana and other
      members of the expedition. That directly supports both the supplementation
      and the named informants. The strongest opposing consideration is that
      Oviedo is available here only through Medina, so the underlying passage was
      not independently read from the Oviedo volume.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 documents Nunes reaching Machiparo in 1538, ten accounts from the
      1560 Ursúa expedition, and descriptions of dense settlement, immense maize
      stores, straight roads, and abundant stored or captured food in the middle
      Solimões. These are independent expeditions and materially corroborate the
      claim's central social-geographic content. The strongest opposing
      consideration is that the evidence record does not separately document the
      claimed renowned ceramics, while Nunes's testimony survives through later
      textual transmission.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 directly reports Medina's statement that López de Gómara cited
      Orellana's relación and called it “mentirosa.” The evidence also correctly
      limits the object of that charge to Orellana's account rather than silently
      transferring it to Carvajal. The strongest opposing consideration is that
      Gómara's own passage was not read directly and is known here through
      Medina.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E072 reports that Achmatowicz's abstract explicitly assesses
      Carvajal's manuscript as trustworthy after examining geographic reference
      points. Because the claim concerns Achmatowicz's assessment rather than the
      ultimate truth of Carvajal's account, the abstract directly supports it.
      The strongest opposing consideration is that the article body was unread,
      preventing evaluation of how strong the geographic analysis actually is.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The qualitative credibility leg is supported chiefly by the independent
      same-region testimony in AMZ-E007 and by the alternating settlement pattern
      in AMZ-E006, while AMZ-E005 firmly establishes the instability of the
      extreme figures. Contact-era settlement evidence in AMZ-E017–E019 further
      shows that substantial organized societies persisted in several Amazonian
      regions. The strongest opposing consideration is that no evidence record
      matches Carvajal's individual populated and empty reaches to
      contact-horizon archaeology, and AMZ-E003 shows that the spectacular Aquiry
      case is much too early to provide direct corroboration.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 directly reports 432 detected earthworks, only 36 previously
      known, an approximately 183,000 km² cultural area, and an extrapolation of
      roughly 24,000–30,000 earthworks. AMZ-E038 and AMZ-E039 do not contradict
      what the 2026 study reports, but show that a different basin-wide model
      yields substantially different totals. The strongest opposing
      consideration is that the regional total is extrapolated from sampled
      blocks, and the evidence records do not independently state the claimed
      4,430 km flight length.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 directly gives the assumed 25–60% simultaneous-use fraction, 300
      people per earthwork, headline range of 1.25–3 million, and
      single-family alternative of 250,000–600,000 or 315,000–760,000 after
      correction. These explicit alternatives establish substantial model
      sensitivity. The strongest opposing consideration is that the authors
      themselves call the single-family interpretation very unlikely, so it is a
      sensitivity bound rather than an equally preferred estimate.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E004 directly states that fortified earth-building villages occupied
      an 1,800 km southern-Amazon arc around AD 1250–1500. It also explicitly
      derives the approximately 500,000–1,000,000 estimate from contemporaneity,
      ethnographic conversion, and spatial extrapolation assumptions. The
      strongest opposing consideration is that those assumptions make the
      population range much less secure than the settlement and dating result.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 documents Belterra occupation to seventeenth-century
      colonization, AMZ-E018 dates Cacoal to AD 1300–1650, and AMZ-E019 reports
      Upper Xingu occupation to 1770 with layouts resembling modern Kuikuro
      villages. Together they support every regional example in the claim. The
      strongest opposing consideration is that the Upper Xingu evidence record
      is secondary science journalism rather than a primary excavation report.
  - claimId: AMZ-C061
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E073 directly reports excavated Upano occupation from approximately
      500 BCE to an end between AD 300 and 600. The evidence comes from the
      investigating team and is associated with a substantial radiocarbon
      dataset. The strongest opposing consideration is that the detailed revised
      sequence was deferred to a later publication and the endpoint is a range.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 reports drainage canals, newly documented farm ponds, and maize
      phytoliths across 178 samples from 18 profiles, with the authors
      interpreting these as intensive year-round maize monoculture. This is
      direct multimethod evidence for the claimed Casarabe subsistence system.
      The strongest opposing consideration is that the Casarabe florescence
      ended before European contact, limiting its direct relevance to Carvajal
      without weakening the local claim.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Dark earth and roads at Belterra are documented by AMZ-E017, raised-field
      use by AMZ-E015 and AMZ-E016, and domesticated-tree associations by
      AMZ-E012, AMZ-E040, and AMZ-E041. However, AMZ-E013 argues that
