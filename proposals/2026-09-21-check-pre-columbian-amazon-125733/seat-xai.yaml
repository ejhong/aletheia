  verdict: well_supported
  loadBearing: [AMZ-C016, AMZ-C017, AMZ-C013, AMZ-C014, AMZ-C011, AMZ-C003, AMZ-C006, AMZ-C007, AMZ-C004]
  weakestLinks: [AMZ-C005, AMZ-C018, AMZ-C065, AMZ-C021, AMZ-C023]
  synthesis: >-
    The ledger inverts the twentieth-century default that Amazonia was too
    poor for complex societies and that Carvajal invented a crowded river
    world. What the evidence actually establishes is narrower and stronger
    than a basin-wide civilization story, and wider than a pristine-forest
    story. On the positive side, multiple independent measurement programs
    document dense, engineered, and in places late-pre-Columbian occupation
    along favored corridors and patches: LiDAR-delimited earthwork landscapes
    in southwestern Amazonia (AMZ-C004), an 1,800 km southern-rim arc of
    fortified villages dated cal AD 1250–1500 (AMZ-C006), Casarabe maize
    monoculture with drainage canals and farm ponds (AMZ-C007), landscape-scale
    fisheries and year-round interfluvial fish use in the Llanos de Mojos
    (AMZ-C019, AMZ-C026), and settlement systems occupied into or through
    contact on the Belterra Plateau, Marajó, and Upper Xingu (AMZ-C011).
    Domesticated-tree concentration and dark earths further record long-term
    landscape management, though the modern floristic signal is partly
    confounded by post-Columbian land use (AMZ-C008). On the limiting side,
    basin-scale models and multi-region phytolith/charcoal syntheses find
    river distance the dominant occupation predictor and little intensive
    annual-crop, clearing, anthropic-soil, or recurrent-fire signal across
    most sampled terra-firme and interfluvial settings (AMZ-C013, AMZ-C014,
    AMZ-C020, AMZ-C029). Published headcounts are model families with shared
    assumptions, not independent censuses; Denevan rejected his own
    habitat-density method while retaining an order-of-magnitude floor, and
    the Aquiry 1.25–3 million headline collapses several-fold under the
    paper’s own single-family sensitivity (AMZ-C012, AMZ-C005). Carvajal’s
    qualitative social geography—populous, road-linked, store-rich riverine
    polities alternating with empty stretches—is corroborated by independent
    sixteenth-century witnesses on the middle Amazon and is spatially
    congruent with bluff-concentrated settlement models, while the extreme
    warrior and league-length figures are manuscript-branch unstable and
    should not be treated as counts (AMZ-C001, AMZ-C002, AMZ-C003, AMZ-C017).
    Regional colonial reconstructions document catastrophic but uneven
    decline through epidemics, raids, missions, flight, and revolt, with
    fade-outs rather than a single uniform wave in sparse lowlands
    (AMZ-C010, AMZ-C023). Summed radiocarbon proxies fit logistic growth
    toward carrying capacity before contact, with terminal decline attributed
    to sampling bias plus post-contact collapse rather than a pre-European
    endogenous crash (AMZ-C015). The load-bearing synthesis claim is therefore
    AMZ-C016: a strongly heterogeneous human Amazon—substantial sedentary and
    engineered occupation along rivers, floodplains, savannas, and bluffs,
    embedded in a much more lightly occupied forest matrix—which makes
    Carvajal’s kind of world locally and corridor-wise plausible without
    requiring basin-wide urban continuous settlement. The Aquiry demographic
    peak at AD 100–300 is decisive against ecological impossibility but is
    chronologically weak as direct corroboration of 1542 (AMZ-E003). Hancock
    platforming (AMZ-C018) is genealogical context with zero diagnostic
    weight for any empirical Amazon claim. Overall the featured reading—
    neither empty wilderness nor uniform civilization; a real crowded river
    world that thinned unevenly after contact—is well supported by converging
    archaeology, palaeoecology, and ethnohistory, with the principal open
    parameters being matrix density under promise-blind survey, route-level
    spatial tests of Carvajal’s populated versus empty reaches, and
    dependency-corrected re-derivation of headcounts.
  steelman: >-
    No preregistered, uncertainty-modeled comparison yet exists between
    Carvajal’s manuscript-classified populated versus empty reaches and
    contact-horizon (AD 1400–1650) archaeological intensity along the
    Orellana corridor itself; a strong positive match at corridor scale
    would still outrun the indirect corroboration from southern-rim,
    Belterra, Xingu, and middle-Amazon textual parallels that this
    assessment treats as sufficient for qualitative credibility.
claimAssessments:
  - claimId: AMZ-C001
    verdict: established
    confidence: high
    reasoning: >-
      Multiple verified secondary treatments (Denevan’s manuscript comparison
      and Lopes et al.’s quotations) establish that the chronicle describes
      populous riverbank settlements, stores, roads, ceramics, and multi-
      settlement territories alternating with empty stretches. The strongest
      opposing consideration is that the two manuscript branches differ and
      the body of Carvajal has not been second-reader verified in this
      ledger, but the claim is about what the account describes, not numeric
      precision, and that descriptive content is multiply attested.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      Denevan 1996 states verbatim that the 50,000 / 10,000 / 8,000 warrior
      figures and 4–5 league villages appear in Medina/Muñoz but not Oviedo,
      which retains one figure of about 5,000 warriors (AMZ-E005). The
      opposing consideration is reliance on a single modern collator’s page
      comparison rather than a published full synoptic table (AMZ-R002),
      which does not disturb the stated branch difference.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: high
    reasoning: >-
      Medina quotes Oviedo that he added particulars learned in Santo Domingo
      from Orellana and accompanying gentlemen beyond the friar’s written
      eyewitness text (AMZ-E089). The opposing consideration is that Oviedo
      is reached only through Medina’s introduction, not the blocked Oviedo
      volume, so transmission detail remains one step removed.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lopes et al. 2024 document Nunes’s 1538 Machiparo entry and the ten
      Ursúa-expedition accounts describing dense middle-Amazon settlement,
      vast food stores, long straight roads, and renowned ceramics on the
      same reaches (AMZ-E007). Opposing considerations include Nunes surviving
      only via a later letter edition and the verified common elements
      excluding fortifications and organized war fleets; none of that cancels
      the independent qualitative corroboration.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Medina records that López de Gómara cited Orellana’s relación and
      labeled it mentirosa (AMZ-E080). The charge targets Orellana’s narrative
      rather than Carvajal’s text directly, and Gómara is quoted second-hand;
      still the historical claim as stated is adequately supported.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only the journal abstract was read; it states Achmatowicz concludes the
      manuscript can be considered a trustworthy source after geographic
      reference-point study (AMZ-E072). Body arguments, route identifications,
      and any treatment of population figures were not available, so weight
      is minimal and the claim remains thinly anchored.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Qualitative credibility is supported by independent sixteenth-century
      witnesses repeating mundane load-bearing features without the extreme
      numbers (AMZ-E007), contact-era occupation in multiple settlement
      systems (AMZ-C011), and southern-rim late-pre-Columbian earth-builders
      (AMZ-C006), while numeric instability is established by the manuscript
      split (AMZ-C002). Contemporary character endorsements and Achmatowicz’s
      abstract add little diagnostic weight; Aquiry grandeur peaks a millennium
      too early to directly underwrite 1542 (AMZ-E003). The strongest opposing
      consideration remains the still-unrun corridor-scale spatial test of his
      populated versus empty reaches.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 2026 Nature paper’s own results state 432 documented earthworks
      (396 new) over 4,430 km of LiDAR, an ~183,000 km² Aquiry circumscription,
      and a 24,000–30,000 earthwork prediction (AMZ-E001). The prediction is
      an explicit block-extrapolation; basin-wide models yield lower totals
      under different definitions (AMZ-E038/E039), which qualifies
      generalizability but not what this study reports for the region sampled.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      The paper’s population section states both the 1.25–3 million path
      (simultaneous-use fraction × ~300 people per earthwork) and the
      single-family alternative of ~250,000–600,000 (315,000–760,000 with
      canopy correction), labeling the latter very unlikely (AMZ-E002). The
      claim is exactly about that model-sensitivity; authors’ preference for
      the higher path is noted and does not erase the span.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      de Souza et al. 2018 document the 1,800 km southern-rim occupation in
      fortified villages ~cal AD 1250–1500 and give the 500,000–1,000,000
      estimate under stated assumptions of contemporaneity, ethnographic
      conversion, and MaxEnt extrapolation (AMZ-E004). Dating and cultural
      pattern are strong; the headcount is explicitly model-dependent as the
      claim itself states.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Belterra Plateau sites with dark earths, ponds, and trodden roads run
      ca. AD 1300 into seventeenth-century colonization (AMZ-E017); Cacoal on
      Marajó dates AD 1300–1650 into Portuguese contact (AMZ-E018); Upper
      Xingu layouts matching living Kuikuro villages are reported inhabited
      to ca. 1770 (AMZ-E019, secondary journalism). Together they establish
      occupation into the contact era at multiple major systems; Xingu weight
      is held moderate pending primary reports.
  - claimId: AMZ-C061
    verdict: well_supported
    confidence: high
    reasoning: >-
      Rostain et al. 2024 date Kilamope/Upano occupation from around 500 BCE
      to between 300 and 600 CE from excavation and a large radiocarbon set
      (AMZ-E073). The end date is a range and a revised sequence is promised
      in a subsequent paper; neither undercuts the stated occupation window.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      Lombardo et al. 2025 document drainage canals, savannah farm ponds, and
      ubiquitous maize phytoliths across 178 samples from 18 profiles,
      concluding intensive year-round maize monoculture (AMZ-E014). Casarabe
      florescence ends before European contact, which limits direct 1542
      linkage but not the agricultural claim as stated.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Dark earths, raised fields, and forest islands are multiply attested;
      Levis et al. 2017 and Peripato-linked analyses show domesticated-tree
      abundance/richness rising on and around archaeological sites and with
      modelled earthwork probability (AMZ-E012, AMZ-E040/E041). McMichael et
      al. 2017 argue post-Columbian management likely played the larger role
      in the modern floristic pattern (AMZ-E013), so the tree leg is qualified
      while the broader engineering observation stands.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      Rodrigues et al. 2015 show intermittent raised-field use from as early
      as AD 570–770 in a few construction events tied to severe-flood periods,
      challenging continuous-cultivation readings (AMZ-E016); Lombardo et al.
      2011 frame construction as flood-risk mitigation where alternatives
      were absent (AMZ-E015). Bermeo-area specificity is the main limit; the
      claim’s challenge to permanent-intensive readings is well grounded.
  - claimId: AMZ-C019
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Blatrix et al. 2018 source is ai-verified in the packet for zigzag
      weirs, straight causeways, 382 ponds mostly within 35 m of such
      features, and V-structures concentrating fish as floodwaters receded,
      matching the claim’s wording. No dedicated evidence-ledger row carries
      claimId AMZ-C019, which slightly lowers formal confidence relative to
      claims with full E-records; substance is not in serious doubt.
  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      Prestes-Carneiro et al. 2019 analyze more than 17,000 fish remains at
      Loma Salvatierra (AD 500–1400, 50 km from the Mamoré) and document
      year-round interfluvial aquatic exploitation including dry-season
      small-water-body taxa (AMZ-E022). Sample size and site context are
      strong; the paper’s own note on scarce large river fish is a nuance,
      not a contradiction.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      Denevan 2003 explicitly rejects the habitat-density method behind his
      earlier 5.1–6.8 million figure for excess within-habitat variability,
      while still holding at least 5–6 million reasonable on other grounds
      (AMZ-E009). The claim correctly frames basin-wide totals as model
      families sharing assumptions rather than independent measurements.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Arroyo-Kalin & Riris 2021 report logistic growth toward carrying
      capacity over ~1700 years before colonization and attribute terminal
      SPD decline to sampling bias compounded by post-European collapse and
      dispersal (AMZ-E020). SPDs are relative proxies with stated biases, not
      censuses; the directional demographic reading is adequately supported
      at aggregate level.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Newson 2003 Table 1 and following pages give Napo–Aguarico ~49–51k to
      ~6k by c. 1700 (~88%) and Mainas 62–64% declines through epidemics,
      slave raids, missionization, forced service, revolt, and flight
      (AMZ-E008). Extension beyond upper-Amazon mission provinces to the
      middle/lower Amazon is extrapolation, which the claim’s
      “region-specific” framing already respects.
  - claimId: AMZ-C023
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Newson 2003 supplies the fade-out language and the interactive mix of
      epidemics with raids and mission reintroductions that the claim
      summarizes; AMZ-E008 documents mixed mechanisms and flight from major
      rivers in the same source. No separate evidence row isolates the fade-out
      thesis, so confidence is moderate and the verdict remains provisional
      pending fuller quotation-level anchoring.
  - claimId: AMZ-C013
    verdict: established
    confidence: high
    reasoning: >-
      McMichael et al. 2025, using 7,363 AmazonArch sites, find distance from
      river the most important predictor (21.5% permutation importance) and
      interfluves more sparsely occupied than near-river areas (AMZ-E010).
      Survey-effort bias toward accessible rivers is acknowledged and cuts
      against over-reading emptiness, but does not reverse the dominant
      predictor result.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      Piperno et al. 2024’s cumulative fourteen-region phytolith and charcoal
      synthesis finds little to no annual-crop agriculture, significant
      clearing, anthropic soils, favored-tree enrichment, or recurrent
      extensive fire in most sampled terra-firme and especially interfluvial
      settings (AMZ-E011). Sparse soil-core coverage and proxy detection
      limits are real; negatives count only where the methods could detect
      the signal, which the claim’s “most sampled” wording already tracks.
  - claimId: AMZ-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Walker et al. 2023’s verified source text describes earthwork and dark-
      earth predicted extents as “limited, albeit impressive,” with other
      site types predicted to dominate more than two-thirds of Amazonia.
      Absence of a dedicated evidence-ledger row slightly reduces formality;
      the measurement claim is otherwise straightforward and directionally
      congruent with AMZ-C013/C029.
  - claimId: AMZ-C021
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Clement et al.’s verified reply states the criticized western-Amazon
      sampling as roughly 300 cores in five small areas totaling about 1.17 m³
      standing in for ~2,000,000 km². The claim accurately reports that
      critique; whether the critique fully defeats sparse-Amazon conclusions
      is a separate inferential step the claim does not assert.
  - claimId: AMZ-C022
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Bush et al. 2025 state that a long period of forest recovery largely
      eradicated pre-Columbian influence on the Upano ecological record while
      the Colonial-period signal persisted in the same profiles. Time-graded
      erasure is therefore documented at this locality; generalizing the decay
      function basin-wide remains the open measurement (AMZ-R008).
  - claimId: AMZ-C029
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Peripato et al. 2023’s accepted manuscript states that almost 80% of the
      basin has 0–1% predicted earthwork probability per 1 km² cell, with
      low-probability areas concentrated in northwestern, northern, and
      central Amazonia. Related evidence rows emphasize competing total
      predictions and Acre-centered high-probability rectangles (AMZ-E038/E039);
      presence-only data and modelled observability corrections are the main
      caveats.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is the structured roll-up of dense corridor and hotspot
      evidence (AMZ-C004, C006, C007, C011 and supporting landscape work) with
      sparse-matrix evidence (AMZ-C013, C014). No single counter-record
      restores either pristine emptiness or uniform basin-wide intensive
      occupation; remaining uncertainty is quantitative matrix density and
      local route representativeness, not the heterogeneous pattern itself.
  - claimId: AMZ-C018
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hancock’s first-party site statement documents seven chapters / 90+
      pages on Amazonian discoveries in America Before (2019), and the IMDb
      cast list for Ancient Apocalypse S2.E1 names Pärssinen and Ranzi as
      featured experts (AMZ-E021). This is advocacy genealogy with explicit
      zero weight for empirical Amazon claims; as a historical media-record
      claim it is adequately shown.