  synthesis: >-
    The Deep Memory hypothesis posits that prominent morphological and mythological resemblances across ancient societies—including Göbekli Tepe, Mesopotamia, Mesoamerica, Tiwanaku, and Rapa Nui—are evidence of a shared ancestral tradition or long-distance contact. Proponents can point to undeniable visual parallels: handled arched forms, therianthropic bird-men, and predatory birds associated with discs appear across vast geographic spans, presenting an aesthetic constellation that strikes human observers as too coordinated to arise by chance. Moreover, proponents legitimately argue that organic transmission media (wood, hides, textiles) perish easily, naturally creating taphonomic gaps in the archaeological record.

    However, when evaluated against the ledger's empirical and methodological evidence, the transmission hypothesis is contradicted. First, the co-occurrence of the core motifs fails to exceed random expectation: global mythological catalogs indicate that individual elements like bird-persons (55%) and cosmic serpents (37%) are ubiquitous baseline cultural tropes (DEEP-C005, DEEP-C025, DEEP-C056), and their bundled co-occurrence does not stand out against documentation-preserving controls (DEEP-C057). Second, contextual analysis demonstrates that morphological similarity masks profound functional, semantic, and chronological divergence (DEEP-C002, DEEP-C065). The Göbekli Tepe Pillar 43 arched carvings have an unknown function and may depict buildings (DEEP-C012), whereas the Assyrian banduddû is a ritual water-lustration bucket documented millennia later (DEEP-C044), and Jiroft chlorite objects represent distinct suspension weights (DEEP-C009). On Rapa Nui, petrographic stratigraphy reveals that the birdman bas-reliefs on Hoa Hakananai'a were carved centuries after the moai's manufacture, reflecting a localized late cult rather than an archaic global template (DEEP-C059). Third, cross-cultural toponyms and labels collapse upon philological inspection: Göbekli Tepe is a modern Turkish topographical description rather than an ancient sacred designation (DEEP-C015, DEEP-C018), and the Viracocha attribution at Tiwanaku is a modern antiquarian projection (DEEP-C028). Finally, the excavation team emphasizes that massive multi-millennial gaps lack the intermediate links necessary to establish historical transmission (DEEP-C072), while computational lineups demonstrate that visual resemblances disappear when controlled for object category (DEEP-C038).

    Sensitivity analysis: The single evidence record whose removal would most challenge this assessment is DEEP-E028 (the excavation team's direct acknowledgement that the function of Pillar 43's forms remains uncertain). Without DEEP-E028, container interpretations of the Göbekli reliefs would be less constrained. Nevertheless, the case verdict survives without it, as the disconfirmation is independently overdetermined by motif co-occurrence baselines (DEEP-C057), chronological chasms across oceans, the late stratigraphy of Rapa Nui petroglyphs (DEEP-C059), and lineup controls (DEEP-C038).
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is the highly specific, multi-element visual composition on Göbekli Tepe Pillar 43, which simultaneously juxtaposes three arched handled boxes, an avian predator posed over a circular disc, and a headless human figure. While the ledger's catalogue experiments show that broad individual motifs occur frequently at baseline, they test isolated categories rather than compound, multi-attribute syntactical scenes whose compound probability under independent convergence remains unquantified.
