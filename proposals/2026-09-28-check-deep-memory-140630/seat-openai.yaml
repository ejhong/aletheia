  synthesis: >-
    I assess the featured hypothesis as the proposition that the distant
    resemblances catalogued here carry substantial evidence of inheritance
    from a shared source or long-range transmission, rather than merely
    convergence, later borrowing, or selective comparison. On the present
    records that proposition is unresolved, but not because the evidence is
    evenly balanced. The ledger supplies too little discriminating evidence
    to establish the proposed shared history, while also supplying no
    comprehensive chronological or archaeological test capable of
    contradicting every version of it.

    The strongest case for the hypothesis begins with observations that are
    genuinely suggestive if the reported results are accurate. The founder
    reports broad bird-person and cosmic-serpent frequencies, and reports
    that claimed civiliser partners ranked first much more often than random
    pairs. Berossus describes Oannes in a fish-bodied human form, says that
    the form survived in sculpture, and a scholarly table aligns Oannes with
    U-An in an apkallu list. The Pillar 43 forms were described by the
    excavator as box-like objects with handle-like attachments, and their
    function remains open. These records preserve possible lines of inquiry
    rather than reducing every resemblance to an error.

    The contrary case is structurally stronger concerning what can presently
    be inferred. Similarity cannot identify a source, date, route, or
    capability without chronology, context, and intermediates. The
    excavation team explicitly regarded later survival of Göbekli Tepe
    imagery as unestablished because too many links were missing. Its own
    discussion also declined to assign a final meaning to the Pillar 43
    forms, so comparison with a historically contextualised Assyrian bucket
    remains a comparison of appearance rather than demonstrated function.
    The catalogue frequencies and civiliser-lineup numbers are unaudited
    self-reports without retrieved data or methods. More importantly, the
    ledger contains no supporting evidence record for the reported result
    that the three-motif bundle fails to stand out, no retrieved regional
    clustering analysis for the flood stories, and no inter-judge statistics
    for the image pilots. Thus even several findings that might argue
    against transmission cannot receive strong verdicts.

    Local results must not be inflated into a case result. The later addition
    of birdman reliefs to Hoa Hakananai'a is well supported, the Jiroft
    object's wear was interpreted as prolonged cord suspension, and the
    banduddû has some ritual-bucket support. None connects Göbekli Tepe,
    Assyria, Rapa Nui, Mesoamerica, and the Andes through dated transmission.
    Conversely, uncertainty about an object's function does not prove
    independent invention. The warranted conclusion is therefore that the
    featured historical explanation has not been demonstrated and remains
    unresolved, rather than that all resemblance has been explained away.

    The single evidence record whose removal would most change this case
    assessment is DEEP-E022, the only record reporting that kind-matched
    controls changed an image-lineup result. Removing it would weaken the
    empirical case that comparison design drives apparent resemblance, but
    the case verdict survives: missing chronological links, unavailable
    experimental data, and the absence of a tested transmission chain would
    still leave the shared-past hypothesis unresolved.
  steelman: >-
    The strongest unanswered pro-hypothesis prediction is that the rare,
    high-dimensional conjunctions actually emphasised by proponents—specific
    bird-person anatomy, handled-object placement, bodily pose, associated
    animals, and narrative sequence—will recur along a securely dated route
    with intermediate artifacts more often than matched control
    configurations. The broad catalogue classes and unaudited AI lineups do
    not test that conjunction-level prediction, so this assessment does not
    explain why such a controlled, chronology-aware analysis would fail.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      Historical attribution is underdetermined by visual resemblance unless
      chronology, context, differences, and possible routes are considered.
      This verdict follows mainly from methodological logic rather than a
      dedicated evidence record. The strongest opposing consideration is
      that resemblance can still be an informative observation, but it
      cannot alone select among inheritance, contact, and convergence.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue experiment by noting
      uneven coverage and the breadth of its categories, but neither supplies
      the comparison result showing that the three-class bundle did not
      stand out. No run data, statistic, or documentation-preserving null
      comparison is present. The strongest opposing consideration is that
      the founder reports this result, but the rules require assessment from
      the evidence records rather than the unexamined claim source.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the claimed 62.5% and 9% rates.
      They are two parts of the same founder self-report, not independent
      replications, and the run data were not retrieved. The strongest
      opposing consideration is that the denominator of completed lineups,
      exclusions, controls, and incomplete runs are unavailable.
  - claimId: DEEP-C034
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Translation, borrowing, and repeated comparative retelling are
      generally plausible mechanisms for narrative convergence, so the claim
      has a strong background prior. No evidence record here compares an
      earlier attested story with a demonstrably more similar later
      retelling, however. The strongest opposing consideration is therefore
      the absence of the documented before-and-after evidence specified by
      the claim's own truth condition.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      A resemblance does not logically determine a proposed source's
      identity, date, organisation, or technical capabilities. Those
      additions require independent chronological, archaeological, or
      textual evidence. The strongest opposing consideration is that a rare
      and precisely specified resemblance could contribute to such an
      argument, but the claim correctly concerns resemblance alone.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A broad geographical distribution can be generated by both sufficiently
      ancient transmission and repeated independent invention, so
      distribution alone is non-identifying. This is primarily a
      methodological conclusion grounded in model underdetermination rather
      than a retrieved experiment. The strongest opposing consideration is
      that dates, phylogenetic structure, intermediates, or detailed feature
      bundles could make a distribution diagnostic, but those are additional
      evidence rather than the distribution by itself.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E016 provide weak self-reported frequencies for the
      bird-person and cosmic-serpent classes, which is partial support for
      two components. No evidence record establishes the prevalence of the
      sacred-centre class, and DEEP-E018 and DEEP-E019 only qualify coverage
      and category breadth. The strongest opposing consideration is that the
      reported 55% and 37% figures make widespread occurrence plausible for
      two classes, but the three-part claim is not reproduced.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 directly report a 55% frequency among 926
      sampled traditions. Both derive from the same unaudited founder report,
      while DEEP-E018 and DEEP-E019 document uneven coverage and broad
      categories. The strongest opposing consideration is that neither the
      coding data nor the denominator construction was retrieved, so the
      proportion cannot be independently reproduced.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E016 directly reports the 37% cosmic-serpent frequency, while
      DEEP-E017 limits its interpretation to the selected category and
      dataset. DEEP-E018 and DEEP-E019 add concerns about coverage and broad
      coding. The strongest opposing consideration is that this is an
      unaudited self-report with no accessible coded data or method.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The three proposed concepts are intelligibly distinct, but no evidence
      record classifies the compared images as bird-headed deities,
      feather-wearing humans, or transforming humans. Some images could also
      combine or ambiguously occupy these categories. The strongest opposing
      consideration is the sound conceptual distinction itself, which makes
      the claim plausible but does not establish its application to the
      actual comparison set.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report Pitts and colleagues' relative sequence:
      later-added komari were succeeded by bas-reliefs interpreted as a
      birdman composition. That sequence directly places the birdman reliefs
      after the statue's manufacture. The strongest opposing consideration
      is that only the abstract was retrieved, leaving the survey evidence
      and its reasoning unread.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically distinct: similar outlines can
      serve different purposes, and functional identification requires
      contextual or use evidence. The contrast between the uncertain Pillar
      43 forms and the contextually interpreted banduddû illustrates the
      distinction. The strongest opposing consideration is that shape can
      constrain or probabilistically suggest function, but it does not make
      the two questions identical.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E055 reports a ritual text in which the banduddû contains water
      that is consecrated and sprinkled over a person, supporting a ritual
      bucket interpretation. The evidence is a secondhand blog
      transcription of Wiggermann rather than the checked primary edition,
      and it does not establish the cone or purifier identification
      separately. The strongest opposing consideration is that the
      bucket-and-purifier formulation is broader than the retrieved passage.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 records the excavation team's explicit statement that no
      final decision on the meaning of the three forms was then possible.
      This directly supports uncertainty rather than any particular
      functional reading. The strongest opposing consideration is that the
      statement comes from a 2016/2017 team blog and later publications were
      not checked, so it may not represent the final state of research.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 directly reports Vidale and Micheli's abstract-level
      inference that the strong wear indicates prolonged suspension on a
      cord. DEEP-E034 confirms handle and contour wear, while DEEP-E038 notes
      that the inference rests on one object and is not secure. The strongest
      opposing consideration is that the article body and the identity of
      the studied specimen with the ledger's photographed object were not
      confirmed.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 directly report a team member's view that too
      many missing links prevent certainty about survival of the imagery and
      any changes in meaning. This establishes the claimed team position,
      though not the objective absence of continuity. The strongest opposing
      consideration is that the statement is an informal comment-thread
      reply rather than a systematic publication by the full team.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      The proposition is methodologically plausible, but the evidence packet
      does not provide the source histories of all four names across
      language, first attestation, and builder usage. DEEP-E024 bears only on
      an asserted Kurdish gloss and does not establish the required
      comparison. The strongest opposing consideration is that the examples
      are very likely heterogeneous on general historical grounds, but that
      is a prior rather than evidence supplied here.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record documents that the Turkish name Göbekli Tepe was
      coined to describe the mound's shape rather than as a sacred
      designation. DEEP-E024 concerns Kurdish names and does not bear on this
      Turkish etymology. The strongest opposing consideration is the
      plausibility of the familiar descriptive gloss, but its provenance is
      not in the record.
  - claimId: DEEP-C047
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Basic stone mechanics make attached or body-adjacent limbs less
      vulnerable than projecting limbs, so material constraint is a
      plausible contributor. This judgment leans on general engineering and
      sculptural priors because no evidence record compares breakage risk or
      pose frequencies. The strongest opposing consideration is that
      symbolic conventions could independently determine the pose and no
      comparative test apportions their effects.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 gives Oannes a fish body over human features, DEEP-E076 says
      his form survived in sculpture, and DEEP-E079 reports a scholarly
      alignment of Oannes with U-An in an apkallu list. Together these make
      the proposed correspondence plausible. The strongest opposing
      consideration is that no retrieved record directly identifies the
      particular fish-cloaked Assyrian iconographic type as Oannes, and the
      Berossus text survives through several transmission layers.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses when the Gate of the Sun figure first came
      to be called Viracocha or surveys pre-modern identifications. The
      claim's negative condition requires more than the absence of a
      pre-modern naming source from this packet. The strongest opposing
      consideration is that modern attribution is historically plausible,
      but plausibility cannot substitute for the missing source history.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies the 263 coded summaries, a regional
      clustering statistic, or the stated distance and null model. The claim
      therefore cannot be reproduced or evaluated from the packet. The
      strongest opposing consideration is the founder's reported result, but
      it has not entered the ledger as an evidential record with data or
      method.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      The packet contains no evidence record showing which details were
      classified as associated with Genesis or how their distribution was
      measured. Consequently, neither the existence nor the degree of
      unevenness can be assessed. The strongest opposing consideration is
      that such regional unevenness is historically plausible, but that
      expectation is a prior rather than evidence for this pilot result.
  - claimId: DEEP-C038
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E022 directly reports that matching the kinds of objects changed
      the lineup result. It is only a founder self-report, with the pilot
      data, rankings, and control construction unavailable; incomplete runs
      and cropping are also acknowledged. The strongest opposing
      consideration is that no effect size or replication shows whether the
      change was substantial or robust.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies inter-judge agreement statistics or even a
      direct evidential statement of strong disagreement. DEEP-E022 concerns
      kind-matched controls and explicitly does not establish judge
      disagreement. The strongest opposing consideration is the founder's
      stated pilot conclusion, but without the judges' outputs or an
      agreement measure it cannot be assessed.