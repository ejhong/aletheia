    reasoning: >-
      Records DEEP-E061 and DEEP-E062 directly quote Göbekli Tepe researcher Oliver Dietrich stating that there are 'far to many missing links' to confirm the survival or continuity of Early Neolithic imagery into later historical periods, and noting that any surviving motifs would have undergone undocumented semantic changes. This directly validates the claim that the excavation team views long-term survival into later Near Eastern objects as unestablished. The strongest opposing consideration is that Dietrich's statement was made in an online commentary reply rather than in a formal, peer-reviewed project monograph.
  - claimId: DEEP-C018
    verdict: well_supported
    confidence: high
    reasoning: >-
      The four toponymic and mythological designations represent fundamentally disparate evidentiary categories: Greek omphalos is attested in Classical antiquity; Cusco as 'navel' is a post-conquest 1609 CE colonial gloss by Inca Garcilaso de la Vega; Rapa Nui's Te Pito o te Henua appears in 19th-century European records; and Göbekli Tepe is a 20th-century descriptive Turkish geographical name completely unknown to its prehistoric builders. This methodological differentiation is securely grounded in philological and historical priors. The strongest opposing consideration is that proponents assert that indigenous toponyms preserve genuine deep-time oral traditions that accurately retain original sacred concepts over thousands of years.
  - claimId: DEEP-C015
