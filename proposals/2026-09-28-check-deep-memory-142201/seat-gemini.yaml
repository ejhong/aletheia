      The ledger contains no direct toponymic, cartographic, or linguistic evidence record establishing that the modern Turkish name 'Göbekli Tepe' ('navel/belly hill') was coined purely as a descriptive reference to the physical mound rather than reflecting an older sacred tradition. The truth condition specifically requires documentation of the toponym's descriptive origin, which has not yet been ingested into the ledger. The strongest opposing consideration is that standard Turkish linguistic usage routinely applies 'göbekli' descriptively to rounded, domed hills and topographical features without any sacred connotation.
  - claimId: DEEP-C047
    verdict: well_supported
