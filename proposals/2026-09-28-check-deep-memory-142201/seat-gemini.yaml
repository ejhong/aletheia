    reasoning: >-
      This is a foundational methodological principle in archaeology and historical iconography: morphological resemblance alone is equifinal and cannot determine whether a parallel arises from common descent, diffusion, or independent convergence without secure chronologies, geographic vectors, and contextual evidence. While the ledger contains no empirical record specifically evaluating this meta-theoretical principle, it is thoroughly established in comparative methodology, leaning directly on standard scientific priors. The strongest opposing consideration is the radical formalist argument that certain compound, highly idiosyncratic multi-attribute iconographic configurations possess an intrinsic diagnostic signature that statistically implies historical transmission regardless of missing intermediate context.
