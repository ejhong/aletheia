  - claimId: DEEP-C034
    verdict: well_supported
    confidence: high
    reasoning: >-
      Documented literary and folkloric history demonstrates that comparative mythographers, translators, and colonial chroniclers frequently harmonize disparate regional traditions toward familiar classical or biblical templates, causing retellings to converge artificially. This mechanistic claim leans on established folkloric priors, as the ledger lacks dedicated empirical records tracking specific text variations over time. The strongest opposing consideration is the traditional folkloristic view that oral transmission primarily produces divergent branching and localized drift rather than convergent harmonization unless deliberate synthetic texts intervene.
  - claimId: DEEP-C035
    verdict: well_supported
    confidence: high
    reasoning: >-
      This claim represents an essential epistemological constraint: establishing that two ancient motifs look alike cannot logically prove specific secondary claims regarding the existence, geographical location, date, or advanced technology of an unevidenced ancestral civilization. Deductive logic and archaeological epistemology firmly support this claim based on methodological priors, even without specific ledger evidence records. The strongest opposing consideration is the assertion by diffusionist proponents that the cumulative probability of numerous complex shared traits across isolated civilizations becomes so astronomically low that an advanced common ancestor is the only mathematically viable explanation.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      Spatial point distributions of broad thematic categories (such as serpents or bird-men) exhibit inherent equifinality: identical widespread geographical patterns can be produced either by deep Paleolithic demic migrations or by universal cognitive and environmental convergence. In the absence of detailed phylogenetic sequencing or intermediate archaeological stepping stones, geography alone cannot separate the two hypotheses, a finding leaning securely on methodological priors. The strongest opposing consideration is that modern spatial phylogenetics in comparative mythology claims to reconstruct historical diffusion pathways and ancestral proto-narratives from geographic distributions alone.
  - claimId: DEEP-C056
