    reasoning: >-
      Records DEEP-E013 and DEEP-E014 directly support the claim, documenting the founder's catalog experiment finding of broad bird-person motifs in 55% of 926 sampled traditions to establish a baseline. However, DEEP-E015, DEEP-E018, and DEEP-E019 qualify this by noting that the category is defined very broadly, does not measure specific poses or contexts, and relies on a catalog with known uneven regional coverage. The strongest opposing consideration is that an unaudited self-report based on overly broad category definitions cannot establish an authoritative baseline frequency for specific iconographic bird-man imagery.
  - claimId: DEEP-C025
    verdict: provisionally_supported
