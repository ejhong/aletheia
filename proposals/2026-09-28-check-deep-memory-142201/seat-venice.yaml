  verdict: mixed
  loadBearing: [DEEP-C012, DEEP-C009, DEEP-C059, DEEP-C072]
  weakestLinks: [DEEP-C005, DEEP-C025, DEEP-C027, DEEP-C031, DEEP-C037, DEEP-C054, DEEP-C056, DEEP-C057]
  synthesis: >-
    The ledger's most solid ground is local and particular. For several anchor objects the
    ledger holds primary or near-primary records: Schmidt's own 2006 description of the three
    box-like, handle-like forms on Pillar 43 and the excavation team's published statement that
    no final decision on their meaning is possible (DEEP-C012); Vidale & Micheli's abstract-level
    reading of the Jiroft handbag's handle wear as long suspension on a cord, with the authors'
    own single-object caveat (DEEP-C009); Pitts et al.'s relative sequence statue, then komari,
    then birdman reliefs on Hoa Hakananai'a (DEEP-C059); and the excavators' agnosticism about
    survival of Göbekli imagery into later Near Eastern objects because of 'missing links'
    (DEEP-C072). Each supports a dated, local, checkable reading and none supports an
    established transcontinental chain. Against this, the case-wide statistical structure —
    motif frequencies (55%, 37%), the non-standing-out of the bird-serpent-centre bundle, the
    62.5% civiliser lineup rate, flood-detail clustering, and AI-judge disagreement — rests on
    the founder's self-reports of his own unaudited experiments, with methods and run data not
    retrieved; the flood-coding and judge-agreement claims have no evidence records at all and
    are unresolved. Many of the methodological principles (C002, C026, C034, C035) are plausible
    and partly corroborated by the team's agnosticism, but the verdicts on them lean on general
    background rather than ledger records, and I flag that. Steelmanning the featured
    shared-past hypothesis: nothing here refutes transmission; it shows the ledger has not yet
    adjudicated it. Steelmanning the skeptical reading: every securely evidenced record so far
    terminates in a local explanation, and the one place a chain would have to appear — dated
    intermediates between Göbekli Tepe and later Near Eastern objects — is exactly where the
    excavators say the links are missing. The case is genuinely mixed: local explanations are
    earning support; the global pattern statistics cannot yet carry either side.
  steelman: >-
    If the V1 lineup run data confirm that claimed civiliser pairs rank first in 62.5% of
    completed lineups against 9% for random pairs, and this survives the human-rater,
    source-level-passage rerun (DEEP-R003) that has not yet been performed, then the
    systematic resemblance among the Oannes–Viracocha–Quetzalcoatl–Bochica accounts is an
    unexplained observation this assessment does not answer: I only note that modern compressed
    retellings could manufacture it, without any evidence record demonstrating that they do.
    Berossus F1's statement that Oannes's form "has been preserved in sculpture to this day"
    (DEEP-E044) is, moreover, an ancient testimony directly linking a narrative civiliser to a
    specific iconographic type — precisely the story-plus-image coupling a transmission account
    needs, and the ledger contains no record that disaggregates it.
claimAssessments:
  - claimId: DEEP-C002
