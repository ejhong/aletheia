    reasoning: >-
      No evidence record in the ledger bears on this claim; it is a methodological principle
      asserted on the founder's page. Its plausibility on general background is high — dating,
      context and connection are standard requirements of historical explanation — but the
      verdict leans on priors, not retrieved records, and the truth condition (that no
      resemblance can be explained without such data) is a universal negative never tested here.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records linked to this claim (DEEP-E018, DEEP-E019) are the author's own
      caveats about catalogue coverage and category breadth; they qualify the result without
      stating it. No retrieved record reproduces the comparison showing the bundle does not
      stand out, so the claim's truth condition is undischarged. The strongest opposing
      consideration is that the result is asserted nowhere in evidence, only presupposed.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two weak self-report records (DEEP-E020, DEEP-E021) state the 62.5% and 9% figures, but
      the run data are not retrieved, "completed lineups" implies unenumerated incomplete runs,
      and AI-judge reliability is itself in question per the pilots. The claim as stated — that
      the run data reproduce those rates — cannot be confirmed from a page's own summary.
  - claimId: DEEP-C034
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No evidence record addresses convergence of retellings; DEEP-R003 is the designed test
      and is unanswered. The mechanism is well documented in general textual scholarship, so the
      verdict leans on background priors, which I flag; the ledger contains no documented
