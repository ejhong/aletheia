  - claimId: DEEP-C035
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No ledger record bears on this; the claim is near-analytic for anyone who distinguishes
      an observation (resemblance) from a theory's added commitments (source identity, date,
      capabilities), but by the ledger's own rules that is a prior, not evidence. The strongest
      opposing consideration is that a sufficiently rich pattern of similarities with dated
      intermediates could in principle begin to establish a shared source — the claim denies
      only that similarity alone suffices, which no record tests.
  - claimId: DEEP-C026
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      No record directly supports the identifiability claim, but DEEP-E061/E062 — the
      excavator's "far too many missing links" reply, a child of this claim — indirectly
      corroborates that distinguishing transmission requires dated intermediates beyond a
      distribution. The claim is also strongly plausible on background: the same geographical
      spread is generated by both histories under simple models. It remains prior-heavy.
