caseAssessment:
  verdict: mixed
  loadBearing: [DEEP-C012, DEEP-C009, DEEP-C059, DEEP-C027, DEEP-C038]
  weakestLinks: [DEEP-C044, DEEP-C027, DEEP-C056, DEEP-C057, DEEP-C037]
  synthesis: >-
    This ledger is mid-construction, and the honest roll-up is asymmetric: the object-level
    claims that have been checked against primary sources fare reasonably well, while every
    claim that would actually carry the featured hypothesis — that cross-cultural resemblances
    record a shared past — rests either on the founder's unaudited self-reports or on nothing
    at all. The strongest verified material concerns uncertainty and sequencing, not
    transmission. DEEP-C012 is the best-decided claim in the case: the excavation team's own
    published statement (DEEP-E028) fixes the Pillar 43 handled forms as functionally
    unidentified, which forces the Assyrian bucket comparison to remain a comparison of shapes
    only. DEEP-C009 is decently but incompletely supported: Vidale & Micheli's abstract states
    the cord-suspension reading, but the authors' own single-object caveat and the unread body
    hold it at provisional. DEEP-C059 gains moderate support from the Pitts et al. abstract's
    relative sequence. Against this, the hypothesis-bearing statistics are weak: the 55%, 37%
    and bundle findings (C005, C025, C056, C057) and the 62.5% lineup result (C027) are
    self-reports of the site's own experiments with no run data, code or coded corpus in the
    ledger, and the navel, flood, Viracocha, bird-man-category and inter-judge-agreement claims
    have no evidence records whatsoever. Steelmanning the shared-past direction: nothing here
    refutes it; the ledger simply has not yet retrieved the evidence that would. Steelmanning
    the sceptical direction: the site's own pilots reportedly found unreliable feature coding,
    strong judge disagreement, and kind-matching that changed lineup results (C037, C038) —
    findings which, if verified, would undercut precisely the resemblance measurements a
    shared-past case needs, and the founder's own caveats concede the catalogue cannot
    distinguish invention from very old transmission. On the evidence actually in hand, the
    case supports a careful methodological frame and a handful of object facts, and supports
    no verdict on the founding question itself — hence mixed, not resolved in either
    direction.
  steelman: >-
    The strongest unanswerd argument for the featured hypothesis is the V1 civiliser lineup
    result: claimed partner figures ranked first in 62.5% of completed lineups against 9% for
    random pairs — a large, quantitative signal that the civiliser accounts resemble their
    claimed counterparts well beyond chance. No evidence record in the ledger explains this
    away; the only recorded caveat (that modern compressed retellings may manufacture the
    similarity) is a design worry awaiting the R003 human test, not a rebuttal, and the run
    data needed to audit the 62.5% figure have never been retrieved.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      This is a methodological claim with no evidence record testing it; the verdict leans on
      general historiographic practice, not ledger evidence. It is close to definitional — a
      resemblance without dates or contexts cannot be assigned a specific history — but the
      strongest opposing consideration is that some resemblances (e.g. identical
      mass-produced or directly copied objects) do carry historical meaning from near-zero
      context, so the claim holds as a general rule rather than an absolute.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records linked to this claim (DEEP-E018, E019) are the author's own coverage
      and scoping caveats; no evidence record in the packet reproduces or supports the finding
      that the bundle does not stand out. The quoted sentence exists in the claim anchor but
      no support record was ever split off for it. Strongest opposing consideration: the
      finding is probably real as a page statement, but an unaudited self-report with no
      retrieved method cannot be graded as shown.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two weak records (DEEP-E020, E021) report the 62.5% versus 9% figures as the page's own
      statement; the run data are not retrieved and 'completed lineups' are unenumerated. The
      strongest opposing consideration is that AI-judge lineup experiments are exactly the
      method the site's own pilots found unstable (judge disagreement, kind-matching effects),
      so the headline rate could be an artefact of design rather than of the narratives.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record documents a concrete case of retelling-induced convergence; the
      verdict leans on general background knowledge that translation and comparative writing
      demonstrably converge details (e.g. harmonised retellings), which I flag as prior-based.
      The strongest opposing consideration is that the claim's truth condition requires
      documented cases against earlier attested versions, and the ledger holds none — the
      Berossus records (E043–E046) document an account, not a convergence.
  - claimId: DEEP-C035
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      A methodological claim that is nearly analytic: added claims about a source's identity,
      date and capabilities need evidence beyond resemblance by construction. No record tests
      it directly, so this rests partly on priors, but the founder's own text (quoted in the
      anchor) makes the distinction explicitly, and no ledger record suggests otherwise. The
      strongest opposing consideration is only that a proponent could argue converging,
      dated chains of intermediates can carry some identity claims — but that is evidence
      beyond resemblance, consistent with the claim as stated.
  - claimId: DEEP-C026
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No record states the models under which a distribution is compatible with both
      histories, so the core support is methodological background. DEEP-E061/E062 indirectly
      illustrate the point: the excavator's 'missing links' agnosticism shows that without
      dated intermediates both transmission and independent invention remain open. The
      strongest opposing consideration is that in principle a sufficiently fine-grained
      geographic and temporal distribution could discriminate under explicit models — the
      claim's 'by itself' qualifier makes this consistent, but the ledger never shows the
      models.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      As with C057, the only linked records (DEEP-E018, E019) are the author's qualifications
      about uneven catalogue coverage; no support record reproduces the finding that all
      three classes are widespread. The truth condition concerns the experiment's coded data,
      which are not in the ledger. Strongest opposing consideration: the page plainly asserts
      the result, but assertion by the case's founder is hypothesis material, not evidence.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and E014 weakly support the 55% figure as a self-report of the site's own
      experiment; the underlying Berezkin & Duvakin catalogue and the method page are not in
      hand, and the author's own records flag uneven coverage including the ancient Near East
      and Rapa Nui. The strongest opposing consideration is the second reader's point on
      E015 that the quoted passages scope rather than verify the proportion, so the support
      is thinner than the record count suggests.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      A single weak support record (DEEP-E016) reports the 37% figure as the page's own
      result, with the second reader noting E017 only scopes the geographic finding rather
      than confirming the number. Method and data unretrieved. The strongest opposing
      consideration is the same as for C005: an unaudited self-report on a dataset the author
      concedes is unevenly covered cannot carry more than weak weight.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim requires showing that the compared images fall into different categories
      (bird-headed deity, feathered person, transforming person), and no evidence record in
      the ledger codes any of the compared images into these categories. Background knowledge
      makes the distinction plausible — Rapa Nui birdmen are human figures with bird heads
      while some Near Eastern figures are bird-headed gods — but I flag that this is prior,
      not ledger evidence. The strongest opposing consideration is that the categories could
      overlap in specific images, which only coding the corpus would settle.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and E069 give moderate support from the peer-reviewed Pitts et al. abstract,
      which establishes the relative sequence statue → komari → bas-reliefs, so the birdman
      carvings postdate manufacture. The strongest opposing considerations: it is
      abstract-level only, gives a relative rather than absolute sequence, and the second
      reader had to correct the record's claim links at intake, showing the mapping between
      source and claim has required repair.
  - claimId: DEEP-C065
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      A methodological claim with no direct evidence record; it is near-analytic (shape
      constrains but does not determine function), and the ledger's own structure supports it
      — the team's refusal to decide the Pillar 43 forms' function (E028) sits alongside
      Schmidt's shape description (E025), an enacted separation. The strongest opposing
      consideration is that for some object classes shape and function are tightly coupled,
      so 'separate questions' is a heuristic, not a law.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is DEEP-E055, a weak record quoting Wiggermann 1992 secondhand through
      an unverified blog transcription with visibly garbled transliterations, and the
      transcribed passage covers the water/sprinkling half but not the cone-and-purifier
      half of the claim. The strongest opposing consideration is that the whole chain depends
      on an unchecked transcription; the primary (Wiggermann p. 66) is blocked and must
      replace it before this claim rises above weak.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is strong support: the excavation team's own published statement that 'a
      final decision on the meaning of these images' is not possible, which is exactly the
      claim's truth condition, and Schmidt 2006 (E025) confirms the description is
      shape-only. The strongest opposing consideration is that this is a 2016/2017 blog
      snapshot; later team publications (Schmidt 2012, Notroff et al. 2017, target of
      DEEP-R005) were not checked and could supersede it.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 gives moderate support: the authors' abstract states the strong wear suggests
      long suspension on a cord, matching the caption. But DEEP-E038 records the authors' own
      caveat that the inference rests on a single object and 'is far from being granted', the
      body of the paper is unread, and object identity with the photographed specimen is
      unconfirmed. The strongest opposing consideration is the authors' explicit
      non-confidence, which caps this at abstract-level provisionality.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and E062 record the team member's direct published statement that there are
      'far to many missing links' to establish survival of the imagery, which matches the
      claim. Support is capped because it is an informal comment-thread reply, not a formal
      publication, and both records share one locator. The strongest opposing consideration
      is that an informal reply is the weakest genre of team statement and later formal
      publications were not checked.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      The truth condition requires the four names' source histories to differ on language,
      date of first record and builder usage, and the ledger contains no records on any of
      the four names' attestations (DEEP-R002 is open). The methodological framing is
      plausible on background, but I flag that the verdict rests on priors. The strongest
      opposing consideration is that the claim is empirically checkable and could come out
      either way — a shared early, builder-used meaning for any one name would falsify the
      grouping as stated.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses the Turkish toponym's meaning; the founder page's caption
      is hypothesis material, and DEEP-R002, which would test it, is open. Background
      knowledge makes 'göbek' = belly/navel descriptive of a mound plausible, but that is
      prior, not evidence. The strongest opposing consideration is that the claim's own truth
      condition demands documented toponymic sources, none of which are in the ledger.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record tests this; the verdict leans on background knowledge that
      protruding carved limbs are mechanically vulnerable and that enclosing them against the
      body is a common protective solution in stone sculpture — a prior, flagged as such. The
      strongest opposing consideration is that the pose could have purely iconographic
      motivation in every examined case, and plausibility of a mechanism is not evidence it
      operated here.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The records toward this claim were deliberately downgraded to context: E075/E076 show
      Berossus describes Oannes as fish-bodied with a human head beneath, and E079 weakly
      supports the translators' alignment of Oannes with U-An, first of the apkallu — but the
      link dropped at intake shows nothing retrieved connects the Assyrian fish-cloaked
      figure's iconography to the named apkallu type. The strongest opposing consideration
      is that the correspondence's iconographic half is simply absent from the ledger, so the
      claim as stated is half-evidenced.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on whether any pre-modern source names the Gate of the Sun's
      central figure Viracocha; the page's assertion is hypothesis material and DEEP-R003's
      source-level work does not cover this identification. Background knowledge of colonial
      and modern attributions makes the claim plausible, which I flag as prior. The strongest
      opposing consideration is that a pre-modern identifier could exist in unexamined
      colonial-era or earlier Andean sources.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger concerns the flood pilot at all — no coded data, no
      methodology, no result record; the claim's truth condition requires the pilot's coded
      data to show regional clustering under a stated measure, none of which is in hand. The
      strongest opposing consideration is only that the page presumably reports the result,
      but a founder's unrecorded assertion cannot be weighed.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      Like C031, this has no evidence records; the Genesis-detail unevenness is quoted in the
      claim anchor but no record was ever split from it. The claim concerns a distribution in
      coded data that are not in the ledger. The strongest opposing consideration is that the
      finding, if real, is exactly the kind of pattern that would bear on transmission versus
      regional tradition, which makes retrieving the pilot data the highest-value next step.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 weakly supports the claim as a direct self-report of the pilot finding that
      kind-matched lineups changed the result, with pilot data unretrieved and the page
      itself noting incomplete runs and cropping constraints. The strongest opposing
      consideration is that the second reader had to correct this same record's scope,
      indicating the self-report's mapping to claims is fragile, and the magnitude of the
      change is unstated.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on inter-judge agreement: the one record near it (E022) was
      explicitly corrected by the second reader as not bearing on C037, and no agreement
      statistics exist in the ledger. The claim matters greatly for the case — unreliable AI
      judges would undercut the resemblance method — but the strongest opposing
      consideration is that its truth condition demands low agreement statistics that were
      simply never recorded.