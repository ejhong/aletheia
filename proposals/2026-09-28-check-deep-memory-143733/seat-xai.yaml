  synthesis: >-
    The featured question asks how much of the cross-cultural resemblances
    (bird-men, handled objects, navel names, civilisers, floods and related
    motifs) records a shared past versus independent invention, later
    retelling or the ways people form images and seek connections. The
    evidence records supplied do not settle that proportion. Methodological
    claims that are load-bearing are strongly warranted on their own terms:
    historical meaning of resemblance requires dates, contexts, differences
    and connections (C002); similarity alone cannot underwrite lost-civilisation
    identity, date or capability claims (C035); a catalogue distribution of
    broad motif classes cannot by itself separate independent invention from
    very old transmission (C026); shape and function of handled objects are
    separate questions (C065); and the three forms on Göbekli Tepe Pillar 43
    have no secure functional identification from the excavation team (C012,
    backed by the team's own 2016 statement). These points collectively block
    any leap from side-by-side visual similarity to a deep shared source.
    Local observational claims that can be checked against retrieved primaries
    are mixed in strength and scope: the Jiroft chlorite handle wear is read
    by its analysts as long suspension on a cord but on a single object with
    an explicit caveat (C009); birdman carvings on Hoa Hakananai'a post-date
    the statue (C059, abstract-level sequence); Assyrian banduddû has a
    ritual bucket reading in second-hand transcription (C044, weak); and the
    team itself treats survival of Early Neolithic imagery into later Near
    Eastern objects as unestablished because of missing links (C072).
    Statistical results reported from the founder's own catalogue, lineup and
    flood-coding experiments (C005, C025, C027, C056, C057, C031, C054, C037,
    C038) rest solely on unaudited self-reports whose underlying data,
    methods and completeness are not in the ledger; they therefore supply
    only weak, provisional numbers that cannot yet diagnose transmission
    versus convergence. Navel-name source histories (C015, C018) and several
    civiliser identifications (C028, C053) lack primary attestation in the
    supplied records. Steelmanning a shared-past reading, the visual
    parallels remain striking and some lineup rates exceed chance under the
    site's own protocol, yet those observations are precisely what the
    methodological constraints say are insufficient without dated
    intermediates, functional identity and controls for retelling. The
    opposite reading (overwhelmingly independent invention plus later
    scholarly or popular convergence) is equally unproven by the same gaps.
    Because the ledger contains neither a chain of dated contacts that would
    establish deep inheritance nor a comprehensive negative survey that would
    rule it out, the proportion asked by the case remains unresolved. The
    verdict is not a safe default; it follows directly from the absence of
    decisive transmission or decisive disproof once the self-reports are
    discounted to their proper weak weight and the excavation-team statements
    on uncertainty and missing links are given force. Removal of the single
    strongest team statement on functional uncertainty would open more room
    for a handled-object comparison but would still leave the broader
    question unresolved, confirming that the case does not hang on one
    thread.
  steelman: >-
    The specific, repeated visual configuration of three handled/arched forms
    accompanied by animals on Göbekli Tepe Pillar 43 that matches the
    proportions and attachment style of later Near Eastern buckets closely
    enough that independent invention of that exact multi-object register
    layout remains an untested and statistically surprising coincidence under
    current models of motif generation.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a standard requirement of historical method: resemblance
      alone never assigns meaning without dates, contexts, differences and
      possible connections. No evidence record contradicts it, and general
      scientific practice calibrates it as true by definition of the truth
      condition given. Strongest opposing consideration is none; the statement
      is definitional rather than empirical.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only records are the founder's own self-report that the bundle does
      not stand out against documentation-preserving comparisons, qualified by
      the same page's admission of uneven catalogue coverage. Underlying data
      and method are not retrieved, so the numeric or comparative result
      cannot be audited. Strongest opposing consideration is that an unaudited
      self-experiment can easily under- or over-state distinctiveness once
      sampling bias is corrected.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Supported solely by the site's self-report of 62.5 % versus 9 % in
      completed V1 lineups; run data, incomplete-run counts and prompt details
      are absent. The contrast with random pairs is therefore uncheckable.
      Strongest opposing consideration is that AI lineup sensitivity to
      kind-matching and judge disagreement (noted elsewhere on the same site)
      can inflate partner ranking without any historical signal.
  - claimId: DEEP-C034
    verdict: established
    confidence: high
    reasoning: >-
      Documented processes of translation, borrowing and comparative writing
      routinely produce convergence of detail; the claim's truth condition is
      satisfied by the existence of such retellings in the historical record.
      No ledger evidence is required beyond the mechanistic statement itself.
      Strongest opposing consideration is that some core narrative kernels may
      resist convergence, yet the claim only asserts that stories can become
      more alike, which is uncontroversial.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      A lost-civilisation account adds identity, date and capability claims
      that resemblance cannot supply; the methodological point is elementary
      and matches the truth condition. Ledger evidence is unnecessary once the
      logical gap is recognised. Strongest opposing consideration is none
      material; prestige of a source never closes the evidential gap.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      Under any standard model of cultural transmission versus independent
      invention, a static geographical distribution of a broad motif class is
      compatible with both histories; additional chronological or intermediate
      evidence is required to distinguish them. The claim is therefore true by
      the stated condition. Strongest opposing consideration is that very
      dense, continuous distributions can raise the prior on transmission, yet
      still cannot by themselves decide it.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder's self-report states that the three broad classes are each
      widespread; the same page immediately qualifies coverage as uneven and
      categories as broader than the specific images under discussion.
      Without the coded catalogue the proportion remains unchecked.
      Strongest opposing consideration is sampling bias toward well-documented
      traditions that could artificially inflate apparent breadth.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Three self-report fragments give the 55 % figure and immediately limit
      its scope (it does not speak to pose/object/arrangement co-occurrence;
      coverage is uneven). No primary catalogue extract or method audit is
      present. Strongest opposing consideration is that an unaudited coding
      pass on a known uneven corpus can produce almost any baseline.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Identical footing to the bird-person frequency: self-reported 37 %
      qualified by the page's own scope and coverage caveats, with no
      underlying data retrieved. Strongest opposing consideration is again
      unverified coding decisions and geographic undersampling that could move
      the percentage substantially.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The interpretive distinction among deity-with-bird-head, feather-wearer
      and transforming person is a reasonable reading of the heterogeneity of
      the compared images; the truth condition is satisfied if those images
      fall into different categories, which they visibly do on the founding
      pages. No formal typology is supplied in the ledger. Strongest opposing
      consideration is that some ethnographic cases deliberately blend the
      three ideas, so the grouping may still capture a family resemblance.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract states a clear relative sequence: statue
      manufacture, then komari added, then bas-relief birdman carvings
      succeeding them. That directly entails the birdman carvings post-date
      manufacture. Absolute dates and the full argument sit in the unread body,
      yet the abstract-level sequence is unambiguous. Strongest opposing
      consideration is that an abstract can compress or omit dissenting
      stratigraphic detail present in the full paper.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape similarity never entails functional identity; the claim is a
      direct methodological consequence of that separation and is reinforced
      by the excavation team's refusal to assign function to the Göbekli forms
      while Assyrian texts do assign function to the banduddû. Strongest
      opposing consideration is none; the distinction is definitional for
      material-culture comparison.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      A second-hand blog transcription of Wiggermann 1992 states that
      banduddû denotes the bucket held by relief figures and was filled with
      water for sprinkling in ritual. The primary page is unread and the
      transcription is flagged as possibly garbled. Strongest opposing
      consideration is that an unchecked secondary copy may mis-render the
      ritual context or omit contrary passages.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The excavation team's own 2016 post explicitly closes the discussion by
      stating that a final decision on the meaning of the three images is not
      possible at present. That matches the claim's truth condition exactly.
      Later monographs remain unchecked, yet the published team statement
      stands. Strongest opposing consideration is that a subsequent formal
      publication could have committed to a reading after 2017.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Vidale & Micheli abstract reports wear traces on the handle and contour
      and reads them as evidence the object was suspended for a long time on a
      cord, while immediately limiting the inference to a single object.
      Object identity with the photographed specimen is not proven from the
      abstract alone. Strongest opposing consideration is that the unread body
      may qualify the wear interpretation further or describe additional
      traces inconsistent with hanging.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      A comment-thread reply by a team member states there are far too many
      missing links to be sure of the extent of survival of Early Neolithic
      imagery and that any meaning change cannot yet be assessed. The statement
      is informal and not a monograph claim. Strongest opposing consideration
      is that the same team has elsewhere pointed to possible continuity in
      stamp seals, which could soften the agnostic stance once those seals are
      examined.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      The four names differ in language family, earliest written attestation
      and whether any ancient builder is known to have used the term; those
      three axes of difference are definitional to the claim and require no
      further empirical support once the source histories are acknowledged as
      non-identical. Strongest opposing consideration is that a shared bodily
      metaphor could still be historically homologous even if the documentary
      trails differ.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the packet supplies a toponymic or excavation
      source for the claim that the modern Turkish name is purely descriptive
      of mound shape rather than a sacred designation. The founding page
      asserts it, but that page is hypothesis material, not evidence. Strongest
      opposing consideration is that folk etymologies frequently overlay older
      sacred names, so the descriptive reading could be secondary.
  - claimId: DEEP-C047
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Carving limbs in relief against the stone body is a well-known practical
      solution to breakage in freestanding sculpture; the claim only asserts
      that material constraint is a plausible contributor, which follows from
      ordinary stone-working mechanics. No ledger experiment is required.
      Strongest opposing consideration is that many cultures with the same
      constraint still choose other poses, so constraint alone does not explain
      the specific hands-on-body preference.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Berossus F1 describes a fish-bodied, human-headed teacher whose form was
      preserved in sculpture; translators' tables align Oannes with U-An, first
      of the apkallu. The iconographic half (that the fish-cloak type is the
      named apkallu) is not directly evidenced in the retrieved fragments, only
      contextually implied. Strongest opposing consideration is that the
      correspondence is a modern scholarly alignment, not a statement internal
      to Berossus or the Uruk tablet.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No pre-modern source or modern scholarly demonstration that the
      identification is exclusively modern appears in the evidence records.
      The founding page asserts it, but that is not evidence. Strongest
      opposing consideration is that ethnohistoric or early colonial texts
      might already apply the name Viracocha to the staff-bearer, which would
      falsify the claim if retrieved.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim rests on the founder's report that coded details of 263
