      statistic is present in the ledger. Without those the result cannot be
      evaluated. Strongest opposing consideration is that any coding scheme
      using geographic metadata can produce apparent regional clusters by
      construction.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies the coded distribution or the list of
      Genesis-associated details; only the founder's summary statement exists.
      The claim is therefore unevidenced in the packet. Strongest opposing
