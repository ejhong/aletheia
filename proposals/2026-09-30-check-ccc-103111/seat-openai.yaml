  synthesis: >-
    This verdict addresses the featured empirical hypothesis that the
    reported circles and Hawking points are observable imprints of a
    preceding aeon, not the bare mathematical possibility that some
    conformally cyclic cosmology could exist. The strongest case for that
    hypothesis is not frivolous. The general CCC framework predates the
    searches; multiple analyses recover low-variance rings or warm spots
    in the actual maps; the founding circle procedure was independently
    reproduced; Planck and WMAP share prominent Hawking-point locations;
    and the proponents report structural details such as circularity,
    radius cut-offs, and strongly concentrated ring centres. These facts
    rule out dismissing the program merely because of its origin or
    because the visible features are imaginary.

    They do not, however, establish the required anomaly or attribution.
    For circles, several independent analyses reproduce the observed
    structures while finding comparable structures in simulations drawn
    from the full ΛCDM angular power spectrum. The evidence therefore
    separates feature existence, which is established, from incompatibility
    with ΛCDM, which is contradicted. Realistic anisotropic noise, the
    proponents' published search parameters, Planck data, and a broad
    radius range all lead to the same local result. Bodnia et al. further
    identify a concrete false-positive mechanism: a few extreme pixels can
    manufacture numerous low-variance and near-concentric rings under the
    published criterion.

    The Hawking-point branch fares similarly. Its nominal 99.98% confidence
    falls to 87% when ring size is marginalized, much of the remaining
    statistic depends on very few points, an independently validated
    detector finds no significant population, and a maximum-resolution
    search reports null results for the modeled amplitude and profile
    range. Cross-instrument co-location establishes that strong locations
    belong to the shared sky rather than independent instrument noise; it
    does not distinguish a previous aeon from ordinary CMB structure or
    shared analysis artifacts.

    The methodological record explains why striking nominal significances
    repeatedly disappear. No search used a blind or preregistered protocol,
    and the signal statistic, size window, thresholds, abundance, profile,
    and null ensemble were not quantitatively derived from CCC in advance.
    The 2025 mass-temperature relation is theoretical progress but does not
    rehabilitate the earlier detections. Meanwhile, mass fade-out remains
    without a supplied particle-physics mechanism, the original entropy
    reset faces a direct quantum-information objection, and the only
    quantitative calculation of the proposed erebon gravitational-wave
    signal places the modeled backgrounds far below detector sensitivity.

    The conventional claim that ΛCDM and search effects “fully” explain
    every reported detail is itself too strong: the sky-twist circularity
    result and the specific 1134-centre concentration have not received
    matched, independent reruns. Those surviving gaps prevent treating
    the case as a proof that CCC in every possible form is false, but they
    do not rescue the present attribution claim. The single record whose
    removal would most change the case verdict is CCC-E012, because it
    supplies both a generative artifact mechanism and modern null searches
    for both signature classes. The contradicted verdict nevertheless
    survives without it: CCC-E002, CCC-E003, CCC-E004, CCC-E008, CCC-E010,
    CCC-E011, and CCC-E037 independently dissolve the headline
    significances under appropriate nulls and search corrections.
  steelman: >-
    The 2013 sky-twist observation—that concentric sets reportedly collapse
    when circles are made even slightly elliptical, with an apparent
    15–20-degree radius cut-off—has never been independently repeated using
    a matched ellipse-specific ΛCDM null, frozen masks, and artifact
    screening. A proponent can rightly demand that direct test before the
    most distinctive structural circle argument is declared explained.
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The maps contain recoverable features, but the evidence does not
      support their attribution to black-hole events in a previous aeon.
      Independent reanalyses make the circle and Hawking-point statistics
      typical or insignificant under ΛCDM nulls, while CCC-E012 identifies
      a concrete false-positive mechanism. The strongest opposing
      consideration is CCC-E006's unreplicated sky-twist result, together
      with the concentrated ring centres and cross-instrument spot
      locations; these remain specific open observations but do not
      establish the claimed causal origin.
  - claimId: CCC-C010
    verdict: mixed
    confidence: moderate
    reasoning: >-
      ΛCDM simulations, look-elsewhere correction, sensitivity to a few
      points, and few-pixel artifacts account well for the headline circle
      and Hawking-point significances. The positive Planck scorecard also
      shows that the null model is quantitatively constrained rather than
      an arbitrary placeholder. The strongest opposing consideration is
      the word “every”: no evidence record supplies a matched independent
      rerun of the sky-twist statistic or the specific 1134-centre
      concentration, so complete accounting is not established.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: >-
      Several independent reanalyses recover the circle structures but
      find them compatible with skies drawn from the ΛCDM power spectrum,
      including analyses with realistic noise, Planck data, the proponents'
      parameters, and radii extending to 90 degrees. This directly
      contradicts the claim that the families are incompatible with
      standard ΛCDM. The strongest opposing evidence is CCC-E006's
      simulation-free sky-twist result and CCC-E007's 99.7% report, but
      both use statistics developed after inspection and neither overturns
      the replicated null-ensemble findings.
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: >-
      Marginalizing over the searched ring size reduces the claimed
      99.98% confidence to 87%, and a substantial fraction of the residue
      depends on the most significant individual points. Independent
      purpose-built and maximum-resolution searches find no significant
      Hawking-point population for the profiles they test. The strongest
      opposing consideration is the Planck-WMAP co-location of prominent
      spots, but shared celestial locations are expected for any real CMB
      feature and do not restore the claimed statistical confidence.
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: >-
      Independent groups explicitly reproduce the low-variance ring
      structures generated by the published procedure in WMAP and confirm
      analogous apparently special directions in Planck. This establishes
      the claim's local observational content without implying that the
      features are anomalous. The strongest opposing consideration is
      CCC-E012's finding that extreme few-pixel spots can generate many
      such circles, but that explains the structures rather than denying
      that the procedure reproducibly finds them.
  - claimId: CCC-C003
    verdict: established
    confidence: high
    reasoning: >-
      The proponents explicitly state that they used a pure Gaussian sky
      plus WMAP noise while their critics used simulations based on the
      ΛCDM CMB power spectrum. Independent analyses consistently report
      that the observed features become typical under the latter
      ensemble. The strongest opposing consideration is the proponents'
      substantive contention that the ΛCDM-spectrum ensemble is the wrong
      conception of chance, but that objection confirms the location of
      the disagreement rather than contradicting this methodological
      claim.
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      The evidence inventory finds no blind or preregistered CCC-signature
      search, and it documents that each study supplied its own statistic,
      size range, thresholds, or signal model. Repeated changes in those
      choices materially alter the reported significance. The strongest
      opposing considerations are that CCC itself predates the searches
      and that CCC-E008 reused the proponents' published parameters, but
      neither constitutes formal preregistration of a quantitatively
      derived signal and complete analysis protocol.
  - claimId: CCC-C503
    verdict: established
    confidence: high
    reasoning: >-
      CCC-E006 directly records Gurzadyan and Penrose's report that
      concentric-set prevalence falls sharply with ellipticity and that
      observed radii reach about 15 degrees but not beyond 20 degrees.
      Because the claim concerns what the authors reported, the primary
      record is sufficient for its local truth. The strongest opposing
      consideration concerns interpretation rather than reporting
      accuracy: the statistic was introduced with its successful result
      and has not been independently rerun against a fair ellipse-specific
      null.
  - claimId: CCC-C504
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The primary evidence supports the core report that about 83% of 1134
      centres fell within three concentrated regions. However, the quoted
      source says each region covered no more than about 3% of the searched
      sky, whereas the claim as written says the three regions together
      covered roughly 3%; that numerical distinction is not resolved by
      the records. The strongest consideration favoring the claim is the
      direct full-text report, while the strongest alternative explanation
      is that regional clustering can arise from large-angular-scale CMB
      structure.
  - claimId: CCC-C501
    verdict: established
    confidence: high
    reasoning: >-
      CCC-E007 directly records the published report of ring-type
      structures at 99.7% confidence relative to artificial maps with the
      same harmonic content. This assessment establishes that the result
      was reported, not that its confidence is globally valid or that the
      rings support CCC. The strongest opposing consideration is that the
      statistic and threshold were selected post hoc by a
      proponent-adjacent group, which limits the report's inferential
      weight but not its historical accuracy.
  - claimId: CCC-C509
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The evidence reports a Gaussian-sky mean nearest-neighbour distance
      of 0.20 with standard deviation 0.03 and states that the data at both
      tested scales fall within one standard deviation, yielding no
      anomalous clustering. This supports the claim's substantive
      conclusion, although the evidence statements do not independently
      reproduce both exact observed values printed in the claim. The
      strongest opposing consideration is limited power: only the top 30
      points and 100 simulations were used, so subtler clustering could
      have gone undetected.
  - claimId: CCC-C523
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      CCC-E056 and CCC-E057 report that the large-radius variance deficit
      can be traced to anomalous low-order multipoles and is another
      manifestation of known large-angular-scale CMB structure. This is a
      positive causal analysis rather than merely a failure to detect CCC
      rings. The strongest opposing consideration is that the evidence
      excerpts do not themselves establish the exact upper boundary
      ℓ = 7, and the low-multipole anomalies remain unexplained even if
      they mediate the ring statistic.
  - claimId: CCC-C524
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Bielewicz analysis explicitly interprets regional clustering of
      low-variance rings as indicating large-angular-scale map features
      rather than randomly placed sources, consistently with its
      low-multipole attribution. This supports the claim as an inference
      from the observed spatial pattern. The strongest opposing
      consideration is the proponents' alternative interpretation that
      concentrated centres could reflect clustered previous-aeon sources;
      the specific later 1134-centre statistic has not been directly
      tested against low-multipole-conditioned simulations.
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      Penrose explicitly states that strict CCC requires asymptotic mass
      fade-out and calls it an admittedly unconventional hypothesis, while
      Tod lists implementation of mass fade-out as an open problem. The
      2025 crossover conservation law does not provide the missing
      particle-physics mechanism. The strongest opposing consideration is
      Penrose's argument that positive-Λ particle physics may make the
      proposal plausible and that current observations do not contradict
      it, but plausibility is not an implemented or accepted mechanism.
  - claimId: CCC-C006
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only direct critical audit in the evidence argues that Penrose's
      assumed information loss increases global quantum entropy and is
      incompatible with the entropy renormalization required at crossover.
      That argument contradicts the strong assertion that the original
      accounting is demonstrably legitimate and self-consistent. The
      strongest opposing consideration is that this is one contribution
      within an unsettled quantum-gravity dispute and that a unitary CCC
      variant may preserve the broader framework, so the verdict does not
      establish that every possible entropy treatment fails.
  - claimId: CCC-C007
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Penrose's theory paper clearly proposes Planck-mass,
      gravitationally interacting, unstable erebons as dark matter and
      raises gravitational-wave detection as a possible test. However,
      the only quantitative calculation in the packet finds the modeled
      direct and memory-effect backgrounds vastly below detector
      sensitivity, qualifying the detectability component. The strongest
      consideration favoring the claim is that Allen's calculation covers
      a narrow homogeneous two-body decay model and not every conceivable
      nearby anisotropic impulse; no evidence record independently
      supports the dark-matter identification itself.
  - claimId: CCC-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The evidence directly establishes that CCC contains no inflation and
      assigns the origin of CMB fluctuations to erebon decay associated
      with the previous aeon. Thus the claim is well supported as a
      description of the theory's intended replacement mechanism. The
      strongest opposing consideration is Tod's observation that deriving
      the familiar perturbation spectrum remains an open problem, while
      Planck provides a quantitative inflationary fit; the attribution has
      not yet become a successful quantitative prediction of near
      scale-invariance.
  - claimId: CCC-C505
    verdict: established
    confidence: high
    reasoning: >-
      Penrose's 2017 note explicitly proposed that apparently correlated
      detector noise might instead consist of gravitational events from
      decaying Planck-mass erebons, so the historical claim is established.
      This does not establish that the proposal is physically correct.
      The strongest opposing considerations are that a maximum-likelihood
      waveform analysis removes the motivating GW150914 residual
      correlation and Allen's modeled erebon signal lies far below LIGO
      sensitivity.
  - claimId: CCC-C519
    verdict: established
    confidence: high
    reasoning: >-
      CCC-E042 directly supplies the stated assumptions and result:
      Ω_GW at 25 Hz is below 2 × 10⁻¹⁰³ for the direct two-graviton
      background, approximately 95 orders below the cited O1+O2 limit.
      The claim accurately reports that calculation rather than
      generalizing it to all erebon signatures. The strongest opposing
      consideration is its narrow scope: it assumes a homogeneous
      cosmological population and concerns a stochastic direct background,
      not an individual nearby impulsive event.