  synthesis: >-
    I read the featured hypothesis as the shared-past reading of the Deep Memory question.
    On that reading, a substantial part of the resemblance among the catalogued bird-men,
    handled objects, belly poses, navel names, serpents, civilisers and floods records a
    common source, long-distance contact or very old transmission. The rival accounts are
    independent invention, material convergence and retelling. On this ledger the hypothesis
    is unresolved. That is not a finding that the evidence is balanced. The verdict stops
    short of contradicted for structural reasons, not out of charity.

    The best-supported claims in the case are methodological. Resemblance alone cannot assign
    a history (C002). A broad motif's geographical distribution cannot by itself separate very
    old transmission from repeated invention (C026). Similarity cannot establish a source's
    identity, date or capabilities (C035). These hold on inference, and they set the bar: the
    hypothesis needs evidence other than likeness, such as dated intermediates, shared
    arbitrary detail or a channel. The ledger contains none.

    Every item leaning toward a shared past is either the resemblance itself or an unaudited
    self-report of it: the 55% and 37% base rates (C005, C025) and the 62.5%-versus-9%
    civiliser lineup (C027). All of these come from the founder's page, which the ledger
    records as unverified hypothesis material.

    Where non-resemblance data have been retrieved, they point to local histories:
    - The excavator describes the Pillar 43 forms only by shape. The team declines a final
      reading while entertaining a building interpretation (E025, E028; C012).
    - The banduddû's ritual use comes from Assyrian texts, transcribed secondhand (C044).
    - The Jiroft object's function comes from its own wear (C009).
    - The Rapa Nui birdman reliefs were added after the statue. They are read against a myth
      recorded in the nineteenth and early twentieth centuries (C059; E071).
    - Oannes is aligned by his translators with U-An, first sage of a Mesopotamian apkallu
      list (C053; E079).
    The one named route is survival of Göbekli imagery into later Near Eastern objects. It is
    unestablished in the excavators' own words (C072).

    Steelmanning the sceptical reading: this is a consistent pattern, not scattered noise.
    Each resemblance examined closely resolves into a different function, date or local
    lineage. High base rates make any trio of matches unremarkable. And on the founder's own
    account, matching object kinds in the image pilots changed the lineup result (C038).

    Steelmanning the hypothesis: none of this is incompatible with it. A deep common source
    would be expected to be reinterpreted locally. Missing intermediates are an absence of
    retrieved evidence, not a demonstrated gap, and the excavators call survival possible. The
    catalogue null (C057) exists only as an anchor. Its catalogue is, by its author's account,
    thinnest for the ancient Near East and Rapa Nui, and it is coded in broad categories (E018,
    E019). Three of the six themes (navel names, feathered serpents, floods) have no retrieved
    primary or scholarly source at all. The civiliser theme has scholarly records only for its
    Mesopotamian member.

    A contradicted verdict would need a demonstrated independent origin, or dates excluding
    contact, for a load-bearing parallel; the ledger holds neither. No evidence record gives
    absolute dates for the compared cultures. The chronological and geographical priors that
    make direct contact between Göbekli Tepe, the Olmec and Rapa Nui implausible are therefore
    acknowledged here but not used. The verdict is not mixed, because nothing on the
    hypothesis's side discriminates between histories. It is not presently untestable, because
    the discriminating tests are specified and feasible (R002–R005).

    Sensitivity: the single most influential record is E028. It is the excavation team's
    statement that no final decision on the Pillar 43 forms is possible, together with its
    building reading, and it is the only strong-rated record that speaks to what those forms
    were. Without it, Schmidt's "handle-like attachments" (E025) would stand unopposed, and the
    handled-object comparison would look firmer at the level of shape. The verdict still
    survives as unresolved, because shape resemblance carries no history under C002 and C026.
    The verdict hangs on no single thread. It rests on the absence of any record bearing on
    transmission, which only new evidence can change: dated seals (R004), source-level
    civiliser lineups (R003), or an audited co-occurrence test.
  steelman: >-
    The one measurement in the ledger that points to a real, above-chance pattern is left
    unanswered. In the V1 lineups the claimed civiliser partners ranked first in 62.5% of
    completed lineups against 9% for random pairs (E020, E021). No record shows that signal to
    be an artefact. The alternative this assessment leans on is similarity manufactured by
    translation, colonial recording and modern retelling (C034), and it has no evidence record.
    It also cannot account for the oldest member of the set. Berossus's Oannes already appears
    from the sea and teaches writing, laws, city-building and agriculture in an ancient text
    (E043, E046), long before any modern comparative writing. The untested prediction (R003) is
    whether the Andean, Mexican and Colombian civiliser accounts share those elements in their
    earliest colonial versions at a rate above random hero narratives. That test could come out
    in the hypothesis's favour.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      A resemblance is equally compatible with common descent, contact, convergence and
      retelling. Only data outside the likeness itself can choose among those histories:
      dates, contexts, the detailed differences and a possible channel. This verdict rests on
      that inference, not on a test. The ledger illustrates it. The Rapa Nui birdman reliefs
      change meaning once shown to postdate the statue (E068, E069). The Urfa Man's hands grasp
      the genitals rather than rest on the body (E081), a difference that a shared "hands on
      the body" description hides. The strongest opposing consideration is that very specific,
      arbitrary, multi-element matches can make some connection probable from the resemblance
      alone, so the universal "no resemblance" overstates the point in degree; even then,
      direction, date and mechanism still need the other data.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record reports the bundle result. The two records attached to the claim (E018,
      E019) are the author's coverage caveats; they qualify the catalogue without reporting any
      comparison. The "documentation-preserving comparisons" are described nowhere in the
      ledger, so what "does not stand out" means operationally is unknown. The claim rests on
      its anchor in the founder's page, which is hypothesis material, not evidence. The
      strongest opposing consideration is that the page's statement is a negative result
      against its author's interest, the kind of self-report that is usually reliable. Even an
      audited null would carry limited weight, because the catalogue's coverage is, by the
      author's account, thinnest for the ancient Near East and Rapa Nui, where the hypothesis's
      parallels sit.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E020 and E021 are one sentence of the founder's page split into two records, so together
      they are a single unaudited self-report. The run data, the number of completed lineups
      and the handling of incomplete runs are not in hand, and the truth condition
      (reproduction from run data) is untested. No count is given; 62.5% is compatible with as
      few as eight completed lineups, so sampling uncertainty cannot be judged. Which lineups
      reached completion is an unexamined selection step. The judges were AI models, whose
      agreement the same page questions in its image pilots (C037, itself unevidenced). The
      strongest opposing consideration is that the page also reports findings unfavourable to
      its own case (E022), which tells against selective reporting and would support taking the
      figures at face value.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim asserts only that retelling can make stories converge. On general background it
      is very likely true: it is widely recognised that translators, missionaries, colonial
      chroniclers and comparative compilers reshaped the myths they recorded toward familiar
      templates. The verdict leans on that background, disclosed as such. The ledger itself
      holds only leads. Berossus survives solely through excerptors (Polyhistor, Syncellus). The
      founder's "arrives, teaches and departs" template may also compress an account in which
      Oannes returns to the sea each night, though that point is anchored in a claim and in no
      evidence record. The strongest opposing consideration is that no evidence record
      documents a retelling converging relative to an earlier attested version, which is the
      claim's own truth condition. The mechanism's reach is also limited: arrival from the sea
      and the gift of the arts are already in Berossus's ancient text (E043, E046), so retelling
      cannot account for all of the civiliser resemblance.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      This is an inferential point rather than an empirical finding. A resemblance between
      motifs carries no information about who the source was, when it existed or what it could
      do. Any such claim therefore needs evidence beyond the resemblance: dated remains,
      material culture, a demonstrated channel. The ledger shows what that further evidence
      would look like and that it is missing for the compared cases (the excavators' "missing
      links", E061). The strongest opposing consideration is that some motifs carry content,
      such as encoded astronomy or a technical procedure, from which capabilities might be
      inferred. But that is evidence from content and context rather than from similarity, so it
      falls outside the claim rather than against it.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A broad class present in a large share of traditions is predicted by two histories: very
      old transmission from a common source, and repeated invention prompted by animals, bodies
      and landscapes found almost everywhere. A presence-absence map therefore yields no
      likelihood ratio between them. The verdict rests on this identifiability argument rather
      than on a record. The nearest evidence (E061, E062) shows that the discriminating datum,
      dated intermediates, is exactly what the excavators say is missing even for the local
      Near Eastern case. The strongest opposing consideration is that areal and phylogenetic
      methods can extract historical signal from distributions under explicit models (spatial
      autocorrelation, fit to language trees, clustering of specific rather than broad motifs).
      "Cannot by itself" thus holds for raw distributions of broad classes, not for modelled
      distributions of specific motifs.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No record attached to this claim reports a frequency; E018 and E019 are coverage caveats.
      Two of the three classes have self-reported figures elsewhere in the ledger: bird-person
      55% (E013) and cosmic serpent 37% (E016). These would count as widespread if the coded
      data reproduce them. No record gives any figure for sacred centres, and "widespread" is
      left undefined. The strongest opposing consideration is that everything here is the
      author's unaudited self-report from a catalogue whose coverage he calls uneven. Even the
      two figures in hand could move materially with better Near Eastern and Pacific coverage,
      and the unevidenced third conjunct keeps the claim as a whole only weakly supported.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The only support is the founder's statement of his own result (E013, with E014 split from
      the same passage: one self-report, not two). Neither the coded data nor the method is in
      hand, so the truth condition, reproduction from the coded data, is untested. Nothing
      contradicts the figure, and a plain frequency with a stated denominator (926) is the kind
      of report least likely to be misstated. The qualifiers (E015, E018, E019) do not dispute
      the number but bound it: broad narrative categories, uneven coverage, and no information
      on co-occurring poses or objects. The strongest opposing consideration is that the
      boundary of a broad "bird-person" class is a coding choice. Another coder might not
      reproduce the proportion even from the same catalogue.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      E016 is the page's statement of its own 37% figure, unaudited. E017 confines the result to
      the selected category and dataset. E018 and E019 add uneven coverage and the gap between
      broad categories and specific images. The truth condition, reproduction from the coded
      data, is untested, but nothing in the ledger contradicts the figure. The strongest
      opposing consideration is that "cosmic serpent" is a broad, interpretive class whose
      frequency depends heavily on coding rules the ledger does not hold.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The conceptual core is sound: a bird-headed deity, a person in feathers and a person
      becoming a bird are different claims about what an image shows. The truth condition,
      however, requires that the compared images actually fall into different categories. No
      evidence record classifies the Göbekli, Nimrud or Rapa Nui figures. The nearest record
      (E071) ties the Rapa Nui reliefs to the island's ethnohistorically recorded birdman myth.
      On general background that myth concerns a human ritual office rather than a bird-headed
      god, a step that leans on priors. The strongest opposing consideration is that the
      categories may blur in practice, as when a masked or costumed person enacts a deity or a
      transformation. The three-way split could then be an analyst's distinction that hides a
      shared underlying concept.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: high
    reasoning: >-
      The peer-reviewed survey's abstract gives an explicit relative sequence (E068, E069). Two
      komari were "subsequently added" to the statue. Bas-relief carvings then succeeded them,
      read as a composition narrating the birdman myth. That is exactly what the claim needs:
      the birdman carvings postdate the statue's manufacture. The strongest opposing
      consideration is that only the abstract has been read, so the reasoning behind the
      sequence is unexamined and no absolute date is given (E074). But the claim is relative
      only, and a published survey of the object stating the order is strong grounds for it.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      The ledger itself shows three similar handled shapes whose functions rest on entirely
      different bases. The banduddû's rests on Assyrian ritual texts (E055), and the Jiroft
      object's on its own wear traces (E035, E038). The Pillar 43 forms' rests on nothing
      secure: Schmidt describes shape without naming a function (E025), and the excavation team
      declines a decision while entertaining a building reading (E028). That the same carved
      forms can be read either as handled containers or as buildings is direct evidence that
      shape does not settle function. The strongest opposing consideration is that shape
      constrains function through affordances; a handle is some evidence for carrying. The
      questions are therefore separable rather than independent, and the verdict rests on their
      separate evidential bases, not on shape being irrelevant.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      E055 states the proposition directly. In rituals the banduddû "was filled with water", and
      the exorcist is told to take the bucket, bring water and "sprinkle that water over the
      man". E086 identifies the banduddû as the bucket held by relief figures. Both are
      attributed to Wiggermann's 1992 edition of the ritual texts. The weakness is provenance:
      this is an unchecked transcription on a personal blog with visibly garbled
      transliterations. The cone ("purifier") half of the interpretation is also absent from the
      transcribed text. The grade leans partly on priors about the source rather than on
      evidence in hand: the quoted English sentences are unlikely to have been garbled, and the
      attributed work is the standard edition. The strongest opposing consideration is that
      until the printed page is read, the ledger cannot exclude transcription or attribution
      error, and the purifier element remains unevidenced.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The excavation team's own published statement is that "a final decision on the meaning of
      these images" is not possible (E028). The excavator's first description names only shapes,
      "box-like objects with handle-like attachments", without a function (E025). The team's
      willingness to entertain a building reading shows that even the category of thing depicted
      is open. The strongest opposing consideration is completeness. The truth condition is a
      negative over all team publications, and only a 2006 note and a 2016–17 blog post have
      been read. Other team texts named in R005 (Schmidt 2012, Becker et al. 2012, Notroff et al.
      2017) could commit to an identification.
  - claimId: DEEP-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The truth condition is what the wear study reports. Its abstract reports wear "clearly
      visible on the handle and along its contour" (E034). It reads this as the hand-bag having
      been "suspended for a long time on a cord" (E035), which matches "consistent with having
      hung on a cord". The authors' caveat that the inference rests on a single object and is
      far from granted (E038) limits generalisation to other handled chlorite objects and to
      function. It does not limit this claim, which asserts consistency only. The strongest
      opposing consideration is that only the abstract has been read. Alternative sources of the
      wear, and the object's identity with the founder's photographed piece, are unexamined.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: high
    reasoning: >-
      The truth condition is met almost verbatim in a verified source (E061, E062). A team
      member's published reply says there are "far to many 'missing links' to be sure" about the
      extent of any survival of Early Neolithic imagery into later periods. It adds that changes
      of meaning cannot yet be assessed. The strongest opposing consideration is scope. This is
      one member's informal 2016 comment rather than a considered team publication, and it
      speaks of later periods rather than specifically of later Near Eastern objects. Its stance
      is agnostic (possible continuity, not denial), so it must not be read as the team
      rejecting survival.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record addresses these source histories (R002 is open). The verdict therefore
      leans on general background and on what the claim's own terms entail. The four
      expressions are in different languages. Garcilaso's gloss is a colonial record of 1609,
      the Greek omphalos an ancient usage, and Göbekli Tepe a Turkish toponym. A Turkish name
      cannot have been used by the site's Neolithic builders, since the language reached
      Anatolia millennia later. The strongest opposing consideration is that the builders'-use
      question is genuinely uncertain for Cusco and Rapa Nui, and no first-record date has been
      retrieved. The pattern of differences is therefore asserted rather than documented.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record addresses the Turkish toponym. The one record on the site's names
      (E024) concerns the Kurdish "wish hill" name; it is itself unsourced, and the second reader
      found it does not bear on this claim. The truth condition is documentary: the name must be
      recorded as describing the mound's form rather than as a sacred designation. Nothing
      retrieved meets it. On general background, a shape-descriptive "navel" or "belly" hill for
      a rounded mound is plausible, and that plausibility is the strongest consideration against
      leaving the claim open. But the navel theme turns on exactly whether such names carry
      sacred-centre meaning, so a prior cannot stand in for the toponymic source that R002 calls
      for.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record tests this, so the verdict leans on general background about stone.
      Slender, unsupported projections of a brittle material that is weak in tension break
      easily, and carving limbs in relief against the body is a familiar way to avoid that. The
      claim is modest: a plausible contributor, not the cause. The strongest opposing
      consideration is that material constraint explains limbs held close to the body but not
      where the hands meet. The Urfa Man's hands grasp the genitals (E081), while the founder's
      other examples are described with hands at the belly or chest. That variation is a
      representational choice the constraint does not predict, and no comparison of stone with
      wooden figures within a tradition is in the ledger.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The textual half is solid. Berossus F1 gives Oannes "the whole body of a fish" with a human
      head beneath the fish's head and human feet at the tail (E075). It says the form was
      preserved in sculpture (E076). This is a close description of a fish-cloaked figure, and
      the translators' table sets Oannes beside U-An, first of the apkallu in the Uruk list W
      20030,7 (E079). But both records linked to this claim are context, and the fragment never
      names the sculptural type (E076's own inference note). No record ties the Assyrian
      fish-cloaked figures to the apkallu the texts name. The strongest opposing consideration is
      transmission. Berossus survives only through Polyhistor and Syncellus, so excerptors may
      have shaped the description. The U-An alignment is also a secondary correlation whose
      tablet edition has not been read (E080).
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record addresses the identification, and the truth condition is a negative
      over all pre-modern sources. On general background the Tiwanaku builders left no texts, so
      no builder-period source can name the figure. But the ledger's own research plan names
      colonial chroniclers (Sarmiento, Betanzos) as the source-level Viracocha texts (R003). A
      pre-modern textual tradition about Viracocha therefore exists, and it has not been
      searched for any naming of the Gate figure. Whether sixteenth-century chroniclers count as
      pre-modern is also left undefined. The strongest consideration against leaving this open
      is that the identification's modernity is plausible on background and stated by the
      founder's page. But that statement is the claim's anchor, not evidence.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record addresses the flood pilot. The claim rests on its anchor in the
      founder's page, and neither the coded data nor the pilot's "stated measure" of clustering
      appears anywhere in the ledger. The strongest opposing consideration is that the page
      states the result plainly and the pattern is plausible a priori. But plausibility cannot
      confirm what a specific unaudited pilot found. Regional clustering would also be expected
      under regional diffusion and regional retelling alike, so even its confirmation would not
      discriminate between histories.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record addresses the claim; it rests on the founder's page alone. Neither the
      coding of "details associated with Genesis" nor the distribution itself is in hand, so
      "uneven" has no measure. This matters for the case, because a contact-linked concentration
      of Genesis-type details is exactly the evidence that would test the retelling mechanism
      (C034). The strongest opposing consideration is that the page reports the finding plainly
      and in a cautionary register, but without data it cannot be graded.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E022 states the claim directly, but it is the founder's unaudited self-report. The pilot
      data are not in hand, and the page itself says incomplete runs and cropping constrain the
      conclusions. The claim is also underspecified: "changed the lineup result" gives neither
      the direction nor the size of the change. The truth condition, a different ranking under
      kind-matched controls, therefore cannot be checked even in outline. The strongest opposing
      consideration is that this is a cautionary finding against the author's interest. That
      makes misreporting less likely and could justify a somewhat stronger grade.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim. The only pilot record (E022) was read by the
      second reader as saying nothing about agreement between judges. No agreement statistics
      are in the ledger, so the truth condition cannot be checked, and the claim rests on its
      anchor in the founder's page. The strongest opposing consideration is that the page reports
      this plainly and against its own interest, so once entered as evidence it would at least
      weakly support the claim. Its status matters because low agreement between AI judges would
      undercut the AI-judged civiliser lineup figures (C027).