  synthesis: >-
    The ledger's evidence records, dominated by the founder's self-reports of unaudited catalogue and lineup pilots plus a thin set of excavator notes and abstracts, yield a mixed picture for the founding question of how much cross-cultural resemblance in bird-men, handled objects, navel names, civilisers and floods records a shared deep past versus independent invention, material constraint, later contact or retelling. Methodological claims that historical meaning requires dates, contexts and connections beyond bare resemblance (C002), that catalogue geography of broad classes cannot by itself separate invention from ancient transmission (C026), and that motif similarity alone cannot underwrite a lost-civilisation source's identity, date or capabilities (C035) stand as established on disciplinary priors and are nowhere contradicted by the retrieved records; they correctly scope every positive parallel. Local observations reinforce the cautions: the Göbekli team itself states that no final decision on the meaning of Pillar 43's three forms is possible (E028 supporting C012) and that missing links prevent secure claims of imagery survival into later Near Eastern objects (E061/E062 supporting C072); Pitts et al. establish that the birdman bas-reliefs on Hoa Hakananai'a post-date the statue (E068/E069 supporting C059); the Jiroft wear reading of cord suspension is only abstract-level and single-object (E035/E038 for C009); Assyrian banduddû function rests on a second-hand transcription (E055 for C044); and Oannes–apkallu correspondence is at best contextual from Berossus fragments (E075/E076 for C053). Statistical claims of motif frequencies (C005, C025, C056), civiliser lineup elevation (C027), flood regional clustering and Genesis-detail unevenness (C031, C054), and AI-pilot disagreement or kind-matching effects (C037, C038) remain weakly supported at best because they rest solely on the founder's unretrieved run data and are further qualified by the page's own uneven-coverage notes (E018/E019). Hands-on-body pose admits a material-constraint contributor (C047) without settling symbolism. Navel-name claims are partly unresolved (C015) or rest on differing source histories (C018). Sensitivity: removal of DEEP-E028 (the team's explicit refusal of secure identification for the Pillar 43 forms) would most shift weight toward shape-based handled-object parallels and thereby soften the mixed verdict, yet the verdict survives without it; the remaining methodological anchors, missing-links statement, later birdman sequence, single-object wear caveat and unaudited statistics still prevent any strong shared-past conclusion. Taken together the records document that broad classes are common, that specific functions and sequences often diverge or post-date, and that the tools so far deployed (catalogue, AI lineups, text coding) do not isolate a distinctive deep bundle, leaving the balance between shared inheritance and convergence unresolved in detail but currently tilted against a single lost source.
  steelman: >-
    The V1 civiliser lineup's reported 62.5 percent first-rank rate for claimed partner figures versus 9 percent for random pairs, if driven by structural parallels already present in the unmodernised source passages rather than by summary compression or kind-matching artefacts, constitutes a quantitative signal of shared narrative templates that the methodological cautions and missing-link statements do not directly dissolve or re-explain.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim states a foundational requirement of historical interpretation: visual resemblance acquires chronological or cultural meaning only through dates, contexts, differences and possible connections. No evidence record disputes it; the principle is calibrated by standard archaeological and art-historical method (priors). Strongest opposing consideration is none; the statement is essentially definitional for any non-circular use of iconographic parallels.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E018 and E019 record the founder's own qualifications that the 2016 catalogue has uneven coverage and that broad categories are not the specific images of the claim, which is consistent with a non-standout bundle result. The positive report that the three-class bundle does not stand out against documentation-preserving comparisons remains a self-report without retrieved statistics or method page. Strongest opposing consideration is that the underlying Berezkin–Duvakin coding and comparison procedure are not in hand, so the null result could be an artefact of category breadth or sampling.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E020 and E021 directly quote the founder's report that claimed partners ranked first in 62.5 percent of completed lineups versus 9 percent for random pairs. The figures therefore support the claim as a self-report of the V1 run, yet the run data themselves are unrecovered and the page notes incomplete lineups. Strongest opposing consideration is the related pilot finding that kind-matching alters results (C038) together with the absence of human-rater or full-passage controls.
  - claimId: DEEP-C034
    verdict: established
    confidence: high
    reasoning: >-
      The mechanistic claim that stories can converge in detail through translation, borrowing and comparative writing is a documented process in folklore and textual transmission; general background supplies numerous attested cases (e.g., flood narratives). No evidence record is required beyond the logical possibility the claim asserts, and none contradicts it. Strongest opposing consideration is that not every pair of similar stories has undergone such secondary convergence, yet the claim is existential (“can”) and therefore holds.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Similarity of motifs is insufficient to establish the stronger identity, date and capability claims that a lost-civilisation account adds; those require independent evidence. The statement is a direct consequence of historical method (priors) and is nowhere challenged by the ledger. Strongest opposing consideration is the diffusionist view that dense pattern clusters can themselves license source inferences, but the claim correctly insists on evidence beyond resemblance alone.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographic distribution of a broad motif class is compatible with both independent invention and very old transmission under standard models of cultural evolution; the catalogue result therefore cannot by itself decide between them. The claim is methodological and reinforced by the excavator's missing-links statement (E061/E062). Strongest opposing consideration is that sufficiently dense and dated intermediate finds could in principle distinguish the histories, yet the claim is limited to “by itself” and remains true.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder page asserts that the three broad classes (birds, serpents, sacred centres) are each widespread; E018 and E019 supply the author's own caveats on uneven catalogue coverage and the distinction between broad categories and specific images. Support is therefore only the self-report qualified by those limitations. Strongest opposing consideration is the acknowledged undersampling of the ancient Near East and Rapa Nui, which could inflate or deflate the “widespread” characterisation.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E013 and E014 quote the page's statement that the broad bird-person class occurs in 55 percent of 926 sampled traditions; E015 and E018/E019 add the author's own scope limitations. The numeric claim is therefore supported solely as an unaudited self-report. Strongest opposing consideration is that the underlying catalogue coding, method page and raw counts have not been retrieved, leaving open the possibility of category inflation or sampling bias.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E016 quotes the page's report of a broad cosmic-serpent class in 37 percent of sampled traditions; E017 and E018/E019 qualify geographic and categorical scope. Support reduces to the same self-report footing as the bird-person frequency. Strongest opposing consideration is again the absence of the coded dataset and the page's admission of uneven coverage.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The interpretive claim that the label “bird-man” conflates at least three distinct ideas (bird-headed deity, feathered person, transforming person) holds if the compared images fall into different categories, which background iconographic knowledge confirms is often the case. No direct evidence record addresses the typology. Strongest opposing consideration is that some cultural traditions deliberately blend the three, yet the claim only requires that they need not be identical.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E068 and E069 from the Pitts et al. abstract establish the relative sequence statue manufacture → komari petroglyphs → bas-relief birdman carvings, so the birdman carvings were added later. The claim as stated is therefore directly supported at abstract level. Strongest opposing consideration is that only the abstract was retrieved, the body remains paywalled, and no absolute dates are given, yet relative posteriority is sufficient for the claim.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are logically and empirically separable questions; the Göbekli forms can be described as box-like with handle-like attachments (E025) while their function remains undecided (E028), and the Assyrian banduddû can be functionally identified without that identification transferring to every similar shape. The methodological distinction is standard (priors). Strongest opposing consideration is none; conflating the two is a recognised error.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E055, a second-hand blog transcription of Wiggermann, states that the banduddû was filled with water and used to sprinkle, supporting a bucket-and-purifier reading in ritual context. Strength is low because the transcription is unchecked against the printed page and the cone/purifier element is absent from the quoted passage. Strongest opposing consideration is the secondary, possibly garbled character of the sole retrieved witness and the lack of the primary edition.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      E028 records the excavation team's own published statement that a final decision on the meaning of the three images is not possible at present. That directly satisfies the claim's truth condition (no secure functional identification published by the team). Strongest opposing consideration is that later monographic treatments (still unread) might have settled the question, yet the 2016/2017 team position is clear and currently uncontradicted in the ledger.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      E035 quotes the Vidale & Micheli abstract's conclusion that strong wear suggests the hand-bag was suspended for a long time on a cord, matching the claim; E034 notes visible handle wear and E038 records the authors' single-object caveat. Support is therefore present at abstract level but qualified. Strongest opposing consideration is that only the abstract was read, object identity with the photographed specimen is unconfirmed, and the authors themselves limit generalisation.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      E061 and E062 quote the team member's comment-thread reply that there are far too many missing links to be sure of the extent of any survival of Early Neolithic imagery and that meaning change cannot yet be assessed. The claim that the team regards the matter as unestablished is therefore supported, albeit by an informal source. Strongest opposing consideration is the non-peer-reviewed, comment-thread genre and the possibility that subsequent team publications have altered the stance.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      The four “navel” expressions differ in language, date of first record and whether ancient builders used the name: Greek omphalos is classical, Garcilaso's Cusco gloss is colonial, Rapanui Te Pito o te Henua is ethnohistoric, and Turkish Göbekli Tepe is modern descriptive. The claim's truth condition (differing source histories on those three points) is met by well-known documentary facts (priors). Strongest opposing consideration is none; the differences are factual.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses whether the modern Turkish name Göbekli Tepe is documented as purely descriptive of mound shape rather than carrying a sacred designation. The founder page asserts the descriptive reading but supplies no toponymic primary. Strongest opposing consideration is that folk or sacred etymologies could coexist with shape description; primary Turkish/Kurdish sources are required.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Material constraints (protecting projecting limbs from breakage by carving them against the body) are a recognised practical factor in stone sculpture and therefore a plausible contributor to the hands-on-body pose. No direct evidence record is present; the verdict leans on technical priors. Strongest opposing consideration is that symbolic or ritual meanings may be primary and the material factor only secondary or coincidental.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E075 and E076 supply Berossus F1's description of Oannes as fish-bodied with human head and feet and the note that its form was preserved in sculpture; these are context for, but do not directly assert, correspondence to the fish-cloaked apkallu type. The identification remains a scholarly inference. Strongest opposing consideration is that the fragment itself never names apkallu or equates the two; iconographic and list-based links lie outside the retrieved passages.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record examines pre-modern sources for the name of the central staff-bearing figure on Tiwanaku's Gate of the Sun. The founder page asserts the Viracocha identification is modern, but the claim's truth condition (no pre-modern source names it Viracocha) has not been checked against colonial or indigenous texts. Strongest opposing consideration is that early Spanish or Andean sources might already employ the name; primary review is required.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim that coded details of 263 flood-story summaries cluster by region is a report of the founder's pilot; no evidence record extracts or reproduces the coded data, the clustering measure, or any statistical output. Strongest opposing consideration is that without the underlying matrix the reported regional signal cannot be evaluated for robustness or coding artefacts.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim of an uneven distribution of Genesis-associated details among the coded flood summaries likewise rests solely on the founder's unretrieved pilot; no evidence record supplies counts or maps. Strongest opposing consideration is the same absence of data: the unevenness may be real, an artefact of source selection, or an artefact of the coding scheme.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E022 quotes the founder's statement that matching the kinds of objects changed the lineup result in the image pilots. The claim is therefore supported as a self-report of a methodological finding. Strongest opposing consideration is that pilot data, cropping decisions and incomplete runs are unrecovered, leaving the magnitude and robustness of the kind-matching effect unknown.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim that AI judges disagreed strongly with one another is asserted by the founder page, yet no evidence record extracts inter-judge agreement statistics or raw scores. Related pilot notes mention unreliable feature coding but do not quantify disagreement for this claim. Strongest opposing consideration is the complete absence of the numerical results needed to confirm “strong” disagreement.