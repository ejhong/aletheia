  loadBearing: [TIK-C007, TIK-C010, TIK-C012]
  weakestLinks: [TIK-C012, TIK-C004, TIK-C006]
  synthesis: >-
    The case is a ladder, and the verdict splits cleanly along the case's own
    intended fracture line. The observation rung is genuinely solid: four
    independent archaeochemical studies (Tel Arad, Es Càrritx, the Bes
    vessel, Pinwheel Cave) establish that psychoactive plants were
    deliberately used in ancient ritual, and first-century pharmacology
    plausibly included visionary wine preparations. The mechanism rung is
    the strongest post-book development: the 2026 lye-hydrolysis experiment
    demonstrates, with published methods and quantified yields, that
    wood-ash lye can convert toxic ergopeptides into LSA and iso-LSA at
    doses near the literature minimum effective dose from roughly a gram of
    ergot — retiring the "ergot necessarily means ergotism" objection at the
    level of possibility, though only under narrow conditions and from an
    interested network with no independent replication. Above that, the
    ladder fails. The Eleusinian attribution (TIK-C007) rests on one
    unreplicated, secondhand-cited find a thousand kilometers away, against
    a canonical recipe naming nothing psychoactive and an unusually
    well-audited sanctuary economy recording no drug expenditure; the
    pharmacological payoff (TIK-C006) is not established, since the LSA
    literature stops at "psychoactive, can hallucinate" and does not reach
    "reliably profound and positive." The Christian half fails outright:
    the earliest documentary witnesses (Didache, Justin) show a Jewish
    berakah-form rite over bread and wine-with-water, the only "drugged
    cup" text is hostile heresiology about a conjuring trick, the
    proponent himself declines to defend the Last Supper claim, and the
    transmission thesis is rejected by specialists including reviewers
    from the thesis's own constituency. Sensitivity: TIK-E008 (the 2026
    experiment) is the single record whose removal would most change this
    verdict — without it, C005, C028 and C033 collapse toward unresolved
    and the Greek mechanism rung loses its only hard result. The mixed
    verdict survives that removal, because the background rung, the
    documentary record against the Christian half, and the proponent's own
    concessions do not depend on it. TIK-E007 (Mas Castellar) is the
    second-most consequential record; removing it would drop C004 to
    unresolved but again not flip the case verdict.
  steelman: >-
    Every rung of this hypothesis that has ever been subjected to a direct
    test has returned a pro-hypothesis result: ancient ritual psychoactive
    use is now chemically proven in three independent Mediterranean
    contexts; the twenty-six-year-old detoxification prediction was run in
    2026 and worked; and the one place in the archaeological record where
    ergot, evidence of ingestion, and a sanctuary of the two Eleusinian
    goddesses coincide is Mas Castellar de Pontós. Meanwhile the single
    cell that could falsify or confirm the Greek headline — organic
    residue analysis of curated vessels from Eleusis itself — has never
    been performed and, per the 2026 paper, has never been permitted. A
    proponent can rightly say the evidential trajectory is monotonically
    positive wherever measurement has been possible, and that the
    decisive test is blocked by administration, not by science; my
    assessment treats the Eleusinian absence as untested and therefore
    leaves that possibility genuinely open.
claimAssessments:
  - claimId: TIK-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Four independent studies with direct chemistry — altar residues at
      Arad, alkaloids in Bronze Age hair from Es Càrritx, the Bes-vessel
      metabolomics, and chewed Datura quids at Pinwheel Cave — converge on
      deliberate ritual use of psychoactive plants, two of them measuring
      consumption in human tissue. The strongest opposing consideration is
      that "deliberate" and "ritual" remain interpretive layers on
      measurements, and that three of the four were verified only at
      abstract level; but the convergence across substances, routes, and
      millennia makes the background claim robust.
  - claimId: TIK-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The Bes-vessel study shows complex fermented psychotropic concoctions
      are archaeochemically real in the Hellenistic world, and the CSWR
      transcript records Dioscoridean visionary wine recipes. The opposing
      consideration is that the Dioscorides evidence is a proponent's
      secondhand summary in a friendly venue, never anchored to the primary
      passages (TIK-R006), and the single-vessel study carries a
      documented provenance caveat; therapeutic drug-wines must not be
      silently promoted to cult sacraments.
  - claimId: TIK-C003
    verdict: established
    confidence: high
    reasoning: >-
      This is a textual fact about a document read directly: the Hymn
      names meal, water, and soft mint, and nothing psychoactive. The
      strongest opposing consideration is that a mythological aition is
      not a liturgical manual, so the claim constrains the Hymn's content,
      not necessarily sanctuary practice — but as stated, the claim is
      about the recipe the text gives, and it is secure.
  - claimId: TIK-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The find is the case's best combination of substance, ingestion
      evidence, and cultic context, but every route to it is secondhand:
      the primary 2002 chapters were never obtained, the claim rests on the
      2026 paper's citation of them, and the analysis has never been
      replicated. The strongest opposing consideration is the documented
      source drift — downstream retellings harden "identified ergot
      microremains" into "hallucinogenic alkaloids chemically detected,"
      which the primary wording does not support.
  - claimId: TIK-C009
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The Johannine-Dionysian reading is a genuine scholarly position with
      named antecedents (Nock, MacDonald), not the book's invention, and
      the Cana, vine, and water-to-wine parallels are real textual
      features. The strongest opposing consideration is that the same
      scholarly literature sustains Jewish messianic-abundance readings of
      the identical passages, and the evidence in the ledger is a
      proponent's summary that acknowledges its own "big if" two steps
      downstream.
  - claimId: TIK-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      A peer-reviewed experiment with 48 runs, published methods, and
      quantified yields (0.54 mg LSA and 0.48 mg iso-LSA per gram) directly
      demonstrates the conversion, with complete ergopeptide disappearance
      at the optimal condition — a real mechanism measurement, not an
      analogy. The strongest opposing considerations are the
      interested-network authorship (Ruck co-authored the 1978 proposal,
      the 2000 proposal, and this validation), the fact that all records
      trace to a single performance awaiting independent replication, and
      the narrowness of the successful window.
  - claimId: TIK-C028
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The preprint's own factorial results, extracted and verified at
      intake, state the narrow condition set explicitly, and the published
      version is the same study. The opposing considerations are that the
      cited text is the preprint rather than the published wording, and
      that this is one experiment by one team — a claim about that study's
      results, so single-study support is appropriate here, but replication
      of the envelope's robustness remains open (TIK-R002).
  - claimId: TIK-C029
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger attaches to this claim: the intake
      verification explicitly detached the E038 passage from C029 because
      the quoted text does not bear on ergometrine persistence, and the
      separate passage this claim needs was never extracted into an
      evidence record. The claim's own source anchor quotes the preprint's
      Results directly, which suggests it is accurate, but under this
      ledger's rules that untested anchor is not evidence; the passage
      should be captured and verified before the claim is graded.
  - claimId: TIK-C033
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The arithmetic is transparent from the measured yield: 0.54 mg LSA
      per gram of processed ergot meets the 0.5 mg literature minimum
      effective dose, and the source itself states about 1 g per initiate
      suffices. The strongest opposing consideration is that the
      "minimum effective dose" figure is extrapolated from a heterogeneous
      morning-glory-dominated human literature, not from the reconstructed
      matrix, so the claim's own hedged framing ("about," "literature
      minimum") is what the evidence warrants.
  - claimId: TIK-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger connects to this claim; it carries
      only a source anchor transcribed from the 2026 paper's Discussion,
      itself citing a reference not obtained or verified in this case. It
      is a plausible historical-geographical statement and matters for
      ruling out C. paspali as an ancient European source, but under this
      ledger's discipline it currently has no weighed basis and needs its
      own record before it can support or undercut anything.
  - claimId: TIK-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      LSA is demonstrably psychoactive and can occasion hallucinations and
      euphoria, and modern psychedelic science shows pharmacologically
      induced mystical-type experience is real — but the systematic review
      documents prominent nausea, autonomic effects, anxiety, and occasional
      severe adverse outcomes at substantially lower potency than LSD, and
      the human data come from a different matrix than the reconstructed
      drink. The strongest opposing consideration is that "would reliably
      produce the profound and largely positive visionary experience"
      asserts precisely what no record establishes; the pennyroyal-synergy
      proposal added by the 2026 authors is itself untested (TIK-R013).
  - claimId: TIK-C008
    verdict: unresolved
    confidence: low
    reasoning: >-
      No record demonstrates that the reported experiences required a drug:
      the pro side rests on an assertion in a chemistry paper's introduction
      citing Pindar and Cicero secondhand, and the ritual-sufficiency
      alternative is itself unevidenced in this ledger (Burkert is held as
      unverified background). The deepest opposing consideration on both
      sides is that the antecedent phenomenon — whether any ancient source
      independent of modern construction attests a transformative vision at
      initiation — is itself disputed (TIK-R011), so the causal dispute may
      lack a settled phenomenon to explain.
  - claimId: TIK-C007
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The affirmative case is circumstantial and indirect: chemical
      feasibility now demonstrated, plus one ergot-in-cult-context find in
      Iberia that is analogy, not identity. Against it stand the canonical
      recipe naming nothing psychoactive with no attested processing step,
      and Clinton's point that the sanctuary's publicly audited accounts
      record grain used conventionally and nothing for drugs — an audited
      silence, not a mere silence. The strongest opposing consideration is
      the empty cell's symmetry: no vessel from Eleusis has ever been
      analyzed, so the decisive evidence is untested rather than negative,
      which is exactly why the verdict stops at weak rather than falling
      further.
  - claimId: TIK-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only text in the record approaching a pharmacological Eucharist is
      Irenaeus on Marcus, which read plainly describes a conjuring trick and
      love-philter accusations in hostile heresiology — attesting that cup
      manipulation was thinkable and scandalous, not that a psychedelic
      sacrament existed. McGovern, the book's own star scientific witness,
      calls the evidence "extremely weak to nonexistent," and no early
      Christian liturgical vessel has ever been chemically tested (TIK-R005);
      the claim is not contradicted by measurement, but it currently has no
      positive evidence worth the name.
  - claimId: TIK-C011
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The earliest detailed witnesses — the Didache's berakah-style
      thanksgivings over the cup and bread and Justin's bread and
      wine-with-water framed against the mysteries as demonic imitation —
      uniformly describe ordinary elements in a Jewish liturgical matrix,
      and the proponent himself states "I don't hang my hat on that claim"
      about the Last Supper. The strongest opposing consideration is that
      these are normative insider texts describing the sanctioned rite, so
      they constrain the claim about the original and mainstream Eucharist
      strongly but cannot exclude every fringe community — which is why the
      confidence is moderate rather than high.
  - claimId: TIK-C012
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Every independent voice in the record rejects this rung, including
      the thesis's own constituency: Brown, a sympathetic entheogen-history
      author, finds the grand theory unsupported; Bremmer states
      Christianity was not a mystery cult; McGovern calls the connection
      "extremely weak to nonexistent"; and the author concedes on the
      record that the Dionysian premise is "a big if" and asks "where are
      the drugs?" The strongest opposing consideration is that expert
      consensus is not proof and the decisive chemistry has never been run —
      but a transmission claim rejected across hostile, neutral, and
      sympathetic reviewers carries a burden of production it has not met.
  - claimId: TIK-C013
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The documentary base of the Eucharist — Didache 9–10, Justin 65–66,
      and the Pauline tradition behind them — is Second-Temple Jewish meal
      blessing in form, vocabulary, and elements, and the one ancient author
      who discusses mystery-cult parallels frames the borrowing as demons
      imitating the Christian rite, the reverse of the inheritance thesis.
      The strongest opposing consideration is that form-critical evidence
      constrains the documented mainstream rite rather than every
      community's practice, and "consensus is not proof" — but the claim as
      stated must overcome exactly these texts, and it does not.