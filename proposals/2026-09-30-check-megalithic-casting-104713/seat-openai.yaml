caseAssessment:
  verdict: weakly_supported
  loadBearing: [GEO-C022, GEO-C020, GEO-C021, GEO-C004, GEO-C012, GEO-C030]
  weakestLinks: [GEO-C021, GEO-C004, GEO-C580, GEO-C030]
  synthesis: >-
    The evidence gives the featured existential hypothesis some genuine but
    weak support: there are reported laboratory anomalies compatible with
    reconstituted stone, yet no provenance-secure, independently replicated
    demonstration that a particular monument block was cast. The strongest
    affirmative Egyptian result is GEO-E012, which reports unusual hydrated
    and Si-bearing microconstituents in pyramid samples. GEO-E017 adds a
    distinct NMR result from a Bent Pyramid casing stone, interpreted as
    natural limestone grains cemented by a human-made calcium-silicate gel.
    These are more substantial than arguments from salt, quarrying difficulty,
    or historical imagery. The Pumapunku work likewise reports carbon- and
    nitrogen-bearing amorphous matter inside PP1, including beneath
    plagioclase crystals, rather than solely on its exposed surface. In the
    strongest proponent reading, results from different monuments and
    analytical techniques converge on the limited proposition that at least
    some stones were manufactured.

    The contrary case is stronger for the Great Pyramid specifically.
    GEO-E018 reports widespread bedding, fossils, burrows, ripple lamination,
    tectonic fractures, and tool marks consistent with natural sedimentary
    blocks. GEO-E020 is especially important because it compares casing
    stones with both natural Tura limestone and a genuine geopolymer positive
    control: the positive control's binder signature and fabric were absent
    from the casing stones. GEO-E021 independently found a British Museum
    casing fragment to be natural limestone. Although these studies cannot
    logically exclude every block in an existential claim, they directly
    contradict the proposed alkali-geopolymer interpretation across the
    material examined. The salt line adds no useful discrimination because
    instrumented analysis confirms halite while also documenting it at other
    Egyptian limestone sites and reporting a natural sedimentary origin.

    Pumapunku keeps the broader case from a negative verdict, but only
    narrowly. The decisive andesite fragment was selected from loose debris
    outside the protected monument area, was attributed to architecture by
    appearance, and was not compared with geological Khapia andesite. Its
    interior organic matter is therefore a real reported observation without
    secure archaeological attribution or demonstrated diagnosticity.
    Evidence for the proposed guano chemistry is weaker still: the available
    replication is asserted without data, used modern chemicals, and did not
    establish whether the measured material was binder or unreacted residue.
    Quarry provenance alone cannot exclude casting from quarry-derived
    aggregate, which is the valid core of GEO-C030, but binder-aware
    petrography can discriminate materials and has already done so in the
    Egyptian comparisons.

    Thus feasibility is provisionally supported, occurrence at the Great
    Pyramid is contradicted by the balance of direct evidence, and occurrence
    at Pumapunku is only weakly supported. Because the case hypothesis
    requires only one major monument, the residual Pumapunku and Bent Pyramid
    observations justify weak support rather than overall contradiction.
    This conclusion rests on measurements and sample limitations, not on
    archaeological consensus. The single evidence record whose removal would
    most alter the case balance is GEO-E012, the strongest non-proponent
    affirmative pyramid analysis. The weakly_supported verdict survives its
    removal because GEO-E017 and the Pumapunku interior observation remain,
    but the case would sit very close to unresolved and would depend almost
    entirely on unreplicated, provenance-limited samples.
  steelman: >-
    The assessment does not explain the Bent Pyramid casing-stone NMR result
    suggesting Tura limestone grains cemented by an amorphous calcium-silicate
    gel: the strongest Egyptian negative control tested an
    alkali-aluminosilicate geopolymer, not this revised C-S-H binder, and no
    blinded replication against a broad natural-limestone suite has answered
    that specific observation.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E012, GEO-E017, and the Pumapunku analyses provide direct
      observations compatible with manufactured stone, so the existential
      claim has more than purely speculative support. None is both
      provenance-secure and independently replicated, and the Egyptian
      positive results face several direct natural-stone analyses. The
      strongest opposing consideration is the combined petrographic record
      in GEO-E018 through GEO-E021, particularly the positive-control
      comparison in GEO-E020. Because the claim requires only one qualifying
      monument, those Egyptian negatives do not logically dispose of the
      unresolved Pumapunku and Bent Pyramid observations.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Broad in-situ geological observations in GEO-E018 and direct analyses
      in GEO-E019 through GEO-E021 consistently identify the examined Great
      Pyramid material as natural limestone. GEO-E020 is particularly
      diagnostic because the genuine geopolymer positive control showed
      binder chemistry and fabric absent from the casing stones. The
      strongest opposing consideration is GEO-E012, which reports unusual
      microconstituents interpreted as rapid precipitation from basic
      solution, but its sample provenance and natural comparison range are
      disputed. The salt evidence is non-discriminating, while GEO-E017
      concerns the Bent Pyramid rather than a Great Pyramid block.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report petrographic and organic features that
      their authors interpret as artificial stone, supplying direct support
      rather than mere logistical argument. The sandstone provenance result
      in GEO-E008 does not by itself exclude stone made from material obtained
      at the same source. The strongest opposing consideration is that the
      andesite work used a loose fragment of insecure architectural
      provenance and no geological andesite control, while all affirmative
      analyses come from one proponent team. No independent replication on a
      catalogued architectural block is present.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006, GEO-E007, and GEO-E058 directly document that published
      analyses report the stated organic and microstructural features and
      interpret them as inconsistent with natural stone. This verdict
      establishes what the analyses reported, not that their interpretation
      is correct. The strongest opposing consideration for the implied
      artificial-stone inference is the absence of a natural Khapia andesite
      comparator and the insecure provenance of PP1.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E057 quotes the analysts' own account that PP1 was selected by
      appearance from fragments lying outside the protected monument area.
      It also confirms that the sample was not tied to an object number,
      excavation context, or documented refit. The strongest opposing
      consideration is that debris outside the protected area could still
      have broken from an architectural block, but that possibility does not
      alter the claim's stated sampling facts.
  - claimId: GEO-C918
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E058 directly reports that an interior subsample cut from PP1
      contained similar carbon- and nitrogen-bearing amorphous matter,
      including a sheet beneath plagioclase crystals. This makes simple
      superficial dirt an incomplete explanation of the reported result.
      The strongest opposing consideration is that EDS did not identify the
      molecular substance and the parent fragment's architectural provenance
      remains insecure.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly reproduces the 2020 model's abstract-level
      description of natural Khapia andesite sand, storage at Iwawe Stratum
      V, and rejection of the quadrangular blocks as building material.
      This establishes the content of Davidovits' model, not the correctness
      of its archaeological assertions. The strongest opposing consideration
      is that only the abstract was examined and the cited Iwawe excavation
      description was not independently checked.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 reports that the proponents replicated an acidic-medium binder
      mechanism in a laboratory, which gives the proposed chemistry minimal
      feasibility support. No recipe, measurements, durability results, or
      product characterization are supplied, and modern chemicals replaced
      the proposed plant and guano inputs. The strongest opposing
      consideration is GEO-E059, where the authors acknowledge that they
      cannot determine whether the monument-associated material is binder or
      unreacted guano residue.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The narrow methodological point is sound: an immobile-trace-element
      quarry match cannot alone distinguish a carved block from a composite
      made using aggregate from that quarry. GEO-E024 nevertheless overextends
      this point across methods, especially by including techniques capable
      of detecting phases or microstructure rather than merely metallic
      provenance. GEO-E020 is the strongest opposing consideration because
      its geopolymer positive control demonstrates that binder-aware
      petrography can detect a casting signature when present. Thus quarry
      matching alone is non-dispositive, but the claim's broader implication
      that the listed analytical approach is blind to cast composites is not
      sustained.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large re-agglomerated limestone
      demonstration blocks, and GEO-E022 establishes room-temperature
      formation of a calcium-silicate cementing phase from lime and
      diatomaceous earth. These results make large hard limestone-like
      composites chemically plausible without modern high-temperature
      processing. The strongest opposing consideration is that the large
      blocks are self-reported and have not received independent compositional
      or mechanical analysis. Feasibility is therefore supported, while
      ancient-scale practicality and visual equivalence remain incompletely
      demonstrated.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E016 offers early glassmaking as a precedent that charcoal and
      bellows could attain temperatures near the stated range. The cited
      Badari dating and temperature basis have not been independently
      verified in the evidence packet. The strongest opposing consideration
      is that attaining such heat in a small vitreous-material operation does
      not establish sustained production at the scale required for monumental
      stone.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 identifies Wadi el Natrun and al-Barnuj as the principal
      ancient Egyptian natron sources for vitreous-material production and
      documents their replacement by plant ash in the seventh through ninth
      centuries AD. GEO-E011 supplies an established compositional method for
      distinguishing natron from plant-ash glass. The strongest opposing
      consideration is that neither record quantifies a stone-casting supply
      chain, so availability for glass does not demonstrate use in masonry.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 recounts an observation of rock-like material forming in a
      repeatedly used outdoor fire pit, which is directionally consistent
      with the proposed discovery pathway. The report is unattributed and
      supplies no composition, mechanical testing, or controlled
      replication. The strongest opposing consideration is that ordinary
      sintered ash, clinker, or carbonate crust could satisfy the anecdotal
      description without constituting usable artificial stone.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports a controlled photogrammetric measurement of
      approximately 216 cubic centimetres per hour at 85 strikes per minute.
      The claim is about that experiment's result, not a universal ancient
      quarrying rate. The strongest opposing consideration is limited
      external validity from one team, granite, pounder, and working
      technique.
  - claimId: GEO-C502
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E002 confirms that Engelbach's monograph contained a brief personal
      pounding trial and heuristic workforce estimates, supporting the
      claim's broad characterization. The detailed figures and the statement
      that pounders were not used entirely by hand enter the evidence mainly
      through a proponent's characterization that the record itself says
      should be checked against the monograph. The strongest opposing
      consideration is therefore incomplete direct verification of this
      highly specific compound historical claim.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using dolerite pounders on a designated
      test block have not reproduced a scoop mark. It provides no attempt
      count, observation protocol, cumulative effort, or systematic survey of
      the block. The strongest opposing consideration is that undocumented
      casual attempts cannot establish decades of documented failure or
      approximate trained quarrying practice.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports both the approximate shaft depth and the proponent's
      biomechanical judgment that effective bottom striking is impossible.
      Neither the dimensions nor worker postures were independently measured
      or experimentally tested. The strongest opposing consideration is that
      the shafts may have been worked progressively or served a prospecting
      function not requiring the assumed final-bottom posture.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite or aplite tool-production quarries within the
      Aswan quarry landscape and reports pounder-sized blanks associated with
      Pharaonic working areas, contrary to the claim's imported,
      non-quarrying framing. GEO-E001 also demonstrates directly that a
      dolerite pounder removes granite. The strongest opposing consideration
      is that no microscopic use-wear or residue analysis in the packet
      proves what each surviving sphere struck, so occasional grinding,
      tamping, or finishing uses remain possible.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only affirmative carrier is an uncited proponent webpage that gives
      the wrong date and names no medieval author or text. GEO-E027 checks
      al-Suyuti's compilation of the principal breach narratives and finds no
      salt coating in either al-Ma'mun entry, while GEO-E029 confirms the
      proponent page's lack of a traceable source. The strongest opposing
      consideration is that several other medieval works remain unread, so
      the absence is not exhaustive. On the evidence present, however, the
      claim that historical accounts report the salt layer is not sustained.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 establishes instrumentally that halite efflorescence is
      readily detectable inside the Great Pyramid, so the presence component
      is sound. GEO-E031 reports halite at multiple other Egyptian limestone
      sites, including the carved-bedrock Sphinx, and GEO-E032 gives a natural
      sedimentary explanation for Giza limestone halite. The strongest
      opposing consideration is that no controlled concentration comparison
      was performed, but the available record contradicts the asserted
      qualitative uniqueness.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports XRD and SEM-EDX results identifying halite,
      calcite, and quartz, with no nitrates or evidence of widespread gypsum
      crusts. The evidence comes from targeted efflorescence and detached
      fragments in the named interior locations. The strongest opposing
      consideration is the stated XRD detection limit, which allows minor
      phases below approximately five weight percent rather than supporting
      absolute chemical absence.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports Na and Cl in detached substrate material and cites
      Klemm and Klemm for halite within the Giza nummulitic limestone's
      stratigraphic layers, attributed to evaporative marine or lagoonal
      conditions. This directly supports the proposed natural sedimentary
      origin. The strongest opposing consideration is that the underlying
      Klemm and Klemm study was not read and the inference from detached
      material was not confirmed with bedrock cores or unworked quarry-face
      sampling.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 supplies a concrete example at Khufu: cleaning and cavity
      filling occurred in 1995–1997 without available intervention records,
      and a likely modern sulfur-rich fill is analytically visible. This
      demonstrates that undocumented restoration can confound surface
      evidence at a central site. The strongest opposing consideration is
      that one monument cannot establish the claim's worldwide prevalence
      assertion that almost no megalithic site has a complete history.
  - claimId: GEO-C005
    verdict: established
    confidence: moderate
    reasoning: >-
      GEO-E014 confirms that Fóti has advanced the stated mineral-processing
      reinterpretation of the Rekhmire scene, while also recording the
      conventional metal-casting reading. This establishes that the mural's
      scale and apparatus have been argued to fit mineral processing, not
      that this reading is archaeologically correct. The strongest opposing
      consideration is the absence of independent iconographic analysis or
      engagement showing that mineral processing explains the scene better
      than bronze work.