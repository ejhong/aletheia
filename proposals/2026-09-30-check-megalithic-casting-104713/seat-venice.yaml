  synthesis: >-
    The case divides into three evidential theatres. On Egyptian pyramid stone, the
    corpus holds genuine, hedged positives: Barsoum 2006's SEM/TEM microconstituents
    (the only non-proponent laboratory support, on provenance-contested samples) and
    MacKenzie 2011's NMR reading of a Bent Pyramid casing stone as Tura grains in a
    C–S–H gel — never rebutted, but also never replicated. Against these stand direct,
    binder-aware petrography: Folk & Campbell's in-situ sedimentary features (bedding,
    burrows, clam sections), Harrell & Penrod's natural reading of the Lauer sample,
    and above all Jana 2007, the only study with a positive control, which shows the
    Si-rich phases Barsoum highlighted occur in natural limestone and that a real
    casting signature is detectable when present. The net on GEO-C020 is genuinely
    split by binder chemistry: the alkali-geopolymer recipe is refuted for the tested
    samples; the revised C–S-H recipe is untested. The salt line, once a pillar, has
    collapsed: Sessa 2026 confirms the halite (GEO-C907, solid) but supplies Egyptian
    comparators — the Sphinx, rock-cut tombs — exhibiting the same efflorescence, plus
    a stated sedimentary origin for halite in Giza strata, dissolving GEO-C506's
    comparative premise. On the Andes, the positive evidence is entirely proponent
    authored, one team, one sample series, with PP1 picked from loose debris outside
    the protected area and no geological andesite comparator; the interior PP1C
    organic matter (GEO-C918) is the strongest single observation but rests on that
    insecure fragment. Methodologically, GEO-C030's H/C/O-blindness point is correct
    for trace-element provenancing, but Jana's positive control bounds it: it
    immunizes nothing against petrography. The anecdotal periphery — visitor scoop
    marks, narrow shafts, fire-pit stone, the untraceable Al-Ma'mun salt report,
    Engelbach's unverified characterization — contributes almost no weight. Verdict:
    weakly_supported. There are real, unexplained observations and a partially
    feasible mechanism, but every attribution claim rests on contested, unreplicated
    positives while the strongest direct analyses read natural stone; the decisive
    tests (blinded NMR with natural suites and C–S-H controls, paleomagnetic block
    survey, Iwawe Stratum V compositional work) are designed but unrun. Consensus
    against is not my reason; the asymmetry of direct, controlled petrography versus
    unreplicated anomaly claims is. Sensitivity: the case hangs materially on
    GEO-E012 (Barsoum 2006) — remove it and the attribution claims retain only
    proponent self-published support against strong controlled negatives.
  steelman: >-
    MacKenzie et al. 2011's multinuclear MAS NMR of a Bent Pyramid casing stone — an
    independent instrumental technique run partly at Warwick — reads the stone as
    Tura limestone grains cemented by an amorphous calcium-silicate gel formed "by
    human intervention," and nothing in this ledger rebuts it: Jana 2007's
    positive-control negative tested only the alkali-aluminosilicate geopolymer
    recipe, not a C–S–H binder, and no study has shown that a broad natural
    Tura/Dahshur/Giza limestone suite reproduces the −84 ppm shoulder and dominant
    −111 ppm silica resonance. A proponent can rightly say that the one
    instrumental positive on pyramid stone stands unrebutted, that its binder
    chemistry evades the only controlled refutation in the record, and that the
    proposed replication (GEO-R017) has never been executed.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim has real positives (Barsoum 2006's hedged SEM/TEM anomalies, MacKenzie's unrebutted NMR result, PP1C interior organics) but each is unreplicated, provenance-contested, or proponent-only. The strongest opposing consideration is Jana 2007's positive-control petrography showing casting signatures are detectable and absent from tested casing stones — though it tests only the alkali recipe. Net: some support, heavily contested, decisive test unrun.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Evidence genuinely splits: Barsoum 2006 and MacKenzie 2011 report real, hedged microstructural/NMR positives, while Folk & Campbell, Harrell & Penrod, Jana, and Freestone & Middleton find natural sedimentary features and no binder on direct examination. The split tracks binder chemistry: Jana's negative refutes only the alkali-aluminosilicate recipe, leaving the C–S–H variant untested. Sample provenance disputes (SCA statement, Lauer-sample dispute) cut both ways and remain unresolved.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The proponent SEM/petrographic results are published but same-team, unreplicated, and rest on fragments picked from loose debris outside the protected area (GEO-E057) with no geological andesite control (GEO-E060); the guano-versus-binder question is unresolved by the authors' own statement (GEO-E059). Ponce 1971's quarry attribution and the weightless surface-morphology arguments do not decide it either. There is a real reported anomaly, but its transfer to the monument blocks is attribution, not observation.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is about what the published analyses report, and the source records confirm the reports directly, including the interior PP1C occurrence beneath plagioclase crystals. The strongest opposing consideration is that the same team produced all of it from a provenance-insecure fragment without a natural comparator, so the reports are real but their diagnostic meaning for GEO-C021 is capped. Confidence is moderate because the claim is assessed as stated, not as proof of casting.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The proponents' own account states plainly that PP1 was chosen from loose fragments lying outside the protected monument area, quoted verbatim in GEO-E057. The opposing consideration is that this is the proponents' self-published description and the peer-reviewed Ceramics International statement of the same context was not shown; still, the source is explicit and unambiguous about the sampling method.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim reports what the analysts state, and the source directly documents the interior subsample PP1C with the same EDS spectrum and a figure of the sheet beneath two plagioclase crystals. The strongest opposing consideration is that this is a single proponent source, EDS is elemental only, and no natural andesite control was run — but none of that contradicts what was reported.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 2020 abstract states each element of the model verbatim — Khapia andesite sand, storage at Iwawe Stratum V per Isbell & Burkholder, and non-use of the piedras cansadas — so the descriptive claim is directly supported. Confidence is capped at moderate because only the abstract was read, the venue is the proponents' own journal, and the Stratum V description has not been checked against the excavators' text (GEO-R009).
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage chemistry is coherently described, but the claimed replication used modern chemicals, produced no published data or product characterization, and the source itself concedes plant acids do not disaggregate andesite and that early re-hardening attempts failed (GEO-E064, with a recorded second-reader dissent on direction). The pre-industrially-accessible half of the claim is essentially asserted, not shown.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      That PXRF and ICP-MS cannot detect hydrogen, carbon, or oxygen is textbook fact, and the inference that a same-quarry trace-element match cannot by itself separate carved from cast stone follows. The strongest opposing consideration is Jana 2007's positive control, which shows binder-aware petrography does detect casting when present — so the critique is correct within its scope but immunizes the hypothesis against nothing; Fóti's own methods table also contains errors (NMR), which the human-reviewed record flags.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Feasibility has real content: lime plus diatomaceous earth forms a C–S–H binder at room temperature (GEO-E022), and the Geopolymer Institute reports multi-ton demonstration blocks — but the latter is self-reported with no independent analysis, and the natron route's scale feasibility is expressly untested. The strongest opposing consideration is that nothing in the ledger demonstrates reconstituted limestone matching natural stone's full property envelope, only plausibility.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only ledger support is Fóti's Badari glassmaking precedent, explicitly flagged as needing independent dating and temperature verification, and crucible-scale heat is not industrial-scale processing. Background knowledge of ancient pyrotechnology (metallurgy, glass) makes the claim plausible, so this verdict leans partly on priors rather than the evidence records — the ledger's own support is thin.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006, mainstream and uncontroversial, directly documents Wadi el Natrun and al-Barnuj as the primary ancient natron sources with a 7th–9th century decline to plant ash. The strongest opposing consideration — that the paper concerns glass and faience, not stone — does not touch the ingredient-availability claim itself, which is uncontroversial history of the vitreous-materials industry.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim rests on a single unattributed anecdote in Fóti that the geo project's own skeptical review flagged as under-sourced, with no controlled replication attempted. There is no opposing evidence either; the record simply contains no adequate basis to affirm or deny accidental fire-pit lithification, which is why this is unresolved rather than weakly supported.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 216 cm³/h figure comes from a peer-reviewed photogrammetric study, verified against the source, and is the only modern quantitative measurement of dolerite-pounder effectiveness. The strongest opposing consideration is its limitations: one team, one granite, one tool configuration, and the authors' own caveat that skilled ancient crews may have outperformed the protocol — so the measurement is solid but its generalization is not.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim's specific details about Engelbach 1922 (one-hour ~5 mm trial, 8 mm/h assumption, workforce inference) are carried only by Fóti's characterization, and the evidence record explicitly states this has not been verified against the 1922/1923 texts. A source-record note that Engelbach's method was thin does not confirm the particulars, so the claim as stated is currently unverifiable from the ledger.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti reports the failed visitor reproductions, but the evidence record is anecdotal, with unquantified attempt rates and no systematic survey of the test block's wear. The strongest opposing consideration is that cumulative tourist effort is uncontrolled and possibly trivial relative to skilled full-time work, so the observation, even if accurate, carries little inferential weight.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is Fóti's description of the shafts, with dimensions not independently surveyed and the biomechanical claim untested, while the alternative silicate-vessel reading (GEO-C536) and the proposed shaft survey (GEO-R013) show the geometry is unmeasured conjecture on both sides. The strongest opposing consideration is that a conventional reading (Engelbach's prospecting pits) exists and has never been excluded by measurement.
  - claimId: GEO-C511
    verdict: mixed
    confidence: low
    reasoning: >-
      The ledger contains no positive evidence for a non-pounding function; the sole relevant record (Kelany et al., GEO-E045) documents a local dolerite pounder industry sourced from dykes within the Aswan granitoids, with purpose-built tool-production quarries beside the workings, weighing against the exotic-import and non-quarrying framing. Since that evidence is indirect — it does not test what the pounders struck — the claim ends contested rather than refuted.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: low
    reasoning: >-
      The salt-layer report survives in the ledger only as an uncited statement on a proponent webpage dated to the wrong year (820 vs 832), and the principal medieval Arabic compilation (al-Suyūṭī via Nemoy) describes the breach in detail without any mention of salt. The strongest opposing consideration is that negative evidence in one 15th-century compilation is not proof no Arabic source reports it — al-Maqrīzī's Khiṭaṭ and others remain unread — so the claim's anchor is unestablished rather than disproven.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim's comparative premise — that comparable natural limestone monuments do not show surface NaCl — fails on the ledger's evidence: Sessa 2026 documents halite efflorescence at the Sphinx (unworked Giza bedrock), the White Monastery, Lisht, and Saqqara, and reports Klemm & Klemm reading halite as a primary constituent of Giza nummulitic limestone. A controlled concentration comparison was never attempted, and the underlying comparator studies are second-hand, which is why confidence is moderate rather than high.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is a direct measurement report from a peer-reviewed open-access conservation study read via the PMC copy, with verbatim quotes and figures (SEM-EDX Na–Cl correlation R = 0.969; XRD of seven samples showing only halite, calcite, quartz). The strongest opposing consideration is that XRD's stated detection limit below 5 wt% could miss minor phases, but the claim as stated is exactly what the paper reports.
  - claimId: GEO-C906
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is a faithful summary of what Sessa et al. attribute to Klemm & Klemm 2010, with the quoted passages verified in the citing text. Confidence is low because the attribution is second-hand — Klemm & Klemm was not read — and standardless SEM-EDX on detached fragments supports the "inherent component" reading only inferentially; GEO-R010's direct bedrock check remains undone.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is a generalization over "almost no megalithic site," and the ledger instantiates it once, concretely: the Khufu interior's undocumented 1995–97 cleaning and filling, with efflorescence recurring within about two years. That single documented case makes the confound real but does not demonstrate the universal scope; no systematic restoration-history audit exists (GEO-R005 is proposed, not run).
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim accurately reports that a reinterpretation has been argued, and Fóti's argument exists as stated. The strongest opposing consideration is that it is an interpretive argument by a proponent that conventional Egyptology has never engaged, so "argued to fit better" is established while the fit itself is not; the proposed joint re-examination (GEO-R008) is the missing test.
