  synthesis: >-
    The featured hypothesis that some megalithic monuments contain cast reconstituted stone rather than solely carved and transported natural rock remains unresolved on the provided evidence ledger. Attribution claims form the core: GEO-C022 (existence of at least one major cast monument) stands or falls with the site-specific existence claims GEO-C020 (Great Pyramid blocks) and GEO-C021 (Pumapunku/Tiwanaku andesite and sandstone). For the pyramids, Barsoum 2006 (GEO-E012) reported SEM/TEM microconstituents, Si-Ca-Mg ratios absent from nearby natural sources, hydrated phases not known to form naturally, and nanocrystalline features consistent with rapid precipitation from basic solution in some samples; MacKenzie 2011 (GEO-E017) added multinuclear NMR consistent with an amorphous calcium-silicate gel binder on a Bent Pyramid casing stone. These are real observations and the strongest non-proponent laboratory support. However, they are decisively qualified or contradicted by the subsequent petrographic record. Folk & Campbell (GEO-E018) documented widespread in-situ sedimentary bedding, burrows, fragile fossils, ripple lamination, and tectonic fractures confined to single blocks across pyramid and temple stones, plus absence of zeolite or aggregate-cement fabric. Harrell & Penrod (GEO-E019) found the Lauer showcase sample to be ordinary Mokattam limestone without synthetic zeolite cement. Jana 2007 (GEO-E020), uniquely using a genuine Davidovits geopolymer positive control alongside casing stones and Tura limestone, showed that Barsoum's Si-rich spheres occur in natural stone, that real alkali-aluminosilicate geopolymer binders carry Na+K+Al enrichment absent from casing stones, and that casing stones share particulate texture and pores with natural Tura rather than the smooth matrix and air voids of cast geopolymer. Freestone & Middleton (GEO-E021) independently confirmed a British Museum Cheops casing fragment as natural limestone with opal-CT, no air bubbles, organics, or reaggregation textures. Sample-provenance disputes (SCA denial of Barsoum sampling permission; contested Lauer piece identity) further weaken the positives. Salt-related lines (GEO-C003, GEO-C506) collapse under scrutiny: the Al-Ma'mun salt-layer report lacks any traced primary Arabic anchor (absent from al-Suyuti compilation GEO-E027; proponent page uncited GEO-E029), while Sessa et al. 2026 establish halite as common efflorescence on Egyptian limestone monuments including the carved-bedrock Sphinx and as a primary sedimentary constituent of Giza nummulitic limestone (GEO-E030–E033, GEO-C906, GEO-C907). Thus GEO-C020 is contradicted for the studied material. For Pumapunku, Davidovits team SEM/petrography and organic-matter reports (GEO-E006, GEO-E007, GEO-E058) supply the sole positives for GEO-C004/GEO-C021, yet rest on loose fragments selected by appearance outside the protected area (GEO-C913, GEO-E057), lack any geological andesite comparator (GEO-E060), leave nitrogen only semi-quantitative and the organic unidentified as binder versus residue or contamination (GEO-E059), and have no independent replication or 14C result despite announcement. Conventional 1971 quarry attribution (GEO-E008) and the methods point that bulk metallic fingerprinting cannot distinguish cast-from-aggregate (GEO-C030) leave the Andean case open but unproven; GEO-C580's plant-acid/guano chemistry is asserted with modern-chemical lab claims only and does not disaggregate andesite. Mechanism claims fare better on ingredients (GEO-C011 natron sources well documented) and crude feasibility (GEO-C012 demos exist; C-S-H from lime+diatomaceous earth possible at ambient temperature GEO-E022) but do not establish ancient monumental production or visual indistinguishability at scale. Tool-mark and rate observations (GEO-C001 measured 216 cm³/h) correctly highlight practical difficulties for pure pounding but do not positively evidence casting; alternative pounder-function claims (GEO-C511) are undermined by local dolerite tool-quarry evidence. Restoration-history gaps (GEO-C594) correctly caution surface interpretations. Overall, the ledger contains no secure, independently replicated, binder-aware identification of cast stone from an architectural context of a major monument. Strong negatives on the best-studied (Egyptian) material, fatal provenance and control gaps on the Andean material, and the explicit absence of the decisive study leave the existence claim unresolved rather than established, well-supported, or fully contradicted. Prior geological and archaeological knowledge calibrates that extraordinary construction claims require proportionally direct materials evidence, which is missing here; the verdict rests on the ledger's records, not consensus.
  steelman: >-
    Barsoum 2006 and MacKenzie 2011 still report Si-rich microconstituents, hydration states, and NMR signatures of a precipitated calcium-silicate binder in certain pyramid casing samples that lack a complete natural analogue covering every listed feature on fully provenance-secure material, while Jana's positive-control work tested alkali-geopolymer chemistry rather than the revised C–S–H recipe and no blinded multi-lab NMR campaign with aged C–S–H controls and a broad stratified Tura/Mokattam suite has been executed.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The existence claim requires at least one major monument to contain demonstrably cast stone. Pyramid evidence is contradicted by multiple petrographic and multi-technique studies with natural features and absent binder signatures; Andean evidence is limited to proponent analyses of poorly provenanced loose fragments without natural controls or independent replication. No ledger record supplies a secure positive identification. Strongest opposing consideration is the Jana positive-control demonstration that real casting binders are detectable and absent from examined casing stones.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: high
    reasoning: >-
      Barsoum SEM/TEM and MacKenzie NMR supply the main positives, yet Folk & Campbell document widespread natural sedimentary and tectonic features incompatible with casting, Harrell & Penrod find no zeolite cement in the Lauer sample, Jana with a genuine geopolymer control shows Barsoum features in natural limestone and missing alkali-aluminosilicate enrichment plus textural mismatch, and Freestone & Middleton confirm natural limestone on a museum casing fragment. Salt lines fail as discriminators. Sample provenance is contested. Strongest opposing consideration is residual unreplicated microstructural anomalies on disputed samples, but they do not overcome the multi-study negatives.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only the Davidovits-team SEM, petrography and organic-matter reports on Pumapunku material support artificial origin; conventional quarry attribution and absence of natural andesite controls leave natural explanations open. Sample selection from unprotected loose debris further weakens transfer to architecture. Strongest opposing consideration is the complete lack of independent replication or geological comparator, rendering the organic/amorphous features non-diagnostic.
  - claimId: GEO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Published proponent SEM/petrographic reports do describe organic matter and microstructural features argued as inconsistent with natural volcanic stone, including an interior subsample. However the same-team, same-fragment limitation, missing natural andesite control, and unresolved organic identity (binder vs residue vs contamination) prevent stronger weight. Strongest opposing consideration is that volcanic glasses and secondary organics occur naturally and were not blind-tested against parent rock.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      The 2019 source text explicitly states the andesite samples including PP1 were chosen from loose fragments lying outside the protected monument area. No contrary record exists. Strongest opposing consideration is none; the sampling context is as reported by the analysts themselves.
  - claimId: GEO-C918
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The analysts report cutting interior subsample PP1C and finding the same carbon- and nitrogen-bearing amorphous matter beneath plagioclase. This is their observation on that fragment. Strongest opposing consideration remains insecure provenance of the parent loose piece and absence of independent confirmation or molecular identification.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      The claim accurately restates the 2020 model as given in the abstract: uncrushed Khapia andesite sand stored at Iwawe Stratum V as aggregate, piedras cansadas not used. Strongest opposing consideration is none for the descriptive content; whether the model is correct is separate.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage plant-acid/guano chemistry is described and laboratory replication with modern chemicals is asserted, yet no recipe, product data or ancient-input demonstration appears, and the text notes carboxylic acids do not disaggregate andesite. Strongest opposing consideration is the gap between claimed pre-industrial feasibility and the actual modern-chemical, data-free assertion.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Trace-element quarry-matching (PXRF, ICP-MS) is indeed blind to H, C, O and binder phases, so a metallic fingerprint match cannot by itself rule out cast stone made from quarry aggregate; Fóti's methods critique correctly flags over-extension of provenance claims. Jana's binder-aware petrography shows the limitation does not extend to all analytical approaches. Strongest opposing consideration is that the claim is sometimes rhetorically stretched beyond quarry-matching to dismiss direct petrography.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Demonstration blocks and ambient-temperature C–S–H formation from lime plus diatomaceous earth establish laboratory feasibility with anciently available materials; natron chemistry is also proposed. Scale, durability matching natural stone, and visual indistinguishability under ancient process controls remain unproven by independent work. Strongest opposing consideration is that modern feasibility does not demonstrate ancient monumental production.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Charcoal-and-bellows pyrotechnology can reach temperatures near 850 °C at crucible scale, and early glass/faience provide precedent, but industrial-scale sustained processing for stone volumes is un evidenced. Strongest opposing consideration is the leap from small-scale craft heat to the continuous high-volume thermal demand casting would require.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Shortland et al. document Wadi el Natrun and al-Barnuj as primary ancient Egyptian natron sources for vitreous industries, with supply decline and plant-ash replacement in the 7th–9th centuries AD. Sayre & Smith supply the compositional criteria. Strongest opposing consideration is that the papers address glass/faience, not stone, yet ingredient availability itself is solid.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim rests on an unattributed anecdote of rock-like material forming in a long-cycle fire pit; no controlled observation or replication is in the ledger and the geo project itself flagged it as under-sourced. Strongest opposing consideration is total absence of verifiable data.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Marčiš et al. 2023 photogrammetrically measured 216 cm³/h removal at 85 strikes/min with a dolerite pounder and concluded against pounders as sole method. Single-study limitation applies but the measurement stands. Strongest opposing consideration is possible higher rates by skilled ancient crews with optimized tools, untested here.
  - claimId: GEO-C502
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Engelbach 1922 is correctly characterized in the proponent literature as resting on a brief self-trial, assumed rates, and groove-spacing workforce heuristics while noting pounders were not used entirely by hand; the thin modern evidentiary base for the orthodoxy is real. Strongest opposing consideration is that the full monograph context and any later corroboration are not exhaustively re-read in the ledger.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti reports collective visitor failure to reproduce scoop marks on the test block with original pounders; the observation is possible but entirely anecdotal, unquantified, and without systematic wear survey. Strongest opposing consideration is lack of controlled attempt data or cumulative energy accounting.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti describes the shafts as too narrow for effective bottom pounding; dimensions and biomechanics are unmeasured independently. Strongest opposing consideration is that the claim may misread original prospecting or other functions without geometric survey.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The interpretive claim that dolerite spheres served non-pounding purposes (grinding slurry, tamping) is undermined by Kelany et al. documenting local dolerite/aplite dyke tool-production quarries adjacent to Aswan working areas with pounder-sized blanks and Pharaonic pottery, embedding a pounder industry in the quarry landscape. Strongest opposing consideration is residual uncertainty over exact use-wear, but transport-plus-alternative-function is directly weakened.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The salt-layer report is carried solely by an uncited proponent webpage dating the event to 820; al-Suyuti's compilation of principal medieval accounts of al-Ma'mun's breach (Nemoy) describes finds in detail yet mentions no salt or coating, and the visit is dated ~832. Strongest opposing consideration is that other unread Arabic sources might still contain it, but current ledger anchor is absent.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Taste-test anecdotes and asserted uniqueness fail: Sessa et al. confirm halite efflorescence in the Queen's Chamber yet document the same phenomenon at the Sphinx, other pyramids, monasteries and tombs; Klemm & Klemm (via Sessa) read halite as primary sedimentary in Giza nummulitic limestone. No concentration comparison supporting anomaly exists. Strongest opposing consideration is that bulk versus surface distribution remains untested by coring.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      Sessa et al. XRD and SEM-EDX of Queen's Chamber and Thieves' Corridor efflorescence and detached fragments identify only halite, calcite and quartz, with no nitrates and no widespread gypsum. Direct instrumental result. Strongest opposing consideration is XRD detection limit (<5 wt%) and restriction to surface/detached material.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. cite Klemm & Klemm that halite is a primary constituent of Giza nummulitic limestones precipitated from evaporating marine/lagoonal waters during formation; SEM-EDX of unaffected substrate also detects Na and Cl as probable inherent components. Strongest opposing consideration is second-hand citation status of Klemm & Klemm pending direct read.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. document that 1995–97 interventions inside Khufu (cleaning, cavity filling with probable gypsum-bearing material) lack available records yet are evident from photographs and XRF sulfur enrichment, with rapid re-formation of efflorescence; the general scarcity of complete published restoration histories at megalithic sites is a fair methodological caution. Strongest opposing consideration is that the claim's "almost no" quantifier is broad, though the Giza instance and principle hold.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti's reinterpretation of the Rekhmire mural as mineral processing rather than metal casting is an unengaged proponent reading of scale and apparatus details; conventional Egyptology retains the bronze-casting identification. Strongest opposing consideration is total absence of specialist engagement or residue predictions tested.