  synthesis: >-
    The megalithic casting hypothesis attempts to solve real engineering and logistical challenges in monumental construction by proposing that stones were reconstituted in place from chemically activated mineral slurries rather than carved and hauled. Proponents offer a coherent theoretical framework: pyrotechnology in antiquity could achieve the necessary temperatures for natron activation, industrial natron sources were available, reconstituted limestone blocks are structurally feasible in laboratory settings, and bulk trace-element provenance studies are largely blind to low-concentration light-element binders. Proponents also point to anomalous microstructural features, organic inclusions, and salt efflorescence as potential physical fingerprints of ancient geopolymeric stone.

    However, direct empirical analysis of monument materials severely contradicts the hypothesis at every primary candidate site. For the Great Pyramid, multiple independent petrographic, mineralogical, and thin-section analyses (Folk & Campbell 1992; Harrell & Penrod 1993; Jana 2007; Freestone & Middleton 2007) demonstrate that casing and core blocks possess intact sedimentary bedding, delicate fossil shells and worm burrows crossing internal boundaries, normal limestone porosity, and pre-existing tectonic calcite veins. These features are physically incompatible with crushing, disaggregation, and re-casting. Jana's (2007) comparative study with a genuine geopolymeric positive control proved that alkali-aluminosilicate binders leave distinct microstructural and chemical signatures that are entirely absent in pyramid casing stones, while showing that the spherical silica microconstituents highlighted by Barsoum are natural sedimentary opal-CT lepispheres. Furthermore, modern conservation analyses (Sessa et al. 2026) establish that halite is an inherent sedimentary component of the local Eocene nummulitic limestone strata and occurs as efflorescence across natural rock-cut monuments, negating the claim that pyramid salt indicates a synthetic natron recipe.

    At Pumapunku, evidence for andesite casting rests on an unprovenanced, loose surface fragment (PP1) selected from outside the protected archaeological zone and analyzed without comparison to natural parent rock. Proponents themselves concede that carboxylic plant acids cannot disaggregate volcanic andesite and that their laboratory reconstructions required modern synthetic reagents rather than pre-industrial inputs. Additionally, quarry surveys at Aswan (Kelany et al. 2009) contradict the claim that dolerite pounders were exotic tools transported to crush casting slurries, locating local tool quarries and extraction blanks directly adjacent to granite workings.

    Sensitivity analysis: The single evidence record whose removal would most soften this assessment is Jana 2007 (GEO-E020), which provides the only rigorous comparative analysis utilizing an authentic geopolymer positive control. Nevertheless, the case verdict of contradicted firmly survives without GEO-E020 because independent macroscopic and petrographic studies (GEO-E018, GEO-E019, GEO-E021) demonstrate intact sedimentary and tectonic fabrics across pyramid blocks that rule out reconstituted slurries.
  steelman: >-
    MacKenzie et al. (2011) report multinuclear MAS NMR spectra indicating an amorphous calcium-silicate-hydrate (C-S-H) gel in Bent Pyramid casing stone, suggesting a lime-pozzolan reaction that remains unrebutted by petrographic studies that tested only for alkali-aluminosilicate geopolymer binders.
