    reasoning: >-
      The claim is supported only by an anecdotal observation reported in Fóti (2024) asserting that casual visitor strikes on a designated test block at Aswan have failed to generate characteristic scoop marks. There is no controlled experimental documentation, systematic measurement of surface wear, or quantified tally of visitor attempts in the ledger. The strongest opposing consideration is that unstructured, brief strikes by untrained tourists using handheld pounders are methodologically invalid for testing the mechanical effectiveness of continuous ancient stoneworking techniques.
  - claimId: GEO-C006
