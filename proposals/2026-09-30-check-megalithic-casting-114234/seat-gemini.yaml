    reasoning: >-
      The abstract and landing text of Davidovits & Davidovits (2020) directly state this precise model: builders used natural, uncrushed andesite sand from Cerro Khapia, transported and stored it at Iwawe (identifying it with Stratum V of Isbell & Burkholder), and did not make use of the carved quadrangular piedras cansadas. The claim is a strictly factual summary of the proponents' published theoretical model. The strongest opposing consideration is that the model's archaeological attribution of the Iwawe Stratum V deposit to an intentional casting aggregate stockpile is an unverified hypothesis.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: high
    reasoning: >-
      The proponents acknowledge that plant acids disaggregate carbonate rocks like limestone but completely fail to disaggregate volcanic andesite, forcing their Andean model to rely on unconsolidated sands. Crucially, Davidovits et al. (2019) admit that re-hardening with guano was only demonstrated in their laboratory using modern synthetic reagents rather than verified pre-industrial ingredients, publishing no replicable recipe, mechanical test data, or durability curves. The strongest opposing consideration is that organo-mineral cementation using phosphate and ammonium salts is chemically plausible in principle and has been claimed in Geopolymer Institute conference presentations.
  - claimId: GEO-C030
    verdict: mixed
    confidence: high
    reasoning: >-
      The claim is partially correct regarding bulk elemental techniques: portable XRF and standard ICP-MS focus on heavier metallic trace elements and cannot detect hydrogen, carbon, or light-element hydration bonds that would characterize a low-concentration binder mixed with native aggregate. However, the claim overreaches methodologically by asserting that materials analysis cannot tell the difference; mineralogical XRD, thin-section petrography, and binder-specific SEM-EDS (as demonstrated by Jana 2007) readily detect crystalline phases, synthetic gel structures, and void morphology. The strongest opposing consideration is that for provenance studies relying exclusively on immobile trace-element ratios, crushed quarry rock bound with light-element paste would indeed plot directly within the natural quarry's geochemical field.
  - claimId: GEO-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Materials science demonstrates that reconstituted limestone can be manufactured at ambient temperatures using pre-industrial binders such as hydrated lime combined with reactive pozzolans like diatomaceous earth or natural silicate solutions (Sierra et al. 2010; Barsoum 2006). The Geopolymer Institute has likewise produced physical multi-ton demonstration blocks of reconstituted limestone. The strongest opposing consideration is that demonstration blocks have not undergone published independent testing to verify that their long-term weathering characteristics, durability, and internal macrostructure accurately mirror ancient monument stone.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Ancient pyrotechnology routinely exceeded 850 °C using charcoal fuel and forced air, as demonstrated by Bronze Age copper metallurgy (requiring >1080 °C) and the firing of Egyptian faience and early vitreous materials (Shortland et al. 2006). Reaching the thermal threshold required to react natron with siliceous materials was well within ancient furnace capabilities. The strongest opposing consideration is that sustaining crucible-scale temperatures in a controlled kiln does not demonstrate the capability or fuel logistics required to process thousands of tons of reagent in open-air quarry conditions.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Geological and archaeological studies (Shortland et al. 2006) firmly document that ancient Egypt exploited vast natural evaporite deposits of natron at Wadi el Natrun and al-Barnuj from early antiquity, and that these primary sources experienced documented decline between the 7th and 9th centuries AD as glassmaking transitioned to plant-ash fluxes. The claim correctly reflects established archaeological history. The strongest opposing consideration is that all documented archaeological evidence for large-scale natron exploitation relates to mummification, faience, and glass production, with no historical or textual records indicating its application to structural stone casting.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The claim rests entirely on an unattributed anecdote in a non-peer-reviewed proponent text (Fóti 2024), with no formal laboratory simulation, documented field instance, or published replication in the evidence ledger. While the reaction of alkaline wood ash with lime and soil moisture to form crude carbonated agglomerates is chemically plausible, its occurrence in accidental fire pits remains unverified. The strongest opposing consideration is that alkaline ash-carbonation chemistry is a well-understood natural cementation pathway that could theoretically produce localized hardpans beneath persistent hearths.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      Marčiš et al. (2023) conducted controlled experimental quarrying trials on granite using authentic dolerite pounders and photogrammetrically measured a removal rate of approximately 216 cm³ per hour at an operating tempo of 85 strikes per minute. The claim is a precise and accurate restatement of published peer-reviewed measurements. The strongest opposing consideration is that a single experimental study with modern volunteers may not reflect the maximum efficiency, ergonomic endurance, or thermal pre-fracturing methods achieved by specialized ancient quarrying teams.
  - claimId: GEO-C502
    verdict: well_supported
    confidence: high
    reasoning: >-
      Engelbach's 1922 monograph on the Aswan obelisk explicitly bases its empirical rate estimate on a single self-conducted one-hour pounding experiment that achieved about 5 mm of progress over a small area, deriving workforce spacing and trench excavation timelines from heuristic multipliers while admitting doubts about manual hand-pounding alone. The statement accurately summarizes the documented textual basis of Engelbach's foundational report. The strongest opposing consideration is that Engelbach's broader technical conclusions were informed by comprehensive spatial mapping of hundreds of quarry trenches and thousands of dolerite tools across the Aswan site, not solely his personal 60-minute trial.
  - claimId: GEO-C002
