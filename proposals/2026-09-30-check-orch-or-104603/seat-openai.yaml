caseAssessment:
  verdict: contradicted
  loadBearing: [ORCH-C001, ORCH-C002, ORCH-C003, ORCH-C010, ORCH-C030]
  weakestLinks: [ORCH-C010, ORCH-C030, ORCH-C026]
  synthesis: >-
    The evidence supports several lower-rung observations while weighing
    against the featured hypothesis as stated. Microtubules are not merely
    inert scaffolding: excitation migration beyond the stated Förster
    comparison, polymerization-dependent fluorescence, anesthetic-induced
    optical changes, tubulin binding by a research anesthetic, and behavioral
    effects of microtubule-modulating drugs establish interesting
    photophysics and pharmacology. The affirmative steelman is therefore
    substantial. Two anesthetics shortened excitation diffusion; acute
    epothilone B delayed loss of righting reflex in rats and mice; and xenon
    isotope means show a striking spin-associated ordering that ordinary
    polarizability does not explain. These observations justify targeted
    experiments and make dismissal based merely on microtubules being “warm
    and wet” inadequate.

    They nevertheless do not establish the required bridge. No record
    measures tens-of-milliseconds coherence or entanglement across many
    tubulins under physiological neuronal conditions, much less connects such
    a state to a conscious moment or gravitational reduction. ORCH-E036 is
    especially damaging: no unconditional proponent estimate reaches the
    theory's 25 ms exemplar, while ORCH-E008 reports only 10^-5 to 10^-4 s.
    The newer radiative models expressly omit physiological dephasing baths,
    and radiative darkness is not coherence longevity. Thus the central
    mechanism claim ORCH-C010 is contradicted by the quantitative evidence
    currently available, although a direct physiological measurement could
    overturn that conclusion.

    The anesthesia evidence also separates sharply by rung. Tubulin can be
    affected by anesthetics, and microtubule drugs can alter susceptibility,
    but the flagship optical assay lacks specificity because picrotoxin
    produced a comparable effect. Acute epothilone-B resistance coexists with
    a stronger randomized, blinded chronic study in which epothilone D and
    vinblastine both increased sensitivity. By contrast, the GABA_A β3
    mutation supplies target-specific causal evidence for major intravenous
    anesthetic effects, although it does not exhaust volatile anesthesia or
    abolish every hypnosis endpoint. The strong quantum-microtubule anesthesia
    claim therefore fares substantially worse than the narrower classical
    account.

    On the physics side, two underground searches support exclusion of the
    natural parameter-free Diósi–Penrose model, and LISA Pathfinder constrains
    another regularized realization. Penrose's bare τ ≈ ℏ/E_G criterion does
    not itself entail those radiation signatures, so ORCH-C030 remains
    unresolved rather than refuted. That survival is not affirmative evidence:
    the surviving claim lacks a tested, agreed dynamics. AI mathematics
    likewise weakens one motivation for Orch OR without testing its biology or
    collapse physics.

    Overall, the conjunction “each conscious moment is orchestrated objective
    reduction” is contradicted by this record: its required coherence rung
    misses its own quantitative target, its best-specified collapse
    implementation is excluded, and its anesthesia evidence is nonspecific
    and directionally inconsistent. This verdict does not depend on a
    mainstream-plausibility prior. Sensitivity is greatest to ORCH-E036;
    removing that workpaper would weaken the quantitative case against
    physiological coherence, but the verdict survives because ORCH-E007,
    ORCH-E008, ORCH-E072, and ORCH-E073 still leave no qualifying measured or
    calculated state, while the anesthesia and collapse objections remain.
  steelman: >-
    The assessment does not answer the prospective prediction that chemically
    diverse anesthetics will suppress a prespecified microtubule coherence or
    optical observable in proportion to clinical potency while matched
    nonimmobilizers do not. A successful blinded potency series, especially
    if paired with a tubulin-pocket perturbation that changes behavior without
    changing receptor pharmacology, would provide the specificity and causal
    bridge missing from every existing experiment.
claimAssessments:
  - claimId: ORCH-C001
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      No evidence record measures a conscious moment, a qualifying neuronal
      microtubule state, or an objective-reduction event. ORCH-E036 finds that
      no unconditional proponent coherence estimate meets the theory's stated
      timing requirement, while the natural parameter-free collapse model is
      excluded by ORCH-E017 and ORCH-E049. The strongest opposing
      consideration is the convergence of nontrivial microtubule photophysics,
      anesthetic perturbations, and the disputed brain-MRI signal, but none
      identifies microtubules as a consciousness substrate or detects
      gravitational collapse.
  - claimId: ORCH-C002
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Anesthetics alter microtubule photophysics, and acute epothilone B delays
      loss of righting reflex, but no experiment measures disruption of a
      quantum-coherent state. Picrotoxin's comparable optical effect,
      opposite-direction chronic drug results, and strong GABA_A receptor
      causality weigh against the claimed substantial quantum-microtubule
      mechanism. The strongest opposing consideration is that the receptor
      evidence is most decisive for intravenous agents, leaving volatile
      anesthesia open to additional targets.
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      ORCH-E015 provides target-specific causal evidence: a GABA_A β3 point
      mutation abolishes etomidate and propofol immobility and profoundly
      reduces their hypnotic action. The broader record supports multiple
      targets for volatile agents rather than one universal receptor
      mechanism. The strongest opposing consideration is ORCH-E030, which
      shows that the hypnosis endpoint is reduced rather than abolished, so
      classical receptor evidence does not exhaust every contribution.
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The ledger supports important classical mechanisms but contains no
      evidence capable of establishing the exhaustive word “fully” or ruling
      out every quantum-coherent contribution to all cognition. ORCH-E031
      reports that known channel actions did not then suffice even for
      inhalational-anesthetic immobility, while the xenon isotope ordering
      remains an unreplicated quantum-specific anomaly. The strongest opposing
      consideration is the clean receptor-level causality for intravenous
      agents, but that supports ORCH-C003 rather than this universal claim.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The parameter-free stochastic Diósi–Penrose realization is strongly
      constrained or excluded by the underground nulls, and LISA Pathfinder
      limits a regularized mechanical-noise realization. Those tests do not
      directly measure the bare τ ≈ ℏ/E_G lifetime relation, whose complete
      dynamics remain disputed and incompletely specified. The strongest
      opposing consideration is that at least one semiclassical construction
      reportedly reproduces the conjectured rate exactly, but the ledger does
      not establish whether that construction survives the existing bounds.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Correct novel AI mathematics undermines arguments that particular
      difficult mathematical achievements require non-computable human
      understanding, but it does not show that human understanding executes a
      knowably sound formal algorithm. The induction-deduction-abduction
      distinction in ORCH-E025 supplies a coherent counterargument, though it
      is a position rather than an empirical result. The claim lacks an agreed
      operational test, so the evidence does not settle it in either
      direction.
  - claimId: ORCH-C010
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim specifies tens of milliseconds across many tubulins under
      physiological conditions, yet no evidence record measures such a state.
      ORCH-E008 gives the favorable unconditional estimate as only 10^-5 to
      10^-4 s, and ORCH-E036 reports that no unconditional proponent estimate
      reaches the 25 ms exemplar. Newer calculations model radiative loss
      without solvent, ionic, vibrational, or 310 K dephasing channels. The
      strongest opposing consideration is that all current numbers are
      model-dependent calculations rather than a direct physiological
      coherence measurement.
  - claimId: ORCH-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      ORCH-E009 identifies β-tubulin as a direct target of a research
      anesthetic with effects on polymerization, while ORCH-E002 reports that
      etomidate and isoflurane alter microtubule excitation diffusion.
      Together they support binding and altered electronic or optical
      behavior, though not necessarily for every anesthetic in the same
      assay. The strongest opposing consideration is that picrotoxin produced
      a comparable optical effect, undermining anesthesia specificity rather
      than the underlying perturbation.
  - claimId: ORCH-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Multiple live-animal studies report altered anesthetic susceptibility
      after pharmacological microtubule manipulation, including acute
      epothilone B and chronic epothilone D, vinblastine, and paclitaxel
      regimens. The opposing directions do not negate this claim as worded;
      they undermine a simple rule about stabilization protecting
      consciousness. The strongest opposing consideration is that these drugs
      have broad cellular and physiological effects, so microtubule stability
      may not be the causal mediator of every behavioral change.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      ORCH-E001 reports polymerization-dependent excitation migration not
      adequately explained by the stated Förster model, and ORCH-E004 links
      organized tryptophan networks to collective optical behavior and
      enhanced quantum yield. These findings support electronically
      nontrivial microtubules rather than a purely passive-scaffold picture.
      The strongest opposing consideration is that the collective
      interpretation is model-dependent and does not establish long-lived
      coherence, entanglement, or neural computation.
  - claimId: ORCH-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Kalra abstract directly reports approximately 6.6 nm excitation
      diffusion and reductions in the presence of etomidate and isoflurane.
      The result is an inferred diffusion length in purified microtubules, and
      the specific reduced values relayed from the paper body were not
      independently checked in the original import. The strongest opposing
      consideration is the lack of independent replication and the absence of
      a physiological neuronal preparation.
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      ORCH-E004 reports the predicted quantum-yield enhancement and an
      experimental bulk measurement in the same direction, while ORCH-E056
      adds partial cross-laboratory support at 280 nm. However, the estimated
      magnitude varies greatly with scattering correction, and at
      tryptophan-selective 295 nm the sign reverses between plausible analysis
      branches. The strongest opposing consideration is therefore
      metrological instability coupled with conventional local-photophysics
      alternatives to superradiance.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      ORCH-E005 reports the claimed triplet-of-triplet resonance pattern in
      the source abstract. It remains a single-laboratory result obtained with
      bespoke measurements over an unusually wide frequency range and has not
      been independently replicated. The strongest opposing consideration is
      susceptibility to setup artifacts; moreover, even a valid resonance
      pattern would be a classical electromagnetic observation rather than an
      entanglement witness.
  - claimId: ORCH-C023
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      ORCH-E011 directly reports a 69-second rat delay after acute epothilone B,
      and ORCH-E012 reports a 29-second mouse delay in the same research
      program. The exact directional observation is therefore reproduced
      across two species, although not independently across laboratories. The
      strongest opposing consideration is the small rat sample and the fact
      that the independent chronic epothilone-D study found increased rather
      than decreased anesthetic sensitivity.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: high
    reasoning: >-
      ORCH-E013 reports randomized, blinded concentration-response curves in
      which both chronic epothilone D and vinblastine shifted mice toward
      greater isoflurane sensitivity. The published confidence intervals
      support the stated direction and its opposition to the acute
      epothilone-B result. The strongest opposing consideration is that
      chronic dosing, a different epothilone, altered blood gases and permits
      compensatory remodeling, so it is not a direct replication of the acute
      protocol.
  - claimId: ORCH-C025
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The four reported means show spin-bearing isotopes requiring higher
      concentrations than spin-zero isotopes at identical calculated
      polarizability, and the directly measured isoflurane-combined endpoint
      has the same ordering. The descriptive spin step fits the four means
      better than a linear mass trend. However, the frozen two-covariate
      identification test failed, the headline xenon-alone values were
      calculated, dispersions are insufficiently documented, and no
      replication was located. Those auditability and replication failures
      are the strongest opposing considerations.
  - claimId: ORCH-C026
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The original investigators report heartbeat-timed signals, changes
      around sleep onset, and their interpretation that entanglement may have
      been witnessed. Their reply quantitatively argues that the specific
      classical iZQC mechanism proposed by Warren is too small and has the
      wrong parameter dependence. The strongest opposing consideration is
      Warren's broader methodological objection that complex living tissue
      can generate inadequately characterized classical MRI signals. The
      awareness manipulation was naturalistic and no independent replication
      has adjudicated the dispute.
  - claimId: ORCH-C031
    verdict: established
    confidence: high
    reasoning: >-
      ORCH-E017 directly reports the Gran Sasso null, the roughly
      three-orders-of-magnitude improvement, and exclusion of the natural
      parameter-free Diósi–Penrose model. ORCH-E049 adds an independent
      underground germanium null that strengthens the same exclusion. The
      strongest opposing consideration concerns scope: these experiments do
      not exclude every gravity-related collapse theory or Penrose's bare
      lifetime criterion.
  - claimId: ORCH-C041
    verdict: established
    confidence: high
    reasoning: >-
      ORCH-E022 anchors the Erdős-conjecture disproof in an independent
      mathematician's paper that builds on the AI-generated result, while
      ORCH-E023 documents Lean-verified silver-medal-level IMO performance.
      These are correct research-level and medal-level mathematical
      achievements as claimed. The strongest opposing consideration is that
      an internal unreleased model limits process auditing and that success
      within existing frameworks does not resolve the philosophical
      non-computability claim.
  - claimId: ORCH-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      ORCH-E044 supplies a radical-pair kinetic model that can reproduce a
      reported magnetic-field effect on tubulin assembly and generates
      field- and isotope-dependent predictions. It does not experimentally
      demonstrate the proposed radical pair, and free rates were selected to
      fit a target ratio lacking reported uncertainty. The strongest opposing
      consideration is therefore that the asserted mechanism rests on a
      flexible model rather than a direct spin, field, or isotope
      intervention.
  - claimId: ORCH-C046
    verdict: well_supported
    confidence: high
    reasoning: >-
      ORCH-E046 reports the 40.1 ± 0.5 fm lower bound derived from LISA
      Pathfinder's acceleration-noise measurement and correctly states that
      this exceeds nuclear dimensions. The bound is conservative because all
      residual acceleration noise is attributed to collapse. The strongest
      opposing consideration is its model dependence: it applies to a
      regularized Diósi–Penrose realization with a specified cutoff, not
      automatically to Penrose's bare criterion.
  - claimId: ORCH-C047
    verdict: established
    confidence: high
    reasoning: >-
      ORCH-E047 directly reports the Majorana Demonstrator's 37.5 kg-y
      enriched-germanium exposure, 19–100 keV search range, and null
      1/E-signature result. The fitted signal is consistent with zero by a
      wide margin, establishing the stated experimental outcome. The
      strongest opposing consideration limits interpretation rather than the
      observation: colored-noise collapse models can evade this X-ray
      channel.
  - claimId: ORCH-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only pertinent ledger material is a proponent commentary asserting
      that no other candidate target reproduces Meyer–Overton, with no
      systematic survey supporting that universal existence claim. The
      underlying tubulin study is computational and may motivate a prospective
      test, but it cannot establish uniqueness across all published target
      models. The strongest opposing consideration is that the claimed
      tubulin potency correlation is specific and testable, even though it
      remains unvalidated experimentally.
  - claimId: ORCH-C063
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      ORCH-E080 describes molecular-dynamics-derived structural variability in
      the context of a reported reduction in maximal superradiant enhancement
      relative to the ordered reference while retaining quantum yields above
      0.14. This supports the stated within-model comparison, but only in a
      computational preprint using simulated rather than measured in-vivo
      disorder. The strongest opposing consideration is that the evidence
      record quotes the surviving quantum yield rather than directly
      quantifying the enhancement reduction, leaving the claim dependent on
      the source's reported modeling context.