  synthesis: >-
    The featured hypothesis is a conjunctive stack: Penrose objective reduction
    with gravitational lifetime scaling, orchestrated across neuronal microtubule
    tubulins, with conscious moments identical to those reductions, and with
    general anesthesia acting substantially by disrupting the required
    quantum-coherent microtubule state. The evidence ledger shows the stack
    coming apart cleanly rather than standing or falling as one. On the
    observation rung, microtubules are electronically nontrivial: excitation
    diffusion beyond simple Förster expectations, polymerization-linked quantum
    yield trends consistent with collective tryptophan optics, and anesthetic
    perturbation of those optical observables are real measurements (C020, C021,
    C013, C011). Acute microtubule stabilization delaying isoflurane LORR and
    chronic stabilization plus destabilization shifting sensitivity the other
    way are also real (C023, C024, C012). None of those results is a coherence
    time, an entanglement witness tied to tubulin, or a collapse event. The
    mechanism claim that physiological microtubules sustain coherent or
    entangled states for tens of milliseconds across many tubulins (C010) remains
    unmeasured; competing decoherence calculations disagree by orders of
    magnitude and even the favorable proponent recalculation falls short of the
    theory’s own exemplar, while 2026 modeling still reports radiative rather
    than thermal-bath dephasing times. The physics conjunct (C030) is damaged
    in its most natural stochastic Diósi–Penrose completion by two independent
    underground nulls and a LISA Pathfinder momentum-noise bound (C031, C047,
    C046), yet Penrose’s bare τ ≈ ℏ/E_G lifetime criterion is not itself what
    those channels test, so the characteristic-lifetime claim stays untested
    rather than refuted. Conventional multi-target receptor pharmacology,
    especially the β3(N265M) causal dissociation for intravenous agents (C003),
    is far stronger causal evidence than any microtubule anesthesia result, while
    the exhaustive claim that classical mechanisms leave no room for any quantum
    contribution (C004) overreaches given residual volatile-target uncertainty,
    the unreplicated xenon nuclear-spin potency split, and historical incompleteness
    on immobility mechanisms. Non-computability motivation (C040) is pressured by
    verified AI research-level mathematics (C041) but is not a direct test of
    microtubule collapse. Contested zero-quantum-coherence MRI (C026) does not
    implicate microtubules even if it survives. Weighing only the attached
    records, lower rungs are partly well supported as local physical and
    pharmacological observations, the load-bearing coherence and collapse
    conjuncts are unresolved, and the attribution theses C001 and C002 are not
    established. The case verdict is therefore unresolved: the featured stack is
    neither demonstrated nor closed by a single decisive measurement of the
    quantities it actually requires.
  steelman: >-
    No published non-tubulin molecular target has a quantum-chemical model that
    reproduces the Meyer–Overton potency correlation from first-principles binding
    to a nominated site the way the Craddock tubulin terahertz/delocalized-electron
    modelling claims to, and the acute brain-penetrant epothilone-B delay of
    isoflurane LORR remains a large, blinded behavioral effect in the direction
    the microtubule-stability hypothesis predicted before the contradictory
    chronic epothilone-D result appeared.
  sensitivity:
    mostChangeRecord: ORCH-E017
    survivesWithout: true
    note: >-
      Removing the Gran Sasso exclusion of parameter-free Diósi–Penrose would
      soften the physics pressure on C030/C001 and is the single strongest
      negative physics result, but the case verdict remains unresolved because
      C010 is still unmeasured, C001/C002 still lack direct coherence or collapse
      evidence, and C003 still supplies stronger classical causal evidence than
      any microtubule anesthesia arm; the verdict does not hang on that one
      thread alone.
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: high
    reasoning: >-
      The claim requires both sustained orchestrated microtubule quantum states
      at neural timescales and gravitational objective reduction as the conscious
      event; the ledger contains neither a measured coherence/entanglement time
      meeting C010 nor a measured collapse event, and the best-supported physics
      completion is excluded while the bare lifetime criterion is untested.
      Strongest opposing consideration is that lower-rung MT photophysics and
      anesthesia correlations could still be early signs if future coherence
      measurements succeed, but that is promissory rather than present evidence
      for the attribution as stated.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Anesthetics bind tubulin and alter MT optical behavior, and MT-stability
      drugs change anesthetic susceptibility, which is weak positive linkage, but
      the required quantum-coherent MT state is unshown, picrotoxin comparably
      perturbed the flagship optical assay, chronic stabilizer/destabilizer
      results run against a simple stability-protects-consciousness rule, and
      intravenous anesthesia has strong classical receptor causality. Strongest
      opposing consideration is the xenon nuclear-spin potency split and the
      acute EpoB LORR delay, which keep a non-classical or MT contribution from
      being empty.
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Jurd et al. show a single GABA_A β3 point mutation abolishes immobilizing
      action and profoundly reduces hypnosis for etomidate and propofol, which is
      target-level causal evidence unmatched by any microtubule study in the
      ledger; the authors themselves limit clean transfer to volatiles. Strongest
      opposing consideration is that volatiles act via a broader target spectrum
      and that hypnosis is reduced rather than abolished, leaving a residual
      opening for additional mechanisms.
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The universal quantifier “fully” and “without any quantum-coherent
      contribution” is not established by receptor successes alone; Eger et al.
      report no known channel or combination sufficient for inhaled immobility,
      the xenon isotope result is hard for polarizability-only pharmacology, and
      residual hypnotic effects remain after β3 mutation. Strongest opposing
      consideration is that the mainstream multi-target classical program still
      explains far more of clinical anesthesia than any demonstrated quantum-MT
      pathway.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Parameter-free stochastic Diósi–Penrose is excluded by underground radiation
      searches and constrained by LISA Pathfinder acceleration noise, but the
      claim as worded is the characteristic-lifetime relation τ ≈ ℏ/E_G, which
      those channels do not directly measure and which McQueen argues need not
      entail the searched-for radiation. Strongest opposing consideration is that
      every concrete dynamical completion so far proposed is under severe
      experimental pressure, so underspecification may be sheltering an already
      failing idea.
  - claimId: ORCH-C040
    verdict: presently_untestable
    confidence: low
    reasoning: >-
      The claim is an open-ended interpretive thesis about human mathematical
      understanding rather than a finite empirical prediction; AI systems have
      produced novel research-level results that pressure the historical examples
      Penrose offered, while the “escalator not the steps” rejoinder moves the
      claim away from those testable instances. Strongest opposing consideration
      is that some defenders treat ongoing framework invention as still beyond
      present architectures, but that formulation has no operational pass/fail
      in the ledger.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: high
    reasoning: >-
      No attached record measures a coherence or entanglement duration of tens of
      milliseconds in physiological microtubules; Tegmark and Hagan calculations
      disagree and even the favorable 10^-5–10^-4 s estimate misses the theory’s
      ~25 ms exemplar, while recent collective-optics work reports radiative
      lifetimes and quantum-yield trends, not thermal-bath dephasing times.
      Strongest opposing consideration is ordered-lattice and collective-state
      physics that may change environmental assumptions, but that remains a
      modeling hope without the decisive spectroscopy.
  - claimId: ORCH-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Emerson et al. photolabeled β-tubulin with a research anesthetic and showed
      functional polymerization and in vivo sensitivity consequences; Kalra et al.
      show clinical anesthetics reduce MT exciton diffusion. Strongest opposing
      consideration is limited agent coverage, uncertain free aqueous
      concentration, and the picrotoxin specificity failure on the same optical
      assay, which qualifies mechanism-to-anesthesia inference without erasing
      binding and optical alteration as stated.
  - claimId: ORCH-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Acute epothilone B delays isoflurane LORR in rats and mice, and chronic
      epothilone D and vinblastine shift LORR concentration–response curves in
      mice; Emerson’s tadpole work also ties MT stabilizers to anesthetic
      requirement. The claim only requires that stability manipulation changes
      susceptibility, which these records show even though directions conflict.
      Strongest opposing consideration is that conflicting directions and shared
      cellular confounds block any single mechanistic reading from stability to
      consciousness.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      Kalra’s polymerization-dependent excitation diffusion beyond Förster
      expectation and Babcock’s hierarchical quantum-yield enhancement predicted
      by collective tryptophan models are direct evidence that MTs are not
      optically passive scaffolding; Saxena resonances add weaker, unreplicated
      classical EM structure. Strongest opposing consideration is that collective
      optics is not coherence-for-computation and that some QY increases can have
      conventional photophysical readings, especially under scattering ambiguity.
  - claimId: ORCH-C020
    verdict: well_supported
    confidence: high
    reasoning: >-
      Kalra et al. report ~6.6 nm electronic energy diffusion in polymerized
      microtubules not sufficiently explained by standard Förster models after
      Trp–Tyr accounting, and report reduced diffusion with 50 μM etomidate or
      isoflurane. Strongest opposing consideration is single-lab origin with
      theory co-authors, inferred rather than imaged length, in vitro purified
      MTs, and picrotoxin comparability on related quenching behavior.
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Babcock et al. predict superradiant tryptophan-network states and report
      fluorescence quantum-yield enhancement with hierarchical organization;
      Gassab et al. find polymerization raises QY at 280 nm in another
      preparation. Strongest opposing consideration is large scattering-correction
      dependence, sign instability at tryptophan-selective 295 nm, and the
      authors’ caution that steady-state QY shifts need not be collective
      emission.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Saxena et al. report self-similar triplet-of-triplet resonance patterns from
      tubulin through microtubule to axon initial segment, but the observable is
      classical electromagnetic resonance, the venue and apparatus are niche, and
      no independent protocol-level replication appears in the ledger after years.
      Strongest opposing consideration is that a true scale-free resonance would
      still be scientifically interesting if replicated, even without being an
      entanglement witness.
  - claimId: ORCH-C023
    verdict: well_supported
    confidence: high
    reasoning: >-
      Khan et al. report a blinded +69 s LORR delay after acute low-dose
      epothilone B in rats with large effect size and a tolerance control; Huang
      et al. extend directionally to mice (+29 s) in the same program. Strongest
      opposing consideration is small N, non-counterbalanced design, single high
      isoflurane concentration, no quantum variable, and non-independence of the
      mouse replication.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: high
    reasoning: >-
      Li et al. 2025, an independent randomized blinded mouse study with full
      LORR curves, finds chronic epothilone D and vinblastine both left-shift
      (increase sensitivity) with tight EC50 confidence intervals. Strongest
      opposing consideration is chronic versus acute regimen difference from the
      Wellesley EpoB work, possible pH/CO2 confounds, and imperfect vehicle
      controls for poorly soluble agents.
  - claimId: ORCH-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Li et al. 2018 report substantially higher LORR ED50 for nuclear-spin
      xenon isotopes than spin-zero isotopes at matched calculated polarizability,
      a striking pattern hard for classical polarizability accounts. Strongest
      opposing consideration is single unreplicated study, headline xenon-alone
      values calculated from isoflurane co-administration, unstated dispersion
      type, failed two-covariate identification under pre-set rules, and no
      demonstrated microtubule link.
  - claimId: ORCH-C026
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Kerskens & López Pérez report consciousness-related zero-quantum-coherence
      MRI signals they interpret as possible entanglement, and their reply argues
      classical iZQC bounds cannot reach the observed amplitudes; Warren contends
      the data show only known tissue complexity and supply no entanglement
      evidence. Strongest opposing consideration is that a validated nonclassical
      brain signal would be major, but the dispute is unresolved, unreplicated,
      and silent on microtubules.
  - claimId: ORCH-C031
    verdict: established
    confidence: high
    reasoning: >-
      Donadi et al. report a dedicated Gran Sasso germanium search finding no
      spontaneous radiation predicted by stochastic gravity-related collapse and
      explicitly ruling out the natural parameter-free Diósi–Penrose version;
      Majorana Demonstrator independently reports no 1/E signature and tightens
      the DP bound. Strongest opposing consideration is that coloured-noise or
      non-radiating formulations can evade the channel, which limits scope without
      undoing the stated exclusion.
  - claimId: ORCH-C041
    verdict: established
    confidence: high
    reasoning: >-
      Sawin independently states and improves an OpenAI-originated disproof of a
      1946 Erdős unit-distance conjecture; AlphaProof’s Lean-verified IMO-level
      performance is peer-reviewed in Nature; further gold-standard IMO grading
      is reported for natural-language systems. Strongest opposing consideration
      is that competition problems and framework-internal results may not touch
      abductive framework invention, which affects C040 interpretation rather than
      the factual claim that AI produced novel research-level mathematics.
  - claimId: ORCH-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Zadeh-Haghighi & Simon insert radical-pair spin dynamics into a kinetic
      model of tubulin polymerization and report that the model reproduces prior
      hypomagnetic-field effects on assembly fairly well. Strongest opposing
      consideration is that this is parameter-fitted modelling without new
      anesthesia endpoints, not an independent measurement of spin-dependent MT
      density under controlled fields.
  - claimId: ORCH-C046
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Helou et al. attribute LISA Pathfinder residual relative acceleration noise
      to collapse-induced force noise and bound the DP regularization length to
      at least ~40.1 fm, larger than any nucleus, ruling out particle-sized
      cutoffs for that model class. Strongest opposing consideration is that the
      bound is conservative (thermal noise dominates) and applies to regularized
      DP with a point-mass cutoff rather than every reading of Penrose’s
      heuristic.
  - claimId: ORCH-C047
    verdict: established
    confidence: high
    reasoning: >-
      The Majorana Demonstrator collaboration reports no evidence of
      spontaneous-collapse 1/E radiation in 19–100 keV over 37.5 kg-y enriched
      exposure, with a best-fit signal consistent with zero. Strongest opposing
      consideration is restriction to white-noise formulations and secondary DP
      re-expression of a CSL-oriented search, which the claim’s wording already
      matches as a null in that channel.
  - claimId: ORCH-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The uniqueness claim appears as an assertion in proponent commentary that
      tubulin quantum-chemical modelling reproduces Meyer–Overton and that this
      “cannot be said for any other candidate molecular target,” without a cited
      systematic survey of failed models for other targets in the ledger.
      Strongest opposing consideration is that Craddock et al. 2017 do offer a
      concrete tubulin potency-correlation model worth prospective test, which is
      real work even if uniqueness is unproven.
  - claimId: ORCH-C063
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Gassab & Craddock report that molecular-dynamics-derived structural
      variability substantially reduces maximal superradiant enhancement of
      modelled MT tryptophan networks relative to an ordered 1JFF lattice, while
      some elevated quantum yield can persist. Strongest opposing consideration is
      preprint computational status and MD-sampled rather than in vivo disorder,
      so the magnitude awaits experimental locking of the same observable.