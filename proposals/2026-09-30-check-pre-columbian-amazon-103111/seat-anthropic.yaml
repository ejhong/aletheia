caseAssessment:
  verdict: provisionally_supported
  loadBearing: [AMZ-C003, AMZ-C017, AMZ-C011, AMZ-C010, AMZ-C002, AMZ-C016]
  weakestLinks: [AMZ-C010, AMZ-C003, AMZ-C023]
  synthesis: >-
    I take the featured hypothesis from the case title and its framing
    question. The crowded, organized river world Carvajal described in 1542
    was real, and post-contact collapse emptied it. The rival readings are
    that he invented it or merely exaggerated it. The ledger splits the
    hypothesis into three legs of unequal strength.

    The first leg, that the world existed, is the best supported. It rests
    chiefly on E007. The sixteenth-century accounts compiled there come from
    two other expeditions: Nunes's entry of 1538 and the Ursúa expedition of
    1560. They describe dense settlement, vast food stores, and long straight
    roads on the Machiparo/middle-Solimões reaches Carvajal named. None of
    them repeats his extreme numbers. That is the signature of a
    qualitatively reliable witness whose figures are not counts. It matches
    Denevan's collation, which places the 50,000-, 10,000- and 8,000-warrior
    figures and the league-long villages in one manuscript branch only
    (E005).

    Archaeology places organized societies near his lower route across the
    contact horizon itself. The Belterra sites, with dark earths, ponds, and
    trodden roads, run up to seventeenth-century colonization (E017), and
    Marajoara continuity at Cacoal runs to 1650 (E018). Off-route systems
    show substantial late populations elsewhere (E004, E019). The
    radiocarbon proxy rises toward carrying capacity before colonization
    (E020).

    The earliest 'mentirosa' charge targeted Orellana's relación. On
    Medina's reading it concerned the Amazons, not the settlements (E080,
    E082, E099). Those Medina-derived records rest on a single reading that
    no second reader has checked. Oviedo's and Medina's character
    endorsements carry no diagnostic weight, and I give them none.

    Much of the celebrated new archaeology does not bear on this leg. The
    Aquiry peak is AD 100–300 (E003), and Casarabe ends around 1400 (E014).
    These results defeat the old argument that Amazonia could not support
    complex societies. Spending them as corroboration of 1542 would be a
    chronology error.

    The population models are also assumption-driven. The Aquiry estimate
    spans roughly fivefold across its own alternatives (E002). The
    southern-rim figure scales 20- to 50-fold from counted sites (E004).
    Denevan abandoned his own method while retaining its order of magnitude
    (E009). No count exists that could vindicate or refute Carvajal's
    figures.

    The second leg, that the world was emptied, is the weakest. E008
    documents catastrophic, mixed-cause declines of about 88% and 62–64% by
    circa 1700. These include flight from exposed riverbanks, which is the
    right mechanism for later silence along the rivers and a reason to
    prefer 'emptied' over 'died'. But these are upper-Amazon provinces, and
    E008 itself flags extension to the middle and lower Amazon as
    extrapolation. The fade-out mechanism (AMZ-C023) has no evidence record.

    The ledger holds no collapse series for Carvajal's reaches. It does not
    itself document their later emptiness. The support is circumstantial:
    the systems dated across 1542 all end in the colonial centuries. Where I
    credit this leg beyond Newson's provinces, I lean on the general
    background that post-contact collapse was widespread in the Americas.
    That is a prior, not ledger evidence. The Ursúa witnesses also show the
    middle Solimões still crowded in 1560. So any emptying happened over the
    following century, not between Orellana and Ursúa.

    The third leg is scale. The sparse-matrix evidence (E010, E011, and the
    basin models) is exposed to survey bias, thin sampling (AMZ-C021), and
    possible erasure (AMZ-C022). Still, none of it contradicts a corridor
    reading. It is what Carvajal's own empty stretches and the bluff model
    (E006) predict. It does rule out an emptied basin-wide civilization.

    Steelmanning against the hypothesis:
    - Corroboration covers two stretches of a very long route.
    - Nunes survives only in a later letter.
    - The ten Ursúa accounts come from one expedition.
    - The southern-rim horizon closes around 1500, before Orellana, and the
      ledger does not explain this.
    - The collapse is borrowed from other provinces.

    Steelmanning for it: nothing in the ledger contradicts the corridor
    version, and the rivals fare worse. 'Invented' is contradicted by
    independent testimony and contact-era archaeology. 'Exaggerated'
    survives only for numbers that were never counts.

    AMZ-C010 and AMZ-C003 are both load-bearing and weakest links. AMZ-C010
    is not doubtful; its scope simply stops short of Carvajal's reaches.
    AMZ-C003 hangs on a single record. No record in the packet is marked
    provisional, and the rejected tombstones E086, E107, and E108 are
    disregarded.

    Verdict: provisionally_supported. 'Real' is well supported for specific
    reaches. 'Emptied' rests on regional analogy and occupation end-dates.

    Sensitivity: the most load-bearing record is E007. Without it, the
    reaches carrying the account's most famous descriptions would be
    uncorroborated. The case would lean on lower-Amazon archaeology alone
    (E017, E018), and I would lower the verdict to weakly_supported. The
    verdict does not survive E007's removal at its current level; it hangs
    substantially on that one thread.
  steelman: >-
    The sequence the emptied-world hypothesis predicts is the one the ledger
    shows wherever it can be dated.

    Three separate parties attest a populated Machiparo/middle-Solimões
    reach: Nunes in 1538, Carvajal in 1542, and the Ursúa expedition in
    1560. The accounts compiled in E007 call it one of the most densely
    inhabited parts of the river, with vast food stores and long roads.

    Every system dated across 1542 ends during colonial expansion: Belterra
    near Santarém at seventeenth-century colonization, Cacoal on Marajó at
    1650, and the Upper Xingu towns around 1770. In the provinces the ledger
    has colonial records for, populations fell 62–88% by about 1700 through
    epidemics, raiding, missionization, and flight from the riverbanks.

    My assessment stops at provisionally_supported because the ledger lacks
    a middle-Amazon collapse series. Yet it offers no competing explanation
    for how a corridor independently described as crowded through 1560
    became the empty river of the later record. The downgrade rests on
    missing records, not on any record showing that these reaches were not
    emptied.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This is a claim about a text's content, and the ledger supports it
      mostly indirectly. Denevan's collation (E005) presupposes warrior-count
      and league-long-village passages in the Medina branch, and the bluff
      model (E006) matches the alternation of dense and empty reaches the
      claim reports. No evidence record quotes the Relación body, which is
      unread, so the specific inventory (fine ceramics, travelled roads,
      multi-settlement territories) leans partly on general background
      knowledge of the chronicle, which I disclose. The strongest opposing
      consideration is that 'the chronicle' is two divergent witnesses, one
      mixed with Orellana's oral testimony (E089). Any content claim is
      therefore branch-dependent, though the qualitative picture is not
      among the elements reported to diverge (AMZ-C002).
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      E005 quotes Denevan's collation verbatim. The Oviedo version has no
      50,000, 10,000, or 8,000 warriors, no villages four or five leagues
      long, and one mention of 5,000 warriors; the Medina (and Muñoz)
      versions carry the larger figures. The clause that Oviedo 'preserves
      the populous-settlement picture' rests on the claim's anchor rather
      than the quoted sentence, though it is implicit in the comparison. The
      strongest opposing consideration is transmissional: Oviedo rewrote the
      friar's account with Orellana's oral particulars (E089), so his text
      is a redaction, not a clean second manuscript. The divergence is real,
      but it cannot show in which direction the figures moved, and no
      synoptic table exists (AMZ-R002).
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E089 quotes Oviedo through Medina's introduction (p. xl). Oviedo says
      that beyond the friar's eyewitness text he learned particulars in Santo
      Domingo 'del mesmo capitán Francisco de Orellana é de otros
      caballeros'. The quotation is specific and located, and it is
      consistent with general background on how Oviedo compiled his Historia
      (a prior, disclosed). The strongest opposing consideration is
      verification status. SRC-CARVAJAL-1542 is labelled unverified because
      only the drafter read the Medina OCR and the second reader could not
      retrieve it, and Oviedo is reached second-hand through Medina. The
      claim matters because it makes the Oviedo branch non-independent of
      Orellana, which limits what the divergence in AMZ-C002 can show.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E007 (Lopes et al. 2024, verified verbatim) reports Nunes entering the
      Machiparo province in 1538 and ten accounts of the 1560 Ursúa
      expedition. The accounts call the middle Solimões one of the most
      densely inhabited parts of the river, with maize stores called
      'infinita', long roads likened to Inca roads, and turtles and fish in
      the thousands. Two elements outrun the record: 'renowned ceramics' is
      absent from E007's quoted content, and 'independent' needs qualifying.
      Nunes survives only as a 1553/54 letter, written after Carvajal's
      account existed and known through a modern edition, and the Ursúa
      accounts are one expedition's witnesses. The strongest opposing
      consideration is that expectations about a famous river could have
      shaped later narratives. Against it, none of these witnesses repeats
      Carvajal's extreme numbers, as independent observation would predict.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E080 quotes Medina's introduction (p. xxxv): Gómara cites Orellana's
      relación 'dándole el calificativo de «mentirosa»' without stating his
      grounds. The claim is narrowly about what Medina records, and the
      quotation matches it. The strongest opposing consideration is the
      verification gap: one drafter read an OCR text that the second reader
      could not retrieve, and Gómara's own passage is absent from the
      ledger. For the hypothesis, the charge's object matters more than its
      existence. It targeted Orellana's relación and, on Medina's reading,
      the Amazons report (E082, E099), not the populous settlements.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      E072 quotes the abstract directly. The article verifies the eyewitness
      account through the geographic reference points in the narration and
      concludes it 'se puede considerar como una fuente digna de confianza'.
      For a claim about what Achmatowicz concludes and on what basis, the
      abstract suffices even though the body was not read. The strongest
      opposing consideration concerns implication, not local truth. An
      itinerary that checks out geographically says nothing about settlement
      density or the numbers, and the second reader correctly demoted this
      record's bearing on AMZ-C017 to context (E077).
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Both legs have direct support. On the numerical leg, the extreme
      figures survive in only one witness (E005); as a harried expedition's
      estimates of attacking forces, they could never have been counts. On
      the qualitative leg, witnesses from two other expeditions repeat dense
      settlement, food stores, and roads on the Machiparo/middle-Solimões
      reaches while repeating none of the numbers (E007), a leg that leans
      heavily on that one record. Occupation also persists across the
      contact horizon near his lower route at Belterra and Cacoal (E017,
      E018). The endorsements and the Amazons-directed lie-charge (E099,
      E100, E105, E106, E109) are zero-diagnosticity context, the rejected
      E107 and E108 are disregarded, and the Aquiry peak is a millennium too
      early (E003). The strongest opposing consideration is coverage:
      corroboration spans two stretches of a long route, excludes
      fortifications and organized warfare (E007 limitation), and lacks any
      reach-by-reach test (AMZ-R001), while Carvajal's partisanship for
      Orellana (E111) bears mostly on danger and numbers, which the claim
      already discounts.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E001 verifies the core figures verbatim: 432 earthworks on 10 ALS
      lines (only 36 previously known), a circumscribed area of about
      183,000 km², and an estimate of approximately 24,000–30,000 earthworks.
      The claim rightly calls that total a prediction, a block extrapolation
      per E001's limitation, and the 4,430 km flight length rests on the
      claim anchor rather than E001's quotation. E001 also records that only
      about two thirds of those earthworks belong to the Aquiry, so 'within
      it' should not be read as 24,000–30,000 Aquiry earthworks. The
      strongest opposing consideration is that this is a single, weeks-old
      study whose data collection this site's founder funded. The 2023
      basin-wide model also puts undiscovered earthworks for all Amazonia at
      10,272–23,648 (E038, E039), context showing totals are model-dependent.
      For the hypothesis, it defeats ecological-impossibility arguments but
      dates to AD 100–300 (E003), not Carvajal's world.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      E002 quotes both calculations verbatim. A 25–60% simultaneous-use
      fraction (4,165–10,000 earthworks) times an assumed 300 people per
      earthwork yields 1.25–3 million. The single-family reading yields
      250,000–600,000, or 315,000–760,000 with the canopy correction. Even
      within the preferred model the result spans 2.4-fold on an assumed use
      fraction and scales linearly with an assumed per-earthwork figure,
      which justifies 'highly model-sensitive'. The strongest opposing
      consideration is that the authors call the single-family reading 'very
      unlikely', so treating it as the lower error bar imports an
      alternative they reject. The claim nonetheless reports it accurately
      as the paper's own alternative, and E002's limitation concedes the
      emphasis is the ledger's.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E004 quotes the finding and the population chain verbatim: fortified
      earth-building villages along 1,800 km of the southern rim at about
      cal AD 1250–1500. The 500,000–1,000,000 estimate is built from site
      contemporaneity, ethnographic formulae, and projection from 21,340
      people at the counted UTB sites. Because the claim carries these
      dependencies itself, it is well supported as stated. The strongest
      opposing consideration is extrapolation: the counts come from one
      sub-region, the step to projected totals is 20- to 50-fold via a
      predictive model, and 'fortified' interprets ditched enclosures. For
      the hypothesis, this is contact-adjacent evidence of substantial
      populations off Carvajal's main-river route, and its horizon closes
      around 1500, before Orellana.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Two strong primary records carry the core. Belterra Plateau sites are
      dated ca. AD 1300 up to seventeenth-century colonization, with dark
      earths, ponds, and trodden roads (E017). Cacoal is dated AD 1300–1650,
      attesting Marajoara continuity while the Portuguese settled Marajó
      (E018). The Upper Xingu leg (inhabited 500–1770 CE in Kuikuro-like
      plaza layouts but ten times larger) rests on a Science news feature
      (E019), rightly held at secondary weight. The strongest opposing
      consideration is that terminal dates like 'up to the time of European
      colonization' are coarse, and continuity is not population size;
      persistence through 1542 shows these systems existed at contact, not
      how large they then were. These remain the ledger's key records for
      placing Carvajal-type societies in the contact horizon.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E014 quotes the abstract verbatim: drainage canals, newly documented
      savannah farm ponds, and phytoliths from 178 samples in 18 profiles
      recording 'the singular and ubiquitous presence of maize'. The authors
      interpret this as intensive year-round maize monoculture. The
      strongest opposing consideration is inferential: 'monoculture' is read
      from maize ubiquity, and root crops such as manioc leave weak phytolith
      signals, so absence of other crops is less diagnostic than presence of
      maize (a general-background prior, disclosed). 'Year-round' is
      likewise inferred from dual-season water management. Casarabe
      florescence ends before contact (E014 limitation), so the claim bears
      on capacity, not on the world Carvajal saw.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The concentration pattern is directly reported: domesticated species'
      abundance and richness rise on and around archaeological sites (E012).
      A further 53 of 79 domesticated species associate with modelled
      earthwork probability (E040, E041), though that result shares species
      list and authors with the first and is not independent. The
      landscape-engineering leg has in-ledger support from dark earths at
      Belterra (E017) and dated raised fields in Mojos (E015, E016), but
      human-made forest islands have no evidence record. The strongest
      opposing consideration is attributional. McMichael et al. argue
      post-Columbian activities likely played the larger role in the
      floristic pattern (E013), so the pattern is well supported while its
      pre-Columbian origin is contested.
  - claimId: AMZ-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Rodrigues et al. date intermittent raised-field use from as early as AD
      570–770, in a few separate construction events, and explicitly
      challenge continuous cultivation (E016). Lombardo et al. propose
      flood-risk mitigation, with fields built 'only in those areas where
      there were no alternatives' (E015). That phrase comes from the 2011
      paper, not the 2015 anchor, and both papers come from one research
      group. The strongest opposing consideration is scope. The dated
      evidence is from Bermeo (E016 limitation), yet the claim speaks of
      Mojos raised fields generally, and Casarabe's engineered year-round
      cultivation in the same savanna (E014) shows intensity varied. The
      claim is supported for Bermeo but only provisional as a regional
      statement.
  - claimId: AMZ-C019
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is attached, so this verdict rests on the claim's
      own source anchor and the source record's verification note, which
      report zigzag weirs, straight causeways, and 382 ponds. The claim
      overstates its anchor on function. The authors write 'we postulate
      that the principal function of the V-shaped structures was to
      concentrate fish in ponds', which is a hypothesis, not a
      demonstration. The within-35-m proximity figure is not quoted anywhere
      in the ledger. The strongest opposing consideration is thus the gap
      between documented features and inferred function; the ledger gives no
      date for the system, and AMZ-C026's fish remains come from a different
      site and do not test the weirs.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E022 verifies more than 17,000 fish remains from Loma Salvatierra, a
      monumental mound 50 km from the Mamoré occupied AD 500–1400. It names
      lungfish and tiger-fish among dry-season resources of small water
      bodies. The strongest opposing consideration is a modest overreach.
      The source is quoted as showing these regions 'contain year round
      resources', while the claim says it documents year-round exploitation;
      dry-season fishing is a reasonable inference from the species present,
      not a direct seasonality measurement. The source record also notes a
      paucity of large river fish, and this is a single pre-contact site.
  - claimId: AMZ-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      E009 is decisive for the second clause. Denevan rejects the
      habitat-density method behind his 5.1–6.8 million figure because
      densities varied too much within habitats, yet he still judges 'a total
      of at least 5 to 6 million' reasonable. The first clause, that
      basin-wide estimates are model families sharing assumptions, is
      illustrated rather than demonstrated in the ledger. No basin-wide
      census exists, and the regional models carry explicit stacked
      assumptions (E002, E004), but the dependency audit (AMZ-R004) has not
      been done. The strongest opposing consideration is that some families
      (documentary, radiocarbon, house-count) draw on different data, so
      'sharing assumptions' may overstate mutual dependence for some pairs.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E020 quotes the authors directly. Growth over the 1,700 years before
      colonization 'adheres to a logistic model', and populations 'had
      potentially reached carrying capacity (however high)'. The terminal
      decline 'is likely to be an outcome of archaeological sampling biases,
      compounded by demographic decline and dispersal as Europeans enter the
      region'. The claim reports this accurately and marks the attribution
      as the authors'. The strongest opposing consideration is
      methodological: summed distributions are proxies sensitive to research
      intensity, preservation, and calibration (E020 limitation). The proxy
      cannot itself separate a late pre-contact downturn from sampling
      artefact, so the attribution is interpretation, not measurement.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      E008 verifies Newson's Table 1 verbatim: Napo–Aguarico fell from
      49,000–51,000 to 6,000 circa 1700 (87.8–88.2%), and Mainas declined
      62.3–63.6%. It also verifies the mixed causation: epidemics, enslaving
      raids, missionization, service demands culminating in the 1635 revolt,
      and flight from exposed riverine locations. Scoped to region-specific
      reconstructions, the claim is well supported as stated. The strongest
      opposing consideration is that the baselines are themselves
      reconstructions. More decisive for the case than for the claim, these
      are upper-Amazon mission provinces, and carrying their ratios to the
      middle Solimões is extrapolation (E008 limitation).
  - claimId: AMZ-C023
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is attached. The in-ledger basis is the claim's
      anchor quotation from Newson ("'fade outs' were common") and the same
      source's mixed-causation passage recorded for AMZ-C010 (E008), which
      supports 'an interactive process, not a single wave'. The specific
      mechanisms (raids and missions repeatedly reintroducing infection,
      adult mortality heaviest where disease arrived late) are not quoted
      anywhere in the ledger. Epidemiological background, that epidemics
      burn out in small dispersed populations, makes fade-out plausible, but
      that is a prior, not ledger evidence. The strongest opposing
      consideration is scope: the material is early colonial Ecuador, while
      the claim generalizes to 'sparsely settled lowlands'.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E010 verifies the model over 7,363 AmazonArch locations. Distance from
      river is the most important predictor (21.5% of permutation
      importance), and the models separate interfluvial areas 'that were
      more sparsely populated than those close to rivers'. The strongest
      opposing consideration is the record's own limitation: site databases
      inherit survey effort biased toward accessible rivers, which inflates
      exactly this predictor. Moreover, 21.5% is the largest share, not a
      majority. The ledger also documents substantial upland and
      interfluvial occupation (Belterra, E017; Loma Salvatierra, E022), so
      the gradient is a tendency, not a rule, and it is consistent with a
      riverine account like Carvajal's.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      E011 quotes the synthesis verbatim. Regional sequences, 'particularly
      in interfluvial areas', show closed-canopy forest with 'little to no
      evidence' of annual crops, significant clearing, anthropic soils,
      enrichment of favoured trees, or recurrent fires. The claim correctly
      scopes this to 14 cumulative regions and most sampled terra firme, so
      as a report of findings it is well supported. The strongest opposing
      consideration bears on inference, not local truth. The sampling has
      been criticized as thin (AMZ-C021), negatives count only where the
      proxy could detect the activity (E011 limitation), and Upano suggests
      long forest recovery can erase old signals (AMZ-C022). Absence of
      signal is therefore not yet calibrated as absence of people.
  - claimId: AMZ-C020
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached. The verdict rests on the claim's
      anchor and the source record's verification note, which quote 'the
      limited, albeit impressive, predicted extents of earthworks and ADEs'
      and 'other sites dominate more than two thirds of all Amazonia'. The
      claim matches those quotations closely. The strongest opposing
      consideration is that a machine-learning prediction trained on known
      sites inherits their survey bias. The second clause also cuts both
      ways: other site types dominating two thirds of the basin implies
      widespread if less monumental occupation, not an empty matrix.
  - claimId: AMZ-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached. The basis is the claim's anchor and
      the source record's verification note, which give the reply's
      arithmetic: about 300 cores clustered in five small areas, 1.17 m³ 'to
      represent the 2 000 000 km2 of western Amazonia'. As a claim that this
      criticism was formally published, it is supported. The strongest
      opposing consideration is reach. The critique targeted an earlier core
      dataset, and the ledger does not show how far it applies to the later
      14-region synthesis (E011). A published criticism is also not a
      demonstration that the sampled negatives are wrong.
  - claimId: AMZ-C022
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached. The claim's anchor and the source
      record's verification note quote the paper ('A long period of forest
      recovery largely eradicated the influence of Pre-Columbian
      occupations') and record that the Colonial-period signal persisted.
      The strongest opposing consideration is generalization. Upano's main
      occupation ended 300–600 CE, with only some mounds reoccupied 800–1200
      CE (E073, E074), so the erased signal had many centuries to fade.
      Nothing here shows occupations abandoned in the 1600s are equally
      erased; that is what AMZ-R008 would measure. The claim is local to one
      valley and does not by itself impeach terra-firme negatives elsewhere.
  - claimId: AMZ-C029
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached. The basis is the claim's anchor
      quotation from the verified accepted manuscript ('Almost 80% of the
      basin has a 0 to 1% of predicted probability'), with the authors'
      gloss that earth-builders 'may not have occupied all of Amazonia'. The
      regional clause (northwestern, northern, central) appears in no quoted
      passage. The strongest opposing consideration is that the surface is
      fitted to presence-only data with a modelled observability correction.
      The several-fold gap between this model's basin total and the 2026
      regional estimate (E038, E039) raises calibration questions, and low
      earthwork probability does not mean low occupation (AMZ-C020).
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Both halves are supported, and by different research networks. Dense,
      organized occupation at or near contact is documented on the southern
      rim (E004), at Belterra, Cacoal, and the Upper Xingu (E017–E019), and
      on the middle Solimões by sixteenth-century witnesses (E007). A
      lighter matrix is indicated by the river-distance gradient (E010),
      terra-firme negatives (E011), and basin models whose authors concede
      earth-builders 'may not have occupied all of Amazonia' (AMZ-C029). The
      strongest opposing considerations are timing and sampling. Several
      showcase hotspots predate contact (Aquiry AD 100–300, E003; Casarabe
      ending around 1400, E014), and both positives and negatives are
      biased samples, leaving the matrix density unmeasured (AMZ-R003).
      Qualitatively, it is the only pattern consistent with every line in
      the ledger; quantitatively, it remains open.