caseAssessment:
  verdict: well_supported
  loadBearing: [AMZ-C003, AMZ-C002, AMZ-C017, AMZ-C016, AMZ-C013]
  weakestLinks: [AMZ-C005, AMZ-C014, AMZ-C015, AMZ-C065]
  synthesis: >-
    The case's structural claims survive an independent pass. The textual core is solid:
    Carvajal's qualitative social geography is documented in verified scholarship
    (AMZ-C001), the extreme numbers are demonstrably manuscript-branch artifacts rather
    than counts (AMZ-C002, verbatim-verified), and — the single most important fact in
    the ledger — the mundane load-bearing features of his picture (dense settlement, vast
    food stores, long straight roads, renowned ceramics) were independently repeated by
    the 1538 Nunes entry and the ten 1560 Ursúa accounts, witnesses hostile to one another
    and writing for different crowns, none of whom repeats his extreme figures
    (AMZ-C003/E007). The archaeological record independently establishes engineered,
    fortified, contact-era-occupied settlement systems (C004, C006, C007, C011) and,
    symmetrically, genuinely sparse interfluves (C013, C020, C029), which together carry
    the heterogeneity synthesis (C016). Nothing in the ledger contradicts any claim.
    The honest weaknesses are on the negative side: the sparse-matrix evidence (C013,
    C014) rests on samples that inherit river-access survey bias and, per the Upano
    erasure finding (C022), palaeoecological absence is time-graded and can be a false
    negative — so the matrix-density parameter of the mosaic remains an estimate from
    biased samples, exactly as the unperformed AMZ-R003 concedes. The demographic layer
    is deliberately self-undermining and right to be: Denevan's self-rejection (C012) and
    the Aquiry fivefold internal span (C005) show why totals must not be quoted without
    their assumption sets; the SPD carrying-capacity result (C015) is a proxy with stated
    biases. Sensitivity: removing AMZ-E007 (the Nunes/Ursúa corroboration) would be the
    single most damaging cut — the qualitative-credibility claim C017 would fall from
    well_supported to weakly or provisionally supported, resting on Carvajal's text alone
    plus archaeology from other regions, and the case verdict would degrade from
    well_supported to provisionally_supported. The verdict does not hang on one thread
    only because E007 exists; it is the load-bearing record. The collapse-between-visits
    reading for Carvajal's specific reaches remains a well-motivated extrapolation from
    upper-Amazon provinces (C010, C023), not yet a demonstration — which is what
    AMZ-R001 and AMZ-R005 exist to test.
  steelman: >-
    No evidence record in the ledger bears directly on the middle-Amazon floodplain
    reaches Carvajal described at the contact horizon: the sparse-Amazon negatives come
    from terra firme and interfluves, and AMZ-C022 (Bush 2025, Upano) demonstrates that
    forest recovery can largely erase a real pre-Columbian occupation signal while
    AMZ-R008's decay-curve calibration has never been run. Combined with the convergent
    independent testimony of Nunes and the Ursúa accounts on mundane, checkable details,
    a proponent can correctly say that nothing currently in the ledger can falsify a
    densely populated, organized corridor on the middle Amazon in 1542 — and that the
    documented 62–88% collapses in adjacent provinces (AMZ-C010) make a catastrophic
    die-off between visits the parsimonious reading of the later silence.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      The content claim is anchored to Denevan 1996 and Lopes et al. 2024, both fetched
      and checked verbatim, and Denevan's bluff model independently predicts the
      populated/empty alternation Carvajal reports. The opposing consideration is that
      the Medina 1894 text itself was read only once with no second-reader verification
      and the Relación body beyond its introduction is unread in the ledger, so the
      claim rests on verified secondary quotation rather than a twice-verified primary.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      Denevan's branch comparison is quoted verbatim and verified; the asymmetry it
      documents is the strongest single fact in the Carvajal dossier. The opposing
      consideration is that this is one modern scholar's collation, and the ledger's own
      AMZ-R002 synoptic witness table — which would make the comparison independent —
      has not been performed.
  - claimId: AMZ-C074
