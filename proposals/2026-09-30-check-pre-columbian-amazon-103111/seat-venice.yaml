  - claimId: AMZ-C021
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The critique's numbers — roughly 300 cores in five areas, 1.17 m³ for two million
      km² — are verified from the Clement reply itself. The claim is about the existence
      and content of the criticism, which is established; the critic is an interested
      party in that debate, and the critique predates later sampling, so it bears on
      sampling adequacy as an argument, not a measurement.
  - claimId: AMZ-C022
    verdict: well_supported
    confidence: high
    reasoning: >-
      The Bush et al. 2025 erasure finding is quoted verbatim, with the important nuance
      that the Colonial-period signal persisted in the same profiles, showing erasure is
      time-graded rather than absolute. This is the record that most constrains how much
      weight the sparse-Amazon palaeoecological negatives can bear; nothing in the
      ledger opposes it directly.
  - claimId: AMZ-C029
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 0–1% prediction over ~80% of the basin is verbatim-verified from the accepted
      manuscript, including the authors' own hedge that earth-builders 'may not have
      occupied all of Amazonia'. The opposing consideration is that this is a model
      prediction whose calibration has never been ground-truthed — exactly what the
      proposed blind-stratified LiDAR test AMZ-R006 would measure — and the source has
      minor internal inconsistencies in its predicted totals.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Every dependency in the synthesis is individually supported, and the heterogeneity
      picture is the only reading consistent with both the engineered-hotspot record
      (C004, C006, C007, C011) and the sparse-matrix record (C013, C014). The strongest
      opposing consideration is that the matrix-density parameter — the quantity that
      separates 'heterogeneous' from 'mostly full' — is currently estimated from biased
      samples on both sides, with palaeoecological negatives further discounted by the
      Upano erasure finding; AMZ-R003 is the direct measurement and has not been run.