      ledger, is AMZ-C022: at Upano, forest recovery largely erased a real occupation
      signal, so these negatives can be false negatives in long-abandoned areas, and
      AMZ-R008's decay calibration is untested.
  - claimId: AMZ-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 'limited, albeit impressive' finding and the two-thirds dominance of other
      site types are verified from the PMC copy of Walker et al. 2023. The opposing
      consideration is that it is a presence-only ML prediction sharing the survey-bias
