  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Medina's record of Gómara's 'mentirosa' citation is quoted verbatim, but it is a
      quotation of Gómara through Medina, and Gómara's own passage is not in the ledger.
      As stated the claim is only about what Medina records, which the evidence does
      establish; confidence stays moderate for the single-pass verification.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The abstract explicitly says the manuscript 'se puede considerar como una fuente
      digna de confianza' after geographic verification, which is exactly what the claim
      states about Achmatowicz's assessment. The opposing consideration is that only the
      abstract was read, so the route and strength of the argument are unverified, and
      the record was deliberately held to weak weight toward C017.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is carried by the convergent structure: independent corroboration of the
      qualitative picture (C003), documented manuscript instability of the numbers
      (C002), and contact-era occupation demonstrated on the southern rim, at Santarém,
      Marajó, and Upper Xingu. The contemporary endorsements (Oviedo's wounds-and-character
      vouching) were correctly demoted to non-diagnostic context by the ledger's own
      readers. The strongest opposing consideration is that no contact-horizon excavation
      has tested Carvajal's actual reaches (AMZ-R001 unperformed), and the corroborating
      accounts share conquistador-era genre incentives.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      The LiDAR counts and the 183,000 km² delimitation are verbatim-verified from a
      natively fetched Nature paper, and 432 earthworks with 396 new finds is a
      measurement, not a model. The opposing considerations are disclosed: the
      24,000–30,000 total is a block extrapolation, the paper is weeks old with no
      peer-reviewed rebuttal yet, it is founder-funded, and the Peripato comparator
      records show published basin-wide totals disagreeing several-fold.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      The claim is about the paper's own stated sensitivity, and both poles of the
      fivefold span are quoted verbatim from the fetched text — the headline model and
      the authors' own 'very unlikely' single-family alternative. No outside knowledge is
      needed; the opposing consideration is only that the case's framing emphasis is
      editorial, which the record itself flags.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 1,800 km fortified-village finding and its AD 1250–1500 dating are quoted
      verbatim from the fetched paper. The claim itself flags the population estimate's
      dependency on contemporaneity, ethnographic formulae, and MaxEnt projection, and
      the source statement confirms those are the authors' own stated assumptions — so
      the claim as worded is exactly as strong as its evidence.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Belterra and Cacoal rest on strong primary reports with verbatim dating into the
      seventeenth century. The Upper Xingu leg is held at journalism weight pending
      primary reports, which is why confidence is moderate rather than high; nothing in
      the ledger opposes the occupancy chronology itself.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lombardo et al. 2025 was fetched and the abstract verified: 178 phytolith samples
      across 18 profiles showing ubiquitous maize, with documented drainage canals and
      farm ponds. The strongest opposing consideration is chronological: Casarabe
      florescence ends around 1400 CE, so this proves engineered intensive agriculture
      but not the world of 1542.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Levis 2017 association is verbatim-verified and corroborated by Peripato 2023,
      though that corroboration shares a species list and overlapping authors and so is
      not independent. The strongest opposing consideration is the McMichael 2017
      Technical Comment: post-Columbian management may explain the floristic pattern,
      which qualifies the pre-Columbian interpretation though not the observed
      association the claim asserts.
  - claimId: AMZ-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The Bermeo dating is strong and directly supports intermittent construction tied
      to flood events. The claim is stated for the Llanos de Mojos generally, but the
      evidence is one complex, and the record itself flags that other complexes may
      differ; Lombardo 2011's 'no alternatives' framing is consistent but interpretive.
  - claimId: AMZ-C019
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The geometry is documented measurement: zigzag weirs, straight causeways, and 382
      ponds overwhelmingly within 35 m of a feature. But the functional reading is the
      authors' own postulate ('we postulate that the principal function...'), so the
      claim's final clause asserts more than the evidence establishes; the spatial
      association is solid, the function inferred.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 17,000+ fish remains and the year-round interfluvial exploitation finding are
      verbatim-verified from the fetched PLOS ONE paper. The paper's own caveat — paucity
      of large riverine fish suggesting infrequent exogenous contributions — is a scope
      note, not a challenge to the year-round finding.
  - claimId: AMZ-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Denevan's self-rejection is quoted verbatim and marked decisive, and it is the
      cleanest documented instance of an estimate surviving its own argument's failure.
      The claim generalizes to 'published estimates' as model families, which the
      ledger's variety (habitat-density, LiDAR house-count, SPD proxy) supports, but the
      generalization is the assessor's structure, not a single measured fact.
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim accurately reports what Arroyo-Kalin & Riris found and, importantly,
      attributes the terminal decline to sampling bias plus collapse rather than
      endogenous crash. The opposing consideration is inherent to the method: summed
      radiocarbon distributions are proxies with taphonomic and sampling biases the
      authors themselves state, so the logistic-fit result is an aggregate suggestion,
      not a demographic measurement.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Newson's Table 1 figures and the mixed-mechanisms passages were checked verbatim
      against the fetched source. The claim is honestly scoped to region-specific
      reconstructions; the opposing consideration is that these are upper-Amazon
      mission-record provinces, and extension of the ratios to the middle and lower
      Amazon — where the dispute actually lives — remains the unperformed AMZ-R005.
  - claimId: AMZ-C023
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 'fade outs' quote and the interactive-mechanism reading are verified from
      Newson 2003. The claim is a mechanism claim from documentary reconstruction rather
      than a measurement; its force depends on the same upper-Amazon documentary base as
      C010, so it inherits that geographic caveat.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 7,363-site model and the 21.5% permutation importance for river distance are
      verbatim-verified. The strongest opposing consideration is the record's own stated
      limitation: site databases inherit survey-effort bias toward accessible riverine
      areas, which could partly manufacture the very river-distance signal the model
      reports; the paper also contains no sentence disclaiming that distant forests were
      empty.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated — a report of what the cumulative studies found in most sampled
      terra-firme settings — the claim is verbatim-verified and honest about its own
