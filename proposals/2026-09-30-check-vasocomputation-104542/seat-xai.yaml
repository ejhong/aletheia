caseAssessment:
  verdict: mixed
  loadBearing: [VASO-C010, VASO-C013, VASO-C005, VASO-C030, VASO-C020]
  weakestLinks: [VASO-C021, VASO-C022, VASO-C073, VASO-C039, VASO-C174]
  synthesis: >-
    The featured hypothesis stacks established smooth-muscle physiology and autonomic levers under a contested musculoskeletal construct and then leaps to untested vascular memory and contemplative identity. Latch-bridge force maintenance at low energetic cost (C010) is textbook and strongly evidenced by kinetic models; slow extended exhalation shifts global autonomic balance parasympathetically (C013) is likewise well-supported by systematic review. Active tender sites show measurable local differences in biochemistry, stiffness area on elastography, and some Doppler indices versus latent or palpably normal sites within the same symptomatic muscle (C005, C031, C032, C182, C187), though the differences are graded, classifiers are imperfect, vessels imaged are conduit-scale rather than micro, and all comparisons lack pain-free controls. Manual trigger-point identification lacks reliability and a reference standard, and the classic construct is contested (C030). Spontaneous millimeter-scale EMG activity is more prevalent at tender nidi than adjacent non-tender sites (C002) and can rise selectively under pure cognitive stress (C003), yet the same activity occurs at non-tender endplate-zone sites, so exclusivity fails and the generator remains skeletal-endplate or spindle rather than vascular. Felt seconds-scale release under pressure-plus-exhale is only first-person testimony (C004); the conditional that such speed implies state-not-structure (C011) is logically sound but rests on an unmeasured premise. Fascial densification reversibility (C077), pressure-alone insufficiency (C039), blood-first ordering (C073), composite three-element hold (C174), site-selective sympathetic write as blushing (C143), and contemplative-map identity (C022) lack non-proponent primary measurements. Hemo-neural modulation exists in weak form (C012) via demonstrated mechanosensitive channel effects of pressure pulsations, yet storage of content-specific predictions or tanha (C021) has no write–store–read demonstration and is undermined by the absence of latch energetics or dephosphorylated hold in the pressurized skeletal-muscle arterioles the hypothesis requires. The central identification of knots as latched microvascular smooth muscle producing ischemia plus secondary guarding (C020) therefore inherits real lower-rung physiology and real local abnormalities but supplies no direct observation of latch, of smooth-muscle identity, or of seconds-scale objective release at a tender point; critical audits grade both linchpins D. Sensitivity is high to the critical-report absence-of-evidence matrix and the arteriole audit: without them the vascular attribution would look merely untested rather than mismatched. Overall the case is mixed—lower mechanism and observation rungs hold or are provisionally supported, the construct is methodologically fragile, and the synthesis/attribution rungs remain unresolved or weakly supported. State-not-scar is more plausible than pure scar, yet the specific vascular-autonomic latch-and-mind implementation is an extrapolation that the ledger's own studies have begun to constrain rather than confirm.
  steelman: >-
    Consistent multi-practitioner first-person reports of discrete, exquisitely tender points that release under sustained pressure timed to a long exhale within seconds, accompanied by local warmth or paresthesia and sometimes cascading regional softening, remain unexplained by scar or simple endplate noise and predict a low-energy, history-dependent, autonomically gated hold that no completed imaging study has yet directly tested or falsified.
claimAssessments:
  - claimId: VASO-C021
    verdict: unresolved
    confidence: high
    reasoning: >-
      Johnson’s three hypotheses and the essay’s tanha mapping are theoretical statements (E013, E038) with no experimental write–store–read loop in mammalian tissue. E017 correctly notes that latch hysteresis is not yet content-addressable memory and that the nearest genuine flow-network memory is Physarum. Salameh 2024 (E005) supplies only instantaneous mechanical modulation, not storage. Strongest opposing consideration is that the weak hemo-neural form is now plausible while the strong cognitive form has zero direct tests.
  - claimId: VASO-C020
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Lower components (latch capability, local ischemia-compatible biochemistry and flow abnormalities, secondary guarding) are real, yet E016 grades both linchpins—objective seconds-scale release and smooth-muscle identity—as D (no direct evidence). E019–E020 show no energetic latch measurement in any arteriole and maintained phosphorylation rather than dephosphorylated hold in pressurized skeletal-muscle arterioles. E027’s Doppler findings are compatible with contracture compression equally. Strongest opposing consideration is that the state-not-scar reading survives even if the specific vascular latch fails.
  - claimId: VASO-C174
    verdict: unresolved
    confidence: high
    reasoning: >-
      The three-element (tone + hyaluronan collar + fascial tether) composite is an essay conjecture (E044 lineage) offered as an alternative to pure latch; no primary measurement of simultaneous hysteresis in all three at a tender point exists. Strongest opposing consideration is that multi-timescale hysteresis is physiologically plausible a priori but currently untested.
  - claimId: VASO-C022
    verdict: unresolved
    confidence: high
    reasoning: >-
      Only an uncited essay assertion that traditional maps cluster on midline/limbs (E039) and secondary restatements of acupoint–perforator coincidence; no blinded coding against chance or modern vascular maps has been run (R006 unexecuted). Strongest opposing consideration is that trained interoception could in principle map real physiology, yet resemblance alone is pattern-matching.
  - claimId: VASO-C010
    verdict: established
    confidence: high
    reasoning: >-
      Hai & Murphy 1988 kinetic model (E003) reproduces high sustained stress at low phosphorylation and is textbook. E021 qualifies that latch is not generic (present in femoral, absent one branch order later) and has never been followed into arterioles, yet the capability itself is demonstrated. Strongest opposing consideration is vessel-type and caliber dependence, which limits extrapolation but does not erase the phenomenon.
  - claimId: VASO-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The conditional logic is sound: remodeling timescales are days–weeks while a seconds-scale objective local change would imply state. E035 states the argument; E014 supplies only felt phenomenology; E030 shows imaged change after needling over visits, not seconds. Strongest opposing consideration is that the antecedent (objective seconds-scale release) remains unmeasured, so the claim is provisionally true as inference but unanchored.
  - claimId: VASO-C077
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Essay assertion only; no primary Stecco or hyaluronan-viscosity timescale data under load appear in the ledger. Strongest opposing consideration is that reversible densification is a live non-vascular competitor for state-not-structure if its reversal window matches the phenomenology.
  - claimId: VASO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Moore & Cao 2008 is the hypothesis paper (E004). Salameh 2024 (E005) supplies direct causal evidence that physiological pressure pulsations modulate central neurons via mechanosensitive channels on rapid timescales. Strongest opposing consideration is that the demonstration is central, instantaneous, and non-storage; peripheral tender-point readout remains unshown.
  - claimId: VASO-C013
    verdict: established
    confidence: high
    reasoning: >-
      Zaccaro 2018 systematic review (E009) documents reproducible rises in RSA/HRV and related autonomic/CNS shifts with slow breathing. E036 is derivative. Strongest opposing consideration is that the shift is global cardiovascular; local tissue or tender-point unlatching is an added, untested claim.
  - claimId: VASO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lucas 2009 systematic review (E011) concludes manual examination lacks demonstrated reliability and validity without a reference standard. Quintner 2015 (E010) argues circularity and offers neurogenic alternatives; Dommerholt rebuttal keeps the debate open but does not restore reliability. Proponent papers themselves concede subjectivity (E029, E078–E079). Strongest opposing consideration is that instrumented localization may escape the palpation problem.
  - claimId: VASO-C190
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Clinical and imaging studies routinely locate discrete tender or stiff foci (Ballyns, Landfald, Shah lineages); Croft 1994 shows examiner-elicited tender points even in some no-pain subjects. E012 (provisional, treated absent) and reliability critiques soften ontological status, yet the bare occurrence of palpable tender points is the working premise of the entire literature. Strongest opposing consideration is poor inter-examiner reliability and absence of a validated reference standard.
  - claimId: VASO-C191
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Essay second-hand medians and “nearly universal” claims (E015 provisional/absent); Ballyns introduction cites a 1986 clinic prevalence for myofascial pain syndrome, not a general-population knot census (E108). Croft is pain-selected. No true census exists. Strongest opposing consideration is that community tender-point surveys exist but measure fixed-site tenderness, not free-palpated knot burden.
  - claimId: VASO-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Hubbard & Berkoff 1993 (E001) found sustained spontaneous activity in the 1–2 mm nidus of all TPs and none in adjacent non-tender fibers. Simons 2002 (E031) shows endplate noise also at 4/11 non-tender endplate-zone sites and never off-zone, so the signature tracks endplate zone first and TP second; exclusivity fails. Strongest opposing consideration is that the generator is conventional skeletal (endplate potentials) rather than vascular or spindle.
  - claimId: VASO-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      McNulty 1994 (E002) showed mental arithmetic raised EMG at TP sites while adjacent controls stayed quiet (n=14, same lineage). No modern replication with matched endplate-zone controls or vascular endpoints. Strongest opposing consideration is that sympathetic drive to endplates or spindles fits without any vascular storage element.
  - claimId: VASO-C143
    verdict: unresolved
    confidence: high
    reasoning: >-
      Essay conjecture equating the stressor-induced EMG rise with regional cutaneous vasoconstriction analogous to blushing; no simultaneous skin-perfusion measurement under the stressor appears. Strongest opposing consideration is that a localized perfusion drop would be a strong positive if shown, yet remains untested.
  - claimId: VASO-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Sole support is first-person/practitioner testimony in the proponent essay (E014); no synchronized elastography/Doppler/button-press study exists (E016). Landfald pressure-only protocol clears many points over minutes without breath instruction (context only). Strongest opposing consideration is widespread practitioner lore consistency, which still cannot exclude expectation or attention effects.
  - claimId: VASO-C039
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Essay asserts pressure locates but does not release (E014). Landfald 2025 applied compression with no breathing instruction or recording and eliminated 60–86 % of points sonographically (E067 context; outcomes on other claims). Absence of breath instruction is not proof breath is required. Strongest opposing consideration is that a proper factorial (pressure ± instructed exhale vs inhale-hold) has never been run.
  - claimId: VASO-C073
    verdict: presently_untestable
    confidence: high
    reasoning: >-
      Essay prediction of blood-first, stiffness-second ordering; no time-resolved co-registered Doppler/elastography of a release event exists. Strongest opposing consideration is that the ordering is the latch-specific signature the keystone experiment (R001) is designed to test.
  - claimId: VASO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Shah microdialysis shows elevated acidic pain mediators (E006); Ballyns vibration elastography and Doppler show larger stiff areas and higher pulsatility/retrograde flow at active sites (E022, E087–E099 series); Mazza review summarizes quantifiable imaging differences (E007). Differences are graded, RI null, classifiers imperfect, no pain-free controls, shared NIH lineage. Strongest opposing consideration is that measurable difference does not identify the tissue element (fiber, fascia, vessel, or guard).
  - claimId: VASO-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Mizrachi 2026 preregistered within-subject histamine-prick experiments (E008) show ~1.5-fold smaller/faster-resolving wheal-flare under attention-toward versus distraction, without arousal confounds, via sensory and vagal routes. Strongest opposing consideration is acute healthy-skin model over tens of minutes, not seconds-scale latch or tender-point tissue; authors note skin lacks direct parasympathetic innervation.
  - claimId: VASO-C031
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 directly reports significantly higher pulsatility index near active upper-trapezius TPs versus normal sites in the same muscle (E022). Limitations: within-patient symptomatic cohort, large variance, conduit-scale vessels 1–2 cm away. Strongest opposing consideration is that PI did not classify individual sites well and mechanical compression is an equal alternative explanation.
  - claimId: VASO-C032
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns 2011 reports retrograde diastolic flow at 31 % of palpably normal sites (versus 55 % active, 40 % latent) with significant elevation at active/latent versus normal (E022). The 31 % figure itself shows the signature is a gradient, not a binary marker. Strongest opposing consideration is spillover within symptomatic muscle and absence of pain-free controls.
  - claimId: VASO-C182
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns abstract/results state active-site mean stiff area 0.57 ± 0.20 cm² versus latent 0.36 ± 0.16 cm² (E087, E089). Sonographers blinded to clinical status. Strongest opposing consideration is palpation-preselected sites and single-frequency vibration method without confirmed shear elasticity.
  - claimId: VASO-C187
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Ballyns reports palpably normal-site mean area 0.17 ± 0.22 cm² (E090). Part of the same graded active > latent > normal ordering. Strongest opposing consideration is that “normal” sites still lie in symptomatic muscle at least 5 cm from TPs and may not represent true pain-free baseline.