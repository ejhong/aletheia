caseAssessment:
  verdict: weakly_supported
  loadBearing: [GEO-C021, GEO-C020, GEO-C918, GEO-C030]
  weakestLinks: [GEO-C913, GEO-C580, GEO-C012]
  synthesis: >-
    The featured hypothesis comes down to one existential claim, GEO-C022: at least one major megalithic monument contains cast stone. The ledger carries it through two attribution branches. One is Great Pyramid limestone (GEO-C020). The other is Pumapunku andesite and sandstone (GEO-C021). A third record is filed under the Great Pyramid but actually concerns Snefru's Bent Pyramid (GEO-E017).

    The mechanism rung can at most show that casting was possible, and even there the record is thin. The natron sources are real (GEO-C011), and the temperatures are plausible on background knowledge (GEO-C010). But no block made from demonstrably ancient inputs has been independently analysed (GEO-C012), and the Andean chemistry is asserted rather than shown (GEO-C580). The verdict is therefore decided at the attribution rung.

    The Great Pyramid branch is the only one tested against natural baselines and a positive control, and it fails. Barsoum 2006 (GEO-E012) is genuine non-proponent laboratory support, but it has four weaknesses:
    its samples' origin is disputed; its natural baseline was six quarries; its authors concede nature could have produced every feature; and Jana (GEO-E020) found the highlighted Si-rich spheres in natural Tura limestone. Jana also showed that a real geopolymer's binder carries Na+K and Al enrichment that no casing stone shares. Freestone & Middleton (GEO-E021) and Folk & Campbell (GEO-E018) add textural and sedimentary evidence that does not depend on binder chemistry.

    The salt line collapses on inspection. The al-Maʾmūn report has no traceable source (GEO-C003). Halite is reported native to the Giza strata and effloresces on the carved Sphinx (GEO-C506, GEO-C906). The chamber surfaces were restored without records (GEO-C594). GEO-C030 is right in its narrow form, but it neutralises provenance evidence (GEO-E008, GEO-E009), not petrography.

    What survives is thin:
    one Bent Pyramid casing stone read by NMR against two quarry comparators;
    the originating team's andesite fragment, with no natural control and only an appearance-based link to the monument (GEO-C913);
    and the same team's sandstone slab sample.
    These are unrebutted measurements, so the verdict is weakly_supported rather than unresolved. They are unreplicated, minimally controlled and partly provenance-insecure, so it is not provisionally_supported. No negative record reaches them, so it is not contradicted. The tests that would move this verdict are specified and unrun: a provenance-secure fragment against a Khapia control (GEO-R016), blinded NMR with aged C–S–H controls (GEO-R017), and a broad-suite sandstone re-analysis (GEO-R019).

    Steelman against: every proponent anomaly here that has been re-examined against a natural baseline or positive control has dissolved. Barsoum's spheres turned out to be natural opal-CT, the Lauer phosphorus a surface coating, and the salt sedimentary halite. The survivors share the same defect of thin or absent baselines, so this track record argues for discounting them toward nothing. The Aswan lines bear on how granite was worked, not on casting. GEO-C001's slow rate argues only against pounding alone, GEO-C002's null result is expected at that rate, GEO-C006 is unmeasured, and Kelany's local tool quarries cut against GEO-C511.

    Steelman for: no study has tested for the revised C–S–H binder with a positive control. The interior carbon- and nitrogen-bearing matter beneath plagioclase (GEO-C918) is not explained by surface dirt. And a provenance match cannot see a same-quarry aggregate.

    Some verdicts lean on background knowledge rather than records: instrument physics for GEO-C030, Egyptian pyrotechnology for GEO-C010, and the ordinariness of glassy and secondary organic phases in weathered volcanic rock for GEO-C021. The claim entries say so.

    Sensitivity: GEO-E017 is the record whose removal would most change this verdict. It is the only positive on monument stone that involves laboratories beyond the Davidovits group, uses any natural comparison set, and falls outside every negative study's scope. Without it the verdict survives, but only nominally: it would rest entirely on the originating team's uncontrolled Pumapunku work and sit on the boundary with unresolved. GEO-E020 is the record on which the Great Pyramid branch's contradicted verdict most depends.
  steelman: >-
    MacKenzie et al. 2011 (GEO-E017) used ²⁹Si, ²⁷Al and ⁴³Ca MAS NMR on an outer casing stone from Snefru's Bent Pyramid. They found it differs from two local quarry limestones in a way they read as Tura grains bound by an amorphous calcium-silicate-hydrate gel. Nothing in this ledger answers it. Every negative petrographic study here predates it and examined other stones. The one study with a positive control (Jana, GEO-E020) searched only for the alkali-aluminosilicate signature of a Davidovits geopolymer, binder Na+K and Al enrichment. A lime–diatomite C–S–H binder, chemically feasible per GEO-E022, would not carry that signature. Barsoum's hydrated Ca–Mg phases "not known to hydrate in nature" (GEO-E012) are not matched in natural stone by any record either. A proponent can rightly say the binder the hypothesis now proposes has never been sought by a study designed to find it absent. The specified test has not been run: blinded NMR of provenance-secure casing stone against a broad stratified Tura/Dahshur/Giza natural suite, with aged C–S–H positive controls (GEO-R017).
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      An existential claim needs one sound instance, and the ledger has none that is replicated, adequately controlled and provenance-secure. The best-tested candidate, Great Pyramid casing stone, goes against (GEO-C020). What remains positive is one Bent Pyramid casing stone read by NMR as Tura grains in a calcium-silicate gel against two quarry comparators (GEO-E017, filed under GEO-C020 but bearing here), plus the Davidovits group's Pumapunku analyses, whose organic-matter finding rests on one loose andesite fragment and whose sandstone result rests on one slab sample (GEO-C021). GEO-E009 bears only on Stonehenge, for which the ledger holds no positive casting evidence, and like GEO-E008 its force against casting is capped by the narrow methods point in GEO-C030. Strongest opposing consideration: every proponent anomaly here re-examined against a natural baseline or positive control has dissolved, which argues for discounting the untested survivors toward nothing; general background (a prior, not a ledger record) also holds that amorphous, siliceous and organic phases in limestone and weathered volcanic rock are routinely natural.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only laboratory support, Barsoum et al. 2006 (GEO-E012), rests on samples whose origin Egypt's Supreme Council of Antiquities disputes, a six-quarry baseline, and the authors' own concession that nature could have produced every feature; Jana's positive-controlled comparison (GEO-E020) then found the highlighted Si-rich spheres in natural Tura limestone as well as casing stone, and no casing sample showed the binder Na+K and Al enrichment of real geopolymeric limestone. Freestone & Middleton (GEO-E021) found a British Museum Cheops casing fragment natural, with no air bubbles or reaggregated texture. Folk & Campbell (GEO-E018) report bedding, burrows, fragile fossils and block-confined tectonic fractures in situ — petrographic evidence untouched by GEO-C030's provenance critique. GEO-E017 concerns Snefru's Bent Pyramid, not Khufu's, and gives this claim no direct support; the salt line (GEO-E004, GEO-E026) is answered under GEO-C506 and GEO-C003. Strongest opposing consideration: "some blocks" is existential and sampling is thin (single fragments, a Lauer sample whose identity is genuinely disputed, nothing systematic on backing blocks or top courses), Jana's binder test targets the alkali recipe rather than the C–S–H binder later proposed, and Barsoum's hydrated Ca–Mg phases are not specifically answered by any record.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      All support comes from the hypothesis's originating group (GEO-E006, GEO-E007, GEO-E058; GEO-E036 is self-citation and GEO-E062 is unmeasured morphology): interior carbon- and nitrogen-bearing amorphous matter in one andesite fragment, and SEM/petrography of one sandstone slab sample. GEO-E006's statement describes andesite under a sandstone title, so the ledger never actually states the sandstone findings. The andesite fragment was chosen by appearance from loose debris (GEO-C913) and compared with no natural andesite (GEO-E060). It was characterised by EDS only, the authors cannot say whether its organic matter is binder or unreacted guano (GEO-E059), and the radiocarbon date announced in 2019 has not surfaced (GEO-E066). Ponce 1971's natural-quarry attribution of the sandstones (GEO-E008) fits carving but cannot separate carving from casting with same-quarry material, and the proponents' own model also sources the andesite at Khapia (GEO-C903); I rate the claim weakly supported only because these are unrebutted measurements of something fresh igneous rock should not contain. Strongest opposing consideration: amorphous pockets in Tiwanaku andesite were recorded in 1892 by observers with no stake (GEO-E061), consistent with ordinary volcanic glass, and a fragment lying on soil for centuries has an obvious organic-infiltration route that no one has tested against.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      As a claim about what the literature reports, this is secure: the Ceramics International paper is titled for organic matter in andesite with SEM and petrographic evidence (GEO-E007), and the authors' fuller self-published account, read directly, describes the organic phase, its interior occurrence and their reading of it as an organo-mineral binder (GEO-E058). Its local truth says nothing about the stone's origin, because the same account concedes that no geological andesite was compared (GEO-E060), that nitrogen is only semi-quantitative (GEO-E059), and that the sample is a loose fragment (GEO-E057). Strongest opposing consideration: GEO-E006 is internally inconsistent (sandstone title, andesite statement), so the ledger's "microstructural features" in andesite partly rest on a muddled record — though the Ceramics International paper and the 2019 report carry the claim without it.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: high
    reasoning: >-
      The analysts' own account states that the andesite fragments "are outside the protected monument area" and that samples were obtained by choosing debris with the characteristic flat surface. It records that PP1 A and B came from the fresh break of a fragment on the ground, with no object number, excavation context or refit (GEO-E057). A sampler's own description of how they sampled is the best available evidence on the point, and the interior finding (GEO-C918) is on PP1. Strongest opposing consideration: the peer-reviewed Ceramics International description was not read and could add context, and lying outside the protected area does not exclude an architectural origin — but the claim says only that no identified block was sampled, which the record supports.
  - claimId: GEO-C918
    verdict: established
    confidence: high
    reasoning: >-
      The 2019 account reports cutting PP1C from the interior of PP1A specifically to meet a surface-contamination objection. It reports several interior spots with the same EDS spectrum (C, N, Na, Mg, Al, Si, P, S, Cl, K, Ca), including a dark sheet beneath two plagioclase crystals (GEO-E058). The claim is framed as what the analysts report, and that is documented in their words. Strongest opposing consideration: the same report limits what the observation can mean. Nitrogen cannot be quantified with their EDS (GEO-E059), no molecular identification was made, there is no natural andesite control (GEO-E060), and the fragment's attribution to the monument is by appearance (GEO-C913), so an accurate report still says little about origin.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      The 2020 abstract states every element of the claim: natural volcanic andesite sand from Cerro Khapia, transported and stored at Iwawe in Isbell & Burkholder's Stratum V, no crushing required, and "They did not use the many quadrangular volcanic blocks", the piedras cansadas (GEO-E035). As a description of the model in its authors' own words it is established. Strongest opposing consideration: only the abstract was read (the PDF returned 403), so the body could qualify these statements, and an accurate description says nothing about whether Stratum V really is a natural andesite sand (GEO-R009, GEO-R015).
  - claimId: GEO-C580
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The only records are the proponents' own. They state that acids disaggregate limestone but not andesite, and that earlier attempts softened limestone without re-hardening it. They also state that the acid-medium guano method was "successfully replicated in our laboratory with modern chemicals", but give no recipe, data or product characterisation (GEO-E064), and they cannot say whether the monument organic matter is binder or unreacted guano (GEO-E059). No hardness, durability or ancient-input test appears in the ledger, and the cited 1982 work is not entered as evidence. I read GEO-E064 as qualifying rather than supporting, agreeing with the recorded dissent: its reported success used modern reagents, and its stated failure concerns exactly the re-hardening step. Strongest consideration against leaving it open: acid–base and ammonium/phosphate cementation are plausible on general background and the recipe is cheap to test, but plausibility is not a demonstration of durable stone from pre-industrial inputs.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      For PXRF and ICP-MS/AES the core point follows from what the instruments measure. They do not quantify H, C or O, and an immobile-element fingerprint of stone cast from same-quarry aggregate would largely track the aggregate. This verdict leans on analytical-chemistry background, not on an empirical blind test, which the ledger lacks. A critic concedes the key premise: Jana notes a binder near 5 wt% might not register in bulk chemistry (GEO-E020), and at Pumapunku both parties now source the andesite at Khapia, so provenance cannot separate them (GEO-E035); Nash 2020's strong match (GEO-E009) corrects Fóti's "statistical correlation" framing but leaves the narrow logic untouched. Strongest opposing consideration: the claim overreaches by listing XRD, which identifies crystalline phases and was used by Folk & Campbell to look for zeolitic binder; a binder adding measured elements (Na, K, Al, P) could shift a fingerprint; and none of it reaches the binder-aware petrography of GEO-E018 to GEO-E021, as Fóti himself concedes (GEO-E024).
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Direct evidence is thin. There is a self-reported multi-ton demonstration block with no published independent analysis (GEO-E013). There is also a laboratory result that lime, diatomaceous earth and water form a C–S–H cement at room temperature (GEO-E022), which shows a binder route but not large, hard, natural-looking blocks. GEO-E012 cannot support feasibility without assuming its own conclusion. Jana's positive control (GEO-E020) confirms that Davidovits-made geopolymeric limestone exists, but also shows it is distinguishable from natural stone by microscopy and microanalysis, and the ancient availability of its recipe is not documented. On general background, lime-bound artificial stone is chemically unremarkable, so the claim is plausible, and that prior rather than the ledger supplies most of my credence; strongest opposing consideration: no hardness, durability or visual-match measurement of any block made from demonstrably ancient inputs appears in the record.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The ledger's only record is Fóti's appeal to Badari-period glassmaking (GEO-E016), and its dating and temperature basis are themselves flagged as unverified. My verdict leans on general archaeometallurgical background rather than on the evidence records. Charcoal fires driven by blowpipes or bellows routinely exceed 850 °C, as early Egyptian faience and copper working imply. Strongest opposing consideration: reaching a temperature in a crucible or small hearth is not sustaining it over the volumes casting would need. So even a true claim leaves untouched the fuel and scale question, which is the one that matters for the hypothesis.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Shortland et al. 2006 is a mainstream peer-reviewed study. It identifies Wadi el Natrun and al-Barnuj as the primary ancient Egyptian natron sources for the vitreous-materials industry, and documents natron's replacement by plant ash in the 7th–9th centuries AD (GEO-E010). Sayre & Smith's dual-oxide typology is what makes such a timeline readable (GEO-E011). Strongest opposing considerations: the paper concerns glass and faience, so "industrial-scale" is shown for the glass trade rather than the Old Kingdom. It also treats the reasons for decline as a question, so "supply declining" turns a debated cause into a fact. Even fully true, the claim shows that the ingredient was available, not that it was used in stone.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The sole record is an unattributed anecdote of rock-like material forming in a long-used fire pit, which the project's own skeptical review flagged as under-sourced (GEO-E015). No controlled replication exists, though GEO-R007 proposes one. On general background, wetted wood ash carbonates into cemented calcite crusts, so a modest version is chemically plausible. Whether that yields hardened stone rather than friable crust is exactly what is untested. Strongest consideration against leaving it open: the chemistry is ordinary enough that a weak positive is likely. Strongest consideration against the claim: the discovery-pathway clause is a narrative whose success would not show that casting occurred.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 216 cm³/h at 85 strikes per minute figure was checked against the peer-reviewed Marčiš et al. 2023 paper (GEO-E001), as was the authors' conclusion against dolerite pounders as the sole method. The Engelbach context record (GEO-E002) has been rejected and plays no part here. The claim reports a measurement, and the measurement is documented. Strongest opposing consideration: this is one team, one granite and one tool configuration, unreplicated, and practiced crews with maintained tools may do substantially better (GEO-R002). So the number is not the ancient rate, and even a low rate implies supplementary techniques, not casting.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only record is Fóti's report that visitors striking the designated test block with original pounders have produced no documented scoop mark (GEO-E003). The number and duration of attempts and the block's wear are unquantified and unsurveyed. As a report of absence it is plausible and uncontradicted, which earns weak support. Strongest opposing consideration: the null result is expected under the conventional account. At the measured rate of about 216 cm³/h (GEO-C001), even a hypothetical two-litre depression would take roughly nine hours of continuous pounding, which casual visitor strikes never approach, so the observation does not discriminate.
  - claimId: GEO-C006
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The claim rests on Fóti's description alone (GEO-E005). The shafts' plan dimensions are neither reported nor independently surveyed, and no biomechanical test of strike delivery exists. Without width, wall profile and floor form, "too narrow" is an unmeasured judgement, and a cheap survey would settle it (GEO-R013). Strongest opposing consideration: a shaft deepened from the top is worked by someone standing in it as it descends. The conventional reading of such holes as prospecting shafts, noted in the agenda though not entered as evidence, is a function the claim does not engage.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      No record supports a non-pounding function; the claim rests on the proponent's interpretation. Kelany et al. 2009 (GEO-E045) place the pounders' dolerite in dykes within the Aswan granitoids. They identify Pharaonic tool-production trenches with pounder-sized blanks near the Unfinished Obelisk and describe boulders worked with such pounders, which undercuts the "transported to Aswan" premise and fits quarrying use. Marčiš et al. show that dolerite pounders do remove granite, if slowly (GEO-E001). Strongest opposing consideration: none of this tests what the pounders actually struck, since Kelany's wear description is qualitative, Engelbach's contrary sourcing opinion is unresolved, and the microwear comparison GEO-C537 proposes has not been run, so confidence is low.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The ledger's only carrier of the salt report is a proponent web page that names no author, work or manuscript and dates the event to 820 (GEO-E004, GEO-E029). Nemoy's note puts al-Maʾmūn's Egyptian stay in 217/832 (GEO-E028). Al-Suyūṭī's compilation gives the breach twice in circumstantial detail (fire, vinegar, iron tools, catapults, the wall's thickness, the finds) plus a third mention, and none mentions salt or any coating (GEO-E027). I read GEO-E027's "undermines" as correct; the recorded dissent appears to confuse the compilation's contents with the claim's. Strongest opposing consideration: this is absence from one fifteenth-century compilation, and al-Maqrīzī's full Khiṭaṭ chapter, ʿAbd al-Laṭīf al-Baghdādī and the Arabic extracts in Vyse remain unread (GEO-R001), so a primary source could still surface.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The presence half is now measured: halite is the main efflorescence phase on the Queen's Chamber limestone (GEO-E030). The comparative half, which carries the claim, is cut against. Halite efflorescence is documented at rock-cut tombs and at the Sphinx, which is carved from Giza bedrock and claimed by no one to be cast (GEO-E031). Halite is reported as an original constituent of Giza nummulitic limestone, with Na and Cl in visually unaffected stone (GEO-E032, GEO-C906), and the proponents' comparator, European cathedrals, is the wrong lithology and setting (GEO-E026, GEO-E029). The interior's 1990s cleaning went unrecorded (GEO-E034), so any historical surface baseline is unknown; strongest opposing consideration: no one has compared concentrations, the site comparisons are a second-hand literature summary, and the bedrock statement is cited rather than read, so a quantitative anomaly is not excluded (GEO-R010).
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      Sessa et al. 2026 report that XRD of seven samples "confirmed the presence of only halite, calcite, and quartz". They also report that targeted SEM-EDX of the white efflorescence detected only Na and Cl, with no nitrates and no evidence of widespread gypsum formation (GEO-E030). The claim accurately describes a peer-reviewed, open-access result that was read directly. Strongest opposing consideration: phases below the stated XRD detection limit (<5 wt%) could be missed, sampling was confined to efflorescence and detached fragments, and SEM-EDX gives elements rather than phases. The same paper's XRF also found a localised sulfur-rich restoration fill (GEO-E034), which is consistent with "no widespread gypsum crusts" but shows these surfaces are not pristine.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The attribution is accurate. Sessa et al. cite Klemm & Klemm for halite within the stratigraphic layers of the Giza nummulitic limestone, "likely precipitated from evaporating marine or lagoonal waters", report Hemeda & Sonbol listing halite in Khufu backing blocks, and themselves found Na and Cl in visually unaffected detached material (GEO-E032). I treat GEO-E032 as supporting this claim: its "undermines" tag fits GEO-C506 but not this claim, as the recorded dissent says. Two cautions keep it provisional: the geological statement is second-hand (Klemm & Klemm unread), and detached pyramid fragments would contain NaCl under either origin; the source also calls halite the "primary salt", so "primary constituent" must be read as original rather than major, since calcite dominates. Strongest opposing consideration: no unworked bedrock or quarry face has been sampled in the ledger (GEO-R010).
  - claimId: GEO-C594
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The ledger documents one strong instance at the case's most-cited monument. Records of the 1995–97 interior interventions at Khufu are not available, a sulfur-rich fill sits on the walls, and extensive efflorescence re-formed after 2022 (GEO-E034). The general premise that almost no megalithic site has a complete published restoration history is not surveyed here; it leans on background familiarity with patchy conservation records. The modal conclusion ("may reflect") is a sound methodological caution. Strongest opposing consideration: one monument is not a census, some sites and surfaces may be well documented, and the caution cuts against conventional surface readings as much as against casting ones, so it should be tested site by site (GEO-R005) rather than used to dismiss surface evidence wholesale.
  - claimId: GEO-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, the claim asserts three things: the Rekhmire scene exists, Egyptology conventionally reads it as metal casting (the record's own limitation says so), and its scale and apparatus have been argued to fit mineral processing better (GEO-E014). Each part is supported, so the claim's local truth is secure. That verdict covers only the existence of the argument. The reinterpretation itself rests on its proponent's reading, which Egyptology has not engaged, and no residue, tool or textual evidence for mineral processing appears in the ledger (GEO-R008 untested). Strongest opposing consideration: the conventional metal-casting reading is the default and has background support, so as evidence that stone was cast the claim carries no weight.