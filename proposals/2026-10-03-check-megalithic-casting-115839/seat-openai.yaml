caseAssessment:
  verdict: weakly_supported
  loadBearing: [GEO-C020, GEO-C021, GEO-C004, GEO-C030]
  weakestLinks: [GEO-C021, GEO-C580, GEO-C012, GEO-C030]
  synthesis: >-
    The evidence gives the featured hypothesis genuine but weak empirical
    support, while weighing substantially against its best-developed Great
    Pyramid application. For the Great Pyramid, GEO-E012 reports unusual
    microconstituents interpreted as rapid precipitation from a basic solution,
    and related NMR work reports a possible calcium-silicate binder in a Bent
    Pyramid casing stone. Those observations keep artificial limestone
    scientifically discussable. Their force is nevertheless reduced by
    contested or narrow sample provenance, limited natural comparators, and
    several direct examinations finding ordinary sedimentary limestone.
    GEO-E018 reports bedding, fossils, burrows, fractures, tool marks, and no
    aggregate-cement fabric across numerous observed blocks. GEO-E019 and
    GEO-E021 report natural limestone in particular specimens, while GEO-E020
    uniquely compares casing stone with both natural limestone and a known
    Davidovits geopolymer positive control and finds the expected
    alkali-aluminosilicate binder signature only in the positive control.
    These records warrant contradiction of GEO-C020 as presently stated,
    although they cannot logically exclude every unsampled block or the revised
    C-S-H chemistry.

    Pumapunku supplies the strongest remaining route to the broad existence
    claim. The proponent team reports carbon- and nitrogen-bearing amorphous
    matter beneath plagioclase crystals in an interior cut from PP1, which is
    harder to dismiss as superficial dirt than the surface observations.
    Against that, PP1 was selected by appearance from loose debris outside the
    protected monument area, no identified architectural block was sampled, no
    geological andesite control was examined, and the material was not
    molecularly identified or dated. The two published papers and fuller
    report are one team and one sample line, not replication. The Pumapunku
    attribution is therefore weakly supported rather than established.

    The mechanism evidence establishes ingredients more securely than ancient
    manufacture. Egyptian natron availability is established, and achieving
    approximately 850 °C is plausible largely from general pyrotechnological
    background, but a large-block ancient-feasible recipe lacks independent
    replication and characterization. Likewise, the proposed Andean
    acid-and-guano process is asserted rather than demonstrated with ancient
    inputs and durability data. The narrow core of GEO-C030 is sound:
    trace-element provenance alone cannot distinguish a natural block from a
    composite made from geochemically identical quarry material. Its broader
    formulation is not sound because XRD and binder-aware petrography can test
    phases and microstructure; provenance blindness does not neutralize
    GEO-E018–GEO-E021.

    Steelmanning the hypothesis, its proponents can point to two nontrivial
    observations: Barsoum's reported microconstituents and the interior
    carbon/nitrogen-bearing matter in PP1. Steelmanning the conventional
    account, direct petrography repeatedly finds natural textures, while the
    principal Andean result lacks secure architectural provenance and a
    natural control. The case is thus weakly supported, not unresolved,
    because affirmative measurements exist, but not mixed because the
    attribution-level support is consistently less diagnostic and less
    replicated than the counterevidence. The single most influential record is
    GEO-E020: removing it would eliminate the only positive-control comparison
    and materially weaken confidence against Great Pyramid casting. The case
    verdict nevertheless survives without it because GEO-E018, GEO-E019, and
    GEO-E021 remain direct negative petrographic evidence, while the Andean
    branch remains independently limited by provenance and controls.
  steelman: >-
    This assessment does not explain the Bent Pyramid casing-stone NMR result:
    the spectra were interpreted as Tura limestone grains cemented by an
    amorphous calcium-silicate gel formed through human intervention, whereas
    the strongest positive-control rebuttal tested an alkali-aluminosilicate
    geopolymer rather than aged C-S-H. No blinded replication on
    provenance-secure casing stone against a broad stratified natural-limestone
    suite appears in the ledger.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The Great Pyramid branch is contradicted by the balance of direct
      petrography, but the Pumapunku interior-material observation and the
      reported pyramid microconstituents provide some affirmative support for
      the broader existential claim. Neither line has provenance-secure,
      independent replication sufficient to establish that any major monument
      contains cast stone. The strongest opposing consideration is the
      convergence of GEO-E018–GEO-E021 on natural limestone textures and absent
      binder signatures in examined pyramid material.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E012 provides a real supporting dataset, but its sample provenance is
      disputed and the highlighted feature classes are reported in natural
      limestone by later comparative work. GEO-E018–GEO-E021 find sedimentary
      structures, fossils, natural opal-CT, and no aggregate-binder fabric or
      alkali-geopolymer signature; GEO-E020 is especially diagnostic because it
      includes a known geopolymer positive control. The strongest opposing
      consideration is the Barsoum microconstituent result, supplemented by the
      revised C-S-H interpretation from NMR, which the alkali-geopolymer
      positive control does not directly test.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The proponent team reports petrographic anomalies and interior
      carbon- and nitrogen-bearing amorphous matter, giving the attribution
      more than purely morphological support. However, the andesite result
      rests on loose debris selected by appearance, lacks an architectural
      object number and natural Khapia comparator, and has not been
      independently replicated. The strongest opposing consideration is that
      natural quarry attribution and volcanic amorphous phases remain viable
      alternatives, although provenance chemistry alone cannot exclude use of
      quarry-derived aggregate.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006, GEO-E007, and GEO-E058 document that published analyses report
      the stated organic matter and microstructural features and that their
      authors interpret them as artificial-stone signatures. This verdict
      establishes what the analyses report, not that their interpretation or
      sample attribution is correct. The strongest opposing consideration is
      that PP1 was loose debris without a secure architectural provenance or
      natural andesite control.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E057 directly quotes the authors saying that the fragments lay
      outside the protected monument area and were selected from debris by
      visually characteristic flat surfaces. The record identifies PP1 as a
      ground fragment rather than a sample removed from a catalogued block.
      The strongest opposing consideration is that loose placement does not
      prove the fragment was unrelated to the monument.
  - claimId: GEO-C918
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E058 directly records the analysts' report that PP1C was cut from the
      fragment's interior and contained similar carbon- and nitrogen-bearing
      matter, including a sheet beneath plagioclase crystals. The claim is
      limited to what those analysts reported and does not independently
      identify the compound or its age. The strongest opposing consideration is
      that the observation comes from the same team and insecurely provenanced
      fragment as the original surface finding.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly states the 2020 model's use of natural Cerro Khapia
      andesite sand stored at Iwawe and its rejection of the quadrangular
      piedras cansadas as construction material. This establishes the model's
      content, not its archaeological correctness. The strongest opposing
      consideration is that only the proponent paper's abstract was available,
      so the supporting treatment of Iwawe Stratum V was not examined.
  - claimId: GEO-C580
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      GEO-E064 reports only an asserted laboratory replication with modern
      chemicals, without a recipe, measurements, durability tests, or use of
      the proposed ancient plant and guano inputs. It also states that the
      acids do not disaggregate andesite, narrowing the process to producing a
      binder for unconsolidated aggregate. The strongest supporting
      consideration is the authors' assertion that the acidic-medium mechanism
      was successfully replicated, but the evidence record supplies too little
      experimental detail to establish durable artificial stone under
      pre-industrial conditions.
  - claimId: GEO-C030
    verdict: mixed
    confidence: high
    reasoning: >-
      GEO-E024 supports the narrow proposition that XRF and ICP-style
      trace-element matching cannot distinguish a natural block from material
      cast using geochemically identical aggregate. The claim overextends that
      point to XRD and to analytical discrimination generally: GEO-E020 shows
      that binder-aware petrography with a positive control can detect a
      manufactured matrix when present. The strongest opposing consideration
      to the negative portion is that a quarry match by itself still does not
      demonstrate carving, even when separate materials analyses could resolve
      the issue.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large demonstration blocks, and GEO-E022
      shows that lime and diatomaceous earth can form a C-S-H cement at room
      temperature. Together they make reconstitution chemically plausible, but
      the large-block result is self-reported and lacks independent mechanical
      or compositional analysis under a documented ancient-feasible protocol.
      The strongest opposing consideration is that direct examinations of
      pyramid samples generally find natural limestone rather than the
      predicted manufactured fabric, though occurrence and feasibility are
      distinct questions.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 offers only a weak and incompletely verified archaeological
      precedent for approximately 850 °C pyrotechnology. General scientific
      background makes charcoal-and-bellows attainment of this temperature
      plausible, so this verdict leans partly on prior knowledge rather than
      strong case evidence. The strongest opposing consideration is that
      achieving the temperature in a small furnace does not establish
      sustained, industrial-scale natron processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as major
      ancient Egyptian natron sources and documents replacement by plant ash
      during the seventh through ninth centuries AD. GEO-E011 supplies
      compatible compositional context for distinguishing natron from
      plant-ash glass. The strongest opposing consideration is that these
      records concern vitreous materials and establish neither stone casting
      nor diversion of natron to construction.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: high
    reasoning: >-
      GEO-E015 is an unattributed anecdote about rock-like material in a
      repeatedly used fire pit, with no composition, mechanical testing, or
      controlled replication. It cannot establish the proposed ash-carbonation
      mechanism or a plausible historical discovery pathway. The strongest
      supporting consideration is that the reported outcome is qualitatively
      consistent with the claim, but one under-sourced observation is
      insufficient.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports a photogrammetrically measured removal rate of
      216 cubic centimetres per hour at 85 strikes per minute, matching the
      claim as a result of that controlled experiment. The claim does not say
      that this is a universal ancient rate. The strongest opposing
      consideration is that it is a single team's result using one granite,
      tool configuration, and operator protocol.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using dolerite pounders on a designated
      test block have not reproduced a scoop mark. Attempt numbers, effort,
      technique, observation period, and the condition of the block were not
      systematically recorded, so the evidence cannot securely establish the
      claim's decades-long universal negative. The strongest opposing
      consideration is that undocumented or poorly executed visitor trials are
      not a meaningful reproduction experiment.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 directly conveys the proponent's observation that the
      approximately sixteen-foot shafts are too narrow for effective striking
      at their bottoms. Their dimensions have not been independently surveyed,
      and the biomechanical inference has not been experimentally tested. The
      strongest opposing consideration is that the features could be
      prospecting or staged extraction pits whose final geometry need not have
      allowed a worker to stand at the completed bottom.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite sources and apparent Pharaonic pounder-production
      quarries within the Aswan quarry landscape and associates pounders with
      stone-working activity. That evidence favors their conventional role as
      quarry tools rather than the claim that they served some other primary
      purpose. The strongest opposing consideration is that the record lacks
      microscopic use-wear analysis and therefore does not directly establish
      which material every sphere struck.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only affirmative carrier is an uncited proponent webpage that dates
      the breach to 820 and supplies no medieval author or work. GEO-E027 finds
      no salt in al-Suyūṭī's collected accounts of the breach, while GEO-E028
      and GEO-E029 expose the dating and sourcing problems. The strongest
      opposing consideration is that the checked compilation is late and
      incomplete, so an unread medieval source could still contain the report.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 establishes readily detectable halite efflorescence inside the
      Great Pyramid, but it does not provide the concentration comparison the
      claim requires. GEO-E031 reports halite at other Egyptian limestone
      monuments, including the bedrock-carved Sphinx, and GEO-E032 presents a
      natural sedimentary origin for halite in Giza limestone. The strongest
      supporting consideration is the instrumentally confirmed NaCl on pyramid
      surfaces, but that confirms presence rather than comparative uniqueness.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX and XRD results identifying halite,
      calcite, and quartz, with no nitrates and no evidence of widespread
      gypsum crusts. This matches the claim within the sampled efflorescence and
      detached fragments. The strongest opposing consideration is the stated
      XRD detection limit, under which minor sulfate phases could remain
      undetected.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports Na and Cl in detached substrate material and relays the
      geological interpretation that halite occurs within Giza nummulitic
      strata as a product of evaporating marine or lagoonal water. This
      supports a primary sedimentary origin, but the key Klemm and Klemm source
      was not read directly and no unworked quarry-face control was analyzed in
      the ledger. The strongest opposing consideration is that the evidence is
      second-hand and partly inferential rather than a direct stratigraphic
      survey.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 gives a concrete example at Khufu: unavailable documentation for
      1995–1997 interventions, visible filling and cleaning, sulfur-rich modern
      fill, surviving graffiti residues, and recurrent efflorescence. That
      strongly demonstrates the confound at one central site but cannot
      establish the worldwide quantifier that almost no megalithic site has a
      complete published restoration history. The strongest opposing
      consideration is the absence of a systematic cross-site audit.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 records Fóti's argument that the scale and apparatus in the
      Rekhmire scene fit mineral or waterglass processing better than bronze
      casting. No independent iconographic, inscriptional, residue, or
      archaeological analysis in the evidence records corroborates that
      reading. The strongest opposing consideration is the conventional
      metal-casting interpretation, which remains unrebutted here even though
      consensus alone would not prove it.