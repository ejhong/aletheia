  synthesis: >-
    The case divides cleanly by site, and neither side can close it with the records on this ledger. For the Great Pyramid, the strongest pro-casting dataset (Barsoum 2006, GEO-E012) reports real SEM/TEM microconstituents, but it is hedged by its own authors, rests on samples whose provenance Egypt's SCA disputed, and has been directly answered by the only study in the entire exchange with a positive control: Jana 2007 (GEO-E020) analyzed a genuine Davidovits geopolymeric limestone alongside casing stones and showed that a real casting signature (Na+K/Al-rich binder, smooth matrix, spherical voids) is detectable when present, and absent from the pyramid stones. Folk & Campbell, Harrell & Penrod, and Freestone & Middleton independently report natural sedimentary textures, tool marks, and no binder. For the alkali-aluminosilicate recipe as applied to Khufu limestone, the verdict is contradicted, not merely contested. Two escape routes keep the case alive: the revised C–S–H binder (MacKenzie 2011) lies outside Jana's test and has never been replicated or control-tested, and the Andean branch rests on one loose, provenance-insecure fragment (GEO-E057) whose interior C/N-bearing amorphous matter (GEO-E058) has never been compared against a single geological Khapia andesite control (GEO-E060), with the promised 14C date never published. The salt line, once a pillar, has collapsed: Sessa et al. 2026 documents halite at the Sphinx and other carved Egyptian limestone sites and reports Klemm & Klemm's reading of halite as native to Giza strata, and the al-Ma'mun salt report traces only to an uncited proponent webpage. The methods critique (GEO-C030) is chemically correct for trace-element provenance but cannot extend to binder-aware petrography. Steelmanning the opposition: conventional archaeology explains every quantitative anomaly offered here with at least one live alternative (skilled crews vs. Marčiš's rate, local pounder industry vs. exotic import, sedimentary halite vs. casting salt), and no decisive binder-aware study on provenance-secure samples exists for either the Bent Pyramid NMR result or Pumapunku andesite — so the honest verdict is unresolved, with the pyramid-geopolymer sub-claim specifically contradicted and the hypothesis as a whole neither established nor refuted.
  steelman: >-
    The PP1C subsample's carbon- and nitrogen-bearing amorphous matter lies beneath plagioclase crystals inside a Pumapunku andesite fragment — an occurrence no record in this ledger explains under the carved account, because the proponents' own 2019 study admits no geological andesite was ever compared and the announced radiocarbon dating of that interior organic matter was never published or located. A proponent can rightly say: the single cheapest decisive test (14C on the interior organic matter, or any natural Khapia control thin section) has never been run by either side, so the strongest surviving observation in the case is unrefuted, not refuted — and the same holds for the Bent Pyramid NMR silica resonances, which no published study has tested against a stratified natural Tura/Dahshur limestone suite.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The umbrella claim inherits the pyramid verdict (contradicted for the alkali recipe by Jana's positive-control petrography) and the Pumapunku verdict (a single provenance-insecure fragment with no geological control). No candidate monument currently has a provenance-secure, independently replicated positive result, but neither has any candidate been closed out by a decisive test that covers all proposed binder chemistries. The strongest opposing consideration is that the only binder-aware study with a positive control found nothing — yet it tested only one recipe on one site.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Four independent analyses (Folk & Campbell, Harrell & Penrod, Jana, Freestone & Middleton) find natural sedimentary textures, tool marks, and no binder fabric, and Jana's positive control shows the proposed casting signature would have been detectable. The salt-based support collapsed with Sessa et al.'s documentation of halite at carved Egyptian limestone sites and in Giza strata. The strongest opposing consideration is genuine: Jana's negative tests the alkali recipe only, and MacKenzie's C–S–H NMR result on a Bent Pyramid casing stone remains unreplicated and untested against natural quarry variability — but one untested positive on contested samples cannot outweigh the converging negatives.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The only positive evidence is the proponents' own SEM/petrographic work on a loose fragment chosen by surface appearance from outside the protected area, with no geological andesite comparator and EDS unable to characterize the organic matter molecularly. Ponce's 1971 provenance attribution is real but predates modern methods and is qualified by the legitimate trace-element-blindness critique. Nothing on the ledger establishes casting, and nothing establishes natural origin either; the interior organic matter under plagioclase crystals is a genuine anomaly without a demonstrated mundane explanation.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, the claim is descriptive: peer-reviewed publications by Davidovits et al. do report organic and amorphous microstructural features and argue they are inconsistent with natural volcanic stone, and the citations are verified. The strongest opposing consideration is that "inconsistent with natural stone" is the authors' inference, not a demonstrated result — no Khapia control was analyzed (GEO-E060), and an 1892 thin section already recorded amorphous pockets in this stone.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      The proponents' own text states the fragments lie outside the protected monument area and were chosen by appearance, and the quoted passage was verified against the source. The only counterweight is that being a loose surface find does not logically exclude derivation from an architectural block, but the claim only asserts how the sample was selected, which is exactly what the source says.
  - claimId: GEO-C918
    verdict: established
    confidence: moderate
    reasoning: >-
      The claim is descriptive of what the analysts reported: an interior subsample PP1C showing the same EDS spectrum beneath plagioclase crystals, verified against the source. It is one fragment of insecure provenance analyzed by the proponents with no independent replication, so the underlying observation's significance stays open even though the report of it is solid.
  - claimId: GEO-C903
    verdict: established
    confidence: moderate
    reasoning: >-
      The 2020 abstract, verified on the geopolymer.org page, states exactly what the claim reports: Khapia andesite sand stored at Iwawe (Stratum V, Isbell & Burkholder), and non-use of the piedras cansadas. Confidence is capped because only the abstract was read, in the proponents' own self-published venue, and the Isbell & Burkholder stratum description has not been checked against the excavation report.
  - claimId: GEO-C580
    verdict: unresolved
    confidence: low
    reasoning: >-
      The three-stage chemistry is asserted, not shown: the claimed laboratory replication used modern chemicals with no published recipe, data, or product characterization, the authors concede plant acids cannot disaggregate andesite, and they themselves cannot say whether the guano signature is unreacted residue or binder. The strongest opposing consideration is that the record most cited for this mechanism is the authors' own admission of its gaps.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The chemistry is textbook-correct: PXRF and ICP-MS measure metallic elements and are structurally blind to hydrogen, carbon, and oxygen, so stone cast from the same quarry's aggregate would match on those methods by design. The claim's stated scope (trace-element quarry-matching) is genuinely vulnerable to the overextension the editor endorsed. The strongest opposing consideration is Jana 2007's positive control, which shows the exemption Fóti himself grants to petrography is not a formality — casting signatures are detectable by binder-aware methods, so this claim cannot shield monument stone from direct petrographic testing.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Reconstituted limestone demonstrably can be made — Jana analyzed a real Davidovits geopolymeric block, and the Institute reports multi-ton demonstration blocks — and lime-pozzolan C–S–H chemistry is feasible at room temperature. But the demonstration blocks are self-reported with no independent analysis, Jana's observations question visual similarity (smooth matrix, spherical voids), and production at pyramid scale with ancient inputs and temperatures remains untested. Feasibility is supported; occurrence is not this claim's burden.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only record is Fóti's Badari glassmaking precedent, whose dating and temperature basis need independent verification, and crucible-scale heat does not establish industrial-scale processing. That ancient pyrotechnology broadly reached such temperatures is plausible from general background (metallurgy), but that is a prior, not ledger evidence, and the record says so.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006, mainstream peer-reviewed archaeology, directly documents Wadi el Natrun and al-Barnuj as the primary industrial natron sources with the 7th–9th century decline. The only caveat is that the paper concerns the glass and faience industry and says nothing about stone-making, which limits what this claim implies rather than its truth.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole support is an unattributed anecdote in a proponent book, flagged as under-sourced by the project's own skeptical review, with no controlled replication attempted. The claim is falsifiable cheaply and nothing currently on the ledger confirms or refutes it.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 216 cm³/h figure was confirmed against the peer-reviewed Marčiš et al. paper in the verification batch, and the measurement itself is straightforwardly reported. It is a single study by a single team with one granite and tool configuration, and skilled ancient crews could plausibly outperform the protocol — but as a measurement claim it stands.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim rests entirely on Fóti's anecdotal report of visitor failures: attempt rates and cumulative effort are unquantified and no systematic wear survey of the test block exists. The strongest opposing consideration is that absence of documented success in an unsystematic tourist setting is a very weak form of negative evidence.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only Fóti describes these shafts; the dimensions have not been independently surveyed and the biomechanical claim that effective pounding is impossible from the bottom is untested. The Engelbach context record that would bear on alternative readings was rejected for lack of anchor, leaving the observation weakly but solely supported.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      Kelany et al. document dolerite sourced from dykes within the Aswan granitoids and purpose-built Pharaonic pounder-production quarries adjacent to the working areas, undercutting both the "transported to Aswan" premise and the non-pounding purpose. Confidence is low because the survey does not directly test what the pounders struck, and Engelbach's contrary 1922 opinion on local sourcing is unresolved in this ledger.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: low
    reasoning: >-
      The ledger's only carrier of the salt report is an uncited proponent webpage dated to the wrong year, and the principal medieval compilation of the breach accounts (al-Suyūṭī via Nemoy) describes the entry in detail without ever mentioning salt. This is negative evidence within one compilation, not proof of absence — al-Maqrīzī's Khiṭaṭ and other Arabic sources remain unread — so the claim is unsettled with the burden now on its asserters.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The presence half is confirmed by modern XRD (halite is the efflorescence phase), but the claim's discriminative premise — that comparable natural limestone monuments do not show this — fails: Sessa et al. document halite efflorescence at the carved Sphinx, Lisht tombs, and other Egyptian limestone sites, and report Klemm & Klemm's reading of halite as a primary constituent of Giza nummulitic limestone. The strongest opposing consideration is that no controlled concentration comparison has ever been made, so the contradiction rests on qualitative literature rather than a measured null.
  - claimId: GEO-C907
    verdict: established
    confidence: moderate
    reasoning: >-
      The XRD and SEM-EDX findings (halite, calcite, quartz only; no nitrates; no widespread gypsum) are quoted verbatim from the verified Sessa et al. text. This is a single conservation study with a stated 5 wt% XRD detection limit, but as a report of what the study found, it is solid.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: low
    reasoning: >-
      The claim accurately reports what Sessa et al. attribute to Klemm & Klemm 2010, and the quoted passage was verified. But the underlying Klemm & Klemm 2010 work was not read, so the geological claim itself rests on a second-hand citation pending the direct read proposed in GEO-R010.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is a generalization, and the ledger supplies one concrete, well-documented instance: the Khufu interior interventions of 1995–97 have no available records, and visible surface salt re-formed within about two years of cleaning. That instance proves the phenomenon exists at the case's most-cited monument but cannot establish "almost no site" without the broader audit proposed in the research agenda.
  - claimId: GEO-C005
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only support is Fóti's interpretive argument, which conventional Egyptology has not engaged; the mural is conventionally read as metal casting and no independent re-examination exists. The claim is framed as "argued," which is true, but whether the mineral-processing reading actually fits better is precisely the open question GEO-R008 targets.