      direction: context
      strength: weak
      sourceStatement: The source's authors interpret the millimeter-scale spontaneous EMG nidus as arising because "TrPs are caused by sympathetically activated intrafusal contractions" — that is, sympathetically driven contraction of muscle-spindle fibers.
      editorInference: "For VASO-C020 this cuts both ways and so is recorded as context: it agrees with the attribution that the nidus is autonomically maintained rather than structural, but it locates the maintained element in skeletal intrafusal fibers, not in microvascular smooth muscle. The latch-arteriole account must therefore either absorb spindle activation as the 'secondary skeletal-muscle guarding' it names or displace the observers' own explanation. Weightless on its own for the vascular question."
