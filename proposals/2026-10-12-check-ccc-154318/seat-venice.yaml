caseAssessment:
  verdict: contradicted
  loadBearing: [CCC-C002, CCC-C004, CCC-C010, CCC-C011]
  weakestLinks: [CCC-C010, CCC-C509, CCC-C524]
  synthesis: >-
    Every rung of this case separates cleanly, and the separation drives the verdict. The
    observation rung is settled and uncontested: the low-variance rings and raised-temperature
    spots exist in the WMAP and Planck maps and are reproducible (CCC-C001), a point on which
    proponents and critics agree. Everything above that rung favors the conventional reading.
    Five independent groups — Wehus & Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu et al., and
    Bielewicz et al. — reproduced the circle searches and found the features at the abundance
    ΛCDM skies produce; the founding 6σ figure was computed against a pure-Gaussian-plus-noise
    null that its own authors concede differs from every other group's ensemble (CCC-C003,
    documented verbatim on both sides), and the proponents' strongest technical answer, the
    sky-twist test, has never been independently re-run with an ellipse-specific null. The
    Hawking-point flagship fell the same way: marginalizing over the ring-size family the
    proponents searched reduces 99.98% to 87% (Jow & Scott); a purpose-built detector validated
    at 95% retrieval on synthetic CCC signals finds no significant population (López 2022); a
    maximum-resolution machine-learning search finds none (Bodnia 2024); and Bodnia identifies
    a generative artifact — few-pixel spots manufacturing concentric circles under the
    proponents' own criteria. Bielewicz supplies a positive conventional mechanism for the
    ring statistics' large-scale structure, tracing it to the known low-ℓ anomalies. The
    mechanism rung is mixed: CCC is a genuine framework that predated the searches by four
    years (E014) and carries a laboratory-adjacent forward prediction (erebons), but it rests
    on an admittedly unimplemented mass fade-out, its entropy accounting is under direct
    published attack (Eckstein), and the one quantitative erebon calculation (Allen) puts the
    predicted signal 95 orders of magnitude below LIGO detectability while the correlated-noise
    premise of the LIGO conjecture failed an independent replication. Steelmanning the
    proponents: the sky-twist ellipticity collapse, the 15–20° ring-radius cut-off, the
    Planck–WMAP co-location of the strongest spots, and the 2025 mass–temperature relation are
    real, unrebutted items on this record. But an attribution claim whose two evidentiary
    pillars — circle anomaly and the 99.98% Hawking-point detection — have both dissolved under
    independent reanalysis cannot stand on unrebutted structural arguments alone. The verdict
    is contradicted at moderate rather than high confidence precisely because CCC-R006 and
    CCC-R007 (the fair ellipse null and the low-ℓ-conditioned clustering test) remain unrun:
    the contradiction is strong on everything tested and silent on the two proponent arguments
    nobody has yet tested properly. Sensitivity: CCC-E012 (Bodnia et al. 2024) is the single
    most consequential record; remove it and the verdict still stands on E002, E003, E004,
    E008, E010, and E011 — the case does not hang on one thread, but E012 is what converts
    "no confirmation" into an identified false-positive mechanism.
  steelman: >-
    The sky-twist result (Gurzadyan & Penrose 2013, CCC-E006): computed directly on the WMAP
    data without any simulated null, the prevalence of concentric low-variance sets collapses
    dramatically under even slight ellipticity and the ring radii cut off near 15–20°, exactly
    as CCC's circular-shock expectation requires — and no critic has ever re-run this test
    against an ellipse-specific ΛCDM null (CCC-R006), while DeAbreu et al. explicitly did not
    repeat it. Combined with the Planck–WMAP co-location of the five strongest Hawking spots
    across instruments with very different noise (CCC-E009) and the 2025 Meissner–Penrose
    mass–temperature relation linking spot amplitude to previous-aeon cluster masses, a
    proponent can rightly say the two structural signatures of the claimed signal have never
    been independently examined.
claimAssessments:
  - claimId: CCC-C009
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The attribution claim depends on CCC-C002 and CCC-C004, whose headline significances
      dissolved under independent reanalysis (E002, E003, E004, E008, E010, E011, E012), and
      Bielewicz et al. additionally judged the ring clustering inconsistent with CCC (E058–E060).
      Bodnia et al. supply a mundane generative mechanism for the proponents' own detection
      criterion. The strongest opposing consideration is that the unrebutted structural
      arguments — the sky-twist ellipticity collapse, the Planck–WMAP co-location, and the 2025
      mass–temperature relation — remain independently untested, which is why confidence is
      moderate rather than high.
  - claimId: CCC-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Seven independent analyses (Moss/Scott/Zibin, Wehus & Eriksen, Hajian, DeAbreu, Jow &
      Scott, López, Bodnia) plus Bielewicz's positive low-ℓ mechanism support the conventional
      account, and Planck 2018 gives the null framework its own precision scorecard (E020). The
      word "fully" is the claim's weak point: the sky-twist test has never been independently
      re-run with an appropriate ellipse null (CCC-R006), and Bielewicz relocates the low-ℓ
      anomalies rather than explaining them (E056), so "every signature" is not yet literally
      discharged.
  - claimId: CCC-C002
    verdict: contradicted
    confidence: high
    reasoning: >-
      Five independent reanalyses (Wehus & Eriksen, Moss/Scott/Zibin, Hajian, DeAbreu,
      Bielewicz) each reproduce the features and find them consistent with ΛCDM skies; Hajian
      specifically closes the anisotropic-noise loophole the proponents first raised. The
      opposing consideration — that ΛCDM-spectrum simulations are the wrong standard of chance
      (E005) — is a documented methodological dispute, not evidence of anomaly, and the
      proponents' own 2011 preprint concedes circles arise in WMAP-spectrum simulations.
  - claimId: CCC-C004
    verdict: contradicted
    confidence: high
    reasoning: >-
      Jow & Scott's marginalization over the searched ring-size family reduces 99.98% to 87%
      (E010), about a third of the residual excess comes from a single point (E054), López's
      validated detector (95% retrieval on synthetic CCC signals) finds no significant
      population (E011), and Bodnia's HawkingNet null plus few-pixel artifact diagnosis removes
      the claimed significance at full resolution (E012). The strongest opposing consideration
      is the Planck–WMAP co-location of the top spots, which establishes the features are on
      the sky but, as E028's inference notes, not that they are pre-Big-Bang imprints.
  - claimId: CCC-C001
    verdict: established
    confidence: high
    reasoning: >-
      Both sides affirm this claim: Wehus & Eriksen verify the computational procedures
      verbatim (E002), Moss/Scott/Zibin confirm the variance variations exist (E003), and
      DeAbreu et al. reproduce the proponents' own parameter choices and extend the features to
      Planck (E008). This is the case's central discipline in action — the features are real
      outputs of the search procedure, which is precisely why their interpretation, not their
      existence, is the contested question.
  - claimId: CCC-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is documented from both camps: the proponents' response states the ensemble
      difference in their own words (E005, verbatim), and Wehus & Eriksen's finding of
      "substantially larger variance" in their simulations localizes the disagreement exactly
      where the claim places it (E002). The strongest opposing consideration is that the claim
      characterizes the dispute without adjudicating it — correctly, since which ensemble is
      correct is a substantive question this record cannot settle.
  - claimId: CCC-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      The study table (E023) shows every search row on both sides, 2010–2024, supplied its own
      signal model rather than deriving one from CCC; Jow & Scott state the 99.98% result could
      only have survived a more precise a-priori prediction (E055); and the proponents' own
      rejoinder pattern — nulls answered with new statistics, statistics with new nulls (E013)
      — confirms the structure. No record in the packet describes any preregistered or blinded
      protocol on either side; the claim is the literature's own shape, not an editorial gloss.
  - claimId: CCC-C503
    verdict: well_supported
    confidence: high
    reasoning: >-
      As stated, this is a report claim, and the E006 record carries the GP 2013 abstract
      verbatim, including the ellipticity collapse and the 15–20° radius cut-off. The
      substantive question — whether the circularity preference survives an ellipse-specific
      ΛCDM null — is open and is exactly what CCC-R006 is designed to test; DeAbreu et al. did
      not run it, so the report is accurate but unadjudicated.
  - claimId: CCC-C504
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 83%-of-1134-centres-in-3%-of-sky figure is quoted verbatim from An et al. 2020 in the
      claim's own anchor and echoed in E006's import of the paper's anisotropy discussion. As a
      report claim it is solid; the competing conventional reading — that such concentration
      can arise from large-angular-scale features (E061, recorded as context because it uses a
      different statistic and predates the figure) — awaits the direct test CCC-R007 specifies.
  - claimId: CCC-C501
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim reports what Meissner, Nurowski & Ruszczycki 2013 concluded, and E007 carries
      the abstract verbatim including the 99.7% figure and the same-harmonic-content comparison.
      The substantive weight of that result is limited — proponent-adjacent group, post hoc
      statistic (E007 limitations) — but that bears on the ring claim's force, not on the
      accuracy of this report of it.
  - claimId: CCC-C509
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E049 and E050 directly support the quantitative content: the observed mean
      nearest-neighbour separations (0.20 and 0.19 rad) sit within 1σ of the Gaussian
      expectation 0.20 ± 0.03. The limitation is power — only 100 simulations and only the top
      30 points at two scales — so the null is a weak bound rather than a precision test, which
      is why confidence is moderate despite clean support.
  - claimId: CCC-C523
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Bielewicz et al. directly support the causal attribution: the large-radius variance
      deficit is "yet another manifestation of the well-known anomalous CMB distribution" and
      is traced to the low-order multipoles (E056, E057), with the claim's conditioning result
      (replacing ℓ ≤ 7 in simulations with data values removes the deviation) the operative
      mechanism. The caveat is that the low-ℓ anomalies themselves are unexplained, so the
      claim relocates the oddity rather than resolving it.
  - claimId: CCC-C524
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is Bielewicz's interpretive judgment, and it has real support: the clustering
      tracks large-scale structure in their analysis (E057, E061), consistent with the
      low-ℓ-conditioning mechanism. It remains provisional because it has not been tested
      against the specific An et al. 2020 statistic it would need to explain (the 83%
      concentration figure), which is precisely the discriminating measurement CCC-R007
      proposes; the proponents read the same clustering as previous-aeon superclusters.
  - claimId: CCC-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      Penrose's own text states the requirement and concedes mass fade-out is "an admittedly
      unconventional hypothesis" (E015, verbatim from the refereed 2018 paper), and Tod — the
      framework's central technical contributor — lists implementing it as an open problem,
      noting massless charged particles are usually regarded as problematical (E016). The 2025
      Meissner–Penrose crossover conservation law is genuine progress but does not supply the
      fade-out mechanism (E022).
  - claimId: CCC-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The claim asserts the entropy accounting is self-consistent, but the strongest record on
      the point is a direct published attack: Eckstein shows information loss raises global
      entropy rather than resetting it, undermining "entropy renormalisation" at the crossover
      (E017), and Tod's open-problems inventory treats the accounting as unsettled (E016).
      Penrose's own presentation (E015, and the 2013 source) supplies the claimed accounting,
      and Eckstein's critique has one author and live counterpositions — hence mixed rather
      than contradicted.
  - claimId: CCC-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      E018 carries the erebon proposal verbatim from the refereed 2018 paper: gravitation-only
      Planck-mass particles, decay lifetime of order 10^11 years, potential LIGO signatures.
      Allen's calculation constrains detectability, not the particles' existence, and is
      explicitly recorded as bearing only on the detector branch of the bundled claim (E070,
      E071, E072). The recorded objection is the vagueness of the parameters, which limits the
      prediction's force but not the accuracy of this description of it.
  - claimId: CCC-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is a theory description and E018 carries it verbatim, including the quoted
      "there is no inflation in CCC." The substantive debt — that CCC must derive the observed
      near-scale-invariant perturbation spectrum from erebon decay and has not (Tod's open
      question, E016) — weighs on the theory's plausibility, not on whether the claim
      accurately states its content.
  - claimId: CCC-C505
    verdict: well_supported
    confidence: high
    reasoning: >-
      As stated, the claim is that Penrose proposed this interpretation, and E019 carries the
      arXiv abstract verbatim, with E064 documenting that the note even specifies a concrete
      search protocol. The substantive surroundings are unfavorable — the correlated-noise
      premise failed replication with maximum-likelihood residuals (E067) and Allen's
      calculation puts both direct and memory-effect channels tens of orders below
      detectability (E069) — but those bear on the conjecture's prospects, not on the fact of
      the proposal.
  - claimId: CCC-C519
    verdict: well_supported
    confidence: high
    reasoning: >-
      E042 is the direct source of the exact figures: for Planck-mass erebons decaying to two
      gravitons with lifetime exceeding the Hubble time, Ω_GW(25 Hz) < 2 × 10⁻¹⁰³, about 95
      orders of magnitude below the LIGO O1+O2 limit, in a peer-reviewed Physical Review
      Research rapid communication explicitly motivated by Penrose's proposal. No independent
      replication of the calculation exists on the record, which keeps this at well_supported
      rather than established, though a straightforward mathematical result has low replication
      risk; its scope is the stochastic background, not Penrose's impulsive events.