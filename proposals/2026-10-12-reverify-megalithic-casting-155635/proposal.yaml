    - id: GEO-E069
      title: Engelbach's 1922 reading of the deep shafts and squarish holes as test-shafts (§6)
      claimIds:
        - GEO-C006
      sourceId: SRC-ENGELBACH-1922
      direction: qualifies
      strength: weak
      sourceStatement: Engelbach describes squarish holes at intervals in the trench, generally going down to about the intended bottom level of the obelisk, and the deep holes C and D on Plate I. He believes the holes C and D were "made at the very commencement of the work to study the quality" of the granite, that the holes along the trench were made with the same purpose and "as a means of setting out the perimeter of the obelisk", and that there are indications they were made while "the removal of the top layers of rock were still in progress".
      editorInference: GEO-C006 states the shafts are too narrow for effective pounding at their bottom. Engelbach's reading neither confirms nor denies their narrowness; it supplies a function — prospecting pits sunk before the trench existed — under which no one needed to pound at their bottom, so the narrowness ceases to be anomalous. It is an interpretation, not a measurement, hence weak; but the ledger and article currently imply no conventional reading exists, and one has since 1922. My inference.
      exactLocator: §6, p. 6 of the 1922 print (Project Gutenberg HTML, page marker {6})
      limitations:
        - Interpretation by the excavator, without dimensions or section drawings of the holes in the shown text.
        - Gutenberg transcription.
