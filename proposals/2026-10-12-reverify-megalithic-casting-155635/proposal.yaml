    - id: GEO-E071
      title: Engelbach documents fire-setting (burnt bricks, burnt granite chips) for removing the upper rock at the obelisk quarry (§4)
      claimIds:
        - GEO-C001
        - GEO-C002
      sourceId: SRC-ENGELBACH-1922
      direction: context
      strength: weak
      sourceStatement: 'Engelbach states there are abundant traces that the rock was reduced to level by burning and wedging, burning being used wherever possible: in the excavations "a large quantity of burnt and semi-burnt mud bricks were noticed", and a considerable percentage of chips round the obelisk and other quarries had "the pinkish-brown colour and crumbling texture peculiar to burnt granite". He describes stacks of dried reeds banked with brick near fissures, suggests water was poured on the hot stone, and notes so much stone has been removed without wedge or chisel marks that burning is the only explanation; a footnote adds there is no trace of burning within six feet of the obelisk.'
      editorInference: "This does not bear on the truth of GEO-C001 (a measured pounding rate) or GEO-C002 (tourist attempts on a test block); it is weightless toward both. It matters to what the rate is inferred to stress: Engelbach's own account of the quarry already includes fire-setting for the upper layers, so a slow pounding rate constrains one technique among several. Recorded as context so the inference is not drawn against a pounding-only straw man. My inference."
      exactLocator: §4, pp. 4–5 of the 1922 print (Project Gutenberg HTML, page markers {4}–{5})
      limitations:
        - "Fire-setting is documented for removing upper layers, not for cutting the trench itself (Engelbach: no burning within six feet of the obelisk)."
