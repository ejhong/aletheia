    - id: GEO-E067
      title: Engelbach's own one-hour hand-pounding trial, his rejection of hand pounding for the trench, and his rammer hypothesis (§13)
      claimIds:
        - GEO-C502
      sourceId: SRC-ENGELBACH-1922
      direction: qualifies
      strength: moderate
      sourceStatement: Engelbach states that, to see how much headway could be made by hand, he tried pounding on the trench bottom and found that "after an hour’s hard work, I had extracted about five millimetres" off the surface of a foot × half-trench-width area, adding that with practice he could perhaps have done more. He then writes that he is "certain that they were not used entirely by hand" in the regular work of cutting the trench, because the work would go very slowly and would not have the regular appearance it has, and concludes that "the pounders were attached to rammers" worked on the principle of the modern mindâlah, with two or more men at the trench top and a third below directing the blows; he says he is uncertain how pounders were attached.
      editorInference: "GEO-C502 is right that the trial was a single self-conducted hour and that no mass was measured (the record is a depth over an area). It is wrong in what it makes Engelbach's basis for: he does not rest a hand-pounding orthodoxy on the trial; he uses it to reject hand pounding for the trench and to propose rammers. The proponent characterisation therefore attacks a position the monograph does not hold. This is my reading; the source's own words are above."
      exactLocator: §13, pp. 12–13 of the 1922 print (Project Gutenberg HTML, page markers {12}–{13})
      limitations:
        - Gutenberg transcription, not the printed monograph; text shown through §44 of 56.
        - The rammer mechanism is Engelbach's conjecture, offered with stated uncertainty about attachment.
      reviewState: ai_extracted
