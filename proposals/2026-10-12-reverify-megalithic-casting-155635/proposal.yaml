    - id: GEO-E072
      title: Engelbach's observations of pounder wear, breakage and non-local origin (§§13–14)
      claimIds:
        - GEO-C511
        - GEO-C537
      sourceId: SRC-ENGELBACH-1922
      direction: undermines
      strength: weak
      sourceStatement: Engelbach describes the pounders as nearly spherical dolerite balls, 8–13 inches and 9–15 lb, of almost natural water-worn formation, with the Geological Museum report identifying dolerite (specific gravity 2.93–3.05). He states the wear is not distributed evenly but in patches, showing that "the pounders were used in one position until the bruising surface" in use had become flat and useless; that in very many cases "the pounder had been broken by the great force of the blows" delivered with it, which he could not reproduce by hand; and that his examination of the Aswân quarries "has not revealed stone of precisely the same quality" as the pounders, so that "Since the pounders were imported, a certain economy was essential". He reports burying some hundreds of them under the west retaining wall to stop souvenir-hunting.
      editorInference: "For GEO-C511: flat bruising facets and percussion fracture are the wear a stone acquires striking harder or equally hard rock, and Engelbach reports them on pounders found around the obelisk and all Aswan quarry work; this is direct if qualitative evidence for pounding use, though his 'imported' judgment does agree with the claim's 'transported' premise (Kelany et al. disagree, GEO-E709). For GEO-C537: the predicted signature is mortar-and-pestle abrasion on glassy foam; the observed signature Engelbach records is facet bruising and brittle fracture from blows. Weak because no microwear study exists on either side; the buried deposit is a recoverable test population. My inference."
      exactLocator: §§13–14, pp. 12–14 of the 1922 print (Project Gutenberg HTML, page markers {12}–{14})
      limitations:
        - Qualitative 1922 observations; no microwear or fracture analysis.
        - Engelbach's origin judgment is his own field comparison and conflicts with Kelany et al. 2009 (dykes in the granitoids).
