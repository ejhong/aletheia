    - id: GEO-E070
      title: A prior conventional function for the Aswan shafts — Engelbach's test-shafts — against the settling-vessel reading
      claimIds:
        - GEO-C536
      sourceId: SRC-ENGELBACH-1922
      direction: undermines
      strength: weak
      sourceStatement: Engelbach reads the deep holes C and D and the squarish holes along the trench as having been "made at the very commencement of the work to study the quality" of the granite and "as a means of setting out the perimeter of the obelisk", with indications they predate completion of the removal of the top rock layers.
      editorInference: GEO-C536 reads the shafts as sodium-silicate settling and decanting vessels sited at trench bottoms. Engelbach's account gives a reason for their placement (they were sunk from the original surface before the trench was cut around them) that requires no processing function, and notes the holes can be traced up the side of the obelisk itself. The natron reading must now beat a specific prior interpretation rather than fill a vacuum. Weak because Engelbach's reading is itself unmeasured conjecture. My inference.
