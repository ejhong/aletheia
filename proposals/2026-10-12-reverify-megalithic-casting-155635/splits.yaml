a6b0a035adf32344d22ca74d87152ebc80436d91a5878d097a97b246d6e5e665:
  model: claude-opus-5-5
  protocol: split-v5
  runId: 2026-10-12-verify-megalithic-casting-155636
  date: 2026-10-12
  answer:
    parts:
      - The pounders are nearly spherical, between 8 and 13 inches in diameter, weighing between 9 and 15 pounds.
      - The pounder balls are of almost natural formation, shaped by the action of water over the ages.
      - The Geological Museum report identifies the pounders as dolerite with a specific gravity of 2.93 to 3.05.
      - Wear on the pounders occurs in patches rather than evenly, showing "the pounders were used in one position until the bruising surface" had become flat and useless.
      - In very many cases "the pounder had been broken by the great force of the blows", which a man using one by hand could not do.
      - Examination of the Aswân quarries "has not revealed stone of precisely the same quality" as the pounders.
      - '"Since the pounders were imported, a certain economy was essential" in using them fully before discarding.'
      - Some hundreds of pounders were buried "under the west retaining-wall and elsewhere" because souvenir-hunters carried them off.
    anchors:
      - quote: are nearly spherical, and vary between 8 and 13 inches in diameter, their weights ranging between 9 and 15 pounds.
        locator: (13)
      - quote: The balls are of almost natural formation, and shaped by the action of water during the ages
        locator: (13)
      - quote: The pounders, on the other hand, are composed of dolerite, which is a more basic rock than the diorite, with a specific gravity of 2.93 to 3.05.
        locator: (13)
      - quote: shewing that the pounders were used in one position until the bruising surface in use had become flat, and therefore useless.
        locator: (13)
      - quote: In very many cases the pounder had been broken by the great force of the blows delivered with it.
        locator: (13)
      - quote: My own examination of the Aswân quarries has not revealed stone of precisely the same quality as that of the pounders
        locator: (13)
      - quote: Since the pounders were imported, a certain economy was essential in making the maximum use of them before discarding
        locator: (14)
      - quote: I have buried some hundreds of these pounders under the west retaining-wall and elsewhere
        locator: (13)
