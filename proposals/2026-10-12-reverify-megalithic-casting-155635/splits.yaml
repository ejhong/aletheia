fb86826ca3326f55f5b99763e29e00fa451f10e6a199c8c1d809cff6346c6362:
  model: claude-opus-5-5
  protocol: split-v5
  runId: 2026-10-12-verify-megalithic-casting-155636
  date: 2026-10-12
  answer:
    parts:
      - An hour of hard hand pounding on the trench bottom removed about five millimetres off the surface of a foot × half-trench-width area.
      - With practice, the hand-pounding rate could perhaps have been higher.
      - The pounders were not used entirely by hand in the regular work of cutting the trench, because the work would go very slowly and would lack the trench's regular appearance.
      - The pounders were attached to rammers and worked on the principle of the modern mindâlah, with two or more men at the trench top and a third below directing the blows.
      - How the rammers were attached to the pounders is uncertain.
    anchors:
      - quote: after an hour’s hard work, I had extracted about five millimetres off the surface of the foot × half-trench-width area
        locator: (13)
      - quote: With practice I could perhaps have done more.
        locator: (13)
      - quote: I am certain that they were not used entirely by hand in the regular work of cutting out the trench
        locator: (13)
      - quote: The only conclusion I can come to is that the pounders were attached to rammers, and worked on the principle of the modern mindâlah
        locator: (13)
      - quote: As to how the rammers were attached to the pounders—if such were indeed used—I am uncertain.
        locator: (13)
ce93a756194b4b8e67383c736b90a7bdfb8df6408d140c00af0b93cdcc5ed8cc:
  model: claude-opus-5-5
  protocol: split-v5
  runId: 2026-10-12-verify-megalithic-casting-155636
  date: 2026-10-12
  answer:
    parts:
      - The best arrangement for working the maximum number of men without interference is for each man to have two 'feet' of trench marked out for him.
      - Each man squats with his back to the obelisk, working one 'foot' of his task while putting his spoil on the other.
      - Plate III no. 1 shows there is just room for a man to squat comfortably, with a 'foot' of space between him and his neighbour.
      - Assuming men with rammers extract 8 mm per hour in each quarter of the double-foot task, working the deepest part (4.2 + 1.0 m) would take 7.22 months of twelve-hour days.
      - Applying the same calculation to Hatshepsut's obelisk gives about 4.4 months, which is within reason compared with her recorded seven months of work.
    anchors:
      - quote: seems to me to be for each man to have two ‘feet’ marked out for him along the trench
        locator: (14)
      - quote: Squatting with his back to the obelisk, he worked on, say, the right ‘foot’ of his task, putting his ‘spoil’ on to the left ‘foot’.
        locator: (14)
      - quote: there is just room for a man to squat comfortably, and there is always the space of a ‘foot’ between him and his neighbour
        locator: (14)
      - quote: Assuming that, with rammers, the men can extract 8 millimetres in an hour in each quarter of their double-foot task
        locator: (15)
      - quote: "then the time taken would have been: (4 × 3.15)/(.008 × 12 × 30) = 4.4 months"
        locator: (15)
