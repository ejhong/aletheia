      DEEP-E016 directly supports the claim by quoting the 37% result from the catalogue analysis, while DEEP-E017, DEEP-E018, and DEEP-E019 scope the finding to the specific sample and dataset. The verdict remains provisional until the coding pipeline and raw frequency counts are independently audited. The strongest opposing consideration is that the coding encompasses radically different serpentine mythologems, creating an aggregate percentage that misrepresents any single coherent motif.
  - claimId: DEEP-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Leaning on art historical and anthropological priors, comparative iconography confirms that therianthropic deities (such as Egyptian Horus or Mesopotamian apkallu), ceremonial regalia (such as feather dancers or priests), and shamanic shapeshifting represent fundamentally distinct conceptual and functional domains. The strongest opposing consideration is an emic perspective where ritual impersonation and mythic transformation are experienced as literal manifestations of divine identity rather than distinct functional categories.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: high
    reasoning: >-
      DEEP-E068 and DEEP-E069 from Pitts et al. (2014) provide peer-reviewed physical evidence establishing the relative stratigraphic sequence: initial statue carving, followed by the addition of vulva petroglyphs (komari), which were subsequently succeeded by the bas-relief birdman composition. The strongest opposing consideration is that only the study's abstract is currently held in the ledger, leaving the detailed physical carving and petrographic arguments in the unretrieved article body.
  - claimId: DEEP-C065
    verdict: established
