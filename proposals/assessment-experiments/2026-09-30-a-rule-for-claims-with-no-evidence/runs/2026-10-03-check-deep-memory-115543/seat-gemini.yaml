    reasoning: >-
      DEEP-E061 and DEEP-E062 directly quote excavation team member Oliver Dietrich stating that there are "far to many 'missing links' to be sure" about the survival or semantic evolution of Early Neolithic imagery into later periods. The strongest opposing consideration is that this statement was delivered in an informal blog comment thread rather than a formal monograph, and intermediate evidence from Neolithic stamp seals remains an active research question (DEEP-R004).
  - claimId: DEEP-C018
    verdict: well_supported
    confidence: high
    reasoning: >-
      Leaning on historical-critical and philological priors, the four names represent irreducibly disparate evidentiary categories: classical Greek contemporary cult inscriptions and literature, a 17th-century colonial Inca-Spanish gloss, 19th-century post-contact Polynesian ethnography, and a 20th-century descriptive Turkish agricultural toponym not used by Pre-Pottery Neolithic builders. The strongest opposing consideration is the diffusionist proposition that place names preserve unbroken, deep oral substrates that transcend linguistic shifts and recording media.
  - claimId: DEEP-C015
