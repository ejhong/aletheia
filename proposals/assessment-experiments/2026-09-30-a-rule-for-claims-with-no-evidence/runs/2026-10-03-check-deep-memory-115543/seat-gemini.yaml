    reasoning: >-
      DEEP-E013 directly reports the 55% figure across 926 traditions from the site's experiment, with DEEP-E014 framing it as a baseline, while DEEP-E015, DEEP-E018, and DEEP-E019 qualify its scope and note catalogue coverage gaps. The claim is provisionally supported as a faithful reflection of the site's report, pending audit of the underlying database. The strongest opposing consideration is that the underlying Berezkin & Duvakin 2016 catalogue has documented geographic omissions, particularly for ancient Near Eastern and Polynesian traditions.
  - claimId: DEEP-C025
    verdict: provisionally_supported
