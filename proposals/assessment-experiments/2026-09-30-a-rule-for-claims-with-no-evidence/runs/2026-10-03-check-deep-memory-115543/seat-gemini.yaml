      Based on standard functional morphology and archaeological priors, formal similarity (such as an arched handle on a rectangular body) does not demonstrate identical utilitarian or ritual function across disparate societies. The strongest opposing consideration is the strict functionalist argument in design theory that highly specific ergonomics or physical configurations strictly limit and determine the object's possible operational use.
  - claimId: DEEP-C044
    verdict: weakly_supported
