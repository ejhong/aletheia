  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      Leaning on epistemological and archaeological priors rather than ledger records (which contain no direct empirical test of this claim), the principle of equifinality dictates that morphological resemblance alone is underdetermined. Dating, provenance, cultural context, and plausible transmission vectors are logically necessary to establish historical affinity over independent convergence. The strongest opposing consideration is the typological argument that extraordinarily complex, idiosyncratic, multi-element forms carry an informational entropy so high that resemblance alone constitutes prima facie proof of historical connection.
