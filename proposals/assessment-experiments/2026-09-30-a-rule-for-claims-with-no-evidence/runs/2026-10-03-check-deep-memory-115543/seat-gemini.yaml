    reasoning: >-
      DEEP-E055 supports the water-sprinkling and ritual cleansing context of the banduddû, but the source is a secondary transcription on a personal blog (SRC-GUTIRREZ-2015) quoting Wiggermann (1992) with noted transliteration errors, and the purifier (cone) aspect is not attested in the transcribed passage. The strongest opposing consideration is that reliance on an unverified blog transcription cannot definitively establish cuneiform philological interpretations without checking the primary printed edition.
  - claimId: DEEP-C012
    verdict: well_supported
