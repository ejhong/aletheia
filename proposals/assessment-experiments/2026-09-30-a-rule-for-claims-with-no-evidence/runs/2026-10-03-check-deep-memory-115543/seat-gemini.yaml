      There are no evidence records in the ledger evaluating the toponymic origin or local ethnographic documentation of the Turkish name Göbekli Tepe (DEEP-E024 addresses only Kurdish names and was excluded from C015). The claim cannot be evaluated without primary toponymic records. The strongest opposing consideration is the common regional toponymic practice in Anatolia of using 'göbek' (navel/belly) as a mundane physical descriptor for rounded knolls, which would support the descriptive reading once documented.
  - claimId: DEEP-C047
    verdict: well_supported
