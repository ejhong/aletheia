  - claimId: DEEP-C034
    verdict: well_supported
    confidence: high
    reasoning: >-
      Leaning on folkloric and comparative mythological priors in the absence of ledger evidence records, secondary harmonization and syncretic translation are widely documented phenomena (such as colonial Spanish chroniclers framing Mesoamerican and Andean myths in Christian theological terms). The strongest opposing consideration is oral-formulaic theory asserting that traditional mnemonic structures can preserve core narrative divergence with high fidelity over long periods.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Assessed via methodological priors, as formal resemblance between isolated artifacts cannot generate specific chronological dates, geographical origins, or technological capabilities without independent stratigraphic, radiometric, and contextual data. The strongest opposing consideration is hyper-diffusionist models claiming that certain high-order architectural or astronomical motifs can only be produced by an advanced parent culture, thus purportedly identifying the source through the complexity of the motif alone.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      Grounded in spatial and phylogenetic priors, global or continental distributions of broad motifs are equifinal, as widespread occurrence can reflect deep ancestral inheritance (such as early human dispersals) or recurrent independent emergence driven by universal human experiences. The strongest opposing consideration is that phylogeographic spatial modeling combined with linguistic or genetic distance trees can sometimes reject independent invention under strict probabilistic assumptions.
  - claimId: DEEP-C056
