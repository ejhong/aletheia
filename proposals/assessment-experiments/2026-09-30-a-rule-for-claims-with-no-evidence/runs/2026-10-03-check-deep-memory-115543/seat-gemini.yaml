    reasoning: >-
      DEEP-E028 directly confirms this from the German Archaeological Institute excavation team (Dietrich 2016), which explicitly states that a final decision on the meaning of these three forms is impossible and remains speculative. The strongest opposing consideration is that rival non-team hypotheses (such as Sweatman and Tsikritsis's archaeoastronomical constellation reading or Schmidt's early building model suggestion) claim definitive functional identifications.
  - claimId: DEEP-C009
