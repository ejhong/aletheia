    reasoning: >-
      DEEP-E035 confirms that Vidale & Micheli (2012) specifically infer from wear traces that the object was suspended for a long time on a cord, satisfying the claim's conditional truth requirement, though DEEP-E038 emphasizes their explicit caveat that this inference rests on a single specimen. The strongest opposing consideration is that the paper's full text is not retrieved, and DEEP-E034 notes that identity between the studied museum specimen and the ledger's specific photographed object has not been definitively cross-referenced.
  - claimId: DEEP-C072
