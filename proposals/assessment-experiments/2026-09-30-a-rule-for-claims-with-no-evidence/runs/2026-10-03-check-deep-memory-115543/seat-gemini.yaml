    reasoning: >-
      Assessed via sculptural engineering and petrographic priors, carving arms and hands tightly adhering to the torso minimizes vulnerable negative spaces and thin structural projections, substantially reducing shear breakage during quarrying, carving, transport, and upright installation in friable stone. The strongest opposing consideration is that many ancient traditions successfully carved detached limbs or open gestures using external supports or higher-tensile rock, indicating pose was primarily dictated by ritual canon rather than mechanical limits.
  - claimId: DEEP-C053
