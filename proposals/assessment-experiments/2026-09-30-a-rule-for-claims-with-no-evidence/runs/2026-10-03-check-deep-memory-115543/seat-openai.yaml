caseAssessment:
  verdict: weakly_supported
  loadBearing: [DEEP-C027, DEEP-C057, DEEP-C026, DEEP-C072]
  weakestLinks: [DEEP-C027, DEEP-C057, DEEP-C031, DEEP-C037]
  synthesis: >-
    Interpreted as the hypothesis that the distant resemblances principally preserve a shared historical source or transmission chain, Deep Memory receives weak but nonzero support from this ledger. The strongest favorable item is DEEP-C027: the founder reports that claimed civiliser partners ranked first in 62.5% of completed AI lineups, compared with 9% for random pairs. If methodologically sound, that result says the selected narratives resemble their proposed partners more than arbitrary controls. The catalogue also reportedly finds widespread bird-person and cosmic-serpent classes, while the Oannes material preserves a genuine fish-bodied civilising teacher and a scholarly Oannes–U-An alignment. These observations make the comparison program legitimate and identify patterns requiring explanation; they are not merely evidence that unrelated people have noticed superficial pictures.

    The adverse case is structurally stronger. DEEP-C057 reports that the three broad motif classes do not form an outstanding bundle under the catalogue's documentation-preserving comparisons. That result is only an unaudited self-report, but it bears directly against treating the selected bundle as anomalous. DEEP-C026 and DEEP-C035 are also decisive methodological constraints: geographical prevalence or resemblance alone does not identify transmission, much less establish a source's date, identity, or capabilities. The retrieved local evidence repeatedly separates appearance from historical meaning. The Pillar 43 forms are securely described as box-like and handle-like, yet their function remains unsettled; the Assyrian banduddû has a ritual context that cannot automatically be transferred to Göbekli Tepe; and later birdman carvings on Hoa Hakananai'a belong to a secondary carving phase. An excavation-team member additionally says that too many intermediate links are missing to establish survival of Göbekli imagery into later Near Eastern material.

    Several potentially important findings are absent rather than negative. The flood clustering, Genesis-detail distribution, and inter-judge disagreement claims have no evidential records here. The catalogue and lineup data were not retrieved, and the reported categories are broad, unevenly documented, and not equivalent to the exact iconographic conjunctions under dispute. Consequently, the ledger neither demonstrates a transmission chain nor decisively refutes one. The verdict is weakly_supported rather than contradicted because the civiliser lineup supplies a reported controlled resemblance signal and the local Oannes evidence establishes one substantive template. It is not provisionally_supported because no dated intermediates, discriminating mechanism, audited replication, or exact-motif statistical test is present.

    Sensitivity is concentrated in DEEP-E020, the record reporting the 62.5% claimed-partner result. Removing it would eliminate the only positive controlled rate for a cross-cultural comparison; DEEP-E021 would retain only the random baseline. The weakly_supported verdict therefore does not survive that removal and would fall to unresolved, so the favorable case presently hangs on one unaudited self-report.
  steelman: >-
    The ledger never tests the proponent's strongest prediction: that the exact conjunctions of birdlike anthropomorphs, handled forms, bodily poses, associated animals, and civilising-teacher details recur across distant cultures substantially more often than matched archaeological and narrative controls. Broad motif categories can erase precisely the rare configurations on which a shared-source argument rests, and no audited exact-feature analysis or systematic search for dated intermediates answers that point.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim states a basic constraint on historical inference: resemblance is an observation, whereas dating, context, differences, and feasible connections determine which historical explanation it supports. The Pillar 43 records illustrate the distinction because a handle-like shape is documented while its function remains undecided. The strongest opposing consideration is that an unusually specific resemblance can itself be evidence, but it still cannot uniquely assign a historical explanation without the listed contextual information; this verdict rests partly on general inferential logic rather than a dedicated evidence record.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The founder directly reports that the three-class bundle did not stand out under documentation-preserving comparisons. DEEP-E018 and DEEP-E019 qualify the result because catalogue coverage is uneven and the broad classes do not represent the claim's specific images or names. The strongest opposing consideration is that neither the data nor the comparison procedure was retrieved, leaving this as a single unaudited self-report.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the two stated rates, 62.5% for claimed partners and 9% for random pairs. They therefore support the claim as a report of the experiment's result, but not as an independently reproduced statistic. The strongest opposing consideration is that the run data, incomplete-run count, passages, controls, and analysis were not retrieved, so the striking contrast cannot be audited.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      Translation, borrowing, and comparative rewriting are plausible convergence mechanisms under general historical reasoning. No evidence record here, however, presents earlier and later versions demonstrating increased similarity, which is the claim's stated test. The strongest opposing consideration to an unresolved verdict is the high prior plausibility of such mechanisms, but that prior is not case evidence.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Source identity, date, and capabilities are additional propositions not logically entailed by motif similarity, so each requires independent evidence. This is an underdetermination point and the verdict consequently rests on general inferential logic rather than a dedicated empirical record. The strongest opposing consideration is that a sufficiently rare and complex resemblance can raise the probability of common origin, but even then it does not by itself specify all three added attributes.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographical motif distribution can be generated under both transmission and repeated invention unless temporal, relational, or mechanistic assumptions distinguish the models. DEEP-E061 and DEEP-E062 reinforce the local relevance by recording that intermediate links and possible changes of meaning remain uncertain. The strongest opposing consideration is that a distribution can become discriminating when evaluated under explicit quantitative models, but the claim correctly limits itself to the distribution “by itself.”
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder reports that all three broad classes are widespread, while the recorded 55% bird-person and 37% cosmic-serpent figures support two parts of that summary. The evidence packet supplies no corresponding frequency or underlying data for sacred centres, and uneven catalogue coverage limits representativeness. The strongest opposing consideration is therefore that one third of the conjunction and the entire reproducibility check remain undocumented.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E013 directly reports that 55% of 926 sampled traditions received the broad bird-person code. DEEP-E014 repeats its use as a baseline, while DEEP-E018 and DEEP-E019 limit its scope because coverage is uneven and the category is broader than the specific iconography. The strongest opposing consideration is that the catalogue, coding rules, and computation were not retrieved, so the proportion has not been reproduced.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E016 directly reports a 37% frequency for the broad cosmic-serpent class. DEEP-E017 through DEEP-E019 appropriately restrict the result to the selected category and unevenly covered dataset. The strongest opposing consideration is that no coded data or method were supplied for reproduction, making the evidence a founder's self-report rather than an audit.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      A bird-headed deity, a feather-wearing person, and a person transforming into a bird are conceptually distinguishable categories. No evidence record classifies the compared images or demonstrates that they actually occupy different categories, which is the claim's stated truth condition. The strongest opposing consideration is the strong semantic plausibility of the distinction, but that general prior cannot resolve the empirical classification.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the published relative sequence in which komari were added after the statue's making and the bas-relief birdman composition succeeded them. That sequence directly places the birdman carvings later than manufacture. The strongest opposing consideration is that both records derive from the same abstract, with the paper's underlying survey reasoning and absolute chronology unread.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically distinct: an object can resemble a container without having the same use as another similarly shaped object. DEEP-E025 and DEEP-E028 provide a concrete example, documenting handle-like Pillar 43 forms while leaving their meaning undecided. The strongest opposing consideration is that shape can constrain or probabilistically indicate function, but indication is not identity.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 reports a ritual text in which the banduddû contains water that is consecrated and sprinkled over a person, supporting a ritual bucket interpretation with a purifying use. The evidence is a secondhand blog transcription of an unread primary edition, and it does not document the cone or purifier component directly. That incomplete and indirect textual basis is the strongest opposing consideration.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 records an excavation-team statement that no final decision on the meaning of Pillar 43's three forms was then possible. DEEP-E025 independently establishes that the excavator described their shapes without assigning a secure function. The strongest opposing consideration is that later team publications were not checked, so this establishes the published uncertainty as of 2016–2017 rather than proving that no subsequent identification exists.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 directly quotes the study abstract's inference that the handbag had been suspended for a long time on a cord, and DEEP-E034 documents wear on the handle and contour. DEEP-E038 notes that the authors regarded the inference as based on one object and far from assured. The strongest opposing consideration is that only the abstract was read and the object's identity with the ledger's photographed National Museum specimen was not independently confirmed.
  - claimId: DEEP-C072
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 directly record a team member saying that too many missing links prevent certainty about survival of Early Neolithic imagery and any changes in meaning. This supports the stated agnostic position toward later continuity. The strongest opposing consideration is that the wording comes from one member's informal comment reply, so attributing it to the excavation team collectively is broader than the evidence securely warrants.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      General historical reasoning makes it likely that ancient Greek terminology, a colonial-era Cusco gloss, Rapanui names, and a modern Turkish toponym have different source histories. The evidence packet nevertheless supplies no primary attestations establishing their languages, first-record dates, and builder usage across all four examples. The strongest opposing consideration is the claim's considerable prior plausibility, but the exact three-part comparison remains unevidenced here.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses whether the Turkish name Göbekli Tepe arose descriptively from the mound's shape rather than as a sacred designation. DEEP-E024 concerns Kurdish names and does not bear on this Turkish etymology. The strongest opposing consideration is that the proposed derivation may be linguistically plausible, but plausibility without a toponymic source does not satisfy the claim.
  - claimId: DEEP-C047
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Basic mechanics makes it plausible that keeping carved limbs attached to a stone torso reduces vulnerable projections and therefore contributes to hands-on-body poses. This judgment leans on general engineering background because no evidence record compares breakage, carving practice, or pose frequencies. The strongest opposing consideration is that symbolic convention or object-holding can independently produce the same pose, and no case-specific evidence estimates the material constraint's contribution.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 describes Oannes as a fish-bodied figure with a human head and feet, DEEP-E076 records a claim that his form survived in sculpture, and DEEP-E079 reports the translators' scholarly alignment of Oannes with U-An in an apkallu list. Together these provide a plausible textual bridge to the fish-cloaked sage tradition. The strongest opposing consideration is that no retrieved evidence identifies the particular Assyrian fish-cloaked image as Oannes or directly demonstrates the iconographic apkallu correspondence.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies either the history of the Gate of the Sun figure's identification or a survey showing that no pre-modern source calls it Viracocha. The claim is plausible as a historiographic caution, but that plausibility comes from general prior expectations rather than the ledger evidence. The strongest opposing consideration is that the modern label may rest on older Indigenous or colonial testimony not represented in the packet.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record presents the 263 coded summaries, a clustering statistic, a regional assignment procedure, or even the founder's reported clustering result as admitted evidence. Regional clustering is plausible under diffusion and shared cultural history, but that is only a prior. The strongest opposing consideration to support is that without the measure and null comparison, apparent regional grouping cannot be evaluated.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      The packet contains no evidence record documenting which details were classified as Genesis-associated or how unevenness was measured. The source anchor in the claim file is hypothesis material rather than an evidence record and cannot establish the result. The strongest opposing consideration is that known borrowing could make unevenness plausible, but no supplied data test that expectation.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E022 directly reports that matching object kinds changed the image-lineup result. This is relevant methodological evidence that control selection affects measured resemblance. The strongest opposing consideration is that the pilot data, magnitude and direction of the change, incomplete runs, and cropping effects were not retrieved, so only the qualitative self-report is supported.
  - claimId: DEEP-C037
