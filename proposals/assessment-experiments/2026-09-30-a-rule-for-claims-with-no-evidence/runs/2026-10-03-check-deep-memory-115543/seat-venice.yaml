  synthesis: >-
    This ledger is young and asymmetric: the claims most thoroughly evidenced concern method and local object facts, while the claims that would actually decide the founding question — whether the motif resemblances record a shared past — are mostly unevidenced. The best-evidenced items in the whole packet are the Göbekli Tepe results: the excavator's own first description of the three box-like, handle-like forms on Pillar 43 (DEEP-E025, from Schmidt 2006) and the team's published statement that no final decision on their meaning is possible (DEEP-E028), which together make DEEP-C012 well supported and strip the 'handbag' comparison of any functional leg at the Göbekli end. The Jiroft wear record (DEEP-E035, with the authors' single-object caveat at DEEP-E038) supports cord-suspension for exactly one specimen, which is why DEEP-C009 is only provisionally supported. On the hypothesis side, the strongest pro-hypothesis datum is the V1 civiliser lineup result (62.5% vs 9%, DEEP-E020/E021), but it is a self-report of an unaudited AI experiment whose run data were never retrieved, so DEEP-C027 is weakly supported at best. Against transmission, the excavation team's own 'missing links' statement (DEEP-E061/E062) supports DEEP-C072, and it is the closest thing the ledger has to a direct test of the continuity chain — it is agnostic, not refuting, which is itself informative: nobody has yet produced dated intermediates. Meanwhile the flood-pilot claims (DEEP-C031, DEEP-C054), the inter-judge disagreement claim (DEEP-C037), the navel-name claims (DEEP-C015, DEEP-C018) and the modern-identification claim (DEEP-C028) have no evidence records at all; for these, 'unresolved' is a substantive finding about the ledger's emptiness, not a hedge, and I flag that any plausibility they carry in my reasoning comes from general background, not from the packet. Steelmanning both directions: a proponent can point to the 62.5% convergence and the richly attested Oannes template (DEEP-E043, E046) as an unexplained pattern; a sceptic can point out that the one independent expert body consulted (the Göbekli team) explicitly refuses the continuity inference, and that the site's own catalogue caveats (DEEP-E018/E019) and the pilots' kind-matching result (DEEP-E022) show how easily resemblance measures manufacture agreement. Neither side currently carries the case, so the case verdict is unresolved, with the balance of methodological evidence favouring caution.
  steelman: >-
    The strongest unanswered argument for the shared-past hypothesis is the V1 lineup result itself: claimed civiliser partners ranked first in 62.5% of completed lineups against 9% for random pairs (DEEP-E020/E021), and the ledger's own primary-source records confirm that the Oannes account carries a specific, structured template — fish-cloaked being rising from the sea who teaches city-building, law and writing (DEEP-E043, DEEP-E046) — of exactly the kind the lineup detected. My assessment notes the result is a self-report, but it does not explain why such specific narrative detail converges across hemispheres at a rate seven times chance; if the blind source-level rerun (DEEP-R003) reproduces it on unrecognised primary passages, independent invention or retelling would need a demonstrated mechanism for generating the same detailed template, and none is currently on the ledger.
