claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim articulates a standard requirement of historical and archaeological inference: a visual resemblance acquires historical meaning only when dated, contextualised, differentiated and linked by possible pathways. No evidence record contradicts it; the founder page states it and the ledger's own cautions (uncertain Göbekli function, missing links, divergent navel source-histories) repeatedly instantiate it. Strongest opposing consideration is the possibility that certain highly complex, multi-feature packages could reverse the burden of proof, yet no such uniquely diagnostic package is secured by the retrieved records.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder page reports that the three-motif bundle does not stand out against documentation-preserving comparisons, and the linked evidence records (E018/E019) at least treat the catalogue result as real while qualifying its coverage and scope. The underlying coded data and method page remain unretrieved, so the support is only the author's unaudited self-report. Strongest opposing consideration is that an unaudited comparison design or uneven catalogue coverage could manufacture the non-outlier appearance.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two evidence records (E020/E021) reproduce the page's own statement that claimed civiliser partners ranked first in 62.5 % of completed lineups versus 9 % for random pairs. The figures are therefore attested as the experiment's reported outcome, yet they remain an unaudited AI self-report with incomplete runs and no human blind controls. Strongest opposing consideration is that prompt bias, incomplete lineups or modern compressed retellings (C034) could inflate the claimed-partner rate without reflecting ancient source similarity.
  - claimId: DEEP-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The mechanistic claim that translation, borrowing and comparative writing can make stories more alike than their earlier attested versions is a documented process in textual history and is directly illustrated by the layered transmission of Berossus (Polyhistor–Syncellus) and by the modern identification of the Tiwanaku staff-bearer. No record contradicts the possibility. Strongest opposing consideration is that some structural parallels may already have existed in the earliest recoverable strata before the known retelling channels operated.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Similarity of motifs supplies no evidence for the further identity, date or technological capabilities that a lost-civilisation narrative typically asserts; those claims require independent archaeological or textual warrants. The principle is standard and is reinforced by the ledger's repeated failure to recover such warrants. Strongest opposing consideration would be a package so specific and so lacking in independent developmental pathways that resemblance itself became diagnostic, but no such package is established here.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographical distribution of a broadly defined motif class is compatible with both independent invention and very old transmission under ordinary models; the catalogue result therefore cannot decide between them. The claim is methodological bedrock and is echoed by the excavators' own "missing links" caution (C072). Strongest opposing consideration is that a sufficiently dense, continuously dated chain of intermediates could in principle tip the balance, yet the records supply none.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder page states that the three broad motif classes are each widespread, and the qualifying evidence records (E018/E019) treat that widespread character as given while limiting its interpretive reach. Support is therefore only the unaudited self-report. Strongest opposing consideration is the page's own admission of uneven catalogue coverage, particularly for the ancient Near East and Rapa Nui, which could distort apparent frequencies.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Evidence records E013 and E014 directly reproduce the page's claim of a 55 % frequency for the broad bird-person class in 926 sampled traditions; E015 and E018 qualify scope and coverage. The numeric result is therefore attested as the experiment's reported outcome, but only as an unaudited self-report whose underlying catalogue and coding remain unretrieved. Strongest opposing consideration is that broad narrative categories are not the specific images under discussion and that uneven coverage may inflate the baseline.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E016 reproduces the page's report of a 37 % frequency for the broad cosmic-serpent class; E017 and E018 qualify the result as catalogue- and category-specific. The figure stands as the author's statement of the coded outcome, yet without the data or method it remains weak. Strongest opposing consideration is again uneven coverage and the distinction between broad classes and the specific feathered-serpent images that motivate the comparison.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The interpretive claim that the label "bird-man" conflates at least three distinct ideas (bird-headed deity, feathered person, therianthropic transformation) is asserted by the founder page and is consistent with ordinary iconographic practice; the compared images can be sorted into different cells of that typology. No contrary evidence record exists. Strongest opposing consideration is that some source cultures may themselves have treated the three as continuous or identical, collapsing the distinction.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. (abstract) establish the relative sequence statue manufacture → komari petroglyphs → bas-relief birdman carvings, directly supporting that the birdman reliefs were added later (E068/E069). The claim's truth condition is therefore met at abstract level. Strongest opposing consideration is that the body of the paper remains unread and no absolute dates are supplied, leaving open the possibility of a shorter interval than the ethnohistoric reading implies.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically separable; an object may share outline with another while serving a different purpose, and vice versa. The principle is elementary and is presupposed by the team's refusal to identify the Göbekli forms (C012) and by the distinct Assyrian textual identification of the banduddû. Strongest opposing consideration is that in some tightly constrained artefact classes shape may be so function-driven that the separation becomes artificial, yet that is not shown for the compared handled objects.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The second-hand transcription of Wiggermann (E055) states that the banduddû was filled with water and used to sprinkle in ritual, supplying the bucket-and-purifier reading. The support is real but weak because it is an unchecked blog transcription of a single page. Strongest opposing consideration is that the cone/purifier element is not in the transcribed passage itself and that the primary printed text has not been verified.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The excavation team's own 2016/2017 statement (E028) explicitly declares that a final decision on the meaning of the three forms is not possible and that their meaning is hard to guess, satisfying the claim's truth condition that no secure functional identification has been published by the team. Strongest opposing consideration is that a later team monograph (still unretrieved) might have moved to a positive identification, but the standing published position is uncertainty.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The Vidale & Micheli abstract (E035) states that strong wear suggests the hand-bag was suspended for a long time on a cord, matching the claim; E038 immediately qualifies the inference as based on a single object. Support is therefore present at abstract level but bounded. Strongest opposing consideration is that the paper body is unread, object identity with the photographed specimen is unconfirmed, and the authors themselves treat the reading as far from granted.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A team member's comment-thread reply (E061/E062) states that there are far too many missing links to be sure of any survival of Early Neolithic imagery into later periods and that possible changes of meaning cannot yet be assessed. The claim accurately reports the team's published agnostic stance. Strongest opposing consideration is the informal venue (blog comment) and the possibility that a subsequent formal publication altered the position.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The four designations differ on the three axes the claim names (language, date of first record, builder usage); the differences are visible even from standard reference knowledge and are asserted by the founder page. No evidence record supplies the primary attestations (R002 remains open), so the support is provisional. Strongest opposing consideration is that one or more of the names might still prove to have an unrecorded builder-used sacred sense that would reduce the disparity.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the packet addresses the Turkish toponym's etymology or its descriptive versus sacred character; the founder page asserts that the name describes the mound's shape, but that statement is not backed by a retrieved primary or toponymic source. General linguistic knowledge makes the descriptive reading plausible, yet the claim as stated remains unevidenced in the ledger. Strongest opposing consideration is therefore simply the absence of any confirming record.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The mechanistic claim that material constraints (protecting limbs from breakage by carving them against the body) are a plausible contributor to the hands-on-body pose is an ordinary engineering consideration and is asserted by the founder page; nothing in the records contradicts it. No direct experimental or fracture-pattern evidence is supplied, so the verdict rests partly on priors. Strongest opposing consideration is that the pose may be purely symbolic or ritual in every examined case, rendering the material factor superfluous.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Berossus F1 describes Oannes with a fish body, human head beneath, and human feet (E075 context), and scholarly tables align Oannes with the first apkallu U-An (related E079); the correspondence is therefore the standard one. Direct support for the identification itself, however, is only contextual because the fragment never names apkallu. Strongest opposing consideration is that the fish-cloak iconography and the textual apkallu list are linked by modern scholarship rather than by an ancient explicit equation in the retrieved passages.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record examines pre-modern sources for the name of the central staff-bearing figure on the Gate of the Sun; the founder page asserts that the Viracocha identification is modern, but the claim's truth condition (absence of pre-modern naming) is not tested by any retrieved text. Strongest opposing consideration is therefore the simple lack of a source audit confirming that no earlier source uses the name.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the packet reports the coded data, the clustering measure, or any statistical result from the 263-summary flood pilot; the founder page asserts regional clustering, yet that assertion stands alone. Without the data the claim cannot be evaluated. Strongest opposing consideration is that an unaudited coding scheme or choice of distance metric could produce apparent regional clusters that would not survive independent re-coding.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies the distribution of Genesis-associated details across the coded flood summaries; the page asserts an uneven distribution, but the underlying counts are unretrieved. The claim is therefore presently unevidenced. Strongest opposing consideration is that "details associated with Genesis" may have been defined post-hoc or that generic flood motifs were under-weighted, artificially creating unevenness.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E022 reproduces the page's statement that matching the kinds of objects in a lineup changed the result; the finding is therefore attested as a pilot outcome. The pilots remain unaudited self-reports with incomplete runs and cropping limitations. Strongest opposing consideration is that the kind-matched control itself may have been poorly constructed or that the change is an artefact of small sample size.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record reports inter-judge agreement statistics or any quantitative measure of disagreement among the AI judges; the founder page asserts strong disagreement and unreliable feature coding, but the data are not in the ledger. The claim therefore cannot be confirmed or denied from the supplied records. Strongest opposing consideration is that the disagreement may be confined to ambiguous pairs while clear matches still achieve consensus, a possibility the missing statistics leave open.