  synthesis: >-
    The featured hypothesis under test is that a substantial share of the cross-cultural resemblances in bird-men, handled objects, navel names, feathered or cosmic serpents, civilising teachers and flood narratives records a shared past (deep transmission, inheritance or long-distance contact from a common source), as against independent invention, material or cognitive convergence, and later retelling or scholarly compression. The ledger's evidence records, though incomplete and often secondary or abstract-only, consistently favour the second family of explanations and place heavy methodological barriers in front of the first. Core load-bearing methodological claims are established on both the records and ordinary scientific standards: historical meaning of resemblance requires dates, contexts, differences and linkage pathways (C002); geographical spread of a broad motif class cannot by itself separate independent invention from very old transmission (C026); similarity alone cannot underwrite a lost-civilisation account's further claims about source identity, date and capabilities (C035); shape and function are separate questions (C065); and stories demonstrably converge under translation, borrowing and comparative writing (C034). These principles are instantiated by the primary and near-primary records that do exist. The Göbekli Tepe excavation team itself states that no final decision on the meaning of the three handled forms on Pillar 43 is possible (E028 supporting C012) and that too many missing links prevent any secure claim of survival of Early Neolithic imagery into later Near Eastern objects (E061/E062 supporting C072). The Jiroft chlorite object shows wear consistent with cord suspension, but the authors themselves limit the inference to a single specimen (E035/E038). Assyrian banduddû is textually a ritual bucket used for sprinkling (E055), yet that local identification does not travel. Birdman reliefs on Hoa Hakananai'a post-date the statue (E068/E069). Navel-of-the-world designations differ in language, date of first record and builder usage (C018). Material constraints supply a plausible non-symbolic contributor to hands-on-body poses (C047). Catalogue self-reports, even taken at face value, show broad bird-person and cosmic-serpent classes widespread (55 % and 37 %) while their three-motif bundle does not stand out against documentation-preserving controls (C005/C025/C056/C057); the same self-reports note uneven coverage. Civiliser lineup rates and flood regional clustering are likewise unaudited self-reports. AI image pilots reveal strong inter-judge disagreement and sensitivity to kind-matching (C037/C038). Where positive evidence for deep shared packages might have appeared—secure functional identity for the Göbekli forms, dated intermediate links, pre-modern naming of the Tiwanaku staff-bearer as Viracocha, builder-used navel toponyms, or audited multi-motif co-occurrence far above baseline—it is absent or actively contradicted by the excavators' own statements. The residual visual and narrative parallels that remain are real but are precisely the sort that the methodological claims predict will arise from common human image-making, storytelling templates and later scholarly or touristic retelling. The overall pattern therefore assigns only a weak residual role to shared deep past; most of the observed resemblance is accounted for by the alternative mechanisms the case itself enumerates. The verdict is carried by the convergence of several independent cautions rather than by any single knockout result, yet it would soften if the team's "no decision" and "missing links" statements were later superseded by positive continuity evidence still absent from the ledger.
  steelman: >-
    The specific, multi-feature visual match between the three arched handled forms on Göbekli Tepe Pillar 43 (each accompanied by an animal, as Schmidt 2006 describes) and later Near Eastern and New World handled containers or pouches remains an unexplained residual resemblance that no retrieved record dissolves by independent functional identification or by a documented chain of ordinary diffusion; a proponent can still point to that package as a candidate signal whose best current explanation is inheritance or contact rather than pure convergence.
