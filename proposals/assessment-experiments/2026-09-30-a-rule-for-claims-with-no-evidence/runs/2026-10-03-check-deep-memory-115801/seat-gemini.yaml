    reasoning: >-
      Supported by DEEP-E061 and DEEP-E062, citing excavation team member Oliver Dietrich's formal 2016 comment on the project's official blog stating that there are 'far to many missing links' to confirm the survival of Early Neolithic imagery into later Near Eastern contexts, and that intervening changes of meaning cannot be determined. Although documented in a blog comment rather than a peer-reviewed monograph, it directly reports the team's official evaluative stance. The strongest opposing consideration is that an informal blog comment does not necessarily represent the unanimous consensus or final peer-reviewed verdict of the entire German Archaeological Institute research team.
