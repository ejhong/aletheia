    reasoning: >-
      No evidence record is attached to this claim in the ledger. While it articulates a standard methodological canon in comparative archaeology—that visual similarity cannot establish historical transmission absent stratigraphic dating, geographic plausibility, and contextual continuity—it rests solely on its source citation (SRC-JHONG-2026). The strongest opposing consideration is that salient or complex morphological isomorphism can sometimes generate an initial inductive presumption of contact even before intermediate archaeological contexts are discovered.
