    reasoning: >-
      Supported by DEEP-E068 and DEEP-E069 from the peer-reviewed abstract of Pitts et al. (2014), which establishes the stratigraphic carving sequence on Hoa Hakananai'a where petroglyphs (komari) and subsequent bas-relief birdman motifs were superimposed well after the initial manufacture of the statue. The body of the paper remains paywalled, leaving absolute dating absent from the record. The strongest opposing consideration is that without absolute chronometric dating of the stone surface, relative weathering sequences might be confounded by differential exposure or micro-erosion.
  - claimId: DEEP-C065
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim in the ledger. While distinguishing morphology from functional purpose is standard archaeological methodology, the claim enters purely from the founder's source text (SRC-JHONG-2026). The strongest opposing consideration is that in specialized material culture, form strictly follows function, meaning that identical complex shapes virtually guarantee identical mechanical or ritual uses.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Supported by DEEP-E055, which cites an incantation text (KAR 91 / CT 17) where the banduddû is filled with water from the river mouth and sprinkled over an afflicted person during lustral purification. However, the record derives from an unchecked secondary blog transcription of Wiggermann (1992), and the purifier cone element is absent from the translated text passage itself. The strongest opposing consideration is that the secondhand blog transcription may contain critical philological errors or misattributions not present in Wiggermann's published monograph.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Supported by DEEP-E028, where Oliver Dietrich of the Göbekli Tepe excavation team explicitly states on Tepe Telegrams that a final decision on the meaning or function of the three arched forms on Pillar 43 is not possible, accompanied by DEEP-E025 where Schmidt originally catalogued them cautiously as 'box-like objects with handle-like attachments'. No excavation publication has established a definitive functional identification. The strongest opposing consideration is that more recent unretrieved team monographs or specialized structural analyses may have advanced a definitive architectural or astronomical identification.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Supported by DEEP-E035 from the abstract of Vidale & Micheli (2012), which notes strong wear traces on the handle of a Jiroft chlorite 'hand-bag' consistent with long suspension on a cord, while DEEP-E023 and DEEP-E034 provide context and DEEP-E038 emphasizes the authors' own limitation that this inference rests on a single specimen. The body of the paper has not been inspected, leaving full wear-microsopy documentation unverified. The strongest opposing consideration is that handle wear could have been produced post-depositionally or by non-suspension handling, as acknowledged by the authors' caveat that the reading is far from guaranteed.
  - claimId: DEEP-C072
