  synthesis: >-
    I interpret the featured hypothesis as the substantive shared-past
    explanation: that a meaningful portion of the distant resemblances reflects
    inherited tradition, long-distance contact, or a common source rather than
    mostly convergence, generic motif prevalence, and later retelling. The
    admitted evidence makes this a legitimate research question but does not
    presently resolve that causal hypothesis. On the favorable side, several
    local anchors survive scrutiny. The retrieved excavation literature
    describes handle-like forms on Pillar 43 while leaving their meaning
    undecided; the Jiroft abstract reports wear interpreted as prolonged
    suspension on a cord; the Hoa Hakananai'a abstract places the birdman
    bas-reliefs after the statue's manufacture; and the Berossus material
    describes a fish-bodied civilising figure while a scholarly table weakly
    aligns Oannes with U-An in an apkallu list. DEEP-E020 and DEEP-E021 also
    report a striking 62.5% versus 9% result in the civiliser lineup. Taken
    together, these records show that some components of the proposed
    comparisons are real local observations and that at least one exploratory
    test reported non-random matching.

    Those points do not supply the historical bridge the featured hypothesis
    requires. The civiliser percentages are an unaudited self-report without
    run data or a complete denominator. DEEP-E022 reports that kind-matching
    controls changed an image-lineup result, showing that object-class
    confounding can materially affect perceived resemblance. DEEP-E061 and
    DEEP-E062 record an excavator's position that too many intermediate links
    are missing to establish survival of Göbekli Tepe imagery or continuity of
    meaning. The catalogue frequencies likewise come only from the author's
    self-report, with uneven coverage and categories broader than the specific
    images. Crucially, DEEP-C057's assertion that the three-motif bundle does
    not stand out is not itself demonstrated by its attached records; those
    records only state limitations. The flood clustering, Genesis-detail
    distribution, and inter-judge disagreement claims also lack admitted
    evidence records.

    The negative case must be kept equally bounded. Missing links are not
    evidence that transmission did not occur, and a control-sensitive pilot
    does not erase every resemblance. The broad scientific prior favors
    convergence for simple bodily poses, animal-human compounds, containers,
    serpents, and centre metaphors unless a dated transmission chain is shown,
    but that is a prior rather than a result established by this ledger.
    Accordingly, the hypothesis is unresolved rather than weakly supported:
    the records establish selected ingredients but neither a distinctive joint
    pattern nor a mechanism connecting the distant cases. It is also not
    contradicted, because no admitted study tests and rejects a properly
    specified, chronology-aware transmission model.

    The sensitivity record is DEEP-E022. Removing it would eliminate the
    clearest admitted experimental indication that better-matched controls can
    alter a resemblance result and would make the favorable lineup report look
    less challenged. The unresolved case verdict nevertheless survives without
    DEEP-E022 because the positive experiments remain unaudited, key bundle and
    flood results remain unevidenced, and no dated chain of intermediates is
    supplied.
  steelman: >-
    The strongest unanswered proponent's argument is that the full
    high-dimensional bundle—bird-human figures, handled forms, hands on the
    torso, sacred-centre language, sea-arriving civilisers, and particular
    flood details—recurs across distant contexts more specifically than the
    ledger's broad motif classes capture. No admitted record measures that
    joint excess under preregistered, kind-matched, chronology-aware controls
    or tests whether it follows a coherent chain of dated intermediates; a
    positive result on that prediction would support shared inheritance and is
    not answered here.
