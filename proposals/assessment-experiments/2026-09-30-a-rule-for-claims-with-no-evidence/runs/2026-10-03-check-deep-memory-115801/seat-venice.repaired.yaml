  verdict: unresolved
  loadBearing: [DEEP-C027, DEEP-C038, DEEP-C056, DEEP-C057]
  weakestLinks: [DEEP-C057, DEEP-C027]
  synthesis: >-
    The ledger splits into two tiers, and the case verdict turns on which tier you let
    speak. The tier the loop has actually tested against primary text is local and
    descriptive: Schmidt 2006's "box-like objects with handle-like attachments" and the
    excavation team's published refusal to fix their function (DEEP-E025, DEEP-E028,
    deciding DEEP-C012), the Vidale & Micheli abstract's cord-suspension reading with the
    authors' own single-object caveat (DEEP-E035, DEEP-E038, deciding DEEP-C009), the
    Wiggermann bucket identification reaching the ledger only through an unchecked blog
    transcription (DEEP-E086, DEEP-E055, deciding DEEP-C043 and DEEP-C044), and Pitts
    et al.'s relative carving sequence on Hoa Hakananai'a (DEEP-E068, DEEP-E069, deciding
    DEEP-C059). These are well or provisionally supported, and none of them
    discriminates between the competing explanations: a securely described local object
    is equally compatible with transmission, independent invention, or later retelling.
    The tier that would decide the featured hypothesis — the catalogue frequencies and
    bundle test (DEEP-C005, C025, C056, C057), the civiliser lineup (DEEP-C027), the
    flood coding (DEEP-C031, DEEP-C054), the inter-judge reliability of AI image
    comparison (DEEP-C037), and the methodological claims that would license any
    inference from resemblance at all (DEEP-C002, DEEP-C026, DEEP-C035, DEEP-C065) — is
    either wholly unadmitted or a weak self-report of the founder's own unaudited
    experiments, with run data, methods and the underlying Berezkin & Duvakin catalogue
    not in hand. That asymmetry is why the verdict is unresolved rather than negative:
    the ledger contains no admitted evidence positively establishing transmission or a
    shared source, but it also contains no admitted measurement that rules one out. The
    single positive quantitative signal is the lineup result, and the ledger's own
    DEEP-C038 (kind-matching changed the lineup result) shows that pipeline is
    design-sensitive. Steelmanning the sceptical direction: every diagnostic
    methodological claim is unadmitted, and the only claims the loop has settled are
    ones a proponent of any explanation can accept. Steelmanning the proponent: the
    62.5%-versus-9% lineup result stands unrebutted. Sensitivity: the record whose
    removal would most change the case is DEEP-E020 (with its twin DEEP-E021, the only
    evidence for DEEP-C027); without them the case verdict of unresolved survives, but
    the balance shifts from "one weak, confounded positive signal" to "no admitted
    positive evidence for transmission at all" — the verdict does not hang on a single
    thread. Where my reasoning leans on general background (for example, that
    resemblance-based historical inference requires dates and contexts), I state it as a
    prior, not as ledger evidence; consensus and outsider status are given no weight
    anywhere.
  steelman: >-
    The V1 civiliser lineup result (DEEP-E020, DEEP-E021): claimed partner figures ranked
    first in 62.5% of completed lineups against 9% for random pairs, an effect far above
    chance on the site's own numbers. This assessment does not answer it: no admitted
    evidence shows that translation, borrowing or compressed modern retelling (DEEP-C034's
    convergence mechanisms) can manufacture first-rank matching at anything near that
    rate, the run data were never retrieved so no design flaw is on the record, and
    DEEP-C038's kind-matching caveat is unquantified. A proponent can rightly say the one
    quantitative test in the ledger returned a strong positive for deep cross-cultural
    resemblance among the civiliser accounts, exactly the pattern a shared-source account
    predicts.
claimAssessments:
  - claimId: DEEP-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; it rests on its source anchor alone.
      As a methodological proposition it matches a strong general prior — historical
      explanation from resemblance does require dates, contexts and differences in every
      mature discipline — but that is a prior, stated as such, not admitted evidence. The
      strongest opposing consideration is that the ledger's well-supported local records
      (DEEP-E028, attached to DEEP-C012) show the principle in use without proving the
      universal form stated here. Held unresolved on its source.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records citing this claim, DEEP-E018 and DEEP-E019, are the author's own
      coverage and category caveats, direction "qualifies" at weak strength; they narrow
      how the result may be read without asserting it. The affirmative sentence ("their
      bundle does not stand out") exists only in the source anchor of SRC-JHONG-2026, a
      self-published self-report whose method page and underlying catalogue were not
      retrieved. A source is not evidence, and a qualification is not support. The
      strongest opposing consideration is that the site plainly reports the finding; it
      has simply not been admitted as evidence.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 record the site's statement of its own V1 result, at weak
      strength, with run data not retrieved and "completed lineups" left unenumerated —
      so the claim holds only as a self-report. The strongest opposing consideration is
      the ledger's own DEEP-C038 evidence (DEEP-E022's finding, recorded under DEEP-C038):
      kind-matching changed lineup results, so the 62.5% figure is design-sensitive in a
      way the single quoted sentence cannot exclude. It is also an AI-judged experiment
      whose reliability claim (DEEP-C037) is itself unadmitted.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The closest in-ledger material,
      DEEP-E046 (attached to DEEP-C092), documents what Berossus's Oannes taught, not any
      documented case of stories converging through translation or comparative writing.
      The proposition is highly plausible as a prior — convergent retellings are
      documented in textual scholarship generally — but I state that as a prior, not as
      evidence. Held unresolved on its source.
  - claimId: DEEP-C035
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. It is close to a methodological
      truism — a lost-civilisation account's claims about a source's identity, date and
      capabilities plainly exceed what similarity statements can deliver — but that is a
      prior, and the ledger has admitted no observation, model or example demonstrating
      it. The strongest opposing consideration would be a documented case where
      resemblance plus nothing else settled a historical source claim; the ledger
      contains none in either direction. Held unresolved on its source.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim, and the claim's truth condition —
      the same distribution compatible with both histories under stated models — would
      require exactly the kind of model statement the ledger lacks. DEEP-E061 and
      DEEP-E062 (attached to DEEP-C072) record the excavators' "missing links"
      agnosticism, which is consistent with the claim but presupposes rather than
      evidences it. As a general methodological point it is a plausible prior, stated as
      a prior. Held unresolved on its source.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      The records citing this claim (DEEP-E018, DEEP-E019) are the author's own
      qualifications — uneven catalogue coverage, broad categories distinguished from the
      claim's specifics — carrying direction "qualifies" at weak strength. The
      affirmative statement that the three classes are each widespread sits in the source
      anchor of the self-published page and has no admitted evidence record behind it. A
      caveat cannot carry a positive frequency claim. The strongest opposing
      consideration is that the sister claim DEEP-C005's 55% figure is at least
      self-reported; nothing equivalent was admitted for this claim's "widespread".
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 give weak self-report support for the 55%-of-926 figure;
      the underlying coded data, the method page and the Berezkin & Duvakin catalogue
      were never retrieved, so the claim's truth condition (coded data reproduce the
      proportion) is unverified. DEEP-E015 was flagged by the second reader as a scoping
      qualification rather than support, and DEEP-E018/E019 record the author's own
      coverage caveats. The strongest opposing consideration: every digit rests on the
      founder's own unaudited experiment, with an acknowledged uneven-coverage catalogue.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 provides the same weak self-report footing as the bird-person figure: the
      37% number is the site's statement of its own result, with method and data not
      retrieved. DEEP-E017 was marked by the second reader as a scope caveat rather than
      support of the numeric content, and DEEP-E018/E019 add the author's coverage
      limitations. The strongest opposing consideration is identical to DEEP-C005's: an
      unaudited, self-reported statistic on an acknowledged uneven catalogue, standing
      only on the author's word.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. It is an interpretive taxonomy —
      bird-headed deity, feather-wearing person, person transforming into a bird as
      distinct ideas — that is plausible as a prior from comparative iconography
      generally, but the ledger admits no coded comparison showing the compared images
      fall into different categories. The nearest records, DEEP-E073 and DEEP-E074
      (attached to DEEP-C058 and the Hoa Hakananai'a motif claims), are explicitly
      zero-diagnosticity abstract-absence records. Held unresolved on its source.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069, from the peer-reviewed Pitts et al. 2014 abstract at
      moderate strength, give the relative sequence statue, then komari subsequently
      added, then bas-relief carvings succeeding them — which is exactly the claim's
      proposition that the birdman carvings postdate manufacture. The limitation is
      abstract-only and relative-only, but the claim as stated is relative, so the
      limitation does not undercut it. The strongest opposing consideration is that the
      sequencing rests on one study's abstract, with the paywalled body unread; a second
      independent confirmation would be needed for "established".
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 records the transcribed Wiggermann passage stating that in rituals the
      banduddû was filled with water and used to sprinkle the water over a man, which is
      the ritual-use half of the bucket-and-purifier interpretation; it is the only
      retrieved text bearing on the object's ritual function. The support is weak for
      reasons the record itself carries: it is a secondhand blog transcription of
      Wiggermann 1992, unchecked against the printed page, with garbled transliterations
      and a section the blogger calls "barely readable", and the cone/purifier half of
      the claim is admittedly not in the transcribed text. The strongest opposing
      consideration is that every word rests on an unverified transcription; the primary
      (Wiggermann 1992, p. 66) must replace it before the claim can rise above weak.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is the excavation team's own published statement that "a final decision
      on the meaning of these images" is not currently possible, recorded at strong
      strength, which directly satisfies the claim's truth condition that no secure
      functional identification has been published. DEEP-E025 independently confirms the
      excavator described only shape, not function. The strongest opposing
      consideration is that this is a 2016/2017 team blog post, not a monograph, and the
      research agenda (DEEP-R005) itself flags that later team publications could
      supersede it; within the admitted record, however, the claim is squarely carried.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the Vidale & Micheli abstract stating that the strong wear
      "suggests the hand-bag was suspended for a long time on a cord", which meets the
      claim's truth condition that the published wear study reports handle wear of that
      kind; DEEP-E034 is context only and DEEP-E023 a secondary paraphrase. The verdict
      is provisional because it rests on the abstract alone, the body was never read,
      the object's identity with the photographed specimen is unconfirmed, and DEEP-E038
      carries the authors' own caveat that the inference is based on a single object and
      "far from being granted". The strongest opposing consideration is that
      single-object caveat, which limits generalisation though not the claim about this
      one object.
  - claimId: DEEP-C072
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E061 and DEEP-E062 record the team member's statement that there are "far to
      many 'missing links' to be sure" about survival of the imagery, which matches the
