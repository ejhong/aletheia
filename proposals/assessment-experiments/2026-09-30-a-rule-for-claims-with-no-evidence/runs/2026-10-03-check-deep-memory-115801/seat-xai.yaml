    confidence: low
    reasoning: >-
      DEEP-E016 supports the 37% figure as the author's self-report; DEEP-E017, DEEP-E018 and DEEP-E019 qualify it as scoped to the selected category and dataset with uneven coverage. Underlying coded data unretrieved. Strongest opposing consideration is the same coverage bias and the breadth of the "cosmic-serpent" class, which may inflate the count relative to any historically meaningful subtype.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The interpretive distinction among bird-headed deity, feather-wearing person and transforming person is plausible and often drawn in the literature, yet without coded comparison of the specific images under discussion the claim cannot be graded from the ledger. Strongest opposing consideration is that some ethnographic or iconographic traditions intentionally blend the three, collapsing the categories.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 (from the Pitts et al. 2014 abstract) support the relative sequence statue manufacture then komari then bas-relief birdman carvings, establishing that the birdman carvings were added later. Absolute dates and the full survey reasoning remain in the unread body. Strongest opposing consideration is that "later" could still be only marginally later within the same cultural horizon; the abstract supplies no calendar gap.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      No evidence record is attached to this claim. It is carried as a prior of artefact analysis: shape similarity and functional identity are logically and empirically separate questions; a shared outline does not entail shared use. Strongest opposing consideration is that highly specific multi-part shapes can raise the posterior for shared function, yet the claim correctly keeps the questions distinct.
  - claimId: DEEP-C044
