      No evidence record is attached to this claim. It is carried as a prior of textual history: translation, borrowing and comparative writing demonstrably increase surface similarity relative to earlier attested versions. Strongest opposing consideration is that some core narrative kernels may still be ancient even after later convergence; the claim as stated concerns only the possibility of increased likeness and holds.
  - claimId: DEEP-C035
    verdict: well_supported
    confidence: high
    reasoning: >-
      No evidence record is attached to this claim. It is carried as a prior of method: a lost-civilisation account's added claims about source identity, date and capabilities require evidence beyond motif similarity. Strongest opposing consideration is that sufficiently dense and specific similarity clusters could raise the prior for some shared source; even then similarity alone remains insufficient, so the claim stands.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      No evidence record is attached to this claim. It is carried as a prior of cultural phylogenetics and comparative method: a geographical distribution of a broad motif class is compatible with both independent invention and very old transmission under standard models. Strongest opposing consideration is that addition of dated intermediates or nested clade structure could tip the balance; distribution alone cannot.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the claim via coverage and category-breadth cautions; the positive "widespread" assertion is supported indirectly by the frequency self-reports in DEEP-E013–E017 (attached to DEEP-C005 and DEEP-C025) that give 55% and 37% for two of the three classes, yet the sacred-centre class and the joint statement lack direct retrieved data. Strongest opposing consideration is uneven catalogue coverage especially for the ancient Near East and Rapa Nui.
  - claimId: DEEP-C005
