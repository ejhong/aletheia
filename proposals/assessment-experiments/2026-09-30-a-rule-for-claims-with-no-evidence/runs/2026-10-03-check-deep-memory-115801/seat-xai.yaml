  synthesis: >-
    The founding question asks how much of the observed resemblances among bird-men, handled objects, navel names, feathered serpents, civilising teachers and flood stories across distant cultures records a shared past (common source or long-distance contact) versus independent invention, convergence under shared cognitive or material constraints, or later retelling and comparative writing. The admitted evidence does not resolve the balance. Strongest primary anchors are local and negative or scoping: the Göbekli Tepe team's own statements establish that the three box-like forms with handle-like attachments on Pillar 43 have no secure functional identification (DEEP-E028 supporting DEEP-C012) and that too many missing links prevent confidence in survival of Early Neolithic imagery into later Near Eastern objects (DEEP-E061/E062 supporting DEEP-C072). The Jiroft chlorite handbag shows wear read as long suspension on a cord, but only at abstract level for a single object with the authors' own caveat against generalisation (DEEP-E035/E038 supporting DEEP-C009). Hoa Hakananai'a birdman bas-reliefs post-date the statue's manufacture and are read against ethnohistoric myth recorded centuries later (DEEP-E068/E069 supporting DEEP-C059). Berossus F1 supplies the fish-body/human-head description and civilising teachings of Oannes together with a sculptural-preservation claim, giving context but not direct proof of the apkallu correspondence (DEEP-E075/E076 for DEEP-C053). Catalogue self-reports give broad bird-person and cosmic-serpent classes at 55% and 37% of 926 traditions and state that the three-class bundle does not stand out, yet these remain unaudited secondary figures with explicit uneven-coverage and category-breadth limitations (DEEP-E013–E019). The civiliser lineup self-report of 62.5% first-rank for claimed partners versus 9% random is likewise unaudited and sits beside the image-pilot finding that kind-matching alters results (DEEP-E020/E021, DEEP-E022). Methodological claims that resemblance alone cannot establish dates, identities or capabilities, that catalogue geography cannot separate invention from deep transmission, and that stories converge under translation and borrowing are either priors or unevidenced in the ledger. No admitted record supplies dated intermediate links, shared distinctive feature bundles beyond broad classes, or controlled tests that would elevate shared-past explanations over convergence and retelling. The pattern people see is therefore real at the level of broad motifs and selected side-by-side images, yet the ledger supplies no measurement that converts that pattern into positive evidence for a common prehistoric source. The case therefore remains unresolved: the resemblances are neither established as deep-memory inheritance nor ruled out; the decisive discriminants (secure functions, intermediates, audited co-occurrence statistics, original-language civiliser texts under blind conditions) are still missing. Sensitivity is highest to DEEP-E028; without the team's explicit refusal of a final decision on the Pillar 43 forms the handled-object leg of the comparison loses its strongest primary caution, yet the overall unresolved verdict survives on the missing-links statement, the single-object wear limit, the relative dating of the Rapa Nui reliefs, the unaudited character of the catalogue and lineup figures, and the methodological priors that similarity is insufficient.
  steelman: >-
    The civiliser lineup result in which claimed partner figures ranked first in 62.5% of completed runs against 9% for random pairs, together with the still-unquantified visual match of the three arched handled forms across Göbekli Tepe Pillar 43, the Assyrian banduddû and the Olmec pouch, constitutes a specific excess similarity that pure independent invention has not yet been shown to predict at the observed rate.
