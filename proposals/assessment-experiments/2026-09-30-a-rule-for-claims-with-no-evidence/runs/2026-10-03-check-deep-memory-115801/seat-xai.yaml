    reasoning: >-
      DEEP-E018 and DEEP-E019 (qualifying) attach to the claim and record the author's own cautions on uneven catalogue coverage and the distinction between broad categories and specific images; the underlying "bundle does not stand out" result is a self-report from SRC-JHONG-2026 whose data and documentation-preserving comparisons have not been retrieved. Strongest opposing consideration is that an unaudited negative result cannot rule out subtle co-occurrence structure once coverage bias is corrected.
  - claimId: DEEP-C027
