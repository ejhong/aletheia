  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      No evidence record is attached to this claim. It is carried as a prior of historical method: visual resemblance acquires historical meaning only when dated, contextualised, differentiated and linked by possible contact or descent pathways; resemblance alone never suffices. The strongest opposing consideration is that some resemblances are so distinctive they shift the burden, yet even then the claim as stated remains intact.
  - claimId: DEEP-C057
