      DEEP-E020 and DEEP-E021 directly support the 62.5% versus 9% figures as the page's own statement of the V1 lineup outcome, yet both are weak self-reports whose run data, incomplete-lineup counts and prompt details remain unretrieved. Strongest opposing consideration is that AI judges and compressed modern retellings may manufacture the excess ranking, a limitation the page itself flags and that DEEP-C038's kind-matching result reinforces.
  - claimId: DEEP-C034
