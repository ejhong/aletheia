    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 support the 55% figure as the author's self-report of the catalogue experiment; DEEP-E015, DEEP-E018 and DEEP-E019 qualify it by noting that the figure does not capture specific pose/object bundles and that coverage is uneven. Data and coding are unretrieved. Strongest opposing consideration is that the 2016 Berezkin & Duvakin catalogue's known biases could move the proportion substantially once audited.
  - claimId: DEEP-C025
