    reasoning: >-
      The catalogue analysis reported on the Deep Memory site indicates that when controlling for documentation density across the sampled traditions, the co-occurrence of birds, serpents, and sacred centres fails to achieve statistical significance beyond chance baselines. This finding is qualified within the ledger by DEEP-E018 and DEEP-E019, which acknowledge severe regional coverage skews (notably in the ancient Near East and Rapa Nui) and the high abstraction level of broad motif categories. The strongest opposing consideration is that the raw dataset and exact permutation tests have not been independently retrieved or audited, leaving the result dependent on the author's internal experimental summaries.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The numerical claim directly reflects the figures reported in DEEP-E020 and DEEP-E021, where the site's initial AI lineup pilot placed claimed civiliser partners in the top rank at a rate substantially higher than random pairings (62.5% versus 9%). However, as recorded in the evidence limitations, this is an unaudited self-report of an experimental pilot with an unspecified number of incomplete runs. The strongest counter-consideration is that subsequent findings on the same site demonstrated that matching the semantic kinds of objects substantially eroded lineup discrimination, indicating that the 62.5% figure was largely an artifact of category confounding.
  - claimId: DEEP-C034
    verdict: established
    confidence: high
    reasoning: >-
      In comparative mythology and folklore studies, it is a thoroughly documented mechanism that cross-cultural retelling, translation into lingua francas, and syncretic interpretive framing homogenise disparate narratives into shared archetypes. Colonial chroniclers in the Americas, such as Sahagún and Garcilaso de la Vega, routinely mapped indigenous deities and narratives onto Christian or Classical frameworks, artificially heightening apparent cross-continental resemblances. The primary opposing consideration is that indigenous oral traditions often exhibit high fidelity over centuries, but this fidelity does not prevent external textual transmission from introducing artificial harmonization. This verdict leans on historiographical priors as no primary translation audit is currently in the ledger.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Postulating an advanced, seafaring, or prehistoric mother civilization requires positive physical, stratigraphic, and genetic evidence—such as technological artifacts, metallurgy, domesticates, or habitation sites—capable of bearing the specific temporal and geographic claims. Formal epistemological principles dictate that thematic or visual resemblances between disparate cultures are severely underdetermined and can never independently substantiate specific claims regarding the navigation capabilities, dates, or institutional structures of an unattested source. The opposing view suggests that pervasive, highly complex iconographic complexes constitute circumstantial proof of a lost common ancestor, but such inferences remain invalid without material culture connecting the dots. This verdict leans on the epistemological principles of archaeological reasoning.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      Spatial distributions of cultural traits can be generated either by demic diffusion from an ancient source (such as deep Pleistocene Out-of-Africa migrations) or by recurring independent invention driven by universal human cognition and shared ecological exposures. Without timed, intermediate archaeological traces or phylomemetic tree-branching constraints, spatial mapping alone cannot adjudicate between these two historical models. Proponents of diffusionist mapping argue that complex spatial clines can exclude pure chance, yet without chronological stratification, spatial patterning remains fundamentally degenerate. This assessment leans on anthropological and statistical modeling priors.
  - claimId: DEEP-C056
    verdict: well_supported
