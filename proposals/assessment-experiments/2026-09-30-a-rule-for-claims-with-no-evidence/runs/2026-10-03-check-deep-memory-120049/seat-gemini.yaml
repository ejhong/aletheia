  - claimId: DEEP-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Iconographic and ethnographic analyses demonstrate that the umbrella term 'bird-man' merges fundamentally distinct ontological and ritual concepts. For instance, the Mesopotamian apkallu represents an avian-costumed or hybrid protective sage, the Egyptian Horus is an anthropomorphic deity with a raptor head, and the Rapa Nui tangata manu centres on an annual ritual competition of human transformation and egg retrieval. Conflating these diverse theological and ritual behaviors based on external visual resemblance represents a taxonomic error. The opposing view maintains that all these manifestations derive from a single ancestral shamanic archetype, but this fails to address the profound operational and conceptual differences documented in their respective cultures.
  - claimId: DEEP-C059
    verdict: established
    confidence: high
    reasoning: >-
      High-resolution photogrammetric and stratigraphic analysis by Pitts et al. (DEEP-E068, DEEP-E069) demonstrates that the bas-relief birdman carvings on Hoa Hakananai'a were executed long after the statue's initial carving, succeeding an intermediate phase of incised vulva (komari) petroglyphs. This physical sequence proves that the birdman iconography is tied to the late historic Rapa Nui birdman cult rather than the original megalithic construction phase. Proponents might argue that the statue was always intended to receive such carvings, but the physical stratigraphy confirms a multi-generational, secondary modification of the monument.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      It is a core axiom of archaeological typology and functional morphology that geometric or visual similarity does not imply identical utilitarian or symbolic function. A curved handle attached to a rectangular body can serve as a bucket for liquids, a portable container, a carved architectural representation of a shrine, a stone weight, or a cosmetic censer. Epistemologically, deducing function requires physical wear-trace analysis, residue testing, or contemporary textual/epigraphic attestation, none of which can be inferred from outline morphology alone. The opposing view leans on intuitive visual identification, which routinely fails in material culture studies.
  - claimId: DEEP-C044
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Cuneiform ritual texts transcribed from Wiggermann (DEEP-E055) confirm that the banduddû was an attested ritual bucket filled with sacred river water used by purification priests and protective spirits to sprinkle and cleanse subjects. This specific textual evidence securely anchors the Mesopotamian 'handbag' within a known ritual complex of lustration. The primary qualification is that the supporting record in the ledger derives from a secondary blog transcription of Wiggermann's monograph rather than direct page verification, though the scholarly consensus on this reading remains solid.
  - claimId: DEEP-C012
    verdict: established
    confidence: high
    reasoning: >-
      Excavation project publications from the German Archaeological Institute, specifically Oliver Dietrich's report (DEEP-E028), explicitly affirm that "a final decision on the meaning of these images is not possible at the moment." While hypotheses ranging from arched buildings or portable shrines to astronomical symbols have been floated, the excavation team has deliberately maintained an agnostic position. Proponents of the 'bag' hypothesis argue that the forms clearly depict handled containers, but the excavators themselves formally treat their identification as unresolved.
  - claimId: DEEP-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      Vidale and Micheli's microscopic wear-trace analysis (DEEP-E035) explicitly concludes that the pronounced abrasion on the handle and contours of the Jiroft chlorite object is consistent with long-term suspension from a cord. This directly satisfies the truth condition of the claim as stated. The only caveat, noted in DEEP-E038, is the authors' explicit reminder that this inference derives from a single examined artifact and should not be uncritically generalized to all intercultural-style handled objects.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: high
    reasoning: >-
      Excavation team member Oliver Dietrich formally stated in 2016 (DEEP-E061, DEEP-E062) that there are "far too many 'missing links' to be sure" about the transmission of Early Neolithic iconography into later Bronze or Iron Age Near Eastern contexts. He further noted that any motifs that might superficially survive would have undergone radical semantic shifts over the intervening millennia. While diffusionist proponents point to apparent long-term regional continuities in stamp seals, the official excavation stance remains that a continuous chain of transmission has not been demonstrated.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      The four toponyms represent completely incommensurable categories of historical evidence: the Greek omphalos at Delphi is an ancient indigenous stone cult attested in classical literature; Cusco as 'navel' is an early 17th-century colonial Spanish gloss by Garcilaso de la Vega; Te Pito o te Henua is a 19th-century post-contact Rapa Nui designation; and Göbekli Tepe is a 20th-century descriptive Turkish geographical name unknown to its Pre-Pottery Neolithic builders. These disparities in language family, epigraphic antiquity, and builder attestation establish that grouping them as a singular ancient tradition is historically invalid. A counter-argument that all reflect a universal 'navel of the world' archetype merely confirms a common anatomical metaphor, not a shared historical transmission.
  - claimId: DEEP-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Linguistic and toponymic usage in Southeastern Anatolia establishes that 'Göbekli Tepe' translates descriptively as 'hill with a belly' or 'navel hill,' referring directly to the rounded topography of the tell with its central protrusion. There is no evidence that modern local Turkish-speaking populations possessed folk memories of the 11,000-year-old PPN sanctuary. This verdict leans on linguistic and archaeological priors, as the specific local toponymic survey is targeted by open agenda DEEP-R002 and not fully detailed in the current evidence ledger.
  - claimId: DEEP-C047
    verdict: established
    confidence: high
    reasoning: >-
      Structural mechanics and stone-carving technology dictate that free-standing or cantilevered limbs carved from monolithic stone (such as limestone, basalt, or tuff) have low tensile and shear strength, creating an extreme risk of fracturing during quarrying, carving, transport, and erection. Relief carving of arms flush against the torso directly mitigates these material vulnerabilities across completely independent sculptural traditions, including Easter Island moai, Tiwanaku monoliths, and Göbekli Tepe pillars. Proponents argue that the specific placement of hands on the lower abdomen carries deep esoteric symbolism, which may well be true locally, but structural necessity remains a major confounding driver of the convergent morphology.
  - claimId: DEEP-C053
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Fragment F1 of Berossus (DEEP-E043, DEEP-E075) describes Oannes as a composite creature having the complete body of a fish with a human head beneath the fish's head and human feet protruding from the tail. In scholarly Assyriology (DEEP-E079), this textual depiction is mapped directly onto the well-known first-millennium BCE Mesopotamian iconography of the fish-cloaked apkallu sage (U-An). A strict reading notes that Berossus wrote in Hellenistic Greek and did not use the cuneiform term apkallu, but the iconographical and textual correspondence is widely accepted in Near Eastern scholarship.
  - claimId: DEEP-C028
    verdict: well_supported
    confidence: high
    reasoning: >-
      Tiwanaku flourished between 500 and 1000 CE in a pre-literate Andean context, leaving no written records of the deities depicted on its monumental architecture. The identification of the central staff-bearing figure on the Gate of the Sun as the Inca creator god 'Viracocha' was introduced by 19th- and 20th-century antiquarians and ethnohistorians retrojecting post-conquest Inca mythologies onto a civilization that collapsed centuries before the Inca Empire arose. While proponents point out that Inca religion may have retained elements of earlier Middle Horizon iconography, the explicit naming of the Tiwanaku figure as Viracocha is demonstrably an artifact of modern scholarship.
