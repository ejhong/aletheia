caseAssessment:
  verdict: unresolved
  loadBearing: [DEEP-C002, DEEP-C026, DEEP-C035, DEEP-C027, DEEP-C057, DEEP-C072]
  weakestLinks: [DEEP-C056, DEEP-C057, DEEP-C031, DEEP-C054, DEEP-C037]
  synthesis: >-
    For this roll-up, the featured hypothesis is the substantive reading that
    the distant resemblances preserve a shared ancient source or transmission
    history, rather than merely the uncontroversial observation that comparable
    forms and stories exist. The supplied evidence does not resolve that
    hypothesis. Its strongest favorable result is the founder's report that
    claimed civiliser partners ranked first in 62.5% of completed lineups,
    compared with 9% for random pairs. That is potentially diagnostic, but both
    rates are weak self-reports: the run data, number and treatment of incomplete
    lineups, source passages, controls, and an independent or human replication
    are absent. The reported 55% bird-person and 37% cosmic-serpent frequencies
    establish, at most, provisional baselines within an unevenly documented
    catalogue. Broad prevalence is compatible both with diffusion and with
    recurrent invention, and the evidence records do not directly establish
    either the sacred-centre frequency or the claimed failure of the three-motif
    bundle to stand out.

    The evidence is stronger for several local corrections than for the global
    hypothesis. The Pillar 43 forms were described by the excavator as box-like
    objects with handle-like attachments, but the excavation team said their
    meaning could not then be decided. The Jiroft specimen has wear interpreted
    as prolonged suspension from a cord, although the authors expressly limit
    that inference to one object. Assyrian ritual material weakly supports a
    water-filled banduddû used for sprinkling, while the evidence for the full
    bucket-and-purifier interpretation remains secondhand and incomplete. The
    Hoa Hakananai'a study supports a sequence in which birdman bas-reliefs were
    later additions to the statue. Berossus describes Oannes as fish-bodied,
    says that his form survived in sculpture, and a scholarly table aligns
    Oannes with U-An of an apkallu list; this supports a local Mesopotamian
    correspondence but supplies no cross-cultural transmission chain.

    Steelmanning the negative case, the comparisons repeatedly depend on broad
    categories, uncertain functions, later additions, modern identifications,
    or summaries whose original wording has not been tested. A Göbekli Tepe
    team member also states that too many intermediate links are missing to
    establish survival into later Near Eastern imagery. Steelmanning the
    positive case, neither widespread motifs nor missing links demonstrate
    independent invention, and the reported civiliser-lineup disparity remains
    a genuine result to audit rather than dismiss. The evidence therefore
    neither establishes nor contradicts a shared-past account; it leaves that
    account testable but unresolved.

    The single record whose removal would most change the balance is
    DEEP-E020, because it contains the 62.5% claimed-partner result, the clearest
    supplied observation favoring non-random similarity. Without it, only the
    9% random-pair comparator remains from that experiment and the positive
    case becomes materially weaker. The unresolved verdict survives its
    removal and does not hang on that record.
  steelman: >-
    The reported V1 civiliser result—claimed partners ranking first in 62.5% of
    completed lineups versus 9% for random pairs—remains unexplained because
    the ledger contains neither the run data nor a blinded human replication
    using the original source passages. Reproduction of that disparity under
    source-level, preregistered controls would be specific evidence that the
    civiliser accounts share more structure than generic hero narratives.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      Historical attribution is underdetermined by visual resemblance unless
      chronology, context, differences, and possible routes of connection are
      considered. This verdict rests chiefly on general inferential logic rather
      than a dedicated evidence record. The strongest opposing consideration is
      that an exceptionally complex or diagnostic resemblance can itself be
      powerful evidence, but even then its historical interpretation requires
      chronological and contextual calibration.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue through uneven coverage and
      the breadth of its categories, but neither states or reproduces the
      documentation-preserving bundle comparison. No supplied evidence record
      gives its statistic, method, or outcome. The strongest consideration
      toward support is that the limitation records presuppose an underlying
      catalogue analysis, but that does not establish the particular result
      claimed.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E020 and DEEP-E021 report the exact 62.5% and 9% rates, so the
      founder's account directly supports the claim about what the experiment
      returned. They are two parts of one self-report rather than independent
      confirmations, and no run data or denominator for completed lineups is
      supplied. The strongest opposing consideration is that omitted or failed
      runs, control construction, and source compression could materially alter
      the comparison.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Translation, borrowing, and comparative redaction are generally credible
      mechanisms by which narratives can converge, so scientific and historical
      background gives the claim a strong prior plausibility. The packet,
      however, contains no documented before-and-after retelling that satisfies
      the claim's stated test. The strongest opposing consideration is therefore
      the absence of case-level evidence showing increased similarity relative
      to earlier attested versions.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Resemblance does not logically identify a source, date that source, or
      establish its capabilities; those additions require independent
      constraints. This verdict rests on methodological identifiability rather
      than a particular evidence record. The strongest opposing consideration
      is that an unusually specific resemblance can raise a source hypothesis's
      probability, but it still cannot establish all three added propositions
      by itself.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographical distribution alone is non-identifying when both repeated
      invention and transmission models can produce that distribution. The
      judgment rests on general model-identifiability principles, while
      DEEP-E061 and DEEP-E062 illustrate the practical problem through the
      acknowledged absence of intermediate links. The strongest opposing
      consideration is that a sufficiently distinctive, temporally ordered
      distribution could strongly favor one model, but that would incorporate
      evidence beyond geography by itself.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Weak self-reports support bird-person prevalence at 55% and cosmic-serpent
      prevalence at 37%, but no evidence record establishes the sacred-centre
      component. The catalogue's uneven coverage and broad categories further
      limit what “widespread” means. The strongest consideration toward support
      is that two of the three classes have reported substantial frequencies,
      but a conjunctive claim about all three is not established by evidence for
      only two.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E013 and DEEP-E014 directly report a 55% frequency among 926 sampled
      traditions. Both derive from the founder's unaudited report, and the data,
      coding rules, and denominator construction were not retrieved. The
      strongest opposing consideration is the acknowledged uneven catalogue
      coverage, although that caveat limits generalization more directly than
      it refutes the arithmetic result.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E016 directly reports the 37% cosmic-serpent frequency, while
      DEEP-E017 appropriately limits it to the selected category and dataset.
      The underlying coding and data are unavailable, so the exact proportion
      has not been reproduced. The strongest opposing consideration is that a
      broad and potentially elastic motif definition may make the reported
      frequency sensitive to coding choices.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The three proposed categories are conceptually distinguishable, but no
      evidence record classifies the compared images as deities, feather-wearing
      people, or transforming people. General iconographic background makes the
      distinction plausible without establishing its application here. The
      strongest consideration toward support is the clear semantic difference
      among the categories, while the strongest obstacle is the absence of
      image-specific contextual identifications.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the Pitts et al. sequence in which komari
      were added after manufacture and the birdman bas-reliefs succeeded them.
      That relative sequence directly places the birdman carvings later than the
      statue's original manufacture. The strongest opposing consideration is
      that only the abstract was retrieved, so the observations and sequencing
      analysis in the body could not be audited.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically separate properties: DEEP-E025
      describes handle-like form without assigning function, while DEEP-E028
      records continuing uncertainty about meaning. The differently grounded
      Assyrian ritual interpretation further illustrates why similar outlines
      need not imply similar uses. The strongest opposing consideration is that
      shape can constrain and sometimes strongly indicate function, but it does
      not make the two questions identical.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E055 reports ritual text in which the banduddû contains water that is
      consecrated and sprinkled over a person, supporting a ritual bucket and
      sprinkling interpretation. The passage is available only through an
      unchecked blog transcription of Wiggermann, and it does not document the
      cone or the complete purifier pairing. The strongest opposing
      consideration is therefore that the evidence supports a ritual water
      bucket more directly than the full bucket-and-purifier interpretation.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      DEEP-E028 directly quotes an excavation-team publication saying that no
      final decision on the images' meaning was possible and that their meaning
      was hard to guess. This closely satisfies the claim's criterion that no
      secure functional identification had been published at that point. The
      strongest opposing consideration is that the statement dates to
      2016–2017 and later team publications were not checked.
  - claimId: DEEP-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E034 records wear on the handle and contour, and DEEP-E035 reports
      the authors' inference that the object was suspended for a long time on a
      cord. That is directly consistent with the claim's deliberately limited
      wording. The strongest opposing consideration is DEEP-E038: the authors
      say the inference rests on one object and is far from granted, while only
      the abstract was read.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 directly records a Göbekli Tepe team member saying there were
      too many missing links to be sure about survival into later periods, and
      DEEP-E062 adds uncertainty about changes in meaning. This satisfies the
      claim's stated criterion of a published team-member statement. The
      strongest opposing consideration is that the evidence is an informal
      comment-thread reply by one member, not a formal collective position or
      corpus analysis.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      The proposition is plausible because the four names arise from visibly
      different linguistic and historical settings, but the packet supplies no
      evidence records documenting their earliest attestations or builder usage.
      DEEP-E024 concerns a Kurdish “wish hill” gloss and does not establish the
      three specified dimensions for the four examples. The strongest
      consideration toward support is the evident heterogeneity of the examples,
      but that is background expectation rather than the requested source
      history.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record documents that the Turkish name Göbekli Tepe was
      assigned descriptively from the mound's shape rather than through a sacred
      designation. The supplied Kurdish-name record does not bear on this
      Turkish etymology. The strongest consideration toward support is the
      ordinary descriptive plausibility of the gloss “potbelly hill,” but the
      claim specifically requires historical toponymic documentation that is
      absent.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Basic fracture mechanics makes keeping projecting limbs against a stone
      body a plausible way to reduce breakage, so the claim has strong
      engineering prior plausibility. No supplied evidence record compares
      breakage rates, carving choices, or sculptors' practices for the figures
      at issue. The strongest opposing consideration is that symbolism,
      convention, or object-holding may explain a hands-on-body pose without
      material constraint being a meaningful contributor.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 describes Oannes as a fish-bodied being with a human head and
      feet, while DEEP-E076 says his form was preserved in sculpture.
      DEEP-E079 separately reports a scholarly table aligning Oannes with U-An,
      the first figure in an apkallu list. The strongest opposing consideration
      is that none of these records directly identifies the particular Assyrian
      fish-cloaked image as Oannes or demonstrates from primary texts that this
      iconographic type is the named apkallu type.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No supplied evidence record addresses when the Gate of the Sun figure was
      first called Viracocha or whether any pre-modern source applies that name
      to it. The claim consequently lacks the negative source-history survey
      required by its truth condition. The strongest consideration toward
      support is the general possibility that an archaeological image received
      a later conventional name, but that prior does not establish this
      particular naming history.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record supplies the 263 coded summaries, the regional labels,
      the clustering measure, or the resulting statistic. Consequently neither
      the reported sample size nor the claimed regional clustering can be
      reproduced from the packet. The strongest consideration toward support is
      the founder's claim as preserved in the claim record, but claim text is
      not an evidence record and cannot substitute for the missing analysis.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The packet contains no evidence record giving the relevant Genesis-linked
      details, their coding, or their geographical frequencies. An “uneven
      distribution” also requires a defined comparison or statistical measure,
      none of which is available. The strongest consideration toward support is
      that such an outcome is reported in the claim's source anchor, but the
      assessment rules do not permit treating that unevidenced anchor as a
      reproduced result.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 directly reports that kind-matching changed the lineup result,
      so it supports the claim about the pilot's reported outcome. The evidence
      is a single founder self-report without rankings, effect size, completed
      runs, or underlying images. The strongest opposing consideration is that
      incomplete runs and cropping may account for an unstable result rather
      than a reproducible effect of kind-matched controls.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No supplied evidence record reports an inter-judge agreement statistic or
      otherwise documents strong disagreement among AI judges. DEEP-E022 bears
      only on kind-matched controls, not agreement. The strongest consideration
      toward support is that methodological limitations mention unreliable
      feature coding in surrounding ledger material, but without an admitted
      evidence record or statistic that does not establish this claim.