  synthesis: >-
    This ledger is young: of the 25 claims assessed, only a handful rest on retrieved primary material, and the case verdict must be read as a statement about the current state of the evidence, not about the antiquity of the motifs. The best-supported results are local and observational: the Göbekli Tepe team's own published refusal to identify the three handled forms on Pillar 43 (DEEP-C012, resting on the strong record DEEP-E028), the excavator's agnosticism about any survival of Early Neolithic imagery into later Near Eastern objects for want of 'missing links' (DEEP-C072), the relative carving sequence on Hoa Hakananai'a from a peer-reviewed survey abstract (DEEP-C059), and the abstract-level cord-suspension reading of the Jiroft handbag with its single-object caveat (DEEP-C009). None of these decides the featured question; they fix the dates, functions and sequences any account must respect. The results that would bear directly on the question are mostly self-reports of the founder's own unaudited experiments: the 55% and 37% motif baselines and the 62.5%-versus-9% lineup result are weakly supported at best, while the flood-coding result, the judge-agreement statistics and the bundle-non-salience comparison have no evidence records at all and are unresolved. What the ledger does establish is methodological scaffolding: resemblance alone underdetermines history, distribution alone cannot separate very old transmission from independent invention, and similarity cannot carry a lost-civilisation account's stronger claims about identity, date and capability. The steelman below — the above-chance civiliser lineup signal — is unanswered by anything in these records. Steelmanning the other direction: the absence of any documented intermediate between Göbekli Tepe and later Near Eastern objects, confirmed by the excavators themselves, means the contact reading currently has no dated chain to point to, and the strongest verified facts (function unknown, sequence post-manufacture, single-object wear caveat) are all compatible with independent invention. The case is therefore genuinely mixed: a weak positive signal on narrative resemblance, strong method cautions, and the decisive discriminating tests — human-rater lineups, seal-continuity, flood details, judge agreement — still open in the research agenda.
  steelman: >-
    The V1 civiliser lineup result is a quantitative, above-chance alignment this assessment does not explain away: claimed civiliser partners ranked first in 62.5% of completed lineups against 9% for random pairs (DEEP-E020, DEEP-E021), and no record in this ledger identifies any confounder in that run — the planned human-rater replication on source-level passages exists only as agenda item DEEP-R003, so a proponent can rightly say the strongest standing datum for real cross-cultural resemblance of the civiliser accounts has never been rebutted, only promised a retest.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim; the verdict leans on general historiographic background, not ledger data, and is close to analytic — resemblance alone cannot fix date, contact or meaning. Strongest opposing consideration: the ledger's catalogue experiment treats distributional frequencies as informative, so a proponent could argue distribution is evidence without item-level context; but the claim denies only that resemblance alone settles historical meaning, which the experiment's own caveats (DEEP-E015) do not challenge.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records attached to this claim (DEEP-E018, DEEP-E019) are the author's own caveats about uneven coverage and category breadth; they narrow the result without asserting it, and no record reproduces the documentation-preserving comparison or its outcome. The anchor quote is claim-side text, not evidence. Strongest opposing consideration: the limitations section presupposes the comparison was run, so the result probably exists — but probable existence is not evidence in this ledger.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 record the figures, but both are weak self-reports of the site's own AI experiment with run data not retrieved, and "completed lineups" implies unenumerated exclusions. Strongest opposing consideration: the pilots' own findings about unreliable AI judging (adjacent to DEEP-C037, itself unresolved) suggest exactly this kind of result may not replicate; the claim's truth condition — that run data reproduce the rates — is unverified.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record names this claim; the verdict leans on general background from textual criticism and folklore studies, where convergent retellings are documented. The claim's own truth condition — documented retellings showing convergence relative to earlier versions — has no instance in this ledger. Strongest opposing consideration: the Berossus F1 records (DEEP-E043, DEEP-E046) show an ancient civiliser account in situ, but nothing in the ledger demonstrates convergence produced by translation or comparative writing.
  - claimId: DEEP-C035
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record bears on this methodological claim; the support is analytic — a lost-civilisation account adds claims about the source's identity, date and capabilities that resemblance cannot underwrite, since the same similarity is compatible with several sources. Strongest opposing consideration: highly specific shared details would raise the prior for a common source, so resemblance is not worthless; the claim concedes this by demanding evidence beyond resemblance rather than denying transmission.
  - claimId: DEEP-C026
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No record states this directly; the verdict leans on the modelling point that one distribution can be generated by both histories, and on the consistent picture from DEEP-C072, where the excavators themselves find no established chain of intermediates. Strongest opposing consideration: distribution plus dated intermediates can discriminate — which is why the claim is carefully limited to distribution "by itself," and why DEEP-R004's seal test matters.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two of the three classes have weak self-reported frequencies (birds 55%, serpents 37%), but no record gives any figure for the sacred-centre class, so "each widespread" is only partially evidenced. The records that do touch the claim (DEEP-E018, DEEP-E019) are qualifications, not support. Strongest opposing consideration: the site's own summary sentence asserts all three are widespread, but that is claim-side text, not ledger evidence.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 record the figure, but only as the page's self-report of its own unaudited experiment; the underlying catalogue data and method were not retrieved, and the author's own limitation (DEEP-E018) flags uneven coverage, particularly for the ancient Near East and Rapa Nui. A second reader correctly demoted DEEP-E015 to a scope statement. Strongest opposing consideration: the figure plausibly rests on the published Berezkin & Duvakin catalogue, making it credible — but credibility is not reproduction.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Same footing as DEEP-C005: DEEP-E016 is a weak self-report and DEEP-E017, DEEP-E018 qualify scope and coverage without corroborating the number. Strongest opposing consideration: the same real catalogue underlies it, so the figure is plausible; but no run data are in the ledger to confirm 37%.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record names this claim; the verdict leans on background knowledge that bird-headed deities, feathered persons and human-to-bird transformations are conceptually distinct and that the compared images (e.g. Assyrian bird-headed figures versus the Rapa Nui birdman composites) plausibly fall into different categories. Strongest opposing consideration: hybrid figures can straddle the categories, and the distinction, however sound analytically, has not been applied to any specific compared image in this ledger.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 record a peer-reviewed study's relative sequence — statue, then komari, then bas-relief carvings — which directly supports the claim that the birdman carvings postdate manufacture. The main weakness is that only the abstract was retrieved and no absolute dates are given. Strongest opposing consideration: abstract-level access means the body's arguments, which could qualify the sequence, are unseen.
  - claimId: DEEP-C065
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record names this methodological claim; the verdict leans on the standard archaeological form-function distinction, which the ledger's own Pillar 43 records illustrate: DEEP-E025 shows the excavator described shape only, and DEEP-E028 records the team's refusal to decide function. Strongest opposing consideration: for some object classes shape nearly determines function, so the separation, while valid as a methodological rule, can be weak in application.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 supports the bucket half — ritual filling with water and sprinkling — but only through a secondhand blog transcription of Wiggermann 1992 with acknowledged garbling, and the cone/purifier half of the claim is absent from the transcribed text. Strongest opposing consideration: the transcription's known errors mean the printed page could differ, and the primary source is blocked.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is a strong record: the excavation team's own published statement that "a final decision on the meaning of these images" is not possible, and DEEP-E025 shows Schmidt 2006 describing shape only. The claim matches the team's position exactly. Strongest opposing consideration: the statement is a 2016/2017 blog snapshot and later team publications, the target of DEEP-R005, were not checked, so a commitment in newer literature would overturn it.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the authors' abstract statement that strong wear suggests long suspension on a cord, meeting the claim's truth condition at abstract level; DEEP-E038 records their own caveat that the inference rests on a single object and is "far from being granted," and DEEP-E034 was downgraded to context. Strongest opposing consideration: the claim names the bag in the National Museum of Iran, but the abstract describes a Tehran piece whose identity with the ledger's photographed object is unconfirmed, and the body of the paper is unread.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 record the team member's published reply — "far to many 'missing links' to be sure," with possible changes of meaning unassessable — which is exactly the agnosticism the claim asserts. Strongest opposing consideration: the statement sits in an informal comment-thread reply rather than a formal publication and could be superseded or disowned; two weak records are nonetheless exactly on point for a claim about what a team member has said.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record bears on this claim; DEEP-R002, which would test it, is open. The verdict leans on background: the four names are in different languages and were recorded at plainly different dates, and the Göbekli Tepe name is modern, so the builders cannot have used it. Strongest opposing consideration: the claim asserts specific source-history facts (first-record dates, builder usage) that no retrieved text here documents, and Garcilaso's gloss could be closer to indigenous usage than assumed.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses the Turkish toponym; the only navel-theme record (DEEP-E024) concerns the Kurdish names and its second reader explicitly flagged it as irrelevant to DEEP-C015. Background gives the meaning of "göbek" but not the documentation the claim requires — that the name is recorded as describing the mound's form rather than as a sacred designation. Strongest opposing consideration: the meaning is not in doubt; only the documentary characterisation, which nothing in the ledger supplies.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record names this mechanistic claim; the verdict leans on material background — protruding carved limbs are fragile, so keeping them against the body is a plausible protective choice — and the claim only asserts a "plausible contributor," which is a modest target. Strongest opposing consideration: DEEP-E081 shows Urfa Man's hands deliberately grasping the genitals, a specific gesture, so material constraint may explain little in any particular case even if it is a real contributor in general.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The records bearing on this claim (DEEP-E075, DEEP-E076) are explicitly context: Berossus's F1 describes a fish body over a human head and feet, matching the fish-cloaked iconography, but no text in the ledger asserts the Oannes–apkallu correspondence, and the iconographic half (that the Assyrian figure is the named type, DEEP-C052) is explicitly unaddressed — DEEP-E079's alignment of Oannes with U-An was reassigned away from C052. Strongest opposing consideration: the correspondence rests on inference from description plus a translators' secondary table, not on any source naming the depicted figure.
  - claimId: DEEP-C028
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record bears on this claim; the verdict leans on the standard background view that the Viracocha identification of the Gate of the Sun's central staff-bearer is a product of modern scholarship. The claim's negative form — no pre-modern source names the figure — requires a literature check not yet performed. Strongest opposing consideration: an early colonial chronicler identifying the figure would falsify "modern" at a stroke, and nothing in the ledger rules that out.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger bears on the flood pilot; the 263-summary clustering result exists only as claim-side text from the founder's page. This is a real gap because regional clustering is exactly the kind of result that would bear on transmission. Strongest opposing consideration: the pilot may well show the clustering as reported, but until its coded data are retrieved and checked, the claim has no basis here.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses the distribution of Genesis-associated details; the claim rests entirely on the page's own summary. Strongest opposing consideration: an uneven, rather than uniform, distribution of Genesis-associated details against widespread generic motifs would be genuinely informative about the diffusion of biblical flood material, which is why the gap matters — but absence of records means absence of verdict.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 supports the claim with the page's own sentence, and the second reader confirmed the quote fairly matches the kind-matched finding; but it is a self-report with pilot data not retrieved, and the page notes incomplete runs and cropping constrain the conclusions. Strongest opposing consideration: without the pilot data, the direction and size of the change under kind-matched controls cannot be checked, and the effect could be a small-sample artifact.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record names this claim; DEEP-E022 explicitly does not bear on judge agreement, and the anchor quote is claim-side text. The page's phrase "unreliable feature coding and strong disagreement between judges" suggests the statistics exist, but nothing in the ledger reproduces them. Strongest opposing consideration: this is one of the few claims whose truth would materially lower confidence in the site's other AI-judged results, so its lack of evidence is a substantive omission rather than a neutral one.