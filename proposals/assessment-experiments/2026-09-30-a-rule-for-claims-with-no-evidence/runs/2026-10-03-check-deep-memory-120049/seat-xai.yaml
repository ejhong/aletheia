  synthesis: >-
    The case concerns how far visual and narrative resemblances among bird-men, handled objects, navel names, feathered serpents, civilising teachers and flood stories across distant cultures record a shared deep past or long-distance transmission versus independent invention, material constraint, later retelling or the observer's search for pattern. The ledger's retrieved evidence establishes several load-bearing methodological points with high clarity: historical meaning of resemblance requires dates, contexts, differences and possible connections rather than likeness alone (C002); geographical spread of a broad motif class is compatible with both independent invention and very old transmission and cannot by itself decide (C026); motif similarity alone cannot underwrite a lost-civilisation account's stronger claims about source identity, date and capabilities (C035); and stories demonstrably converge under translation, borrowing and comparative writing (C034). These are not contested by any record. On the concrete objects the excavation team's own statements decide key local facts: the three forms on Göbekli Tepe Pillar 43 have no secure functional identification (C012, strong support from Dietrich 2016), the team itself treats any survival of Early Neolithic imagery into later Near Eastern objects as unestablished because of missing intermediate links (C072), and shape versus function remain separate questions (C065). The Jiroft chlorite object's handle wear is read by its analysts as consistent with long suspension on a cord, yet the authors themselves limit the inference to a single specimen (C009). Assyrian banduddû texts support a bucket-and-purifier ritual reading, but only through a second-hand transcription (C044). Hoa Hakananai'a birdman carvings post-date the statue's manufacture (C059). Catalogue and lineup figures (55 % bird-person, 37 % cosmic-serpent, bundle not standing out, 62.5 % claimed-partner first-rank) exist solely as the founder's unaudited self-reports of experiments whose underlying data, coding manuals and completeness are not in the ledger; they therefore carry only weak weight and are further qualified by the page's own notes on uneven catalogue coverage. AI image-pilot results (judge disagreement, kind-matching sensitivity) are likewise self-reported and incomplete. Flood-coding claims of regional clustering and uneven Genesis-linked detail lack any retrieved run data. Navel-name source histories and several interpretive groupings (bird-man categories, modern Viracocha identification, material-constraint contribution to pose) remain without primary attestation in the packet. Taken together the evidence therefore confirms that resemblance is not self-interpreting, that several of the compared forms lack secure shared function or continuous chains, and that the founder's own quantitative pilots do not yet demonstrate a privileged bundle. It supplies no positive dated intermediates, no replicated transmission pathway, and no independent audit that would elevate the shared-past reading above convergence, constraint and retelling. The overall question of how much of the observed pattern belongs to a deep shared past is consequently unresolved: the methodological cautions and local uncertainties are well supported, the positive deep-memory hypothesis is not established by the records in hand, and the residual visual and narrative parallels remain open to multiple explanations pending primary data the research agenda itself flags as still missing. General background knowledge of independent invention rates for simple zoomorphic and container motifs calibrates plausibility but is not required for the verdict; the ledger's own gaps and qualifications suffice. Removal of the single strongest primary statement on functional uncertainty at Göbekli (E028) would most weaken the case against equating the handled forms, yet the methodological claims and missing-links statements would still leave the deep-transmission reading unsupported.
  steelman: >-
    The specific co-occurrence of bird-headed or bird-associated anthropomorphs with three handled/arched forms on a single early Holocene pillar at Göbekli Tepe, set beside later Mesopotamian bucket-bearing genii, Jiroft chlorite handbags and the Olmec pouch-bearing figure, plus the independent civiliser-lineup excess over random pairs, remains a concrete unexplained observation that no retrieved record dissolves into pure coincidence or universal constraint.
