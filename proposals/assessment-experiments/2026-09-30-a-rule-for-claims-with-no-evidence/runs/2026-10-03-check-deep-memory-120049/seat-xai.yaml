    reasoning: >-
      The claim is a methodological necessity: no visual resemblance receives a historical explanation without dates, contexts, differences and possible connections. It is stated directly by the founding source and is unchallenged by any evidence record; general principles of historical inference calibrate but are not required. Strongest opposing consideration is none; the statement is definitional for the case.
