  synthesis: >-
    The Deep Memory case tests whether recurring, enigmatic motifs across geographically and chronologically dispersed ancient civilizations—such as bird-headed humans, arched 'handled objects', 'navel of the world' toponyms, feathered serpents, and amphibious civilizing culture heroes—represent remnants of a shared ancestral tradition or long-distance contact, rather than independent cultural convergence and universal cognitive tendencies.

    Steelman for the shared past / transmission hypothesis: Proponents point to undeniable morphological and thematic parallels that appear startlingly specific when placed in direct juxtaposition. The preliminary civiliser lineup experiment (DEEP-C027 via DEEP-E020) demonstrates that blind evaluators match claimed civiliser partners at a rate of 62.5%, dramatically exceeding the 9% baseline for random pairings, which suggests a non-trivial cross-cultural clustering of narrative elements (such as amphibious emergence, instruction in civic arts, and sudden departure). Furthermore, broad motif prevalence across hundreds of oral traditions (such as bird-people at 55% in DEEP-E013 and cosmic serpents at 37% in DEEP-E016) confirms that these symbolic configurations possess deep, widespread cross-cultural recognition rather than being vanishingly rare anomalies.

    Steelman for the convergence and independent invention hypothesis: When these superficial resemblances are subjected to rigorous archaeological, stratigraphic, and functional examination, the apparent transmission chains fragment completely. The birdman petroglyphs on Rapa Nui's Hoa Hakananai'a (DEEP-C059) do not belong to an archaic horizon; peer-reviewed analysis (DEEP-E068, DEEP-E069) proves they were carved as secondary additions centuries after the statue's erection, aligning with a demonstrably late, local ethnohistoric tradition separated by ten millennia from the Near East. Similarly, the 'handled bags' collapse under contextual scrutiny: the Assyrian banduddû is a textualized water bucket for ritual sprinkling (DEEP-C044, DEEP-E055), the Jiroft chlorite artifact exhibits wear consistent with suspension on a cord (DEEP-C009, DEEP-E035), and the Göbekli Tepe Pillar 43 reliefs remain functionally indeterminate with excavators entertaining architectural readings (DEEP-C012, DEEP-E028). Crucially, the Göbekli excavation team explicitly notes that 'far too many missing links' exist to trace iconographic continuity even locally within Upper Mesopotamia, let alone trans-oceanically (DEEP-C072, DEEP-E061).

    Sensitivity analysis: The single evidence record whose removal would most alter this case verdict is DEEP-E020 (the civiliser lineup ranking rate). If DEEP-E020 were removed, the case verdict would shift from weakly_supported to contradicted, as the ledger would retain no empirical evidence demonstrating above-chance clustering among claimed cross-cultural pairs, leaving the field entirely to functional divergence, chronological gulfs, and stratigraphic decoupling. The current weakly_supported verdict survives only because DEEP-E020 preserves a measurable, albeit methodologically preliminary, signal of perceived cross-cultural narrative alignment.
  steelman: >-
    The 62.5% first-place matching rate in the blind civiliser lineups (DEEP-C027) demonstrates an empirical degree of structural narrative alignment across distant mythologies (such as Oannes, Viracocha, and Quetzalcoatl) that significantly exceeds the 9% random baseline and remains unaddressed by material constraints or independent environmental convergence.
