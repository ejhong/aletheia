  synthesis: >-
    The featured hypothesis is taken to be that a substantial part of the
    resemblances among these distant images and stories derives from a shared
    past or transmission, rather than independent convergence or later
    retelling. The admitted evidence establishes or provisionally supports
    several local propositions, but those propositions do not collectively
    identify that historical cause. The excavation team's 2016 statement
    supports DEEP-C012: the meaning or function of the three forms on Pillar 43
    was not then securely identified. The Pitts et al. abstract supports
    DEEP-C059 by placing the birdman-related bas-reliefs after the statue's
    manufacture. The Vidale and Micheli abstract provisionally supports the
    single-object wear interpretation assessed under DEEP-C009. These are
    useful chronological or functional distinctions, but none demonstrates a
    chain connecting Göbekli Tepe, Assyria, Rapa Nui, or the Americas.

    The strongest admitted positive comparative signal is DEEP-C027. The
    founder reports that claimed civiliser partners ranked first in 62.5% of
    completed lineups, compared with 9% for random pairs. That is potentially
    discriminating, but DEEP-E020 and DEEP-E021 are self-reports without the
    run data, the number and treatment of incomplete runs, source-level
    passages, or independent replication. DEEP-C053 is also provisionally
    supported within the Mesopotamian material: the description of Oannes and
    a secondary scholarly alignment with U-An provide part of an
    Oannes–apkallu correspondence. This is evidence about continuity or
    identification inside a historically connected textual and iconographic
    setting, not evidence of the much wider cross-cultural transmission at
    issue.

    The cautionary side is stronger methodologically but still not a decisive
    disproof. DEEP-C038 is weakly supported by the report that kind-matched
    controls changed an image-lineup result, showing that comparison-set
    construction may drive apparent resemblance. DEEP-C072 is well supported
    as a report of an excavation team member's position that too many
    intermediate links are missing to establish survival of Göbekli Tepe
    imagery into later Near Eastern material. DEEP-C012 leaves the Göbekli
    handled forms functionally unidentified, so visual similarity to a known
    Assyrian ritual bucket cannot presently be converted into shared function.
    DEEP-C059 also prevents the manufacture date of Hoa Hakananai'a from being
    used uncritically as the date of its birdman composition.

    Several potentially decisive experimental claims remain unevidenced:
    DEEP-C057's reported failure of the three-motif bundle to stand out,
    DEEP-C031 and DEEP-C054's flood-text patterns, and DEEP-C037's alleged
    inter-judge disagreement lack admitted records stating their results.
    Consequently, the ledger neither supplies an audited positive bundle
    analysis nor an audited null result. A general scientific prior counts
    against inferring a single remote source from geographically and
    chronologically dispersed, broadly defined motifs, because common animals,
    bodily metaphors, practical object shapes, and civiliser narratives have
    multiple plausible generative routes. That is explicitly a prior, not a
    finding of these records, and it cannot turn missing links into proof of
    independent invention.

    The result is therefore unresolved rather than contradicted or supported:
    genuine local resemblances and one unaudited lineup signal exist, but no
    admitted evidence discriminates shared transmission from convergence and
    retelling across the full case. For sensitivity, DEEP-E020 is the single
    record whose removal would most alter the balance, because it contains the
    numerator of the only quantitative positive comparative signal,
    DEEP-C027. The unresolved verdict survives its removal, although the
    affirmative side would become materially weaker; the verdict therefore
    does not hang on that record.
  steelman: >-
    The assessment does not explain the reported V1 civiliser-lineup contrast:
    claimed partners ranked first in 62.5% of completed lineups, compared with
    9% for random pairs. A preregistered blind replication using original
    passages, matched narrative controls, and human raters could show that the
    shared package of arrival, civilising instruction, and departure is too
    specific and stable to dismiss as generic resemblance; the present ledger
    contains no such replication or source-level audit.
