  verdict: mixed
  loadBearing: [DEEP-C027, DEEP-C057, DEEP-C059, DEEP-C012]
  weakestLinks: [DEEP-C027, DEEP-C057]
  synthesis: >-
    The admitted evidence falls into three strata that pull against each other. The primary-source
    stratum grounds individual objects locally: Schmidt's own note describes the Pillar 43 forms by
    shape only (DEEP-E025, attached to DEEP-C067) and the excavation team publishes that no final
    decision on their meaning is possible (DEEP-E028, attached to DEEP-C012); the Vidale & Micheli
    abstract reads the Jiroft wear as long cord-suspension but for a single object and, by the
    authors' words, "far from being granted" (DEEP-E035, DEEP-E038); the Pitts et al. abstract
    sequences Hoa Hakananai'a as statue then komari then birdman reliefs (DEEP-E068, DEEP-E069,
    attached to DEEP-C059), anchoring that birdman imagery to a late, local, ethnohistorically
    recorded cult rather than to remote antiquity; and the Berossus fragment grounds the Oannes
    template textually (DEEP-E043, DEEP-E044, DEEP-E046). The site's own statistics stratum gives
    baseline frequencies (55%, 37%: DEEP-E013, DEEP-E016) hedged by the author's coverage
    qualifications (DEEP-E018, DEEP-E019) and the negative result that the three-motif bundle does
    not stand out (DEEP-C057). The one positive, transmission-adjacent result is the V1 lineup
    (62.5% vs 9%: DEEP-E020, DEEP-E021, attached to DEEP-C027) — but it is a self-report whose run
    data were not retrieved, and the site's own agenda (DEEP-R003) names the confound that
    compressed modern retellings could manufacture the similarity; the method pilots add that
    kind-matching changes lineup results (DEEP-E022, attached to DEEP-C038). Thirteen of the
    twenty-five graded claims are held on source alone with no admitted evidence record, so the
    hypothesis's navel, Viracocha, flood-pilot and judge-agreement limbs are entirely untested here.
    The verdict is therefore mixed as a substantive finding: admitted evidence simultaneously
    contains one unrebutted above-chance similarity result favoring real correspondence and several
    findings favoring late, local, undecided or non-co-occurring readings, with the decisive
    transmission question untested. Sensitivity: the single most consequential record is DEEP-E020
    (with its duplicate DEEP-E021); remove it and DEEP-C027 loses all its evidence, no admitted
    record would any longer point toward the shared-past reading, and this mixed verdict would not
    survive — it would collapse to a ledger whose positive findings all favor convergence, retelling
    or local explanation. The negative side of the mixed verdict rests on DEEP-E018/E019 and
    DEEP-E068/E069, themselves abstract-level and author-qualified, so neither limb is heavy.
  steelman: >-
    DEEP-E020 and DEEP-E021 record that in the site's V1 lineups the claimed civiliser partner ranked
    first in 62.5% of completed lineups against 9% for random pairs — a roughly seven-fold
    above-chance correspondence between civiliser narratives from unconnected traditions, of which
    the fish-cloaked, sea-arriving, arts-bringing Oannes (DEEP-E043, DEEP-E044, DEEP-E046) is the
    fully documented type. No admitted record in this ledger explains that above-chance result: the
    retelling confound is only a proposal in the open research item DEEP-R003, not a completed
    human-rater rerun, and no admitted record shows the lineup design failing on civiliser material
    specifically (DEEP-E022 concerns the image pilots). A proponent can rightly say the ledger's own
    positive similarity finding stands unrebutted.
claimAssessments:
  - claimId: DEEP-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; it rests on the founder page alone. The
      methodological principle is plausible as a stated prior — dating and context are standard
      requirements for historical reading of resemblance — and the ledger's practice instantiates it
      (DEEP-E025, attached to DEEP-C067, records a shape-only description; DEEP-E028, attached to
      DEEP-C012, records a declined functional decision), but no record tests the principle itself.
      The strongest opposing consideration is simply that nothing admitted either establishes or
      exercises it.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only records attached to it, DEEP-E018 and DEEP-E019 (also attached to DEEP-C005,
      DEEP-C025 and DEEP-C056), are the author's own scope qualifications — uneven catalogue
      coverage, broad categories not the specific images — which narrow the result without
      establishing it. The negative comparative result itself ("their bundle does not stand out") is
      the founder's self-report of an unaudited experiment whose method and data are not in hand.
      The strongest opposing consideration is that no independent check exists that the
      documentation-preserving comparisons were performed as described.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021, both attached to this claim, record the page's self-reported 62.5%
      versus 9%; the run data were not retrieved and "completed lineups" implies unenumerated
      incomplete runs. The strongest opposing consideration is the site's own flagged confound: its
      research agenda (DEEP-R003) states V1 cannot distinguish similarity of the original accounts
      from similarity manufactured by compressed modern retellings, and no human-rater rerun exists
      in the ledger.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. As a stated prior, retelling layers demonstrably
      exist — the source notes for SRC-VERBRUGGHE-1996 record Berossus surviving only through
      Polyhistor and Syncellus with excerptors' interpolations — but no ledger record documents a
      retelling in which detail converged relative to earlier attested versions, which the truth
      condition requires. DEEP-E046, attached to DEEP-C092, grounds what Oannes taught but not any
      convergence across versions.
  - claimId: DEEP-C035
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E061 and DEEP-E062, attached to DEEP-C072,
      record the excavation team's agnosticism about "missing links", which is consistent with the
      principle but concerns dated intermediates rather than what resemblance can carry. The
      principle is plausible as a prior — identity, date and capability claims plainly need evidence
      beyond shape — but the ledger has not instantiated it.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E061 and DEEP-E062, attached to DEEP-C072,
      bear on the neighbouring point that no dated intermediate chain is established, but no record
      runs the stated-models comparison the truth condition demands. As a prior, underdetermination
      of process from geographical distribution is a standard problem in comparative diffusion
      studies; that is a prior, not ledger evidence.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013, attached to DEEP-C005, and DEEP-E016, attached to DEEP-C025, record the site's
      self-reported frequencies for the bird and serpent classes only; DEEP-E018 and DEEP-E019
      qualify the coverage. No record reports any frequency for the sacred-centre class, so one of
      the three limbs rests on nothing admitted. The strongest opposing consideration is that every
      figure is a self-report of an experiment whose data were not retrieved.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 record the page's statement of its own 55%-of-926 result; DEEP-E015
      was redirected by its second reader as a qualification rather than support, and DEEP-E018 and
      DEEP-E019 carry the author's own warning that the 2016 catalogue's coverage is uneven,
      particularly for the ancient Near East and Rapa Nui. The coded data themselves were never
      retrieved, so the truth condition — that the coded data reproduce the proportion — is
      unverified. The strongest opposing consideration is the entirely self-reported, unaudited
      footing of the figure.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 supports the 37% figure as the page's statement of its own result; DEEP-E017 and
      DEEP-E018/DEEP-E019 qualify its scope and the catalogue's uneven coverage. As with DEEP-C005,
      the coded data are not in hand and the number is a self-report. The strongest opposing
      consideration is that nothing independent reproduces the coding on which the percentage
      depends.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E071 and DEEP-E072, attached to DEEP-C080,
      show the Rapa Nui reliefs are read as narrating a myth recorded in the 19th–20th centuries,
      and DEEP-E081, attached to DEEP-C021, sharpens Urfa Man's distinct gesture, but nothing in the
      ledger sorts the compared bird-images into the three categories or shows the compared images
      fall into different ones. The three-way distinction is plausible as a prior; the ledger
      contains no comparative record exercising it.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069, both attached to this claim, record Pitts et al.'s published relative
      sequence — statue made, komari subsequently added, bas-relief carvings succeeding them — which
      directly establishes that the birdman carvings postdate the statue's manufacture. The support
      is abstract-only and relative rather than absolute, which is the strongest opposing
      consideration; but it is peer-reviewed, on point, and recorded at moderate strength.
  - claimId: DEEP-C065
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E025, attached to DEEP-C067, and DEEP-E028,
      attached to DEEP-C012, illustrate the separation — the excavator describes shape and declines
      any functional identification — but an instance is not the general methodological claim. As a
      stated prior, the form/function distinction is standard in material-culture studies; the
      ledger has not tested it.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055, attached to this claim, records the ritual water-and-sprinkling use of the
      banduddû, but only through a secondhand, unchecked blog transcription of Wiggermann 1992 whose
      transliterations are visibly garbled, and the cone/purifier half of the claim is explicitly
