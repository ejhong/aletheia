  synthesis: >-
    The ledger's admitted evidence consists largely of the founder's own unaudited self-reports of catalogue frequencies, lineup rates and pilot outcomes (DEEP-E013 through E022, E018-E019), plus a handful of primary or near-primary observations on specific objects: Schmidt's shape description and the team's explicit refusal of a secure functional reading for the three Pillar 43 forms (DEEP-E025, E028), the Vidale & Micheli abstract's cord-suspension wear reading limited to one specimen (DEEP-E034-E035, E038), Pitts et al.'s relative sequence placing Hoa Hakananai'a birdman reliefs after manufacture (DEEP-E068-E069), Dietrich's informal missing-links comment (DEEP-E061-E062), and Berossus F1 plus the translators' table on the fish-form Oannes/apkallu alignment (DEEP-E043, E075-E076, E079). These establish local facts—function uncertain at Göbekli, wear consistent with hanging on the single Jiroft piece, birdman carvings later additions, no demonstrated continuous chain of imagery, Oannes described as fish-cloaked and matched by scholars to U-An—yet none supplies dated intermediates, shared sound/meaning, or a statistical excess of the motif bundle beyond documentation-preserving baselines. The catalogue self-reports state that broad bird-person and cosmic-serpent classes are widespread (55 %, 37 %) while their three-class bundle does not stand out, and the image pilots report that kind-matching alters rankings; both are weak because method and raw data remain unretrieved. Methodological claims that resemblance alone is insufficient, that shape and function are distinct, or that stories converge under retelling have no attached evidence records at all and therefore cannot be graded beyond source assertion. Taken together the record leaves the founding question—how much cross-cultural resemblance records shared deep past versus independent invention, material constraint, later addition or comparative retelling—unresolved: the positive observations are compatible with both sparse local continuity and pure convergence, the negative or cautionary ones (uncertain function, missing links, later carvings, non-outstanding bundle) undercut strong transmission or lost-civilisation readings without positively demonstrating independent invention for every motif, and the bulk of the statistical and lineup results rest on unaudited self-report. No evidence record demonstrates a mechanism that would force a shared-source verdict, nor a comprehensive disproof that would force a pure-convergence verdict. The case therefore remains open pending primary data, full experiment audits and intermediate-link tests already flagged in the research agenda.
  steelman: >-
    The V1 civiliser lineup's reported 62.5 % first-rank rate for claimed partner figures (versus 9 % random) remains an unexplained excess under the self-report; if the underlying passages truly share distinctive civilising-teacher structure beyond generic hero motifs, that residual similarity is still unaccounted for by the present evidence of later additions, missing links or catalogue baselines.
