  synthesis: >-
    The case divides sharply between chemical feasibility, particular
    observations, and archaeological attribution. Ingredient availability is
    the strongest component: GEO-C011 is established by the documented ancient
    natron industry, and ordinary materials-science plausibility makes some form
    of mineral-bound artificial stone credible in principle. The evidence for
    large ancient-feasible limestone blocks is much weaker, however, relying
    chiefly on a proponent organization's uncharacterized demonstrations and a
    room-temperature C-S-H feasibility experiment that contains no archaeological
    material. Feasibility therefore does not establish occurrence at any
    monument.

    The strongest argument for casting is the convergence of Barsoum's reported
    anomalous pyramid microconstituents, MacKenzie et al.'s independent NMR
    technique on a Bent Pyramid casing sample, and the reported interior
    carbon- and nitrogen-bearing amorphous matter in Pumapunku fragment PP1.
    These are materially more probative than morphological anecdotes, tool-rate
    puzzles, salt taste tests, or reinterpretations of murals. The narrow version
    of GEO-C030 also survives: a trace-element quarry match alone cannot exclude
    manufacture from aggregate originating at the matched quarry. Thus,
    provenance evidence should not be presented as a universal test against
    casting.

    The strongest argument against the featured hypothesis is more extensive.
    For the Great Pyramid, field petrography reports intact sedimentary bedding,
    fossils, burrows, tectonic fractures, and tool marks, while multiple
    laboratory examinations report natural limestone textures and no proposed
    geopolymer binder. GEO-E020 is especially important because it compares
    casing stone with both natural Tura limestone and a genuine manufactured
    geopolymer positive control, finding the manufactured signature absent from
    the casing samples. This does not test every conceivable binder or every
    pyramid block, but it directly defeats the original alkali-aluminosilicate
    diagnostic. The salt line also fails as a discriminator: instrumental work
    confirms halite on pyramid surfaces while reporting halite at other Egyptian
    limestone sites and describing a natural sedimentary source.

    The Andean branch remains weaker but not cleanly refuted. Its reported
    interior organic-bearing material is not explained by simple surface dirt,
    yet PP1 was a loose fragment selected outside the protected monument area,
    no natural Khapia andesite control was analyzed, EDS did not identify the
    alleged organic compound, and no independent replication or radiocarbon
    result is present. Consequently, the Egyptian attribution is contradicted
    by the present comparative record, whereas the Andean attribution is only
    weakly supported. That branch-level divergence, rather than mere uncertainty,
    warrants a mixed case verdict; the broad existential claim GEO-C022 itself
    remains unresolved because the tested negatives do not cover every monument
    while no provenance-secure, independently replicated positive establishes
    one.

    The single record whose removal would most change the assessment is GEO-E020,
    because its positive-control design supplies the clearest direct negative
    test of a proposed casting signature. Without it, GEO-C020 would move closer
    to mixed, but the case verdict survives: GEO-E018, GEO-E019, and GEO-E021
    still favor natural Great Pyramid limestone, while the Pumapunku evidence
    retains its provenance and control problems.
  steelman: >-
    The Bent Pyramid NMR result remains unexplained: its analysts reported
    spectra consistent with Tura limestone grains cemented by an amorphous
    calcium-silicate gel, while the ledger's strongest positive-control negative
    tested an alkali-aluminosilicate geopolymer rather than an aged C-S-H binder.
    No blinded replication using provenance-secure casing samples, broad natural
    limestone controls, and aged C-S-H positive controls has answered that
    observation.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No provenance-secure, independently replicated result in the ledger
      establishes cast stone at a major monument. The strongest opposing
      consideration is that the Great Pyramid negatives concern sampled blocks
      and particular binder models, while the Pumapunku interior anomaly remains
      an unresolved positive observation; neither can settle this geographically
      broad existential claim.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E012 and GEO-E017 provide genuine supporting analyses, but both rely
      on very small sample sets, and the former has disputed provenance.
      GEO-E018 through GEO-E021 report natural sedimentary structures, natural
      petrography, and no proposed geopolymer signature; GEO-E020 is strongest
      because it includes a manufactured positive control. The strongest
      opposing consideration is that its negative control addresses the
      alkali-aluminosilicate recipe rather than the revised C-S-H binder, and no
      finite sample set excludes every pyramid block.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The same proponent team reports petrographic and SEM features interpreted
      as artificial in both monument materials, providing a positive but
      unreplicated evidential line. The strongest opposing consideration is that
      the andesite result rests on a loose fragment of insecure architectural
      provenance, lacks a natural Khapia andesite control, and does not
      molecularly identify the purported organic binder. Quarry attribution in
      GEO-E008 is less decisive because aggregate taken from that quarry could
      retain its provenance signature.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006, GEO-E007, and GEO-E058 establish the claim as phrased: published
      analyses report organic or amorphous material and their authors argue for
      an artificial origin. The strongest opposing consideration is that PP1
      was an unattributed loose fragment and lacked a natural andesite control,
      but those limitations weaken the authors' interpretation rather than the
      fact that the analyses and argument were reported.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E057 directly quotes the analysts' account that PP1 was selected by
      appearance from loose debris outside the protected monument area rather
      than sampled from an identified block. The strongest opposing
      consideration is that such debris could still have originated from an
      architectural stone, but that possibility does not restore a documented
      object identity or excavation context.
  - claimId: GEO-C918
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E058 directly records that the analysts cut the interior subsample
      PP1C and reported similar carbon- and nitrogen-bearing matter beneath
      plagioclase crystals. The strongest opposing consideration is that EDS is
      elemental rather than molecular and the result comes from the same team
      and insecurely provenanced fragment, but the claim only states what they
      reported.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly reproduces the 2020 model's description of natural
      Khapia andesite sand stored at Iwawe and its rejection of the quadrangular
      piedras cansadas as building material. The strongest opposing
      consideration is that only the proponent paper's abstract was read, but
      that abstract is sufficient to establish this theory-description claim,
      not the model's archaeological truth.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 reports laboratory replication of an acid-medium mechanism, but
      supplies no recipe, measurements, durability data, or product
      characterization and used modern chemicals rather than the proposed
      ancient inputs. GEO-E059 further leaves the guano identification unresolved
      between residue and binder. The strongest opposing consideration is the
      authors' own statement that plant acids do not disaggregate andesite, so
      the full durable-stone process under pre-industrial conditions has not
      been demonstrated by the supplied records.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow methodological point that XRF- or ICP-based
      provenance matching cannot by itself distinguish a natural block from a
      composite made largely from material at the matched source. The strongest
      opposing consideration is GEO-E020, which shows that binder-aware
      petrography with a positive control can detect a manufactured matrix when
      present; XRD can likewise provide phase information, making the claim
      overbroad if read as applying to all listed techniques or all combined
      analyses. The defensible conclusion is limited to trace-element quarry
      matching alone.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports multi-ton demonstration blocks, and GEO-E022 shows that a
      lime-diatomaceous-earth mixture can form a C-S-H cementing phase at room
      temperature. These results, together with general materials-science priors,
      make reconstituted limestone plausible in principle, but the prior is doing
      appreciable work because the demonstration blocks were not independently
      characterized. The strongest opposing consideration is the absence of a
      documented independent large-block replication using only specified
      ancient materials and process controls.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E016 cites early glassmaking as a precedent for reaching approximately
      850 °C with charcoal-and-bellows technology. General pyrotechnological
      background makes such temperatures plausible at small scale, but that is a
      prior rather than a demonstrated result in this packet. The strongest
      opposing consideration is that the cited Badari dating and temperature
      basis remain unverified and crucible-scale heating does not establish
      sustained industrial-scale natron processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 directly documents Wadi el Natrun and al-Barnuj as major ancient
      natron sources and describes their replacement by plant ash during the
      seventh to ninth centuries AD. GEO-E011 independently supplies the
      compositional framework used to distinguish natron and plant-ash glasses.
      The strongest opposing consideration is that this literature concerns
      vitreous materials rather than stone manufacture, which limits its
      implications but not the local historical claim.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 supplies only an unattributed report of rock-like material forming
      in a repeatedly used outdoor fire pit. That anecdote gives the claim some
      directionally favorable evidence but does not establish the chemistry,
      hardness, reproducibility, or discovery pathway. The strongest opposing
      consideration is the complete absence of a controlled replication.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the specified photogrammetric removal rate of
      216 cm³ per hour at 85 strikes per minute. The strongest opposing
      consideration is that one team, granite, tool configuration, and operator
      do not establish a universal ancient quarrying rate, but the claim is
      correctly limited to the controlled measurement itself.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E002 provides only a secondary characterization that Engelbach used a
      brief personal trial and heuristic workforce estimates, while explicitly
      stating that the characterization had not been checked against the
      monograph. It does not verify the claim's detailed dimensions, depth,
      assumed 8 mm-per-hour rate, labor spacing, or qualification about
      hand-use. The strongest opposing consideration is therefore the lack of a
      directly extracted evidence record from Engelbach for this compound
      historical claim.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitor attempts with dolerite pounders have not
      reproduced a scoop mark, which supports the claim at an anecdotal level.
      The strongest opposing consideration is that neither the number and
      duration of attempts nor the resulting test-block wear was systematically
      recorded, so the asserted decades-long null result cannot be audited.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports both the approximate shaft depth and the proposed
      biomechanical difficulty of striking effectively at the bottom. The
      strongest opposing consideration is that the shaft dimensions have not
      been independently surveyed and no posture or impact experiment tests the
      asserted impossibility, leaving this as an unverified field
