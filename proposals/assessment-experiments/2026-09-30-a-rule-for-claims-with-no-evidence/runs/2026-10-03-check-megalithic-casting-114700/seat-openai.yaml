  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The salt report is carried only by an uncited proponent webpage, while
      GEO-E027 finds no salt or wall coating in al-Suyūṭī's collected accounts
      of al-Ma'mun's breach and GEO-E029 documents the missing medieval citation.
      GEO-E028 also supports approximately 832 rather than the webpage's 820,
