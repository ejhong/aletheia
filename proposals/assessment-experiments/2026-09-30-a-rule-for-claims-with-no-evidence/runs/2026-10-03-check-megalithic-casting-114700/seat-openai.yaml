      opposing consideration is that not every medieval Arabic source has been
      checked, so the absent report could still be found elsewhere; on the
      supplied record, however, the claimed accounts are not substantiated.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms surface halite in the Great Pyramid, but
      it does not measure the comparative concentration required by the claim.
      GEO-E031 reports halite efflorescence at other Egyptian limestone sites,
      including the carved-bedrock Sphinx, and GEO-E032 supplies a natural
      sedimentary explanation for NaCl in Giza limestone. The strongest opposing
      consideration is that no controlled quantitative comparison with matched
      natural monuments or unworked quarry faces has yet been performed, but the
      asserted comparative absence is contrary to the available qualitative
      evidence.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports that XRD and SEM-EDX of the sampled
      efflorescence and detached material identified halite, calcite, and quartz,
      with no nitrates or evidence of widespread gypsum crusts. The strongest
      opposing consideration is the stated XRD detection limit and the restricted
      sampling of salt-affected surfaces, but the claim accurately describes the
      study's scoped analytical result.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports Na and Cl in detached substrate material and relays Klemm
      and Klemm's interpretation of halite within Giza stratigraphic layers as
      sedimentary precipitation from evaporating marine or lagoonal waters. The
      strongest opposing consideration is that Klemm and Klemm were not read
      directly and no unworked bedrock core or quarry-face sample was analyzed
      in the supplied study. The evidence therefore supports, but does not yet
      firmly establish, the geological generalization.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 gives a concrete and relevant example: records of 1995–1997
      interventions inside the Khufu pyramid are unavailable even though
      cleaning, filling, sulfur-rich restoration material, and recurrent
      efflorescence are evident. The strongest opposing consideration is that
      one monument cannot substantiate the worldwide assertion that almost no
      megalithic site has a complete published restoration history. It
      establishes the confound's reality at Giza but only weakly supports the
      global prevalence claim.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 establishes that Fóti has argued that the Rekhmire scene's scale
      and apparatus fit mineral or waterglass processing better than bronze
      casting. No inscriptional, residue, tool, or comparative iconographic
      evidence in the packet independently supports that reinterpretation. The
      strongest opposing consideration is the conventional metal-casting
      reading, which remains unrebutted here rather than being displaced by the
      proponent's visual argument.