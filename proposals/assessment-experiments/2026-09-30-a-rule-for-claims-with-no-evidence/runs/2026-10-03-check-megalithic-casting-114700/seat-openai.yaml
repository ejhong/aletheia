  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 identifies local Pharaonic quarries for pounder-sized dolerite
      tool blanks near Aswan working areas, weighing against the premise that the
      spheres were transported there for a fundamentally different activity.
      Their quarry-landscape association favors use as stone-working tools over
