  synthesis: >-
    The case's honest centerpiece is a gap: the one class of study that could
    settle casting — blinded, provenance-secure, positive-controlled analysis
    of monument stone — has never been run, and the ledger documents that gap
    rather than papering over it. Steelmanning the featured hypothesis: the
    only two non-proponent laboratory results (Barsoum 2006's SEM/TEM
    microconstituents and MacKenzie 2011's NMR reading of a Bent Pyramid
    casing stone as Tura grains in an amorphous calcium-silicate gel) are
    real observations in credible venues, the natron supply chain is
    mainstream-established (GEO-E010), the trace-element methods critique
    (GEO-C030) correctly identifies a genuine blind spot in quarry-matching
    chemistry, and the pounding-rate anomaly (GEO-C001) is a real
    peer-reviewed measurement the orthodox account has not absorbed. Against
    it: Jana 2007 is the only study in the exchange with a positive control,
    it demonstrates that a genuine casting signature is detectable when
    present, and it found that signature in none of the casing stones;
    Folk & Campbell document in-situ sedimentary bedding, burrows and clam
    cross-sections across many blocks that casting must strain to explain;
    the salt line that once anchored the natron reading has collapsed (halite
    effloresces at the Sphinx and other never-cast Egyptian limestone sites,
    and Klemm & Klemm report it native to Giza strata); and the entire Andean
    branch rests on one team's analyses of loose debris fragments with no
    geological andesite comparator. The verdict is weakly_supported rather
    than mixed because the better-designed evidence runs against the
    hypothesis, and rather than contradicted because the revised C-S-H
    binder variant of GEO-E017 lies outside every negative study's test and
    the Andean branch is unresolved, not refuted. Structural finding: no
    claim's support is independent of its proponents except the Egyptian
    materials line, whose own authors hedged and whose samples lack secure
    provenance. The research agenda (blinded NMR with aged C-S-H controls,
    PP1 refit, Stratum V composition, halite-in-bedrock check) is well
    aimed at exactly the missing discriminators.
  steelman: >-
    The revised C-S-H binder hypothesis survives every negative study on the
    ledger: Jana 2007's positive control tested only the alkali-aluminosilicate
    geopolymer recipe, so its decisive null never touched the
    lime-diatomaceous-earth binder that MacKenzie 2011 actually reports from
    real Bent Pyramid casing stone (a -84 ppm Q1 shoulder and dominant -111
    ppm silica resonance that no examined natural limestone shows), and
    Barsoum's "hydrated phases not known to hydrate in nature" observation on
    pyramid samples has never been explained under any natural account. The
    single experiment that would retire or confirm this — GEO-R017's blinded
    multinuclear NMR against a stratified natural quarry suite with aged C-S-H
    controls — has never been performed, and until it is, no study on this
    ledger can claim to have tested the binder chemistry the proponents now
    actually assert.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The master claim rests on two evidential legs of different quality: the
      Egyptian line has the only non-proponent laboratory support (GEO-E012,
      GEO-E017) but its samples have contested provenance and its anomalies
      were matched in natural limestone by Jana's positive control
      (GEO-E020); the Andean leg is entirely single-team with an
      uncontrolled, provenance-loose sample (GEO-E057, GEO-E060). The
      strongest opposing consideration is that no study with a positive
      control and provenance-secure samples has ever tested either monument
      class, so the claim is neither established nor refuted — genuine but
      weak support.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Positive: Barsoum 2006's hedged microstructural anomalies and
      MacKenzie 2011's independent-technique NMR result on a Bent Pyramid
      casing stone. Negative: Folk & Campbell's in-situ sedimentary features,
      Harrell & Penrod on the Lauer sample, Jana's positive-control petrography,
      and Freestone & Middleton's multi-technique natural reading, plus the
      collapse of the salt evidential line (GEO-E031, GEO-E032, GEO-E033).
      The balance is genuinely contested because the strongest negative
      (GEO-E020) tests only the alkali-geopolymer recipe and not the C-S-H
      binder of GEO-E017, and the strongest positives rest on samples whose
      provenance the SCA disputes.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The only support is the proponents' own SEM/petrographic work on
      samples selected from loose debris outside the protected area
      (GEO-E057), with no geological andesite comparator by the authors' own
      admission (GEO-E060), an unresolved binder-versus-guano ambiguity
      (GEO-E059), and an announced 14C date never located (GEO-E066). The
      1971 provenance attribution (GEO-E008) is the conventional counter,
      qualified but not erased by the methods critique. Neither side has
      produced a discriminating result, so the claim cannot be resolved on
      this ledger.
  - claimId: GEO-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The papers exist in peer-reviewed venues and do report what the claim
      says (GEO-E006, GEO-E007), and the interior occurrence beneath
      plagioclase crystals (GEO-E058) is the strongest part, defusing simple
      surface contamination. The strongest opposing consideration: the
      "organic matter" is an EDS elemental signal never molecularly
      characterized (GEO-E059), amorphous pockets in this andesite were
      already noted in 1892 (GEO-E061), and no natural Khapia control was
      ever run (GEO-E060), so the "inconsistent with natural volcanic stone"
      step is asserted, not demonstrated.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a provenance fact about sampling, stated in the
      proponents' own fuller account and verified against the retrieved text
      (GEO-E057): PP1 was chosen from loose fragments outside the protected
      monument area by its flat surface, with no object number or documented
      refit. This is the rare claim where the strongest opposing
      consideration — that the fragment could still derive from an
      architectural block — is explicitly acknowledged by the source and
      does not alter what the claim states.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is framed as what the analysts report, and the text is
      verified (GEO-E058): an interior subsample PP1C shows the same C- and
      N-bearing amorphous spectrum at several spots, including beneath two
      plagioclase crystals. Confidence is capped because it is a single-team,
      single-fragment EDS observation with no independent verification and no
      molecular characterization; the claim as stated is accurate but the
      underlying finding is unreplicated.
  - claimId: GEO-C903
    verdict: established
    confidence: moderate
    reasoning: >-
      The verified abstract of SRC-DAVIDOVITS-2020 (GEO-E035) states every
      element the claim attributes to the 2020 model: uncrushed natural
      Khapia andesite sand stored at Iwawe Stratum V, and non-use of the
      piedras cansadas. Confidence is moderate rather than high only because
      the PDF body was inaccessible and the record rests on the abstract;
      the opposing consideration (that the model is a proponent
      self-description, not a validated account of the archaeology) bears on
      GEO-C021, not on this descriptive claim's accuracy.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage chemistry is asserted by the proponents, but the
      ledger's own extraction shows the replication used modern chemicals
      with no data or product characterization, that plant acids disaggregate
      limestone but not andesite, and that early attempts to re-harden
      softened stone failed (GEO-E064, with a recorded second-reader dissent
      on direction). The guano-hardener identification is unresolved even by
      the authors (GEO-E059). Feasibility under pre-industrial conditions is
      claimed, not shown.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The core chemistry is sound and human-reviewed (GEO-E024): PXRF and
      ICP-MS cannot detect H, C, or O, and stone cast using aggregate from
      the matched quarry would carry that quarry's metallic fingerprint, so
      trace-element quarry matching cannot by design separate carved from
      cast-from-aggregate stone. The strongest opposing consideration is
      Jana 2007 (GEO-E020), which shows the limitation does not extend to
      binder-aware petrography — and the claim's inclusion of XRD in the
      blind list is overstated, since XRD resolves mineral phases and is
      exactly what found no zeolite in GEO-E018. As a claim about
      trace-element provenance methods, it holds.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Feasibility is partially demonstrated: the Geopolymer Institute reports
      multi-ton re-agglomerated limestone demonstration blocks (GEO-E013) and
      the C-S-H binder route is established chemistry at room temperature
      (GEO-E022), while Barsoum's samples show rapid-precipitation phases
      consistent with the mechanism (GEO-E012). The strongest opposing
      consideration: the demonstration blocks are self-reported with no
      independent analysis, modern know-how does not establish ancient
      capability, and at-scale feasibility of the natron route is expressly
      untested (GEO-C519 context).
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The ledger support is weak (Badari glassmaking precedent, GEO-E016,
      flagged for verification and scale caveats), but the claim is modest
      and aligns with uncontroversial pyrotechnology background: pre-pyramid
      Egypt practiced copper metallurgy and faience/glass production requiring
      comparable or higher temperatures with charcoal. The strongest opposing
      consideration is the source's own caveat — crucible-scale heat is not
      industrial-scale processing — which bears on feasibility at pyramid
      scale, not on the achievability the claim asserts.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 is mainstream, peer-reviewed, and directly on point: Wadi el
      Natrun and al-Barnuj as primary ancient sources with a documented 7th-9th
      century decline, uncontested by anything in the ledger. The only
      opposing consideration is that the paper concerns the glass industry
      and says nothing about stone-making — which limits what this fact
      supports downstream, not the claim itself.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The entire support is one unattributed anecdote in a proponent text,
      flagged as under-sourced by the project's own skeptical review, with no
      controlled replication (GEO-E015). The strongest opposing
      consideration is the complete absence of any systematic observation or
      experiment showing ash-carbonation can produce structurally competent
      stone in fire-pit conditions; GEO-R007 exists precisely because this
      has never been tested.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A controlled, peer-reviewed photogrammetric measurement with the
      figures confirmed at verification (GEO-E001), and it is the only modern
      quantitative measurement of dolerite-pounder effectiveness. Confidence
      is capped because it is a single study, single team, single granite and
      tool configuration, and skilled ancient crews could plausibly
      outperform the experimental protocol — the authors' own
      against-pounders-alone conclusion is an interpretation, not part of the
      measurement.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      This is a detailed description of Engelbach 1922's experimental basis,
      but the ledger's only record touching it (GEO-E002) states the
      characterization comes from Fóti and "has not been verified against the
      1922/1923 texts." No evidence record confirms the one-hour trial, the
      5 mm figure, the groove-spacing inference, or the rammer-rate
      assumption against the primary document, so the claim — however
      plausible — currently rests on an unverified second-hand account and
      cannot be graded.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The observation is reported only by a proponent source, is anecdotal,
      and lacks any quantification of attempt rates, cumulative effort, or a
      systematic wear survey of the test block (GEO-E003). The strongest
      opposing consideration: untrained visitors failing to reproduce a
      skilled craft outcome is weak evidence even at face value, and nothing
      in the ledger distinguishes "cannot be done" from "not yet done
      competently."
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The shaft geometry is described only in a proponent text, never
      independently surveyed, and the biomechanical impossibility claim is
      untested (GEO-E005). The strongest opposing consideration: workers can
      kneel, use extended handles, or work in relay in narrow shafts, and
      Engelbach's own prospecting-pit reading of similar holes (GEO-R013
      context) offers an orthodox explanation that has never been measured
      against the casting reading.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      No evidence record supports the non-pounding purpose; the strongest
      relevant record (GEO-E045) actively undermines both premises — Kelany
      et al. document the pounder raw material in dykes within the Aswan
      granitoids and purpose-built Pharaonic tool-production quarries
      adjacent to the working areas, contradicting the "transported to
      Aswan" framing and situating the spheres in a local pounding industry.
      Confidence is low only because the survey does not directly test what
      the pounders struck, and Engelbach's contrary 1922 opinion on sourcing
      is unresolved in the ledger.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The ledger's only carrier of the salt report is an uncited proponent
      webpage dated to the wrong year (GEO-E029, GEO-E028), and the principal
      medieval compilation of the breach accounts — read and verified —
      contains no mention of salt in any of its three relevant passages
      (GEO-E027), shifting the burden to whoever asserts the report.
      Unresolved rather than contradicted because the compilation is a
      15th-century secondary assembly and the primary Arabic sources (al-Maqrīzī's
      Khiṭaṭ, Abd al-Latif, Vyse's extracts) remain unread per the agenda
      (GEO-R001); a decisive verdict would outrun the record.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The presence half is confirmed by modern instrumentation (GEO-E030),
      but the load-bearing comparative premise — that comparable natural
      limestone monuments do not show this — fails twice: halite efflorescence
      is documented at the Sphinx, White Monastery, Lisht and Saqqara
      (GEO-E031), and halite is reported native to the Giza nummulitic
      limestone strata themselves (GEO-E032), so salt on the blocks is
      expected under the carved account and does not discriminate. The
      proponents' cathedral comparator was the wrong control, and no
      concentration comparison has ever been run.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      The claim reports what Sessa et al. found, and the verified text
      confirms it directly: XRD of seven samples identified only halite,
      calcite and quartz, with no nitrates and no evidence of widespread
      gypsum crusts (GEO-E030). The only caveat — XRD's sub-5 wt% detection
      limit — is stated by the authors themselves and does not touch the
      finding as the claim reports it.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim explicitly frames itself as what Klemm & Klemm hold "as cited
      by Sessa et al. 2026," and the verified Sessa text supports exactly
      that attribution (GEO-E032). The strongest opposing consideration is
      the second-hand chain: Klemm & Klemm 2010 was not read directly, and
      Sessa's "inherent components" inference rests on detached fragments
      rather than cored stone, so the underlying geological claim is one
      step removed from every record in the ledger.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E034 documents a concrete instance exactly matching the claim at
