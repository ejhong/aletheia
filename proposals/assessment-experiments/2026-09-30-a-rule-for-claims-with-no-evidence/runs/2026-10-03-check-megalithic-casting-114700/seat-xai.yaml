  synthesis: >-
    The featured hypothesis — that at least some major megalithic monuments
    contain cast rather than purely carved stone — remains weakly supported
    as an existence claim and is not established for any named monument on
    the present ledger. The Egyptian branch (GEO-C020) is the better-tested
    of the two main attribution lines and is presently the weaker of the two
    under binder-aware petrography. Barsoum 2006 (GEO-E012) and the related
    MacKenzie NMR result (GEO-E017) supply the strongest non-proponent
    laboratory positives: unusual Si-Ca-Mg microconstituents, hydrated
    phases not known to form in nature, and an amorphous calcium-silicate
    gel reading on a Bent Pyramid casing stone. Those observations are real
    but diagnostically contested. Folk & Campbell (GEO-E018), Harrell &
    Penrod on the Lauer sample (GEO-E019), Jana’s positive-control
    comparison (GEO-E020), and Freestone & Middleton (GEO-E021) report
    ordinary sedimentary and tectonic fabrics, tool marks, opal-CT
    lepispheres shared with natural limestone, and — decisively in Jana —
    the absence of the Na+K+Al binder enrichment that a genuine Davidovits
    geopolymer limestone displays. Sample-authenticity disputes and the
    shift from alkali-aluminosilicate to C–S–H binder chemistry leave a
    narrow residual possibility, but the bulk of multi-technique work on
    casing and interior stone reads as natural Mokattam/Tura limestone.
    The salt line that once buttressed the Egyptian claim (GEO-C003,
    GEO-C506) collapses under Sessa et al. 2026: halite is the observed
    efflorescence phase, is reported at the carved-bedrock Sphinx and other
    Egyptian limestone monuments, and is cited as a primary sedimentary
    constituent of Giza nummulitic limestone; the medieval salt-layer
    anecdote remains unanchored in the al-Suyūṭī compilation. Mechanism
    claims fare better than attribution. Natron sources and medieval
    supply decline are established (GEO-C011); ~850 °C pyrotechnology is
    provisionally available at crucible scale (GEO-C010); and limestone
    reconstitution is chemically feasible in modern demonstrations
    (GEO-C012), though ancient-scale fuel and process economics remain
    untested. GEO-C030 correctly notes that metallic-trace quarry-matching
    is blind to binder light elements, so provenance matches alone cannot
    close the case — yet Jana’s control shows that binder-aware petrography
    is not similarly blind, which bounds the methods critique. The Andean
    branch (GEO-C021, GEO-C004) rests on a single team’s SEM/EDS of loose
    andesite debris collected outside the protected area (GEO-C913), with
    no geological andesite comparator (GEO-E060), unresolved nitrogen
    quantification, and no published 14C on the reported interior organic
    matter (GEO-C918). The 2020 model’s Khapia sand / Iwawe Stratum V
    prediction (GEO-C903) is checkable and still unchecked. Tool-mark and
    rate observations at Aswan (GEO-C001, GEO-C002, GEO-C006) raise
    legitimate questions about pounder-only orthodoxy but do not themselves
    demonstrate casting; dolerite tool quarries adjacent to the working
    faces (GEO-E045) undermine the exotic non-pounding reinterpretation
    (GEO-C511). Restoration-history gaps (GEO-C594) correctly caution
    every surface reading. Steelman against the hypothesis: sedimentary
    fabrics, positive-control negatives, native halite, insecure Andean
    sampling, and the absence of any independent binder confirmation on
    provenance-secure monument stone. Steelman for it appears in the
    dedicated field below. Net: mechanism fragments and a handful of
    unresolved microstructural anomalies keep the existence claim alive at
    low confidence; no load-bearing attribution is well supported, and the
    Great Pyramid casting claim is closer to contradicted than to
    provisionally supported on the ledger as it stands.
  steelman: >-
    Barsoum 2006’s SEM/TEM microconstituents (Si-Ca-Mg ratios absent from
    the six local quarry comparators, hydrated phases not known to hydrate
    in nature, nanocrystalline Si phases consistent with rapid precipitation
    from basic solution) and MacKenzie 2011’s NMR reading of an amorphous
    calcium-silicate gel cementing Tura grains in a Bent Pyramid casing
    stone remain unrebutted as raw observations on the specific specimens
    examined; no subsequent study has re-analysed those same Barsoum
    specimens with a stratified natural-limestone baseline and aged C–S–H
    positive controls, so a proponent can still hold that the microstructural
    anomalies are real and currently unexplained by the natural-limestone
    accounts that address other samples.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The existence claim inherits only weak, non-independent positives from
      the Egyptian and Andean branches and faces strong petrographic negatives
      on pyramid stone. No single monument has a provenance-secure,
      independently replicated binder signature. Strongest opposing
      consideration: Jana’s positive-control work and the multi-author
      natural-limestone petrography make the best-studied candidate (Giza)
      read as carved stone, leaving the claim dependent on thinner Andean
      and residual microstructural threads.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Folk & Campbell, Harrell & Penrod, Jana, and Freestone & Middleton
      report sedimentary bedding, fossils, tectonic fractures confined to
      blocks, shared opal-CT lepispheres, and absence of the alkali-Al binder
      enrichment that a real geopolymer control displays. Barsoum 2006 and
      MacKenzie 2011 remain the best positives but rest on contested sample
      provenance and a revised C–S–H chemistry that Jana did not test; they
      do not overcome the broader in-situ and comparative record. Strongest
      opposing consideration: the residual unexplained Barsoum
      microconstituents on the specific specimens he examined.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Support is confined to the Davidovits team’s SEM/EDS of Pumapunku
      material reporting organic/amorphous features and surface morphology
      read as mold signatures, plus a restated 2020 model. Undermined by
      insecure sample context (loose debris), absence of any geological
      andesite control, unresolved binder-versus-residue chemistry, and the
      older Ponce provenance attribution for the sandstones. Strongest
      opposing consideration: without a Khapia comparator and documented
      monument refit, the organic-matter observation cannot be shown to be
      non-natural or even from an architectural block.
  - claimId: GEO-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The published SEM/petrographic papers do report organic matter and
      microstructural features that the authors argue are inconsistent with
      natural volcanic stone; that reporting fact is well attested in the
      ledger. The claim is about what the analyses report, not whether the
      interpretation is correct. Strongest opposing consideration: the same
      sources disclose no natural andesite control, insecure fragment
      provenance, and only elemental (not molecular) characterisation, so
      the inconsistency argument is untested.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      The authors’ own 2019 account states that the andesite fragments,
      including PP1, were chosen from debris lying outside the protected
      monument area by appearance of a flat surface. No contrary sampling
      record appears in the ledger. Strongest opposing consideration: none
      material; ‘outside the protected area’ does not by itself prove the
      fragments are unrelated to architecture, but the claim as stated is
      about selection context and is accurate.
  - claimId: GEO-C918
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The same 2019 account reports that interior subsample PP1C showed
      EDS spectra matching the surface organic matter, including material
      beneath plagioclase crystals. That is the strongest part of the
      andesite organic-matter line. Strongest opposing consideration: single
      fragment, same team, EDS only, no molecular ID, and no published 14C
      follow-up despite being announced.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      The 2020 abstract explicitly specifies uncrushed natural andesite sand
      from Cerro Khapia stored at Iwawe Stratum V and states that the
      quadrangular piedras cansadas were not used as building material. The
      claim is a theory-description claim and matches the primary statement.
      Strongest opposing consideration: only the abstract was available;
      body text might refine details, but the listed elements are on the
      record.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage plant-acid / crushed-rock / guano hardener pathway is
      described in the proponent literature and a laboratory replication with
      modern chemicals is asserted, but no recipe data, product
      characterisation, or pre-industrial input trial is in the ledger.
      Plant acids are stated not to disaggregate andesite itself. Strongest
      opposing consideration: feasibility under truly ancient inputs remains
      unshown; the claim’s ‘durable artificial stone under pre-industrially
      accessible conditions’ overreaches the reported modern-chemical test.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      XRF and ICP-MS are in fact blind to H, C, and O, so a metallic
      quarry match cannot by itself distinguish carved stone from cast stone
      made with aggregate from the same quarry; Fóti’s methods critique and
      the Nash 2020 example illustrate the point. Jana’s positive-control
      petrography shows the critique does not extend to binder-aware
      microscopy, which bounds but does not refute the claim as stated.
      Strongest opposing consideration: over-extension of the critique to
      all materials analysis, which the claim’s own wording and Fóti’s
      petrography exemption avoid.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Davidovits demonstration blocks and the Sierra et al. lime–diatomaceous
      earth C–S–H work show that reconstituted limestone hard enough to pass
      visual and hardness comparison can be made with materials and ambient
      or modest temperatures. Ancient scale, durability matching pyramid
      stone, and exact recipe remain unproven. Strongest opposing
      consideration: modern feasibility is not occurrence; no independent
      analysis of a proponent demonstration block is published.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Charcoal-and-bellows pyrotechnology reaching the ~850 °C natron-melt
      range is consistent with known ancient glass and metal practice; the
      ledger’s support is mainly proponent citation of Badari-period
      glassmaking. Crucible-scale heat is not demonstrated at industrial
      stone-processing scale. Strongest opposing consideration: scale-up
      fuel demand and process control are untested in the provided evidence.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006 identify Wadi el Natrun and al-Barnuj as primary
      ancient Egyptian natron sources for the vitreous industry and document
      decline and replacement by plant ash in the 7th–9th centuries AD.
      Sayre & Smith supply the compositional typology behind supply
      timelines. Strongest opposing consideration: the sources address glass
      and faience, not stone-making; availability is established, use for
      stone is not.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only support is an unattributed fire-pit anecdote in Fóti, flagged
      as under-sourced in the project’s own review, with no controlled
      replication. Plausible as a discovery narrative but not evidenced.
      Strongest opposing consideration: absence of any experimental
      confirmation that long-cycle ash-carbonation yields structurally
      stone-like material.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Marčiš et al. 2023 report the photogrammetric rate of roughly 216 cm³/h
      at 85 strikes/min and conclude against pounders as sole method. Single
      study and configuration, but the measurement itself is clear.
      Strongest opposing consideration: skilled ancient crews with maintained
      tools might outperform the experimental protocol; replication is still
      needed.
  - claimId: GEO-C502
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim restates Engelbach’s experimental basis as characterised in
      the proponent literature (one-hour trial, ~5 mm depth, heuristic
      workforce). GEO-E002 flags that the characterisation should be checked
      against the 1922 text; until that verification is complete the
      detailed figures remain provisional. Strongest opposing consideration:
      possible mischaracterisation of Engelbach’s own qualifications about
      hand-pounding.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti reports collective visitor failure to reproduce a scoop mark on
      the designated test block; the report is anecdotal, with unquantified
      attempt rates and no wear survey. Consistent with a difficult
      pounder-only task but weak as evidence. Strongest opposing
      consideration: tourists are not trained quarry workers; absence of
      documented success is not a controlled negative.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Supported only by Fóti’s dimensional and biomechanical description;
      shafts are not independently surveyed in the ledger and the
      ‘too narrow for effective strikes’ claim is untested. Strongest
      opposing consideration: Engelbach’s prospecting-pit reading and the
      absence of measured geometry or residue data (see research agenda).
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Kelany et al. 2009 place dolerite pounder raw material in dykes within
      the Aswan granitoids and identify Pharaonic tool-production quarries
      with pounder-sized blanks adjacent to the working areas, undercutting
      both exotic transport and a primary non-pounding purpose. Wear and
      association with extraction debris further support pounding use.
      Strongest opposing consideration: Engelbach’s older opinion that
      pounder stone was not local, and the logical possibility of dual use.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The ledger’s only carrier of the salt-layer report is an uncited
      proponent webpage dating the event to 820 AD. Al-Suyūṭī’s compilation
      of the principal medieval accounts of al-Maʾmūn’s breach describes
      finds in detail and mentions no salt; Nemoy dates the Egyptian stay to
      832. Other Arabic sources remain unchecked, but the claim as stated
      lacks a traceable anchor. Strongest opposing consideration: a still-
      unread primary (e.g. full Maqrīzī or ʿAbd al-Laṭīf) might yet contain
      the report.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Sessa et al. confirm NaCl efflorescence in the Queen’s Chamber but
      also document halite at the Sphinx, other Egyptian limestone monuments,
      and as a cited primary constituent of Giza nummulitic limestone; the
      ‘comparable monuments do not exhibit it’ clause fails. Proponent taste
      tests are uncontrolled and use the wrong comparator (European
      cathedrals). Strongest opposing consideration: bulk versus surface
      distribution is untested because no cores were taken.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      Sessa et al. 2026 XRD and SEM-EDX of efflorescence and detached
      fragments report only halite, calcite, and quartz, with no nitrates
      and no evidence of widespread gypsum crusts. The measurement claim
      matches the paper. Strongest opposing consideration: XRD detection
      limit below ~5 wt% could miss minor phases; sampling was
      surface/detached only.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. cite Klemm & Klemm 2010 for halite as a primary salt in
      Giza nummulitic limestones precipitated from evaporating marine or
      lagoonal waters, and read Na/Cl in detached substrate as inherent.
      Second-hand but consistent. Strongest opposing consideration: Klemm &
      Klemm not read directly; confirmation on unworked quarry faces remains
      the decisive check (GEO-R010).
  - claimId: GEO-C594
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. supply a concrete Giza instance: 1995–97 cleaning and
      cavity filling with no available documentation, sulfur-rich modern
      fill on interior walls, and rapid reappearance of efflorescence. The
      generalisation to ‘almost no megalithic site’ is broader than one
      monument but directionally supported and widely recognised as a
      methodological risk. Strongest opposing consideration: the claim is
      universal; systematic multi-site documentation is still thin in the
      ledger.
  - claimId: GEO-C005
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim records that the Rekhmire mural has been argued to fit
      mineral processing; the argument is Fóti’s interpretive reading.
      Conventional Egyptology reads metal casting and has not engaged the
      reinterpretation in the provided evidence. Strongest opposing
      consideration: without epigraphic or residue predictions tested, the
      reinterpretation remains untested opinion.