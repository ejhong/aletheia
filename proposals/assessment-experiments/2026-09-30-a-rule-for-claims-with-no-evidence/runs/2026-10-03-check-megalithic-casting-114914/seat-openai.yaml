  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides a concrete example at Khufu: documentation for
      1995–1997 interventions is unavailable despite evidence of cleaning,
      cavity filling, and sulfur-rich restoration material. This supports the
      stated contamination concern for a central monument in the case. The
      strongest opposing consideration is scope: one documented example
      cannot establish that almost no megalithic site worldwide has a complete
      restoration history.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 documents Fóti's argument that the Rekhmire scene's scale and
