  synthesis: >-
    The case separates into an Egyptian branch, an Andean branch, and a
    general feasibility argument. The Egyptian attribution is the most
    thoroughly tested and currently weighs against casting. GEO-E012 reports
    unusual microconstituents interpreted as rapid precipitation from a basic
    solution, and GEO-E017 reports an NMR result interpreted as natural
    limestone grains cemented by an artificial calcium-silicate gel. Those are
    genuine pro-casting observations, not arguments from outsider status.
    However, their sample sets are small, provenance is disputed for some
    material, and the proposed binder changed from an alkali-aluminosilicate
    geopolymer to a calcium-silicate hydrate. Against them, GEO-E018 reports
    widespread sedimentary bedding, fossils, burrows, tectonic fractures, and
    tool marks in pyramid blocks; GEO-E020 finds no alkali-geopolymer signature
    while successfully detecting that signature in a positive control; and
    GEO-E021 independently identifies a Cheops casing fragment as natural
    limestone. The salt argument adds little: GEO-E030 confirms halite
    efflorescence, but GEO-E031 and GEO-E032 report comparable Egyptian
    occurrences and a natural sedimentary mechanism, while GEO-E027 and
    GEO-E029 leave the alleged medieval salt-layer account without a traceable
    source.

    The Andean branch supplies the strongest route by which the broad
    existential hypothesis could remain true. GEO-E006, GEO-E007, and GEO-E058
    report amorphous carbon- and nitrogen-bearing matter, including material
    inside a fragment beneath plagioclase crystals. This is harder to dismiss
    as mere surface dirt. Yet GEO-E057 establishes that the critical andesite
    fragment was selected from loose debris outside the protected monument
    area, GEO-E060 states that no geological andesite control was tested, and
    GEO-E059 records that the proposed guano or binder identity could not be
    determined. Thus the observation is real as a report about PP1, but its
    transfer to identified Pumapunku architecture and its diagnosticity for
    manufacture are not established. The sandstone provenance result in
    GEO-E008 favors natural quarry sourcing, although it does not logically
    exclude reconstitution from material originating at that quarry.

    Mechanistic feasibility is appreciably stronger than archaeological
    occurrence. Ancient natron availability is well supported, temperatures
    around 850 degrees Celsius are plausible on general pyrotechnological
    priors, and modern materials science shows that mineral binders can form
    at low temperature. Nevertheless, self-reported demonstration blocks and
    laboratory work with modern reagents do not establish an ancient
    production chain, its scale, or its use at any monument. GEO-C030 is
    correct in its narrow warning that an elemental provenance match alone
    cannot distinguish a block from a hypothetical composite made from the
    same source material. It becomes overbroad when extended to XRD,
    microscopy, binder-phase analysis, or petrography, especially because
    GEO-E020 demonstrates that a known artificial positive control can be
    distinguished from the tested casing stones.

    The strongest case for casting is therefore not numerology, unexplained
    logistics, or consensus criticism; it is the combination of two Egyptian
    laboratory anomalies and the reported interior organic phase in
    Pumapunku andesite. The strongest case against is that better-controlled
    petrography finds natural fabrics in Egyptian specimens, while the
    Andean result lacks secure architectural provenance, natural controls,
    and independent replication. This warrants an unresolved case verdict:
    the flagship Great Pyramid attribution is contradicted by the admitted
    evidence, but the broader existential claim is not globally falsified,
    and the remaining positive Andean line is too weakly anchored to establish
    it. The single sensitivity record is GEO-E020, because its positive-control
    design most directly defeats the claim that analytical methods simply
    cannot see a binder. Removing GEO-E020 would materially weaken the
    anti-casting assessment of the Egyptian branch, but the case verdict
    survives as unresolved because GEO-E018 and GEO-E021 remain, while the
    Andean provenance and control defects remain unchanged.
  steelman: >-
    The assessment does not answer GEO-E017's specific NMR observation that a
    Bent Pyramid casing sample resembles Tura limestone grains cemented by an
    amorphous calcium-silicate gel. GEO-E020 tested an alkali-aluminosilicate
    geopolymer rather than this revised calcium-silicate binder, and no admitted
    record reports a blinded replication using provenance-secure casing stone,
    broad stratigraphic natural-limestone controls, and aged calcium-silicate
    positive controls.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No admitted record establishes cast stone in an identified major
      monument. The Egyptian records attached to GEO-C020, especially
      GEO-E018, GEO-E020, and GEO-E021, weigh against that principal example,
      while GEO-E006 and GEO-E007, attached to GEO-C004 and GEO-C021, provide
      a positive but provenance-insecure Andean line. The strongest
      consideration toward support is the conjunction of the Egyptian
      microstructural anomaly in GEO-E012, attached to GEO-C012 and GEO-C020,
      and the reported interior organic phase at Pumapunku; neither securely
      establishes architectural attribution.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 reports natural sedimentary and tectonic features across many
      pyramid blocks, GEO-E020 finds no alkali-geopolymer binder signature
      despite detecting one in a positive control, and GEO-E021 independently
      identifies a Cheops casing fragment as natural limestone. GEO-E012 and
      GEO-E017 are the strongest opposing considerations, reporting
      microstructural and NMR anomalies interpreted as artificial binders, but
      both have small comparison sets and unresolved sampling or replication
      problems. The revised calcium-silicate interpretation in GEO-E017 was
      not tested by GEO-E020, preventing high confidence.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report petrographic anomalies and organic matter
      interpreted by their authors as evidence of artificial Pumapunku stone.
      Their weight is sharply reduced by GEO-E057's loose-fragment sampling
      context, GEO-E060's absence of a geological andesite control, and the
      lack of independent replication. GEO-E008 is the strongest opposing
      consideration because it attributes the sandstone to natural quarries,
      although quarry provenance alone does not exclude use of aggregate from
      the same source.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006 and GEO-E007 directly document that published SEM and
      petrographic analyses report the claimed features and interpret them as
      inconsistent with natural stone. GEO-E058 further records the analysts'
      report of similar carbon- and nitrogen-bearing matter in an interior
      subsample. The strongest opposing consideration concerns implication,
      not the local reporting claim: GEO-E057 and GEO-E060 show insecure
      architectural provenance and no natural andesite comparator, so the
      reported observations do not establish casting.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. GEO-E057, attached to
      GEO-C004 and GEO-C021, reports that PP1 was selected from loose debris
      outside the protected area and therefore provides indirect support, but
      it is the proponents' own account and does not independently establish
      the fragment's full provenance. The strongest opposing consideration is
      that being outside the protected area does not itself prove that the
      fragment was unrelated to an architectural block.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. GEO-E058, attached to
      GEO-C004, reports that PP1C was cut from the fragment's interior and
      contained similar matter beneath plagioclase crystals, but this remains
      a same-team report from the same insecurely provenanced fragment. The
      strongest opposing consideration is that EDS did not identify the
      compound molecularly and no independent replication is admitted.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly quotes the 2020 abstract describing natural Cerro
      Khapia andesite sand stored at Iwawe and rejecting the quadrangular
      piedras cansadas as building material. Because the claim describes
      Davidovits' model rather than asserting that the model is true, this is
      direct evidence. The strongest opposing consideration is that only the
      abstract was read, leaving the full paper's qualifications unchecked,
      but the abstract is explicit on all elements stated here.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 reports the proponents' assertion that an acidic-medium binder
      mechanism was reproduced in a laboratory, but no recipe, measurements,
      durability data, or product characterization were supplied, and modern
      chemicals replaced the proposed ancient inputs. GEO-E059 further records
      that the analysts could not determine whether the observed matter was
      unreacted guano or binder. The strongest opposing consideration is the
      source's admission that plant acids do not disaggregate andesite and
      that earlier attempts to re-harden softened stone failed.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow point that XRF and ICP-MS cannot directly
      measure hydrogen, carbon, or oxygen, so an elemental quarry match alone
      cannot exclude a hypothetical composite made from the same source
      material. The claim overreaches by grouping XRD and other analytical
      approaches under the same blindness and by implying that materials
      analysis generally cannot distinguish a binder. The strongest opposing
      consideration is GEO-E020, which used binder-aware petrography and a
      genuine artificial positive control to show that a casting signature
      was detectable when present.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large demonstration limestone blocks, and
      GEO-E022 establishes that lime and diatomaceous earth can form a
      calcium-silicate cementing phase at room temperature. A general
      materials-science prior also favors the possibility of making hard
      mineral composites without modern high-temperature cement kilns.
      The strongest opposing consideration is that GEO-E013 is self-reported
      and independently uncharacterized, while GEO-E022 tests neither ancient
      production inputs nor monument-scale manufacture.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 reports an ancient glassmaking precedent for temperatures near
      850 degrees Celsius using charcoal-and-bellows technology. The verdict
      also relies on the general pyrotechnological prior that such peak
      temperatures are attainable in suitably forced-air furnaces, rather than
      on this record alone. The strongest opposing consideration is that the
      cited Badari dating and temperature basis remain independently
      unverified and that crucible-scale attainment does not demonstrate
      industrial-scale throughput.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as principal
      ancient Egyptian natron sources used by the vitreous-materials industry
      and documents their decline and replacement by plant ash in the seventh
      through ninth centuries. GEO-E011 supplies compatible compositional
      context for distinguishing natron glass from plant-ash glass. The
      strongest opposing consideration is that these records concern glass
      and faience rather than stone manufacture, but that does not contradict
      the local availability claim.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 supplies only an unattributed anecdote that rock-like material
      formed in a repeatedly used outdoor fire pit. It gives no composition,
      mechanical testing, controlled comparison, or replication, so it cannot
      establish the proposed ash-carbonation mechanism or discovery pathway.
      The strongest consideration in its favor is that accidental
      cementitious products are chemically plausible as a prior, but the
      admitted observation is too poorly documented for more weight.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the controlled photogrammetric result of 216
      cubic centimetres per hour at 85 strikes per minute, matching the claim
      as stated. The strongest opposing consideration is that one team, one
      granite, one pounder configuration, and one protocol cannot establish a
      universal ancient quarrying rate. That limitation does not negate the
      local experimental measurement.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. GEO-E002, attached to
      GEO-C001 and GEO-C002, gives a broad characterization of Engelbach's
      brief trial and workforce estimates, but its limitations explicitly say
      that Fóti's detailed account was not checked against the 1922 or 1923
      texts. The strongest opposing consideration is that the source exists
      and may support the particulars, but an unchecked secondary
      characterization cannot establish this compound historical claim.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using dolerite pounders have failed to
      reproduce a scoop mark on the designated test block. The report is
      anecdotal, with no quantified number of attempts, cumulative effort,
      participant technique, or systematic block survey. The strongest
      consideration in its favor is the claimed long duration of the informal
      experiment, while the absence of documentation prevents treating
      apparent failure as a controlled result.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the described shaft depth and the proponent's judgment
      that the geometry prevents effective pounding at the bottom. No
      independent survey or biomechanical test is attached, so neither the
      dimensions nor the asserted impossibility are securely established.
      The strongest consideration in favor is the specific, testable
      geometric observation; the strongest opposing consideration is that
      alternative postures, tools, or a prospecting function remain untested.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite sources and apparent Pharaonic pounder-tool
      quarries within the Aswan quarry landscape, supporting a local
      stone-working industry rather than imported spheres requiring an
      alternative primary purpose. The association of blanks and pounders
      with quarrying areas weighs directly against the claim that they served
      some purpose other than pounding granite. The strongest opposing
      consideration is that GEO-E045 does not microscopically test what any
      particular pounder struck, so secondary uses remain possible.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E004 and GEO-E029 show that the salt-layer story is carried by an
