caseAssessment:
  verdict: mixed
  loadBearing: [GEO-C020, GEO-C021, GEO-C030, GEO-C004]
  weakestLinks: [GEO-C013, GEO-C002, GEO-C511, GEO-C003]
  synthesis: >-
    The case splits into three evidential theatres that behave very differently. The Egyptian branch
    is the only one with independent, adversarially tested laboratory evidence, and it nets against
    casting: Barsoum's hedged SEM/TEM anomalies (GEO-E012) and the Bent Pyramid NMR result (GEO-E017)
    are the strongest positives, but both rest on samples of disputed provenance with no independent
    replication, while Folk & Campbell's in-situ sedimentary and tectonic features across many blocks
    (GEO-E018), Harrell & Penrod's negative on the proponents' own showcase specimen (GEO-E019), Jana's
    positive-control petrography (GEO-E020), and Freestone & Middleton's independent multi-technique
    analysis (GEO-E021) collectively find natural limestone and no binder signature. Jana's positive
    control matters twice over: it shows a real casting signature is detectable when present, which
    bounds the methods critique (GEO-C030/GEO-E024) — valid against trace-element provenance, powerless
    against binder-aware petrography, and overextended where it names XRD. The salt line that once
    anchored the natron reading has largely collapsed: Sessa et al. confirm the halite is real
    (GEO-E030) but document the same efflorescence at the uncast Sphinx and other Egyptian limestone
    sites (GEO-E031) and report halite as native to Giza strata (GEO-E032), while undocumented 1990s
    interventions (GEO-E034) compound the surface-observation confound the case itself flags
    (GEO-C594). The Andean branch remains proponent-only: the organic matter reports (GEO-E006/E007,
    interior subsample GEO-E058) come from loose fragments of undocumented provenance (GEO-E057) with
    no geological andesite comparator (GEO-E060), an announced 14C date never delivered (GEO-E066), and
    an Andean chemistry whose feasibility is asserted, not demonstrated (GEO-E059, GEO-E064). The
    mechanism rung is genuinely and partly established — reconstituted limestone is chemically feasible
    (GEO-E022, GEO-E013) — but feasibility is not occurrence. Sensitivity: removing GEO-E020 (Jana
    2007) is the single change that most moves this case; GEO-C020 would fall from contradicted to
    mixed and the overall balance would sit nearer the proponents. The case verdict of mixed survives
    that removal, because the Andean positives would still be unreplicated and uncontrolled and
    GEO-E018/GEO-E021 would still stand — but the margin would be thin, and this verdict is the one
    part of the assessment that leans materially on a single conference-proceedings study with a
    disputed sample. The honest summary: one strong contested positive never independently replicated,
    one strong negative exchange, and the decisive tests (blinded paleomagnetism, PP1 provenance,
    Iwawe Stratum V) unrun.
  steelman: >-
    The Bent Pyramid casing stone shows a dominant −111 ppm 29Si resonance and a −84 ppm shoulder read
    by solid-state MAS NMR as an amorphous calcium-silicate gel binder formed "by human intervention"
    (GEO-E017) — a result with no published rebuttal, no replication attempt, and no natural-limestone
    comparator suite broad enough to exclude it, and Jana's positive-control negative (GEO-E020) by its
    own stated scope does not test a C–S-H binder at all. Joined to the carbon- and nitrogen-bearing
    amorphous matter reported inside Pumapunku fragment PP1 beneath plagioclase crystals (GEO-E058) —
    never explained by any admitted natural mechanism, with no Khapia andesite control ever run
    (GEO-E060) and the announced 14C date never published (GEO-E066) — a proponent can rightly demand
    to know what natural process these two instrument-based observations record, since nothing in the
    admitted record answers either.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: low
    reasoning: >-
      The only record attached to this claim itself is GEO-E009 (Stonehenge provenance), which
      undermines it; the substantive evidence sits on its children. Attached to GEO-C020: GEO-E012 and
      GEO-E017 support casting while GEO-E018, GEO-E019, GEO-E020 and GEO-E021 undermine it; attached
      to GEO-C021, GEO-E006/GEO-E007 support while GEO-E008, GEO-E057 and GEO-E060 qualify. The
      strongest opposing consideration is that no admitted record demonstrates cast stone at any
      monument with secure provenance and independent replication, yet the Andean branch has never
      received the adversarial testing that would refute it the way the pyramid branch has been.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The strongest admitted evidence runs against this claim: GEO-E020 is the only study with a
      positive control and found no binder signature of any kind in casing stones, GEO-E018 documents
      sedimentary bedding, burrows and block-confined tectonic fractures across many in-situ blocks
      that are hard to reconcile with casting, and GEO-E021 independently found no reaggregated
      texture or air voids. The positives (GEO-E012, GEO-E017) are hedged, unreplicated, and rest on
      samples whose provenance was publicly disputed. Confidence stays below high because Jana's
      negative tests only the alkali recipe and does not reach the revised C–S-H binder of GEO-E017,
      and the sample-authenticity disputes over the Lauer sample remain unresolved.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only positive evidence (GEO-E006, GEO-E007, plus the restatement GEO-E036) comes from one
      team on samples including a loose fragment picked from debris outside the protected area
      (GEO-E057) with no geological andesite comparator in the published work (GEO-E060), and EDS
      cannot identify the organics (GEO-E059). Against it stands only the 1971 provenance attribution
      (GEO-E008), which predates modern methods. Neither confirmation nor refutation meets the bar the
      rest of this ledger applies elsewhere, so the claim is genuinely unsettled.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, the claim is about what published SEM and petrographic analyses report, and the
      records confirm those reports exist and say this: GEO-E006 and GEO-E007 document the peer-reviewed
      claims, and GEO-E058 documents the interior subsample that blunts a simple surface-contamination
      reading. The strongest opposing consideration is that the "inconsistent with natural volcanic
      stone" portion is the authors' argument without a control — no geological andesite was compared
      (GEO-E060), nitrogen is only semi-quantitative (GEO-E059), and Stübel & Uhle's 1892 amorphous
      nests (GEO-E061) show such matter in this stone predates the hypothesis.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim itself; it is carried by GEO-E057, the record
      attached to GEO-C004 and GEO-C021, which quotes the proponents' own statement that the samples
      were chosen from loose fragments lying outside the protected monument area. Confidence is low
      because the basis is a single self-reported passage in a non-peer-reviewed transcript, and
      "outside the protected area" does not by itself exclude that the fragments derived from
      architectural blocks.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; the basis that carries it is GEO-E058, the record
      attached to GEO-C004, which reports the PP1C interior subsample and the sub-feldspar organic
      matter exactly as the claim states. Confidence is low because the observation comes from the
      same team, the same fragment of insecure provenance (GEO-E057), and EDS is elemental only, so
      the "same matter" identification is the analysts' own comparison.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E035, attached to this claim, is the primary statement of the model and matches every
      element of the claim: Khapia sand as aggregate, storage at Iwawe Stratum V, and non-use of the
      piedras cansadas. The descriptive claim is what the abstract asserts, so it is well supported.
      The opposing consideration is that only the abstract was read (the PDF returned 403), and the
      model's factual predictions — e.g. the nature of Stratum V — remain untested pending GEO-R009
      and GEO-R012.
  - claimId: GEO-C580
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim asserts that the three-stage chemistry produces durable artificial stone under
      pre-industrial conditions, and the admitted records do not show this: GEO-E064 records that
      plant acids do not disaggregate andesite at all, that the mechanism was replicated only with
      modern chemicals, and that no recipe, data or product characterization was presented, while
      GEO-E059 records the authors' own admission that they cannot distinguish unreacted guano from
      binder. Nothing in the ledger demonstrates pre-industrial feasibility; nothing rules it out
      either, so unresolved rather than contradicted.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The core point is correct for the trace-element workhorses: GEO-E024 (human_reviewed) confirms
      PXRF and ICP-MS cannot see hydrogen, carbon, or oxygen, so a same-quarry cast would carry the
      same metallic fingerprint. But the claim overreaches by naming XRD, and Fóti's own methods table
      is demonstrably wrong for NMR (GEO-E024 limitations note ²⁹Si NMR is standard and is exactly what
      the pro-casting MacKenzie study used). Decisively, GEO-E020 (attached to GEO-C020 and this
      claim) shows binder-aware petrography with a positive control detects casting signatures when
      present, so the claim's broad "cannot, by design" framing fails for the method class that
      matters most.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Feasibility is the claim's substance, and it is partly shown: GEO-E013 records demonstration
      blocks including a multi-ton limestone block from the proposed recipes, and GEO-E022 establishes
      that lime plus diatomaceous earth forms a C–S–H binder at room temperature with pre-industrially
      plausible inputs. GEO-E012's microconstituents are consistent with rapid precipitation from a
      basic solution, though the authors hedge explicitly. The strongest opposing consideration is
      that the demonstration blocks are self-reported with no independent analysis, and scale remains
      untested; feasibility is not occurrence.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E016 cites Badari-period glassmaking as a pre-pyramid precedent for ~850 °C
      pyrotechnology, but its own limitations state the dating and temperature basis need independent
      verification and that crucible-scale heat is not industrial-scale processing. General
      background knowledge that ancient kilns reached such temperatures is a prior, not admitted
      evidence. The strongest opposing consideration is that nothing in the ledger demonstrates
      sustained, large-volume heat delivery of the kind bulk natron chemistry would need.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 is a strong, mainstream, peer-reviewed record establishing Wadi el Natrun and al-Barnuj
      as the primary industrial natron sources with a documented 7th–9th century decline, and GEO-E011
      supplies the compositional typology behind supply timelines. This claim is historical and
      uncontroversial as stated. The only opposing consideration is that Shortland et al. concern
      glass and faience and say nothing about stone — but the claim does not assert anything about
      stone.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only attached record, GEO-E015, is an unattributed anecdote from the proponent text, flagged
      as under-sourced in the project's own skeptical review, with no controlled replication. The
      chemistry of ash-carbonation is plausible as background, but that is a prior, not evidence. The
      strongest opposing consideration is that a single unverified fire-pit story cannot carry a
      causal discovery-pathway claim, which is why GEO-R007 exists.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E001 documents the photogrammetric measurement and the 216 cm³/h at 85 strikes per minute
      figure in a peer-reviewed journal, and the claim asserts only what the measurement yielded. The
      opposing considerations are that it is a single study, single team, single granite and tool
      configuration, and that the authors' own inference against pounders-alone is a separate inferential
      step; skilled ancient crews may outperform the protocol. The measurement itself stands.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The closest related record is GEO-E002, attached to
      GEO-C001 and GEO-C002, which carries the proponent characterization of Engelbach's method but
      expressly states that characterization has not been verified against the 1922/1923 texts — so it
      cannot carry the claim's specific quantitative details (the one-hour trial, 8 mm/h assumption,
      one-man-per-double-foot inference). The proposition rests on its source alone, which is not
      evidence.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 is the only record bearing on the reported reproduction failures, and its own
      limitations say the account is anecdotal with unquantified attempt rates and no systematic survey
      of the test block's wear. GEO-E002 gives context on how thin the orthodox rate estimate is but
      does not document the visitor attempts. The strongest opposing consideration is that
      unmonitored, unsupervised tourist striking is a poor instrument for measuring what trained
      workers can do.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 is the sole record, and it states that the shaft dimensions were not independently
      surveyed and the biomechanical claim is untested; the observation comes from the proponent text.
      The claim is plausible as described but rests on one unsurveyed description. The strongest
      opposing consideration is that Engelbach's own test-shaft reading of these features has never
      been measured against the alternative, which is exactly what GEO-R013 proposes.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      GEO-E045, from the QuarryScapes field survey, directly contradicts the claim's premise: the
      dolerite originated from dykes within the Aswan granitoids, and purpose-built Pharaonic
      tool-production quarries were found adjacent to the working areas — an embedded local pounder
      industry, not spheres transported for another purpose. Confidence is low because the record
      itself notes it does not test what the pounders actually struck, and Engelbach's contrary 1922
      opinion on local availability is recorded as unresolved; the wear-pattern question remains open.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: low
    reasoning: >-
      The ledger's only carrier of the salt report is an uncited proponent web page (GEO-E029), and the
      principal medieval compilation of the breach accounts, al-Suyūṭī via Nemoy, mentions no salt
      anywhere in its al-Maʾmūn entries (GEO-E027); the date is also wrong, 832 not 820 (GEO-E028).
      This is strong negative evidence but not proof of non-existence, since al-Maqrīzī's full Khiṭaṭ
      and other Arabic sources remain unread. The claim survives as an open archival question, with
      the burden now on whoever asserts the report to name its author.
  - claimId: GEO-C506
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The presence half is confirmed: GEO-E030 identifies the Queen's Chamber efflorescence as halite
      with modern instrumentation, retiring the taste-test basis (GEO-E026, which is weightless — wrong
      comparator, no measurement). The comparative half — that comparable natural limestone monuments
      do not show this — is undermined: GEO-E031 documents halite efflorescence at the Sphinx and other
      Egyptian limestone sites, and GEO-E032 reports halite as a primary constituent of Giza nummulitic
      limestone, both secondhand and qualitative. Neither side has run the controlled comparison
      GEO-R010 specifies, so the claim is mixed rather than settled.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E030 directly documents the XRD and SEM-EDX findings: only halite, calcite and quartz, no
      nitrates, no widespread gypsum crusts, from a peer-reviewed open-access conservation study with
      figures. The opposing considerations are detection limits below 5 wt% that could miss minor
      sulfate phases, and that sampling covered efflorescence and detached fragments only. As a
      statement of what the analysis found, the claim is solid.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim itself; the basis carrying it is GEO-E032, attached
      to GEO-C506 and GEO-C906, which quotes Sessa et al. reporting Klemm & Klemm's reading of halite
      as a primary constituent precipitated from evaporating marine or lagoonal waters. Confidence is
      low because the underlying Klemm & Klemm 2010 was not read — the statement is secondhand — and
      the claim's geological substance has not been independently checked.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides one concrete, on-point instance at the case's most-cited monument: undocumented
      1995–97 cleaning and cavity filling inside the Khufu pyramid, with a modern sulfur-rich fill
      identified and efflorescence recurring within about two years. That supports the claim's thrust
      but not its full generality ("almost no megalithic site"), which would need the survey GEO-R005
      proposes. The strongest opposing consideration is that one documented instance cannot establish
      a near-universal absence of restoration records.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 documents that the reinterpretation exists and is argued from the mural's scale and
      apparatus, and the claim as stated only says the reading "has been argued" — which is true. But
      the record's limitations note it is an interpretive argument by a proponent that conventional
      Egyptology has not engaged. The strongest opposing consideration is that the conventional
      metal-casting reading remains the default and no period depiction is established as mineral
      processing, which is why GEO-R008 proposes a joint re-examination.
