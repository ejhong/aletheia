  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The interior-subsample observation is carried only inside GEO-E058 (attached to GEO-C004); the ledger therefore holds the proposition on its source statement alone.
  - claimId: GEO-C903
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E035 directly quotes the 2020 abstract stating the Cerro Khapia sand / Iwawe Stratum V / non-use of piedras cansadas model, so the descriptive claim about what the model specifies is accurately sourced. Strongest opposing consideration is that only the abstract was read; the full paper body remains unchecked and the model itself is untested against the excavators' descriptions (GEO-R009).
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 asserts laboratory replication of an acid-medium andesite binder with modern chemicals and GEO-E059 notes elemental similarity to guano, yet no recipe, product data or ancient-input trial is supplied and plant acids are stated not to disaggregate andesite. Strongest opposing consideration is the absence of any characterised product made from plant extracts plus guano under pre-industrial conditions.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E024 (Foti) correctly notes that XRF/ICP-MS are blind to H/C/O and default to natural-stone calibrations; GEO-E009 (Nash) and GEO-E020 (Jana) illustrate the distinction between metallic quarry-matching and binder-aware petrography. Strongest opposing consideration is that the critique does not extend to the microscopy/SEM-EDS/NMR methods actually used against the casting claim (explicitly conceded by Foti himself).
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E012/E017 document microstructures and NMR consistent with reconstituted material, GEO-E013 reports multi-ton demonstration blocks, and GEO-E022 shows room-temperature C-S-H formation from lime plus diatomaceous earth; ancient thermal and chemical inputs are separately available. Strongest opposing consideration is that feasibility demonstrations do not establish ancient occurrence, and the original alkali-geopolymer recipe is the one Jana's positive control refutes.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 cites pre-pyramid glassmaking as a temperature precedent within charcoal-bellows reach; the 850 °C figure is standard for natron silicate chemistry. Strongest opposing consideration is that crucible-scale heat does not automatically scale to the industrial volumes required for monument production, and the Badari temperature basis remains unverified in the ledger.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 (Shortland et al.) directly documents Wadi el Natrun and al-Barnuj as primary ancient sources with a clear 7th–9th-century decline and replacement by plant ash; GEO-E011 supplies the dual-oxide compositional criterion used to track that supply. Strongest opposing consideration is that the papers address glass/faience, not stone-making, but the claim as stated is only about possession and decline of the sources.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E015 is an unattributed anecdote of rock-like material in a long-cycle fire pit with no controlled replication, quantities or chemistry; the geo project's own review flags it as under-sourced. Strongest opposing consideration is the complete absence of any experimental confirmation that ash-carbonation accidentally yields structurally competent artificial stone.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E001 reports the photogrammetric measurement of 216 cm³/h at 85 strikes/min under controlled conditions and the authors' own conclusion against pounders as sole method; GEO-E002 supplies the thin Engelbach 1922 base that the modern rate revises. Strongest opposing consideration is that a single modern team and granite configuration may understate skilled ancient crews with maintained tools.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The characterisation of Engelbach appears only as editor inference inside GEO-E002 (attached to GEO-C001/GEO-C002) and has not been verified against the 1922 text itself.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 records Foti's report of collective visitor failure to reproduce scoop marks on the designated test block; the observation is real but anecdotal, with unquantified effort and no systematic wear survey. Strongest opposing consideration is the absence of controlled, timed trials by skilled operators under documented conditions.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports Foti's description of ~16 ft shafts too narrow for effective bottom-of-hole pounding posture; dimensions and biomechanics remain unsurveyed. Strongest opposing consideration is that the shafts may be prospecting or unfinished features whose geometry has never been independently measured against either the pounding or the settling-vessel hypothesis.
  - claimId: GEO-C511
    verdict: mixed
    confidence: low
    reasoning: >-
      The claim offers non-pounding functions for the dolerite spheres; GEO-E045 (Kelany) documents local dyke sources and purpose-built tool-production quarries immediately adjacent to the working faces, favouring the conventional pounding interpretation, while wear-pattern predictions remain untested. Strongest opposing consideration is the direct field association of pounder blanks with extraction debris at Aswan.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only carrier of the salt-layer report is an uncited proponent web page (GEO-E004, E029) dating the event to 820; al-Suyuti's compilation of the principal medieval accounts (GEO-E027) describes the breach and finds in detail yet mentions no salt whatever, and Nemoy dates the visit to 832 (GEO-E028). Strongest opposing consideration is that other unread Arabic sources might still contain the report, but the burden now lies on the claim to produce one.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Sessa et al. confirm surface halite (GEO-E030) but also document identical efflorescence at the Sphinx, rock-cut tombs and other Egyptian limestone monuments (GEO-E031) and cite Klemm & Klemm for halite as a primary sedimentary constituent of Giza nummulitic limestone (GEO-E032); the claim's uniqueness premise therefore fails. Strongest opposing consideration is that bulk versus surface distribution remains untested by coring, yet the comparative claim as stated is already false.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports the XRD/SEM-EDX result: only halite, calcite and quartz in Queen's Chamber and Thieves' Corridor efflorescence and detached fragments, with no nitrates and no widespread gypsum. Strongest opposing consideration is the XRD detection limit (<5 wt%) and restriction to surface material, but the claim as stated matches the published finding exactly.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 quotes Sessa et al. citing Klemm & Klemm that halite is a primary constituent of Giza nummulitic limestones precipitated from evaporating marine/lagoonal waters; the statement is second-hand but consistent across the conservation literature in the ledger. Strongest opposing consideration is that Klemm & Klemm 2010 itself has not been read, so the precise wording and context remain unchecked.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E034 supplies a concrete instance at the most-cited monument: undocumented 1995–97 cleaning and cavity-filling inside Khufu, sulfur-rich modern fills detected by XRF, and rapid re-appearance of efflorescence; the general claim about missing restoration histories follows directly. Strongest opposing consideration is that the record concerns one interior; the pattern is nonetheless expected at every heavily visited megalithic site.
  - claimId: GEO-C005
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E014 is solely Foti's interpretive re-reading of the Rekhmire mural; conventional Egyptology has not engaged it and no residue, tool or inscriptional test is supplied. Strongest opposing consideration is that the scene remains the standard metal-casting depiction in the Egyptological literature, rendering the mineral-processing alternative presently untested.