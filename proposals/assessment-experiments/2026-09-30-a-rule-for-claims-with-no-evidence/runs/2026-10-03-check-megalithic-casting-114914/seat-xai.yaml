  synthesis: >-
    The featured hypothesis asserts that at least some major megalithic blocks were manufactured by casting processed mineral aggregates rather than solely by quarrying, carving and transport. Assessment of the 24 claims against the admitted evidence records shows a clear structural split. On the mechanism rung, limestone reconstitution is chemically and thermally feasible with ancient materials (natron sources documented at industrial scale by Shortland et al., temperatures reachable by charcoal-bellows, and demonstration blocks plus room-temperature C-S-H formation from lime plus diatomaceous earth). Trace-element quarry-matching is correctly noted as blind to H/C/O binder chemistry, so a quarry match alone cannot rule out casting from same-source aggregate; Jana's positive-control petrography, however, shows that binder-aware SEM-EDS and microscopy can detect alkali-aluminosilicate signatures when present. On the observation and attribution rungs the picture is weaker. For the Great Pyramid the strongest positive is Barsoum et al. 2006 SEM/TEM microconstituents (Si-Ca-Mg ratios, hydrated phases, nanocrystalline precipitates) read as rapid basic precipitation; MacKenzie et al. 2011 NMR later reframes the binder as C-S-H rather than Davidovits geopolymer. These are offset by multiple independent petrographic campaigns (Folk & Campbell, Harrell & Penrod, Jana with positive control, Freestone & Middleton) that recover ordinary sedimentary fabrics, burrows, tectonic fractures confined to single blocks, opal-CT lepispheres identical to natural Tura limestone, and no alkali-aluminosilicate enrichment. Sample-provenance disputes (Hawass on Barsoum; Davidovits on the Lauer piece) further dilute both sides. Salt on chamber walls is real (Sessa XRD/SEM confirms only halite-calcite-quartz) but is also reported at the Sphinx and other natural Egyptian limestones and is read by Klemm & Klemm (via Sessa) as primary sedimentary; the Al-Ma'mun salt-layer anecdote lacks any traced medieval Arabic source in the ledger and is absent from al-Suyuti. For Pumapunku the sole analytical positives are Davidovits-team SEM reports of organic matter and microstructural anomalies in andesite and sandstone; both rest on the same loose surface fragments (PP1 selected by appearance outside the protected area, no geological andesite control, nitrogen only semi-quantitative, no independent replication). Conventional 1971 provenance and the absence of a published 14C date on the organics leave the Andean claim thin. Tool-mark and rate anomalies at Aswan (Marcis 216 cm3/h, tourist scoop-mark failures, narrow shafts) are real measurements or observations but do not positively demonstrate casting; they only strain the pure-pounder orthodoxy whose own experimental base (Engelbach) is thin. Soft-stone deformation signatures, nubs, bubbles and formwork claims remain largely unquantified surface morphology vulnerable to restoration confounds (explicitly documented inside Khufu by Sessa). Collectively the ledger therefore supplies a live but narrow mechanistic pathway and a handful of contested microstructural anomalies, while the bulk of binder-aware petrography and the sampling weaknesses of the proponent Andean work leave the existence claim for actual cast monuments only weakly supported. Removal of the Barsoum 2006 microstructural suite would collapse the strongest non-proponent positive and leave the case almost entirely on feasibility plus proponent self-reports, dropping the verdict to unresolved; the petrographic negatives would still stand. The case remains open principally because decisive, provenance-secure, binder-aware re-analyses with natural controls and radiometric or chlorine bulk tests have not yet been performed on the key monuments.
  steelman: >-
    Barsoum 2006 and MacKenzie 2011 still document microconstituents and NMR resonances (Si-rich hydrated phases, amorphous calcium-silicate gel signatures) that the authors themselves could not match to any of the six local natural limestones they examined and that Jana's alkali-geopolymer positive control did not fully address under the revised C-S-H chemistry; no subsequent study has yet run the identical SEM/TEM/NMR protocol on a large, ministry-authorized, stratigraphically controlled suite of Mokattam/Tura quarry faces versus casing stones under blind conditions, leaving those specific unreproduced anomalies as the strongest unanswered positive observation a proponent can still cite.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The existence claim inherits only the thin positives of GEO-C020 and GEO-C021 (Barsoum microstructures and Davidovits organics) while facing strong petrographic negatives and sampling weaknesses; no single monument has a provenance-secure, independently replicated binder signature. Strongest opposing consideration is the suite of binder-aware studies (GEO-E018–E021) that recover natural sedimentary fabrics and fail to detect the expected casting signatures on the very stones claimed.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Barsoum 2006 (GEO-E012) and MacKenzie 2011 (GEO-E017) supply the only non-proponent laboratory positives, yet Folk/Campbell, Harrell/Penrod, Jana (with positive control) and Freestone/Middleton (GEO-E018–E021) recover ordinary limestone fabrics, identical opal-CT, and no alkali enrichment; sample provenance is disputed on both sides. Strongest opposing consideration is Jana's direct comparison showing the real geopolymer binder chemistry is absent from casing stones while natural features are present.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Support rests entirely on the Davidovits-team SEM/petrography pair (GEO-E006, GEO-E007, restated in E036) reporting organics and microstructures; the same team's own account (GEO-E057, E060) admits loose unprovenanced fragments, no geological andesite control, and unresolved nitrogen speciation (GEO-E059). Strongest opposing consideration is the complete absence of independent replication or a Khapia natural comparator, leaving volcanic glass and contamination as open alternatives.
  - claimId: GEO-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006/E007/E058 report organic matter and anomalous microstructures inside Pumapunku andesite, including an interior subsample; however the material is a surface-selected loose fragment (GEO-E057), lacks any natural andesite control (GEO-E060), and the authors themselves cannot decide whether the organics are binder or unreacted guano (GEO-E059). Strongest opposing consideration is the missing geological comparator and insecure architectural attribution.
