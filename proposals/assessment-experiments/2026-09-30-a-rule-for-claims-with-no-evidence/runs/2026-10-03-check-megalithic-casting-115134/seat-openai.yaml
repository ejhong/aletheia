  synthesis: >-
    The packet does not establish that any major megalithic monument contains
    cast stone, but it also does not furnish a site-spanning disproof of that
    existential proposition. The two principal attribution branches have
    importantly different evidential profiles. For the Great Pyramid, the
    balance is adverse to casting. Barsoum's reported anomalous
    microconstituents are a genuine positive result, but their sample
    provenance is disputed and no provenance-secure replication exists.
    Against that result stand broad in-situ observations of sedimentary
    bedding, fossils, burrows and block-confined fractures, plus several
    direct laboratory examinations reporting natural limestone fabrics and
    no binder. Most importantly, GEO-E020 compared pyramid stone with both
    natural limestone and an actual Davidovits geopolymer positive control;
    the expected alkali-aluminosilicate binder signature appeared in the
    control but not in the casing stones. The salt argument does not rescue
    the Egyptian branch: instrumental work confirms halite efflorescence,
    but comparable Egyptian limestone sites exhibit halite and the packet
    supplies a natural sedimentary and humidity-mobilization explanation.
    The alleged medieval salt report is presently traceable only to an
    uncited proponent webpage and is absent from the medieval compilation
    examined.

    The strongest affirmative branch is Pumapunku. The proponents report
    carbon- and nitrogen-bearing amorphous matter inside an andesite
    fragment, including beneath plagioclase crystals, which is harder to
    dismiss as superficial dirt. Their papers also report anomalous
    sandstone and andesite microstructures. However, these findings form one
    non-independent research line. The crucial andesite fragment was selected
    from loose debris outside the protected area, has not been tied to an
    identified architectural block, was not compared with geological Khapia
    andesite, and yielded no molecular identification or published
    radiocarbon result. Those limitations prevent the observation from
    carrying the attribution claim.

    The mechanism evidence is more favorable than the occurrence evidence.
    Room-temperature calcium-silicate binding is chemically plausible,
    natron was available in ancient Egypt, and re-agglomerated limestone is
    plausible on general materials-science priors. Nevertheless,
    self-reported demonstration blocks and unspecified modern-chemical
    replications do not establish an ancient recipe, production system or
    monument. Likewise, slow pounding rates and puzzling quarry features may
    indicate supplementary techniques without selecting casting over other
    possibilities.

    The best case against the hypothesis is therefore direct: binder-aware
    petrography finds natural fabrics where casting was predicted, while the
    proposed positive signatures lack secure provenance and replication.
    The best case for it is that quarry provenance alone cannot exclude
    same-source aggregate and that two analytical programs reported possible
    binder-related anomalies. The result is unresolved rather than evenly
    balanced: the Great Pyramid branch is presently contradicted, while the
    broad existential claim remains open because the Pumapunku evidence is
    suggestive but inadequate and the hypothesis ranges beyond the tested
    specimens. The single record whose removal would most change this
    assessment is GEO-E020, because its positive-control design is the
    clearest direct test of the proposed Egyptian binder. Removing it would
    weaken the adverse Great Pyramid finding toward a more mixed judgment,
    but GEO-E018, GEO-E019 and GEO-E021 would remain; the overall unresolved
    case verdict therefore survives without GEO-E020.
  steelman: >-
    The assessment does not answer the Bent Pyramid NMR result reporting
    limestone grains cemented by an amorphous calcium-silicate gel: the
    strongest positive-control study tested Davidovits-style
    alkali-aluminosilicate geopolymer, not this revised C-S-H binder, and no
    blinded comparison against a broad natural limestone suite has determined
    whether the reported NMR signature is geological or manufactured.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No provenance-secure, independently replicated monument sample in the
      packet establishes cast stone. The Great Pyramid evidence weighs against
      casting, while the Pumapunku analyses supply a positive but
      non-diagnostic and provenance-limited line. The strongest opposing
      consideration is that an existential claim spanning many monuments
      cannot be disproved by negative examinations of selected Egyptian
      blocks.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 through GEO-E021 report sedimentary structures, natural
      limestone fabrics and an absence of the proposed geopolymer binder in
      Great Pyramid specimens; GEO-E020 adds a genuine geopolymer positive
      control. These records outweigh the provenance-contested anomalies in
      GEO-E012, while the NMR evidence in GEO-E017 concerns the Bent Pyramid
      and proposes a different binder. The strongest opposing consideration
      is Barsoum's reported rapidly precipitated and hydrated phases, which
      remain unreplicated on provenance-secure material and leave open
      heterogeneity among blocks.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The proponent team reports organic matter and unusual microstructures in
      samples attributed to Pumapunku, providing some direct support beyond
      morphology. However, the key andesite specimen was loose debris outside
      the protected area, no natural Khapia andesite control was analyzed, and
      the same team produced all of the positive findings. The strongest
      opposing consideration is that the better-provenanced sandstone result
      may still identify a genuine engineered matrix, while quarry provenance
      alone cannot exclude use of same-source aggregate.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006, GEO-E007 and GEO-E058 document that published analyses report
      organic or amorphous matter and microstructural features interpreted by
      their authors as artificial. This verdict establishes the stated
      reporting fact, not the diagnostic validity of the interpretation. The
      strongest opposing consideration is that the central andesite fragment
      lacks secure architectural provenance and a geological control, so the
      reports provide much weaker support for GEO-C021 than for GEO-C004
      itself.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E057 quotes the analysts' own account that the andesite specimens
      were selected from loose debris outside the protected monument area,
      including PP1 from a fragment lying on the ground. The strongest
      opposing consideration is that location outside the protected area does
      not prove the fragment was unrelated to an architectural block, but it
      does establish the sampling circumstance stated.
  - claimId: GEO-C918
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E058 directly records the analysts' report that PP1C was cut from
      the fragment's interior and contained the same carbon- and
      nitrogen-bearing amorphous material, including beneath plagioclase
      crystals. The claim is explicitly about what the analysts reported, so
      molecular uncertainty does not negate it. The strongest opposing
      consideration is that the result remains an unreplicated EDS
      observation from the same team and insecurely provenanced fragment.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 reproduces the 2020 abstract's description of uncrushed Khapia
      andesite sand stored at Iwawe and its statement that the quadrangular
      piedras cansadas were not used. That directly establishes the content
      of Davidovits' model as stated. The strongest opposing consideration is
      that only the abstract was read, which limits assessment of the model's
      supporting details but not of this descriptive claim.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 reports a claimed laboratory replication of an acid-medium
      mechanism, giving limited support to chemical feasibility. No recipe,
      measurements or durability characterization are supplied, modern
      chemicals replaced the proposed ancient inputs, and the authors state
      that plant acids do not disaggregate andesite. The strongest opposing
      consideration is the reported successful laboratory result, but as
      presented it does not demonstrate the durable pre-industrial process
      asserted.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 correctly narrows the point that trace-element provenance
      matching by XRF or ICP methods cannot by itself distinguish a natural
      block from a composite made predominantly from the same source
      material. The claim overreaches by grouping methods with different
      capabilities and by implying that materials analysis generally cannot
      detect a binder. The strongest opposing consideration is GEO-E020,
      whose positive control demonstrates that binder-aware petrography and
      SEM-EDS can distinguish a genuine geopolymer even when quarry
      provenance is not the question.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E022 establishes that lime and diatomaceous earth can form a
      calcium-silicate binding phase at room temperature, while GEO-E013
      reports large re-agglomerated limestone demonstration blocks. Natron
      availability and the general materials-science plausibility of
      aggregate-and-binder stone support feasibility, but that latter
      judgment partly relies on scientific prior knowledge rather than a
      complete packet replication. The strongest opposing consideration is
      that the large-block demonstration is self-reported and has not been
      independently analyzed for strength, composition or ancient-input
      fidelity.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 offers only a proponent-cited temperature precedent whose
      dating and basis still require verification. The verdict also leans on
      the general pyrotechnological prior that forced-draft charcoal systems
      can exceed 850 degrees Celsius, rather than on strong packet evidence.
      The strongest opposing consideration is that achieving the temperature
      in a small furnace does not demonstrate sustained industrial-scale
      natron processing.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as primary
      ancient Egyptian natron sources for vitreous industries and documents
      their medieval decline and replacement by plant ash. GEO-E011 provides
      compatible compositional context for distinguishing natron from
      plant-ash glass. The strongest opposing consideration is that the
      evidence does not quantify stone-production-scale supply, but that does
      not materially challenge the historical availability claim.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole support, GEO-E015, is an unattributed anecdote about rock-like
      material in a repeatedly used fire pit. No material characterization or
      controlled replication shows that ash-carbonation produced a hard
      artificial stone or a plausible discovery pathway. The strongest
      opposing consideration is that accidental cementation is chemically
      conceivable, but that is a prior plausibility judgment rather than
      evidence for the reported process.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E001 directly reports a photogrammetrically measured removal rate
      of 216 cubic centimetres per hour at 85 strikes per minute under a
      controlled tool-and-granite configuration. The claim describes that
      measured trial rather than a universal ancient quarrying rate. The
      strongest opposing consideration is the absence of independent
      replication and the possibility that skilled crews, different tools or
      other granite would yield substantially different rates.
  - claimId: GEO-C502
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E002 supports the broad characterization that Engelbach relied on a
      brief self-conducted pounding trial and heuristic workforce estimates.
      Its own limitation says the detailed characterization had not been
      checked against the monograph, so the compound claim's exact depth,
      area, rammer rate, groove inference and qualification about hand use
      are not adequately established. The strongest opposing consideration
      is that the underlying monograph exists and may confirm those details,
      but its unevaluated existence is not evidence of their accuracy here.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors have failed to reproduce a scoop mark on
      the designated Aswan block, but it supplies no attempt count, cumulative
      effort, success criterion or systematic inspection. It therefore
      supports the anecdotal observation only weakly and cannot establish a
      meaningful decades-long experimental null. The strongest opposing
      consideration is that repeated informal failure could still identify a
      real practical difficulty worthy of controlled testing.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the shafts' approximate depth and a proponent's
      biomechanical judgment that effective bottom strikes are impossible.
      Neither shaft dimensions nor worker posture and striking performance
      were independently measured. The strongest opposing consideration is
      that genuinely narrow, deep geometry could conflict with direct manual
      pounding, but the packet does not establish that geometry rigorously.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 identifies local Pharaonic tool-production quarries associated
      with dolerite and aplite dykes and discarded pounder-sized blanks,
      placing the objects within an organized quarry-tool industry. GEO-E001
      independently demonstrates that dolerite pounders do remove granite,
      even if slowly. The strongest opposing consideration is that neither
      record provides microwear analysis proving what every sphere struck, so
      secondary uses such as grinding or finishing remain possible.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only positive carrier is an uncited proponent webpage, whereas
      GEO-E027 finds no salt coating in the examined medieval compilation's
      accounts of al-Ma'mun's breach and GEO-E029 documents the missing
      attribution. GEO-E028 also corrects the webpage's 820 date toward the
      claim's approximately 832 dating. The strongest opposing consideration
      is that several other medieval Arabic texts remain unread, so a
      presently untraced report could still exist.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 confirms readily detectable halite efflorescence in the Khufu
      pyramid, but it does not supply the comparative concentration required
      by the claim. GEO-E031 reports halite at other Egyptian limestone sites,
      including the bedrock-carved Sphinx, and GEO-E032 gives a natural
      sedimentary origin for halite in Giza limestone. The strongest opposing
      consideration is that no controlled concentration study of matched
      monuments and unworked quarry faces has yet been performed.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports that XRD and SEM-EDX of the specified
      efflorescence and detached fragments identified halite, calcite and
      quartz, with no nitrates or widespread gypsum crusts. This matches the
      claim's restricted statement about the sampled Queen's Chamber and
      Thieves' Corridor material. The strongest opposing consideration is the
      stated XRD detection limit and localized, salt-affected sampling, which
      allow minor or unsampled phases but do not overturn the reported result.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports Na and Cl in detached substrate fragments and relays
      Klemm and Klemm's interpretation of halite within Giza stratigraphic
      layers as a marine or lagoonal precipitate. That supports a natural
      sedimentary origin, but the key geological source was not read directly
      and no unworked bedrock core was analyzed in the conservation study.
      The strongest opposing consideration is that the wording “primary
      constituent” may overstate evidence describing halite as the primary
      salt or a minor mineral component rather than a major rock constituent.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 supplies a concrete example at Khufu: cleaning and cavity
      filling occurred in 1995–1997 without available intervention records,
      and a likely modern sulfur-rich fill is analytically visible. This
      establishes restoration uncertainty at an important site but cannot
      support the global quantifier “almost no megalithic site.” The strongest
      opposing consideration is that the demonstrated Giza case makes the
      confound real for surface evidence even though its worldwide prevalence
      remains unmeasured.
  - claimId: GEO-C005
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E014 establishes that Fóti has argued for a mineral-processing
      interpretation of the Rekhmire scene, but supplies no independent
      iconographic, textual or residue evidence selecting that reading. The
      conventional metal-casting interpretation remains the strongest
      opposing consideration and has not been tested against the proposed
      details within this packet. The existence of a reinterpretation does
      not establish that the depicted operation was mineral casting.