  synthesis: >-
    The case divides cleanly into three evidential zones. First, the Egyptian branch: the direct petrographic record on sampled pyramid stones is strongly and independently against casting — Folk & Campbell's in-situ sedimentary features (bedding, burrows, intact clam sections, tool marks) across many blocks, Harrell & Penrod's negative on the proponents' own showcase Lauer sample, Freestone & Middleton's multi-technique natural-limestone result, and above all Jana's study, the only one with a genuine positive control, which shows that binder signatures are detectable when present and absent from the tested casing stones. The pro side's best Egyptian evidence (Barsoum 2006; MacKenzie 2011 NMR) rests on samples whose provenance was publicly disputed, has no independent replication, and in Barsoum's own words concedes nature could have produced the observed microstructures. The salt line, once a pillar, has collapsed: Sessa et al. 2026 document halite efflorescence at non-cast Egyptian limestone sites including the carved Sphinx bedrock and report Klemm & Klemm's reading of halite as native to Giza nummulitic limestone, while the interior of the chambers was cleaned and patched undocumented in the 1990s. Second, the Andean branch is genuinely open but thin: the interior carbon/nitrogen-bearing matter in PP1C is a real anomaly that surface contamination does not easily explain, yet it rests on one loose fragment of unverified provenance, analysed only by the proponents, with no geological andesite control, no 14C result despite a 2019 announcement, and an acknowledged unresolved question of whether the matter is binder or unreacted guano. Third, the methodology critique (GEO-C030) is substantially correct for trace-element provenance tools but is bounded by its own author's concession and by Jana's demonstration that binder-aware petrography is not blind. On balance the ledger contradicts casting for the stones actually tested under adequate methods, leaves the untested majority and the Andes unresolved, and supports only feasibility-level mechanism claims. Steelmanning the other direction: nothing here proves no monument anywhere was cast; it proves the tested samples were not, and that the decisive discriminating studies (blinded NMR with C–S–H controls, paleomagnetic setting tests, PP1 provenance and 14C) have not been run.
  steelman: >-
    No analysis in this ledger explains the carbon- and nitrogen-bearing amorphous matter reported beneath plagioclase crystals in the interior subsample PP1C of Pumapunku andesite (GEO-E058), corroborated by Stübel & Uhle's independent 1892 observation of amorphous pockets in the same stone; the proponents' announced 14C date on that organic matter has never been run or published, and without a geological Khapia andesite control nobody can say the feature is natural — the single cheapest decisive test in the case remains undone in the proponents' favor.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The strongest opposing consideration to any positive verdict is the binder-aware petrographic cluster (GEO-E018–E021), especially Jana's positive-control study showing casting signatures are detectable and absent from tested Egyptian stones; the strongest consideration against a negative verdict is that these tests cover only a handful of blocks and the Andean interior-organic anomaly (GEO-E058) plus the unrebutted Bent Pyramid NMR result (GEO-E017) remain open. No monument in the ledger has a provenance-secure block that survived a blinded binder-aware test as cast, but equally no test has covered the untested majority or the Andean branch. The existential claim is therefore genuinely unresolved in both directions at case scale, with quality of evidence favoring the negative on what was tested.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Four largely independent lines (Folk & Campbell in-situ sedimentary features, Harrell & Penrod on the Lauer sample, Freestone & Middleton on a British Museum fragment, and Jana with a genuine Davidovits geopolymer as positive control) converge on natural limestone for every pyramid stone examined with binder-aware methods, and the salt-based support (GEO-E004, E026) is removed by the documented natural halite in Giza limestone and elsewhere (GEO-E031–E033). The strongest opposing considerations are the sample-authenticity disputes over the Lauer piece, Jana's conference-venue status, and the fact that his negative tests only the alkali-aluminosilicate recipe, leaving the revised C–S–H binder of MacKenzie 2011 open but weakly supported, single-sample, and Barsoum-linked. On the evidence as weighed, the claim fails for the blocks and recipes actually tested.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The only positive evidence is the proponents' own SEM/petrographic work on samples of acknowledged loose, unrefitted provenance (GEO-E006, E007, E057) with no geological andesite comparator at all in the published work (GEO-E060), and the authors themselves cannot say whether the organic matter is binder or unreacted guano (GEO-E059). The opposing 1971 provenance attribution (GEO-E008) predates methods that could distinguish cast-from-aggregate stone, so it does not refute casting, but neither does anything establish it. Both sides' decisive tests — Stratum V characterization, Khapia quarry survey, a provenance-secure fragment — remain unrun, which is precisely why this stays unresolved rather than weakly supported.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is carefully scoped to what the published analyses report and argue, and the ledger confirms those reports directly, including the interior PP1C subsample (GEO-E058) and an 1892 precursor observation of amorphous pockets (GEO-E061). The strongest opposing consideration is that the features' diagnosticity is unestablished: no natural andesite control was analyzed (GEO-E060), EDS cannot molecularly identify the matter, and volcanic rocks host amorphous phases naturally. As stated — a report of what the authors found and argued — the claim stands.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The proponents' own fuller account states the sample was chosen by appearance from loose debris outside the protected monument area (GEO-E057), so the claim accurately reports the sampling context from the source's own words. The opposing consideration is that this is a single self-published proponent source and the peer-reviewed statement of the same context was not independently shown, and 'outside the protected area' does not logically exclude monument origin. Confidence is accordingly moderate rather than high despite the direct quote.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The source directly reports cutting interior subsample PP1C and finding the same C- and N-bearing amorphous spectrum beneath plagioclase crystals (GEO-E058), so the claim as a report of the analysts' findings is supported. The strongest opposing consideration is that this is the same team and the same provenance-insecure fragment as the surface finding, EDS is elemental only, and the observation is one fragment with no independent replication. It is the strongest single part of the Andean result but not independent evidence.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The abstract of the 2020 paper states the model essentially verbatim — natural Khapia andesite sand transported and stored at Iwawe (Stratum V), piedras cansadas not used (GEO-E035) — so this descriptive claim is directly anchored. The opposing consideration is that only the abstract was read (the PDF returned 403), from the proponents' own self-published journal, and the model's empirical anchor (Stratum V) is itself unverified pending GEO-R009. As a description of what Davidovits' model holds, it is supported.
  - claimId: GEO-C580
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The claimed replication is asserted without recipe, data, or product characterization, used modern chemicals rather than plant extracts and guano, and the second reader correctly notes the same source states plant acids cannot disaggregate andesite at all — so the chemistry can only agglomerate unconsolidated material, which qualifies the pre-industrial feasibility asserted (GEO-E064). The authors themselves leave the guano-hardener identification unresolved (GEO-E059). The three-stage chemistry is a hypothesis the proponents assert and have not demonstrated under the conditions the claim specifies.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The H/C/O blindness of PXRF and ICP-MS is a fact of the instrument physics, the anchor record is human-reviewed (GEO-E024), and Jana himself concedes a minor binder might not register in bulk chemistry — so for same-quarry aggregate the inference holds for those methods. The strongest opposing consideration is the claim's inclusion of XRD, which detects crystalline phases and is exactly how Folk & Campbell looked for a zeolitic binder phase, and Jana's demonstration that binder-aware petrography does see what bulk chemistry cannot; the critique is correct for its named trace-element core but overextends in scope. Confidence is moderated by that overreach, not by any failure of the core point.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Feasibility has real support: the Geopolymer Institute reports multi-ton demonstration blocks (GEO-E013) and lime plus diatomaceous earth demonstrably forms a C–S–H binder at room temperature with plausible ancient inputs (GEO-E022). The strongest opposing consideration is that the demonstrations are self-reported with no independent analysis, and feasibility is not occurrence; nothing in the ledger shows a large hard block independently verified as matching natural limestone under ancient-feasible conditions. Provisional support is the honest ceiling.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The only direct evidence is Fóti's Badari glassmaking precedent (GEO-E016), flagged as needing independent verification of both dating and temperature basis, and crucible-scale heat is not industrial-scale processing. The verdict leans substantially on background priors — pre-industrial pyrotechnology plausibly reached 850 °C — rather than on the record, and that reliance is disclosed here. Provisional is the right strength.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006, a mainstream peer-reviewed source, directly establishes the industrial natron sources and the 7th–9th century decline (GEO-E010), corroborated by the classic Sayre & Smith compositional typology (GEO-E011) and uncontroversial in the wider literature. The strongest opposing consideration is trivial: the paper concerns glass and faience and says nothing about stone-making, which limits what this claim can do for the case but does not touch its truth. As a historical claim it is established.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole support is an unattributed anecdote in a proponent book, flagged as under-sourced by the project's own skeptical review and never replicated (GEO-E015). The strongest opposing consideration is that ash-carbonation hardening is real chemistry in general, so the pathway is not implausible — but plausibility from priors is not evidence of the reported observation. No controlled test exists either way.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim reports a specific published measurement, verified as accurately characterized (GEO-E001), in a peer-reviewed venue, and the source record confirms the figure at verification. The strongest opposing consideration is that it is a single study, single team, single granite configuration, with no replication, and skilled ancient crews might outperform the protocol. As a report of a controlled measurement, it is supported.
  - claimId: GEO-C502
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is a detailed characterization of Engelbach 1922's experimental basis, but the evidence record itself states that the characterization comes from Fóti and has not been checked against the monograph (GEO-E002), and the verification batch found Fóti mischaracterizing other sources (Marčiš rate, Sayre-Smith threshold). The general shape — a brief self-trial and heuristic workforce estimates — is corroborated at the level of the source record. The specific figures therefore rest on a secondary source with a documented error rate, capping confidence.
  - claimId: GEO-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only support is Fóti's anecdote about visitor attempts, explicitly unquantified with no systematic survey of the test block (GEO-E003). The strongest opposing consideration to dismissing it is that absence of documented success in casual attempts is weak either way — unskilled tourists failing says little about trained crews. The claim cannot be confirmed or denied from this record set.
  - claimId: GEO-C006
    verdict: unresolved
    confidence: low
    reasoning: >-
      The shaft-dimension and biomechanical claims come solely from Fóti's description, with dimensions not independently surveyed and the biomechanical claim untested (GEO-E005). Engelbach's contrary reading of the shafts as prospecting pits is in the record only via the research agenda, not as evidence. The geometry claim is plausible but unmeasured; unresolved.
  - claimId: GEO-C511
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only evidence record bearing on this claim actively undermines it: Kelany et al. document the dolerite source in local dykes and purpose-built pounder-production quarries beside the working areas (GEO-E045), weighing against both the 'transported to Aswan' premise and a non-pounding function. The strongest opposing consideration is that Engelbach judged the stone not local and nothing directly tests what the pounders struck, so the alternative-use proposal is not refuted. Interpretation against moderate field evidence leaves it unresolved, leaning negative.
  - claimId: GEO-C003
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The ledger's only carrier of the salt report is an uncited proponent webpage (GEO-E029), and al-Suyūṭī's compilation of the principal medieval Arabic accounts describes the breach in detail without ever mentioning salt (GEO-E027), shifting the burden to whoever asserts the report. The strongest opposing consideration is that the compilation is negative evidence only — al-Maqrīzī's Khiṭaṭ, ʿAbd al-Laṭīf, and the Vyse extracts remain unread — so the report is neither anchored nor refuted. Unresolved, with the burden now on the claim's supporters.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim's comparative premise — that comparable natural limestone monuments do not show this salt — is directly undercut: halite efflorescence is documented at the carved Sphinx bedrock, the White Monastery, Lisht and Saqqara (GEO-E031), and Klemm & Klemm read halite as a primary constituent of the Giza nummulitic source rock itself (GEO-E032), while the proponent comparator (European cathedrals) is the wrong lithology (GEO-E026). The strongest opposing consideration is that no controlled concentration comparison has been made at Giza bedrock and quarry faces (GEO-R010), and modern instrumentation does confirm the halite's identity (GEO-E030). Salt presence is real; its anomaly is not.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim reports Sessa et al.'s XRD/SEM-EDX findings verbatim — only halite, calcite, and quartz, no nitrates, no widespread gypsum (GEO-E030) — from a modern open-access peer-reviewed conservation study read via the PMC copy. The strongest opposing consideration is the stated XRD detection limit below 5 wt%, meaning minor phases could be missed, and that the paper is second-hand for some comparisons. For the finding as stated, the support is direct and strong.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is explicitly hedged as what Klemm & Klemm are read by Sessa et al. 2026 as holding, and the source passage is quoted verbatim (GEO-E032), so as stated it is supported. The strongest opposing consideration is that the underlying Klemm & Klemm 2010 was not read — the halite-in-strata statement is second-hand, based on standardless semi-quantitative SEM-EDX of detached fragments, not cored stone. The claim survives because it claims the citation, and the citation is real; GEO-R010 should still settle the underlying geology directly.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The record supplies a concrete, documented instance at the case's most-cited monument: undocumented 1995–97 cleaning and cavity filling inside the Khufu pyramid, with restoration-related sulfur enrichment measured and efflorescence re-forming within two years (GEO-E034). The strongest opposing consideration is that one instance does not establish the sweeping generalization 'almost no site', and the claim is ai_extracted without a systematic audit behind it. Support is real but partial.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim accurately reports that a proponent reinterpretation exists (GEO-E014), and its hedged framing ('have been argued') is satisfied. The strongest opposing consideration is that the argument is interpretive, unengaged by Egyptology, and the conventional bronze-casting reading stands unrefuted; the mural's evidential value for casting is therefore minimal. Weak support for the argued status, not for the reinterpretation itself.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This is a measurement-report claim and the measurement is real, peer-reviewed, and verified as characterized (GEO-E001), with the caveat that it is a single team and configuration. The strongest opposing consideration is that the Marčiš study's authors themselves conclude it argues against pounders as the sole method, so the measurement's interpretive weight is contested even though the number is solid. As stated, the claim is supported.