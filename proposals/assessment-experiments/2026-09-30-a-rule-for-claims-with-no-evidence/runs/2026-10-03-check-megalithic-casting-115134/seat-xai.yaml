caseAssessment:
  verdict: contradicted
  loadBearing: [GEO-C020, GEO-C021, GEO-C012, GEO-C004, GEO-C030]
  weakestLinks: [GEO-C003, GEO-C005, GEO-C013, GEO-C002, GEO-C511]
  synthesis: >-
    The featured hypothesis that some major megalithic monuments contain cast reconstituted stone fails under the supplied evidence records. Attribution claims GEO-C020 and GEO-C021 are the decisive load-bearing nodes; both collapse. For the Great Pyramid, Barsoum 2006 (GEO-E012) and the related MacKenzie NMR (GEO-E017) supply the sole non-proponent laboratory positives, reporting Si-rich microconstituents, hydrated phases and an amorphous calcium-silicate gel inconsistent with the six local quarry comparators examined. Those positives are decisively outweighed by independent petrographic suites that examine the same classes of feature with positive controls: Folk & Campbell (GEO-E018) document bedding, burrows, fragile fossils and tectonic fractures confined to single blocks across many in-situ stones; Harrell & Penrod (GEO-E019) find the Lauer showcase specimen to be ordinary Mokattam limestone without zeolite cement; Jana 2007 (GEO-E020) places genuine Davidovits geopolymer limestone beside casing stones and Tura stone and shows the alkali-aluminosilicate binder signature is absent while the spherical Si-rich particles occur in natural limestone; Freestone & Middleton (GEO-E021) reach the same natural-limestone conclusion on a British Museum fragment by multi-technique analysis. Sample-provenance disputes and the later shift from alkali-geopolymer to C–S–H chemistry do not rescue the positives; the binder-aware methods already answer the quarry-matching blindness argument of GEO-C030. Salt-based supports (GEO-C003, GEO-C506) are independently retired by the absence of any medieval Arabic anchor for the Al-Ma’mun layer (GEO-E027–E029) and by Sessa et al. 2026 documentation that halite is native to Giza nummulitic limestone and appears as efflorescence on the carved-bedrock Sphinx and other uncast monuments (GEO-E030–E033). For Pumapunku the sole materials positives (GEO-E006, GEO-E007, GEO-E058) rest on one loose andesite fragment collected outside the protected area by appearance (GEO-C913, GEO-E057), lack any geological andesite control (GEO-E060), leave nitrogen only semi-quantitative, and leave the organic matter uncharacterised as binder versus unreacted guano (GEO-E059). The 1971 quarry attribution (GEO-E008) and the 2020 model’s own admission that the piedras cansadas were unused further dilute the claim. Mechanism claims remain only partially intact: industrial natron existed (GEO-C011, GEO-E010 established), ~850 °C was reachable at crucible scale (GEO-C010 provisionally), and modern reconstitution of limestone is chemically feasible (GEO-C012, GEO-E013, GEO-E022). Feasibility of ingredients and small-scale demos does not establish ancient monumental production; the discovery-pathway anecdote (GEO-C013) and the Rekhmire reinterpretation (GEO-C005) are weightless. Tool-mark anomalies (GEO-C001 rate, GEO-C002 failed tourist scoops, GEO-C006 shafts) are real observations but do not require casting once local dolerite tool quarries (GEO-E045) and the thin experimental base of the pounding orthodoxy are acknowledged. Restoration-history gaps (GEO-C594) correctly caution every surface claim. Collectively the ledger therefore contradicts the existence claim GEO-C022: no secure cast block has been demonstrated, the strongest candidate datasets have been answered by binder-aware petrography with positive controls, and the remaining anomalies are either methodological, anecdotal or compatible with ordinary geology and quarrying. The verdict is sensitive to GEO-E020; without Jana’s positive-control comparison the Egyptian case would drop only to mixed/unresolved, yet the Folk–Harrell–Freestone natural-feature suite and the failed salt discriminator would still leave attribution unsupported. The single most load-bearing removal is therefore GEO-E020; the overall contradicted verdict survives its absence, albeit at lower confidence.
  steelman: >-
    Interior carbon-nitrogen amorphous matter lying beneath plagioclase crystals in the single Pumapunku andesite fragment PP1C (GEO-E058) remains unrefuted by any natural Khapia control or independent molecular identification, leaving open the possibility that an organo-mineral binder once existed even if the fragment’s architectural attribution is insecure.
claimAssessments:
  - claimId: GEO-C022
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The existence claim inherits the failure of its two concrete instances (GEO-C020, GEO-C021). No provenance-secure block has yielded a binder signature that survives positive-control petrography, and the methodological escape hatch of GEO-C030 does not protect against the binder-aware studies already in the ledger. Strongest opposing consideration is that an unexamined monument somewhere could still be cast; that possibility is presently untestable and does not salvage the claim as stated.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: high
    reasoning: >-
      Barsoum 2006 and MacKenzie 2011 supply the only laboratory positives, yet both are answered by multiple independent examinations (Folk & Campbell, Harrell & Penrod, Jana with geopolymer control, Freestone & Middleton) that recover the same microconstituents in natural limestone and find no alkali or C–S–H binder. Contested sample provenance and the later recipe shift further weaken the positives. Strongest opposing consideration remains the contested authenticity of the Lauer specimen; even granting it, the positive-control and multi-block natural-feature evidence stands.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim rests entirely on proponent SEM/EDS of sandstone slab PP4 and andesite fragment PP1, the latter a loose surface find outside the protected area with no geological control and unresolved organic identification. Conventional quarry attribution and the absence of any independent replication leave the result anecdotal. Strongest opposing consideration is that an interior organic sheet under feldspar is harder to dismiss as modern dirt; without a Khapia comparator it remains inconclusive.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      The published papers do report organic matter and microstructural features that their authors interpret as inconsistent with natural volcanic stone. That is a correct description of the literature regardless of whether the interpretation survives scrutiny. Strongest opposing consideration is the later sampling-context admissions that shrink the architectural relevance of the andesite result.
  - claimId: GEO-C913
    verdict: established
    confidence: high
    reasoning: >-
      The authors’ own extended account states that PP1 was selected by flat-surface appearance from debris lying outside the protected monument area. No contrary documentation appears in the ledger. Strongest opposing consideration is that the fragments could still derive from architectural blocks; the claim as worded is simply true.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The same proponent report describes cutting interior subsample PP1C and finding the identical C/N-bearing amorphous spectrum beneath plagioclase. The observation is internal to one insecure fragment and lacks molecular characterisation, yet it is accurately stated. Strongest opposing consideration is the complete absence of a natural andesite control that might show the same pockets.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      The 2020 abstract explicitly specifies uncrushed Cerro Khapia andesite sand stored at Iwawe Stratum V and states that the piedras cansadas were not used. The claim is a correct description of the model. Strongest opposing consideration is that the underlying excavation reports have not yet been checked against that reading.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Laboratory replication with modern chemicals is asserted but no recipe, product data or ancient-input trial is supplied; plant acids are stated not to disaggregate andesite itself. Feasibility of an acid-guano binder therefore remains a claim rather than a demonstrated result. Strongest opposing consideration is that a successful modern-chemical proof-of-concept still leaves pre-industrial scale and durability unshown.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      PXRF, ICP-MS and similar metallic-fingerprint methods are indeed blind to H, C and O and therefore cannot, by design, separate quarry stone from aggregate cast from the same quarry. Jana’s binder-aware petrography shows the limitation is real but also bounded: it does not extend to microscopy or NMR once a positive control is present. Strongest opposing consideration is over-extension of the critique to methods it does not cover.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Modern demonstration blocks and room-temperature C–S–H formation from lime plus diatomaceous earth establish chemical feasibility with materials available in principle; ancient temperatures and natron supply are separately provisioned. Scale, durability under monumental loads, and visual identity with quarry limestone remain unproven in the ledger. Strongest opposing consideration is that feasibility never equals historical occurrence.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pre-pyramid glass and faience industries demonstrate charcoal-and-bellows temperatures in the required range at crucible scale. Industrial-scale continuous processing for monumental stone is not evidenced. Strongest opposing consideration is the leap from craft pyrotechnology to the fuel and furnace regime needed for casting-scale silicate chemistry.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006 document Wadi el Natrun and al-Barnuj as the primary industrial natron sources for the vitreous-materials industry, with a clear 7th–9th-century AD decline. The paper is mainstream and uncontroversial on this point. Strongest opposing consideration is that the study addresses glass and faience, not stone, yet the supply fact itself stands.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole support is an unattributed anecdote of rock-like material forming in a long-used fire pit; no controlled replication or even a named source appears. Accidental discovery remains an untested narrative. Strongest opposing consideration is that ash-carbonation chemistry is real in principle; the ledger simply supplies no evidence that it produces monumental stone.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      Marčiš et al. 2023 report the photogrammetric rate of 216 cm³ h⁻¹ at 85 strikes min⁻¹ under the stated protocol. The measurement is the only modern quantitative datum and is not contested in the ledger. Strongest opposing consideration is that skilled ancient crews with optimised tools might exceed the experimental rate, yet the claim reports the measured value, not a universal maximum.
  - claimId: GEO-C502
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The characterisation of Engelbach’s 1922 basis (one-hour self-trial, assumed rammer rate, groove-spacing workforce heuristic) matches the secondary descriptions in the ledger; the primary monograph is not re-read here. Strongest opposing consideration is that Engelbach himself already doubted pure hand-pounding for the full trench, so the orthodoxy may be thinner than later textbooks imply.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only an anecdotal report from a proponent source asserts collective visitor failure to reproduce a scoop mark; attempt counts and cumulative energy are unquantified and no wear survey of the test block exists. Strongest opposing consideration is that tourist effort is a poor proxy for trained quarry labour.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Shaft dimensions and the biomechanical claim rest on a single proponent description without independent survey or posture testing. Strongest opposing consideration is that the shafts may be prospecting or unfinished features whose geometry does not constrain the pounding method used on the main trench.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Kelany et al. 2009 locate dolerite dykes inside the Aswan granitoids and identify purpose-built tool-production quarries with pounder-sized blanks immediately adjacent to the working areas, undermining the premise that the spheres were exotic imports reserved for non-pounding tasks. Strongest opposing consideration is residual uncertainty about use-wear; the production context itself is clear.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only carrier of the salt-layer report is an uncited proponent webpage; the principal medieval compilation (al-Suyūṭī via Nemoy) describes the breach and its finds in two entries and never mentions salt or any wall coating. Date and source are therefore unsupported. Strongest opposing consideration is that some unread Arabic text might still contain the detail; burden of production now lies with the claim.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Halite efflorescence is confirmed on Queen’s Chamber stone, yet the same conservation study and its cited literature document identical halite at the Sphinx (carved bedrock), other pyramids, tombs and monasteries; Klemm & Klemm are cited for halite as a primary sedimentary constituent of Giza nummulitic limestone. The comparative premise therefore fails. Strongest opposing consideration is the lack of quantitative concentration data across sites; qualitative presence already falsifies uniqueness.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      Sessa et al. 2026 XRD and SEM-EDX of efflorescence and detached fragments identify only halite, calcite and quartz, with explicit absence of nitrates and of widespread gypsum crusts. The analytical result is unambiguous within detection limits. Strongest opposing consideration is that bulk stone was never cored, so minor interior phases could be missed; the claim concerns the examined material.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. cite Klemm & Klemm 2010 for halite as a primary constituent precipitated from evaporating marine or lagoonal waters within the Giza nummulitic strata; SEM-EDX of unaffected substrate fragments detects Na and Cl consistent with that reading. The statement is second-hand but coherent. Strongest opposing consideration is that Klemm & Klemm themselves have not been read in this ledger.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The general methodological caution is instantiated by the concrete Khufu case: 1995–97 cleaning and cavity-filling left no available documentation, sulfur-rich modern fills are detectable, and salt re-formed within two years. Extrapolation to other megalithic sites is reasonable given the rarity of complete published restoration archives. Strongest opposing consideration is that some sites may possess better records than Giza’s interior; the claim is statistical, not absolute.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole support is a proponent reinterpretation of scale and apparatus in the Rekhmire mural; conventional Egyptology continues to read the scene as metal casting and has not engaged the alternative. Strongest opposing consideration is that the mural’s own accompanying text and tool kit remain unexamined in the ledger for decisive discrimination.