  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports that XRD of seven samples identified only
      halite, calcite, and quartz, with no nitrates and no evidence of
      widespread gypsum crusts; its SEM-EDX findings are consistent with that
      account. The strongest opposing consideration is the stated XRD
      detection limit below five weight percent, which allows minor phases,
      and localized sulfur-rich restoration material was separately found.
      Those qualifications do not overturn the claim's scoped analytical
      result.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports Sessa et al.'s statement that Klemm and Klemm described
      halite within Giza's nummulitic stratigraphic layers and interpreted it
      as precipitated from evaporating marine or lagoonal waters. Detached
      substrate material also contained Na and Cl, which Sessa et al.
      considered probably inherent to the matrix. The strongest opposing
      consideration is that Klemm and Klemm were not read directly and the
      evidence does not establish halite's quantitative abundance throughout
      intact bedrock.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides a concrete example at Khufu: records for 1995–1997
      interventions were unavailable, although photographs indicate cleaning
      and cavity filling, and a sulfur-rich modern fill was detected. This
      supports the general concern that modern treatment can confound surface
      evidence. The strongest opposing consideration is scope: one
      well-documented example cannot establish that almost no megalithic site
      has a complete restoration history.
  - claimId: GEO-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      GEO-E014 establishes that Fóti has argued that the Rekhmire scene's
      scale and apparatus fit mineral or waterglass processing better than
      bronze casting. That supports the claim's limited wording that such an
      interpretation has been argued, not that it is the best reading. The
      strongest opposing consideration is the conventional metal-casting
      interpretation and the absence of an admitted independent Egyptological
      or inscription-based evaluation.