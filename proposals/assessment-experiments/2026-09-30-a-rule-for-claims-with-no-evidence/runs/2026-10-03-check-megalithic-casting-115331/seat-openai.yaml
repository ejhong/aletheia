  synthesis: >-
    The case receives a weakly_supported verdict because the admitted evidence
    leaves one limited positive branch at Pumapunku, even though the stronger
    and more extensively tested Great Pyramid branch is contradicted. This is
    an assessment of the broad existential hypothesis that at least one major
    megalithic monument contains cast stone, not a finding that casting was a
    general construction method. Feasibility and occurrence must also remain
    separate: evidence that anciently available ingredients can make a hard
    composite does not establish that any monument contains it.

    Steelmanning the positive case, GEO-E012 reports unusual hydrated and
    Si-bearing microconstituents in some pyramid samples, and GEO-E017 reports
    an NMR signature interpreted as limestone grains held by a calcium-silicate
    gel. The latter chemistry is not the alkali-aluminosilicate formulation
    tested by the principal negative positive-control study. At Pumapunku,
    GEO-E006 and GEO-E007 report microstructure and organic matter interpreted
    as artificial, while GEO-E058, attached to GEO-C004, places similar
    carbon- and nitrogen-bearing amorphous matter inside the sampled fragment
    beneath plagioclase crystals. GEO-E024 also makes a valid narrow
    methodological point: an elemental quarry match alone cannot exclude a
    composite made from aggregate obtained at the matched source. Ingredient
    availability and several materials demonstrations make mineral
    reconstitution scientifically plausible in principle.

    Steelmanning the negative case, the Egyptian evidence is stronger in
    design and breadth. GEO-E018 reports sedimentary bedding, fossils,
    burrows, tectonic fractures, tool marks, and ordinary limestone
    microstructure across pyramid and temple blocks. GEO-E020 compares casing
    stones with both natural limestone and an actual Davidovits-made
    geopolymer positive control; the diagnostic enriched binder and matrix
    fabric appear in the control but not in the casing stones. GEO-E021
    independently finds a British Museum casing fragment natural by several
    analytical methods, while GEO-E019 reaches the same conclusion for the
    disputed Lauer specimen. These records outweigh GEO-E012 for the Great
    Pyramid, especially because the allegedly anomalous microconstituents were
    also found in natural limestone. The salt argument adds no reliable
    discrimination: modern analysis confirms halite but also reports it at
    other Egyptian limestone sites and gives a natural sedimentary and
    humidity-driven account.

    Pumapunku prevents a case-wide contradicted verdict, but only narrowly.
    Its positive studies come from one proponent team and sample series.
    GEO-E057 says the key andesite fragment was selected from loose debris
    outside the protected area by appearance, and GEO-E060 records that no
    geological andesite control was compared. The interior finding reduces a
    simple surface-dirt explanation but does not establish that the fragment
    came from an architectural block or that its amorphous material is an
    ancient binder. No independent replication on a documented monument
    sample is admitted.

    The single record whose removal would most change this assessment is
    GEO-E020, because its genuine geopolymer positive control provides the
    clearest direct test of whether the proposed Egyptian binder signature
    should be detectable. Removing it would make GEO-C020 appreciably less
    secure and closer to mixed, but the case verdict would survive: GEO-E018,
    GEO-E019, and GEO-E021 would still weigh against the Egyptian attribution,
    while the Pumapunku evidence would remain provenance-limited and
    unreplicated.
  steelman: >-
    The strongest unanswered pro-casting point is GEO-E017: multinuclear NMR
    on a Bent Pyramid casing stone was interpreted as Tura limestone grains
    cemented by an amorphous calcium-silicate gel, while GEO-E020's positive
    control tested an alkali-aluminosilicate geopolymer rather than aged
    calcium-silicate hydrate. No admitted evidence supplies a blinded,
    provenance-secure replication against a broad natural-limestone suite and
    aged calcium-silicate-hydrate controls, so that specific binder signal
    remains experimentally unrebutted.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The claim is a broad existential, so strong evidence against one
      monument cannot exclude every other monument. The Pumapunku branch
      supplies limited positive materials evidence, but the Great Pyramid
      branch is contradicted and GEO-E009 supports conventional sourcing at
      Stonehenge without directly deciding same-source casting. The strongest
      consideration against accepting the claim is that no provenance-secure,
      independently replicated cast block is present in the admitted record.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 reports broad in-situ sedimentary and tectonic features that
      are difficult to reconcile with casting, while GEO-E020 finds that
      casing stones lack the binder signature and fabric displayed by a real
      geopolymer positive control. GEO-E021 independently identifies a Cheops
      casing fragment as natural, and GEO-E019 does the same for the disputed
      Lauer specimen. The strongest opposing evidence is GEO-E012 together
      with GEO-E017, which report unusual microconstituents and a possible
      calcium-silicate gel, but their limited and contested samples do not
      outweigh the broader negative record.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report sandstone or andesite features interpreted
      by the proponent team as evidence of artificial stone, and the natural
      quarry attribution in GEO-E008 does not by itself exclude casting from
      same-source aggregate. However, GEO-E057 records that the key andesite
      fragment was loose debris selected by appearance, and GEO-E060 records
      the absence of a geological-andesite comparator. The strongest
      consideration against accepting occurrence is the lack of independent
      replication on a documented architectural block.
  - claimId: GEO-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E006 and GEO-E007 establish that published SEM and petrographic
      analyses report the claimed features and interpret them as artificial,
      while GEO-E058 reports similar amorphous matter in an interior
      subsample. This supports the claim as a description of what the authors
      reported, not the diagnostic validity of their interpretation. The
      strongest opposing consideration is that GEO-E057 and GEO-E060 identify
      insecure architectural provenance and the absence of a natural
      andesite control.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C913, so the ledger holds the
      proposition on its source anchor alone rather than admitting the
      underlying observation as evidence for this claim. The source anchor is
      specific, but a source record is not evidence under the assessment
      rules.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C918, so the claimed interior
      subsample result cannot be graded here from its source anchor alone.
      The strongest consideration favoring it is the quoted locator, but that
      does not replace an admitted evidence record attached to this claim.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly quotes the model's abstract as specifying natural
      Cerro Khapia andesite sand stored at Iwawe and rejecting the
      quadrangular piedras cansadas as construction material. That is exactly
      the descriptive claim being assessed, irrespective of whether the
      model is archaeologically correct. The strongest limitation is that
      only the proponent-authored abstract was read, not the paper's body.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 states that the proposed acidic-medium binder mechanism was
      replicated in the proponents' laboratory, but supplies no recipe, data,
      durability measurements, or product characterization and used modern
      chemicals. GEO-E059 further records that the team could not determine
      whether the monument-associated material was unreacted guano or binder,
      and nitrogen was only semi-quantitative. The strongest opposing
      consideration is the reported laboratory replication, but it does not
      establish the full ancient-input, durable-stone claim.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow point that XRF and ICP-MS do not measure
      hydrogen, carbon, or oxygen and that an elemental quarry match alone
      cannot distinguish a natural block from a same-source aggregate
      composite. The claim overreaches by grouping XRD and other analyses
      under the same blindness, and GEO-E020 demonstrates that binder-aware
      petrography can detect a real geopolymer signature when present. The
      strongest consideration for the claim is the logical
      same-source-aggregate problem; the strongest against it is that quarry
      matching is not the only analysis used in the relevant negative
      studies.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports multi-ton demonstration blocks made with the proposed
      recipes, and GEO-E022 establishes that lime and diatomaceous earth can
      form a calcium-silicate-hydrate binder at room temperature. These
      records make large artificial limestone chemically plausible, although
      neither independently characterizes an ancient-style demonstration
      block under controlled conditions. The strongest opposing
      consideration is the absence of independent replication and testing of
      strength, durability, visual similarity, and ancient-scale production
      as a complete package.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 cites pre-pyramid glassmaking as a precedent for reaching the
      required temperature with charcoal and bellows. A general
      pyrotechnological prior also makes attaining approximately 850 degrees
      Celsius plausible, and that prior carries part of this verdict because
      the cited Badari basis remains unverified. The strongest opposing
      consideration is that achieving such heat in a small furnace does not
      establish sustained industrial-scale processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as primary
      ancient Egyptian natron sources and documents their seventh- to
      ninth-century decline and replacement in the vitreous-materials
      industry. GEO-E011 supplies compatible compositional context for
      distinguishing natron from plant-ash glass. The strongest limitation is
      that these records concern glass and faience, not stone manufacture,
      but that does not undermine this historical availability claim.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 recounts a hardened rock-like material reportedly forming in a
      repeatedly used outdoor fire pit, which is directionally consistent
      with the proposed discovery pathway. It is an unattributed anecdote
      without compositional analysis, process measurements, or controlled
      replication. The strongest consideration in its favor is that the
      reported outcome matches the mechanism qualitatively, but the evidence
      cannot establish causation.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the controlled photogrammetric result of 216
      cubic centimetres per hour at 85 strikes per minute, matching the claim
      as stated. The claim concerns the measured result of that protocol, not
      a universal ancient quarrying rate. The strongest opposing
      consideration is limited external validity from one team, granite, tool
      configuration, and skill regime.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C502, so its detailed account of
      Engelbach's trial, assumptions, workforce inference, and view about
      hand use rests on its source anchor alone. The related characterization
      in GEO-E002 is attached to GEO-C001 and GEO-C002 and explicitly says it
      was taken from Fóti and not checked against Engelbach's text, so it
      cannot resolve this claim.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using the designated pounders have not
      reproduced a scoop mark, but the attempt count, effort, technique, and
      test-block wear were not systematically documented. GEO-E002 provides
      historical context but its methodological characterization is
      expressly unchecked against Engelbach's own text. The strongest
      opposing consideration is that unrecorded casual attempts cannot
      establish decades of meaningful experimental failure.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the shafts' approximate depth and the proponent's
      judgment that effective pounding posture is impossible at their
      bottoms. No independent dimensional survey or biomechanical test is
      admitted. The strongest consideration in favor is the reported narrow
      geometry, while the strongest opposing consideration is that both the
      dimensions and functional inference remain untested.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite raw material in local Aswan dykes, identifies
      nearby Pharaonic tool-production quarries with pounder-sized blanks,
      and describes pounders as tools used to work boulders. This weighs
      directly against both the transported-material premise and the claim
      that the spheres primarily served a non-pounding purpose. The strongest
      opposing consideration is that the identification lacks
      object-specific petrographic matching and microwear analysis, so an
      additional use is not categorically excluded.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E027 finds no salt coating in al-Suyuti's two accounts of
      al-Ma'mun's breach or the additional cited medieval entry, while
      GEO-E029 shows that the proponent page supplying the salt story names
      no medieval source and gives an unsupported 820 date. GEO-E028 instead
      dates al-Ma'mun's Egyptian arrival to 832, consistent with the revised
      date but not with the salt report. The strongest opposing consideration
      is GEO-E004's secondary proponent account, and other medieval works
      remain unread, so the contradiction is not exhaustive proof of absence.
  - claimId: GEO-C506
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms halite efflorescence on Great Pyramid
