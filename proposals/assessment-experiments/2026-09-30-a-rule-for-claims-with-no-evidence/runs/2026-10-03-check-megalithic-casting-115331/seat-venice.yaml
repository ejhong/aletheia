  verdict: mixed
  loadBearing: [GEO-C022, GEO-C020, GEO-C021, GEO-C012]
  weakestLinks: [GEO-C003, GEO-C506, GEO-C002, GEO-C511, GEO-C013]
  synthesis: >-
    The case splits cleanly by rung, and the split is the finding. The mechanism rung is genuinely supported: natron supply at industrial scale is uncontroversial (GEO-E010, strong, mainstream), reconstituted limestone is feasible with ancient-accessible chemistry (GEO-E013, GEO-E022, plus GEO-E012's implication), and the proponents' sharpest methodological point — that trace-element provenance methods are blind to hydrogen, carbon, and oxygen, so a quarry match cannot by design separate carved stone from stone cast with the same quarry's aggregate (GEO-C030, GEO-E024) — is chemically correct and human-reviewed. But the attribution rung, where the hypothesis lives or dies, fails in both flagship branches on this ledger. For the Great Pyramid, four independent or partly independent petrographic records cut against casting: in-situ sedimentary bedding, burrows, and fossil cross-sections across many blocks (GEO-E018), a natural reading of the proponents' own showcase Lauer sample (GEO-E019), the exchange's only positive-control study showing a real geopolymer's binder signature is absent from casing stones (GEO-E020), and independent multi-technique analysis of a museum fragment (GEO-E021). The pro-casting record for Egypt is real but hedged: Barsoum 2006 claims casting for some samples only, on samples whose provenance was publicly disputed, with no replication (GEO-E012), and the salt line that once anchored it has collapsed (GEO-E031, GEO-E032, GEO-E033). For the Andes, every supporting record comes from the hypothesis's own team, on a loose surface fragment of insecure provenance, with no geological andesite comparator at all (GEO-E060), an unresolved guano-versus-binder ambiguity (GEO-E059), and a 14C test announced in 2019 and never published (GEO-E066). The decisive point against the escape hatch: GEO-E020's positive control demonstrates that binder-aware petrography detects casting when present, so the trace-element critique does not rehabilitate the stone itself. Steelmanning the other side: the MacKenzie NMR result was never rebutted, and Jana's negative expressly does not test its revised C-S-H binder. A proponent could also rightly note that Davidovits' sample-authenticity disputes against Harrell and Jana are recorded as unresolved factual disagreements, not adjudicated. Overall: feasibility established, attribution undemonstrated, and the Egyptian branch affirmatively contradicted.
  steelman: >-
    MacKenzie et al. 2011 (GEO-E017) is a solid-state 29Si/27Al/43Ca MAS NMR
    study — an independent technique from an independent technique community
    — reporting that Bent Pyramid casing stone consists of Tura quarry grains
    cemented by an amorphous calcium-silicate gel "formed by human
    intervention," and the ledger records that no comment, reply, replication,
    or rebuttal of this paper exists anywhere (checked 2026-08-22). Jana's
    positive control (GEO-E020), the strongest anti-casting record, expressly
    tested only the alkali-aluminosilicate geopolymer recipe and cannot speak
    to this C-S-H binder; GEO-R017, the blinded NMR re-test against a
    stratified natural-limestone suite with aged C-S-H controls that would
    settle it, has never been run or funded. Until it is, the one surviving
    positive Egyptian result on the ledger is unrebutted.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: low
    reasoning: >-
      Feasibility is supported (GEO-E013, GEO-E022) and one non-proponent lab
      reports hedged anomalies (GEO-E012), but the two flagship attribution
      branches fail in opposite directions: the pyramid claim is contradicted
      by independent binder-aware petrography with a positive control
      (GEO-E018–E021), and the Pumapunku claim rests solely on proponent SEM
      work with no geological comparator (GEO-E060). The strongest opposing
      consideration is GEO-E020: it demonstrates casting signatures are
      detectable when present, so the methods critique cannot cover the stone
      itself. The residual genuine positives (GEO-E017 unrebutted; PP1C
      interior organics) keep this from contradicting the umbrella claim.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Four records cut against: in-situ sedimentary bedding, burrows and
      fossil cross-sections across blocks (GEO-E018), a natural reading of the
      Lauer sample (GEO-E019), Jana's positive-control petrography finding no
      binder signature (GEO-E020), and independent analysis of a museum
      casing fragment (GEO-E021). The supporting records are weaker in kind:
      GEO-E012 is hedged and its samples' provenance was publicly disputed,
      and the salt line is deflated by GEO-E033. The strongest opposing
      consideration is that GEO-E017's C-S-H reading is unrebutted and
      outside GEO-E020's test scope, and Davidovits' sample-authenticity
      disputes are unresolved — hence moderate rather than high confidence.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is the proponents' own peer-reviewed SEM/petrographic
      work (GEO-E006, GEO-E007) plus their restatement (GEO-E036), all one
      independence group. Their own fuller account concedes the sample is a
      loose fragment chosen by appearance (GEO-E057), that no geological
      andesite was compared (GEO-E060), and that the organic matter cannot be
      distinguished between unreacted guano and binder (GEO-E059); the
      announced 14C dating never produced a located result (GEO-E066). Ponce
      1971 provenance (GEO-E008) and the unmeasured bubble reading (GEO-E062)
      add conventional weight. Anomaly observations exist; attribution does
      not.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is descriptive of what published analyses report, and the
      records confirm the papers do report organic matter and argued
      microstructural anomalies, including interior occurrence beneath
      plagioclase crystals (GEO-E006, GEO-E007, GEO-E058), with an 1892
      precedent for amorphous pockets (GEO-E061). The authors' interpretive
      step — inconsistency with natural volcanic stone — is untested because
      no natural comparator was run (GEO-E060), and the sample is a loose
      fragment of appearance-based provenance (GEO-E057), so the claim's
      weight toward casting is far below its local truth.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim directly, but its content
      is carried by GEO-E057, attached to GEO-C004 and GEO-C021, whose
      sourceStatement quotes the selection of loose debris "outside the
      protected monument area" and the choice of fragments by their flat
      surface. The strongest opposing consideration is the record's own
      caveat that outside-area debris could still derive from architectural
      blocks, and that the peer-reviewed statement of the same context was
      not shown — only the authors' own longer account.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim directly, but its content
      is carried by GEO-E058, attached to GEO-C004, which quotes the authors'
      statement that PP1C was cut from PP1's interior and reports the same
      C- and N-bearing amorphous matter beneath two plagioclase crystals. The
      strongest opposing consideration: it is the same team and the same
      fragment as the surface finding, EDS is elemental only and cannot
      characterize the organic compound, and the fragment's provenance is
      itself the unsettled question recorded at GEO-C913.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E035 is attached directly to this claim and quotes the abstract
      stating the Khapia sand aggregate, Iwawe storage at Stratum V, and that
      the piedras cansadas were not used — so the descriptive claim about
      what the model specifies is directly supported. The strongest opposing
      consideration is that the record rests on the abstract only (the PDF
      returned HTTP 403 and was not read), in a proponent self-published
      venue; the Stratum V deposit itself remains unexamined against the
      excavators' descriptions (GEO-R009).
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The supporting records undercut as much as they carry: the replication
      is asserted "with modern chemicals" without recipe, data, or product
      characterization (GEO-E064), the plant acids do not disaggregate
      andesite so only a binder is available, and the authors themselves
      cannot say whether the organic matter is unreacted guano or the binder
      (GEO-E059). The strongest opposing consideration is the second reader's
      recorded dissent on GEO-E064's direction: the source's own text reads
      as qualifying pre-industrial feasibility rather than demonstrating it.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The core chemistry is stated in the human-reviewed record GEO-E024 and
      is not in dispute: PXRF and ICP-MS cannot detect hydrogen, carbon, or
      oxygen, so trace-element matching cannot separate carved stone from
      stone cast with the same quarry's aggregate. The strongest opposing
      consideration is GEO-E020: its positive control shows binder-aware
      petrography does detect casting, so the claim's practical force is
      bounded — but the claim as stated is scoped to trace-element methods
      and stands. Confidence is moderate rather than high because Fóti's own
      methods table contains errors (NMR mislisted) per GEO-E024's
      limitations, requiring care about the claim's boundary.
  - claimId: GEO-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Feasibility is the best-supported rung: demonstration blocks are
      reported (GEO-E013), the C-S-H binder route is demonstrated in cement
      science (GEO-E022), and natron supply exists (GEO-E010). General
      materials-science background (cast stone, lime-pozzolan chemistry) —
      stated here as a prior, not as ledger evidence — makes reconstituted
      limestone unremarkable as a modern capability. The strongest opposing
      consideration is that the demonstration blocks are self-reported with
      no independent analysis (GEO-E013's limitations), and feasibility is
      not occurrence.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only attached record (GEO-E016) is weak: it cites Badari
      glassmaking as an ~850 °C precedent, but its own limitations flag that
      the dating and temperature basis need independent verification and
      that crucible-scale heat is not industrial-scale processing. The
      strongest opposing consideration is that nothing in the ledger
      demonstrates sustained charcoal-and-bellows pyrotechnology at the
      throughput stone-making would need; the temperature claim is plausible
      on priors but thinly evidenced here.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 (Shortland 2006, strong, mainstream, uncontroversial) directly
      establishes Wadi el Natrun and al-Barnuj as the primary ancient natron
      sources with a documented 7th–9th century decline, and GEO-E011 supplies
      the compositional tooling behind such timelines. The strongest opposing
      consideration is only scope: the paper concerns glass and faience and
      says nothing about stone-making, which limits what this claim can do
      for the hypothesis without limiting its own truth.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole attached record (GEO-E015) is an unattributed anecdote
      flagged as under-sourced in the project's own skeptical review, with no
      controlled replication attempted. The strongest opposing consideration
      is that the proposed chemistry (ash carbonation) is real in other
      contexts, so the anecdote is not implausible — but a single unverified
      fire-pit story cannot carry a discovery-pathway claim.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is a measurement report, and GEO-E011's companion GEO-E001
      records it directly from a peer-reviewed study with the figure and rate
      confirmed at verification. The strongest opposing consideration is in
      GEO-E001's limitations: a single study, single team, single granite and
      tool configuration, and skilled ancient crews with maintained tools may
      outperform the experimental protocol — so the number is real but its
      generalization is not.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The nearest record,
      GEO-E002 (attached to GEO-C001 and GEO-C002), confirms only that
      Engelbach's monograph is the original source of the pounding account,
      including a brief working trial and workforce estimates; its
      limitations expressly state that the detailed characterization of
      Engelbach's method — precisely the quantities this claim asserts — is
      taken from Fóti and has not been verified against the 1922/1923 texts.
      Under the ledger's rule that cannot be carried as the source's own
      text, so the claim stands on Fóti's reading alone.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 supports it, but with stated strength weak and limitations
      that are close to disqualifying: anecdotal, attempt rates and
      cumulative effort unquantified, no systematic wear survey of the test
      block. The strongest opposing consideration is that "decades of
      attempts" with unrecorded effort distribution is compatible with
      unskilled visitors failing at a skilled task, which the record cannot
      exclude.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 supports the observation but its limitations state the shaft
      dimensions are not independently surveyed and the biomechanical claim
      is untested — the entire force rests on Fóti's description. The
      strongest opposing consideration is that no measured geometry or
      ergonomic study exists, and GEO-R013 notes both readings (prospecting
      pits versus processing vessels) are currently unmeasured conjecture.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      The only attached evidence record, GEO-E045, undermines the claim: it
      documents dolerite pounder material in dykes within the Aswan
      granitoids and purpose-built Pharaonic tool-production quarries
      adjacent to the working areas — a local pounder industry, not
      transported spheres repurposed for slurry grinding or tamping. The
      strongest opposing consideration is Engelbach's contrary 1922 judgment
      that the stone does not occur at Aswan, recorded as unresolved in the
      record, and that no microwear analysis establishes what the pounders
      actually struck — hence low confidence rather than a firm negative.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: low
    reasoning: >-
      The salt report's only carrier is an uncited proponent web page
      (GEO-E029), the principal medieval compilation is silent on salt
      (GEO-E027), and the date is wrong — Nemoy dates the caliph's entry into
      Egypt to 832, not 820 (GEO-E028). The strongest opposing consideration
      is that al-Suyūṭī's silence is negative evidence within one
      compilation: al-Maqrīzī's full Khiṭaṭ, ʿAbd al-Laṭīf al-Baghdādī, and
      Vyse's Arabic extracts remain unread, so the report is unanchored
      rather than disproven — hence contradicted at low confidence.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The comparative premise fails on the ledger: halite efflorescence is
      documented at other Egyptian limestone sites including the carved
      Sphinx (GEO-E031), and halite is reported as native to the Giza
      nummulitic strata (GEO-E032), while the proponents' own comparative
      argument rests on a weightless taste test with the wrong control
      (GEO-E026). GEO-E030 confirms the pyramid salt is NaCl but the record
      itself notes it carries essentially no weight toward the comparative
      claim, and its second reader recorded dissent on direction. Moderate
      rather than high because GEO-E031/E032 are qualitative and partly
      second-hand, and the bulk-versus-surface question (GEO-R010) is
      untested.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E030 is attached directly and quotes the XRD result — only halite,
      calcite, and quartz, no nitrates, no widespread gypsum — with the SEM
      Na–Cl correlation. The claim accurately reports what the study found.
      The strongest opposing consideration is the paper's own stated XRD
      detection limit below 5 wt%, so minor sulfate phases could be missed;
      the claim is locally solid but says nothing about casting, as the
      source is a conservation study that assumes natural stone.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim directly, but its content
      is carried by GEO-E032, attached to GEO-C506 and GEO-C906, which quotes
      the Klemm & Klemm statement via Sessa et al. verbatim — and the claim
      is framed as "as cited by Sessa et al. 2026," so the secondhand record
      carries exactly what is asserted. The strongest opposing consideration
      is that Klemm & Klemm 2010 itself was not read; the geological claim's
      truth rests on a citation chain, though the descriptive claim about
      what was cited does not.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 supplies one concrete, well-documented instance — undocumented
      1995–97 cleaning and cavity filling inside the Khufu pyramid, with
      recurrent efflorescence — which supports the general claim's
      plausibility and directly confounds surface-salt readings. The
      strongest opposing consideration is scope: a generalization about
      "almost no megalithic site" from a single monument is a statistical
      claim the record cannot establish.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 supports the reinterpretation at stated strength weak, and its
      limitations note it is an interpretive argument by a proponent that
      conventional Egyptology has not engaged. The claim itself is hedged
      ("have been argued"), which its evidence matches. The strongest
      opposing consideration is that the conventional bronze-casting reading
      remains the unrefuted default; nothing in the ledger independently
      tests the mineral-processing reading (GEO-R008 unbudgeted).