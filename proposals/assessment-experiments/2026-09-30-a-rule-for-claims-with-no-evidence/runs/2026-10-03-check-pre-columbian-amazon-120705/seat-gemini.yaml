  - claimId: AMZ-C029
    verdict: well_supported
    confidence: high
    reasoning: >-
      Peripato et al.'s basin-wide spatial model indicates that nearly 80% of Amazonia has a 0–1% predicted probability of containing pre-Columbian monumental earthworks per square kilometer. These low-probability areas encompass extensive tracts of the central, northern, and northwestern Amazonian interior. The strongest opposing consideration is that the model's predictive variables depend partly on modern deforestation visibility and historical reporting, which could lead to an underestimation of earthworks beneath intact canopy.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      The integration of LiDAR, paleoecology, soil chemistry, and regional archaeological survey firmly establishes that pre-Columbian Amazonia was a mosaic environment. Densely settled, highly organized, and intensively engineered polities flourished along riverine corridors, bluffs, and savannas, while the intervening terra-firme forest matrix remained lightly populated and low in intensive agrarian modifications. The strongest opposing consideration is that ephemeral, mobile societies inhabiting the interfluves leave negligible archaeological and palynological signatures, making it difficult to fully quantify their aggregate population.