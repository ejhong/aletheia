  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      A cumulative synthesis of soil phytolith and charcoal records across fourteen lowland regions found an absence of intensive crop cultivation, substantial forest clearance, or recurring anthropic fire in most sampled terra-firme settings. These findings indicate that expansive tracts of upland Amazonian forest remained lightly modified prior to 1492. The strongest opposing consideration is that micro-sampling of soil cores covers an infinitesimal spatial area, which could miss localized agroforestry plots or low-impact swidden management.
  - claimId: AMZ-C020
