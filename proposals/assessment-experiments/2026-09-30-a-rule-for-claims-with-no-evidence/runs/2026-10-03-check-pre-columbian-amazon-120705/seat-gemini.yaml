      Gaspar de Carvajal's 1542 chronicle explicitly describes large, road-connected settlements with defensive organization and ceramic production, alternating with stretches of uninhabited riverbanks. This alternating spatial distribution matches the ecological bluff model developed by historical geographers. The strongest opposing consideration is that the original text survives only in divergent manuscript traditions whose numerical descriptions are notoriously inconsistent.
