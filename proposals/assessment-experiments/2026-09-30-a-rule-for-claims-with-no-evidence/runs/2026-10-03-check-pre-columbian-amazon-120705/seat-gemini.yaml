  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      Zooarchaeological excavation at the monumental Loma Salvatierra mound recovered and identified over 17,000 fish specimens dating between AD 500 and 1400. The taxonomic assemblage includes swamp-tolerant species such as lungfish and tiger-fish, demonstrating sustained, year-round aquatic exploitation within an interfluvial savannah landscape. The strongest opposing consideration is that Loma Salvatierra represents an elite monumental center whose resource provisioning strategies may not be representative of smaller, dispersed hinterland sites.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      Denevan formally published a methodological retraction of the habitat-density calculation that generated his widely cited estimate of 5.1 to 6.8 million inhabitants, citing unsustainable internal variance within broad environmental zones. He simultaneously maintained that an aggregate total of 5 to 6 million remained plausible based on alternative qualitative and documentary grounds. The strongest opposing consideration is that rejecting the quantitative mechanism while defending the final numeric output highlights the subjective nature of basin-wide demographic reconstructions.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Arroyo-Kalin and Riris demonstrated that summed radiocarbon probability distributions across the Amazon basin follow a logistic growth trajectory approaching regional carrying capacity prior to European contact. The terminal crash in the distribution is interpreted as an artifact of taphonomic preservation and modern archaeological sampling bias rather than an endogenous pre-Columbian societal collapse. The strongest opposing consideration is that summed radiocarbon dates are susceptible to regional research intensity biases and calibration curve distortions that can mimic demographic trends.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Archival reconstructions by Linda Newson document catastrophic early colonial population losses, with indigenous populations in the Napo-Aguarico and Mainas regions falling by 88% and 62–64% respectively by circa 1700. The documented collapse resulted from interacting vectors, including epidemic disease, forced labor, slave raiding, armed rebellions, and displacement into the interior. The strongest opposing consideration is that these granular figures derive from upper-Amazonian Jesuit mission records, and extrapolating identical rates to unmonitored middle and lower Solimões reaches carries demographic uncertainty.
  - claimId: AMZ-C023
    verdict: well_supported
    confidence: high
    reasoning: >-
