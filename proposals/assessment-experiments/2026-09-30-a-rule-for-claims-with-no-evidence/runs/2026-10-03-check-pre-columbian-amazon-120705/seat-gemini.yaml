  synthesis: >-
    The central hypothesis—that pre-Columbian Amazonia supported substantial, densely settled, and socially organized riverine societies that were subsequently decimated and obscured following European contact—is well supported by the current corpus of empirical evidence. This case resolves a centuries-old dispute between two flawed paradigms: the pristine wilderness model of environmental determinism (which held tropical soils incapable of sustaining dense, complex populations) and the indiscriminate maximalist model of wall-to-wall Amazonian agrarian civilizations. The evidence establishes a heterogeneous mosaic landscape. Monumental landscape engineering, agrarian intensifications, and planned settlements are firmly documented along major river bluffs, floodplains, and seasonal savannah margins—such as the Casarabe urban complexes in Mojos, ditched enclosures on the southern Amazon rim, monumental platforms in the Upano Valley, and long-lived settlements in Santarém and the Upper Xingu. Ethnohistorical corroboration from Diogo Nunes (1538) and the 1560 Ursúa expedition validates Gaspar de Carvajal's qualitative descriptions of dense riverine settlements, food surpluses, organized polities, and interconnected roads on the middle Solimões, despite the textual volatility of his extreme warrior counts.


    Conversely, the minimalist position retains critical explanatory power regarding the vast interfluvial matrix. Cumulative phytolith and charcoal analyses across fourteen lowland regions show little to no evidence of widespread forest clearance, burning, or intensive crop cultivation in upland terra-firme settings. Spatial modelling of over 7,300 known sites demonstrates that distance to major rivers accounts for over 21% of occupation probability, with nearly 80% of the biome exhibiting negligible likelihood of monumental earthworks. Methodologically, basin-wide demographic estimates remain fragile: early habitat-density models were repudiated by their own creators, and recent regional LiDAR-based projections display extreme sensitivity to baseline household assumptions. Documented post-contact depopulation ratios of 60% to 88% in upper Amazonian missions demonstrate the destructive synergy of epidemics, slave raids, and flight, providing a viable historical mechanism for the post-1542 disappearance of riverine polities. In terms of sensitivity, the single evidence record whose removal would most challenge the mosaic model is AMZ-E011 (Piperno et al. 2024), which anchors the paleoecological evidence for a lightly occupied interfluvial matrix. However, the overall case verdict survives even without AMZ-E011, as independent spatial modeling (AMZ-E010, AMZ-E038) separately confirms that archaeological site densities fall off dramatically away from river channels.
  steelman: >-
    If the rapid palaeoecological erasure of pre-Columbian agricultural and clearing signals documented in the Upano Valley operates widely across tropical forest soils, negative phytolith and charcoal profiles in terra-firme interfluves may reflect taphonomic decay rather than genuine pre-Columbian human absence.
