  - claimId: AMZ-C017
    verdict: well_supported
    confidence: high
    reasoning: >-
      Archaeological distributions, secondary 16th-century witnesses, and manuscript comparisons collectively indicate that Carvajal's qualitative social geography reflects real riverine polities, while his specific headcount figures are textual artifacts. Distinguishing qualitative descriptions from numerical assertions resolves long-standing contradictions in Amazonian historical demography. The strongest opposing consideration is that persistent numerical exaggeration may reflect an underlying rhetorical intent that distorts qualitative descriptions of settlement size and complexity as well.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      High-resolution LiDAR flown over 4,430 km in southwestern Amazonia detected 432 earthworks, the vast majority previously unknown, defining an Aquiry cultural province of approximately 183,000 km² with an estimated 24,000 to 30,000 total earthworks. This empirical discovery confirms the presence of extensive monumental landscapes in southwestern Amazonia. The strongest opposing consideration is that basin-wide predictive models (such as Peripato et al. 2023) project far fewer total undiscovered earthworks across the entire Amazon basin than Pärssinen et al. extrapolate for this single regional cultural zone.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      Pärssinen et al.'s peak population estimate of 1.25 to 3 million individuals relies on specific assumptions regarding site contemporaneity (25–60%) and an average workforce of 300 individuals per enclosure. The authors' own sensitivity calculation using a single-family assumption reduces the estimate to 250,000–600,000 individuals, demonstrating a fivefold variance. The strongest opposing consideration is that the authors consider the single-family hypothesis physically implausible given the monumental labor necessary to dig ditched enclosures.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Survey and dating programs by de Souza et al. confirm that an 1,800 km arc along the southern Amazon rim was occupied by earth-building societies in fortified ditched villages between AD 1250 and 1500. The paper's derived demographic estimate of 500,000 to 1,000,000 people explicitly depends on site contemporaneity, MaxEnt spatial projection, and ethnographic density conversions. The strongest opposing consideration is that if ditched enclosures represent sequential rather than simultaneous occupations, actual population numbers would be substantially lower.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Direct archaeological excavations and radiocarbon sequences establish that major regional settlement systems persisted into the European contact horizon. Sites on the Belterra Plateau near Santarém span AD 1300 into the seventeenth century, Marajó's Cacoal site dates from AD 1300 to 1650, and Upper Xingu settlements were inhabited continuously until roughly 1770. The strongest opposing consideration is that calibrated radiocarbon plateaus and secondary reportage in the Upper Xingu introduce chronological uncertainty regarding exact terminal occupation dates.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      Palaeoecological and hydrological surveys in the Llanos de Mojos demonstrate that Casarabe communities constructed extensive canal systems and savannah reservoirs to manage water tables for year-round maize monoculture. Phytolith analysis across 18 profiles confirmed ubiquitous maize signatures associated with monumental architecture. The strongest opposing consideration is that Casarabe intensive monoculture ended around AD 1400, well prior to European contact, meaning it cannot directly substantiate sixteenth-century riverine demographics.
  - claimId: AMZ-C008
