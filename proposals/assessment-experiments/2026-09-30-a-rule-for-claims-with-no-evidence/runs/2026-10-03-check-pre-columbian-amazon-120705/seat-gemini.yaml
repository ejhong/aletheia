  - claimId: AMZ-C021
    verdict: well_supported
    confidence: high
    reasoning: >-
      Clement et al. published a formal methodological critique pointing out that generalizations regarding an empty or unmodified western Amazon were extrapolated from roughly 300 soil cores totaling only 1.17 cubic meters of sediment. They argued this minute physical volume provides inadequate spatial coverage for evaluating a two-million-square-kilometer territory. The strongest opposing consideration is that sedimentary paleoecology relies on airborne pollen and charcoal dispersal that reflects broad regional vegetation catchments rather than merely the core's physical diameter.
  - claimId: AMZ-C022
    verdict: well_supported
