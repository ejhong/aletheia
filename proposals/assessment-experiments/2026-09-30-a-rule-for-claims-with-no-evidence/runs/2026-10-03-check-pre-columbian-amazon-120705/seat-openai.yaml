  verdict: provisionally_supported
  loadBearing: [AMZ-C003, AMZ-C002, AMZ-C017, AMZ-C010, AMZ-C016]
  weakestLinks: [AMZ-C001, AMZ-C010, AMZ-C017]
  synthesis: >-
    The evidence provisionally supports the featured hypothesis in its
    defensible, geographically limited form: Carvajal probably encountered
    populous and organized societies in particular riverine reaches, their
    world was vulnerable to severe post-contact disruption, and neither
    their existence nor their disappearance implies a uniformly populous
    Amazon. The most direct support is AMZ-E007. Nunes's testimony concerning
    Machiparo and ten accounts associated with the Ursúa expedition report
    dense settlement, large food stores, travelled roads, and abundant
    resources on the same middle-Amazon reaches before and shortly after
    Carvajal. These mundane convergences are substantially more diagnostic
    than later endorsements of Carvajal's character. AMZ-E005 independently
    establishes that the most spectacular warrior and village figures occur
    in one manuscript branch but not the Oviedo version, supporting a
    separation between the account's qualitative geography and its unstable
    numbers.

    Archaeology makes such societies ecologically and organizationally
    credible but does not always corroborate Carvajal directly. Fortified
    southern-rim settlements date to approximately AD 1250–1500; Belterra,
    Cacoal, and Upper Xingu settlements persisted into the contact era or
    later; and Casarabe evidence documents engineered, year-round maize
    production. These records refute a general ecological-impossibility
    argument. Conversely, the Aquiry peak falls around AD 100–300, about a
    millennium too early to validate what Carvajal saw, and its demographic
    estimates are highly assumption-sensitive. River-distance modelling and
    palaeoecological negatives support a sparse interfluvial matrix, although
    both inherit serious sampling and detection limitations. The resulting
    picture is a mosaic of populous corridors and engineered hotspots within
    much lighter occupation, not a basin-wide civilization.

    The strongest skeptical case is that possibility has not yet been joined
    to a complete local causal sequence. The packet lacks a direct evidence
    record quoting the full set of observations attributed to Carvajal in
    AMZ-C001. It also lacks a blinded comparison between his populated and
    empty reaches and contact-horizon archaeology. AMZ-E008 demonstrates
    catastrophic, multi-causal decline in Napo–Aguarico and Mainas, but
    extending those figures to the middle and lower Amazon is an extrapolation.
    Thus the ledger explains how an inhabited river world could be emptied
    without yet demonstrating, province by province, that Carvajal's specific
    world underwent that sequence.

    AMZ-E007 is the single evidence record whose removal would most change
    the case verdict. Without the independent sixteenth-century testimony,
    the archaeology would still establish regional social complexity and the
    colonial evidence would still establish severe decline elsewhere, but
    the direct bridge to Carvajal's particular middle-Amazon description
    would largely disappear. The present verdict would not survive that
    removal; it would fall to weakly_supported. The case therefore remains
    materially dependent on one unusually important corroborative record.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is
    Carvajal's untested reach-by-reach spatial prediction: contact-horizon
    archaeology should be systematically richer in the corridors he described
    as populated than in matched corridors he described as empty, followed by
    dated evidence of seventeenth-century abandonment or relocation in those
    same places. No evidence record performs that comparison.
claimAssessments:
  - claimId: AMZ-C001
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record directly quotes or inventories the chronicle passages
      needed to establish all of the settlement, storage, road, ceramic,
      territorial, and empty-reach elements in this compound claim. AMZ-E006
      indirectly says that alternating dense and empty reaches match the
      pattern attributed to Carvajal, while AMZ-E007 corroborates several
      qualitative features through other witnesses. The strongest
      consideration against an unresolved verdict is that this indirect
      convergence makes the summary plausible, but it does not establish what
      the chronicle itself says under the evidence-only rule.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E005 quotes a manuscript comparison stating that the 50,000,
      10,000, and 8,000 warrior figures and four- or five-league villages are
      absent from Oviedo, while a figure of 5,000 warriors remains there. This
      directly supports both the branch difference and the continued populous
      picture without the most extreme figures. The strongest opposing
      consideration is that the ledger relies on Denevan's comparison rather
      than presenting a fresh collation of the manuscript witnesses.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Oviedo, through Medina, saying that he learned additional
      particulars in Santo Domingo from Orellana and other gentlemen who had
      accompanied him. That is a close match to the claim and also shows that
      Oviedo is not wholly independent of Orellana's oral account. The
      strongest opposing consideration is the indirect transmission through
      Medina rather than direct inspection of the cited Oviedo volume.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 documents Nunes's 1538 entry, the existence of ten accounts from
      the 1560 expedition, and descriptions of dense habitation, extensive
      food stores, straight roads, and abundant resources in the middle
      Solimões. Their different dates and institutional settings provide
      meaningful corroboration of the qualitative settlement picture. The
      strongest opposing consideration is that the evidence is a modern
      synthesis of transmitted testimony—Nunes's report was written later—and
      the quoted record does not independently display every detail, especially
      the ceramics component.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 directly reports Medina's statement that Gómara cited
      Orellana's relación and described it as “mentirosa.” Because the claim is
      about what Medina recorded rather than whether Gómara's accusation was
      justified, the evidence is closely matched. The strongest opposing
      consideration is that Gómara's original passage was not read directly,
      leaving Medina's selection and attribution unchecked.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E072 reports that Achmatowicz's abstract assesses Carvajal's account
      as a trustworthy source after examining its geographic reference points.
      This is direct evidence for the narrowly framed claim about the author's
      published assessment. The strongest opposing consideration is that only
      the abstract was read, so the quality of the geographic argument cannot
      be evaluated from this ledger.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 supplies independent sixteenth-century convergence on dense,
      provisioned, road-connected societies in the relevant middle-Amazon
      reaches, while AMZ-E005 shows that the extreme figures are not stable
      across manuscript branches. Contact-era settlement evidence elsewhere
      adds plausibility, and AMZ-E003 correctly limits the much earlier Aquiry
      evidence. The strongest opposing consideration is the absence of a
      reach-by-reach comparison with contact-horizon archaeology; Carvajal's
      partisanship noted in AMZ-E111 and uncertain transmission also prevent a
      stronger verdict.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 directly reports 432 detected earthworks, only 36 previously
      known, an approximately 183,000 km² cultural area, and the study's
      24,000–30,000 extrapolation. The claim properly describes the latter
      figure as a prediction rather than a direct count. The strongest
      opposing consideration is that AMZ-E038 and AMZ-E039 expose a
      several-fold disagreement with an earlier basin-wide model, so the
      regional total remains model-dependent even though the claim accurately
      reports what the 2026 study found and predicted.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E002 quotes the simultaneous-use assumption, the 300-person
      conversion, the 1.25–3 million result, and the much lower
      single-family alternative, including its canopy correction. The
      approximately fivefold movement under an explicitly stated alternative
      warrants describing the estimate as highly model-sensitive. The
      strongest opposing consideration is that the authors themselves call
      the single-family interpretation very unlikely, so that scenario is a
      sensitivity bound rather than an equally preferred estimate.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 directly states that earth-building cultures occupied an
      1,800-km southern-rim arc in fortified villages around AD 1250–1500 and
      reproduces the approximately 500,000–1,000,000 population calculation.
      It also explicitly records the contemporaneity assumption and the
      extrapolation from predicted earthwork occurrence. The strongest
      opposing consideration is that the population range is not a census and
      could shift substantially if site contemporaneity or ethnographic
      conversion assumptions fail.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E017 and AMZ-E018 provide direct archaeological support for
      Belterra occupation through seventeenth-century colonization and Cacoal
      occupation through AD 1650. AMZ-E019 adds Upper Xingu occupation through
      approximately 1770 and structural continuity with living Kuikuro
      villages. The strongest opposing consideration is that the Upper Xingu
      record is secondary journalism rather than the primary excavation
      report, lowering confidence in that component of the compound claim.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 reports drainage canals, farm ponds, and ubiquitous maize
      phytoliths from 178 samples across 18 profiles, supporting the inference
      of intensive year-round maize monoculture. The hydraulic structures
      provide a coherent mechanism for wet- and dry-season management. The
      strongest opposing consideration is that “monoculture” and the scale of
      population sustained are interpretive conclusions, and the Casarabe
      florescence ended before European contact.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Dark earth at Belterra, raised-field studies, and the Casarabe hydraulic
      evidence support substantial pre-Columbian landscape engineering, while
      AMZ-E012 and AMZ-E040 report associations between domesticated trees and
      archaeological sites or modelled earthwork probability. However,
      AMZ-E013 argues that post-Columbian activities probably contributed more
      to the modern floristic pattern, and the tree records cannot separate
      those periods. The strongest opposing consideration to a wholly positive
      verdict is this temporal confounding, compounded by the absence of an
      evidence record establishing the human-made forest-island component.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E016 directly dates intermittent Bermeo raised-field use from as
      early as AD 570–770 and associates construction with a few separate
      flood episodes rather than continuous cultivation. AMZ-E015 independently
      presents the flood-risk interpretation and the claim that fields were
      built where alternatives were lacking. The strongest opposing
      consideration is geographic scope: the intermittent chronology comes
      specifically from Bermeo and need not describe every Llanos de Mojos
      field complex.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record in the packet is assigned to this claim or quotes the
      pond, distance, weir, causeway, and functional observations together.
      The strongest consideration against an unresolved verdict is the
      presence of a verified source record describing such research, but under
      the instruction to weigh only evidence records that source listing
      cannot establish the claim.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E022 directly reports analysis of more than 17,000 fish remains at
      Loma Salvatierra, its location 50 km from the Mamoré, occupation from AD
      500–1400, and year-round interfluvial aquatic resources. The named
      dry-season species provide a mechanism for the year-round inference.
      The strongest opposing consideration is that the conclusion concerns
      one monumental mound and does not by itself establish the regional scale
      of fishing intensity.
  - claimId: AMZ-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E009 decisively establishes the specific example: Denevan rejected
      the habitat-density method that generated his 5.1–6.8 million estimate
      while continuing to regard at least 5–6 million as reasonable. This
      demonstrates that a retained number need not retain its original
      evidential basis. The strongest opposing consideration is that one
      author's self-correction does not establish the broader claim that
      basin-wide estimates as a whole form dependent model families; that
      requires the dependency audit proposed in the research agenda.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E020 directly reports that the summed-date analysis fit logistic
      growth toward carrying capacity and that the terminal decline was
      attributed to sampling bias compounded by post-European decline and
      dispersal. The claim appropriately presents both conclusions as results
      and interpretations of the authors' proxy analysis. The strongest
      opposing consideration is that summed radiocarbon distributions are
      biased relative-population proxies, not independent censuses, so the fit
      does not establish the true demographic trajectory by itself.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E008 reproduces the Napo–Aguarico and Mainas before-and-after
      estimates and the corresponding approximately 88% and 62–64% declines.
      It also documents epidemics, raids, missionization, forced service,
      revolt, and flight as interacting regional mechanisms. The strongest
      opposing consideration is geographic: these are upper-Amazon provinces
      with documentary records, so the results cannot be transferred
      uncritically to Carvajal's middle- and lower-Amazon reaches.
  - claimId: AMZ-C023
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      AMZ-E008 supports the broad conclusion that collapse was an interactive
      process involving disease, raids, missionization, coercion, revolt, and
      flight rather than one uniform epidemic wave. It does not document the
      claim's specific assertions about common epidemic fade-outs, repeated
      infection reintroduction, or the age and timing pattern of mortality.
      The strongest consideration against a weaker verdict is that the
      multi-causal conclusion is independently supported, but the distinctive
      epidemiological mechanism remains unevidenced in the admissible records.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E010 directly reports a model using 7,363 archaeological locations,
      identifies river distance as the most important predictor at 21.5% of
      permutation importance, and distinguishes sparser interfluvial
      probabilities from river-adjacent ones. This closely matches the claim.
      The strongest opposing consideration is survey-effort bias, because
      accessible river corridors are more likely to have been investigated
      and entered into the site database.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E011 directly summarizes the fourteen-region program as finding
      little to no evidence for annual crops, major clearing, anthropic soils,
      favored-tree enrichment, or recurrent extensive burning in most sampled
      terra-firme settings. The claim preserves the important western and
      interfluvial scope rather than universalizing the result to all
      Amazonia. The strongest opposing consideration is that the soil-core
      sample is spatially sparse and negative results count only where the
      chosen proxies retained and could detect the relevant activity.
  - claimId: AMZ-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record quotes or assesses the Walker machine-learning result
      stated in this claim, including the “limited, albeit impressive” wording
      or the two-thirds figure. The strongest consideration against an
      unresolved verdict is that a verified source record exists, but source
      metadata and a claim anchor are not evidence records under the specified
      assessment rule.
  - claimId: AMZ-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No admissible evidence record establishes the claimed 300 cores, five
      clusters, 1.17 cubic meters, or two-million-square-kilometer comparison.
      AMZ-E011 independently acknowledges spatially sparse soil-core sampling,
      which makes the criticism plausible but does not verify its exact
      quantities. That general acknowledgement is the strongest consideration
      against an unresolved verdict.
  - claimId: AMZ-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record assigned to this claim provides the Upano profile
      comparison or the quoted conclusion that forest recovery erased the
      pre-Columbian signal while preserving the later colonial one. The
      research agenda treats that observation as a premise, but research
      proposals are not evidence. The strongest consideration against the
      verdict is the presence of a verified source listing, which remains
      inadmissible here without an evidence record.
  - claimId: AMZ-C029
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      AMZ-E038 and AMZ-E039 provide context from the same basin-wide model,
      including its total prediction and the location of its highest-probability
      cells, but neither records the claim that almost 80% of Amazonia lies in
      the 0–1% class. They therefore make the claim coherent without
      establishing its exact percentage or geographic distribution. This
      same-model context is the strongest consideration against an unresolved
      verdict.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Contact-era settlement records from the southern rim, Belterra, Cacoal,
      and Upper Xingu support substantial sedentary populations and organized
      settlements in favored regions, while Casarabe and related records
      establish engineered subsistence. AMZ-E010 and AMZ-E011 independently
      support a much lighter interfluvial matrix, producing the heterogeneous
      pattern stated in the claim. The strongest opposing consideration is
      that both positive-site discovery and negative-core sampling are
      spatially biased, and several spectacular systems—including Aquiry and
      Casarabe—peak before immediate contact rather than precisely at it.