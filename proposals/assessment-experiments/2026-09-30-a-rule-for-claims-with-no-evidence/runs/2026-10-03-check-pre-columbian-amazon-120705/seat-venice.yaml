      absent from the Oviedo branch, which preserves one 5,000 figure. The
      only opposing consideration is that Denevan's comparison was checked
      via OCR copy rather than the publisher text, a minor provenance
      qualification for a claim this specific.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E089 quotes Oviedo's own statement that he learned particulars orally
