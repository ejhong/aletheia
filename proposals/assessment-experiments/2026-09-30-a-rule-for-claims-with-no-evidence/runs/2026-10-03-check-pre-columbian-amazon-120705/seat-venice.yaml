  synthesis: >-
    The featured hypothesis — that Carvajal described a real, populous, organized
    riverine world that largely vanished between his descent and later visits —
    decomposes into three legs, and the ledger treats them with different
    strengths. The first leg, the qualitative credibility of the 1542 account
    (C001, C002, C017), is the strongest part of the case: the extreme numbers
    are demonstrably manuscript-branch artifacts (E005), while the mundane
    load-bearing features of the account — dense settlement, vast food stores,
    long travelled roads, renowned ceramics — are independently repeated by
    hostile witnesses writing for different crowns before and after Orellana
    (E007), and the settlement geography Carvajal reports (populated reaches
    alternating with empty ones) matches Denevan's bluff model prediction
    (E006). The second leg, the engineered Amazon (C004, C006, C007, C008,
    C011, C019, C026), is now close to uncontestable at the level of
    observation: LiDAR, excavation, phytoliths, and zooarchaeology converge on
    earthworks, drained-field maize, engineered fisheries, and dark earths,
    with honest disclosure of the fivefold population-model sensitivity (E002)
    and the methodological fragility of basin totals (E009). The third leg, the
    collapse (C010, C023), is well documented for upper-Amazon provinces but
    geographically borrowed for the middle Amazon; no province-level
    reconstruction exists where the dispute actually lives. The sparse-matrix
    counter-evidence (C013, C014, C020, C029) is genuine and the case does not
    dodge it — it constrains the hypothesis to corridors and hotspots, which is
    what the synthesis claim C016 asserts. The strongest tension the ledger
    leaves unresolved is chronological: the grandest evidence (Aquiry peak AD
    100–300) predates Orellana by a millennium (E003), so contact-era density
    on the middle Amazon rests on documentary convergence rather than
    excavation. That gap, not any contradiction, is why the case is
    well_supported rather than established: every load-bearing claim survives
    scrutiny, but the decisive spatial test (R001) and the middle-Amazon
    collapse timeline (R005) remain unrun. No verdict element rests on paper
    counts; each rests on named measurements, manuscript collation, or
    replicated independent observation.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is the
    simultaneity problem: Nunes in 1538, Orellana/Carvajal in 1542, and ten
    separate Ursúa expedition accounts in 1560 — witnesses hostile to one
    another, writing for different crowns, none plausibly copying the others —
    independently describe the same mundane details (dense riverbank
    settlement, maize and fish stores in the thousands, Inca-style roads) on
    the same middle-Amazon reaches, and Newson documents 88% regional declines
    by 1700 through exactly the mechanisms (epidemics with fade-outs, slave
    raids, missionization, flight) that would erase such a world. This
    assessment cannot close that loop for the middle Amazon specifically: no
    ledger record provides contact-horizon archaeological confirmation of
    occupation on Carvajal's actual reaches in 1542, and no province-level
    collapse timeline exists there — the reconciliation currently rests on
    analogy with upper-Amazon provinces. A proponent can rightly say that the
    only reading that explains three independent eyewitness traditions plus
    documented regional collapse without invoking coincidence or invention is
    the murdered-world reading, and that nothing in this packet refutes it for
    the Solimões corridor; the fact that the Aquiry peak is early (AD 100–300)
    does not touch it, since Belterra, Cacoal, and the Upper Xingu show
    settlement systems persisting into the contact era elsewhere in the basin.
claimAssessments:
  - claimId: AMZ-C001
