      Oviedo is quoted via Medina's 1894 edition, and the Oviedo volume itself
      is blocked in this ledger, so no second reader has checked the passage.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E007 is a strong, natively verified record documenting Nunes's 1538 entry
      and the ten Ursúa accounts describing the same middle-Solimões features.
      The strongest opposing considerations, disclosed in the record itself:
      Nunes survives only via Porro's modern edition, and fortifications and
      organized warfare are NOT among the verified shared elements — so the
      corroboration covers settlement, stores, roads, and ceramics, not
      everything Carvajal reports.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E080 verifies Medina's statement that Gómara cited Orellana's relación
      calling it 'mentirosa'. The claim is about what Medina records, and that
      is established; the opposing consideration is that Gómara's own text is
      quoted by Medina rather than read directly, and the object of the charge
      is Orellana's narrative, not the Carvajal manuscript the ledger reads.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      E072 directly supports the claim — the abstract states the manuscript
      can be considered a trustworthy source — but the record is strength-
      weak, abstract-only, and the body assessing geographic reference points
      was never read. The strongest opposing consideration is that a landing-
      page abstract is the thinnest possible attestation of a scholarly
      argument's substance.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The qualitative leg rests on the strongest evidence in the case: the
      mundane features are independently corroborated (E007) and the numbers
      are demonstrably branch-unstable (E005), with a converging scholarly
      assessment on geographic grounds (E072). The strongest opposing
      consideration is chronological: the grandest archaeological support for
      populous Amazonia is dated AD 100–300, a millennium before Orellana
      (E003), so contact-era density on his specific reaches is inferred from
      documentary convergence, not excavation — the preregistered corridor
      test that would decide this has not been run.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      E001 verifies the 432 earthworks, the 183,000 km² delimitation, and the
      24,000–30,000 prediction verbatim, with the extrapolation limitation
      stated by the paper itself. The strongest opposing consideration is that
      the 24–30k regional total exceeds the upper bound of Peripato's basin-
      wide undiscovered-earthwork prediction (E038/E039), though those models
      are explicitly not commensurable and the comparator carries zero
      diagnosticity for what this claim asserts.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      E002 verifies both ends of the paper's own sensitivity analysis
      verbatim, including the authors' labeling of the single-family reading
