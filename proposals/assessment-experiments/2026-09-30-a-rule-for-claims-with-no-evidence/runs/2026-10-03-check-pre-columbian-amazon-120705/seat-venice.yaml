      highly model-sensitive with a roughly fivefold span — is the paper's own
      arithmetic, and the funding disclosure makes the skeptical reading the
      defensible default; the opposing consideration (authors reject the low
      branch) is already embedded in the claim's wording.
  - claimId: AMZ-C006
    verdict: well_supported
