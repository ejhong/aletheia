  - claimId: AMZ-C029
    verdict: unresolved
    confidence: low
    reasoning: >-
      Ledger evidence from Peripato et al. provides basin-wide undiscovered
      earthwork totals and Acre-centered high-probability concentration as
      context for other claims, but no evidence record quotes or supports
      the specific “almost 80% of Amazonia at 0–1% probability per 1 km²
      cell” statement. Strongest opposing consideration is consistency in
      direction with river-concentrated occupation models, which makes the
      figure plausible but still unestablished from the provided records.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is the structural synthesis of dense engineered corridors
      and hotspots (C004, C006, C007, C011 and related landscape evidence)
      embedded in a lighter forest matrix (C013, C014). Those dependencies
      are each well supported on the ledger, and no evidence forces either
      empty-pristine or basin-wide continuous civilization readings.
      Strongest opposing consideration is residual uncertainty in matrix
      density from survey bias and unevidenced sampling critiques, plus
      untested spatial match of Carvajal’s specific reaches, which could
      still shift the dense-to-sparse ratio without erasing heterogeneity
      itself.