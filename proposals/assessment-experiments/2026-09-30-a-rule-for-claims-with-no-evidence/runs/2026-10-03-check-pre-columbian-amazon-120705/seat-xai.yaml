  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      Prestes-Carneiro et al. analyze more than 17,000 fish remains at Loma
      Salvatierra (AD 500–1400, ~50 km from the Mamoré) and document
