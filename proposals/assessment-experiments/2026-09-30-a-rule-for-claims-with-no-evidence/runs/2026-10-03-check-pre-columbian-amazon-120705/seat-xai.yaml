      limiting extrapolation to all interfluves.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      Denevan explicitly rejects the habitat-density method that produced
      his 5.1–6.8 million figure for excess within-habitat variability,
      while still judging at least 5–6 million reasonable on other grounds.
      That is decisive for the methodological claim that published totals
      are model families sharing assumptions rather than independent
      censuses. Strongest opposing consideration is that retaining a similar
      magnitude on unspecified other grounds still leaves a large figure in
      play without a transparent replacement method in this record.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Arroyo-Kalin & Riris report SPD growth over ~1700 years fitting a
      logistic model approaching carrying capacity before colonization, and
      attribute terminal decline to sampling bias compounded by post-European
      collapse rather than a pre-European endogenous crash. Strongest
      opposing consideration is that SPDs are relative proxies with known
      biases, not absolute population measurements, so “carrying capacity”
      is aggregate and model-dependent.
  - claimId: AMZ-C010
    verdict: established
    confidence: high
    reasoning: >-
      Newson’s Table 1 and text give Napo–Aguarico ~49–51k to ~6k by ~1700
