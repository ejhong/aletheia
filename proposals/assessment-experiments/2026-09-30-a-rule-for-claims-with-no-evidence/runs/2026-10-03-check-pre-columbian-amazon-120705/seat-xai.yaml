      near-river areas. Strongest opposing consideration is survey-effort
      bias toward accessible riverine zones in site databases, which can
      inflate the river-distance signal even after modelling.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      Piperno et al.’s cumulative phytolith/charcoal synthesis across
      fourteen lowland regions reports little to no annual cropping,
      significant clearing, anthropic soils, favored-tree enrichment, or
      recurrent extensive fires in most sampled terra-firme settings,
      especially interfluves. Strongest opposing consideration is sparse
      soil-core spatial coverage and the requirement that negatives count
      only where proxies could detect the activities; critics of thin
      western sampling are not evidenced as records against this claim in
      the packet.
  - claimId: AMZ-C020
