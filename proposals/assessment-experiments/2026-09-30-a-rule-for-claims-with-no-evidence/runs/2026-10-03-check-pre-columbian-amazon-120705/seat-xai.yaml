      missionization, forced service, revolt, and flight. Strongest opposing
      consideration is geographic scope: upper-Amazon provinces with mission
      records; extension to Carvajal’s middle/lower reaches is
      extrapolation.
  - claimId: AMZ-C023
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Newson’s mixed-mechanism decline record supports interactive,
      multi-causal collapse in general, and the claim’s source anchor quotes
