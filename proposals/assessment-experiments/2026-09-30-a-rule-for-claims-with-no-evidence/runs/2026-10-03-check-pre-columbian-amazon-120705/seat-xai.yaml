  synthesis: >-
    The ledger supports a refined form of the featured hypothesis rather
    than either pole of the twentieth-century debate. Carvajal’s chronicle
    does describe populous, organized, road-linked riverine societies with
    stores and multi-settlement territories, alternating with empty
    stretches (C001). The most extreme warrior and village-length figures
    are textually unstable across manuscript branches (C002), while
    independent mid-sixteenth-century witnesses (Nunes; Ursúa accounts)
    independently recover the same qualitative middle-Amazon picture of
    dense settlement, vast food stores, long straight roads, and renowned
    ceramics without repeating the extreme Medina numbers (C003). That
    pattern, plus contact-era occupation of Belterra, Marajó Cacoal, and
    Upper Xingu systems (C011) and late pre-Columbian fortified villages
    along an 1,800 km southern rim (C006), makes Carvajal’s kind of social
    geography locally credible while requiring that his counts not be
    treated as census (C017). Monumental and engineered landscapes are no
    longer deniable: 2024 LiDAR over southwestern Amazonia documented
    hundreds of earthworks and projects tens of thousands regionally
    (C004); Casarabe practiced intensive year-round maize monoculture on
    drained and ponded savannah (C007); dark earths, raised fields, forest
    islands, and domesticated-tree concentrations document long-term
    landscape engineering in multiple regions (C008), even though raised-field
    use can be intermittent and flood-risk driven (C009) and the modern
    tree signal is partly confounded by post-Columbian management.
    Demographic headlines remain model-family dependent: the Aquiry
    1.25–3 million peak is highly assumption-sensitive and collapses
    several-fold under the paper’s own single-family alternative (C005);
    Denevan rejected the habitat-density method behind his influential
    5–7 million figure while still holding a similar order of magnitude
    reasonable on other grounds (C012); SPD proxies fit logistic growth
    to carrying capacity before contact, with terminal decline attributed
    to sampling plus post-European collapse rather than a pre-European
    crash (C015). Post-contact decline is real but uneven and multi-causal
    (epidemics, slave raids, missionization, flight), with documented
    ~88% and ~62–64% losses in upper-Amazon provinces by ~1700 (C010).
    Against basin-wide civilization, river distance is the dominant
    predictor across 7,363 sites and interfluves were more sparsely
    occupied (C013); cumulative phytolith/charcoal work finds little to
    no annual cropping, clearing, anthropic soils, tree enrichment, or
    recurrent fire in most sampled terra-firme settings (C014). The
    joint pattern is therefore C016’s heterogeneous Amazon: substantial
    sedentary, engineered populations along favored corridors, floodplains,
    savannas, and bluffs, embedded in a much more lightly occupied forest
    matrix. That structure answers the case question in the affirmative
    for Carvajal’s river world as a real, later-emptied social geography
    without requiring continuous basin-wide urbanism or treating his
    largest numbers as fact. Sensitivity is distributed rather than
    single-threaded: the mosaic verdict needs both the dense-corridor
    package (LiDAR, southern rim, Casarabe, contact-era sites, independent
    chronicles) and the sparse-matrix package (river-distance models,
    phytolith negatives). Removing the strongest sparse-matrix measurement
    (Piperno et al. synthesis) would most inflate occupation inferences
    and weaken the “embedded in lightly occupied forest” half of the
    case; the dense half would still stand. Claims lacking ledger
    evidence records (engineered-fisheries detail; ML “limited albeit
    impressive” extents; soil-core thinness critique; Upano erasure;
    fade-out mechanism as stated; basin-wide 80% low-probability cells)
    cannot presently tighten or overturn that roll-up.
  steelman: >-
    Independent sixteenth-century accounts still describe the middle
    Solimões as among the river’s most densely inhabited reaches, with
    “infinite” stores and long straight Inca-like roads, yet no
    preregistered, contact-horizon archaeological intensity test has been
    run along Carvajal’s own populated versus empty reaches with route
    uncertainty modeled; until that spatial prediction is checked, the
    fullest continuous-corridor reading of his qualitative geography
    remains an unrebutted, still-viable empirical possibility rather than
    a settled exaggeration.
claimAssessments:
  - claimId: AMZ-C001
    verdict: established
    confidence: high
    reasoning: >-
      Multiple ledger anchors treat the chronicle’s qualitative content—
      populous riverbank settlements, stores, roads, ceramics, multi-settlement
      territories, and empty stretches—as the shared descriptive baseline
      across branches. Denevan’s bluff-model discussion further aligns the
      dense-then-empty spatial rhythm with a known settlement geography.
      Strongest opposing consideration is transmission variance in numbers
      and some route glosses, which affects counts and tributary IDs but not
      the qualitative inventory the claim states.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      Denevan’s manuscript comparison states verbatim that 50,000 / 10,000 /
      8,000 warriors and villages four or five leagues long appear in
      Medina/Muñoz but not Oviedo, which retains the populous picture and
      one figure of about 5,000 warriors. No contrary collation is in the
      ledger. Strongest opposing consideration is that Oviedo also drew on
      oral supplementation from Orellana’s party, so branch differences mix
      textual and oral pathways rather than pure scribal loss alone.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: high
    reasoning: >-
      Medina quotes Oviedo stating he added particulars learned in Santo
      Domingo from Captain Orellana and accompanying gentlemen beyond the
      friar’s written eyewitness text. That is direct support for oral
      supplementation of Oviedo’s version. Strongest opposing consideration
      is second-hand quotation via Medina rather than the Oviedo volume
      itself, so wording fidelity depends on the 1894 edition.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Lopes et al. document Nunes’s 1538 Machiparo entry and multiple 1560
      Ursúa accounts describing dense middle-Amazon settlement, vast stores,
      long straight roads, and ceramic renown on the same reaches, without
      Carvajal’s extreme numbers. Independence across crowns and hostile
      parties strengthens the qualitative corroboration. Strongest opposing
      consideration is that Nunes survives as a later letter via modern
      edition, and fortifications/organized fleets are not verified common
      elements in this record.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Medina records that López de Gómara cited Orellana’s relación and
      labeled it “mentirosa.” The claim as stated—about Medina’s record of
      Gómara’s charge—is supported. Strongest opposing consideration is that
      the charge targets Orellana’s relación and, in Medina’s reading, the
      Amazons episode, not a blanket impeachment of Carvajal’s settlement
      geography; Gómara’s own text is not read directly in the ledger.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The journal abstract states Achmatowicz concludes Carvajal can be
      considered a trustworthy source after geographic-reference study, which
      matches the claim’s wording. Only the abstract was read; the body,
      route arguments, and treatment of population figures are absent.
      Strongest opposing consideration is minimal weight of an unread
      article plus restriction of the assessment to geographic verisimilitude
      rather than social or numeric content.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: high
    reasoning: >-
      Qualitative credibility rests on the shared chronicle content (C001),
      independent sixteenth-century repetition of mundane dense-settlement
      features (C003), and archaeological reality of late pre-Columbian and
      contact-era complex riverine/southern systems (C006, C011), while
      numeric instability is directly evidenced by branch divergence (C002).
      Character endorsements and truth-oaths add little diagnostic weight.
      Strongest opposing consideration is that the decisive spatial test
      comparing Carvajal’s populated versus empty reaches to contact-horizon
      archaeology has not been run, so local intensity could still be
      overstated even if the qualitative class of society is real.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 2026 Nature study’s results state 432 earthworks on 4,430 km of
      LiDAR (396 new), an ~183,000 km² Aquiry delimitation, and a
      24,000–30,000 earthwork prediction within it. Documentation of the
      flown sample is strong; the regional total is an explicit
      block-extrapolation. Strongest opposing consideration is model
      disagreement with earlier basin-wide undiscovered-earthwork predictions
      (different definitions and data) and the early AD 100–300 demographic
      peak’s limited direct bearing on 1542.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      The paper’s own population section states the 1.25–3 million figure
      from simultaneous-use fraction and ~300 people per earthwork, and
      gives the single-family alternative of ~250,000–600,000
      (~315,000–760,000 with canopy correction), labeled “very unlikely”
      by the authors. The claim correctly reports model sensitivity rather
      than adjudicating the preferred model. Strongest opposing consideration
      is author pushback that the low end is unlikely; sensitivity remains
      theirs regardless.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      de Souza et al. document earth-building cultures in fortified villages
      along an ~1,800 km southern rim ~cal AD 1250–1500 and state a
      ~500,000–1,000,000 population estimate under contemporaneity,
      ethnographic conversion, and projected extrapolation—all disclosed.
      Dating and settlement pattern are strong; the headcount is model-bound
      as the claim says. Strongest opposing consideration is dependence on
      site contemporaneity and MaxEnt-style extrapolation beyond surveyed
      enclosures.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Belterra Plateau sites with dark earths, ponds, and trodden roads date
      ca. AD 1300 to seventeenth-century colonization; Cacoal on Marajó
      dates AD 1300–1650 into Portuguese contact; Upper Xingu occupations
      extend to ca. 1770 with layouts matching living Kuikuro villages
      (latter via secondary science feature). Multiple regions show
      continuity into or beyond contact. Strongest opposing consideration is
      secondary-source weight for the Xingu date/layout summary pending
      primary reports, and regional rather than basin-wide coverage.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      Lombardo et al. document drainage canals, savannah farm ponds, and
      ubiquitous maize phytoliths across profiles, concluding intensive
      year-round maize monoculture sustaining relatively large Casarabe
      populations. Remote sensing, survey, and phytoliths converge.
      Strongest opposing consideration is that Casarabe florescence ends
      before European contact, so it is not itself a 1542 middle-Amazon
      witness.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Levis et al. show domesticated species abundance and richness rising
      on and around archaeological sites; additional association with
      modelled earthwork probability is reported in related work; dark
      earths and raised-field/forest-island engineering are widely attested
      in the case’s landscape package. McMichael et al.’s technical comment
      argues post-Columbian land use likely played the larger role in the
      modern floristic pattern. Strongest opposing consideration is that
      post-contact management confounds the tree-composition leg, so
      pre-Columbian extent of that signal is only partly isolated.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      Rodrigues et al. date intermittent raised-field use from as early as
      AD 570–770 in few construction events linked to severe-flood periods,
      challenging continuous intensive cultivation; Lombardo et al. 2011
      argue construction where no alternatives existed for flood-risk
      mitigation. Strongest opposing consideration is geographic specificity
      (Bermeo-area fields; Llanos de Mojos), so other complexes could differ
      in intensity regime.
  - claimId: AMZ-C019
