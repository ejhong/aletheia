      Denevan's textual analysis (AMZ-E006) confirms that Carvajal's chronicle explicitly records populous riverine settlements clustered where channels met bluffs, interspersed with reaches noted as completely empty. This alternation between populated political territories and uninhabited stretches is an integral structural feature of the primary text. The strongest opposing consideration is that Carvajal's observations were recorded during a hurried, hostile river descent and may reflect selective eyewitness recollection shaped by sixteenth-century expeditionary narrative conventions.
