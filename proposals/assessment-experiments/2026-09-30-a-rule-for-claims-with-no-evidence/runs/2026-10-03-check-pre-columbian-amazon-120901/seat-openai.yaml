  synthesis: >-
    The admitted evidence provisionally supports the featured hypothesis in
    its geographically limited form: Carvajal probably encountered genuinely
    populous and organized societies along particular river reaches, while
    neither his largest figures nor a basin-wide densely settled Amazon are
    warranted. The strongest direct corroboration is AMZ-E007. It reports that
    Nunes entered Machiparo in 1538 and that ten accounts survive from the 1560
    Ursúa expedition, with descriptions of dense middle-Solimões settlement,
    extensive food stores, straight travelled roads, and abundant aquatic
    resources. These are independent expeditions close in time and place to
    Orellana, and they reproduce mundane features central to Carvajal's social
    geography without reproducing his extreme numbers. AMZ-E005 independently
    shows why those numbers require skepticism: the figures of 50,000, 10,000,
    and 8,000 warriors and villages four or five leagues long are absent from
    the Oviedo branch, although that branch contains a figure of about 5,000
    warriors.

    Archaeology supplies substantial ecological and institutional
    plausibility rather than a direct validation of Carvajal's route.
    AMZ-E004 documents late pre-Columbian fortified villages along the southern
    rim; AMZ-E014 documents engineered, year-round Casarabe maize production;
    and AMZ-E017 through AMZ-E019 place substantial settlement systems at
    Belterra, Marajó, and the Upper Xingu into the contact era or later. These
    observations rebut a strong ecological-impossibility prior. They do not,
    however, prove that the particular settlements Carvajal described existed
    at the places or sizes he reported. Some impressive examples are also too
    early: AMZ-E003 dates the Aquiry demographic peak to AD 100–300, and
    AMZ-E014 says the Casarabe florescence ended by about 1400.

    The disappearance mechanism is credible but incompletely closed
    geographically. AMZ-E008 documents catastrophic and uneven decline in
    Napo–Aguarico and Mainas through epidemics, raids, missionization, forced
    service, revolt, and flight. This establishes that rapid regional
    depopulation and relocation occurred, but its extension to Carvajal's
    middle- and lower-Amazon reaches remains an extrapolation. Conversely, the
    evidence strongly rejects a uniform, basin-wide metropolis. AMZ-E010 finds
    river distance to be the leading occupation predictor, while AMZ-E011
    finds little intensive-use signal in most sampled terra-firme settings.
    Their survey and detection biases matter, but together they support a
    mosaic of dense corridors and lightly occupied forest.

    The strongest case against the hypothesis is therefore not that complex
    Amazonian societies were impossible; that position is contradicted by the
    measurements. It is that regional analogues, early monuments, and modeled
    populations cannot substitute for contact-horizon archaeology along
    Carvajal's actual route, and that the admitted evidence does not directly
    establish every descriptive element attributed to his chronicle in
    AMZ-C001. The single evidence record whose removal would most change the
    verdict is AMZ-E007. Without it, the same-reach historical corroboration
    disappears, leaving archaeological possibility and geographically
    displaced analogues; the present verdict would not survive at the same
    level and would fall to weakly_supported. Thus the route-specific portion
    of the provisional verdict is partly dependent on one ledger record,
    although that record itself summarizes several distinct sixteenth-century
    witnesses.
  steelman: >-
    The strongest unanswered pro-hypothesis prediction is that a
    manuscript-blind, reach-by-reach map of Carvajal's populated and empty
    stretches will align with independently measured AD 1400–1650
    archaeological intensity, including abandonment or disruption horizons
    after the voyage; the ledger contains no such corridor test.
claimAssessments:
  - claimId: AMZ-C001
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      AMZ-E006, which is attached to this claim, establishes Denevan's model of
      sporadic bluff occupation but does not directly quote the chronicle's
      listed observations. AMZ-E005, attached to AMZ-C002, confirms that the
      manuscript branches contain village and warrior descriptions, while
      AMZ-E007, attached to AMZ-C003, reports independent witnesses whose
      observations overlap several features attributed to Carvajal. The
      strongest opposing consideration is that the admitted records do not
      directly reproduce Carvajal passages establishing every listed element,
      especially fine ceramics, political territories, and the reported empty
      stretches.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E005 directly states that the figures of 50,000, 10,000, and 8,000
      warriors and villages four or five leagues long occur in the
      Medina/Muñoz versions but not in Oviedo, which has one figure of 5,000
      warriors. This strongly establishes the claimed numerical instability.
      The strongest opposing consideration is that the record's quoted passage
      does not itself spell out all the qualitative settlement material said
      to remain in Oviedo.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina quoting Oviedo as saying that he learned additional
      particulars in Santo Domingo from Orellana and other returning gentlemen.
      That directly supports the claim about Oviedo's stated supplementation
      process. The strongest opposing consideration is transmission: Oviedo's
      own volume was not read directly, and the wording is carried through
      Medina.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 identifies Nunes's 1538 entry into Machiparo and ten surviving
      accounts from the 1560 Ursúa expedition, and reports dense middle-Solimões
      settlement, extensive maize stores, straight roads, and abundant
      resources. This substantially corroborates the central claim of
      independent testimony near the same region. The strongest opposing
      consideration is that Nunes's testimony survives through a later letter
      and modern edition, while renowned ceramics are not included in the
      admitted record's quoted source statement.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 states that Medina recorded Gómara citing Orellana's relación and
      calling it “mentirosa.” It also correctly limits the object of the charge
      to Orellana's narrative rather than silently transferring it to
      Carvajal's text. The strongest opposing consideration is that Gómara's
      own passage was not read and the evidence is Medina's secondhand report.
  - claimId: AMZ-C065
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E072 reports that Achmatowicz's abstract assesses Carvajal's account
      as trustworthy on the basis of geographic reference points. This directly
      supports the claim as a statement about Achmatowicz's published
      assessment, not as independent proof that Carvajal was accurate. The
      strongest opposing consideration is that only the abstract was read, so
      the geographic analysis and its limitations cannot be evaluated.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E005, attached to AMZ-C002, strongly supports the numerical-instability
      leg, and AMZ-E007, attached to AMZ-C003, supplies nearby sixteenth-century
      corroboration for dense settlement, stores, and roads. AMZ-E004, attached
      to AMZ-C006, and AMZ-E017 through AMZ-E019, attached to AMZ-C011, establish
      organized late or contact-era settlements elsewhere, while AMZ-E003
      warns that Aquiry's demographic peak was much earlier. The strongest
      opposing consideration is the absence of a contact-horizon,
      reach-by-reach archaeological test along Carvajal's actual route,
      compounded by AMZ-E111's weak evidence of the chronicler's partisanship.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 directly reports 432 detected earthworks, only 36 previously
      known, an approximately 183,000 km² cultural area, and an extrapolated
      total of roughly 24,000–30,000 earthworks. The measurements and the fact
      that the total is a block extrapolation are both explicit. The strongest
      opposing consideration is that AMZ-E038 and AMZ-E039 document a
      noncommensurable basin-wide model producing substantially lower totals,
      so the regional prediction remains model-dependent even though the claim
      accurately reports it.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 directly gives the assumed 25–60% simultaneous-use fraction, 300
      people per average earthwork, the resulting 1.25–3 million estimate, and
      the much lower single-family alternative. These are the paper's own
      assumptions and sensitivity calculation, so the stated model dependence
      is established. The strongest opposing consideration is that the authors
      call the single-family interpretation “very unlikely,” which limits its
      standing as an equally preferred demographic model but not its value as
      a sensitivity bound.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 directly states that fortified earth-building villages occupied
      an 1,800 km southern-Amazon arc around AD 1250–1500. It also explicitly
      supplies the contemporaneity assumption, ethnographic conversion, and
      projected population range summarized by the claim. The strongest
      opposing consideration is that the extent and especially the population
      are extrapolations from sampled sites rather than a complete census.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E017 strongly supports Belterra occupation into seventeenth-century
