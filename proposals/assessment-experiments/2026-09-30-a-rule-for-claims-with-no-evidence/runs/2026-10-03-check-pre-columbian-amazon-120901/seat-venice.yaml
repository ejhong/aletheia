  synthesis: >-
    The featured hypothesis — that Carvajal described a real, organized,
    populous riverine world that largely vanished between his 1542 descent
    and the sparser later record — is better supported by this ledger than
    either the invention reading or any basin-wide-civilization reading.
    The qualitative-vindication leg rests on convergent, partly
    independent lines: Nunes entered Machiparo in 1538, before Orellana,
    and the ten 1560 Ursúa accounts repeat the mundane load-bearing
    features (dense settlement, vast stores, Inca-like roads, famed
    ceramics) on the same reaches without repeating the extreme numbers
    (AMZ-E007, AMZ-C003); the manuscript-branch comparison shows the
    famous figures are textual variants, not shared bedrock (AMZ-E005,
    AMZ-C002); and Denevan's bluff model independently predicts the exact
    populated/empty alternation Carvajal reports (AMZ-E006). The
    landscape-plausibility leg is strong: engineered maize monoculture
    (AMZ-E014), fortified contact-era settlement systems (AMZ-E004,
    AMZ-E017), and a genuinely sparse interfluvial matrix (AMZ-E010,
    AMZ-E011) jointly carry the heterogeneity synthesis (AMZ-C016). The
    collapse leg is real but geographically borrowed: Newson's 88% and
    62–64% declines are upper-Amazon provinces (AMZ-E008), and the
    middle-Amazon province-by-province timeline that would close the loop
    (AMZ-R005) does not yet exist. Steelmanning the other side: the
    sparse-matrix negatives are spatially thin samples (AMZ-E011's own
    limitations), all population figures are model families with huge
    internal spans (AMZ-E002, AMZ-E009), and the Aquiry demographic peak
    is a millennium too early to corroborate 1542 directly (AMZ-E003).
    Sensitivity: remove AMZ-E007 and the qualitative leg loses its only
    direct, pre-Orellana, independent witnesses; the verdict would
    degrade to provisionally_supported on the remaining archaeological
    plausibility, so the well_supported grade does not fully survive
    that removal. The demography of the 1542 middle Amazon itself
    remains unresolved, which is why confidence is moderate rather than
    high.
  steelman: >-
    The strongest unanswered proponent argument is the silence gradient:
    three mutually hostile expeditions from two crowns (Nunes 1538,
    Orellana/Carvajal 1541–42, Ursúa 1560) independently describe the
    same middle-Amazon reaches as densely settled with Inca-like roads
    and immense food stores, and no evidence record in this ledger shows
    those same reaches still populous after the seventeenth century —
    so the observed later emptiness on exactly those reaches is an
    unexplained observation under my assessment, and only the not-yet-run
    AMZ-R005/R007 tests would answer it.
