  synthesis: >-
    The evidence records collectively overturn the twentieth-century default of an ecologically impossible Amazon while simultaneously rejecting any basin-wide continuous civilization. Carvajal's qualitative picture of populous, road-linked, store-holding riverbank polities (AMZ-C001) is corroborated by independent sixteenth-century witnesses on the same middle-Amazon reaches (AMZ-C003 via E007) and matches the contact-era occupation of Belterra, Marajó Cacoal and Upper Xingu systems (AMZ-C011 via E017–E019). Extreme warrior and village-length figures are confined to one manuscript branch (AMZ-C002 via E005), rendering them textually unstable; the credible core is therefore the social geography, not the headcounts (AMZ-C017). Southwestern and southern-rim LiDAR and survey programs document tens of thousands of earthworks and fortified villages occupied into the late pre-Columbian window (AMZ-C004 via E001, AMZ-C006 via E004), while Casarabe engineered year-round maize monoculture with canals and ponds (AMZ-C007 via E014). Dark-earth and domesticated-tree signals mark long-term management around sites (AMZ-C008), though post-Columbian confounding remains (E013). Against this positive record, distance-from-river is the dominant predictor across 7,363 sites and interfluves are sparsely occupied (AMZ-C013 via E010); cumulative phytolith–charcoal sequences in western and interfluvial terra firme show little annual cropping, clearing or anthropic soils (AMZ-C014 via E011). Regional colonial demography records 62–88 % declines by mixed epidemic, raid and mission mechanisms (AMZ-C010 via E008). The resulting mosaic—dense engineered corridors and hotspots inside a lightly occupied matrix, occupied into contact and then catastrophically thinned—is exactly the landscape that makes Carvajal's kind of world locally real and subsequently emptied (AMZ-C016). Population totals remain model-family artifacts with wide sensitivity envelopes (AMZ-C005, AMZ-C012 via E002, E009); they do not overturn the qualitative pattern. The case therefore supports neither pristine wilderness nor uniform high density, but a heterogeneous human Amazon whose riverine reaches match the emptied-world reading of the 1542 account. Sensitivity is highest to the independent-witness block (E007) and the contact-era dating block (E017–E019); without them the qualitative credibility of Carvajal would rest more heavily on later archaeology alone, yet the earthwork, landscape-engineering and sparsity records would still sustain the mosaic. The verdict is robust to removal of any single demographic model or secondary news feature.
  steelman: >-
    The still-unexecuted preregistered corridor test (populated versus empty reaches of the 1541–42 route against contact-horizon site density) remains the single strongest unrebutted prediction a proponent can invoke: if Carvajal's own empty stretches prove as empty archaeologically as his dense stretches prove dense, the qualitative map is vindicated at the highest possible resolution and the emptied-Amazon hypothesis gains a spatial smoking gun that no existing record has yet supplied or refuted.
claimAssessments:
  - claimId: AMZ-C001
    verdict: established
    confidence: high
    reasoning: >-
      The statement is a direct description of what the chronicle contains; E006 (attached to this claim) further notes that the reported pattern of dense reaches alternating with empty stretches matches the bluff-occupation geography. Strongest opposing consideration is manuscript-branch variation in numeric detail, but the qualitative inventory of settlements, stores, roads and ceramics is shared.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      E005 quotes Denevan's side-by-side manuscript comparison verbatim: the 50 000 / 10 000 / 8 000 warrior figures and 4–5-league villages appear only in Medina/Muñoz, while Oviedo retains only a single ~5 000 figure. No contrary collation is in the ledger. Strongest opposing consideration would be an unread third witness, but none is supplied.
  - claimId: AMZ-C074
    verdict: established
    confidence: high
    reasoning: >-
      E089 quotes Medina quoting Oviedo: the chronicler supplemented the friar's written text with particulars learned orally in Santo Domingo from Orellana and his companions. The transmission dependence is therefore explicit. Strongest opposing consideration is that the Oviedo volume itself is blocked, so the quotation is second-hand via Medina.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      E007 summarizes Nunes (1538, letter 1553/54) and the ten Ursúa accounts (1560) as independently describing dense middle-Solimões settlement, vast food stores, straight roads and ceramics—the mundane load-bearing features shared with Carvajal. Fortifications and extreme numbers are absent, which actually strengthens the qualitative concordance. Strongest opposing consideration is that Nunes survives only through a modern edition and the turtle-corral detail is later (Acuña).
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E080 records Medina's statement that Gómara cited Orellana's relación and labelled it 'mentirosa'. The charge is therefore documented, though aimed at Orellana rather than Carvajal directly. Strongest opposing consideration is that Gómara's own text is not read in the ledger, only Medina's report of it.
  - claimId: AMZ-C065
