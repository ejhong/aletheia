  - claimId: AMZ-C017
    verdict: well_supported
    confidence: high
    reasoning: >-
      The qualitative social-geography leg rests on C001 + C003 (E007) plus contact-era continuity (C011 via E017–E019) and late southern-rim occupation (C006 via E004); the numeric-instability leg is C002 (E005). Contextual character endorsements (E105, E106, E109–E111) add little diagnostic weight. Strongest opposing consideration is that the decisive corridor-matching test (R001) has not yet been run, leaving spatial representativeness open.
  - claimId: AMZ-C004
    verdict: established
    confidence: high
    reasoning: >-
      E001 quotes the 2026 LiDAR results: 432 earthworks (396 new) over 4 430 km, Aquiry area ~183 000 km², extrapolated 24 000–30 000 earthworks. E003 dates the peak AD 100–300. Comparator context from Peripato (E038, E039) shows model divergence but does not contradict the raw detection count. Strongest opposing consideration is that the regional total is an extrapolation from sampled densities.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      E002 quotes the paper's own sensitivity: the 1.25–3 million headline rests on simultaneous-use fraction and ~300 persons per earthwork; the single-family alternative collapses it to ~250 000–760 000. The fivefold span is therefore internal. Strongest opposing consideration is the authors' dismissal of the lower bound as 'very unlikely', which is an interpretive preference rather than new data.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      E004 quotes the 1800 km southern-rim occupation by earth-building cultures in fortified villages ~Cal AD 1250–1500 and the explicitly assumption-dependent 500 000–1 000 000 population envelope. Strongest opposing consideration is the reliance on site contemporaneity and MaxEnt extrapolation, both stated by the authors.
  - claimId: AMZ-C011
