    confidence: high
    reasoning: >-
      E017 documents Belterra Plateau sites ca. AD 1300 to seventeenth-century colonization with dark earths, ponds and roads; E018 dates Cacoal AD 1300–1650 into Portuguese contact; E019 (secondary) places Upper Xingu settlements to ca. 1770 in layouts matching living Kuikuro villages. Strongest opposing consideration is that the Xingu date range rests on a journalism summary pending primary reports.
  - claimId: AMZ-C007
    verdict: established
