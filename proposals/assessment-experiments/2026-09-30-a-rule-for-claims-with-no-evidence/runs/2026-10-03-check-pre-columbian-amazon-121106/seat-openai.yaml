  synthesis: >-
    The featured hypothesis contains three separable propositions: that
    substantial and organized Amazonian societies existed near contact, that
    Carvajal reliably observed such societies along parts of his route, and that
    post-contact disruption explains why later observers encountered a much
    emptier river world. The first proposition is well supported, but only in a
    geographically heterogeneous form. Fortified southern-rim villages dated to
    approximately AD 1250–1500, contact-era occupations at Belterra and Cacoal,
    Upper Xingu occupation extending to about 1770, Casarabe agricultural
    engineering, and several fisheries and raised-field records refute a simple
    ecological-impossibility account. Conversely, the river-distance model and
    palaeoecological results from sampled terra-firme settings support a lightly
    occupied matrix rather than a continuous basin-wide civilization. The
    resulting mosaic is consistent with Carvajal's reported alternation of
    populated and empty reaches, but regional consistency is not direct
    verification of his itinerary.

    The strongest case for Carvajal is AMZ-E007: Nunes and the Ursúa-expedition
    accounts independently report dense middle-Amazon settlement, large food
    stores, and travelled roads in the relevant broad region. These mundane
    convergences are more diagnostic than reputational endorsements or
    Carvajal's own truth claims. At the same time, AMZ-E005 establishes that the
    most spectacular numerical claims occur only in one manuscript branch.
    Accordingly, the qualitative account is substantially more credible than
    its extreme figures. Archaeology occupied into the contact era adds
    plausibility, while the early Aquiry and Casarabe cases chiefly rebut claims
    of environmental impossibility and cannot directly corroborate 1542.

    The disappearance leg is credible but geographically incomplete. AMZ-E008
    documents declines of about 88% in Napo–Aguarico and 62–64% in Mainas through
    interacting epidemics, raids, missionization, forced service, revolt, and
    flight. That supplies a demonstrated mechanism and regional magnitude, but
    it does not establish the same chronology province by province along the
    middle and lower Amazon reaches at issue. Contact-era occupation endpoints
    likewise demonstrate persistence and later transformation, not by themselves
    a route-specific depopulation sequence.

    Steelmanning the skeptical direction, the ledger has not yet matched
    Carvajal's populated and empty reaches against independently classified AD
    1400–1650 archaeology; route identifications remain uncertain, historical
    witnesses may share information or conventions, broad archaeological date
    ranges do not prove simultaneous regional populations, and demographic
    estimates are model-sensitive. Steelmanning the favorable direction, the
    convergence of independent testimony, contact-era settlements, demonstrated
    intensive subsistence, and documented catastrophic colonial decline makes
    wholesale invention less economical than a real but locally concentrated
    riverine world subsequently disrupted.

    The single most consequential evidence record is AMZ-E007. Removing it would
    eliminate the ledger's best same-region historical corroboration of
    Carvajal's ordinary social-geographic observations, leaving mostly analogous
    archaeology and general credibility judgments. The present verdict would
    not survive unchanged without that record; it would fall to
    weakly_supported, so the assessment depends materially on one historical
    corroboration record even though the broader mosaic model does not.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is Carvajal's
    fine-grained alternation of populated and empty reaches: if a preregistered
    route reconstruction shows that those classifications predict independently
    measured AD 1400–1650 archaeological intensity, generic exaggeration or
    retrospective storytelling would not readily explain the spatial match.
claimAssessments:
  - claimId: AMZ-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 supports the alternating spatial pattern, and AMZ-E007 indirectly
      confirms that other witnesses repeated several ordinary features attributed
      to Carvajal, including dense settlement, stores, and roads. The evidence
      records do not directly quote or collate the chronicle for every listed
      element, especially fine ceramics and multi-settlement political
      territories. The strongest opposing consideration is therefore that this
      claim is about the text's exact contents, while the available support is
      partly indirect.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 directly reports that the 50,000, 10,000, and 8,000 warrior
      figures and four- or five-league villages are absent from Oviedo's branch,
      while a figure of about 5,000 remains. This closely matches the claim and
      establishes material numerical instability between the manuscript
      branches. The strongest opposing consideration is reliance on Denevan's
      collation rather than a ledger-provided synoptic edition of both witnesses.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina's presentation of Oviedo saying that he added
      particulars learned in Santo Domingo from Orellana and other expedition
      members. That directly supports the narrowly stated claim about Oviedo's
      declaration. The strongest opposing consideration is that Oviedo is being
      read through Medina rather than from the Oviedo volume itself.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E007 directly identifies Nunes's 1538 entry and the ten Ursúa-expedition
      accounts, and reports dense settlement, very large maize stores, straight
      roads, and abundant aquatic food in the middle Solimões. Their different
      expeditions and contexts provide meaningful corroboration of Carvajal's
      ordinary observations without repeating his extreme numbers. The strongest
      opposing consideration is that Nunes survives through a later letter and
      modern edition, while the evidence statement does not itself document the
      claim's ceramics detail.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 reports Medina's statement that López de Gómara cited Orellana's
      relación and called it “mentirosa,” which is exactly the local historical
      claim. It does not establish that Gómara was correct or that his accusation
      targeted Carvajal's settlement descriptions. The strongest opposing
      consideration is that Gómara's own passage was not read directly and is
      available here only through Medina.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E072 records that Achmatowicz's abstract assesses Carvajal as a
      trustworthy historical source after examining geographic reference points.
      Because the claim concerns Achmatowicz's assessment rather than whether that
      assessment is correct, the abstract provides direct support. The strongest
      opposing consideration is that the article body and its geographic argument
      were not read, preventing evaluation of the assessment's soundness.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 supplies the strongest support for Carvajal's qualitative social
      geography through broadly independent testimony from the middle Amazon,
      while AMZ-E005 directly establishes that the extreme numbers vary by
      manuscript branch. Contact-era settlements in AMZ-E017 through AMZ-E019
      further establish that organized and road-connected settlement was not
      chronologically impossible. The strongest opposing consideration is the
      absence of a route-by-route contact-horizon test, compounded by uncertain
      route identifications and the earlier dates of some archaeological
      comparators.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E001 directly supports the 432 detected earthworks, 396 previously
      unknown cases, approximately 183,000 km² cultural area, and the study's
      24,000–30,000 extrapolation. AMZ-E038 and AMZ-E039 show that a different,
      noncommensurable basin-wide model produces a much lower total, emphasizing
      that the regional prediction is model-dependent without contradicting what
      the 2026 study predicted. The strongest opposing consideration is that the
      evidence record does not independently establish the claim's 4,430-km and
      2024 flight details.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 directly gives the assumed 25–60% simultaneous-use fraction,
      approximately 300 people per earthwork, the 1.25–3 million result, and the
      250,000–600,000 single-family alternative rising to 315,000–760,000 after
      canopy correction. The roughly fivefold sensitivity demonstrates the
      claimed dependence on demographic assumptions. The strongest opposing
      consideration is that the authors call the single-family interpretation
      very unlikely, so the lower scenario is a sensitivity bound rather than
      their preferred estimate.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E004 directly reports an approximately 1,800-km southern-rim arc of
      fortified earth-building villages dated around AD 1250–1500. It also states
      the contemporaneity assumption, ethnographic conversion, spatial
      extrapolation, and approximately 500,000–1,000,000 modeled population
      range. The strongest opposing consideration is that the population figure
      is not a census and could change materially if sites were not simultaneous.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 and AMZ-E018 directly support occupation at Belterra into
      seventeenth-century colonization and at Cacoal through approximately 1650,
      while AMZ-E019 reports Upper Xingu occupation to about 1770 and layouts
      resembling living Kuikuro villages. Together they establish multiple
      settlement systems persisting into or beyond contact. The strongest
      opposing consideration is that the Upper Xingu evidence is journalistic
      reporting of primary research and broad site date ranges do not prove
      uninterrupted occupation of every component.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 reports drainage canals, dry-season farm ponds, and maize
      phytoliths from 178 samples in 18 profiles, with the authors interpreting
      the system as intensive year-round maize monoculture. The combination of
      infrastructure and phytolith evidence strongly supports the claim as a
      report of Casarabe practice. The strongest opposing consideration is that
      the monoculture characterization is an interpretation from one regional
      study and the Casarabe florescence ended before contact.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      AMZ-E017 supports anthropogenic dark earth and engineered features at
      Belterra, AMZ-E015 and AMZ-E016 support raised fields in the Llanos de
      Mojos, and AMZ-E012 plus AMZ-E040 support associations between domesticated
      trees and archaeological or modeled earthwork locations. However,
      AMZ-E013 offers a substantial post-Columbian explanation for the modern
      tree signal, and no evidence record directly establishes the human-made
      forest-island component. The strongest opposing consideration to the broad
      pre-Columbian interpretation is therefore temporal confounding of tree
      composition combined with incomplete evidentiary coverage of this compound
      claim.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E016 directly dates intermittent Bermeo raised-field use from as early
      as AD 570–770 and describes a few construction events associated with
      severe flooding. AMZ-E015 independently presents the flood-risk mitigation
      interpretation and the “no alternatives” distribution. The strongest
      opposing consideration is that the dated result is specific to the Bermeo
      complex and cannot automatically characterize every Llanos de Mojos raised
      field.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: high
    reasoning: >-
      No admitted evidence record is linked to or directly documents the 382
      ponds, their distance from weirs or causeways, or the proposed operation of
      the V-shaped structures. AMZ-E022 supports year-round interfluvial fishing
      at another Llanos de Mojos site, but it does not establish this engineered
      fishery system. That related evidence is the strongest consideration in
      favor, yet it is insufficient for the specific claim.
  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E022 directly reports analysis of more than 17,000 fish remains from
      Loma Salvatierra, its location 50 km from the Mamoré, its AD 500–1400
      occupation, and exploitation of year-round interfluvial aquatic resources.
      It also identifies fish capable of persisting in small water bodies during
      the dry season. The strongest opposing consideration is that one site's
      assemblage does not establish the prevalence of this subsistence pattern
      across the wider region.
  - claimId: AMZ-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E009 decisively establishes that Denevan rejected the habitat-density
      method behind his 5.1–6.8 million estimate while continuing to regard at
      least 5–6 million as reasonable on other grounds. That example strongly
      illustrates the distinction between a plausible number and a failed
      generating method. The strongest opposing consideration is that one
      documented estimate does not by itself establish the broader claim that
      basin-wide estimates generally form dependent model families rather than
      independent measurements.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E020 directly reports that the summed radiocarbon proxy fits logistic
      growth toward carrying capacity and that its terminal decline was
      attributed to sampling bias compounded by post-contact decline and
      dispersal. This supports the claim as a characterization of the study's
      result and interpretation. The strongest opposing consideration is that
      summed radiocarbon distributions are biased relative-population proxies,
      not direct demographic measurements or proof that every region followed
      the aggregate pattern.
  - claimId: AMZ-C010
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E008 directly provides the Napo–Aguarico and Mainas starting and
      circa-1700 populations, corresponding decline percentages, and multiple
      mechanisms including epidemics, raids, missionization, forced service,
      revolt, and flight. The claim is appropriately restricted to regional and
      uneven reconstructions. The strongest opposing consideration is that these
      upper-Amazon provinces cannot by themselves establish equivalent decline
      magnitudes along the middle and lower Amazon.
  - claimId: AMZ-C023
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      AMZ-E008 supports an interactive collapse process involving epidemics,
      repeated coercive incursions, missionization, unrest, and flight rather
      than a single uniform cause. It does not document the claim's specific
      propositions about epidemic fade-outs, repeated infectious
      reintroductions, or the age pattern of mortality. The strongest
      consideration in favor is the demonstrated multi-mechanism process, but
      the distinctive epidemiological details remain unsupported by an evidence
      record.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E010 directly reports a model based on 7,363 archaeological locations,
      identifies distance from rivers as the most important predictor with 21.5%
      permutation importance, and characterizes interfluvial areas as more
      sparsely populated than river-proximate areas. This closely matches the
      stated statistical claim. The strongest opposing consideration is survey
      and database bias toward accessible riverine locations, which may inflate
      the apparent river effect.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E011 directly summarizes cumulative work across fourteen regions as
      showing little or no evidence in most sampled terra-firme settings for
      annual crops, major clearing, anthropic soils, favored-tree enrichment, or
      recurrent extensive fire. The claim preserves the important geographic and
      sampling qualifications rather than generalizing to all Amazonia. The
      strongest opposing consideration is sparse soil-core coverage and the
      possibility that some activities or sufficiently old disturbances were
      below proxy detection.
  - claimId: AMZ-C020
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record provided for this assessment states the Walker model's
      “limited, albeit impressive” conclusion or the claim that other site types
      dominate more than two-thirds of Amazonia. Other records support
      heterogeneity, but they do not establish this specific machine-learning
      output. The strongest consideration in favor is its compatibility with
      AMZ-C013 and AMZ-C014, which is corroborative context rather than evidence
      for the stated model result.
  - claimId: AMZ-C021
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record documents the asserted count of roughly 300 soil cores,
      their clustering in five areas, the 1.17-cubic-meter total, or the
      two-million-square-kilometer comparison. AMZ-E011 independently concedes
      sparse soil-core sampling, but it does not supply these figures or establish
      the formal criticism. That general sampling limitation is the strongest
      consideration in favor, yet the precise claim remains unevidenced.
  - claimId: AMZ-C022
    verdict: unresolved
    confidence: high
    reasoning: >-
      No admitted evidence record reports that forest recovery erased the
      pre-Columbian Upano signal while preserving the later Colonial signal.
      Evidence about Upano occupation dates elsewhere in the ledger cannot
      establish the palaeoecological erasure result. The strongest consideration
      in favor is the claim's consistency with the acknowledged detectability
      limitations of negative palaeoecological evidence, but consistency is not
      direct support.
  - claimId: AMZ-C029
    verdict: unresolved
    confidence: high
    reasoning: >-
      AMZ-E038 and AMZ-E039 describe the Peripato model's total undiscovered-site
      prediction and concentration of the highest-probability cells, but neither
      records the claim that almost 80% of Amazonia falls in the 0–1% class.
      Those records make the broad low-density pattern plausible without
      establishing the quoted proportion or geographic distribution. The
      strongest consideration in favor is this partial consistency with the same
      model, but the exact statistical claim lacks an evidence record.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      The positive settlement and engineering records in AMZ-E004, AMZ-E014, and
      AMZ-E017 through AMZ-E019 establish substantial populations and modified
      landscapes in several favored settings, including cases near or after
      contact. AMZ-E010 and AMZ-E011 independently support lower occupation
      intensity in interfluves and many sampled terra-firme settings, producing
      the claimed heterogeneous mosaic. The strongest opposing consideration is
      that survey coverage is uneven and several spectacular systems predate
      contact, so the exact density and extent of the immediately pre-contact
      matrix remain uncertain.