  verdict: well_supported
  loadBearing: [AMZ-C001, AMZ-C002, AMZ-C003, AMZ-C010, AMZ-C011, AMZ-C013, AMZ-C014, AMZ-C016, AMZ-C017]
  weakestLinks: [AMZ-C019, AMZ-C020, AMZ-C021, AMZ-C022, AMZ-C023, AMZ-C029, AMZ-C009, AMZ-C065]
  synthesis: >-
    The featured hypothesis — that Carvajal's 1542 account is substantially
    credible in its qualitative social geography while its extreme numbers are
    textually unstable, and that later silence reflects post-contact collapse
    in a strongly heterogeneous Amazon — is well supported by this ledger, but
    its two legs are supported at different strengths and by different kinds of
    evidence. The heterogeneity leg (AMZ-C016) is the strongest: monumental,
    dated, engineered settlement systems are documented by independent teams on
    the southern rim (de Souza 2018), in Mojos (Lombardo 2025; Blatrix; Prestes-Carneiro),
    and at Belterra, Marajó, and the Upper Xingu into the contact era (AMZ-C011),
    while the sparse-matrix leg rests on 7,363-site modeling (AMZ-C013) and the
    fourteen-region phytolith synthesis (AMZ-C014), both with honest sampling
    limitations. The Carvajal leg is solid but narrower: the manuscript-branch
    instability of his numbers (AMZ-C002, decisively documented by Denevan) and
    the independent Nunes/Ursúa corroboration of the qualitative picture
    (AMZ-C003) carry it; the bluff-model geography (AMZ-E006) matches his
    populated-and-empty pattern. The collapse mechanism is the case's weakest
    load-bearing inference: Newson's 88% and 62–64% declines are upper-Amazon
    provinces, and AMZ-R005 correctly notes the middle-Amazon reconciliation is
    extrapolated; AMZ-C023, the interactive-collapse mechanism, has no dedicated
    evidence record in this packet. Several expansion-wave claims (C019, C020,
    C021, C022, C029) similarly rest on verified sources but no structured
    evidence records, and I have graded them provisionally accordingly. The
    Aquiry record cuts both ways: it demolishes ecological-impossibility
    arguments but dates its demographic peak a millennium before Orellana
    (AMZ-E003), and its population headline carries a fivefold self-documented
    sensitivity (AMZ-C005). Sensitivity: removing AMZ-E007 (the Nunes/Ursúa
    corroboration) would strip the only independent contact-era witness to
    Carvajal's specific middle-Amazon reaches; the case verdict would soften to
    provisionally_supported on the Carvajal leg while the heterogeneity thesis
    survives intact on the archaeological record alone. No verdict here hangs
    on a single thread without saying so.
  steelman: >-
    Not one evidence record in this ledger tests Carvajal's own corridor
    archaeologically: the contact-horizon (AD 1400–1650) record along his actual
    middle-Amazon route has never been surveyed, and the only seventeenth-century
    resident headcount for his Omagua reach (the Laureano de la Cruz manuscript,
    AMZ-R007) remains unread with its key numeral garbled in the 1900 edition.
    The Nunes/Ursúa accounts independently confirm dense settlement, vast maize
    stores, and Inca-style roads on the very reaches Carvajal described, written
    for different crowns by witnesses hostile to one another — and none of the
    sparse-Amazon palaeoecology sampled those floodplain corridors, where the
    Upano result (AMZ-C022) shows forest recovery can erase exactly the signal
    that would have been left. A proponent can rightly say the "empty stretches"
    and the collapse are both still archaeologically unmeasured where the
    dispute actually lives, and that every negative datum comes from terra
    firme, not from the riverbanks Carvajal sailed.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim reports the content of the chronicle as transmitted, and
      Denevan 1996's manuscript comparison plus Lopes et al. 2024's verbatim
      quotations (AMZ-E005, AMZ-E007) verify the qualitative inventory and the
      interspersed empty stretches. The Medina source itself remains
      second-reader-unverified, but the case's content anchors are independent
      of it. The strongest opposing consideration is that the two manuscript
      branches differ materially, so "what Carvajal wrote" is branch-relative —
      the claim is carefully worded to survive that.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      Denevan 1996 (AMZ-E005) directly verifies the branch difference with the
      quoted passage, checked verbatim via full-text OCR. The only weakness is
      that the verification rode on a Wayback capture plus OCR copy rather than
      the publisher text, and no synoptic collation of all witnesses yet exists
      (AMZ-R002 is open). Nothing in the ledger contradicts the finding.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Oviedo's own statement (via Medina) that he learned
      particulars from Orellana and his gentlemen in Santo Domingo, which
      directly establishes the claim. The limitation is transmissional: Medina
      1894 is the only witness read, and its OCR text was not independently
      verified by a second reader. This matters because it makes the Oviedo
      branch non-independent of Orellana, which qualifies how much weight
      branch differences can bear — but the claim as stated is about what
      Oviedo says he did, and that is established.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E007 verifies the Nunes and Ursúa descriptions verbatim, including
      the Inca-comparable roads and the maize stores; independent witnesses for
      different crowns repeating the mundane load-bearing features is strong
      corroboration, and none repeats the extreme numbers. Limitations are
      disclosed and real: Nunes survives only through a 1553/54 letter via
      Porro's modern edition, and fortifications are NOT among the verified
      common elements. The claim as stated does not overreach into those.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 verifies Medina's statement that Gómara cited the relación as
      "mentirosa". The editor inference correctly notes the charge targeted
      Orellana's narrative, not the Carvajal text, and that Gómara's own
      passage is not in the ledger — so this is a second-hand record of a
      sixteenth-century judgment, which caps confidence but does not defeat the
      claim as stated.
  - claimId: AMZ-C065
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E072 verifies the abstract's "fuente digna de confianza" assessment,
      which is exactly what the claim states. But only the abstract was read —
      the geographic argument, its route conclusions, and whether the body
      qualifies the assessment are unverified, and the record is graded weak
      for that reason. The claim is about Achmatowicz's assessment, not about
      Carvajal's actual reliability, so it is true if the abstract is accurate;
      the residual risk is abstraction-only.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The strongest support is convergent: AMZ-E007 (independent qualitative
      corroboration on the same reaches), AMZ-E005 (documented numerical
      instability), and AMZ-E006 (a settlement geography matching his
      populated-and-empty pattern). The strongest opposing consideration is
      chronology and reach: the grandest archaeology (Aquiry, AD 100–300;
      Casarabe) ends centuries before 1542 and mostly outside his route, and
      the collapse ratios come from upper-Amazon provinces, so the middle-Amazon
      credibility leg rests heavily on documentary corroboration rather than
      excavation — hence moderate, not high. The reputational endorsements
      (AMZ-E105/E106/E109–E112) are correctly entered as non-diagnostic
      context.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 verifies the 432-earthwork LiDAR result and the 24,000–30,000
      regional prediction verbatim in a natively fetched source. The
      extrapolation is a block-density projection, as the paper states, and the
      Peripato comparator (AMZ-E038/E039) shows basin-wide totals differ
      several-fold between models — but that comparator has zero diagnosticity
      for what the 2026 study itself reports, and the claim is about what the
      study documented and predicted.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      The claim reports the paper's own sensitivity analysis, and AMZ-E002
      verifies both the headline derivation and the "very unlikely"
      single-family alternative verbatim — a roughly fivefold span across the
      authors' own stated assumptions. Since the claim asserts
      model-sensitivity rather than any population figure, the paper's own text
      settles it. The funding-transparency disclosure (the founder's grant)
      reinforces rather than undermines the skeptical reading this claim
      encodes.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 verifies the dating ("Cal AD 1250–1500"), the 1,800 km extent,
      and the stated-assumptions population chain (contemporaneity, ethnographic
      formulae, MaxEnt projection from 21,340 counted to ~500k–1M projected).
      The claim as stated explicitly flags the model dependence, so the
      limitation is part of the claim, not a rebuttal. It is an observation
