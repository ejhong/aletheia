  - claimId: AMZ-C016
    verdict: well_supported
    confidence: high
    reasoning: >-
      The synthesis claim's dependencies are all well supported in this packet:
      dated monumental earthworks and engineered subsistence (AMZ-C004,
      AMZ-C006, AMZ-C007), contact-era occupation of major systems (AMZ-C011),
