      E022 supports analysis of >17,000 fish remains at Loma Salvatierra (AD 500–1400, interfluvial) documenting year-round exploitation including dry-season small-water-body taxa. Opposing consideration is single-site scope for the zooarchaeological detail.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      E009 decisively quotes Denevan rejecting his habitat-density method for the 5.1–6.8 million figure while still holding at least 5–6 million reasonable on other grounds. Opposing consideration is none material to the methodological claim as stated.
  - claimId: AMZ-C015
