    reasoning: >-
      E020 supports SPD logistic growth toward carrying capacity before colonization and attributes terminal decline to sampling bias plus post-European collapse. Opposing consideration is that SPDs are relative proxies with stated biases, not a census, and cannot alone fix absolute population.
  - claimId: AMZ-C010
