  synthesis: >-
    The ledger supports a heterogeneous pre-Columbian Amazon rather than either a pristine empty forest or a basin-wide continuous civilization. Carvajal’s chronicle (AMZ-C001) reports populous, organized, road-linked riverine societies alternating with empty stretches; the most extreme warrior and village-length figures are confined to the Medina/Muñoz branch and absent from Oviedo (AMZ-C002, E005), so they cannot be treated as census counts. Independent sixteenth-century witnesses on the same middle-Amazon reaches—Nunes and the Ursúa accounts—repeat dense settlement, food stores, straight roads, and ceramics without the extreme numbers (AMZ-C003, E007). That qualitative social geography is therefore locally credible (AMZ-C017), while numerical claims remain textually unstable. Contact-horizon archaeology shows major settlement systems occupied into or past European arrival on the Belterra Plateau, Marajó Cacoal, and Upper Xingu (AMZ-C011; E017–E019), so disappearance after 1542 is not required to be a pre-contact endogenous collapse everywhere. Regional colonial demography documents catastrophic but uneven declines by mixed mechanisms (AMZ-C010, E008). Earthworks and engineered landscapes are real and substantial where surveyed: LiDAR-documented Aquiry earthworks and a large predicted regional inventory (AMZ-C004, E001), southern-rim fortified villages ~AD 1250–1500 (AMZ-C006, E004), Casarabe maize monoculture with drainage and ponds (AMZ-C007, E014), and anthropogenic dark earths plus domesticated-tree concentration near sites (AMZ-C008), the last qualified by post-Columbian confounding (E013). Yet basin-scale predictors and multi-region phytolith/charcoal work show occupation tightly tied to rivers and little intensive terra-firme agriculture or clearing in most sampled interfluves (AMZ-C013, AMZ-C014; E010, E011). Population headlines are model-family products with shared assumptions and wide sensitivity (AMZ-C005, AMZ-C012; E002, E009). The featured reading—that Carvajal described a real river world that later emptied—is therefore provisionally supported for qualitative corridor geography and post-contact decline, not for extreme counts or uniform basin density. Several catalog claims (fisheries detail, ML extent paraphrases, soil-core critique, fade-out mechanism, Peripato 80% low-probability cell claim) lack dedicated evidence records in this packet and cannot carry weight. Sensitivity is highest to the independent ethnohistoric corroboration and the riverine-versus-interfluve contrast; remove either and the case reverts toward unresolved exaggeration versus mosaic. The verdict does not require basin-wide urbanism and does not license treating Medina-only figures as measurements.
  steelman: >-
    No preregistered, contact-horizon archaeological intensity map of Carvajal’s specifically named populated versus empty middle-Amazon reaches yet exists, so a proponent can still hold that the main-stem corridor he described was as continuously dense as the qualitative sources claim and that later silence is almost entirely post-1542 collapse rather than original patchiness on those exact reaches.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Multiple secondary anchors (Denevan manuscript comparison; Lopes et al. quotations) and E006’s bluff-model geography consistently treat the chronicle as describing populous riverbank settlements, stores, roads, ceramics, and multi-settlement territories alternating with empty stretches. The strongest opposing consideration is that the ledger does not include a full primary collation of the Relación body itself, so wording depends on cited intermediaries.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      E005 quotes Denevan’s direct manuscript comparison: the 50,000 / 10,000 / 8,000 warrior figures and 4–5 league villages appear in Medina/Muñoz but not Oviedo, which retains one ~5,000 warrior mention and the populous-settlement picture. Opposing consideration is residual uncertainty about other uncompared passages, not about these stated extremes.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: high
    reasoning: >-
      E089 quotes Medina’s report of Oviedo stating he added particulars learned orally in Santo Domingo from Orellana and companions beyond the friar’s written text. Opposing consideration is second-hand transmission (Oviedo via Medina) without the Oviedo volume itself in the ledger.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      E007 documents Nunes (via 1553/54 letter) and multiple Ursúa-expedition accounts describing dense middle-Solimões settlement, vast stores, straight roads, and ceramics on reaches overlapping Carvajal’s. Opposing considerations include Nunes surviving only through later transmission and the verified common elements excluding fortifications/organized fleets as shared observations.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E080 supports that Medina records Gómara citing Orellana’s relación as «mentirosa». Opposing consideration is that the charge targets Orellana’s narrative (and, per related context, the Amazons episode), not a direct impeachment of Carvajal’s settlement geography, and Gómara is not read first-hand.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E072 records only an abstract-level scholarly assessment that geographic reference points make Carvajal’s manuscript trustworthy. The body was not read; the claim is therefore thin, and the abstract does not address numerical stability.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Qualitative credibility is backed by C001–C003 plus contact-era settlement continuity (C011) and late pre-Columbian southern-rim systems (C006); numerical instability is established by C002. E003 correctly warns that early Aquiry peak dates are weak direct corroboration of 1542. Opposing consideration remains the absence of the preregistered corridor archaeology test (AMZ-R001) that would lock spatial match to Carvajal’s populated versus empty reaches.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      E001 verbatim supports 432 LiDAR earthworks (396 new), ~183,000 km² Aquiry circumscription, and the study’s 24,000–30,000 extrapolation. E038/E039 supply non-diagnostic context that other basin models predict lower totals under different definitions. Opposing consideration is that the regional total is a density extrapolation, not a full inventory.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      E002 quotes the paper’s own sensitivity: headline 1.25–3 million versus single-family alternative ~250,000–600,000 (315,000–760,000 with canopy correction), resting on simultaneous-use fraction and ~300 people per earthwork. Opposing consideration is only the authors’ dismissal of the lower reading as “very unlikely,” which does not erase the model span.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      E004 supports the 1,800 km southern-rim fortified-village occupation ~Cal AD 1250–1500 and states the 500,000–1,000,000 estimate depends on contemporaneity, ethnographic formulae, and projected extrapolation. Opposing consideration is exactly that model dependence, which the claim already discloses.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      E017 (Belterra AD 1300 to seventeenth-century colonization with dark earths, ponds, roads), E018 (Cacoal AD 1300–1650), and E019 (Upper Xingu to ~1770 with Kuikuro-like layouts) jointly support occupation into or beyond contact. Opposing consideration is E019’s secondary journalistic weight pending primary reports.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      E014 documents Casarabe drainage canals, savannah farm ponds, and ubiquitous maize phytoliths interpreted as intensive year-round monoculture. Opposing consideration is chronological: florescence ends before European contact, so it does not by itself prove 1542 main-stem conditions.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      E012 and E040/E041 support domesticated-tree concentration on/near archaeological sites and association with modelled earthwork probability; dark earths and raised fields are widely attested in the claim’s framing. E013 strongly qualifies the tree signal as likely dominated by post-Columbian management. Opposing consideration is therefore confounding of the floristic leg, not denial of engineered soils and fields where excavated.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      E016 shows intermittent raised-field use from AD 570–770 in few construction events tied to flood periods; E015 frames construction where alternatives were lacking. Opposing consideration is geographic specificity (Bermeo-area fields) and possible different regimes elsewhere in the Mojos.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in this packet carries claimIds including AMZ-C019, so under the weigh-only-evidence-records rule the Blatrix fisheries measurements are absent despite a verified source entry. Strongest opposing consideration is that absence of a ledger evidence row is not a negative empirical finding about the weirs themselves.
  - claimId: AMZ-C026
