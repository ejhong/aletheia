      E008’s Table 1 and text document Napo–Aguarico ~88% and Mainas ~62–64% declines by ~1700 via epidemics, raids, missionization, forced service, revolt, and flight. Opposing consideration is that these are upper-Amazon provinces with mission records; extension to Carvajal’s middle/lower reaches is extrapolation.
  - claimId: AMZ-C023
