  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 directly quotes de Souza et al. 2018 establishing that an 1,800 km stretch of southern Amazonia was occupied by earth-building cultures in fortified villages (~Cal AD 1250–1500) and that their 500,000–1,000,000 population projection explicitly relies on contemporaneity, ethnographic formulae, and MaxEnt extrapolation. The main opposing consideration is the inherent uncertainty of unexcavated site contemporaneity across an entire regional arc.
  - claimId: AMZ-C011
