  synthesis: >-
    The central question of "The Emptied Amazon" asks whether Gaspar de Carvajal's 1542 narrative describes an imagined fantasy or a genuine pre-Columbian riverine society that vanished due to post-contact demographic collapse. Grounded strictly in the admitted evidence ledger, the historical and archaeological records strongly converge toward a nuanced synthesis: pre-Columbian Amazonia was neither a pristine, uniform wilderness incapable of supporting dense human populations nor a wall-to-wall basin-wide empire. Rather, it comprised highly engineered, densely populated corridors, savannas, and river bluffs embedded within a far more sparsely inhabited interfluvial matrix.

    On the historical side, Carvajal's qualitative geography—describing populous riverbank settlements, large food stores, connecting roads, and fine ceramics along specific reaches interspersed with unpopulated stretches—is corroborated by independent early chroniclers like Diogo Nunes (1538) and the 1560 Ursúa expedition accounts (AMZ-E007). Textual analysis demonstrates that his most extreme troop counts (e.g., 50,000 warriors) are confined to the Medina/Muñoz manuscript tradition and absent from the earlier Oviedo branch (AMZ-E005), confirming that while specific headcounts are textually unstable, the qualitative social geography is robust (AMZ-C017).

    Archaeological and palaeoecological surveys substantiate this mosaic model. LiDAR and ground surveys demonstrate monumental earthworks, engineered landscapes, and urbanism across southwestern Amazonia (AMZ-C004, AMZ-C061, AMZ-C063), intensive maize monoculture and hydraulic engineering in the Llanos de Mojos (AMZ-C007, AMZ-E014), and ditch-fortified villages along an 1,800 km stretch of the southern rim (AMZ-C006). Crucially, major complexes like the Belterra Plateau, Marajó's Cacoal, and Upper Xingu settlements were actively occupied up to or through European contact (AMZ-C011). When Old World epidemics, slave raiding, and mission disruptions struck, recorded regional depopulations exceeded 60–88% (AMZ-C010), demonstrating how dense riverine settlements rapidly evaporated into the forest matrix.

    Conversely, the evidence limits overextension. Predictive spatial modeling shows river proximity is the single dominant predictor of settlement (AMZ-C013), while extensive paleoecological soil coring across terra-firme interfluves shows negligible signs of intensive clearing, farming, or fire (AMZ-C014). Basin-wide population estimates remain brittle, model-dependent extrapolations rather than direct empirical counts (AMZ-C005, AMZ-C012). The single evidence record whose removal would most alter this assessment is AMZ-E007 (Lopes et al. 2024); without independent sixteenth-century corroboration from Nunes and the Ursúa expedition, Carvajal’s account would remain vulnerable to the charge of unique expeditionary confabulation, though the archaeological mosaic would survive.
