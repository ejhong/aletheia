    confidence: high
    reasoning: >-
      AMZ-E005 explicitly verifies from Denevan 1996 that the figures of 50,000, 10,000, and 8,000 warriors and leagues-long villages appear only in the Medina/Muñoz tradition, whereas Oviedo records only one figure of about 5,000 warriors. The strongest counter-argument is that Oviedo supplemented Carvajal with oral testimonies from Orellana (AMZ-E089), but the direct comparison between the extant textual branches is an established bibliographical fact.
