  synthesis: >-
    I interpret the featured hypothesis as the proposition that Carvajal
    encountered genuinely populous and organized societies in at least some
    Amazonian reaches and that subsequent depopulation helps explain the
    markedly emptier later record. It does not require his extreme figures to
    be accurate or imply a uniformly urbanized basin. On that formulation, the
    evidence provisionally supports the hypothesis. AMZ-E007 is the most
    directly probative positive record: through a modern synthesis, it reports
    that Nunes's testimony, preserved in a 1553/54 letter, and the ten accounts
    associated with the 1560 Ursúa expedition describe densely inhabited
    middle-Amazon reaches, very large food stores, and broad straight roads.
    These witnesses are more useful than generic demonstrations that Amazonian
    complexity was ecologically possible because they concern the same broad
    river region and repeat mundane elements of Carvajal's picture without
    repeating his largest numbers. AMZ-E005 independently establishes why those
    numbers should be separated from the qualitative account: the most extreme
    warrior totals and four- or five-league villages occur in one manuscript
    branch and not in Oviedo's version.

    Archaeology supports the wider plausibility and late persistence of such a
    world. AMZ-E004 documents fortified villages along an 1,800-km southern arc
    around AD 1250–1500, while AMZ-E017 and AMZ-E018 place substantial Belterra
    and Marajó occupations into the seventeenth-century contact period.
    AMZ-E019 extends the Upper Xingu chronology to about 1770, although it is
    journalism summarizing primary research. AMZ-E014 demonstrates engineered,
    year-round Casarabe maize production, but that florescence ended by about
    1400; likewise, AMZ-E003 places the Aquiry demographic peak around AD
    100–300. These earlier examples rebut ecological-impossibility arguments
    but cannot directly corroborate what Carvajal saw in 1542.

    The collapse component is real but geographically incomplete. AMZ-E008
    documents approximately 88% decline in Napo–Aguarico and 62–64% in Mainas,
    involving epidemics, raids, missionization, forced service, revolt, and
    flight. It does not establish comparable decline along every middle- or
    lower-Amazon reach described by Carvajal. The strongest case against a
    basin-wide reading is affirmative rather than merely skeptical: AMZ-E010
    finds river distance to be the leading occupation predictor among 7,363
    recorded sites, while AMZ-E011 finds little or no intensive-use signal in
    most sampled terra-firme settings. Both records have sampling limitations,
    but together they favor concentrated corridors and hotspots embedded in a
    sparser matrix.

    The skeptical steelman is therefore substantial. The ledger does not
    directly quote evidence for the full compound description in AMZ-C001, has
    not matched Carvajal's populated and empty reaches to contact-horizon
    archaeology, and has no admitted evidence for the detailed epidemic
    mechanism in AMZ-C023. Population totals are also assumption-sensitive:
    AMZ-E002 spans roughly fivefold under the Aquiry study's own alternatives,
    AMZ-E004 relies on contemporaneity and extrapolation, and AMZ-E009 records
    Denevan's rejection of his former habitat-density method. The positive
    steelman is that independent sixteenth-century accounts, late archaeological
    systems, and measured regional collapse converge on the same qualitative
    possibility without requiring the unstable headline numbers.

    Sensitivity is concentrated in AMZ-E007. Removing it would eliminate the
    ledger's strongest same-region historical corroboration and leave mostly
    archaeological plausibility plus collapse documented elsewhere; I would
    then lower the case verdict from provisionally_supported to mixed. The
    verdict therefore does not survive removal of that single ledger record,
    although the record itself aggregates multiple historical witnesses rather
    than one observation.
  steelman: >-
    The assessment does not answer the strongest route-specific prediction:
    after route uncertainty and reach classifications are fixed in advance, AD
    1400–1650 archaeological intensity should be systematically higher in
    reaches Carvajal labels populated than in reaches he labels empty. No
    admitted evidence record performs that comparison, so the most diagnostic
    possible vindication of his eyewitness social geography remains untested.
claimAssessments:
  - claimId: AMZ-C001
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      AMZ-E006 supplies a compatible model of sporadic bluff occupation, but
      its source statement does not quote Carvajal or establish the listed
      stores, roads, ceramics, territories, and empty reaches. AMZ-E005,
      attached to AMZ-C002, confirms that manuscript branches contain warrior
      figures and claims about very long villages, while AMZ-E007, attached to
      AMZ-C003, corroborates analogous regional features rather than the
      chronicle's wording. The strongest opposing consideration is that no
      admitted evidence record directly establishes the full compound
      description attributed to Carvajal.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 directly quotes Denevan's manuscript comparison: the 50,000,
      10,000, and 8,000 figures and four- or five-league villages are absent
      from Oviedo, which retains a figure of 5,000. The strongest opposing
      consideration is that the ledger relies on Denevan's comparison rather
      than a newly presented synoptic collation of the manuscripts; AMZ-E089,
      attached to AMZ-C074, also shows that Oviedo supplemented the written
      account with oral information.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina quoting Oviedo as saying that he added particulars
      learned orally in Santo Domingo from Orellana and other expedition
      members. The strongest opposing consideration is the transmission chain:
      Oviedo's volume was not read directly by the ledger, so the evidence is
      explicitly mediated through Medina.
  - claimId: AMZ-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 supports the central claim by identifying Nunes's entry into
      Machiparo, ten Ursúa-expedition accounts, and descriptions of dense
      habitation, immense maize stores, broad straight roads, and abundant
      aquatic food in the middle Solimões. The strongest opposing consideration
      is that Nunes's account survives through a later letter and modern
      edition, while the evidence record does not substantiate the claim's
      ceramics component or show that every listed account reports every
      feature.
  - claimId: AMZ-C068
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E080 directly reports Medina's statement that López de Gómara cited
      Orellana's relación and called it “mentirosa.” The strongest opposing
      consideration is that Gómara's own passage was not read and the record is
      explicit that Medina is the intermediary, limiting what can be inferred
      about Gómara's exact target or grounds.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E072 states that Achmatowicz's abstract assesses Carvajal's manuscript
      as trustworthy after studying its geographic reference points, which is
      exactly the local claim. The strongest opposing consideration is that
      only the abstract was read, so neither the geographic analysis nor its
      limitations can be independently evaluated; it also does not validate
      Carvajal's population figures.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E005, attached to AMZ-C002, strongly supports the numerical-instability
      leg, while AMZ-E007, attached to AMZ-C003, supplies independent testimony
      for dense settlement, food stores, and roads in the same broad
      middle-Amazon region. AMZ-E017 through AMZ-E019, attached to AMZ-C011,
      show that several substantial systems persisted into or beyond contact,
      but they do not constitute a route-specific test of Carvajal. The
      strongest opposing consideration is that no admitted record compares his
      populated and empty reaches with contact-horizon archaeology, and
      AMZ-E111 additionally records Medina's caveat about Carvajal's partisanship
      for Orellana.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E001 directly supports the observed 432 earthworks, 396 previously
      unknown, the roughly 183,000-km² region, and the study's prediction of
      about 24,000–30,000 earthworks. The strongest opposing consideration is
      that the regional total is an extrapolation, while AMZ-E038 and AMZ-E039
      show that a different, noncommensurable basin-wide model produced much
      lower totals; the evidence record also does not state the claim's
      4,430-km flight detail.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 directly gives the assumed 25–60% simultaneous-use fraction, 300
      people per earthwork, the 1.25–3 million estimate, and the much lower
      single-family alternative with and without canopy correction. The
      strongest opposing consideration is that the authors call the
      single-family interpretation “very unlikely,” so the full fivefold span
      is a sensitivity demonstration rather than equally weighted demographic
      scenarios.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E004 directly supports the 1,800-km southern-rim occupation by
      fortified villages around AD 1250–1500 and reproduces the approximately
      500,000–1,000,000 estimate. The strongest opposing consideration is that
      the population range depends on assumed contemporaneity,
      ethnographically derived conversion formulae, and spatial extrapolation,
