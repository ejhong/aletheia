caseAssessment:
  verdict: provisionally_supported
  loadBearing: [AMZ-C016, AMZ-C017, AMZ-C013, AMZ-C014, AMZ-C010, AMZ-C011]
  weakestLinks: [AMZ-C017, AMZ-C019, AMZ-C010]
  synthesis: >-
    The ledger's evidence composes into three tiers of unequal strength. The
    strongest tier is the engineered-landscape record: LiDAR-documented
    earthwork density in southwestern Amazonia (AMZ-C004 via AMZ-E001), a
    millennium-dated Aquiry demographic peak (AMZ-E003), fortified
    southern-rim villages dated AD 1250–1500 (AMZ-C006 via AMZ-E004),
    Casarabe maize monoculture with hydraulic infrastructure (AMZ-C007 via
    AMZ-E014), contact-era persistence at Belterra, Cacoal, and the Upper
    Xingu (AMZ-C011 via AMZ-E017, AMZ-E018, AMZ-E019), and interfluvial
    year-round fishing (AMZ-C026 via AMZ-E022). The second tier is the
    sparse-matrix record: river-distance as the dominant occupation predictor
    across 7,363 sites (AMZ-C013 via AMZ-E010) and the fourteen-region
    phytolith/charcoal synthesis finding little intensive-use signal in most
    sampled terra firme (AMZ-C014 via AMZ-E011). These two poles are not in
    contradiction; together they are exactly what AMZ-C016's heterogeneity
    synthesis asserts, and every dependency of that synthesis carries a
    strong evidence record. The demographic audit tier is the case's most
    instructive: Denevan's verified self-rejection of his own method while
    retaining the order of magnitude (AMZ-C012 via AMZ-E009, decisive), and
    the Aquiry population model's own fivefold assumption sensitivity
    (AMZ-C005 via AMZ-E002), together justify the case's methodological
    stance that estimates must be audited by dependency, not quoted. The
    Carvajal tier is weaker: his extreme numbers are textually unstable
    (AMZ-C002 via AMZ-E005), his qualitative social geography is
    independently corroborated only by other expeditions' testimony (AMZ-C003
    via AMZ-E007), and the chronology gap recorded in AMZ-E003 — the Aquiry
    peak sits a millennium before Orellana — blocks any spending of early
    grandeur as contact-era corroboration. The collapse mechanism is
    documented with 88% and 62–64% declines (AMZ-C010 via AMZ-E008), but in
    upper-Amazon provinces with mission records, not along the middle-Amazon
    reaches Carvajal described. Steelmanning the skeptics: the strongest
    positive evidence predates contact by centuries, the negatives come from
    exactly the interfluves where no hotspot evidence exists, and no record
    tests Carvajal's reaches against contact-horizon archaeology. Steelmanning
    the proponents: three hostile expeditions for different crowns converging
    on mundane detail is not the signature of invention. The composite
    verdict is provisionally_supported rather than well_supported because the
    case's distinctive move — his world died between the visits — rests on a
    geographic extrapolation (AMZ-C010's own limitation) and an unrun corridor
    test, while the heterogeneity core it embeds is itself well supported.
  steelman: >-
    No admitted evidence record tests Carvajal's qualitative social geography
    against physical remains along the middle Amazon itself. The independent
    corroboration the case relies on (AMZ-E007, attached to AMZ-C003) is
    testimony from other expeditions, not archaeology, and the one
    observation that could independently settle the matter — the
    preregistered comparison of his populated and empty reaches against
    contact-horizon occupation (research agenda item AMZ-R001) — has never
    been run. A proponent can rightly say that this assessment accepts his
    populated reaches on converging eyewitnesses alone, with zero
    excavation-based confirmation or refutation of the specific corridors he
    named, and that the negative palaeoecological record (AMZ-E011) was
    acknowledged by the ledger itself to be spatially sparse and
    detection-limited in the very terra-firme settings where a lightly
    occupied matrix would leave the faintest signal.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 (attached to this claim) documents Denevan's bluff model of
      sporadic, concentrated riverine settlement, which matches the alternating
      populated/empty pattern the claim attributes to Carvajal, and AMZ-E005
      (attached to AMZ-C002) confirms the Oviedo branch preserves the
      populous-settlement picture. The strongest opposing consideration: no
      evidence record reads the Relación's own text — SRC-CARVAJAL-1542 is
      unverified and its body unread, so the account's content is known only
      through secondary comparisons, and the two manuscript branches differ
      materially.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E005 verifies Denevan's manuscript comparison verbatim: the extreme
      figures appear only in the Medina/Muñoz branch, with one 5,000 figure in
      Oviedo. The strongest opposing consideration is that the record itself
      notes verification relied on an OCR full-text copy, and it is a single
      scholar's collation rather than the synoptic witness table the research
      agenda (AMZ-R002) proposes.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 verifies Medina's quotation of Oviedo stating he learned
      particulars orally from Orellana and his companions in Santo Domingo,
      which directly supports the claim. The strongest opposing consideration
      is transmission: the quote is at second hand via Medina, and the source
      record notes no quotation from SRC-CARVAJAL-1542 has been checked by a
      second reader.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 verifies the Nunes (1538) and Ursúa (1560) testimony describing
      dense settlement, vast food stores, and Inca-like roads on the same
      reaches, from witnesses hostile to one another writing for different
      crowns. The strongest opposing considerations, carried in the record's
      own limitations: Nunes survives only via Porro's modern edition, and
      fortifications, organized warfare, and parts of the ceramics detail are
      not among the verified common elements.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 verifies Medina's statement that Gómara cited Orellana's
      relación calling it "mentirosa." The claim as stated — that Medina
      records this — is exactly what the record shows; the opposing
      consideration is that Gómara's own text is quoted only through Medina and
      the record notes the object of the charge was Orellana's relación, not
      the Carvajal text.
  - claimId: AMZ-C065
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      AMZ-E072 verifies the journal abstract in which Achmatowicz calls the
      manuscript "una fuente digna de confianza" on geographic grounds. The
      record is explicit that only the abstract was read, the body was not,
      and it carries weak strength — so the claim about what this scholar
      concluded rests on a summary of his conclusion, not his argument.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The qualitative leg rests on converging indirect evidence: AMZ-E007
      (attached to AMZ-C003) shows independent expeditions repeating the mundane
      social geography, AMZ-E006 (attached to AMZ-C001) matches his
      populated/empty pattern to the bluff model, and AMZ-E077 (attached to
      AMZ-C017) adds a scholarly geographic-credibility assessment, though
      abstract-only and marked context. The numeric-instability leg is carried
      by AMZ-E005 (attached to AMZ-C002). The strongest opposing
      considerations: AMZ-E003 (attached to AMZ-C004 and AMZ-C017) shows the
      grandest archaeological corroboration dates a millennium before Orellana,
      and the credibility records attached directly to this claim (AMZ-E105,
      AMZ-E106, AMZ-E109, AMZ-E110, AMZ-E111) are all explicitly weak
      reputation or framing evidence bearing no diagnosticity — no record tests
      his reaches against contact-era archaeology.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 verifies the LiDAR documentation of 432 earthworks (396 new),
      the 183,000 km² Aquiry delimitation, and the 24,000–30,000 prediction
      verbatim; the extrapolation basis is stated in the record's limitations.
      The strongest opposing consideration is that AMZ-E038 and AMZ-E039
      (context records attached to this claim) show a published basin-wide
      model predicting several-fold fewer earthworks in total, so the
      regional prediction is not yet independently calibrated.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E002 verifies the paper's own population-estimation passage including
      the single-family sensitivity yielding 250,000–600,000 (315,000–760,000
      corrected), against the 1.25–3 million headline — a roughly fivefold
      span from the authors' own assumptions. The claim is about this
      sensitivity, which is directly quoted; the opposing consideration is
      only that the "very unlikely" label is the authors' characterization,
      and the record notes the emphasis is the ledger's.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 verifies the 1,800 km fortified-village arc dated Cal AD
      1250–1500 and quotes the full assumption chain behind the 500k–1M
      figure: site contemporaneity, ethnographic formulae, and MaxEnt
      extrapolation. The claim itself states that the population figure
      depends on those assumptions, so the strongest opposing consideration —
      that the extrapolated totals are model outputs, not measurements — is
      already inside the claim.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 verifies Belterra Plateau occupation from ca. AD 1300 to
      seventeenth-century colonization with dark earths, ponds, and trodden
      roads; AMZ-E018 verifies Cacoal's AD 1300–1650 dating into Portuguese
      contact. The weakest leg is the Upper Xingu range (AMZ-E019, moderate),
      which is journalism summarizing unpublished primary reports and held at
      secondary-source weight by its own limitations.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 verifies the Casarabe finding of intensive year-round maize
      monoculture with drainage canals and farm ponds from 178 phytolith
      samples across 18 profiles. The strongest opposing consideration is the
      record's own limitation: the Casarabe florescence ends around 1400 CE,
      so this documents engineering capacity centuries before contact, not the
      world of 1542.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E012 verifies the concentration of domesticated species on and
      around archaeological sites, and AMZ-E040/AMZ-E041 (attached to
      AMZ-C033 and this claim) corroborate with a different response variable,
      though with overlapping authorship. The strongest opposing consideration
      is AMZ-E013 (attached to this claim): post-Columbian activities likely
      played the larger role in the floristic pattern, and the record set
      cannot separate pre- from post-contact management — which qualifies the
      causal reading but not the observed association.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E016 verifies intermittent raised-field use from AD 570–770 in a few
      construction events tied to flood periods, and AMZ-E015 supports the
      flood-risk-mitigation reading with fields built only where no
      alternatives existed. The strongest opposing consideration is the
      record's own limitation: the dating is specific to the Bermeo complex,
      and other field systems may have different construction histories.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record is attached to this claim; it is held on its
      source alone. The nearest cross-claim basis is AMZ-E022, attached to
      AMZ-C026, which documents year-round interfluvial fishing resources at
      Loma Salvatierra — this makes the ecological premise of a managed fishery
      plausible but is a different observation (zooarchaeology, not the weir
      and pond engineering). A prior that engineered fisheries fit the
      documented Casarabe landscape-engineering pattern is stated as a prior,
      not evidence; the specific V-structure function claim is also marked by
      its own anchor as a postulate.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E022 verifies the analysis of more than 17,000 fish remains at Loma
      Salvatierra (occupied 500–1400 AD, 50 km from the Mamoré) demonstrating
      year-round interfluvial resources, with dry-season species named. The
      strongest opposing consideration is the source's own caveat, noted in
      the source record: the paucity of larger river fish suggests infrequent
      exogenous contributions, which bounds but does not undercut the
      year-round finding.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E009 verifies verbatim Denevan's rejection of his own
      habitat-density method while he still holds 5–6 million reasonable on
      other grounds — a decisive, first-party, checked statement of exactly
      what the claim asserts. The only residual weakness is that verification
      came via a Wayback copy of the publisher PDF, but the quoted passage was
      checked against it.
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E020 verifies the logistic-growth-to-carrying-capacity fit and the
      attribution of the terminal decline to sampling bias plus post-European
      collapse. The claim is faithfully what the source says, but the record's
      own limitation is the strongest opposing consideration: summed
      radiocarbon probabilities are a biased proxy for relative population
      change, an aggregate signal rather than a census, so the fitting itself
      rests on assumptions the proxy cannot fully discharge.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E008 verifies Newson's Table 1 figures — Napo-Aguarico 49,000–51,000
      falling to about 6,000 by circa 1700, Mainas declining 62–64% — with the
      mixed mechanisms quoted verbatim. The strongest opposing consideration
      is the record's own limitation: these are upper-Amazon provinces with
      mission records, and extension to the middle and lower Amazon is an
      extrapolation the claim's "region-specific" framing acknowledges but the
      case's use of it does not yet discharge.
  - claimId: AMZ-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record is attached to this claim. The nearest
      cross-claim basis is AMZ-E008, attached to AMZ-C010, which verifies from
      the same source (Newson 2003) that collapse ran through differing
      mixtures of epidemics, raids, missionization, and flight — partial
      corroboration of the interactive-process framing — but the specific
      fade-out dynamic in sparsely settled lowlands is not admitted as
      evidence here, and the quoted fragment ("fade outs were common") has not
      been verified against the text by any record.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E010 verifies the 7,363-site model with river distance as the most
      important predictor (21.5% of permutation importance) and sparser
      interfluvial occupation. The strongest opposing consideration is the
      record's own limitation: site databases inherit survey-effort bias
      toward accessible riverine areas, so the model's sparse-interfluve
      output partially reflects where people have looked as well as where
      people were.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E011 verifies the fourteen-region synthesis finding little to no
      evidence of crops, clearing, anthropic soils, enrichment, or recurrent
      fire in most sampled terra firme. The strongest opposing considerations
      are the record's own limitations: soil-core sampling is spatially sparse
      and negative signals count only where the proxy could detect the
      activity — so the claim's "in most sampled settings" scoping is doing
      necessary work, and an erasure effect (as flagged for the Upano Valley
      in the research agenda, AMZ-R008) could age-grade how much absence these
      negatives can bear.
  - claimId: AMZ-C020
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record is attached to this claim; the source record
      (Walker et al. 2023) is ai_verified, but verification of a source is not
      admission of the observation, so the proposition stands on its source
      alone and the ledger has not admitted the observation behind it.
  - claimId: AMZ-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record is attached to this claim; it is held on its
      source alone. The source record is ai_verified, but no evidence record
      quoting the critique's content has been admitted, so the sampling-thinness
      figure rests on an unadmitted observation.
  - claimId: AMZ-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record is attached to this claim. The Bush et al.
      2025 source record quotes the forest-recovery sentence, but no evidence
      record carries that observation into the ledger, and the claim about
      what the Upano profiles show therefore rests on its source alone —
      though it is flagged in the research agenda (AMZ-R008) as potentially
      decisive for grading AMZ-C014's negatives.
  - claimId: AMZ-C029
    verdict: unresolved
    confidence: low
    reasoning: >-
      No admitted evidence record is attached to this claim; the Peripato et
      al. 2023 source record notes the text was read during drafting, but the
      80%-at-0–1%-probability observation itself was never admitted as an
      evidence record (the related records AMZ-E038/AMZ-E039 attach only a
      comparator to AMZ-C004). The claim is held on its source alone.
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Although no evidence record is attached directly to this synthesis
      claim, its full dependency set carries admitted evidence: AMZ-E001
      (attached to AMZ-C004) for the earthwork hotspots, AMZ-E004 (attached to
      AMZ-C006) for the fortified southern rim, AMZ-E014 (attached to
      AMZ-C007) for Casarabe engineering, AMZ-E017/AMZ-E018/AMZ-E019 (attached
      to AMZ-C011) for contact-era persistence, and AMZ-E010 and AMZ-E011
      (attached to AMZ-C013 and AMZ-C014) for the sparse river-distance
      structure and the quiet terra firme. The strongest opposing
      consideration is that this is an attribution-rung synthesis over biased
      samples on both sides — discovery-biased site databases for the positive
      record, sparse cores for the negative — and the matrix density, the
      synthesis's open parameter, is exactly what AMZ-R003 is designed to
      measure and has not been.
verdictNotes: >-
  Sensitivity: the single evidence record whose removal would most change
  this case is AMZ-E007 (attached to AMZ-C003). It is the only admitted
  physical-observations-free but independent corroboration of Carvajal's
  qualitative social geography; without it, AMZ-C003 falls to source-only
  status, AMZ-C017 loses its strongest leg and drops toward
  weakly_supported, and the Carvajal-credibility component of the case
  would no longer survive at its current strength. The heterogeneity
  verdict itself (AMZ-C016) survives without AMZ-E007, since none of its
  dependencies route through that record — so the case verdict would
  survive only in its reduced, heterogeneity-only form, not as the full
  reconciliation the case is built around.