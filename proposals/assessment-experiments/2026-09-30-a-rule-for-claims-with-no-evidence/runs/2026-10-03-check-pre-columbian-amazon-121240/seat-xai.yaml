  synthesis: >-
    The featured hypothesis holds that Carvajal's 1542 account of populous, organized riverine societies along the Amazon described a real world that subsequently emptied through post-contact processes rather than pure invention or wholesale exaggeration. Evidence records establish the qualitative core of that account (AMZ-C001 via E006's matching bluff-settlement geography of dense reaches alternating with empty stretches; AMZ-C003 via E007's independent Nunes and Ursúa witnesses repeating dense settlement, food stores, roads and ceramics on the same middle-Amazon reaches without the extreme numbers) while AMZ-C002 via E005 shows the most extreme warrior and village-length figures are confined to one manuscript branch. AMZ-C017's interpretive split—qualitative social geography credible, extreme numbers textually unstable—follows directly and is reinforced by contact-era occupation continuity (AMZ-C011 via E017 Belterra to seventeenth century, E018 Marajó Cacoal to 1650, E019 Upper Xingu to ca. 1770) and by catastrophic but uneven documented declines (AMZ-C010 via E008's 88% and 62–64% provincial drops through mixed epidemics, raids, missionization and flight). Earthwork and landscape records invert the old ecological-impossibility premise: AMZ-C004 via E001 documents hundreds of newly detected earthworks and predicts tens of thousands in a delimited southwestern cultural area (qualified by E003's AD 100–300 peak a millennium before Orellana); AMZ-C006 via E004 shows an 1800 km southern-rim fortified arc occupied into the late pre-Columbian window; AMZ-C007 via E014 establishes Casarabe intensive maize monoculture with hydraulic engineering; AMZ-C008 via E012 (qualified by E013 post-Columbian confounding) and AMZ-C009 via E015/E016 show long-term engineering and intermittent raised-field use. Limits evidence simultaneously rules out basin-wide continuous civilization: AMZ-C013 via E010 finds river distance the dominant predictor across 7363 sites with sparser interfluves; AMZ-C014 via E011 finds little intensive-agriculture or clearing signal in most sampled terra-firme settings. Demographic models are method-sensitive (AMZ-C005 via E002's fivefold span; AMZ-C012 via E009's self-rejection of habitat-density while retaining order-of-magnitude; AMZ-C015 via E020 logistic growth to carrying capacity). The resulting picture is a strongly heterogeneous pre-contact Amazon of engineered corridors and hotspots inside a lightly occupied matrix, rendering Carvajal's kind of world locally real and its later emptiness a post-contact outcome rather than pristine wilderness or fabrication. Several catalog claims (C019 fisheries, C020–C022, C023, C029, C016) lack attached evidence records and remain unresolved, so the mosaic synthesis and full demographic reconciliation stay provisional; chronology mismatches (early Aquiry grandeur versus 1542) and sampling biases further cap strength. Overall the evidence warrants provisional support for the emptied-world reading over invention or uniform sparseness.
  steelman: >-
    Independent sixteenth-century witnesses (Nunes 1538, Ursúa 1560 accounts) independently describe the same middle-Amazon dense settlement, vast stores, long straight roads and renowned ceramics that Carvajal reported, without repeating his extreme numbers, yet no preregistered corridor-by-corridor test against contact-horizon archaeology has yet confirmed or falsified the spatial match of his populated versus empty reaches.
