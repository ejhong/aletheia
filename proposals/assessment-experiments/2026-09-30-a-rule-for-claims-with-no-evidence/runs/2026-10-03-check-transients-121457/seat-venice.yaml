caseAssessment:
  verdict: unresolved
  loadBearing: [TRN-C020, TRN-C001, TRN-C002, TRN-C005, TRN-C006]
  weakestLinks: [TRN-C108, TRN-C119, TRN-C118, TRN-C104, TRN-C117]
  synthesis: >-
    This case has an unusually clean ladder, and the evidence distributes
    itself cleanly along it. The bottom rungs are settled: the April 1950
    nine and the July 1952 triple are real features of physical plate
    material (TRN-E002, and — pending review — TRN-E022 placing all nine on
    the original telescope negative), they are recovered by independent
    pipelines (TRN-E008), and their sharper-than-stellar profiles are common
    ground between the camps (TRN-E003). The attribution rungs are not
    settled, and the sharpest finding of this assessment is that the two
    most decisive-sounding arguments on each side have partially cancelled.
    Hambly & Blair's copy-genealogy mechanism (TRN-E005) is real but,
    if the Yang & Villarroel registration holds, cannot reach the two
    flagship events; the microscopy that removes it also reports, through
    its own microscopist, that emulsion defects remain a reasonable
    attribution and that single-source morphology cannot separate a flash
    from a flaw in the same emulsion (TRN-E024). Above the canonical events,
    the ensemble evidence is deadlocked: the Earth-shadow deficit and
    nuclear-test correlation replicate statistically on the original
    author-supplied rows (TRN-E010) but dissolve under independent
    extraction with exposure modeling (TRN-E009) and under a proper null
    with a non-uniform background (TRN-E011), while the ML-robustness result
    (TRN-E015) stays inside the contested lineage. The genuinely new
    positive lines — the Hamburg recurrence and its coma signature
    (TRN-E013, TRN-E014) — are the only evidence pointing at incident light
    that escapes the Palomar genealogy entirely, and neither has been blind-
    validated or independently reproduced. Weighing only these records, the
    flash reading and the defect reading each retain live, specific support,
    and no record before me decides between them for any single mark. The
    case verdict is therefore unresolved, not from caution but because the
    decisive discriminating measurement (flash-profile calibration, coma
    confusion matrix, or multi-station parallax) exists in the agenda but
    not in the evidence. The exotic upper rungs do not follow: even a full
    near-Earth-reflection victory would leave "artificial" and
    "extraterrestrial" supported only by residual-explanatory-fit arguments
    over hand-chosen toy models, with the proponents themselves calling the
    intelligence interpretation unfalsifiable.
  steelman: >-
    The coma-aberration result on Hamburg Doppel-Reflektor transients
    (TRN-E014) is the strongest argument for the featured hypothesis that
    this assessment cannot answer: it comes from an independent telescope,
    emulsion stock, archive, and digitization lineage that the shared
    copy-stage defect mechanism (TRN-C007) cannot reach at all, and it
    reports a physical signature — off-axis coma — that plate-surface
    artifacts should not naturally reproduce, in candidates that also show
    the same anomalously narrow profiles as the Palomar events. No record
    in the ledger blind-validates or breaks this discriminant, and if it
    survives the proposed confusion-matrix test, the artifact account loses
    its only physical escape route. A proponent could also rightly add that
    the shadow deficit and nuclear-window correlation survived an ML filter
    trained to remove defect-like images (TRN-E015) and an independent-code
    replication with weather controls (TRN-E010), and that no skeptical
    analysis has examined the original negatives of anything but two fields.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      This claim sits at the top of the inference chain and inherits every
      unresolved rung below it: TRN-C020 (flash versus emulsion defect) is
      deadlocked and TRN-C021 (near-Earth reflections) is contested. No
      evidence record establishes the existence of artificial objects; the
      nearest approaches are statistical correlations on an unvalidated
      catalog. The strongest opposing consideration is Cann 2026c's natural
      dusty-plasma/icY-aggregate proposal, which would occupy the near-Earth
      niche without any artificial object — and even that is unreplicated
      and partly excluded by the group's own size argument (TRN-E038).
  - claimId: TRN-C023
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      No evidence record in the ledger offers a test that could confirm or
      refute extraterrestrial-artifact attribution, and the proponents'
      own hotspot preprint states the intelligence interpretation is
      "unfortunately not falsifiable" (TRN-E083). The only supporting
      argument is a hedged toy-model comparison (TRN-E072) whose five input
      features are themselves contested or read both ways. This is a
      substantive testability finding, not a verdict on truth.
  - claimId: TRN-C021
    verdict: mixed
    confidence: low
    reasoning: >-
      The best geometric evidence, the Earth-shadow deficit, reproduces
      under independent statistics on the original rows (TRN-E010) and
      survives ML artifact-scoring (TRN-E015), but vanishes under Watters'
      properly derived null with a non-uniform background (TRN-E011) and
      was never tested on an independently extracted catalog. The Hamburg
      coma result supports light-through-the-optics but not near-Earth
      origin specifically. Support and undermining records are of comparable
      strength, so the claim is genuinely contested rather than leaning
      either way.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      For the canonical events, microscopy on the original glass settles
      the copying-chain and digitization alternatives (TRN-E022) — but the
      same manuscript reports that microscopy cannot separate a sub-second
      flash from an intrinsic emulsion defect, and its microscopist leaned
      defect for a plate-corner field (TRN-E024). The coma discriminant
      (TRN-E014) is the strongest pro-incident-light evidence but is
      unblind-validated and applies only to Hamburg candidates. The crux is
      narrowed, not closed, in either direction.
  - claimId: TRN-C007
    verdict: established
    confidence: high
    reasoning: >-
      The genealogy is documented fact from an expert on exactly this plate
      material: DSS and SuperCOSMOS descend from independent copy negatives
      printed from a shared intermediate positive (TRN-E005), and contact
      printing necessarily propagates shared-stage defects. The strongest
      opposing consideration is that Yang & Villarroel show the two flagship
      events are not confined to copy material (TRN-E023) — but that limits
      the mechanism's reach over two events, not the truth of the
      mechanistic claim, which remains live for the ~100,000 uninspected
      catalog candidates.
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: >-
      Three independent lines converge: physical inspection of the
      Edinburgh glass copies found all nine at the reported positions,
      absent from the six-days-later plate (TRN-E002); an independent
      pipeline recovered eight of nine (TRN-E008); and microscopy places
      them on the original emulsion (TRN-E022). The strongest opposing
      consideration is that the same inspection found analogous detections
      on the neighboring plate and a visible defect population — which
      bears on interpretation, not on the observational claim as stated.
  - claimId: TRN-C024
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The only support is a single unreviewed, unblinded preprint from the
      proponents' group (TRN-E022), whose load-bearing registration against
      the digitization has not been independently checked and whose
      microscopist's defect-leaning reading is recorded in the same
      document. It is notably candid — Hambly directed the microscopist to
      the objects — but until an outside party repeats it, this stays
      provisional.
  - claimId: TRN-C002
    verdict: established
    confidence: high
    reasoning: >-
      The profile measurement is common ground: all nine marks fall on the
      sharp side of the stellar distribution with joint probability of
      order 0.1^9 (TRN-E003), confirmed under the microscope and again in
      the microscopy manuscript (TRN-E022). The strongest opposing
      consideration is interpretive, not observational: the random-forest
      classifier groups the marks with artifacts (TRN-E004), and the
      proponents reply that sub-second flashes should be sharp (TRN-E006) —
      so the measurement stands while its meaning divides.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The triple is peer-reviewed with deep GTC follow-up showing absence to
      magnitude 25.5 (TRN-E007), recovered 3/3 by an independent pipeline
      (TRN-E008), and present on a Harvard copy plate and in the original
      survey digitization (TRN-E022). The strongest opposing consideration
      is that no original Palomar negative for this event has been physically
      inspected — presence on the original is inferred, not observed — and
      its star-like profiles sit in tension with the 1950 event's sharpness,
      complicating any single-mechanism account.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hayes's from-scratch pipeline recovers 8/9 and 3/3 canonical sources
      and matches 63.9% of the published catalog, with synthetic-injection
      benchmarking (TRN-E008). The strongest opposing considerations are
      that it reads the same digitized lineage rather than independent
      material, and that its 2.85-million-candidate preliminary sweep shows
      how completely the "population" depends on vetting choices — the
      canonical detections are robust, the catalog is not.
  - claimId: TRN-C101
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Hambly & Blair physically documented a defect population (emulsion
      holes, bubbles, scratch-like marks) on the copy plates and found
      similar point detections on the comparison plate E0086 (TRN-E002);
      the discovery paper itself lists contamination first (TRN-E001); and
      the classifier assigns artifact-like morphology (TRN-E004). The
      strongest opposing consideration is that no measured base rate exists
      (TRN-R007), so "sufficient to contaminate" is demonstrated by example,
      not by a census.
  - claimId: TRN-C102
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The optics is sound — sub-second flashes avoid seeing and guiding
      blur that stars accumulate — and it usefully converts sharpness from
      artifact signature into an ambiguous one (TRN-E006). But it is a
      physics argument, not a measurement: no one has exposed period
      emulsion to controlled sub-second flashes, and the flash and artifact
      profile distributions may overlap entirely, making sharpness
      non-diagnostic.
  - claimId: TRN-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The Hamburg search is genuinely independent — different telescope,
      emulsion, archive, and digitization lineage, so the copy-defect
      mechanism cannot reach it (TRN-E013). The strongest opposing
      consideration is the author's own preliminary label: 41 plates, no
      false-positive calibration or injection/recovery, so "similar
      phenomenon" and "similar defect susceptibility" are not yet
      distinguished.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The coma pattern is potentially the highest-information positive
      result in the case, because it is a physical discriminant that does
      not require the Palomar originals (TRN-E014). The strongest opposing
      consideration is that the classifier has never been blind-validated
      against a full defect bestiary or deliberately produced flashes, and
      the paper itself states the data do not establish the light's origin.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The 0.46%-versus-1.4% shadow deficit reproduces with independent code
      on the author-supplied rows (TRN-E010) and persists among
      ML-scored high-probability transients (TRN-E015), but Watters derives
      a proper null from the spatially non-uniform background and finds no
      significant deficit (TRN-E011), and the group's own later modelling
      makes the deficit's magnitude definition- and altitude-dependent while
      conceding stripe and edge effects (TRN-E051). Both directions carry
      strong records.
  - claimId: TRN-C129
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The quality-filtered sample does show a larger deficit at all tested
      altitudes, peaking at 0.805 at 35,000 km (TRN-E052, TRN-E053). The
      strongest opposing consideration is circularity: the filter is the
      same group's ML classifier trained on visually classified pairs, so
      removing defect-like rows strengthens any signal that defects dilute;
      only 17 filtered transients fall in shadow at the higher altitudes.
  - claimId: TRN-C108
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 20,000–35,000 km range comes entirely from the group's own
      modelling on its own catalog, with the χ² estimator preferring
      20,000 km, the hotspot companion assuming 35,786 km, reduced χ² of
      3.5–5.4 indicating poor fits, and the authors themselves stating the
      range is "rather than a formal statistical confidence interval"
      (TRN-E055, TRN-E057, TRN-E078). It is also conditional on TRN-C005,
      which is contested.
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The nuclear-window correlation replicates under independent code with
      weather controls and permutation testing on the original rows
      (TRN-E010), survives ML scoring (TRN-E015), and a Bayesian reanalysis
      with temporal autocorrelation reports an attenuated p = 0.037
      (TRN-E019). Against this, independent extraction with exposure
      modeling renders it non-significant and schedule-sensitive
      (TRN-E009), and Watters shows it is almost completely determined by
      the Palomar observing schedule (TRN-E011). The split tracks the
      catalog, not the sky.
  - claimId: TRN-C103
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Cann's monotonic Kp dose-response and its strengthening of the nuclear
      window are real analyses with a genuine negative control closing the
      airglow confounder (TRN-E017). The strongest opposing consideration
      is that the entire result runs on the same 107,875-row lineage whose
      dataset definitions Watters undermines, with no independent extraction;
      and a schedule- or vetting-driven detection pattern could generate Kp
      structure without any physics.
  - claimId: TRN-C104
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Alignments are reported in a peer-reviewed PASP paper characterized
      only via title and secondhand description, never read in full for this
      record, plus a same-network preprint with post-hoc alignment criteria
      and modest p-values (TRN-E018). The strongest opposing consideration
      is Watters' finding that a third of linear-cluster features were not
      confidently distinguished from catalog stars, plus uncontrolled
      look-elsewhere inflation.
  - claimId: TRN-C119
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 16-of-137 Bonferroni-significant cells are a real result of the
      analysis, but the excess is measured against the group's own random
      control, on the same working catalog, at a single fixed altitude whose
      choice deterministically sets the geographic identifications
      (TRN-E041, TRN-E078), and the paper concedes its two methods share the
      sample and so cannot rule out defect-driven hotspots. The strongest
      opposing consideration is that no independent catalog or altitude
      sensitivity test exists.
  - claimId: TRN-C122
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The record directly instantiates the claim: random plate-aware
      controls produce 2–3 clusters with silhouette 0.50–0.60, meeting the
      authors' own non-random threshold (TRN-E079). This is a
      negative-control finding that undercuts the clustering narrative, and
      its main weakness is that only three control draws were run with no
      null distribution of silhouette values.
  - claimId: TRN-C117
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The size-mismatch argument is stated almost verbatim by the source
      (TRN-E038), but it pits one toy model against another using the same
      group's own model-dependent, selection-biased size inference
      (TRN-E062, TRN-E063), and Cann's mechanism was never modelled
      directly. One conditional toy model excluding another does not move
      the observation rung.
  - claimId: TRN-C118
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim accurately reports the source's own hedged conclusion that,
      among its toy models, only the NHI scenario fits all five features
      (TRN-E072). The strongest opposing consideration is that three of the
      five features are contested at the catalog level, the PSF feature is
      read both ways, the model set is hand-chosen, and the authors
      themselves caveat that "nature can always surprise us" (TRN-E073) —
      an argument from residual fit, not a test.