caseAssessment:
  verdict: mixed
  loadBearing: [TRN-C001, TRN-C003, TRN-C004, TRN-C011, TRN-C005, TRN-C006]
  weakestLinks: [TRN-C118, TRN-C108, TRN-C103, TRN-C104, TRN-C006]
  synthesis: >-
    Steelman FOR the featured hypothesis: the strongest unturned argument is that the
    two canonical events (1950 nine, 1952 triple) survive every probe to date — physical
    presence on the original glass (TRN-E022), independent pipeline recovery (TRN-E008),
    and the copy-defect mechanism demonstrably unable to reach them (TRN-E023) — yet the
    sharpness measurement (TRN-C002) still lacks any calibrated discriminant between
    sub-second flash and emulsion defect (TRN-R002 never run), and the coma signature
    (TRN-C011), the only physical test that could separate incident light from plate
    marks, has never been blind-validated against a defect bestiary. The featured
    hypothesis stands or falls on TRN-C020 (marks were made by light entering the
    telescope), and no evidence record yet answers that question for the canonical events.
    Steelman AGAINST: Watters et al. (TRN-E011) shows the working catalog's background
    assumption is false, the Earth-shadow deficit does not survive a proper null, and the
    nuclear correlation is schedule-driven — dissolving the population-level evidence
    that would otherwise substitute for per-event classification. The case is genuinely
    mixed: the canonical events are real features of original emulsion that no mundane
    mechanism has been shown to produce at the required rate, but no measurement yet
    distinguishes flash from defect for any single mark, and the ensemble statistics
    that would carry the attribution ladder are contested at the dataset level.
    Confidence is moderate: the observation rung is solid, the mechanism rung is
    unresolved by design, and the attribution rung (near-Earth reflective objects,
    artificiality, extraterrestriality) has no independent support that survives the
    Watters critique.
  steelman: >-
    The strongest unturned argument for the featured hypothesis: the copy-defect
    mechanism (TRN-C007) has been physically excluded for the two flagship events —
    the marks sit on the original telescope negative itself (TRN-E022, TRN-C024) — and
    the sharpness measurement that the skeptics' own classifier leans on (TRN-E004) is
    built on profile statistics whose interpretation is explicitly contested by a
    peer-refereed physics argument (TRN-E006, TRN-C102) that no one has experimentally
    answered: no one has exposed period-appropriate emulsion to controlled sub-second
    flashes to show that flash profiles overlap artifact profiles. Until TRN-R002 is run,
    the artifact reading of sharpness is an uncalibrated assumption, and the coma
    discriminant (TRN-C011) — the only measurement that could settle light-versus-mark —
    is unrefuted and points toward light-through-optics on an independent archive.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. Its support depends entirely on
      TRN-C020 and TRN-C021, both of which are contested or unresolved on the current
      ledger: TRN-C020 has no decisive measurement (microscopy cannot separate flash
      from defect per TRN-E024), and TRN-C021's ensemble support (TRN-C005, TRN-C006)
      is disputed by TRN-E011. Without either dependency established, the attribution
      to artificial near-Earth objects has no independent footing in the admitted
      evidence.
  - claimId: TRN-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. Its only named dependencies
      (TRN-C118 via TRN-E072/TRN-E073) are self-described toy-model comparisons over
      features contested elsewhere in the ledger, and the proponents' own hotspot
      preprint (TRN-E083) states the intelligence interpretation is "unfortunately not
      falsifiable." A claim whose proponents decline to make it testable cannot be
      supported by the current evidence.
  - claimId: TRN-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No evidence record is directly attached, but TRN-E020 (Cann 2026c, attached to
      TRN-C021) and TRN-E074 (attached to TRN-C021) provide conditional support:
      the Earth-shadow deficit (TRN-E010, TRN-E015) and nuclear-window correlation
      (TRN-E010) both persist under independent statistical re-analysis. The strongest
      opposing consideration is TRN-E011 (Watters), which attacks the dataset
      definitions underneath both correlations and reports no significant shadow
      deficit on a properly derived null; the proponents' rebuttal (TRN-E012) does not
      answer the deeper validation charge. Weak support is warranted rather than
      unresolved because TRN-E020 and TRN-E074 are named as carrying records, but the
      weight is genuinely low.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The evidence genuinely splits. Supporting: TRN-E014 (Hamburg coma signature,
      attached to TRN-C020), TRN-E008 (independent pipeline recovery), TRN-E022
      (original-glass microscopy). Undermining: TRN-E004 (random-forest classifier
      assigns artifact-like morphology), TRN-E011 (working catalog never validated
      against star contamination). The decisive ceiling is TRN-E024: the microscopy
      manuscript's own authors state that single-source morphology cannot separate a
      short-duration flash from an intrinsic emulsion defect, and their microscopist
      leaned toward the defect reading. The strongest opposing consideration is that
      the case's own decisive test (original-plate examination) returned an explicit
      "cannot classify" result, leaving the flash-versus-defect question without a
      discriminating measurement on the current ledger.
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      TRN-E005 (Hambly & Blair, attached to TRN-C007) establishes the copy genealogy —
      DSS and SuperCOSMOS descend from a shared intermediate positive — with strength
      strong and from an author who is an expert on exactly this plate material. The
      strongest opposing consideration is TRN-E023, which shows the mechanism cannot
      explain the two canonical events specifically (the marks are on the original
      glass). That qualification narrows the claim's diagnostic reach but does not
      touch its truth: the genealogy is real, and the defect pathway remains live for
      the ~100,000 uninspected catalog candidates.
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: >-
      TRN-E001 (discovery paper) and TRN-E002 (independent physical confirmation on
      the Edinburgh copy, strength strong) establish the nine marks at the reported
      positions, absent from the overlapping plate and from deeper surveys. TRN-E022
      (original-glass microscopy) and TRN-E008 (independent pipeline recovery, 8 of 9)
      raise this beyond any reasonable doubt as a feature of surviving plate material.
      The strongest opposing consideration is that "established" here means established
      as plate features, not as sky events — but the claim as stated is about presence
      on copy material and absence elsewhere, which is exactly what the records show.
  - claimId: TRN-C024
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      TRN-E022 (attached to TRN-C024) reports that all nine sources are present on the
      physical emulsion of the original Caltech glass at their published positions,
      ruling out a digitization-artifact origin. The record is moderate, not strong,
      because the manuscript is unreviewed, the registration was performed by the
      proponents' group without blinding, and outside repetition is not yet possible.
      The strongest opposing consideration is that the load-bearing registration
      analysis has not been independently checked, and the microscopist's own
      attribution (emulsion defect) is consistent with the marks being real emulsion
      features that are nonetheless not flashes — which does not weaken this claim,
      which asserts only physical presence.
  - claimId: TRN-C002
    verdict: established
    confidence: high
    reasoning: >-
      TRN-E003 (Hambly & Blair, strength strong) reports that all nine candidates fall
      on the sharp side of the profile distribution with a joint probability of order
      0.1⁹, and TRN-E004 confirms the same measurement with a different analytical
      lens. TRN-E006 (the proponents' flash-profile argument) qualifies the
      interpretation but does not dispute the measurement itself; the editorInference
      on TRN-E003 correctly notes this is common ground between the camps. The
      strongest opposing consideration is that profile statistics were measured on the
      digitized copy lineage, not the original negative — but TRN-E022's microscopy
      independently reports the features as "marginally sharper than the stellar
      images," consistent with the measurement.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      TRN-E007 (Solano et al. 2024, peer-reviewed, strength moderate) establishes the
      July 1952 triple with modern GTC follow-up to magnitude 25.5, and TRN-E008
      (independent pipeline, 3 of 3 recovered) strengthens it. TRN-E022 confirms the
      1952 candidate is present on a Harvard copy plate and in the original survey
      digitization. The strongest opposing consideration is that no published physical
      inspection of the 1952 original negative exists — the co-presence inference is
      indirect — and the event's stellar-like profiles sit in tension with the 1950
      nine's sharper-than-stellar profiles, meaning a single mechanism must
      accommodate both.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      TRN-E008 (Hayes 2026, strength strong) is the only fully independent
      source-extraction replication in the case: a from-scratch pipeline recovers 8 of
      9 April 1950 and 3 of 3 July 1952, plus 63.9% of the 5,399-candidate catalog,
      with synthetic-injection benchmarking and no reference to the original team's
      software. The strongest opposing consideration is that this is independent
      extraction from the same digitized lineage, not independent material — it
      confirms the software-independence of the detections without confirming their
      physical origin, and the author flags preliminary (looser) parameters for the
      full-sky sweep.
  - claimId: TRN-C101
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. TRN-E005 (attached to TRN-C007)
      establishes that a copy-stage defect pathway exists but explicitly notes that no
      census of star-like copy-stage defects exists; TRN-R007 is the agenda item meant
      to measure the base rate. TRN-E002 records visible blemishes on the copy plates,
      but blemishes generally are not a measurement of star-like point-detection rates
      sufficient to contaminate transient searches. The claim's mechanism is plausible
      as a prior but is not carried by any measurement in the ledger.
  - claimId: TRN-C102
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. TRN-E006 (attached to TRN-C002 and
      TRN-C020) records the underlying physics argument — that sub-second flashes
      should appear sharper than stars on long exposures — but the record's own
      limitations state this is a physics argument, not a measurement, that the two
      profile distributions may overlap entirely, and that the source is a
      proponent-team preprint. TRN-R002 (the flash-profile calibration that would
      convert this from argument to measurement) has not been performed. The claim's
      mechanism is plausible as physics but carries no evidential weight on this ledger.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E013 (Busko 2026a, attached to TRN-C010, strength moderate) reports
      transient candidates on Hamburg Observatory Schmidt plates — an independent
      telescope, emulsion stock, archive, and digitization lineage, which the
      copy-defect mechanism (TRN-C007) cannot reach. The strongest opposing
      consideration is that the sample is explicitly preliminary (41 plates), has no
      false-positive calibration or injection/recovery testing, and has not yet
      measured a candidate rate against matched controls — so "similar phenomenon"
      and "similar defect susceptibility" remain indistinguishable at this stage.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E014 (Busko 2026b, attached to TRN-C011, strength moderate) reports that
      Hamburg transient candidates exhibit the coma aberration expected for off-axis
      point sources through the telescope optics — potentially the most diagnostically
      important positive result in the case, since it is a physical discriminant
      between incident light and plate marks. The strongest opposing consideration is
      that the coma classifier has not been blind-validated against known defects or
      deliberately produced flashes (TRN-R003), the paper is a single-author preprint,
      defect classes mimicking directional asymmetry have not been excluded, and the
      paper itself states the data do not establish the physical origin of the light.
      The result applies only to Hamburg candidates and does not validate any Palomar
      event.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      TRN-E010 (Doherty, independent code, author-supplied rows) reproduces the shadow
      deficit (0.46% observed against ~1.4% geometric expectation); TRN-E015 (Bruehl
      ML) finds it persists among highest-probability candidates. Against this,
      TRN-E011 (Watters, strength strong) shows the uniform-random-background
      assumption is false, that after deriving the proper null there is no
      statistically significant deficit, and that 91% of ensemble features were
      earlier removed as star-adjacent. TRN-E012 (the proponents' rebuttal) disputes
      the subset's power but does not answer the validation charge. TRN-E051 further
      makes the deficit's magnitude conditional on post-hoc spatial cuts. The strongest
      opposing consideration is that the Watters analysis uses related-but-not-identical
      datasets, so its null result may not transfer exactly to the 107,875-row catalog.
  - claimId: TRN-C129
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      TRN-E052 and TRN-E053 (both attached to TRN-C129) report that the Earth-shadow
      deficit strengthens at all tested altitudes after quality filtering, reaching
      0.805 ± 0.049 at 35,000 km. The strongest opposing consideration is that the
      filter is the same group's ML classifier (TRN-E015), trained on visually
      classified data within the same contested catalog lineage: a classifier that
      removes defect-like rows would strengthen any signal that defects dilute,
      whether or not the residual is astrophysical. Only 17 quality-filtered
      transients fall in shadow at altitudes ≥35,000 km — a small-number regime —
      and the result is not independent of TRN-E015.
  - claimId: TRN-C108
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. Its named dependencies —
      TRN-C105 and TRN-C107 — do have records (TRN-E025, TRN-E055), but those records
      are from the same group's modelling preprint, use the same contested catalog,
      and the source itself states the 20,000–35,000 km range is "rather than a formal
      statistical confidence interval," with reduced χ² of 3.5–5.4 indicating the
      model does not fit well. TRN-E078 shows the companion hotspot paper uses a
      fixed 35,786 km projection that conflicts with the modelling paper's preferred
      20,000 km. The altitude inference has no formal uncertainty and no independent
      replication; it cannot be graded as supported.
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The correlation replicates on the original catalog with independent code
      (TRN-E010: RR 1.45, p = .011, surviving negative-binomial and permutation
      controls) and survives ML artifact-scoring (TRN-E015, p = .024). Against this,
      TRN-E009 (Hayes, independent extraction with exposure modeling) finds the
      effect vanishes (IRR 1.03, p = .71), and TRN-E011 (Watters) shows it is
      almost completely determined by the Palomar observing schedule. TRN-E017
      closes one environmental confounder (airglow) but not the schedule/normalization
      channel. The strongest opposing consideration for the proponent side is that
      Hayes's catalog was built with preliminary looser parameters averaging ~7,250
      noise candidates per night, which could dilute a real effect below detectability.
  - claimId: TRN-C103
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. TRN-E017 (attached to TRN-C006 and
      TRN-C005) tests and rejects plate-sensitivity variation with geomagnetic
      activity — a useful negative control that partially bears on this claim's
      artifact interpretation — but it does not itself report the monotonic Kp
      dose-response or the Kp-controlled strengthening of the nuclear association that
      TRN-C103 asserts. The primary source (Cann 2026, arXiv:2604.04950) exists in the
      source registry but no evidence record extracts the dose-response measurement,
      so the observation behind the claim has not been admitted.
  - claimId: TRN-C104
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. TRN-E018 (attached to TRN-C022)
      reports linear alignments among ML-scored candidates on seven plates — which
      bears on the same phenomenon family but is filed as qualifying rather than
      supporting, with the ledger noting look-elsewhere inflation risk and inherited
      catalog provenance. TRN-E014's coma result does not bear on alignments. The
      source record for the PASP alignment paper (SRC-VILLARROEL-2025-PASP) notes the
      paper was not read in full for this record. No admitted record directly measures
      the alignment claim as stated.
  - claimId: TRN-C119
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      TRN-E041 (attached to TRN-C119, strength moderate) reports 16 of 137
      Earth-projected cells showing Bonferroni-significant excess. The strongest
      opposing consideration is that the projection assumes a fixed 35,786 km
      altitude that the companion modelling paper's own χ² estimator disfavors
      (preferring 20,000 km, per TRN-E055), so every hotspot's Earth location is
      computed at the top of the model's range; at 20,000 km the same transients
      project to different cells. The control is the group's own construction, the
      catalog is the same contested 107,875-row lineage, and the absolute O/E ratios
      are largest in cells fed by only one to three plates — so a high-defect-rate
      plate would project its excess to whatever cell the geometry assigns, making
      hotspot significance not a test of the sky.
  - claimId: TRN-C122
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      TRN-E079 (attached to TRN-C122, strength moderate) directly instantiates the
      claim: random control samples of 897 plate-aware positions produce two or three
      clusters with silhouette values of 0.50–0.60, meeting or exceeding the 0.50
      threshold the authors adopt as indicating non-random clustering. The strongest
      opposing consideration is that only three control draws were run and no formal
      null distribution of silhouette values is given, so the 0.70 transient value
      has never been tested against a proper control distribution — the observation
      undermines the diagnostic power of the clustering method itself rather than
      refuting the claim, which is precisely what the claim asserts.
  - claimId: TRN-C117
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. TRN-E038's passage is nearly
      verbatim what TRN-C117 asserts, but the reader act at intake reassigned
      TRN-E038 to TRN-C117 with direction "supports" — however, on re-checking the
      packet, TRN-E038's claimIds field lists TRN-C117 after the reader act, so
      TRN-C117 does have a record bearing on it. Weighing it: the source's
      dusty-plasma exclusion rests entirely on the paper's own model-dependent size
      inference (TRN-C111's cm-to-3m range), which is selection-biased toward small
      facets and whose inputs (altitude, specularity, duration, reflectivity) are all
      assumed rather than measured. One toy model excluding another via its own
      unvalidated size derivation cannot be graded as establishing the exclusion.
  - claimId: TRN-C118
    verdict: contradicted
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. TRN-E072 and TRN-E073 (both
      attached to TRN-C118) record the NHI toy-model claim, but both are weak-strength
      and the ledger's own inference notes that three of the five "features" it
      accommodates are contested at the catalog level (TRN-C005, C006, C103) and one
      (PSF narrowness) is read both ways. I grade this contradicted rather than
      unresolved because the claim asserts that only the NHI scenario simultaneously
      accommodates all five features — but the five features are not themselves
      established, so the claim's premise fails on the current ledger. Confidence is
      low because the claim is an interpretive argument, not a measurement, and a
      future dataset that validates the five features could revive it. The strongest
      opposing consideration is the proponents' own hedge (TRN-E073) that "nature can
      always surprise us," which the ledger records as a caveat the authors
      themselves place on the claim.
