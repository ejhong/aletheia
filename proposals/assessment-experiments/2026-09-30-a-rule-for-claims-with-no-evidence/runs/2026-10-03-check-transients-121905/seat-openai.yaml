caseAssessment:
  verdict: unresolved
  loadBearing: [TRN-C020, TRN-C021, TRN-C011, TRN-C024]
  weakestLinks: [TRN-C021, TRN-C022, TRN-C023, TRN-C108, TRN-C118]
  synthesis: >-
    The evidence establishes the observational bottom of the ladder much
    more firmly than the featured attribution. The April 1950 marks exist
    on surviving copy material, are absent from the comparison exposure
    and modern surveys, and are independently recovered from digitized
    imagery. Most importantly, TRN-E022 reports all nine on the original
    telescope negative, provisionally removing digitization and downstream
    copying as explanations for that event. The July 1952 triple is also
    independently recovered from the digitized data and supported by deep
    follow-up. The measured sharpness of the nine April marks is likewise
    established. These findings show that the canonical observations are
    not inventions of the original extraction software, but they do not
    show that light made the marks.

    The strongest case for real optical flashes is structural rather than
    merely numerical. Short flashes are physically expected to be sharper
    than long-exposure stellar images, and the independent Hamburg search
    reports analogous candidates outside the Palomar copy lineage.
    TRN-E014 goes further by reporting field-dependent coma in Hamburg
    candidates, potentially identifying light that passed through the
    telescope optics. The working VASCO catalog also contains reproducible
    Earth-shadow and nuclear-window patterns, and some such patterns become
    stronger after internal quality filtering. Taken together, these
    observations make a real-flash population a live hypothesis rather
    than an idea excluded by the plate evidence.

    The strongest case against the featured hypothesis is that every step
    from physical mark to near-Earth reflector remains underdetermined.
    Original emulsions can themselves contain defects, and TRN-E024 says
    microscopy cannot distinguish such a defect from a short flash; the
    inspecting microscopist considered defects reasonable. The April
    morphology is artifact-like under one classifier, while the flash
    interpretation lacks period-emulsion calibration. The Hamburg coma
    discriminant has not undergone blind validation against a comprehensive
    defect set. At the population level, the numerical Earth-shadow and
    nuclear associations are real properties of particular analyses, but
    TRN-E011 identifies spatially non-uniform backgrounds, candidate
    contamination, and observing-schedule effects, while TRN-E009 does not
    reproduce the nuclear association in an independently extracted
    catalog. Reanalysis of the same 107,875 rows cannot repair uncertain
    physical provenance.

    Consequently, TRN-C020 is mixed and TRN-C021 remains unresolved.
    Nothing in the evidence establishes artificial objects, much less
    extraterrestrial technology. The single evidence record whose removal
    would most change the case assessment is TRN-E014, because it is the
    clearest independent-observatory attempt to discriminate incident light
    from plate defects. Without it, the positive case for real optical
    flashes becomes substantially weaker, but the overall unresolved
    verdict survives because neither the canonical plates nor the ensemble
    statistics independently determine flash origin or distance.
  steelman: >-
    The reported Hamburg candidates carry the field-dependent coma expected
    from light traversing that telescope's off-axis optics, and the ledger
    contains no demonstrated emulsion, copying, or scanning defect that
    reproduces that positional coma pattern. A blindly validated version of
    this observation would establish real incident-light events outside the
    Palomar genealogy, an outstanding positive result this assessment does
    not explain.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record directly identifies an artificial object near
      Earth before Sputnik that was capable of producing these detections.
      TRN-E018 reports alignments and angular rates characterized as
      inconsistent with known satellites, but the marks retain contested
      provenance and inconsistency with known satellites does not establish
      artificial objects. The strongest opposing consideration is that the
      reported aligned events could represent moving reflectors, while
      TRN-E020 supplies a natural near-Earth alternative rather than support
      for artificiality.
  - claimId: TRN-C023
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      None of the records tests extraterrestrial manufacture or connects a
      detected object to non-human technology. TRN-E083 records the
      proponents' own statement that the intelligence interpretation is not
      falsifiable, which bears on present testability rather than truth.
      The strongest opposing consideration is the claimed comparative fit
      of the NHI toy model in TRN-E072, but that is not a discriminating
      observation and depends on several disputed input features.
  - claimId: TRN-C021
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      TRN-E074 infers sunlight reflections from the Earth-shadow deficit,
      while TRN-E010 reproduces the underlying catalog arithmetic and
      TRN-E020 offers a possible natural near-Earth mechanism. Those lines
      all depend on the contested working catalog and do not measure
      distance, parallax, or reflection from any individual event. The
      strongest opposing consideration is TRN-E011, which finds no
      significant shadow deficit under a spatially heterogeneous null, so
      the principal geometric support does not presently survive an
      agreed-upon background model.
  - claimId: TRN-C020
    verdict: mixed
    confidence: moderate
    reasoning: >-
      TRN-E014 reports coma in Hamburg candidates consistent with light
      passing through telescope optics, and TRN-E022 places the April marks
      on the original negative rather than a downstream copy. Against this,
      TRN-E024 explicitly states that original-plate microscopy cannot
      distinguish a flash from an intrinsic emulsion defect, and its
      microscopist favored defects as reasonable. The strongest opposing
      consideration to the positive coma result is that its classifier has
      not been blindly validated against known defects, while the strongest
      positive consideration against an artifact-only account is that the
      reported coma is an optical-path signature from an independent
      observatory.
  - claimId: TRN-C007
    verdict: established
    confidence: high
    reasoning: >-
      TRN-E005 directly reconstructs the contact-printing genealogy and
      establishes that DSS and SuperCOSMOS scanned separate copy negatives
      descending from a shared intermediate positive. That structure
      provides exactly the claimed pathway by which one copy-stage flaw
      could enter both datasets. The strongest opposing consideration,
      TRN-E023, limits this mechanism for the inspected canonical events
      but does not challenge the genealogy or its applicability to
      uninspected catalog candidates.
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: >-
      TRN-E002 physically confirms all nine marks on the Edinburgh glass
      copy and their absence from the overlapping plate six days later,
      while TRN-E001 documents absence from deeper modern imaging.
      TRN-E008 independently recovers eight of nine through a new pipeline,
      and TRN-E022 reports all nine on the original plate. The strongest
      opposing consideration is that these observations do not establish
      whether the marks are optical images or emulsion defects, but that is
      outside this claim's local content.
  - claimId: TRN-C024
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E022 directly reports microscopy and stellar-fiducial registration
      of all nine published positions on the original April 1950 telescope
      negative. This is the only record that examines that original
      material and therefore directly addresses the claim. The strongest
      opposing consideration is that the registration was unblinded,
      performed by the reporting group, and has not been independently
      repeated, so one preprint cannot yet make the result established.
  - claimId: TRN-C002
    verdict: established
    confidence: high
    reasoning: >-
      TRN-E003 reports that all nine profile statistics fall on the sharp
      side of the stellar distribution and that microscopy finds the marks
      more concentrated and circular than comparable stars. TRN-E004 and
      TRN-E006 dispute what sharpness means but do not dispute the
      measurement itself. The strongest opposing consideration is that the
      quantitative statistics come from the copy-digitization lineage
      rather than calibrated measurements of the original negative.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      TRN-E007 documents the three approximately 16th-magnitude sources,
      their close spacing, disappearance within the hour, and absence in
      deep subsequent imaging. TRN-E008 independently recovers all three
      through a new extraction pipeline, and TRN-E022 reports corresponding
      physical copy material. The strongest opposing consideration is that
      the original 1952 telescope negative was not directly examined, so
      physical provenance is less secure than for the April event.
  - claimId: TRN-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E008 directly reports a from-scratch pipeline recovering eight of
      nine April sources, all three July sources, and 3,450 of the 5,399
      published candidates, matching the numerical substance of the claim.
      This demonstrates independence from the original team's software but
      not from the underlying photographic and digitization lineage. The
      strongest opposing consideration is that only one fully independent
      extraction effort is documented here, making the claim's plural
      wording and broader reproducibility stronger than the supplied
      evidence.
  - claimId: TRN-C101
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      TRN-E002 observes a visible population of blemishes on the glass
      copies, TRN-E005 establishes a mechanism for propagating copy-stage
      defects, and TRN-E016 records thousands of artifacts removed during
      catalog construction. TRN-E008's loose sweep produced 2.85 million
      candidates compared with 5,399 vetted candidates, demonstrating
      contamination at rates capable of dominating single-epoch searches.
      The strongest opposing consideration is that no per-generation census
      measures how often each ordinary defect class specifically produces
      convincing star-like points.
  - claimId: TRN-C102
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E006 supplies the relevant optical argument: a sub-second image
      avoids much of the seeing and guiding blur accumulated by a star over
      a long exposure and should therefore be sharper and rounder. This is
      mechanistically coherent but remains an argument rather than a
      measurement on period-appropriate emulsions. The strongest opposing
      consideration is that flash and defect profile distributions may
      overlap, and no controlled exposure has shown that actual flashes
      reproduce the nine marks.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E013 reports analogous narrow, single-exposure candidates on
      Hamburg plates from an independent telescope, archive, emulsion, and
      digitization lineage. This supports occurrence outside the Palomar
      copy genealogy. The strongest opposing consideration is the absence
      of false-positive calibration, matched control rates, and
      injection-recovery tests, leaving similar sky events and similar
      photographic defects observationally unresolved.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E014 directly reports the expected off-axis coma pattern in a
      subset of candidates from a telescope selected for its strong
      parabolic coma. Such a field-dependent optical signature is a
      potentially discriminating measurement rather than a mere candidate
      count. The strongest opposing consideration is that the coma
      classifier is a single-author, unblinded result not validated against
      the full defect population, so directional defects have not yet been
      excluded.
  - claimId: TRN-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As a local statement about the specified working catalog and
      geometric expectation, the claim is reproduced by TRN-E010, which
      finds 0.46% in the umbral cone against approximately 1.4% expected.
      TRN-E015 reports persistence after internal artifact scoring, while
      TRN-E051 shows that the magnitude is conditional on spatial choices
      and assumed geometry. The strongest opposing consideration is
      TRN-E011's finding that a spatially heterogeneous null removes the
      significant deficit; thus the catalog arithmetic is supported, but
      its interpretation as a physical shadow effect is not.
  - claimId: TRN-C129
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E052 and TRN-E053 directly report that the quality-filtered sample
      has a larger calculated deficit at every tested altitude, including
      the stated maximum at 35,000 km. Both records come from the same
      preprint and use the same group's classifier and catalog, so they are
      not independent replications. The strongest opposing consideration is
      the small number of filtered in-shadow events at higher altitudes and
      the lack of externally grounded labels for the quality filter.
  - claimId: TRN-C108
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The altitude-modelling records report extrema between approximately
      20,000 and 35,000 km, including the 25,000 km deficit maximum in
      TRN-E025 and the 20,000 km chi-squared minimum in TRN-E055. However,
      TRN-E057 states that the combined range is not a formal confidence
      interval, and the absolute model fits are poor and conditional on a
      real reflective population. The strongest opposing consideration is
      TRN-E011's challenge to the underlying shadow deficit itself; without
      that deficit, there is no measured population whose characteristic
      altitude can be inferred.
  - claimId: TRN-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As a descriptive result for the specified working catalog, TRN-E010
      independently reproduces a relative risk of 1.45, and TRN-E015 and
      TRN-E019 report persistence under alternative internal analyses.
      This does not establish that the association reflects real sky
      events, nuclear causation, or a catalog-independent population. The
      strongest opposing consideration is that TRN-E009 finds no
      significant effect in an independently extracted catalog and
      TRN-E011 attributes the original result largely to the observing
      schedule.
  - claimId: TRN-C103
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E020 refers to an earlier geomagnetic dose-response result and
      combines it with a preregistered post-storm profile, while TRN-E072
      lists the Kp anticorrelation among the group's reported features.
      These records do not independently verify the exact monotonic trend
      or the claim that controlling for Kp strengthens the nuclear
      association. The strongest opposing consideration is that all such
      analyses remain within the same contested 107,875-row catalog, and
      TRN-E017 excludes only one broad plate-sensitivity pathway rather
      than validating transient provenance.
  - claimId: TRN-C104
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      TRN-E018 reports seven plates with alignments of five to eight
      point-like candidates exceeding its Monte Carlo expectations, and
      TRN-E072 treats groupings as one of the reported features. This is
      positive evidence for the limited wording that some events are
      reported as aligned. The strongest opposing consideration is that the
      criteria were not preregistered, the reported p-values are modest,
      and look-elsewhere effects over many plates could generate apparent
      alignments among contested candidates.
  - claimId: TRN-C119
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E041 directly reports 16 of 137 eligible cells exceeding the
      plate-aware control under Bonferroni-corrected conditional binomial
      tests, matching the claim as a result of that procedure. The analysis
      remains within the group's catalog and control construction, and
      TRN-E078 confirms that all positions result from projection onto one
      assumed shell. The strongest opposing consideration is that a
      high-defect plate can create a projected hotspot and the hotspot
      locations move when the unmeasured altitude changes.
  - claimId: TRN-C122
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      TRN-E079 directly establishes that one random control sample produced
      three clusters with a silhouette of 0.50, meeting the authors'
      adopted threshold for non-random clustering. The evidence record
      therefore supports the core point that random controls can satisfy
      that criterion, but it does not fully document every stated
      two-or-three-cluster and 0.50–0.60 result. The strongest opposing
      consideration is that only three control draws were performed, so
      neither the claimed range nor a null distribution is securely
      characterized.
  - claimId: TRN-C117
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      TRN-E038 directly reports the asserted mismatch between
      millimetre-scale dusty-plasma particles and the centimetre-to-metre
      dimensions inferred under the reflection model. The exclusion,
      however, inherits assumed altitude, reflectivity, flash duration, and
      idealized specular geometry, while TRN-E062 and TRN-E063 identify
      selection bias in the inferred sizes. The strongest opposing
      consideration is that Cann's mechanism was not directly modelled, so
      a mismatch between individual particles and equivalent reflecting
      facets does not by itself exclude aggregates or revised optical
      behavior.
  - claimId: TRN-C118
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      TRN-E072 accurately records the authors' conclusion that, among their
      selected toy models, the NHI scenario alone accommodates all five
      listed features, and TRN-E073 records their caveat about unconsidered
      natural phenomena. This is a comparative judgment over a
      hand-selected model set rather than an empirical test. The strongest
      opposing consideration is that the shadow, nuclear, and geomagnetic
      features depend on the contested catalog, sharpness is
      direction-ambiguous, and omitted natural or instrumental models
      invalidate any exhaustive reading of “only.”