  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      In material culture analysis, morphological resemblance does not imply functional equivalence; identical geometric shapes frequently serve entirely disparate utilitarian or symbolic purposes across different cultures and periods. This verdict rests on basic archaeological and design priors, though unlinked to specific evidence records. The opposing consideration is that complex, idiosyncratic functional designs constrain morphology to the extent that form can occasionally serve as a strong proxy for function.
