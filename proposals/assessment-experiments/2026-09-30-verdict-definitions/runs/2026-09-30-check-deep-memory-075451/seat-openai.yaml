  synthesis: >-
    For the case verdict, the featured hypothesis is taken to be the substantive
    proposition that the distant similarities form evidence of a shared source
    or transmission history, rather than merely the proposition that visually
    or narratively similar motifs exist. On that interpretation, the present
    ledger leaves the hypothesis unresolved. Several local propositions are
    supported: the Pillar 43 forms lacked a secure functional identification in
    the excavation team's 2016 discussion; one chlorite object was interpreted
    from its wear as having hung from a cord; the birdman reliefs on Hoa
    Hakananai'a postdate the statue; and the retrieved material gives partial
    support to an Oannes-apkallu association. These observations establish
    facts about individual objects and traditions. None supplies a dated chain
    connecting the distant cases, demonstrates inheritance from a common
    source, or measures the probability of the complete constellation under
    transmission and independent-invention models.

    The strongest case for shared history is cumulative. The internal
    civiliser lineup reportedly placed claimed partners first much more often
    than random pairs, Oannes combines an aquatic human form with instruction
    in settled life, and multiple cultures present broad bird-person, serpent,
    sacred-centre, or handled-object similarities. A proponent can also argue
    that examining each feature separately discards information contained in
    their conjunction. That cumulative argument is not refuted by showing that
    any one motif is widespread.

    The strongest case against treating the pattern as established history is
    structural. Similarity alone does not determine a source's identity, date,
    or capabilities; broad distributions are generally compatible with more
    than one generative history; the Göbekli handled forms remain functionally
    unidentified; and a team member reported too many intermediate links
    missing to establish later survival. The sole retrieved kind-matched image
    control says the lineup result changed when comparison objects were
    matched by kind. More importantly, the central catalogue bundle result,
    flood clustering, Genesis-detail distribution, and inter-judge
    disagreement are not supported by retrieved data-bearing evidence records.
    The catalogue and civiliser numbers that do have records are only the
    founder's unaudited self-reports. These weaknesses prevent a positive
    verdict, but they do not contradict transmission: missing links and
    nondiagnostic methods are absence of resolution, not demonstrations of
    independent invention.

    The single evidence record whose removal would most change this assessment
    is DEEP-E028, because it is the strongest direct record that the pivotal
    Pillar 43 forms had no final functional identification, preventing a
    shape-match from becoming a demonstrated handbag or bucket match. Without
    DEEP-E028, that local comparison would be more open and DEEP-C012 would
    cease to be well supported. The case verdict nevertheless survives:
    neither the missing functional determination nor its removal supplies the
    dated intermediates, matched likelihoods, or independent replication
    needed to decide the shared-history hypothesis.
  steelman: >-
    The ledger does not test whether the exact multi-feature conjunctions
    highlighted by proponents—specific body pose, bird-human form, handled
    object, accompanying animal, and civilising narrative—co-occur across
    cultures more often than expected in blinded, object-kind-matched controls.
    Broad motif coding can wash out a genuinely rare conjunction, so a
    preregistered test of those exact bundles and a search for securely dated
    intermediates remain an unanswered positive prediction of shared
    transmission.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      No evidence record directly tests this methodological proposition, so
      the verdict rests substantially on the general scientific prior that
      historical attribution is underdetermined without chronology, context,
      differences, and feasible routes of connection. The strongest opposing
      consideration is that an exceptionally specific resemblance can itself
      carry a large likelihood ratio and therefore contribute historical
      evidence. It still cannot by itself select a complete historical
      explanation with secure dating and context.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: high
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue's coverage and stress that
      broad categories are not the specific images, but neither record reports
      the bundle comparison or its result. No underlying data, comparison
      statistic, or direct result-bearing evidence record is present. The
      strongest consideration favoring the claim is that the recorded
      limitations presuppose an actual catalogue analysis, but that does not
      establish that the three-class bundle failed to stand out.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the two stated V1 rates, so they
      support the claim as a description of what the site says its experiment
      produced. The strongest opposing consideration is that both records are
      one unaudited self-report, with neither run data nor the number and
      treatment of incomplete lineups available. The numerical result is
      therefore provisional and carries little weight beyond the local
      reporting claim.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Translation, borrowing, and editorial harmonisation are plausible
      convergence mechanisms under general historical reasoning, but no
      evidence record compares a later retelling with an earlier attested
      version and demonstrates increased similarity. The strongest
      consideration favoring the claim is the layered transmission of
      Berossus through later excerptors, yet the supplied records do not show
      that this process made his account resemble another tradition. The
      claim's specified empirical test is therefore unmet.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      This is an inferential limitation: resemblance contains no unique
      information fixing a proposed source's identity, date, and capabilities,
      and those additions require independent constraints. The verdict rests
      partly on general methodological logic rather than a dedicated evidence
      record. The strongest opposing consideration is that a sufficiently rare
      and elaborate resemblance can strongly favor common ancestry, but even
      such evidence would not alone establish all three added attributes.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The proposition follows from generic model non-identifiability: both
      diffusion and repeated invention can generate a broad geographical
      distribution unless temporal, relational, or mechanistic constraints
      distinguish them. This verdict leans on that scientific prior because
      the packet provides no explicit competing models. The strongest opposing
      consideration is that some geographical patterns can be highly
      diagnostic under well-specified models, so the claim should not be read
      as saying geography is never informative.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: high
    reasoning: >-
      DEEP-E018 and DEEP-E019 discuss uneven catalogue coverage and the breadth
      of its categories, but they do not state the frequencies of all three
      motif classes or otherwise demonstrate that each is widespread. No
      coded data or direct result-bearing record is supplied. The strongest
      consideration favoring the claim is the records' reference to frequency
      figures, while the strongest obstacle to an affirmative verdict is that
      those figures are not actually given for the complete three-class claim.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 directly report a 55% bird-person frequency among
      926 sampled traditions. DEEP-E015, DEEP-E018, and DEEP-E019 appropriately
      limit its interpretation by noting that the class is broad and coverage
      uneven. The strongest opposing consideration is that the method and
      coded catalogue were not retrieved, leaving the exact numerator,
      exclusions, and reproducibility unaudited.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E016 directly reports the 37% cosmic-serpent frequency, while
