      rests on nothing retrieved.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is strong, direct support: the excavation team's own published
      statement that "a final decision on the meaning of these images" is not
      possible, matched by Schmidt's shape-only description (DEEP-E025). The
      strongest opposing consideration is temporal: the statement is a 2016/2017
