      not retrieved, and DEEP-R005 remains open on exactly this point.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the Vidale & Micheli abstract's own reading that strong
