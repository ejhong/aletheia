caseAssessment:
  verdict: mixed
  loadBearing: [DEEP-C026, DEEP-C035, DEEP-C012, DEEP-C027, DEEP-C059]
  weakestLinks: [DEEP-C037, DEEP-C031, DEEP-C054, DEEP-C057, DEEP-C028, DEEP-C015]
  synthesis: >-
    The case asks how much cross-cultural resemblance in motifs — bird-men, handled
    objects, navel names, civilisers, floods — belongs to a shared past rather than to
    convergent image-making and retelling. The ledger's decided claims split cleanly
    into three strata. On the caution side, the methodological claims (DEEP-C002,
    C026, C035) are well supported: C026 and C035 are near-analytic about
    underdetermination, and the excavators' own "missing links" agnosticism
    (DEEP-E061/E062) indirectly corroborates that no distribution of motifs alone
    separates transmission from invention. On the object side, the strongest decided
    results are concrete and local: Schmidt's shape-only description (DEEP-E025)
    together with the team's published refusal of a functional identification
    (DEEP-E028) makes the Pillar 43 comparison a comparison of shapes only
    (DEEP-C012, C065); the Jiroft wear reading is abstract-level and expressly
    single-object (DEEP-C009); and the Hoa Hakananai'a sequence statue → komari →
    bas-reliefs is well supported (DEEP-C059), showing that one of the compared
    "bird-men" is a later carving on an older statue — exactly the kind of dating
    datum DEEP-C002 says a resemblance judgment needs. On the pattern side, the
    catalogue and lineup statistics (DEEP-C005, C025, C027, C056, C057) rest wholly
    on the founder's self-reports with method and run data not retrieved; DEEP-C057
    and the sacred-centre leg of C056 lack even a supporting record. The site's own
    image pilots found kind-matching changed results (DEEP-C038, weakly supported)
    and its AI judges' disagreement is asserted but unevidenced (DEEP-C037),
    discounting its AI-mediated measurements. The navel-name, Viracocha, flood-coding
    and retelling-convergence claims are decided on background plausibility alone or
    not at all. Net: nothing in the ledger establishes a transmission chain, and
    nothing rules one out; what is established is that the comparisons so far are
    shape-only, undated, or measured by instruments the ledger itself shows to be
    fragile. That is a substantive mixed finding, not a hedge.
  steelman: >-
    The V1 civiliser lineup result (DEEP-C027, DEEP-E020/E021): claimed civiliser
    pairs ranked first in 62.5% of completed lineups against 9% for random pairs — a
    roughly seven-fold excess-resemblance signal. If it survives the source-level,
    human-rater rerun the ledger itself proposes (DEEP-R003), it is precisely the
    structured, quantified excess similarity that the underdetermination arguments
    (DEEP-C026, C035) concede resemblance alone cannot supply but do not rebut —
    this assessment has only the site's self-report of it and no record answering
    the observation. Backed by the one documented textual chain the ledger does
    contain — Berossus's fish-bodied Oannes aligned by the translators with U-An,
    first of the apkallu (DEEP-E043, E079) — a proponent can rightly say the
    civiliser-teacher motif has at least one attested transmission route and one
    measured cross-cultural excess, and nothing in this run explains either away.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record tests this directly; the verdict leans on methodological
      background plus ledger instantiations — the Hoa Hakananai'a carvings postdating
      the statue (DEEP-E068/E069) and the undecidable function of the Pillar 43 forms
      (DEEP-E028) show dates and context changing what a resemblance means. The
      strongest opposing consideration is that a resemblance in a richly documented
      context can be self-interpreting; the ledger holds no worked counterexample, so
      "established" is not warranted on these records alone.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records naming this claim (DEEP-E018, E019) are the author's own
      qualifications of coverage and category breadth; no evidence record quotes the
      experiment's documentation-preserving comparison or its comparative result.
      The page's anchor quote asserts the finding, but source anchors are not
      evidence records under this assessment's rules. Strongest opposing
      consideration: the result is stated on the page — but with method and data not
      in hand, a self-report cannot carry the claim.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and E021 are weak self-reports of the site's own AI lineup
      experiment; run data were not retrieved and "completed lineups" implies
      unenumerated incomplete runs. The strongest opposing consideration is the
      ledger's own pilot finding that AI feature coding was unreliable and
      kind-matching changed results (DEEP-E022, DEEP-C038), which directly
      discounts confidence in an AI-judged resemblance statistic.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim; the verdict rests on well-documented
      background phenomena of convergence under translation, borrowing and
      comparative writing, and is flagged as prior-based. The claim's own truth
      condition — documented retellings showing convergence relative to earlier
      attested versions — is unmet in the ledger; even the linked Oannes detail
      (DEEP-C083) has no evidence record. Strongest opposing consideration: none in
      the ledger disputes the mechanism, but none evidences it either.
  - claimId: DEEP-C035
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is close to analytic: identity, date and capability claims about a
      hypothesised source are existential claims that resemblance cannot pin down,
      and DEEP-E061/E062 show concretely what establishing a chain would require —
      dated intermediates, of which none are established. The strongest opposing
      consideration is that a rich similarity pattern can raise the prior of a
      shared source; but raising a prior is not establishing the additions, which is
      what the claim denies.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The underdetermination of distributional data between independent invention
      and old transmission is standard in cultural phylogenetics, and the ledger
      corroborates it indirectly: the excavation team's position that "missing
      links" prevent establishing survival of imagery (DEEP-E061/E062, parented to
      this claim) shows what a discriminating dataset would need. The strongest
      opposing consideration is that with enough securely dated intermediates a
      distribution could become diagnostic — which is why the claim is correctly
      scoped to what a catalogue distribution shows "by itself."
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two of the three classes have self-reported frequencies (birds at 55%,
      DEEP-E013/E014; serpents at 37%, DEEP-E016), but no record reports any
      frequency for the sacred-centre class, so "each widespread" is only
      partially evidenced. DEEP-E018/E019 qualify all three with the author's own
      coverage caveat. Strongest opposing consideration: the missing third leg —
      nothing in the ledger shows the sacred-centre class's prevalence at all.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013/E014 weakly support the figure as the page's statement of its own
      unaudited result; DEEP-E015 is a scope qualification rather than support (as
      the second reader noted), and DEEP-E018/E019 record the author's own caveat
      about uneven catalogue coverage. The strongest opposing consideration is that
      the underlying Berezkin & Duvakin catalogue and the coding method were never
      retrieved, so the proportion cannot be checked against the coded data.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Same footing as DEEP-C005: DEEP-E016 is a weak self-report, DEEP-E017 a scope
      caveat that does not itself bear on the 37% figure, and DEEP-E018/E019 the
      author's coverage qualification. The strongest opposing consideration is the
      absence of the experiment's method and data; the number exists only as the
      page's assertion.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The three-way distinction is conceptually sound and the ledger's Rapa Nui
      evidence points that way — Pitts et al. read the reliefs as narrating the
      birdman myth recorded centuries later (DEEP-E071/E072), a ritual/
      transformation framing, not a bird-headed deity. But no record directly
      compares the categories across the compared images, so the claim's truth
      condition is only partially instantiated. Strongest opposing consideration:
      the categories can blur — a deity with a bird's head and a masked or
      transformed person are not always separable in the images themselves.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and E069 independently record the peer-reviewed Pitts et al.
      abstract's relative sequence — statue made, komari subsequently added,
      bas-relief carvings succeeding them — which is exactly the claim. The
      strongest opposing consideration is that this is abstract-level evidence
      giving a relative sequence only, with no absolute date and the paywalled body
      unread; a later re-reading of the carving sequence would overturn it.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The ledger instantiates the separation concretely: Schmidt records the three
      forms' shape without committing to a function (DEEP-E025), the team states no
      functional decision is possible (DEEP-E028), and function is pursued
      independently by wear analysis for the Jiroft object (DEEP-E035/E038). The
      strongest opposing consideration is that the claim's source anchor quotes a
      mismatched passage, suggesting extraction noise — but the shape/function
      split is genuinely exhibited by the evidence records themselves.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 supports the bucket half — the banduddû filled with water and used
      to sprinkle in rituals — but only through a secondhand blog transcription of
      Wiggermann 1992 with visibly garbled transliterations, and the cone/purifier
