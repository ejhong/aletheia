  synthesis: >-
    The ledger's evidence records, taken strictly on their own terms, show that visual and narrative resemblances across the named motifs (bird-persons, handled forms, navel names, hands-on-body poses, cosmic serpents, civilising teachers, flood details) are real enough to notice yet systematically under-determined as historical signals of a shared deep past. Methodological claims that are load-bearing—C002, C026, C035, C065—are either definitional or directly corroborated by primary excavation statements and therefore stand: resemblance alone never assigns meaning, geography of broad classes cannot separate independent invention from deep transmission, similarity cannot underwrite lost-civilisation identity/date/capability claims, and shape must be kept distinct from function. The single strongest primary anchor is the Göbekli Tepe team's own published refusal of a secure functional identification for the three handle-like forms on Pillar 43 (E028), reinforced by the excavator's informal but explicit “missing links” caution on any survival of the imagery into later Near Eastern objects (E061/E062). Parallel cautions appear in the image-pilot self-reports (matching object kinds alters rankings; AI judges disagree) and in the catalogue experiment's own admission that its three broad classes are each widespread while their co-occurrence bundle does not stand out under documentation-preserving controls. Against these, the positive frequency and lineup numbers (55 % bird-person, 37 % cosmic-serpent, 62.5 % civiliser partner first-rank) rest exclusively on the founder's unaudited self-reports of his own experiments; the underlying coded catalogues, run logs and inter-rater statistics are not in the ledger, so those statistical claims remain weak. Concrete object-level findings that do survive primary retrieval—the Jiroft wear consistent with cord suspension (abstract only, single-object caveat), the relative sequence of later birdman bas-reliefs on Hoa Hakananai'a, Berossus's fish-bodied Oannes teaching the arts, and the banduddû's ritual-bucket reading via second-hand transcription—establish local facts or plausible functions inside single cultures; none supplies a dated intermediate, shared lexicon, or transmission path that would elevate the cross-cultural pattern above convergence, material constraint, or later comparative retelling. Flood-detail clustering by region and the modern (not pre-modern) Viracocha identification further tilt toward regional and post-contact processes. The net result is that a non-zero shared-past contribution cannot be ruled out, yet every tested quantitative or iconographic claim either fails to distinguish the hypotheses or actively favours the nulls of independent invention, material logic and secondary convergence. The case therefore warrants only weak support for any substantial “deep memory” transmission component; the bulk of the observed resemblance is presently better explained by the ways people make images, tell stories and look for connections.
  steelman: >-
    The civiliser-lineup first-rank rate of 62.5 % versus 9 % for random pairs, if the underlying passages are later shown to be free of modern compression artifacts, remains an unexplained quantitative signal that a shared narrative template may have travelled farther than the regional clustering of flood details would predict.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a definitional requirement of historical inference: without dates, contexts, differences and possible connections, a visual resemblance is merely an observation, not an explanation. No evidence record contradicts it; the strongest opposing consideration is that some resemblances might be so unique that context is superfluous, yet the ledger supplies no such uniquely diagnostic motif.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder's page reports that the three-class bundle does not stand out under documentation-preserving comparisons, and the associated evidence records simply restate that self-report while noting uneven catalogue coverage. The underlying coded data and comparison statistics are absent, so the claim rests on an unaudited experiment. The strongest opposing consideration is that a different coding granularity or a larger Near-Eastern sample might make the bundle appear non-random.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Evidence records E020 and E021 reproduce the page's own statement of the 62.5 % / 9 % first-rank rates; no run logs or rater data appear in the ledger. The result is therefore a self-report of an AI lineup experiment whose incomplete runs are acknowledged on the page itself. The strongest opposing consideration is that human raters working from uncompressed original passages (the open research item) could collapse the difference to chance.
  - claimId: DEEP-C034
    verdict: well_supported
    confidence: high
    reasoning: >-
      Documented processes of translation, scholarly borrowing and comparative handbook writing are known to homogenise narrative detail; the claim's truth condition is satisfied by ordinary philological observation even without a specific ledger example. The strongest opposing consideration is that some core motifs might resist such convergence, yet the ledger offers no counter-example that survived independent early attestation.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      A lost-civilisation narrative asserts identity, date and technological capacity that resemblance data cannot supply; the claim simply records that logical gap. No evidence record attempts to bridge it. The strongest opposing consideration would be a resemblance so precise and multi-attribute that it forced those stronger claims, but none is present.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      Under any standard model of cultural evolution the same geographic scatter of a broad motif is compatible with both independent invention and very old transmission; the claim states that under-determination. The Göbekli team's “missing links” remark (E061/E062) illustrates the practical consequence. The strongest opposing consideration is that a future dense set of dated intermediates could break the symmetry, yet none is in the ledger.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The page asserts that the three broad classes are each widespread; the evidence records restate the assertion and immediately qualify the catalogue's uneven coverage. Without the coded dataset the frequency claim cannot be audited. The strongest opposing consideration is that “widespread” may be an artefact of the particular motif definitions chosen by the experiment.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E013–E015 simply quote the founder's report of a 55 % bird-person rate in 926 traditions; the catalogue and coding rules are not retrieved. The page itself notes that broad classes do not capture specific pose–object combinations. The strongest opposing consideration is that re-coding with stricter morphological criteria would lower the rate substantially.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Parallel to C005, the 37 % cosmic-serpent figure is a self-report (E016/E017) qualified by the same coverage and category caveats. No independent count exists in the ledger. The strongest opposing consideration is that the “cosmic” qualifier may have been applied inconsistently across regions.
  - claimId: DEEP-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is an interpretive observation that the label “bird-man” conflates deity, costumed person and transformative figure; the compared images in the founding pages fall into more than one of those categories. No evidence record disputes the distinction. The strongest opposing consideration is that some cultures may have treated the three as a single continuum, collapsing the typology.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract (E068/E069) states the relative sequence statue → komari → bas-relief birdman carvings, directly satisfying the claim that the birdman images post-date manufacture. Absolute dates and the full argument remain paywalled. The strongest opposing consideration is that the bas-reliefs could be contemporary with manufacture and only the komari later, but the abstract's wording places both additions after the statue.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically distinct; the Göbekli forms can share an arched outline with the Assyrian banduddû without sharing its ritual use. The claim is methodological and uncontroversial. The strongest opposing consideration is that in some artefact classes shape is so tightly coupled to function that the separation becomes artificial, yet that coupling is not demonstrated here.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      A second-hand blog transcription of Wiggermann (E055) states that the banduddû was filled with water and used to sprinkle, supporting a bucket-and-purifier reading. The printed page has not been checked and the cone/purifier half is not in the transcribed passage. The strongest opposing consideration is transcription error or selective quotation that misrepresents the ritual texts.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Dietrich's 2016 team post (E028) explicitly closes the discussion of the three forms by stating that a final decision on their meaning is not possible. That is precisely the excavation team's published position required by the claim. The strongest opposing consideration is a later team monograph that might have settled the question, but no such monograph is in the ledger.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Vidale & Micheli abstract (E035) states that the wear suggests long suspension on a cord, matching the claim's truth condition; E038 immediately limits the inference to a single object. Body of the paper unread. The strongest opposing consideration is that the wear pattern could result from a different handling mode once the full use-wear analysis is examined.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The excavator's comment-thread reply (E061/E062) states there are far too many missing links to be sure of survival or of any change in meaning. The statement is informal yet authorial. The strongest opposing consideration is that the same author may have expressed a firmer continuity claim in a later formal publication not yet retrieved.
  - claimId: DEEP-C018
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The four “navel” expressions differ in language family, earliest written attestation and whether any builder community is known to have used the term; those differences are visible even from the secondary summaries in the founding pages. Primary source histories remain an open research item. The strongest opposing consideration is that an early shared substrate term might still underlie the later forms, but no such substrate is evidenced.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim requires documentation that the Turkish toponym is descriptive of mound shape rather than a sacred designation; the only ledger statement is the founder's unsourced caption. No Turkish or Ottoman primary toponymic source appears. The strongest opposing consideration is that local oral tradition may have carried a sacred “navel” meaning later folk-etymologised as shape.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Material constraint (carving limbs against the body to protect them) is a mechanically plausible contributor to the hands-on-torso pose; the claim does not assert it is the sole cause. No contradictory structural analysis is present. The strongest opposing consideration is that the pose may be entirely symbolic and the breakage-protection benefit merely incidental.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Berossus F1 describes a fish-bodied, human-headed teacher of the arts whose form was preserved in sculpture; the translators' table aligns Oannes with the first apkallu U-An. The iconographic identity of the fish-cloak type with the named apkallu remains an inference, not a direct textual statement. The strongest opposing consideration is that Berossus may have conflated distinct sage traditions.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim asserts that no pre-modern source names the Gate of the Sun figure Viracocha; the ledger contains only the founder's assertion. No colonial or indigenous text corpus has been checked. The strongest opposing consideration is an early Spanish or Aymara source that does make the identification and has simply not been retrieved.
  - claimId: DEEP-C031
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The page reports regional clustering of 263 coded flood summaries; the evidence records restate that self-report. Coded data and the clustering metric are absent. The strongest opposing consideration is that the apparent regional signal is an artefact of which modern language summaries were chosen for coding.
  - claimId: DEEP-C054
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Parallel self-report of an uneven distribution of Genesis-associated details alongside widespread generic motifs. No contingency table or statistical test is supplied. The strongest opposing consideration is that “Genesis-associated” coding may itself embed the comparative tradition the experiment seeks to measure.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E022 quotes the page's statement that matching object kinds changed the lineup result; pilot data are not retrieved and incomplete runs are acknowledged. The strongest opposing consideration is that the kind-matched control itself introduced new confounds that artificially altered rankings.
  - claimId: DEEP-C037
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founding page asserts strong inter-judge disagreement and unreliable feature coding among AI judges; no quantitative agreement statistic or raw judge output appears in the evidence records. The strongest opposing consideration is that a different prompting regime or a larger judge panel would produce acceptable consensus.