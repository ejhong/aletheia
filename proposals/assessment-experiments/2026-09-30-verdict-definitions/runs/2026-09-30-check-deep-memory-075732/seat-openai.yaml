caseAssessment:
  verdict: weakly_supported
  loadBearing: [DEEP-C002, DEEP-C026, DEEP-C035, DEEP-C012, DEEP-C027, DEEP-C072]
  weakestLinks: [DEEP-C057, DEEP-C027, DEEP-C031, DEEP-C054, DEEP-C037]
  synthesis: >-
    The featured shared-past or long-distance-transmission hypothesis is weakly
    supported on this ledger. The records document several genuine local
    observations, but they do not assemble those observations into a dated,
    causally connected historical chain. The strongest positive item is the
    reported civiliser-lineup result in DEEP-E020 and DEEP-E021: claimed
    partners allegedly ranked first much more often than random pairs. That
    finding would matter if independently reproducible, because it attempts a
    controlled comparison rather than simply placing selected images or
    narratives side by side. On the present record, however, it is an
    interested-party self-report without the run data, with an undefined set of
    completed lineups and no human replication. The catalogue frequency
    reports likewise indicate that bird-person and cosmic-serpent categories
    were common in the sampled material, but the data and coding were not
    retrieved, coverage was uneven, and the categories were explicitly broader
    than the specific objects and stories at issue. No evidence record directly
    establishes the claimed three-motif bundle result, regional clustering of
    flood narratives, or uneven distribution of Genesis-associated details.

    Steelmanning the positive case, the juxtaposed traditions contain more than
    one superficial theme: anthropomorphic bird forms, handled forms, bodily
    poses, civilising teachers and flood-story details can be compared as
    potentially correlated traits. The lineup report suggests that at least
    one such comparison might survive controls, while the Oannes records
    document a genuinely fish-bodied culture-bringer and a scholarly
    Oannes/U-An alignment. The absence of known intermediates does not logically
    prove that transmission did not occur, especially where preservation is
    sparse.

    Steelmanning the negative case, the records repeatedly expose
    underdetermination. Shape does not establish function; Pillar 43's forms
    lacked a secure functional identification in the retrieved team statement,
    while the Assyrian bucket interpretation has a distinct ritual context.
    Broad motifs being widespread makes selected similarities less surprising,
    not more. DEEP-E061 and DEEP-E062 directly record an excavator's view that
    too many intermediate links are missing to establish survival of Göbekli
    Tepe imagery into later Near Eastern material. The later birdman reliefs on
    Hoa Hakananai'a also postdate the statue itself, warning against treating
    every visible feature as one chronologically unitary object. Methodological
    claims DEEP-C002, DEEP-C026 and DEEP-C035 capture the decisive point:
    resemblance and geographical distribution alone cannot identify a source,
    date, capability or transmission mechanism.

    Sensitivity is greatest to DEEP-E020, the record reporting the 62.5%
    first-place rate for claimed civiliser partners. Removing it would eliminate
    the clearest positive, nominally controlled result and leave DEEP-E021's
    random-pair rate without its essential comparator. The weakly_supported
    verdict nevertheless survives without DEEP-E020: the remaining records
    still contain suggestive local correspondences, but none supplies the
    discriminating chronology, intermediates, replication or specific-bundle
    test needed to raise the hypothesis above weak support.
  steelman: >-
    The ledger never tests whether the tightly specified joint constellation of
    rare poses, handled forms, associated animals and narrative details recurs
    across securely dated distant contexts more often than matched
    documentation-preserving controls predict. Broad catalogue categories can
    wash out that proposed bundle, so its allegedly anomalous co-occurrence
    remains an unanswered positive argument for shared transmission.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      This is a methodological identifiability claim: the same visual
      resemblance can result from transmission, convergence, practical
      constraint or selection, so resemblance alone cannot choose its historical
      cause. Its basis is logic and standard causal reasoning rather than a
      particular evidence record. The strongest opposing consideration is that
      an exceptionally specific resemblance can alter prior odds, but even then
      dates, contexts and possible connections remain necessary to assign a
      historical explanation.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: high
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue's coverage and distinguish
      broad categories from the specific motifs, but neither reports the
      documentation-preserving comparison or its result. Thus no evidence record
      establishes that the three-category bundle failed to stand out. The
      strongest opposing consideration is the founder's stated result, but that
      statement was not entered as a supporting evidence record with data or
      statistics.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: high
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the claimed 62.5% and 9% rates, so
      there is a lean toward the claim. Both are parts of the same
      interested-party self-report, and the run data, denominator and incomplete
      lineups were not retrieved. The strongest opposing consideration is
      therefore the complete absence of an auditable reproduction or independent
      replication of the exact rates.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Translation, borrowing and comparative rewriting are plausible mechanisms,
      but no evidence record supplies the documented before-and-after retellings
      required by the claim's truth condition. General background knowledge
      raises the prior plausibility but is not case evidence. The strongest
      opposing consideration is that the claim is existential and likely in
      general, yet the ledger does not identify even one demonstrative example.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      As a matter of logical underdetermination, resemblance contains no unique
      information about a proposed source's identity, date or technological
      capabilities. Those additional propositions require independent
      chronological, contextual or material evidence. The strongest opposing
      consideration is that unusually complex similarities could support a
      transmission inference probabilistically, but they still could not by
      themselves establish all the detailed additions named in the claim.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographical distribution is observationally compatible with both
      repeated independent emergence and transmission under suitable models, so
      distribution alone cannot identify which generated it. This verdict rests
      on methodological non-identifiability rather than an empirical record.
      The strongest opposing consideration is that a highly structured
      distribution can favour one explicit model, but the claim correctly says
      “by itself” and does not deny model-based discrimination using added
      assumptions and evidence.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E013, DEEP-E014 and DEEP-E016 weakly report substantial frequencies
      for broad bird-person and cosmic-serpent classes. No evidence record gives
      the sacred-centre frequency, so the conjunctive claim that all three are
      widespread is not reproduced. The strongest opposing consideration is
      DEEP-E018 and DEEP-E019: coverage was uneven and the broad categories do
      not correspond directly to the case's specific motifs.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: high
    reasoning: >-
      DEEP-E013 and DEEP-E014 state the 55% figure directly, but both derive from
      the site's report of its own unaudited experiment. Neither the coded data
      nor the method needed to reproduce the numerator and denominator is in the
      ledger. The strongest opposing consideration is the uneven catalogue
      coverage recorded in DEEP-E018, although that limitation concerns
      representativeness more directly than the arithmetic of the reported
      sample.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: high
    reasoning: >-
      DEEP-E016 directly states that the catalogue analysis reported 37%, giving
      the claim a weak evidential lean. It is nevertheless a self-report without
      the coding, sample table or reproducibility check. The strongest opposing
      consideration is the limited and uneven coverage in DEEP-E018 and the
      category-specific scope in DEEP-E017 and DEEP-E019.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: high
    reasoning: >-
      The three proposed concepts are intelligibly distinct, but no evidence
      record classifies the compared images as deities, feather-wearers or
      transforming people. Conceptual distinguishability alone does not show
      that the gallery actually contains examples of each category. The
      strongest opposing consideration is the plausible interpretive taxonomy
      in the claim itself, which remains an unevidenced prior rather than a
      demonstrated classification.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: high
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the Pitts et al. sequence in which komari
      were added after the statue's making and the birdman bas-reliefs succeeded
      them. That directly places the birdman reliefs later than manufacture, but
      both records derive from one paper's abstract rather than independent
      studies or its full analysis. The strongest opposing consideration is that
      the underlying survey reasoning and any absolute dating remain unread,
      though nothing in the records contradicts the relative sequence.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      An object's outline does not logically determine its use: similarly shaped
      forms can serve different functions, and one function can have multiple
      shapes. This is a definitional and methodological distinction rather than
      an empirical generalisation requiring the case records. The strongest
      opposing consideration is that shape can be strong functional evidence in
      a sufficiently constrained context, but evidential relevance does not make
      shape and function the same question.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E055 reports ritual text in which the banduddû contains water that is
      consecrated and sprinkled, supporting a ritual bucket interpretation. The
      evidence is an unchecked secondhand blog transcription, and the retrieved
      passage does not establish the cone or purifier half of the compound
      interpretation. That missing purifier link and the source's transcription
      problems are the strongest opposing considerations.
  - claimId: DEEP-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 directly quotes a Göbekli Tepe team member saying that a final
      decision on the images' meaning was not then possible. DEEP-E025 also
      confines the excavator's earlier description to box-like shapes with
      handle-like attachments rather than a function. The strongest opposing
      consideration is temporal scope: the decisive statement is a 2016/2017
      blog post, and later team publications that could supply a secure
      identification were not checked.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 reports the authors' abstract-level inference that strong wear
      indicated long suspension on a cord, directly matching the claim's
      “consistent with” wording. DEEP-E034 independently records the observed
      handle and contour wear, but it comes from the same abstract. The strongest
      opposing consideration is DEEP-E038: the authors say the inference rests
      on one object and is far from assured, while identity with the particular
      photographed object was not independently confirmed.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 directly report Oliver Dietrich's statement that
      too many missing links prevent confidence about survival and changes of
      meaning. This supports the substantive position attributed to the
      excavation side. The strongest opposing consideration is that the wording
      comes from one team member's informal comment-thread reply rather than a
      formal collective statement of the entire excavation team.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record supplies the relevant languages, earliest attestations
      and builder-era usage for all four names. Their source histories are
      plausibly different on general historical grounds, but that prior cannot
      verify the claim's specific three-part comparison. The strongest opposing
      consideration is that the distinctions appear likely; the missing primary
      lexical and historical records nevertheless leave them untested here.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record addresses whether the Turkish name Göbekli Tepe was
      coined descriptively from the mound's shape rather than as a sacred
      designation. The record about Kurdish names, DEEP-E024, does not bear on
      this Turkish etymology. The strongest opposing consideration is the
      founder's unsourced caption, which is not enough to decide the historical
      origin of the toponym.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      General mechanical reasoning provides a prior basis: limbs joined to a
      stone torso have shorter unsupported spans and are less exposed to
      breakage, making material constraint a plausible contributor. No evidence
      record demonstrates that this consideration actually influenced any of
      the compared sculptors, so the support is only provisional and prior-based.
      The strongest opposing consideration is that symbolic convention could
      fully explain the pose, and the ledger contains no comparative damage,
      quarrying or carving analysis.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 records Oannes as a fish-bodied human figure, DEEP-E076 records
      the assertion that his form survived in sculpture, and the related
      DEEP-E079 records a scholarly table aligning Oannes with U-An, first of an
      apkallu list. Together these make the correspondence plausible but remain
      indirect. The strongest opposing consideration is the missing
      iconographic link: no evidence record identifies the particular Assyrian
      fish-cloaked figure as a named apkallu or demonstrates that it is the
      sculpture meant by Berossus.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record traces when the Gate of the Sun's central figure was
      first called Viracocha or examines pre-modern naming sources. Consequently,
      the claim's explicit absence condition cannot be assessed. The strongest
      opposing consideration is the plausible modernity of the identification,
      but plausibility is not evidence that no pre-modern source makes it.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record presents the 263 coded summaries, a clustering measure,
      a null comparison or the claimed regional result. The statement is
      therefore not reproducible from the ledger. The strongest opposing
      consideration is the site's asserted pilot finding, but it was not entered
      as a supporting evidence record and cannot substitute for the missing
      analysis.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record gives the coded Genesis-associated details or shows
      their distribution across the flood-summary corpus. Without counts,
      definitions or a geographic comparison, “uneven” cannot be evaluated.
      The strongest opposing consideration is the founder's reported conclusion,
      which remains unaudited and absent as evidence for this claim.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: high
    reasoning: >-
      DEEP-E022 directly states that matching object kinds changed the lineup
      result, so the record leans toward the claim. It is solely a self-report of
      a pilot whose data were not retrieved and whose runs and cropping were
      incomplete. The strongest opposing consideration is that no effect size,
      direction of change or reproducible ranking table is available.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record reports inter-judge agreement statistics or otherwise
      documents strong disagreement about the same objects. DEEP-E022 concerns
      kind-matched controls and was explicitly recognised as not bearing on this
      separate agreement claim. The strongest opposing consideration is the
      site's general statement about disagreement, but without a linked
      evidential result it does not establish how strong or systematic that
      disagreement was.