  weakestLinks: [DEEP-C031, DEEP-C054, DEEP-C057, DEEP-C053, DEEP-C044]
  synthesis: >-
    The featured question is whether the cross-cultural resemblances the site arrays — bird-men, handled
    objects, navel names, civilisers, floods — belong to a shared past or to the ways people make images
    and retell stories. The ledger, read strictly by its evidence records, puts real weight on both sides
    and decides neither. On the supporting side, the only quantitative positive result is the V1 civiliser
    lineup (DEEP-E020/E021): claimed partners ranked first in 62.5% of completed lineups against 9% for
    random pairs, a self-reported but specific result which, if it survives the site's own kind-matched and
    human-rater controls, would be exactly the kind of non-random correspondence a transmission account
    needs. On the undermining side, DEEP-E022 records that matching the kinds of objects in a lineup
    changed the result — a cautionary finding that, alone, would materially weaken the case's measurement
    programme. Both records come from the founder's own unaudited experiments with run data not retrieved,
    which is why the case verdict is mixed at low confidence rather than leaning anywhere harder. Around
    this pivot the object-level records are better anchored but thematically local: the Pillar 43 forms
    have no secure functional identification per the excavation team (DEEP-E028, strong), the Jiroft
    handbag's cord-suspension wear reading is reported by Vidale & Micheli at abstract level with a
    single-object caveat (DEEP-E035/E038), and the Hoa Hakananai'a birdman reliefs postdate the statue
    per Pitts et al. (DEEP-E068/E069). None of these settles transmission versus convergence; they
    establish that the comparisons are being made against real, dated, individually described things.
    The decisive methodological claims — that a catalogue's distribution cannot distinguish invention
    from transmission (DEEP-C026), that similarity alone cannot carry a lost-civilisation account's added
    claims (DEEP-C035) — have no evidence records of their own and rest, where I support them at all, on
    disclosed method-logic rather than measurement. The flood pilot (DEEP-C031, DEEP-C054), the bundle
    test (DEEP-C057), and the inter-judge disagreement claim (DEEP-C037) are entirely unrecorded in
    evidence. The case is therefore genuinely two-sided and unsettled, not merely under-studied: one thin
    positive result stands against one thin negative one, and the heaviest verified facts sit at the
    object level without voting on the hypothesis.
  steelman: >-
    The V1 lineup result is unrebutted by anything in the ledger: claimed civiliser partners ranked first
    in 62.5% of completed lineups against a 9% random baseline, and no record in the packet demonstrates
    that translation, borrowing or compressed modern retelling (DEEP-C034's mechanism) can produce a
    signal that large — the human-rater, source-level replication designed to test that (DEEP-R003) has
    never been run. A proponent can rightly say: the one quantitative test of the civiliser pattern that
    exists came out strongly positive, and the kind-matching caveat concerns image lineups, not this
    textual result.
claimAssessments:
  - claimId: DEEP-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the packet bears on this methodological claim; it rests only on the founder
      page's assertion. Its truth condition is a universal over all resemblances ("no resemblance can be
      assigned a historical explanation without those data"), which no record tests and which is too broad
      to carry on a bare prior. The strongest opposing consideration is that the claim is near-definitional
      of historical method; even granting that, the ledger offers no demonstration, and per the rules a
      claim with no evidence record and no named non-record basis is unresolved.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records attached to this claim (DEEP-E018, DEEP-E019) are the author's own qualifications
      about uneven catalogue coverage and the gap between broad categories and specific images; neither
      states or reproduces the bundle comparison the claim asserts. The anchor quote ("Their bundle does
      not stand out") is the claim's anchor from the founder page, not an evidence record of the result.
      The strongest opposing consideration is that the site plainly did run some documentation-preserving
      comparison, but until its data are retrieved there is nothing to weigh.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E020 and DEEP-E021 record the page's statement of both rates (62.5% first-rank for claimed
      partners, 9% for random pairs), so the claim's condition — that the experiment's run data reproduce
      those rates — is met only at the level of the site's self-report. Both records carry explicit
      limitations: run data not retrieved and "completed lineups" implies unenumerated incomplete runs.
      The strongest opposing consideration is that this is a single unaudited self-report whose run data
      could not be checked, and the site itself flags kind-matching and retelling artefacts as live
      alternatives (DEEP-E022, DEEP-R003).
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim requires documented retellings showing convergence of detail relative to earlier attested
      versions; no evidence record in the packet provides one. The Berossus records (DEEP-E043, E046)
      attest the Oannes narrative itself but say nothing about later versions converging. The strongest
      opposing consideration is that convergence through comparative writing is a well-known phenomenon on
      general background — but that is a prior, and no record here demonstrates it for any of the case's
      story families.
  - claimId: DEEP-C035
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record bears on this claim; I support it on a disclosed non-record basis, namely a point
      of inference: claims about a source's identity, date and capabilities are additional propositions,
      and a resemblance underdetermines them, since many distinct histories can produce the same
      resemblance. The strongest opposing consideration is that the claim's scope ("similarity alone
      cannot establish...") is a universal that a single demonstrated counterexample — a resemblance that
      did establish such a claim — would break, and the ledger contains no survey establishing that none
      exists.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim's own truth condition requires the same distribution to be shown compatible with both
      histories "under stated models," and the packet contains no stated models and no demonstration; the
      only attached record is the excavators' informal 'missing links' reply via DEEP-C072, which is
      agnosticism, not a compatibility proof. The strongest opposing consideration is that with enough
      structure (dated intermediates, directionality), distributions can sometimes discriminate — which is
      exactly what no record here tests.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Something is offered: DEEP-E013 (55% bird-person) and DEEP-E016 (37% cosmic-serpent) indirectly
      evidence widespreadness for two of the three classes, as self-reports of an unaudited experiment.
      But the third class (sacred centres) has no frequency record at all, and the records attached to
      this claim directly (DEEP-E018/E019) only qualify. The claim is incomplete on the records rather
      than opposed; the strongest opposing consideration is that "widespread" for a 926-tradition sample
      with acknowledged uneven coverage (especially the ancient Near East and Rapa Nui) is not established
      by two secondhand figures.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 record the page's statement of the 55%-of-926 figure, meeting the claim's
      condition only as the site's own reported result; the underlying Berezkin & Duvakin catalogue and
      method page are not in hand. DEEP-E015 and the coverage caveats qualify rather than support. The
      strongest opposing consideration is that the figure is a self-report whose coded data have never
      been independently reproduced, and the author's own limitation notes concede uneven coverage.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E016 records the 37% figure as the site's statement of its own result, with method and data not
      retrieved; DEEP-E017 is a scope caveat, not support. The claim's condition — that the coded data
      reproduce the proportion — is untested beyond the self-report. The strongest opposing consideration
