  synthesis: >-
    The case poses an open comparative question: what fraction of the striking visual and narrative resemblances (bird-headed figures, handled containers, navel-of-the-world toponyms, hands-on-torso poses, feathered or cosmic serpents, civilising culture-bringers, flood survivors) across distant prehistoric and early historic cultures is best explained by shared deep ancestry or long-distance transmission, versus independent invention, material or cognitive convergence, and later processes of retelling, translation and scholarly juxtaposition. The evidence records do not decide proportions. Methodological claims that are load-bearing are either established by elementary standards of historical inference or well supported by primary excavation statements: historical meaning of a resemblance is not given by the resemblance alone but requires dates, contexts, differences and documented connections (C002); motif similarity alone cannot underwrite lost-civilisation claims about identity, date or capabilities (C035); a catalogue distribution of broad classes is compatible with both independent invention and very old transmission and therefore cannot discriminate (C026); the three handled forms on Göbekli Tepe Pillar 43 have no secure functional identification according to the excavation team itself (C012, E028); the bundle of the three broad motif classes does not stand out in the catalogue experiment’s own documentation-preserving comparisons (C057); stories demonstrably converge through translation, borrowing and comparative writing (C034); and the excavators regard any survival of Early Neolithic imagery into later Near Eastern objects as unestablished precisely because of missing intermediate links (C072, E061–E062). These points collectively strip the shared-past reading of any automatic warrant from the images and stories as currently presented. Parallel observations that could have tipped the balance toward transmission—secure wear evidence that the Jiroft chlorite object hung on a cord (C009, abstract-only), relative dating that the Hoa Hakananai‘a birdman reliefs post-date the statue (C059), or the fish-body description of Berossus’s Oannes aligning with apkallu iconography (C053)—remain either provisional, single-specimen, secondary or confined to one region and therefore do not bridge the geographic and temporal gaps. Self-reported frequencies from the founder’s unaudited catalogue and lineup pilots (55 % bird-person, 37 % cosmic-serpent, 62.5 % first-rank civiliser pairs) supply weak numerical colour but no independent replication or raw data, and the image pilots themselves recorded strong inter-judge disagreement and sensitivity to object-kind matching. Flood-coding and navel-name claims largely lack retrieved primary evidence. The net result is that the ledger leaves the quantitative “how much” question exactly where the founding pages placed it: open. No record supplies a dated chain of intermediates that would convert resemblance into transmission; no record falsifies the possibility of sparse deep connections either. The case therefore remains unresolved on the featured hypothesis. Sensitivity is highest to E028 (the team’s explicit refusal of a final meaning for the Pillar 43 forms): without it the handled-object comparison would regain a speculative Göbekli leg, yet the verdict would survive because C002, C026, C035, C057 and C072 still block any strong shared-past inference from the remaining corpus. Prior archaeological knowledge of convergent symbolism and the well-attested mechanisms of literary convergence calibrate plausibility but are not required for the ledger-internal conclusion.
  steelman: >-
    The V1 civiliser lineup’s 62.5 % first-rank rate for claimed partner figures (versus 9 % for random pairs), if it survives a human re-test on uncompressed primary passages, would remain an unexplained quantitative clustering of the “brings-the-arts-and-departs” template across Mesopotamia, Mesoamerica and the Andes that neither missing-link cautions nor retelling mechanisms currently dissolve.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a definitional standard of historical method: no visual resemblance receives a transmission or common-source explanation without independent control of chronology, find context, formal differences and possible contact routes. No evidence record disputes it; the strongest opposing consideration would be a demonstration that pure formal similarity is somehow self-authenticating, but none is offered and the claim’s own truth condition is satisfied by ordinary archaeological practice.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only records are the founder’s own self-report that the three-class bundle “does not stand out” against documentation-preserving comparisons, accompanied by explicit caveats on uneven catalogue coverage (E018, E019). The result is therefore an unaudited internal finding whose data and code are not in hand; the strongest opposing consideration is that a different coding or a fuller Near-Eastern sample might reverse the non-distinctiveness.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Support consists solely of the founder’s self-report of the V1 AI lineup percentages (E020, E021). Run-level data, incomplete-lineup counts and prompt texts are unrecovered, so the figures remain an interested-party claim; the strongest opposing consideration is that human raters on primary (uncompressed) passages could erase the 62.5 % versus 9 % gap, exactly the limitation the research agenda itself flags.
  - claimId: DEEP-C034
    verdict: established
    confidence: high
    reasoning: >-
      Documented literary history supplies abundant instances in which translation, borrowing and comparative redaction increase surface similarity relative to earlier attested versions (Bible flood recensions, classical ethnographic summaries, modern popular retellings). No ledger record contradicts the mechanism; the strongest opposing consideration would be a corpus in which later versions systematically diverge rather than converge, but that is not the observed pattern for the civiliser and flood templates under discussion.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Lost-civilisation claims add determinate assertions about a source’s identity, absolute date and technological repertoire; motif resemblance supplies none of those data. The claim is therefore true by the ordinary burden of proof in historical argument. The strongest opposing consideration is an argument that certain highly specific trait bundles are so improbable under independent invention that they compel the stronger source claims, yet no such quantified improbability is present in the records.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A static geographic scatter of a broadly defined motif is, under standard phylogeographic models, compatible with either deep vertical transmission or repeated independent invention; discrimination requires dated intermediates or demonstrable contact. E061–E062 (excavators’ “missing links”) illustrate the point for the Near East. The strongest opposing consideration would be a formal model showing that the observed distribution is vanishingly unlikely under independence, but none is supplied.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim restates the founder’s catalogue summary that the three broad classes are each widespread; the only records are the same self-report and its coverage caveats (E018, E019). Without the underlying Berezkin–Duvakin coding or an independent tally the numerical assertion remains thin; the strongest opposing consideration is that “widespread” may be an artefact of the catalogue’s own sampling frame.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Support is the founder’s unaudited statement that a broad bird-person class occurs in 55 % of 926 traditions (E013–E015), qualified by uneven coverage. Raw counts and coding rules are absent, so the figure functions only as a self-reported baseline; the strongest opposing consideration is that a re-coding with stricter morphological criteria would lower the percentage substantially.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Identical footing to C005: founder self-report of a 37 % cosmic-serpent class (E016–E017) plus coverage caveats. No independent verification exists in the ledger; the strongest opposing consideration is the same risk of category inflation under broad narrative coding.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The claim asserts that the label “bird-man” conflates at least three distinct iconographic ideas. No evidence record supplies a systematic typology of the compared images that would confirm or refute the partition; the founder’s caption is hypothesis material, not evidence. The strongest opposing consideration is that a single underlying transformative concept could still unify the three surface types.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract states that komari were added after manufacture and that bas-reliefs (interpreted as birdman myth) succeeded the komari (E068, E069), establishing the relative sequence statue → later carvings. Absolute dates and the full survey reasoning remain paywalled; the strongest opposing consideration is that the abstract’s sequence could be overturned by the unread body or by British Museum conservation records.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape similarity and functional identity are logically independent variables; an object may share outline with a known bucket yet serve a different purpose, and vice versa. The claim is therefore true on methodological grounds alone. The strongest opposing consideration would be a demonstration that form rigidly determines function across the compared cultures, which the records do not supply.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole record is a second-hand blog transcription of Wiggermann 1992 stating that the banduddû was filled with water and used to sprinkle (E055). The printed page is unread and the cone/purifier half of the claim is not in the transcribed text; the strongest opposing consideration is simple transcription or contextual error in the blog intermediary.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Dietrich 2016 (excavation-team blog) explicitly closes the discussion of the three forms with the statement that “a final decision on the meaning of these images” is not possible (E028). Schmidt 2006 describes shape only (“box-like \ldots handle-like”) without function (E025). The strongest opposing consideration is a later team monograph that might have settled the reading, but no such superseding text is in the ledger.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Vidale & Micheli abstract reports wear traces on the handle and contour and reads them as long suspension on a cord (E035), matching the claim’s truth condition at abstract level; the authors immediately limit the inference to a single object (E038). Body text unread; the strongest opposing consideration is that the full wear analysis might weaken or withdraw the cord-hanging reading.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Dietrich’s 2016 comment-thread reply states there are “far to many ‘missing links’” to be sure of survival or of changes in meaning (E061, E062). The statement is informal yet comes from a team member; the strongest opposing consideration is that a subsequent formal publication may have identified intermediates the 2016 remark still lacked.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The four “navel” expressions demonstrably differ in language family, date of first written attestation and whether any builder-period use is documented; the claim’s truth condition is therefore met by ordinary source criticism even without the full primary dossier. No record contradicts the differentiation; the strongest opposing consideration is an early Rapanui or Andean attestation that would collapse one of the distinctions.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      The founder page asserts that the modern Turkish name describes mound shape, but no toponymic primary, excavation report or linguistic source is retrieved to confirm the etymology or its descriptive (versus sacred) force. E024 addresses only the Kurdish names. The strongest opposing consideration is simply the absence of any verifying record.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Material constraint is a well-attested sculptural economy: limbs carved in relief against the block are mechanically less prone to breakage than fully undercut limbs. The claim asserts only plausibility as a contributor, not exclusivity of meaning. No record contradicts the mechanical point; the strongest opposing consideration is ethnographic or workshop evidence that the pose was chosen purely for symbolic reasons in the relevant traditions.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Berossus F1 describes Oannes with a fish body, human head beneath and human feet (E043), and states the form was preserved in sculpture (E044); Verbrugghe & Wickersham’s table aligns Oannes with U-An of the apkallu list (E079). The correspondence is therefore the standard scholarly one, yet remains secondary until the tablet edition and iconographic corpora are read. The strongest opposing consideration is that the sculptural type Berossus had in mind may not be the fish-cloak apkallu of first-millennium reliefs.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No pre-modern source naming the Gate of the Sun staff-bearer as Viracocha is present in the ledger, nor is any modern historiography that would confirm the identification’s recency. The founder caption is the sole anchor. The strongest opposing consideration is an unnoticed colonial-period text that already used the name for that figure.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim reports regional clustering in a 263-summary flood-coding pilot, but no coded data, distance matrix or statistical output appears among the evidence records—only the founder’s narrative summary. Without the underlying table the result cannot be assessed; the strongest opposing consideration is that an alternative distance metric or coding scheme would erase the regional signal.
  - claimId: DEEP-C054
