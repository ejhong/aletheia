  synthesis: >-
    The featured hypothesis is taken to be that the cross-cultural resemblances assembled under “Deep Memory” substantially reflect inheritance, contact, or another common historical source rather than convergence, broad motif prevalence, or later retelling. On the supplied evidence, that hypothesis remains unresolved. There is a positive signal worth retaining: the founder reports that claimed civiliser partners ranked first in 62.5% of completed AI lineups versus 9% for random pairs. The founder also reports substantial frequencies for broad bird-person and cosmic-serpent classes. These observations make it unreasonable simply to deny that recurring patterns exist. However, all of those quantitative results are unaudited self-reports without the run data, coding rules, missing-run accounting, or source-level texts needed to evaluate them. More importantly, recurrence of a broad category is not itself evidence of common descent.

    The strongest case against a common-source interpretation is structural rather than a direct falsification. The image pilot reportedly changes when controls are matched by object kind, showing that comparison-set construction can create or remove apparent distinctiveness. The excavation team says that the function of the Pillar 43 forms remains undecided, while the Assyrian object has a locally supported bucket-and-sprinkling interpretation. The Rapa Nui birdman reliefs are supported as additions later than the statue’s manufacture, and a team member says that too many intermediate links are missing to establish survival of Göbekli Tepe imagery into later Near Eastern material. These facts weaken attempts to treat similar silhouettes as already identified instances of one transmitted object or symbol. They do not demonstrate independent invention.

    Steelmanning the hypothesis, a real inherited package could survive unevenly, change meaning, and leave sparse archaeological intermediates. The reported civiliser-lineup contrast could also be an early indication that some narrative pairings contain more specific shared structure than generic hero stories. Steelmanning the alternatives, bird-human figures, serpents, bodily hand placement, containers, central-place metaphors, floods, and culture-bringing teachers all have broad cognitive, environmental, material, or literary routes to recurrence; the supplied records do not show that their conjunction exceeds appropriate baselines.

    The methodological claims about underdetermination are supported chiefly by inferential logic and general scientific background, which supplies a prior rather than direct case evidence. No record presents a dated transmission chain, a preregistered model comparison, or a replication using original passages and blinded human raters. Conversely, no record establishes that every detailed resemblance arose independently. The appropriate verdict is therefore unresolved, not as a neutral default but because the available positive measurements are weak and the stronger records establish local ambiguity and missing links rather than a decisive alternative history. The single record whose removal would most change the balance is DEEP-E020, the only record stating the 62.5% first-place result for claimed civiliser partners. Without it, the principal quantitative observation favoring non-random resemblance largely disappears, but the unresolved verdict survives because neither the remaining positive records nor the methodological cautions decide transmission versus convergence.
  steelman: >-
    The ledger never tests whether the fine-grained conjunction of specific bird-human morphology, handled-object geometry, hand placement, sacred-centre naming, and civiliser narrative sequence co-occurs more often than documentation-matched controls; broad motif categories could wash out a rare inherited package.
