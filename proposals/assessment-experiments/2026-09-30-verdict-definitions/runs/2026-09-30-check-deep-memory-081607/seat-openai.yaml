  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Translation, borrowing, and comparative writing are plausible convergence mechanisms, but no evidence record compares an earlier version with a demonstrably more similar later retelling. The layered preservation of Berossus supplies transmission context, not a measured convergence of detail. The strongest opposing consideration is the strong general scientific and literary prior that retellings can borrow from one another, but that prior does not satisfy the claim’s stated documentary test.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      A resemblance does not logically identify a source’s identity, date, or capabilities; those additional propositions require independent chronological, contextual, and mechanistic evidence. The records reinforce this distinction by showing uncertain function for the Pillar 43 forms and missing intermediate links. The strongest opposing consideration is that a sufficiently rare and structured resemblance could provide probabilistic evidence for a source, but it still could not establish all of the added lost-civilisation attributes by itself.
  - claimId: DEEP-C026
