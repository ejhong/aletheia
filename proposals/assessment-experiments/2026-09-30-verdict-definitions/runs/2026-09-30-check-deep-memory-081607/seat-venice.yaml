  synthesis: >-
    The featured hypothesis is the case's founding question: whether the cross-cultural resemblances (bird-men, handled objects, navel names, civilisers, floods) record a shared past or arise from independent invention, convergence and retelling. On this ledger the honest verdict is unresolved, and that is a substantive finding about the ledger's maturity, not a hedge. Of the twenty-five claims assessed, eleven carry no admitted evidence record at all, including every claim that would do real work on the central question: the catalogue bundle result (C056, C057), the flood pilot's regional clustering and Genesis-detail distribution (C031, C054), the source-history contrast among the four navel names (C018), the modern identification of the Tiwanaku staff-bearer (C028), and the methodological spade-work (C002, C026, C034, C035, C065). Steelmanning the transmission side: the only potentially positive signals — the bundle finding and the 62.5% civiliser lineup rate — are either unrecorded in evidence or rest entirely on the founder's self-reports of unaudited experiments whose data were never retrieved. Steelmanning the sceptical side: what the ledger does establish from primaries is narrow object-level fact — the Göbekli team's own refusal to identify the Pillar 43 forms (C012), the relative carving sequence on Hoa Hakananai'a (C059), the single-specimen Jiroft wear reading with its authors' caveat (C009) — none of which privileges a shared-source account, and the site's own experiments (kind-matched lineups changing results, unreliable AI judges) read as method warnings against taking resemblance at face value. Sensitivity: DEEP-E028 is the ledger's only strong-support record; removing it would demote C012 to unsupported and leave the ledger with no strong evidence at all, but the case verdict remains unresolved either way — no single record, and no combination, currently discriminates transmission from convergence. The decisive futures are the unretrieved data behind C057, C027, C031 and C054, and the team's full run of Pillar 43 statements (DEEP-R005).
  steelman: >-
    The excavation team itself concedes, in a published reply, that there are "far too many 'missing links'" to rule out survival of Göbekli Tepe imagery into later Near Eastern objects, and the founder's V1 lineup experiment reports claimed civiliser partners ranking first in 62.5% of completed lineups against 9% for random pairs. If that lineup result survives the source-level, human-rater rerun the ledger itself proposes (DEEP-R003), it would be a structured, quantitative cross-continental correspondence of narrative form — arrival from water, bringing the arts, departure — that this assessment, resting on self-reports it cannot check, has no admitted evidence to explain away; and the absence of documented intermediates, which I treat as non-evidence, is precisely what a proponent would read as an eroded record rather than an absent chain.
claimAssessments:
  - claimId: DEEP-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger bears on this methodological claim; it exists only as an assertion of the founder's page, which the source rules count at most as weak context. The claim is near-analytic in ordinary historiographic practice, but that calibration is a prior, not ledger evidence. The strongest opposing consideration is that no case in the ledger yet demonstrates the claim's application, so even its framing is untested here.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim is the single most load-bearing potential result in the case — a documented failure of the motif bundle to stand out — yet no evidence record reports or reproduces the comparison; the only records touching it (DEEP-E018, DEEP-E019) are the author's own coverage and category caveats, which qualify rather than support. The strongest opposing consideration is that a self-described limitation ("broad narrative categories are not the specific images") suggests the comparison's design may not be able to deliver a decisive result even if the data were in hand.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 record the 62.5% and 9% figures, but both are flagged as self-reports of the site's own AI lineup experiment with run data not retrieved, and "completed lineups" implies unenumerated incomplete runs. The strongest opposing consideration is that the comparison texts may be modern compressed retellings, which the ledger's own research agenda (DEEP-R003) concedes could manufacture the similarity the experiment measures.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim's truth condition — documented retellings showing convergence of detail — has no evidence record in the ledger; the Berossus records parented to it concern Oannes's content, not convergence between versions. The mechanism is familiar from manuscript history, but that is background calibration, not ledger evidence. The strongest opposing consideration is that nothing in the ledger yet shows the required before-and-after comparison of attested versions.
  - claimId: DEEP-C035
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on this methodological claim; it is the founder page's assertion that resemblance alone cannot fix a lost-civilisation source's identity, date and capabilities. As with DEEP-C002 the claim is plausible on general grounds, but that is a prior. The strongest opposing consideration is that no ledger record tests whether any added claim about a source has ever been established from resemblance, so the claim's scope is unexamined here.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record cites this claim directly; DEEP-E061 and DEEP-E062 support its child DEEP-C072, and the team's agnosticism about missing links is consistent with the claim, but consistency is not support. The strongest opposing consideration is that a sufficiently rich dated distribution could in principle separate the histories under specific models, so the "cannot by itself" holds only relative to stated models the ledger never supplies.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim restates a catalogue result ("the three broad motif classes are widespread") for which the ledger holds no supporting record; DEEP-E018 and DEEP-E019 only qualify the study's coverage and category reach. The strongest opposing consideration is the author's own note that the 2016 catalogue has uneven coverage, particularly for the ancient Near East and Rapa Nui, which is exactly where the case's key objects sit.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 record the 55% figure, but as self-reports of an unaudited experiment whose coded data and method page were never retrieved; DEEP-E015's direction was disputed by the second reader as a scoping statement rather than support. The strongest opposing consideration is the author's own coverage caveat (DEEP-E018), which narrows the figure's reach without any independent check of the proportion.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 records the 37% figure on the same self-report footing as DEEP-C005, with DEEP-E017 flagged as a scope qualifier rather than support for the number itself. The strongest opposing consideration is identical: the coded data are not in hand, and the page's own limitation on coverage applies with full force.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses the claim that 'bird-man' covers three distinct ideas; it is an interpretive taxonomy asserted by the founder's page. Its truth condition requires showing the compared images fall into different categories, which nothing in the ledger does. The strongest opposing consideration is that the ledger's Hoa Hakananai'a material (DEEP-E068–E072) treats its birdmen as one locally continuous tradition, so the taxonomy's diagnostic value is undemonstrated.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 record a peer-reviewed study's explicit relative sequence — statue made, komari subsequently added, bas-relief carvings succeeding them — which is exactly the claim's truth condition. The strongest opposing consideration is that the support is abstract-level, gives no absolute dates, and the paywalled body might qualify the reading; the confidence is therefore moderate rather than high.
  - claimId: DEEP-C065
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on the shape/function separation as a methodological point; the anchor quotes come from the founder page, and the retrieval that touched the handled objects (DEEP-E028, DEEP-E035, DEEP-E038) is linked to other claims. The strongest opposing consideration is that the ledger's own best evidence (the Vidale & Micheli wear reading) shows shape and function being inferred together for Jiroft, so the separation is a normative stance, not a demonstrated practice.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 records the ritual water-and-sprinkling use, but only through a secondhand blog transcription of Wiggermann 1992 with visibly garbled transliterations, and the cone/purifier half of the claim is absent from the transcribed text. The strongest opposing consideration is that the primary page has never been checked, so even the bucket half rests on an unverified transcription.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 records the excavation team's own published statement that "a final decision on the meaning of these images" is not possible, which directly satisfies the claim's truth condition, reinforced by Schmidt's 2006 description of shape only. The strongest opposing consideration is that this is a 2016/2017 blog snapshot — the team's response to Sweatman & Tsikritsis and later publications remain unread (DEEP-R005) — so the uncertainty may have been superseded.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the Vidale & Micheli abstract's reading of strong handle wear as long suspension on a cord, satisfying the claim's truth condition at abstract level, with DEEP-E038 recording the authors' own caveat that the inference rests on a single object and is "far from being granted". The strongest opposing considerations are that only the abstract was read, the cord inference was omitted from the first extracted sentence (DEEP-E034's direction was downgraded accordingly), and the object's identity with the photographed specimen is unconfirmed.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 record a team member's published reply that there are "far too many 'missing links'" to be sure of survival or of changes in meaning, meeting the claim's condition that a team member's published statement says so. The strongest opposing consideration is the source's informality — a comment-thread reply, not a formal publication — so the claim holds for the member's stated position but not necessarily for a formal team publication.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record touches any of the four names' source histories — DEEP-R002, the agenda item that would decide this, is open and no record was retrieved for omphalos, Garcilaso, Te Pito o te Henua or the Göbekli toponyms. The claim's truth condition requires documented differences on three specific points, none of which the ledger supplies. The strongest opposing consideration is that the claim is currently supported only by the founder's assertion, which the source rules cannot weigh as evidence.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses the Turkish name's descriptive vs sacred meaning; the only retrieved navel-theme record (DEEP-E024) concerns the Kurdish names and was itself flagged as unsourced. The truth condition requires a toponymic source documenting shape-descriptive usage, which is absent. The strongest opposing consideration is that the founder page gives no source at all for the etymology, so there is nothing to check the assertion against.
  - claimId: DEEP-C047
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger documents any carving-practice observation bearing on material constraints; the claim rests entirely on general mechanical plausibility, which is a prior and per the assessment rules cannot carry a positive verdict here. The strongest opposing consideration is that the one retrieved gesture detail (DEEP-E081: Urfa Man's hands grasping, not resting) shows pose variation that a pure constraint account does not predict.
  - claimId: DEEP-C053
    verdict: unresolved
    confidence: low
    reasoning: >-
      The records that initially carried this correspondence (DEEP-E075, DEEP-E076) were explicitly downgraded to context by reader acts, on the ground that Berossus's description says nothing about apkallu sages; the iconographic half (that the Assyrian fish-cloaked figure is the named type) has no retrieved record at all. The strongest opposing consideration is that standard Assyriology and the translators' own table (DEEP-E079, on the related claim) make the correspondence routine, so the unresolved verdict leans on the ledger's evidentiary gaps rather than on any counter-evidence — a prior-based hedge I flag openly.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on the Viracocha identification's modernity; the claim requires showing that no pre-modern source names the Gate of the Sun figure, a negative that nothing retrieved establishes. The founder page's assertion is the only trace. The strongest opposing consideration is that proving a universal negative across colonial and pre-colonial sources is exactly the kind of claim the ledger cannot accept on a caption.
  - claimId: DEEP-C031
