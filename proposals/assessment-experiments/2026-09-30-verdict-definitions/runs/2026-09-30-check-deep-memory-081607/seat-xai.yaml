  verdict: weakly_supported
  loadBearing: ["DEEP-C002", "DEEP-C035", "DEEP-C026", "DEEP-C012", "DEEP-C072", "DEEP-C065", "DEEP-C018", "DEEP-C057"]
  weakestLinks: ["DEEP-C005", "DEEP-C027", "DEEP-C031", "DEEP-C054", "DEEP-C037", "DEEP-C015", "DEEP-C028", "DEEP-C004"]
  synthesis: >-
    The featured hypothesis asks how much of the observed resemblances among bird-men, handled objects, navel names, feathered serpents, civilising teachers and flood stories across distant cultures records a shared past (common source, deep inheritance or long-distance contact) versus independent invention, material and cognitive convergence, or later retelling and comparative writing. The ledger's evidence records, weighed strictly, support only a weak contribution from any deep shared past for the specific motif set. Methodological claims that are load-bearing are well or provisionally established on their own terms and sharply limit what resemblance can prove: historical meaning of a visual match depends on dates, contexts, differences and possible connections rather than resemblance alone (C002); catalogue geography of a broad class cannot by itself separate independent invention from very old transmission (C026); similarity alone cannot underwrite a lost-civilisation account's added claims about source identity, date and capabilities (C035); shape and function of handled objects are separate questions (C065); and the four navel expressions are different kinds of evidence differing in language, first-record date and builder usage (C018). These are not prestige arguments; they are mechanisms and source-history distinctions that survive even if every image match is granted.
    On the observational side the strongest primary-adjacent records cut against secure transmission. The Göbekli Tepe team states that no final decision on the meaning of the three box-like forms with handle-like attachments on Pillar 43 is possible (E028 supporting C012) and that there are far too many missing links to be sure of survival or change of meaning into later Near Eastern imagery (E061/E062 supporting C072). Schmidt 2006 describes only shape (E025). The Jiroft chlorite object shows handle wear read as long cord suspension, but the authors themselves limit the inference to a single specimen (E035/E038 supporting C009 at abstract level only). Assyrian banduddû has ritual-bucket support via second-hand Wiggermann transcription (E055 for C044), yet that does not transfer function to the undecided Göbekli forms or the Olmec pouch. Hoa Hakananai'a birdman bas-reliefs post-date manufacture (E068/E069 for C059) and are read against nineteenth- and twentieth-century ethnohistoric myth, not a prehistoric shared template. Berossus F1 supplies a fish-bodied civiliser who teaches arts and whose form was preserved in sculpture, and translators align Oannes with U-An of the apkallu list (E043/E044/E046/E079), yet these remain Mesopotamian-internal; they do not bridge to Viracocha, Quetzalcoatl or Bochica, whose staff-bearer identification is flagged as modern with no pre-modern naming evidence in the ledger (C028 unresolved).
    The catalogue and pilot numbers (bird-person 55 percent, cosmic-serpent 37 percent, three-class bundle not standing out, civiliser partners first-ranked 62.5 percent versus 9 percent random, flood regional clustering, AI judge disagreement, kind-matching changing lineups) exist only as founder self-reports of unaudited experiments whose underlying data, code and full methods are not in the ledger (E013–E022 and related). They therefore supply at most weak support for their local statistical claims (C005, C025, C056, C057, C027, C031, C054, C037, C038) and cannot be treated as independent measurements. Even taken at face value the catalogue result that the three-class bundle does not stand out against documentation-preserving comparisons (C057) undercuts the idea of a privileged co-occurring deep package. Material constraint is a plausible contributor to hands-on-body poses (C047) without settling symbolism. Flood and civiliser details show the expected signatures of regional clustering and later literary shaping once coding and lineup designs are granted.
    Steelmanning the shared-past direction still leaves the positive case thin: no dated intermediate chain, no secure functional identity linking the handled forms, no builder-used navel name at Göbekli, no pre-modern Viracocha label on the Gate of the Sun, and no retrieved primary that converts visual resemblance into shared sound, meaning or descent. Independent invention plus later convergence through translation, borrowing and comparative writing (C034) plus ordinary material and cognitive biases remain sufficient for the observed pattern. The ledger therefore warrants only weak support for a substantial deep-shared-past contribution; the bulk of the resemblance is presently better attributed to the other mechanisms the founding question itself enumerates. The verdict is sensitive to the team statements on Pillar 43 function and missing links; if those were absent the case would tilt further toward unresolved rather than weakly_supported, but the methodological constraints and the absence of positive transmission evidence would remain.
  steelman: >-
    The V1 civiliser lineup self-report that claimed partner figures ranked first in 62.5 percent of completed lineups against 9 percent for random pairs, which—if the underlying passages and ranking procedure survive independent re-implementation with human raters and source-level texts—would remain an unexplained excess similarity among the civilising-teacher narratives that no pure independent-invention or late-retelling model in the present ledger fully absorbs without additional ad-hoc shared-template assumptions.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a core principle of historical and archaeological inference: a visual match receives historical meaning only once dates, contexts, differences and possible connection routes are supplied. No evidence record contradicts it; every primary-adjacent record in the ledger (Schmidt descriptions limited to shape, team refusal of secure function, wear limited to one object, missing-links statements) illustrates exactly this dependence. The strongest opposing consideration would be a demonstration that pure formal resemblance can itself compel a unique historical source, but no such demonstration appears in the records.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The sole support is the founder's self-report that the three-class bundle does not stand out against the study's documentation-preserving comparisons, qualified by the same page's notes on uneven catalogue coverage (E018, E019). Underlying coded data and comparison procedure are not retrieved, so the numeric or statistical claim remains unaudited. The strongest opposing consideration is that an unaudited self-report cannot rule out that a different coding or a fuller Near-Eastern sample would make the bundle distinctive.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Support consists only of the founder's report of its own V1 AI lineup result (claimed partners first in 62.5 percent of completed lineups versus 9 percent random; E020, E021). Run-level data, prompt texts, incomplete-run handling and judge identity are absent. The strongest opposing consideration is that an unreplicated, partially incomplete AI lineup on compressed modern retellings may manufacture the very similarity it then measures.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The mechanism—translation, borrowing and comparative writing driving secondary convergence—is standard in textual history and is consistent with the layered transmission of Berossus (Polyhistor–Syncellus) and with the ethnohistoric dating of the Rapa Nui birdman myth used by Pitts et al. No ledger record supplies a concrete before-and-after pair of retellings that quantifies increased likeness, so the claim rests partly on general background. The strongest opposing consideration is that some comparative traditions demonstrably diverge rather than converge under the same processes.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      A lost-civilisation narrative adds identity, date and capability claims that resemblance data alone cannot supply; the claim simply records that logical gap. Every transmission-related record in the ledger (missing links, uncertain function, modern identifications) reinforces the gap. The strongest opposing consideration would be a resemblance so exact and so densely contextualised that it uniquely fixed source identity and date, but no such case is present.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      Broad-motif geography is compatible with both independent invention and deep transmission under ordinary models; the claim states that incompatibility is not shown by distribution alone. Catalogue self-reports and the excavators' missing-links comment (E061/E062) illustrate the point without resolving it. The strongest opposing consideration is a future high-resolution phylogeny or dated intermediate chain that would render the two histories distinguishable from geography plus time, but that chain is explicitly absent here.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim restates the founder's report that the three broad classes are each widespread, accompanied by coverage caveats (E018, E019). No independent tabulation of the 926-tradition sample is in the ledger. The strongest opposing consideration is that "widespread" may be an artefact of the catalogue's known unevenness, especially for the ancient Near East and Rapa Nui.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only the founder's unaudited statement that the broad bird-person class occurs in 55 percent of 926 traditions is on record (E013–E015), further scoped by the page's own limitations on what the figure cannot show. Data and coding protocol are missing. The strongest opposing consideration is that a different motif definition or a coverage-corrected sample would yield a materially different percentage.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Parallel to C005: the 37 percent cosmic-serpent figure is a founder self-report (E016, E017) with the same coverage and category-scope qualifications. No raw counts appear. The strongest opposing consideration is identical—unexamined coding and sampling decisions may drive the number.
  - claimId: DEEP-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is an interpretive distinction (deity with bird head versus feathered person versus transforming person) offered by the founder; no systematic coding of the compared images into these three bins is supplied in the evidence records. It is plausible on general iconographic grounds but untested here. The strongest opposing consideration is that some compared images may intentionally fuse the three ideas into a single concept, collapsing the claimed distinctness.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract states that komari were subsequently added after the statue's making and that bas-relief carvings succeeded the komari (E068, E069), establishing the relative order manufacture then birdman carvings. Absolute dates and the full survey reasoning remain paywalled. The strongest opposing consideration is that the abstract's relative sequence could be revised by the unread body or by later direct dating of the relief surfaces.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape can be described independently of function; the claim is definitional and is instantiated by every handled-object record (Schmidt's box-like/handle-like description without function, team refusal of final meaning decision, Jiroft wear reading limited to one object, Assyrian bucket identified via ritual texts). The strongest opposing consideration would be a context in which form uniquely determines function with no remainder, but the ledger supplies none.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      A second-hand transcription of Wiggermann 1992 states that banduddû denotes the bucket held by relief figures and that in rituals it was filled with water and used to sprinkle (E055, E086). The cone/purifier half is weaker and the transcription is unchecked against the printed page. The strongest opposing consideration is that the blog transcription may garble the passage or that the full ritual context assigns the bucket additional or alternative roles.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The excavation team's own 2016/2017 post states that a final decision on the meaning of the three images is not possible at the moment (E028); Schmidt 2006 describes only box-like objects with handle-like attachments (E025). No later team monograph reversing that agnosticism is in the ledger. The strongest opposing consideration is an unread post-2017 team publication that might commit to a container or building reading.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Vidale & Micheli abstract reports wear traces on the handle and contour and explicitly reads the strong wear as evidence the hand-bag was suspended for a long time on a cord (E035), with the authors' own single-object caveat (E038). Body of the paper unread; object identity with the photographed specimen not proven from the abstract alone. The strongest opposing consideration is that the full wear analysis or a larger sample would weaken or redirect the cord-suspension inference.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Team member Oliver Dietrich's comment-thread reply states there are far too many missing links to be sure about survival of Early Neolithic imagery into later periods and that possible changes in meaning cannot yet be assessed (E061, E062). The statement is informal but authorial. The strongest opposing consideration is that a formal monograph or the unread response to Sweatman & Tsikritsis might document specific intermediates the comment overlooks.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The four names demonstrably differ in language family, earliest textual attestation horizon and whether any ancient builder is known to have used the navel designation; the claim records those source-history differences. Primary toponymic and lexical retrievals remain open (research agenda R002), so the assessment leans on the founder's framing plus ordinary knowledge of the source languages and dates. The strongest opposing consideration is discovery that one or more of the names was in fact used by the monument builders in a sacred sense at a shared early date.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      The founder page asserts the Turkish name describes the mound's shape, but no Turkish toponymic source, excavation report or dictionary entry is among the evidence records; the only related record concerns the Kurdish "wish hill" gloss (E024). Without a primary attestation the descriptive-versus-sacred status cannot be graded. The strongest opposing consideration is that the name may carry an older sacred navel connotation later folk-etymologised as shape.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Carving limbs against the stone body is a known practical solution to breakage risk in freestanding sculpture; the claim only asserts that this material constraint is a plausible contributor to the hands-on-body pose, not that it exhausts meaning. No counter-example forcing a purely symbolic reading appears in the ledger. The strongest opposing consideration is ethnographic or textual evidence that the pose was chosen for symbolic reasons even when freer carving was technically feasible.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Berossus F1 describes a fish-bodied, human-headed and human-footed being whose form was preserved in sculpture and who taught the arts of civilisation (E043, E044, E046, E075, E076); translators' table aligns Oannes with U-An of the Uruk apkallu list (E079). The fish-cloak iconographic match and the textual name correspondence are therefore evidenced at secondary level, but the tablet edition itself and the Assur basin figures are not directly read. The strongest opposing consideration is that Berossus or his excerptors may have conflated distinct sage traditions or that the sculptural type he mentions is not the fish-cloaked apkallu.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      The founder states the Viracocha identification of the Gate of the Sun staff-bearer is modern, yet no pre-modern source corpus, colonial chronicle survey or negative result is present in the evidence records. Absence of evidence in the ledger is not evidence of absence of pre-modern naming. The strongest opposing consideration is an overlooked early colonial or indigenous text that already applies the name Viracocha to that specific figure.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim reports a regional-clustering result from the founder's own flood-text coding pilot of 263 summaries; no coded matrix, distance measure, or statistical output appears among the evidence records. Without the data the clustering cannot be confirmed or refuted. The strongest opposing consideration is that an alternative coding scheme or a different regional partition would erase the reported clusters.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      Parallel to C031: the uneven distribution of Genesis-associated details is asserted only in the founder page; the underlying coded summaries and the list of "Genesis-associated" features are not retrieved. The strongest opposing consideration is that the apparent unevenness is an artefact of how "Genesis-associated" was defined or of differential recording density in the summary corpus.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder reports that matching the kinds of objects changed the lineup result (E022); pilot data, control definitions and quantitative shift size are absent. The strongest opposing consideration is that the kind-matched control may itself have been incomplete or that judge instructions, not object kind, drove the change.
  - claimId: DEEP-C037
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder page characterises the image pilots as showing strong disagreement between AI judges and unreliable feature coding; no inter-rater agreement statistic, confusion matrix or raw judge-by-judge table is in the evidence records (and E022 explicitly does not bear on judge agreement). The strongest opposing consideration is that a different prompt regime or a human panel would produce substantially higher agreement on the same image pairs.