    reasoning: >-
      The reported 62.5% first-rank matching rate for claimed partner figures against a 9% random baseline relies entirely on the founder's unverified self-report (DEEP-E020, DEEP-E021). The underlying prompt protocols, raw lineup data, and the nature of omitted incomplete runs remain unretrieved and unaudited. Strongest opposing consideration: The reported sevenfold difference between claimed and random pairs represents a substantial effect size that would be difficult to produce purely by chance if the pilot was administered neutrally.
  - claimId: DEEP-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Drawing on an established prior in comparative folkloristics and text transmission, stories repeatedly converge in detail through syncretistic translation, interpretive borrowing, and harmonizing editorial traditions such as interpretatio graeca or colonial Christian re-recordings. However, within the ledger itself, no primary before-and-after textual case studies were retrieved or coded. Strongest opposing consideration: In oral transmission free from centralizing textual intermediaries, stories typically undergo divergent drift, elaboration, and entropy rather than phenotypic convergence.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      As a point of strict methodological logic, visual or narrative resemblance between motifs is epistemologically insufficient to substantiate specific empirical claims regarding an unattested mother culture's chronology, geographic origin, or technological capabilities. Demonstrating the reality of a lost civilising source requires physical material evidence, absolute dates, and stratigraphic chains that iconographic comparison cannot supply. Strongest opposing consideration: The argument that a highly specific constellation of advanced civilising arts appearing abruptly in disparate cultures logically necessitates an advanced ancestral source.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      As a matter of spatial and evolutionary logic, the global geographic distribution of an overarching motif class is equifinal: identical global distributions can emerge from universal cognitive tendencies and convergent invention as readily as from deep primordial migrations. Spatial presence alone cannot differentiate ancient diffusion from independent innovation without dated intermediate archaeological links across the intervening space. Strongest opposing consideration: Spatial phylogeographic models in historical linguistics and folklore that argue geographic clustering gradients can statistically distinguish demic diffusion from random convergent innovation.
