    reasoning: >-
      The 37% frequency of cosmic-serpent motifs is evidenced solely through self-reported statements on the founder's research site (DEEP-E016). The underlying database queries and analytical scripts were not provided in the ledger, and the catalogue suffers from acknowledged regional gaps (DEEP-E018). Strongest opposing consideration: The frequency is reported transparently as a bounded baseline figure derived from a recognized comparative folklore index.
  - claimId: DEEP-C004
    verdict: established
    confidence: high
    reasoning: >-
      Based on standard taxonomic principles in comparative iconography, the single colloquial label 'bird-man' conflates ontologically distinct concepts, including avian-headed anthropomorphic deities, costumed human ritual specialists or dancers, and mythological human-avian metamorphosis. Lumping these discrete categories together under one visual term creates an illusion of cross-cultural identity where diverse native meanings exist. Strongest opposing consideration: Emic ritual systems where the feathered dancer is believed to undergo genuine ontological transformation into the deity, functionally uniting all three categories in native belief.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: high
    reasoning: >-
      A peer-reviewed photogrammetric survey of Hoa Hakananai'a by Pitts et al. (2014) confirms that the petroglyphs and bas-relief birdman carvings on the statue's back are secondary additions carved centuries after the original monolithic figure was manufactured (DEEP-E068, DEEP-E069). This stratigraphic sequence severs the visual motifs from the statue's primary construction horizon. Strongest opposing consideration: The evidence is drawn from the study's abstract, as the full paywalled monograph detailing the micro-stratigraphy of the stone surface was not retrieved.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      As an elementary tenet of material culture analysis, the geometric shape of an artifact does not determine its cultural function or symbolic meaning. An arched handle atop a rectangular body can represent a ritual libation bucket in Mesopotamia, a suspended balance weight in Iran, or an architectural sanctuary facade in Anatolia. Strongest opposing consideration: Extreme functionalist design constraints where certain ergonomic forms are argued to have evolved strictly for a single practical task across all human societies.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Textual evidence transcribed from Wiggermann (1992) establishes that in Assyrian ritual incantations, the banduddû bucket was filled with water and used by exorcists to sprinkle and purify the patient (DEEP-E055). However, the record derives from an unverified personal blog transcription rather than the original printed volume, and the purification cone is not directly attested in the excerpt. Strongest opposing consideration: The secondary transcription suffers from visible typographical errors and lacks direct verification against the primary cuneiform text edition.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The official excavation team has explicitly published that a secure functional or symbolic identification of the three arched forms on Pillar 43 remains impossible and speculative (DEEP-E028). The excavators describe them neutrally as box-like objects with handle-like attachments or hypothetical architectural models, confirming that their function is unestablished. Strongest opposing consideration: Competing independent researchers have claimed definitive symbolic or archaeoastronomical solutions, though these have not been endorsed by the excavation project.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The published wear-trace analysis by Vidale & Micheli (2012) directly reports that microscopic wear along the handle of the Jiroft chlorite 'handbag' in Tehran is consistent with prolonged suspension on a cord (DEEP-E035). However, support is provisional because only the abstract was retrieved, and the authors explicitly emphasize that the inference is based on a single examined specimen and remains unverified for the wider corpus (DEEP-E038). Strongest opposing consideration: The authors themselves caution that the cord-suspension inference rests on a unique artifact and cannot be assumed for all intercultural-style chlorite objects.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Excavation team member Oliver Dietrich explicitly stated in project communications that there are far too many missing intermediate links in the archaeological record to confirm the survival or transmission of Göbekli Tepe's imagery into later Near Eastern civilizations (DEEP-E061, DEEP-E062). The excavation team formally treats claims of long-term iconographic survival as unproven. Strongest opposing consideration: The statement was recorded in a blog comment reply rather than in a peer-reviewed synthesis of regional Neolithic continuity.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      Historical and linguistic documentation demonstrates that the Greek omphalos, Garcilaso de la Vega's gloss of Cusco, the Rapanui name Te Pito o te Henua, and the modern Turkish toponym Göbekli Tepe represent fundamentally distinct evidentiary classes. They stem from unrelated language families, are separated by thousands of years in their first recorded attestations, and differ entirely in whether they reflect original builder usage or late exonymic descriptions. Strongest opposing consideration: The counter-hypothesis that disparate linguistic traditions all independently preserve an unbroken memory of a primordial geographic designation.
  - claimId: DEEP-C015
