  - claimId: DEEP-C047
    verdict: established
    confidence: high
    reasoning: >-
      Biomechanical and sculptural physics dictate that carving extended or freestanding limbs from monolithic stone exposes the material to acute tensile stress and catastrophic fracture along bedding planes. Carving hands and arms in relief directly flush against the torso minimizes cantilever breakage during extraction, transport, and carving, making material constraints an obvious contributor to the pose across unrelated traditions. Strongest opposing consideration: Elite sculptural traditions in hard stone frequently executed complex negative space and extended limbs when ritual or artistic imperatives demanded it.
