  synthesis: >-
    For this roll-up, the featured hypothesis is the substantive shared-past
    proposition: that ancient transmission or a common source explains a
    meaningful part of the cross-cultural pattern, rather than merely the
    proposition that the pictured objects and stories resemble one another.
    The records provide a real but weak positive case. The reported civiliser
    lineup is the clearest quantitative signal: DEEP-E020 and DEEP-E021 say
    claimed partners ranked first in 62.5% of completed lineups against 9% for
    random pairs. DEEP-E013, DEEP-E014 and DEEP-E016 report widespread broad
    bird-person and cosmic-serpent classes. Local records also confirm genuine
    ingredients behind some comparisons: DEEP-E025 describes handle-like forms
    on Pillar 43, DEEP-E035 reports cord-suspension wear on one chlorite object,
    and the Berossus records preserve a fish-bodied civilising figure and a
    claim that his form survived in sculpture. Steelmanned, these observations
    justify testing whether a structured package of unusually specific motifs
    recurs more often than independent invention predicts.

    They do not yet establish that historical explanation. The catalogue
    numbers and lineup rates are self-reports whose data and analysis were not
    retrieved. DEEP-E018 and DEEP-E019 say catalogue coverage is uneven and
    that broad narrative categories are not the specific images or names at
    issue. Most importantly, no evidence record actually supplies the result
    asserted in DEEP-C057 that the three-motif bundle fails to stand out, so
    that potentially decisive analysis remains unresolved rather than negative.
    Conversely, no record shows that a tightly specified bundle does stand out.
    DEEP-E022 reports that kind-matched controls changed an image-lineup result,
    showing that control construction can generate or remove apparent
    resemblance. DEEP-E028 leaves the function of the Pillar 43 forms
    unidentified, while DEEP-E068 and DEEP-E069 establish that the Rapa Nui
    birdman reliefs were later additions to the statue. These local facts
    matter because resemblance between a known ritual bucket, an unidentified
    relief form and a later carving is not identity of function, date or
    ancestry.

    The strongest case against the featured hypothesis is therefore not that
    transmission has been disproved, but that the records contain no dated
    chain of intermediates, no diagnostic shared innovation, no securely
    sourced package travelling together, and no model comparison that favors
    transmission over convergence. DEEP-E061 and DEEP-E062 directly record an
    excavation-team member's view that too many links are missing to establish
    survival of Göbekli Tepe imagery or continuity of meaning. The logical
    points assessed under DEEP-C002, DEEP-C026, DEEP-C035 and DEEP-C065 further
    limit what resemblance alone can identify. Still, the verdict is not
    contradicted: none of the records measures the transmission hypothesis and
    rejects it, and the reported lineup signal supplies a small positive lean.
    “Weakly supported” therefore fits better than unresolved or contradicted:
    an empirical argument has been offered, but interested self-report,
    category breadth, control sensitivity and absent historical links prevent
    it from carrying the causal conclusion.

    The single evidence record whose removal would most change this case
    verdict is DEEP-E020, because it contains the positive 62.5% claimed-partner
    result; DEEP-E021 alone gives only the random comparator. The
    weakly_supported verdict survives without DEEP-E020, since the remaining
    records still document suggestive motif resemblances and broad recurrence,
    but the positive case becomes markedly thinner and approaches unresolved.
  steelman: >-
    The ledger never tests the strongest transmission prediction: whether a
    preregistered, tightly specified conjunction of bird-human form, handled
    object, hand placement, serpent attributes and sacred-centre language
    recurs above matched archaeological and ethnographic controls in securely
    dated sources, with the recurrence ordered along plausible contact routes.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      DEEP-E022 shows that matching object kinds changed a lineup result, while
      DEEP-E018 and DEEP-E019 show that coverage and category specificity alter
      what a catalogue resemblance can mean. DEEP-E025 and DEEP-E028 also
      illustrate that a recognizable shape need not determine function.
      The strongest opposing consideration is that an exceptionally rare,
      complex resemblance can itself be probabilistically diagnostic, but it
      still cannot receive a unique historical explanation without contextual
      and chronological information.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: high
    reasoning: >-
      DEEP-E018 and DEEP-E019 only qualify catalogue coverage and distinguish
      broad categories from the specific motifs; neither reports the
      documentation-preserving comparison or its result. No evidence record
      states that the three-class bundle failed to stand out. The strongest
      consideration against leaving the claim unresolved is the founding
      page's assertion, but the underlying data and analysis are absent and a
      source anchor is not an evidence record.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the 62.5% and 9% rates, but they
      are two parts of one interested party's self-report rather than
      independent evidence. The run data, number of incomplete lineups and
      analytical details were not retrieved. The strongest opposing
      consideration is that exclusions among “completed lineups” and choices
      of passages or controls could materially alter both rates.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record presents a retelling and an earlier attested version
      whose details can be compared, so the claim's stated empirical test has
      not been performed in this ledger. A general philological prior makes
      convergence through translation and borrowing plausible, but the verdict
      does not treat that prior as documented case evidence. The strongest
      opposing consideration to an unresolved verdict is that the proposed
      mechanism is commonplace in principle; what remains missing is a
      qualifying example from the records.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      The claim follows from informational underdetermination: resemblance does
      not encode a source's identity, date or capabilities. DEEP-E019
      illustrates the gap between broad categories and specific claims, while
      DEEP-E061 records the absence of the links needed to infer historical
      continuity in the local example. The strongest opposing consideration is
      that a highly distinctive resemblance could strongly favor transmission,
      but even that would not by itself identify and date a lost civilisation
      or establish its capabilities.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A geographical distribution can be generated under both diffusion and
      repeated independent invention unless additional model assumptions or
      discriminating observations are supplied. DEEP-E061 and DEEP-E062 record
      the missing intermediates and possible changes of meaning in the
      Göbekli-to-later-Near-East example, while DEEP-E018 identifies uneven
      coverage as another source of ambiguity. The strongest opposing
      consideration is that a formally specified distribution containing
      directional gradients or dated serial dependencies could discriminate
      between models, but that would add information beyond an unmodelled
      distribution by itself.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 report a 55% bird-person frequency, and
      DEEP-E016 reports a 37% cosmic-serpent frequency, which weakly supports
      two of the three components. No evidence record supplies the
      sacred-centre frequency, and all reported figures come from the site's
      unaudited experiment. The strongest opposing consideration is
      DEEP-E018's uneven-coverage warning, together with the missing result for
      the third motif class.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 report the exact 55% of 926 result, but both are
      parts of the founder's self-report and the coded catalogue was not
      retrieved. DEEP-E015 does not test the percentage, while DEEP-E018 and
      DEEP-E019 limit its coverage and interpretive scope. The strongest
      opposing consideration is that neither the coding decisions nor the
      denominator can be independently reproduced from the records.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 reports the exact 37% figure, but it is an unaudited self-report
      of the site's own catalogue analysis. DEEP-E017 narrows the result to the
      selected category and dataset, and DEEP-E018 and DEEP-E019 add coverage
      and category-specificity limitations. The strongest opposing
      consideration is the absence of the coded data and method needed to
      reproduce the percentage.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record classifies the compared images as bird-headed deities,
      feather-wearing people or people transforming into birds. The categories
      are conceptually distinguishable, but the empirical part of the claim
      requires showing that the actual images occupy different categories.
      The strongest opposing consideration is that an iconographic tradition
      can intentionally merge deity, costume and transformation, so even the
      proposed classification may not be exclusive.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the published relative sequence in which
      komari were added after the statue's making and the birdman bas-reliefs
      succeeded them. That directly places the birdman composition later than
      manufacture, but both records derive from one paper's abstract and do
      not expose the survey's reasoning. The strongest opposing consideration
      is that only the abstract was read and it supplies no absolute dates.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically distinct properties, and the records
      demonstrate the distinction rather than merely asserting it.
      DEEP-E025 describes the Pillar 43 forms as box-like and handle-like,
      whereas DEEP-E028 says their meaning cannot presently be decided;
      DEEP-E055 separately gives a ritual use for the Assyrian bucket. The
      strongest opposing consideration is that shape can constrain or suggest
      function, but suggestion is not identity between the two questions.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 reports ritual instructions in which the banduddû contains
      water that is consecrated and sprinkled over a person, supporting a
      ritual-bucket interpretation. The passage is available only through an
      unchecked personal-blog transcription of Wiggermann, and the record
      expressly says the cone or purifier half is not present in the
      transcribed text. That incomplete and secondhand support is the strongest
      opposing consideration to accepting the full bucket-and-purifier claim.
  - claimId: DEEP-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 directly quotes an excavation-team publication saying a final
      decision on the forms' meaning was not possible at that time. DEEP-E025
      independently supplies a shape description without assigning a function,
      which is consistent with the uncertainty claim. The strongest opposing
      consideration is that the decisive statement is a 2016/2017 team blog
      post and later team publications were not checked.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 directly reports the authors' abstract-level inference that the
      object was suspended for a long time on a cord, and DEEP-E034 confirms
      wear on the handle and contour. DEEP-E038 limits the inference to one
      specimen but does not contradict this specimen-specific claim. The
      strongest opposing consideration is that only the abstract was read and
      the authors themselves describe the inference as far from assured.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E061 directly records an excavation-team member saying there were
      too many missing links to be sure how far the imagery survived, and
      DEEP-E062 adds uncertainty about changes in meaning. These records match
      the claim closely but come from two parts of one informal comment-thread
      reply. The strongest opposing consideration is that one member's comment
      may not establish a formal or enduring position of the full excavation
      team.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record provides the language, first-attestation date and
      builder-usage history for all four names. DEEP-E024 concerns only the
      asserted meaning of Kurdish names and does not establish any of the
      required comparisons. The strongest opposing consideration to leaving
      the claim unresolved is the general likelihood that ancient Greek,
      colonial-era Andean, Rapanui and modern Turkish attestations have
      different source histories, but that is a prior rather than ledger
      evidence.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record addresses whether the Turkish name Göbekli Tepe was
      coined descriptively from the mound's shape rather than carrying a sacred
      designation. DEEP-E024 bears on Kurdish names only and cannot substitute
      for Turkish toponymic evidence. The strongest opposing consideration is
      the plausible descriptive reading of a bodily-shape term, but no
      retrieved source documents the naming history.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The verdict rests on a general mechanical prior rather than a dedicated
      evidence record: keeping projecting limbs against a stone body reduces
      unsupported sections and is therefore a plausible design contributor.
      The claim says “plausible contributor,” not sole cause or demonstrated
      intention, so this basic material mechanism is sufficient for provisional
      support. The strongest opposing consideration is that no comparative
      breakage, production or pose study in the records shows that sculptors
      actually selected the gesture for this reason.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E075 gives the fish-bodied, human-headed description of Oannes, and
      DEEP-E079 separately reports a scholarly table aligning Oannes with U-An,
      first in an apkallu list. DEEP-E076 adds that Oannes's form was said to
      survive in sculpture, but none of these records identifies the specific
      Assyrian fish-cloaked image as that named sage type. The strongest
      opposing consideration is this missing iconographic link, leaving an
      incomplete correspondence assembled from secondary correlations.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record examines when the Gate of the Sun figure first came to
      be called Viracocha or whether any pre-modern source makes that
      identification. The claim's negative truth condition requires a source
      history, not merely the existence of a modern label. The strongest
      opposing consideration is that widespread modern attribution could
      preserve an older identification, a possibility the present records
      neither support nor exclude.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record supplies the 263 coded summaries, a clustering
      statistic, a regional null model or even the reported clustering result.
      The research materials describe a pilot but are not evidence records.
      The strongest opposing consideration to an unresolved verdict is the
      founder's reported conclusion, but without the coded data or measure it
      cannot establish regional clustering.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record reports which details were coded as associated with
      Genesis or how their distribution was tested for unevenness. Neither a
      table nor a summary statistic is present. The strongest opposing
      consideration to leaving the claim unresolved is the source anchor's
      assertion of unevenness, but that assertion was not entered as usable
      evidence and cannot be reproduced.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 directly reports that kind-matching changed the lineup result,
      but it is a self-report from the site's own pilot and the data were not
      retrieved. The page's noted incomplete runs and cropping further limit
      interpretation. The strongest opposing consideration is that “changed”
      is unquantified, so the record does not reveal the effect's size,
      direction or stability.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record provides inter-judge agreement statistics or even a
      direct evidentiary statement about disagreement; DEEP-E022 concerns
      control matching rather than agreement. The founding source's wording
      cannot replace the absent pilot results. The strongest opposing
      consideration to an unresolved verdict is the reported observation of
      strong disagreement, but it remains an unaudited assertion outside the
      evidence records.