caseAssessment:
  verdict: weakly_supported
  loadBearing: [DEEP-C027, DEEP-C035, DEEP-C026, DEEP-C057, DEEP-C072]
  weakestLinks: [DEEP-C057, DEEP-C056, DEEP-C037, DEEP-C031, DEEP-C054, DEEP-C028]
  synthesis: >-
    The ledger's strongest results are object-level, not pattern-level. The
    Pillar 43 function claim (DEEP-C012) is the best-supported item in the case:
    the excavation team's own published statement that no final decision on the
    three forms is possible (DEEP-E028), backed by Schmidt's shape-only first
    description (DEEP-E025), gives two lines from the authoritative side. The
    Hoa Hakananai'a sequence (DEEP-C059) and the Jiroft wear reading (DEEP-C009)
    rest on peer-reviewed abstracts and carry their authors' own caveats —
    relative dating only, a single object, an inference "far from being
    granted". These local results are neutral to the featured hypothesis: they
    establish that some comparisons are real and some functions unknown, not
    that any resemblance records a shared past. The founder's statistical
    self-reports (DEEP-C005, DEEP-C025, DEEP-C027, DEEP-C038) all rest on the
    site's own unaudited experiments with run data not retrieved; each earns
    only provisional support at weak strength. Critically, the two claims that
    would say whether the motif bundle itself is exceptional (DEEP-C056,
    DEEP-C057) carry only the author's own qualification records — the
    supporting record for the headline "bundle does not stand out" result was
    never created — so the catalogue leg, the one place the pattern hypothesis
    could be quantitatively tested, is unresolved. The methodological spine
    (DEEP-C035, DEEP-C026, DEEP-C002) is plausible as points of method but is
    backed by no record; and the claims that would directly discriminate shared
    past from retelling (DEEP-C031, DEEP-C054, DEEP-C037, DEEP-C034, DEEP-C018,
    DEEP-C028, DEEP-C015) have no evidence at all. Steelmanning both ways: for
    the shared-past reading, the lineup result (62.5% versus 9%) and the
    officially unexplained Göbekli forms stand unrebutted; against it, the
    bundle result (as reported), the catalogue's admitted uneven coverage, the
    demonstrated convergence of retellings, and the single-object caveats all
    press the other way, and the excavation team's "missing links" position
    (DEEP-C072) means even the continuity route lacks a dated intermediate. On
    these records the shared-past reading is argued for but not carried:
    weakly_supported, with the affirmative case hanging on one self-report.
    Sensitivity: removing DEEP-E020 (the lineup result, part 1) would strip the
    only affirmative quantitative record; the case verdict would not survive
    as weakly_supported and would fall to unresolved — a single-thread
    dependence stated plainly.
  steelman: >-
    The V1 lineup result stands unrebutted in this ledger: claimed civiliser
    partners ranked first in 62.5% of completed lineups against 9% for random
    pairs, and no record in the packet explains that gap as an artifact of
    compressed modern retellings — the retelling-confound is a proposal for a
    rerun (DEEP-R003), not a finding. A proponent would rightly add that the
    Göbekli Tepe team itself concedes no secure function for the three handled
    forms (DEEP-E028), so the shape comparison with the Assyrian banduddû and
    the Olmec pouch has never been answered on the objects; if a blinded human
    rerun on source-level passages reproduced the lineup rate, the civiliser
    narratives would exhibit a specific structural resemblance that this
    assessment, resting on records that do not yet exist, cannot explain.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record bears on this claim; the basis named is a point of
      method — a resemblance without dates, contexts, differences or candidate
      connections cannot by itself assign a causal history, which is close to
      definitional in archaeology. The strongest opposing consideration is that
      the claim's truth condition is a universal ("no resemblance can be
      assigned a historical explanation without those data") that no record
      tests, and trivial cases such as direct copies might be explicable from
      resemblance plus minimal context.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records attached (DEEP-E018, DEEP-E019) are the author's own
      qualifications of the catalogue's coverage and category breadth; no
      record carries the "bundle does not stand out" result itself as support,
      and none contradicts it. The claim is well posed and the page asserts it,
      but on the records as held it neither leans supported nor undermined.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 report both rates, but as self-reports of the
      site's own unaudited experiment with run data not retrieved, and
      "completed lineups" implies unenumerated incomplete runs. The strongest
      opposing consideration is self-audit bias plus the site's own noted risk
      that similarity could be manufactured by compressed modern retellings,
      which the planned human rerun (DEEP-R003) would test.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger documents a retelling in which detail
      converged relative to earlier attested versions; the Berossus records
      (DEEP-E043, DEEP-E046) document a civiliser narrative, not convergence
      through translation or comparative writing. The mechanism is familiar
      from background scholarship, but that is a prior, not a record, and
      DEEP-R003 names it as an open target.
  - claimId: DEEP-C035
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The basis named is a point of method: resemblance is compatible with
      several histories, so claims about the source's identity, date and
      capabilities are additions requiring independent evidence — near to
      logic rather than to measurement. The opposing consideration is that the
      universal is untested by any record, and a proponent could argue that
      sufficiently rich, specifically patterned resemblance plus dated
      intermediates could carry some of those additions.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim's truth condition requires showing one distribution compatible
      with both histories under stated models, and no record in the ledger
      states or tests any model. The "missing links" records (DEEP-E061,
      DEEP-E062) bear on continuity of imagery via DEEP-C072, not on this
      formal point, which the planned seal study (DEEP-R004) would begin to
      address.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      The records attached to this claim (DEEP-E018, DEEP-E019) only qualify
      the catalogue's reach; the bird and serpent frequencies have weak
      self-reported support (DEEP-E013, DEEP-E016) but attach to other claims,
      and the sacred-centre class has no frequency record at all. The page's
      "widespread" assertion therefore has no supporting record of its own in
      the ledger.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 report the 55% figure as the page's statement of
      its own result, with the underlying Berezkin & Duvakin catalogue and
      method page not in hand; DEEP-E015 and DEEP-E018/E019 qualify rather than
      corroborate. The strongest opposing consideration is that this is a
      single self-report of an unaudited experiment whose data were never
      retrieved.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E016 reports the 37% figure as the site's own result; DEEP-E017 and
      the coverage qualifications limit its reach without contradicting it. The
      opposing consideration is the same as for DEEP-C005: one interested
      self-report, method and data not retrieved, so the figure cannot be
      checked.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The three-way conceptual distinction is sound, but the claim's truth
      condition is that the compared images actually fall into different
      categories, and no record in the ledger codes any of the compared images
      into one of them. The strongest opposing consideration cuts the other
      way: nothing here shows the categories collapse either.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069, from the peer-reviewed Pitts et al. study,
      record the relative sequence statue, then komari, then bas-reliefs,
      which entails that the birdman carvings postdate manufacture. The
      opposing considerations are that this is abstract-level only, relative
      rather than absolute, and the paywalled body was never read.
  - claimId: DEEP-C065
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The basis named is a point of method — describing shape and inferring
      function are distinct evidential tasks — illustrated by the ledger's own
      Göbekli records, where shape is published (DEEP-E025) and function
      explicitly undecided (DEEP-E028). The opposing consideration is that the
      separation can license shape-only comparisons that ignore functional
      context, which the Assyrian ritual record (DEEP-E055) shows to be
      informative where it exists.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E055 records, via a blog transcription of Wiggermann 1992, that the
      banduddû was filled with water and used to sprinkle in rituals, which is
      the bucket-and-water half of the reading; the cone-and-purifier half is
      not in the transcribed text. The strongest opposing consideration is
      source quality: a secondhand transcription with visibly garbled
      transliterations, unchecked against the printed page.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is the excavation team's own published statement that no final
      decision on the meaning of the three forms is possible, and DEEP-E025
      independently shows the first description was shape-only; two lines from
      the authoritative side, nothing against. The residual doubt is scope:
      the statement is a 2016/2017 blog post, and later team publications
      (DEEP-R005) have not been checked.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the Vidale & Micheli abstract's own reading that the
      wear suggests long suspension on a cord, which meets the claim's truth
      condition at abstract level. The opposing consideration is the authors'
      own caveat (DEEP-E038) that the inference rests on a single object and
      is far from granted, plus the unconfirmed identity of their Tehran
      specimen with the photographed one.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E061 and DEEP-E062 quote a team member's direct statement that
      there are too many missing links to be sure of survival or change of
      meaning — exactly the agnosticism the claim asserts. The opposing
      considerations are that this is an informal comment-thread reply, not a
      formal publication, and the planned seal study (DEEP-R004) could supply
      a dated intermediate and change the picture.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim requires comparing the source histories of four names on
      language, date of first record and builder usage, and the ledger holds
      no record on any of the four; the only navel-theme record (DEEP-E024,
      Kurdish "wish hill") is an unsourced secondary statement attached to
      another claim. DEEP-R002 targets exactly this gap.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on the Turkish toponym's meaning; the
      second-reader note on DEEP-E024 explicitly rules that record out for
      this claim. The reading is plausible from background knowledge of the
      Turkish words, but that is a prior, not a record, and the claim's truth
      condition asks for documentation of shape-descriptive rather than
      sacred usage.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The basis named is mechanistic reasoning rather than a record: limbs
      carved free of a stone body are structurally vulnerable, so supporting
      them against the body is a plausible breakage-reducing contributor to
      the pose, and the claim is hedged as a contributor only. The opposing
      consideration is that no record measures breakage rates, and the Urfa
      Man evidence (DEEP-E081) shows a grasping genital gesture, suggesting
      symbolic causes operate too; DEEP-C048 rightly keeps the two
      compatible.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The records attached directly (DEEP-E075, DEEP-E076) were demoted to
      context because Berossus's text never mentions apkallu; the support is
      the converging ensemble — the fish-body description of Oannes
      (DEEP-E043), the sculptural-preservation note (DEEP-E044), and the
      translators' alignment of Oannes with U-An, first of the apkallu
      (DEEP-E079). The strongest opposing consideration is that the
      iconographic half — that the Assyrian fish-cloaked sage is the type the
      texts name — has no retrieved record at all.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim is an absence claim over all pre-modern sources, and the
      ledger contains no record on any source naming or not naming the Gate
      of the Sun figure Viracocha. Establishing it requires a source survey
      of colonial and pre-colonial Andean texts that has not been run.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record from the flood pilot's coded data exists in the
      ledger; the claim rests entirely on the page's assertion that 263
      summaries cluster by region, quoted only in a source anchor. The
      pilot's measure and coded data were never retrieved, so the claim
      cannot be evaluated either way.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      Like DEEP-C031, this is a self-reported pilot result with no evidence
      record in the ledger: the source anchor quotes the page's phrase about
      an uneven distribution of Genesis-associated details, but no record
      reports the coding that would show it. Nothing in the records bears on
      the distribution either way.
  - claimId: DEEP-C038
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E022 quotes the page's own finding that matching the kinds of
      objects changed the lineup result, and the second reader judged the
      quote a fair support for this claim. The opposing considerations are
      that it is a self-report of a pilot with incomplete runs and cropping
      constraints, and the pilot data were never retrieved.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record attaches to this claim; the one nearby record
      (DEEP-E022) carries an explicit reader act excluding it, since the
      kind-matching quote says nothing about inter-judge agreement. The
      page's phrase about strong disagreement is quoted only in the source
      anchor, and no agreement statistics were ever recorded.