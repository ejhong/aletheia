  synthesis: >-
    The case concerns how far visual and narrative resemblances (bird-men, handled objects, navel names, feathered serpents, civilising teachers, flood details) across distant cultures record a shared deep past versus independent invention, material convergence, later borrowing or comparative retelling. Evidence records supply almost no positive demonstration of long-distance transmission or a lost source; they instead document methodological constraints, uncertain functions, missing intermediate links, and experimental results that fail to isolate a distinctive bundle. Methodological claims (C002, C026, C035, C065, C018) stand as established or well-supported on ordinary historical method and on the excavators’ own statements: resemblance alone never fixes dates, contexts or capabilities, catalogue geography cannot separate invention from very old transmission, and shape is not function. The Göbekli Tepe team’s published refusal of a secure reading for the three handled forms on Pillar 43 (E028) and their comment that too many missing links prevent any secure claim of imagery survival into later Near Eastern objects (E061–E062) directly undercut any chain from the T-pillars to Assyrian buckets or farther. The catalogue experiment’s own self-reported frequencies (bird-person 55 %, cosmic-serpent 37 %) and the explicit finding that the three-class bundle does not stand out against documentation-preserving controls (C056–C057, E018–E019) show that the motifs are common enough for independent recurrence; the same experiment’s uneven coverage caveat further limits reach. Image-pilot results (kind-matching alters rankings; inter-judge disagreement) and the civiliser lineup (claimed partners 62.5 % versus random 9 %) remain self-reports of unaudited runs and therefore only provisional; they do not convert resemblance into transmission. Specific object claims fare little better: Jiroft handle wear is read as cord suspension only at abstract level and on a single specimen (E035, E038); Hoa Hakananaiʻa birdman reliefs post-date the statue (E068–E069) and are interpreted against nineteenth-century ethnohistory, not a prehistoric shared source; Oannes is described as fish-bodied in Berossus (E043) yet the apkallu correspondence rests on secondary tables and context records. Navel-name and flood-coding claims lack retrieved primary evidence and stay unresolved. Taken together the load-bearing methodological and excavation records leave any substantial shared-past explanation weakly supported at best: the pattern people see is real, but the records repeatedly show that seeing it does not establish common origin, contact or lost capability. The opposing side (convergence, material constraint, later retelling) is the one actually evidenced.
  steelman: >-
    The V1 civiliser lineup still returns claimed partner figures first in 62.5 % of completed runs against 9 % for random pairs, a rate the page itself presents as above chance and that no retrieved control or human re-test has yet cancelled; a proponent can rightly treat that residual non-random clustering of narrative elements (arrival from sea or sky, gift of arts, departure) as an unexplained observation still requiring an account beyond broad-motif frequency or known later borrowing.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim is ordinary historical method: no visual resemblance receives a transmission or common-origin explanation without independent data on dates, contexts, differences and possible links. No evidence record contradicts it; the founder page merely restates the principle. Strongest opposing consideration is that extreme formal identity sometimes warrants a provisional link hypothesis, yet even then the claim as stated (meaning depends on the further data) remains intact and is treated here as a prior of the discipline rather than a result derived from the ledger’s object records.
  - claimId: DEEP-C057
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The founder page reports that the three-class bundle does not stand out against the study’s own documentation-preserving comparisons (E018–E019). The result is a self-report of an unaudited experiment whose underlying catalogue and code are not in hand, so support is thin. Strongest opposing consideration is that a different coding grain or a fuller Near-Eastern sample might make the bundle appear distinctive; the page itself flags uneven coverage.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      E020–E021 record the page’s own statement that claimed partners ranked first in 62.5 % of completed lineups versus 9 % for random pairs. The figures are self-reported from incomplete AI runs whose raw data and prompts are unretrieved. Strongest opposing consideration is that human raters given full original passages (the research agenda’s own proposed control) could erase the excess rate; the claim as stated about the V1 experiment is only provisionally carried by the page’s numbers.
  - claimId: DEEP-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Documented mechanisms of translation, literary borrowing and comparative mythography routinely produce secondary convergence; the claim asserts only that such processes can increase likeness relative to earlier attested versions. No ledger record contradicts the mechanism. Strongest opposing consideration is that some motif identities might still be primary rather than secondary, yet that possibility does not falsify the existence of the retelling pathway itself, which is treated here as established background calibrated by the civiliser and flood material.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      A lost-civilisation narrative adds identity, date and capability claims that resemblance alone cannot supply; the ledger’s methodological records and the excavators’ missing-links statements (E061–E062) confirm the gap. Strongest opposing consideration is that a sufficiently dense, dated chain of intermediates could in principle underwrite such additions, yet no such chain appears in the evidence records, so the claim as stated holds as a prior of historical inference.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      Broad geographical distributions are compatible with both independent invention and deep transmission under standard models; the claim is therefore true by construction. E061–E062 (team comment on missing links) supply an empirical illustration for the Near East. Strongest opposing consideration is that future discovery of a continuous motif series could favour transmission in a local case, but that would not alter the general inability of geography alone to decide, which is the claim’s content.
  - claimId: DEEP-C056
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The page states that the three broad classes are each widespread in the sampled catalogue (linked via E018–E019). Support is the author’s unaudited report. Strongest opposing consideration is the same uneven-coverage caveat the page itself records, which could inflate or deflate apparent ubiquity once a balanced sample is coded.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      E013–E014 directly quote the page’s 55 % figure for the broad bird-person class among 926 traditions; E015 and E018–E019 qualify scope and coverage. The number is a self-report whose coded data are not retrieved. Strongest opposing consideration is that a narrower pose-and-attribute definition would yield a far lower percentage, exactly the limitation the page notes.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      E016 quotes the page’s 37 % figure for the broad cosmic-serpent class; E017 and E018–E019 qualify it as catalogue- and category-specific. Again a self-report. Strongest opposing consideration is re-coding under stricter iconographic criteria that might drop the frequency below any threshold of interest.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is an interpretive distinction among deity-with-bird-head, feathered person, and transforming person; the founder page asserts that the compared images fall into different categories. No contradictory record exists. Strongest opposing consideration is that some cultures may have treated the three as a single continuum, yet the claim only requires that the images need not share one idea, which remains intact.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract (E068–E069) states that komari were added after manufacture and that bas-relief birdman carvings succeeded the komari, establishing the relative sequence statue → later carvings. Strongest opposing consideration is that the absolute manufacture date remains unstated in the abstract, yet the claim asserts only posteriority of the birdman carvings, which the sequence supports.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically separate; the claim is a methodological commonplace illustrated by the Göbekli forms (unknown function) versus the Assyrian banduddû (named bucket). No record equates the two questions. Strongest opposing consideration is that in some cases wear or context may tightly couple them, yet the general separation still holds and is treated as prior.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E055 (second-hand transcription of Wiggermann) states that the banduddû was filled with water and used to sprinkle, supporting a purifier reading. The source is an unchecked blog extract of a single page. Strongest opposing consideration is that the primary printed text or additional ritual contexts might revise the function; until then the claim rests on weak secondary evidence.
  - claimId: DEEP-C012
