  synthesis: >-
    I interpret the featured hypothesis as the substantive proposition that a meaningful portion of the highlighted cross-cultural resemblance records a shared historical source or transmission, rather than merely the uncontested proposition that visually or narratively similar motifs exist. On that interpretation, the ledger provides weak support but nothing close to an established transmission history. The strongest positive item is the reported civiliser-lineup result in DEEP-C027: claimed partners reportedly ranked first in 62.5% of completed lineups, compared with 9% for random pairs. Yet both supporting records are the founder's self-report, with the run data, incomplete lineups, source passages and robustness checks unavailable. The reported bird-person and cosmic-serpent frequencies likewise indicate that comparable broad categories can be coded across many traditions, but their unaudited status and uneven catalogue coverage limit their force. DEEP-C053 also has a locally coherent textual case connecting fish-bodied Oannes with an apkallu name tradition, but the evidence does not establish the required iconographic identification, much less a connection to distant cultures.

    The evidence against treating the resemblances as historical proof is structurally stronger than any particular negative result. DEEP-C035 is established as an inferential constraint: resemblance cannot by itself supply a source's identity, date or capabilities. DEEP-C026 likewise captures the underdetermination between transmission and independent invention. In the local Göbekli Tepe comparison, the excavation record describes handle-like shapes while leaving their meaning undecided, and DEEP-C072 accurately records a team member's view that too many intermediate links are missing to establish later survival. DEEP-C059 further shows why chronology matters: the birdman reliefs on Hoa Hakananai'a were later additions rather than features securely contemporary with the statue's manufacture. The image-pilot report in DEEP-C038 says that kind-matched controls changed a lineup result, demonstrating that comparison-set construction can generate or suppress apparent distinctiveness.

    The counter-case must nevertheless be steelmanned. Repeated resemblance across several motif families, an above-random reported civiliser lineup, and possible continuity among Mesopotamian fish-sage traditions are all observations a transmission account could potentially explain together. Moreover, the central catalogue claim that the three-motif bundle fails to stand out, DEEP-C057, is itself unresolved because the ledger contains only qualifications about coverage and category breadth, not the result or underlying analysis. The flood clustering claims and inter-judge disagreement claim are also unsupported by retrieved data. Consequently, the present evidence does not positively contradict every shared-past model; it shows instead that the available positive case is weak, broad, largely self-reported and missing dated chains of intermediates.

    Sensitivity is greatest to DEEP-E022, the sole record reporting that kind-matched controls changed an image-lineup result. Removing it would eliminate the ledger's clearest experimental warning that apparent resemblance depends on control selection and would make the assessment marginally more favorable to the featured hypothesis. The weakly_supported verdict survives without it because the positive experiments remain unaudited, the claimed bundle result is unresolved, object functions are not matched, and no evidence record supplies a dated transmission chain across the distant cultures.
  steelman: >-
    The assessment does not answer whether a preregistered, blind comparison of the full fine-grained bundle—bird-like anthropomorphs, specifically configured handled forms, hands placed on the torso, civilising sea-arrivals and detailed flood sequences—would remain unusually associated across securely dated cultures after object-kind, documentation and retelling controls. A positive result on that specific conjunction, followed by dated intermediates or directional innovations, would be evidence for shared history that the present broad-category catalogue and incomplete pilots have not tested.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      DEEP-E025 and DEEP-E028 provide a concrete example in which a shape can be described reliably while its meaning remains undecided, and DEEP-E022 reports that changing the comparison controls changed a resemblance result. These records support the general inferential point that resemblance does not select among historical explanations without chronology, context, differences and possible routes of connection. The verdict also leans on the general scientific prior that observational equivalence requires independent discriminating information; the strongest opposing consideration is that the records illustrate rather than formally prove the claim's universal wording.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: high
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue through uneven coverage and broad categories, but neither reports the comparison statistic or demonstrates that the three-class bundle failed to stand out. No retrieved record supplies the underlying data, method or result needed to assess the claim as stated. The strongest opposing consideration is that the qualification records presuppose that such an analysis was conducted, but existence of an analysis does not verify its reported outcome.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the claimed 62.5% and 9% rates. They are, however, two parts of one founder-authored self-report rather than independent evidence, and neither the run data nor the number and treatment of incomplete lineups is available. The strongest opposing consideration is that unknown exclusions, passage compression, control selection or model dependence could materially alter both rates.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record compares an earlier attested story with translated, borrowed or comparative retellings and shows increased similarity of detail. The transmission layers noted for the surviving Berossus fragment make such alteration plausible, but they do not document convergence relative to an earlier version. The strongest consideration against an unresolved verdict is the strong general historical prior that translation and borrowing can reshape stories, but that prior does not satisfy this claim's stated evidentiary test.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      The records repeatedly exhibit underdetermination: handle-like forms have no secure function in DEEP-E025 and DEEP-E028, while DEEP-E022 says that matched controls changed a visual lineup. A resemblance therefore cannot, without additional evidence, identify a lost source or establish its date and capabilities. The strongest opposing consideration is that a sufficiently rare and structured resemblance can update the probability of transmission, but even that would not by itself establish all the additional historical particulars named in the claim.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      DEEP-E061 and DEEP-E062 show the practical problem directly: possible survival is entertained, but missing intermediates prevent a choice between continuity and other explanations. DEEP-E018 and DEEP-E019 further show that geographical catalogue patterns depend on uneven documentation and broad coding categories. The verdict also rests on the general identifiability principle that the same distribution can arise under multiple histories; the strongest opposing consideration is that geography can discriminate between fully specified models, though not by itself as the claim stipulates.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E016 report broad bird-person and cosmic-serpent frequencies of 55% and 37%, which gives partial support to calling two classes widespread within the sampled catalogue. No evidence record establishes the sacred-centre class, and the available reports are unaudited founder self-reports. The strongest opposing consideration is therefore the missing third component, compounded by DEEP-E018 and DEEP-E019 on uneven coverage and the mismatch between broad categories and the specific parallels.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E013 and DEEP-E014 directly report that 55% of 926 sampled traditions were coded into the broad bird-person class. The underlying catalogue extraction, coding decisions and reproducibility materials were not retrieved, while DEEP-E018 notes uneven coverage. The strongest opposing consideration is that the claim's truth condition concerns what the coded data reproduce, whereas the ledger currently contains only the author's statement of that result.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E016 directly reports a 37% frequency for the broad cosmic-serpent class. DEEP-E017 limits the result to the selected category and dataset, and DEEP-E018 adds uneven geographical coverage. The strongest opposing consideration is that no underlying coded data or method are available to reproduce the numerical claim.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record classifies the compared images as bird-headed deities, feather-wearing people or people transforming into birds. The categories are conceptually distinct, but conceptual distinguishability does not establish that the particular images in this case occupy different categories. The strongest consideration in favor is the ordinary semantic plausibility of the distinctions, which is a prior rather than evidence about the objects at issue.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the published relative sequence in which komari were added after the statue's making and the bas-relief composition associated with the birdman myth succeeded them. That sequence directly places the birdman reliefs after manufacture of the statue. The strongest opposing consideration is that only the abstract was retrieved, so the survey evidence and reasoning for the sequence could not be inspected.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      DEEP-E025 identifies box-like shapes with handle-like attachments without assigning a function, while DEEP-E028 states that their meaning remains undecidable. By contrast, DEEP-E055 uses ritual textual context to infer the function of another handled object. Together these records demonstrate that morphological description and functional identification are separate questions, although the strongest opposing consideration is that shape can still constrain the range of plausible functions.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E055 reports ritual instructions in which the banduddû holds water that is consecrated and sprinkled over a person, supporting a ritual bucket interpretation. The evidence is an unchecked blog transcription of Wiggermann rather than the primary publication, and it does not establish the cone or purifier part of the proposed pairing. That missing purifier half and the secondhand transcription are the strongest opposing considerations.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 directly reports the excavation team's statement that no final decision on the meaning of the three Pillar 43 forms was then possible. DEEP-E025 independently shows that the excavator's descriptive language remained non-functional, calling them box-like objects with handle-like attachments. The strongest opposing consideration is temporal: later team publications were not checked and could have supplied a more secure identification.
  - claimId: DEEP-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 directly states that the published abstract interprets the strong wear as evidence that the object was suspended for a long time on a cord. DEEP-E034 confirms wear on the handle and contour, so the founder's wording accurately summarizes the published interpretation. The strongest opposing consideration is DEEP-E038's warning that the inference rests on a single object and is not secure, together with incomplete confirmation that the studied object is exactly the photographed ledger specimen.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 records an excavation-team member saying that too many missing links prevent confidence about survival of Early Neolithic imagery into later periods. DEEP-E062 adds that any accompanying changes in meaning cannot yet be assessed securely. The strongest opposing consideration is that this was an informal comment by one team member rather than a formal, comprehensive team publication.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record supplies the language, first-attestation date or builder usage for all four named expressions. The available Göbekli Tepe records concern imagery, and DEEP-E024 concerns a Kurdish gloss rather than the Turkish-name history required here. The strongest consideration in favor is the prior plausibility that expressions from different languages and recording periods have different source histories, but the specific three-part comparison remains unevidenced.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record documents that the modern Turkish name Göbekli Tepe was assigned descriptively because of the mound's shape. DEEP-E024 addresses Kurdish names and does not bear on this Turkish etymology. The strongest consideration in favor is that the proposed gloss is plausible as ordinary toponymy, but that is outside the retrieved evidence and does not distinguish a descriptive name from a sacred designation.
  - claimId: DEEP-C047
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      None of the evidence records tests whether keeping stone limbs against a torso reduces breakage or contributed to the compared hands-on-body poses. General engineering background makes the mechanism plausible, but the rules permit that background only as a prior, not as case evidence. The strongest consideration in favor is that projecting limbs are ordinarily more vulnerable, while the strongest gap is the absence of measurements, breakage comparisons or carving experiments.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 describes Oannes as a fish-bodied being with human features, DEEP-E076 reports that his form was said to survive in sculpture, and DEEP-E079 weakly supports a scholarly alignment between Oannes and U-An, the first apkallu. These records jointly support a textual relationship between Oannes and an apkallu tradition. The strongest opposing consideration is that no evidence record identifies the particular Assyrian fish-cloaked figure as the named apkallu type, leaving the essential iconographic half of the correspondence unverified.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record addresses when the Gate of the Sun's central figure was first identified as Viracocha or whether any pre-modern source gives that name. Consequently, the claim's negative historical test cannot be evaluated from this ledger. The strongest consideration in favor is the general possibility that archaeological figures acquire modern conventional names, but that prior is not evidence about this identification.
  - claimId: DEEP-C031
