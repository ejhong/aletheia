    confidence: high
    reasoning: >-
      No evidence record provides the 263 coded summaries, a clustering measure, a regional comparison or the pilot's result. The claim therefore cannot be assessed merely from its appearance in the founder's narrative. The strongest consideration in favor is that a pilot is reported to exist, but an unrecorded result and method supply no check on coding dependence or statistical robustness.
  - claimId: DEEP-C054
