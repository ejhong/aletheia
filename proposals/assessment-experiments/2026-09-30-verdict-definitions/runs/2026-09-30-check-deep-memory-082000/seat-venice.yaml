caseAssessment:
  verdict: mixed
  loadBearing: [DEEP-C012, DEEP-C059, DEEP-C027, DEEP-C072]
  weakestLinks: [DEEP-C057, DEEP-C037, DEEP-C005, DEEP-C025, DEEP-C027]
  synthesis: >-
    The case's founding question is two-sided, and the ledger as built supports a genuinely
    mixed reading. What is best evidenced bears against the strong shared-past reading: the
    Göbekli Tepe team's own published statement that no final decision on the meaning of the
    three handled forms is possible (DEEP-C012, a strong-grain record from the excavators)
    makes the Assyrian bucket-and-cone comparison a comparison of shapes only; the
    peer-reviewed sequencing of Hoa Hakananai'a's carvings (DEEP-C059, two moderate abstract-level
    records) ties the Rapa Nui birdman reliefs to a statue later re-carved and read against a
    myth recorded only in the nineteenth and twentieth centuries — recent ethnohistory, not deep
    shared tradition; and the excavation team's "missing links" position (DEEP-C072) states that
    survival of early imagery into later Near Eastern objects is unestablished. The methodological
    spine (DEEP-C002, C026, C035, C065) holds, though verdicts there rest on background
    methodological consensus rather than ledger tests, and I say so. Against this, the
    transmission side holds exactly one positive datum: the V1 lineup result (DEEP-C027, 62.5%
    vs 9%), a weak self-report of an AI experiment whose run data are not in hand and whose
    compressed-retelling confound the founder himself names. The catalogue frequencies (DEEP-C005,
    C025) are likewise self-reports under an acknowledged uneven-coverage caveat, and the key
    negative pattern — the bundle not standing out (DEEP-C057) — plus the flood-pilot results
    (DEEP-C031, C054) and the judge-disagreement statistic (DEEP-C037) have no evidence records
    at all. Steelmanning both directions: the sceptic can say every verified finding so far is
    compatible with independent invention and retelling, and each specific parallel dissolves
    under the shape/function and record-date distinctions; the proponent can reply that nothing
    in the ledger demonstrates convergence either — every anti-transmission finding is a statement
    of uncertainty — and the one quantified comparison favours similarity beyond chance. The mixed
    verdict reflects that standoff: the well-supported claims cut against the strong reading, the
    only positive signal is unverified, and the decisive evidence (dated intermediates,
    human-rater replications, primary catalogue and run data) is named in the research agenda but
    not yet in hand. Removal of DEEP-E028 (the team's "no final decision" statement) would drop
    the case's strongest records (DEEP-C012/C066) to unresolved and rebalance toward the
    pro-hypothesis side; the mixed verdict would survive in weakened form because DEEP-C059 and
    the methodological claims stand independently. Removal of DEEP-E020 would gut the
    pro-transmission side entirely, tilting the case toward the sceptical reading.
  steelman: >-
    The 62.5% first-rank rate for claimed civiliser partners against a 9% random baseline is a
    calibrated, quantified signal that the civiliser narratives are genuinely more alike than
    chance pairs, and nothing in this ledger explains it away: no human-rater replication exists
    (DEEP-R003 is open), no record shows the compressed-modern-retelling confound actually
    operating, and the judge-reliability statistic that might impugn the design (DEEP-C037) is
    itself unevidenced. Coupled with the excavators' own concession that far too many "missing
    links" remain to rule out survival of Göbekli imagery into later Near Eastern objects, a
    proponent can rightly say that the ledger contains no demonstrated instance of convergence,
    retelling or independent invention for any specific pairing — every sceptical finding here is
    an absence of evidence about transmission, not evidence of absence.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record tests this claim; its truth condition is close to analytic in historical
      method — a resemblance alone cannot fix date, contact or meaning — and the ledger's own
      Göbekli records (DEEP-E028, the team refusing a decision on meaning without intermediates)
      exemplify the practice. The strongest opposing consideration is that the claim is a
      founder-stated maxim rather than a tested result, so the verdict leans on background
      methodological consensus rather than ledger evidence, which I disclose; no record in the
      ledger shows any resemblance assigned a historical meaning without such data.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record reports the "bundle does not stand out" result; only the author's
      coverage caveats (DEEP-E018, E019) touch the catalogue experiment, and those narrow rather
      than establish any finding. The founding page's anchor quote suggests the result exists,
      but an unrecorded page statement is not evidence under the ledger's rules. The strongest
      opposing consideration is that the result, if real, is the single most informative
      negative in the whole case — which is exactly why it needs a record of the comparison
      method before it can carry weight.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two weak records (DEEP-E020, E021) state the 62.5% and 9% rates, but both are self-reports
      of the founder's own AI lineup experiment; the run data are not retrieved and "completed
      lineups" implies incomplete runs the page does not enumerate. The strongest opposing
      consideration is that the effect size against a calibrated random baseline is large, so the
      claim is plausible — the weakness is procedural, not substantive — and the page's own
      stated confound (similarity manufactured by compressed modern retellings, targeted by
      DEEP-R003) is nowhere shown to be absent.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record documents a retelling in which detail converges relative to earlier
      attested versions, which is the claim's own truth condition; the verdict leans on background
      knowledge that translation, excerpting and comparative writing demonstrably converge texts,
      as the layered Berossus transmission chain in the source notes illustrates. The strongest
      opposing consideration is that convergence must be shown against the originals, not
      asserted — the ledger holds the Oannes material (DEEP-E043, E046) but no comparison of
      versions, so this remains a prior-based verdict, not an evidenced one.
  - claimId: DEEP-C035
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is near-analytic: resemblance is compatible with several causal histories, so the
      added claims about a source's identity, date and capabilities require evidence of their own;
      no ledger record contradicts this, and the excavators' intermediates-first stance
      (DEEP-E061, E062) embodies the principle. The strongest opposing consideration is that very
      specific, detailed correspondences can genuinely raise the probability of a connection — the
      claim concerns what similarity alone can establish, not whether similarity is probative at
      all, and on that reading it stands; the verdict still rests partly on background inference.
  - claimId: DEEP-C026
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim is methodological and holds as stated: a distribution of a broad class, without
      dated intermediates or other data, is compatible with both histories, which is exactly the
      position the excavation team takes about survival of imagery (DEEP-E061, E062, linked
      downstream at DEEP-C072). The strongest opposing consideration is that in parallel fields
      phylogeographic patterns are not always uninformative — clines and breaks can favour one
      history — so "cannot by itself" could be read too absolutely; as scoped to catalogue
      distributions alone, the claim stands on background plus the team's own agnosticism.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records bearing on this claim (DEEP-E018, E019) are author qualifications of the
      catalogue experiment, direction "qualifies"; no record reproduces "widespread" as a finding
      for the three classes together, and the sacred-centres class has no frequency record at all.
      The strongest opposing consideration is that the 55% and 37% self-reports (DEEP-E013, E016)
      are the obvious basis for "widespread" — but those records are linked to other claims, are
      themselves weak self-reports, and cover only two of the three classes.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Three weak records report the page's statement of the 55% figure (DEEP-E013, E014) and its
      self-declared scope limit (E015), plus coverage caveats (E018, E019); the underlying
      Berezkin & Duvakin catalogue and the experiment's method page were never retrieved, so the
      truth condition — the coded data reproducing the proportion — is unverified. The strongest
      opposing consideration is that the figure is precise and rests on a real published
      catalogue, making reproduction feasible; the weakness is procedural, not necessarily
      substantive, and a second reader even disputed the direction of one record.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Same footing as DEEP-C005: a weak self-report (DEEP-E016) and a scope-limiting record (E017)
      whose second reader explicitly noted it does not assert the 37% figure. The strongest
      opposing consideration is identical — the underlying catalogue exists and the number is
      checkable — but nothing in hand reproduces it, and the coverage caveat for the ancient Near
      East and Rapa Nui specifically narrows whatever baseline the figure sets.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The conceptual tripartition (bird-headed deity, feathered person, transforming human) is
      sound as background, but the claim's truth condition is empirical — that the compared images
      fall into different categories — and no ledger record classifies any of the compared images
      into these categories. The strongest opposing consideration is that the founding page's
      gallery plainly intends such category differences, but founder pages are hypothesis material
      by the case's own constitution, not evidence, so the tripartition remains untested here.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Two moderate records from the peer-reviewed Pitts et al. abstract (DEEP-E068, E069) give the
      relative sequence statue, then komari, then bas-relief carvings, which is exactly the
      relative ordering this claim asserts; no absolute date is needed. The strongest opposing
      consideration is that both records are abstract-level from a paywalled body, so the full
      study's reasoning is unseen — but the abstract is the study's own summary and nothing in the
      ledger contradicts the sequence.
  - claimId: DEEP-C065
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record directly tests the form/function separation; the verdict leans on
      background method, indirectly exemplified by Vidale & Micheli inferring function from wear
      rather than shape (DEEP-E034, E035) and by the Göbekli team refusing a function from shape
      (DEEP-E028). The strongest opposing consideration is that for many object classes shape
      strongly constrains function, so the separation is a methodological heuristic rather than an
      absolute — but as a claim about what questions must be answered separately, it stands.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The single supporting record (DEEP-E055) is a weak, secondhand blog transcription of
      Wiggermann 1992 stating the banduddû was filled with water and used to sprinkle — the bucket
      half of the claim — but the editor's note records that the cone/purifier element appears
      only in the blogger's own caption, which the ledger excludes. The strongest opposing
      consideration is that the printed page of Wiggermann could differ from the garbled
      transcription, and the "purifier" half currently has no retrieved textual basis at all, so
      the claim as a whole outruns its evidence.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The team's own published statement (DEEP-E028, strength strong) that "a final decision on
      the meaning of these images" is not possible directly evidences the claim that the
      excavation record contains no secure functional identification, and Schmidt 2006
      (DEEP-E025) confirms the excavator described shape only. The strongest opposing
      consideration is that the statement is a 2016/2017 snapshot — a blog post, not a monograph —
      and the later team literature (Schmidt 2012, the 2017 response) named in DEEP-R005 was not
      retrieved, so a later commitment cannot be excluded.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The wear-study abstract directly states the strong wear suggests the hand-bag "was suspended
      for a long time on a cord" (DEEP-E035), which is the claim's content, but the same abstract
      carries the authors' own caveat that the inference rests on a single object and "is far from
      being granted" (DEEP-E038), and only the abstract was read. The strongest opposing
      considerations are the single-specimen basis, the unconfirmed identity of the Tehran piece
      with the photographed object, and the unread body of the paper.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Two records (DEEP-E061, E062) quote a team member's published statement that there are "far
      to many 'missing links' to be sure" of the imagery's survival — exactly the claim's content
      about the team's stated position. The strongest opposing consideration is the informal
      locus: a comment-thread reply with a typo, not a formal publication, so it evidences the
      author's view rather than an institutional one, and the agenda item DEEP-R004 tests exactly
      whether a named intermediate class would change that position.
  - claimId: DEEP-C018
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The ledger holds no toponymic records (DEEP-R002 is unanswered), so this verdict leans
      almost entirely on background: the four names plainly differ in language, their first
      records differ in date (ancient Greek literary, 1609 colonial, post-contact Rapanui, modern
      Turkish), and builder usage is documented for none in a comparable way. The strongest
      opposing consideration is that "different kinds of evidence" could fail if, for example, the
      modern Turkish name were shown to translate an older local sacred name — a possibility the
      ledger cannot exclude.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No toponymic source is in the ledger; the one related record (DEEP-E024) concerns the
      Kurdish names and its second reader explicitly noted it says nothing about the Turkish name.
      Background supports reading "göbek" as a shape descriptor of the mound, but the
      shape-versus-sacred-designation question is precisely what requires a toponymic source, and
      a folk-sacred reading cannot be excluded from priors alone. The strongest opposing
      consideration is that the name's modernity makes the builder-usage question moot for this
      site, which some would say makes the descriptive reading trivially correct — but that is
      inference, not evidence.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      This is a plausibility claim, and background makes the mechanism genuinely plausible:
      protruding stone limbs break off, and carving them against the body is a standard sculptural
      expedient; no ledger record contradicts it. The strongest opposing consideration is that the
      ledger contains observations of the pose (DEEP-E081 for Urfa Man) but no evidence for the
      mechanism itself, and the pose's recurrence across traditions separated by millennia could
      equally reflect shared symbolic conventions — the claim survives because "plausible
      contributor" is a modest bar, not because the mechanism is evidenced.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The ledger's direct records on the correspondence were downgraded to context by the second
      reader (DEEP-E075, E076): the fragments describe Oannes's fish-body form but do not name the
      apkallu, and the translators' alignment of Oannes with U-An (DEEP-E079) is a secondary
      correlation linked to another claim. The strongest opposing consideration is that, strictly
      within the ledger, no record states the correspondence; the verdict therefore leans on
      standard Assyriological background plus the matching descriptions, with the iconographic
      half (the Assur-basin figure being the named type) separately unevidenced.
  - claimId: DEEP-C028
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No ledger record concerns Tiwanaku at all, so this verdict leans heavily on background:
      the identification of the Gate of the Sun's central staff-bearer as Viracocha is a modern
      scholarly convention, the colonial sources describing Viracocha nowhere tying him to this
      monolith. The strongest opposing consideration is that the truth condition demands absence
      of any pre-modern naming — a negative that the ledger is structurally unable to establish,
      and which only a survey of pre-modern Andean sources could settle.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record from the flood text-coding pilot exists in the ledger; nothing was
      retrieved about the 263 summaries, the coding scheme or the clustering measure. The
      strongest opposing consideration is that the founding page reportedly states the result,
      but no record of that statement was built, so under the ledger's rules the claim — even as a
      report of the site's own experiment — has no basis here.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      As with DEEP-C031, the flood pilot is entirely unretrieved: no record documents the uneven
      distribution of Genesis-associated details or the widespread generic motifs its sibling
      claim names. The strongest opposing consideration is that the result would be diagnostic if
      real — an uneven, regionally patterned detail distribution is what retelling predicts —
      which is exactly why retrieving the pilot's coded data (per the case's method) matters
      before any weight is placed on it.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      One weak record (DEEP-E022) quotes the page's exact line that matching the kinds of objects
      changed the lineup result, which matches the claim; but the pilot data are unretrieved and
      the page itself notes incomplete runs and cropping constrain the conclusions. The strongest
      opposing consideration is that a kind-matching sensitivity in an AI lineup could be an
      artifact of the judges rather than a property of the resemblances — and the judge-reliability
      statistic that would bear on that (DEEP-C037) is itself unevidenced in the ledger.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on this claim: the only pilot record (DEEP-E022) is scoped to
      DEEP-C038, and its second reader explicitly noted the quoted line says nothing about judge
      agreement statistics. The strongest opposing consideration is that the founding page's
      phrase "strong disagreement between judges" indicates a statistic exists somewhere, but
      until the pilots' inter-judge agreement numbers are retrieved, this claim — which matters
      greatly, since it would calibrate how much weight the lineup and pilot results can bear —
      has no basis in the ledger.