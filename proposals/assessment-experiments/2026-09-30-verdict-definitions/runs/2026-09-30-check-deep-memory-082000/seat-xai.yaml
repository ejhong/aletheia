  synthesis: >-
    The featured hypothesis asks how much of the cross-cultural resemblances in bird-men, handled objects, navel names, feathered serpents, civilising teachers and flood stories records a shared past (deep transmission or inheritance) versus independent invention, material/image-making constraints, or later retelling and comparative convergence. The ledger's evidence records do not resolve that partition. Methodological claims that are load-bearing are well grounded in ordinary scientific standards and in the excavators' own statements: historical meaning of a visual resemblance requires dates, contexts, differences and possible connections rather than resemblance alone (C002); a catalogue geographical distribution of broad motif classes cannot by itself distinguish independent invention from very old transmission (C026); similarity alone cannot underwrite a lost-civilisation account's stronger claims about source identity, date and capabilities (C035); shape and function of handled objects are separate questions (C065); and the four navel designations differ in language, date of first record and whether ancient builders used the name (C018). These are established or well supported on the records plus ordinary background standards of evidence; they do not themselves prove or disprove shared deep history, but they set the bar that the positive case has not met. On the concrete objects the strongest primary statements cut against easy transmission readings. The Göbekli Tepe team itself states that no final decision on the meaning of the three handled forms on Pillar 43 is possible (E028 supporting C012) and that there are far too many missing links to be sure of any survival of the site's imagery into later Near Eastern objects (E061/E062 supporting C072). The Jiroft chlorite wear reading is real at abstract level but single-object and caveated (E035/E038 for C009). Birdman reliefs on Hoa Hakananai'a post-date the statue (E068/E069 for C059) and are read against nineteenth- and twentieth-century ethnohistoric myth, not prehistoric texts. Assyrian banduddû ritual context is only second-hand (E055 for C044). Catalogue frequencies (55 % bird-person, 37 % cosmic-serpent, widespread broad classes whose bundle does not stand out) and the V1 civiliser lineup rates are self-reports of the founder's own unaudited experiments (E013–E021, E018–E019); they supply weak baselines at best and, by the page's own caveats, do not distinguish specific pose/object bundles or invention from ancient transmission. Flood coding clustering and Genesis-detail unevenness lack any retrieved run data. Image-pilot findings of judge disagreement and kind-matching effects are likewise self-reported or absent. No evidence record supplies dated intermediate objects, shared unusual detail clusters that survive controls for retelling, or a mechanism that would carry specific motifs across the observed gaps. The result is therefore unresolved: the resemblances are real enough to notice, the local functional and material accounts leave residual pattern, yet nothing in the ledger elevates shared deep past above convergence plus later scholarly and popular retelling. Removing any single record leaves the same structural gap. General background on independent invention of simple motifs and on the known history of comparative mythology calibrates the prior that convergence and retelling are common; the ledger itself supplies no countervailing measurement that would overturn that prior.
  steelman: >-
    The side-by-side visual matches (bird-headed figures, three handled forms beside bucket and pouch, hands meeting on belly, feathered-serpent and civiliser templates) remain subjectively striking even after local functional readings and missing-link cautions are granted; no retrieved control set of random ancient images has quantified how often equally close matches arise by chance, leaving the residual pattern unrefuted by direct measurement.
