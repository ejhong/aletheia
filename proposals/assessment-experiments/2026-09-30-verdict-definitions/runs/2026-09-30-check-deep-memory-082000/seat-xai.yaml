    reasoning: >-
      Documented processes of translation, borrowing and comparative writing routinely produce convergence of detail relative to earlier attested versions; the claim states a known mechanism. No ledger evidence record supplies a concrete counter-example, but none is required for the generic statement. Strongest opposing consideration is that some motif pairs may still be older than the attested retellings; the claim does not deny that possibility.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
