  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The statement is a restatement of ordinary historical method: resemblance without dates, contexts, differences and possible connections cannot be assigned a historical explanation. No evidence record contradicts it; the founder's page simply asserts it. Strongest opposing consideration is none; the claim is definitional for the domain and leans on scientific background standards rather than any particular retrieved measurement.
