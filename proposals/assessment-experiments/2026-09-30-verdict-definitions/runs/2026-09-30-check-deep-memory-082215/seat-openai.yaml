caseAssessment:
  verdict: weakly_supported
  loadBearing: [DEEP-C002, DEEP-C026, DEEP-C027, DEEP-C035, DEEP-C072]
  weakestLinks: [DEEP-C057, DEEP-C027, DEEP-C031, DEEP-C054, DEEP-C037]
  synthesis: >-
    I treat the featured hypothesis as the proposition that a shared deep past,
    long-distance transmission, or a common cultural source materially explains
    the cross-cultural bundle, rather than merely the uncontested proposition
    that the displayed objects and stories resemble one another. On that
    reading, the records leave the hypothesis weakly supported. The affirmative
    case has one quantitative-looking signal: DEEP-E020 and DEEP-E021 report
    that claimed civiliser partners ranked first in 62.5% of completed lineups,
    versus 9% for random pairs. That would matter if reproduced from the run
    data with source-level texts and properly matched controls. Here, however,
    it is an unaudited self-report with incomplete runs unspecified. The
    Oannes records provide another legitimate but local strand: DEEP-E075 and
    DEEP-E076 document a fish-human description and a claim that the form
    survived in sculpture, while DEEP-E079 records a secondary scholarly
    alignment involving U-An and the apkallu list. Those observations make the
    Oannes–apkallu association worth investigating, but they do not connect
    Mesopotamia to Tiwanaku, Rapa Nui, Göbekli Tepe, or Mesoamerica.

    Several locally supported claims are similarly real without being evidence
    for the larger history. DEEP-E035 supports the inference that one chlorite
    object hung from a cord; DEEP-E028 supports uncertainty about the function
    of the Pillar 43 forms; and DEEP-E068–DEEP-E069 support the conclusion that
    the birdman reliefs on Hoa Hakananai'a postdate the statue. Shape and
    function therefore cannot be transferred between the Jiroft, Assyrian, and
    Göbekli examples merely because their outlines invite the same label.
    Likewise, the catalogue self-reports weakly support broad bird and serpent
    frequencies, but uneven coverage and broad coding categories limit their
    relevance. Crucially, the evidence records do not actually document the
    claimed non-distinctiveness of the three-motif bundle: DEEP-E018 and
    DEEP-E019 state limitations, not that result. Flood clustering, Genesis-
    associated detail distributions, and strong inter-judge disagreement also
    remain unevidenced in this packet.

    The strongest case against the featured hypothesis is therefore structural,
    not a demonstration that transmission never occurred. Resemblance alone
    underdetermines date, route, source identity, and capability; broad
    geographical distributions can fit both transmission and convergence; and
    DEEP-E061–DEEP-E062 report missing intermediates and possible changes of
    meaning even within the Near Eastern sequence. A general prior also
    contributes to the lean: across large chronological and geographical gaps,
    a common-source account needs more specific intermediates than an
    independent-invention account needs. That prior is disclosed because the
    records themselves do not calculate competing model likelihoods.

    The hypothesis is not contradicted. No record tests a dated transmission
    chain or a preregistered bundle of highly specific traits, and absence of
    such a test is not evidence that no chain exists. The single record whose
    removal would most change the assessment is DEEP-E020, because it contains
    the principal affirmative rate from the civiliser lineup. Removing it would
    break the reported 62.5%-versus-9% comparison and further weaken the
    positive side, but the weakly_supported verdict survives: the remaining
    evidence still supplies suggestive local correspondences, while neither
    those correspondences nor the methodological objections establish or
    refute a common source. The case verdict therefore does not hang on that
    one record.
  steelman: >-
    The packet never tests whether the full conjunction of specific features—a
    bird-person form, a handled object in the same compositional role, the
    hands-on-body pose, a sacred-centre name, a sea-arriving civilising teacher,
    and a particular flood-detail package—co-occurs more often across dated
    cultures than in documentation-matched controls. If that specific bundle,
    rather than broad categories such as “bird-person” or “serpent,” proved
    statistically rare yet repeatedly linked by chronological intermediates,
    a proponent could rightly argue that the present assessment has not
    explained the central pattern.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      This is an identifiability point grounded in logic and historical method
      rather than in a particular evidence record: resemblance can alter the
      probability of proposed connections but cannot by itself supply dates,
      contexts, differences, or a route of connection. The strongest opposing
      consideration is that an exceptionally diagnostic resemblance may be
      highly informative, but even then it does not alone assign a complete
      historical explanation.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: high
    reasoning: >-
      DEEP-E018 and DEEP-E019 qualify the catalogue's coverage and the breadth
      of its categories, but neither reports the documentation-preserving
      comparison or its outcome. Thus the evidence records do not establish
      that the bundle failed to stand out, and no record contradicts that
      result either. The strongest consideration in the claim's favor is that
      the recorded limitations are consistent with such an analysis having
      been performed, but consistency is not reproduction of its result.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E020 and DEEP-E021 directly report the 62.5% and 9% rates, so
      something specific is offered for both parts of the claim. They are
      split statements from the same interested, self-published source, and
      the underlying run data, number of completed lineups, and incomplete
      runs were not retrieved. The strongest opposing consideration is
      therefore that the exact rates cannot be reproduced or audited from the
      records.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record presents an earlier version and a translated,
      borrowed, or comparative retelling that became more similar to another
      story. A general background prior makes the proposed mechanisms
      plausible, but that prior does not meet the claim's stated test requiring
      documented convergence of detail. The strongest consideration in favor
      is the ordinary capacity of translation and borrowing to alter texts;
      the strongest limitation is the absence of an actual comparison here.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      The claim follows from logical underdetermination: resemblance contains
      no intrinsic measurement of a source's identity, date, or capabilities,
      so those additions require evidence beyond resemblance. This verdict
      rests on method and logic rather than an empirical record. The strongest
      opposing consideration is that a sufficiently distinctive bundle could
      strongly favor common ancestry, but probabilistic support would still
      not establish all three added particulars by itself.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A distribution that is compatible with both an inheritance model and an
      independent-invention model cannot, by itself, identify which model
      generated it; this is a logical limitation of the observation. DEEP-E061
      and DEEP-E062 illustrate the practical problem through missing links and
      possible semantic change, although the verdict principally rests on
      identifiability. The strongest opposing consideration is that a
      distribution can discriminate probabilistically once explicit competing
      models and likelihoods are added, but those additions go beyond the
      distribution by itself.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E013–DEEP-E016 weakly report frequencies of 55% for the broad
      bird-person class and 37% for the broad cosmic-serpent class, which can
      reasonably be called widespread in their sample. No evidence record
      supplies the corresponding sacred-centre result, so the three-part
      conjunction is incomplete. The strongest opposing consideration is
      DEEP-E018–DEEP-E019: coverage is uneven and the broad categories do not
      represent the specific images or names at issue.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E013 and DEEP-E014 report the exact 55% of 926 figure, but both are
      parts of the site's self-report rather than an audit of its coded data.
      DEEP-E015 does not test the proportion and instead limits what the broad
      category can imply. The strongest opposing consideration is that the
      underlying catalogue, coding decisions, and reproducible calculation
      are absent, while DEEP-E018 notes uneven coverage.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E016 reports the exact 37% figure, directly favoring the claim at
      the level of an author self-report. DEEP-E017 only limits the result to
      the selected category and dataset, and no coded data or calculation is
      available for reproduction. The strongest opposing consideration is the
      combination of unaudited methods and uneven catalogue coverage recorded
      in DEEP-E018.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record codes any of the compared images as a bird-headed
      deity, feather-wearing person, or transforming person. The categories
      are conceptually distinguishable, but the claim also asserts that the
      compared images actually fall into different categories, which the
      records do not show. The strongest consideration in favor is the
      semantic distinction among the three descriptions; it cannot substitute
      for iconographic classifications of the objects.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 reports that komari were added after the statue's original
      making, and DEEP-E069 reports that the birdman bas-reliefs succeeded the
      komari. Together they support the relative sequence statue, then komari,
      then birdman reliefs. The strongest opposing consideration is that both
      records derive from one paper's abstract, whose full survey and
      reasoning were not read, so they are not independent replications.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically separate because similar outlines
      can serve different purposes and the same purpose can be embodied in
      different shapes. DEEP-E025 describes the Pillar 43 forms as box-like
      with handle-like attachments, while DEEP-E028 says their meaning cannot
      presently be decided, concretely demonstrating the distinction. The
      strongest opposing consideration is that shape can constrain or suggest
      function, but suggestion is not identity.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E055 reports a ritual text in which the banduddû is filled with
      water and used for sprinkling, supporting the bucket and ritual-use
      portion of the interpretation. The evidence is a secondhand blog
      transcription of Wiggermann, and it does not supply the cone or purifier
      half of the asserted pairing. That missing half and the unretrieved
      primary edition are the strongest opposing considerations.
  - claimId: DEEP-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 directly reports the excavation team's statement that no final
      decision about the meaning of the Pillar 43 forms was then possible.
      DEEP-E025 independently supplies a shape description without assigning a
      function, which is consistent with the uncertainty. The strongest
      opposing consideration is temporal scope: DEEP-E028 reflects the
      team's 2016/2017 position, and later team publications were not checked.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E034 records visible wear on the handle and contour, and DEEP-E035
      directly quotes the authors' inference that the object had long been
      suspended on a cord. This meets the claim at abstract level. The
      strongest opposing consideration is DEEP-E038, where the authors caution
      that the inference rests on one object and is far from granted; identity
      with the ledger's photographed object is also not fully confirmed.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 directly records a team member saying that there are too many
      missing links to be sure how far the imagery survived, and DEEP-E062
      adds uncertainty about changes in meaning. These statements closely
      match the claim's specified truth condition. The strongest opposing
      consideration is that both records split one informal comment by one
      team member, so they do not securely establish a current, team-wide
      position.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: high
    reasoning: >-
      The packet contains no evidence records giving the languages, earliest
      attestations, or builder usage for all four expressions. Their apparent
      heterogeneity makes the claim plausible, but that is a background
      expectation rather than a documented source history. The strongest
      consideration in favor is that modern Turkish, Rapanui, Greek, and
      Garcilaso's account plainly invite different source questions; the
      required attestation data remain absent.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record states that the Turkish name Göbekli Tepe was assigned
      descriptively because of the mound's shape. DEEP-E024 concerns Kurdish
      names and therefore does not bear on this claim, and no record contradicts
      the proposed etymology. The strongest consideration in favor is the
      general plausibility of a descriptive topographic name, but that prior is
      too nonspecific to decide this historical proposition.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      This verdict rests on a disclosed general materials-engineering prior:
      keeping projecting stone limbs attached to the torso reduces leverage and
      opportunities for breakage, making material constraint a plausible
      contributor. No evidence record compares breakage rates, carving
      practices, or poses directly, so the claim is supported only at the level
      of mechanical plausibility. The strongest opposing consideration is that
      symbolic convention could fully explain the pose in particular cases.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 supplies Oannes's fish-over-human form, DEEP-E076 says that his
      form was preserved in sculpture, and DEEP-E079 records a weak secondary
      alignment involving U-An and the apkallu list. These pieces favor an
      Oannes–apkallu relationship but do not complete the claim. The strongest
      opposing consideration is the missing iconographic link: no evidence
      record establishes that the particular Assyrian fish-cloaked figure is
      the named apkallu type corresponding to Oannes.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record supplies a pre-modern naming history for the Gate of
      the Sun figure or documents when the Viracocha identification first
      appeared. There is likewise no record of a pre-modern source naming the
      figure Viracocha. The strongest consideration in favor is the claim's
      testable absence proposition, but without a source audit that absence
      cannot be established.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record presents the 263 coded summaries, a regional
      clustering statistic, a map, or a comparison against a null model.
      Consequently the records neither reproduce nor contradict the reported
      clustering. The strongest consideration in favor is merely that a
      coding pilot is described elsewhere in the case materials, which is not
      evidence of its stated result.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record identifies the details classified as associated with
      Genesis or quantifies their distribution across the coded summaries.
      The packet therefore provides no basis for deciding whether that
      distribution was uneven. The strongest consideration in favor is the
      claim's reported pilot provenance, but an unaudited assertion without an
      evidence record does not create a directional lean.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E022 directly reports that kind-matching changed the lineup result,
      so it supports the claim as a statement of what the pilot found. It is,
      however, a self-report without the pilot data, rankings, or effect size,
      and the page notes incomplete runs and cropping constraints. Those
      unavailable comparisons are the strongest opposing consideration.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record reports an inter-judge agreement statistic or a
      direct comparison of the judges' ratings. DEEP-E022 concerns the effect
      of kind-matched controls and explicitly does not bear on judge agreement.
      The strongest consideration in favor is the allegation of disagreement
      in the claim's source material, but under the assessment rules that is
      not an evidence record and cannot decide the claim.