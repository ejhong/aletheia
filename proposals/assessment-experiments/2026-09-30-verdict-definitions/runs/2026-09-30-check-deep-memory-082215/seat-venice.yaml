  synthesis: >-
    This case is the founder's open question — how much of the cross-cultural resemblance belongs to a
    shared past and how much to convergence and retelling — and on the records as they stand the ledger
    does not lean, for a substantive reason: the evidence that would discriminate the candidate histories
    is precisely the evidence the ledger does not yet have. The records sort into three tiers. The first
    tier is primary and comparatively strong: the excavation team's own published statement that no final
    decision on the meaning of Pillar 43's three handled forms is possible (DEEP-E028, with Schmidt 2006's
    shape-only description behind it), the peer-reviewed relative sequence on Hoa Hakananai'a showing the
    birdman carvings postdate the statue (DEEP-E068/E069), and the Jiroft wear reading with its authors'
    explicit single-object caveat (DEEP-E035, E038). The second tier is the team's stated agnosticism:
    "far too many 'missing links'" to establish survival of early imagery into later Near Eastern objects
    (DEEP-E061/E062) — which documents the absence of the dated intermediates any transmission account of
    the local parallels needs. The third tier is self-report: the catalogue frequencies, the lineup result
    and the pilot findings are the founder's statements about her or his own unaudited experiments, with
    no coded data or run records in hand, and they carry only as the page's assertions. Steelmanning the
    featured hypothesis: its best asset is the reported lineup effect (62.5% vs 9%), which is quantitative,
    falsifiable and unrebutted here. Steelmanning the opposition: the methodological claims the ledger does
    support — resemblance underdetermines history (DEEP-C002, C026, C035), and no intermediate chain is
    established (DEEP-C072) — mean that even if the reported similarities are real, the records cannot yet
    say what produced them, and the retelling side is equally unevidenced (C034, C031, C054 unresolved).
    Hence unresolved, not as a default but as a finding: what the ledger establishes is underdetermination
    plus a missing-intermediates gap, and the decisive next records are the verified catalogue data, the
    blind human lineup rerun and the dated seal corpus named in the research agenda.
  steelman: >-
    The reported V1 lineup result (DEEP-E020/E021): claimed civiliser partners ranked first in 62.5% of
    completed lineups against a 9% random baseline — a large, falsifiable, cross-cultural effect that
    nothing in this ledger rebuts or explains away. The run data were never checked, no rival account of
    the rate (prompt artefact, shared modern retellings, chance in few completed lineups) is on the
    record, and the designed human blind rerun on source-level passages (DEEP-R003) has not been run. If
    that rate survives controls, it is exactly the quantitative signal of shared structured narrative
    content the featured hypothesis predicts, and this assessment offers no observation that accounts for it.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record in the ledger bears on this methodological claim; the basis I name is a point of
      method: any resemblance is compatible with several histories (independent invention, transmission,
      retelling), so dates, contexts, differences and candidate connections are needed before a historical
      explanation can be assigned. The strongest opposing consideration is that the universal framing
      ("no resemblance can be assigned... without those data") outruns what logic alone establishes,
      since some resemblances are explicable from resemblance plus minimal context; the claim is thus a
      background commitment of the discipline rather than a settled ledger result.
