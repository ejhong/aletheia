    reasoning: >-
      Material constraint (carving limbs against the body to protect them) is a plausible mechanical contributor to the hands-on-body pose; the claim is mechanistic common sense and is not contradicted by any record. No quantitative study of breakage rates appears in the ledger. Strongest opposing consideration is that symbolic programmes could fully determine the pose independently of material risk.
  - claimId: DEEP-C053
