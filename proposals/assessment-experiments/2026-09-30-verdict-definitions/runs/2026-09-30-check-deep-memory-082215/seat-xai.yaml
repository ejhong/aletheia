  synthesis: >-
    The ledger's evidence records leave the founding question—how much of the cross-cultural resemblances in bird-men, handled objects, navel names, feathered serpents, civilising teachers and flood stories records a shared deep past versus independent invention, material constraint, convergence or later retelling—unresolved as a whole. Methodological claims that resemblance alone cannot establish historical connection, transmission or lost-civilisation identity (C002, C026, C035, C065, C018) stand as the load-bearing structure: they are points of historical method and logic, reinforced by primary statements that the Göbekli Tepe forms have no secure functional identification (E028 deciding C012) and that missing intermediate links prevent any established survival of the site's imagery into later Near Eastern objects (E061/E062 deciding C072). The catalogue experiment's self-reported result that the three broad motif classes are each widespread yet their bundle does not stand out against documentation-preserving comparisons (C056/C057, qualified by E018/E019 on uneven coverage) further undercuts any claim that the specific gallery of images travels together as a diagnostic package. Shape descriptions of the Pillar 43 forms (E025) and the Jiroft wear reading (E035, qualified by the single-object caveat in E038) confirm observations without licensing functional or historical identity across millennia and oceans. Civiliser and flood pilots remain self-reports of unaudited runs (C027, C031, C054) whose rates and clusters cannot discriminate shared source from retelling; the Berossus fragments establish a fish-bodied civilising teacher (supporting parts of C053) but the modern Viracocha identification and navel-name equivalences lack primary source histories in the ledger. Image-pilot cautions (C038 supported weakly by E022; C037 without dedicated records) show that kind-matching and inter-judge disagreement alter perceived resemblance, weakening any inference from unaided visual inspection. No record supplies dated intermediates, shared sound/meaning for scripts, or builder-used navel designations that would tip the balance toward deep transmission; equally, no record falsifies the existence of the resemblances people notice. The case therefore remains open: the evidence warrants neither a positive deep-memory verdict nor a blanket dismissal of all long-range possibility, only the demonstration that current measurements and primaries do not decide the proportions. Sensitivity is highest to E028 (team statement of functional uncertainty); without it the handled-object leg of the pattern would rest solely on shape comparisons and founder captions, but the overall unresolved verdict survives because the missing-links and methodological records independently block strong transmission claims.
  steelman: >-
    The persistent first-rank rate of claimed civiliser partners in the V1 lineups (even if self-reported) together with the concrete shape matches of handled forms and bird-headed figures across widely separated sites still constitutes an unexplained observation that independent invention and material constraint have not quantitatively predicted or dissolved; a proponent can rightly note that the ledger contains no successful null model showing these specific constellations arise at the observed frequency by convergence alone.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      The claim is a statement of historical method: visual resemblance acquires meaning only through dates, contexts, differences and possible connections. No evidence record contradicts it; every primary retrieval (Schmidt on shape only, Dietrich on undecided meaning, Vidale on single-object wear) illustrates the principle in practice. Strongest opposing consideration would be a case in which resemblance alone had demonstrably licensed a secure historical link, but the ledger supplies none.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only the founder's self-report of the catalogue experiment asserts that the three-motif bundle does not stand out against documentation-preserving comparisons (E018/E019 merely qualify coverage and category breadth). The underlying coded data and comparison procedure were not retrieved, so the numeric or statistical result remains unaudited. Strongest opposing consideration is that uneven catalogue coverage could itself suppress a real bundle signal.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 62.5 % versus 9 % first-rank rates are reported solely by the founder's page (E020/E021); run data, incomplete-lineup counts and prompt texts were not retrieved. The result is therefore a self-reported experimental outcome of unknown robustness. Strongest opposing consideration is that AI lineup behaviour may simply reproduce training-data co-occurrence rather than any historical signal.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The mechanistic claim that stories converge through translation, borrowing and comparative writing is a documented process in textual transmission; Berossus's own multi-layered survival via Polyhistor and Syncellus (context in the F1 records) supplies a concrete instance of progressive reshaping. No ledger record shows the opposite (strict preservation of unique detail across retellings). Strongest opposing consideration is the absence of a side-by-side coding of earlier versus later versions for the specific civiliser or flood set under discussion.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Lost-civilisation claims about source identity, date and capabilities require evidence beyond motif similarity; the claim is true by the standards of historical inference and is reinforced by the excavators' insistence on missing links (E061/E062). No record offers a counter-example in which resemblance alone secured those stronger claims. Strongest opposing consideration would be a securely dated intermediate chain, which the ledger explicitly lacks.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographical distribution of a broad motif class is compatible with both independent invention and very old transmission under standard models; the claim is methodological and is directly illustrated by the team's statement that missing links leave survival unestablished (C072/E061). No record supplies a distribution that uniquely selects one history. Strongest opposing consideration is the theoretical possibility of a future phylogenetic method that could discriminate, but none is present in the ledger.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The assertion that the three broad classes are each widespread rests only on the founder's catalogue summary (qualified by E018/E019 on uneven coverage). Without the coded dataset the proportion and its robustness cannot be checked. Strongest opposing consideration is that "widespread" may be an artefact of the 2016 catalogue's sampling frame rather than a historical frequency.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 55 % bird-person figure is a self-report of the site's unaudited experiment (E013/E014); E015 and E018 further limit its interpretive reach and note uneven coverage. The underlying Berezkin & Duvakin coding was not retrieved. Strongest opposing consideration is that broad narrative categories inflate counts relative to the specific poses and objects people actually compare.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 37 % cosmic-serpent figure is likewise a self-report (E016), scoped by E017/E018 to the selected category and uneven catalogue. No independent tabulation exists in the ledger. Strongest opposing consideration is the same category-breadth problem that affects the bird-person baseline.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The interpretive claim that "bird-man" conflates deity-with-bird-head, feathered person and transforming person has no dedicated evidence record; it is anchored only to the founder's assertion. Whether the compared images fall into distinct categories is therefore untested by the ledger. Strongest opposing consideration is that some iconographic traditions may intentionally merge the three ideas, rendering the separation artificial.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract states that komari were added after manufacture and that bas-relief birdman carvings succeeded the komari (E068/E069), establishing the relative sequence statue → later carvings. Absolute dates and the full survey reasoning remain in the unread body. Strongest opposing consideration is that an abstract-only sequence could be revised by the paywalled analysis or by earlier documentation of the statue.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically separate; the claim is methodological and is enacted by the ledger itself when Schmidt describes "box-like objects with handle-like attachments" (E025) while the team refuses a functional decision (E028). No record equates the two. Strongest opposing consideration would be a case in which form uniquely determined function across the compared objects, which is not shown.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The secondhand transcription of Wiggermann (E055) states that the banduddû was filled with water and used to sprinkle in ritual, supporting a bucket-and-purifier reading. The transcription is unchecked against the printed page and the cone/purifier half is not in the quoted text. Strongest opposing consideration is transcription error or selective quotation on the blog.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The excavation team's own 2016 post states that a final decision on the meaning of the three forms is not possible (E028), matching the claim's truth condition exactly. Schmidt 2006 describes shape only (E025). Later team monographs were not retrieved, leaving a residual dating caveat, but the available primary statement is clear. Strongest opposing consideration is an unpublished or post-2017 team commitment to a container reading that has not entered the ledger.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Vidale & Micheli abstract reads the visible handle wear as evidence the object "was suspended for a long time on a cord" (E035), with the single-object caveat (E038) and the mere existence of wear traces (E034) as context. Body of the paper unread; object identity with the photographed specimen unconfirmed. Strongest opposing consideration is that the full wear analysis might favour a different mechanical cause.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Dietrich's comment-thread reply states there are "far to many ‘missing links’" to be sure of survival or of changes in meaning (E061/E062). The statement is informal yet comes from a team member and directly satisfies the claim. Strongest opposing consideration is that a more formal later publication might revise the agnostic stance, but none is in the ledger.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      The four navel expressions differ in language, date of first record and whether ancient builders used them; the claim is a methodological observation about non-interchangeable evidence types and requires no further empirical support beyond the existence of the distinct source histories themselves. No ledger record collapses the four into one kind. Strongest opposing consideration would be demonstration that all four were builder-used sacred designations in antiquity, which is absent.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record bears on the Turkish toponym's meaning; the founder's caption is unanchored and E024 addresses only the Kurdish names. Whether "Göbekli Tepe" is documented as descriptive of mound shape rather than sacred remains untested. Strongest opposing consideration is simply the lack of a toponymic primary.
  - claimId: DEEP-C047
    verdict: provisionally_supported
