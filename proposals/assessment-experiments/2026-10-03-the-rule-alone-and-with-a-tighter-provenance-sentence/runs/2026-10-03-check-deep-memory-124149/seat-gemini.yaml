  synthesis: >-
    The Deep Memory hypothesis proposes that widespread visual, lexical, and narrative resemblances across ancient societies—including bird-men, handled "handbag" containers, sacred navel designations, feathered serpents, and sea-borne civilising teachers—stem from a shared ancestral culture or deep prehistoric contact rather than independent convergent evolution or narrative retelling.

    Steelman for the hypothesis: Proponents highlight compelling visual and thematic alignments that span oceans and millennia. Three arched, handled containers sit atop Pillar 43 at Göbekli Tepe (c. 9000 BCE) in an arrangement strikingly reminiscent of the Assyrian banduddû buckets carried by apkallu and the handled incense pouches of Olmec iconography. In addition, the V1 civiliser lineup experiment (DEEP-C027) found that claimed cross-cultural mythological counterparts ranked first in 62.5% of completed runs compared to only 9% for random pairs, suggesting non-trivial narrative clustering.

    Counter-synthesis from the evidence: When subjected to granular archaeological and textual analysis, the transmission model receives only weak support and faces decisive contextual divergences. First, functional uniformity is contradicted: the Assyrian banduddû is textually attested as a ritual water-sprinkling bucket (DEEP-C044), the Jiroft chlorite object is an isolated specimen showing wear traces consistent with suspension on a cord (DEEP-C009), and the Göbekli Tepe excavators explicitly state that no functional determination is possible for Pillar 43's forms, which may depict architectural shrines rather than handheld items (DEEP-C012). Second, chronological coherence breaks down: the birdman petroglyphs on Hoa Hakananai'a were carved centuries after the statue's original manufacture to serve a local historical cult, ruling out an unbroken archaic transmission (DEEP-C059). Third, excavators note pervasive "missing links" across the archaeological record (DEEP-C072), while motif catalogues demonstrate that broad bird-person (55%) and cosmic-serpent (37%) motifs recur widely across unrelated traditions (DEEP-C005, DEEP-C025).

    Sensitivity: The single evidence record whose removal would most challenge this assessment is DEEP-E028 (the excavation team's statement that Pillar 43's forms remain functionally unresolved). Even without DEEP-E028, the verdict of weakly_supported survives intact, as the stratigraphic sequence on Rapa Nui (DEEP-E068, DEEP-E069) and the documented presence of fatal intermediate gaps (DEEP-E061) independently negate the hyperdiffusionist model.
  steelman: >-
    The precise compositional arrangement of three arched, handled boxes set directly above animal figures on Pillar 43 at Göbekli Tepe mirrors the specific structural juxtaposition of handled buckets and animal-associated sages in later Near Eastern and Mesoamerican relief art in a manner that simple universal basketry or bag utility does not intuitively explain.
