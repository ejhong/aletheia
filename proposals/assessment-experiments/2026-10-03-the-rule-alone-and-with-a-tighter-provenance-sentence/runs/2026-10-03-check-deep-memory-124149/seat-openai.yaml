  synthesis: >-
    Interpreting the featured hypothesis as the proposition that the cross-cultural bundle derives substantially from a shared deep past or long-distance transmission, rather than recurrent invention, local development, or later retelling, the admitted evidence does not presently discriminate among those explanations. The strongest positive item is DEEP-C027: DEEP-E020 and DEEP-E021 report that claimed civiliser partners won 62.5% of completed lineups against 9% for random pairs. That is a potentially relevant excess of resemblance, but it is an unaudited self-report with no run data, accounting of incomplete lineups, human replication, or source-level control for homogenising modern summaries. The records also provisionally support several local observations: wear interpreted as cord suspension on one chlorite object, uncertainty about the Göbekli forms' function, later addition of birdman reliefs to Hoa Hakananai'a, and a plausible textual relationship between Oannes and an apkallu tradition. These observations establish parts of the comparison but do not connect the cultures historically.

    The strongest case against treating the resemblances as evidence of a shared source is structural. DEEP-C012 is provisionally supported: the excavation team's own discussion declined a final functional identification of the Pillar 43 forms. DEEP-C044 has only weak, secondhand support for a specifically Assyrian ritual use, showing why similar outlines cannot simply be assigned the same function. DEEP-C072 records an excavation-team member's judgment that too many intermediate links are missing to establish survival into later imagery. DEEP-C038 further indicates, albeit only through a self-reported pilot, that matching comparison objects by kind changed a lineup result. These points jointly make selection effects, category breadth, and missing chronology serious alternatives.

    At the same time, the evidence does not contradict transmission. The potentially decisive catalogue claim that the three-motif bundle fails to stand out, DEEP-C057, is not actually evidenced by admitted result data; its attached records only state coverage and category limitations. The flood clustering, Genesis-detail distribution, and inter-judge disagreement claims likewise lack attached evidential results. No admitted record tests a securely dated, high-dimensional motif bundle against documentation-matched controls or supplies a chain of intermediates. The appropriate verdict is therefore unresolved, not contradicted and not positively supported.

    The single evidence record whose removal would most change the balance is DEEP-E020, because it contains the principal quantified result favoring non-random resemblance among the civiliser accounts. Removing it would weaken the positive side, but the case verdict survives: the remaining evidence would still neither establish a transmission chain nor provide a diagnostic controlled rejection of one.
  steelman: >-
    The decisive unanswered prediction is that the full high-dimensional bundle—bird-human imagery, handled forms, hands held against the body, sacred-centre language, sea-arriving civilisers, and structured flood details—will recur in securely dated source-level records along plausible contact routes substantially more often than in documentation-matched controls. None of the admitted evidence records performs that chronological bundle-level test.
