  - claimId: DEEP-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Although no evidence record is attached directly to DEEP-C065, DEEP-E025, attached to DEEP-C067, identifies the Pillar 43 forms only by shape as box-like and handle-like, while DEEP-E028, attached to DEEP-C012, says their meaning remains undecided. By contrast, DEEP-E055, attached to DEEP-C044, supplies a proposed ritual function for the Assyrian banduddû, albeit through a weak secondhand transcription. Together with the explicitly stated functional-morphology prior that outline does not logically determine use, these records support separating shape from function; the strongest opposing consideration is that this example does not show how independent the two variables are in every archaeological comparison.
