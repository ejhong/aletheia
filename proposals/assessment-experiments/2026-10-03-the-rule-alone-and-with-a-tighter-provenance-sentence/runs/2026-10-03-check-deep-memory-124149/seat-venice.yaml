    reasoning: >-
      No evidence record is attached to this claim; it is held on SRC-JHONG-2026
      alone, and a source is not evidence. As a prior, the methodological principle is
      standard in art-historical practice, but the ledger admits no observation
      demonstrating it. The strongest opposing consideration is that methodological
      claims of this kind may need no illustration to be actionable — but the rule for
      source-only claims governs here.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      Evidence records are attached (DEEP-E018, DEEP-E019, both carrying the author's
      own coverage and scope caveats toward DEEP-C005, DEEP-C025, DEEP-C056), but
      neither reproduces the comparative bundle result the claim asserts; the attached
      records only qualify how far other figures reach. The actual documentation-preserving
      comparison is not in evidence. The strongest opposing consideration is that the
      page's own summary sentence asserts the result, but that is the source speaking,
