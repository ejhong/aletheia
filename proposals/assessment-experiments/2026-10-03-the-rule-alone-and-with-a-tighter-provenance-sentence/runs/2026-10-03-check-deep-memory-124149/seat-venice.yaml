caseAssessment:
  verdict: unresolved
  loadBearing: [DEEP-C012, DEEP-C072, DEEP-C009, DEEP-C059]
  weakestLinks: [DEEP-C057, DEEP-C056, DEEP-C053, DEEP-C027, DEEP-C044]
  synthesis: >-
    The featured question — how much of the cross-cultural resemblance belongs to a
    shared past versus independent invention and retelling — receives no decisive
    answer from the admitted evidence, and that abstinence is itself the finding. What
    the ledger actually supports is object-level description plus the excavators' own
    epistemic position: the Göbekli team's statement that no final decision on the
    meaning of the three Pillar 43 forms is possible is the strongest record in the
    case (DEEP-E028, carrying DEEP-C012 well), and the team's comment-thread
    agnosticism about 'missing links' (DEEP-E061/E062, DEEP-C072) means the only
    contact-relevant statement in evidence is one of admitted non-establishment. The
    Jiroft cord-suspension reading (DEEP-C009) and the Hoa Hakananai'a relative
    sequence (DEEP-C059) are provisionally supported at abstract level with explicit
    caveats. The remaining supports are self-reports of the founder's own unaudited
    experiments (DEEP-C005, C025, C027, C038): they establish that the page states
    those numbers, not that the coded data reproduce them, and two of the four carry
    second-reader disputes about direction. Critically, every claim that would do
    diagnostic work — that distributions cannot separate transmission from invention
    (C026), that retelling converges (C034), that resemblance cannot establish a lost
    civilisation's specifics (C035), the navel-name source histories (C018, C015), the
    flood codings (C031, C054), and the bird-man category distinctions (C004) — has no
    admitted evidence record; a source is not evidence. Meanwhile the steelman for
    transmission, the specific shape match between Pillar 43's handled forms and
    Assyrian ritual objects, is documented on both ends (DEEP-E025, DEEP-E086/E055)
    and left standing: nothing in the ledger explains it away. Sensitivity: removing
    DEEP-E028 would drop DEEP-C012 from well_supported to weakly_supported and remove
    the case's only strong record, but the case verdict of unresolved survives, since
    it rests on the aggregate absence of any admitted transmission or convergence
    evidence, not on that one record.
  steelman: >-
    Schmidt's own first published description (DEEP-E025/E026) confirms three
    handle-like objects, each accompanied by an animal, carved on Pillar 43 around
    9000 BCE — a composition that visually parallels the later Assyrian pairing of
    the banduddû bucket with its purifier cone carried by fish-cloaked sages, whose
    bucket identity and water-sprinkling ritual use the ledger itself documents
    (DEEP-E086, DEEP-E055). No admitted evidence record offers any alternative reading
    of the Göbekli forms, the excavation team concedes no secure identification and
    too many missing links to exclude survival of imagery (DEEP-C012, DEEP-C072), and
    the Jiroft wear study shows such handled forms could be real functional objects
    worn by use. A proponent can rightly say the ledger contains a specific, dated,
    excavator-confirmed visual parallel that nothing currently explains as convergence
    or retelling.
claimAssessments:
  - claimId: DEEP-C002
