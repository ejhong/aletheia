  synthesis: >-
    The ledger's admitted evidence is sparse, heavily weighted toward self-reports
    from the founder's pages and a handful of primary or near-primary excerpts on
    local objects. Those primaries establish that the three arched forms on Göbekli
    Tepe Pillar 43 have no secure functional identification (DEEP-E028 deciding
    DEEP-C012), that a single Jiroft chlorite specimen shows handle wear the
    analysts read as long cord suspension (DEEP-E035 deciding DEEP-C009, qualified
    by the authors' own single-object caveat in DEEP-E038), that the birdman
    bas-reliefs on Hoa Hakananai'a post-date the statue (DEEP-E068/E069 deciding
    DEEP-C059), and that the excavation team itself treats any survival of Early
    Neolithic imagery into later Near Eastern objects as unestablished for want of
    intermediate links (DEEP-E061/E062 deciding DEEP-C072). Catalogue frequencies
    for broad bird-person and cosmic-serpent classes, the non-outstanding status of
    their bundle, and the civiliser-lineup rates are reported only by the founder
    pages themselves (DEEP-E013–E021, E018/E019); they are therefore weak, unaudited
    observations whose geographic coverage the same pages already flag as uneven.
    Methodological claims that resemblance alone never settles historical meaning,
    that shape and function are separate, or that stories can converge under
    retelling have no attached evidence records at all among the graded set and
    remain unresolved. The net result is that specific local facts (uncertain
    function at Göbekli, later addition of Rapa Nui birdmen, missing links) are
    provisionally or well supported, while the quantitative pattern claims that
    would let one weigh shared deep past against independent invention or later
    retelling rest on self-report or are absent. No evidence record supplies dated
    intermediates, secure cross-cultural transmissions, or controlled tests that
    would convert visual resemblance into historical connection; equally, none
    supplies a decisive demonstration that every parallel is pure convergence.
    Sensitivity: removal of DEEP-E028 would drop the strongest primary anchor for
    functional uncertainty at the most-cited handled-object locus and would force
    the case verdict to rest still more heavily on self-reports; even without it the
    remaining primaries and the absence of positive transmission evidence keep the
    overall question unresolved. The ledger therefore cannot yet quantify how much
    of the observed resemblance belongs to shared past versus the ordinary ways
    people make images, name places, and retell stories; the question stays open
    pending primary data that the research agenda already flags.
  steelman: >-
    The concrete visual co-occurrence of bird-headed or bird-cloaked figures with
    handled containers and frontal hands-on-torso poses at sites separated by
    oceans and millennia (Göbekli T-pillars, Assyrian apkallu, Olmec pouches,
    Rapa Nui bas-reliefs) remains an unexplained clustering that the catalogue's
    broad-class frequencies and the missing-link statements do not dissolve into
    demonstrated independent invention under any model yet admitted to the ledger.
