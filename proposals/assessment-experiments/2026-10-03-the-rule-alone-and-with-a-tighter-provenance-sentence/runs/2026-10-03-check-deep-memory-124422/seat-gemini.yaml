  synthesis: >-
    The featured hypothesis of Deep Memory investigates whether recurring iconographic motifs and narrative archetypes—such as therianthropic bird-men, handled bags or buckets, sacred navel toponyms, and civilising sages—reflect a genuine common ancestral tradition or prehistoric trans-oceanic transmission, rather than independent invention, material and cognitive convergence, or retrospective pattern-matching.

    Steelman for transmission: Proponents can emphasize the striking morphological specificity of compound symbolic motifs appearing across geographically distant cultures, such as the arched handled objects on Pillar 43 at Göbekli Tepe beside the Assyrian banduddû and Olmec pouches, as well as the composite fish-garbed civiliser Oannes. Furthermore, the V1 civiliser lineup experiment (DEEP-C027) indicates that claimed partner narratives ranked first in 62.5% of completed trials compared to 9% for random pairs, suggesting that civiliser mythic bundles share distinctive structural features that exceed random baseline noise.

    Steelman against transmission (convergence and local context): Detailed archaeological and textual records consistently dissolve these apparent global unities into disparate local chronologies and unrelated functions. The arched forms on Göbekli Tepe's Pillar 43 remain functionally uncertain and are plausibly interpreted as symbolic buildings rather than containers (DEEP-C012, DEEP-E028), while the excavation team explicitly observes that intermediate links across millennia are absent (DEEP-C072, DEEP-E061). On Rapa Nui, photogrammetric analysis reveals that the birdman reliefs on Hoa Hakananai'a are secondary additions carved centuries after the statue's initial fabrication, firmly anchoring them in a late local ethnohistoric development rather than an archaic global horizon (DEEP-C059, DEEP-E068). Moreover, 13 of the 25 target claims lack admitted evidence records, and admitted textual claims regarding Mesopotamian ritual practice rest on secondary blog transcriptions or abstract-level summaries.

    Sensitivity: The single evidence record whose removal would most change this case verdict is DEEP-E020, which provides the sole positive statistical result favoring non-random civiliser pairings. If DEEP-E020 were removed, the case verdict of weakly supported would easily survive, leaning even more strongly toward contradicted, because the remaining verified archaeological evidence consistently demonstrates contextual independence, functional divergence, and vast chronological chasms.
  steelman: >-
    The recurring co-occurrence of the specific arched handled-container motif alongside therianthropic avian and animal figures across both Old and New World ceremonial contexts (e.g., Göbekli Tepe Pillar 43, Neo-Assyrian palace reliefs, and Olmec La Venta Monument 19) presents an unexplained compound iconographic isomorphism that simple utilitarian convergence does not fully resolve.
