  synthesis: >-
    Read as a body, the admitted evidence supports no verdict on the founding question — whether the
    cross-cultural resemblances record a shared past — and that indecision is itself the substantive
    finding. The case's primary anchors are real but narrow: the excavation team's own statement that no
    final decision on the Pillar 43 forms is possible (DEEP-E028, strong), the Vidale & Micheli abstract
    reading the Jiroft handle wear as long suspension on a cord with an explicit single-object caveat
    (DEEP-E035, DEEP-E038), and the Pitts et al. abstract sequence statue-then-komari-then-bas-reliefs on
    Hoa Hakananai'a (DEEP-E068, DEEP-E069). None of these bears directly on transmission versus
    independent invention; they establish observations, not a historical chain. The pieces that would bear
    on the hypothesis are almost entirely self-reports of the founder's own unaudited experiments — the 55%
    and 37% catalogue frequencies (DEEP-E013, DEEP-E016), the "bundle does not stand out" result
    (DEEP-E018, DEEP-E019), the 62.5%-versus-9% lineup result (DEEP-E020, DEEP-E021), and the
    kind-matching pilot (DEEP-E022) — each admitted only as the page's statement of its own result, with
    method and data not retrieved. Steelmanning the sceptical side: the only admitted result about the
    motif bundle is negative (it does not stand out), and the excavators state there are too many missing
    links to establish continuity — so no admitted record documents a single dated intermediate. Steelmanning
    the proponent side: the lineup signal is large and unrebutted. Fourteen of the twenty-five graded claims
    carry no evidence record at all and are held on their source alone, including every navel-name claim,
    the flood-coding results, and the core methodological principles. The case is genuinely, and
    measurably, unresolved on its central question while being mixed in the weak structure it has built.
  steelman: >-
    The V1 civiliser lineup result (DEEP-E020, DEEP-E021): claimed partner figures ranked first in 62.5% of
    completed lineups against 9% for random pairs — a roughly seven-fold excess that no admitted evidence
    record explains away. The ledger's convergence claim (DEEP-C034) that compressed modern retellings
    could manufacture this similarity carries no admitted evidence, so a proponent can rightly say the
    strongest admitted quantitative result in the case is a positive signal of structured similarity across
    the civiliser narratives that this assessment has not answered, only declined to weight because the run
    data are unretrieved self-reports.
