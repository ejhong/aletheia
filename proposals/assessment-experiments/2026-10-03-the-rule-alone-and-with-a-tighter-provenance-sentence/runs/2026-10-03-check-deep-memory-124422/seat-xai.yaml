  synthesis: >-
    The ledger's admitted evidence consists largely of the founder's own unaudited experiment self-reports (catalogue frequencies, civiliser lineups, image pilots) plus a handful of primary or near-primary fragments (Schmidt 2006 on Pillar 43 forms, Dietrich team posts on function uncertainty and missing links, Vidale & Micheli abstract on Jiroft wear, Pitts et al. abstract on Hoa Hakananai'a sequence, Verbrugghe/Wickersham Berossus fragments and table, and a secondhand Wiggermann transcription on banduddû). These do not establish a shared deep-past source, long-distance contact chain, or lost-civilisation capabilities for the bird-men, handled objects, navel names, feathered serpents, civilisers or flood stories. Instead they document that broad motif classes (bird-person ~55 %, cosmic-serpent ~37 %) are already widespread in the sampled catalogue, that their three-way bundle does not stand out against documentation-preserving controls, that the Göbekli handled forms have no secure functional identification from the excavation team, that any survival of Early Neolithic imagery into later Near Eastern objects remains unestablished for want of intermediate links, that the Jiroft chlorite handle shows wear read as long cord suspension (single-object caveat), and that the birdman bas-reliefs on Hoa Hakananai'a post-date the statue. Methodological cautions internal to the founder pages (resemblance requires dates/contexts/differences; catalogue geography alone cannot separate invention from old transmission; visual sign resemblance does not give sound/meaning/descent; stories converge under translation and comparative writing) are consistent with the pattern of results but rest on logic or unattached sources rather than new measurements. The civiliser lineup rate (claimed partners first in 62.5 % of completed runs versus 9 % random) and the image-pilot finding that kind-matching alters rankings are the strongest quantitative hints of non-random structure, yet both are self-reports of incomplete AI runs whose data and prompts are not in the ledger; they cannot carry a transmission claim. Berossus F1 supplies a fish-bodied civilising teacher whose form is said to survive in sculpture and who is tabulated beside U-An of the apkallu list, giving a local Mesopotamian textual-iconographic match of moderate strength, but nothing that bridges to Tiwanaku, Mesoamerica or Rapa Nui. Overall the evidence warrants a mixed verdict on the founding question: some resemblances are real and a few local continuities or story templates are provisionally attested, yet the same records repeatedly undercut the inference from resemblance to shared deep past, leaving independent invention, material constraint, later retelling and the human tendency to notice patterns as the better-supported default for the majority of the distant parallels. The case remains open precisely because the decisive intermediates, full experiment data and primary wear/ritual monographs are still absent.
  steelman: >-
    The V1 civiliser lineup result that claimed partner figures ranked first in 62.5 % of completed lineups against 9 % for random pairs remains an unrebutted quantitative observation of structural similarity across the Oannes–Viracocha–Quetzalcoatl–Bochica set that independent invention alone has not yet explained away with matched controls on compressed modern retellings.
