  synthesis: >-
    The admitted evidence does not resolve whether the cross-cultural resemblances highlighted by Deep Memory derive from a shared ancient source rather than convergence, later borrowing, retelling, or selective comparison. The strongest positive result is the reported civiliser-lineup contrast in DEEP-C027: claimed partners allegedly ranked first in 62.5% of completed lineups against 9% for random pairs. That is potentially diagnostic, but DEEP-E020 and DEEP-E021 are only the project's self-report; the run data, completion rate, source passages, control construction, and replication are absent. The Oannes material also supplies a real local correspondence: DEEP-C053 is provisionally supported by the fish-bodied human description in DEEP-E075 and the secondary Oannes–U-An/apkallu alignment represented by DEEP-E079, attached to DEEP-C086. Even so, the packet never directly establishes that the relevant Assyrian fish-cloaked image is the textual type in question, much less that distant civiliser traditions descend from it.

    The evidence leaning against a deep common-source interpretation is cautionary rather than dispositive. DEEP-C072 is provisionally supported by an excavation-team member's statement that too many intermediate links are missing to establish survival of Göbekli Tepe imagery into later periods. DEEP-C012 is well supported locally: the excavation team had not securely identified the function of Pillar 43's three forms. This blocks an inference from their outline to a shared “handbag” function, but it does not prove independent invention. DEEP-C038 reports that kind-matched controls changed an image-lineup result, showing that comparison-set construction may generate apparent distinctiveness; however, this too is an unaudited project self-report. The potentially important claim that the three-motif bundle does not stand out, DEEP-C057, remains unresolved because its attached records document limitations without presenting that result or its analysis.

    Steelmanning the hypothesis, the packet contains recurring visual and narrative similarities plus a reported lineup signal that could become significant if reproduced from primary descriptions under blind, well-matched controls. Steelmanning alternatives, broad bird-person and serpent categories are asserted to be common, individual objects have locally different or uncertain functions, image judgments depend on controls, and no dated transmission chain is admitted. Local findings therefore neither aggregate into a demonstrated shared source nor decisively refute one.

    The single evidence record whose removal would most change the evidential balance is DEEP-E028, the strongest direct record establishing that the Pillar 43 forms lacked a secure functional identification. Removing it would reopen a central handled-object comparison, but the case verdict survives: the missing transmission chain, unaudited statistical reports, and unresolved bundle analysis would still leave the featured hypothesis unresolved.
  steelman: >-
    The strongest unanswered proponent argument is that broad catalogue categories may wash out a genuinely rare conjunction of fine-grained features: bird-human figures, similarly placed handled forms, hands meeting on a stone body, and closely structured civiliser narratives. The ledger has not tested that conjunction against preregistered, chronologically and geographically matched controls or searched systematically for dated intermediates, so a distinctive transmission signal at the specific-feature level remains unaddressed.
