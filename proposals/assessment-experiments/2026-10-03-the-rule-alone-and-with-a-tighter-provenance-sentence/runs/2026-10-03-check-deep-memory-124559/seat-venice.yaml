caseAssessment:
  verdict: unresolved
  loadBearing: [DEEP-C012, DEEP-C059, DEEP-C009, DEEP-C027]
  weakestLinks: [DEEP-C057, DEEP-C053, DEEP-C054, DEEP-C031, DEEP-C005]
  synthesis: >-
    The featured question is whether cross-cultural resemblances — bird-men, handled objects,
    navel names, civilisers, floods — belong to a shared past or to convergent human habits, and
    the honest finding of this run is that the admitted ledger does not yet adjudicate between
    those histories. On the positive side for a shared past, the only quantified evidence is the
    founder's own experiments: the catalogue frequencies (DEEP-C005, DEEP-C025, via DEEP-E013,
    DEEP-E014, DEEP-E016) and the civiliser lineup result of 62.5% versus 9% (DEEP-C027, via
    DEEP-E020, DEEP-E021). All are self-reports of unaudited runs with the underlying data not
    retrieved, so they are weakly supported at best; and the 55% and 37% figures are explicitly
    non-diagnostic, since a broad-category distribution cannot by itself separate transmission
    from invention. The claims that would do the discriminating work — that retellings converge
    (DEEP-C034), that distributions underdetermine history (DEEP-C026), that Genesis-linked
    details pattern unevenly (DEEP-C054), that flood details cluster by region (DEEP-C031), and
    that the motif bundle does not stand out (DEEP-C057) — are all held on source alone with no
    admitted evidence record. What the ledger does establish securely is observational scaffolding:
    the Göbekli Tepe team's own refusal to identify the Pillar 43 forms (DEEP-C012, DEEP-E028),
    the relative carving sequence on Hoa Hakananai'a (DEEP-C059, DEEP-E068/E069), and the Jiroft
    wear reading with its single-object caveat (DEEP-C009, DEEP-E035/E038). None of these bears on
    the shared-past question; the first two in fact remove putative anchors (a secure function for
    the Göbekli forms; a manufactured, undatable birdman relief). Steelmanning the skeptic side:
    the strongest evidenced facts in this ledger are all cautions and uncertainties, and the
    founder's positive statistics rest on one self-published source. Steelmanning the proponent:
    nothing in the ledger rebuts the lineup result either. Verdict: unresolved — a substantive
    finding that the case's central question is currently open because the ledger's admitted
    evidence is dominated by non-diagnostic self-reports and methodological claims held on source
    alone, while the few well-supported claims concern objects' descriptions and sequences rather
    than the resemblance question itself.
  steelman: >-
    The V1 civiliser lineup result (DEEP-C027): claimed partners ranked first in 62.5% of
    completed lineups against 9% for random pairs. If that rate is reproducible on source-level
    passages with human raters — the control experiment DEEP-R003 proposes but which has not run —
    it would be a quantitative, above-chance cross-continental pairing of the civiliser narratives
    that neither of this assessment's supported alternatives (independent invention, documented
    retelling convergence) has been shown to produce, and the ledger contains no record
    demonstrating that translation, borrowing or comparative writing can generate that level of
    structured similarity (DEEP-C034 is unevidenced).
claimAssessments:
  - claimId: DEEP-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; it is held on SRC-JHONG-2026 alone. The
      ledger's admitted records illustrate the principle in practice — DEEP-E028 (attached to
      DEEP-C012) shows the excavators declining a functional identification, DEEP-E035 and
      DEEP-E038 (attached to DEEP-C009) show a wear reading scoped by its context — but nothing
      tests the principle as stated. It is a plausible methodological prior, and I hold it as a
      prior, not as a finding.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The records citing this claim, DEEP-E018 and DEEP-E019, only qualify the catalogue's uneven
      coverage and its broad categories; no admitted record reports the documentation-preserving
      comparison outcome itself. The site's statement that the bundle "does not stand out" is a
      self-report of a negative result whose data are not in hand, so the claim's truth condition
      is untested.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 record the site's own report of both rates, which is direct but
      self-reported and unaudited; the run data and the enumeration of "completed lineups" were
      not retrieved. The strongest opposing consideration is that similarity between civiliser
      accounts could be manufactured by compressed modern retellings — the page's own stated
      limitation and the target of DEEP-R003 — and the ledger contains no evidence on that
      alternative (DEEP-C034 is unevidenced).
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-R003 proposes a test of exactly this
      convergence mechanism, but nothing in the ledger documents a retelling whose details
      converged relative to earlier attested versions. The mechanism is plausible as a prior and
      is widely attested in textual scholarship generally, but that is a prior, not ledger
      evidence.
  - claimId: DEEP-C035
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The admitted similarity-level results
      (DEEP-E013, DEEP-E016, DEEP-E020, DEEP-E021) are all catalog or lineup statistics whose
      interpretive reach is not tested by any record, and the methodological point that
      resemblance alone cannot establish a source's identity, date and capabilities is asserted
      only by the founding source. Reasonable as a prior; unresolved as a graded claim.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E061 and DEEP-E062, attached to
      DEEP-C072, record the excavation team's "missing links" agnosticism about continuity from
      Göbekli Tepe imagery, which is consistent with the claim but does not demonstrate that a
      single geographical distribution is compatible with both histories under stated models.
      The compatibility claim needs a model or a worked example, and the ledger has neither.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two of the three classes are supported only by the site's self-reported frequencies:
      DEEP-E013 and DEEP-E014 (attached to DEEP-C005, 55% bird-person) and DEEP-E016 (attached to
      DEEP-C025, 37% cosmic-serpent). No admitted record gives any figure for the sacred-centre
      class, and DEEP-E018 and DEEP-E019 qualify coverage as uneven, particularly for the ancient
      Near East and Rapa Nui. Widespreadness of all three is therefore only weakly carried.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 record the page's statement of the 55% figure, but as the editors
      note this is a self-report of the author's own unaudited experiment with the underlying
      Berezkin & Duvakin catalogue and method page not in hand. DEEP-E015, DEEP-E018 and
      DEEP-E019 qualify rather than support: the figure is a broad-category baseline over uneven
      coverage. The claim's own truth condition — that the coded data reproduce the proportion —
      cannot be checked from the ledger.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Same footing as DEEP-C005: DEEP-E016 is the site's self-report of the 37% figure, with
      method and data not retrieved, and DEEP-E017 explicitly scopes the result to the sampled
      catalogue and category rather than confirming the number. The strongest opposing
      consideration is that the entire quantitative basis is one self-published page whose
      coding cannot be audited from the ledger.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The Hoa Hakananai'a records (DEEP-E068
      through DEEP-E072, attached to DEEP-C059 and DEEP-C080) document one specific birdman
      tradition in detail, and DEEP-E081 (attached to DEEP-C021) sharpens a gesture distinction,
      but no admitted record classifies the compared images into the three proposed categories or
      shows the label grouping distinct ideas. The distinction is plausible as a prior; it is not
      evidenced here.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 record the peer-reviewed Pitts et al. abstract's relative sequence
      — original statue, then komari added, then bas-relief carvings succeeding them — which is
      exactly the claim that the birdman carvings postdate the statue's manufacture. The
      strongest opposing consideration is that only the abstract was read (the body is paywalled)
      and the sequence is relative, with no absolute dates; but the claim as stated is relative,
      so this does not undercut it.
  - claimId: DEEP-C065
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E028 (attached to DEEP-C012) and
      DEEP-E035 with DEEP-E038 (attached to DEEP-C009) respectively show a refused functional
      identification for the Göbekli forms and a context-limited functional reading for the Jiroft
      piece, which together illustrate the shape/function separation but do not state or test the
      methodological principle. Held on source alone, plausible as a prior.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 records the Wiggermann passage on the banduddû being filled with water and used
      to sprinkle, which is the ritual content the claim needs, but it reaches the ledger only
      through an unchecked secondhand blog transcription with visibly garbled transliterations.
      The cone/purifier half of the claim is explicitly not in the transcribed text, and the
      primary (Wiggermann 1992, p. 66) is unread, so both the identification and the purifier
      reading rest on one weak channel.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 records the excavation team's own published statement that "a final decision on
      the meaning of these images" is not possible at the moment, which is precisely what the
      claim asserts about the absence of a secure functional identification. The strongest
      opposing consideration is that this is a 2016/2017 blog post rather than a monograph, and
      later team publications targeted by DEEP-R005 have not been checked; the same post did
      offer a building reading, so the uncertainty is the team's considered position rather than
      ignorance.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the Vidale & Micheli abstract stating that the strong wear suggests the
      hand-bag was suspended for a long time on a cord, which meets the claim's truth condition
      that the published wear study reports such wear. The authors' own caveat (DEEP-E038) that
      the inference rests on a single object and is far from granted, the abstract-only reading,
      and the unconfirmed identity of the object with the photographed one are why this is
      provisional rather than established.
  - claimId: DEEP-C072
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E061 and DEEP-E062 quote the team member's own words that there are "far to many
      'missing links'" to be sure of survival or of changes in meaning, which is the agnostic
      position the claim states. It is, however, a comment-thread reply rather than a formal
      publication, with informal wording, and it could be superseded by later team statements
      that the ledger has not checked.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E024 (attached to DEEP-C016) bears only
