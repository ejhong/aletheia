  synthesis: >-
    The ledger's admitted evidence records leave the founding question of Deep Memory — how much of the cross-cultural resemblances in bird-men, handled objects, navel names, feathered serpents, civilisers and floods records a shared past versus convergence, independent invention or later retelling — substantially open. Primary and near-primary sources establish several local observations with moderate to high reliability: Schmidt 2006 and the Dietrich 2016 Tepe Telegrams post confirm that the three upper-register forms on Göbekli Tepe Pillar 43 are box-like objects with handle-like attachments whose function the excavation team itself declines to decide (DEEP-E025, DEEP-E028), while Vidale & Micheli's abstract reports wear traces on a Jiroft chlorite handbag consistent with prolonged cord suspension yet immediately caveats the inference as single-object (DEEP-E034, DEEP-E035, DEEP-E038). Pitts et al. 2014 abstract establishes that the birdman bas-reliefs on Hoa Hakananai'a post-date the statue's manufacture and form a composition read against nineteenth- and twentieth-century ethnohistoric birdman myth (DEEP-E068, DEEP-E069, DEEP-E071). Berossus F1 via Verbrugghe & Wickersham supplies the fish-body-plus-human-head description of Oannes and the civilising curriculum, with the translators' table aligning Oannes to the first apkallu U-An (DEEP-E043/E075, DEEP-E046, DEEP-E079). These observations anchor specific claims about shape, sequence, wear and textual identity, yet none supplies dated intermediate links, shared manufacturing techniques, or statistical excess of co-occurrence that would favour deep transmission over independent production of similar forms. The catalogue experiment self-reports (bird-person 55 %, cosmic-serpent 37 %, three classes widespread but their bundle non-distinctive under documentation-preserving controls) and the V1 civiliser lineup (claimed partners first in 62.5 % versus 9 % random) remain unaudited founder-page statements whose underlying data and coding are not in the ledger; they therefore function only as weak, scoped baselines. Image-pilot findings that kind-matching alters rankings further undercut uncritical visual matching. Methodological claims that resemblance alone cannot establish historical meaning, that catalogue geography cannot separate invention from ancient transmission, and that stories converge under retelling are left without attached evidence records and therefore unresolved. The net result is a set of well-localised facts about individual objects and texts that neither confirm nor refute a common deep source; the proportion of shared past versus the ways people make images and seek connections stays unresolved pending intermediates, full primary texts, and independent replications. Removal of the single strongest team statement on functional uncertainty would most weaken the handled-object cluster, yet even then the remaining wear and shape records would still leave transmission unproven. Prior background knowledge of widespread independent animal-human hybrids and flood motifs calibrates plausibility of convergence but is not used as decisive evidence.
  steelman: >-
    The V1 civiliser lineup's 62.5 % first-rank rate for claimed partner pairs (versus 9 % random) remains an unrebutted quantitative signal of non-chance narrative similarity that no admitted control or source-audit fully explains away, and that a proponent can rightly treat as a prediction still awaiting blind human replication on uncompressed originals.
