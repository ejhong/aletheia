      DEEP-E035 confirms that Vidale and Micheli's 2012 study interpreted visible handle wear on the Jiroft chlorite 'handbag' as evidence of prolonged suspension from a cord. DEEP-E038 explicitly registers the authors' limitation that this deduction is based on a single object and remains unproven for the class. The strongest opposing consideration is that the analysis is based solely on the paper's abstract, without access to the microscopic trace data published in the body.
