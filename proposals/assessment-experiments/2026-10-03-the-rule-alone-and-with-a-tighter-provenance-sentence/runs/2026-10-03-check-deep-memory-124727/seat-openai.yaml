  synthesis: >-
    The featured shared-past hypothesis remains unresolved because the admitted
    evidence establishes several local observations but does not discriminate a
    common distant source from independent invention, ordinary regional
    transmission, or later retelling. The strongest case for shared history is
    that the reported civiliser lineup produced a large contrast between claimed
    and random partners: DEEP-E020 and DEEP-E021 report 62.5% and 9%,
    respectively. In addition, the evidence surrounding Oannes combines a
    fish-bodied description with a secondary scholarly alignment to U-An in an
    apkallu list. These observations make patterned resemblance a legitimate
    subject of investigation rather than something that can be dismissed merely
    because cultures are distant. The later addition of the Hoa Hakananai'a
    birdman reliefs, supported by DEEP-E068 and DEEP-E069, also illustrates that
    chronology can be resolved locally and need not remain wholly impressionistic.

    The strongest case against treating those resemblances as evidence of one
    deep source is structural. The catalogue frequencies and civiliser lineup
    are self-reported results whose underlying data, coding, incomplete runs,
    and analysis were not retrieved. DEEP-E018 and DEEP-E019 further record
    uneven catalogue coverage and the mismatch between broad narrative
    categories and the specific images or names at issue. DEEP-E022 reports
    that matching object kinds changed an image-lineup result, showing that at
    least one apparent comparison was sensitive to control selection. Most
    importantly, DEEP-E061 and DEEP-E062 record an excavation member's view
    that too many intermediate links are missing to establish survival of
    Göbekli Tepe imagery or changes in its meaning. That is not evidence that
    continuity did not occur, but it leaves the required transmission chain
    unestablished.

    Local identifications must not be inflated into the global hypothesis. The
    Jiroft wear study supports suspension of one object on a cord; it does not
    connect that object to Göbekli Tepe or Assyria. The Pillar 43 evidence
    supports handle-like shape while leaving function undecided. The
    Oannes–apkallu material concerns relationships inside a Mesopotamian textual
    and iconographic setting, not a chain to Tiwanaku, Rapa Nui, or Mesoamerica.
    Conversely, the evidence does not establish independent invention or
    disprove an undocumented shared past. The appropriate result is therefore
    unresolved, not contradicted and not positively supported.

    The single evidence record whose removal would most change this case
    assessment is DEEP-E061, because it is the clearest admitted statement that
    the proposed continuity lacks intermediate links. The unresolved verdict
    survives without it: no admitted record supplies a dated interregional
    transmission sequence, and the principal quantitative findings remain
    unaudited self-reports with acknowledged control and coverage limitations.
  steelman: >-
    The ledger never tests the strongest proponent prediction: that a
    preregistered, blindly coded conjunction of specific low-level features,
    rather than broad labels such as bird-person or serpent, recurs across the
    distant complexes at a rate that independent invention and documented later
    borrowing cannot reproduce.
