caseAssessment:
  verdict: mixed
  loadBearing: [DEEP-C012, DEEP-C009, DEEP-C059, DEEP-C027, DEEP-C005]
  weakestLinks: [DEEP-C057, DEEP-C044, DEEP-C037]
  synthesis: >-
    The ledger divides into three tiers that pull the case in different directions. The first tier rests on primary or near-primary records: DEEP-C012 is well supported by DEEP-E028, the excavation team's own statement that no final decision on the meaning of the three Pillar 43 forms is possible; DEEP-C009 is provisionally supported at abstract level by DEEP-E035, narrowed by the authors' own single-object caveat in DEEP-E038; DEEP-C059 rests on DEEP-E068 and DEEP-E069, a peer-reviewed relative sequence read only at abstract level; DEEP-C072 is carried by the excavator's informal "missing links" reply. The second tier is the founder's own experiments: the 55% (DEEP-C005), 37% (DEEP-C025), and 62.5%-versus-9% (DEEP-C027) figures and the kind-matching result (DEEP-C038) are admitted only as self-reports of unaudited runs whose data and methods were never retrieved, so they earn provisional support at most. The third tier is the largest and most consequential: thirteen claims — including every methodological claim that would discriminate transmission from independent invention or retelling (DEEP-C002, DEEP-C026, DEEP-C034, DEEP-C035), the navel source-history claims (DEEP-C015, DEEP-C018), and the catalogue's central negative finding that the motif bundle does not stand out (DEEP-C057) — hold on their source alone, with no admitted evidence record. For the featured hypothesis, that some cross-cultural resemblances belong to a shared past, nothing admitted bears directly in either direction; the ledger's strongest actual finding is a well-supported uncertainty. Sensitivity: DEEP-E028 is the single record whose removal would most change the case — it is the only strong, primary-anchored support in the ledger, and without it DEEP-C012 falls to unresolved and the case rests entirely on abstracts and self-reports; the mixed verdict would survive on the remaining records, but with lower confidence and no well-supported claim anywhere in the file.
  steelman: >-
    The ledger's own admitted records concede the contact account its opening: DEEP-E035 admits, from the primary wear-trace study, that a handled chlorite object really was suspended on a cord for a long time, while DEEP-E028 records the Göbekli Tepe team formally refusing to identify the Pillar 43 forms' function — so on the current record no one has shown the handled-object resemblance to be a functional coincidence, and the excavators themselves (DEEP-E061, DEEP-E062) concede that survival of Early Neolithic imagery into later periods cannot be excluded, only that the intermediate links are missing. A proponent can rightly say the strongest published scepticism on record is agnosticism, not disproof, and that no admitted evidence in this ledger demonstrates independent invention for any single parallel in the case.
claimAssessments:
  - claimId: DEEP-C002
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; it holds on its source alone. As a prior it is close to axiomatic in art-historical method, but the ledger contains no admitted instance of a resemblance changing its historical meaning once dates, contexts or connections were established. The nearest records, DEEP-E025 and DEEP-E028 attached to DEEP-C067 and DEEP-C012, show an excavator describing shape while withholding functional meaning, which is consistent with the principle but neither states nor tests it. The strongest opposing consideration is that the claim is methodological and may not need a worked instance to be reasonable — but a prior is not evidence.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      DEEP-E018 and DEEP-E019 are attached to this claim (also to DEEP-C005, DEEP-C025 and DEEP-C056), but both carry direction "qualifies" and state only coverage and category limitations; no admitted record states the bundle-comparison finding itself. The source anchor quote asserts the result, but a source is not evidence. The strongest opposing consideration is that the limitation records presuppose the comparison was run, yet presupposition is not the observation.
  - claimId: DEEP-C027
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 support the two figures, but only as the site's statement of its own unaudited experiment; the run data are not retrieved and "completed lineups" implies an unstated denominator of incomplete runs. The strongest opposing consideration is self-report bias: an AI-lineup result of exactly 62.5% against a 9% chance baseline has never been checked by anyone but the site's author.
  - claimId: DEEP-C034
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim, and its child DEEP-C083 also has none. As a prior, historical philology widely documents convergence of detail through translation and borrowing, but that background is stated here as a prior, not as ledger evidence. The strongest opposing consideration is that the claim requires documented retellings showing convergence, and the ledger has admitted no such documentation.
  - claimId: DEEP-C035
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. As a prior it is nearly analytic — resemblance cannot by itself fix a source's identity, date and capabilities — but the ledger includes no worked instance showing what extra evidence a lost-civilisation account would need. The strongest opposing consideration is that a methodological truism may not require observation, yet the verdict rules require more than a prior for support.
  - claimId: DEEP-C026
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E061 and DEEP-E062, attached to DEEP-C072, record the excavators' "missing links" caution, which motivates the underdetermination point but does not test whether a single geographical distribution is compatible with both histories under stated models. The strongest opposing consideration is that the claim is a modelling statement that could in principle be shown by a simple formal demonstration, none of which is in the ledger.
  - claimId: DEEP-C056
    verdict: mixed
    confidence: low
    reasoning: >-
      Two of the three classes are attested: DEEP-E013 and DEEP-E014, attached to DEEP-C005, give 55% for bird-person motifs, and DEEP-E016, attached to DEEP-C025, gives 37% for cosmic serpents — both self-reported and weak. The sacred-centre class has no frequency record at all, and DEEP-E018 and DEEP-E019 qualify all three with the catalogue's uneven coverage. The strongest opposing consideration is that the claim's truth condition is met for only part of its scope, and only on the author's own word.
  - claimId: DEEP-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 support the 55% figure, but only as the page's statement of its own result; the underlying Berezkin & Duvakin catalogue and the method page were not retrieved, and DEEP-E015, whose direction the second reader disputed, plus DEEP-E018 record the author's own coverage caveats. The strongest opposing consideration is that the claim's truth condition — that the coded data reproduce the proportion — has never been checked against the data.
  - claimId: DEEP-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E016 supports the 37% figure as a self-report of the site's own analysis, and DEEP-E017 and DEEP-E018 qualify its reach; the method and coded data are not in hand. The strongest opposing consideration is identical to DEEP-C005's: the number exists only as the author's report of his own unaudited experiment.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. As a prior, the distinction between a bird-headed deity, a feather-wearing person and a transforming person is a standard iconographic caution, but the ledger has admitted no observation showing the compared images falling into different categories. The Hoa Hakananai'a records (DEEP-E068 through DEEP-E071, attached to DEEP-C059, DEEP-C062 and DEEP-C080) show one birdman tradition in detail, which is consistent with the categories being distinct but does not demonstrate it. The strongest opposing consideration is that this consistency suggests, but never establishes, the claimed heterogeneity.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069, from a peer-reviewed study, record the relative sequence statue then komari then bas-reliefs, which is exactly the ordering the claim asserts. The limitations carry: only the abstract was read, the sequence is relative with no dates, and the interpretation is the authors' own. The strongest opposing consideration is that the paywalled body might qualify the sequencing, though nothing in the record suggests it does.
  - claimId: DEEP-C065
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. DEEP-E028, attached to DEEP-C012 and DEEP-C066, illustrates the separation — the team describes shape while refusing a functional identification — but it does not state the methodological principle, and the founder's source anchor for this claim even quotes the bucket-purifier sentence rather than the principle. The strongest opposing consideration is that DEEP-R005 is designed to test whether later team publications commit to a function, which would bear on the claim indirectly.
  - claimId: DEEP-C044
    verdict: mixed
    confidence: low
    reasoning: >-
      DEEP-E055 supports the bucket half: the transcribed Wiggermann passage states the banduddû was filled with water in rituals and used to sprinkle. But the purifier (cone) half of the claim is absent from the transcribed text, the transcription is secondhand on a blog with garbled transliterations, and the printed page of Wiggermann 1992 was never read. The strongest opposing consideration is that the entire basis is an unchecked transcription, so even the supported half is fragile.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is strong support: the excavation team's own published statement that "a final decision on the meaning of these images" is not possible, which is precisely the claim's truth condition. The limitations carry — it is a team blog post dated 2016/2017, and later team publications (DEEP-R005's target) were not checked. The strongest opposing consideration is that a post-2017 team publication could have committed to an identification, converting this well-supported claim into a snapshot.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 records the study's abstract-level reading that the wear suggests long suspension on a cord, meeting the claim's truth condition, while DEEP-E038 carries the authors' own caveat that the inference rests on a single object and is "far from being granted", and DEEP-E034 was downgraded to context. The strongest opposing consideration is that everything rests on an unread body and one specimen, and the authors themselves hedge the reading.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E061 and DEEP-E062 record the team member's statement that there are "far to many 'missing links'" to be sure of survival or of changes in meaning, which matches the claim. The records are weak by their own limitations: a comment-thread reply, informally worded, not a formal publication. The strongest opposing consideration is that a formal team statement might be more guarded or more committed either way, and the reply is agnosticism rather than a settled position.
  - claimId: DEEP-C018
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; the navel-name source histories (omphalos, Cusco, Te Pito o te Henua, Göbekli Tepe) were never retrieved, and DEEP-R002 remains open. As a prior it is plausible that the four names differ in language, recording date and builder usage, but that prior is stated as a prior. The strongest opposing consideration is that the claim is comparative and falsifiable by a single early, builder-used attestation, which the ledger has not sought.
  - claimId: DEEP-C015
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The nearest record, DEEP-E024, is attached to DEEP-C016 and covers only the Kurdish names; its second reader explicitly found it says nothing about the Turkish name's shape-derived meaning, so it cannot carry this claim. As a prior the gloss "navel hill" as a descriptive toponym is plausible, but it is stated here as a prior, not as admitted evidence. The strongest opposing consideration is that the claim's truth condition requires documentation that the name is descriptive rather than sacred, exactly the check the ledger has not run.
  - claimId: DEEP-C047
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. As a prior, carving limbs in relief against a body plausibly reduces breakage, but the ledger contains no test of the mechanism and no record even establishing a generic hands-on-body class — DEEP-E081, attached to DEEP-C021, shows Urfa Man grasping his genitals, which complicates any single pose category without bearing on the constraint hypothesis. The strongest opposing consideration is that the claim is deliberately modest ("plausible contributor"), yet plausibility alone is a prior here.
  - claimId: DEEP-C053
    verdict: unresolved
    confidence: low
    reasoning: >-
      The two records attached to this claim, DEEP-E075 and DEEP-E076, carry direction "context" after reader acts: they give Oannes's fish-body description and the sculptural-preservation note, but the second reader established that neither passage makes the apkallu identification, and the iconographic half (DEEP-C052) lost its record link at intake. So no admitted record supports the correspondence itself. The strongest opposing consideration is that the two halves — the textual description and the fish-cloaked iconography — are each separately attested in the ledger's sources, but their connection is an inference no record states.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; no record surveys pre-modern sources for the Gate of the Sun figure. As a prior, the Viracocha identification of the central staff-bearer is generally treated as a modern scholarly label, but that is background, not ledger evidence. The strongest opposing consideration is that colonial Quechua sources could conceivably name the figure, which the claim's truth condition requires checking and the ledger has not checked.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; the flood pilot's coded data, its clustering measure, and even the 263 summaries are unretrieved. The claim is a statistical result that can only be carried by the pilot's data or an independent reading of them, and the ledger has neither. The strongest opposing consideration is that regional clustering of flood details is unsurprising as a prior, but prior expectability is not the stated observation.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; the split that was to carry it produced no admitted record for DEEP-C054 or DEEP-C055. The Genesis-detail distribution rests entirely on the founder's page description of his own pilot. The strongest opposing consideration is that the finding, if real, would be diagnostically interesting for retelling-versus-inheritance, which is exactly why it needs admitted evidence rather than a self-report.
  - claimId: DEEP-C038
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E022 supports the claim with the pilot's own summary line that kind-matching changed the lineup result, but it is a self-report with the pilot data not retrieved, and the page itself notes incomplete runs and cropping constraints. The strongest opposing consideration is that the direction and size of the change are unstated, so even as a self-report the record establishes less than the claim's truth condition requires.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim: the second reader on DEEP-E022, attached to DEEP-C038, explicitly noted that the record's quote concerns kind-matching and says nothing about inter-judge agreement, so it cannot carry DEEP-C037. The "strong disagreement between judges" phrase exists only in the source's text. The strongest opposing consideration is that the claim would be methodologically important if shown, since unreliable AI feature coding and low judge agreement would undercut the lineup statistics on which the case's tier-two claims rest — but no agreement statistic has been admitted.