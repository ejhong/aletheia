  - claimId: GEO-C903
    verdict: well_supported
    confidence: high
    reasoning: >-
      The 2020 paper by Davidovits explicitly outlines a model where builders avoided the hard 'piedras cansadas' blocks and instead harvested naturally unconsolidated andesite volcanic sand from Cerro Khapia, transporting and storing it at Iwawe Stratum V for use as aggregate (GEO-E035). The claim is an accurate description of the proponents' published theoretical model. Strongest opposing consideration: The primary documentation for this model comes from an abstract in a self-published proponent journal rather than an independently reviewed archaeology monograph.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Proponents report producing artificial stone using a three-stage reaction involving carboxylic acids and guano, but admit that plant acids cannot disaggregate hard volcanic andesite and that their laboratory re-hardening experiments relied on modern synthetic chemicals rather than pre-industrial inputs (GEO-E064). Furthermore, analytical testing could not differentiate whether the nitrogen signature detected was unreacted guano residue or a reacted binder matrix (GEO-E059). Strongest opposing consideration: Bench-scale tests confirm that organic acid disaggregation coupled with ammonium-phosphate-rich reagents can generate cohesive cementitious matrices under ambient conditions (GEO-E064).
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Bulk spectroscopic methods like standard PXRF and ICP-MS are indeed blind to light elements (H, C, O) and measure elemental ratios that remain identical whether rock is solid or pulverized and re-cast from the same quarry aggregate (GEO-E024). However, the claim overreaches by including XRD—which identifies crystalline phase structures and distinguishes synthetic binders from natural rock—and ignoring binder-aware petrography and SEM-EDS, which successfully identify casting fabrics even when bulk metallic fingerprints match (GEO-E020). Strongest opposing consideration: An elemental provenance match that relies exclusively on immobile metallic trace elements cannot chemically distinguish intact quarry stone from composite material cast using aggregate from that identical deposit.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Materials science research confirms that lime and reactive silica sources (such as diatomaceous earth) can react at ambient temperatures to produce calcium-silicate-hydrate (C-S-H) cementitious binders capable of consolidating aggregate into rock-like blocks (GEO-E022). Furthermore, Davidovits demonstrated the physical casting of multi-ton reconstituted limestone blocks using alkali activation (GEO-E013). Strongest opposing consideration: Demonstrating bench-scale chemical feasibility or modern prototype casting does not prove that ancient builders possessed the precise stoichiometric formulations or logistics required to produce monumental structural blocks at scale.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Pyrotechnological evidence from pre-dynastic and early dynastic Egyptian copper metallurgy, faience production, and glassworking confirms that charcoal fires operated with blowpipes or foot bellows routinely attained temperatures exceeding 850 °C (GEO-E016). Attaining this temperature range was well within the established technological repertoire of ancient Egyptian artisans. Strongest opposing consideration: Reaching 850 °C in small, insulated crucibles or kilns is technically distinct from heating open-air granite surfaces or processing industrial volumes of natron-silicate reagents (GEO-E016).
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Peer-reviewed archaeological literature confirms that Egypt possessed extensive natural evaporite natron deposits at Wadi el Natrun and al-Barnuj that were exploited on an industrial scale from Pharaonic antiquity through the medieval period (GEO-E010). Compositional analyses of ancient glass demonstrate a clear supply transition away from natron toward plant ash during the 7th–9th centuries AD as these resources were depleted or trade patterns shifted (GEO-E010, GEO-E011). Strongest opposing consideration: Historical and archaeological records document the exploitation of natron primarily for glassmaking, faience, cleansing, and mummification, with no ancient text recording its diversion into structural masonry.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The assertion that long-cycle fire pits can accidentally generate artificial stone via ash carbonation rests on an unattributed anecdote in proponent literature without documentation, temperature profiling, or material characterization (GEO-E015). No controlled replication experiment has verified that structural stone synthesis occurs spontaneously in domestic or outdoor hearths. Strongest opposing consideration: The basic chemical ingredients—wood ash providing alkali hydroxides/carbonates, silica from sand or clay, and moisture—are present in fire pits, making spontaneous cementation theoretically conceivable.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      A modern controlled experimental study using high-precision photogrammetry directly measured the granite quarrying efficiency of a dolerite pounder, establishing an average removal rate of 216 cm³ per hour at an impact frequency of 85 strikes per minute (GEO-E001). The authors concluded that this rate is too low to account for obelisk quarrying without auxiliary techniques. Strongest opposing consideration: A single modern experimental trial with a limited number of operators may not reflect the productivity of highly trained, specialized ancient quarrying teams working under optimized ergonomics (GEO-E001).
  - claimId: GEO-C502
    verdict: unresolved
