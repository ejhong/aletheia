    reasoning: >-
      No evidence record is attached to this claim in the ledger. While the claim outlines the specific experimental setup and workforce heuristics described in Engelbach's 1922 monograph, this historical critique has not been admitted via a dedicated evidence record directly verifying the primary text. Strongest opposing consideration: GEO-E002 contextualizes Engelbach's 1922 work as resting on a brief one-hour trial, providing indirect thematic support for the historical description.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim relies on informal proponent observations stating that tourists striking a designated granite block at the Aswan quarry have failed to produce smooth scoop marks (GEO-E003). There has been no systematic, quantified recording of strike counts, energy delivery, or microscopic surface wear on the test block. Strongest opposing consideration: Decades of casual percussive impacts by visitors have visibly fractured the surface without reproducing the continuous, concave scoop morphology characteristic of ancient trenching.
  - claimId: GEO-C006
    verdict: unresolved
    confidence: low
    reasoning: >-
      The proposition that vertical shafts at Aswan are too narrow for a worker to deliver effective pounding strikes is supported only by proponent visual inspection (GEO-E005). No formal dimensional measurements, strike arc biomechanical analyses, or clearance models have been conducted. Strongest opposing consideration: Delivering forceful two-handed overhead or downward percussive strikes with a heavy pounder becomes physically constrained in a narrow, 16-foot vertical shaft.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Comprehensive field surveys of the Aswan quarries demonstrate that the dolerite pounders were not transported from afar, but were quarried directly from local dolerite and aplite dykes within the Aswan granitoid formation itself (GEO-E045). Dedicated tool-production trenches containing pounder blanks and discarded hammerstones directly adjacent to granite extraction faces confirm their manufacture and use as percussive quarrying tools. Strongest opposing consideration: Stone balls could theoretically have been multi-use implements, used for percussion in the quarries and subsequently repurposed as grinding pestles or tamping tools.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim that Caliph Al-Ma'mun's 9th-century party discovered salt-coated chamber walls originates from an uncited assertion on a proponent website (GEO-E004, GEO-E029). Examination of primary medieval Arabic accounts of the breach, such as those compiled by al-Suyūṭī, reveals detailed descriptions of the entry and artifacts but contains no mention whatsoever of salt or chamber wall encrustations (GEO-E027). Strongest opposing consideration: Other unexamined medieval Arabic chronicles concerning the Giza pyramids could theoretically contain the referenced salt description, as not all historical manuscripts were reviewed in this pass.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: high
    reasoning: >-
      While modern analytical testing confirms that surface efflorescence in the Khufu pyramid consists of halite (GEO-E030), extensive surveys demonstrate that halite efflorescence is common across numerous Egyptian limestone monuments, including bedrock-carved structures like the Great Sphinx where casting is not claimed (GEO-E031). Furthermore, geological analyses show that halite is an inherent primary constituent of the local Giza nummulitic limestone strata, deposited naturally during marine sedimentation (GEO-E032). Strongest opposing consideration: Precise quantitative comparisons of bulk sodium and chlorine concentrations between pyramid blocks and regional bedrock faces have not been systematically mapped using depth-profile coring.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      Analytical characterization of efflorescence and detached fragments from the Queen's Chamber and Thieves' Corridor using XRD and SEM-EDX confirmed the presence of halite, calcite, and quartz, while finding no nitrates and no widespread gypsum crusts (GEO-E030). The claim accurately reports the empirical mineralogical measurements of Sessa et al. (2026). Strongest opposing consideration: The analytical detection limit of the XRD methodology was approximately 5 wt%, meaning trace crystalline phases below that threshold could have remained undetected.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: high
    reasoning: >-
      Sessa et al. (2026) report that halite is present within the natural stratigraphic layers of Giza nummulitic limestone, citing the geological work of Klemm & Klemm (2010), who interpret it as an evaporitic marine precipitate formed during original rock sedimentation (GEO-E032). The claim accurately captures this established geological attribution. Strongest opposing consideration: The geological attribution is reported via a secondary citation in a conservation study rather than verified through direct examination of the primary Klemm & Klemm monograph.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: high
    reasoning: >-
      The absence of complete, accessible modern restoration records for megalithic monuments is well established and directly demonstrated at the Great Pyramid, where extensive cleaning and wall-cavity patching performed between 1995 and 1997 went entirely undocumented (GEO-E034). Modern sulfur-rich repair materials were subsequently detected on the chamber walls, directly confounding surface-chemistry analyses (GEO-E034). Strongest opposing consideration: Some major archaeological sites maintain detailed, modern conservation archives that fully track contemporary repairs and consolidants.
  - claimId: GEO-C005
    verdict: established
    confidence: high
    reasoning: >-
      The 18th-Dynasty mural in the Tomb of Rekhmire is conventionally interpreted in Egyptological literature as depicting the casting of bronze doors, but proponent literature (specifically Fóti 2024) has explicitly argued that the scale, furnace geometry, and lack of crucible tongs fit mineral/waterglass processing better than metallurgy (GEO-E014). The claim accurately reports the existence of this debate and the specific argument made. Strongest opposing consideration: The hieroglyphic captions accompanying the Rekhmire mural explicitly describe the scene as smelting and casting Asiatic copper and bronze, directly contradicting the mineral processing interpretation.