    reasoning: >-
      The peer-reviewed literature in Materials Letters (GEO-E006) and Ceramics International (GEO-E007) by Davidovits et al. explicitly reports SEM and petrographic observations of organic matter and anomalous microstructures in Pumapunku stone, arguing that these features are inconsistent with natural volcanic rock. The claim accurately reports the contents and thesis of these published studies as stated. Strongest opposing consideration: The underlying sample PP1 was an unprovenanced loose surface fragment (GEO-E057), and the authors failed to analyze geological andesite controls (GEO-E060), rendering the substantive conclusions of those papers scientifically questionable.
