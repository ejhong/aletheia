  synthesis: >-
    The case turns on demonstrated occurrence, not merely on whether ancient builders could make artificial stone. On feasibility, the record gives the hypothesis a credible foothold: GEO-E013 reports large re-agglomerated limestone demonstrations, GEO-E022 establishes room-temperature formation of a calcium-silicate-hydrate binder, and the availability of Egyptian natron is strongly documented. The narrow part of the methodological critique also survives: a trace-element quarry match alone cannot exclude manufacture from aggregate taken from that quarry. These points make casting chemically possible and show why provenance is not automatically a complete manufacturing diagnosis. They do not establish that a monument block was cast.

    The Egyptian attribution is, on balance, contradicted by the admitted evidence. GEO-E012 reports genuinely interesting microconstituents in pyramid samples, while GEO-E017 reports an NMR signature interpreted as Tura grains in a human-made C-S-H gel. Against these stand broad in-situ observations of sedimentary and tectonic features in GEO-E018, a negative examination of a proponent showcase specimen in GEO-E019, the positive-control comparison in GEO-E020, and an independent multi-technique natural-limestone result in GEO-E021. GEO-E020 is especially important because it shows that binder-aware petrography can detect a manufactured limestone signature even though ordinary trace-element provenance methods cannot. The salt line does not restore the attribution: GEO-E030 confirms halite efflorescence, but GEO-E031 and GEO-E032 provide natural Egyptian comparators and a sedimentary mechanism.

    The Pumapunku branch remains the strongest residual support but is substantially weaker than its published conclusions imply. GEO-E006 and GEO-E007 report microstructural anomalies and interior organic matter, yet they are one proponent-team line rather than independent replications. GEO-E057 places the key andesite fragment among loose debris outside the protected area, GEO-E060 records the absence of a geological andesite control, and GEO-E059 shows that the proposed guano or binder chemistry was not identified decisively. Quarry provenance in GEO-E008 does not by itself defeat casting from local aggregate, but neither does it supply affirmative casting evidence.

    The strongest argument against the case is therefore that every well-examined Egyptian specimen or block population has either looked natural or produced a disputed, unreplicated anomaly, while the Andean positive rests on insecurely attributed material without a natural control. The strongest argument for it is that two different analytical programs report binder-like or otherwise anomalous internal features that the negative literature has not tested in exactly the same specimens and chemistry. The resulting verdict is weakly_supported rather than unresolved because there are actual analytical positives, but it is not stronger because no provenance-secure monument sample has yielded an independently replicated manufacturing signature.

    The single evidence record whose removal would most change this verdict is GEO-E012, the strongest non-proponent positive result. Without GEO-E012, the verdict narrowly survives as weakly_supported because GEO-E017 and the Pumapunku analyses remain, but confidence in the residual support would fall and the case would sit close to contradiction.
  steelman: >-
    GEO-E017 reports Tura limestone grains cemented by an amorphous calcium-silicate gel attributed to human intervention in a Bent Pyramid casing stone. GEO-E020's positive control tests an alkali-aluminosilicate geopolymer rather than that C-S-H binder, and no admitted record directly explains the reported NMR spectrum as a natural limestone feature.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E012 and the Pumapunku results in GEO-E006 and GEO-E007 provide limited analytical support for at least one cast-stone occurrence. The strongest opposing consideration is that the Egyptian positives are outweighed by GEO-E018 through GEO-E021, while the Andean evidence lacks secure provenance, a natural andesite control, and independent replication. GEO-E009 also shows that conventional sourcing works well at Stonehenge, although that result does not address every monument. The broad existential claim is therefore not disproved, but no admitted record securely establishes an instance.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 reports widespread sedimentary, fossil, fracture, and tooling features consistent with natural limestone, while GEO-E020 finds no alkali-geopolymer binder signature despite using a manufactured positive control. GEO-E019 and GEO-E021 add specimen-level natural-limestone findings, although some samples or identities are disputed. The strongest opposing consideration is the anomalous microstructure in GEO-E012 and the C-S-H interpretation of the NMR result in GEO-E017, neither of which has been independently resolved on the same specimens. Because the claim is existential and the C-S-H model remains directly untested, the contradiction is substantial but not conclusive.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report petrographic, SEM, and organic-matter observations interpreted by their authors as evidence of artificial Pumapunku stone. They are one non-independent proponent-team line, and GEO-E057 and GEO-E060 show that the key andesite fragment had insecure architectural provenance and no geological andesite comparator. GEO-E008's natural quarry attribution is the strongest opposing consideration, although it cannot exclude casting from material collected at that source. The evidence does not independently establish either the andesite or red-sandstone portion of the compound claim.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006, GEO-E007, and GEO-E058 establish that published or publicly reported SEM and petrographic analyses describe organic or amorphous material and interpret associated microstructures as inconsistent with natural stone. The claim is about what those analyses report and argue, not whether their interpretation is correct. The strongest opposing consideration is that GEO-E057, GEO-E059, and GEO-E060 expose insecure provenance, unresolved chemical identity, and the absence of a natural control, but those limitations do not negate the existence or content of the reports.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C913, so its source anchor alone cannot carry the observation. GEO-E057, attached to GEO-C004 and GEO-C021, indirectly describes the same loose-debris sampling context, but it is not an independent verification. The strongest opposing consideration is that being outside the protected area does not exclude the fragment having originated in an architectural block.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C918, and the proposition is therefore held on its source alone. GEO-E058, attached to GEO-C004, indirectly reports the PP1C interior observation, but it comes from the same analysts and fragment. The strongest opposing consideration is that the fragment's architectural provenance is insecure and EDS did not molecularly identify the reported carbon- and nitrogen-bearing matter.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly reproduces the 2020 model's claims that natural Khapia andesite sand was stored at Iwawe and that the quadrangular piedras cansadas were not used as construction material. Because GEO-C903 describes the model rather than asserting that the model is true, this primary statement is sufficient. The strongest opposing consideration is that only the abstract was read, so details or qualifications in the inaccessible paper body remain unknown.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 reports that acidic-medium agglomeration was replicated with modern chemicals, which gives the proposed mechanism limited plausibility. It supplies no recipe, quantitative results, durability measurements, or replication using the stated ancient plant and guano inputs. GEO-E059 is the strongest opposing consideration because the analysts could not determine whether the monument material was guano residue, a binder, or something else. The evidence therefore falls well short of establishing durable artificial stone under pre-industrially accessible conditions.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow point that XRF and ICP-MS do not directly measure hydrogen, carbon, or oxygen and that a trace-element quarry match alone cannot exclude casting from aggregate taken at that quarry. GEO-E009 consequently establishes provenance but not every possible manufacturing history. The strongest opposing consideration is GEO-E020, whose manufactured positive control demonstrates that binder-aware petrography and phase-sensitive analysis can distinguish cast material when an appropriate signature is present. The claim is sound for trace-element provenance considered alone but overstates the blindness of the listed analytical toolkit, especially XRD and combined materials analysis.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports large re-agglomerated limestone demonstration blocks, and GEO-E022 shows that lime and diatomaceous earth can form a C-S-H cementing phase at room temperature. These records support chemical feasibility, while GEO-E012 and GEO-E017 provide disputed examples of similar material signatures in monument samples. The strongest opposing consideration is that the large blocks are self-reported and have not received independent mechanical or compositional characterization. Feasibility is plausible, but the full ancient-material recipe and large-block performance remain insufficiently replicated.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 offers a weakly documented precedent for pre-pyramid pyrotechnology in the relevant temperature range. As a stated scientific prior, charcoal combustion with forced air can plausibly exceed 850 °C, so the bare temperature-achievement claim is not intrinsically demanding. The strongest opposing consideration is that reaching that temperature in a small hot zone does not establish sustained, controlled, industrial-scale natron processing. The verdict therefore leans materially on the general pyrotechnological prior rather than on the single evidence record.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 directly identifies Wadi el Natrun and al-Barnuj as primary ancient Egyptian natron sources and documents their decline and replacement by plant ash in the seventh through ninth centuries. GEO-E011 supplies compatible compositional context for distinguishing natron from plant-ash glass. The strongest opposing consideration is that these records concern vitreous industries rather than stone manufacture, but that does not oppose the local historical claim about natron supply.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 is the only attached observation and recounts an unattributed report of rock-like material forming in a repeatedly used outdoor fire pit. It offers a possible discovery pathway but no controlled chemistry, structural testing, or verified replication. The strongest opposing consideration is that an anecdotal hardened deposit could be ordinary sintered ash, slag, or carbonate crust rather than useful artificial stone.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the stated photogrammetric removal rate of 216 cm³ per hour at 85 strikes per minute. The claim is correctly limited to the result of that controlled experiment rather than asserting a universal ancient quarrying rate. The strongest opposing consideration is that one tool, operator protocol, and granite configuration cannot establish the performance of skilled ancient crews or other pounding arrangements.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C502, so its detailed characterization of Engelbach's report cannot be accepted from the source anchor alone. GEO-E002, attached to GEO-C001 and GEO-C002, provides indirect context about a brief trial and heuristic workforce estimates but explicitly says that characterization had not been verified against the original texts. The strongest opposing consideration is therefore the ledger's own warning that the compound historical description remains unchecked.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitor attempts with dolerite pounders have not reproduced a scoop mark on the designated test block. The report is anecdotal and supplies neither the number and duration of attempts nor a systematic survey of the resulting wear. The strongest opposing consideration is that untrained, intermittent visitor strikes are not an adequate test of sustained skilled quarrying, and an absence of documented success is not necessarily an observed absence of success.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the approximate depth and asserted narrowness of the shafts and judges effective bottom striking biomechanically impossible. No independent dimensional survey or practical test is attached. The strongest opposing consideration is that extraction from above, staged trench geometry, alternative postures, or a different function could defeat the asserted inference even if the approximate dimensions are correct.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 identifies local dolerite and aplite tool-production quarries near Aswan and describes hammer stones as tools used to work boulders. This directly opposes the premise that the spheres were transported to Aswan for a purpose other than granite pounding. No attached evidence demonstrates grinding-slurry, tamping, or finishing residues on the spheres. The strongest opposing consideration is that GEO-E045 lacks microwear or residue analysis and therefore does not prove what every individual pounder struck.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E027 finds no salt layer in al-Suyūṭī's two al-Maʾmūn entries or the additional breach account, while GEO-E029 shows that the affirmative report appears on an uncited proponent webpage. GEO-E004 repeats that secondary report but supplies no traceable Arabic source. The strongest opposing consideration is that the examined compilation is late and incomplete and other medieval texts remain unread. On the admitted record, however, the claimed historical report lacks its asserted documentary anchor.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms readily detectable halite efflorescence inside the Great Pyramid. The comparative part is undermined by GEO-E031, which reports halite at other Egyptian limestone sites including the bedrock-carved Sphinx, and GEO-E032, which presents halite as inherent to Giza limestone strata. The strongest opposing consideration is that these records do not provide controlled concentration comparisons between monuments. Presence is established, but the claimed discriminatory absence from comparable natural limestone is not.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX detection of correlated sodium and chlorine and XRD identification of halite, calcite, and quartz in the sampled efflorescence and fragments. It also records no detected nitrates and no evidence of widespread gypsum crusts. The strongest opposing consideration is the stated XRD detection limit, under which minor sulfate phases could remain undetected, but this does not overturn the reported result as worded.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports detached-fragment observations consistent with inherent sodium and chlorine and cites Klemm and Klemm for halite as a primary salt in Giza nummulitic limestone formed in an evaporative marine or lagoonal setting. This directly supports the proposed natural geological mechanism. The strongest opposing consideration is that the key Klemm and Klemm source was not read directly and no unworked bedrock core or quarry-face sample was analyzed in the admitted evidence. The result is therefore credible but still second-hand and incompletely tested.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 supplies a concrete example at Khufu: 1995–1997 cleaning and cavity filling occurred without available intervention documentation, and a sulfur-rich restored area remains detectable. That example validates restoration history as a serious confound for surface observations at one central site. The strongest opposing consideration is that one monument cannot establish the global quantifier that almost no megalithic site has a complete published restoration history. A systematic cross-site audit is absent.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 records Fóti's argument that the Rekhmire scene's scale and apparatus fit mineral or waterglass processing better than bronze casting. No independent epigraphic, technological, or residue analysis is attached to test that reading. The strongest opposing consideration is the conventional metal-casting interpretation, which the admitted evidence does not directly analyze or rebut. The existence of the reinterpretation is clear, but its superiority is weakly supported.