  verdict: weakly_supported
  loadBearing: [GEO-C020, GEO-C004, GEO-C012, GEO-C030]
  weakestLinks: [GEO-C003, GEO-C506, GEO-C002, GEO-C006]
  synthesis: >-
    The case divides into three branches of very different quality. The pyramid branch holds the corpus's only non-proponent
    laboratory evidence: Barsoum et al. (GEO-E012) report real, hedged microstructural anomalies, and MacKenzie et al.
    (GEO-E017) add an unrebutted multinuclear NMR result on a Bent Pyramid casing stone. Against these stand four
    independent petrographic negatives — Folk & Campbell's in-situ sedimentary features (GEO-E018), Harrell & Penrod on the
    pro-casting side's own showcase sample (GEO-E019), Freestone & Middleton (GEO-E021), and above all Jana (GEO-E020),
    whose positive control makes it the most probative record in the ledger: it measured what a casting signature should
    look like and found it absent from the tested casing stones. Because the tested classes are exactly the ones proponents
    claim (casings, tops, the Lauer sample), and because the salt line of support is removed by Sessa et al. (GEO-E033),
    the pyramid claim is contested rather than supported — but sample-identity disputes on both sides and the untested
    C–S–H binder variant keep it from outright contradiction. The Andean branch rests entirely on the proponents' own
    papers: samples picked from loose debris by appearance (GEO-E057), no geological andesite comparator (GEO-E060), the
    guano-versus-binder question unresolved by the authors themselves (GEO-E059), and an announced radiocarbon date never
    published (GEO-E066). The ingredients rung is the hypothesis's solid ground: industrial natron supply is mainstream
    fact (GEO-E010), and modern geopolymeric limestone demonstrably exists — Jana's own positive control was a genuine
    Davidovits block. The methods critique (GEO-C030) is correct within its scope but, by Fóti's own concession and
    Jana's control, cannot extend to binder-aware petrography. Steelmanning the skeptical side: every anti petrographic
    study examined a handful of samples of contested identity, and no blinded, control-rich replication of either the NMR
    result or the andesite organics exists. Steelmanning the pro side: nothing in the ledger explains the NMR anomaly.
    Net: weak, contested support for the featured hypothesis, with the one study that could settle it still absent.
    Sensitivity: the single most pivotal record is GEO-E012 (the Barsoum dataset); remove it and the pro case rests
    entirely on proponent-authored work, dropping this verdict from weakly_supported toward unresolved — it does not
    fully survive without that record, and this must be stated.
  steelman: >-
    The Bent Pyramid NMR result (GEO-E017): solid-state 29Si/27Al/43Ca MAS NMR, an independent technique and partly
    independent laboratories, found the casing stone consistent with Tura limestone grains cemented by an amorphous
    calcium-silicate gel formed by human intervention — and no study in the ledger rebuts it, because Jana's decisive
    negative (GEO-E020) tested only the alkali-aluminosilicate geopolymer recipe, not the C–S–H binder this paper proposes.
    A proponent can rightly add that no blinded replication with aged C–S–H controls against a stratified natural-limestone
    suite has ever been run (GEO-R017 exists precisely because of this gap), so the single strongest positive measurement
    on pyramid stone stands unrebutted in the admitted record.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only non-proponent laboratory positives (GEO-E012 Barsoum; GEO-E017 MacKenzie NMR) are hedged, small-sample, and
      provenance-contested, and the Andean support is entirely proponent-authored with no geological comparator (GEO-E060).
      The strongest opposing consideration is Jana's positive-control petrography (GEO-E020) plus Folk & Campbell's
      in-situ sedimentary features (GEO-E018), which together show binder signatures are detectable and absent from the
      tested casing stones — but those negatives cover sampled blocks of disputed identity, and the revised C–S–H binder
      is outside their test. Support exists; it is thin and every leg is disputed.
  - claimId: GEO-C020
    verdict: mixed
    confidence: low
    reasoning: >-
      This is the rare case of direct measurements on both sides: Barsoum 2006 and MacKenzie 2011 (GEO-E012, GEO-E017)
      report anomalies in pyramid stone, while Folk & Campbell (GEO-E018), Harrell & Penrod (GEO-E019), Jana (GEO-E020,
      with the only positive control), and Freestone & Middleton (GEO-E021) find natural limestone in the very block
      classes proponents claim. Jana's negative binds only the alkali recipe, and the C–S–H revision is untested by it;
      the salt support is removed by GEO-E033. Unresolved factual disputes about which physical samples were analyzed
      (Barsoum provenance; the Lauer piece) prevent either strong verdict.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      All support is proponent-authored and non-independent (GEO-E006/E007/E036), on samples chosen from loose debris by
      appearance (GEO-E057), with the authors' own admission that no geological andesite was compared (GEO-E060) and the
      guano-versus-binder question open (GEO-E059). Ponce 1971 provenance (GEO-E008) is the conventional counter, dated
      methods and all, and the promised radiocarbon date never appeared (GEO-E066). The strongest opposing consideration
      is that peer-reviewed venues did publish the anomalies, so the claim is not baseless — merely unreplicated and
      uncontrolled.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, the claim reports what published SEM/petrographic analyses say, and the ledger documents this directly
      (GEO-E006, GEO-E007, GEO-E058 for the interior PP1C subsample). The load-bearing caveat is the interpretive clause:
      "inconsistent with natural volcanic stone" is untested because no Khapia geological control exists (GEO-E060), EDS
      cannot characterize the organics (GEO-E059), and amorphous pockets were noted in 1892 (GEO-E061), so the observation
      carries little weight for casting without that control.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to GEO-C913 itself; the basis that carries it is GEO-E057, attached to GEO-C004 and
      GEO-C021, which records from the same source (SRC-DAVIDOVITS-2019) exactly this sampling context — PP1 selected from
      loose debris outside the protected monument area by its flat surface. The opposing consideration is that the
      peer-reviewed statement of the same context was not independently shown, and being outside the protected area does
      not by itself exclude architectural origin.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to GEO-C918 itself; the basis that carries it is GEO-E058, attached to GEO-C004,
      which documents the reported interior subsample PP1C with the same C- and N-bearing spectrum beneath plagioclase
      crystals. The observation makes simple surface contamination incomplete as an explanation, but it rests on one
      fragment of insecure provenance, analyzed by the proponents, with EDS unable to identify the organic compound.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E035 (strength: strong) directly documents the 2020 abstract stating exactly the model elements the claim
      describes — Khapia sand aggregate, Iwawe storage in Stratum V, piedras cansadas not used. The claim is descriptive
      of a model, so the abstract is adequate basis; confidence is tempered because only the abstract was read (the PDF
      was inaccessible) and the venue is the proponents' own journal.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claimed pre-industrial feasibility is the precise thing not demonstrated: the asserted replication used modern
      chemicals with no data or product characterization (GEO-E064), and the same source states plant acids cannot
      disaggregate andesite at all — only limestone — so the chemistry reduces to binding unconsolidated material.
      GEO-E059 records the authors' own admission that the guano hardener is unresolved between residue and binder. The
      strongest opposing consideration is that chemical feasibility of some binder is genuinely shown; what is not shown
      is the three-stage process with ancient-analog inputs.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The narrow core is correct and human-reviewed (GEO-E024): PXRF and ICP-MS cannot see hydrogen, carbon, or oxygen,
      so stone cast from same-quarry aggregate would carry the same metallic fingerprint. The claim as stated overreaches
      twice: it includes XRD, which reads crystalline phases (Folk & Campbell used XRD to search for a zeolitic binder),
      and its rhetorical use would extend to petrography, which Jana's positive control (GEO-E020) shows can detect
      casting when present. The claim holds within its stated scope and fails if generalized.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Reconstituted limestone demonstrably exists in the modern record: Jana analyzed a genuine Davidovits-made
      geopolymeric limestone as his positive control (GEO-E020), and demonstration blocks are reported (GEO-E013, weak,
      self-reported). The C–S–H route is feasible at room temperature from plausible materials (GEO-E022, feasibility
      only). The strongest opposing consideration is that no independent analysis of any demonstration block exists and
      natron-route feasibility at construction scale is untested, so "ancient-feasible at scale" remains an assertion.
  - claimId: GEO-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The admitted record (GEO-E016) is weak support with flagged verification needs (Badari dating and temperature basis
      unverified, crucible-scale not industrial-scale). The verdict leans substantially on a prior, stated as a prior:
      pre-industrial charcoal-fired pyrotechnology — copper smelting, faience, glassmaking — is broadly accepted in
      archaeometallurgy to reach and exceed 850 °C, so the capability claim is uncontroversial even on thin case-specific
      evidence.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 (strength: strong) is mainstream, peer-reviewed, and uncontroversial: Wadi el Natrun and al-Barnuj as the
      primary ancient Egyptian natron sources, with a documented 7th–9th century decline. The only limitation — the paper
      concerns glass, not stone — bears on what the ingredient implies, not on the claim as stated.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only admitted record (GEO-E015) is an unattributed anecdote from the proponent text, flagged as under-sourced by
      the project's own skeptical review, with no controlled replication attempted. One anecdote cannot carry a causal
      discovery-pathway claim in either direction; the proposed fire-pit experiment (GEO-R007) is exactly the missing
      test.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E001 documents a peer-reviewed photogrammetric measurement yielding 216 cm³/h at 85 strikes/min, confirming the
      figure and the authors' own against-pounders-alone conclusion. The claim as a measurement report is solid; the
      limitations are external validity — one team, one granite, one tool configuration, and skilled ancient crews may
      outperform the protocol (which is why GEO-R002 exists).
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C502. The closest basis is GEO-E002, attached to GEO-C001 and GEO-C002, which
      carries only a second-hand characterization of Engelbach's method taken from Fóti and explicitly flagged in that
      record as unverified against the 1922 text; C502's specific figures (5 mm over a foot × half-trench-width, an 8 mm/h
      rammer rate, one man per double-foot) exceed anything documented in an admitted record. The claim stays on its
      source alone until Engelbach 1922 is read directly.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The presence half is confirmed with modern instrumentation (GEO-E030: halite identified as the main efflorescence
      phase), but the claim's distinctive content — that comparable natural limestone monuments do not show this — is
      undermined on both flanks: halite efflorescence is documented at the Sphinx and other non-cast Egyptian limestone
      sites (GEO-E031), and halite is reported as a primary constituent of the Giza nummulitic source strata (GEO-E032).
      The strongest opposing consideration is that these are second-hand, qualitative citations pending GEO-R010, so a
      controlled concentration comparison could yet revive a weaker version of the anomaly.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only admitted record (GEO-E003) is an anecdotal proponent report with unquantified attempt rates and no
      systematic wear survey of the test block. The strongest opposing consideration is that even a fully documented
      failure of untrained visitors would bear little on skilled ancient crews, and the Marčiš measurement (GEO-E001)
      shows pounding does remove granite, slowly.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 is a single proponent description; shaft dimensions have never been independently surveyed and the
      biomechanical claim (a worker cannot strike effectively at the bottom of a ~16-foot narrow shaft) is untested. The
      opposing consideration is that the conventional reading (prospecting pits per Engelbach) is equally unmeasured —
      GEO-R013 notes both readings are conjecture — so the anomaly is real as an unexplained observation, not as
      evidence of casting.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      GEO-E045 documents local dolerite dyke sources within the Aswan granitoids and purpose-built pounder tool quarries
      adjacent to the working areas, contradicting both the "transported to Aswan" premise and a non-quarrying function,
      and weight is added by the association of pounders with extraction debris everywhere. The strongest opposing
      consideration is that the survey does not microwear-test what the pounders actually struck, and Engelbach's contrary
      1922 opinion on sourcing is unresolved in the record, so the refutation is premise-level rather than total.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim's only admitted carrier is an uncited proponent webpage that also dates the breach wrong (GEO-E029,
      GEO-E028: 832, not 820), and the principal medieval compilation of the breach accounts — al-Suyūṭī via Nemoy —
      contains no salt report at all (GEO-E027), shifting the burden to whoever asserts the report. The strongest opposing
      consideration is explicitly recorded: al-Maqrīzī's Khiṭaṭ, ʿAbd al-Laṭīf, and the Vyse extracts remain unread, so
      the existence of some Arabic salt account is not fully closed; the verdict reflects the admitted evidence, which is
      negative.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E030 documents the finding directly from the open-access Sessa et al. 2026 paper with verbatim quotes: XRD of
      seven samples confirmed only halite, calcite, and quartz, with no nitrates and no widespread gypsum. The claim is a
      straightforward report of a verified peer-reviewed measurement; the only caveats (XRD detection limit, sampling of
      efflorescence only) do not touch what was found.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 documents the statement accurately, but it is a second-hand citation: Klemm & Klemm 2010 was not read, only
      Sessa et al.'s report of it, and the "inherent components" inference comes from detached fragments rather than cored
      stone. The claim as a report-of-what-Klemm-and-Klemm-read is well supported; the underlying geology should be
      confirmed directly (GEO-R010) before it bears more weight.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E034 supplies one strong, concrete instance at the case's most-cited monument: undocumented 1995–97 cleaning and
      cavity filling inside the Khufu pyramid, with recurrent efflorescence and a sulfur-rich modern fill on the walls.
      The opposing consideration is scope: "almost no megalithic site" is a broad quantifier supported so far by a single
      documented gap, and the generalization awaits the audit proposed in GEO-R005.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is carefully phrased as "has been argued," and GEO-E014 documents that the argument exists — but it is an
      interpretive case by a proponent, unquantified, and conventional Egyptology has not engaged it. The strongest
      opposing consideration is that no independent Egyptological assessment of the mural's apparatus exists in the
      ledger, so the interpretive competition is unresolved at weight far below the measurement-grade evidence elsewhere
      in the case.