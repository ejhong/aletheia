  synthesis: >-
    The featured hypothesis is weakly supported, not established, because the
    ledger contains genuine analytical observations favorable to casting but
    no provenance-secure, independently replicated demonstration that a major
    monument block is manufactured stone. The two principal attribution
    branches also have different evidential structures and should not be
    pooled as though they were replications. For the Great Pyramid,
    GEO-E012 reports unusual microconstituents and hydrated or rapidly
    precipitated phases in some samples, while GEO-E017 reports an NMR
    signature interpreted as natural limestone grains held by an artificial
    calcium-silicate gel. These are the strongest arguments for casting, and
    the latter is not the alkali-aluminosilicate chemistry tested by the most
    decisive negative control. Feasibility evidence in GEO-E013 and GEO-E022
    further shows that re-agglomerated limestone and calcium-silicate binders
    are chemically possible, although neither establishes ancient use.

    The opposing Pyramid evidence is broader and more diagnostic. GEO-E018
    reports bedding, burrows, fragile fossils, ripple lamination, fractures
    confined to individual blocks, quarrying marks, and no aggregate-cement
    fabric. GEO-E020 compares casing stones with both natural limestone and a
    genuine Davidovits geopolymer positive control, finding the expected
    alkali-rich smooth binder only in the manufactured control. GEO-E019 and
    GEO-E021 independently report natural limestone in disputed specimens,
    although sampling and sample-identity disputes limit universal
    conclusions. Consequently, GEO-C020 is contradicted on the present
    balance even though the existential wording “some blocks” cannot be
    exhaustively excluded by the examined samples.

    The Pumapunku branch retains a weaker positive signal. GEO-E006,
    GEO-E007, and GEO-E058 report anomalous microstructure and carbon- and
    nitrogen-bearing amorphous matter, including an interior occurrence below
    plagioclase crystals. Against that, all belong to one proponent sample
    series, GEO-E057 documents that the key andesite fragment was loose debris
    selected by appearance outside the protected area, and GEO-E060 states
    that no geological andesite control was compared. GEO-E059 also records
    that the analysts could not identify the material as guano residue or
    binder. These limitations prevent an observation about PP1 from securely
    becoming an attribution about architectural blocks.

    The strongest methodological point for the hypothesis is the narrow part
    of GEO-C030: a trace-element quarry match alone cannot exclude stone made
    from aggregate collected at that quarry. The strongest answer is that
    this limitation does not apply to direct binder-aware petrography,
    microstructure, or positive-control comparisons such as GEO-E020. The
    salt and historical lines add little: GEO-C003 is contradicted by the
    presently checked medieval compilation and the proponent page's missing
    citation, while GEO-C506 is mixed because instrumental analysis confirms
    halite but comparable Egyptian limestone sites and a sedimentary origin
    are also reported. Likewise, the established removal-rate measurement in
    GEO-C001 challenges pounding as a sole technique but does not positively
    identify casting.

    The single record whose removal would most change the case balance is
    GEO-E012, the strongest non-proponent positive materials analysis. Without
    it, the weakly_supported verdict survives, but only narrowly, on GEO-E017
    and the unreplicated Pumapunku observations; confidence in any positive
    attribution would fall further. Thus the verdict does not hang entirely
    on one record, but its most credible favorable component does.
  steelman: >-
    GEO-E017's Bent Pyramid NMR signature, interpreted as Tura limestone
    grains cemented by an amorphous calcium-silicate gel, remains unanswered
    by GEO-E020 because that positive-control study tested a different,
    alkali-aluminosilicate binder and no broad blinded natural-limestone suite
    has yet shown that the NMR signature occurs naturally.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E009, attached directly to this claim, supports conventional
      sourcing for Stonehenge but is site-specific and cannot settle the
      broader existence claim. Positive materials observations come from
      GEO-E012 and GEO-E017, attached to GEO-C020, and GEO-E006 and GEO-E007,
      attached to GEO-C004 and GEO-C021. The strongest opposing consideration
      is that GEO-E018 through GEO-E021, attached to GEO-C020, favor natural
      Pyramid limestone, while the Pumapunku observations lack secure
      provenance, natural controls, and independent replication.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 reports broad in-situ sedimentary and tectonic features that
      are difficult to reconcile with casting, while GEO-E020 finds no
      alkali-geopolymer binder signature in casing stones despite detecting it
      in a manufactured positive control. GEO-E019 and GEO-E021 likewise
      identify examined specimens as natural limestone, although sample
      identity or representativeness is limited. The strongest opposing
      consideration is GEO-E012, supplemented by GEO-E017, which reports
      microstructural and NMR observations interpreted as artificial binders;
      these keep the contradiction from being high-confidence or exhaustive
      of every block.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report petrographic anomalies and internal organic
      matter interpreted as evidence of manufactured Pumapunku stone, but
      they are one non-independent proponent line. GEO-E057 shows that the key
      andesite fragment was loose debris attributed to the monument by
      appearance, and GEO-E060 states that no geological andesite control was
      examined. GEO-E008 supports natural quarry provenance, although it
      cannot by itself distinguish carved stone from material made using
      same-source aggregate. The strongest opposing consideration is therefore
      the combination of insecure object provenance, absent natural controls,
      and no independent replication.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006 and GEO-E007 directly document that the published analysts
      reported microstructural anomalies and organic matter and interpreted
      them as evidence of artificial stone. GEO-E058 further records their
      report of similar carbon- and nitrogen-bearing amorphous matter in an
      interior subsample beneath plagioclase crystals. The strongest opposing
      consideration is not whether the reports exist, but whether they apply
      to a monument block: GEO-E057 and GEO-E060 identify insecure fragment
      provenance and the absence of a natural andesite comparator. Those
      limitations weaken the attribution inference but not this reporting
      claim as stated.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C913. GEO-E057, attached to
      GEO-C004 and GEO-C021, reports substantially the same loose-debris
      sampling context, but under the ledger's attachment rule that
      cross-claim record does not convert this source-anchored proposition
      into an admitted finding for GEO-C913.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C918. GEO-E058, attached to
      GEO-C004, reports the interior PP1C observation and is favorable to the
      proposition, but the claim remains unresolved under the ledger rule
      because that record was not admitted against GEO-C918 itself.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly quotes the model's abstract as specifying natural
      Khapia andesite sand stored at Iwawe and rejecting the quadrangular
      piedras cansadas as construction material. That is sufficient for the
      local claim, which describes the proponents' model rather than asserting
      that the model is archaeologically correct. The strongest opposing
      consideration is that only the abstract was read and the underlying
      Iwawe excavation description was not checked, but this limits validation
      of the model rather than its documented contents.
  - claimId: GEO-C580
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E064 reports an asserted laboratory replication using modern
      chemicals but supplies no recipe, measurements, durability data, or
      product characterization and expressly says plant acids do not
      disaggregate andesite. GEO-E059 further records that the analysts could
      not determine whether the observed matter was unreacted guano or the
      proposed binder. The strongest favorable consideration is the
      proponents' stated successful mechanism test, but it does not establish
      durable stone production with the claimed pre-industrial inputs.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow point that XRF and ICP-MS do not measure
      hydrogen, carbon, or oxygen and that a trace-element quarry match alone
      cannot exclude use of same-source aggregate. GEO-E009 consequently
      establishes provenance for Stonehenge material without directly testing
      every possible binder hypothesis. Against the claim's broader wording,
      GEO-E020 demonstrates that binder-aware petrography with a positive
      control can detect a manufactured matrix, and GEO-E024 itself concedes
      the relevance of petrography and contains errors about other methods.
      The strongest opposing consideration is thus that provenance blindness
      does not make direct microstructural or phase-sensitive analyses blind.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large re-agglomerated limestone
      demonstration blocks, and GEO-E022 independently establishes that lime,
      diatomaceous earth, and water can form a calcium-silicate-hydrate binder
      at room temperature. These records support chemical plausibility but do
      not independently document a large block made with a fully specified
      ancient-feasible recipe or verify its long-term performance. The
      strongest opposing consideration is the absence of an independently
      analyzed full-scale replication using only the claimed ancient inputs.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 cites pre-pyramid glassmaking as evidence that temperatures
      near 850 degrees Celsius were reachable with charcoal and bellows, but
      its dating and temperature basis were not independently verified in the
      ledger. A general scientific prior that charcoal-fired kilns can attain
      such temperatures raises the claim's plausibility, and this verdict
      leans partly on that prior rather than on strong admitted evidence.
      The strongest opposing consideration is that achieving furnace
      temperature at crucible scale does not establish sustained
      construction-scale natron processing.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 strongly identifies Wadi el Natrun and al-Barnuj as principal
      ancient Egyptian natron sources for the vitreous-materials industry and
      documents their decline and replacement by plant ash in the seventh to
      ninth centuries AD. GEO-E011 supplies the compositional framework used
      to distinguish natron glass from plant-ash glass. The strongest opposing
      consideration is that these records concern glass and faience rather
      than stone production, but that limits the hypothesis-level implication
      rather than the local claim about natron supply.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 records one reported occurrence of rock-like material in a
      repeatedly used outdoor fire pit. It is an unattributed anecdote with no
      chemical characterization, mechanical testing, or controlled
      replication. The strongest favorable consideration is that the reported
      observation is qualitatively consistent with the proposed pathway, but
      it does not establish either the causal chemistry or its role in
      technological discovery.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the claimed controlled photogrammetric result:
      216 cubic centimetres per hour at 85 strikes per minute. The local claim
      concerns that measured experimental configuration rather than a
      universal ancient removal rate. The strongest opposing consideration is
      that it is one team's result with one granite and tool configuration,
      so extrapolation to skilled ancient crews or entire quarrying systems
      remains uncertain.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C502. GEO-E002, attached to
      GEO-C001 and GEO-C002, gives a secondhand characterization of
      Engelbach's trial and explicitly says that characterization was not
      verified against the monograph, so it cannot establish this detailed
      compound historical claim.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using original dolerite pounders have not
      successfully reproduced a scoop mark on the designated block. The
      report is anecdotal and gives neither the number and duration of
      attempts nor a systematic survey of the resulting wear. The strongest
      opposing consideration is that uncontrolled visitor attempts may be too
      brief or unskilled to test what practiced quarry workers could achieve.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the claimed depth and the proponent's biomechanical
      judgment that effective pounding posture is impossible at the shaft
      bottoms. No independent dimensional survey or experimental posture test
      is supplied. The strongest opposing consideration is that alternative
      working positions, tools, excavation sequences, or a different original
      shaft geometry remain untested.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite raw material and probable Pharaonic
      tool-production quarries within the Aswan quarry landscape, with
      pounder-sized blanks near working areas. This weighs against the claim's
      premise that the spheres were transported to Aswan for a purpose other
      than granite working, and no attached evidence positively demonstrates
      grinding, tamping, or slurry preparation. The strongest opposing
      consideration is that GEO-E045 does not include microwear or residue
      analysis and therefore does not directly identify what every pounder
      struck.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E027 finds no salt coating in the two al-Ma'mun breach accounts
      reproduced by the checked medieval compilation, while GEO-E029 shows
      that the proponent webpage gives no medieval author, work, manuscript,
      or edition for its detailed salt-layer assertion. GEO-E004 is the
      strongest favorable record, but it merely repeats the same untraced
      secondary report and adds uncontrolled taste tests. GEO-E028 supports a
      date around 832 rather than 820 but does not supply the missing salt
      account. The strongest opposing consideration to this verdict is that
      several other medieval sources remain unread, so the present absence is
      not proof that no such account exists anywhere.
  - claimId: GEO-C506
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms readily detectable halite
      efflorescence on sampled Great Pyramid chamber surfaces. However,
      GEO-E031 reports halite at other Egyptian limestone sites, including the
      bedrock-carved Sphinx, and GEO-E032 reports a sedimentary origin for
      halite in Giza nummulitic limestone; both comparative points are
      secondhand and lack concentration measurements. GEO-E026 offers only
      uncontrolled taste tests and an unsuitable cathedral comparator. Thus
      the presence component is supported, while the claimed concentration
      contrast with comparable natural monuments is unestablished and
      materially undermined.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX identification of NaCl efflorescence
      and XRD identification of only halite, calcite, and quartz in the seven
      analyzed samples, with no nitrates or widespread gypsum crusts found.
      The strongest opposing consideration is the stated XRD detection limit
      and the restriction to efflorescence and detached salt-affected
      fragments, so minor phases below detection are not excluded. Those
      qualifications are consistent with the claim's wording as a report of
      the study's findings rather than an assertion of absolute absence.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032, attached to GEO-C506 and GEO-C906, reports that Sessa et al.
      cite Klemm and Klemm as describing halite within Giza's nummulitic
      limestone strata and interpreting it as precipitation from evaporating
      marine or lagoonal waters. This directly supports the claim's stated
      citation chain. The strongest opposing consideration is that Klemm and
      Klemm were not read directly, while the sampled detached fragments were
      not bedrock cores, making the geological conclusion secondhand and
      provisional.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E034 supplies a concrete example at the Khufu pyramid: records for
      1995–1997 interventions are unavailable even though photographs and
      later measurements indicate cleaning, cavity filling, and a sulfur-rich
      restored area. This establishes that undocumented intervention can
      confound surface evidence at one central site. The strongest opposing
      consideration is that one monument cannot establish the global
      frequency claim that almost no megalithic site has a complete
      restoration history.
  - claimId: GEO-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E014 directly documents Fóti's argument that the mural's scale and
      apparatus fit mineral or waterglass processing better than bronze
      casting, so the existence of the reinterpretation is supported. It does
      not provide an independent iconographic or inscriptional test of that
      reading. The strongest opposing consideration is the conventional
      metal-casting interpretation, which remains unrebutted by any admitted
      Egyptological analysis.