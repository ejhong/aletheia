  synthesis: >-
    The case splits into three evidential branches that do not move together. The
    Egyptian branch is the most developed and nets against casting: four independent
    teams examining actual pyramid and casing stones (GEO-E018 Folk & Campbell;
    GEO-E019 Harrell & Penrod; GEO-E020 Jana; GEO-E021 Freestone & Middleton) report
    sedimentary bedding, fossils, tectonic fractures, quarrymen's tool marks, and — in
    the only study with a genuine positive control — none of the binder signature a
    real geopolymer displays. The pro-casting positives on the same stones (GEO-E012
    Barsoum 2006; GEO-E017 MacKenzie 2011) are hedged, rest on samples whose provenance
    was publicly disputed, and remain unreplicated. The historical salt line, once a
    pillar of the case, has largely collapsed: GEO-E030–E033 confirm the halite but
    document it at the Sphinx and other uncast Egyptian limestone sites, cite a
    sedimentary origin in Giza bedrock, and GEO-E034 shows the chamber surfaces were
    cleaned and patched under undocumented 1990s interventions, so any surface-salt
    observation has an unknown baseline. The Andean branch is proponent-only end to
    end: the SEM/petrographic anomalies (GEO-E006, GEO-E007) attach to a loose fragment
    chosen by appearance outside the protected zone (GEO-E057), with no geological
    andesite control at all (GEO-E060) and the authors' own admission that nitrogen is
    unquantified and binder cannot be distinguished from guano residue (GEO-E059).
    The methodological branch is genuinely two-sided: the trace-element critique
    (GEO-E024, human-reviewed) is sound for XRF and ICP-MS and endorsed in its narrow
    form, but it is wrongly extended to XRD and is answered for binder-aware
    petrography by Jana's positive control (GEO-E020). Where my reasoning leans on
    background knowledge rather than ledger records — for example, that light elements
    are invisible to XRF, that volcanic rocks naturally host glassy and amorphous
    phases, and that a 1971 provenance attribution carries less weight than a modern
    one — I flag these as priors, not as what any source shows. Net: the hypothesis
    survives only as a weak possibility. The one instrument-grade, binder-specific
    positive (the Bent Pyramid NMR result) stands unrefuted in the ledger but
    unreplicated; the flagship pyramid claim is directly contradicted by the strongest
    evidence class; and the decisive discriminators — a blinded NMR suite with natural
    controls (GEO-R017), PP1 provenance resolution (GEO-R016), the Iwawe Stratum V
    check (GEO-R009/R015), and halite-in-bedrock (GEO-R010) — are all still pending.
    Sensitivity: the single record whose removal would most change this verdict is
    GEO-E020 (Jana 2007). Without it, Barsoum's 2006 microconstituent anomalies would
    stand without any binder-aware rebuttal, and GEO-C020 would likely soften from
    contradicted toward mixed, pulling the case toward mixed. The verdict survives in
    direction without GEO-E020 — GEO-E018, GEO-E019, GEO-E021 still weigh against on
    the Egyptian side and GEO-E057, GEO-E059, GEO-E060 cap the Andean side — but with
    materially reduced confidence; the case would then hang noticeably on the
    unrebutted NMR positive.
  steelman: >-
    The Bent Pyramid NMR result (GEO-E017): solid-state ²⁹Si/²⁷Al/⁴³Ca MAS NMR on an
    outer casing stone, using an independent technique and partly independent labs,
    reading Tura quarry grains cemented by an amorphous calcium-silicate gel "formed by
    human intervention" — a result with no published rebuttal, comment, or replication
    failure anywhere in the ledger, and one that Jana's positive-control negative
    demonstrably does not test, because Jana's control was an alkali-aluminosilicate
    geopolymer, not the C–S–H binder this study proposes. No natural-limestone suite
    control has ever been run against it (GEO-R017 is unfunded), and the 2006 SEM/TEM
    microconstituents that motivated the whole line were never formally rebutted in a
    journal exchange. Until a blinded NMR survey across Tura/Dahshur/Giza limestone
    with aged C–S–H controls retires that −84 ppm shoulder, the proponent can rightly
    say the one binder-specific positive on pyramid stone stands unanswered.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No evidence record attached to this claim establishes cast stone at any named
      site. The pyramid line is carried by GEO-E012 and GEO-E017 (both attached to
      GEO-C020), which are hedged, provenance-contested, and unreplicated, while the
      direct petrography of the same stones (GEO-E018–E021, attached to GEO-C020) found
      natural sedimentary features and, with a positive control, no binder. The Andean
      line (GEO-E057, GEO-E060, attached to GEO-C004/GEO-C021) rests on one insecure
      loose fragment analysed by the proponents without a natural control. The
      strongest opposing consideration is the strong, multi-team, multi-technique
      petrographic record against casting on the very monuments at issue.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Four independent studies examining actual pyramid and casing stones (GEO-E018,
      GEO-E019, GEO-E020, GEO-E021, all attached to GEO-C020) report bedding, burrows,
      fossils, tectonic fractures, tool marks, no air bubbles or reaggregated texture,
      and — in Jana's study with a genuine Davidovits geopolymer as positive control —
      no binder signature, directly answering Barsoum's 2006 microconstituents
      (GEO-E012). The surviving positive, MacKenzie's C–S–H NMR result (GEO-E017), is
      outside Jana's test and unrebutted, which is why this is not settled at high
      confidence. The strongest opposing consideration is that the one surviving
      pro-casting result has never been tested against a broad natural-limestone suite.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Support comes only from the proponents' own SEM/petrographic work (GEO-E006,
      GEO-E007, one sample series; GEO-E036 is self-citation) on fragments chosen from
      loose debris outside the protected area (GEO-E057), with no geological andesite
      comparator (GEO-E060), semi-quantitative nitrogen, and an unresolved
      binder-versus-guano question by the authors' own statement (GEO-E059). GEO-E008
      supplies the standard provenance counter, though its 1971 methods are dated (a
      prior, not a ledger finding). The strongest opposing consideration is that
      without any natural andesite control the reported anomalies cannot be shown to
      be absent from the parent rock, which caps the claim at weak support.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, the claim is a description of what the published analyses report and
      argue, and GEO-E006 and GEO-E007 confirm that directly, including the interior
      PP1C subsample (GEO-E058). The claim does not assert that the stone is cast, so
      the diagnosticity problems (no natural control, GEO-E060; nitrogen unquantified,
      GEO-E059) qualify the underlying interpretation rather than falsify the
      description. The strongest opposing consideration is that "inconsistent with
      natural volcanic stone" is the authors' argument, not an established fact, since
      no Khapia andesite was ever compared.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim itself; it is carried by GEO-E057
      (attached to GEO-C004 and GEO-C021), which quotes the proponents' own 2019 account
      that samples were obtained by choosing debris of monumental-stone fragments lying
      outside the protected monument area. The record states the context verbatim from
      the source, and it is the proponents' self-description, which makes the claim
      about their sampling practice solid but the sample's tie to any catalogued block
      an attribution, not an observation.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim itself; it is carried by GEO-E058
      (attached to GEO-C004), which quotes the 2019 report stating that an interior
      subsample (PP1C) showed the same C- and N-bearing amorphous matter beneath two
      plagioclase crystals. The record carries its limitations: same team and fragment
      as GEO-E007, EDS is elemental only with no molecular identification, and the
      fragment's provenance is as the proponents state it — so the "reported" claim is
      solid while the observation beneath it is not independent.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E035 is attached directly and quotes the 2020 abstract stating the Khapia
      sand aggregate stored at Iwawe (Stratum V) and that the piedras cansadas were not
      used, which is precisely what this descriptive claim asserts. The record's
      limitations carry through: abstract only, the PDF body was not read, and the
      venue is the proponents' own journal. The strongest opposing consideration is
      that only the abstract has been verified, so details of the model beyond its
      headline claims rest on an unread text.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is the proponents' assertion that the acidic-medium mechanism
      "has been successfully replicated in our laboratory with modern chemicals"
      (GEO-E064, attached to GEO-C580), with no recipe, data, or product
      characterisation, and using modern reagents rather than plant acids and guano;
      the second reader recorded dissent that the same passage actually qualifies
      pre-industrial feasibility since the acids do not disaggregate andesite.
      GEO-E059 limits the guano-hardener identification to elemental similarity. The
      strongest opposing consideration is that "durable artificial stone under
      pre-industrial conditions" is asserted, not demonstrated, anywhere in the ledger.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 (human-reviewed, attached to this claim) supports the narrow core —
      XRF and ICP-MS cannot see hydrogen, carbon, or oxygen, so a same-quarry-aggregate
      cast would share the metallic fingerprint — and the editor endorsed that form.
      But the claim as stated includes XRD among the blind methods, and the same record
      flags the methods table's errors (the H/C/O point holds for XRF/ICP-MS, not the
      whole table), while GEO-E020 (also attached here) shows a real casting signature
      is detectable by binder-aware petrography, bounding the critique's scope. The
      strongest opposing consideration is Jana's positive control, which demonstrates
      the limitation does not extend to methods that look for binders directly.
  - claimId: GEO-C012
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Feasibility support is thin: GEO-E013 (attached here) is a self-reported
      demonstration block with no independent analysis, and GEO-E022 shows only that a
      lime-plus-diatom C–S–H binder is chemically feasible — feasibility, as the record
      itself notes, is not occurrence. GEO-E012's microstructural anomalies bear on the
      samples, not on demonstrated block-making. The strongest opposing consideration
      is that no independent party has analysed any demonstration block, and the natron
      route's feasibility at construction scale is expressly untested.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only attached record, GEO-E016, cites Badari-period glassmaking via Fóti as a
      temperature precedent, and its own limitations state the dating and temperature
      basis need independent verification. The record also concedes the gap the claim
      must close: crucible-scale heat is not industrial-scale processing. The strongest
      opposing consideration is that a single unverified second-hand precedent cannot
      carry a claim about pyrotechnology available at 850 °C for bulk mineral
      processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 (attached here) is a mainstream, peer-reviewed, uncontroversial source
      directly establishing Wadi el Natrun and al-Barnuj as the primary ancient natron
      sources with a documented 7th–9th century decline, and GEO-E011 supplies the
      compositional typology behind such timelines. The record's own limitation — it
      concerns glass, not stone — is acknowledged but does not touch what this claim
      asserts. The strongest opposing consideration is only that availability of
      natron is being established, not its use in stone.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The sole attached record, GEO-E015, is an unattributed anecdote from the
      proponent text, flagged as under-sourced by the project's own skeptical review,
      with no controlled replication attempted. A single under-sourced story cannot
      carry a causal claim about a discovery pathway. The strongest opposing
      consideration is the complete absence of any controlled test that long-cycle
      fire pits produce stone-like material at all.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E011's — more precisely GEO-E001's — attached record confirms the 216 cm³/h
      figure from a peer-reviewed photogrammetric study whose authors themselves
      conclude pounders alone are insufficient, and GEO-E002 adds context on the thin
      evidential base of the orthodoxy. The limitations carry: single study, single
      team, single granite and tool configuration, and skilled ancient crews may have
      outperformed the protocol. The strongest opposing consideration is that this
      measurement constrains orthodox timelines, not that it supports casting — the
      claim as stated is only about the measured rate.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The nearest basis is GEO-E002
      (attached to GEO-C001 and GEO-C002), which confirms only that Engelbach's
      monograph contains his own brief working trial and workforce estimates, and whose
      limitations expressly state that Fóti's quantitative characterization of that
      trial — the specific figures this claim recites — has not been verified against
      the 1922 text. Until the monograph itself is read (topic T-002), the claim's
      details rest on an unverified second-hand characterization.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 (attached here) is Fóti's description of the shafts as too narrow for
      effective pounding, with the record's own limitations stating the dimensions are
      not independently surveyed and the biomechanical claim untested. GEO-R013
      confirms in the research agenda that both readings of the shafts are unmeasured
      conjecture. The strongest opposing consideration is that prospecting-pit
      geometry could plausibly produce the same narrow shafts, and nothing in the
      ledger measures them.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 (attached here) is an anecdotal proponent report with unquantified
      attempt rates and no systematic wear survey of the test block, and GEO-E002
      contextualizes but does not measure the orthodoxy. GEO-E001 shows pounding does
      remove granite at a measurable (if slow) rate, so failed reproductions may
      reflect granite hardness or technique rather than impossibility. The strongest
      opposing consideration is that unquantified tourist attempts are nearly
      weightless as a reproduction failure.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      The only attached record, GEO-E045, undermines the claim on both ends: Kelany et
      al. place the dolerite raw material in dykes within the Aswan granitoids and
      identify purpose-built Pharaonic pounder-production quarries adjacent to the
      working areas, against the claim's "transported to Aswan" premise and against a
      non-quarrying function, though the record concedes it does not test what the
      pounders struck and Engelbach's contrary 1922 opinion is unresolved. The
      strongest opposing consideration is that no ledger evidence positively
      demonstrates the pounding use either, so this is a low-confidence verdict on
      negative weight alone.
  - claimId: GEO-C003
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim's only support is GEO-E004, a weak, untraced secondary report from the
      proponents' own organization; GEO-E029 (attached here) confirms the page cites no
      medieval author, and GEO-E027 finds the principal compilation of Arabic breach
      accounts mentions no salt — negative evidence within one compilation, with
      al-Maqrīzī's full text unread. GEO-E028 corrects the date to 832, consistent with
      the claim's "c. 832 AD". The strongest opposing consideration is the absence of
      the salt report from the principal medieval compilation, which shifts the burden
      to whoever asserts it.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The presence component is confirmed by GEO-E030 — modern XRD/SEM-EDX show the
      efflorescence is halite — but the claim's comparative premise ("comparable
      natural limestone monuments do not exhibit" it) is undermined by GEO-E031, which
      documents halite efflorescence at the Sphinx and other uncast Egyptian limestone
      sites, and by GEO-E032, which cites a sedimentary origin for halite in Giza
      nummulitic limestone itself. GEO-E026, the taste test, is effectively weightless
      by its own record's inference. The strongest opposing consideration is that no
      controlled concentration comparison has actually been made — the counter-evidence
      is qualitative and partly second-hand.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E030 is attached directly to this claim and quotes the Sessa et al. XRD
      result confirming only halite, calcite and quartz, with no nitrates and no
      widespread gypsum. The record's limitations carry: a conservation study of
      efflorescence and detached fragments only, XRD detection limit below 5 wt%, and
      no bearing on the blocks' origin. The strongest opposing consideration is that
      minor phases below the detection limit could be missed, though the claim as
      stated is a faithful report of what the study found.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 is attached to this claim and quotes the passage verbatim: Klemm &
      Klemm, as reported by Sessa et al., read halite as a primary constituent of the
      Giza nummulitic limestones, likely precipitated from evaporating waters during
      rock formation — exactly what the claim states, with the claim itself scoped "as
      cited by Sessa et al. 2026". The limitation carries through: Klemm & Klemm 2010
      was not read, so the statement is second-hand, and a second reader noted the
      record's direction label was wrong for this claim though its content is
      confirmed.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 (attached here) supplies one concrete, moderate-strength instance: the
      Khufu interior was cleaned and cavity-filled in 1995–97 with the intervention
      documentation unavailable, and efflorescence re-formed within about two years.
      The claim, however, is general ("almost no megalithic site"), and the ledger
      documents the confound at only one monument. The strongest opposing
      consideration is that one site's undocumented interventions do not establish the
      generalization, however plausible it is as a prior.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 (attached here) is an interpretive argument by a proponent, and the
      record's own limitations state that conventional Egyptology reads the scene as
      metal casting and has not engaged the reinterpretation. The claim as stated is
      carefully framed ("have been argued to fit"), which the record supports, but the
      argument has no independent assessment in the ledger. The strongest opposing
      consideration is the unengaged conventional reading, which remains the default
      until GEO-R008's re-examination is done.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      As graded above on GEO-E016: a single second-hand temperature precedent needing
      verification, with the record itself conceding that crucible-scale heat does not
      establish industrial-scale processing. The strongest opposing consideration is
      the scale gap between demonstrated Badari glassmaking and the bulk chemistry the
      casting hypothesis requires.