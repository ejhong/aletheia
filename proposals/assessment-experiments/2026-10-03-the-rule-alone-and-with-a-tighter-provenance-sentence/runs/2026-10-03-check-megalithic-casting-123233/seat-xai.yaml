  synthesis: >-
    The featured hypothesis — that some major megalithic monuments contain
    cast reconstituted stone rather than solely carved and transported rock —
    splits cleanly into mechanism, observation, and attribution rungs, and
    the ledger’s evidence does not move them in lockstep. On mechanism,
    ingredient availability is real: industrial-scale Egyptian natron is
    well documented (GEO-C011 / GEO-E010), charcoal-range temperatures are
    at least provisionally plausible (GEO-C010), and modern laboratory and
    demonstration work shows that limestone can be re-agglomerated into hard
    blocks by more than one binder chemistry (GEO-C012; GEO-E012, GEO-E013,
    GEO-E022), including a lime–diatomaceous-earth C–S–H path distinct from
    Davidovits’ original alkali-aluminosilicate geopolymer. Feasibility,
    however, is not occurrence. On the Egyptian attribution (GEO-C020), the
    strongest non-proponent positive remains Barsoum et al. 2006 (GEO-E012),
    which reported Si–Ca–Mg microconstituents and hydrated phases argued to
    be inconsistent with the sampled natural quarries; MacKenzie et al. 2011
    (GEO-E017) later pointed a NMR shoulder toward an artificial C–S–H gel
    in one Bent Pyramid casing stone. Against this stands a multi-study
    petrographic record: Folk & Campbell’s in-situ sedimentary and tectonic
    features across many blocks (GEO-E018), Harrell & Penrod’s natural
    Mokattam reading of the Lauer showcase specimen (GEO-E019), Freestone &
    Middleton’s multi-technique natural result on a British Museum casing
    fragment (GEO-E021), and especially Jana 2007 (GEO-E020), the only
    comparison with a genuine Davidovits geopolymer positive control, which
    found the Barsoum-type spheres in natural limestone, alkali–Al binder
    enrichment only in the real geopolymer, and casing textures matching
    Tura stone rather than cast matrix. Sample-authenticity disputes (Lauer
    piece; Barsoum sampling permission) cut both ways and remain unresolved,
    but they do not erase the positive-control negative on the original
    recipe. Salt-line supports for casting (GEO-C003, GEO-C506) collapse
    under Sessa et al. 2026: chamber efflorescence is NaCl, yet halite is
    reported as common on Egyptian limestone monuments including the carved
    Sphinx and is cited as a primary sedimentary constituent of Giza
    nummulitic limestone (GEO-E030–E033); the Al-Ma’mun salt-coating story
    lacks a traceable medieval anchor and is absent from al-Suyūṭī’s
    compilation (GEO-E027–E029). On the Andean branch (GEO-C021, GEO-C004),
    published SEM/petrography by the proponent team reports organic and
    amorphous features argued to be inconsistent with natural andesite
    (GEO-E006, GEO-E007, GEO-E058), but the load-bearing andesite fragment
    PP1 was taken from loose debris outside the protected area with no
    geological andesite control and no independent replication (GEO-E057,
    GEO-E060); nitrogen/guano identification is admitted unresolved by the
    authors (GEO-E059); 1971 quarry attribution still stands as a moderate
    counter (GEO-E008). Methodologically, Fóti’s critique that metallic
    quarry-matching (PXRF/ICP-MS) is blind to H/C/O binders is largely
    correct as stated (GEO-C030 / GEO-E024) and limits over-reading of
    provenance papers such as Nash 2020, yet Jana’s binder-aware petrography
    shows that the blindness claim does not extend to microscopy and
    SEM-EDS when a casting signature is actually present. Tool-mark and
    rate anomalies at Aswan (GEO-C001 measured 216 cm³/h; GEO-C002, GEO-C006)
    are real observational pressure on pounder-only orthodoxy but do not by
    themselves identify casting; dolerite spheres have a documented local
    tool-quarry context (GEO-E045) that undermines non-pounding reinterpretations
    (GEO-C511). Restoration-history gaps (GEO-C594 / GEO-E034) correctly
    warn that surface chemistry and morphology claims are confound-prone.
    Net: mechanism fragments are provisionally live; Egyptian casing-stone
    casting under the original geopolymer recipe is strongly opposed by
    controlled petrography; the revised C–S–H recipe and the Andean organo-mineral
    claim remain thinly supported and unreplicated; the existence claim
    GEO-C022 is therefore not established and not cleanly falsified
    everywhere, yielding a mixed case verdict that hangs on unresolved
    sample identity, missing natural controls, and the untested status of
    the C–S–H pathway against a broad quarry baseline.
  steelman: >-
    Jana 2007’s decisive positive-control negative tested Davidovits-style
    alkali-aluminosilicate geopolymer, not the amorphous calcium-silicate
    (C–S–H) binder inferred by MacKenzie/Barsoum 2011 from Bent Pyramid NMR;
    no blinded multinuclear NMR of provenance-secure casing stones against a
    stratified Tura/Dahshur/Giza natural suite with aged C–S–H controls has
    been admitted, so the revised lime–pozzolan casting pathway remains an
    unrebutted live alternative for at least some casing stones, and the
    interior C–N amorphous matter reported in Pumapunku subsample PP1C would,
    if the fragment were ever refit to a catalogued architectural block and
    dated near AD 600 against a Khapia control, still be the single most
    direct materials anomaly the anti-casting petrography has not answered.
claimAssessments:
  - claimId: GEO-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      The existence claim requires at least one secure cast monument; Egyptian
      casing-stone casting is opposed by multiple binder-aware petrographic
      studies with a positive control (GEO-E018–E021), while Pumapunku rests
      on proponent-only SEM of a loose, uncontrolled fragment (GEO-E006, GEO-E007,
      GEO-E057, GEO-E060). Feasibility evidence (GEO-C012) and quarry-method
      limits (GEO-C030) keep the logical space open but do not establish
      occurrence. Strongest opposing consideration: absence of any independently
      replicated, provenance-secure casting signature on an architectural block.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Barsoum 2006 (GEO-E012) and MacKenzie 2011 (GEO-E017) supply the main
      positives, but Folk & Campbell (GEO-E018), Harrell & Penrod (GEO-E019),
      Freestone & Middleton (GEO-E021), and especially Jana’s side-by-side with
      a real geopolymer control (GEO-E020) find natural sedimentary fabrics,
      shared microconstituents in quarry limestone, and no alkali–Al binder
      signature in casing stones. Salt-based supports are neutralized by
      geological halite readings (GEO-E033). Strongest opposing consideration:
      unresolved Lauer/Barsoum sample-authenticity disputes and the untested
      status of the revised C–S–H recipe against Jana’s alkali-specific negative.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Proponent SEM/petrography reports organic/amorphous features and mold-like
      surface morphology argued as geopolymeric (GEO-E006, GEO-E007, GEO-E058,
      GEO-E062), and the 2020 model restates artificial origin (GEO-E036), but
      the andesite work lacks a geological comparator (GEO-E060), uses loose
      off-monument debris (GEO-E057), and leaves guano-versus-binder unresolved
      (GEO-E059); 1971 quarry attribution still undermines (GEO-E008). Strongest
      opposing consideration: without independent replication on a documented
      architectural block, the materials claim does not rise above a single-team
      hypothesis.
  - claimId: GEO-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      As a claim about what the published SEM/petrographic papers report, the
      record confirms organic matter and microstructural features that those
      authors interpret as inconsistent with natural volcanic stone (GEO-E006,
      GEO-E007, GEO-E058). Local truth of the publications is intact; diagnostic
      force is limited by missing natural andesite controls (GEO-E060), insecure
      fragment provenance (GEO-E057), and authors’ own admission that N is only
      semi-quantitative (GEO-E059). Strongest opposing consideration: amorphous
      pockets were already noted in 1892 Tiwanaku andesite without any casting
      hypothesis (GEO-E061), so the features are not uniquely modern findings.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger is attached to this claim. The
      proposition about PP1 selection from loose exterior fragments is stated
      in sources underlying GEO-E057 (attached to GEO-C004/GEO-C021), but under
      the grading rule a claim without its own admitted evidence record remains
      unresolved unless that cross-attachment is used as carrier; even if so
      read, it is a sampling-context qualifier already folded into GEO-C004,
      not independently graded evidence here.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger is attached to this claim. Interior
      subsample PP1C content is described in GEO-E058, which the ledger attaches
      only to GEO-C004; without an admitted attachment to GEO-C918 the claim is
      held on its source alone and graded unresolved.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E035 directly records the 2020 abstract’s model: uncrushed Cerro
      Khapia andesite sand stored at Iwawe Stratum V, organo-mineral binder,
      and explicit non-use of the quadrangular piedras cansadas. As a
      theory-description claim this is established by the proponent primary
      statement itself. Strongest opposing consideration: only the abstract was
      admitted (PDF body blocked), so finer model details beyond the abstract
      are unchecked.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage Andean pathway is asserted with a laboratory claim that
      the acidic-medium mechanism was replicated using modern chemicals
      (GEO-E064), and guano elemental similarity is noted (GEO-E059), but no
      recipe, product characterization, or plant-extract/guano hardening data
      appear, and the authors state plant acids do not disaggregate andesite.
      Strongest opposing consideration: feasibility under truly pre-industrial
      inputs remains unshown; the record supports a hypothesized mechanism more
      than a demonstrated durable artificial stone.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Fóti’s methods critique (GEO-E024) correctly notes that standard
      metallic quarry-matching (PXRF, ICP-MS) does not see H/C/O binder chemistry
      and can return the same fingerprint for cast-from-aggregate stone; Nash
      2020 (GEO-E009) is therefore limited as an anti-casting proof. Jana 2007
      (GEO-E020) shows the claim does not extend to binder-aware petrography/SEM-EDS,
      which can detect real geopolymer signatures when present. Strongest opposing
      consideration: the claim’s sweep across “XRD” and blanket spectrographic
      blindness overstates tools that do see light-element and phase structure.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Demonstration blocks (GEO-E013), Barsoum microstructures read as rapid
      precipitation from basic solution (GEO-E012), and room-temperature lime +
      diatomaceous-earth C–S–H formation (GEO-E022) jointly show that hard,
      stone-like reconstituted limestone is chemically achievable with materials
      argued to be anciently available. Ancient production and visual
      indistinguishability at monument scale remain unproven. Strongest opposing
      consideration: self-reported demonstrations without independent analysis
      of the products, and modern feasibility does not establish ancient use.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Ledger support is thin: Fóti’s citation of Badari-period glassmaking as an
      ~850 °C charcoal-and-bellows precedent (GEO-E016), with dating and scale
      unverified in-packet. General pyrotechnology priors make the temperature
      band plausible, but that is a prior, not packet evidence, and crucible-scale
      heat is not industrial processing. Strongest opposing consideration: no
      direct experimental demonstration of sustained natron-silicate furnace
      practice at the claimed scale is admitted.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006 (GEO-E010) identifies Wadi el Natrun and al-Barnuj
      as primary ancient Egyptian natron sources for the vitreous-materials
      industry and documents decline and plant-ash replacement in the 7th–9th
      centuries AD; Sayre & Smith 1961 (GEO-E011) supplies the dual-oxide
      compositional tool behind supply timelines. Strongest opposing consideration:
      the paper concerns glass/faience, not stone-making, so availability does
      not imply use in megalithic casting.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only GEO-E015 carries the claim: an unattributed anecdote of rock-like
      material in a long-cycle outdoor fire pit, flagged as under-sourced in the
      project’s own skeptical review, with no controlled replication. Strongest
      opposing consideration: without attribution, chemistry, or replication,
      the discovery-pathway story is narrative rather than evidence.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Marčiš et al. 2023 (GEO-E001) photogrammetrically measured ~216 cm³/h at
      85 strikes/min in experimental dolerite-on-granite quarrying and concluded
      against pounders as sole method; Engelbach 1922 supplies historical context
      for the orthodoxy (GEO-E002). Strongest opposing consideration: single-team,
      single configuration; skilled ancient crews might outperform the protocol.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger is attached to this claim. Related
      discussion of Engelbach’s trial appears in GEO-E002, but that record’s
      claimIds are GEO-C001 and GEO-C002 only; under the grading rule GEO-C502
      is held on its source alone and remains unresolved.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 records Fóti’s report that visitor attempts on the designated
      Aswan test block with original dolerite pounders have produced no
      documented scoop-mark success; attempt rates and cumulative effort are
      unquantified and no systematic wear survey exists. Strongest opposing
      consideration: pure anecdote without measurement cannot fix a technological
      impossibility.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 carries Fóti’s description that ~sixteen-foot vertical shafts
      beside the unfinished obelisk are too narrow for effective bottom-of-shaft
      pounding posture; dimensions are not independently surveyed and the
      biomechanical claim is untested. Strongest opposing consideration: without
      measured geometry and trial, the anomaly is asserted rather than shown.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim that Aswan dolerite spheres served non-pounding purposes is
      undermined by Kelany et al. 2009 (GEO-E045), which places pounder stone in
      local granitoid dykes and identifies Pharaonic tool-production trenches
      with pounder-sized blanks adjacent to working areas — a local pounder
      industry embedded in the quarry landscape. Strongest opposing consideration:
      Kelany does not microwear-test what the finished spheres struck, so a
      dual-use residual is imaginable but not evidenced here.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The ledger’s only affirmative carrier is an uncited proponent webpage
      dating the breach to 820 and asserting a 1.5 cm salt coat (GEO-E004,
      GEO-E029). Al-Suyūṭī’s compilation of principal medieval breach accounts
      (Nemoy 1939) describes the opening and finds in detail with no salt, halite,
      or wall coating (GEO-E027); Nemoy dates the Egyptian stay to 832 (GEO-E028).
      Strongest opposing consideration: other unread Arabic sources could still
      contain the report, so absence from one compilation is strong but not
      exhaustive negative evidence.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Modern work confirms NaCl efflorescence in the Queen’s Chamber (GEO-E030),
      but Sessa et al. document halite as a frequent dominant salt at multiple
      Egyptian limestone heritage sites including the carved-bedrock Sphinx
      (GEO-E031) and cite Klemm & Klemm for halite as a primary sedimentary
      constituent of Giza nummulitic limestone (GEO-E032); the uniqueness
      premise and the European-cathedral comparator therefore fail. Strongest
      opposing consideration: no controlled concentration comparison of bulk
      versus surface Cl across monuments is in the packet.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E030 directly reports Sessa et al. 2026 XRD/SEM-EDX on Queen’s Chamber
      and Thieves’ Corridor efflorescence and detached fragments identifying only
      halite, calcite, and quartz, with no nitrates and no evidence of widespread
      gypsum crusts. Strongest opposing consideration: sampling was surface
      efflorescence and detached fragments only (no cores), and XRD detection
      limit is stated below 5 wt%.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 records Sessa et al. citing Klemm & Klemm 2010 that halite is the
      primary salt in Giza nummulitic limestones, present in stratigraphic layers
      and likely precipitated from evaporating marine or lagoonal waters — matching
      the claim’s wording. Klemm & Klemm were not read directly in-packet, so the
      support is second-hand. Strongest opposing consideration: until the primary
      geological monograph is checked, the sedimentary-halite reading remains
      mediated by a conservation paper.
  - claimId: GEO-C594
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E034 supplies a concrete Giza instance: 1995–97 interior interventions
      lack available documentation, yet cleaning and cavity filling are evident
      from photographs, sulfur-rich modern fill appears in XRF, and extensive
      salt efflorescence re-formed within years — exemplifying how surface claims
      can track restoration rather than antiquity. The universal “almost no site”
      quantification is broader than one monument. Strongest opposing consideration:
      a single well-documented confound does not by itself prove the global rate
      claim, though the methodological warning is sound.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only GEO-E014 carries the claim: Fóti’s interpretive argument that the
      Rekhmire mural’s scale and apparatus fit mineral/waterglass processing
      better than bronze casting. Conventional Egyptology’s metal-casting reading
      is unengaged in the packet. Strongest opposing consideration: pure
      proponent reinterpretation without residue, tool, or inscriptional evidence
      shifting the standard reading.