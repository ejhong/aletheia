  synthesis: >-
    The featured hypothesis is existential: one securely identified cast
    component in one major megalithic monument would suffice. The evidence
    does not yet provide that secure identification, but it does contain
    enough direct materials observations to give the hypothesis weak support
    rather than leave it wholly unresolved. The Egyptian branch is genuinely
    mixed. GEO-E012 reports anomalous microconstituents interpreted as
    reconstituted limestone, and GEO-E017 reports an NMR signature interpreted
    as natural limestone grains cemented by a human-made calcium-silicate gel.
    Against these stand the sedimentary and tectonic features in GEO-E018, the
    negative analysis of the disputed Lauer specimen in GEO-E019, the
    positive-control comparison in GEO-E020, and the independent museum
    fragment analysis in GEO-E021. The negative studies strongly contradict
    an alkali-aluminosilicate recipe and show that several alleged synthetic
    markers occur naturally. They do not fully dispose of the revised
    calcium-silicate-binder interpretation or exclude every block in an
    explicitly heterogeneous monument, so GEO-C020 remains mixed rather than
    simply contradicted.

    The Andean branch supplies the other steelmanned route to the hypothesis.
    GEO-E006, GEO-E007, and GEO-E058 report unusual microstructure and
    carbon- and nitrogen-bearing amorphous matter, including material inside
    a fragment rather than only on its surface. However, these records derive
    from one proponent team and sample series. GEO-E057 shows that the key
    andesite fragment was selected from loose debris by appearance, while
    GEO-E060 records the absence of a geological andesite comparator.
    Molecular identification, independent replication, secure architectural
    provenance, and the announced radiocarbon test are all absent. The
    observation reported by GEO-C004 is real as a published result, but its
    transfer to ancient architectural blocks is presently weak.

    The mechanism evidence improves plausibility without establishing
    occurrence. GEO-E010 supports ancient natron availability, GEO-E013
    reports large demonstration blocks, and GEO-E022 establishes a chemically
    feasible room-temperature calcium-silicate binder. Conversely, the
    proposed Andean replication in GEO-E064 lacks a recipe, measurements, and
    product characterization and used modern chemicals. Quarry provenance is
    also not decisive by itself: GEO-C030 correctly identifies a limitation
    of trace-element matching, but overextends that limitation to analytical
    methods capable of testing phases and microstructure. GEO-E020
    demonstrates that binder-aware petrography can detect a known artificial
    control.

    Ancillary arguments do not materially rescue the case. The alleged
    medieval salt report lacks a traceable source, modern analysis finds a
    natural sedimentary route for Giza halite, and comparable Egyptian
    limestone sites also effloresce. Quarrying-rate and shaft observations
    identify questions about technique but do not entail casting. Thus the
    strongest case for casting consists of unresolved materials anomalies,
    while the strongest case against it consists of direct natural-stone
    petrography, positive-control work, and insecure provenance of the best
    Andean sample. The resulting case verdict is weakly_supported.

    Sensitivity is greatest to GEO-E020 because it is the only admitted study
    comparing pyramid stone, natural limestone, and a known Davidovits-made
    positive control. Removing it would make the Egyptian evidence less
    negative and increase the relative weight of GEO-E012 and GEO-E017, but
    the case verdict survives: GEO-E018, GEO-E019, GEO-E021, and the unresolved
    Andean provenance and control problems still prevent provisional support.
  steelman: >-
    GEO-E017 reports a Bent Pyramid casing stone whose multinuclear NMR
    spectrum was interpreted as Tura limestone grains cemented by a
    human-made amorphous calcium-silicate gel. GEO-E020 tested an
    alkali-aluminosilicate geopolymer, not an aged calcium-silicate-hydrate
    control, and no blinded replication against a broad stratified natural
    limestone suite has answered that specific positive result.
claimAssessments:
  - claimId: GEO-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The broad existence claim receives indirect support from the Egyptian
      materials results attached to GEO-C020, especially GEO-E012 and
      GEO-E017, and from the Pumapunku results attached to GEO-C021 in
      GEO-E006 and GEO-E007. None is a provenance-secure, independently
      replicated identification of cast monument stone, while GEO-E018
      through GEO-E021 provide substantial natural-stone counterevidence for
      the best-studied Egyptian case. The strongest opposing consideration is
      that GEO-E009 fits conventional sourcing at Stonehenge and no admitted
      record securely establishes casting at another monument.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E012 reports Great Pyramid microconstituents interpreted as rapid
      precipitation from a basic solution, while GEO-E017 independently uses
      NMR to infer a calcium-silicate gel in a Bent Pyramid casing specimen.
      GEO-E018 through GEO-E021 instead find natural sedimentary structures,
      natural occurrences of alleged synthetic markers, and no diagnostic
      alkali-geopolymer binder; GEO-E020 is especially probative because it
      includes a known artificial positive control. The strongest
      consideration against a negative verdict is that the claim concerns
      only some blocks and that the revised calcium-silicate interpretation
      in GEO-E017 was not tested by GEO-E020's alkali-geopolymer control.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      GEO-E006 and GEO-E007 directly report petrographic, microstructural, and
      organic-matter observations interpreted as evidence of artificial
      Pumapunku stone, but they are one non-independent proponent sample
      series. GEO-E058 strengthens the surface-contamination response by
      reporting similar material inside a fragment. The strongest opposing
      consideration is that GEO-E057 gives the key andesite fragment insecure
      architectural provenance and GEO-E060 records that no geological
      andesite control was analyzed; GEO-E008 also supports natural quarry
      sourcing for the sandstone.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006 and GEO-E007 establish the claim as worded: published SEM and
      petrographic analyses report the stated features and their authors
      argue for an artificial origin. GEO-E058 further records the authors'
      report of carbon- and nitrogen-bearing amorphous matter in an interior
      subsample. The strongest opposing consideration affects the authors'
      interpretation rather than this reporting claim: GEO-E057 and GEO-E060
      document insecure monument provenance and the absence of a natural
      andesite comparator.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C913, so the proposition is held
      on its source anchor alone and cannot be graded as an admitted
      observation. GEO-E057, attached to GEO-C004 and GEO-C021, describes a
      similar loose-debris sampling context, but that indirect record does not
      replace direct evidence attached to this claim.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C918, and its source citation is
      not itself evidence under the ledger rules. GEO-E058, attached to
      GEO-C004, describes the reported PP1C interior finding, but it does not
      change the required source-only status of this claim.
  - claimId: GEO-C903
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E035 directly quotes the proponents' 2020 abstract specifying
      natural Cerro Khapia andesite sand, storage at Iwawe Stratum V, and
      non-use of the quadrangular piedras cansadas. That is sufficient for a
      claim describing what the model says rather than whether the model is
      correct. The strongest opposing consideration is that only the abstract
      was read, so details or qualifications in the inaccessible paper body
      remain unchecked.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E064 reports that an acidic-medium binder mechanism was replicated
      in the proponents' laboratory, which supplies limited support for
      chemical feasibility. It presents no recipe, measurements, durability
      data, or product characterization and used modern chemicals rather than
      the proposed plant and guano inputs. The strongest opposing
      consideration is GEO-E059, where the authors acknowledge that their
      equipment could not quantify nitrogen and could not identify the
      observed material as either unreacted guano or binder.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow point that XRF and ICP-MS do not directly
      measure hydrogen, carbon, or oxygen and that a same-source aggregate can
      retain a quarry's trace-element fingerprint. The claim overgeneralizes
      from provenance matching to XRD and other materials analysis:
      GEO-E020's positive control demonstrates that binder-aware petrography
      can distinguish a known artificial limestone even when bulk provenance
      chemistry cannot. The strongest opposing consideration to rejection is
      that GEO-E009's quarry match alone still cannot logically exclude
      transport and casting of material from that quarry.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large re-agglomerated limestone
      demonstration blocks, while GEO-E022 shows that lime, diatomaceous
      earth, and water can form a calcium-silicate-hydrate binder at room
      temperature. Ingredient availability is also supported by GEO-E010
      through GEO-C011 and the temperature evidence attached to GEO-C010.
      The strongest opposing consideration is that the large-block result is
      self-reported and has not received independent mechanical,
      petrographic, or durability testing under an ancient-input protocol.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 offers a weak archaeological temperature precedent for
      approximately 850 °C, though its Badari dating and technical basis were
      not independently verified. This verdict also leans on the stated
      general pyrotechnological prior that forced-air charcoal furnaces can
      attain temperatures in this range. The strongest opposing consideration
      is that achieving the temperature in a small furnace does not
      demonstrate sustained industrial-scale natron processing.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 strongly identifies Wadi el Natrun and al-Barnuj as the primary
      ancient Egyptian natron sources for vitreous industries and documents
      replacement by plant ash during the seventh through ninth centuries.
      GEO-E011 supplies the compositional framework used to distinguish
      natron glass from plant-ash glass. The strongest opposing consideration
      is that these records establish supply for glass and faience, not the
      quantity required for monumental stone production.
  - claimId: GEO-C013
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E015 is the sole support and recounts an accidental formation of
      rock-like material in a repeatedly used outdoor fire pit. It is an
      unattributed anecdote with no recipe, sample characterization, or
      controlled replication. The strongest opposing consideration is that
      no experiment has shown the material to arise through the specified
      ash-carbonation chemistry or to possess structural stone properties.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports a controlled photogrammetric measurement of
      216 cm³ per hour at 85 strikes per minute, matching the claim's stated
      protocol and result. The claim is about what that experiment yielded,
      not a universal ancient quarrying rate. The strongest opposing
      consideration is that one team, granite, tool configuration, and worker
      do not establish how skilled ancient crews would perform.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C502, so its detailed account of
      Engelbach's trial, calculations, and view of hand use remains held on
      its source anchor alone. A source locator is not an admitted
      observation, and the compound historical description therefore remains
      unresolved.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using original dolerite pounders have
      collectively failed to reproduce a scoop mark, providing direct but
      anecdotal support. Neither the number, duration, technique, nor
      documentation of those attempts is given. The strongest opposing
      consideration is that untrained and unmonitored visitor activity is not
      a controlled test of what skilled quarry workers could produce.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports the shafts as roughly sixteen feet deep and too narrow
      for effective pounding at their bottoms. The dimensions have not been
      independently surveyed and the asserted biomechanical limitation has
      not been experimentally tested. The strongest opposing consideration is
      that the shafts may represent staged extraction or prospecting features
      whose present geometry does not reproduce the worker's geometry during
      excavation.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite within the Aswan granitoids and identifies
      nearby Pharaonic trenches with pounder-sized blanks as tool-production
      quarries, contradicting the claim's premise that the spheres were
      transported to Aswan for another purpose. Their quarry context and
      association with stone-working areas favor use as locally produced
      tools. The strongest opposing consideration is that no microscopic
      use-wear analysis in the admitted evidence directly establishes what
      surfaces each pounder struck.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E004 and GEO-E029 trace the salt-layer story only to an uncited
      proponent webpage, not to a named medieval account. GEO-E027 finds no
      salt in al-Suyūṭī's two accounts of al-Maʾmūn's breach, while GEO-E028
      supports approximately 832 rather than the webpage's 820 date. The
      strongest opposing consideration is that the admitted search covers
      only one later compilation and does not prove that no other Arabic
      source contains the report.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms NaCl efflorescence on Great Pyramid
      chamber stone but supplies no concentration comparison with natural
      monuments. GEO-E031 reports halite efflorescence at other Egyptian
      limestone sites, including the bedrock-carved Sphinx, and GEO-E032 gives
      a natural sedimentary origin for halite in Giza limestone. The strongest
      opposing consideration is that these comparisons are qualitative, so
      an unusually high Pyramid concentration has not been directly excluded.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX identification of correlated sodium
      and chlorine and XRD identification of only halite, calcite, and quartz
      in the analyzed samples, with no nitrates or widespread gypsum crust.
      This establishes the stated analytical result for the sampled
      efflorescence and detached fragments. The strongest opposing
      consideration is the stated XRD detection limit, under which minor
      sulfate phases could have escaped detection.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports sodium and chlorine in detached substrate material and
      cites Klemm and Klemm for halite within Giza stratigraphic layers,
      attributed to evaporating marine or lagoonal water during formation.
      This supports the stratigraphic and natural-origin portions, although
      “primary constituent” should be understood as the primary salt rather
      than a major bulk mineral. The strongest opposing consideration is that
      the underlying geological source was not read directly and no unworked
      bedrock core was analyzed in the admitted record.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides a concrete Giza example: unavailable documentation
      for 1995–1997 interventions, inferred cleaning and cavity filling, a
      sulfur-rich restored area, and recurrent efflorescence. This establishes
      that undocumented intervention is a live confound for surface evidence
      at one central monument. The strongest opposing consideration is that
      one site cannot substantiate the much broader assertion that almost no
      megalithic site has a complete published restoration history.
  - claimId: GEO-C005
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E014 establishes the claim as carefully worded: the Rekhmire mural
      is conventionally read as metal casting, and Fóti has argued that its
      scale and apparatus fit mineral or waterglass processing better. This
      verdict establishes the existence and content of that interpretation,
      not its correctness. The strongest opposing consideration is that the
      conventional metal-casting interpretation remains unrefuted and no
      inscription, residue, or associated tool independently favors mineral
      processing.