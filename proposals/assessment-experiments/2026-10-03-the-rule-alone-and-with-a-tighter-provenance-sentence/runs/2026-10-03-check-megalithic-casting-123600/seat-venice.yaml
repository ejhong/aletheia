  verdict: mixed
  loadBearing: [GEO-C020, GEO-C012, GEO-C030]
  weakestLinks: [GEO-C013, GEO-C002, GEO-C502, GEO-C511, GEO-C506]
  synthesis: >-
    The case splits into three tiers of very different evidential health. The mechanism rung
    is the strongest: reconstituted limestone is chemically real — a Davidovits-made
    geopolymeric limestone existed as a physical positive control in GEO-E020, demonstration
    blocks are reported (GEO-E013), and the revised C–S–H binder route is laboratory-
    demonstrated (GEO-E022) — while ingredient availability (GEO-C011) rests on strong,
    uncontroversial peer-reviewed work. The methods critique (GEO-C030) is also sound as
    scoped: PXRF and ICP-MS genuinely cannot see the light elements that would mark a
    binder, so quarry-matching alone cannot refute casting. But the attribution rung, where
    the hypothesis must actually win, currently loses everywhere it has been tested. For
    GEO-C020, three independent lines (GEO-E018, E019, E021) report natural sedimentary
    bedding, burrows, tool marks, and no binder fabric, and GEO-E020 — the only study with a
    positive control — showed that a real casting signature is detectable when present and
    absent from the casing stones. The pro-casting results (GEO-E012, E017) are real
    observations on samples whose provenance is publicly disputed and never replicated on
    provenance-secure material. The Andean branch (GEO-C021) hangs on a single proponent
    team, a loose surface find of undocumented provenance (GEO-E057), no geological
    comparator at all (GEO-E060), and an announced 14C date that never appeared (GEO-E066).
    The salt discriminator collapsed: halite is documented at the carved Sphinx and in Giza
    strata (GEO-E031, E032), and undocumented 1990s interventions (GEO-E034) confound every
    surface observation at Giza. The honest roll-up: the hypothesis retains a demonstrated
    feasibility and a methods critique that blocks one class of conventional refutation, but
    every positive attribution claim is either contradicted by the strongest admitted
    evidence or carried by a single unblinded proponent line. Steelmanning both directions:
    proponents rightly point to observations no conventional study has explained; opponents
    rightly point to the only positive-control test ever run, which came back negative. The
    designed-but-unrun tests (GEO-R011, R017, R009/R012) are exactly what the field lacks.
  steelman: >-
    The interior organic matter in Pumapunku andesite (PP1C, GEO-E058): carbon- and
    nitrogen-bearing amorphous material lying beneath plagioclase crystals inside
    monument-attributed stone, with no geological Khapia andesite control ever analyzed
    (GEO-E060), no molecular identification attempted, and the announced 14C dating never
    published (GEO-E066). No admitted record explains this observation under the carved
    account, and the proponents' own stated next step was never taken.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The umbrella claim inherits the case's split: feasibility and one contested
      non-proponent dataset (GEO-E012, E017) support that cast stone is possible and that
      some pyramid samples show anomalies, while the strongest direct tests (GEO-E018,
      E020, E021) find natural features and no binder on monument stone. The strongest
      opposing consideration is Jana's positive control (GEO-E020), which shows a casting
      signature would have been detectable. No specific attribution currently survives
      adversarial analysis, but the mechanistic feasibility is genuine.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The weight of admitted evidence runs clearly against cast blocks at Khufu: in-situ
      bedding, burrows and tool marks (GEO-E018), the Lauer sample shown natural (GEO-E019,
      contested), and a British Museum fragment shown natural by five techniques (GEO-E021),
      with GEO-E020 demonstrating via a genuine geopolymer control that binder signatures
      are detectable when present and absent from casing stones. The surviving positives
      (GEO-E012, E017) rest on samples whose provenance was publicly disputed by the SCA
      and have no replication on secure material. Confidence is moderate rather than high
      because GEO-E017's C–S–H binder revision lies outside Jana's test, and the
      sample-authenticity dispute is unresolved.
  - claimId: GEO-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only support is a single proponent team and sample series (GEO-E006, E007,
      E036), and the ledger's own records cap it hard: the andesite sample PP1 was picked
      from loose debris outside the protected area (GEO-E057), no geological andesite was
      ever compared (GEO-E060), nitrogen could not be quantified (GEO-E059), and the 1971
      provenance study (GEO-E008) still stands untested against the methods critique. The
      strongest opposing consideration on the pro side — interior organic matter beneath
      feldspar crystals (GEO-E058) — is genuinely unexplained but comes from the same
      fragment and team, so neither direction can be graded.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, this is a claim about what the published analyses report and argue, and
      the ledger's records (GEO-E006, E007, E058) confirm that the proponents' peer-reviewed
      and self-published work does report organic matter inside andesite and argues it is
      inconsistent with natural volcanic stone. The strongest opposing consideration is
      diagnostic, not descriptive: volcanic rocks host natural glassy and amorphous phases,
      no blind test of the discriminating criteria exists (GEO-E007 limitations), and the
      authors themselves cannot say whether the matter is unreacted guano or binder
      (GEO-E059) — so the claim's truth as a report does not transfer to GEO-C021.
  - claimId: GEO-C913
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim directly, but the basis that carries it
      is GEO-E057 (attached to GEO-C004 and GEO-C021), which quotes the same source
      (SRC-DAVIDOVITS-2019, §2.2.1) stating the fragments were chosen from debris outside
      the protected monument area. The claim as stated — that PP1 was selected by appearance
      from loose fragments rather than sampled from an identified block — matches that
      record and the source's own words. The opposing consideration is the source's own
      hedge that surface-collection does not exclude monument origin, so this caps rather
      than refutes GEO-C004.
  - claimId: GEO-C918
    verdict: well_supported
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim, but GEO-E058 (attached to GEO-C004)
      records the same statement from the same source: an interior subsample PP1C cut from
      PP1A showing the same multi-element EDS spectrum, including a dark sheet beneath two
      plagioclase crystals. As a report of what the analysts state, the claim is supported;
      confidence is low because the record is weak-strength, single-team, same-fragment,
      and EDS is elemental only. The strongest opposing consideration is that EDS cannot
      identify the matter as organic at all.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E035 directly supports this theory-description claim from the primary abstract
      (SRC-DAVIDOVITS-2020) with strong strength: Khapia sand as aggregate, storage at
      Iwawe Stratum V, and the piedras cansadas explicitly not used. As a description of
      what the model specifies, it is accurately carried. The opposing consideration is
      that only the abstract was read (the PDF returned 403), the venue is the
      proponents' own journal, and the model's factual predictions (the Iwawe deposit,
      GEO-R009) remain untested.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim asserts durable artificial stone produced under pre-industrially accessible
      conditions, but the admitted records show the three-stage chemistry is only claimed:
      plant acids do not disaggregate andesite (GEO-E064), the acid-medium binder was
      replicated only with modern chemicals, without recipe or product characterization,
      and the guano-hardener identification is unresolved by the authors' own statement
      (GEO-E059). The strongest opposing consideration — the Davidovits, Bonnet & Mariotte
      1982 work cited in the claim's anchor — was never admitted as evidence, so the
      pre-industrial feasibility half rests on assertion.
  - claimId: GEO-C030
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The physics is standard and the human-reviewed record GEO-E024 carries it: XRF and
      ICP-MS cannot detect hydrogen, carbon, or oxygen, so bulk trace-element matching of
      cast stone made from same-quarry aggregate would return the same answer as carved
      stone. The strongest opposing consideration is GEO-E020, whose positive control shows
      casting signatures are detectable — but by binder-aware petrography, not by the
      trace-element methods the claim names, so it bounds the critique without refuting it.
      The residual caveat is XRD, which does resolve oxygen-bearing mineral lattices and is
      only blind to amorphous phases.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Feasibility has real support: a genuine Davidovits-made geopolymeric limestone
      existed and was analyzed (GEO-E020), demonstration blocks including a multi-ton
      limestone block are reported (GEO-E013), and lime-plus-diatomaceous-earth C–S–H
      cementation at room temperature is laboratory-established (GEO-E022). The strongest
      opposing consideration is that every demonstration is by the proponent organization
      with no independent analysis of any block, and nothing tests ancient-scale production;
      feasibility is demonstrated, occurrence is not.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The admitted record GEO-E016 weakly supports ~850 °C pyrotechnology via Badari-period
      glassmaking, with its own flagged need for verification; the verdict leans primarily
      on a stated prior — Bronze Age Egyptian metallurgy, faience and glassmaking
      routinely reached and exceeded this temperature — not on the ledger alone. The
      strongest opposing consideration is scale: crucible-level heat does not establish
      the sustained industrial heat and throughput that monument-scale natron processing
      would need.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 (strong, peer-reviewed, uncontroversial) directly establishes industrial-
      scale natron sources at Wadi el Natrun and al-Barnuj with the documented 7th–9th
      century decline, and GEO-E011 supplies the compositional typology behind such
      supply timelines. This is the healthiest historical claim in the case. The strongest
      opposing consideration is scope: Shortland et al. concerns glass and faience and
      says nothing about stone, so availability does not imply use.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only admitted support is GEO-E015, an unattributed anecdote that the project's
      own skeptical review flagged as under-sourced, with no controlled replication
      attempted (GEO-R007 exists precisely because of this). The strongest opposing
      consideration is that ash-carbonation chemistry is real in cement science, so the
      claim is not implausible — but a plausible pathway asserted from one fireside story
      cannot be graded either way.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E001 directly supports the measurement, and the source record confirms the
      216 cm³/h figure was checked against the published paper. As a measurement claim it
      stands. The strongest opposing consideration is scope: one team, one granite, one
      tool configuration, with the authors' own limitation that skilled ancient crews with
      maintained tools may outperform the protocol — which is why GEO-R002 replication
      matters.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The closest basis is GEO-E002 (attached
      to GEO-C001 and GEO-C002), which carries the same characterization of Engelbach's
      one-hour trial and workforce heuristic but expressly flags it as taken from Fóti's
      account and not verified against the 1922/1923 monographs — so the claim rests on
      its source alone and even its surrogate record is unverified. Note that GEO-C911
      (Kelany et al. on the pounding attribution) is not among the graded claims here.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 supports the reported absence of successful tourist reproductions, but at
      weak strength with the record's own limitations: anecdotal, attempt rates and
      cumulative effort unquantified, no systematic survey of the test block's wear, and a
      proponent source. The strongest opposing consideration is that undisciplined
      visitor striking failing to replicate a skilled task is a weak signal even if the
      report is accurate.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 is the sole support: a proponent description of shafts too narrow for
      effective pounding, with dimensions not independently surveyed and the biomechanical
      claim untested. The strongest opposing consideration is that Engelbach's own
      test-shaft reading (prospecting pits) offers a conventional explanation the
      geometry-as-described does not yet exclude, and GEO-R013 is designed to settle it.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: low
    reasoning: >-
      The ledger's only carrier of the salt report is an uncited proponent webpage
      (GEO-E029), the principal medieval compilation's al-Ma'mun entries describe the
      breach in detail with no mention of salt (GEO-E027), and the date is wrong (832, not
      820; GEO-E028). The strongest opposing consideration is that GEO-E027 is negative
      evidence from one 15th-century compilation — al-Maqrīzī's Khiṭaṭ, al-Baghdādī, and
      Vyse's Arabic extracts remain unread (GEO-R001) — so the report is unanchored rather
      than proven invented.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim's comparative premise — that comparable natural limestone monuments do not
      exhibit surface NaCl — is directly undermined: halite efflorescence is documented at
      the carved Sphinx and other Egyptian limestone sites (GEO-E031), and halite is
      reported as a primary constituent of Giza nummulitic limestone itself (GEO-E032),
      with a stated marine-evaporation mechanism. The presence component is confirmed by
      modern instrumentation (GEO-E030), but the same study analysed surface efflorescence
      only and cannot test bulk distribution, and the taste-test record (GEO-E026) is
      weightless. The strongest opposing consideration is that no controlled
      concentration comparison has actually been run (GEO-R010).
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 documents that the reinterpretation exists and is argued on scale and
      apparatus details, which is what the claim as stated asserts. The strongest opposing
      consideration is that this is one proponent's interpretive argument, the conventional
      Egyptological metal-casting reading has never engaged it, and no Egyptological
      re-examination (GEO-R008) has been run — so the fit is asserted, not tested.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GEO-E030 directly supports this measurement claim with verbatim quotes from a
      2026 peer-reviewed open-access paper: XRD of seven samples confirming only halite,
      calcite, and quartz, SEM-EDX Na–Cl correlation of 0.969, no nitrates, no widespread
      gypsum. The strongest opposing consideration is instrumental: the stated XRD
      detection limit below 5 wt% means minor phases could be missed, so "only" holds at
      the detection threshold, and no stone was cored.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      GEO-E032 records the statement accurately (the second reader's direction dissent is
      well taken: the passage restates and thus supports this descriptive claim), and the
      quote is verbatim from Sessa et al. But the halite-in-strata statement is
      second-hand — Klemm & Klemm 2010 was cited, not read — and SEM-EDX quantification is
      semi-quantitative. The strongest opposing consideration is that the primary source
      behind the attribution has never been read in this ledger.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides one concrete, moderate-strength instance — undocumented 1995–97
      cleaning and filling inside the Khufu pyramid with a modern S-rich fill identified
      in situ — which supports the claim's plausibility but cannot carry its sweeping
      quantifier ("almost no megalithic site"). The strongest opposing consideration is
      that the general claim is a plausible professional observation that the ledger has
      admitted almost no evidence for beyond this single monument.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: low
    reasoning: >-
      The only admitted evidence bearing on this interpretive claim, GEO-E045, undermines
      it: Kelany et al. document dolerite from dykes within the Aswan granitoids and
      purpose-built Pharaonic pounder-production quarries adjacent to the working areas,
      cutting against the premise of spheres imported for a non-pounding purpose. The
      strongest opposing consideration is the editor's own caveat that this record does
      not test what the pounders actually struck, and Engelbach's contrary 1922 judgment
      on local sourcing is unresolved — hence low confidence rather than a firm negative.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      As with GEO-E014 above: the claim asserts an interpretive argument has been made
      that fits mineral processing better than bronze work, and that argument is
      documented, but it is unengaged by conventional Egyptology and rests entirely on a
      proponent reading of scene scale and apparatus. The strongest opposing
      consideration is that no period inscription, residue, or tool evidence has been
      brought to bear on either reading.