  synthesis: >-
    The featured hypothesis (at least some megalithic blocks are cast reconstituted stone rather than exclusively carved natural rock) rests on three interlocking rungs: mechanism feasibility, site-specific materials observations, and attribution. Mechanism evidence is uneven but non-zero. Natron sources at industrial scale are well documented (GEO-E010) and temperatures near 850 °C are within charcoal-bellows reach on the basis of glassmaking precedents, while laboratory reconstitutions of limestone (Barsoum-group C–S–H gels, Davidovits demonstration blocks) show that hard, visually stone-like products can be made from period-available inputs. The methods critique (GEO-C030) correctly notes that bulk trace-element quarry matching is blind to H/C/O binder chemistry and therefore cannot by itself refute casting from same-quarry aggregate; Jana’s positive-control petrography (GEO-E020) nevertheless demonstrates that binder-aware microscopy and EDS can detect alkali-aluminosilicate signatures when they are present, limiting the reach of the blindness argument. On the Egyptian side the load-bearing attribution claim (GEO-C020) is contradicted by multiple independent petrographic and multi-technique studies (Folk & Campbell, Harrell & Penrod, Jana with genuine geopolymer control, Freestone & Middleton). These record sedimentary bedding, burrows, fragile fossils, tectonic fractures confined to single blocks, opal-CT lepispheres identical to those in natural Tura limestone, absence of the Na/K/Al enrichment that characterises real geopolymer binder, and no crushed-and-reaggregated fabric. Barsoum 2006 and MacKenzie 2011 supply the principal positive microstructural and NMR observations, yet sample provenance remains contested by Egyptian authorities and the same classes of features have been reported in undisputed natural limestones; the salt-layer and surface-NaCl lines collapse once medieval Arabic compilations are checked (no salt mentioned) and modern conservation work shows halite is both native to Giza nummulitic limestone and ubiquitous on other Egyptian limestone monuments including the bedrock-carved Sphinx. On the Andean side the published SEM/EDS reports of organic matter and amorphous phases inside Pumapunku andesite (GEO-C004) are real observations by the proponent team, but the key andesite fragment PP1 was collected from loose debris outside the protected area, lacks a natural Khapia control, and the nitrogen signal is only semi-quantitative so that guano residue versus binder remains unresolved; the 1971 Bolivian quarry attribution and the absence of independent replication therefore leave GEO-C021 only weakly supported. Tool-mark and rate observations (slow dolerite removal, unreproduced scoop marks, narrow shafts) are locally accurate yet do not compel casting once conventional alternatives (supplemental techniques, different workforce organisation, weathering) are admitted. Restoration-history gaps (GEO-C594) further qualify every surface claim. Taken together the evidence yields a mixed verdict: mechanism is provisionally open, Egyptian attribution is contradicted by the strongest petrographic record, Andean attribution remains an unreplicated proponent observation on insecure samples, and no single site yet supplies a provenance-secure, binder-positive, independently replicated demonstration. The hypothesis is neither established nor fully retired; decisive tests (blinded NMR with aged C–S–H controls, Khapia extraction-face survey, bulk-chlorine and radon-emanation discriminators, documented-refit andesite re-analysis) remain undone.
  steelman: >-
    Barsoum’s Si-rich microconstituents and hydrated phases “not known to hydrate in nature,” together with the MacKenzie NMR shoulder on a Bent Pyramid casing stone read as Tura grains in an artificial calcium-silicate gel, remain without a fully matched natural-limestone explanation on provenance-secure samples, and Jana’s alkali-geopolymer control does not test that revised C–S–H chemistry.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The broad existence claim inherits the split record of its dependents: Egyptian blocks are contradicted by multi-laboratory petrography with positive controls, while Andean andesite/sandstone observations remain proponent-only on insecure samples. Strongest opposing consideration is the absence of any provenance-secure, independently replicated binder signature at a major monument.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: high
    reasoning: >-
      Multiple independent studies (Folk & Campbell in-situ sedimentary and tectonic features, Harrell & Penrod on the Lauer sample, Jana side-by-side with genuine Davidovits geopolymer showing missing Na/K/Al enrichment and shared opal-CT with natural Tura, Freestone & Middleton multi-technique natural limestone) outweigh the Barsoum SEM/TEM and MacKenzie NMR positives, whose sample provenance is contested and whose features have natural analogues. Strongest opposing consideration remains the still-unreplicated Barsoum microconstituents on secure samples.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Proponent SEM/EDS papers report organic and amorphous phases argued as artificial, yet the key andesite comes from loose surface debris, no geological andesite control was run, nitrogen quantification is incomplete, and 1971 quarry matching plus the methods-blindness reply leave the result unconfirmed. Strongest opposing consideration is the total lack of independent replication or secure architectural-block sampling.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is that published SEM and petrographic analyses report organic matter and features the authors deem inconsistent with natural volcanic stone; GEO-E006, GEO-E007 and GEO-E058 document exactly those reports. Strongest opposing consideration is that the same papers supply no natural comparator and the sample is a loose fragment, but that goes to interpretation and weight, not to the descriptive accuracy of the claim as stated.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. Although GEO-E057 (attached to GEO-C004 and GEO-C021) describes selection of PP1 from loose fragments outside the protected area, the ledger does not cite C913 itself, leaving the claim on source alone.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. GEO-E058 (attached to GEO-C004) reports an interior subsample PP1C with similar amorphous matter, yet C918 is not listed among its claimIds, so the observation remains unadmitted for this proposition.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E035 directly quotes the 2020 abstract stating the use of uncrushed Cerro Khapia andesite sand stored at Iwawe Stratum V and the non-use of the piedras cansadas, matching the claim’s description of the model. Strongest opposing consideration is that only the abstract was retrieved, but the descriptive match is exact.
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage plant-acid/guano chemistry is asserted and a laboratory replication with modern chemicals is claimed (GEO-E064), yet no recipe, product data or ancient-input trial is shown, and plant acids are stated not to disaggregate andesite itself. Strongest opposing consideration is the complete absence of characterised experimental products under pre-industrial conditions.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Trace-element methods (XRF, ICP-MS) are indeed H/C/O-blind and quarry matching therefore cannot distinguish same-source aggregate cast stone from carved stone; Fóti’s formulation and the Nash 2020 example illustrate the point. Strongest opposing consideration is Jana’s demonstration that binder-aware petrography and EDS detect casting signatures when present, so the critique does not extend to all analytical routes.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Demonstration blocks, room-temperature C–S–H gels from lime plus diatomaceous earth, and Barsoum-group microstructures show that hard limestone-like material can be produced from plausible ancient inputs. Strongest opposing consideration is that modern or lab feasibility does not establish ancient practice, and the original alkali-geopolymer recipe has been revised.
  - claimId: GEO-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Badari-period glassmaking is cited as a temperature precedent near 850 °C achievable with charcoal and bellows, but the claim rests on a single proponent source without independent pyrotechnology verification or scale-up evidence. Strongest opposing consideration is that crucible-scale heat does not automatically supply industrial-throughput processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      Shortland et al. 2006 document Wadi el Natrun and al-Barnuj as primary ancient natron sources with a clear 7th–9th-century decline and replacement by plant ash; Sayre & Smith supply the compositional typology. Strongest opposing consideration is none on the historical supply facts themselves; the paper is silent on stone-making.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The accidental fire-pit pathway is an unattributed anecdote flagged as under-sourced even by the project’s own review; no controlled replication or material characterisation exists. Strongest opposing consideration is the total lack of empirical support beyond the story.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Marčiš et al. 2023 photogrammetrically measured 216 cm³ h⁻¹ at 85 strikes min⁻¹ under controlled conditions and concluded against pounders as sole method. Strongest opposing consideration is that it is a single-team, single-granite experiment; skilled ancient crews might differ, but the reported figure stands.
  - claimId: GEO-C502
