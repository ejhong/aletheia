  - claimId: GEO-C511
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The non-pounding interpretive claim is proponent assertion; Kelany et al. 2009 locate dolerite dykes and Pharaonic tool-production quarries immediately adjacent to the working areas, favouring a local pounder industry. Strongest opposing consideration is the direct field association of pounders with extraction debris.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The sole carrier of the salt-layer report is an uncited proponent webpage dating the event to 820; al-Suyūṭī’s compilation of the principal medieval accounts (via Nemoy) describes the breach and finds in detail yet never mentions salt, and the caliph’s Egyptian stay is dated 832. Strongest opposing consideration is that other unread Arabic sources might still contain the report, but the burden of citation is unmet.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Sessa et al. confirm surface halite on Queen’s Chamber stone, yet the same paper and its cited literature document identical halite efflorescence on the bedrock-carved Sphinx, other pyramids, tombs and monasteries, and treat NaCl as a primary sedimentary constituent of Giza nummulitic limestone. The claim’s comparative premise therefore fails. Strongest opposing consideration is the lack of quantitative concentration matching, but qualitative ubiquity already undermines uniqueness.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      Sessa et al. 2026 XRD and SEM-EDX of efflorescence and detached fragments explicitly identify only halite, calcite and quartz, with no nitrates and no widespread gypsum. Strongest opposing consideration is the surface-only sampling, which does not affect the phase identification as stated.
  - claimId: GEO-C906
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. cite Klemm & Klemm 2010 for halite as a primary constituent of Giza nummulitic limestones precipitated from evaporating marine or lagoonal waters; the statement is second-hand but clearly attributed. Strongest opposing consideration is that Klemm & Klemm itself was not read in the packet, yet the claim accurately reports the cited reading.
  - claimId: GEO-C594
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Sessa et al. document that 1995–97 cleaning and cavity-filling inside the Khufu pyramid left no available records, that sulfur-rich modern fills are detectable, and that salt re-formed within years—exactly the restoration-history gap asserted. Strongest opposing consideration is that the claim is general while the evidence is one-site, but the instance validates the methodological warning.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Fóti’s reinterpretation of the Rekhmire mural as mineral processing rather than metal casting is an untested proponent reading; conventional Egyptology has not engaged it and no residue or tool predictions have been checked. Strongest opposing consideration is the complete absence of independent iconographic or archaeological support.