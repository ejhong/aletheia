caseAssessment:
  verdict: mixed
  loadBearing: [GEO-C020, GEO-C021, GEO-C004, GEO-C030, GEO-C012]
  weakestLinks: [GEO-C913, GEO-C918, GEO-C580, GEO-C003, GEO-C005]
  synthesis: >-
    The case is mixed because its principal site-specific branches diverge, not
    because the evidence is evenly balanced. For the Great Pyramid,
    binder-aware and petrographic evidence weighs against casting. GEO-E018
    reports widespread sedimentary, fossil, fracture, and quarrying features
    consistent with natural limestone; GEO-E020 compares casing stones with an
    actual Davidovits geopolymer positive control and finds the expected binder
    signature absent; and GEO-E021 independently identifies a museum casing
    fragment as natural limestone. GEO-E019 reaches the same conclusion for a
    proponent showcase specimen, although its sample identity is disputed.
    These records outweigh GEO-E012, whose reported microconstituents are
    potentially natural and whose samples have contested provenance, and
    GEO-E017, which is a limited NMR result proposing a different C-S-H binder.
    They do not prove that every pyramid block is natural, but they contradict
    the presently tested versions of GEO-C020.

    The Pumapunku branch supplies the strongest remaining positive case.
    GEO-E006 and GEO-E007 report microstructural anomalies and organic matter,
    while GEO-E058 places similar carbon- and nitrogen-bearing matter inside
    the sampled fragment rather than only on its surface. Nevertheless, these
    records come from one proponent team and sample series. GEO-E057 says the
    key andesite fragment was loose debris selected outside the protected
    monument area, and GEO-E060 records that no geological andesite control was
    compared. Consequently, the observation that unusual matter was reported
    is secure, but its attribution to an architectural block and its
    diagnosticity for casting are not.

    The mechanism evidence establishes plausibility more readily than ancient
    occurrence. Natron availability is well documented, achievable furnace
    temperature is plausible, and mineral binders can be made under relatively
    mild conditions. Self-reported demonstration blocks and modern-chemical
    experiments, however, do not demonstrate ancient use or pyramid-scale
    production. The narrow core of GEO-C030 is valid: trace-element quarry
    matching alone cannot exclude manufacture from aggregate obtained at the
    matched source. Its broader use as an answer to materials analysis fails
    because GEO-E020 shows that binder-aware petrography with a positive
    control can discriminate a known geopolymer from natural limestone.

    Steelmanning the hypothesis, the Egyptian NMR and SEM/TEM positives remain
    incompletely answered for their exact samples, and the interior Pumapunku
    matter deserves independent testing on a documented block. Steelmanning
    the conventional account, multiple direct examinations find natural
    fabrics, while salt, tool-mark, mural, and quarrying anomalies are either
    non-diagnostic or weakly documented. The single record whose removal would
    most change the assessment is GEO-E020, because its positive-control design
    most directly answers the methodological escape route. Without GEO-E020,
    the Great Pyramid verdict would weaken, but GEO-E018, GEO-E019, and
    GEO-E021 would remain; the overall mixed case verdict therefore survives
    its removal.
  steelman: >-
    GEO-E017's multinuclear NMR signal in a Bent Pyramid casing stone,
    interpreted as Tura limestone grains cemented by an amorphous
    calcium-silicate gel, has not been tested in the ledger by a blinded,
    independently replicated comparison against a broad stratified natural
    limestone suite and aged C-S-H positive controls. GEO-E020 tested an
    alkali-aluminosilicate geopolymer, not this revised C-S-H binder, so a
    proponent can rightly require that specific test before the Egyptian
    casting branch is treated as chemically closed.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The broad existence claim inherits conflicting site-specific evidence.
      GEO-E018 through GEO-E021, attached to GEO-C020, weigh against cast Great
      Pyramid limestone, while GEO-E006 and GEO-E007, attached to GEO-C004 and
      GEO-C021, report potentially artificial features at Pumapunku. The
      strongest consideration for the claim is the reported interior organic
      matter, but insecure sample attribution, missing natural controls, and
      absent independent replication prevent it from establishing that any
      major monument contains cast stone.
  - claimId: GEO-C020
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E018 reports broad in-situ sedimentary and structural features, and
      GEO-E020 finds no alkali-geopolymer signature while successfully
      detecting that signature in a positive control. GEO-E021 independently
      finds a Cheops casing fragment natural, and GEO-E019 reaches the same
      conclusion for the disputed Lauer specimen. The strongest opposing
      evidence is GEO-E012 together with GEO-E017, which report anomalous
      microconstituents and a possible C-S-H binder, but both have narrow or
      contested sampling and lack independent replication; the available
      direct balance therefore contradicts the claim without excluding every
      untested block.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E006 and GEO-E007 report microstructural anomalies and organic matter
      interpreted as evidence of artificial Pumapunku stone, with GEO-E058
      adding that similar matter was observed inside one fragment. The records
      are one non-independent proponent line, and GEO-E057 limits the key
      andesite result to loose debris attributed to the monument by appearance.
      The strongest opposing considerations are GEO-E060's absence of a natural
      Khapia andesite control and GEO-E008's natural-quarry attribution for the
      sandstone, although provenance alone cannot exclude reaggregation.
  - claimId: GEO-C004
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E006 and GEO-E007 directly document that published analyses report
      SEM, petrographic, and organic-matter observations interpreted by their
      authors as evidence of artificial Pumapunku stone. GEO-E058 further
      records the authors' report of similar matter in an interior subsample.
      The strongest opposing consideration concerns the interpretation rather
      than this reporting claim: GEO-E057 and GEO-E060 show insecure andesite
      provenance and the absence of a natural geological control.
  - claimId: GEO-C913
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C913, so its source anchor alone
      cannot establish the proposition under the ledger rules. GEO-E057,
      attached to GEO-C004 and GEO-C021, describes substantially the same
      loose-debris sampling context, but it remains the proponents' account
      rather than an independent provenance audit. The strongest opposing
      consideration is that being outside the protected area does not itself
      show that the fragment was unrelated to an architectural block.
  - claimId: GEO-C918
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C918, and the source anchor is not
      evidence by itself. GEO-E058, attached to GEO-C004, reports the same
      interior-subsample observation, but it comes from the same team and
      fragment and EDS does not identify the alleged organic compound. The
      strongest favorable consideration is the reported location beneath
      plagioclase crystals, which would be harder to explain as simple surface
      dirt if independently verified.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E035 directly quotes the proponents' 2020 abstract specifying natural
      Cerro Khapia andesite sand, storage at Iwawe Stratum V, and non-use of the
      quadrangular piedras cansadas. That is strong evidence for this
      theory-description claim, regardless of whether the model is true. The
      strongest opposing consideration is that only the abstract was read, so
      the model's fuller qualifications and underlying archaeological support
      remain unchecked.
  - claimId: GEO-C580
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E064 reports an asserted laboratory replication with modern
      chemicals, but supplies no recipe, measurements, durability results, or
      product characterization using the proposed ancient inputs. It also
      states that plant acids do not disaggregate andesite, limiting the
      mechanism to binding unconsolidated aggregate. GEO-E059 further records
      that the analysts could not determine whether the observed matter was
      unreacted guano or binder, so the claim that the complete ancient-feasible
      process produces durable artificial stone remains unresolved.
  - claimId: GEO-C030
    verdict: mixed
    confidence: moderate
    reasoning: >-
      GEO-E024 supports the narrow point that XRF and ICP-MS provenance
      fingerprints cannot by themselves distinguish a natural stone from a
      composite made using aggregate from the matched source. GEO-E009
      therefore identifies a source region but does not logically exclude that
      construction route. The strongest opposing evidence is GEO-E020, which
      uses binder-aware petrography and a positive control to detect a real
      geopolymer signature and find it absent from casing stones; XRD can also
      examine phases, so the claim overgeneralizes when it extends
      trace-element blindness to the whole listed analytical suite.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E013 reports production of large re-agglomerated limestone
      demonstration blocks, while GEO-E022 shows that a C-S-H cementing phase
      can form from lime, diatomaceous earth, and water at room temperature.
      GEO-E012 also reports microstructures interpreted as rapid precipitation
      from basic solution in some pyramid samples, although occurrence there is
      disputed. The strongest opposing consideration is that the large-block
      demonstration is self-reported and has not been independently
      characterized, leaving ancient inputs, performance, visual similarity,
      and scale only provisionally supported.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E016 cites pre-pyramid glassmaking as a precedent for temperatures
      near 850 degrees Celsius, but its dating and temperature basis remain
      unverified in the ledger. A general scientific prior that forced-air
      charcoal furnaces can exceed this temperature supports physical
      plausibility, and the verdict leans partly on that prior rather than on a
      replicated evidence record. The strongest opposing consideration is that
      achieving such heat in a small furnace does not establish sustained,
      industrial-scale natron processing.
  - claimId: GEO-C011
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E010 strongly supports Wadi el Natrun and al-Barnuj as major ancient
      Egyptian natron sources and documents their decline and replacement by
      plant ash in the seventh through ninth centuries AD. GEO-E011 supplies
      compositional context for distinguishing natron from plant-ash glass.
      The strongest opposing consideration is one of implication, not local
      truth: these records concern glass and faience and do not show that
      natron was used to manufacture stone.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      GEO-E015 is an unattributed anecdote about rock-like material forming in
      a repeatedly used outdoor fire pit. It contains no controlled chemistry,
      mechanical characterization, or replication and therefore cannot
      establish either the proposed reaction or an ancient discovery pathway.
      The strongest favorable consideration is that accidental ash
      cementation is chemically conceivable, but that is a prior plausibility
      judgment rather than evidence for this specific claim.
  - claimId: GEO-C001
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E001 directly reports the specified controlled photogrammetric
      measurement of 216 cubic centimetres per hour at 85 strikes per minute.
      Because the claim concerns the result of that experiment rather than a
      universal ancient quarrying rate, one study is sufficient to establish
      the stated measurement. The strongest opposing consideration is limited
      external validity: different granite, tool maintenance, technique, or
      skilled ancient crews could produce a different rate.
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to GEO-C502, so the detailed compound
      description cannot be accepted from its source anchor alone. GEO-E002,
      attached to GEO-C001 and GEO-C002, carries a similar characterization of
      Engelbach's trial and estimates but explicitly says that characterization
      was taken from Fóti and had not been verified against Engelbach's text.
      The strongest favorable consideration is the specificity of that
      account, but an unread or unverified characterization does not resolve
      the claim.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 reports that visitors using original dolerite pounders have not
      successfully reproduced a scoop mark on the designated block. GEO-E002
      provides context that the foundational experimental basis for pounding
      was limited, but its methodological characterization is unverified.
      The strongest opposing consideration is that visitor effort, technique,
      duration, and the test block's accumulated wear were never systematically
      measured, so absence of documented success is only anecdotal evidence.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 reports shafts approximately sixteen feet deep and a proponent's
      judgment that their narrowness prevents effective strikes at the bottom.
      No independent dimensional survey or biomechanical test is included.
      The strongest opposing consideration is that alternative working
      postures, long-handled tools, changing trench geometry during excavation,
      or a different function for the shafts have not been experimentally
      excluded.
  - claimId: GEO-C511
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E045 places dolerite sources and apparent Pharaonic pounder-production
      quarries within the Aswan quarry landscape, with tool-sized blanks near
      working areas. This weighs against the claim's transported-spheres premise
      and against assigning the objects primarily to unrelated slurry
      processing or tamping. The strongest consideration favoring the claim is
      that GEO-E045 does not petrographically match individual pounders or
      directly test what their working surfaces struck, so occasional secondary
      uses remain possible.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E004 carries the salt-layer story only as an untraced secondary
      proponent report. GEO-E027 finds no salt in the examined al-Suyuti
      compilation's accounts of al-Ma'mun's breach, GEO-E029 confirms that the
      proponent page cites no medieval source, and GEO-E028 places the Egyptian
      visit in 832 rather than the claim's original dating. The strongest
      opposing consideration is that other unread medieval Arabic texts could
      contain the report, so the contradiction applies to the admitted record
      rather than proving that no such account exists anywhere.
  - claimId: GEO-C506
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      GEO-E030 instrumentally confirms halite efflorescence on Great Pyramid
      chamber stone, satisfying only the presence component of the claim.
      GEO-E031 reports halite at other Egyptian limestone sites, including the
      carved-bedrock Sphinx, while GEO-E032 reports a sedimentary origin for
      halite in Giza limestone; both comparator lines are secondhand and lack
      concentration measurements. The strongest consideration favoring the
      claim is that no controlled quantitative comparison with unworked Giza
      bedrock was performed, but the asserted uniqueness is unsupported and
      qualitatively contradicted.
  - claimId: GEO-C907
    verdict: established
    confidence: high
    reasoning: >-
      GEO-E030 directly reports SEM-EDX identification of Na and Cl in the
      efflorescence and XRD identification of only halite, calcite, and quartz
      in the seven samples, with no nitrates or widespread gypsum crusts.
      This establishes the stated result for the sampled Queen's Chamber and
      corridor material. The strongest opposing consideration is scope: the
      XRD detection limit could miss minor phases, and detached,
      salt-affected fragments do not characterize every wall or the bulk stone.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 reports that Sessa et al. cite Klemm and Klemm for halite within
      Giza nummulitic limestone stratigraphic layers and interpret it as
      precipitation from evaporating marine or lagoonal water during
      formation. This supports the claim as a description of the cited
      geological reading. The strongest opposing consideration is that Klemm
      and Klemm were not read directly, while the newer measurements used
      detached fragments rather than cores, so the underlying geological
      proposition remains secondhand.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 gives a concrete example at Khufu: unavailable documentation for
      1995–1997 interventions, photographic evidence of cleaning and filling,
      and a sulfur-rich likely modern fill. That record demonstrates that
      undocumented intervention can confound surface observations at a central
      site in this case. The strongest opposing consideration is the claim's
      worldwide breadth: one monument cannot establish that almost no
      megalithic site has a complete restoration history.
  - claimId: GEO-C005
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      GEO-E014 establishes that Fóti has argued that the scale and apparatus in
      the Rekhmire mural fit mineral or waterglass processing better than
      bronze casting. This provisionally supports the narrowly worded fact that
      such an interpretation has been advanced, not that it is correct. The
      strongest opposing consideration is the conventional metal-casting
      interpretation and the absence of an admitted inscriptional,
      residue-based, or independent Egyptological analysis favoring mineral
      processing.