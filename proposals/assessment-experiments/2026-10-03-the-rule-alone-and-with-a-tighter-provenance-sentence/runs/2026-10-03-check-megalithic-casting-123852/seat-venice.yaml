caseAssessment:
  verdict: mixed
  loadBearing: [GEO-C020, GEO-C021, GEO-C030, GEO-C012]
  weakestLinks: [GEO-C003, GEO-C506, GEO-C013, GEO-C005]
  synthesis: >-
    The case divides cleanly by site and by evidence class, and the honest
    roll-up is genuinely two-directional. For the Egyptian pyramids, the
    admitted record runs substantially against the casting attribution as
    originally stated: Folk & Campbell's in-situ sedimentary features
    (GEO-E018), Harrell & Penrod's Lauer-sample analysis (GEO-E019), Jana's
    positive-controlled petrography (GEO-E020), and Freestone & Middleton's
    multi-technique analysis (GEO-E021) jointly find natural limestone
    fabrics, and Jana's genuine geopolymeric control demonstrates that a real
    casting signature is detectable when present — which blunts the
    proponents' methods critique (GEO-C030) in its strong form, though not in
    its narrow trace-element form, which survives (GEO-E024, human_reviewed).
    The salt line that once supported casting has been deflated: Sessa et al.
    2026 confirm the halite (GEO-E030) but document the same efflorescence at
    non-cast Egyptian limestone sites including the Sphinx (GEO-E031) and
    report halite as native to Giza strata (GEO-E032), while the Al-Ma'mun
    salt report reduces to an uncited proponent webpage absent from the
    principal Arabic compilation (GEO-E027, GEO-E029). Against this, two
    pro-positive results remain unrefuted: MacKenzie's NMR reading of a Bent
    Pyramid casing stone as Tura grains in a human-made C–S–H gel (GEO-E017)
    and Barsoum's SEM microconstituents (GEO-E012) — but on
    provenance-contested samples, with the specific alkali recipe refuted by
    Jana's control and the C–S–H revision untested by any admitted record. For
    the Andes, every positive is the proponents' own, on a loose fragment of
    appearance-based provenance (GEO-E057) with no geological andesite
    comparator by the authors' own admission (GEO-E060) and EDS-only
    chemistry (GEO-E059), against 1971 provenance work of qualified force
    (GEO-E008). Feasibility is partially demonstrated (GEO-E022, GEO-E013)
    but scale is untested. The tool-mark anomalies (GEO-E001–E005) strain the
    pounding orthodoxy without supporting casting. Sensitivity: removing
    GEO-E020 (Jana) would most change the verdict — the methods critique
    would stand unrebutted at the binder level and GEO-C020 could shift
    toward unresolved; the case-level mixed verdict, tilting against, would
    likely survive on GEO-E018 and GEO-E021, but it would then hang more
    heavily on field petrography with acknowledged sampling limits. The
    decisive studies — blinded paleomagnetism, NMR with aged C–S–H controls,
    provenance-secure Andean samples — remain unrun.
  steelman: >-
    The Bent Pyramid NMR result (GEO-E017): solid-state ²⁹Si/²⁷Al/⁴³Ca MAS
    NMR, run at labs in Wellington and Warwick, concluded the casing stone
    consists of Tura limestone grains cemented by an amorphous
    calcium-silicate gel "formed by human intervention" — and no record in
    this ledger tests that C–S–H binder. Jana's positive control (GEO-E020)
    analyzed only Davidovits' alkali-aluminosilicate geopolymer; Jana himself
    conceded a ~5 wt% binder could escape bulk chemistry; Fóti's methods
    critique expressly exempts NMR from its scope; and none of the
    anti-casting petrographic studies (GEO-E018–E021) applied NMR at all. A
    proponent can rightly say the one spectroscopic positive on Egyptian
    casing stone, produced by a technique none of the negative studies used
    and never formally rebutted, remains unanswered — as does the reported
    interior occurrence of carbon- and nitrogen-bearing matter beneath
    plagioclase crystals in the Pumapunku subsample PP1C (GEO-E058), which
    simple surface contamination does not obviously explain.
claimAssessments:
  - claimId: GEO-C022
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The umbrella existence claim splits by site. For Egypt, four
      independent or skeptical petrographic studies (GEO-E018–E021) find
      natural fabrics, and Jana's positive control (GEO-E020) shows a casting
      signature would have been detectable; for Pumapunku, the only admitted
      positives are proponent-authored (GEO-E006/E007) with questioned sample
      provenance and no geological control (GEO-E060), opposed only by dated
      1971 provenance work (GEO-E008). No pro-positive result has been
      independently confirmed on a provenance-secure sample, but the C–S–H
      binder revision (GEO-E017) and the Andean claims have never been
      directly tested by admitted records, which blocks a stronger negative.
  - claimId: GEO-C020
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The balance of admitted evidence tilts clearly against: in-situ
      sedimentary and tectonic features across many blocks (GEO-E018), the
      natural reading of the Lauer sample (GEO-E019), Jana's positive-control
      demonstration that the alkali-geopolymer signature is absent from
      casing stones (GEO-E020), and the British Museum fragment analysis
      (GEO-E021). The strongest opposing consideration is that Jana's
      decisive negative tests only the alkali-aluminosilicate recipe; the
      revised C–S–H binder of MacKenzie et al. (GEO-E017, "suggest"-level, one
      sample, Barsoum co-author) and Barsoum's original SEM anomalies
      (GEO-E012, provenance disputed by the SCA) are unrefuted, and the salt
      corroboration has been removed by GEO-E033. Mixed, weighted against.
  - claimId: GEO-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only supporting records (GEO-E006, GEO-E007) come from the
      hypothesis's principal proponents, on the same sample set, with
      questioned provenance; the fuller proponent account concedes the
      andesite fragment PP1 was picked from loose debris by appearance
      (GEO-E057), that no geological andesite was compared (GEO-E060), and
      that the nitrogen chemistry is unresolved (GEO-E059), while an 1892
      thin section already recorded amorphous pockets in this stone
      (GEO-E061). The strongest opposing consideration is precisely that
      absence-of-control: the claimed inconsistency with natural volcanic
      stone has never been demonstrated against Khapia andesite, and Ponce
      1971 (GEO-E008) supplies conventional provenance of uncertain power.
  - claimId: GEO-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Assessed as stated — a claim about what the published analyses report
      and argue, not about whether the stone is artificial — the record
      supports it: peer-reviewed SEM/petrographic papers (GEO-E006, GEO-E007)
      and the proponents' fuller account (GEO-E058) do report organic matter
      and the argued inconsistency. The strongest opposing consideration is
      that the underlying inference is weak: the same team and samples recur,
      provenance is insecure (GEO-E057), EDS cannot characterize the organic
      matter (GEO-E059), and no natural comparator was analyzed (GEO-E060),
      so "inconsistent with natural stone" is the authors' argument, not an
      established result.
  - claimId: GEO-C913
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim itself. The basis that
      carries it is GEO-E057, attached to GEO-C004 and GEO-C021, which quotes
      the proponents' own 2019 account stating the fragments lie outside the
      protected monument area and were chosen by their flat surface. The
      sampling-procedure fact is therefore well attested — by the proponents
      themselves; no independent documentation (permits, field photographs, a
      physical refit to a catalogued block) exists, which is exactly what
      GEO-R016 is designed to supply.
  - claimId: GEO-C918
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached to this claim itself. The basis is
      GEO-E058, attached to GEO-C004, which records the proponents' report
      that interior subsample PP1C shows the same C- and N-bearing spectrum
      beneath two plagioclase crystals. This is the strongest single part of
      the andesite result because it resists simple surface contamination, but
      it is one fragment of insecure provenance, analyzed by the proponents
      with EDS only — elemental, not molecular — and with no natural andesite
      control.
  - claimId: GEO-C903
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This is a theory-description claim, and GEO-E035 is attached directly:
      the 2020 abstract states the Khapia sand aggregate, storage at Iwawe
      (Isbell & Burkholder Stratum V), and non-use of the piedras cansadas,
      in the quoted language. Confidence is moderate rather than high because
      only the abstract was read (the PDF returned HTTP 403), the venue is
      the proponents' own journal, and the model's empirical anchors — the
      Stratum V deposit and the abandoned blocks — remain unexamined against
      the excavators' descriptions (GEO-R009).
  - claimId: GEO-C580
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The three-stage chemistry is described by the source, but its
      pre-industrial feasibility is far from shown: the claimed replication of
      the acid-medium mechanism used modern chemicals, produced no published
      data or product characterization, and plant acids explicitly do not
      disaggregate volcanic andesite (GEO-E064, where the second reader
      disputes even the "supports" direction); the guano-hardener
      identification is unresolved by the authors themselves (GEO-E059). The
      strongest opposing consideration is that no experiment with the actual
      proposed ancient inputs — plant extracts and guano — has ever been
      reported.
  - claimId: GEO-C030
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The narrow core is sound and human-reviewed: PXRF and ICP-MS/AES are
      blind to hydrogen, carbon, and oxygen, so a trace-element quarry match
      cannot by design distinguish carved stone from stone cast with
      same-quarry aggregate (GEO-E024, whose own limitations concede the
      H/C/O point for XRF/ICP-MS). Two opposing considerations bound it:
      including XRD in the blindness claim is an overreach, since XRD
      identifies crystalline carbonate and hydrous phases; and Jana's
      positive control (GEO-E020, attached to GEO-C020) demonstrates that
      binder-aware petrography is not blind, so the critique cannot extend to
      the direct petrographic record — a scope limit Fóti himself concedes.
  - claimId: GEO-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Peer-reviewed work demonstrates the revised binder chemistry is
      feasible: lime plus diatomaceous earth forms C–S–H at room temperature
      (GEO-E022), and the Geopolymer Institute reports multi-ton
      re-agglomerated limestone demonstration blocks (GEO-E013). The
      strongest opposing consideration is that no independent analysis of any
      demonstration block exists, modern production knowledge does not
      establish ancient production, and feasibility at monument scale is
      expressly untested — feasibility is not occurrence.
  - claimId: GEO-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      GEO-E016 cites Badari-period glassmaking as an ~850 °C precedent, but
      its own limitations flag the dating and temperature basis as unverified,
      and crucible-scale heat is not the sustained industrial processing
      casting would need. Beyond that record, the verdict leans partly on a
      background prior — that pre-industrial charcoal pyrotechnology
      (pottery, metallurgy) routinely reached this range — stated here as a
      prior, not as ledger evidence.
  - claimId: GEO-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      GEO-E010 (Shortland et al. 2006, mainstream and uncontroversial)
      directly establishes Wadi el Natrun and al-Barnuj as the primary
      exploited sources with a documented 7th–9th century decline, and
      GEO-E011 supplies the compositional typology behind supply timelines.
      The claim is about natron availability, which the evidence establishes;
      the record's own limitation — that the paper concerns glass and faience
      and says nothing about stone-making — limits what this supports
      downstream, not the claim itself.
  - claimId: GEO-C013
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only attached record (GEO-E015) is a weak, unattributed anecdote —
      flagged as under-sourced in the project's own skeptical review — with no
      controlled replication attempted and no other record touching the
      claim. An unattributed single observation cannot establish that the
      pathway works; GEO-R007 exists because nobody has tested it.
  - claimId: GEO-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim reports what the measurement yielded, and GEO-E011 — rather,
      GEO-E001 — records the peer-reviewed photogrammetric result (216 cm³/h
      at 85 strikes/min) confirmed at citation verification. Confidence is
      moderate because it is a single study by a single team on one granite
      and tool configuration, with the authors' own limitations noting that
      skilled ancient crews may have outperformed the experimental protocol;
      no independent replication exists (GEO-R002).
  - claimId: GEO-C502
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The closest basis is
      GEO-E002, attached to GEO-C001 and GEO-C002, which describes
      Engelbach's evidentiary base (one self-conducted one-hour trial, ~5 mm
      progress, workforce heuristic) but explicitly flags that this
      characterization is taken from Fóti's account and has not been verified
      against the 1922/1923 monographs. The finer details specific to
      GEO-C502 — the 8 mm/hour rammer-rate assumption, the foot ×
      half-trench-width area, the groove-spacing inference — rest on the
      unverified catalog entry (T-002) alone, so the claim stays unresolved
      until the primary text is read.
  - claimId: GEO-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E003 carries the observation but is anecdotal: attempt rates and
      cumulative effort are unquantified and no systematic wear survey of the
      test block exists. The strongest opposing consideration is that
      "no documented success" over uncontrolled tourist attempts is a very
      weak experimental signal — skilled, sustained ancient work under
      different technique could differ from casual striking, as GEO-E001's
      limitations themselves note.
  - claimId: GEO-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E005 records Fóti's description, but the shaft dimensions have not
      been independently surveyed and the biomechanical claim — that
      effective pounding strikes cannot be delivered at the bottom — is
      untested. The strongest opposing consideration is that the shafts'
      purpose under the orthodox account (prospecting pits per Engelbach) has
      never been measured either, so the anomaly is real but its
      interpretation is wide open (GEO-R013).
  - claimId: GEO-C511
    verdict: mixed
    confidence: low
    reasoning: >-
      GEO-E045 directly undermines the claim's premise: Kelany et al. place
      the dolerite in dykes within the Aswan granitoids and document
      purpose-built pounder-production quarries beside the working faces — a
      local pounding industry, not an exotic import for another purpose.
      Against that, the measured pounding rate (GEO-E001, attached to
      GEO-C001) led its own authors to speak against pounders as the sole
      method, and the reproduction failures (GEO-E003, attached to GEO-C002)
      keep the orthodoxy under strain. No record offers any direct support
      for the specific alternative uses (slurry grinding, tamping), so the
      interpretive claim remains open in both directions.
  - claimId: GEO-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      As an attestation claim, it fails on the present record: the only
      carrier of the salt report is an uncited proponent webpage dated to the
      wrong year (GEO-E029, GEO-E028), and the principal medieval Arabic
      compilation of the breach — al-Suyūṭī via Nemoy — describes the entry
      in detail without any mention of salt (GEO-E027, whose second reader
      endorsed "undermines" for exactly this claim). The strongest opposing
      consideration is that other Arabic sources (al-Maqrīzī's full Khiṭaṭ,
      ʿAbd al-Laṭīf, Vyse's extracts) remain unread, so the verdict is on
      present attestation and revisable by GEO-R001; hence not high
      confidence.
  - claimId: GEO-C506
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The presence component is confirmed with modern instrumentation —
      Queen's Chamber efflorescence is halite by XRD and SEM-EDX (GEO-E030) —
      but the comparative premise ("concentrations that comparable natural
      limestone monuments do not exhibit") is undermined from two directions:
      halite efflorescence is documented at non-cast Egyptian limestone sites
      including the Sphinx (GEO-E031), and halite is reported as a primary
      constituent of the Giza nummulitic limestone itself (GEO-E032, citing
      Klemm & Klemm). Neither side measured concentrations, the proponent
      taste test is weightless (GEO-E026), and no stone was cored, so the
      comparison the claim requires has never been made.
  - claimId: GEO-C907
    verdict: well_supported
    confidence: high
    reasoning: >-
      A direct reporting claim matched by an attached evidence record:
      GEO-E030 quotes the Sessa et al. XRD result verbatim ("only halite,
      calcite, and quartz") with the no-nitrates and no-gypsum findings, from
      an ai_verified open-access source whose passages were checked by the
      verify verb. The only caveats — XRD's sub-5 wt% detection limit and
      surface-only sampling — are the source's own stated limits and do not
      touch what the claim asserts.
  - claimId: GEO-C906
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      GEO-E032 is attached to this claim and restates the Klemm & Klemm
      reading accurately, with the second reader confirming the quotes are
      verbatim and correctly attributed — the right direction here is
      support, as the dissent on that record itself notes. Confidence is
      capped because the statement is secondhand: Klemm & Klemm 2010 was
      cited by Sessa et al. but not read, and "inherent components" derives
      from detached fragments rather than cored stone, so GEO-R010's direct
      check is still owed.
  - claimId: GEO-C594
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E034 provides a solid, concrete instance — undocumented 1995–97
      cleaning and cavity filling inside the Khufu pyramid, with a
      sulfur-rich modern fill and salt re-forming within about two years —
      directly instantiating the claim at the case's most-cited monument. But
      the claim's quantifier ("almost no megalithic site") cannot be carried
      by one instance, and no record surveys restoration documentation
      across sites; the strongest opposing consideration is that a single
      documented gap may not generalize.
  - claimId: GEO-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      GEO-E014 records Fóti's reinterpretation faithfully, and the claim as
      stated ("have been argued") is accurate reporting of that argument. But
      it is an interpretive case by a proponent, unengaged by conventional
      Egyptology, with no independent appraisal of the depicted scale or
      apparatus; the strongest opposing consideration is that the
      conventional bronze-casting reading has never actually been tested
      against the reinterpretation (GEO-R008), so neither reading currently
      has the stronger evidential footing.
