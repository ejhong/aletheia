  - claimId: AMZ-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Directly supported by AMZ-E072, wherein Achmatowicz (2018) concludes in his abstract that Carvajal's manuscript is a trustworthy historical source ('fuente digna de confianza') based on geographic reference points. The main caveat is that only the abstract of Achmatowicz 2018 was admitted to the ledger, leaving the full granular geographic argumentation unverified.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: high
    reasoning: >-
      Synthesized from textual evidence (AMZ-E005, AMZ-E006, AMZ-E007, AMZ-E099, AMZ-E100) and archaeological patterns (AMZ-E004, AMZ-E017). Carvajal's qualitative geography of populous, fortified, road-connected riverine settlements is corroborated by independent explorers and archaeological findings, while his extreme numbers represent manuscript-dependent embellishments or rhetorical conventions. The opposing view notes that early modern European skepticism targeted the narrative broadly, especially regarding warrior women.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Supported by AMZ-E001 (Pärssinen et al. 2026), documenting 432 LiDAR-detected earthworks over 4,430 km, delimiting an Aquiry cultural area of 183,000 km², and predicting 24,000–30,000 structures. The primary qualification, documented in AMZ-E038 and AMZ-E039, is that this regional estimate substantially exceeds earlier basin-wide models (such as Peripato et al. 2023), reflecting differing modeling assumptions and extrapolations.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      Supported by AMZ-E002, where Pärssinen et al. explicitly acknowledge that their demographic projection of 1.25–3 million relies on assumptions of 300 occupants per earthwork and high contemporaneity, whereas their single-family sensitivity model drops the population to 250,000–600,000 (or 315,000–760,000 with canopy correction). The opposing point is that the authors themselves deem the single-family hypothesis unlikely.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 (de Souza et al. 2018) confirms an 1,800 km arc of fortified villages dated to AD 1250–1500 on the southern Amazon rim, with a projected population of 500,000 to 1,000,000. As stated in the claim and source, this total relies on unproven site contemporaneity, ethnographic proxies, and MaxEnt extrapolation.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Empirically supported by multiple excavation sequences: Belterra Plateau occupations extending from AD 1300 to 17th-century contact (AMZ-E017), Marajó Cacoal dating to AD 1300–1650 (AMZ-E018), and Upper Xingu circular plazas continuously occupied from 500 CE to 1770 CE (AMZ-E019). The opposing consideration is that the Xingu evidence is drawn from secondary reporting in this ledger, though the Belterra and Marajó peer-reviewed records are strong.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 (Lombardo et al. 2025) provides direct evidence from 178 samples across 18 soil profiles, identifying ubiquitous Zea mays phytoliths coupled with drainage canals and savannah farm ponds in the Casarabe culture. The only limitation is that Casarabe urbanism collapsed around AD 1400, well prior to Carvajal's 1542 voyage.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Supported by Levis et al. 2017 (AMZ-E012) and Peripato et al. 2023 (AMZ-E040, AMZ-E041), showing dark earths and significant enrichment of 53 domesticated tree species near archaeological earthworks. However, McMichael et al. 2017 (AMZ-E013) strongly qualifies this interpretation, demonstrating that post-Columbian historical ecology may account for much of the observed modern floristic pattern.
  - claimId: AMZ-C009
