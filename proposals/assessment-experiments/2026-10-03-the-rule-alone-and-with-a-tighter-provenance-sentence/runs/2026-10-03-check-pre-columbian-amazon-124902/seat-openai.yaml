  synthesis: >-
    The admitted evidence supports a qualified version of the Emptied
    Amazon hypothesis: substantial, organized, and engineered societies
    existed in multiple Amazonian regions, some persisted into the contact
    era, severe colonial depopulation occurred in documented upper-Amazon
    provinces, and occupation was strongly concentrated rather than
    uniformly basin-wide. The strongest Carvajal-specific evidence is not
    later archaeological spectacle but AMZ-E007: Nunes and the accounts of
    the Ursúa expedition independently reproduce mundane features of the
    populous middle-Amazon picture, including dense settlement, food
    stores, travelled roads, and abundant resources. AMZ-E005 separately
    establishes that the most extreme warrior and village figures are
    absent from the Oviedo branch. Together these records support the
    distinction expressed by AMZ-C017 between a credible qualitative
    geography and numerically unstable claims.

    Archaeology makes that social geography ecologically and historically
    plausible. AMZ-E004 documents late pre-Columbian fortified villages
    across the southern rim, while AMZ-E017 through AMZ-E019 place major
    systems at Belterra, Marajó, and the Upper Xingu into the contact era
    or later. AMZ-E014 documents intensive engineered maize production,
    and AMZ-E022 establishes year-round exploitation of interfluvial
    aquatic resources. The disappearance mechanism is locally credible
    because AMZ-E008 reconstructs declines of about 88% in Napo–Aguarico
    and 62–64% in Mainas through interacting epidemics, enslavement,
    missionization, forced service, revolt, and flight. Its limitation is
    geographic: those ratios do not directly reconstruct the middle and
    lower Amazon reaches central to Carvajal.

    The strongest case against an expansive reading is equally
    substantial. AMZ-E003 dates the Aquiry demographic peak to AD 100–300,
    about a millennium before Orellana, so it cannot serve as direct
    contact-era corroboration. AMZ-E002 shows that the Aquiry population
    headline changes roughly fivefold under the paper's own alternative
    household assumption. AMZ-E010 and AMZ-E011 support a heterogeneous
    landscape in which occupation favored rivers and most sampled
    terra-firme settings show little evidence of intensive land use.
    Survey bias and sparse palaeoecological sampling limit those negative
    inferences, but they still contradict a continuous basin-wide
    civilization. Several potentially important limiting and mechanistic
    claims, including AMZ-C020 through AMZ-C023 and AMZ-C029, lack attached
    evidence records and therefore cannot strengthen either side here.

    The result is stronger than mere possibility but short of a completed
    demonstration that Carvajal's particular world died between recorded
    visits. No admitted study yet aligns his branch-shared populated and
    empty reaches with contact-horizon archaeology, and no documentary
    reconstruction yet closes the demographic sequence for the same
    middle-Amazon corridor. Sensitivity is concentrated in AMZ-E007, whose
    removal would most change the case verdict. The verdict does not
    survive without it: I would downgrade the Carvajal-specific case from
    provisionally_supported to weakly_supported, although the broader
    heterogeneous-human-Amazon conclusion would remain well supported.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is its
    untested spatial prediction: the populated and empty reaches shared
    across Carvajal's manuscript witnesses should respectively contain
    greater and lesser AD 1400–1650 archaeological intensity after route
    and palaeochannel uncertainty are modeled. A preregistered match,
    followed by a documented seventeenth-century collapse in those same
    reaches, would directly establish the described world and its
    subsequent emptying; this ledger contains neither test.
claimAssessments:
  - claimId: AMZ-C001
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      AMZ-E005, attached to AMZ-C002, confirms that manuscript branches
      contain large-village and warrior descriptions, while AMZ-E007,
      attached to AMZ-C003, corroborates several qualitative features
      through other witnesses. AMZ-E006 is attached here but supplies an
      archaeological bluff-settlement model rather than a direct
      quotation establishing the chronicle's full list of food stores,
      roads, ceramics, territories, and empty reaches. The strongest
      opposing consideration is therefore that the admitted evidence only
      partially documents this compound description and the chronicle body
      itself was not admitted as a read evidence record.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 directly reports that the 50,000, 10,000, and 8,000-warrior
      figures and villages four or five leagues long occur in the
      Medina/Muñoz versions but not Oviedo, which retains a 5,000-warrior
      figure. The strongest opposing consideration is reliance on
      Denevan's manuscript comparison rather than a collation reproduced
      in the ledger, but the evidence precisely matches the claim.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E089 quotes Oviedo as saying that he learned additional
      particulars orally in Santo Domingo from Orellana and other
      expedition members beyond what the friar had written. The strongest
      opposing consideration is that Oviedo is quoted through Medina
      rather than checked in the original Oviedo volume.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 identifies Nunes's 1538 entry and ten accounts of the 1560
      Ursúa expedition and records dense settlement, immense maize stores,
      straight travelled roads, and abundant aquatic resources in the
      middle Solimões. This substantially supports independent repetition
      of Carvajal's mundane social geography. The strongest opposing
      consideration is that Nunes survives in a later letter and the
      ledger does not independently audit the transmission relationships
      or every claimed ceramics detail.
  - claimId: AMZ-C068
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E080 directly records Medina's statement that Gómara cited
      Orellana's relación and called it mentirosa. The strongest opposing
      consideration is that Gómara's own passage was not read, but the
      local claim concerns what Medina records rather than whether
      Gómara's accusation was justified.
  - claimId: AMZ-C065
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E072 reproduces the article abstract's conclusion that
      Achmatowicz regards the manuscript as a trustworthy source after
      examining its geographic reference points. The strongest opposing
      consideration is that the article body was not read, which prevents
      evaluation of the argument's quality but does not negate the stated
      assessment.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 provides the strongest support for Carvajal's qualitative
      social geography through other sixteenth-century testimony, and
      AMZ-E005 establishes the manuscript instability of the extreme
      numbers. AMZ-E004 and AMZ-E017 through AMZ-E019 show that organized
      settlement systems existed near the contact period, although not
      necessarily along the exact reaches Carvajal traversed. AMZ-E003
      correctly limits the much earlier Aquiry evidence, and AMZ-E111
      raises weak evidence of Carvajal's partisanship. The strongest
      opposing consideration is the absence of a route-matched,
      contact-horizon archaeological test.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E001 directly establishes 432 detected earthworks, 396 of them
      previously unknown, the approximately 183,000 km² cultural area, and
      the study's extrapolation of roughly 24,000–30,000 earthworks.
      AMZ-E038 and AMZ-E039 show that another published model gives
      markedly different, noncommensurable totals but do not refute what
      the 2026 study reports. The strongest opposing consideration is that
      the prediction is an extrapolation and the evidence record does not
      reproduce the claim's 4,430 km survey-length detail.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 explicitly gives the simultaneous-use assumption, 300
      people per earthwork, the 1.25–3 million result, and the authors'
      250,000–600,000 single-family alternative, rising to
      315,000–760,000 after correction. The strongest opposing
      consideration is that the authors call the single-family alternative
      very unlikely, but that does not alter the demonstrated sensitivity.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E004 directly documents an 1,800 km southern-rim arc of
      fortified villages dated approximately AD 1250–1500 and reproduces
      the 500,000–1,000,000 population estimate. The strongest opposing
      consideration is already incorporated into the claim: the estimate
      depends on contemporaneity, ethnographic conversion, and spatial
      extrapolation.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 strongly supports Belterra occupation through
      seventeenth-century colonization, and AMZ-E018 dates Cacoal to AD
      1300–1650. AMZ-E019 supports Upper Xingu occupation to about 1770
      and layout continuity with modern Kuikuro villages. The strongest
      opposing consideration is that the Xingu record is secondary
