  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 verifies the Casarabe drainage canals, savannah farm ponds, and
      ubiquitous maize phytoliths across 178 samples from 18 profiles. The
      strongest opposing consideration is chronological, not evidential:
