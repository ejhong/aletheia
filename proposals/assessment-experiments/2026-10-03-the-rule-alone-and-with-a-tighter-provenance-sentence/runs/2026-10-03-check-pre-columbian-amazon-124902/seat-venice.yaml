caseAssessment:
  verdict: well_supported
  loadBearing: [AMZ-C016, AMZ-C013, AMZ-C014, AMZ-C004, AMZ-C017]
  weakestLinks: [AMZ-C015, AMZ-C019]
  synthesis: >-
    The case's featured synthesis (AMZ-C016) — an engineered, populated Amazon
    of riverine corridors and hotspots set in a lightly occupied forest matrix —
    is carried by six mutually independent observation legs, each with a
    strong, verbatim-verified evidence record: the 2026 LiDAR census and
    Aquiry delimitation (E001, for C004), the southern-rim fortified arc with
    its stated-assumptions population model (E004, C006), Casarabe maize
    monoculture with hydraulic engineering (E014, C007), contact-era
    persistence at Belterra, Cacoal, and the Upper Xingu (E017, E018, C011),
    the 7,363-site river-distance model (E010, C013), and the fourteen-region
    phytolith/charcoal negatives (E011, C014). The Carvajal track reaches the
    same calibrated conclusion by a different route: the extreme numbers are
    branch-unstable (E005, C002) while the qualitative social geography is
    independently repeated by hostile witnesses a generation apart (E007,
    C003) and matches Denevan's bluff model of dense reaches alternating with
    empty ones (E006, C001). The demographic track is the honest weak point:
    every basin total is a model family, demonstrated decisively by Denevan's
    self-rejection (E009, C012) and the 2026 study's own fivefold sensitivity
    span (E002, C005), and the summed-radiocarbon proxy (E020, C015) is the
    least secure load-bearing instrument. Steelmanning the opposite direction:
    the sparse-matrix leg rests on spatially sparse cores whose negatives
    count only where the proxy could detect occupation, and the pre-erasure
    critique (C022) sits unadmitted in the ledger; a proponent can also note
    that published earthwork totals differ several-fold between models
    (E038/E039). Sensitivity: removing AMZ-E011 would strip the sparse-matrix
    leg of its only direct multi-region measurement, leaving E010's model
    prediction alone; the heterogeneity verdict would survive on the
    river-distance model and the hotspot record, but at reduced confidence —
    the case does not hang on a single thread, though its sparsity leg does
    lean hardest on one record. Seven claims (C019, C020, C021, C022, C023,
    C029, C016's own synthesis statement) are graded with explicit
    cross-references or flagged as source-only, and none of the featured
    verdicts rests on a provisional record.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis runs through
    AMZ-C022: Bush et al. 2025 document that a long period of forest recovery
    "largely eradicated the influence of Pre-Columbian occupations" in the
    Upano Valley while the later Colonial signal persisted in the same
    profiles — and this record is unadmitted, so this assessment could not
    weigh it. If erasure is time-graded (AMZ-R008's open test), the
    terra-firme negatives in E011 systematically undercount occupation whose
    signals have decayed, the sparse-matrix leg of AMZ-C016 is biased low, and
    the true humanized fraction of Amazonia is substantially larger than the
    mosaic model states — a proponent would also add E038's demonstration that
    competing earthwork models differ several-fold, leaving room for a much
    denser hidden record.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 (bluff model: dense settlement where channels meet bluffs,
      sporadic between) matches the populated-and-empty alternation C001
      attributes to Carvajal, and the descriptive core is corroborated by the
      records behind C002 (AMZ-E005) and C003 (AMZ-E007). The strongest
