      this ledger (read once from OCR, never checked by a second reader), and
      the manuscript branches differ materially, so what "Carvajal wrote"
      depends on which witness is cited.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E005 verifies Denevan's comparison verbatim: the 50,000/10,000/8,000
      figures and league-long villages appear only in the Medina/Muñoz branch,
      with one 5,000 figure in Oviedo. The strongest opposing consideration is
      that this is a secondary scholar's comparison, not a synoptic collation —
      AMZ-R002's passage-by-passage table remains undone.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Oviedo's own statement that he learned particulars from
      Orellana and his gentlemen in Santo Domingo, which directly establishes
      the claim. The opposing consideration is chain-of-custody: Oviedo is
      quoted via Medina's 1894 edition, and the underlying source record is
      still marked unverified for second-reader purposes.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E007 verifies the Nunes (1538) and Ursúa (1560) testimonies
      describing dense settlement, vast stores, Inca-style roads, and renowned
      ceramics on the same reaches, from witnesses hostile to one another. The
      strongest opposing consideration is that Nunes survives only through
      Porro's modern edition of a 1553/54 letter, and the verified common
      elements explicitly exclude fortifications and organized warfare.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 verifies Medina's statement that Gómara cited Orellana's
      relación and called it "mentirosa." The opposing considerations are that
      Gómara's own text is not in the ledger (Medina's quote is second-hand)
      and that the charge's object is Orellana's narrative, not the Carvajal
      manuscript the ledger reads — which limits what this claim implies but
      not its truth as stated.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      AMZ-E072 attaches with weak strength: it verifies the abstract's claim
      that Achmatowicz finds the manuscript "digna de confianza" on geographic
      grounds, but only the abstract was read and the argument's route
      conclusions were not. The strongest opposing consideration is that
      abstract-level assessments can diverge from the body's actual argument,
      and the assessment addresses geographic plausibility rather than
      population figures.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The qualitative-credibility leg is carried by evidence attached to its
      dependencies: AMZ-E007 (independent 1538/1560 witnesses, attached to
      AMZ-C003), AMZ-E006 (bluff-model match, AMZ-C001), AMZ-E004 (fortified
      riverine settlement systems, AMZ-C006), and AMZ-E017/E018 (contact-era
      occupation, AMZ-C011); the numeric-instability leg is carried by AMZ-E005
      (AMZ-C002). The directly attached records (AMZ-E077, E099, E100, E105,
      E106, E109, E110, E111) are context-only or weak, deliberately so. The
      strongest opposing consideration is chronological: the grandest dated
      phenomena (Aquiry peak AD 100–300 per AMZ-E003; Casarabe ending ~1400)
      predate 1542, and the ledger contains no contact-horizon archaeology
      from Carvajal's own middle-Amazon reaches, so the attribution rests on
      converging testimony rather than a direct test (AMZ-R001 pending).
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 verifies the 432-earthwork LiDAR count, the 183,000 km²
      delimitation, and the 24,000–30,000 prediction verbatim from the fetched
      Nature text. The strongest opposing consideration is that the
      extrapolated total is a block-extrapolation the paper itself flags, and
      AMZ-E038/E039 show basin-wide model totals differing several-fold —
      though those comparators carry zero diagnosticity for the claim as
      worded.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E002 verifies both ends of the paper's own sensitivity: 1.25–3
      million under the headline assumptions versus 250,000–600,000
      (315,000–760,000 canopy-corrected) under the single-family reading the
      authors call "very unlikely." The claim asserts exactly this
      model-sensitivity, so the strongest opposing consideration — the
      funder's identity disclosed in the source record — is a transparency
      flag, not evidence against the sensitivity arithmetic.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 verifies the 1,800-km fortified arc dated Cal AD 1250–1500 and
      the 500,000–1,000,000 estimate with its stated dependencies on
      contemporaneity, ethnographic formulae, and MaxEnt extrapolation. The
      claim itself declares the estimate model-dependent, so the main opposing
      consideration — that the population leg could collapse under dependency
      correction — is already priced into the claim's wording.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E017 (Belterra to seventeenth-century colonization, with dark earths,
      ponds, and roads) and AMZ-E018 (Cacoal AD 1300–1650) are strong,
