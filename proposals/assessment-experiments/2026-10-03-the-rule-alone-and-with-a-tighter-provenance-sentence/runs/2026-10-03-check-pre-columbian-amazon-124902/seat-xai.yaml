    confidence: moderate
    reasoning: >-
      AMZ-E012 supports concentration of domesticated tree species on and around archaeological sites; AMZ-E040/E041 add association of 53 of 79 domesticated species with modelled earthwork probability. AMZ-E013 (McMichael et al. technical comment) qualifies that post-Columbian activities likely played the larger role in observed floristic patterns. Dark earths and raised fields are attested in the broader ledger but the tree-leg is actively contested. Strongest opposing consideration is the post-Columbian confound and overlapping authorship between Levis and Peripato networks.
  - claimId: AMZ-C009
