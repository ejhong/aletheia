    confidence: high
    reasoning: >-
      AMZ-E016 shows intermittent raised-field use from as early as AD 570–770 in a few construction events linked to flood periods, challenging continuous cultivation; AMZ-E015 proposes raised fields as flood-risk mitigation built only where no alternatives existed. Strongest opposing consideration is geographic scope — Bermeo-area fields specifically; other complexes may differ.
