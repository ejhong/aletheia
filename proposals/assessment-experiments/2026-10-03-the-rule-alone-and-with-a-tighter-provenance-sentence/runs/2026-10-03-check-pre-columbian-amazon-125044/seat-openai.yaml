  - claimId: AMZ-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E072 states that Achmatowicz's abstract assesses Carvajal's manuscript as a trustworthy historical source after examining geographic reference points. The strongest opposing consideration is that only the abstract was read, so the geographic analysis and its robustness cannot be evaluated, and the assessment does not validate Carvajal's population figures.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 provides the strongest support for Carvajal's qualitative social geography through later and partly earlier testimony about dense middle-Amazon settlement, stores, and roads, while AMZ-E005, attached to AMZ-C002, directly establishes the instability of the extreme numbers. AMZ-E017 and AMZ-E018, both attached to AMZ-C011, show substantial settlement systems persisting into contact-era centuries, whereas AMZ-E003 correctly qualifies the much earlier Aquiry evidence. The strongest opposing consideration is that no blinded reach-by-reach comparison yet connects Carvajal's populated and empty reaches to contact-horizon archaeology, and route identification remains uncertain.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 directly reports 432 detected earthworks, only 36 previously known, a roughly 183,000 km² region, and an extrapolated total of approximately 24,000–30,000. The strongest opposing consideration is that the regional total is a block-density extrapolation rather than a count, the 4,430 km flight-length detail is not reproduced in the admitted record, and AMZ-E038–AMZ-E039 expose a noncommensurable but substantial discrepancy with an earlier basin-wide model.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E002 directly states the assumed 25–60% simultaneous-use fraction, 300 people per earthwork, the resulting 1.25–3 million estimate, and the 250,000–600,000 or canopy-corrected 315,000–760,000 alternative. The strongest opposing consideration is that the authors call the single-family alternative very unlikely, so the sensitivity range demonstrates model dependence but does not make all parameterizations equally credible.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 directly supports occupation by fortified earth-building villages across an 1,800 km southern-rim arc around AD 1250–1500 and reproduces the approximately 500,000–1,000,000 estimate. The strongest opposing consideration is also explicit in that record: the population total assumes site contemporaneity, ethnographic conversion formulae, and model-based extrapolation, so it is not a census.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 supports Belterra occupation from about AD 1300 into seventeenth-century colonization, with dark earths, ponds, and trodden roads, and AMZ-E018 dates Cacoal to AD 1300–1650. AMZ-E019 supports Upper Xingu occupation to about 1770 and continuity in settlement layout. The strongest opposing consideration is that the Upper Xingu record is journalism summarizing primary research, but the independently supported Belterra and Cacoal cases already establish that several major systems persisted into the contact era.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 reports drainage canals, dry-season farm ponds, and maize phytoliths across 178 samples from 18 profiles, interpreted as intensive year-round maize monoculture supporting Casarabe settlement. The strongest opposing consideration is that “monoculture” is an interpretation of the phytolith and infrastructure record, and the Casarabe florescence ended around 1400 rather than persisting into European contact.
  - claimId: AMZ-C008
