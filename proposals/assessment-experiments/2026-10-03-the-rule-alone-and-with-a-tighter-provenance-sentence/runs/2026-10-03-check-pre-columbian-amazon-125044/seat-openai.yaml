  synthesis: >-
    The admitted evidence provisionally supports the featured hypothesis in its local, heterogeneous form: Carvajal probably encountered populous and organized societies along particular Amazonian reaches, while his extreme figures cannot be treated as stable counts, and later depopulation could have made those reaches appear much emptier. The strongest evidence for this reading is AMZ-E007. It reports testimony associated with Nunes and the later Ursúa expedition describing dense middle-Amazon settlement, large food stores, straight travelled roads, and abundant subsistence resources. These observations overlap the mundane core of Carvajal's picture and come from voyages on different dates, although Nunes's testimony is transmitted through a later letter and modern edition, while the ten Ursúa narratives belong to one expedition rather than ten independent replications. AMZ-E005 independently establishes a material manuscript problem: the largest warrior and village-length figures occur in the Medina/Muñoz branch but not in Oviedo's version. That distinction strongly favors qualitative credibility over literal acceptance of spectacular numbers.

    Archaeology makes such societies ecologically and historically plausible. AMZ-E004 documents late pre-Columbian fortified settlement across the southern rim, while AMZ-E017 and AMZ-E018 place substantial Belterra and Marajoara systems into the European-contact period. AMZ-E019 extends that pattern in the Upper Xingu, though only through a secondary journalistic account. Engineered agriculture and aquatic-resource exploitation are supported in other regions, but some major examples predate Orellana by centuries and therefore cannot directly corroborate what he saw in 1542. The evidence also rejects a basin-wide metropolis: AMZ-E010 finds occupation concentrated nearer rivers, and AMZ-E011 finds little intensive-use signal in most sampled terra-firme settings. Both records retain important survey and detectability limitations.

    The disappearance mechanism is plausible but not geographically closed. AMZ-E008 documents very large, uneven colonial declines caused by interacting epidemics, raids, missionization, forced service, revolt, and flight, but its quantified provinces are in the upper Amazon. Applying those ratios to Carvajal's middle and lower reaches remains an extrapolation. The skeptical steelman is therefore that the ledger demonstrates regional complexity and regional collapse without yet matching contact-horizon archaeology or collapse records to Carvajal's individual populated and empty reaches. Conversely, the proponent's steelman is that independent sixteenth-century testimony, contact-era settlements, and documented colonial depopulation form a coherent explanation that requires fewer special assumptions than wholesale invention.

    AMZ-E007 is the single evidence record whose removal would most change the case verdict. Without it, the present verdict would not survive and would fall to weakly_supported: archaeology would still establish plausibility, but the strongest admitted corroboration of the particular social geography attributed to Carvajal would be gone. The case therefore remains provisionally supported rather than well supported or established.
  steelman: >-
    The assessment does not answer the most specific proponent prediction: whether Carvajal's independently classified populated reaches contain systematically greater AD 1400–1650 archaeological intensity than his reported empty reaches after route and palaeochannel uncertainty are modeled. A positive blinded corridor test would be difficult to explain as generic exaggeration and would directly connect the eyewitness geography to the contact-horizon landscape.
claimAssessments:
  - claimId: AMZ-C001
