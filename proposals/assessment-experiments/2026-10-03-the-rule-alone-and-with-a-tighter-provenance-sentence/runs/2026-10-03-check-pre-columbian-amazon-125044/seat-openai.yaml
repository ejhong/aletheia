    reasoning: >-
      AMZ-E006 supports a spatial pattern of sporadic bluff occupation with large settlements at favored locations, which is compatible with populated reaches alternating with empty ones. AMZ-E007, attached to AMZ-C003, reports independent accounts of dense settlement, food stores, and roads on the middle Amazon, but it does not directly verify every item attributed to Carvajal here. The strongest opposing consideration is that no admitted record quotes the Carvajal passages establishing the full list of stores, roads, ceramics, political territories, and empty stretches.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 directly gives the claimed manuscript comparison: the figures of 50,000, 10,000, and 8,000 warriors and villages four or five leagues long are absent from the Oviedo version, which retains one figure of 5,000 warriors. The strongest opposing consideration is that the comparison was verified through an OCR full-text copy rather than a new synoptic collation of the manuscripts, but that limitation does not materially undermine the quoted difference.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina quoting Oviedo as saying that he supplemented the friar's writing with particulars learned from Orellana and other expedition members in Santo Domingo. The strongest opposing consideration is that Oviedo has not been read directly in the ledger, so the proposition rests on Medina's secondhand quotation.
  - claimId: AMZ-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 reports Nunes reaching Machiparo in 1538 and identifies ten narratives from the 1560 Ursúa expedition, with descriptions of dense settlement, immense maize stores, straight travelled roads, and abundant aquatic food. The strongest opposing considerations are that Nunes's account survives through a later letter and modern edition, the Ursúa narratives arise from one expedition, and the admitted passage does not itself establish the claim's renowned-ceramics component. The central convergence on dense settlement, roads, and stores is nevertheless substantial.
  - claimId: AMZ-C068
