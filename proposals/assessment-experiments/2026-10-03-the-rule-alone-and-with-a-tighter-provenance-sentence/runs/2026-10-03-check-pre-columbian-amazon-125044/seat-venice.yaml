caseAssessment:
  verdict: well_supported
  loadBearing: [AMZ-C001, AMZ-C003, AMZ-C004, AMZ-C010, AMZ-C013, AMZ-C014]
  weakestLinks: [AMZ-C005, AMZ-C009, AMZ-C015, AMZ-C019, AMZ-C022]
  synthesis: >-
    The featured hypothesis — that Carvajal described a real, organized,
    populous riverine world that later visitors did not find — is carried by a
    convergence the ledger documents record by record, not by consensus. On the
    positive side: AMZ-E001 (attached to AMZ-C004) gives verbatim-verified
    LiDAR documentation of hundreds of earthworks and a model predicting
    24,000–30,000 in southwestern Amazonia; AMZ-E004 (AMZ-C006) dates fortified
    earth-builder villages across an 1,800 km southern-rim arc into the
    fifteenth century; AMZ-E014 (AMZ-C007) documents engineered year-round maize
    monoculture in the Llanos de Mojos; AMZ-E017 and AMZ-E018 (AMZ-C011) place
    major settlement systems in occupation at the European contact horizon; and
    AMZ-E007 (AMZ-C003) supplies the single most important corroborating record
    — independent sixteenth-century witnesses, hostile to one another and
    writing for different crowns, repeating the mundane load-bearing features of
    Carvajal's picture (dense settlement, vast stores, travelled roads, fine
    ceramics) while none repeats his extreme numbers, whose instability
    AMZ-E005 (AMZ-C002) documents at the manuscript-branch level. On the
    limiting side: AMZ-E010 (AMZ-C013) and AMZ-E011 (AMZ-C014) are strong,
    method-explicit records that most interfluvial terra firme shows little
    intensive-use signal, and river distance dominates a 7,363-site occupancy
    model. The evidence therefore supports exactly the heterogeneous reading:
    dense, engineered corridors and hotspots in a lightly occupied matrix. What
    it does not yet do is close the collapse loop where the dispute lives:
    AMZ-E008 (AMZ-C010) documents 88% and 62–64% regional declines, but only
    for upper-Amazon provinces with mission records, and the ledger itself
    flags extension to the middle Amazon as extrapolation; no admitted record
    dates the depopulation of Carvajal's own reaches. All population totals in
    the case are model outputs with stated fragilities (AMZ-E002, AMZ-E009),
    which is a reason to distrust the numbers, not the qualitative picture.
    The verdict is well_supported rather than established because the
    contact-horizon archaeology of the middle Amazon — the decisive test
    (AMZ-R001, AMZ-R005) — has not been run.
  steelman: >-
    The strongest unanswered argument for the emptied-Amazon reading is that
    every element of the reconciliation is documented somewhere but none is
    documented where it matters: AMZ-E007 independently confirms dense
    settlement on Carvajal's exact reaches in 1538 and 1560, AMZ-E008
    documents collapse of similar magnitude nearby, and AMZ-E011's interfluvial
    negatives may be artifacts of palaeoecological erasure and thin sampling —
    yet no admitted record contains a single contact-horizon (AD 1400–1650)
    archaeological or documentary measurement of population on the middle-Amazon
    reaches Carvajal himself described. A proponent can rightly say the ledger
    shows his world was locally plausible and that comparable worlds died, but
    never shows his world dying; until AMZ-R001/AMZ-R005/AMZ-R007 are run, the
    collapse half of the hypothesis rests on analogy the ledger explicitly
    labels extrapolation.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 (attached to this claim) records Denevan's bluff-model finding of
      sporadic, spatially concentrated riverine settlement, matching the
      alternating populated/empty pattern the claim attributes to Carvajal, and
      AMZ-E007 (attached to AMZ-C003) corroborates the qualitative picture
      through independent witnesses. The strongest opposing consideration is
      transmission: the manuscript branches differ materially (AMZ-E005), the
      underlying source SRC-CARVAJAL-1542 is unverified beyond Medina's
      introduction, and the qualitative bedrock versus numeric
      embellishment split rests on branch comparison rather than on an
      original autograph.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E005 quotes Denevan's manuscript comparison verbatim: no 50,000,
      10,000, 8,000, or league-long villages in Oviedo, one 5,000 figure
      present. The opposing consideration is the verification path —
      the comparison was checked through a Wayback abstract plus OCR
      full text, and no synoptic collation of the witnesses exists yet
      (research item AMZ-R002 targets exactly this gap), so the
      branch-attribution could in principle shift with a proper
      critical edition.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 records Oviedo's own statement, quoted by Medina, that he
      supplemented the friar's text with particulars from Orellana and his
      gentlemen in Santo Domingo; the quote was located verbatim in the
      archive.org text by the operator. The strongest opposing
      consideration is that everything here is at second hand — Oviedo via
      Medina, and the Medina edition's OCR text was never checked by a
      second reader, so the record carries a documented single-reader
      limitation.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 directly supports the claim with verified quotations from
      Lopes et al. 2024: Nunes (1538, via a 1553/54 letter) and the ten
      1560 Ursúa accounts independently describe dense settlement, vast
      stores, Inca-like roads, and famed ceramics. The opposing
      consideration is stated in the record's own limitations: Nunes
      survives only through Porro's modern edition, and the accounts are
      still colonial documents with convergent interests; the record
      also notes fortifications are NOT among the verified shared
      elements, so the claim's wording is appropriately narrower than
      the full Carvajal picture.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 quotes Medina verbatim giving Gómara's 'mentirosa' charge
      against Orellana's relación. The claim is about what Medina records,
      which the record establishes; the opposing consideration is that
      Gómara's own passage is not in the ledger, Medina's reading is
      second-hand, and the object of the charge is Orellana's narrative,
      not the Carvajal text — so this record dates where doubt began,
      not whether Carvajal lied.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: low
    reasoning: >-
      AMZ-E072 quotes the journal abstract verbatim, and the abstract
      does say the manuscript can be considered a trustworthy source on
      the basis of geographic verification, which is exactly what the
      claim asserts about Achmatowicz's assessment. The opposing
      consideration is severe for downstream use: the record is
      abstract-only, the body was never read, its strength is graded
      weak, and it assesses geographic plausibility, not the population
      figures.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The two legs are carried by records attached to other claims: the
      qualitative leg by AMZ-E007 (attached to AMZ-C003 — independent
      witnesses repeat the mundane features, none the extreme numbers),
      and the numeric-instability leg by AMZ-E005 (attached to AMZ-C002);
      AMZ-E003 (attached to AMZ-C004 and this claim) supplies the
      chronology guard against spending the AD 100–300 Aquiry peak as
      contact-era corroboration. The strongest opposing consideration:
      all corroboration is textual and regional — no record puts
      contact-horizon archaeology on Carvajal's own reaches — and the
      Medina-branch reputation records (AMZ-E105, AMZ-E106, AMZ-E109 to
      AMZ-E111) are explicitly context-only, so the attribution remains
      an inference from converging indirect evidence rather than a
      demonstrated property of the middle Amazon in 1542.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 verifies the 432-earthwork LiDAR documentation, the
      183,000 km² delimitation, and the 24,000–30,000 prediction verbatim
      against the fetched Nature text. The strongest opposing
      consideration is stated in the record itself: the total is a
      block-extrapolation from sampled densities, and AMZ-E038/AMZ-E039
      (context records attached to this claim) show a published basin-wide
      model predicting an order of magnitude fewer undiscovered
      earthworks, so the several-fold spread between models is real and
      unresolved — though it does not touch what the claim says the 2026
      study documents and predicts.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E002 quotes the paper's own population-estimation passage
      verbatim, including the single-family sensitivity that collapses
      the 1.25–3 million headline to roughly 250,000–600,000; the claim
      describes the model's dependence structure, which the source itself
      states. The opposing consideration is that this cuts both ways:
      the authors call the low reading 'very unlikely', and the paper is
      weeks old, founder-funded per its own disclosure, and without
      peer-reviewed technical rebuttal — so the sensitivity is the honest
      error bar, but neither end of it is independently validated.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 quotes the dating result and the full derivation chain of
      the 500,000–1,000,000 estimate verbatim, and the claim accurately
      states that the number depends on contemporaneity, ethnographic
      formulae, and MaxEnt extrapolation. The opposing consideration is
      that only the dating leg is a measurement; the population leg is a
      stated-assumptions model, so the claim's own hedging is load-bearing
      for its verdict.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E017 and AMZ-E018 strongly support the Belterra and Marajó legs
      with verified quotes reaching the seventeenth century; the Upper
      Xingu leg rests on AMZ-E019, a journalism summary held at
      secondary-source weight. The strongest opposing consideration is
      that occupation 'to contact' is documented for specific sites, not
      for the settlement systems as functioning wholes at 1542 —
      continuity of occupation does not by itself establish the density
      or organization Carvajal's account implies.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 quotes the Nature abstract verbatim: drainage canals,
      farm ponds, 178 phytolith samples, ubiquitous maize, intensive
      year-round monoculture. The strongest opposing consideration is
      temporal: the record's own limitation notes Casarabe florescence
      ends before European contact, so this is superb evidence for
      engineered Amazonian subsistence and none at all for the
      contact-era world Carvajal saw.
  - claimId: AMZ-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E012 (moderate) documents the domesticated-species concentration,
      and AMZ-E040/AMZ-E041 (attached to this claim and AMZ-C033)
      corroborate with a different response variable — but the same
      research network, the same species list, and association with a
      modelled probability surface rather than dated sites. The strongest
      opposing consideration is AMZ-E013's Technical Comment finding that
      post-Columbian activities likely played the larger role in the
      floristic pattern, which applies equally to the corroboration and
      keeps the pre-Columbian attribution — the part of the claim that
      says 'pre-Columbian landscape engineering' — short of
      well_supported.
  - claimId: AMZ-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E016 (strong) and AMZ-E015 (moderate, attached to this claim)
