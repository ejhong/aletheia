      AMZ-E016 (Rodrigues 2015) dates intermittent raised-field use from AD 570–770 in a few construction events linked to flood periods, challenging continuous cultivation; AMZ-E015 (Lombardo 2011) proposes flood-risk mitigation built only where no alternatives existed. Both support the claim as stated. Strongest opposing consideration is that Bermeo-area results may not generalise to every raised-field complex.
