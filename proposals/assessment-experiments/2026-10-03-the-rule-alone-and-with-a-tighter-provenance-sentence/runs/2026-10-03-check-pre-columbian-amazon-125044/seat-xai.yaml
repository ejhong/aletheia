      AMZ-E014 states Casarabe landscape engineering (drainage canals, savannah farm ponds) and ubiquitous maize phytoliths from 178 samples across 18 profiles, supporting year-round monoculture. Florescence ends before contact, as noted. Strongest opposing consideration is geographic restriction to the Llanos de Mojos.
  - claimId: AMZ-C008
