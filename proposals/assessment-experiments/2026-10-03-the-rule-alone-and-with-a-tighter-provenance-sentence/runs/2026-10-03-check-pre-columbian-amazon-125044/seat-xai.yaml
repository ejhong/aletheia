  synthesis: >-
    The ledger's admitted evidence establishes a strongly heterogeneous pre-Columbian Amazon rather than either a pristine empty wilderness or a continuous basin-wide civilization. River-distance dominates occupation probability across 7,363 sites (AMZ-E010 on AMZ-C013), while cumulative phytolith and charcoal sequences from fourteen regions show little to no annual cropping, clearing, anthropic soils or enrichment in most sampled terra-firme and western interfluves (AMZ-E011 on AMZ-C014). Against that sparse matrix sit dense, engineered corridors and hotspots whose existence is no longer in serious doubt: LiDAR over 4,430 km yields 432 earthworks and an extrapolated 24–30k within a 183,000 km² Aquiry area (AMZ-E001 on AMZ-C004), an 1,800 km southern-rim arc of fortified villages dates to AD 1250–1500 (AMZ-E004 on AMZ-C006), Casarabe maize monoculture with drainage canals and farm ponds is documented by phytoliths and remote sensing (AMZ-E014 on AMZ-C007), and multiple settlement systems (Belterra Plateau, Marajó Cacoal, Upper Xingu) remain occupied into or past European contact (AMZ-E017, AMZ-E018, AMZ-E019 on AMZ-C011). Carvajal’s 1541–42 qualitative picture of populous, road-linked, store-rich riverbank polities alternating with empty stretches is therefore locally plausible and independently corroborated by Nunes and the Ursúa accounts on the same middle-Amazon reaches (AMZ-E007 on AMZ-C003); the extreme warrior and village-length figures, however, are confined to one manuscript branch (AMZ-E005 on AMZ-C002) and cannot be treated as counts. Post-contact decline is real and catastrophic where reconstructed (AMZ-E008 on AMZ-C010), yet regionally uneven and multi-causal. Demographic headlines remain model-dependent and highly sensitive (AMZ-E002 on AMZ-C005; AMZ-E009 on AMZ-C012; AMZ-E020 on AMZ-C015), so basin-wide totals stay provisional. The net picture—that Carvajal saw a real, organised river world that later emptied while vast interfluves stayed lightly occupied—is provisionally supported by the spatial and chronological measurements; it is not yet established because route-to-archaeology matching, interfluve density without discovery bias, and middle/lower-Amazon collapse timelines remain open research items, and several supporting claims (fisheries scale, earthwork probability surfaces, sampling critiques) lack attached evidence records. Sensitivity is highest to the independent sixteenth-century corroboration (AMZ-E007): without it the qualitative credibility of Carvajal rests more heavily on later archaeology whose peak dates often pre-date 1542. The verdict survives that removal but drops from provisionally_supported toward weakly_supported.
  steelman: >-
    The still-unrebutted observation that multiple independent sixteenth-century witnesses (Nunes 1538, Ursúa 1560 flotilla) describe the same middle-Amazon reaches as densely settled with vast food stores, straight travelled roads and renowned ceramics, exactly matching Carvajal’s qualitative social geography and thereby predicting contact-horizon archaeological intensity that has not yet been systematically tested against his empty stretches.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E006 (Denevan 1996) directly records the bluff-model pattern of dense settlements where channels meet bluffs alternating with empty stretches, matching the claim’s description of Carvajal’s chronicle; the sourceAnchor and genealogy further anchor the qualitative features (settlements, stores, roads, ceramics, territories). Strongest opposing consideration is that the ledger has not admitted a full manuscript collation of the Relación body itself, so the claim rests on secondary quotation.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 quotes Denevan 1996 verbatim: the 50k/10k/8k warrior figures and 4–5-league villages appear only in the Medina/Muñoz branch, while Oviedo retains the populous picture and one ~5k figure. No contrary evidence is admitted. Strongest opposing consideration is residual uncertainty about which branch later popular citations actually used.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina 1894 reporting Oviedo’s own statement that he supplemented the friar’s written account with oral particulars learned in Santo Domingo from Orellana and the gentlemen who came with him. The record is second-hand via Medina and the Oviedo volume itself is blocked, yet the quotation is direct. Strongest opposing consideration is that the difference this creates between branches remains unquantified without a full collation.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E007 (Lopes et al. 2024) documents Nunes’s 1538 Machiparo entry and the ten Ursúa 1560 accounts describing dense settlement, infinite maize stores, straight Inca-style roads and ceramic renown on the same middle-Amazon reaches; the witnesses are independent and hostile. Limitations note that fortifications/warfare are not verified common elements and Nunes survives only via a later letter. Strongest opposing consideration is geographic imprecision of the exact reaches.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 quotes Medina 1894 stating that López de Gómara cited Orellana’s relación and called it ‘mentirosa’. The charge targets Orellana’s narrative, not necessarily Carvajal’s text, and Gómara is not read directly. Strongest opposing consideration is that Medina supplies no independent verification of Gómara’s wording or motive beyond the Amazons episode.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      AMZ-E072 records only the abstract of Achmatowicz 2018 asserting that geographic reference-point study shows Carvajal’s manuscript “se puede considerar como una fuente digna de confianza”; the body was never read. Strength is therefore minimal and limited to geographic plausibility, not population figures. Strongest opposing consideration is the complete absence of the underlying argument or route conclusions.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Qualitative credibility is carried by AMZ-E007 (on AMZ-C003) plus the settlement systems of AMZ-E004 (AMZ-C006) and AMZ-E017–E019 (AMZ-C011); numeric instability is established by AMZ-E005 (AMZ-C002). Context records (AMZ-E077, AMZ-E099, AMZ-E100, AMZ-E105, AMZ-E106, AMZ-E109–E111) add only reputational or Amazons-related background and do not diagnose the split. Strongest opposing consideration is the millennium gap between Aquiry peak (AMZ-E003) and 1542, plus still-untested route-to-archaeology matching.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 states the LiDAR results verbatim: 432 earthworks (396 new) over 4,430 km, 183,000 km² Aquiry circumscription, and 24–30k extrapolated total. AMZ-E038/E039 supply only non-diagnostic context from an earlier basin-wide model. The extrapolation is model-based as the paper itself notes. Strongest opposing consideration is that different earthwork definitions and pre-2026 data produce several-fold lower basin totals.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E002 quotes the paper’s own sensitivity: the 1.25–3 M headline assumes 25–60 % simultaneous use and 300 persons per earthwork; the single-family alternative collapses it to ~250–600 k (315–760 k with canopy correction). The fivefold span is therefore internal. Strongest opposing consideration is the authors’ dismissal of the lower bound as “very unlikely,” which is an interpretive judgment, not a measurement.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 states the 1,800 km southern-rim occupation by earth-building cultures in fortified villages ~AD 1250–1500 and the 500 k–1 M estimate that explicitly rests on contemporaneity, ethnographic formulae and MaxEnt extrapolation. Dating is robust; demography is model-dependent as flagged. Strongest opposing consideration is the untested contemporaneity assumption across the arc.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 documents Belterra Plateau sites AD 1300 to seventeenth-century colonization with dark earths, ponds and trodden roads; AMZ-E018 dates Marajó Cacoal AD 1300–1650 into Portuguese contact; AMZ-E019 (secondary journalism) reports Upper Xingu occupation to ~1770 with layouts matching living Kuikuro villages. Strongest opposing consideration is that the Xingu summary remains secondary pending primary reports.
  - claimId: AMZ-C007
