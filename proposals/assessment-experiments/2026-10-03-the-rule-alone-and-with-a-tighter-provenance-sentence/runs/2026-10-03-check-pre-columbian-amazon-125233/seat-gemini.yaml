  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Carvajal's primary narrative explicitly details alternating stretches of dense settlement systems, extensive food stores, roads, and empty buffer zones along the main river trunk. Denevan's analysis of riverine bluff dynamics corroborates this spatial distribution as geomorphologically and ecologically consistent with sporadic bluff occupations. The strongest opposing consideration is that Carvajal's narrative was written under extreme survival conditions and influenced by standard Spanish conquest tropes regarding wealthy native kingdoms.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      Denevan's direct collation of the primary manuscripts demonstrates that figures such as 50,000, 10,000, and 8,000 warriors, as well as multi-league villages, appear exclusively in the Medina/Muñoz textual branch and are omitted in Oviedo's account, which reports a single figure of roughly 5,000 warriors. This textual divergence is an empirical fact of manuscript transmission. The strongest opposing consideration is the possibility that Oviedo selectively condensed or editorialized an earlier common draft rather than preserving a more pristine eyewitness report.
  - claimId: AMZ-C074
    verdict: established
    confidence: high
    reasoning: >-
      Medina's critical introduction directly quotes Gonzalo Fernández de Oviedo stating that he augmented the written testimony of Carvajal with oral interviews conducted in Santo Domingo with Francisco de Orellana and other expedition members. The historical quotation in the ledger is verbatim and verified. The strongest opposing consideration is that Medina was interpreting Oviedo's phrasing through late nineteenth-century editorial perspectives, though the quoted Spanish text is unambiguous.
  - claimId: AMZ-C003
