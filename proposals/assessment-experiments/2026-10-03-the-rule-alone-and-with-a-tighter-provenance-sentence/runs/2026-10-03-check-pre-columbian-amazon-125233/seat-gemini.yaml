  synthesis: >-
    The contested hypothesis posits that Gaspar de Carvajal's 1542 chronicle described a genuine, populous, organized riverine world along the Amazon that experienced catastrophic demographic and sociopolitical collapse before later European centuries documented a largely depopulated wilderness. The ledger provides robust, multidisciplinary support for the core tenets of this hypothesis, while refining it from an uncritical reading of basin-wide metropolises to a pronounced mosaic model.


    Steelman for the sparse wilderness hypothesis: Extensive palaeoecological surveys across 14 lowland regions in western and interfluvial Amazonia document virtually no evidence of crop agriculture, large-scale clearings, burning, or anthropic dark earths in terra-firme settings (AMZ-E011). Furthermore, spatial modeling across thousands of known sites confirms that pre-Columbian occupation concentrated heavily along river corridors, leaving vast interfluvial matrix forests lightly settled (AMZ-E010). Carvajal's most staggering military counts (tens of thousands of warriors) and continuous multi-league towns are absent from the earlier Oviedo manuscript tradition (AMZ-E005), and early colonial observers were notorious for inflating indigenous numbers to exaggerate conquest glory or justify crown funding.


    Steelman for the emptied Amazon hypothesis: Independent sixteenth-century accounts from hostile expeditions—notably Diogo Nunes in 1538 and the multiple witnesses of Pedro de Ursúa's 1560 expedition—corroborate the qualitative bedrock of Carvajal's report: dense settlements, large food stores, straight roads, and intensive fisheries along the exact same middle-Amazon reaches (AMZ-E007). Direct archaeological excavations demonstrate that large, complex, engineered settlement systems persisted right up to and through European contact, including the Belterra plateau sites near Santarém (AD 1300 to seventeenth century), Cacoal on Marajó (AD 1300–1650), and Upper Xingu towns (occupied to ca. 1770) (AMZ-E017, AMZ-E018, AMZ-E019). Quantitative colonial ethnohistory in the upper Amazon confirms catastrophic post-contact depopulation ranging from 62% to nearly 90% within 150 years through combined epidemics, slave raids, and forced relocations (AMZ-E008).


    Sensitivity analysis: The single evidence record whose removal would most threaten this case verdict is AMZ-E007 (the multi-witness corroboration from Nunes and the Ursúa chronicles). Without AMZ-E007, Carvajal's account would remain an isolated, disputed narrative anchored only to disparate archaeological sites whose exact demographic correlation with his 1542 route remains indirect. Nevertheless, the overall case verdict survives without AMZ-E007 because late pre-Columbian earthworks, contact-era archaeological continuity, and documented colonial collapse independently refute the twentieth-century paradigm of environmental impossibility and confirm dense riverine corridors that vanished after contact.
