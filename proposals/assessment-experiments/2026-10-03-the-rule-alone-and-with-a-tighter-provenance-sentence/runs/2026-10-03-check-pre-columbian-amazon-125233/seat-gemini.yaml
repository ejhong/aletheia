    reasoning: >-
      The convergence of independent historical accounts (Nunes, Ursúa chronicles), manuscript collations showing numerical instability in later redactions, and regional archaeological patterns strongly supports Carvajal's qualitative description of populous riverbank societies while discounting his inflated troop numbers. Historical and archaeological analyses agree that sixteenth-century descriptions capture genuine riverine social complexity rather than pure fantasy. The strongest opposing consideration is that without systematic ground-truthing across Carvajal's exact route, distinguishing authentic qualitative memory from conventional European fabulation remains interpretive.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      LiDAR survey over 4,430 km in 2024 revealed 432 earthworks (396 previously unrecorded), enabling Pärssinen et al. (2026) to define an Aquiry cultural zone of roughly 183,000 km² and project 24,000 to 30,000 geometric earthworks. The empirical detection of hundreds of structures beneath dense canopy is decisive. The strongest opposing consideration is that Peripato et al. (2023) modeled undiscovered earthworks across the entire Amazon basin at only 10,272–23,648, indicating that the regional block extrapolation may substantially overestimate basin-wide or regional densities.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      Pärssinen et al. (2026) explicitly present their demographic estimate of 1.25–3 million people as conditional on specific labor and contemporaneity assumptions (300 persons per earthwork), while providing their own sensitivity alternative of 250,000–600,000 (315,000–760,000 corrected) based on single-family mound occupation. The claim accurately summarizes the paper's internal mathematical dependencies and sensitivity parameters. The strongest opposing consideration is that the authors considered the lower family estimate 'very unlikely,' though it remains an explicitly published scenario.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      De Souza et al. (2018) documented fortified villages spanning an 1,800 km arc along the southern Amazon rim between cal AD 1250 and 1500, explicitly stating that their regional population projection of 500,000 to 1,000,000 relies on assumed site contemporaneity and MaxEnt ecological niche extrapolation. The claim accurately reports both the empirical findings and the authors' declared methodological limitations. The strongest opposing consideration is that site contemporaneity across an 1,800 km front over 250 years is improbable, meaning the active standing population at any single decade was likely much lower.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Radiocarbon dates and material culture across multiple major settlement complexes demonstrate continuity into the European contact horizon: the Belterra Plateau near Santarém spans AD 1300 to seventeenth-century colonization, Cacoal on Marajó dates from AD 1300 to 1650, and Upper Xingu settlements were inhabited continuously from AD 500 to ca. 1770 in configurations matching living Kuikuro villages. These multi-site stratigraphic sequences demonstrate that late pre-Columbian urban and quasi-urban systems did not universally collapse before European arrival. The strongest opposing consideration is that the Upper Xingu data in the ledger is currently derived from a secondary journalistic report rather than a primary technical excavation report.
  - claimId: AMZ-C007
