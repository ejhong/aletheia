    reasoning: >-
      Zooarchaeological analysis of over 17,000 fish bones at Loma Salvatierra (occupied AD 500–1400) by Prestes-Carneiro et al. (2019) confirms intensive, year-round exploitation of savanna and interfluvial aquatic resources, specifically lungfish and tiger-fish adapted to surviving in small dry-season water bodies. This provides empirical proof of sustained interfluvial subsistence beyond major river channels. The strongest opposing consideration is that Loma Salvatierra is an atypical monumental mound whose local environmental management cannot automatically be extrapolated across all Amazonian interfluves.
  - claimId: AMZ-C012
