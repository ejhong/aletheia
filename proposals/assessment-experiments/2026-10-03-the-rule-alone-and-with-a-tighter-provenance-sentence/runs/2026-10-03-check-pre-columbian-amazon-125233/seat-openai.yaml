  - claimId: AMZ-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C022, so the claimed differential
      erasure of pre-Columbian and Colonial ecological signals cannot be
      graded from the source record alone. This matters because the
      proposition would materially qualify how negative palaeoecological
      findings are interpreted. The strongest opposing consideration to
