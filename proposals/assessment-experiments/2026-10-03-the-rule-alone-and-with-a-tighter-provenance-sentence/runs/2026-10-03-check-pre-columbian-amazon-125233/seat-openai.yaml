  - claimId: AMZ-C029
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C029, so the nearly 80% extent,
      0–1% cell probability, and regional concentration are not admitted
      observations. AMZ-E038 and AMZ-E039 attached to AMZ-C004 describe other
      outputs of the same basin-wide model but do not report this probability
