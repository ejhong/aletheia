  synthesis: >-
    The featured hypothesis is best understood as a conjunction: Carvajal
    qualitatively encountered populous and organized riverine societies in
    particular Amazonian reaches; those societies were embedded in a
    heterogeneous rather than uniformly urbanized basin; and severe
    post-contact decline helps explain why later observers encountered a
    different landscape. The admitted evidence provisionally supports that
    conjunction, but it does not yet demonstrate it reach by reach. The
    strongest Carvajal-specific evidence is AMZ-C003: AMZ-E007 reports that
    Nunes and the later Ursúa expedition independently described dense
    settlement, large stores, and travelled roads on the same middle-Amazon
    reaches. AMZ-C002 is also important because AMZ-E005 separates the
    manuscript branches: the most spectacular numbers occur only in the
    Medina/Muñoz branch, while the less numerically extreme Oviedo version
    retains a substantial-warrior observation. Together these records favor
    a credible qualitative core without licensing the famous figures as
    census data.

    Archaeology strongly establishes that complex, engineered, and sometimes
    large settlement systems existed in multiple Amazonian regions. AMZ-C006,
    AMZ-C007, and AMZ-C011 are supported by fortified late-pre-Columbian
    villages, hydraulic maize production, and settlements continuing into
    the contact era or later. This defeats an ecological-impossibility
    objection, but early Aquiry and Casarabe florescences cannot directly
    corroborate what Carvajal saw in 1542. The evidence also supports a
    heterogeneous basin rather than a continuous civilization: AMZ-E010
    attached to AMZ-C013 finds occupation probability strongly structured by
    river distance, while AMZ-E011 attached to AMZ-C014 reports little or no
    intensive-use signal in most sampled terra-firme settings. Survey bias
    and proxy sensitivity weaken, but do not erase, those negative findings.

    The collapse leg is credible but geographically incomplete. AMZ-E008
    attached to AMZ-C010 documents severe, uneven decline in Napo–Aguarico
    and Mainas through epidemics, raids, missionization, forced service,
    revolt, and flight. That supplies a demonstrated mechanism and regional
    precedent, not a measured demographic sequence for Carvajal’s precise
    middle- and lower-Amazon provinces. Demographic totals likewise remain
    model-dependent: AMZ-C005 and AMZ-C012 show that large estimates can vary
    severalfold or survive after their original derivation has been rejected.

    Steelmanning the skeptical direction, the ledger lacks a direct
    archaeological test of Carvajal’s populated and empty reaches, and much
    spectacular archaeology is earlier than contact or geographically
    displaced. Steelmanning the favorable direction, independent testimony,
    contact-era settlements, and documented colonial collapse form a
    coherent evidential chain that does not require accepting extreme
    numbers or basin-wide density. No external scientific prior materially
    determines this verdict. The single evidence record whose removal would
    most change it is AMZ-E007, because it provides the closest independent,
    same-reach corroboration of Carvajal’s mundane observations. The
    provisionally_supported verdict survives without AMZ-E007, narrowly, on
    the contact-era archaeology, manuscript instability, and demonstrated
    regional collapse, but the Carvajal-specific case becomes substantially
    weaker.
  steelman: >-
    The strongest pro-hypothesis case left unanswered is Carvajal’s
    reach-by-reach spatial prediction: contact-horizon archaeology should be
    systematically richer in the exact reaches he labels populated than in
    matched reaches he labels empty, followed by seventeenth-century
    demographic contraction in those same provinces. The ledger contains no
    preregistered route reconstruction or same-province before-and-after
    series, so this potentially decisive conjunction remains untested.
claimAssessments:
  - claimId: AMZ-C001
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      AMZ-E006 supports the plausibility of alternating dense and empty
      riverine reaches, while AMZ-E005 attached to AMZ-C002 establishes that
      at least some village and warrior descriptions occur in the manuscript
      tradition. However, no admitted record directly quotes or verifies the
      complete bundle of food stores, roads, ceramics, and political
      territories stated here. The strongest opposing consideration is that
      spatial plausibility and later corroboration do not themselves prove
      what Carvajal’s text says.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E005 directly reports that the 50,000, 10,000, and 8,000 warrior
      figures and four- or five-league villages are absent from the Oviedo
      branch, which retains a figure of about 5,000 warriors. This closely
      matches the claim’s central textual distinction. The strongest opposing
      consideration is the absence of a complete passage-by-passage collation,
      especially because AMZ-E089 attached to AMZ-C074 shows that Oviedo also
      incorporated oral information from Orellana and his companions.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 directly quotes Medina’s report that Oviedo supplemented the
      friar’s written account with particulars learned from Orellana and other
      expedition members in Santo Domingo. That is precisely the historical
      proposition stated. The strongest opposing consideration is that
      Oviedo is available here through Medina rather than through a directly
      examined Oviedo volume.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 reports Nunes’s 1538 entry and ten accounts from the 1560 Ursúa
      expedition, including descriptions of dense middle-Amazon settlement,
      abundant stores, and broad straight roads. Their different expeditions
      and contexts provide meaningful corroboration of mundane features in
      Carvajal’s picture. The strongest opposing consideration is that
      Nunes’s testimony survives through a later letter and modern edition,
      while the admitted extract does not itself establish every listed
      feature, particularly renowned ceramics.
  - claimId: AMZ-C068
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E080 directly records Medina’s statement that López de Gómara cited
      Orellana’s relación and called it “mentirosa.” Because the claim is
      specifically about what Medina records, the evidence closely matches
      it. The strongest opposing consideration is that Gómara’s own passage
      was not directly examined, so the record cannot independently verify
      Medina’s representation.
  - claimId: AMZ-C065
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E072 states that Achmatowicz’s abstract assesses Carvajal’s
      manuscript as trustworthy after examining its geographic reference
      points. That directly establishes the narrowly framed claim about the
      author’s assessment. The strongest opposing consideration is that only
      the abstract was read, so neither the geographic analysis nor its
      robustness can be independently evaluated here.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The qualitative-credibility leg is supported chiefly by AMZ-E007’s
      independent same-reach testimony and by contact-era settlement evidence
      in AMZ-E017 through AMZ-E019, while AMZ-E005 strongly supports the
      textual instability of the extreme numbers. AMZ-E003 properly limits
      the much earlier Aquiry evidence, and AMZ-E111 identifies Carvajal’s
      partisanship as a minor credibility qualification. The strongest
      opposing consideration is that no admitted study has matched
      Carvajal’s individual populated and empty reaches to contact-horizon
      archaeology, and the documented collapse ratios come from other
      provinces.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 directly reports 432 detected earthworks, 396 of them
      previously unknown, a roughly 183,000 km² cultural area, and a
      model-derived estimate of approximately 24,000–30,000 earthworks.
      AMZ-E038 and AMZ-E039 do not contradict what the 2026 study reports,
      but show that another published model produces a markedly different,
      noncommensurable total. The strongest opposing consideration is that
      the regional total is an extrapolation from sampled blocks rather than
      a complete count.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 explicitly gives the simultaneous-use assumption, the
      300-person conversion, the 1.25–3 million headline, and the much lower
      single-family alternative. The approximately fivefold sensitivity is
      therefore visible within the study’s own calculations. The strongest
      opposing consideration is that the authors call the single-family
      interpretation very unlikely, so the lower scenario is a sensitivity
      bound rather than their preferred estimate.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 directly supports occupation by fortified earth-building
      villages across an 1,800 km southern-rim arc around AD 1250–1500. It
      also explicitly identifies contemporaneity, ethnographic conversion,
      and spatial projection as dependencies of the approximately
      500,000–1,000,000 estimate. The strongest opposing consideration is
      that the population total is model-projected rather than directly
      counted and can fail if site contemporaneity is overstated.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 and AMZ-E018 provide strong evidence for Belterra occupation
      into seventeenth-century colonization and Cacoal continuity to about
      AD 1650. AMZ-E019 also reports Upper Xingu occupation to about 1770 and
      layouts resembling modern Kuikuro villages. The strongest opposing
      consideration is that the Upper Xingu record is secondary journalism
      rather than an admitted primary report, although the other two
      examples independently establish the claim’s “several systems” core.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E014 combines 178 phytolith samples from 18 profiles with drainage
      canals and savannah farm ponds, supporting intensive year-round maize
      cultivation by the Casarabe culture. The evidence directly connects
      agricultural practice to engineered water management. The strongest
      opposing consideration is that “monoculture” is the authors’
      interpretation of the ubiquitous maize signal and that the Casarabe
      florescence ended before European contact.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      AMZ-E012, AMZ-E040, and AMZ-E041 support an association between
      domesticated trees and archaeological sites or modeled earthwork
      probability, but AMZ-E013 argues that post-Columbian activities may
      account for more of the modern floristic pattern. AMZ-E014 attached to
      AMZ-C007, AMZ-E015 and AMZ-E016 attached to AMZ-C009, and AMZ-E017
      attached to AMZ-C011 support several forms of landscape engineering and
      dark earth. No admitted record directly establishes the forest-island
      component or the entire multiple-region bundle as stated. The strongest
      opposing consideration is the unresolved pre- versus post-Columbian
      attribution of the tree signal.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E015 supports the flood-risk mitigation interpretation, including
      construction where alternatives were unavailable, and AMZ-E016
      documents intermittent use from as early as AD 570–770. These records
      directly challenge an assumption of continuous permanent cultivation.
      The strongest opposing consideration is geographic scope: the detailed
      dating comes from Bermeo-area fields and need not characterize every
      Llanos de Mojos complex.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C019, so the source anchor alone
      does not establish the pond count, 35-meter association, or fish-weir
      function. AMZ-E022 attached to AMZ-C026 supports year-round fishing in
      the Llanos de Mojos but does not establish this engineered fishery
      layout. The strongest opposing consideration to an adverse inference is
      that the cited source may contain the measurements, but its unadmitted
      contents cannot be weighed.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E022 directly reports more than 17,000 fish remains from Loma
      Salvatierra, its location 50 km from the Mamoré River, occupation from
      AD 500–1400, and exploitation of dry-season resources in small water
      bodies. This strongly supports year-round interfluvial fishing. The
      strongest opposing consideration is that seasonal availability is
      inferred from the represented taxa rather than observed directly.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E009 quotes Denevan explicitly rejecting the habitat-density method
      behind his earlier 5.1–6.8 million estimate while still considering at
      least 5–6 million reasonable. This is a direct and unusually clear
      statement of methodological dependence. The strongest opposing
      consideration is that the record establishes the failure of one method,
      not that every basin-wide estimate shares the same assumptions.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E020 reports a logistic fit to Amazon-wide summed radiocarbon-date
      distributions and the authors’ attribution of the terminal decline to
      sampling bias compounded by post-European collapse and dispersal. The
      claim accurately presents this as a proxy analysis rather than a
      census. The strongest opposing consideration is that summed
      radiocarbon distributions are sensitive to archaeological sampling,
      calibration, and site-use practices, so the demographic interpretation
      is not uniquely determined.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E008 directly supplies the Napo–Aguarico and Mainas starting and
      ending estimates, their decline percentages, and multiple mechanisms
      including epidemics, raids, missionization, forced service, revolt, and
      flight. This strongly supports catastrophic but uneven decline in the
      named regions. The strongest opposing consideration is geographic:
      these are upper-Amazon provinces with mission records and do not by
      themselves establish equivalent losses along Carvajal’s middle- and
      lower-Amazon route.
  - claimId: AMZ-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C023, so its specific claims
      about epidemic fade-outs, repeated reintroduction, and age-patterned
      mortality rest only on the source anchor. AMZ-E008 attached to
      AMZ-C010 supports an interactive, multi-causal collapse but does not
      establish those particular epidemiological propositions. The strongest
      opposing consideration to rejection is that the broader mixed-mechanism
      account is independently supported, though the stated mechanism remains
      unevaluated.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E010 directly reports a model using 7,363 archaeological locations,
      with distance from rivers as the most important predictor and lower
      modeled occupation in interfluvial areas. This supports the claim as a
      statistical result. The strongest opposing consideration is survey
      accessibility: the archaeological database may be disproportionately
      concentrated near rivers, so some of the modeled gradient may reflect
      discovery effort.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E011 directly summarizes cumulative phytolith and charcoal work
      across 14 regions as finding little or no annual-crop, clearing,
      anthropic-soil, favored-tree enrichment, or recurrent-fire signal in
      most sampled terra-firme settings. The claim appropriately limits
      itself to the sampled western and interfluvial regions. The strongest
      opposing consideration is that soil cores are spatially sparse and
      absence is informative only where the proxies would have retained and
      detected the relevant activity.
  - claimId: AMZ-C020
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C020, so neither the quoted
      “limited, albeit impressive” conclusion nor the more-than-two-thirds
      estimate can be weighed as evidence. The source record and claim anchor
      identify where the proposition is said to appear but do not admit the
      underlying observation. The strongest opposing consideration to
      rejection is that this is an evidentiary omission, not contradictory
      evidence.
  - claimId: AMZ-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C021, so the figures of roughly
      300 cores, five areas, 1.17 cubic meters, and two million square
      kilometers remain unassessed. AMZ-E011 attached to AMZ-C014
      independently acknowledges spatially sparse soil-core sampling but does
