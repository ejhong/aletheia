  - claimId: AMZ-C016
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C016, so under the ledger rule
      this synthesis claim remains unresolved despite substantial indirect
      support. AMZ-E004 attached to AMZ-C006, AMZ-E014 attached to AMZ-C007,
      AMZ-E017 through AMZ-E019 attached to AMZ-C011, AMZ-E010 attached to
      AMZ-C013, and AMZ-E011 attached to AMZ-C014 collectively support dense
      favored zones alongside a lighter interfluvial matrix. The strongest
      opposing consideration is that several key examples are geographically
      or chronologically removed from “immediately before contact,” so the
      full basin-wide contact-horizon synthesis requires an explicit admitted
      derivation.