  synthesis: >-
    Steelmanning the skeptical side first: a proponent of the emptied-Amazon reading cannot point to any measurement in this ledger that directly dates or surveys the middle Solimões between 1542 and 1700; the strongest counter-case is that Carvajal's extreme numbers are unstable across manuscript branches (AMZ-E005) and that early colonial travelers shared genre incentives to flatter crowns with tales of abundance, so the qualitative picture could in principle be a converging literary topos rather than converging observation. The evidence answers more of this than I expected. The numeric instability is real but cuts for, not against, the case's handling: the ledger refuses to treat the figures as counts while independent, mutually hostile witnesses of 1538 and 1560 (AMZ-E007) repeat the mundane load-bearing features — stores, roads, dense settlement — none repeating the extremes. On the ground, the engineered-hotspot leg is the best-evidenced part of the case: LiDAR-documented earthwork densities with a stated, honest fivefold sensitivity span (AMZ-E001, AMZ-E002), fortified rim villages (AMZ-E004), Casarabe maize monoculture (AMZ-E014), and multiple settlement systems occupied to the contact horizon (AMZ-E017, AMZ-E018). The limits leg is equally real: river-distance dominance (AMZ-E010) and the fourteen-region phytolith synthesis (AMZ-E011) establish genuine sparseness in most sampled terra firme. Collapse is documented at 88% and 62–64% but only in upper-Amazon provinces with mission records (AMZ-E008), and the reconciliation of Carvajal's 1542 with later silence rests on analogy, not on province-level reconstruction of his own reaches (AMZ-R005 unexecuted). Hence the mosaic synthesis (AMZ-C016) is provisionally rather than well supported: several of its dense legs peak a millennium before contact, and the matrix density has never been measured promise-blind. The case verdict is well_supported because its two central attributions — Carvajal's qualitative credibility (AMZ-C017) and the engineered-hotspot reality — are carried by converging, partly independent admitted evidence, while its genuinely open parts are honestly flagged as unresolved rather than smuggled into the headline.
  steelman: >-
    The admitted record documents catastrophic 88% collapse only in upper-Amazon provinces with mission archives (AMZ-E008); nothing in the ledger measures Carvajal's own middle-Amazon reaches between 1542 and 1700, and no admitted evidence shows continuous dense occupation there after contact — so the specific "world died between the visits" reading of the Solimões corridor has never been tested or rebutted (AMZ-R001 and AMZ-R005 remain unexecuted), and a proponent can rightly say the packet contains no observation that a near-total seventeenth-century emptying of those exact reaches must overcome.
