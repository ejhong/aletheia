  - claimId: AMZ-C013
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E010 states that across 7 363 sites distance from river was the most important predictor (21.5 % permutation importance) and that interfluvial areas were more sparsely populated. Strongest opposing consideration is inherited survey-effort bias toward accessible riverine zones, which the models attempt to correct but cannot fully eliminate.
