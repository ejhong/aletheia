  weakestLinks: [AMZ-C005, AMZ-C016, AMZ-C019, AMZ-C020, AMZ-C021, AMZ-C022, AMZ-C023, AMZ-C029]
  synthesis: >-
    The ledger evidence collectively overturns the mid-twentieth-century ecological-impossibility reading of Amazonia while simultaneously blocking any basin-wide continuous civilization narrative. Carvajal’s qualitative picture of populous, road-linked, store-rich riverine societies on specific middle-Amazon reaches (AMZ-C001) is corroborated by independent sixteenth-century witnesses who repeat the mundane features without the extreme Medina-branch numbers (AMZ-C003, AMZ-C002). That qualitative credibility is reinforced by contact-era or near-contact occupation of major settlement systems on the Belterra Plateau, Marajó and Upper Xingu (AMZ-C011) and by the southern-rim fortified villages of AD 1250–1500 (AMZ-C006). Southwestern earthwork density now documented by LiDAR (AMZ-C004) and the Casarabe maize-and-drainage complex (AMZ-C007) demonstrate that intensive, engineered subsistence was locally sustainable; dark-earth and domesticated-tree signals (AMZ-C008) further show long-term landscape management, albeit with post-Columbian confounds. At the same time the negative record is robust: river distance dominates site prediction across 7 363 records and interfluves are sparsely occupied (AMZ-C013); cumulative phytolith-charcoal work finds little to no intensive agriculture or clearing in most sampled terra-firme settings (AMZ-C014). Regional colonial reconstructions document steep but uneven post-contact declines driven by mixed mechanisms (AMZ-C010). Population totals remain model-family artefacts whose internal sensitivities are large (AMZ-C005, AMZ-C012, AMZ-C015). The resulting picture is therefore a strongly heterogeneous human Amazon—dense, engineered corridors and hotspots embedded in a lightly occupied forest matrix—exactly the geography that renders Carvajal’s kind of world locally plausible while leaving his extreme counts textually unstable and his basin-wide representativeness open. The “emptied” claim is thereby provisionally supported for the riverine and savanna hotspots that were occupied into the contact window and then catastrophically reduced; it is not supported as a uniform basin-wide murder. The decisive remaining gaps are the still-unexecuted Carvajal-corridor spatial test, promise-blind interfluve density measurements, and dependency-corrected re-derivation of the demographic envelopes. Until those close, the heterogeneous mosaic stands as the best-supported synthesis of the admitted evidence.
  steelman: >-
    Independent mid-sixteenth-century witnesses (Nunes 1538 and the Ursúa suite) describe the same middle-Solimões reaches as densely settled with vast food stores and Inca-style roads, yet no contact-horizon archaeological transect has yet been locked to Carvajal’s own populated-versus-empty reach classifications under a pre-registered corridor protocol; a positive spatial match would still constitute the single strongest untested corroboration of the murdered-world reading.
  sensitivity: >-
    AMZ-E007 (Nunes/Ursúa independent corroboration of the populous middle Amazon); without it the qualitative credibility of Carvajal rests more heavily on later archaeological analogy and the case verdict would drop from provisionally_supported to weakly_supported, though the earthwork, Casarabe and sparse-interfluve legs would survive.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim reports what the chronicle itself describes; Denevan 1996 and Lopes et al. 2024 quote the relevant passages on settlements, stores, roads and ceramics, and the bluff-model geography (AMZ-E006) matches the populated-empty alternation Carvajal records. Strongest opposing consideration is that the extreme numerical claims are branch-specific (see C002), but the qualitative geography is shared.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 quotes Denevan’s direct manuscript comparison: the 50 000 / 10 000 / 8 000 warrior figures and league-long villages appear only in the Medina/Muñoz branch, while Oviedo retains the populous picture and one 5 000-warrior mention. No contrary collation is in the ledger. Strongest opposing consideration is residual uncertainty about which branch better reflects Carvajal’s own draft, but the textual difference itself is decisive.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E089 quotes Medina quoting Oviedo: the chronicler supplemented the friar’s written account with particulars learned orally in Santo Domingo from Orellana and his companions. The statement is therefore a transmission fact, not an independence claim. Strongest opposing consideration is that the Oviedo volume itself remains unread in the ledger, so the quotation is second-hand.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E007 extracts from Lopes et al. 2024 the independent Nunes 1538 entry and the ten Ursúa 1560 accounts, which repeat dense settlement, vast stores, straight roads and renowned ceramics on the same middle-Amazon reaches. None repeats Carvajal’s extreme numbers. Strongest opposing consideration is that Nunes survives only as a later letter and fortifications are not among the verified common elements.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 quotes Medina recording that López de Gómara cited Orellana’s relación and labelled it “mentirosa.” The object of the charge is Orellana’s narrative, not necessarily Carvajal’s text. Strongest opposing consideration is that Gómara’s own wording is known only through Medina.
  - claimId: AMZ-C065
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      AMZ-E072 (abstract only) states that Achmatowicz 2018 concludes the manuscript “se puede considerar como una fuente digna de confianza” after geographic verification. Body unread, so weight is minimal and limited to geographic plausibility, not population figures. Strongest opposing consideration is the absence of the full argument.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Qualitative social geography is corroborated by C001–C003 plus contact-era settlements (C006, C011); extreme numbers are textually unstable by C002. Context records (E003 chronology, E077/E099–E111 character and caveats) add little diagnostic weight. Strongest opposing consideration remains the still-unexecuted pre-registered corridor test (AMZ-R001) that would directly map Carvajal’s populated versus empty reaches onto contact-horizon archaeology.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 reports the 2024 LiDAR flight over 4 430 km documenting 432 earthworks (396 new) and the study’s delimitation of an ~183 000 km² Aquiry area with a 24 000–30 000 earthwork prediction. E038/E039 supply basin-wide comparators but do not contradict the regional claim as worded. Strongest opposing consideration is that the total is an extrapolation from sampled densities.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 quotes the paper’s own sensitivity: the 1.25–3 million headline rests on simultaneous-use fraction and ~300 persons per earthwork; the single-family alternative collapses it to ~250 000–600 000 (315 000–760 000 with canopy correction). The five-fold span is the authors’ own. Strongest opposing consideration is their label of the lower reading as “very unlikely,” which does not erase the mathematical dependence.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E004 states the 1 800 km southern-rim occupation by fortified earth-building villages ~cal AD 1250–1500 and the 500 000–1 000 000 population range, with explicit dependence on contemporaneity, ethnographic formulae and MaxEnt extrapolation. Strongest opposing consideration is precisely that model dependence, which the claim itself flags.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 (Belterra Plateau AD 1300–seventeenth century with dark earths, ponds, roads), E018 (Cacoal AD 1300–1650) and E019 (Upper Xingu to ~1770 matching Kuikuro layouts) independently document occupation into or beyond contact. Strongest opposing consideration is that E019 is secondary journalism pending primary reports.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E014 reports remote sensing, survey and phytolith evidence for Casarabe year-round maize monoculture supported by drainage canals and savannah farm ponds. Strongest opposing consideration is that the florescence ends before European contact, limiting direct bearing on 1542.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      AMZ-E012 and E040/E041 support concentration of domesticated trees on and around sites and association with earthwork probability; E013 (McMichael technical comment) argues post-Columbian land use likely played the larger role. Raised fields and dark earths are attested but their intensity and continuity are separately qualified by C009. Strongest opposing consideration is the post-Columbian confound.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E016 dates intermittent raised-field construction and use from AD 570–770 in a few discrete events linked to flood periods; E015 frames them as flood-risk mitigation built only where alternatives were absent. Both challenge continuous intensive cultivation. Strongest opposing consideration is that the dated sample is Bermeo-specific and other complexes may differ.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim. The source (Blatrix et al. 2018) exists in the source list but no verified sourceStatement or E-record has been admitted for the zigzag weirs, causeways or pond statistics.
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E022 reports analysis of >17 000 fish remains at Loma Salvatierra (AD 500–1400, 50 km from the Mamoré) demonstrating year-round exploitation of interfluvial aquatic resources including dry-season small-water-body species. Strongest opposing consideration is the site’s distance from the main river, which may limit generalisation.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E009 quotes Denevan’s explicit rejection of the habitat-density method that produced his earlier 5.1–6.8 million figure, while he still holds “at least 5 to 6 million” reasonable on other grounds. The methodological self-rejection is decisive for the claim as worded. Strongest opposing consideration is that the retained order-of-magnitude belief is not independently derived in the ledger.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E020 reports that summed radiocarbon distributions fit logistic growth approaching carrying capacity before colonisation, with the terminal decline attributed to sampling bias plus post-European collapse rather than a pre-European crash. Strongest opposing consideration is that SPDs are relative proxies with acknowledged biases, not censuses.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E008 supplies Newson’s table and text: Napo–Aguarico ~49–51 k to ~6 k (~88 %) and Mainas 62–64 % decline by ~1700 via epidemics, slave raids, missionization, forced service, revolt and flight. Strongest opposing consideration is that the figures are upper-Amazon provinces; extension to the middle/lower Amazon remains an extrapolation.
  - claimId: AMZ-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
