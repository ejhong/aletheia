  synthesis: >-
    The overarching hypothesis of "The Emptied Amazon"—that the sixteenth-century chronicler Gaspar de Carvajal observed real, populous, and politically complex riverine societies along the Amazon, which subsequently suffered catastrophic demographic collapse and ecological erasure rather than existing solely as colonial fabulation—is well supported by the current physical and historical evidence ledger. For decades, the dominant twentieth-century ecological paradigm held that tropical lowland soils were fundamentally incapable of sustaining dense, sedentary, complex societies. This paradigm has been decisively overturned by multi-regional archaeology, LiDAR remote sensing, and paleoethnobotany. The ledger demonstrates that large-scale settlement systems existed: 1,800 kilometers of fortified villages along the southern Amazon rim dating to AD 1250–1500 (AMZ-C006), dense monumental mound systems and raised-field maize agriculture in the Llanos de Mojos (AMZ-C007), and substantial sedentary occupations persisting directly into the contact era on the Belterra Plateau, Marajó Island, and the Upper Xingu (AMZ-C011). Furthermore, independent sixteenth-century Spanish and Portuguese accounts—specifically Diogo Nunes in 1538 and the ten accounts of the 1560 Ursúa expedition—corroborate Carvajal's qualitative descriptions of vast food stores, extensive road systems, fine ceramics, and dense riverbank populations along the exact same reaches (AMZ-C003). Regional demographic reconstructions, such as Newson's historical documentation of 62% to 88% depopulation in the Upper Amazon via epidemics, enslavement, and forced flight (AMZ-C010), establish a sufficient mechanism for how this populous river world vanished before later European exploration.

    However, the evidence simultaneously refutes naive maximalist models of a basin-wide, continuous civilization. Cumulative paleoecological surveys across 14 lowland regions show that terra-firme interfluves generally lack evidence of intensive agriculture, anthropic soils, or sustained deforestation (AMZ-C014), and spatial modeling identifies distance to major rivers as the single dominant predictor of pre-Columbian settlement (AMZ-C013). Moreover, Carvajal's highest numerical claims (fleets of tens of thousands of warriors and multi-league settlements) are textually unstable, appearing in only one manuscript tradition and absent in Oviedo's earlier redaction (AMZ-C002). Published demographic totals of 5 to 10 million remain highly sensitive model extrapolations rather than empirical counts, as acknowledged by Denevan's formal repudiation of his own habitat-density methodology (AMZ-C012) and the fivefold sensitivity spread within the 2026 Aquiry study (AMZ-C005). Sensitivity analysis reveals that the single evidence record whose removal would most challenge the qualitative vindication of Carvajal is AMZ-E007 (Lopes et al. 2024, detailing Nunes and Ursúa). Without AMZ-E007, Carvajal's accounts would lack direct sixteenth-century textual triangulation; nevertheless, the case verdict survives without it because late pre-Columbian and contact-era physical archaeology (AMZ-E004, AMZ-E017, AMZ-E018) independently establishes the existence of fortified, road-connected settlements along these river bluffs. Thus, the evidence ledger supports a heterogeneous landscape model: dense, engineered riverine corridors and savannah ecotones embedded within an extensive, lightly occupied forest matrix.
  steelman: >-
    LiDAR surveys in southwestern Amazonia continually identify thousands of hidden earthworks under remaining forest canopy, suggesting that current negative soil-core signals reflect severe sampling under-representation rather than true pre-Columbian absence across the interfluves.
