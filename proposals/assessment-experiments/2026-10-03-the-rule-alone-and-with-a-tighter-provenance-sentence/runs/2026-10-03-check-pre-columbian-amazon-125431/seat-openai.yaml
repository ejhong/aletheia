  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to AMZ-C019, so its exact counts,
      distances, structures, and functional interpretation are held only on
      the source anchor and cannot be graded as evidence. AMZ-E022, attached
      to AMZ-C026, establishes year-round fishing at Loma Salvatierra but does
