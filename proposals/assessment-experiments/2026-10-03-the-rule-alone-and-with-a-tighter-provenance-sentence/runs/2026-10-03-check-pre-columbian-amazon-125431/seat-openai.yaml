      claim's warning that a plausible number can survive rejection of its
      generating method. The strongest opposing consideration is that one
      documented estimate does not establish the broader opening proposition
      that all published basin-wide estimates form assumption-sharing model
      families; that requires the proposed dependency audit.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E020 directly reports that the summed-date analysis fit logistic
      demographic growth approaching carrying capacity before colonization.
      It also attributes the terminal proxy decline to archaeological
      sampling biases compounded by post-European demographic decline and
      dispersal, matching the claim's careful wording. The strongest opposing
      consideration is that summed radiocarbon distributions are biased
      proxies for relative change, not direct population measurements or
      proof of literal carrying capacity.
  - claimId: AMZ-C010
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E008 supplies the stated Napo–Aguarico and Mainas starting and ending
