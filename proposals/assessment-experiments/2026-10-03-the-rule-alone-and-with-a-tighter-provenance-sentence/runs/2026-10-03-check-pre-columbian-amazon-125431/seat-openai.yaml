  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is attached directly to AMZ-C016, but its synthesis
      is carried by AMZ-E004 attached to AMZ-C006 and AMZ-E017 through
      AMZ-E019 attached to AMZ-C011 for late substantial settlements,
      AMZ-E014 attached to AMZ-C007 for engineered subsistence, and AMZ-E010
      and AMZ-E011 attached to AMZ-C013 and AMZ-C014 for river concentration
      and a lightly used terra-firme matrix. These records jointly support a
      mosaic of dense, engineered hotspots within much sparser forest rather
      than either pristine wilderness or continuous basin-wide urbanism. The
      strongest opposing consideration is that the evidence is assembled from
      differently dated and unevenly sampled regions, so “immediately before
      contact” is less secure across the whole basin than the heterogeneity
      conclusion itself.