  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E022 directly reports analysis of more than 17,000 fish remains at
      Loma Salvatierra, its position 50 km from the Mamoré, occupation from AD
      500–1400, and year-round interfluvial aquatic resources. It also names
