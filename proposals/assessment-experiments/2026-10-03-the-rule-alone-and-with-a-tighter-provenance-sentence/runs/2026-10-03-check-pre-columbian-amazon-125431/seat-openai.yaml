caseAssessment:
  verdict: provisionally_supported
  loadBearing: [AMZ-C003, AMZ-C017, AMZ-C010, AMZ-C011, AMZ-C013, AMZ-C014, AMZ-C016]
  weakestLinks: [AMZ-C001, AMZ-C010, AMZ-C016]
  synthesis: >-
    The admitted evidence provisionally supports the featured hypothesis in
    its restrained, geographically heterogeneous form: Carvajal probably
    encountered populous and organized societies in particular river reaches,
    some Amazonian settlement systems persisted into the contact period, and
    severe colonial depopulation could subsequently empty or disperse such
    communities. The strongest evidence for the first part is not monument
    count or ecological plausibility but AMZ-E007: Nunes and the Ursúa
    expedition accounts independently describe dense settlement, large food
    stores, straight travelled roads, and abundant aquatic resources in the
    same middle-Amazon setting. AMZ-E005 separately shows that Carvajal's
    famous extreme numbers are textually unstable between manuscript
    branches. Together these records support a qualitative-versus-numerical
    distinction rather than wholesale acceptance of the chronicle.

    Archaeology strengthens local plausibility and demonstrates that complex
    settlement was not environmentally impossible. AMZ-E004 documents
    fortified villages across the southern rim near AD 1250–1500, while
    AMZ-E017, AMZ-E018, and AMZ-E019 place substantial systems at Belterra,
    Marajó, and the Upper Xingu into the contact era or later. AMZ-E014
    documents intensive engineered maize production in the Llanos de Mojos.
    Conversely, AMZ-E010 and AMZ-E011 support a sparse matrix: occupation
    probability decreases away from rivers, and most sampled terra-firme
    settings in the fourteen-region synthesis lack signals of intensive
    agriculture or extensive clearing. These negative findings do not
    contradict dense corridors; they contradict a basin-wide, continuously
    urbanized Amazon. Survey bias, sparse soil cores, and proxy detectability
    remain serious limitations.

    The strongest skeptical case is chronological and geographical. The
    spectacular Aquiry peak in AMZ-E003 is roughly a millennium too early to
    corroborate what Carvajal saw, and several other engineered landscapes
    lie outside his route. No admitted record yet compares his reported
    populated and empty reaches against contact-horizon archaeology. Most
    importantly, AMZ-E008 measures catastrophic decline in Napo–Aguarico and
    Mainas, not directly across the disputed middle- and lower-Amazon
    corridors. Thus it establishes that severe, multi-causal regional
    collapse occurred, but extending its magnitude and timing to Carvajal's
    entire route remains an extrapolation.

    The single evidence record whose removal would most change the case
    verdict is AMZ-E008. Without it, the ledger would still support populous
    contact-era societies and Carvajal's qualitative credibility, but it
    would lose its only quantitative regional demonstration of the
    disappearance process central to an “emptied” Amazon. The present
    provisionally_supported verdict would not survive at the same grade and
    would fall to weakly_supported. The disappearance half of the case
    therefore hangs substantially on one geographically limited record,
    whereas the existence and heterogeneity halves rest on several
    independent lines of evidence.
  steelman: >-
    The strongest unanswered prediction is that contact-horizon archaeological
    intensity will be systematically higher in Carvajal's independently
    classified populated reaches than in his reported empty reaches, followed
    by dated seventeenth-century abandonment or dispersal in those same
    corridors. No admitted record performs that blinded route-level test, so a
    proponent can rightly argue that the chronicle's most diagnostic spatial
    pattern remains untested rather than rebutted.
claimAssessments:
  - claimId: AMZ-C001
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 supports a geography of sporadic bluff occupation with large
      settlements separated by emptier reaches, but its source statement does
      not directly reproduce Carvajal's descriptions. AMZ-E005, attached to
      AMZ-C002, confirms that manuscript branches contain village and warrior
      descriptions, while AMZ-E007, attached to AMZ-C003, independently
      corroborates food stores and roads in the relevant region. The strongest
      opposing consideration is that no admitted record directly establishes
      every element of this compound textual claim, including ceramics,
      political territories, and Carvajal's empty stretches.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E005 directly quotes the comparison: the figures of 50,000, 10,000,
      and 8,000 warriors and villages four or five leagues long are absent
      from the Oviedo branch, which retains a figure of 5,000 warriors. This
      closely matches the claim as stated. The strongest opposing
      consideration is textual access through an OCR full-text copy rather
      than a fresh synoptic collation of the manuscripts, but no contrary
      comparison is admitted.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 quotes Medina's report that Oviedo supplemented the friar's
      writing with particulars learned orally from Orellana and other
      expedition members in Santo Domingo. That directly supports the claim
      about what Oviedo states. The strongest opposing consideration is that
      Oviedo is quoted secondhand through Medina and the underlying Oviedo
      volume was not independently read in the ledger.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E007 identifies Nunes's 1538 entry and ten accounts of the 1560
      Ursúa expedition, and reports dense settlement, immense maize stores,
      broad straight roads, and aquatic resources in the middle Solimões.
      This is substantial independent corroboration of the claim's central
      observations. The strongest opposing consideration is that Nunes's
      testimony survives in a later letter through a modern edition, while
      the evidence record does not itself quote the claim's renowned-ceramics
      detail.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E080 directly states that Medina records López de Gómara citing
      Orellana's relación and calling it “mentirosa.” This establishes the
      limited historical claim about Medina's report. The strongest opposing
      consideration is that Gómara's own passage was not read and the account
      is therefore secondhand; it also concerns Orellana's relación rather
      than directly establishing a criticism of Carvajal's text.
  - claimId: AMZ-C065
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E072 reports that Achmatowicz's abstract assesses Carvajal's account
      through its geographic reference points and concludes that it may be
      considered trustworthy. Because the claim concerns Achmatowicz's stated
      assessment rather than whether that assessment is correct, the abstract
      directly establishes it. The strongest opposing consideration is that
      the article body and its geographic argument were not read, so this
      verdict does not validate the assessment's reasoning.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E005, attached to AMZ-C002, strongly supports the numerical-instability
      half, while AMZ-E007, attached to AMZ-C003, provides same-region
      corroboration for populous settlements, food stores, and travelled
      roads. Contact-era settlement evidence in AMZ-E004, attached to
      AMZ-C006, and AMZ-E017 through AMZ-E019, attached to AMZ-C011, adds
      broader plausibility but is not a direct route match; AMZ-E003 also
      warns that Aquiry's peak is a millennium too early. The strongest
      opposing consideration is the absence of a contact-horizon corridor
      test, compounded by AMZ-E111's weak evidence of Carvajal's partisanship
      toward Orellana.
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E001 directly reports 432 detected earthworks, 36 previously known,
      a roughly 183,000 km² region, and an extrapolated total of approximately
      24,000–30,000 earthworks. The distinction between observed detections
      and modelled regional totals is preserved in the claim. The strongest
      opposing consideration is that AMZ-E038 and AMZ-E039 record a much lower
      basin-wide model attached to AMZ-C004; differing definitions and data
      prevent direct contradiction but reveal substantial model uncertainty,
      and AMZ-E001 does not itself restate the claimed 4,430 km flight length.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 directly gives the assumed 25–60% simultaneous-use fraction,
      300 people per earthwork, the 1.25–3 million estimate, and the
      single-family alternatives of 250,000–600,000 or 315,000–760,000 after
      correction. These figures establish the stated model sensitivity. The
      strongest opposing consideration is that the authors call the
      single-family interpretation “very unlikely,” so its role is a
      sensitivity bound rather than an equally preferred estimate.
  - claimId: AMZ-C006
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E004 directly reports fortified earth-building villages across an
      1,800 km southern arc around AD 1250–1500 and reproduces the projected
      population calculations. It also explicitly states the contemporaneity,
      ethnographic-conversion, and MaxEnt-extrapolation assumptions identified
      in the claim. The strongest opposing consideration is that the
      population range is model-dependent and should not be treated as a
      census, though that limitation is already part of the claim.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E017 supports Belterra occupation from about AD 1300 into
      seventeenth-century colonization, with dark earths, ponds, and trodden
      roads; AMZ-E018 supports Cacoal's AD 1300–1650 continuity. AMZ-E019
      reports Upper Xingu settlement through 1770 and layouts resembling
      modern Kuikuro villages. The strongest opposing consideration is that
      the Upper Xingu record is journalism summarizing the research program
      rather than an admitted primary excavation report.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E014 directly reports drainage canals, savannah farm ponds, and
      ubiquitous maize phytoliths across 178 samples from 18 profiles, and
      interprets them as intensive year-round maize monoculture. This closely
      matches the claim's subsistence and engineering components. The
      strongest opposing consideration is chronological: Casarabe's
      florescence ends around 1400, so this evidence does not by itself
      establish survival into European contact.
  - claimId: AMZ-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E012 directly supports greater richness and abundance of domesticated
      trees around archaeological sites, while AMZ-E040 and AMZ-E041 add a
      related but non-independent association with modelled earthwork
      probability. Landscape engineering is also supported by AMZ-E014
      attached to AMZ-C007, AMZ-E015 and AMZ-E016 attached to AMZ-C009, and
      Belterra dark earths in AMZ-E017 attached to AMZ-C011. The strongest
      opposing consideration is AMZ-E013's post-Columbian-management
      confound, while no admitted record here directly establishes the
      human-made forest-island component.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E015 states the flood-risk interpretation and proposal that raised
      fields were built where alternatives were absent. AMZ-E016 independently
      reports intermittent Bermeo-area construction and use from AD 570–770
