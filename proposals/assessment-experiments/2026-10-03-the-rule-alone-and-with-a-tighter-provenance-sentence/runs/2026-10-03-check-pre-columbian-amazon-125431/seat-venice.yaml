      measurements. The strongest opposing consideration: the claim's
      generalization ("published basin-wide estimates are model families
      sharing assumptions") goes beyond this one documented instance, though
      the Aquiry fivefold span (AMZ-E002, attached to AMZ-C005) supplies a
      second instance from a different model family.
  - claimId: AMZ-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      AMZ-E020 (attached to this claim) verifies the logistic-fit finding and
      the authors' attribution of the terminal decline to sampling bias
      compounded by post-European collapse. The strongest opposing
      consideration, carried in the record's own limitations: summed
      radiocarbon-date distributions are proxies for relative population
      change with stated biases — an aggregate signal, not a census — so the
      carrying-capacity reading is model-dependent and the claim inherits
      that fragility.
  - claimId: AMZ-C010
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E008 (attached to this claim) verifies Table 1 and the narrative
      verbatim: Napo-Aguarico 49,000-51,000 to about 6,000 by circa 1700
