  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E009 (attached to this claim) verifies Denevan's self-rejection
      verbatim and is graded decisive in the ledger — the author rejects his
      own habitat-density method while retaining the 5-6 million order of
      magnitude on other grounds, which is exactly the claim's point that
