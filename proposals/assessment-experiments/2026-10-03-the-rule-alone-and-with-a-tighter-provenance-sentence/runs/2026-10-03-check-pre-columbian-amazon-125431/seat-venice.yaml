caseAssessment:
  verdict: well_supported
  loadBearing: [AMZ-C004, AMZ-C013, AMZ-C014, AMZ-C011, AMZ-C010, AMZ-C003, AMZ-C017]
  weakestLinks: [AMZ-C016, AMZ-C015, AMZ-C014]
  synthesis: >-
    The ledger supports neither the pristine wilderness nor a basin-wide
    civilization, but the heterogeneous-Amazon reading, and it supports it
    through independent lines that do not share a method. The positive pole
    rests on measurements from distinct teams and techniques: canopy-penetrating
    LiDAR documenting 432 earthworks and a 24,000-30,000 prediction for a
    183,000 km2 Aquiry area (AMZ-E001, attached to AMZ-C004), fortified
    villages along an 1,800 km southern rim dated AD 1250-1500 (AMZ-E004,
    attached to AMZ-C006), phytolith-documented Casarabe maize monoculture
    under engineered drainage (AMZ-E014, attached to AMZ-C007), and three
    independently dated settlement systems occupied into the contact era
    (AMZ-E017, AMZ-E018, attached to AMZ-C011). The negative pole is equally
    real: river distance dominates a 7,363-site occupation model (AMZ-E010,
    attached to AMZ-C013), and a fourteen-region phytolith/charcoal synthesis
    finds little intensive-use signal in most sampled terra firme (AMZ-E011,
    attached to AMZ-C014) — though with stated detectability limits. The
    demographic headline numbers are honestly unstable, and the ledger says
    so itself: the Aquiry population model spans fivefold across its own
    assumptions (AMZ-E002, attached to AMZ-C005), and Denevan's self-rejection
    of his habitat-density method (AMZ-E009, attached to AMZ-C012) is the
    template for auditing estimate dependencies. Carvajal's qualitative
    credibility is carried by independent sixteenth-century witnesses who
    repeat his mundane load-bearing features without his extreme numbers
    (AMZ-E007, attached to AMZ-C003), while the manuscript-branch divergence
    (AMZ-E005, attached to AMZ-C002) caps the numbers. Steelmanning the
    skeptic: chronology cuts against spending early grandeur on 1542 — the
    Aquiry peak sits a millennium before Orellana (AMZ-E003, attached to
    AMZ-C004 and AMZ-C017) — and no admitted record tests Carvajal's specific
    reaches against contact-horizon archaeology. Steelmanning the proponent:
    nothing in the ledger documents the middle-Amazon population trajectory
    between 1542 and the later silence, so the "died between the visits"
    reading is unrefuted and untested (AMZ-R005, AMZ-R007 remain open).
    Sensitivity: removing AMZ-E007 would most change the case — Carvajal's
    qualitative credibility would lose its only independent-corroboration
    record and AMZ-C003 and AMZ-C017 would drop a rung; the mosaic structure
    (AMZ-C004, C006, C007, C011, C013, C014) would survive on archaeology
    alone, so the case verdict survives at a reduced rung
    (provisionally_supported) without it.
  steelman: >-
    No admitted evidence record documents what happened to the populations of
    the middle-Amazon reaches Carvajal actually described between 1542 and the
    emptier later record: Newson's 88% (Napo-Aguarico) and 62-64% (Mainas)
    declines (AMZ-E008, attached to AMZ-C010) come from mission-era
    upper-Amazon provinces, and the record's own limitations state that
    extension to the middle and lower Amazon is an extrapolation. A proponent
    can rightly say the ledger contains no positive evidence that Carvajal's
    riverine world survived to be found empty, no reach-level
    contact-horizon archaeological test (AMZ-R001 unrun), and no seventeenth-century
    resident headcount for the Omagua corridor (AMZ-R007 unrun) — so the
    "murdered world" reading of his account is entirely unrebutted by this
    ledger, merely unbuilt.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E006 (attached to this claim) documents Denevan's bluff model —
      sporadic, concentrated riverine settlement with large sites where
      channels meet bluffs — which matches the alternating populated/empty
      reaches the claim attributes to Carvajal, and AMZ-E007 (attached to
      AMZ-C003) independently corroborates the qualitative picture on the same
      reaches. The strongest opposing consideration: the Medina 1894 text of
      the Relación itself was never verified by a second reader
      (SRC-CARVAJAL-1542 is unverified at this record), so the claim's
      textual content rests on Denevan's and Lopes's published comparisons
      rather than a ledger-read primary text.
  - claimId: AMZ-C002
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E005 (attached to this claim) verifies the manuscript-branch
      comparison verbatim — the 50,000/10,000/8,000 figures and the
      four-to-five-league villages appear only in Medina/Muñoz, with one
      ~5,000 figure in Oviedo. The strongest opposing consideration: the
      comparison was verified through a Wayback abstract plus an OCR full-text
      copy, and it is one scholar's collation; a synoptic witness table
      (AMZ-R002) does not yet exist.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E089 (attached to this claim) quotes Oviedo's statement, via Medina,
      that he learned particulars orally from Orellana and his companions in
      Santo Domingo; this matters because it means the Oviedo branch is not
      independent of Orellana. The strongest opposing consideration: the quote
      is carried through Medina's 1894 introduction, and the ledger records
      that no quotation from SRC-CARVAJAL-1542 has been checked by a second
      reader, so this is secondhand evidence with an unverified-by-second-reader
      source.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E007 (attached to this claim) verifies verbatim that Nunes's 1538
      entry and the ten Ursúa accounts describe dense settlement, vast maize
      stores, Inca-style roads, and renowned ceramics on the middle Solimões —
      from witnesses hostile to one another writing for different crowns, none
      repeating Carvajal's extreme numbers. The strongest opposing
      consideration: Nunes's testimony survives only as a 1553/54 letter known
      through Porro's modern edition, and the record notes fortifications and
      organized warfare are NOT among the verified common elements, so the
      corroboration covers the mundane features, not every striking one.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: low
    reasoning: >-
      AMZ-E080 (attached to this claim) documents Medina's statement that
      Gómara cited Orellana's relación calling it "mentirosa", and notes the
      object of the charge is Orellana's narrative, not the Carvajal text. The
      strongest opposing consideration: Gómara's own passage is not in the
      ledger — Medina's reading is second-hand, and no quotation from this
      source has been verified by a second reader — so the claim rests on one
      editor's paraphrase.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: low
    reasoning: >-
      AMZ-E072 (attached to this claim) verifies the abstract's statement that
      Achmatowicz assessed the manuscript as "una fuente digna de confianza"
      through study of its geographic reference points. The strongest opposing
      consideration: the record is abstract-only — the body, argument, and
      route conclusions were never read — so the claim is supported at the
      level of a landing-page assessment, with weight the ledger itself caps
      as weak.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The numeric-instability leg is carried by AMZ-E005 (attached to
      AMZ-C002) and the qualitative-credibility leg by AMZ-E007 (attached to
      AMZ-C003), whose independent witnesses repeat the load-bearing features
      without the extreme figures; AMZ-E006 (attached to AMZ-C001) adds a
      settlement-geography convergence and AMZ-E077 (attached to this claim) a
      weak, abstract-only scholarly convergence from a different route. The
      strongest opposing consideration, stated by AMZ-E003 (attached to
      AMZ-C004 and this claim) itself: the archaeological corroboration of
      Amazonian grandeur peaks around AD 100-300, a millennium before
      Orellana, so the credibility inference must not spend that early
      record as contact-era evidence — and no reach-level contact-horizon
      test (AMZ-R001) has been run.
  - claimId: AMZ-C004
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E001 (attached to this claim) verifies the LiDAR figures verbatim —
      432 earthworks from 4,430 km flown, 396 previously unknown, a 183,000
      km2 Aquiry area, and a 24,000-30,000 prediction — with the extrapolation
      status of the total stated as a limitation. The strongest opposing
      consideration is model discordance, not error: AMZ-E038 and AMZ-E039
      (both attached to AMZ-C004, as context) record a basin-wide 2023
      prediction of only 10,272-23,648 undiscovered earthworks for all
      Amazonia, though the records themselves flag that the two models are not
      strictly commensurable, so this qualifies the interpretive framing, not
      what the 2026 study measured and predicted.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E002 (attached to this claim) verifies both poles of the paper's own
      sensitivity analysis verbatim — 1.25-3 million under the 300-people-per-earthwork
      assumption versus roughly 250,000-600,000 (315,000-760,000 with canopy
      correction) under the single-family alternative the authors call "very
      unlikely" — which is exactly the model-sensitivity the claim asserts.
      The strongest opposing consideration: the emphasis on the fivefold span
      is the ledger's, not the authors', and no peer-reviewed technical
      rebuttal of the model existed yet at case build, so absence of critique
      is not consensus in either direction.
  - claimId: AMZ-C006
    verdict: established
    confidence: moderate
    reasoning: >-
      AMZ-E004 (attached to this claim) verifies the 1,800 km fortified-village
      occupation at AD 1250-1500 verbatim, together with the stated-assumptions
      population arithmetic (21,340 site-level, projected to 463,555-1,087,150,
      with the authors' own caveat-bearing 500k-1M range) — the claim
      accurately reports both the finding and its dependency structure. The
      strongest opposing consideration: the population figures rest on site
      contemporaneity, ethnographic formulae, and MaxEnt extrapolation, all
      stated by the authors, so the demographic half of the claim is a model,
      not a measurement.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      AMZ-E017 and AMZ-E018 (both attached to this claim) verify the Belterra
      Plateau (AD 1300 to seventeenth-century colonization, with dark earths,
      ponds, trodden roads) and Cacoal (AD 1300-1650, Marajoara permanence
      into Portuguese contact) datings verbatim from independent primary
      studies. The strongest opposing consideration: the Upper Xingu leg
      rests on AMZ-E019, a journalism summary of the Heckenberger/Kuikuro
      research held at secondary-source weight pending primary reports, so
      one of the three systems is carried on a weaker thread than the other
      two.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      AMZ-E014 (attached to this claim) verifies the Casarabe finding
      verbatim: drainage canals, newly documented savannah farm ponds, and
      178 phytolith samples from 18 profiles recording ubiquitous maize,
      supporting intensive year-round monoculture. The strongest opposing
      consideration, stated in the record's own limitations: the Casarabe
      florescence ends before European contact, so this is powerful evidence
      for engineered subsistence but speaks only indirectly to the
      contact-era world.
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E012 (attached to this claim) verifies the basin-wide concentration
      of domesticated species on and around archaeological sites, and
      AMZ-E040/AMZ-E041 (attached to AMZ-C033 and AMZ-C008) corroborate with a
      different response variable — though the records flag shared species
      list and overlapping authorship, so not independent. The strongest
      opposing consideration is AMZ-E013 (attached to this claim): the
      Technical Comment shows post-Columbian activities likely played the
      larger role in the floristic pattern, which directly qualifies the
      pre-Columbian attribution the claim makes.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      AMZ-E016 (attached to this claim) verifies verbatim that Bermeo raised
      fields were in intermittent use from AD 570-770, built during a few
      separate construction events, challenging continuous-cultivation
      readings, and AMZ-E015 (attached to this claim) supplies the
      flood-risk-mitigation proposal with its "only where there were no
      alternatives" clause. The strongest opposing consideration, stated in
      the record's limitations: the dating evidence is specific to the Bermeo
      area, and other complexes may differ, so the claim's generalization
      beyond that complex is an extrapolation.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to this claim; the Blatrix et al. 2018
