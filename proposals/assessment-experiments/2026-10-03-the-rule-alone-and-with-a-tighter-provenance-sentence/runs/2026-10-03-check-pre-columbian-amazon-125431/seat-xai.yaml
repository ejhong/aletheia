  synthesis: >-
    The ledger's admitted evidence supports a strongly heterogeneous pre-Columbian Amazon rather than either a pristine empty wilderness or a continuous basin-wide civilization. Carvajal's qualitative picture of populous, road-linked, store-holding riverbank societies on specific middle-Amazon reaches (AMZ-C001) is corroborated by independent sixteenth-century witnesses (AMZ-C003 via E007) whose mundane details align while avoiding his extreme Medina-branch numbers (AMZ-C002 via E005); the numbers themselves are textually unstable across manuscript branches, so the interpretive claim that he is credible on social geography but not as a census (AMZ-C017) follows directly. Contact-era or near-contact occupation is documented at Belterra, Marajó Cacoal and Upper Xingu (AMZ-C011 via E017–E019), and southern-rim fortified villages of AD 1250–1500 plus Casarabe engineered maize systems (AMZ-C006 via E004; AMZ-C007 via E014) show that complex, intensive landscapes existed into or near the European horizon in favored corridors and savannas. At the same time, river distance dominates site prediction across 7,363 records and interfluves register as more sparsely occupied (AMZ-C013 via E010), while cumulative phytolith-charcoal work finds little intensive agriculture, clearing or anthropic soils in most sampled terra-firme settings (AMZ-C014 via E011). Dark-earth and domesticated-tree signals exist but are qualified by post-Columbian confounding (AMZ-C008 via E012–E013). Regional colonial declines of 60–88 percent by mixed epidemic, raid and flight mechanisms are reconstructed for upper-Amazon provinces (AMZ-C010 via E008), and radiocarbon SPDs fit logistic growth to carrying capacity before a terminal decline attributed to sampling plus post-contact collapse (AMZ-C015 via E020). Population headlines remain model-family artifacts: Denevan rejected his own habitat-density method while retaining an order-of-magnitude figure (AMZ-C012 via E009), and the 2026 Aquiry 1.25–3 million estimate collapses fivefold under the paper's own single-family sensitivity (AMZ-C005 via E002). The 2026 LiDAR itself (AMZ-C004 via E001) documents hundreds of earthworks and extrapolates tens of thousands inside a delimited southwestern cultural area whose demographic peak sits a millennium before Orellana (E003), so it refutes ecological impossibility without directly mapping Carvajal's 1542 corridor. Taken together the load-bearing observations make locally dense, engineered riverine and savanna societies that could empty or thin after contact the best-supported reading; basin-wide continuous high density and pure invention are both undercut. Several catalog claims lack attached evidence records and stay unresolved, leaving matrix density, exact Carvajal-route matching and some collapse-process details open. The case verdict therefore rests on the spatial mosaic and the qualitative eyewitness concordance, not on any single population total.
  steelman: >-
    Independent sixteenth-century accounts repeatedly describe vast food stores, long straight roads and dense middle-Amazon settlement on the same reaches Carvajal named, yet no preregistered contact-horizon archaeological intensity map of those exact corridors versus his reported empty stretches has been executed, leaving the strongest qualitative concordance still untested against the ground.
claimAssessments:
  - claimId: AMZ-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Denevan's bluff-model discussion and manuscript comparison (E006) treat the chronicle as reporting populous riverbank settlements alternating with empty stretches, large stores, roads and multi-settlement territories; Lopes et al. supply parallel verbatim texture. Strongest opposing consideration is that the Relación body itself remains unread in the ledger (SRC-CARVAJAL-1542 verification note), so the claim rests on secondary quotation rather than primary page collations.
  - claimId: AMZ-C002
    verdict: established
    confidence: high
    reasoning: >-
      E005 quotes Denevan 1996 verbatim that the Medina/Muñoz branch alone carries the 50,000/10,000/8,000 warrior figures and 4–5-league villages while Oviedo preserves the populous picture and only one ~5,000 figure. No contrary manuscript collation appears; the only limitation is OCR/page-source secondary status of the Denevan extract itself.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E089 quotes Medina quoting Oviedo that he supplemented the friar's written account with particulars learned orally in Santo Domingo from Orellana and the gentlemen who came with him. Strongest opposing consideration is that the Oviedo volume is blocked and the quotation travels only via Medina 1894, so transmission fidelity is second-hand.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      E007 extracts Lopes et al. 2024 on Nunes's 1538 Machiparo entry (via 1553/54 letter) and the ten Ursúa 1560 accounts describing dense settlement, infinite maize stores, Inca-like straight roads and abundant ceramics on the same middle-Amazon reaches. Strongest opposing consideration is that Nunes survives only through a modern edition and fortifications/warfare are explicitly not among the verified common elements.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E080 quotes Medina 1894 that López de Gómara cited Orellana's relación and called it mentirosa. Strongest opposing consideration is that the charge targets Orellana's own narrative rather than Carvajal's text directly, and Gómara is read only through Medina.
  - claimId: AMZ-C065
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      E072 reports the abstract's conclusion that Achmatowicz's geographic-reference study allows the manuscript to be considered a trustworthy historical source. Strongest opposing consideration is that only the abstract was read; the body, route arguments and any treatment of population figures remain unread, so weight is minimal.
  - claimId: AMZ-C017
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Qualitative concordance of populous road-linked riverine societies follows from C001+C003 (E006, E007) plus contact-era occupation (C011 via E017–E019) and southern-rim systems (C006 via E004); numeric instability follows from C002 (E005). E003 strongly qualifies by placing the densest Aquiry peak a millennium earlier; multiple Medina/Oviedo character endorsements (E105–E111, E077) are only context or weak and do not separate qualitative from numeric reliability. Strongest opposing consideration remains the absence of a preregistered spatial test of Carvajal's own populated-versus-empty reaches against contact-horizon archaeology.
  - claimId: AMZ-C004
    verdict: established
    confidence: high
    reasoning: >-
      E001 quotes the 2026 Nature LiDAR results of 432 earthworks (396 new) over 4,430 km, an ~183,000 km² Aquiry circumscription, and the 24,000–30,000 extrapolation. E038/E039 supply only non-diagnostic basin-wide comparators from an earlier model. Strongest opposing consideration is that the total is an explicit block-extrapolation from sampled densities, as the paper states.
  - claimId: AMZ-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      E002 quotes the paper's own single-family-per-house alternative yielding ~250,000–600,000 (315,000–760,000 with canopy correction) against the 1.25–3 million headline that assumes 300 people per earthwork and a simultaneous-use fraction. Strongest opposing consideration is the authors' own label of the single-family reading as “very unlikely,” so the sensitivity is theirs while the emphasis on the span is editorial.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      E004 quotes the 2018 Nat. Commun. result of an 1,800 km southern-rim occupation by earth-building cultures in fortified villages ~Cal AD 1250–1500 and the 500,000–1,000,000 estimate built on stated assumptions of contemporaneity, ethnographic formulae and MaxEnt extrapolation. Strongest opposing consideration is precisely those model dependencies, which the authors flag.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      E017 documents Belterra Plateau sites with dark earths, ponds and trodden roads from ca. AD 1300 to seventeenth-century colonization; E018 dates Marajó Cacoal AD 1300–1650 into Portuguese contact; E019 (secondary journalism) reports Upper Xingu layouts matching living Kuikuro villages inhabited to ca. 1770. Strongest opposing consideration is that the Xingu date range arrives via a Science news feature rather than the primary excavation reports.
  - claimId: AMZ-C007
    verdict: established
    confidence: high
    reasoning: >-
      E014 quotes Lombardo et al. 2025 on Casarabe drainage canals, savannah farm ponds and ubiquitous maize phytoliths from 178 samples demonstrating intensive year-round monoculture. Strongest opposing consideration is that Casarabe florescence ends ~1400 CE, before European contact, so it does not directly illuminate 1542 riverine conditions.
  - claimId: AMZ-C008
    verdict: mixed
    confidence: moderate
    reasoning: >-
      E012 supports concentration of domesticated tree species on and around archaeological sites; E040/E041 add association of 53 of 79 domesticated species with modelled earthwork probability. E013 (McMichael et al. technical comment) qualifies that post-Columbian activities likely played the larger role in the modern floristic patterns. Strongest opposing consideration is therefore the post-1492 confounding that the original Levis signal cannot fully separate.
  - claimId: AMZ-C009
    verdict: well_supported
    confidence: high
    reasoning: >-
      E016 quotes Rodrigues et al. 2015 dating intermittent raised-field use from as early as AD 570–770 in a few construction events linked to flood periods, challenging continuous cultivation; E015 supplies the complementary flood-risk-mitigation reading that fields were built only where no alternatives existed. Strongest opposing consideration is that the dating is specific to Bermeo-area fields and other complexes may differ.
  - claimId: AMZ-C019
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to it. The Blatrix et al. 2018 source is listed in the claim's sourceAnchor but no admitted E-record quotes or verifies the zigzag weirs, causeways or 382-pond spatial statistics for this claim.
  - claimId: AMZ-C026
    verdict: established
    confidence: high
    reasoning: >-
      E022 quotes Prestes-Carneiro et al. 2019 on more than 17,000 fish remains at Loma Salvatierra (AD 500–1400, 50 km from the Mamoré) documenting year-round interfluvial aquatic exploitation including dry-season small-water-body species. No material opposing consideration appears in the ledger.
  - claimId: AMZ-C012
    verdict: established
    confidence: high
    reasoning: >-
      E009 quotes Denevan 2003 rejecting the habitat-density method that produced his 5.1–6.8 million figure for excessive within-habitat variability while still holding “at least 5 to 6 million” reasonable on other grounds. The self-rejection is decisive for the methodological claim; the retained order-of-magnitude is a separate belief statement.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E020 quotes Arroyo-Kalin & Riris 2021 that summed radiocarbon distributions fit logistic growth approaching carrying capacity before European colonization and that the terminal proxy decline is attributed to sampling bias compounded by post-European collapse. Strongest opposing consideration is that SPDs remain relative-change proxies with acknowledged biases, not censuses.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      E008 quotes Newson 2003 Table 1 and text: Napo–Aguarico from 49–51 k to ~6 k (~88 percent) and Mainas 62–64 percent by ~1700 via differing mixtures of epidemics, slave raids, missionization, forced service, revolt and flight. Strongest opposing consideration is that the reconstructions cover upper-Amazon provinces with mission records; extension to middle/lower Amazon is extrapolation.
  - claimId: AMZ-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record is attached to it. Although Newson 2003 is the sourceAnchor and E008 draws on the same paper for decline magnitudes, E008 does not quote or verify the “fade outs,” late-arrival adult mortality or interactive-process claims that constitute this statement.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      E010 quotes McMichael et al. 2025 that across 7,363 AmazonArch sites distance from river was the most important predictor (21.5 percent permutation importance) and that interfluvial areas were more sparsely populated than river-proximate zones. Strongest opposing consideration is inherited survey-effort bias toward accessible riverine areas in the underlying site database.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      E011 quotes Piperno et al. 2024 cumulative synthesis across 14 lowland regions finding little to no evidence of annual crop agriculture, significant forest clearing, anthropic soils, favored-tree enrichment or recurrent extensive fires in most sampled terra-firme settings. Strongest opposing consideration is spatial sparseness of soil-core sampling and the fact that negative signals count only where the proxies could have detected the activities.
