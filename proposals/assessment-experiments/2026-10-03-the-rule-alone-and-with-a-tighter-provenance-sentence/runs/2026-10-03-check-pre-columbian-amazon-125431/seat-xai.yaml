    reasoning: >-
      No evidence record is attached directly to it, but the statement is carried by the conjunction of E001 (attached to AMZ-C004), E004 (attached to AMZ-C006), E014 (attached to AMZ-C007), E017–E019 (attached to AMZ-C011), E010 (attached to AMZ-C013) and E011 (attached to AMZ-C014), which together document dense engineered corridors and savanna systems embedded in a sparsely occupied interfluvial matrix. Strongest opposing consideration is that matrix density itself remains an open sampling parameter (promise-blind interfluve surveys still absent) and several supporting population figures are model-sensitive.