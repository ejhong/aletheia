  - claimId: TRN-C104
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No evidence record is attached directly to this claim. TRN-E018,
      attached to TRN-C003 and TRN-C022, nevertheless provides an indirect
      basis by reporting seven plates with alignments of five to eight
      point-like candidates. The strongest opposing considerations are
      modest non-preregistered p-values, uncertain trials-factor correction,
