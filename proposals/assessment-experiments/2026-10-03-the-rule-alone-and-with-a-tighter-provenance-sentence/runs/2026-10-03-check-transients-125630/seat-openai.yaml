      underlying marks are optical events.
  - claimId: TRN-C119
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E041 directly reports 16 Bonferroni-significant cells among 137
      eligible cells under the specified probability cut, fixed-altitude
      projection, binning, and group control construction. This supports
      the stated result within that analysis. The strongest opposing
      consideration is that plate-specific excesses can project into
      geographic cells, while TRN-E078 shows that all locations depend on
      the assumed 35,786-km altitude and no independent catalog replication
      is admitted.
  - claimId: TRN-C122
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E079 confirms that the first random control produced three
      clusters with silhouette 0.50, meeting the authors' stated threshold.
      It does not itself establish the full claim about multiple controls,
      two-or-three-cluster outcomes, and values through 0.60. The strongest
      opposing consideration is that only three control draws were
      reportedly performed and no null distribution permits a formal
      comparison.
  - claimId: TRN-C117
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E038 directly reports the claimed discrepancy between
      millimetre-scale particles and the model-inferred centimetre-to-metre
      reflecting facets. Its force is conditional on the reflection model's
      assumed altitude, duration, reflectivity, geometry, and catalog
      selection. The strongest opposing consideration is that Cann's
      mechanism was not modeled directly and can distinguish constituent
      particle size from aggregate size, while the facet-size inference is
      itself selection-biased.
  - claimId: TRN-C118
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E072 accurately records the authors' conclusion that NHI alone,
      among their selected toy models, accommodates all five listed
      features, and TRN-E073 records their caveat about unknown natural
      phenomena. This is a model-comparison assertion rather than a test of
      NHI. The strongest opposing consideration is that several input
      features are unresolved or workflow-dependent and the alternative set
      is neither exhaustive nor independently selected.