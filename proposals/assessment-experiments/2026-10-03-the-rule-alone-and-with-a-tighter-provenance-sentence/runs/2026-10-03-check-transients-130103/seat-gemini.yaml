  - claimId: TRN-C119
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Projecting p >= 0.70 transients onto a 35,786 km shell reveals 16 of 137 Earth-fixed cells with statistically significant excess relative to plate-aware random controls after Bonferroni correction (TRN-E041). Strongest opposing consideration: Projecting plates onto an Earth-fixed shell maps single plates with anomalous defect counts into apparent terrestrial hotspots, as seen in cells tied exclusively to plate XE435 (TRN-E077).
  - claimId: TRN-C122
