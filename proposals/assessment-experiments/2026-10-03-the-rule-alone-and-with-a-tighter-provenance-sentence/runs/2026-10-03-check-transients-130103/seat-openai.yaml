      is that the source did not directly model the proposed dusty-plasma
      mechanism and its own facet-size inference is selection-biased and
      model-dependent.
  - claimId: TRN-C118
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E072 accurately records the authors' conclusion that, among their
      chosen toy models, only the NHI scenario accommodates all five listed
      features. This is an internal comparison rather than an empirical test,
      and several premises are themselves disputed or lack attached evidence.
      The strongest opposing consideration is TRN-E073's acknowledgment that
      unconsidered natural phenomena may fit the observations, so exhaustiveness
      of the toy-model set has not been demonstrated.