  synthesis: >-
    Orch OR is a conjunction — gravitational collapse is real physics, neuronal
    microtubules host a coherent state of the required duration and extent, and
    that collapse event is the conscious moment — and a conjunction is only as
    good as its worst conjunct. Reading the ledger conjunct by conjunct, the
    honest floor for a critic is higher than the mainstream reflex assumes, and
    the ceiling is much lower than proponent summaries claim.

    What is secure, and I will not pretend otherwise. Microtubules are
    electronically nontrivial: Kalra et al. measured ~6.6 nm excitation
    diffusion that Förster theory does not sufficiently explain, and a partly
    independent group measured a quantum-yield trend matching a collective
    superradiance model. Anesthetics really do bind β-tubulin (Emerson,
    photolabeling, from a laboratory with no Orch OR commitment) and really do
    shift a measured microtubule optical property. Microtubule-modulating drugs
    really do move anesthetic susceptibility in live animals. These are real
    results and the "warm and wet, case closed" dismissal was never an argument
    from measurement.

    What is not secure is everything the thesis actually needs. The central
    quantity — a coherence or dephasing time in a physiological microtubule —
    has never been measured, by anyone, in thirty years. The two numbers in the
    record are calculations that disagree by seven to eight orders of magnitude,
    and the decisive fact is that the proponents' own revised figure
    (10⁻⁵–10⁻⁴ s) still falls one to two orders short of the ~25 ms moment the
    theory requires. Both sides' arithmetic says this rung fails; nobody has
    measured it. That is not symmetric ignorance, and "unresolved" flatters it.

    On the physics, the one high-quality experiment in the whole case came out
    negative: Gran Sasso excluded the natural parameter-free Diósi–Penrose
    model, and the experimenters, with Diósi among them, judged Orch OR built on
    the simplest collapse dynamics highly implausible. McQueen's rescue is
    valid and I accept it — Penrose's ℏ/E_G criterion makes no radiation
    prediction — but it purchases survival by underspecification, converting a
    refuted precise model into an untested vague one.

    On anesthesia, the arm's two testable implications have both been tested and
    both failed. Specificity failed inside the flagship experiment: picrotoxin,
    a convulsant, moved the assay comparably to two anesthetics. Direction
    failed in the only methodologically complete, independent study: chronic
    epothilone D increased isoflurane sensitivity, and the destabilizer
    vinblastine moved it the same way as the stabilizer, which no
    stability-based account predicts. Meanwhile the rival account holds
    target-level causal evidence — one residue in GABA_A β3 and etomidate and
    propofol stop working — that no microtubule experiment approaches.

    The verdict turns on ORCH-C010. I chose weakly_supported over unresolved
    because the record is not blank but asymmetric: real support exists only at
    rungs the case itself scores low-diagnosticity, while every rung with
    predictive content that has been tested has failed. I chose it over
    contradicted because no measurement of the load-bearing quantity exists, and
    a critic who calls an unmeasured quantity refuted has overclaimed. Priors
    did unavoidable work in exactly one place, named on ORCH-C010: general
    decoherence expectations for warm ionic environments. A prespecified
    coherence witness at 37 °C, a preregistered potency series with
    nonimmobilizer controls, or a tubulin knock-in mouse would each move this
    materially — and the theory's refusal to publish a numerical threshold is
    why none of them can currently be scored as pass or fail.
claimAssessments:
  - claimId: ORCH-C001
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is that no record in this case
      tests the conjunction, so a negative verdict cannot be read off any
      experiment, and the biological rungs beneath it have moved in the
      theory's favor since 2023. Against that: the thesis needs an unconfirmed
      law of physics whose most natural implementation is experimentally
      excluded, an unmeasured biological state whose only quantitative
      estimates — including the proponents' own — fall short of requirement,
      and a collapse-to-experience bridge with no evidence record at all. A
      conjunction of three unestablished conjuncts, two of them under active
      disconfirming pressure, is not evidentially neutral. I decline
      "unresolved" because it implies balanced ignorance the ledger does not
      show, and decline "contradicted" because the load-bearing quantity has
      never been measured.
  - claimId: ORCH-C002
    verdict: contradicted
    confidence: low
    reasoning: >-
      The strongest supporting consideration is real: anesthetics measurably
      alter microtubule photophysics, β-tubulin is a photolabeled anesthetic
      target, and an acute epothilone B dose produced a large blinded shift in
      LORR latency in two species. But this claim's two testable consequences
      have each been tested and each failed — specificity failed inside the
      flagship experiment, where the convulsant picrotoxin moved the assay
      comparably to the anesthetics, and direction failed in the only
      independent full concentration–response study, where a stabilizer and a
      destabilizer both increased sensitivity. Add that the one clean
      target-level causal result in anesthesia belongs to the rival account
      (β3 N265M abolishing etomidate and propofol action) and the claim is
      failing where it can be checked. Confidence is low, and honestly so: the
      "quantum-coherent" variable at the center of the statement remains
      entirely unmeasured, the picrotoxin comparison is a single compound, the
      chronic-versus-acute regimen difference is genuine, and Jurd's own
      conclusion leaves volatiles open.
  - claimId: ORCH-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is the best causal evidence
      anywhere in this case: a single engineered residue change abolishes
      etomidate and propofol immobility and profoundly reduces hypnosis, and
      β2/β3 manipulations dissociate sedation, hypnosis, amnesia and
      immobility. Even arguing against Orch OR I cannot call this claim
      well_supported as worded, because "fully accounted for" and "without any
      quantum-coherent contribution" is a universal negative that accumulating
      successful conventional explanations cannot establish. Two specifics bite:
      the same mutation only slightly reduced enflurane and halothane effects,
      so the result does not transfer to the agents Orch OR concerns, and the
      xenon nuclear-spin isotope result is a published anomaly for a
      pharmacology with no quantum degrees of freedom. The downgrade is about
      the claim's quantifier, not about the standing of the conventional
      account relative to Orch OR, where the asymmetry remains stark.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The strongest consideration for treating this generously is McQueen's,
      and it is correct: Penrose's published criterion is a
      characteristic-lifetime relation, not a stochastic master equation, so
      the Gran Sasso radiation search did not test the claim as worded, and no
      experiment has yet probed ℏ/E_G scaling. That is why I do not say
      contradicted, and it is the honest floor here. But unresolved should not
      be read as parity: there is zero positive evidence for the criterion in
      this record, the natural parameter-free completion is experimentally
      dead, and the claim survives by occupying territory no experiment can
      currently reach — the packet's own agenda concedes the required
      mesoscopic regime is beyond present capability. Escaping a bound by being
      less specified than the model tested is not a result.
  - claimId: ORCH-C040
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      The strongest consideration against this label is that the claim has a
      formal core — the Koellner versus Corradini–Galvan dispute over whether
      the contested steps survive restriction to arithmetic formulas — which
      could in principle be settled by proof rather than by experiment, and
      that dispute is live rather than closed. Even granting that, the claim as
      stated is not empirically decidable on the present record: it turns on
      "understanding" versus performance with no agreed operationalization, and
      the case's own whatWouldChangeOurMind concedes the point. The editor's
      audit is the sharpest datum here and it cuts against the theory: Penrose's
      testable examples have largely settled against him, most cleanly the 2017
      pawn-fortress position, while the examples aging best are the least
      testable — the signature of a claim retreating toward unfalsifiability
      rather than one accumulating support.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: high
    reasoning: >-
      The strongest supporting consideration is that this is genuinely an
      absence rather than a refutation: no dephasing time, coherence time, or
      entanglement witness has ever been measured in a physiological
      microtubule, Hagan et al. showed Tegmark computed a different physical
      state than the theory proposes, and the ordered aromatic lattice is
      exactly the structure where protection mechanisms would be worth looking
      for. So "contradicted" would overclaim, and I decline it. But this is an
      asymmetric unresolved and the asymmetry should be stated: both
      quantitative estimates in the record fall short of the claim's
      requirement, and the proponents' own revised figure of 10⁻⁵–10⁻⁴ s misses
      the ~25 ms conscious moment by one to two orders of magnitude. The best
      measured transport is ~6.6 nm — one tubulin dimer — on
      femtosecond-to-picosecond physics. Priors do acknowledged work here:
      decoherence in warm, ionically screened environments is generally fast.
      The theory has also never published a threshold that would let any
      measurement count as failure.
  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Here the critic's honest floor is high and I will say so plainly: two
      independent lines support this as worded. Emerson et al. photolabeled
      β-tubulin and mapped binding near the colchicine site from an anesthesia
      laboratory with no Orch OR commitment, and Kalra et al. measured
      etomidate and isoflurane shortening exciton diffusion. The limits keep it
      from anything stronger — the Kalra experiment is unreplicated, includes
      Hameroff and Penrose as co-authors, tested two agents at 50 μM without
      establishing free aqueous concentration, and produced roughly a 13%
      effect; the Emerson compound is a research anesthetic, not a clinical
      volatile, so the generic "general anesthetics" is an extrapolation. The
      strongest opposing consideration for Orch OR is not credibility but
      specificity, and it comes from inside the same experiment: picrotoxin, a
      convulsant, moved the same assay comparably.
  - claimId: ORCH-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Assessed strictly as worded, this is well supported and I grant it: four
      microtubule-modulating drugs across two independent laboratories all
      shifted isoflurane susceptibility, several with narrow non-overlapping
      confidence intervals on full concentration–response curves. The strongest
      opposing consideration is that the drugs are blunt instruments —
      epothilones, paclitaxel and vinblastine alter cytoskeletal integrity,
      axonal transport, metabolism, and in the Li study blood pH and CO₂ — so
      the effect need not be about microtubule stability at all. The reason
      this verdict is bad news for Orch OR rather than good is that the
      well-supported version is the contentless one. The version with
      predictive content, that stabilizing microtubules protects consciousness
      from anesthetics, is refuted in that form: a destabilizer moved
      sensitivity the same direction as a stabilizer, which no stability
      account predicts.
  - claimId: ORCH-C013
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is convergence across methods:
      Kalra's diffusion measurement reporting Förster theory insufficient,
      Babcock's quantum-yield trend matching a superradiance model from a partly
      independent group, and the Bandyopadhyay-lineage electrical work. I
      downgrade from well_supported for three reasons that are about evidence
      rather than about interpretation: the Kalra measurement is unreplicated
      and co-authored by the theory's principals, the Babcock paper is
      predominantly theoretical with a single indirect bulk-fluorescence
      confirmation that several mechanisms could produce, and the third line is
      unreplicated after thirteen years. There is also a wording problem worth
      naming — "a model of them as passive structural scaffolding" is not a
      computed baseline, and ordered aromatic lattices are expected to show
      collective optics, so part of the claimed surprise is measured against a
      strawman rather than against physics.
  - claimId: ORCH-C020
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is that both halves of the
      statement are in the paper's own abstract, the venue is a strong
      general-chemistry journal, the work is open access, and there is genuine
      internal structure-dependence control — polymerization state mattered
      while protofilament architecture did not, which argues against artifact.
      Against a stronger label: this is one experiment, from one laboratory,
      never independently replicated, with the diffusion length inferred from
      concentration-dependent quenching rather than directly imaged, in
      purified in vitro microtubules with no MAPs, no crowding and no membrane
      environment. The specific reduced values (~5.6 and ~5.8 nm) were not
      verified against the paper body by this import. A single unreplicated
      inference-based measurement is provisional by construction, whichever
      side it favors.
  - claimId: ORCH-C021
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is real independence: the Howard
      University group with EPFL and Florence collaborators sits outside the
      Hameroff–Penrose line, the paper is peer-reviewed in JPCB, and the
      measured quantum-yield trend matched the model's prediction across
      geometric regimes with the effect reported as resilient to disorder. But
      the evidential weight is thin. The paper is predominantly a theoretical
      analysis whose experimental component is one bulk fluorescence quantum
      yield, an indirect witness that several ordinary mechanisms can raise, so
      the collective-state reading is model-dependent rather than measured.
      Dicke-type collective emission has been engineered in ordered protein
      scaffolds with no cognitive role, which suggests geometric regularity is
      doing the work. And the arresting "tens of seconds" figure is a modeled
      radiative lifetime of a dark eigenstate, not a decoherence time.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is that this is a published,
      specific, quantitative measurement, and no laboratory has attempted the
      replication and failed — the record contains a vacuum, not a
      disconfirmation, which is why "contradicted" would be dishonest. That is
      about all that can be said for it. The result rests on one laboratory
      lineage using bespoke apparatus across an unusually wide frequency range,
      in a considerably lower-profile venue than the primer's misattribution
      implied; the same group's 2013 report of 100-microsecond warm coherence
      is likewise unreplicated; and the earlier Sahu work is the same group and
      cannot count as corroboration. Thirteen years without independent
      replication in an active field is itself mildly disconfirming, and the
      comparison the case editor draws is damning — photosynthetic coherence
      was replicated many times over and founded a field.
  - claimId: ORCH-C023
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is that the LORR measurement was
      blinded, tolerance from repeated isoflurane exposure was explicitly
      controlled, the standardized effect in rats was large (d = 1.9), and the
      direction reproduced in a second species. The design flaws are serious
      enough to hold this below provisional. The main rat analysis is N = 8,
      males only, and critically not a counterbalanced crossover — every animal
      received the drug phase after the pre-drug phase, so time and order are
      confounded with treatment and the tolerance control is the only defense
      against that. The measurement is latency at a single high concentration
      (4% isoflurane), which does not establish a shift in the
      concentration–response curve, and the curve is precisely what the
      independent study measured and found running the other way. The mouse
      replication shares a senior author and program and its authors concede
      the 29 s effect is not large against inter-animal variability.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: high
    reasoning: >-
      The strongest opposing consideration is stated fairly on the record and I
      take it seriously: the regimen (over two weeks of dosing versus a single
      injection) and the compound (epothilone D versus B) both differ from the
      Wellesley experiments, chronic modulation invites compensatory
      remodeling, epothilone D altered blood pH and CO₂, saline was an imperfect
      vehicle for poorly soluble agents, and Emerson found epothilone D
      producing resistance in tadpoles. Those bound the interpretation without
      touching the measurement, which is what this claim asserts. The study is
      independent of the Wellesley program, randomized, blinded, used full
      incremental concentration–response curves rather than single-concentration
      latency, tested four agents including a destabilizer and an opioid
      control, and reports narrow non-overlapping confidence intervals. I assign
      the strongest label in the anesthesia theme on methodology, not on
      direction.
  - claimId: ORCH-C025
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is genuine and I will not
      minimize it: 80 randomized mice, publication in the leading anesthesiology
      journal, an orderly 40–50% potency gap between spin-bearing and spin-zero
      isotopes, and identical calculated polarizability closing the obvious
      classical explanation. What holds it to weak is that it is a single
      unreplicated study with a confound the authors themselves disclose —
      xenon's low potency required a 0.50% isoflurane background, so the
      primary comparison is not made on xenon alone — a behavioral LORR
      endpoint only, and no identified molecular substrate. For this case
      specifically the reach is shorter still: nuclear spin implicates some
      spin-sensitive process somewhere, radical-pair mechanisms are an
      established alternative class, and microtubules are not implicated in any
      way by the experiment.
  - claimId: ORCH-C026
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest supporting consideration is that a real signal was recorded
      in living human brains with heartbeat-evoked-potential-like timing, no
      correlate with conventional MRI contrast, and an apparent dependence on
      conscious awareness — an unusual thing to find, and the authors replied
      specifically that the classical intermolecular multiple-quantum-coherence
      mechanism Warren invokes cannot produce it. Against that: a leading NMR
      methodologist, in the same journal, states the paper "provides no evidence
      to justify this claim" and shows only that brain tissue is complex,
      multicompartmental and imprecisely characterized by MRI; the sample is
      small; the consciousness manipulation was naturalistic sleep onset rather
      than controlled intervention; the protocol has never been validated
      against engineered phantoms with known ground truth; and nobody has
      replicated it. Note also that the experiment does not implicate
      microtubules at all — the known quantum systems are bulk water proton
      spins — so Wiest's characterization of it as direct physical evidence of a
      macroscopic entangled state in the living brain is not sustainable on this
      record.
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: >-
      The strongest opposing consideration is that the experiment tests one
      stochastic master equation and the map from Penrose's geometric-instability
      argument to that equation is not unique, so "one Diósi–Penrose model
      excluded" cannot be read as "every gravity-related collapse theory
      excluded" — a qualification I accept and apply at ORCH-C030. But the claim
      as worded asserts exactly the bounded thing the experiment established.
      Published in Nature Physics, performed at a world-class ultra-low-background
      facility with the predicted signal quantitatively derived before the
      search, with Diósi himself among the authors, source data published, and
      the exclusion stated in the authors' own words with its scope specified.
      This is the methodologically cleanest result anywhere in this case and it
      came out negative for the theory.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: high
    reasoning: >-
      The strongest opposing consideration is the documented false-positive
      history in this evidence line — an October 2025 round of AI Erdős claims
      collapsed when the solutions turned out to be in the literature, and a
      Christmas 2025 claim was withdrawn within hours once a 1977 resolution by
      Erdős himself surfaced — plus the fact that the unit-distance work rests
      on an unreleased internal model whose process cannot be examined. Neither
      touches the claim as worded, because the mathematics is independently
      checkable and was independently checked: Sawin states the disproof in his
      own arXiv paper and sharpens the bound to n^1.014, named mathematicians
      verified it, and the IMO results were Lean-verified with methodology
      peer-reviewed in Nature and, in 2025, officially graded by IMO
      coordinators under contest conditions. I should add, against my own side's
      rhetorical interest, that the case's low-diagnosticity scoping is correct:
      this bears on Penrose's motivation and on nothing in the microtubule,
      anesthesia, or collapse rungs.
