      of the Hameroff-Penrose line — which is exactly the outside corroboration
      proponents are usually accused of lacking. I hold it at provisional
      rather than pushing higher because the paper is predominantly
      theoretical with a confirming bulk measurement, and quantum yield is an
      indirect witness that several mechanisms can raise. I also concede the
      point proponents most often get wrong: the arresting "tens of seconds"
      figure is a radiative lifetime of a modeled dark eigenstate, not a
      decoherence time, and this paper is silent on the quantity Orch OR
      needs.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The strongest opposing consideration is decisive against building on
      this: thirteen years after the group's first striking results, no
      outside laboratory has reproduced the resonance signatures or the
      related 2013 claim of 100-microsecond coherence, the apparatus is
