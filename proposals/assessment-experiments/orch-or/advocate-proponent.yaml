  synthesis: >-
    I am arguing the strongest case the records honestly bear, and the first
    thing an advocate must concede is that the ceiling on the headline thesis
    is "unresolved" and cannot be raised. No record in this file tests the
    conjunction; the middle term has never been measured in either direction.
    But "unresolved" is not a consolation prize here, and the case for reading
    it as a live position rather than a dying one is stronger than the public
    argument allows. Three things have changed. First, the impossibility
    argument that closed the question for twenty-five years is a calculation,
    and Hagan et al. showed in the same journal that it modeled a soliton
    rather than the superposed conformations the theory proposes, moving the
    number seven to eight orders of magnitude. Neither figure is a
    measurement, so the honest state of ORCH-C010 is unmeasured, not refuted
    — and the burden of the null falls on nobody until someone runs ORCH-R001.
    Second, the substrate turned out to be what the theory needed it to be and
    the scaffolding view did not predict: 6.6 nm of electronic transport that
    the authors report Förster theory does not sufficiently explain, with
    polymerization-dependence arguing against artifact, plus superradiant
    collective states measured by a group outside the Hameroff-Penrose line.
    Third, anesthetics demonstrably touch this substrate — Kalra optically,
    Emerson by photolabeling beta-tubulin from a laboratory with no stake in
    the theory — and four microtubule drugs now move anesthetic susceptibility
    in live animals, an effect nobody predicted from conventional pharmacology.
    Add the xenon isotope result, where a purely quantum degree of freedom
    changes potency 40 to 50 percent at identical polarizability, and the
    universal negative in ORCH-C003 is not established as worded. Now the
    concessions, which an advocate who wants to be useful has to make in full.
    The directional prediction that stabilizing microtubules protects
    consciousness is falsified in that form by Li 2025, whose design is better
    than the proponent studies' and whose vinblastine arm points at general
    cellular disruption. Picrotoxin moving the flagship assay is a specificity
    hit from inside the theory's own experiment. Gran Sasso killed the natural
    parameter-free collapse model, and surviving it by underspecification is a
    worse position than it sounds. Above all, the theory has published no
    required coherence time or length, so results get absorbed rather than
    scored. What the verdict turns on is one number that does not exist. What
    would move it: ORCH-R001, ORCH-R002 with nonimmobilizer controls, and
    ORCH-R003. My priors did work in only one place — reading the absence of a
    coherence measurement as genuine openness rather than as tacit refutation,
    which is a judgment about burden, and I flag it as such.
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: high
    reasoning: >-
      The strongest opposing consideration is structural and I concede it
      outright: this is a conjunction requiring an unconfirmed law of physics,
      an unmeasured biological state, and a bridge from collapse to
      experience, so it can fail in three ways and be confirmed in only one,
      and no attached record tests the conjunction at all. What an advocate is
      entitled to is the distinction between that and refutation. Every
      experiment aimed at the theory has bounded one conjunct without touching
      the others, and the load-bearing middle term ORCH-C010 has never been
      measured in either direction, so the file contains no result that
      forecloses the thesis. Unresolved is also the most favorable verdict the
      records can honestly bear, and I say so plainly: nothing here supports
      provisional support, because the theory's own required numbers have
      never been published, which is a real defect in its specification rather
      than a rhetorical complaint.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The strongest opposing consideration is the asymmetry with ORCH-C003 —
      one engineered residue in the GABA_A beta3 subunit abolishes etomidate
      and propofol immobility, and nothing remotely comparable exists for
      tubulin — compounded by picrotoxin affecting the Kalra assay comparably
      to the anesthetics, which is a specificity hit from inside the flagship
      experiment. Weak support is nonetheless real support and it is
      convergent across methods that could each have come out null: anesthetics
      measurably shorten microtubule exciton diffusion, an independent
      anesthesia laboratory photolabeled beta-tubulin and found stabilizers
      shifting the immobilizing dose in tadpoles, and epothilone B shifts LORR
      latency with a large standardized effect. Jurd's own conclusion that
      volatile agents act via a broader spectrum of targets is the opening the
      proponent case actually needs, and it is stated by the conventional
      account's own anchor study rather than asserted by proponents. Honesty
      requires the ceiling: the word "quantum-coherent" in this statement is
      entirely unmeasured, so what the records support is a weaker claim than
      the one worded here, and I will not pretend otherwise.
  - claimId: ORCH-C003
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The strongest opposing consideration is that Jurd et al. is the cleanest
      causal evidence anywhere in this case — change one amino acid, lose the
      drug effect — and the conventional account explains anesthetic
      fractionation into hypnosis, amnesia, immobility, and analgesia with no
      new physics required. But the claim is worded as a universal negative
      ("fully accounted for", "without any quantum-coherent contribution"),
      and the records do not establish it at that strength: the same mutation
      only slightly reduced enflurane and halothane effects, and the authors
      themselves concluded volatiles act through a broader target spectrum,
      which is precisely the class of agents in dispute. The xenon isotope
      result is a documented anomaly pointing the other way — nuclear spin is
      a quantum degree of freedom and the classical polarizability account
      predicts no difference, yet a 40 to 50 percent potency gap appeared. The
      TREK-1 precedent recorded in the file, where an apparently strong
      genetic anesthetic-target finding later failed to reproduce, is a
      further reason not to read this universal as settled. Mixed, not
      contradicted: for intravenous agents' mechanism the conventional account
      is in excellent shape and I do not dispute it.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: high
    reasoning: >-
      The strongest opposing consideration is one an advocate should state
      rather than dodge, because McQueen states it against his own side:
      surviving Gran Sasso by not being the model that was tested converts a
      refuted precise theory into an untested vague one, and that is not
      progress. That said, the exclusion is precisely scoped in the
      experimenters' own words — the natural parameter-free version of the
      Diosi-Penrose model — and Penrose's published criterion is a
      characteristic-lifetime relation that makes no spontaneous-radiation
      prediction, so the claim as worded has not been tested by the one
      high-quality experiment aimed near it. What distinguishes this conjunct
      favorably from most of consciousness science is that it is a tabletop
      physics question with no brains in it, which quantum-gravity groups have
      their own reasons to pursue via mesoscopic superposition tests of the
      hbar/E_G scaling. The honest ceiling is low and I name it: there is zero
      positive experimental evidence for the scaling, so unresolved is the
      maximum, not a starting point.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The strongest opposing consideration is the audit in the case editor's
      own essay: every concrete example Penrose offered that was testable has
      largely settled against him, most cleanly the 2017 pawn-fortress
      position that modern engines handle, and the examples aging best are the
      least testable — a pattern that looks like unfalsifiability from
      outside. But the AI records do not reach the claim as stated, and this
      is a matter of logic rather than loyalty: the claim concerns whether a
      knowably sound algorithm captures mathematical understanding, and nobody
      ever held that algorithms cannot generate true theorems, so correct
      novel output does not bear on it. The Zahavy position paper is notable
      support for the framework/result distinction precisely because it comes
      from a co-author of AlphaProof rather than from Penrose's defenders,
