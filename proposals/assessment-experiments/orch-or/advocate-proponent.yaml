      resonance is a classical observable, and self-similar frequency ratios
      across scales are not an entanglement witness.
  - claimId: ORCH-C023
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The strongest opposing consideration is that loss of righting reflex is
      a behavioral proxy at a single high concentration, anesthetic endpoints
      fractionate, epothilone B changes far more about a neuron than any
      quantum state, and the independent study that measured full
      concentration-response curves found sensitivity moving the other way.
      Assessing the effect as worded, the record is genuinely decent: both
      experiments are peer-reviewed with blinded LORR measurement, both
      controlled for isoflurane tolerance, the standardized effects are large
      to moderate (d = 1.9 in rats, d = 0.8 in mice), and the direction
      reproduced across species. The authors also cited the contradictory
      independent study in their own abstract, which is the behavior of a
      program engaging with disconfirmation rather than curating around it. I
      stop at provisional and will not claim more: N = 8 in the rat analysis,
      males only, no counterbalanced crossover, one senior author across both
      studies, and the authors' own concession that the 29 s mouse effect is
      not large against inter-animal variability. There is no independent
      replication of this effect, and that is the honest ceiling.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: high
    reasoning: >-
      I assess this against the theory's interest and reach the same standard
      I applied to ORCH-C020, because applying a weaker one here would be
      exactly the curation this experiment is meant to test. The study is
      independent of the Wellesley program, randomized, blinded, measured full
      incremental concentration-response curves rather than latency at one
      concentration, included a destabilizer and an opioid control, and
      reports narrow non-overlapping confidence intervals — methodologically
      the strongest animal work in the case, and the measurement stands. The
      strongest consideration in the proponent direction, which I press
      without disputing the data: the regimen differs sharply (more than two
      weeks of dosing versus a single acute injection, inviting compensatory
      remodeling), the compound differs, and epothilone D produced anesthetic
      resistance in Emerson's tadpoles, so the compound's own direction is not
      consistent across preparations; saline was an acknowledged imperfect
      vehicle for poorly soluble drugs and epothilone D altered blood pH and
      CO2. Those bound what the result generalizes to. They do not rescue the
      claim that stabilizing microtubules protects consciousness from
      anesthetics, which is falsified in that form, and the vinblastine arm is
      the sharpest single fact against the anesthesia arm in this file.
  - claimId: ORCH-C025
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The strongest opposing consideration is scope rather than validity: the
      result localizes nothing, any spin-sensitive molecular process anywhere
      in the nervous system would produce it, radical-pair mechanisms are an
      established alternative class, and microtubules are not implicated in
      any way — so it supports "quantum effects participate somewhere in
      anesthesia" and not "microtubules are where." Within that scope the
      measurement is strong for a single study: 80 mice randomized across four
      isotopes in the leading anesthesiology journal, with an orderly 40 to 50
      percent potency gap and calculated polarizability identical at 3.60 A
      across all four, which closes the standard classical explanation before
      it can be offered. That is the most direct evidence in the file that a
      purely quantum degree of freedom modulates anesthetic potency, and it is
      the record that most damages the universal negative in ORCH-C003. I hold
      it at provisional honestly: no independent replication, and xenon's low
      potency forced the primary comparisons onto a 0.50 percent isoflurane
      background, so the isotope effect is not measured on xenon alone in the
      main assay.
  - claimId: ORCH-C026
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The strongest opposing consideration is Warren's, made from
      methodological authority in the same journal: NMR signals in
      heterogeneous living tissue are precisely the regime where classical
      multi-compartment effects mimic exotic ones, he argues the paper
      provides no evidence for the entanglement claim, and no independent
      group has replicated it. My verdict rests on how the claim is worded and
      I flag that openly rather than trading on it: it asserts that the
      protocol produced heartbeat-timed, awareness-dependent signals and that
      the experimenters interpret these as witnessing entanglement, and the
      case file records that the measurement itself — real signal, HEP-like
      timing, no correlate with conventional MRI contrast, disappearing at
      sleep onset — is not much disputed. The authors also replied
      specifically that the intermolecular multiple-quantum-coherence
      mechanism Warren invokes cannot produce their observations, and that
      exchange is unresolved rather than concluded against them. Two honest
      limits: the entanglement inference itself is not supported at this
      grade, and even full validation would implicate no microtubule, since
      the mediator is unidentified and the known quantum systems are proton
      spins of bulk water. Wiest's characterization of this as direct evidence
      of a macroscopic entangled state goes beyond what the record bears.
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is a null result against the theory's physics and I assess it at
      full strength, because a proponent case that discounted it would be
      worthless: Nature Physics, a world-class ultra-low-background facility,
      a signal derived quantitatively before the search, Diosi himself among
      the authors, published source data, and an exclusion stated in the
      authors' own words. The claim as worded is exactly what the experiment
      established and I dispute none of it. The strongest consideration in the
      theory's favor is scope, not doubt: what was tested is a specific
      stochastic master equation, the map from Penrose's geometric-instability
      argument to that equation is not unique, and the hbar/E_G lifetime
      scaling the theory actually asserts remains unmeasured — which is why
      the case reads ORCH-C030 as unresolved rather than refuted. I add the
      concession McQueen himself makes: escaping a bound by being less
      specified than the model tested is not a positive result, and the
      remaining parameter space is being narrowed rather than expanded by
      subsequent work.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: high
    reasoning: >-
      I grant this claim in full, and doing so costs the theory little. The
      Erdos disproof is anchored not on a company announcement but on Sawin's
      own arXiv paper, which states the result, names the mathematicians who
      checked it, and sharpens the exponent to n^1.014 while building on the
      construction; AlphaProof's IMO proofs were machine-checked in Lean with
      methodology peer-reviewed in Nature; and the 2025 gold was graded by IMO
      coordinators under contest conditions. The strongest opposing
      consideration to counting these against Penrose is the one his defenders
      press and that a DeepMind co-author of AlphaProof independently supplies:
      competition and conjecture-disproof results are execution inside an
      existing framework, not the abductive jump that formulates the premises,
      and the file's own record of an October 2025 collapse and a withdrawn
      Christmas 2025 claim shows this line has a documented false-positive
      history in novelty assessment. I also note the honest counter to that
      counter — an argument no achievement can touch has bought safety with
      content. Most importantly for this case, the claim's diagnosticity is
      low: it bears on the motivation rung only and leaves every microtubule,
      anesthesia, and collapse claim exactly where it stood.
