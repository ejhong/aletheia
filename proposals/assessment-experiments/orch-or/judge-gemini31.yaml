  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Experimental evidence directly links general anesthetics (etomidate, isoflurane, and a research anthracene) to altered microtubule exciton diffusion and localized tubulin binding. The support is provisional because the optical effect was modest (~13%) and currently lacks independent replication. Critically, the assay lacks specificity, as a convulsant (picrotoxin) produced a comparable effect.
  - claimId: ORCH-C012
    verdict: mixed
    confidence: high
    reasoning: >-
      Four microtubule-modulating drugs demonstrably alter isoflurane susceptibility, confirming that the microtubule target is causally relevant. However, the directional rule is explicitly contradicted: while acute epothilone B produced anesthetic resistance, independent tests of chronic epothilone D and a destabilizer (vinblastine) both increased sensitivity. This falsifies any simple generalization that stabilizing microtubules protects consciousness.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      Multiple independent methods, including fluorescence quenching and superradiance modeling, confirm that microtubules exhibit cooperative light-matter coupling and exciton diffusion exceeding passive structural models. This is ordinary, expected condensed-matter physics for ordered aromatic lattices. It provides firm evidence for collective behavior, but the strongest caution is that this does not imply or require macroscopic quantum computation.
