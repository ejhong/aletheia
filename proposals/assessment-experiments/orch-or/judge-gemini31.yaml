  synthesis: >-
    The Orch OR hypothesis is a conjunction of highly separable claims: that the brain harnesses non-computable physics, that gravity objectively collapses quantum superpositions, that microtubule arrays sustain these superpositions at biologically relevant scales, and that anesthetics disrupt this process. Assessing the case holistically reveals that while some lower-rung biological propositions have gained empirical grounding, the load-bearing connective tissue required to support the headline thesis remains entirely unmeasured.
    
    What is secure is that microtubules are not passive structural beams. Evidence clearly establishes that they exhibit collective electronic dynamics, exciton diffusion lengths exceeding passive predictions, and superradiant optical properties (ORCH-C013, ORCH-C020). Anesthetics demonstrably perturb these physical properties, and modifying microtubule stability alters behavioral susceptibility to anesthetics in animals. On the conventional side, strong causal evidence (GABA_A point mutations) grounds classical pharmacology, though it lacks an explanatory bridge to phenomenal experience. 
    
    What is contested is the specificity of these microtubule phenomena. The prediction that stabilizing microtubules protects consciousness is fundamentally mixed; rigorous independent testing found a stabilizer (epothilone D) and a destabilizer (vinblastine) moving sensitivity in the identical direction (ORCH-C024), pointing toward blunt cellular disruption rather than precision quantum tuning. Furthermore, the flagship photophysics assay showed a convulsant mimicking anesthetic effects. In physics, the Gran Sasso experiment rigorously ruled out the most natural stochastic completion of Penrose's collapse mechanism (ORCH-C031), forcing the theory to retreat to less-falsifiable heuristic forms.
    
    The entire verdict ultimately turns on ORCH-C010—the claim that physiological microtubules can sustain coherent or entangled quantum states for tens of milliseconds across large spatial scales. This remains a complete absence of data. Prior expectations of rapid decoherence in warm, wet biological environments strongly weigh against this, and thirty years of calculations arguing with one another have not produced a single direct measurement of the required coherence time. The gap between measured femtosecond/nanometer optical effects and the required millisecond macroscopic superpositions is immense. Until direct spectroscopic measurements of density-matrix observables in physiological conditions are achieved, the core mechanism bridging these disciplines is unverified, leaving the headline thesis unresolved.
