  loadBearing: [ORCH-C010, ORCH-C030, ORCH-C011]
  weakestLinks: [ORCH-C010, ORCH-C002, ORCH-C030]
  synthesis: >-
    Orch OR is a conjunction, not a pile of suggestive findings. The featured
    thesis needs (i) a gravitational objective-reduction law with lifetime
    set by τ ≈ ℏ/E_G, (ii) a coherent or entangled microtubule state lasting
    tens of milliseconds across many tubulins, and (iii) the identification
    of that collapse with a conscious moment — plus, in the form the case
    actually presses, (iv) a substantial anesthetic action on that state.
    Failure of any conjunct sinks the headline. The records do not test the
    conjunction, and they do not close the gap that would make the biology
    conjunct even eligible for a pass. That is why the case verdict is
    unresolved rather than weakly supported or contradicted: absence of a
    discriminating measurement is not a split decision, and it is not a
    polite way of saying the theory is probably false.

    What is secure sits on lower rungs and should be credited. Polymerized
    microtubules transport electronic excitation about one tubulin-dimer
    length, further than the Förster models the Kalra paper compared against,
    and two clinical anesthetics shorten that transport. A partly independent
    group finds fluorescence quantum yield rising with hierarchical tryptophan
    organization in the direction a collective-superradiance model predicts.
    Those observations make a passive-scaffolding picture of microtubules
    untenable (ORCH-C013, ORCH-C020, ORCH-C021). Emerson’s photolabeling
    places β-tubulin on an anesthetic pathway for at least one compound
    class. Acute epothilone B delays isoflurane loss of righting reflex in
    two rodent species inside one program. None of this is nothing.

    What is contested, and what the public argument keeps collapsing, is the
    inference from those observations to the headline. The measured transport
    is nanometres and femtoseconds-to-picoseconds; the theory needs
    milliseconds and many tubulins. No record specifies a density-matrix
    observable in physiological microtubules, measures its dephasing at
    37 °C, or shows anesthetics suppress it in proportion to clinical
    potency. The two decoherence numbers in the literature are calculations
    that disagree by seven to eight orders of magnitude, and even the
    proponents’ revised 10⁻⁵–10⁻⁴ s figure falls short of their own ~25 ms
    moment. Superradiant “tens of seconds” is a radiative lifetime of a
    modeled dark state, not a coherence time. The Bandyopadhyay
    triplet-of-triplet resonances remain unreplicated after a decade and are
    in any case a classical electromagnetic observation. Kerskens’s
    zero-quantum-coherence signal, even if it survived Warren’s NMR
    objection and an independent replication, does not implicate
    microtubules.

    The anesthesia arm is the most empirically active part of the case and
    the most internally damaged. Kalra’s own picrotoxin comparison — a
    convulsant affecting the same optical assay — undercuts specificity from
    inside the flagship experiment. Li et al., the only independent
    laboratory to run full concentration–response curves, found chronic
    epothilone D making mice more sensitive to isoflurane, and found the
    destabilizer vinblastine moving sensitivity the same way. That pattern
    refutes the public generalization that stabilizing microtubules protects
    consciousness; it is compatible with blunt cytoskeletal disruption. The
    conventional rival, meanwhile, has causal evidence this program does not:
    a single GABA_A β3(N265M) point mutation abolishes etomidate and
    propofol immobility and profoundly reduces their hypnotic effect. The
    same mutation barely touches volatiles, which is a real opening, not a
    closed door — but an opening is not a result. Xenon nuclear-spin isotope
    dependence is a genuine anomaly for a pharmacology with no quantum
    degrees of freedom, and it localizes nothing.

    The physics conjunct is in a worse specified position than a clean
    refutation. Donadi et al. at Gran Sasso found none of the spontaneous
    radiation a stochastic Diósi–Penrose model predicts, tightened the
    nuclear mass-density cutoff by three orders of magnitude, and, with
    Diósi among the authors, ruled out “the natural parameter-free version.”
    Derakhshani et al. then judged Orch OR “highly implausible” when built
    on that version. McQueen’s reply is correct that Penrose’s published
    criterion is a characteristic-lifetime relation, not that master
    equation, and so does not entail the radiation search. Escaping a bound
    by being less specified than the model that was killed is not evidence
    for the remainder. No experiment has tested ℏ/E_G scaling itself.

    The Gödelian motivation and the 2025–2026 AI-mathematics results are
    real and are almost diagnosticity-free for the thesis. Machines have
    produced Lean-verified Olympiad proofs and a disproof of a 1946 Erdős
    conjecture confirmed by an independent mathematician. That shrinks the
    residue of allegedly non-computable performance. It does not measure a
    microtubule, a collapse, or a conscious moment. Refuting Penrose’s
    argument entirely would leave every biological and physical claim in
    this file exactly where it stands; vindicating it would not select
    microtubules as the implementer.

    Steelman, both ways. The best case for taking Orch OR seriously now is
    that microtubules turned out to be optically and electrically collective,
    that anesthetics touch that physics, that a microtubule-stabilizing drug
    can shift an anesthetic endpoint, that a nuclear-spin isotope effect
    exists at all, and that the conventional account still has no principled
    story of why any of this activity is experienced. The best case against
    is that thirty years have produced no measurement of the central
    biological quantity, that the theory has never published the numerical
    thresholds that would let a measurement count as pass or fail, that the
    most natural collapse model is experimentally dead, that the anesthesia
    specificity and direction claims have already failed their first serious
    independent tests, and that a one-residue receptor mutation still
    explains more anesthetic behavior than the entire microtubule program.

    The verdict turns on ORCH-C010 and ORCH-C030. A prespecified coherence
    or entanglement witness in physiological microtubules at 37 °C would
    move the biological half immediately — a clean null at the required
    timescale nearly settles it negatively; a positive result at tens of
    milliseconds would be a biophysical landmark independent of
    consciousness. A mesoscopic superposition test of ℏ/E_G would decide
    the physics conjunct with no biology in the room. On the anesthesia
    track, a potency series with nonimmobilizers, picrotoxin, and
    hydrophobic non-anesthetic controls, or a tubulin anesthetic-pocket
    knock-in that co-segregates behavioral resistance with loss of the
    optical effect at unchanged GABA_A function, would give this program
    the kind of causal evidence it currently lacks. Until one of those
    exists, “warm and wet kills it” and “warm quantum biology saves it”
    remain calculations arguing with each other.

    Priors did some unavoidable work, and it should be labeled. Background
    decoherence physics — that warm, wet, ionically screened environments
    typically destroy electronic coherence on femtosecond-to-picosecond
    scales — is why an unmeasured millisecond microtubule coherence is not
    a neutral unknown; it is an unknown sitting many orders of magnitude
    above the default expectation. That prior informs the urgency of
    ORCH-C010 and the reading of thirty years without the measurement as a
    defect of the research program. It was not used to convert unresolved
    into contradicted. Consensus, outsider status, citation counts, and the
    prestige of critics or proponents were not treated as evidence.
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No attached record tests the conjunction of gravitational objective
      reduction, a microtubule state of the required duration and extent, and
      the identification of that collapse with a conscious moment. Kalra and
      Babcock measure collective electronic behavior at nanometre and
      femtosecond-to-picosecond scales; the animal anesthesia studies measure
      behavioral latencies with no quantum variable; Donadi et al. constrain
      a stochastic collapse model with no biology in it. The strongest
      opposing consideration is structural rather than empirical: a theory
      that absorbs each new photophysics result without committing in advance
      to a coherence time, coherence length, or entanglement structure is
      hard to score, but underspecification is not evidence against content,
      and the absence of a discriminating test is why the claim remains
      unresolved rather than contradicted.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The records establish the endpoints of a proposed chain, not the chain,
      and not the “quantum-coherent” qualifier the statement needs. Anesthetics
      reduce a measured microtubule excitation-diffusion length, Emerson et al.
      photolabeled β-tubulin with a research anesthetic and found stabilizers
      raising the immobilizing concentration in tadpoles, and acute epothilone B
      delays isoflurane LORR in rats and mice. Against that, the same Kalra
      experiment found picrotoxin — a convulsant — affecting the assay
      comparably, Li et al. found chronic epothilone D and the destabilizer
      vinblastine both increasing isoflurane sensitivity, and no study measured
      a validated microtubule coherence variable at all. The strongest opposing
      consideration is Jurd et al.: a single GABA_A β3(N265M) point mutation
      abolishes etomidate and propofol immobility and profoundly reduces their
      hypnotic effect, which is causal evidence of a quality this claim cannot
      match.
  - claimId: ORCH-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Assessed as worded, including the universal quantifiers “fully” and
      “without any quantum-coherent contribution.” Target-level causal evidence
      for intravenous agents is strong: β3(N265M) abolishes etomidate and
      propofol immobility and greatly reduces hypnosis, and β2/β3 manipulations
      fractionate sedation, hypnosis, amnesia, and immobility. That standard is
      unmatched by any microtubule experiment in the file. The same mutation
      only slightly reduced enflurane and halothane, and Jurd et al. themselves
      conclude that volatiles act via a broader target spectrum — which is the
      agents most Orch OR experiments use. The xenon nuclear-spin isotope
      effect is a further anomaly for a pharmacology with no quantum degrees of
      freedom. The strongest opposing consideration is therefore the claim’s
      own wording: accumulating successful conventional mechanisms does not
      prove a universally quantified negative, and the hard-problem gap (why
      any of this activity is experienced) is acknowledged rather than closed.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Donadi et al. searched for the spontaneous radiation a stochastic
      Diósi–Penrose model predicts, found none, tightened the nuclear
      mass-density cutoff by about three orders of magnitude, and ruled out
      “the natural parameter-free version of the Diósi–Penrose model.”
      Derakhshani et al. then judged Orch OR “highly implausible” when based
      on that simplest version. The claim as worded is Penrose’s
      characteristic-lifetime relation τ ≈ ℏ/E_G, which McQueen correctly
      notes is not a stochastic master equation and does not entail the
      radiation prediction. No experiment has tested ℏ/E_G scaling directly.
      The strongest opposing consideration is methodological: surviving an
      experimental bound by being less specified than the model that was
      killed converts a refuted precise theory into an untested vague one,
      which is not positive evidence for the remainder.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The attached records cannot settle whether human mathematical
      understanding is the execution of any knowably sound formal algorithm.
      AI systems have now produced correct, novel, research-level mathematics
      — a Lean-verified IMO silver-equivalent, an officially graded IMO gold,
      and a disproof of a 1946 Erdős conjecture confirmed by Sawin and other
      independent mathematicians — but producing true theorems was never what
      the claim denied. Zahavy’s ICML position paper, from inside the
      AlphaProof laboratory, argues the systems still lack abductive framework
      invention; that is an argument, not a measurement. The strongest
      opposing consideration is the pattern the editor’s own essay concedes:
      Penrose’s testable concrete examples have mostly settled against him,
      and the residue has retreated into the least testable territory, which
      may have purchased safety at the price of content.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: high
    reasoning: >-
      Not one record measures a coherence time, a dephasing time, or an
      entanglement witness in a microtubule. Kalra measured an excitation
      diffusion length of about 6.6 nm and explicitly modeled incoherent
      energy migration; Babcock measured fluorescence quantum yield against a
      collective-eigenstate model whose “tens of seconds” figure is a
      radiative lifetime, not a decoherence time. Tegmark calculated
      10⁻¹³–10⁻²⁰ s; Hagan, Hameroff and Tuszyński, modeling a different
      state, calculated 10⁻⁵–10⁻⁴ s — still one to two orders short of the
      tens of milliseconds this claim asserts. The strongest opposing
      consideration is prior-based and labeled as such: decoherence estimates
      for warm, wet, ionically screened environments generally come out very
      short, and thirty years of looking have produced no measurement in the
      required range. That prior was not used to relabel an absence as a
      contradiction.
  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Two independent experimental lines support the statement as worded.
      Kalra et al. measured etomidate and isoflurane reducing microtubule
      excitation diffusion length; Emerson et al., from a laboratory with no
      Orch OR commitment, identified β-tubulin as the photolabeled target of
      an anthracene anesthetic, mapped binding near the colchicine site, and
      showed microtubule stabilizers shifting a behavioral endpoint. Held to
      provisionally by a single unreplicated optical experiment, a research
      rather than clinical anesthetic in Emerson, a modest ~13% diffusion-length
      effect, and the picrotoxin comparison inside Kalra showing a convulsant
      affecting the same assay. The strongest opposing consideration is that
      specificity: if small hydrophobic molecules of opposite pharmacology
      all perturb the photophysics, the observation licenses further work
      without selecting an anesthetic mechanism.
  - claimId: ORCH-C012
    verdict: mixed
    confidence: high
    reasoning: >-
      The broad proposition is well supported and the directional
      generalization is contradicted, which is what mixed is for. Four
      microtubule-modulating drugs have moved isoflurane susceptibility in
      animals: acute epothilone B produced resistance in rats (+69 s, d = 1.9)
      and mice (+29 s, d = 0.8); chronic epothilone D produced a leftward
      EC50 shift (0.75% vs 0.97%); vinblastine, a destabilizer, shifted the
      same direction as the stabilizer (0.74% vs 0.98%); paclitaxel produced
      a small rightward shift. The two resistance results share a senior
      author; the contradictory results are independent and used full
      concentration–response curves. The strongest opposing consideration is
      that these drugs are blunt instruments — they alter transport,
      metabolism, cytoskeletal integrity, and, in the Li study, blood pH and
      CO₂ — so any behavioral effect has an ordinary physiological reading,
      and a stabilizer and a destabilizer moving sensitivity the same way is
      what general cellular disruption predicts.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Several methods converge on the modest claim that microtubules are not
      inert beams. Kalra measured electronic energy diffusion of about 6.6 nm
      in polymerized microtubules, reported that conventional Förster theory
      does not sufficiently explain it, and found the effect depended on
      polymerization state but not protofilament number. Babcock et al., from
      a substantially independent group, predicted collective tryptophan
      states across >10⁵ dipoles and measured quantum yield increasing with
      hierarchical organization as the model predicts. Bandyopadhyay-group
      electrical and resonance work points the same way on a different
      observable but is unreplicated. The strongest opposing consideration is
      interpretive: collective excitonic transport and cooperative
      fluorescence are ordinary condensed-matter physics of ordered aromatic
      lattices, Kalra includes Hameroff and Penrose as co-authors, and none
      of this requires coherent computation, entanglement, or collapse.
  - claimId: ORCH-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The measurement as worded is stated in the paper’s own abstract:
      electronic energy diffuses over 6.6 nm in microtubules, and etomidate
      and isoflurane reduce that diffusion. The work is peer-reviewed in a
      strong chemistry journal, quantitative, and internally controlled
      (polymerization mattered; 13- versus 14-protofilament architecture did
      not). Diffusion length is inferred from concentration-dependent
      quenching rather than directly imaged, the specific reduced values
      (~5.6 and ~5.8 nm) are reported via the deep-research reading of the
      paper body rather than verified against it here, and no independent
      laboratory has replicated the result. The strongest opposing
      consideration is independence: Hameroff, Penrose, Craddock, and
      Tuszyński are co-authors, so the most important experiment for the
      theory is a collaboration including its authors rather than an outside
      test.
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Babcock et al. predict strongly superradiant states among organized
      tryptophan networks and report a fluorescence-quantum-yield enhancement
      matching the model across geometric regimes, persisting with disorder
      at thermal equilibrium. The group is substantially independent of the
      Hameroff–Penrose line. Held to provisionally because the paper is
      predominantly theoretical, quantum yield is an indirect and
      multi-mechanism witness of collective states, and the arresting “tens
      of seconds” figure is a modeled radiative lifetime of a dark
      eigenstate, not a dephasing time. The strongest opposing consideration
      is that Dicke-type collective emission has been engineered in ordered
      non-neural scaffolds (for example dye-decorated virus capsids) and is
      therefore evidence of geometric regularity rather than of a
      consciousness mechanism.
  - claimId: ORCH-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The published claim is specific — a self-similar triplet-of-triplet
      resonance pattern in tubulin, microtubules, and an axon initial
      segment — but no independent protocol-level replication has been
      identified, the entire line traces to one laboratory lineage, and the
      venue is considerably lower-profile than secondary citations implied.
      Resonance structure is a classical electromagnetic observable, not a
      coherence or entanglement witness, so even a clean replication would
      not establish the scale-bridging quantum mechanism Orch OR needs. The
      strongest opposing consideration is the replication vacuum itself:
      thirteen years after the group’s first striking microtubule results,
      including an unreplicated 2013 claim of 100-microsecond warm
      coherence, no outside laboratory has reproduced the distinctive
      signatures.
  - claimId: ORCH-C023
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Both Wellesley experiments are peer-reviewed, used blinded LORR
      measurement, controlled for isoflurane tolerance, and found the same
      direction across species, with large standardized effects in the rat
      study (d = 1.9; +69 s) and a smaller one in mice (d = 0.8; +29 s).
      Against a stronger label: the rat analysis is N = 8, both studies used
      males only, dosing was not a counterbalanced crossover, both used
      latency at a single high concentration rather than a
      concentration–response curve, and they share a senior author, so this
      is within-program replication of direction. The strongest opposing
      consideration is Li et al. (ORCH-C024): an independent laboratory
      measuring the better-specified quantity found the opposite direction
      with a related stabilizer, which confines this result to a particular
      compound and regimen rather than a general microtubule-stability rule.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: high
    reasoning: >-
      The measurement as worded is tightly reported: randomized, blinded,
      independent of the Wellesley program, full incremental LORR
      concentration–response curves, four agents including a destabilizer and
      an opioid control, and narrow non-overlapping EC50 confidence intervals
      (epothilone D 0.75[0.73, 0.77] vs saline 0.97[0.96, 0.98]; vinblastine
      0.74[0.73, 0.75] vs 0.98[0.97, 0.99]). Author-acknowledged limits —
      imperfect saline vehicle, LORR rather than MAC, isoflurane only,
      outbred CD1 mice, and documented blood pH and CO₂ changes — weaken
      mechanistic interpretation without touching the recorded shifts. The
      strongest opposing consideration is genuine regimen and compound
      difference from the Wellesley acute epothilone-B work, plus Emerson et
      al. finding epothilone D producing resistance in tadpoles, so the
      compound’s direction is not consistent across preparations either.
  - claimId: ORCH-C025
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Eighty mice randomized across four xenon isotopes in the leading
      anesthesiology journal produced a large, orderly potency gap: spin-bearing
      xenon-129 and xenon-131 required roughly 40–50% higher concentrations
      than spin-zero xenon-132 and xenon-134, with calculated polarizability
      identical at 3.60 Å, closing the obvious classical explanation. Held to
      provisionally by single-study status and the authors’ own disclosure
      that xenon’s low potency required a 0.50% isoflurane background, so the
      primary comparison is not on xenon alone. The strongest opposing
      consideration is localization: nuclear spin implicates some
      spin-sensitive molecular process anywhere in the nervous system,
      radical-pair chemistry is an established alternative class, and nothing
      in the result points at microtubules.
  - claimId: ORCH-C026
    verdict: mixed
    confidence: moderate
    reasoning: >-
      A real heartbeat-timed signal was recorded in living human brains with
      a zero-quantum-coherence protocol, without correlate in conventional
      MRI contrast, and with a reported dependence on conscious awareness.
      The entanglement-witness interpretation is disputed in the same
      journal: Warren argues the paper “provides no evidence to justify this
      claim” and shows only that living tissue is complex and
      multicompartmental; the authors reply that intermolecular
      multiple-quantum coherence cannot produce their observations. No
      independent exact replication exists, the mediator is unidentified, and
      microtubules are not implicated. The strongest opposing consideration
      is methodological: entanglement witnesses in heterogeneous living
      tissue require affirmative exclusion of classical multi-compartment
      mimics, which has not been done in engineered phantoms with known
      ground truth.
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: >-
      The experimental finding is stated in the authors’ own words in Nature
      Physics: an ultra-low-background germanium search at Gran Sasso found
      none of the predicted spontaneous radiation, set a lower bound on the
      effective nuclear mass-density size about three orders of magnitude
      larger than previous bounds, and “rules out the natural parameter-free
      version of the Diósi–Penrose model.” Diósi is a co-author, the
      predicted signal was quantitatively derived before the search, and
      source data are published. The strongest opposing consideration is
      scope, not quality: the experiment tests a particular stochastic master
      equation, the map from Penrose’s geometric argument to that equation is
      not unique, and later non-Markovian or non-local variants have been
      proposed specifically to evade the radiation prediction.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: high
    reasoning: >-
      The mathematics is independently checkable. Sawin’s arXiv paper states
      that an OpenAI team disproved Erdős’s unit-distance conjecture and
      improves the exponent to n^1.014; outside mathematicians checked the
      original construction. AlphaProof’s IMO-2024 solutions were
      Lean-verified and the methodology peer-reviewed in Nature; Gemini Deep
      Think’s 2025 gold-standard 35/42 was officially graded by IMO
      coordinators under contest conditions. A documented false-positive
      history on other AI-Erdős claims (October 2025 literature collisions;
      a Christmas 2025 withdrawal after a 1977 Erdős resolution surfaced)
      requires checking novelty, and does not touch these verified results.
      The strongest opposing consideration is conceptual rather than factual:
      competition problems and a novel construction inside an existing
      framework are, on Zahavy’s own taxonomy, mechanized deduction plus
      search, not the abductive framework-invention the Gödelian argument
      says is at issue.
