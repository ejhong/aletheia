caseAssessment:
  verdict: unresolved
  loadBearing: [ORCH-C010, ORCH-C030, ORCH-C002]
  weakestLinks: [ORCH-C010, ORCH-C030, ORCH-C002, ORCH-C012]
  synthesis: >-
    The featured thesis is a conjunction, and the case file contains no record
    that tests the conjunction. Every experiment here bears on at most one
    conjunct, and the two that matter most are in different states of
    disrepair. The physics conjunct (ORCH-C030) has never been tested in the
    form Penrose states it; the one high-quality experiment addressed to it
    (ORCH-C031, Gran Sasso) is a clean null that excluded the natural
    parameter-free stochastic completion, and the theory survives that bound
    only by being less specified than the model that was tested. The biology
    conjunct (ORCH-C010) has never been measured at all. That second absence is
    the pivot of the whole case, and the most important quantitative fact in the
    file is one that both sides tend to skip: neither of the two existing
    decoherence calculations reaches the number the claim requires. Tegmark's
    figure is ten to seventeen orders of magnitude short; the proponents' own
    revised figure, computed by the theory's principals for the state the theory
    actually proposes, is still one to two orders short of the ~25 ms conscious
    moment. So the state of ORCH-C010 is not a standoff between a confirming and
    a refuting calculation — it is an absence of measurement plus a uniform
    negative lean from every calculation that exists, including the friendly
    one.
    What is secure is a narrow and genuine band of results. Microtubules move
    electronic excitation over about one tubulin dimer in a way Förster theory
    does not fully predict; organized tryptophan networks show collective
    optical behavior; anesthetics bind β-tubulin and modestly perturb the
    optical signal; microtubule-modulating drugs shift anesthetic sensitivity in
    live animals. Each of those is worth knowing and none of them is evidence
    for coherent computation. What is contested is the anesthesia arm's
    specificity and direction, and here the case is honest in a way public
    summaries are not: a convulsant perturbs the flagship assay comparably to
    the anesthetics, and the single most methodologically complete animal study
    — randomized, blinded, full concentration–response curves, independent of
    the proponent program — found stabilization increasing anesthetic
    sensitivity, with a destabilizer moving it the same way. A stabilizer and a
    destabilizer agreeing is the signature of a nonspecific variable.
    The verdict turns on ORCH-C010, and "unresolved" should not be read as 50/50.
    The conjunctive structure is asymmetric: confirmation needs every rung,
    refutation needs one, so the honest expectation is negative resolution well
    before positive. Two things would move it fast: a prespecified coherence or
    entanglement witness measured in physiological microtubules at 37 °C, and a
    published numerical requirement from the theory so that such a measurement
    could count as pass or fail. The absence of the second is why the first has
    not been decisive for thirty years — each photophysics result is absorbed
    rather than scored. Priors did unavoidable work in two places, and I flag
    them: my reading of ORCH-C003 leans on general decoherence physics to keep
    the classical account plausible where the records do not cover volatiles,
    and my reading of ORCH-C025 leans on background knowledge of spin chemistry
    to treat a single unreplicated isotope effect as surprising but not
    impossible. Nowhere did I let the field's mainstream verdict substitute for
    the records, and nowhere did outsider status count against a claim.
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No record in the file tests the conjunction of gravitational collapse,
      a sufficient microtubule quantum state, and the identification of
      collapse with experience; each experiment reaches at most one conjunct.
      The load-bearing middle term (ORCH-C010) is unmeasured in either
      direction, so this is an absence of a discriminating test rather than a
      balance of confirming and refuting results. I record a negative lean
      rather than a neutral one, because the two quantitative facts that do
      exist — the ~6.6 nm, femtosecond-to-picosecond transport scale and the
      failure of even proponent decoherence calculations to reach the required
      millisecond range — both run against the thesis, and the most natural
      completion of its physics is experimentally excluded. The strongest
      opposing consideration to calling it refuted is that none of that is a
      measurement of the state the theory proposes, and a theory can be
      unmeasured without being false. The strongest structural objection, which
      needs no prior, is that the theory has never published the coherence
      time, coherence length, or entanglement structure that would let any
      measurement count as failure.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The records establish the endpoints of the proposed chain and not the
      chain: anesthetics perturb a measured microtubule optical property
      (ORCH-C020), tubulin lies on an anesthetic pathway for one compound class
      (Emerson 2013), and acute epothilone B shifts anesthetic latency
      (ORCH-C023). The "quantum-coherent" qualifier that does the actual work
      in this statement is entirely unmeasured — no study in the file records a
      validated microtubule coherence variable. Against it sit two specific
      hits rather than general skepticism: picrotoxin, a convulsant, perturbs
      the same assay comparably, which is a direct strike on the specificity
      the claim needs; and an independent laboratory found chronic
      stabilization moving sensitivity the wrong way. The strongest opposing
      consideration is the volatile-agent gap in the conventional account —
      Jurd et al.'s own conclusion that volatiles act through a broader target
      spectrum leaves a genuine opening, and volatiles are the agents most of
      this work uses. That opening is real but unexploited, so the claim as
      worded remains weakly supported rather than merely unresolved.
  - claimId: ORCH-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      I assess this below the label the case file itself carries, because the
      claim as worded contains a universal negative that the records do not
      reach. The core mechanistic content is genuinely strong: the β3(N265M)
      point mutation abolishes etomidate and propofol immobility and largely
      removes their hypnotic effect, which is target-level causal evidence no
      microtubule study here approaches. But the same mutation barely touches
      enflurane and halothane, so the result does not transfer to volatiles;
      the TREK-1 precedent shows genetic anesthetic-target findings can
      dissolve on replication; and ORCH-C025, if it survives, is a datum
      against "without any quantum-coherent contribution." A prior does
      unavoidable work here and I flag it: general decoherence physics makes a
      fully classical account the default expectation, and admitting that prior
      would raise this to well supported. On the records alone, the mechanism
      is well evidenced for intravenous agents and the universal quantifier is
      not established. The strongest opposing consideration is that the claim
      cannot be proved by accumulating successful conventional explanations at
      all — only defeated — so its evidential ceiling is structurally low.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: high
    reasoning: >-
      Not one record measures the asserted scaling. Gran Sasso tested a
      stochastic Diósi–Penrose completion, found no spontaneous radiation, and
      excluded the natural parameter-free version in the authors' own words —
      but Penrose's published criterion is a characteristic-lifetime relation
      that does not entail the radiation prediction, so the exclusion does not
      reach the claim as stated. That leaves one natural implementation
      experimentally dead and the underlying relation untested. The strongest
      opposing consideration cuts against the theory rather than for it, and
      McQueen raises it himself: escaping a bound by occupying a less specified
      version of the theory is not positive evidence for that version, and it
      converts a refuted precise model into an untested vague one. I considered
      presently_untestable, since the mesoscopic superposition regime that
      would measure the relation is beyond current capability, but the
      experiment is designed and approaching feasibility, so unresolved is the
      accurate label.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The attached records are not the kind that can settle this claim. The
      AI-mathematics results establish that machines produce correct, novel,
      research-level mathematics, but the claim concerns whether a knowably
      sound algorithm captures mathematical understanding, and nobody ever held
      that algorithms cannot generate true theorems — so the records address an
      adjacent proposition. The qualifying record from DeepMind is an argument
      in a position-paper track, and arguments do not raise credibility. The
      technical dispute in proof theory over whether the disputed steps survive
      restriction to arithmetic formulas is live rather than resolved. The
      strongest opposing consideration is the one the case editor presses
      against his own sympathies: every concrete testable example Penrose
      offered has largely settled against him, and the "escalator, not the
      steps" reformulation immunizes the claim against exactly the evidence
      that keeps arriving. That pattern is close enough to
      presently_untestable that I flag it, but the formal-logic question
      remains decidable in principle, so I stop at unresolved.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: high
    reasoning: >-
      This is the load-bearing gap and it is an absence, not a conflict: no
      record in the file measures a coherence time, a dephasing time, or an
      entanglement witness in a microtubule. The two positive photophysics
      results measure adjacent quantities — an excitation diffusion length
      modeled with an explicit incoherent-migration comparison, and a bulk
      fluorescence quantum yield whose "tens of seconds" figure is a radiative
      lifetime of a modeled dark state, not a survival time against dephasing.
      What pushes my reading negative rather than neutral is that the only two
      quantitative estimates in existence both fall short of what this claim
      asserts: Tegmark's by ten to seventeen orders of magnitude, and Hagan et
      al.'s — computed by the theory's own principals for the state the theory
      actually proposes — still by one to two. The vocabulary offers no token
      for "unmeasured but leaning negative," so I record unresolved with that
      lean stated explicitly. The strongest opposing consideration is genuine:
      Hagan et al. are right that Tegmark modeled a different physical state,
      so the canonical refutation was never a refutation, and both figures are
      calculations rather than measurements of a living microtubule.
  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Two partly independent experimental lines support the statement as
      worded. Kalra et al. measured etomidate and isoflurane reducing
      microtubule excitation diffusion length, and Emerson et al. — an
      anesthesia-mechanisms laboratory with no Orch OR commitment —
      photolabeled β-tubulin, mapped binding near the colchicine site, and
      showed stabilizers shifting the concentration needed for a behavioral
      effect. The binding half of the claim is the better evidenced; the
      "alters electronic and optical behavior" half rests on a single
      unreplicated experiment with two agents, a ~13% effect, and the theory's
      authors among the co-authors. The strongest opposing consideration is
      specificity, and it comes from inside the flagship experiment rather than
      from critics: picrotoxin, a convulsant, perturbed the same assay
      comparably, which is what one expects if the assay measures
      perturbability of microtubule photophysics by small hydrophobic
      molecules generally. That does not undercut the claim as worded, which
      makes no specificity assertion, but it caps how far the claim can be
      carried.
  - claimId: ORCH-C012
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Mixed is substantive here rather than a hedge, because the observation
      and the causal attribution come apart cleanly. Four microtubule-modulating
      drugs demonstrably shift isoflurane susceptibility in animals, several
      with narrow non-overlapping confidence intervals, so the bare
      proposition that these manipulations change anesthetic susceptibility is
      well evidenced. But the claim names microtubule stability as the
      manipulated variable, and the directions refuse to cohere around it:
      acute epothilone B produced resistance, chronic epothilone D produced
      markedly greater sensitivity, and the destabilizer vinblastine moved
      sensitivity the same way as the stabilizer. No stability account predicts
      that last pattern. The strongest opposing consideration is that the
      regimens and compounds genuinely differ — acute versus two weeks of
      dosing, epothilone B versus D — so the discrepancy may be real
      pharmacology rather than a nonspecific artifact. But each reconciliation
      offered subtracts predictive content, and the simplest reading of a
      stabilizer and a destabilizer agreeing is that the operative variable is
      general cellular disruption.
  - claimId: ORCH-C013
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      I assess this one notch below the case file's own label. The claim is
      modestly worded and probably true, and two peer-reviewed lines point the
      same way: Kalra's ~6.6 nm diffusion reported as insufficiently explained
      by Förster theory, with polymerization-dependence and
      protofilament-independence arguing against artifact, and Babcock's
      quantum-yield trend matching a collective-eigenstate model from a partly
      independent group. What holds it back from well supported is replication
      status rather than direction: the central measurement is unreplicated and
      includes the theory's authors, Babcock's experimental component is an
      indirect bulk measurement of a predominantly theoretical paper, and the
      Bandyopadhyay line is single-lineage and unreplicated. A prior does work
      here and I flag it in the supporting direction: collective excitonic
      behavior in ordered aromatic arrays is ordinary condensed-matter physics,
      which is exactly the strongest opposing consideration — the observations
      require nothing beyond conventional quantum chemistry of a regular
      lattice, so establishing them says almost nothing about coherent
      computation.
  - claimId: ORCH-C020
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Both halves of the statement are in the paper's own abstract, published
      open access in a strong general-chemistry journal, with internal
      structure-dependence controls. I hold it to provisionally rather than
      well supported on a standard I apply uniformly across this case: a single
      unreplicated measurement of an inferred quantity does not reach the
      higher label. The diffusion length is derived from concentration-dependent
      quenching rather than directly imaged, no outside laboratory has
      reproduced it, and the specific reduced values are relayed from the paper
      body rather than verified in this import. The strongest opposing
      consideration is independence rather than quality: Hameroff, Penrose,
      Craddock and Tuszyński are co-authors, so the most important experiment
      for the theory is a collaboration including the theory's authors rather
      than an outside test of it. That is a real qualification on weight, not
      an ad hominem, and it is precisely what an independent replication would
      remove.
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The measured quantum-yield trend matches the model's prediction across
      geometric regimes, it is peer-reviewed, and the group is substantially
      independent of the Hameroff–Penrose line, which strengthens the record.
      The claim is carefully worded as a directional agreement between
      measurement and model, and that is what was reported. It stays at
      provisionally because the paper is predominantly theoretical with a
      confirming bulk-fluorescence measurement, and quantum yield is an
      indirect witness — several mechanisms can raise it, so the collective
      interpretation is model-dependent. The strongest opposing consideration
      is that Dicke-type collective emission has been engineered in ordered
      protein scaffolds with nothing to do with cognition, and lost when the
      scaffold is disordered, which suggests geometric regularity rather than
      anything neural is doing the work.
  - claimId: ORCH-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      A specific measurement is published, no contrary measurement exists, and
      no independent protocol-level replication has appeared in thirteen years
      — the finding traces to a single laboratory lineage using bespoke
      apparatus across an unusually wide frequency range, and the earlier
      companion work from the same group is not independent corroboration. I
      lean this below neutral rather than treating non-replication as neutral,
      because the incentive to replicate has been high: this is among the most
      cited results in a field actively looking for exactly such a signal, and
      the contrast the case draws with the 2007 photosynthetic coherence
      results, replicated many times over, is apt. The strongest opposing
      consideration is that nobody appears to have tried and failed —
      unattempted replication is weaker evidence than failed replication, and
      bespoke apparatus raises the cost of attempting. Even a successful
      replication would establish a classical electromagnetic observation, not
      a quantum witness.
  - claimId: ORCH-C023
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Both experiments are peer-reviewed, both used blinded loss-of-righting
      measurement, both controlled for tolerance from repeated isoflurane
      exposure, and the standardized effects are large to moderate with the
      direction reproducing across species. That is a real behavioral result
      and it is assessed as worded, independent of what it is offered to
      support. It does not reach well supported because the rat sample is
      N = 8, males only, the design was not a counterbalanced crossover, and
      the two studies share a senior author and research program — a
      within-program replication of direction, not independent confirmation.
      The authors themselves concede the 29 s mouse effect is not large against
      inter-animal variability. The strongest opposing consideration is that a
      latency shift at a single high concentration does not establish a shift
      in the concentration–response curve, which is exactly the quantity the
      independent study measured and found running the other way.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This gets the strongest label in the anesthesia theme on methodological
      grounds and not because of which side it favors: independent of the
      proponent program, randomized, blinded, four agents including a
      destabilizer and an opioid control, full incremental
      concentration–response curves rather than latency at one concentration,
      and narrow non-overlapping confidence intervals. The internal comparison
      structure is what makes it informative — the vinblastine result is a
      control the study did not have to run and which no stability account
      predicts. Confidence is moderate rather than high because it is a single
      study and the authors disclose that saline was an imperfect vehicle for
      poorly soluble compounds, which could in principle drive shared shifts.
      The strongest opposing consideration is that the regimen and compound
      both differ from the acute epothilone-B work, and Emerson et al. found
      epothilone D producing resistance in tadpoles — so this constrains the
      general "stabilization protects consciousness" generalization rather than
      directly refuting the acute finding.
  - claimId: ORCH-C025
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Published in the leading anesthesiology journal with 80 mice randomized
      across four isotope groups, a large and orderly 40–50% potency gap, and
      calculated polarizability explicitly identical across the four, which
      closes the obvious classical explanation. An internal check supports the
      spin reading over a trivial mass effect: the potency ordering is not
      monotonic in isotope mass, since the two spin-bearing isotopes are the
      lighter pair. It stays provisional because it is a single unreplicated
      study and the authors disclose that xenon's low potency forced the
      primary comparison against a 0.50% isoflurane background, so the isotope
      effect is not measured on xenon alone in the main assay. A prior does
      work here and I flag it: spin-dependent chemistry is well established
      elsewhere in biology, which keeps the result plausible, but the same
      background is the strongest opposing consideration for this case — any
      spin-sensitive molecular process anywhere would produce this, and nothing
      in the experiment implicates microtubules.
  - claimId: ORCH-C026
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The split is real and falls between the measurement and its
      interpretation, which is why mixed is substantive here. A signal was
      recorded in living human brains with heartbeat-evoked-potential-like
      timing, no correlate with any classical MRI contrast, and a dependence on
      conscious awareness — unusual findings for an NMR experiment, and not
      much disputed as observations. The entanglement-witness interpretation is
      rejected bluntly by a leading NMR methodologist in the same journal, the
      authors replied specifically on the mechanism he invoked, the exchange is
      unresolved on the public record, and no independent replication exists. I
      have no basis to adjudicate the technical NMR dispute and do not pretend
      to. The strongest opposing consideration to any positive reading is
      Warren's, and it is well aimed: heterogeneous living tissue is exactly
      the regime where classical multi-compartment effects can imitate exotic
      ones, and an entanglement witness must exclude those affirmatively rather
      than by elimination.
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: >-
      Methodologically this is the strongest experiment in the case: a
      dedicated ultra-low-background germanium search at Gran Sasso, with the
      predicted signal quantitatively derived before the search, the model's
      co-originator among the authors, published in Nature Physics with source
      data, and the exclusion stated precisely in the authors' own words. It is
      assessed on that basis irrespective of which side it favors, and a null
      with a prespecified quantitative prediction is unusually informative. The
      claim as worded confines itself to what was excluded — the natural
      parameter-free version of the Diósi–Penrose model — and does not
      overreach. The strongest opposing consideration is one of scope rather
      than quality: the map from Penrose's geometric-instability argument to
      the particular stochastic master equation tested is not unique, so this
      result cannot be read as excluding every gravity-related collapse theory,
      and non-Markovian variants designed to evade the radiation prediction
      have been proposed.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is unusually well anchored for a claim this recent, because the
      mathematics is independently checkable and the case does not rest it on
      any company's announcement. The Erdős result is attested by an
      unaffiliated working mathematician who states it in his own arXiv paper,
      builds on the construction, and sharpens the exponent, with named outside
      mathematicians having verified correctness. The IMO evidence is firmer
      still: proofs machine-checked in Lean with methodology peer-reviewed in
      Nature, and a subsequent gold-standard performance graded by IMO
      coordinators under contest conditions. The documented false-positive
      history in this evidence line is a genuine caveat, but its failure mode
      was inadequate literature search rather than incorrect mathematics, and
      it does not touch the independently checked unit-distance result. The
      strongest opposing consideration is not about the facts but their reach:
      competition problems are solvable within an existing framework by
      construction, and the claim's relevance to this case runs only through
      ORCH-C040, the motivation rung, leaving every microtubule, anesthesia,
      and collapse claim exactly where it stood.
