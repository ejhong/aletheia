humanReviewed: false
role: check
caseAssessment:
  verdict: mixed
  loadBearing: [TIK-C005, TIK-C004, TIK-C007, TIK-C012]
  weakestLinks: [TIK-C012, TIK-C006, TIK-C004]
  synthesis: >-
    The case ladder divides cleanly into three zones. The background and capability rungs are genuinely
    supported: direct archaeochemistry (Tel Arad altar residues, Es Càrritx hair alkaloids, the Bes vessel)
    establishes that psychoactive ritual technology existed in the ancient Mediterranean and Near East, and
    the 2026 hydrolysis experiment shows wood-ash lye can convert toxic ergopeptides into LSA/iso-LSA under
    plausibly ancient conditions — retiring the "ergot necessarily means ergotism" objection at the level of
    chemistry, though only at the level of possibility. The attribution rung is where support thins: the
    kykeon-ergot claim (TIK-C007) rests on a distant, single, unreplicated, and — in this ledger — unverified
    Iberian analog (Mas Castellar), an untested absence at Eleusis itself, and a mechanism executed in a modern
    laboratory by the hypothesis's own network; against it stand the canonical recipe's silence and Clinton's
    audited-accounts argument, which converts an argument from silence into a specific, published silence. The
    transmission rung fails: the earliest detailed Eucharistic witnesses (Didache, Justin) show Second-Temple
    Jewish meal practice with ordinary elements, senior specialists and even the movement's own sympathetic
    reviewer reject the continuity thesis, and the proponent concedes the Last Supper claim, the Dionysian
    premise ("a big if"), and the transmission gap ("Where are the drugs?"). The verdict is therefore mixed as
    a substantive structural finding, not a hedge: well-supported lower rungs feed a weakly supported Greek
    attribution and a contradicted Christian transmission, and the strong public form — the conjunction the
    book sold — fails because one conjunct is contradicted by the primary documents and abandoned by its own
    author. Sensitivity: removing TIK-E008 (the 2026 experiment) would drop TIK-C005 from well_supported and
    leave the pro case resting on analogy plus one unverified find; the case verdict survives as mixed only
    because the contradicted Christian rungs are independent of it — but the Eleusinian half would then hang
    by the single Mas Castellar thread. Interest-network effects run in both directions (proponent-funded
    programs; originator co-authorship on the feasibility paper), and naive source-counting would overstate
    independence on both sides.
  steelman: >-
    The Hymn itself marks the drink, not the drama, as the sacrament ("to observe the sacrament"), Eleusis ran
    for roughly two millennia promising transformative experience to mass initiates with remarkable stability,
    and no record in this case demonstrates that fasting, procession, secrecy, and collective emotion can
    reliably produce experiences of the reported intensity — the ritual-sufficiency model is asserted, not
    evidenced, and the adversarial test that would discharge it (TIK-R007) has never been run. Combined with
    the demonstrated feasibility of ergot-to-LSA conversion using period technology and an ergot-consumption
    find in a Demeter/Kore-linked sanctuary, a proponent can rightly say: the pharmacological reading is the
    only account with a demonstrated mechanism, and every objection at Eleusis itself rests on an untested
    absence that the authorities have never permitted anyone to close.
claimAssessments:
  - claimId: TIK-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Direct chemistry anchors this rung: cannabis residues on the Arad shrine altars (ritual placement
      implied by context), alkaloids measured in human hair from the Es Càrritx cult cave (consumption, not
      proximity), and a multi-plant preparation in the Bes vessel. The strongest opposing consideration is
      purpose inference: none of these finds is at a Greek mystery site, the Bes vessel's provenance rests on
      typology rather than excavation, and "deliberate" is direct only for the Arad burning. Still, the claim
      as stated — deliberate ritual psychoactive use somewhere in the ancient Mediterranean and Near East —
      is carried by multiple independent finds.
  - claimId: TIK-C002
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The only direct record is a proponent's verbatim-quoted summary of Dioscorides' drug-wine recipes in a
      friendly venue (TIK-E005); no primary locator has been pulled, which the ledger itself flags as
      outstanding philological work. General background makes the claim historically unsurprising, so this
      verdict partly leans on priors rather than the record. The key discipline is the record's own: medical
      drug-wine recipes must not be silently reclassified as cultic sacraments.
  - claimId: TIK-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      The primary text was read directly and the quote verified: meal, water, and soft mint, with wine
      refused. The claim is about what the text says, and the text is in hand. The strongest opposing
      consideration is minor: the Hymn is a mythological aition rather than a liturgical manual, and "barley"
      is supplied by broader kykeon usage rather than the quoted lines — but the "names no psychoactive
      ingredient" half is exactly what the verified passage shows.
  - claimId: TIK-C004
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The claim is plausible and specifically reported, but this ledger has seen the primary 2002 publication
      only through the 2026 paper's citations; the source record is marked unverified, never replicated, and
      carries a documented source-drift hazard (identified ergot fragments hardened downstream into "alkaloids
      detected"). The strongest opposing consideration is that the find may be materially weaker than its
      retellings — precisely what retrieval item TIK-R004 exists to check. Provisional support with low
      confidence is the honest grade.
  - claimId: TIK-C009
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The Johannine-Dionysian parallel is a genuine scholarly position with named supporters (Nock, MacDonald)
      rather than the book's invention, and the Cana/vine motifs are real textual features. The strongest
      opposing consideration is that "deliberately engages" is a strong intentional claim: the record itself
    notes that Jewish messianic-abundance readings exist in the same literature and must be weighted
      symmetrically, and no record here carries those readings on their own terms. An interpretive claim with
      live alternatives gets provisional support only.
  - claimId: TIK-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 2026 experiment was read in full: 48 runs, complete disappearance of all six monitored ergopeptides
      at the highest-pH condition, and quantified LSA/iso-LSA yields per gram. This is a direct measurement of
      the claimed transformation, peer-reviewed with published methods. The strongest opposing considerations
      are the interested-network authorship (Ruck and entheogen-center affiliates co-authored, with the 2000
      proposal sharing personnel) and the absence of independent replication — hence moderate rather than high
      confidence, with TIK-R002 the designated check.
  - claimId: TIK-C006
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim as stated — reliably producing a profound, largely positive visionary experience — outruns the
      evidence: the LSA systematic review documents psychoactivity and hallucinations but also prominent
      nausea, autonomic effects, anxiety, occasional severe events, and substantially lower potency than LSD,
      and the reconstructed preparation has never been pharmacologically profiled. The strongest opposing
      consideration is that the human LSA literature is dominated by morning-glory exposures and may not
      transfer to the lye-processed matrix. Support stops at "can occasion hallucinations"; "reliably and
      largely positive" is unsupported.
  - claimId: TIK-C008
    verdict: unresolved
    confidence: low
    reasoning: >-
      This is an exclusive causal claim — ritual factors are insufficient — and no record in the case tests it.
      Griffiths 2006 shows pharmacological induction of mystical experience is real, but that establishes
      sufficiency of drugs by analogy, not insufficiency of ritual; the mainstream model (Burkert, background
      only) asserts the opposite with equal lack of measurement. The strongest consideration in each direction
      is the same absence: the adversarial test (TIK-R007) has never been run, so the necessity claim is
      genuinely open, not merely contested.
  - claimId: TIK-C007
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The affirmative case is real but indirect: demonstrated chemical feasibility, one unverified
      cult-context ergot find a thousand kilometers from Eleusis, and an untested absence at the sanctuary
      itself. Against it stand the canonical recipe's silence, the absence of any attested alkaline-processing
      technology, and Clinton's audited-accounts testimony, which converts silence into a specific published
      silence about the sanctuary's economy. The strongest opposing consideration is that a legally secret rite
      could plausibly leave no documentary trace and use unpurchased ergot — which is why this is weakly
      supported rather than contradicted — but the affirmative burden sits entirely with future chemistry.
  - claimId: TIK-C010
    verdict: unresolved
    confidence: low
    reasoning: >-
      No positive evidence record bears on this claim: the closest text (Irenaeus on Marcus) is hostile
      heresiology describing stage magic and philter accusations, which the ledger itself rules non-evidential
      for what communities actually consumed, and the field's central archaeochemist calls the supporting
      evidence "extremely weak to nonexistent." The strongest opposing consideration is that the "some
      community, somewhere" formulation is nearly unfalsifiable by normative texts and is genuinely testable
      by residue survey (TIK-R005) — untested, not refuted, but currently running on nothing.
  - claimId: TIK-C011
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The earliest detailed liturgical witnesses in the record — Justin's bread and wine-with-water and the
      Didache's berakah-form prayers over cup and bread — uniformly show ordinary elements, and the claim as
      stated covers "the earliest documented Christian communities," which is precisely what these texts
      document. The proponent himself declines to defend the Last Supper claim, and McGovern calls the
      Eucharist thesis a "fanciful tale" with no basis in Christian tradition. The strongest opposing
      consideration is that normative texts constrain the sanctioned mainstream rite rather than every
      community — which is why the confidence is moderate rather than high, and why TIK-C010 remains open.
  - claimId: TIK-C012
    verdict: contradicted
    confidence: low
    reasoning: >-
      This transmission claim requires all three of its dependencies, and the ladder breaks at each: TIK-C007
      is weakly supported, TIK-C010 unevidenced, and TIK-C013 contradicted; no continuity mechanism is
      documented anywhere in the record. Convergent negative testimony is unusually broad — the field's central
      archaeochemist, a mystery-cult specialist, a Christian-origins scholar, and a sympathetic intra-movement
      reviewer all reject the synthesis, and the author concedes the gap ("Where are the drugs?"). The
      strongest opposing consideration is that expert testimony is not data and a genuinely secret tradition
      would predictably leave thin evidence; hence contradicted at low rather than moderate confidence.
  - claimId: TIK-C013
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The documentary base points the other way: the Didache's Eucharist is Jewish table blessing in form and
      content, Justin explicitly frames mystery-cult parallels as demonic imitation running in the opposite
      direction to the inheritance thesis, and a mystery-cult specialist states Christianity was not a mystery
      cult. The strongest opposing consideration is that "rather than" poses an exclusive alternative in a
      field where degree-of-Hellenistic-influence debates are live, and the patristic witnesses are normative
      texts a century or more after the events — enough to keep confidence at moderate, not high, but the
      record as it stands supports Jewish meal-practice origins.
