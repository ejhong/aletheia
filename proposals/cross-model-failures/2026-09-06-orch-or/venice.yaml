  synthesis: >-
    The case decomposes into rungs that must be assessed separately, because the evidence
    treats them very unevenly. The physics conjunct (ORCH-C030) is the one place where a
    decisive experiment exists: the Gran Sasso null (ORCH-E017) excludes the natural
    parameter-free Diósi–Penrose completion, and the experimenters themselves applied the
    bound to Orch OR and called it "highly implausible" in its simplest form (ORCH-E018).
    McQueen's model-theoretic distinction (ORCH-E019) legitimately blocks extending that
    refutation to Penrose's ℏ/E_G criterion itself — but a defense that relocates a theory
    outside an experiment's reach converts a refuted model into an untested vague one, and
    the criterion remains unmeasured. The biology conjunct (ORCH-C010) is the deepest
    weakness: twenty-five years of argument between two calculations that disagree by seven
    to eight orders of magnitude, adjudicated by no measurement, with the study ORCH-S001
    finding that no unconditional proponent estimate — including Hagan et al.'s own
    10⁻⁵–10⁻⁴ s — meets the theory's 25 ms requirement, and that the corpus commits to no
    acceptance threshold any measurement could pass or fail. The anesthesia arm has genuine
    positives: anesthetics bind tubulin (Emerson, an independent anesthesia lab) and dampen
    microtubule exciton diffusion (Kalra), and microtubule stabilizers delay anesthetic
    loss of righting reflex with large effect sizes. But the picrotoxin control in the
    flagship photophysics experiment (ORCH-E003) breaks anesthesia-specificity, the one
    independent stabilizer study found stabilization and destabilization both increasing
    sensitivity (ORCH-E013), and no quantum variable was measured in any behavioral study.
    Against this, the conventional account holds the case's best causal evidence: a single
    GABA_A β3 residue change largely abolishing intravenous anesthetic action (ORCH-E015).
    Steeling the proponent side: microtubules are demonstrably electronically nontrivial
    (ORCH-C013, well supported across partly independent groups), and the xenon nuclear-spin
    result (ORCH-C025) is an observation classical pharmacology genuinely lacks an account
    for. Steeling the skeptics: every proponent-supportive observation is either
    proponent-authored, unreplicated, non-specific, or measures something other than what
    the theory requires. The verdict is weakly_supported rather than mixed because the
    supportive evidence clusters on the periphery of the thesis while its two load-bearing
    conjuncts — conscious moments as objective reductions, and a required coherent
    microtubule state — have no direct positive evidence and one documented negative.
    Sensitivity: removing ORCH-E003 (the picrotoxin specificity failure) would most change
    the case, strengthening ORCH-C002 materially; the case verdict nonetheless survives,
    because ORCH-C001 and ORCH-C010 would remain unmeasured regardless.
  steelman: >-
    The xenon isotope result (ORCH-C025/ORCH-E014) combined with the Kalra photophysics
    chain and Craddock et al. 2017's prospective potency-correlation prediction: four
    xenon isotopes, chemically identical with identical calculated polarizability, show a
    40–50% potency gap tracking nuclear spin, and the project's own frozen re-analysis
    (ORCH-E038) shows the four group means are fitted by a spin step (weighted R² = 0.98)
    far better than by any smooth mass confound, while a spin-bearing-vs-spinless step of
    that shape has no classical account anywhere in this record. Combined with the
    demonstration that clinical anesthetics measurably suppress electronic energy migration
    in microtubules — with the potency correlation already prespecified in Craddock 2017 —
    a proponent can rightly say: quantum degrees of freedom demonstrably participate in
    anesthesia somewhere, anesthetics demonstrably perturb the exact structure the theory
    nominates, and the only missing piece is the direct coherence measurement no one has
    performed. This assessment does not answer the isotope effect conventionally; it merely
    notes the result is unreplicated and does not implicate microtubules.
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Both conjuncts this identity claim requires are unverified: no unconditional proponent
      decoherence estimate meets the theory's own 25 ms requirement (ORCH-E036), and the
      natural parameter-free collapse completion is experimentally excluded with the
      experimenters themselves calling the simplest versions "highly implausible"
      (ORCH-E017, ORCH-E018). Against refutation, the ℏ/E_G criterion itself has never been
      tested (ORCH-E019) and the theory publishes no pass/fail thresholds (ORCH-E035), so it
      survives in untested forms. The affirmative photophysics evidence supports only
      ORCH-C013, not the identification of conscious moments with reduction events; the
      strongest opposing consideration is the coherent Decoherence gap, the strongest
      supporting consideration is that no measurement has caught the theory failing.
  - claimId: ORCH-C002
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Anesthetics demonstrably bind tubulin and perturb microtubule photophysics
      (ORCH-E009, ORCH-E002) and stabilizer manipulation shifts anesthetic latency in the
      predicted direction in one program's studies (ORCH-E011, ORCH-E012), but the picrotoxin
      control (ORCH-E003) shows the photophysical effect is not anesthesia-specific, and the
      one independent stabilizer study ran the opposite direction with a destabilizer
      behaving like a stabilizer (ORCH-E013). No experiment measured any quantum-coherent
      state, so the claim's core — that disruption of a quantum-coherent state required for
      consciousness does the work — rests on nothing measurable in this record. The
      β3(N265M) result (ORCH-E015) shows the rival account holds target-specific causal
      evidence this arm lacks.
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The β3(N265M) knock-in is the cleanest causal evidence in the entire case — one
      engineered residue abolishing etomidate and propofol immobility and profoundly
      reducing hypnosis (ORCH-E015) — which is target-level causal evidence of a kind no
      microtubule study approaches. The endpoint-separation follow-up (ORCH-E030) honestly
      bounds the claim: the hypnotic effect is reduced but not abolished, and volatile
      agents act through broader target spectra, so "substantially accounted for" rather
      than exhaustive is exactly what the record licenses. The main opposing consideration
      is Eger et al.'s documented paradox (ORCH-E031) that no known channel combination
      suffices for volatile immobility, a residue within the classical program itself.
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The universal quantifier is the problem: the classical account is demonstrably
      substantial but demonstrably incomplete on this record — no single channel or
      combination suffices for volatile immobility (ORCH-E031), and the xenon isotope result
      (ORCH-C025) is a quantum-adjacent observation with no classical account in this record,
      though it is unreplicated and does not implicate consciousness mechanisms specifically.
      Nothing here establishes any quantum-coherent contribution either, so the universal
      negative cannot be affirmed or denied. This claim was correctly split from ORCH-C003,
      whose evidence does not carry the "fully" and "without any" quantifiers.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The Gran Sasso experiment (ORCH-E031/ORCH-E017) is the highest-quality measurement in
      the case and it excludes the natural parameter-free stochastic completion of
      gravity-related collapse, with Diósi a co-author; Derakhshani et al. apply the bound
      to the committed 2.5 fm tubulin geometry directly. But McQueen's distinction
      (ORCH-E019) is sound as far as it goes: Penrose's τ ≈ ℏ/E_G criterion is a lifetime
      relation, not the stochastic master equation that predicts radiation, so the criterion
      itself remains untested (ORCH-R007 names the missing measurement). The claim survives
      only as an untested heuristic while its most testable formulation is refuted.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: low
    reasoning: >-
      Nothing in the record supports the formal non-algorithmicity claim directly: the
      Zahavy abduction-gap argument (ORCH-E025) is a structural claim about current
      architectures, explicitly not a claim about physical non-computability, and it comes
      from a DeepMind researcher rather than a Penrose partisan. The AI-mathematics results
      (ORCH-E022, ORCH-E023) undermine the motivating examples but not the claim about human
      cognition, and Jhong's own audit (ORCH-E026) concedes the testable instances have
      mostly settled against Penrose while the "escalator" reformulation absorbs each
      failure — which critics call unfalsifiable. The formal argument is neither refuted nor
      supported by any measurement in this record.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      This is the rung the whole theory hangs on, and it has never been measured: ORCH-E036
      tabulates that Tegmark's estimate (10⁻¹³–10⁻²⁰ s) and Hagan's rebuttal (10⁻⁵–10⁻⁴ s)
      are both calculations about different modeled states, that the proponents' own
      unconditional number falls two to three orders short of their 25 ms exemplar, and that
      the only routes to physiological timescales are explicitly conditional assumptions or
      an inference from unreplicated single-laboratory resonance measurements. The Kalra and
      Babcock results measure excitation diffusion and cooperative radiative coupling, not
      coherence lifetimes, and neither reaches millisecond scales. The decisive experiment
      (ORCH-R001) has not been run, so the claim is unresolved, not refuted — but every
      published number leans against it.
  - claimId: ORCH-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Two independent lines support this: Emerson et al. photolabeled β-tubulin with an
      anesthetic and localized binding near the colchicine site (ORCH-E009), from a
      mainstream anesthesia-mechanisms laboratory with no Orch OR commitment, and Kalra et
      al. measured anesthetic-induced reduction of exciton diffusion (ORCH-E002). The claim
      as stated asserts binding and altered electronic/optical behavior, not anesthesia
      specificity, so the picrotoxin comparison (ORCH-E003) weakens the downstream
      interpretation without contradicting the claim itself. Both experiments are in vitro
      and neither is independently replicated, which caps confidence at moderate.
  - claimId: ORCH-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Multiple laboratories across species and preparations report that microtubule-directed
      drugs alter anesthetic endpoints: Emerson's stabilizer protection in tadpoles, the
      Wellesley epothilone-B delays in rats and mice, MGH's chronic shifts, and the human
      taxane observation (ORCH-E009, ORCH-E011, ORCH-E012, ORCH-E013, ORCH-E032). The claim
      asserts only that manipulation changes susceptibility, and that is robustly shown.
      What is not shown is any consistent direction or quantum mechanism: stabilization
      produced resistance in some preparations and sensitivity in others, and vinblastine
      moved with epothilone D, suggesting general cellular disruption as an operative
      variable — the strongest opposing consideration for any mechanistic reading.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      This is the best-supported proponent claim in the case: 6.6 nm excitation diffusion
      beyond Förster prediction (ORCH-E001), superradiant collective states with a partly
      independent confirming quantum-yield measurement (ORCH-E004), and the well-replicated
      background fact that microtubules are electrically non-inert. The Babcock line comes
      from outside the Hameroff–Penrose group, which matters. Confidence is capped because
      Kalra is not independently replicated, includes the theory's authors, and is in vitro;
      and the Saxena resonance work (ORCH-E005), often cited here, is single-laboratory,
      unreplicated for over a decade, and measures a classical observable.
  - claimId: ORCH-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is a direct restatement of the Kalra et al. abstract, which this record
      verified against PubMed and Crossref, including the quencher-lifetime methodology and
      the anesthetic finding. The opposing considerations are structural rather than
      contradictory: the diffusion length is about one tubulin dimer, the measured quantity
      is not a coherence time, the reduced values come from the paper body via secondary
      relay, and the same paper's picrotoxin result (ORCH-E003) shows the anesthetic effect
      lacks demonstrated specificity. Single-laboratory, proponent-coauthored, unreplicated —
      solid as a report, moderate as settled science.
  - claimId: ORCH-C021
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The abstract explicitly states the theoretical prediction and its experimental
      confirmation, and the source is partly independent of the theory's authors. The main
      opposing consideration is interpretive: quantum yield can rise by several mechanisms,
      the collective-state reading is model-dependent, and the striking "tens of seconds"
      figure is a radiative lifetime of a modeled dark eigenstate — routinely misread as a
      decoherence time, which it is not. On the quantum yield claim itself, the record
      supports it; on anything Orch OR needs, the paper is silent.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The measurement is reported and bibliographically verified, but it is the weakest
      substantial claim in the case: no independent protocol-level replication in over a
      decade, a single laboratory lineage whose related Sahu 2013 work cannot corroborate
      itself, bespoke apparatus spanning unusual frequency ranges, and a measured quantity —
      classical electromagnetic resonance ratios — that could not witness quantum coherence
      even if perfectly replicated. The claim as stated is only that the patterns exist, and
      the record supports that only as a single unreplicated report. This is the field's
      largest replication gap (ORCH-R005) and the deficit is the claim's cap.
  - claimId: ORCH-C023
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Both studies are peer-reviewed, blinded, with tolerance controls and large reported
      effects (d = 1.9 rats, d = 0.8 mice), and the mouse study creditably cites the
      contradictory independent finding in its own abstract. The claim is the measurement,
      and it is solidly documented. Confidence is moderate rather than high because both
      studies share a senior author and program, the rat analysis is N = 8 males at a single
      isoflurane concentration without counterbalancing, and no quantum variable was
      measured — the authors' closing quantum framing is interpretive gloss, not result.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Li et al. 2025 result is methodologically the strongest animal study in the case —
      randomized, blinded, full concentration–response curves with published confidence
      intervals, from a laboratory independent of the proponent program — and its finding is
      unambiguous: both a stabilizer and a destabilizer shifted sensitivity leftward. The
      claim as stated is well supported. Its interpretive weight runs against the
      theory's usual form, since the stabilizer/destabilizer convergence suggests general
      cellular disruption rather than microtubule-stability protection of consciousness;
      the chronic-versus-acute regimen difference bounds but does not erase that.
  - claimId: ORCH-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The observation was reported as stated in a flagship journal with randomization, and
      the project's frozen re-analysis found the four means are described far better by a
      spin step than by mass (ORCH-E038) — but the same re-analysis tripped its own
      pre-set identification-failure rule (ORCH-E037), the headline xenon-alone values are
      calculated from an isoflurane background rather than measured, the dispersion type is
      unstated, and an eight-year literature sweep found no replication, extension, or
      predecessor (ORCH-E039). A single unreplicated four-arm experiment with these
      auditability problems supports the claim only weakly, whatever its descriptive
      elegance.
  - claimId: ORCH-C026
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The heartbeat-timed, awareness-dependent signals are genuinely reported in living
      human brains with a novel protocol, and the claim's wording accurately attributes the
      entanglement interpretation to the experimenters rather than asserting it. The
      interpretation is disputed on methodological grounds by a leading NMR authority
      (ORCH-E021) with an unresolved authors' reply, there is no independent replication,
      and the experiment does not implicate microtubules at all. The observation is real;
      its evidential reach is one disputed, hedged claim in a contested exchange — the
      strongest opposing consideration is Warren's point that classical multicompartment
      effects in heterogeneous tissue are exactly what such signals usually are.
  - claimId: ORCH-C031
    verdict: well_supported
    confidence: high
    reasoning: >-
      A dedicated ultra-low-background underground search with the model's co-originator
      among the authors, published in Nature Physics, with the exclusion stated in the
      abstract's own words and the bound tightened by three orders of magnitude. The
      qualification matters and is recorded: this refutes the natural parameter-free
      stochastic Diósi–Penrose model, not Penrose's ℏ/E_G criterion itself, which predicts
      no radiation (ORCH-E019). On the claim as stated — which correctly scopes the
      exclusion — the evidence is as strong as anything in this case.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The load-bearing verification is well designed: the Erdős disproof is anchored on
      Sawin, an independent mathematician stating and building on the OpenAI result, rather
      than on the company's announcement, and AlphaProof's IMO performance is Lean-verified
      and Nature peer-reviewed. The line's documented false-positive history (ORCH-E027)
      concerns inadequate novelty checks, not incorrect mathematics, and does not touch the
      verified unit-distance result. Confidence is moderate because the decisive disproof
      is a preprint resting partly on an unreleased internal model, and the Gemini gold
      result is a corporate announcement with external but not machine verification.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      (Duplicate coverage avoided in synthesis; see above.) The strongest experiment in the
      case bears directly on this conjunct and came back negative for the parameter-free
      formulation, with the Gran Sasso authors themselves extending the constraint to Orch
      OR's committed geometry; the saving distinction — that the ℏ/E_G criterion is not the
      radiation-predicting model — is accepted here, which is exactly why the claim is
      unresolved rather than contradicted. The strongest opposing consideration to the
      skeptics' case is that no experiment has tested the lifetime scaling criterion itself.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Duplicate identifier in the assess list; the assessment above stands — the factual
      observation is well supported with moderate confidence, and its bearing on the case
      is confined to the non-computability motivation rung, where the Zahavy abduction
      argument and the "escalator" defense keep ORCH-C040 unresolved despite it.