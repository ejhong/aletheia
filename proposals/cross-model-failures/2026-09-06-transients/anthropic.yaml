caseAssessment:
  verdict: unresolved
  loadBearing: [TRN-C020, TRN-C024, TRN-C002, TRN-C001, TRN-C011]
  weakestLinks: [TRN-C023, TRN-C022, TRN-C005, TRN-C006, TRN-C010]
  synthesis: >-
    The record separates cleanly into rungs, and the rungs have very different
    evidential health. The bottom rung is solid: nine star-like marks really are
    present on surviving POSS-I glass material of the 12 April 1950 field, and
    this is confirmed not by the proponents but by the case's principal skeptics
    (TRN-E002), who also measured the profile statistic that both camps now
    argue over (TRN-E003). An independently written extraction pipeline recovers
    eight of nine and three of three canonical detections without touching the
    original team's software (TRN-E008). The 1952 triple is peer reviewed with
    deep modern follow-up. So the marks exist, they are not scanner ghosts, and
    they are not an artifact of one group's code. The second rung — did light
    make them, and did that light come through the telescope? — is where the
    case stalls. Hambly and Blair supplied a real mechanism (a shared copy
    positive ancestral to both digitizations, TRN-E005) that would have explained
    everything; the Yang and Villarroel microscopy (TRN-E022, TRN-E023) removes
    that mechanism's reach over the two flagship events by finding the nine on
    the original emulsion. But the same manuscript, candidly and against its own
    side's interest, reports the ceiling: microscopy cannot separate a sub-second
    flash from an intrinsic emulsion defect at the single-source level, its own
    microscopist leaned defect, and the field sits in a plate corner where
    defects congregate (TRN-E024). Sharpness is direction-ambiguous by both
    sides' own accounts. The only genuinely physical discriminant on offer — coma
    aberration in an independent Hamburg archive (TRN-E014) — is a single
    unreviewed preprint with an unvalidated classifier. The third rung, the
    ensemble statistics, cannot rescue this because every one of them, on both
    sides bar Hayes, runs on the same unreconstructed 107,875-row working
    catalog: Doherty replicates the analysis but not the extraction; Watters
    shows the shadow null distribution was wrong and the temporal signal tracks
    the Palomar observing schedule; Hayes finds the nuclear effect vanishes under
    independent extraction with an exposure denominator. Correlations inside a
    catalog whose row-selection is itself disputed cannot certify the rows. Above
    that, near-Earth attribution is thin and now has a competing natural family
    (Cann's dusty-plasma proposal), and artificiality has no positive evidence in
    this file at all. The honest verdict is unresolved because the decisive
    experiments — flash-profile calibration on period emulsion, blind coma
    validation, catalog reconstruction — have been specified and not done.
  steelman: >-
    No defect mechanism in this record explains three ~16th-magnitude, star-like,
    unelongated point sources appearing within 10 arcseconds of each other on one
    exposure of a consecutive pair taken within the hour, and absent to magnitude
    25.5 for 71 years — nor does any artifact account predict Busko's off-axis
    coma pattern in a wholly separate telescope, emulsion stock and digitization
    lineage. A defect hypothesis that must independently produce tight multiples
    on single exposures and optics-consistent aberration is not obviously simpler
    than a flash hypothesis, and this assessment rests on the absence of
    validation rather than on a demonstrated artifact source for those events.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      This claim inherits every unresolved step below it: it requires that the
      marks are light (TRN-C020, unresolved) and that the light was reflected
      from near-Earth objects (TRN-C021, weakly and contestedly supported), and
      then adds artificiality on top with no independent evidential support in
      this file. The alignment preprints (TRN-E018) are the only records reaching
      toward it, and they are unreviewed, non-preregistered, run on the contested
      catalog, and vulnerable to look-elsewhere inflation. Cann's dusty-plasma
      proposal (TRN-E020) is decisive against reading near-Earth as necessarily
      artificial: it sketches a natural population at the same altitude that
      would satisfy TRN-C021 while removing any reason to believe this claim.
      The strongest opposing consideration for my verdict is that background
      knowledge — no known human hardware at geosynchronous distance before 1957
      — makes "artificial" here mean "not ours," a prior-laden step that arguably
      warrants a harsher grade than unresolved; I record that this verdict leans
      on the absence of tests rather than on evidence balance.
  - claimId: TRN-C023
    verdict: unresolved
    confidence: low
    reasoning: >-
      Not one evidence record in this file bears specifically on extraterrestrial
      origin; the ET step is asserted downstream of a parent (TRN-C022) that
      itself has no positive support. Calling it unresolved should not be read as
      a balanced open question — it is a claim with zero supporting observations
      in the record, whose only route to testability runs through discriminants
      (orbital dynamics from alignments, spectral or photometric signatures) that
      nobody has applied to validated sources. The opposing consideration is that
      the claim is not strictly untestable: Villarroel et al. 2022 sets out a
      search strategy, and if a genuine pre-1957 reflective population were
      established, artificiality and its origin would become empirical questions.
      Until then this is speculation attached to an unvalidated dataset.
  - claimId: TRN-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two geometric or physical lines point toward near-Earth altitude: the
      shadow deficit (TRN-E010, TRN-E015) and the geomagnetic dose-response and
      post-storm recovery profile (TRN-C103 context, TRN-E020), the latter with
      one confounder actively tested and rejected (TRN-E017). But every one of
      these runs on the same 107,875-row lineage, and Watters (TRN-E011) shows
      the shadow test's uniform-background null is false, with no significant
      deficit under a proper null — which removes the single best geometric
      argument. The strongest opposing consideration is that even if the
      correlations are real, they cannot establish near-Earth origin while
      TRN-C020 is open: a defect population with a schedule- or environment-
      correlated production rate would reproduce them. I grade this weakly rather
      than unresolved only because the shadow-deficit and Kp results survive
      several internal robustness checks, including ML artifact scoring.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The microscopy of the original 1950 negative (TRN-E022) retires the
      digitization-and-copy branch for the canonical nine, which is real progress
      and removes the sharpest use of the copy-genealogy argument. But the same
      manuscript states plainly that microscopy cannot separate a sub-second
      flash from an intrinsic emulsion defect at the single-source level, quotes
      its own microscopist attributing the marks to emulsion defects, and notes
      the plate-corner location where defects congregate (TRN-E024) — so the crux
      merely narrows from "original or copy" to "flash or flaw in the original
      emulsion," and nothing in this record answers that. The coma result
      (TRN-E014) is the only physical discriminant proposed, and it is a single
      unreviewed preprint, unvalidated against a defect bestiary, and applies to
      Hamburg rather than Palomar. The strongest opposing consideration is the
      random-forest artifact classification (TRN-E004), but its training labels
      are defined by absence of a modern counterpart — the defining property of a
      transient candidate — so it is circular by construction and cannot settle
      the question either.
  - claimId: TRN-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      This is an archival-process reconstruction by an author of the SuperCOSMOS
      survey (TRN-E005): contact printing produced an intermediate positive from
      each original negative, and the copy negatives scanned by DSS and
      SuperCOSMOS descend from that shared positive. Nothing in the record
      disputes the genealogy itself, and it correctly dissolves the "found in two
      independent digitizations" robustness argument for the whole catalog. The
      strongest opposing consideration is scope, not truth: TRN-E023 shows that
      for the two canonical events the mechanism is not what happened, since the
      features appear on the original negative — and TRN-E005 establishes a
      pathway without any measured base rate for copy-stage star-like defects
      (TRN-R007 remains open). The mechanism is real; its explanatory reach over
      the flagship events is not.
  - claimId: TRN-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Physical inspection by the critics' own team confirmed nine point-like
      detections on the Edinburgh glass copy at the published positions and their
      absence from the field exposed six days later (TRN-E002), and an
      independent from-scratch pipeline recovers eight of nine (TRN-E008).
      Deep modern imaging shows no counterparts beyond possible chance
      projections (TRN-E001). This is the best-attested claim in the case and its
      truth is essentially uncontested across camps. The strongest opposing
      consideration is that the same inspection found similar detections on the
      neighboring field E0086 and a visible blemish population on both copies —
      which does not touch the claim as stated but heavily conditions what it
      implies for the featured hypothesis.
  - claimId: TRN-C024
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      One record supports it — the Yang and Villarroel microscopy of the Caltech
      original registered against the published digitization using field stars
      (TRN-E022) — and the load-bearing step is the registration analysis, which
      is unreviewed, unblinded, and performed by the proponents' group. Its
      credibility is raised by the manuscript's candour elsewhere and by the fact
      that the microscopist was directed to the positions by Hambly, the
      copy-defect argument's own author. The strongest opposing consideration is
      structural: no outside party has repeated the registration, and no
      per-generation first-appearance census was done, so a systematic
      registration error or a coincidental defect field cannot be excluded from
      the record alone. Provisional is the correct grade for a single unblinded
      unreviewed observation of a decisive fact.
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The measurement comes from the skeptical side (TRN-E003): all nine
      SuperCOSMOS profile statistics fall on the sharp side of the zero-mean
      stellar distribution, roughly −3 to −1, with a joint probability of order
      0.1^9 under the stellar distribution, corroborated by microscope inspection
      and echoed by the later microscopy (TRN-E022, "marginally sharper"). Both
      camps accept the number; only its meaning is disputed. The strongest
      opposing consideration is that the statistic was measured on the digitized
      copy lineage rather than the original negative, so strictly the claim is
      established for the copy material; and note that the 1952 triple's profiles
      are reported as near-stellar (TRN-E007), so the canonical events are not
      morphologically uniform.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The event is reported in a peer-reviewed MNRAS paper with 2023 GTC
      follow-up to magnitude 25.5 (TRN-E007), and all three sources are recovered
      by an independent pipeline that never consulted the original candidate
      lists (TRN-E008); the microscopy record additionally places the candidate
      in the original survey digitization as well as on a Harvard copy
      (TRN-E022). The claim as stated is about presence and absence patterns,
      and those are the most cross-checked facts in the case after the 1950 nine.
      The strongest opposing consideration is that no physical inspection of the
      1952 original negative has been published — presence there is inferred, not
      observed — and the follow-up depth claims rest on the proponent team's own
      reduction. Confidence is moderate rather than high for that reason.
  - claimId: TRN-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E008 reports exactly the numbers claimed — 8/9, 3/3, and 63.9% of the
      5,399 at 0.94 arcsec median separation — from a documented pipeline with
      synthetic-injection benchmarking and roughly 0.2 false positives per
      control field. This genuinely retires the "proprietary software" objection.
      The strongest opposing considerations are that it is a single-author
      unreviewed preprint whose full-sky sweep ran with deliberately loose
      parameters (2.85 million candidates, which the author flags), and that the
      replication is of extraction only, on the same digitized descendants of the
      same copies — so it demonstrates methodological reproducibility, not that
      the recovered rows are sky events.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The arithmetic is reproduced by independently written code on the same rows
      (0.46% observed against ~1.4% geometric, TRN-E010) and the deficit persists
      and strengthens among ML-scored likelier-real candidates (TRN-E015), so the
      claim as a descriptive statement about that catalog holds. But Watters
      (TRN-E011) shows the uniform-random background assumption underlying the
      1.4% expectation is false — feature counts rise toward corners and edges
      with geometric clusters and voids — and reports no significant deficit
      against a properly derived null, and that at least 91% of the features used
      belong to a set previously discarded for lying within 5 arcsec of catalog
      stars. The proponents' reply (TRN-E012) contests power and subset
      representativeness rather than the heterogeneity finding. A number that is
      arithmetically reproducible but whose comparison baseline is demonstrably
      wrong is precisely a mixed record.
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The RR 1.45 result replicates exactly under independent code with
      permutation testing and weather and lunar controls (TRN-E010), survives ML
      artifact scoring (TRN-E015), and survives an open Bayesian model with
      temporal autocorrelation, though attenuated and with the UAP-lag term
      stronger than the nuclear one (TRN-E019). Against that, the association
      becomes insignificant when normalized by observation days and is largely
      determined by the Palomar observing schedule (TRN-E011), and it does not
      appear at all in an independently extracted catalog modeled with nightly
      coverage as exposure (TRN-E009, IRR 1.03, p = .71). Cann's negative control
      (TRN-E017) usefully closes the geomagnetic-sensitivity confounder but not
      the denominator problem. Replicating on the original rows while vanishing
      under independent extraction with a proper exposure denominator is the
      signature of a catalog property, though the diluting effect of Hayes's
      looser parameters keeps this short of a clean refutation.
  - claimId: TRN-C010
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      One explicitly preliminary preprint on 41 plates from a different
      telescope, emulsion stock, archive and digitization lineage reports
      transient candidates with systematically narrow FWHM (TRN-E013). If it
      holds it is the most important independence result in the case, since the
      Palomar copy genealogy cannot reach it. But there is no false-positive
      calibration, no injection-recovery completeness, and no candidate rate
      against matched controls, so "the sky does this everywhere" and "old
      emulsions fail similarly everywhere" are not yet distinguishable — which
      is the strongest opposing consideration and the reason for a weak grade
      rather than provisional support.
  - claimId: TRN-C011
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      A single-author unreviewed preprint over 532 Hamburg Doppel-Reflektor plate
      pairs reports the off-axis coma pattern expected of point sources imaged
      through parabolic optics (TRN-E014), and the underlying physics — that a
      surface blemish has no reason to reproduce a field-position-dependent
      directional asymmetry — is sound and, if validated, would be the only
      direct physical discriminant in the whole case. The strongest opposing
      consideration is that the classifier has not been blind-validated against
      known defect classes, some of which (scratches, elongated emulsion damage,
      directional coating flaws) can mimic directional asymmetry, and the paper
      itself declines to claim it establishes the light's physical origin. The
      claim's second half — that artifacts cannot naturally reproduce the
      signature — is an untested assertion, not a measurement.
