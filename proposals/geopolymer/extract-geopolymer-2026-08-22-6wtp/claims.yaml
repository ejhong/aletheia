- id: GEO-C701
  statement: Ancient peoples could have independently discovered artificial stone
    similarly to how they discovered fire.
  theme: ingredients
  rung: mechanism
  tier: catalog
  reviewState: ai_extracted
  sourceAnchor:
    locator: "foti.txt — Chapter Five: Scoop Marks Worldwide"
    quote: I think that if we accept the idea that ancient peoples could have
      independently discovered fire, then they could have also discovered
      artificial stone. There's not such a big leap between fire, heating,
      cooking, and stone-making.
    sourceId: SRC-FOTI-2023
  origin:
