        Demeter/Kore, the Iberian datum stands as a genuine analogue for Greek mystery practice. If
        it rests on generic 'chthonic/agrarian sanctuary' inference or on the ergot find itself, the
        link is circular and TIK-C004's Eleusinian framing must be retired to a bare 'ritual
        context' statement.
