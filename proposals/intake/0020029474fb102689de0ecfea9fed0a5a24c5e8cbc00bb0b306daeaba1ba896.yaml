        Eleusinian accounts). Neither tests the second half of TIK-C004 — the cultic attribution
        that alone licenses transferring an Iberian residue to Eleusinian practice. The claim
        asserts the Eleusinian link as settled background while all scrutiny has gone to the
        chemistry.
