      kind: study
      title: Does the Younger Dryas freshwater trigger need an impact? A dated-evidence table of meltwater
        routing at the onset
      question: "Compile every published, independently dated line of evidence for glacial meltwater
        discharge or routing change (St. Lawrence, Mackenzie/Arctic, Hudson Strait pathways: runoff
        proxies, δ18O, flood landforms, IRD) within ±500 years of the YD onset, with each record's
        dating uncertainty and whether its mechanism requires or excludes an external forcing.
        Criteria for inclusion and for 'coincident with onset' frozen before compilation."
      closestExisting: YDIH-C013, YDIH-C021, YDIH-E028 — C013 and E028 concern the AMOC mechanism itself;
        C021 asserts an impact initiated the perturbation. No existing item tests whether the dated
        meltwater-routing record already accounts for the AMOC disruption without any impact — the
        necessity question on which C021 stands or falls.
      wouldSettle: If well-dated routing evidence coincides with the onset and is mechanistically
        self-sufficient (ordinary ice-sheet dynamics), C021's impact trigger is superfluous even if
        impact proxies were real; if routing evidence is absent, mis-timed, or requires an abrupt
        exogenous discharge, the trigger question genuinely remains open and C021 gains standing.
      effortTier: desk
