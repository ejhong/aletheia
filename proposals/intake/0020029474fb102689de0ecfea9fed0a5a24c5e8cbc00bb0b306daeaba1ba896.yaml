        Mokattam quarry stone"
      question: "Do published bulk-density and porosity measurements of Great Pyramid blocks fall outside
        the measured range of natural Tura and Mokattam quarry limestone? Frozen criteria: compile
        every published density/porosity value with sample identity and method, compute quarry-stone
        reference distributions, and flag block values outside the 95% envelope."
