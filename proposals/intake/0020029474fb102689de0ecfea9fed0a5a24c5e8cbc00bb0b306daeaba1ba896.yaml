      index: 2
      kind: study
      title: "GEO-era positive control: untrailed glint rates on Schmidt plates taken when the
        geosynchronous belt was populated"
      question: "On plates exposed after the geosynchronous belt was populated (e.g., POSS-II and
        1970s–90s Schmidt survey plates), at what per-plate rate do known GEO/near-GEO objects
        produce untrailed, star-like point detections passing the VASCO-style cuts, and how often do
        they form multi-point clusters within ~10–15 arcmin? Decisive record: a frozen-criteria
        table of detection rates versus cataloged satellite populations and plate pointing/epoch,
        compared against the pre-1957 candidate rate."
      closestExisting: "TRN-R006, TRN-C021, TRN-C005, TRN-C104 — TRN-R006 measures transient-candidate
        rates on independent archives with matched cadence, but has no positive control: no ledger
        item calibrates whether real reflective near-Earth objects at geosynchronous-like altitude
        actually produce the untrailed point-like signatures and clustered multiplets that TRN-C021
        and TRN-C104 attribute to them, at any measurable rate, on comparable emulsions."
      wouldSettle: If GEO-era plates show untrailed glint detections at rates and multiplicities
        consistent with the pre-1957 candidates (scaled by object population), the
        near-Earth-reflector reading of C021 gains a working empirical template. If
        populated-belt-era plates show essentially no such signatures despite thousands of known
        objects, the glint mechanism is quantitatively disfavored and the pre-1957 candidates likely
        need another explanation.
      effortTier: analysis
