      index: 1
      kind: study
      title: "Terminal-occupation date table: how many Aquiry and southern-rim earthworks were still in
        use at the contact horizon (AD 1500)?"
      question: "Across published radiocarbon and stratigraphic dates for the 432 Aquiry earthworks and
        the ~AD 1250–1500 southern-rim fortified villages, what fraction have terminal occupation
        dates overlapping AD 1450–1550 at 2σ? Truth condition: a frozen-criteria table of every
        published site with dated terminal use, computable from the 2026 study's supplements and
        prior Acre/Xingu literature."
      closestExisting: AMZ-C004, AMZ-C005, AMZ-C006, AMZ-E003 — C004/C005 concern the size and
        model-sensitivity of the Aquiry peak, and E003 notes the peak predates Orellana by a
        millennium — but no item quantifies how much of the earthwork landscape was still occupied
        at European contact, which is the question that connects the LiDAR results to Carvajal-era
        demography and to the collapse claims.
      wouldSettle: A high overlap fraction would show the earthwork societies contribute directly to
        contact-era population reconstructions; a low fraction would show the LiDAR headline figures
        describe an earlier demographic world and cannot be cited as corroborating Carvajal or 1492
        population totals.
      effortTier: desk
