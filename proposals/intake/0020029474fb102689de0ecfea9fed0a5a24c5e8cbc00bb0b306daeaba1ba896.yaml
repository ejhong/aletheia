      index: 3
      kind: study
      title: "Taurid Complex dynamical ages and masses versus what the YDIH scenario requires: a frozen
        literature table"
      question: "Tabulate every published dynamical-modeling estimate of the Taurid Complex progenitor's
        fragmentation age, initial mass, fragment size distribution, and Earth-encounter probability
        at 12.8 ka (Napier, Egal et al., Clube–Asher lineage, and critics), against the parameters
        the YDIH scenario requires (multiple ≥100 m airbursts across four continents in ≤a few
        years, no crater). Decisive record: a side-by-side table showing whether any independently
        published Taurid model delivers the required encounter, or whether the scenario requires
        parameters outside all published estimates."
      closestExisting: YDIH-C012, YDIH-E022, YDIH-C009 — C012 and E022 record the scenario as proposed by
        its author; C009 covers only the crater absence. No item confronts the proponent scenario
        with the independent Taurid dynamics literature, which has produced younger fragmentation
        ages and lower impact probabilities that may be quantitatively incompatible with a 12.8 ka
        multi-continent airburst swarm.
      wouldSettle: If independent dynamical estimates are consistent with the required 12.8 ka encounter,
        C012 stands as a viable mechanism despite the missing crater. If all independent estimates
        exclude it, the hypothesis loses its only articulated astronomical delivery mechanism.
      effortTier: desk
