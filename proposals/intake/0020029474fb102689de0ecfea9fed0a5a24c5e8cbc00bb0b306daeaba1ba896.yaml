    proposal:
      id: 2026-09-01-agenda-33512756583/ydih/1
      caseSlug: ydih
      runDir: 2026-09-01-agenda-33512756583
      index: 1
      kind: claim
      title: The GISP2 platinum anomaly begins after, not at, the Greenland climate signal of the Younger
        Dryas onset on the same layer-counted timescale
      question: "Proposition: on the GISP2/GICC05 depth-age scale, the onset of the ~21-year Pt enrichment
        (per Petaev et al. 2013's published depth series) postdates the initiation of the
        δ18O/deuterium-excess transition marking the Younger Dryas onset by a resolvable number of
        annual layers. Truth condition: align the published Pt depth series with the published
        isotope depth series on the same core and count the offset; the claim is true if Pt rise
        begins measurably after the climate transition begins, false if it precedes or is
        indistinguishable from it."
      closestExisting: YDIH-C001, YDIH-C010, YDIH-E021, YDIH-R004 — C001 asserts only that the anomaly
        exists near the onset; C010 and R004 address inter-site synchrony across archives with
        radiocarbon-scale uncertainty. None addresses the within-core ordering of Pt versus climate
        signal, where annual layer counting removes almost all dating uncertainty and directly tests
        cause-before-effect.
      wouldSettle: If Pt begins after the climate transition, the anomaly cannot record the trigger of the
        cooling, undercutting C021 regardless of the Pt source. If Pt leads or is simultaneous
        within counting error, the temporal prerequisite for a causal role survives at the one
        archive with the best chronology.
      effortTier: analysis
