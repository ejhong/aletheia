      kind: study
      title: "Quantum-signature coverage matrix: what each observer-first or epistemic program actually
        reproduces"
      question: A frozen-criteria table with rows = distinctively quantum signatures (Bell violation up to
        Tsirelson, contextuality, no-cloning, interference, teleportation, continuous reversibility,
        Born-rule statistics, PBR-style ontic constraints) and columns = Spekkens' toy theory,
        algorithmic idealism, conscious-agent theory, Wolfram's multiway/ZX results; each cell
        filled 'proven', 'claimed without proof', 'proven impossible', or 'unaddressed', with a
        citation. Answerable entirely from published papers.
      closestExisting: ZW-C002, ZW-C502, ZW-E014, ZW-E015, ZW-E010 — ZW-C002 asserts in aggregate that no
        program has derived the full quantum package, and ZW-C502 covers Spekkens alone; no item
        decomposes the claim into a signature-by-signature, program-by-program matrix showing
        exactly where each program stops and with what documentary status.
      wouldSettle: A completed matrix showing every program blocked at the same cells (Tsirelson bound,
        Born rule) would convert ZW-C002 from a summary judgment into an auditable claim and
        pinpoint the bridge-theorem target of ZW-C010; discovering a published cell the ledger
        missed (a proven derivation of any hard signature) would directly falsify or qualify
        ZW-C002.
