      title: The correlated-LIGO-noise premise of the erebon conjecture did not survive independent
        reanalysis
      question: The Creswell et al. (2017) report of correlated noise between the two LIGO detectors at
        the gravitational-wave time delay — the empirical premise Penrose 2017 built the
        erebon-signal conjecture on — was tested by independent and LIGO-collaboration reanalyses,
        and the truth condition is whether those published reanalyses (e.g., Nielsen et al. 2019,
        LIGO responses) confirmed or dissolved the correlation as an artifact of the phase/windowing
        method.
      closestExisting: CCC-C505, CCC-E019, CCC-R002 — C505 and E019 record only Penrose's conjecture and
        its premise as of 2017; R002 proposes a future erebon search. None records the documented
        fate of the correlated-noise claim itself, which is a settled matter of published record and
        directly conditions whether R002 has any existing positive hint to chase.
      wouldSettle: If reanalyses confirmed residual correlated noise, the erebon conjecture retains an
        anchoring anomaly and R002 inherits a concrete target; if they showed the correlation to be
        a methodological artifact, C505 loses its empirical premise and any erebon search starts
        from a null baseline.
      effortTier: desk
