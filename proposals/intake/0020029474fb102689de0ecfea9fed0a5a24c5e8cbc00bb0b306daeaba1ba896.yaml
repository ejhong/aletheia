  - id: 0d5befefa7254cffd547b989e50586408d4a4403e4dee6c7dd7bdb98b2decfa2
    case: mpi
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-08-27-agenda-33059577648/mpi/2
      caseSlug: mpi
      runDir: 2026-08-27-agenda-33059577648
      index: 2
      kind: study
      title: "Forward simulation: does a null model plus documented analytic flexibility reproduce the
        matrix program's full trajectory?"
      question: "Build a generative simulation of the correlation-matrix paradigm under the null
        (including realistic intercorrelation among psychological variables, per MPI-C009), then
        impose the analytic degrees of freedom actually documented in the record (cell selection,
        variable swaps, post-hoc variants as in MPI-E006, publication filtering per MPI-E015).
        Frozen criterion: does the simulated ensemble reproduce, at stated rates, the observed
        pattern of early positives, decline, and displacement across the 1986–2023 study sequence?"
      closestExisting: MPI-C008, MPI-R002, MPI-E016 — MPI-R002 reanalyzes the founding datasets backward
        under dependence-aware statistics; it does not test C008's joint-sufficiency claim, which is
        about whether the whole longitudinal pattern is reproducible from mundane mechanisms.
        MPI-E016 did this for a different psi paradigm (presentiment), not for the matrix design's
        specific structure.
      wouldSettle: If the null-plus-QRP simulation reproduces the trajectory at plausible parameter
        values, C008 is substantially confirmed and C007 loses its main evidential base; if the
        trajectory (especially the magnitude of early surpluses under dependence-corrected
        statistics) cannot be reproduced without implausible parameters, C008 is weakened and the
        anomaly claim gains standing.
      effortTier: analysis
