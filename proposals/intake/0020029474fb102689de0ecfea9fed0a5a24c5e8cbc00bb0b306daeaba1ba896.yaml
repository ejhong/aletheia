      title: "Greenland ice-core combustion aerosols at the Younger Dryas onset: annual-resolution NH4+,
        nitrate, and black-carbon proxies versus the rest of the deglaciation"
      question: "Do continuous, annually-resolved combustion-aerosol records in Greenland ice cores
        (GISP2/GRIP/NGRIP/NEEM ammonium, nitrate, and where available refractory black carbon) show
        an exceptional biomass-burning spike within ~12,870 ± 100 yr b2k, ranked against every
        century of the 15,000–11,000 yr window? Truth condition: a computable rank table — the onset
        century's peak amplitude and integrated flux relative to the distribution of all other
        centuries in the window, using published open ice-core datasets."
      closestExisting: "YDIH-C007, YDIH-E016, YDIH-E017, YDIH-E018 — E016–E018 are charcoal-compilation
        disputes over sediment records with dating uncertainty and site-selection disagreements.
        None of the ledger tests the burning claim in the one archive with annual layer counting and
        no calibration problem: Greenland ice. The ice cores either record a hemispheric combustion
        pulse at the onset or they do not, and the data are already public."
      wouldSettle: An exceptional onset-century spike would rescue C007's core empirical content
        independent of the contested sediment compilations; an unremarkable rank would show the
        'largest burning episode in 120,000 years' claim fails in the best-dated archive available.
