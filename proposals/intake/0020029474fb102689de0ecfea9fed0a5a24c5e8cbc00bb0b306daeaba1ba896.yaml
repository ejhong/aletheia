      caseSlug: megalithic-casting
      runDir: 2026-08-31-agenda-33432478115
      index: 2
      kind: research-item
      title: Radiocarbon-date the organic matter reported inside Pumapunku andesite
      question: "Obtain AMS radiocarbon dates on the organic inclusions reported by SEM/petrography inside
        Pumapunku andesite blocks (interior, below any restoration-affected surface). Decisive
        record: a C-14 age for carbon sealed within the stone matrix."
      closestExisting: GEO-C004, GEO-E006, GEO-E007, GEO-R005 — GEO-E007 reports the presence of organic
        matter but no item proposes dating it. Natural Miocene-age andesite cannot contain
        radiocarbon-live organics in its interior; a geopolymer cast in antiquity should.
      wouldSettle: A date in the range ~0–2000 BP for interior organics would be near-decisive for casting
        (GEO-C021). Radiocarbon-dead or contamination-consistent results (surface biofilm,
        consolidant carbon per GEO-R005's audit) would undermine the organic-inclusion argument
        entirely.
      effortTier: lab
