      question: "Convert every published YDB magnetic-microspherule peak (spherules per kg) into a flux
        (spherules per cm² per yr) using each site's published sedimentation rate and sampling
        thickness, and compare against frozen benchmarks: published modern micrometeorite flux,
        Holocene lake and peat spherule backgrounds, and anthropogenic/volcanic spherule
        accumulation rates. Decisive record: a computable table where each site's peak either
        exceeds or falls within documented background flux ranges."
      closestExisting: YDIH-C004, YDIH-E015, YDIH-R001, YDIH-R002 — E015 showed markers accumulate in
        ordinary wetlands qualitatively; R001 audits sites and chronology but not flux
        normalization; R002 tests reproducibility, not whether even reproduced peaks are
        quantitatively anomalous. No item computes whether claimed concentrations require anything
        beyond slow sedimentation concentrating normal infall.
      wouldSettle: If most claimed peaks fall within background flux once normalized, the four-continent
        spherule layer (C004) loses evidentiary force even where counts replicate. If several sites
        exceed background by orders of magnitude, the assemblage demands an exceptional source and
        sharpens the target list for R002.
