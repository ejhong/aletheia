      index: 1
      kind: research-item
      title: "Interaction test on the 2023 online dataset: is the true-RNG vs pseudo-RNG split itself
        significant?"
      question: "Obtain the Flores & Rapazote-Flores 2023 dataset and compute a direct interaction
        statistic (permutation-based difference in excess-correlation counts between RNG conditions,
        with power matched by subsampling). Truth condition: the between-condition difference is or
        is not significant at the preregistered-style threshold once uneven n and multiple
        comparisons are accounted for."
      closestExisting: MPI-C503, MPI-R003, MPI-E008 — MPI-C503 records only the
        significant/non-significant split, which can arise with no real difference between
        conditions ('the difference between significant and not significant is not itself
        significant'). MPI-R003 proposes a new, adequately powered lab experiment; nothing on the
        ledger tests whether the existing 2023 data even show a statistically supported RNG-type
        difference — a desk analysis that should precede or accompany the lab investment.
      wouldSettle: A significant interaction would establish that the 2023 split is a real feature of the
        data needing explanation (and sharpen R003's priors); a null interaction would show C503's
        headline split is an artifact of uneven power and thresholding, deflating the
        quantum-flavored reading before any new experiment is run.
      effortTier: desk
