    case: vasocomputation
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-08-27-agenda-33059577648/vasocomputation/1
      caseSlug: vasocomputation
      runDir: 2026-08-27-agenda-33059577648
      index: 1
      kind: research-item
      title: "Pharmacological dissection: does a smooth-muscle-selective vasodilator release tender points
        when a skeletal-muscle agent does not?"
      question: "In palpation-identified tender points, does topical/iontophoretic smooth-muscle-selective
        vasodilation (e.g., nitroglycerin or a calcium-channel blocker) produce objective release
        (algometry threshold, elastography stiffness, Doppler flow) significantly more than (a) a
        skeletal-muscle-targeted comparator (e.g., low-dose local lidocaine or botulinum at motor
        endpoint) and (b) vehicle control, in a within-subject randomized crossover? Decisive
        record: the three-arm objective-release table."
      closestExisting: VASO-R001, VASO-R004, VASO-C020, VASO-C010 — R001 images a manual release but
        cannot say which tissue compartment (vascular smooth muscle vs skeletal muscle vs nerve)
        maintains the state; R004 tests the latch in animal/ex-vivo preparations, not in the human
        tender point itself. Neither pharmacologically separates the two muscle types in vivo.
      wouldSettle: If smooth-muscle vasodilators release points while skeletal-muscle agents and vehicle
        do not, the vascular-maintenance core of C020 gains direct human support. If
        lidocaine/botulinum releases points and vasodilators do not, the classical
        skeletal-muscle/endplate account is favored and C020's central mechanism is undermined.
      effortTier: lab
