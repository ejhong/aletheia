  - id: ea634b1b73d8c6d068ac8eff4b0b584b7c84ef8c54f9b6ad95cbd0188d45b321
    case: orch-or
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-09-01-agenda-33512756583/orch-or/1
      caseSlug: orch-or
      runDir: 2026-09-01-agenda-33512756583
      index: 1
      kind: study
      title: "Desk study: the coherence length Orch OR needs versus the exciton diffusion length
        microtubules show"
      question: "Derive, from each committed Orch OR parameter set (10^9 tubulins at 500 ms; 2x10^10 at 25
        ms; the 2014 beat-frequency re-scoping), the minimum spatial extent over which a single
        coherent/entangled state must span given microtubule and neuronal geometry (tubulins per
        micron of lattice, microtubules per neuron, neurons per assembly), and tabulate those
        lengths against measured energy-transport scales in polymerized microtubules — the ~6.6 nm
        electronic excitation diffusion length of ORCH-C020 and any other published
        exciton/energy-transfer lengths. Truth condition: a table of required-length versus
        measured-length values with the arithmetic shown; the comparison is decided by whether
        required lengths exceed measured lengths by orders of magnitude, by a factor, or not at
        all."
      closestExisting: ORCH-R008, ORCH-S001, ORCH-C020, ORCH-C010 — ORCH-S001/R008 tabulated times,
        tubulin counts and gravitational-self-energy geometries, and explicitly recorded that the
        corpus 'nowhere commits to a coherence length' — but stopped at documenting the silence. It
        never derived the length that the counts it did tabulate necessarily imply, and never set
        that implied length beside the one spatial transport number the case's own supporting
        evidence (ORCH-C020) supplies. ORCH-C010 asserts spatial extent 'across many tubulins'
        without quantifying what many must mean.
      wouldSettle: If the implied required extent is micron-scale-or-larger while all measured transport
        is nanometre-scale, then the case's flagship supporting optical result quantitatively
        contradicts the theory's own tubulin counts, and the spatial-extent half of ORCH-C010 fails
        on the proponents' own numbers. If the required extent can be met by chained short-range
        transfer within the committed times, the 6.6 nm figure is no obstacle and the burden returns
        entirely to coherence time (ORCH-R001).
      effortTier: desk
