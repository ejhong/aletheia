          contradiction between the epothilone-B and epothilone-D/vinblastine results by replicating
          the same endpoint — time to LORR — at more sites. Replicating a latency measure at more
          sites cannot distinguish a change in anesthetic sensitivity from a change in how fast the
          agent reaches the brain; no ledger item requires exposure at endpoint to be measured.
          ORCH-E032 flags exactly this gap in human taxane data ('not a measured dose difference')
          but no corresponding animal control exists.
