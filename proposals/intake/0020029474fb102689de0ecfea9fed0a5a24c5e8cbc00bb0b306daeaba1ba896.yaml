  - id: 354402c664496c3901942d57a351e2b1d4181124a60b745470cce7b4829fc275
    case: ccc
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-09-01-agenda-33512756583/ccc/1
      caseSlug: ccc
      runDir: 2026-09-01-agenda-33512756583
      index: 1
      kind: research-item
      title: Independent replication of the sky-twist ellipticity control against a ΛCDM null ensemble
      question: "Run Gurzadyan & Penrose's 2013 sky-twist test — searching for elliptical rather than
        circular low-variance rings — on Planck data AND on realistic ΛCDM simulations with
        anisotropic noise, and record whether the circular-vs-elliptical prevalence drop also
        appears in the simulations. Decisive record: the ratio of circular to elliptical ring-set
        counts in data versus in the ΛCDM ensemble."
      closestExisting: "CCC-C503, CCC-E006, CCC-R001, CCC-E004 — R001 folds the sky-twist test into a full
        adversarial preregistered protocol that requires both camps' cooperation and has not
        happened. This is the separable, unilateral piece: E006 reports the circular/elliptical
        asymmetry only against the proponents' own null; no critic (E002–E004, E008, E010–E012) has
        ever run the ellipticity control at all, so the one proponent argument that survives the
        null-ensemble dispute remains untested."
      wouldSettle: If ΛCDM simulations with realistic noise also show fewer elliptical than circular
        low-variance rings, the sky-twist argument fails as a Gaussianity discriminator and C503
        loses its evidential force. If the simulations show no such asymmetry while the data does,
        the proponents have a genuine anomaly that the null-ensemble critique (C003, C010) does not
        explain.
      effortTier: analysis
