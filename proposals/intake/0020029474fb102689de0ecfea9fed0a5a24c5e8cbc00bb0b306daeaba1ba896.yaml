      caseSlug: orch-or
      runDir: 2026-09-01-agenda-33512756583
      index: 2
      kind: study
      title: "Substrate audit: which physical degree of freedom carries coherence in each supporting
        evidence line, and does it match Orch OR's committed substrate?"
      question: "For each supporting evidence line in this ledger (ORCH-C020 UV/visible electronic
        excitation in tubulin tryptophans; ORCH-C021 tryptophan superradiance; ORCH-C022
        terahertz/GHz/kHz electromagnetic resonances; ORCH-C025 xenon nuclear spin; ORCH-C026 proton
        zero-quantum coherence in MRI), tabulate the physical degree of freedom whose quantum state
        is at issue, its energy scale, and its expected environmental coupling, against the degree
        of freedom Orch OR's own specification commits to (the mass-distribution difference
        realising tau = hbar/E_G, i.e. the 2.5 fm nucleon displacement between tubulin conformers).
        Truth condition: a frozen table with one row per evidence line; each row is scored
        substrate-matched, substrate-adjacent (same molecule, different degree of freedom), or
        substrate-mismatched, with the citation on which the classification rests."
      closestExisting: "ORCH-S001, ORCH-R008, ORCH-E028, ORCH-E016 — ORCH-S001 audited numbers (times,
        counts, self-energies) and ORCH-E016/E028 attack justification and independence, but nothing
        in the ledger asks the prior question of kind: whether a nuclear-spin effect in xenon, a
        proton spin coherence in MRI, and an electronic exciton in tryptophan are evidence about the
        same physical quantity the collapse criterion is written about. Without that mapping,
        supporting lines are being summed across incommensurable substrates."
      wouldSettle: If most supporting lines are substrate-mismatched or merely substrate-adjacent, then
        the affirmative case is a collection of unrelated microtubule physics results rather than
        cumulative evidence for the committed collapse mechanism, and ORCH-C010's support weakens
        independently of any replication outcome. If the lines map onto the committed
        mass-displacement degree of freedom, the aggregation is legitimate and ORCH-E028's
        independence problem becomes the only remaining discount.
      effortTier: desk
