      question: "Has any CCC proponent published (refereed paper, preprint, or documented conference
        response) a rebuttal to Eckstein 2023's argument that black-hole information loss raises
        rather than resets entropy — and if so, does it address the specific mechanism Eckstein
        identifies? Decisive record: a citation search on Eckstein 2023 plus the post-2023 CCC
        corpus, tabulating every response or its absence."
      closestExisting: CCC-C006, CCC-E017 — C006 states the proponents' entropy-accounting claim and E017
        records Eckstein's contrary argument, but the ledger contains no item establishing whether
        the objection has been answered, conceded, or ignored. The claim C006 cannot be graded while
        the state of the exchange is unrecorded.
      wouldSettle: A substantive published rebuttal would show C006 remains a live, defended claim and
        would supply the argument to evaluate. Documented silence or a non-responsive reply after
        two-plus years would establish that the entropy-reset foundation of CCC currently stands
        refuted without answer in the literature.
