      index: 2
      kind: claim
      title: Published GISP2 platinum data show a Pt/Ir ratio inconsistent with a chondritic impactor
      question: "In the published GISP2 measurements underlying the ~12.8 ka platinum anomaly (YDIH-C001),
        iridium is not enriched proportionally with platinum, yielding a Pt/Ir ratio far above
        chondritic values — a feature the original authors themselves flagged as pointing to an
        unusual, possibly non-chondritic or non-impact source. Truth condition: the tabulated Pt and
        Ir concentrations in the original publication and any subsequent reanalyses."
      closestExisting: YDIH-C001, YDIH-C011, YDIH-R003 — C001 records only that the Pt anomaly exists;
        C011 asserts diagnosticity in general; R003 proposes new lab retests. None states the
        already-published, desk-verifiable fact that the anomaly's own elemental ratios sit
        awkwardly with the standard chondritic-impact interpretation — a load-bearing point in the
        debate over what the anomaly means.
      wouldSettle: If the published data show super-chondritic Pt/Ir, the Pt anomaly cannot by itself
        certify a typical chondritic impact and C011 is weakened at its strongest proxy; if
        reanalysis shows chondritic ratios within uncertainty, the anomaly becomes materially
        stronger impact evidence.
      effortTier: desk
