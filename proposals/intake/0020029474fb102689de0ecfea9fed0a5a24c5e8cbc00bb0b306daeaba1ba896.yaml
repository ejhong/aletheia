      index: 1
      kind: claim
      title: "The Hoffman–Prakash correspondence stops at the asymptotic free particle: no published
        extension derives interactions, composite systems, or the Born rule"
      question: "Proposition: as of the latest published literature, the conscious-agent-to-quantum
        correspondence of Hoffman & Prakash 2014 has not been extended in any peer-reviewed or
        preprint work to interacting dynamics, tensor-product composition, or a derivation of the
        Born rule. Truth condition: a citation search over works citing Hoffman & Prakash 2014
        either finds such an extension (falsifying the claim) or exhausts the citation record
        without one (verifying it)."
      closestExisting: ZW-C006, ZW-E010 — ZW-C006 and ZW-E010 record what the 2014 paper proved
        (asymptotic free-particle correspondence) but neither asserts nor checks whether the program
        has advanced past that single result in the intervening decade — the ledger currently leaves
        the correspondence's scope frozen at 2014.
      wouldSettle: Finding a published extension would materially upgrade the conscious-agent program's
        standing against ZW-C002 and force revision of that claim; finding none would sharpen
        ZW-C002 into a dated, citable fact rather than an impression, and would quantify how long
        the free-particle result has stood alone.
      effortTier: desk
