      index: 1
      kind: study
      title: "Cross-study significant-cell count table: do 'failed' replications still show excess
        correlations in displaced locations?"
      question: "For every matrix experiment with a published or recoverable correlation matrix (Lucadou
        originals, Walach 2020, Nailing Jelly, Grote 2015/2017/2021, Flores 2021/2023), tabulate the
        total count of significant experimental-vs-control correlations regardless of which cells
        they fall in, against a Monte Carlo/permutation expectation. Truth condition: MPI's
        displacement account predicts the aggregate count stays elevated even where the
        preregistered cells go null; the null-plus-flexibility account predicts counts at chance in
        every constrained study."
      closestExisting: MPI-C003, MPI-C005, MPI-R001, MPI-E003, MPI-E004 — MPI-C003 asserts displacement
        and MPI-R001 would test fine-structure predictions prospectively in a new lab study; nothing
        in the ledger computes, retrospectively and uniformly across the existing corpus, whether
        the displaced-effect claim is even quantitatively true of the published matrices — including
        the null replications, which under MPI should still carry off-target excess.
      wouldSettle: Elevated counts in the blind and preregistered nulls would give MPI's displacement
        claim its first constrained empirical content; chance-level counts everywhere the analysis
        was frozen would show 'displacement' exists only where analytic freedom exists, directly
        informing MPI-C007 vs MPI-C008.
      effortTier: analysis
