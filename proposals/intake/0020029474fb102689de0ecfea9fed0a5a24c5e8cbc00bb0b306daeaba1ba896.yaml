      index: 3
      kind: study
      title: "Frozen-criteria formal comparison: earliest Eucharistic texts against Jewish meal-blessing
        and mystery-cult meal formularies"
      question: Scoring the earliest Eucharistic texts (1 Cor 11:23-26, Mark 14:22-25, Didache 9-10,
        Justin, 1 Apol. 65-67) on criteria fixed in advance — blessing/thanksgiving formula and its
        addressee, cup-then-bread vs bread-then-cup order, presence of berakhah/birkat ha-mazon
        structure, eschatological ingathering language, dilution of wine, initiatory secrecy
        language, named cult founder as dying-and-rising deity — do they cluster with attested
        Second-Temple Jewish meal formularies (Qumran 1QS 6, m. Berakhot, Passover haggadah strata)
        or with attested mystery-cult meal texts (Mithraic, Attis/Cybele, Andanian and Eleusinian
        synthemata)?
      closestExisting: TIK-C013, TIK-E022, TIK-E023, TIK-R006 — TIK-E022 and TIK-E023 are single-text
        observations offered as rebuttals; TIK-R006 audits the Greek pharmacological and epigraphic
        sources, not the liturgical corpus. Nothing in the ledger converts the Jewish-vs-mystery
        question into a scored, replicable table with criteria set before scoring — TIK-C013 is
        currently adjudicated by citation of authorities rather than by a comparison anyone can
        re-run.
      wouldSettle: If the earliest texts score with the Jewish comparanda on most fixed criteria, TIK-C013
        fails on its own formal terms and TIK-C012's inheritance claim loses its liturgical footing.
        If they score with mystery-cult formularies, TIK-C013 gains a non-anecdotal basis
        independent of any pharmacological claim.
