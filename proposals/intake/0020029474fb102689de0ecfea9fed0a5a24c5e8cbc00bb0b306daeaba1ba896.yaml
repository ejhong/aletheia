          and brain tissue concentration by gas chromatography at endpoint — rather than latency
          alone. Decisive record: paired concentration-at-LORR values for both arms. Truth
          condition: the 69 s / 29 s latency difference is pharmacodynamic if concentration at LORR
          is higher in treated animals, and pharmacokinetic/confounded if concentration at LORR is
          equal while uptake kinetics differ (respiratory depression, cardiac output, blood-gas
          partitioning, chamber washin)."
