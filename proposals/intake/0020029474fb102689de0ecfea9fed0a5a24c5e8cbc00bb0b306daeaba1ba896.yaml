    case: orch-or
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-08-31-agenda-33432478115/orch-or/1
      caseSlug: orch-or
      runDir: 2026-08-31-agenda-33432478115
      index: 1
      kind: study
      title: Does xenon isotope potency track nuclear spin or atomic mass? A regression on the published
        isotope data
      question: "In the published xenon isotope anesthesia dataset (Li et al. 2018 and any prior
        isotope-potency reports), does the residual potency difference survive controlling for
        atomic mass? Truth condition: fit potency (EC50/MAC-equivalent) against (a) nuclear spin
        present/absent and (b) atomic mass number, using the reported per-isotope values and their
        stated errors; the spin coefficient is either significant with mass in the model, or it is
        not, because in that dataset the spin-bearing isotopes (129, 131) are also the lightest
        tested."
      closestExisting: "ORCH-C025, ORCH-E014, ORCH-E034, ORCH-R002 — ORCH-C025/E014/E034 record the
        spin-versus-polarizability framing and the proponent reading of it, but no ledger item tests
        the obvious non-quantum confound: mass-dependent differences in diffusion, solubility, and
        uptake kinetics between isotopes. ORCH-R002 concerns anesthetic action on a microtubule
        optical observable, not the xenon animal-potency data. Nothing on the ledger has run the
        two-covariate model on the numbers already published."
      wouldSettle: If the spin coefficient survives with mass in the model (and the mass coefficient is
        null or wrong-signed), the isotope result becomes one of the few surviving quantum-specific
        anesthesia observations and raises the burden on ORCH-C004. If potency ordering is collinear
        with mass and the spin term is not separately identified, ORCH-C025's inference is
        unsupported by its own dataset and the item should be re-scoped to 'awaiting a mass-matched
        isotope pair'.
      effortTier: desk
