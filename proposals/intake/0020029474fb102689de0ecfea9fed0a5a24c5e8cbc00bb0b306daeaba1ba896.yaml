      kind: study
      title: Blind head-to-head of the profile-sharpness statistic and the artifact-morphology classifier
        on a shared labeled corpus
      question: "When the profile statistic behind TRN-E003 and the automated morphology classifier behind
        TRN-E004 are both applied blind to a single frozen corpus — the nine 1950 marks, the 1952
        triple, confirmed stars of matched magnitude, and cataloged plate defects of each known type
        — do they disagree systematically, and which one better separates the known-label classes?
        Decisive record: a confusion-matrix table per method per defect class, criteria frozen
        before scoring."
      closestExisting: TRN-E003, TRN-E004, TRN-C002, TRN-R003 — E003 and E004 reach opposite conclusions
        about the same nine objects using different metrics, and no ledger item adjudicates the
        conflict. TRN-R003 validates the coma discriminant in a lab setting; it does not test the
        two already-published, contradictory desk metrics against each other on a common labeled
        sample.
      wouldSettle: If the profile statistic outperforms on known labels and still places the nine on the
        sharp side, the E004 undermining weakens materially. If the morphology classifier
        outperforms and groups the nine with defects, TRN-C002's evidentiary weight drops. If both
        perform poorly on known defects, neither metric supports strong conclusions and per-source
        arguments must rest elsewhere.
