      runDir: 2026-08-27-agenda-33059577648
      index: 1
      kind: research-item
      title: Stable C/O isotope comparison of pyramid blocks versus Mokattam/Tura quarry limestone
      question: "Do δ13C and δ18O values of calcite in disputed pyramid core and casing blocks fall within
        the natural isotopic envelope of Mokattam Formation / Tura quarry limestone, or do they show
        the depleted/reset signatures expected if calcite was dissolved and reprecipitated in a
        lime- or natron-based binder? Decisive record: paired isotope measurements (published or
        newly commissioned on existing curated fragments, e.g. the Lauer and British Museum samples)
        plotted against a prespecified quarry reference field."
      closestExisting: GEO-C030, GEO-R003, GEO-E017, GEO-E019, GEO-E021 — C030 and R003 argue that
        trace-element quarry matching is blind to H/C/O chemistry but stop at critique; E017 probes
        H via NMR on one fragment; nobody in the ledger proposes the direct C/O isotope test that
        would exploit exactly the chemistry C030 says is being ignored.
      wouldSettle: Isotopes matching the natural quarry field across sampled blocks would remove the
        'methods are blind' escape hatch for those blocks; isotopically reset calcite in some blocks
        (outside the quarry envelope, consistent with recrystallization at low temperature with
        meteoric or natron-derived fluids) would be strong physical-chemistry support for GEO-C020.
      effortTier: records
