        repeatedly cite anomalously low density / high trapped-air porosity in pyramid blocks, but
        no ledger item tabulates the actual published numbers against quarry baselines. GEO-R003
        audits provenance chemistry, not physical properties; GEO-E018/E019 are petrographic, not
        gravimetric.
      wouldSettle: Block values sitting inside the natural quarry envelope would remove the density
        argument for GEO-C020 entirely; systematic outliers concentrated in specific courses or
        casing stones would identify exactly which blocks merit destructive sampling.
