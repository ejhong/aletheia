  - id: 000ca5fc9f354a22a76a914182e16941b124ad741300d479201f69bb9c9e4ca1
    case: megalithic-casting
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-08-31-agenda-33432478115/megalithic-casting/1
      caseSlug: megalithic-casting
      runDir: 2026-08-31-agenda-33432478115
      index: 1
      kind: study
      title: Sample-identity concordance table for all published Giza limestone analyses
      question: For every published analysis cited in this ledger (Barsoum 2006, the NMR casing study,
        Folk & Campbell, Harrell & Penrod, Jana, Freestone & Middleton, Davidovits' own samples),
        what exact physical specimen was examined — findspot, block type (core vs casing vs debris),
        collection date, chain of custody — and do any pro-cast and anti-cast conclusions rest on
        the same specimen versus disjoint specimens? Frozen-criteria table answerable from the
        papers' methods sections and museum accession records.
      closestExisting: GEO-E012, GEO-E017, GEO-E019, GEO-E020, GEO-E021, GEO-R005 — GEO-R005 audits
        restoration history of the monuments, not the provenance of laboratory specimens. The
        evidence items each report one analysis; nothing in the ledger asks whether the supporting
        and undermining results are contradictions on the same material or merely results on
        different rocks.
      wouldSettle: If pro-cast and anti-cast results never share a specimen, the apparent contradiction
        dissolves into a sampling question and the claim reduces to 'some blocks, not all.' If the
        same specimen (e.g., the Lauer sample) yields opposite readings under different techniques,
        the dispute is methodological and GEO-C030's methods critique becomes central.
      effortTier: desk
