      kind: claim
      title: The decline/displacement prediction does not follow deductively from GQT's published
        formalism without unstated auxiliary assumptions
      question: "Proposition: no published derivation shows the decline, sign-change, or displacement of
        matrix correlations as a formal consequence of GQT's axioms plus the no-transmission axiom
        alone; every published derivation relies on additional informal assumptions (e.g., what
        counts as 'signal use', the timescale of decline, where displacement lands) not present in
        the formalism. Truth condition: line-by-line examination of the derivations in the GQT
        foundations paper and the theorists' NT-axiom texts (MPI-E009, MPI-E010) — either a gapless
        deduction exists or it does not."
      closestExisting: MPI-C004, MPI-C005, MPI-C010, MPI-E009, MPI-E010 — MPI-C005 records what proponents
        assert the axiom entails; MPI-C010 concerns how they use it rhetorically; the retired
        chronology proposal asked when the derivation was stated. None assesses whether the
        derivation is formally valid — i.e., whether 'decline and displacement' is a theorem or a
        verbal gloss with free parameters.
      wouldSettle: A gapless derivation would strengthen MPI-C005 and make MPI-R001's binding
        fine-structure predictions genuinely extractable from theory; identified unstated
        auxiliaries would support MPI-C010's insulation charge by locating exactly where the
        theory's flexibility enters.
