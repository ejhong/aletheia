        boundary sediments, does the reported evidence (electron diffraction patterns, FFT spacings,
        EELS spectra) satisfy the mineralogical diagnostic criteria established in the
        crystallography literature (e.g., Németh et al. 2014, which showed claimed lonsdaleite is
        indistinguishable from faulted/twinned cubic diamond and graphene–diamond aggregates)? Truth
