      kind: research-item
      title: Inventory of curated, securely contexted Eleusis vessels actually available for sampling
      question: "Which excavated vessels from the Eleusis sanctuary (kernoi, plemochoai, kotylai, and
        other drinking/pouring forms) survive with secure stratigraphic context, and where are they
        curated, unwashed or washed, with what conservation history? Decisive record: Eleusis
        excavation catalogues and the accession/conservation registers of the Eleusis Archaeological
        Museum and the National Archaeological Museum, Athens."
      closestExisting: TIK-R001, TIK-E009 — TIK-R001 calls for residue analysis and TIK-E009 records that
        none has been done — but neither establishes whether a sampleable assemblage exists.
        Conservation washing, consolidants, and lost context can make the empty cell permanently
        empty; nobody has checked. This is the prerequisite record that determines whether TIK-R001
        is a fundable protocol or an impossible ask.
      wouldSettle: If a set of unconsolidated, securely contexted vessels is curated and identifiable,
        TIK-R001 becomes a concrete sampling protocol and the 'never tested' framing becomes an
        indictment of inaction. If surviving vessels are washed, consolidated, or context-stripped,
        the empty cell is structural, and both sides' appeals to future chemistry at Eleusis must be
        discounted accordingly.
      effortTier: records
