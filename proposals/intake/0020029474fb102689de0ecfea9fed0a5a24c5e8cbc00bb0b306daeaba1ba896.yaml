      kind: research-item
      title: "Selectivity test for the multiway–ZX embedding: do classical and supra-quantum process
        theories embed just as easily?"
      question: "Decisive analysis: determine formally whether the Gorard et al. embedding technique that
        maps the ZX-calculus into multiway rewriting systems also embeds (a) a classical stochastic
        process theory and (b) a supra-quantum GPT category (e.g., one hosting PR-box correlations).
        The record is a constructive embedding or an obstruction proof for each case."
      closestExisting: "ZW-E014, ZW-C007, ZW-C002 — ZW-E014 already flags the embedding as 'compatibility,
        not inevitability', but no item operationalizes that flag: nothing in the ledger tests
        whether the multiway framework is promiscuous (embedding non-quantum theories equally well)
        or genuinely selective toward quantum structure."
      wouldSettle: If classical and supra-quantum categories embed with the same ease, the ZX result
        carries no evidential weight for Wolfram's derivation claim (strengthening ZW-C002 and the
        circularity charge in ZW-E012); if a principled obstruction blocks the non-quantum
        embeddings, the ruliad program would gain its first selectivity result and ZW-C007 would
        need upgrading.
      effortTier: analysis
