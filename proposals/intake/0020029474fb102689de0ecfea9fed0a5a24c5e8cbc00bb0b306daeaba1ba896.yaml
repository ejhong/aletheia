  - id: a31f057bee175cedb97ca321066d231c3f5807b6fd0bd1354c3f36c1f9909c78
    case: vasocomputation
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-09-01-agenda-33512756583/vasocomputation/1
      caseSlug: vasocomputation
      runDir: 2026-09-01-agenda-33512756583
      index: 1
      kind: study
      title: "Frozen-criteria table of direct tissue oxygenation and perfusion measurements at trigger
        points: sign, magnitude, and ischemic threshold"
      question: "Across primary studies that measured tissue oxygen tension, oxygenation
        (NIRS/spectroscopy), or perfusion (Doppler, contrast, laser speckle) at palpated
        trigger/tender points versus matched control muscle in the same subject, what is the
        direction and magnitude of the difference, and does any study report values crossing an
        accepted ischemic threshold (e.g., pO2 below the level at which nociceptor-sensitizing
        mediators accumulate)? Decisive record: a preregistered table with one row per primary
        measurement (tissue, modality, control site, reported values, threshold comparison, whether
        measurement was made before any provocation or manual contact)."
      closestExisting: VASO-C005, VASO-C020, VASO-E006, VASO-E007 — C005 asserts only that active sites
        'differ measurably' in blood flow, and E007 is an imaging review of distinctness — neither
        fixes the sign or magnitude. C020's causal chain requires specifically chronic local
        ischemia; E006 documents an acidic mediator milieu, which is consistent with ischemia but is
        not a perfusion measurement. Several Doppler reports describe increased or altered-waveform
        flow rather than reduced flow, and nothing in the ledger reconciles that with the ischemia
        premise.
      wouldSettle: If the table shows consistent reduced perfusion/oxygen tension at or below ischemic
        thresholds, the ischemia link in C020 gains a direct measured basis. If the dominant finding
        is unchanged or increased flow with only waveform differences, the ischemia premise is
        unsupported at the measurement level and C020 must be restated as a mediator/sensitization
        claim without a perfusion mechanism.
      effortTier: desk
