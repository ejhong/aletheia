  - id: 0bc35ba06b83793ac6c1fc6c29db37ccfec4fd2b8a9eb8547a3f4fe6bc94679b
    case: vasocomputation
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-09-01-agenda-33512756583/vasocomputation/3
      caseSlug: vasocomputation
      runDir: 2026-09-01-agenda-33512756583
      index: 3
      kind: research-item
      title: "Agonist-washout with simultaneous energetics in pressurized skeletal-muscle arterioles: the
        one experiment the latch economy argument requires"
      question: In pressurized skeletal-muscle resistance arterioles, establish constriction with a
        defined agonist, then wash out the agonist while continuously recording diameter, myosin
        light-chain phosphorylation, and an energetic readout (oxygen consumption or
        ATP/phosphocreatine). Does constriction persist after activation is withdrawn, and if so,
        does energetic cost fall while force is maintained?
      closestExisting: VASO-R004, VASO-S001, VASO-E019, VASO-E020 — S001 documents that no located study
        combines the right caliber, an energetic readout, and stimulus withdrawal — persistence
        after withdrawal is untested at every caliber — but it is an evidence map, not an
        experiment. R004 proposes creating tender-point-like regions in animals and measuring there;
        it does not specify the isolated-vessel washout protocol at arteriole caliber with
        contemporaneous energetics, which is the only design that tests the economy premise directly
        and cheaply.
      wouldSettle: If constriction persists after washout with falling energetic cost, latch is
        demonstrated in the target compartment and the C010→C020 inferential step is closed. If
        constriction relaxes on washout, or persists at undiminished energetic cost, the
        chronic-knot mechanism cannot rest on latch and requires ongoing activation.
      effortTier: lab
