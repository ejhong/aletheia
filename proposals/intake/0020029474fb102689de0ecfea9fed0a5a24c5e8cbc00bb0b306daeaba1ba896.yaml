      question: "Proposition: the 2026 two-postulate version of algorithmic idealism contains no mechanism
        permitting fundamental information deletion from self-states, and its text still identifies
        erasure/forgetting as an open problem. Truth condition: the published 2026 paper either (a)
        exhibits a state-change law under which self-state information can decrease, or (b) does not
        — decidable by reading the paper's formal definitions and its open-problems discussion."
      closestExisting: ZW-C504, ZW-E002, ZW-R005 — ZW-C504 records the erasure problem as acknowledged in
        earlier expositions; ZW-E002 logs the 2026 paper only for its reconstruction-is-unfinished
        admission; ZW-R005 proposes building an erasure map ourselves. None of them settles whether
        the newest formal version of the theory has already addressed or restructured the problem,
        which determines whether R005 is live or moot.
      wouldSettle: If the 2026 formulation permits deletion, ZW-C504 needs revision and R005 should target
        the new law instead. If it does not, C504 is confirmed as current and the erasure problem
        stands as an unaddressed structural gap across both formulations of the program.
