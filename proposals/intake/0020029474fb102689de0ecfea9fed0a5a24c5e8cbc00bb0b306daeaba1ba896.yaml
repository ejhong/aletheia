        and the agenda tests emulsion, statistics, and future imaging — but no item seeks the era's
        own records of what human-made objects were actually aloft over the southwestern US on the
        two canonical nights. This is the one mundane near-Earth explanation with a paper trail.
      wouldSettle: A documented balloon or vehicle in the field at exposure time would provide a prosaic
        reflector for the flashes, undermining TRN-C023 while supporting TRN-C020/C021's 'light
        during exposure, near Earth' core. Complete, well-covered logs showing nothing aloft in
        those fields would close the human-hardware explanation and sharpen the residual anomaly.
