      question: "Obtain declassified and archival operation records — Skyhook/Project Mogul-lineage
        balloon launch logs, USAF/Navy flight schedules, White Sands and other rocket-range firing
        logs — covering 12 April 1950 and 19 July 1952, and determine whether any documented
