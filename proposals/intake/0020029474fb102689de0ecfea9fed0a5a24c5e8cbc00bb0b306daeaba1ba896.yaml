      index: 1
      kind: research-item
      title: Baseline frequency of Claviceps in Iberian Iron Age non-ritual food and storage contexts
      question: "In published archaeobotanical and dental-calculus datasets from Iron Age Iberia (and
        comparable Mediterranean grain-agriculture assemblages), how often do Claviceps purpurea
        sclerotia or ergot alkaloid markers appear in ordinary storage, threshing, and
        domestic-consumption contexts? Decisive record: a compiled table of published assemblages
        with ergot presence/absence, sampling method, and context type."
      closestExisting: TIK-C004, TIK-R004, TIK-R008 — C004 states only that ergot was identified at Mas
        Castellar; R004 proposes lab re-analysis of the same materials, which can confirm presence
        but cannot tell ritual intent from agricultural contamination; R008 sets a denominator for
        psychoactive additives in ritual vessels, not for ergot as a routine cereal parasite in
        everyday grain contexts.
      wouldSettle: If ergot turns up commonly in ordinary Iberian storage/consumption contexts, the Mas
        Castellar find loses its evidentiary weight for deliberate preparation and becomes a
        background contaminant signal. If ergot is rare or absent outside the sanctuary context, the
        find's association with a deliberate preparation is materially strengthened.
      effortTier: desk
