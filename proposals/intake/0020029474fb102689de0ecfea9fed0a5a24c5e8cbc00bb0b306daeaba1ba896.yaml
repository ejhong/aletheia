    proposal:
      id: 2026-08-27-agenda-33059577648/zero-worlds/2
      caseSlug: zero-worlds
      runDir: 2026-08-27-agenda-33059577648
      index: 2
      kind: research-item
      title: Scope conditions and published rebuttals of the Fitness-Beats-Truth theorem
      question: "Obtain and analyze the published critiques and replies to the FBT theorem (e.g.,
        responses arguing that truth-tracking wins under monotonic fitness functions, structured
        environments, or when perception cost is modeled) and determine, from the formal statements,
        the exact class of payoff/environment structures for which the 'generic' claim in ZW-C501
        holds. Decisive record: the theorem statements and counter-models in the peer-reviewed
        exchange following Prakash et al."
      closestExisting: ZW-C006, ZW-C501, ZW-E011 — ZW-C501 and ZW-E011 record the theorem as proven and
        supportive, but no item examines the published counter-analyses or the genericity
        assumptions; the ledger currently treats FBT's scope as settled when the literature contests
        it.
      wouldSettle: Finding that FBT's genericity survives the rebuttals under broad conditions would
        strengthen the evidential base of Hoffman's program (ZW-C006); finding that it holds only
        for non-monotonic fitness functions or specific payoff constructions would demote FBT from a
        load-bearing result to a special-case lemma, qualifying ZW-C006 and ZW-E011.
      effortTier: desk
