      title: "Publication chronology: was the decline/displacement derivation stated before or after the
        matrix declines were observed?"
      question: "Compile date-stamped publications and preprints to establish whether the NT-axiom
        derivation of decline, sign-change, and displacement (as claimed in MPI-C005) appeared in
        print before the first observed decline in the correlation-matrix program, or was
        articulated only after declines emerged. Truth condition: earliest explicit published
        statement of the decline/displacement prediction predates the first matrix study showing
        decline."
      closestExisting: MPI-C005, MPI-E009, MPI-C010 — MPI-E009 documents the derivation in the theorists'
        own words and MPI-C005 asserts it holds 'in advance of any data,' but no item in the ledger
        establishes the actual chronology — prediction versus retrodiction — which is decidable from
        publication dates alone.
      wouldSettle: A pre-decline derivation would substantially strengthen MPI-C005 and weaken the
        insulation charge in MPI-C010 (a risky prediction that came true); a post-hoc articulation
        would show the decline 'prediction' was fitted to known results, supporting MPI-C010.
      effortTier: desk
