      wouldSettle: If comparable-precision matches are abundant under the enumerated degrees of freedom,
        the coincidences carry no evidential weight and GEO-C900 should be demoted. If the audit
        shows the matches are genuinely rare after honestly counting free parameters, the claim
        survives as an open anomaly.
