        replication failures generally; R002 is a prospective multi-lab blind test on new material.
        None audits the already-published lonsdaleite identifications against the specific
        crystallographic criteria that critics say they fail — a purely desk exercise on existing
        published micrographs and diffraction data.
      wouldSettle: If most claims fail the criteria, the flagship 'diagnostic impact proxy' collapses on
        the existing record without new lab work; if several claims pass, lonsdaleite survives as
        the strongest remaining proxy and sharpens what R002's blind test must target.
