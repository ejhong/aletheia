      title: Blind validation of the multinuclear NMR cast-stone diagnostic on known natural vs.
        geopolymer limestone
      question: When the NMR protocol used to read the Bent Pyramid casing fragment as 'Tura grains in
        artificial calcium-silicate gel' is applied blind to a panel of known samples — natural
        Tura/Mokattam limestone, weathered natural limestone, and lab-made re-agglomerated limestone
        — does it correctly classify them at a prespecified error rate?
      closestExisting: GEO-E017, GEO-E020, GEO-E013, GEO-R003 — GEO-E017 reports the positive NMR result
        on one disputed fragment but no blind validation; GEO-E020 validated petrography with a
        geopolymer positive control, not NMR; GEO-R003 audits whether methods could see binders in
        principle, not whether this specific method performs when tested. No item establishes the
        NMR technique's false-positive rate on weathered natural limestone.
      wouldSettle: Correct blind classification would make GEO-E017 the strongest surviving pro-cast datum
        and force the natural-stone side to explain it; misclassification of weathered natural
        samples as 'artificial gel' would neutralize GEO-E017 and substantially weaken GEO-C020.
