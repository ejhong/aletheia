      kind: study
      title: Positional cross-consistency of reported circle centers and Hawking points across datasets
        and papers
      question: Compile every published sky coordinate (or recoverable position) of low-variance circle
        centers and Hawking points from GP2010, GP2013, MNR2013, AMN2017, AMNP2020, and the critics'
        reproductions, and compute, under a frozen matching radius, the fraction of features that
        (a) recur across WMAP and Planck, (b) recur across the proponents' own successive papers,
        and (c) fall inside the three anisotropy regions of C504 versus the Galactic mask and
        foreground-residual maps.
      closestExisting: CCC-S001, CCC-C504, CCC-C001, CCC-E009 — S001 tabulates significances and
        signal-model provenance but not spatial coordinates; E009 asserts Planck–WMAP co-location
        only for Hawking points and only per the proponents. No item computes whether the reported
        feature positions are mutually consistent across the whole literature or correlate with
        mask/foreground geometry.
      wouldSettle: High cross-dataset, cross-paper positional recurrence away from foreground structures
        would support real sky features independent of any significance dispute (bearing on C009);
        poor recurrence or clustering along mask/foreground boundaries would support the artifact
        account (C010) by a route independent of null-ensemble arguments (C003).
      effortTier: analysis
