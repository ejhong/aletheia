      question: "Decisive record: a clause-by-clause reconstruction of the hypotheses and proof of
        Müller's 2020 Bell-violation result, answering one computable question — do the theorem's
        premises bound achievable correlations at the Tsirelson value (S ≤ 2√2), at the algebraic
        maximum (S ≤ 4), or leave the bound undetermined?"
      closestExisting: ZW-C005, ZW-E001, ZW-R002 — ZW-R002 asks for a new theorem forbidding supra-quantum
        correlations; ZW-C005 and ZW-E001 record that a preliminary Bell result exists. None of them
        pins down what the existing proof already establishes — whether it merely shows Bell
        violation is possible (consistent with PR boxes) or already excludes supra-quantum behavior,
        which determines how much of R002 remains open.
      wouldSettle: Finding the proof allows S up to 4 would confirm that algorithmic idealism currently
        underdetermines the quantum bound, giving ZW-C009's steelman a precise citation; finding it
        already implies the Tsirelson bound would partially discharge ZW-R002 and significantly
        strengthen ZW-C005.
