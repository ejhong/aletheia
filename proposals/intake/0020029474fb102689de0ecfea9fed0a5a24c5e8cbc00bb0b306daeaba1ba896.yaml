      index: 1
      kind: study
      title: Kinematic consistency of linear alignments with geosynchronous glint tracks
      question: "For every reported multi-transient linear alignment (the 1950 nine, the 1952 triple, and
        the seven Doherty plates), do the line orientations and inter-source spacings match the
        sky-projected track of a single object at geosynchronous-like altitude — i.e., orientation
        consistent with the local GEO track direction at that field's declination and hour angle,
        and spacings consistent with constant angular velocity (~15 arcsec/s) times plausible glint
        intervals? Frozen criteria: computed GEO track position angle ±tolerance, spacing-ratio test
        against constant-rate motion, compared to a null of random-orientation artifact clusters."
      closestExisting: TRN-C104, TRN-E018, TRN-C021, TRN-C003 — C104 and E018 only report that alignments
        exist; C021 asserts near-Earth reflectors. No item computes whether the specific geometry of
        the alignments (orientation, spacing) matches what a GEO-altitude object would actually
        trace on these plates, which is a pure desk calculation from published coordinates and
        exposure metadata.
      wouldSettle: Consistent orientations and constant-rate spacings across events would strongly support
        a near-Earth moving-object origin and disfavor plate defects; random orientations or
        spacings incompatible with any single angular rate would undermine the glint-track reading
        of C104 and weaken C021.
      effortTier: desk
