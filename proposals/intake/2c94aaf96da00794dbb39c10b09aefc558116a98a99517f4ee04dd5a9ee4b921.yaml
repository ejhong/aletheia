          context: '{"question":"Do securely documented views and contexts of Göbekli Tepe Pillar 43 and the
            proposed Metropolitan Museum comparator, accession 32.143.7, support a resemblance more
            specific than a rectangular form beneath an arch?","inclusion":"Admit observations only
            from institutional object records, excavation publications or original research
            explicitly identifying one of the two objects. Images must be traceable to that object,
            with credit or provenance and a documented date or date range; distinguish object dating
            from photographic dating and report uncertainty. Require a full scene or a reliably
            located detail before coding spatial relationships. Record exact verified page, figure,
            accession or section locators. Separate visible features from published interpretations
            such as container, handle or architecture. Preserve damaged or obscured features as
            unobservable rather than absent. Use the existing webpage and Birdmen material only as
            discovery routes unless separately verified for the particular observation. Multiple
            photographs and publications of one object remain dependent.","disconfirmers":"The
            proposed resemblance would strengthen if authenticated, unaltered views share several
            preselected structural features beyond the generic rectangle-and-arch outline. It would
            weaken if the apparent match depends on cropping, redrawing, restoration or inconsistent
            object identification; if arch attachment, internal detail, repetition or scene
            relationships differ; or if contextual evidence supports distinct referents, such as a
            carried implement versus a stationary motif. A large chronological separation without
            connecting evidence limits any transmission inference but does not by itself refute
            inheritance. Functional constraints could explain a simple shared outline. If identity,
            dating or adequate views cannot be established, report the comparison as unready; a
            search miss is not evidence that parallels or historical connections do not
            exist.","reason":"This institutional catalogue offers a newly surfaced route beyond the
            rate-limited object page, potentially documenting original placement and a captioned
            view of the exact accession. The reported doorway placement remains unverified. Its
            images and descriptions would concern the same object, not provide an independent
            comparator.","observationToCheck":"Does the catalogue explicitly assign accession
            32.143.7 to the west jamb of a particular doorway? Record the exact page or figure and
            the stated evidentiary basis, distinguishing documented placement from
            reconstruction."}'
