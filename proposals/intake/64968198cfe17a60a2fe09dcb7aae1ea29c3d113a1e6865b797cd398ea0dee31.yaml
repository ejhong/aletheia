idence for this relief and no assessed comparison between it and Pillar 43. The illustration therefore poses a question; it cannot carry a finding about shared identity, meaning, or ancestry. In particular, the arch-topped forms on the pillar have not been established as handled vessels.\n\nThe strongest argument for deep inheritance would be more than a similar outline: an unusual combination of forms, relationships, and meanings recurring in securely documented contexts, with a chronology and connecting evidence consistent with transmission. That possibility deserves a test. Nothing in the present ledger supplies the necessary cross-cultural sequence.\n\nSeveral explanations remain live. A resemblance might result from independent invention or common constraints on depicting objects. It might reflect borrowing between connected communities without requiring a much deeper common source. Different motifs could have different histories. Or a comparison might weaken once the complete scenes and uncertain identifications are considered. The two local observations do not distinguish these alternatives.\n\n## What would move the question forward?\n\nA useful next study would define one comparison before searching widely: specify the features being matched, establish the objects’ provenance and dating, and include nonmatching examples as well as attractive matches. Multiple photographs of the same carving should count as one object, not repeated support. Intermediate examples and contextual correspondences would matter more than another isolated resemblance.\n\nThese are proposed tests, not completed research. No comparative results, failed predictions, or independently documented transmission sequence are recorded here. That absence limits the assessment; it is not evidence that transmission never occurred.\n\n**The wider question remains unresolved.** The present evidence supports a narrow description of Pillar 43, not a history of shared myths. The research opportunity