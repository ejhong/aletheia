            reason: Seek excavation-team or original archaeological documentation of the upper forms, their
              dating and full-scene relationships, including contextual interpretations that
              challenge a handled-container reading. English and German terminology broadens access
              to primary publications without expanding the object scope or assuming the motifs’
              identity.
