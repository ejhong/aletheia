      reconsider: null
      plan:
        question: Do securely documented views and contexts of Göbekli Tepe Pillar 43 and the proposed
          Metropolitan Museum comparator, accession 32.143.7, support a resemblance more specific
          than a rectangular form beneath an arch?
        whyNow: "MEM-C002 establishes only a description of Pillar 43’s upper motifs. The assessment
          identifies the missing authenticated comparison, chronology and contextual differences as
          prerequisites to evaluating inheritance. The Met object is a founding-scope lead, not
          admitted evidence: previous retrievals failed with HTTP 429. Retrying through
          accession-based institutional discovery could add the missing object record rather than
          repeat an adjudicated reading. No existing research question or completed comparative test
          addresses this pair."
        scope: "Freeze this pass to Pillar 43’s three upper-register forms and Met accession 32.143.7.
          Establish both objects’ identity, dating basis, archaeological context and image
          provenance before comparing them. Preselect these features: body outline, arch attachment,
          internal markings, number and arrangement, relation to hands or bodies, and relation to
          adjacent animals. Consult at most four directly relevant institutional records or original
          research publications found through the two queries or their references. Exclude other
          distant comparators, myth parallels and a search for intermediate transmission links. The
          endpoint is a documented pairwise resemblance-and-difference record, not a statistical
          test or a verdict on prehistoric inheritance."
        inclusion: Admit observations only from institutional object records, excavation publications or
          original research explicitly identifying one of the two objects. Images must be traceable
          to that object, with credit or provenance and a documented date or date range; distinguish
          object dating from photographic dating and report uncertainty. Require a full scene or a
          reliably located detail before coding spatial relationships. Record exact verified page,
          figure, accession or section locators. Separate visible features from published
          interpretations such as container, handle or architecture. Preserve damaged or obscured
          features as unobservable rather than absent. Use the existing webpage and Birdmen material
          only as discovery routes unless separately verified for the particular observation.
          Multiple photographs and publications of one object remain dependent.
        disconfirmers: The proposed resemblance would strengthen if authenticated, unaltered views share
          several preselected structural features beyond the generic rectangle-and-arch outline. It
          would weaken if the apparent match depends on cropping, redrawing, restoration or
          inconsistent object identification; if arch attachment, internal detail, repetition or
          scene relationships differ; or if contextual evidence supports distinct referents, such as
          a carried implement versus a stationary motif. A large chronological separation without
          connecting evidence limits any transmission inference but does not by itself refute
          inheritance. Functional constraints could explain a simple shared outline. If identity,
          dating or adequate views cannot be established, report the comparison as unready; a search
          miss is not evidence that parallels or historical connections do not exist.
        queries:
          - query: site:metmuseum.org "32.143.7"
            purpose: primary
            reason: Locate the accession’s official record, institutional publication or alternate museum
              delivery route to verify identity, date, provenance and depicted attributes. Earlier
              URL retrievals were rate-limited, not substantively negative. Accession-based
              discovery may recover documentation needed to admit or reject this specific
              comparator.
          - query: '"Göbekli Tepe" ("Pillar 43" OR "Pfeiler 43") (iconography OR Rechtecke OR interpretation)'
            purpose: counterevidence
            reason: Seek excavation-team or original archaeological documentation of the upper forms, their
              dating and full-scene relationships, including contextual interpretations that
              challenge a handled-container reading. English and German terminology broadens access
              to primary publications without expanding the object scope or assuming the motifs’
              identity.
