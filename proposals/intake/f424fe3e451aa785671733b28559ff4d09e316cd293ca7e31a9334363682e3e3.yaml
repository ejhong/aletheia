      title: Untrailed profiles bound glint duration at GEO altitude to well under one second
      question: "Proposition: given the GEO sidereal-frame angular rate (~15 arcsec/s) and the measured
        FWHM of the canonical detections (~few arcsec, sharper than stars), the absence of
        measurable trailing implies flash durations ≲0.2 s if the sources were at
        geosynchronous-like altitude. Truth condition: a computed trail-length model versus measured
        elongation for each canonical source, with the duration bound following arithmetically."
      closestExisting: TRN-C002, TRN-C102, TRN-R002, TRN-E003 — C002/C102/E003 discuss sharpness as
        evidence of short flashes; R002 calibrates emulsion response to flash duration. None derives
        the kinematic duration bound that untrailed images impose on a moving near-Earth object,
        which couples the sharpness data to the altitude hypothesis and constrains the physical
        scenario (e.g., tumbling-reflector spin rates).
      wouldSettle: If measured elongations imply sub-0.2-s glints, any physical model behind C022/C023
        must accommodate very fast specular events; if some canonical sources show elongation
        consistent with longer durations at GEO rates, that is positive kinematic evidence of
        near-Earth motion, while stellar-round profiles with zero elongation are equally consistent
        with stationary emulsion defects.
      effortTier: analysis
