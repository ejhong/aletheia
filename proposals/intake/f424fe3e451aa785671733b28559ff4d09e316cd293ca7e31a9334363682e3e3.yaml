      title: "Coded case-report table: do RSPK phenomena displace rather than repeat, per MPI-C501?"
      question: "Take the published RSPK/poltergeist case collections cited by MPI's proponents (and Watt
        & Tierney's case sources), freeze coding criteria in advance, and code each documented case
        for: (a) whether phenomena repeated at previously observed loci/forms when observers
        attended to them, and (b) whether novel phenomena appeared at unattended loci/forms.
        Question: does the displacement pattern claimed in MPI-C501 hold in the case literature at a
        rate distinguishable from what selective reporting of novelty would produce?"
      closestExisting: MPI-C501, MPI-R005, MPI-E013 — MPI-C501 asserts the pattern but the ledger contains
        no systematic test of it; MPI-R005 is an expensive prospective field replication. A
        frozen-criteria coding of the existing case literature is answerable at a desk and would
        tell us whether R005 is worth mounting.
      wouldSettle: A robust displacement pattern across coders would give MPI-C501 documentary support and
        justify MPI-R005; a pattern indistinguishable from novelty-biased reporting (or coder
        disagreement so high the construct won't operationalize) would undercut the field-side
        evidence base for MPI's displacement claim.
      effortTier: desk
