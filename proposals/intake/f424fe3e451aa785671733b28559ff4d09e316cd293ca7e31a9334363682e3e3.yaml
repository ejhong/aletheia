        assumptions; the ledger currently treats FBT's scope as settled when the literature contests
        it.
      wouldSettle: Finding that FBT's genericity survives the rebuttals under broad conditions would
        strengthen the evidential base of Hoffman's program (ZW-C006); finding that it holds only
        for non-monotonic fitness functions or specific payoff constructions would demote FBT from a
        load-bearing result to a special-case lemma, qualifying ZW-C006 and ZW-E011.
