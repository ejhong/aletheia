      kind: study
      title: What else releases in seconds? A time-constant table for every candidate tissue mechanism
        behind the rapid-release inference
      question: "For each physiological mechanism that could plausibly produce an objectively measurable
        change at a tender point within seconds — skeletal-muscle EMG silencing after
        pressure/stretch, vascular smooth-muscle relaxation after vasodilator or flow restoration,
        axon-reflex cutaneous vasodilation, fascial thixotropic/viscoelastic recovery, autonomic
        sudomotor and vasomotor shifts with exhalation — what are the published onset and offset
        time constants measured with an instrumented readout? Decisive record: a frozen-criteria
        table, one row per mechanism per primary measurement, with modality, stimulus, and measured
        latency/time constant."
      closestExisting: VASO-C011, VASO-C004, VASO-R001 — C011 states a dichotomy (seconds-scale release
        implies active state, not remodeled structure) and R001 proposes imaging one release event,
        but neither establishes how many distinct active mechanisms live on the seconds timescale.
        Without that, even a successful R001 imaging run cannot attribute the release to vascular
        smooth muscle rather than to skeletal-muscle relaxation or viscoelastic recovery.
      wouldSettle: If multiple non-vascular mechanisms have published seconds-scale time constants
        overlapping the reported release, C011's inference narrows to 'an active state' with
        vascular attribution unresolved, and R001 must add discriminating channels (EMG, skin blood
