      question: For each of the ~35 extinct North American megafaunal genera, what is the youngest
        directly-dated, taphonomically secure last-appearance date, and what fraction of genera have
        terminal dates statistically indistinguishable from 12,870 ± 30 BP versus terminal dates
        centuries-to-millennia earlier or with no reliable terminal date at all? Criteria (direct
        AMS dates on bone/dentin, chemical pretreatment quality, stratigraphic security) frozen
        before compilation.
      closestExisting: YDIH-C008, YDIH-C022, YDIH-R001, YDIH-E025 — C008 asserts consistency with a
        concentrated extinction but no item computes it; R001 audits impact-proxy sites, not faunal
        chronology; E025 is a single 2009 analysis predating over a decade of new direct dates and
        Signor–Lipps modeling. No existing item produces a per-genus table testing synchrony with
        the YD onset specifically.
      wouldSettle: If most datable genera have terminal dates overlapping ~12.8 ka, the extinction–event
        link (C022) survives its necessary chronological precondition; if terminal dates are
        staggered across the terminal Pleistocene or most genera lack adequate dates, C022's
        'contributed substantially' claim loses its empirical anchor regardless of whether an impact
        occurred.
