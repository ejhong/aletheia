      kind: claim
      title: QBism's Born-rule derivation is conditional on the unproven existence of SICs in every
        dimension
      question: "Proposition: the QBist route from the urgleichung to the Born rule requires a symmetric
        informationally complete POVM in each finite dimension, and SIC existence remains unproven
        in general (Zauner's conjecture: proven only for a finite list of dimensions plus numerical
