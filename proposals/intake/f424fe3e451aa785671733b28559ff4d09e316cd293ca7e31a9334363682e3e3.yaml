        kind: study
        title: Monte Carlo audit of Great Pyramid dimensional coincidences under a frozen constant
          dictionary
        question: Given the published ranges of royal-cubit estimates, pyramid dimensions, and site
          coordinates, and a prespecified dictionary of 'notable' constants (π, e, φ, c, g, Earth
          radii, etc.) with frozen tolerance rules, what is the expected number of hits by chance,
          and do the claimed coincidences (cubit ≈ π/6 m, latitude ≈ 29.9792) exceed that
          expectation?
        closestExisting: GEO-C900 — C900 is a featured claim with no research item, study, or evidence
          behind it; the ledger contains nothing that quantifies the look-elsewhere effect that any
          evaluation of numerical coincidences requires.
        wouldSettle: If chance alone produces comparable or more hits under the frozen rules, C900 loses its
          evidentiary force; if the claimed matches are far outside the null distribution (e.g., <1%
          expected), C900 gains a defensible statistical footing instead of anecdote.
        effortTier: analysis
