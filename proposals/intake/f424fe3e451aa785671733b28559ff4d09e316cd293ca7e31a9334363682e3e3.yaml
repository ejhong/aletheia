      kind: study
      title: Chance-alignment null calibration for the reported linear transient alignments
      question: "Given the measured per-plate surface density of ML-scored candidates, do the linear
        alignments reported on seven plates (TRN-E018) exceed the number expected from random point
        placement? Decisive computation: frozen alignment definition (collinearity tolerance,
        minimum multiplicity, maximum span), then Monte Carlo scatter of equal-count random catalogs
        per plate, yielding an expected-alignment table and per-plate p-values."
      closestExisting: "TRN-C104, TRN-E018, TRN-R004 — TRN-C104 and TRN-E018 report that alignments exist
        but the ledger contains no null model: with thousands of candidates per plate, some 3-point
        near-lines are guaranteed by chance. TRN-R004 reconstructs the catalog but does not test
        alignment significance. No study item exists at all."
      wouldSettle: Alignments significantly above the chance rate would establish a genuine spatially
        correlated process (physical objects on a shared path, or a directional plate/copy defect)
        and make TRN-C104 evidentially meaningful. Alignments consistent with chance would retire
        the alignment argument entirely as support for near-Earth objects.
      effortTier: analysis
