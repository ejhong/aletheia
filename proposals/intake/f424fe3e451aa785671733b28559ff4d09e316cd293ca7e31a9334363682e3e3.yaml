        grain and region), the reported lye-hydrolysis conversion yield to LSA/iso-LSA (TIK-E008),
        and published LSA threshold/active doses (TIK-E012), compute the distribution of
        active-dose-equivalents per gram of sclerotia, and the mass of sclerotia required for the
        attested annual initiate cohort. Frozen criteria fixed before extraction: which
        alkaloid-content sources, which yield figure, which active-dose figure."
      closestExisting: TIK-C006, TIK-R003, TIK-E008, TIK-E012 — C006 asserts a dose achievable from about
        a gram of ergot without showing the arithmetic; R003 proposes lab profiling of one
        reconstructed extract, which does not address variance in natural sclerotia potency or the
        aggregate quantity a mass initiation would require; E008 reports a conversion, E012 reports
        human LSA pharmacology, but no item multiplies them out.
      wouldSettle: If the computed per-gram dose is robustly active across the published potency range and
        the annual sclerotia requirement is a plausible harvest quantity, the pharmacological
        feasibility of C006 is quantitatively supported. If active doses require sclerotia masses at
        the top of the potency range or harvest volumes implausible for an unrecorded supply chain,
        C006 and by extension C007 are quantitatively strained.
      effortTier: analysis
