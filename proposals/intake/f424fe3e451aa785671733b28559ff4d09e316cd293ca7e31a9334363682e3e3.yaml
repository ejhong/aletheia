      title: "Supra-clinical multiples: concentrations used in microtubule anesthetic experiments versus
        free clinical concentrations"
      question: "For every cited experiment reporting an anesthetic effect on a microtubule or tubulin
        observable (Kalra et al. etomidate/isoflurane at 50 uM, Emerson photolabeling, Craddock
        modeling inputs, and any others in the corpus), what is the ratio of the applied
        concentration to the free aqueous concentration at 1 MAC or at clinical plasma free
        concentration? Truth condition: a frozen table with one row per experiment, applied
        concentration, cited clinical reference concentration with source, and the computed
        multiple; frozen inclusion criteria and search declared in advance."
      closestExisting: ORCH-C020, ORCH-C011, ORCH-R002, ORCH-S001 — ORCH-S001 tabulated the theory's
        timing and tubulin-count commitments, not the pharmacological dosing of the supporting
        experiments. ORCH-R002 lists missing controls for a future prospective series but does not
        audit the concentrations already used in the published record, and ORCH-C020 states 50 uM
        without any clinical anchor. No ledger item lets a reader see whether the observed optical
        effects occur at concentrations a patient ever experiences.
      wouldSettle: If the median multiple is near unity, the microtubule optical effects are clinically
        relevant and ORCH-C011/C020 strengthen materially. If the effects are demonstrated only at
        tens-to-hundreds-fold clinical free concentrations, then ORCH-C002's bridge from binding to
        unconsciousness has a quantitative gap that any future ORCH-R002 series must close, and the
        featured claims should carry that multiple on their face.
      effortTier: desk
