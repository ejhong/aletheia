      kind: claim
      title: No modeled airburst regime produces the claimed >1,500 °C ground-surface melting over
        dispersed continental sites without leaving a crater or detectable shock field
      question: "Proposition: published airburst physics (Tunguska-class simulations, thermal-pulse
        scaling, and the meteoritics literature on melt formation) provides no parameter regime in
        which fragmenting-comet airbursts generate sustained ground temperatures above ~1,500–2,200
        °C at widely dispersed sites while producing neither craters nor pervasive shock
        metamorphism in target quartz. Truth condition: an analysis compiling
        burst-altitude/energy/thermal-fluence combinations from the modeling literature and checking
        whether any satisfies the melt claims of C005 and the no-crater constraint of C009
        simultaneously."
      closestExisting: YDIH-C005, YDIH-C012, YDIH-C009 — C005 asserts the melt products exist, C012
        asserts the comet scenario is astronomically viable, and C009 records the absent crater —
        but no ledger item tests whether the three are physically co-satisfiable. The joint
        constraint (extreme surface temperatures, no crater, no regional shock signature) is where
        the scenario is most falsifiable, and the modeling literature to test it already exists.
      wouldSettle: If a viable regime exists, C012 gains a concrete physical pathway and specifies what
        field signatures (glass geochemistry, thermal gradients) it must leave; if none exists, the
        high-temperature melt evidence and the no-crater airburst scenario cannot both be right,
        forcing revision of C005's interpretation or C012's mechanism.
      effortTier: analysis
