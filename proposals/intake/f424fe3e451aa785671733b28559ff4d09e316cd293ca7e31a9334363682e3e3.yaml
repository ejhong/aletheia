      kind: research-item
      title: "Pharmacokinetic control for the epothilone loss-of-righting-reflex effect: measure agent
        concentration at endpoint, not time to endpoint"
      question: "In epothilone-B-treated and vehicle animals, measure the actual anesthetic exposure at
        the moment of loss of righting reflex — end-tidal or arterial isoflurane concentration, and
        brain tissue concentration by gas chromatography at endpoint — rather than latency alone.
        Decisive record: paired concentration-at-LORR values for both arms. Truth condition: the 69
        s / 29 s latency difference is pharmacodynamic if concentration at LORR is higher in treated
        animals, and pharmacokinetic/confounded if concentration at LORR is equal while uptake
        kinetics differ (respiratory depression, cardiac output, blood-gas partitioning, chamber
        washin)."
      closestExisting: ORCH-R004, ORCH-C023, ORCH-C024, ORCH-E032 — ORCH-R004 resolves the direction
        contradiction between the epothilone-B and epothilone-D/vinblastine results by replicating
        the same endpoint — time to LORR — at more sites. Replicating a latency measure at more
        sites cannot distinguish a change in anesthetic sensitivity from a change in how fast the
        agent reaches the brain; no ledger item requires exposure at endpoint to be measured.
        ORCH-E032 flags exactly this gap in human taxane data ('not a measured dose difference') but
        no corresponding animal control exists.
      wouldSettle: If concentration at LORR is elevated in treated animals, the epothilone effect is a
        genuine potency shift and ORCH-C023 survives as pharmacodynamic evidence, sharpening the
        contradiction with ORCH-C024. If concentration at LORR is unchanged, both the acute and
        chronic epothilone results may be measuring drug delivery rather than anesthetic
        sensitivity, and the entire microtubule-stability-versus-susceptibility line (ORCH-C012)
        loses its animal-behavioural support regardless of how ORCH-R004 comes out.
