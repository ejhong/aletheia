    proposal:
      id: 2026-08-31-agenda-33432478115/vasocomputation/3
      caseSlug: vasocomputation
      runDir: 2026-08-31-agenda-33432478115
      index: 3
      kind: claim
      title: Published latch-state durations are shorter than knot chronicity, so a chronic knot requires
        ongoing re-activation, not latch alone
      question: "Proposition: the maximum force-maintenance duration measured in any published
        latch-bridge preparation after activating signals subside is on the order of minutes to
        hours, which is shorter than the weeks-to-months persistence attributed to muscle knots;
        therefore the latch state alone cannot account for knot chronicity without a sustained or
        recurrent activating input. Truth condition: extract the longest documented post-stimulus
        force-maintenance interval from the latch literature and compare it to documented knot
        persistence durations."
      closestExisting: VASO-C010, VASO-C020, VASO-E003, VASO-E017 — C010 says force is maintained 'for
        prolonged periods' without quantifying; C020 asserts knots are held latch states without
        addressing the timescale mismatch; E017 raises the memory gap conceptually but no item makes
        the timescale comparison an explicit, checkable proposition.
      wouldSettle: If confirmed, C020 must be amended to include a maintained driver (e.g., ongoing
        sympathetic or local nociceptive input), constraining the mechanism and the interventions
        that could release it; if refuted by published multi-day latch maintenance, the latch-only
        account of chronicity survives and the timescale objection is retired.
      effortTier: analysis
