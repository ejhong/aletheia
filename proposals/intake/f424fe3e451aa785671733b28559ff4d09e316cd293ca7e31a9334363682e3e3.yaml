        (per Petaev et al. 2013's published depth series) postdates the initiation of the
        δ18O/deuterium-excess transition marking the Younger Dryas onset by a resolvable number of
        annual layers. Truth condition: align the published Pt depth series with the published
        isotope depth series on the same core and count the offset; the claim is true if Pt rise
        begins measurably after the climate transition begins, false if it precedes or is
        indistinguishable from it."
