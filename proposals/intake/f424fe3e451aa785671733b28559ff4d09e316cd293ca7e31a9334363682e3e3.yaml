        signal, where annual layer counting removes almost all dating uncertainty and directly tests
        cause-before-effect.
      wouldSettle: If Pt begins after the climate transition, the anomaly cannot record the trigger of the
        cooling, undercutting C021 regardless of the Pt source. If Pt leads or is simultaneous
        within counting error, the temporal prerequisite for a causal role survives at the one
        archive with the best chronology.
