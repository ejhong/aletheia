  - id: 03422245ceefc346e05fd46d13594a9a9c0a873d16ff3864bd78f53b82bc14cf
    case: zero-worlds
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-08-27-agenda-33059577648/zero-worlds/1
      caseSlug: zero-worlds
      runDir: 2026-08-27-agenda-33059577648
      index: 1
      kind: study
      title: Cross-reconstruction axiom concordance table
      question: "Across the major operational reconstructions (Hardy 2001, Masanes–Müller 2011,
        Chiribella–D'Ariano–Perinotti 2011, plus later sets such as Selby–Scandolo–Coecke), which
        axioms are logically shared, which are equivalent modulo the others, and which single axiom
        set has the smallest 'residue' that an observer-first program would still need to derive?
        Frozen criteria: for each axiom, classify as (a) provably implied by
        intersubjective-regularity assumptions already present in Müller's framework, (b) plausibly
        derivable, or (c) irreducibly structural, citing the published proofs of inter-axiom
        relations."
      closestExisting: ZW-R003, ZW-C001, ZW-E006, ZW-E007, ZW-E008 — ZW-R003 commits to deriving one axiom
        set (purification-first) but no item compares the sets to determine which is the cheapest
        target; ZW-C001 only asserts that reconstructions exist. The published equivalences and
        dependencies among axiom sets are known literature and computable at a desk, but nothing in
        the ledger tabulates them.
      wouldSettle: Finding that one axiom set's residue after subtracting Müller-derivable content is a
        single structural axiom would sharpen ZW-C010 into a concrete conjecture and possibly
        redirect ZW-R003; finding that all sets share the same large irreducible core would quantify
        the steelman in ZW-C009 as a fixed explanatory debt no target-shopping can reduce.
      effortTier: desk
