        computable comparison of required versus permitted lifetimes and energy-injection rates."
      closestExisting: CCC-C007, CCC-E018, CCC-E019, CCC-R002 — R002 designs a detector-side search for
        erebon signals; C007 and E018 state the hypothesis. None of these checks the hypothesis
        against the existing decaying-dark-matter constraint literature, which is a desk exercise
        with published numbers on both sides. The retired LIGO-noise proposal concerned the
        correlated-noise premise, not lifetime bounds.
      wouldSettle: If the erebon-required decay rate violates published lifetime or energy-injection
        bounds, C007 is excluded by existing data before any dedicated search is built, and R002's
        motivation collapses. If it survives all bounds, the table fixes the allowed rate window
        that any R002 search protocol must target — a concrete input for preregistration.
