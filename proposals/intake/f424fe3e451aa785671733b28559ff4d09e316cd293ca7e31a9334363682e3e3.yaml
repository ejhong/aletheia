      title: Do the three anisotropic ring-center regions coincide with Planck noise and foreground
        anisotropy?
      question: "Frozen-criteria analysis: take the published 1134 concentric-set centers (An et al. 2020,
        CCC-C504), and compute their spatial correlation with Planck hit-count/noise-variance maps,
        foreground-residual maps, and the analysis mask geometry, against an isotropic null. Truth
        condition: a correlation coefficient with confidence interval for each systematic template,
        computed with the center list and templates fixed before analysis."
      closestExisting: CCC-C504, CCC-E004, CCC-E012 — E004 showed anisotropic noise makes circle counts
        unremarkable in aggregate, and E012 blames few-pixel artifacts, but no item tests the
        specific, striking 2020 datum — 83% of centers in ~3% of the sky — against the actual
        spatial pattern of instrument noise and foregrounds. The proponents offer the anisotropy as
        evidence for a real pre-Big-Bang sky; the critics have never engaged this particular
        statistic positionally.
      wouldSettle: Strong correlation of the three regions with noise/foreground structure would convert
        the proponents' headline anisotropy into direct evidence of a systematic origin (supporting
        C010). No correlation with any systematic template would leave the anisotropy as an
        unexplained feature the critics' accounts do not cover, strengthening C009's evidential
        position.
      effortTier: analysis
