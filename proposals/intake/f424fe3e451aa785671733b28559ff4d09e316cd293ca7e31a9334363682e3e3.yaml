      question: "In published archaeobotanical and dental-calculus datasets from Iron Age Iberia (and
        comparable Mediterranean grain-agriculture assemblages), how often do Claviceps purpurea
        sclerotia or ergot alkaloid markers appear in ordinary storage, threshing, and
