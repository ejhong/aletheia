  - id: 03546361e94aa7ab6e3150cb3f7d7fa3b01f136d609d269c2edce90f89bcafae
    case: zero-worlds
    stage: agenda-proposal
    decision: proposed
    source: null
    proposal:
      id: 2026-09-01-agenda-33512756583/zero-worlds/3
      caseSlug: zero-worlds
      runDir: 2026-09-01-agenda-33512756583
      index: 3
      kind: study
      title: "Local-friendliness inequality violation across theory classes: does Bong 2020 discriminate
        among observer-first ontologies?"
      question: "Frozen-criteria desk table: for each theory class (finite quantum theory, classical
        probability, Spekkens toy theory, box-world/PR correlations, and the
        generalized-probabilistic setting of Jones & Müller), record from published results whether
        the class can violate the local-friendliness inequalities tested in Bong 2020, and whether
        each observer-first program's stated commitments (absoluteness of observed events, locality,
        no-superdeterminism) place it inside or outside the excluded conjunction. Decisive record:
        the Bong 2020 assumptions plus the Jones & Müller generality theorem plus each program's
        published ontological commitments."
      closestExisting: "ZW-E004, ZW-E018, ZW-C003 — ZW-E004 records that the Wigner's-friend structure is
        not specifically quantum, and ZW-E018 records that Bong 2020 prices observer-independence
        without deciding ontology — but no item computes the cross table: which specific frameworks
        in this case actually sit inside versus outside the experimentally excluded region, and
        hence which are constrained by the experiment at all."
      wouldSettle: If algorithmic idealism and conscious-agent theory land outside the excluded
        conjunction (e.g., by rejecting absoluteness of observed events), the extended
        Wigner's-friend result imposes no cost on them and ZW-C003's 'constrains conjunctions'
        framing should note which programs escape and how. If some program's commitments place it
        inside, the experiment becomes direct evidence against that program — a concrete, currently
        unrecorded discriminator.
      effortTier: desk
