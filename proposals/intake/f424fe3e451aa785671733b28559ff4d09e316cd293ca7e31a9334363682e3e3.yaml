      title: Per-event solar glint geometry audit for the canonical 1950 and 1952 detections
      question: "Using the recorded exposure start/end times and field coordinates, compute for each
        canonical event whether specular solar reflection toward Palomar from an object at
        geosynchronous-like altitude was geometrically possible: Sun position, Earth-shadow cone at
        GEO along the line of sight, and required mirror-normal orientation. Decisive record: the
        plate logs' exposure timestamps plus standard ephemerides."
      closestExisting: TRN-C005, TRN-R005, TRN-C021, TRN-E011 — C005/R005/E011 treat the Earth shadow as
        an ensemble statistic over ~107,875 candidates. No item performs the per-event geometric
        feasibility check for the two canonical events on which C021–C023 principally rest.
      wouldSettle: If the line of sight at exposure time intersects the shadow cone at GEO altitude, or
        the required glint geometry is impossible, the sunlight-reflection explanation for those
        events is falsified; feasible geometry keeps C021 live but does not prove it.
