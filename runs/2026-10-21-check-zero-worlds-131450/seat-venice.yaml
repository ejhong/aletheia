caseAssessment:
  verdict: mixed
  loadBearing: [ZW-C001, ZW-C002, ZW-C004, ZW-C010]
  weakestLinks: [ZW-C004, ZW-C008, ZW-C009]
  synthesis: >-
    The case splits cleanly along its own rung structure, and the split is
    the finding. On the observation rung the ledger is unusually solid:
    the quantum reconstruction theorems (ZW-E006, ZW-E007, ZW-E008) are
    genuine, independently checkable mathematics, and the empirical
    benchmarks (ZW-E017, ZW-E018) fix concrete numbers — S = 2.42 ± 0.20
    against a local bound of 2 and a Tsirelson cap of 2√2 — that any
    claimed derivation must hit. On the mechanism rung each observer-first
    program owns real but bounded results: Müller has a proven asymptotic
    emergence theorem plus a self-described preliminary Bell result resting
    on "too many assumptions" (ZW-E001, ZW-E003); Hoffman has the FBT
    theorem and a formal free-particle correspondence that sits well below
    the Spekkens bar (ZW-E010, ZW-E011, ZW-E015); Wolfram's program has its
    most ambitious formal quantum paper label its own central derivation a
    conjecture, stipulate the Born rule, and obtain CHSH violation from
    explicit nonlocality (ZW-E020). The attribution rung is where the case
    lives, and here the evidence cuts against the featured thesis without
    refuting it: the gap claim ZW-C002 is confirmed from inside the flagship
    program (ZW-E003, ZW-E023), the physicalist steelman (ZW-C009) is
    reinforced by QBism's own concession (ZW-E009), and both parties to the
    adversarial collaboration agree the framework's probabilities cannot yet
    be connected to repeatable, intersubjectively checkable experiments
    (ZW-E021). Steelmanning the other direction: nothing in the ledger
    refutes observer-first ontology; it shows the program is young,
    formally honest, and missing exactly one theorem (ZW-C010), which is a
    different and more interesting state of affairs than failure. The
    overall verdict is mixed because proven theorems and an unbridged,
    currently untestable central thesis coexist; the case's own two-stage
    architecture — reconstructions proven, bridge missing — is accurate as
    the evidence stands. No provisional-only claims were treated as
    evidence; no verdict here hangs on an unread abstract alone.
  steelman: >-
    The strongest unanswered argument for the featured hypothesis is the
    preliminary Bell theorem itself: Müller's 2020 paper contains a valid,
    published result proving that Bell-inequality violation together with
    preservation of no-signalling "can sometimes be expected" from
    observer-state dynamics plus universal induction — a genuinely
    nonclassical statistical signature emerging from non-material
    primitives, which this assessment has not shown to be an artifact of
    its assumptions, only recorded the author's own caution that the
    assumption set is too heavy. A proponent can rightly add that Müller is
    the same person who co-authored a full quantum reconstruction
    (Masanes–Müller 2011), so the program's founder demonstrably commands
    both ends of the bridge; the untested prediction is that shrinking the
    2020 result's assumptions (ZW-R002) is a feasible incremental step, not
    a hope, and nothing in this ledger proves otherwise.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    confidence: high
    reasoning: >-
      Three independent reconstruction theorem sets are documented with
      verified primary sources (ZW-E006, ZW-E007, ZW-E008), each deriving
      finite-dimensional quantum theory without postulating Hilbert space
      or the trace rule. The strongest opposing consideration is
      scope: all are finite-dimensional and none derives Hamiltonians,
      locality structure, or QFT — but the claim as stated is confined to
      finite-dimensional theory and is accurate.
  - claimId: ZW-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is anchored in the program leader's own published words:
      "I hope that some nonclassical aspects of quantum theory can be shown
      to be predictions of algorithmic idealism" (ZW-E003), and the 2026
      conclusions name the quantum prediction as one of two main open
      technical problems (ZW-E023). The strongest opposing consideration,
      examined and rejected, is the Wolfram program's Gorard 2020 paper —
      but read in full (ZW-E020) it stipulates the Born rule, labels its
      central derivation a conjecture, and obtains CHSH violation from
      explicit nonlocality, so it does not close the gap.
  - claimId: ZW-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hensen 2015 (ZW-E017) and Bong 2020 (ZW-E018) establish the
      experimental constraints, and Jones & Müller (ZW-E004) show the
      Wigner's-friend structure is reproducible classically, blocking any
      reading of these experiments as ontology-discriminating. Bong's
      "friend" is a photon path, so consciousness plays no demonstrated
      role. The claim is a negative existence statement about empirical
      discrimination, which the records support; no experiment in the
      ledger separates observer-first from physicalist interpretations.
  - claimId: ZW-C004
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The emergence-theorem half is strong: ZW-E001 documents a proven
      asymptotic result in a peer-reviewed journal that observers should
      expect a lawful, computable external world. The "puzzles dissolve"
      half is now contested in print: ZW-E022 records the Boltzmann-brain
      dissolution challenged and only defended as "valid intuition, not the
      exact technical arguments," with both authors agreeing more work is
      needed on partly inaccessible self-states. The strongest opposing
      consideration is the erasure problem (ZW-C504): the theorem's bit
      model forbids forgetting, which may make it an artifact for real
      observers.
  - claimId: ZW-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is carefully hedged to match the sources: ZW-E003 quotes
      Müller calling the Bell result "a valid theorem, but 'preliminary'
      because it still rests on too many assumptions," and ZW-E023 confirms
      the sketch "needs further elaboration." The claim asserts exactly
      this, so it is accurate as stated. The strongest opposing
      consideration is that asymptotic consistency with quantum mechanics
      is conditional on quantum theory generating the data's regularities —
      but the claim states that condition explicitly.
  - claimId: ZW-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      ZW-E010 documents the free-particle wavefunction correspondence and
      ZW-E011 the proven FBT theorem; neither source claims a derivation of
      state spaces, the Born rule, or entanglement, and the case's Spekkens
      calibration (ZW-E015) prices a form-match far below Bell violation.
      The strongest opposing consideration is the 2023 Entropy work
      (SRC-HOFFMAN-2023), characterized only at abstract level and not
      weighed here — but nothing in the ledger suggests it derives general
      quantum theory either.
  - claimId: ZW-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      ZW-E012 captures Wolfram's own hedged verb ("we seem to be able to
      derive") and his admitted circularity in defining observer
      persistence; ZW-E014 and ZW-E020 show the formal results are
      embeddings or conjecture-framed constructions, not inevitability
      proofs. The strongest opposing consideration is the convergence proof
      claimed in Gorard 2020's abstract, which no one has audited — but
      unaudited claims inside the program's own journal cannot carry the
      claim's "derivations are informal" characterization down.
  - claimId: ZW-C505
    verdict: well_supported
    confidence: high
    reasoning: >-
      ZW-E020 is the strongest kind of evidence this case allows: the full
      PDF read, with page-located quotes showing the central conjecture
      wording (p. 29), the Born rule stipulated for path weights (pp. 16–17),
      and CHSH violation obtained "in much the same way as one does for
      other standard deterministic and nonlocal interpretations" (p. 52).
      The strongest opposing consideration is that the convergence-to-Hilbert-space
      proof was not audited; but the claim concerns what the paper states
      and assumes, which the direct reading establishes.
  - claimId: ZW-C008
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      The featured ontological thesis cannot currently be tested: ZW-E021
      records both the critic and the advocate agreeing that the framework's
      probability assignments cannot yet be related to repeatable,
      intersubjectively verifiable experimental statistics — a jointly
      endorsed "valid objection." It is not contradicted (PBR leaves strong
      idealism untouched per ZW-E016), and the derivation gap (ZW-C002)
      means its quantum consequence is unbuilt rather than false. The
      strongest opposing consideration is that untestability here is a
      dated status, not a permanent shield; ZW-R006 could change it.
  - claimId: ZW-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The steelman's components each have ledger support: universal
      induction's unselectivity is visible in the 2020 paper's own scope
      (any simple computable law; ZW-E001), the reconstructions deliver
      operational compression without ontology (ZW-E006–E008), and QBism's
      Born-rule concession (ZW-E009) shows even the closest first-person
      framework imports the quantum part. The strongest opposing
      consideration is that this is an interpretive claim whose "explains
      nothing specifically quantum" clause is an argument, not a theorem —
      the preliminary Bell result (ZW-C005) is precisely the seed of a
      rebuttal.
  - claimId: ZW-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim characterizes the bridge problem as precisely posed and
      unsolved; both parts hold. It rests on ZW-C001 (destination axioms
      exist and are proven) and ZW-C002 (no observer-first derivation of
      them), both well supported, and the research agenda specifies
      concrete attack routes. The strongest opposing consideration is
      ZW-E019 (Accessibility Theory), which claims an access-limitation
      derivation of the operational formalism — but from a state-realist
      ontology, so it is adjacent context that shows the problem is live,
      not that it is solved for observer-first programs.