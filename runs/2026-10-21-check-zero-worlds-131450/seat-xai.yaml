  synthesis: >-
    The case centers on whether observer-first programs (Müller's algorithmic idealism foremost, then Hoffman and Wolfram) can reverse the usual ontology—deriving a lawful external world, and specifically the quantum package, from first-person primitives rather than assuming spacetime or Hilbert space. On the observation rung the ledger is clear and strong. Three independent reconstruction theorem sets (Hardy 2001, Chiribella–D'Ariano–Perinotti 2011, Masanes–Müller 2011) rigorously recover finite-dimensional complex quantum theory from operational/informational axioms without taking the Hilbert-space formalism as primitive; this is established mathematics (ZW-C001). Equally established is the negative counterpart: none of the three observer-first programs has derived the distinctively quantum package (complex Hilbert space structure, Born rule, Tsirelson-bounded nonlocality) from its own non-material primitives, and Müller himself repeatedly names Bell violation with no-signalling, efficient quantum computation, and genuine quantum reconstruction as unfinished targets (ZW-C002, supported by his 2020 abstract, 2026 Foundations of Physics conclusions, and the aid exposition). Empirical benchmarks (loophole-free Bell tests, local-friendliness/Wigner's-friend no-gos) constrain local realism and absoluteness-of-observed-events conjunctions but supply no discrimination between observer-first ontologies and physicalist interpretations (ZW-C003). On the mechanism rung the picture is uneven. Müller's framework is formally explicit: self-states plus universal induction yield a proven asymptotic theorem that observers should expect a stable, simple, computable external world, dissolving certain first-person puzzles inside the model (ZW-C004, ZW-E001). A preliminary 2020 result shows Bell violation with no-signalling can sometimes be expected, but Müller qualifies it as resting on too many assumptions (ZW-C005). Hoffman supplies the Fitness-Beats-Truth theorem and a free-particle wavefunction correspondence yet nothing approaching general quantum theory (ZW-C006). Wolfram asserts that computational boundedness plus persistence yield GR, QM and the Second Law from the ruliad, yet the claims remain informal or conjectural; the most extended formal treatment (Gorard 2020) labels the QM derivation a central conjecture, stipulates the Born rule for multiway path weights, and obtains CHSH violation via explicit nonlocality without a Tsirelson bound (ZW-C007, ZW-C505). The attribution rung therefore stays open. The featured ontological claim—that first-person informational states plus an inductive law are sufficient and the physical world (including quantum theory) is derivative (ZW-C008)—inherits the emergence theorems but inherits the derivation gap and the current absence of publicly comparable, repeatable frequencies for its distinctive first-person predictions; both sides of the McQueen–Müller adversarial collaboration agree the probabilities are not yet linked to ordinary experimental practice. The physicalist steelman (ZW-C009) lands with force: universal induction is unselective, the reconstructions already deliver the quantum formalism ontology-free, and standard physicalist quantum theory retains the quantitative machinery of Hamiltonians and precision predictions. The decisive open problem is precisely the bridge theorem that would connect observer-first postulates to the operational principles (convex state spaces, purification, continuous reversibility, etc.) from which the reconstructions proceed, with the Tsirelson bound and Born-rule measure selection as concrete targets (ZW-C010). Because that bridge remains unbuilt, the featured hypothesis is neither confirmed nor refuted by the ledger; the case is unresolved. The strongest positive results (emergence theorems, preliminary Bell seed, reconstruction literature) and the strongest negative results (explicit admissions of unfinished quantum targets, calibration by Spekkens-style toy theories, Born-rule stipulations) coexist without contradiction once the rungs are kept separate. A single future theorem in either direction—bridge or documented obstruction—would move most of the load-bearing claims at once.
  steelman: >-
    Müller's 2020 emergence theorems already prove, inside a pure first-person bit-string model with universal induction, that observers asymptotically expect a stable external world governed by simple computable probabilistic laws, dissolving Boltzmann-brain and simulation-shutdown puzzles by first-person reasoning alone without ever positing an external ontology; that positive result stands unrebutted by any physicalist derivation of comparable ontological parsimony and supplies the concrete existence proof that a zero-worlds starting point can output lawfulness rather than chaos.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    confidence: high
    reasoning: >-
      Three independent, peer-reviewed reconstruction theorems (Hardy 2001; Chiribella–D'Ariano–Perinotti 2011; Masanes–Müller 2011) recover finite-dimensional complex quantum theory from operational and informational axioms without taking Hilbert space, complex amplitudes or the trace rule as primitives; the abstracts and source statements in ZW-E006, ZW-E007 and ZW-E008 match the claim verbatim. The strongest opposing consideration is that all three remain finite-dimensional and leave Hamiltonians, locality and QFT outside their scope, yet that limitation does not touch the claim as stated.
  - claimId: ZW-C002
    verdict: established
    confidence: high
    reasoning: >-
      No derivation of the full quantum package from the primitives of algorithmic idealism, conscious-agent theory or the ruliad appears in the ledger; Müller’s own 2026 conclusions (ZW-E023), aid exposition (ZW-E003) and 2020 abstract explicitly treat Bell violation with no-signalling, quantum computation and genuine reconstruction as open targets or “hopes,” while Hoffman and Wolfram results stop at correspondences, embeddings or conjectures. The strongest opposing consideration would be an unnoticed complete derivation, but none is present among the evidence records.
  - claimId: ZW-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hensen 2015 and Bong 2020 establish loophole-free Bell violation and local-friendliness constraints on conjunctions of assumptions (ZW-E017, ZW-E018); Jones & Müller 2026 further show that Wigner’s-friend structure can be reproduced classically (ZW-E004). Nothing in these records empirically selects observer-first ontologies over physicalist ones. The strongest opposing consideration is that future larger-scale “friend” experiments might eventually discriminate, yet the claim concerns existing experiments and is therefore intact.
  - claimId: ZW-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Müller 2020 proves, inside the algorithmic-information model, that universal induction yields an asymptotic expectation of a stable external world with simple computable laws and dissolves Boltzmann-brain transitions (ZW-E001); the two-postulate formulation is restated in 2026 (ZW-E002). The McQueen–Müller exchange (ZW-E022) shows the Boltzmann-brain dissolution is contested and that partial inaccessibility of self-states needs further work, so “dissolve” is stronger than the settled mathematics; the emergence theorems themselves stand. The strongest opposing consideration is the acknowledged erasure-problem limitation of the bit model.
  - claimId: ZW-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim accurately reports both the asymptotic consistency condition and the status of the 2020 Bell-plus-no-signalling result as a valid but preliminary theorem resting on too many assumptions, matching Müller’s own wording in the aid exposition and 2026 conclusions (ZW-E001, ZW-E003, ZW-E023). The strongest opposing consideration is that later unpublished strengthening might exist, but no such record is in the ledger.
  - claimId: ZW-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hoffman & Prakash 2014 supply the conscious-agent definition and free-particle wavefunction correspondence (ZW-E010); Prakash et al. 2021 prove the Fitness-Beats-Truth theorem (ZW-E011); no record derives state spaces, Born rule or entanglement structure from the primitives. The strongest opposing consideration is that later Entropy 2023 work might close more of the gap, yet the claim’s negative half is supported by absence across the provided evidence.
  - claimId: ZW-C007
    verdict: well_supported
    confidence: high
    reasoning: >-
      Wolfram’s 2023 essay asserts the derivation from computational boundedness and persistence while acknowledging circularity in the observer concept (ZW-E012); Gorard et al. 2020 show ZX-calculus embedding (compatibility, not inevitability) (ZW-E014); Gorard 2020 QM paper frames the central claim as conjecture, assumes the Born rule and obtains CHSH via explicit nonlocality (ZW-E020). The strongest opposing consideration is that later multiway QFT work might convert conjecture into theorem, but it is not in the ledger.
  - claimId: ZW-C505
    verdict: established
    confidence: high
    reasoning: >-
      Direct quotation from the 62-page Gorard 2020 PDF establishes that the QM derivation is labelled a “central conjecture,” that branch states and the multiway Born rule for path weights are introduced by assumption, and that CHSH violation is obtained by the same explicit nonlocality used in other deterministic nonlocal models, without a Tsirelson bound (ZW-E020). The strongest opposing consideration is a possible misreading of the continuum-limit geometry claim, yet the probability-rule and CHSH passages are unambiguous.
  - claimId: ZW-C008
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      The ontological claim is the interpretive core of algorithmic idealism and is coherent with the emergence theorems of ZW-C004, yet the ledger contains no empirical discrimination (ZW-C003) and both sides of the McQueen–Müller collaboration agree that the framework’s probabilities cannot yet be related to repeated, intersubjectively verifiable experiment frequencies (ZW-E021). The strongest opposing consideration is that the first-person exotic-scenario predictions could in principle become testable, but they are not at present.
  - claimId: ZW-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The steelman correctly notes unselectivity of universal induction, the ontology-free delivery already achieved by the reconstruction theorems (ZW-C001), QBism’s explicit concession that the Born rule is an empirical addition to Bayesian coherence (ZW-E009), and Spekkens’ demonstration that many quantum-like phenomena arise without genuine nonclassicality (ZW-E015). Physicalist quantum theory’s quantitative advantage in Hamiltonians and precision predictions is background knowledge consistent with the gap. The strongest opposing consideration is that a future bridge theorem could invert the compression argument.
  - claimId: ZW-C010
    verdict: established
    confidence: high
    reasoning: >-
      The reconstruction theorems supply the right-hand side and the observer-first programs supply incomplete left-hand sides; Müller himself treats quantum reconstruction as the relevant unfinished benchmark (ZW-E002, ZW-E023); the research agenda formalizes the missing bridge (operational principles, purification, Tsirelson, Born-measure selection) as a precisely posed open mathematical question. No record claims the bridge has been built. The strongest opposing consideration is that an unnoticed bridge already exists in the literature, but none appears among the evidence records.