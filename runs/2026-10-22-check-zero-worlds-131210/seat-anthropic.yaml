caseAssessment:
  verdict: presently_untestable
  loadBearing: [ZW-C002, ZW-C003, ZW-C004, ZW-C010]
  weakestLinks: [ZW-C010, ZW-C004, ZW-C009]
  synthesis: >-
    The ledger's three rungs separate cleanly, and the verdict follows that
    structure. I hold it with moderate confidence.

    Observation rung: firm. Finite-dimensional quantum theory has been
    reconstructed from operational principles in independent theorem sets
    (C001, established), so the right-hand half of the bridge exists as
    mathematics. The left-hand half does not exist. No observer-first
    program has derived the quantum package (C002, well supported), and the
    strongest testimony comes from inside the programs. Müller's
    peer-reviewed conclusions name genuinely quantum statistics as his
    framework's test and call its Bell explanation a sketch (E023). The
    Wolfram program's own formal paper states its quantum derivation as a
    conjecture and states the Born rule without deriving it (E020, E024).
    The experiments that exist constrain conjunctions of assumptions. They
    do not separate observer-first from physicalist ontologies (C003).

    Mechanism rung: real but bounded. Algorithmic idealism owns a genuine
    theorem: lawful, apparently objective experience follows asymptotically
    from self-states plus universal induction (C004). The theorem holds in a
    no-forgetting model that its author calls an artefact, and no
    independent rederivation is recorded. Its Boltzmann-brain "dissolution"
    is now a defended claim rather than a settled one (E022), so C004 is
    only provisionally supported. Its only quantum seed is a
    Bell-with-no-signalling theorem that its author calls preliminary
    (C005). That theorem reaches generic nonclassicality, not the 2√2 cap.
    Hoffman's and Wolfram's programs contribute a free-particle form-match,
    a perception theorem, an unaudited Hilbert-space convergence claim, and
    hedged prose (C006, C007, C505). None clears the bar of nonclassical
    statistics. The ruliad also keeps a world underneath (E013), so the
    featured thesis is in substance Müller's.

    Attribution rung. The featured thesis (C008) is presently untestable,
    and three pillars support that. First, it yields no determinate
    predictions for quantum statistics yet (C002). Second, existing
    experiments cannot discriminate it (C003). Third, by the proponent's own
    written concession, its distinctive first-person probabilities cannot
    yet be tied to repeated, intersubjective frequencies (E021, E025). I
    reject weakly_supported because demonstrated viability is not evidence
    for the thesis over a realism that also yields lawful experience. I
    reject contradicted because no no-go result exists. I reject unresolved
    because no test is in hand on which evidence could be balanced. The
    decisive question is a bridge theorem that has not yet been posed in the
    framework's own operational terms (C010).

    Steelman for: the emergence theorem derives, from one simplicity
    principle, what physicalism merely posits, namely that experience is
    law-governed. The preliminary Bell result is also the only place in an
    observer-first program where Bell violation is expected from
    first-person postulates rather than obtained from explicit nonlocality.

    Steelman against: universal induction learns whatever computable
    regularity the data contain, so quantum theory currently enters as data
    rather than as output (C005, C009). QBism concedes as much for its own
    Born rule (E009). The reconstructions already compress quantum theory
    into principles without any ontology. Hamiltonians, field theory, and
    precision predictions lie wholly outside every observer-first program.
    The physicalist side has a mirror-image gap: the reconstructions leave
    purification and continuity unexplained (E007, E008), which is exactly
    the slot observer-first programs claim.

    Priors disclosed: three points are general background, not records. The
    universal prior front-loads part of computable lawfulness. The
    quantitative content of physics is interpretation-neutral. Empirically
    equivalent interpretations cannot be separated by experiments they all
    reproduce.

    What would move the verdict: a theorem in the ZW-R002 family capping the
    framework's CHSH value at exactly 2√2 would turn the sufficiency clause
    into a passed test against Hensen-type data. That would give the thesis
    its first evidence-grade support. A proof that the maximum differs from
    2√2 would contradict that clause for the formalization in hand. Even a
    successful bridge would leave ontological exclusivity empirically
    underdetermined, unless a preregistered first-person protocol of the
    ZW-R006 kind is produced.

    Sensitivity: the record whose removal would most change this verdict is
    ZW-E025, the only record on C008 that addresses testability. The verdict
    survives without it, because E021 carries the same joint concession. It
    would also survive the loss of the whole McQueen–Müller preprint,
    because C002 and C003 independently establish the absence of
    determinate, discriminating predictions. The verdict does not hang on
    one thread.
  steelman: >-
    Jones and Müller (E004) show that the structure behind extended
    Wigner's-friend puzzles already arises in classical agent-duplication.
    That structure is Restriction A: a theory may fail to give a single
    probabilistic description of all agents' observations. The question
    "what should I expect to experience next?" under duplication,
    simulation, or Boltzmann-brain conditions is therefore not a quantum
    artefact that a world-first ontology can wait out. Nothing in this
    ledger shows physicalist quantum theory, in any interpretation,
    supplying a principled rule for those first-person probabilities.
    Algorithmic idealism supplies a determinate one: universal induction on
    self-states. This assessment grades those answers as presently
    untestable, but it never shows that a world-first ontology can answer
    the question at all. If the question is legitimate, the observer-first
    framework holds the only principled answer on record. Its resistance to
    intersubjective frequency tests may then be a property of the question
    rather than a defect of the answer.
claimAssessments:
  - claimId: ZW-C001
    verdict: established
    confidence: high
    reasoning: >-
      Three strong records (E006, E007, E008) report derivations of
      finite-dimensional complex quantum theory from operational axioms
      without postulating Hilbert space. Two are refereed (New Journal of
      Physics, Physical Review A), and the three reach the same target
      independently from different axiom sets, a theorem-level replication.
      Chiribella–D'Ariano–Perinotti locate the quantum content in
      purification and Hardy in the continuity of reversible
      transformations. Because the ledger read only abstracts, the judgment
      that the proofs are valid leans on general background: they have been
      scrutinized and extended for over a decade. Strongest opposing
      consideration: Hardy 2001 was never refereed and its axioms were later
      refined, so "rigorously" in "at least three" rests partly on its
      weakest member; all three also presuppose the generalized
      probabilistic framework, so the trace rule is derived inside an
      operational setting rather than from nothing. None of this local truth
      transfers to the observer-first thesis without the missing bridge.
  - claimId: ZW-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The flagship program's author concedes the gap in peer-reviewed print
      (E023). A successful formalization "should predict some phenomenal
      aspects of Quantum Theory", and the Bell explanation "needs further
      elaboration"; his own exposition calls the goal a hope (E003). The
      Wolfram program's formal paper labels its quantum derivation a
      conjecture, states the Born rule, and obtains CHSH violation from
      explicit nonlocality without the Tsirelson cap (E020, E024). Hoffman's
      correspondence derives no Born rule, composition, or nonclassical
      correlations (E010). Fall & Kondo's claimed derivation (E019, abstract
      only) starts from a state-realist ontology, so it does not bear on
      this claim. Strongest opposing consideration: this is a universal
      negative over a literature read only in part (Gorard by keyword
      search; the 2023 Hoffman and Wolfram-program papers not at all), and
      Gorard's unaudited convergence proof would, if sound, supply one
      component of the package. The clause naming efficient quantum
      computation as a Müller target is not attested in any evidence record,
      and this verdict does not extend to it.
  - claimId: ZW-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hensen et al. (E017) and Bong et al. (E018) each constrain a
      conjunction of assumptions. Hensen tests local realism; Bong tests
      absoluteness of observed events together with locality and
      no-superdeterminism. Bong's "friend" is a photon path, so neither
      touches first-person states. The non-discrimination limb rests chiefly
      on a logical point rather than on any single record. Every
      interpretation that reproduces quantum statistics is consistent with
      these outcomes, and observer-first programs do not yet make
      determinate predictions for them (C002). Jones & Müller (E004, abstract
      only) add that the Wigner's-friend structure arises classically.
      Strongest opposing consideration: local-friendliness violations do tax
      theories committed to absolute events, and scaled to genuine observers
      they would pressure single-world physicalism. Perspectival physicalist
      views (Everettian, for instance; background) are equally untaxed, so
      that line does not run between observer-first and physicalist
      ontologies.
  - claimId: ZW-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Müller's refereed 2020 paper (E001, strong) and the two-postulate
      reformulation (E002) support the core claim. Within an explicit
      self-state model, lawful, apparently objective experience is a proven
      asymptotic consequence of universal induction, not a postulate.
      Strongest opposing consideration: the theorem lives in an idealized
      bit model whose lack of forgetting Müller himself calls "unmotivated,
      unrealistic, and an artefact" (E023). Its induction is uncomputable,
      its constants are machine-dependent, it is characterized here from
      abstract and exposition, and it has never been independently
      rederived. The "dissolve" clause also overstates. McQueen's
      Boltzmann-brain objection drew only "valid intuition, but not the
      exact technical arguments"; both authors agree that partial
      accessibility of self-states is insufficiently treated (E022); and
      simulation shutdown has no dedicated record. From background, not
      records: the universal prior mixes computable measures, which softens
      "not an assumption".
  - claimId: ZW-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      Müller's own words (E003) state the 2020 result exactly as claimed: "a
      valid theorem, but 'preliminary' because it still rests on too many
      assumptions". E001 places it in the Quantum paper, and E023 repeats
      that it needs elaboration. The conditional-consistency clause is not
      quoted in any record. It follows from E001 plus the general property
      (background) that universal induction converges on any computable
      measure generating the data. Strongest opposing consideration: the
      claim is accurate but thin in implication. "Consistent if quantum
      theory generates the regularities" is exactly the unselectivity that
      C009 exploits. Bell violation with no-signalling that "can sometimes
      be expected" is generic nonclassicality, shared by super-quantum
      no-signalling models, not the Tsirelson-bounded set that E017
      benchmarks. The characterization rests on an abstract and a living web
      page.
  - claimId: ZW-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The publisher full text (E010) confirms conscious agents defined by
      Markovian kernels, and harmonic functions "identical in form to the
      wavefunction of the free particle". E011 confirms the
      Fitness-Beats-Truth theorem, proven inside a specified evolutionary
      model. No record derives state spaces, a Born rule, or tensor-product
      composition, and against the Spekkens calibration (E015) a form-match
      sits below the nonclassical bar. Strongest opposing consideration: the
      negative limb rests on the 2014 paper. The 2023 "Fusions of
      Consciousness" work appears only as a background source, so a later
      partial derivation cannot be excluded on this record. FBT's "generic"
      dominance also depends on payoff assumptions. By its authors' framing
      it bears on the epistemology of perception, with conscious realism a
      separate hypothesis.
  - claimId: ZW-C007
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E012 quotes the derivation claim verbatim, including its hedge, "we
      seem to be able to derive". It also quotes the admission that observer
      equivalencing "is at least on the face of it circular", and these
      derivations appear only in unrefereed essays. Gorard's formal paper
      (E024) claims more than an embedding: a proof of convergence to
      complex projective Hilbert space, plus path-integral and Schrödinger
      derivations. So "demonstrate embedding" understates the record. "Rather
      than inevitability" holds, because the author states the quantum
      derivation as a conjecture and the observer enters as a chosen
      foliation (E020); the ZX result (E014) is an embedding as described.
      Strongest opposing consideration: if the unaudited convergence proof
      is sound (R007), the program owns a nontrivial formal derivation.
      "Presented informally" would then hold only for the
      boundedness-plus-persistence route, and "asserts" slightly hardens
      Wolfram's hedge.
  - claimId: ZW-C505
    verdict: well_supported
    confidence: high
    reasoning: >-
      E020 quotes the paper directly on all three points. Deriving quantum
      mechanics from multiway invariance is "our central conjecture"
      (p. 29). Probabilities are "given by the multiway Born rule for
      evolution path weights" (p. 17). CHSH violation is proved "in much the
      same way as" for deterministic nonlocal interpretations (p. 52). The
      absence clauses are explicitly scoped to a full-text search, so the
      claim's local truth is well documented. Strongest opposing
      consideration: the abstract claims path-integral and Schrödinger
      derivations, so a path-weight determination equivalent to the
      squared-amplitude form could sit under unsearched terms. That
      threatens the implication, not the scoped claim. The paper had a
      single AI reader, no human check, and appeared in a Wolfram-founded
      venue; none of this undercuts the verbatim quotations.
  - claimId: ZW-C008
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      No record bears on the thesis's truth as against realism. E005 is
      framing context, E016 constrains a neighbour of both positions, and
      the emergence theorem behind C004 shows viability for generic
      lawfulness, which a world-first ontology also delivers. The thesis
      yields no determinate predictions yet for quantum statistics (C002,
      E023), and existing experiments do not discriminate it (C003). By the
      proponent's written concession, its distinctive probabilities cannot
      yet be related to repeated, intersubjective experiments (E025). That
      rules out unresolved (no test is in hand), contradicted (no no-go
      result exists), and weakly_supported (viability is not evidence).
      Strongest opposing consideration: the clause "ultimately including
      quantum theory" is exposed now to mathematical refutation, because a
      proof that the maximal CHSH value differs from 2√2 would contradict
      it. This label is therefore a dated status, not a shield, and a
      reasonable assessor could call that limb unresolved.
  - claimId: ZW-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The unselectivity limb is supported for the framework as it stands.
      Consistency with quantum mechanics is conditional on quantum theory
      generating the data (C005), and Müller refuses to build the formalism
      in (E023). Finite predictions hinge on a machine-dependent choice
      (E001 limitations); QBism concedes its Born rule as "an empirical
      addition" (E009); and Spekkens shows that a quantum "look" is cheap
      (E015). The quantitative-advantage limb is true but rests on
      background. That advantage belongs to quantum theory, not to
      physicalism, since QBists and Everettians use the same Hamiltonians.
      Strongest opposing consideration: the "already delivered,
      ontology-free" limb overreaches. The reconstructions explicitly leave
      their axioms' origin open (E007, E008), which is exactly the slot
      observer-first programs claim, and they ignore first-person puzzles.
      The preliminary Bell theorem (E003) is also a seed of selection, not
      mere learning.
  - claimId: ZW-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The diagnosis is well grounded. The target side is proven (C001), the
      source side is unbuilt by the proponent's own account (C002, E023),
      purification and continuity localize the quantum content (E007, E008),
      and the Tsirelson bound separates quantum from generic nonclassical
      correlation (E017). But "precisely posed" outruns the record. The
      reconstruction axioms are stated in an operational vocabulary of
      repeatable preparations and measurements, and McQueen and Müller
      concede that the framework cannot yet tie its probabilities to
      repeated intersubjective experiments (E021, E025). Müller also
      contrasts the framework with setups that already assume jointly
      embedded agents (E002). Translating the question into the framework's
      terms is itself open, as ZW-R001's first step implies. Strongest
      opposing consideration: "either direction would settle" is
      asymmetric. A no-go against the bit model could be absorbed by
      reformulation, while a success would establish sufficiency without
      separating ontologies, especially since realist access-limit
      derivations are also being attempted (E019, abstract only).