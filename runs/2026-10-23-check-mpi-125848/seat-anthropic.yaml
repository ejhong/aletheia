caseAssessment:
  verdict: weakly_supported
  loadBearing: [MPI-C007, MPI-C002, MPI-C005, MPI-C008]
  weakestLinks: [MPI-C009, MPI-C010, MPI-C008]
  synthesis: >-
    The case separates cleanly by rung, and that separation decides it.

    The observation rung is firm. Lucadou's founding experiments were
    reported as positive (C001, second-hand but convergent). Every
    replication preregistered as confirmatory or analysed blind returned a
    null (C002). These are Walach et al.'s two OSF-protocol replications,
    Grote's 200-participant blind analysis, and Grote 2017's preplanned
    analyses. Effects were also unstable in three separate series (C003).

    At the mechanism rung, MPI really did forecast this. The no-transmission
    axiom and the decline-and-displacement derivation were in print in 2007,
    a decade before the strict replications (C005). They sit inside an
    explicit formalism that buys generality by giving up quantitative
    prediction (C004). The matrix was the model's own nominated test (C006).
    Read alone, that is a theory forecasting its own failures and being
    right.

    The attribution rung is where that reading fails. A null effect plus
    selection forecasts decline just as well, so decline cannot discriminate
    between the accounts. What can discriminate is where the positives sit
    and how they behave under better statistics. On both counts the record
    favours the conventional account:

    - Walach 2020's significance was not robust to improved analyses, by its
      own authors' account.

    - The program's own 2016 pre-data registration concedes that the
      Z-difference test used in the earlier studies wrongly assumes
      independent cells. It says this commonly inflates significance.

    - Grote 2017's only positive was a post-hoc variant.

    - Flores's three positives rest on a permutation analysis introduced
      after registration. In one of those studies the researcher was the
      sole participant.

    - The newest positive treats 4,096 dependent cells as independent
      samples.

    Shrinkage under a better test of the same data is what artifact
    predicts. MPI's decline operates across replications, so it does not
    predict that.

    One forward-looking contrast does separate the accounts: true versus
    pseudo-random sources. It has no clean support. On full reading, Flores
    2023's split reduces to both arms leaning the same way. Its
    pseudo-random arm was seeded from participants' swipes, and no test of
    the difference between arms was reported. Grote's blinded split was null
    on both sides.

    Finally, the matrix cannot escape the axiom at the level it is scored.
    The experimental-versus-control excess is itself a single outcome
    channel. So MPI forecasts the failure of its own test and absorbs both
    outcomes (C010). Its correct forecast of decline therefore earns little.

    Steelmanning MPI: the conventional account's joint sufficiency (C008) is
    demonstrated for Walach 2020 and Grote 2017. For two other cases it is
    only inferred:

    - the founding datasets, which have never had a dependence-aware
      reanalysis (the unshown half of C009);

    - Flores's conventional-sample Studies 1–2, which survived a permutation
      analysis aimed squarely at dependence.

    In Bierman's ganzfeld simulation, realistic QRP rates fell short of the
    full effect.

    Steelmanning the conventional side: every element of the record is
    reproduced by mechanisms caught operating in this very literature. None
    of MPI's distinctive predictions has yielded a clean positive. Those
    predictions are strength–reproducibility reciprocity, documentation
    suppression, and source dependence.

    Verdict: weakly_supported. The featured hypothesis has a nominal
    predictive success and a residue of unexplained exploratory positives.
    It has no discriminating evidence in its favour and several
    discriminating observations against it. I stop short of contradicted for
    two reasons. No record demonstrates an artifact for every positive. And
    MPI's structure keeps nulls from refuting it. My lean that the
    unexplained residue is flexibility rather than signal draws partly on
    general physical priors, not on the records alone. C008 is both
    load-bearing and among the weakest links: the verdict leans on a
    conventional account that is only provisionally shown.

    Sensitivity: the record whose removal would most change this verdict is
    MPI-E004, Grote's independent blind analysis. It is the cleanest
    confirmation of the conventional account's specific prediction: a
    prespecified, blind analysis of the nominated paradigm returns a null.
    Without it, the strict-null record rests on the proponents' own two
    replications (one at power 0.69) and a 20-person study, and confidence
    would fall. The verdict survives. The downgrade rests mainly on
    documented defects of the positives, spread across several records
    (E002, E018, E019, E020, E023), not on any single null. MPI would absorb
    any single null in any case. MPI-R002 and MPI-R003 are the projects that
    could move this verdict in either direction.
  steelman: >-
    Flores's Studies 1 and 2 were exact replications on Lucadou's own random
    generator, software and protocol, with conventional participant samples.
    Both stayed significant at p = 0.0002 under a permutation analysis. That
    analysis existed to neutralize the dependence among matrix cells that
    the conventional account blames. Study 3 reached p = 0.0003.

    This assessment discounts these results on procedure:

    - the permutation method was introduced after registrations that left it
      unspecified;

    - the studies share equipment and analysts;

    - Study 3's only participant was the researcher.

    But procedure is not a demonstration. No record shows that regression to
    the mean, analytic flexibility, publication bias or residual dependence
    actually produces those p-values. No alternative reasonable permutation
    scheme is reported to return a null on those data. The founding
    1986–2006 datasets were scored with the Z-difference test the program
    itself flagged. They have never had the dependence-aware reanalysis that
    would show whether they survive too.

    Three consecutive positives under one analysis are also not what simple
    regression to the mean predicts. The exceptions would be an analysis
    tuned to the data or one carrying a residual bias. The record leaves
    both open but establishes neither.

    The conventional account's sufficiency for the program's best surviving
    positives is therefore inferred by analogy. In the one neighbouring
    database where sufficiency was quantified, Bierman's ganzfeld
    simulation, realistic QRP rates did not cover the full effect.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Three successor papers describe the founding experiments as yielding
      more significant psychophysical correlations than chance and than
      control matrices (E001). Two of them, Walach et al. 2020 and 2021,
      are co-authored by Lucadou; Grote 2021 is independent. The program's
      later registration forms also refer to the Z-difference analyses
      those studies used (E018, E020). As a claim about what was reported,
      that convergence suffices. The strongest opposing consideration is
      provenance. No evidence record quotes the primary reports'
      statistics, and the 2006 full text was not examined. The 1986–1987
      series sits in German-language venues and no raw data are public, so
      the size of the excess and the exact test are unverified. E002
      concerns a 2020 study outside the claim's window and adds nothing
      directly. This verdict says nothing about whether the reported excess
      was valid; that is MPI-C009's question.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      Every replication preregistered as confirmatory or analysed blind
      returned a null on its primary test. These are Walach et al.'s two
      OSF-deposited consensus-protocol replications (64 and 40
      participants; E003), Grote's 200-participant blind analysis (E004),
      and Grote 2017's three preplanned analyses, one a conceptual matrix
      replication (E006). Grote 2021's software was frozen before a public
      unblinding. The only positives under any registration come from
      Flores's thesis (E007, E018). Study 1's hypothesis passed under the
      original Z-difference method, which the thesis itself says
      overestimates. Studies 1–3 passed under a permutation analysis the
      registrations left unspecified, and Studies 1 and 2 were explicitly
      registered as non-confirmatory. So "predominantly" holds however these
      are counted. The strongest opposing consideration is how thin the
      strict corpus is: four studies, one at post-hoc power 0.69 and one at
      n = 20, beside five registered Flores studies with three reported
      positives. That these replications failed is a matter of record. What
      the failures mean is contested at the attribution rung, where MPI
      forecasts them.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Instability is documented in three separate series. Walach 2020's
      surplus was "significant but fragile" and null in two preregistered
      successors (E002, E003). Grote's significant 2015 result gave way to
      preplanned nulls in 2017 and a blind null in 2021 (E005, E006, E004).
      Flores's three permutation positives were followed by a rejected
      prediction in Study 4 and no significant results in Study 5 (E007).
      Kennedy 2003 documents the same arc across the field (E014). The
      strongest opposing consideration is that the claim's distinctive
      elements are thin. No record shows a sign reversal, or an effect
      migrating to particular variables or cells, in this program. The
      documented shifts are significance surfacing in post-hoc variants
      (Grote 2017's p = 0.012; Flores's pooled Studies 4–5), which is
      equally the signature of analytic flexibility. Grote 2015 is described
      second-hand and is not a strict matrix design. What holds firmly is
      instability, which every account in the case predicts, so this claim
      lends MPI's attribution nothing.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 2002 paper axiomatizes a weak quantum theory that keeps
      complementarity and entanglement for arbitrary systems while dropping
      Hilbert space and Planck's constant (E010). It explicitly anticipates
      non-physical applications. The 2007 paper treats synchronistic
      psychophysical phenomena as entanglement correlations within that
      framework and derives its decline predictions from it (E009). So the
      formalism is explicit and MPI's instantiation in it is documented. The
      strongest opposing consideration is what the extension costs.
      Physical entanglement gets its quantitative signature from the
      Hilbert-space machinery GQT drops. Without it, GQT cannot say how
      large or how frequent a matrix surplus should be, so "entanglement"
      beyond physics is formal structure with no measured counterpart. No
      evidence record says that pragmatic information is the ordering
      quantity. I accept that detail on the claim's extraction note and the
      model's own name, which is a background judgment, not ledger evidence.
      The claim concerns the theory's form and bears on no observation.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 2007 text states the axiom and derives from it, verbatim, three
      consequences (E009). An apparent effect "will be wiped out" under
      attempts at replication. It may "change sign or disappear altogether,
      or else show up again in different observables". It fades faster when
      stronger. All of this was in print a decade before the 2017–2021
      strict replications. If such correlations exist, NT does exclude their
      persistence under any protocol that would make them exploitable. As a
      statement of what the model entails, the claim stands.

      Two opposing considerations limit it. First, "in advance of any data"
      overstates the history. The same passage calls the decline effect
      "well known and often experienced", so the axiom accommodates a
      pattern already seen. It is predictive only relative to the later
      matrix series. Second, and more fundamentally, NT is equally satisfied
      by no correlation at all, so the entailment cannot tell a declining
      real effect from a null. Extending decline to every corroborating
      replication also goes beyond the axiom. In ordinary quantum mechanics
      no-signalling coexists with stable, replicable correlations; that
      point comes from general physics background, not from the ledger.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      The design rationale is in the theorists' own words (E011): "make
      positive use of the evasion phenomenon" through "simultaneous
      registration of as many different correlations as possible". Psi
      would then show up as "transitory, jumping" patterns in the matrix.
      The 2015 volume's treatment of the method is cited as "a new light
      upon the repeatability problem" (E012, context only). The claim is
      about design intent, and the record states that intent directly. The
      only direct attestation, though, is one paper by the model's own
      theorists. The strongest opposing consideration is whether the intent
      can be achieved, not whether it existed. Once the experimental-versus-
      control excess becomes the scored statistic, the design has a single
      outcome channel again. The same passage concedes the method can only
      reduce decline and will "never" overcome it. That tension bears on
      MPI-C010 and on what the matrix record can show, not on this claim's
      truth.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Every positive offered for genuine correlation carries a documented
      weakness:

      - The founding results are second-hand and lack public raw data. They
        were scored with the Z-difference test that the program's own 2016
        registration says commonly inflates significance (E001, E020).

      - Walach 2020's significance did not survive improved analyses, per
        its authors (E002).

      - Flores's three positives rest on a permutation analysis introduced
        after registrations that left it unspecified, and one had the
        researcher as sole participant (E007, E018, E019).

      - Flores 2023 treats 4,096 dependent cells as independent samples
        (E023).

      Shrinkage under a better test of the same data is what artifact
      predicts. MPI's decline operates across replications, so it does not
      predict that.

      Source dependence, the one discriminating prediction tested, has no
      clean support. Under Flores 2023's averaged analysis both arms cleared
      p < 0.05, the pseudo-random arm was swipe-seeded, and no difference
      test was reported (E008, E021, E022). Grote's blinded split was null
      on both sides (E024). The field test was null but too small to count
      (E013).

      Because MPI forecasts nulls, they neither refute nor help it. The
      claim must stand on its positives, and those are exploratory, fragile
      or blind to dependence. The strongest opposing consideration is why I
      stop short of contradicted. The founding data have never been
      reanalysed, and Flores's conventional-sample Studies 1–2 (p = 0.0002
      each) have not been shown to be artifacts.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Each listed mechanism is caught acting on the record:

      - Dependence is conceded in the program's own pre-data registration
        (E020) and ignored in Flores 2023's cell-level test (E023).

      - Analytic flexibility produced Grote 2017's only significant result,
        a post-hoc p = 0.012 beside preplanned nulls (E006). It also
        underlies Flores's post-registration permutation positives (E007,
        E018).

      - Walach 2020 failed under improved analysis (E002).

      In the surrounding micro-PK literature, the meta-analysts judged
      extreme heterogeneity and a small-study effect most simply explained
      by publication bias; Radin et al. dispute the weighting (E015). A
      coding error also manufactured a correlational micro-PK positive
      (E017), though coding error is not one of the four mechanisms this
      claim names.

      Joint sufficiency is shown piecewise, not demonstrated. The founding
      datasets were never reanalysed. Flores's Studies 1–2 survived the
      permutation analysis meant to handle dependence. No record documents
      publication bias inside the matrix program, whose proponents published
      their own nulls. The strongest opposing consideration is Bierman 2016
      (E016). In the best-studied neighbouring database, realistic QRP rates
      explained about 60% of the effect, and a full fit needed unrealistic
      parameters. My lean that the unexplained residue is flexibility rather
      than signal draws partly on prior implausibility, not on the records
      alone.
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The first half is solid. The program's own 2016 registration, filed
      before data collection, says the Z-difference and 2×2 analyses assume
      independent correlations, "which is not true for these studies". It
      adds that dependence commonly "makes an outcome appear more
      significant than is actually the case" (E020). General statistics
      agrees, since cells sharing intercorrelated variables covary.

      The second half is not shown for the object it names. No evidence
      record contains a dependence-aware reanalysis of Lucadou's founding
      datasets. E020's own inference says so, and MPI-R002 proposes such a
      reanalysis as never published. The preprint summary the claim is
      anchored on is not an evidence record and does not identify such a
      reanalysis. What exists is analogy. In exact replications of the
      founding design, the thesis reports that the original Z method
      "showed to overestimate results" and that permutation lowered the
      counts (E007, E020). The strongest opposing consideration is that the
      analogy also cuts the other way. Flores's Studies 1–2 shrank under
      permutation yet stayed significant. The founding results might
      likewise shrink and still survive, and "substantially" remains
      unquantified.
  - claimId: MPI-C010
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The decisive instance is in the proponents' own words. The 2020
      surplus was published as evidence for anomalistic correlations
      (E002). Two preregistered replications on the model's chosen benchmark
      then failed. The same team judged the paradigm not replicable, yet
      read the failure as "likely part of the systematic nature of such
      effects" (E003). The 2007 rationale had already conceded that decline
      could "never" be overcome (E011). No record shows a proponent naming
      an outcome that would count against MPI.

      In principle the model is exposed, because sustained, stable
      replication would violate its own axiom. But that is exactly the
      outcome proponents would read as success. In practice only failures
      could disconfirm, and failures are read as the predicted decline.

      The strongest opposing consideration is that risky content exists in
      print. The 2007 strength–reproducibility reciprocity is testable fine
      structure (E009). The field test designed as MPI's first systematic
      test reported that its results did not support the model's
      predictions, and attributed this to low power rather than to decline
      (E013). So the insulation is a matter of practice rather than logic,
      which "as deployed" allows. The universal "no feasible outcome" still
      generalizes from a handful of documented interpretations. The ledger
      holds neither the 1995 statement nor the 2015 chapter's text.