caseAssessment:
  verdict: contradicted
  loadBearing: [MPI-C002, MPI-C007, MPI-C008, MPI-C009, MPI-C010]
  weakestLinks: [MPI-C001, MPI-C005, MPI-C008, MPI-C009]
  synthesis: >-
    Taken as an empirical attribution—that genuine non-local psychophysical
    correlations produce the correlation-matrix record—the featured hypothesis
    is contradicted by the balance of the supplied evidence. This is not a
    deductive refutation of every possible MPI formulation. It is a judgment
    about the model as tested in its nominated paradigm: the most controlled
    studies yield null results, while the positive results become weaker under
    prespecification, blinding, or dependence-aware scrutiny.

    The strongest case for MPI begins with genuine temporal priority relative
    to the recent failures. The 2007 theory explicitly predicted decline,
    sign changes, and displacement before the 2017–2021 null replications, and
    the matrix design was deliberately proposed as a way to detect transient
    correlations without creating a usable channel. The broader record also
    contains observations that fit this narrative: founding reports of excess
    correlations, the significant but fragile 2020 result, several exploratory
    Flores results, and a large online result favoring the atmospheric-noise
    arm in its headline analysis. The documented sequence of initial positives
    followed by weaker or altered outcomes is therefore not invented after the
    latest failures.

    The contrary case is substantially stronger. Two consensus-protocol
    replications were null, and Grote's independent 200-participant blind
    analysis fell within its random expectation. Grote's earlier series also
    illustrates how a significant post-hoc analysis can coexist with null
    preplanned analyses. The Flores thesis positives relied on exploratory,
    incompletely prespecified permutation methods, and one positive study used
    the researcher as its sole participant. The online study treated a highly
    structured 4,096-cell matrix as its sample, did not report a direct
    between-generator test, and also found the pseudo-random arm significant
    under its averaged analysis. Meanwhile, the program's own registration
    acknowledges that matrix-cell independence is false and can exaggerate
    significance. These findings supply concrete mechanisms for apparent
    excesses without demonstrating a psychophysical interaction.

    The conventional account is not itself fully proved. No dependence-aware
    reanalysis of the founding raw datasets is available, and no quantitative
    model in the packet demonstrates that regression, selection, flexibility,
    and dependence reproduce every reported result. Nevertheless, those
    ordinary mechanisms are directly evidenced at several points, whereas no
    robust anomalous correlation survives a stringent confirmatory test.
    General scientific priors also matter here: a novel non-local
    psychophysical mechanism requires discriminating evidence, and the verdict
    partly reflects that prior rather than pretending that repeated nulls
    logically falsify a theory designed to predict nulls.

    MPI's ability to interpret both success and failure favorably is itself
    consequential. The 2021 proponents treated failed replication as part of
    the phenomenon, leaving the qualitative theory with little evidential risk.
    The single record whose removal would most change this assessment is
    MPI-E004, the independent blind-analysis null. The contradicted verdict
    survives without it because MPI-E003 supplies two preregistered nulls and
    the principal positive records retain serious analytic limitations, but
    the case would be less decisive and more dependent on the proponent-led
    replications.
  steelman: >-
    No evidence record tests MPI's specific strength–reproducibility
    reciprocity with a prespecified quantitative metric or predicts in advance
    where a displaced correlation must reappear. A successful blinded test of
    that fine structure would distinguish lawful evasion from ordinary
    regression and selection, and the present assessment does not answer that
    prediction.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      MPI-E001 documents that Lucadou's original program reported more
      significant psychological–physical correlations in experimental than
      control matrices, and MPI-E002 confirms that this reporting tradition
      continued in a modern large experiment. The claim concerns what the
      experiments reported, not whether their significance calculations were
      valid. The strongest opposing consideration is that the original full
      texts and raw data were not examined, while the later dependence critique
      could materially alter those reported excesses.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: >-
      MPI-E003 provides two null replications under a frozen consensus
      protocol, MPI-E004 reports an independent 200-participant blind-analysis
      null, and MPI-E006 reports null results for all three preplanned
      analyses. These are the corpus's clearest confirmatory tests and
      collectively establish that strict replications have predominantly
      failed. The strongest opposing consideration is that one MPI-E003
      replication was underpowered and the Flores program reported exploratory
      positives, but those positives were not prespecified confirmatory
      successes.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      The transition from Grote's reported 2015 positive to his 2017
      preplanned nulls and 2021 blind null, together with the fragile 2020
      result and subsequent failed replications, demonstrates substantial
      instability. MPI-E007 further records positives in some Flores studies
      but not others, with pooled or altered analyses recovering significance.
      The strongest opposing consideration is that instability alone is also
      expected from noisy estimates and selective analysis, so this local
      observation does not establish MPI's explanation.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      MPI-E010 describes an axiomatized weak quantum framework that explicitly
      extends complementarity and entanglement to arbitrary systems, while the
      supplied theory records place MPI within that framework. This supports
      the historical and formal-content claim, not the framework's empirical
      validity. The strongest opposing consideration is that dropping Hilbert
      space and quantified probabilities greatly reduces predictive force, and
      the evidence record gives limited detail about pragmatic information as
      the specific ordering quantity.
  - claimId: MPI-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      MPI-E009 clearly shows that the theorists published predictions of
      decline, sign reversal, disappearance, and displacement before the
      recent rigorous replication failures. However, the 2007 formulation
      followed earlier positive experiments, so the phrase "in advance of any
      data" is too strong. The strongest opposing consideration is logical:
      a no-transmission axiom does not by itself require correlations to
      decline, because uncontrollable but statistically stable correlations
      need not constitute a usable signal; the record documents an asserted
      derivation rather than a quantitative entailment.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: >-
      MPI-E011 states directly that the design registers many correlations so
      that transient, displaced patterns can appear without defeating the
      decline constraint. This establishes the design's stated purpose and its
      status as MPI's proposed experimental strategy. The strongest opposing
      consideration is that the account comes from the model's own theorists,
      but author dependence limits evidential validation, not the historical
      fact of their design rationale.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The cleanest tests—MPI-E003 and MPI-E004—found no excess correlation,
      while MPI-E006 shows significance appearing only after a post-hoc
      analytic change. The positive MPI-E002 result was fragile, the MPI-E007
      positives were exploratory and partly methodologically compromised, and
      MPI-E008 is weakened by cell dependence and the absence of a direct
      generator contrast. The strongest opposing consideration is that MPI
      predicts replication failure and the record contains several positives,
      so this is an evidential contradiction of the genuine-correlation
      attribution rather than a deductive falsification. The judgment also
      partly reflects the prior need for strong discriminating evidence before
      accepting a novel non-local psychophysical mechanism.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      MPI-E006 directly demonstrates analytic flexibility, MPI-E015 documents
      publication-bias signatures in the neighboring REG literature, and
      MPI-E020 establishes a dependence problem capable of exaggerating matrix
      significance. MPI-E017 supplies an additional concrete example of an
      ordinary coding error producing an anomalous result in related work.
      The strongest opposing consideration is that no record quantitatively
      reconstructs the complete matrix history from these mechanisms, and
      MPI-E016 found that modeled questionable practices did not explain all
      of a neighboring database's effect. The sufficiency judgment therefore
      remains provisional and draws partly on the ordinary-null prior.
  - claimId: MPI-C009
    verdict: mixed
    confidence: moderate
    reasoning: >-
      MPI-E020 explicitly acknowledges before data collection that matrix
      correlations are not independent and that assuming independence can make
      outcomes appear too significant; MPI-E023 identifies the same concern
      in the later online study. MPI-E007 also reports that alternative
      analyses lowered correlation counts in the Flores studies. The strongest
      opposing consideration is decisive for the second half of the claim:
      no supplied record performs a dependence-aware reanalysis of Lucadou's
      founding datasets, so their substantial diminution remains unshown.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      MPI-E003 records proponents interpreting two failed replications as
      likely part of the phenomenon, while MPI-E009 and MPI-E011 allow
      disappearance or migration whenever stable corroboration is attempted.
      In practice, this permits both positive and null outcomes in the nominated
      paradigm to be assimilated without specified evidential penalties. The
      strongest opposing consideration is that MPI-E013 operationalized a
      field prediction and MPI-E009 contains a potentially testable
      strength–reproducibility relation, showing that disconfirming tests are
      conceivable. The universal statement that no feasible outcome would ever
      count against MPI is therefore less secure than the conclusion that its
      documented deployment has been strongly insulated from disconfirmation.