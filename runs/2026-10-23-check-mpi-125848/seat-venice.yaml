  synthesis: >-
    The case's observational rung is solid: the correlation-matrix program did report excess correlations (MPI-C001), those results did not survive strict replication (MPI-C002), and the pattern of decline, sign-change, and displacement is real in the record (MPI-C003, with Kennedy 2003 documenting it field-wide). The mechanism rung is also solid as a matter of intellectual history: GQT and the NT axiom exist in print, the decline/displacement predictions are genuinely derived there (MPI-E009), and the matrix design was explicitly constructed as the model's own test (MPI-C006). So MPI is not a retrofitted excuse in the trivial sense — its central prediction was published before the decisive failures. That is the strongest thing in its favor, and this assessment credits it fully.
    The case turns on the attribution rung, and there the evidence runs decisively against the featured hypothesis. The design was built precisely to detect entanglement correlations without enabling signal transmission (MPI-C006); when that nominated paradigm was finally run under preregistered consensus protocols by the proponents' own team, and under the corpus's strictest blind analysis by an independent experimenter, nothing was found (MPI-E003, MPI-E004). Every surviving positive is compromised in a documented way: Walach 2020's surplus is described as fragile by its own successor paper; the Flores positives rest on an exploratory analysis whose method was never prespecified, one of which had the researcher as sole participant (MPI-E018, MPI-E019, MPI-E007); the 2023 preprint's headline split does not survive its own averaged analysis, its pseudo-random arm was seeded from participant behavior, and its 4,096 cells repeat the dependence error the program itself warned against in 2016 (MPI-E021 through MPI-E023, MPI-E020). Meanwhile the conventional mechanisms — publication bias, analytic flexibility, statistical dependence, even plain coding error — are each documented inside or adjacent to this exact literature (MPI-E015, MPI-E006, MPI-E017, MPI-E020). The residual problem is that MPI, as deployed, treats both success and failure as confirmation (MPI-C010), which removes the model's predictive agreement with the decline record from the evidential column: a prediction compatible with every outcome predicts nothing. A genuinely decisive test of MPI's distinctive content — the reciprocity prediction, the RNG-source contrast, binding disconfirmation criteria — has never been run. Until it is, the noise account explains everything the matrix record shows, and the correlation account has no surviving support. That is a substantive negative finding, not a default: the strictest available tests of the model's own nominated experiment were run, were adequately powered, and returned null.
  steelman: >-
    The founding excess-correlation results (1986–2006) and the 2020 Walach surplus have never been reanalyzed under dependence-aware statistics on their own data — the dependence critique exists only as a methodological warning and reanalyses of the new replications, not as a published demonstration that the founding positives are artifacts. Until MPI-R002 is executed, a proponent can hold that the original anomaly stands unrefuted under sound statistics. Further, the model's distinctive fine-structure predictions — the stated reciprocity between effect strength and speed of decline, and the claim that only genuinely indeterminate sources carry the effect — have never been disconfirmed in a prespecified, equal-power test; the one available source-contrast (Flores 2023, full-sample) went the model's way, however compromised its arms. The strict nulls, on the proponent's reading, are the model's own prediction operating as designed, not evidence against it.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The claim is about what was reported, and multiple independent descriptions (Walach et al. 2020/2021, Grote 2021) confirm Lucadou's group reported excess correlations exceeding controls, alongside the authors' own 2006 paper. The strongest opposing consideration: the weight of those reports is unknown, since the original raw data were never published and the founding analyses violated the independence assumption the program itself later conceded (MPI-E020). The reporting fact is solid; the evidential value of what was reported is not.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The strictest tests all failed: two preregistered consensus-protocol replications on the proponents' own equipment ("neither of the two experiments was significant"), a 200-participant fully blind analysis by an independent experimenter, and Grote 2017's three preplanned analyses all null (MPI-E003, E004, E006). The strongest opposing consideration is the Flores series, but its registration forms explicitly label the hypotheses exploratory with the permutation methods unspecified (MPI-E018), so they are not confirmatory preregistered replications and do not undercut "predominantly failed." Nothing in the corpus shows a preregistered confirmatory success.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The instability pattern is documented study by study: Grote's 2015 significant result went null on all preplanned analyses by 2017 and null under full blinding by 2021 (MPI-E005, E004, E006); Walach 2020's effect was called "significant but fragile" by its own authors; Kennedy 2003 documents decline and displacement field-wide. The strongest opposing consideration: "displacement" and "sign change" are partly artifacts of which post-hoc analysis is emphasized, and the Flores positives show the pattern is not universal — but instability under replication is exactly what the record shows.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      GQT was axiomatized and published in a physics-foundations venue (Atmanspacher, Römer & Walach 2002), and MPI instantiates it with pragmatic information as ordering quantity — both documented. The strongest opposing consideration: "formally explicit" overstates what the framework delivers; by dropping Hilbert-space structure and Planck's constant it sacrifices exactly the quantitative machinery that generates effect-size predictions, so the extension is formal in vocabulary but not in predictive force (MPI-E010's own inference notes this).
  - claimId: MPI-C005
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The entailment itself is genuinely in print: the 2007 JCS paper derives decline, sign-change, and displacement from the NT axiom verbatim, before the 2017–2021 replication failures (MPI-E009). The strongest opposing consideration is the claim's "in advance of any data" clause: the derivation postdates the founding 1986–2006 experiments and the field-wide decline lore Kennedy documented in 2003, so the prediction was at least partly fitted to known patterns before being formalized. The predictions are real and forward-looking relative to the strict replications, but "any data" is false as stated.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      The design rationale is stated verbatim in the theorists' own 2007 text — spread effects across many correlations so psi shows as "transitory, jumping" matrix patterns — and the 2015 theory-chapter context confirms the program's self-understanding (MPI-E011, E012). The strongest opposing consideration cuts at the attribution rung, not this one: the same passage pre-announces that the design will "never... convince every sceptic," which makes the design's binding force on the model ambiguous rather than falsifying the historical claim about why it was built.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The model's own nominated test, run under preregistered consensus protocols by its proponents and under the corpus's strictest blind analysis by an independent group, found nothing (MPI-E003, E004); every surviving positive is exploratory, dependence-confounded, or single-participant (MPI-E007, E018, E019, E021–E023). The strongest opposing consideration: the founding dataset has never been reanalyzed under dependence-aware statistics, so the anomaly reading is unrefuted rather than refuted on its own data — and MPI predicts strict tests fail. But the claim requires genuine correlations to exist, and no surviving record evidences any; the matrix design was explicitly constructed to detect them without signal transmission, and it did not.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Each named mechanism is documented and real: small-study/publication-bias signals in the 380-study REG meta-analysis, a live post-hoc-significance demonstration in Grote 2017, the program's own 2016 admission that dependence inflates significance, and a coding error manufacturing an anomaly next door (MPI-E015, E006, E020, E017). The strongest opposing consideration: "jointly sufficient" is not demonstrated — Bierman's QRP simulation covered only about 60% of the ganzfeld effect, and no quantitative reconstruction has shown these factors fully account for the matrix record specifically. Sufficiency is plausible and mechanistically grounded, not established.
  - claimId: MPI-C009
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The first half is strongly supported, indeed by the program itself: Flores's 2016 pre-data registration states that matrix analyses assume independence "which is not true for these studies" and that dependence makes outcomes "appear more significant than is actually the case" (MPI-E020). The second half is not shown: the reanalyses reported were of Flores's own replications, not Lucadou's founding data, and the "results diminished" quote in the 2023 preprint refers to those studies (MPI-E007, E020's inference). A claim that is half-established and half-pending is mixed, and the pending half is the one that would decide the founding anomaly.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The insulation is visible in the proponents' own words: the same paper that reports "neither of the two experiments was significant" reads the failure as "likely part of the systematic nature of such effects" (MPI-E003's inference, SRC-WALACH-2021's quote), and the design rationale pre-concedes the paradigm will never convince skeptics (MPI-E011). The strongest opposing consideration: Watt & Tierney show MPI's field predictions are operationalizable (MPI-E013), and the proponents did freeze protocols and publish nulls — honest practice that falls short of, but complicates, a charge of total unfalsifiability; the claim concerns how outcomes are interpreted, and on that the record supports it.