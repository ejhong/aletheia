caseAssessment:
  verdict: contradicted
  loadBearing: [MPI-C002, MPI-C008, MPI-C009, MPI-C010]
  weakestLinks: [MPI-C001, MPI-C007]
  synthesis: >-
    The ledger's observation rung is solid on two points and fragile on a third. Original correlation-matrix reports (C001) did claim excess experimental-over-control correlations, and the modern series shows clear non-stability: patterns weakened, flipped, or migrated (C003). Yet every preregistered or fully blinded replication of the matrix paradigm itself has returned null on its primary analysis (C002: Walach et al. 2021 consensus-protocol pair; Grote 2021 blind 200-participant run; Grote 2017 preplanned analyses). Those nulls are not marginal; they were obtained by the model's own proponents under frozen protocols and by an independent experimentalist under live unblinding. The mechanism rung is equally clear but non-empirical: GQT exists as a formal framework (C004), the no-transmission axiom is stated verbatim and does entail decline/displacement in advance (C005), and the matrix design was explicitly offered as the model's own test that tries to harness rather than fight evasion (C006). None of that formalism supplies a quantitative surplus size or a binding displacement locus, so the mechanism cannot be confirmed or refuted by the size of any single matrix cell count. Attribution is where the case decides. The claim that the observed pattern is produced by genuine non-local psychophysical entanglement (C007) is the featured hypothesis. It is contradicted by the combination of (a) the strict nulls, (b) the program's own 2016 registration admitting that matrix cells are dependent and that independence-assuming Z-tests inflate significance, (c) dependence-aware or later-introduced analyses that shrink or eliminate founding and replication positives (Flores thesis), and (d) the broader micro-PK literature's small-study effects, publication bias, QRP simulations, and documented coding errors that jointly generate exactly the early-positive-then-decline arc without anomaly (C008, C009). The same record shows that proponents treat both positive and null outcomes as confirmatory—successes as entanglement, failures as the predicted decline—so that no feasible matrix result is allowed to count against the model (C010). Conventional statistical artifacts plus analytic flexibility are therefore jointly sufficient; the MPI reading is not required and is actively insulated from the very experiments it nominated. The single most load-bearing thread is the set of preregistered/blind nulls read against the dependence critique; remove either and residual ambiguity returns, but both are present. Prior scientific background (that genuine signal-bearing correlations do not systematically vanish under improved measurement) calibrates the low prior on C007, yet the verdict itself rests on the ledger's own records rather than that prior. The decline is what selection, dependence inflation, and flexible analysis do to noise; it is not evidence of a law that forbids stable mind-matter signals.
  steelman: >-
    The field-wide pattern, catalogued by Kennedy and visible outside any single lab, that initially significant psi effects across multiple paradigms decline or displace under tighter controls, together with the still-untested quantitative reciprocity between initial effect strength and subsequent unreproducibility that MPI uniquely derived in 2007 before the modern matrix failures.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Multiple independent secondary descriptions (Walach 2020/2021, Grote 2021) and the 2006 proceedings paper consistently state that Lucadou-group matrices 1986–2006 yielded more significant psychological–physical cells in experimental than control sessions. The claim is only that they reported this, not that the excess survives dependence correction; strongest opposing consideration is the still-unpublished raw data and the later admission that the original Z-tests assumed independence.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: >-
      Walach et al. 2021 (two preregistered consensus-protocol replications, neither significant) and Grote 2021 (full blind-analysis 200-participant run, primary result inside the null distribution) are direct, high-quality failures on the model's own paradigm; Grote 2017 preplanned analyses add a third null. Strongest opposing consideration is the lower-powered second Walach arm and Flores's later non-confirmatory positives, which do not override the preregistered and blinded record.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Within-experimenter series (Grote 2015 significant distribution result followed by 2017 and 2021 nulls) and the Walach 2020-to-2021 collapse of significance under improved analysis, plus the broader Kennedy 2003 review of paradigm-level decline and displacement, document the instability. Strongest opposing consideration is that some Flores permutation positives remain, yet even those shift across studies and analyses.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Atmanspacher, Römer & Walach 2002 axiomatizes weak quantum theory with complementarity and entanglement retained for non-physical systems; the 2007 JCS paper explicitly places MPI inside that framework using pragmatic information. The claim is about formal existence, not empirical adequacy. Strongest opposing consideration is that dropping Hilbert space and Planck's constant also drops quantitative predictions, limiting what the formalism can ever confirm.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: >-
      The 2007 JCS paper states the no-transmission axiom verbatim and immediately derives decline, sign change, and displacement under any protocol that would permit signal use, including the reciprocity of strength and unreproducibility. This is textual fact, not an empirical claim. Strongest opposing consideration is that the derivation remains qualitative; no numerical fade rate is supplied.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: >-
      The same 2007 paper and the 2015 theory-volume chapter present the multi-cell matrix explicitly as the design that turns evasion into a detectable jumping pattern while conceding it will never fully convince skeptics. Strongest opposing consideration is that the design's own authors later described the paradigm as non-replicable, which is consistent with the rationale but weakens its status as a decisive test.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The strictest tests (preregistered Walach 2021 pair, blinded Grote 2021) are null; remaining positives are either fragile under reanalysis, registered only as exploratory, single-participant, or dependent on independence-assuming cell counts the program itself later rejected. Conventional mechanisms already generate the same early-positive-then-decline arc. Strongest opposing consideration is the 2023 online true-RNG arm and Flores permutation counts, both heavily qualified by design and dependence problems.
  - claimId: MPI-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      Bösch 2006 documents tiny heterogeneous micro-PK effects consistent with publication bias; Bierman 2016 shows QRPs can account for the majority of a neighboring flagship effect; Maier & Dechamps 2022 caught a coding error that had manufactured a correlational micro-PK result; Grote 2017 itself produced a significant post-hoc from null preplanned data; and matrix-cell dependence systematically inflates significance. Jointly these suffice. Strongest opposing consideration is Bierman's residual significance after QRP correction in ganzfeld, an extrapolation that does not restore the matrix nulls.
  - claimId: MPI-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The program's own 2016 registration states that matrix cells are not independent and that the common effect of dependence is to make results appear more significant; Flores's later permutation/simulation work and the 2023 online methods (4,096 cells treated as independent samples from four variables) confirm the problem and show diminished or method-dependent outcomes. Strongest opposing consideration is that the original 1986–2006 raw matrices have never received a published dependence-aware reanalysis, so the exact degree of inflation remains estimated rather than measured.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Walach et al. 2021 explicitly interpret their own preregistered nulls as "likely part of the systematic nature of such effects," and the 2007 theory already licenses both positive entanglement patterns and subsequent decline as confirmatory. No matrix outcome is thereby allowed to count against the model. Strongest opposing consideration is that Watt & Tierney 2013 shows field predictions can be operationalized, yet that study was underpowered and still read as inconclusive rather than disconfirming.