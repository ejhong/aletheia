  verdict: weakly_supported
  loadBearing: [MPI-C002, MPI-C005, MPI-C007, MPI-C008, MPI-C010]
  weakestLinks: [MPI-C001, MPI-C007, MPI-C009, MPI-C503]
  synthesis: >-
    The evidence establishes two important but separable facts. First, MPI
    genuinely predicted decline, sign changes, disappearance, and displacement
    before the recent replication failures: MPI-E009 documents that theoretical
    content, while MPI-E011 documents why the correlation-matrix design was
    intended to accommodate evasive effects. Second, the empirical program
    displays the predicted surface pattern. Early studies reported excess
    correlations, whereas preregistered or blind analyses increasingly returned
    null, reversed, fragile, or analysis-dependent results. MPI-E003 contains
    two failed consensus-protocol replications, MPI-E004 reports a fully blind
    independent null, MPI-E006 contrasts preplanned null analyses with a
    significant post-hoc variant, and MPI-E020 records a preregistered
    no-decline prediction that failed and reversed. Thus decline and instability
    are not inventions imposed on an entirely stable empirical record.

    The strongest case for MPI is that this temporal pattern resembles its
    published qualitative forecast rather than a conventional expectation of a
    durable signal. Flores's first three preregistered studies also reported
    positive permutation results, and the large 2020 study reported a surplus
    against simulations. Those observations prevent a verdict that there is
    simply no favorable evidence. Moreover, a theory that explicitly forbids
    exploitable signaling cannot fairly be assessed as though it predicted an
    ordinary constant effect.

    The stronger counterargument is that MPI has not demonstrated the
    distinctive cause it assigns to the pattern. Its cleanest nominated tests
    are null, while its positive results are fragile or exposed to dependence,
    analytic flexibility, self-participation, post-hoc pooling, and unequal or
    procedurally confounded comparisons. MPI-E018 directly shows that the
    original Z method overstates results when variables are dependent, although
    it does not reanalyse the founding datasets. MPI-E021 through MPI-E023 show
    that the apparent random-source contrast in the online study changes with
    analysis choice and that its cells and generation procedures do not provide
    a clean independent comparison. The conventional account therefore has
    concrete mechanisms represented in this record, whereas no evidence record
    directly measures a non-local psychophysical process.

    Most importantly, the observed decline is weakly discriminating because a
    null process filtered through flexible analyses and selective attention also
    predicts early positives followed by stricter failures. Proponent
    interpretations recorded in MPI-E003, MPI-E019, and MPI-E020 absorb failed
    tests as manifestations of decline or insufficient novelty. That preserves
    consistency but removes much of the forecast's evidential force unless
    proponents bind the model to quantitative fine structure such as the
    predicted reciprocity between initial strength and reproducibility. A
    general scientific prior against unmeasured non-local psychophysical causes
    reinforces, but does not determine, this assessment; the evidence record
    itself already favors ordinary statistical explanations. The resulting case
    verdict is weakly_supported rather than unresolved because MPI made a
    temporally prior qualitative prediction that the record resembles, but the
    central causal attribution remains unverified and the conventional
    explanation is better supported.

    The single record whose removal would most change this verdict is MPI-E003,
    because it combines two preregistered consensus-protocol failures with the
    proponents' explicit decision to interpret those failures as part of the
    model. The verdict survives without it: MPI-E004, MPI-E006, MPI-E007,
    MPI-E018, and MPI-E020 independently preserve the pattern of strict nulls,
    methodological inflation, and failure absorption, although confidence in the
    falsifiability critique would be reduced.
  steelman: >-
    This assessment does not explain why Flores Studies 1 and 2, both described
    as preregistered and not limited to the author's sole-participant study,
    produced upper-right-block permutation results of p = 0.0002 and excesses
    across the whole matrix. A proponent can rightly demand an independent
    dependence-aware reanalysis or exact blind replication before those
    specific positive observations are dismissed as ordinary noise.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      MPI-E001 records that Lucadou's 1986–2006 program was reported as producing
      more significant psychological–physical correlations than chance or
      controls, and MPI-E002 supplies a later positive result from the same
      research line. This assesses the historical reporting claim, not whether
      the reported excess was anomalous. The strongest opposing consideration is
      that the original full text and raw datasets were not examined, while
      MPI-E018 indicates that the founding significance-counting method can
      overstate results under variable dependence.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: >-
      MPI-E003 reports two preregistered consensus-protocol failures, MPI-E004 a
      200-participant blind-analysis null, and MPI-E006 null results on all three
      preplanned analyses. MPI-E007 and MPI-E020 add two later preregistered
      failures after three initial positives, so failures predominate in the
      stricter replication record. The strongest opposing consideration is that
      Flores's first three preregistered studies were positive and some null
      studies had limited power, but neither point overturns the claimed
      predominance.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      MPI-E005 and MPI-E006 document an initial significant result followed by
      preplanned nulls and a positive appearing only under a post-hoc variant.
      MPI-E007 and MPI-E020 add later disappearance and reversal, while MPI-E003
      shows that the 2020 surplus did not survive two consensus-protocol
      replications. The strongest opposing consideration is that these studies
      are not all exact replications and therefore cannot cleanly distinguish
      temporal decline from design heterogeneity.
  - claimId: MPI-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      MPI-E010 shows that Generalized or Weak Quantum Theory is an axiomatized
      framework retaining complementarity and entanglement while extending them
      to arbitrary systems, and MPI-E009 presents MPI's associated
      psychophysical application. The evidence therefore supports the existence
      and broad structure of the formal framework. The strongest opposing
      consideration is that the records do not fully exhibit the claimed
      pragmatic-information ordering formalism, and the framework lacks the
      quantitative probability structure needed for precise empirical
      predictions.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      MPI-E009 directly quotes the no-transmission axiom and the published
      derivation of decline, faster decline after stronger effects, sign changes,
      disappearance, and migration to other observables. This establishes that
      these consequences were stated before the main 2017–2021 failures rather
      than invented afterward. The strongest opposing consideration is that
      “exploitable as a stable signal” lacks an operational threshold, so the
      asserted entailment is qualitative and can be applied flexibly.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: >-
      MPI-E011 explicitly states that many simultaneous correlations were
      registered so that transient and displaced effects could appear without
      overcoming decline, directly establishing the design's stated rationale.
      MPI-E012 independently places the matrix method within MPI's proposed
      response to the repeatability problem, though it is only contextual
      evidence. The strongest opposing consideration is that this establishes
      authorial intent and methodology, not that the design actually separates
      entanglement correlations from statistical artifacts.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Positive evidence includes the fragile simulated-matrix surplus in
      MPI-E002, the first three Flores studies in MPI-E007, and one analysis of
      the large online study in MPI-E008. Against that, the most controlled tests
      in MPI-E003, MPI-E004, MPI-E006, and MPI-E020 are null or reversed, while
      MPI-E018 and MPI-E023 identify dependence problems capable of inflating
      matrix results. The strongest opposing consideration to a wholly negative
      judgment is that some preregistered permutation results remain unexplained,
      but no record directly identifies their cause as non-local psychophysical
      correlation. A prior against such an unmeasured mechanism modestly lowers
      the verdict, but the methodological record supplies the main reason.
  - claimId: MPI-C503
    verdict: mixed
    confidence: moderate
    reasoning: >-
      MPI-E008 and MPI-E021 confirm that the final cumulative-matrix analysis was
      significant for Random.org and not conventionally significant for the
      Mersenne Twister arm. However, MPI-E021 shows that both arms were
      significant on the paper's other emphasized average analysis, so the split
      depends on analysis choice. MPI-E022 further shows that the Mersenne
      Twister was seeded from participant swipe timing, making “deterministic”
      an inadequate description of the experimental contrast even though the
      algorithm is deterministic conditional on its seed. The strongest
      consideration favoring the claim is that its wording accurately matches
      the abstract's final-matrix result.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      MPI-E006 demonstrates a positive emerging from post-hoc flexibility after
      preplanned nulls, MPI-E015 finds publication-bias and small-study patterns
      in the neighboring REG literature, and MPI-E018 documents inflation from
      dependent variables. The strict failures and fragile positive analyses are
      collectively compatible with regression and selection acting on null
      effects. The strongest opposing consideration is that no record applies a
      single complete conventional model to all founding matrix data, and
      MPI-E016 shows in a neighboring paradigm that modeled questionable
      practices did not necessarily explain the entire reported effect.
  - claimId: MPI-C009
    verdict: mixed
    confidence: moderate
    reasoning: >-
      MPI-E018 directly supports variable dependence and shows that the original
      Z procedure overestimated results when applied to Flores's replication
      data. MPI-E023 identifies a similar dependence concern in the online study,
      whose 4,096 cells derive from segmented versions of only four psychological
      and four physical variables. The strongest opposing consideration is
      decisive for the claim's second half: no evidence record contains a
      dependence-aware reanalysis of Lucadou's actual 1986–2006 datasets, so
      substantial diminution of the founding results remains inferred rather
      than demonstrated.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      After two preregistered failures, MPI-E003 records the interpretation that
      failed replication is likely part of the effects' systematic nature.
      MPI-E019 reports that statistical dependence may be dismissed as applying
      only to causal signals and that novelty must be introduced into each
      replication, while MPI-E020 shows a failed preregistered prediction being
      explained partly by decline rather than counted against MPI. The strongest
      opposing consideration is that the field test in MPI-E013 and the
      no-decline prediction in MPI-E020 demonstrate that local predictions can
      be operationalized and allowed to fail. Nevertheless, the supplied record
      shows no such failure being treated by proponents as disconfirming the
      model itself.