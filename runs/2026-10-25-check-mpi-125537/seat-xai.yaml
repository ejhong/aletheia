caseAssessment:
  verdict: contradicted
  loadBearing: [MPI-C002, MPI-C008, MPI-C009, MPI-C010]
  weakestLinks: [MPI-C007, MPI-C503, MPI-C001]
  synthesis: >-
    The ledger's observation rung is clear and one-sided once preregistration and blinding enter. Lucadou-group originals and the 2020 two-lab matrix (E001, E002) reported excess psychological-physical correlations relative to controls or simulations; those reports stand as historical fact (C001). Every subsequent strict test collapses them: Walach et al. 2021's own consensus-protocol replications (E003), Grote's fully blinded 200-participant run (E004), Grote 2017's preplanned analyses (E006), and Flores Studies 4-5 under explicit no-decline preregistration (E007, E020) return nulls or reversals. Patterns therefore do not remain stable (C003); they weaken, change sign, or migrate exactly as expected under ordinary sampling variability once analytic flexibility is closed. The mechanism rung is equally clear as textual description: GQT supplies a weak complementarity/entanglement framework (E010, C004), MPI's no-transmission axiom is stated in 2007 and does entail decline or displacement under exploitable protocols (E009, C005), and the matrix design is explicitly offered as the model's own test that "uses" evasion (E011, C006). None of that formalism is evidence that the correlations exist. On the attribution rung the conventional steelman is jointly sufficient and better evidenced. Intercorrelation among psychological variables inflated the founding Z-counts; dependence-aware permutation analyses diminish them (E018, C009). Regression to the mean, publication bias, QRPs, coding errors, and flexible post-hoc variants are documented both inside the matrix series (E006 post-hoc p=0.012) and in the broader micro-PK literature that supplied its base rate (E015 Bösch heterogeneity and small-study effects; E016 Bierman QRP recovery of ~60 % of ganzfeld; E017 Maier-Dechamps coding error). These mechanisms generate early positives followed by decline without residue. The residual positives that remain (Flores early studies, one of them self-participant; 2023 online under cell-as-N and swipe-seeded "pseudo-RNG") carry the same dependence and procedural confounds the program itself now flags (E021-E023). MPI-C007 is therefore the claim that fails: the pattern is produced by noise plus selection, not by non-local psychophysical entanglement. MPI-C010 is confirmed in the same breath—the 2021 abstract and Flores thesis convert every null into "systematic nature" or "required novelty," so the nominated experiments cannot disconfirm the model. The case verdict follows directly: the featured hypothesis (MPI correctly predicts and explains the decline via genuine entanglement correlations) is contradicted by the strict replication record and by the adequacy of ordinary statistical artifacts. Sensitivity is high to the preregistered null cluster; remove it and the early reports regain rhetorical force, yet even then dependence reanalysis and the Bösch base rate would still favor the conventional account.
  steelman: >-
    The reciprocity prediction (stronger original effects decline faster) and the specific displacement-to-unexpected-cells pattern remain untested by any preregistered, dependence-aware metric; a proponent can still point to those fine-structure claims as live and unrefuted by the existing nulls.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      E001 and E002 directly record that Lucadou-group 1986-2006 matrices and the 2020 two-lab replication reported excess significant correlations versus controls or 10 000 simulations. The claim is only that they reported the surplus, not that the surplus is real; limitations (author-conducted, pre-preregistration, fragile under later reanalysis) do not erase the historical reports. Strongest opposing consideration is that raw data remain unpublished, so independent verification of the original counts is still absent.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: >-
      E003 (two preregistered consensus-protocol replications, neither significant), E004 (blind-analysis 200-participant null), E006 (three preplanned analyses null), and E020 (preregistered no-decline prediction fails and reverses) form a consistent failure record under the very protocols the program now endorses. Flores early positives do not overturn the predominance once self-participant and post-hoc pooling are noted (E007). Strongest opposing consideration is modest power in one Walach arm (0.69), yet the first arm and Grote's larger sample were adequate.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Within-experimenter series (Grote 2015 significant distribution to 2017/2021 nulls, E005-E006; Flores Studies 1-3 positive to 4-5 null/reversal, E007/E020) and the 2020-to-2021 Walach collapse (E002-E003) document weakening, sign change, and migration across cells or analyses. Kennedy 2003 supplies the broader pattern description (E014). Strongest opposing consideration is that some displacement could be real under MPI, yet the claim itself is only the observational instability, which holds regardless of cause.
  - claimId: MPI-C004
    verdict: established
    confidence: high
    reasoning: >-
      E010 records the 2002 Foundations of Physics axiomatization of weak quantum theory retaining complementarity and entanglement while dropping Hilbert-space structure; E009 and the 2007 JCS paper locate MPI as the psychophysical instantiation that uses pragmatic information. The claim is about formal existence and stated scope, not empirical truth. Strongest opposing consideration is that generality is purchased by loss of quantitative predictions, but that does not negate the published extension.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: >-
      E009 quotes the no-transmission axiom and the explicit derivation that apparent effects "will be wiped out" under replication attempts, may change sign, or reappear in different observables—the decline and displacement predictions are in print in 2007, prior to the major failures. The claim is about entailment from the axiom, not about whether the axiom is true. Strongest opposing consideration is that the derivation remains qualitative; no numerical rate is fixed.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: >-
      E011 quotes the 2007 rationale that one should "make positive use of the evasion phenomenon" by registering many correlations so that psi appears as transitory matrix patterns; the design is thereby bound to MPI as its own proposed test. E012 supplies later anthology context. Strongest opposing consideration is that the same passage concedes the paradigm will never convince every sceptic, which already softens its status as a decisive test.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Strict preregistered and blind tests (E003, E004, E006, E020) return nulls or reversals on the model's nominated paradigm; remaining positives are fragile, author-involved, dependence-inflated, or procedurally confounded (E002 later qualified by its own authors; E007 self-participant; E008/E021-E023 cell-as-N and swipe-seeded RNG). Conventional mechanisms (C008-C009) already generate the same early-positive-then-decline pattern. Strongest opposing consideration is the 2020 surplus and Flores early permutation results, yet both fail under improved or later analysis and do not survive the dependence critique.
  - claimId: MPI-C503
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The abstract split (true-RNG significant, Mersenne Twister not) is undercut by the paper's own second emphasised analysis on which both arms are significant (E021) and by the admission that the "pseudo-random" arm was seeded from participant swipe timing, destroying both determinism and independence from the psychological variables (E022). E023 further notes cell-as-N inflation. Strongest opposing consideration is the authors' power/effect-size defence of the split, yet a contrast that appears or vanishes with analysis choice is not reliable evidence that source type matters.
  - claimId: MPI-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      Bösch 2006 documents tiny heterogeneous micro-PK effects consistent with publication bias (E015); Bierman 2016 recovers ~60 % of a flagship effect via realistic QRPs (E016); Maier & Dechamps 2022 trace a correlational micro-PK result to a coding error (E017); Grote 2017 itself produces a significant post-hoc from null preplanned data (E006). Together with dependence inflation (C009) these mechanisms suffice for the observed matrix record. Strongest opposing consideration is Bierman's residual significance under QRP simulation, but that result is from ganzfeld, not matrices, and still leaves most of the effect artifactual.
  - claimId: MPI-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Flores 2021 states that the original Z "overestimates results, due to the dependency of the variables" and that permutation lowers the scores (E018); the 2023 preprint echoes that simulations diminish earlier results. The claim's first half (violation of independence) is directly attested; the second half (founding results themselves diminish) is a warranted inference pending full reanalysis of 1986-2006 data. Strongest opposing consideration is that the thesis reanalyses its own replications rather than Lucadou's originals, and Filk's objection to upper-right block weighting is noted inside the same thesis.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Walach et al. 2021 convert their own preregistered nulls into "part of the systematic nature of such effects" (E003); Flores reports Lucadou's reply that dependence objections apply only to causal signals and that each replication "must" introduce novelty (E019); the same thesis lists decline itself among post-hoc explanations for a failed no-decline prediction (E020). Successful outcomes are read as entanglement, failures as predicted decline—no nominated experimental result is treated as disconfirmation. Strongest opposing consideration is that Watt & Tierney 2013 and Flores Study 4 show the program can write failable predictions; yet when they fail the model is retained, confirming insulation in practice.