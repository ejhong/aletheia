  synthesis: >-
    The observation rung is secure, and it is not where this case is decided.

    - Lucadou's group did report excess correlations (MPI-C001).

    - Preregistered and blind replications have mostly failed (MPI-C002). The failures are the proponents' own two consensus-protocol runs, Grote's 200-participant blind analysis, his preplanned 2017 analyses, and Flores's Studies 4 and 5. Against them stand three preregistered positives, all from the first three studies of one thesis, one with the experimenter as sole participant.

    - The effects weakened, once reversed, and migrated between analyses and generators (MPI-C003).

    The mechanism rung is also accurately documented. The generalized quantum formalism exists (MPI-C004). The no-transmission axiom and its decline corollary were in print by 2007 (MPI-C005). The matrix design was offered as the model's own test (MPI-C006).

    The case is decided at attribution, and there the structure works against MPI. The model's prediction came true in a trivial sense: the effect declined. But selection on early significance followed by regression to the mean predicts the same arc. The axiom is a prohibition on stable exploitable correlations, and an effect that never existed satisfies it just as well.

    The model's own logic adds a further problem. A stably elevated count of matrix hits would itself be a signal, so its nominated test can only ever yield transient positives, as the 2007 text concedes (MPI-E011). Without an independent marker, transient positives look exactly like false positives. The design's promise to reduce decline was put to a preregistered test inside the program and failed with a reversal (MPI-E020), though that study also changed generator and procedure.

    The positives are what could discriminate, and each is compromised in a documented way:

    - The founding counting method overstates significance when the psychological variables are intercorrelated (MPI-E018).

    - The 2020 two-laboratory surplus was called fragile by its own authors (MPI-E002).

    - The 2023 online surplus rests on a Welch test over non-independent cells, with controls generated differently from experimental series (MPI-E023). Its true-versus-pseudo-random split appears or vanishes with the choice of analysis, and its pseudo-random arm was seeded from participants' swipes (MPI-E021, MPI-E022).

    Rigorous replications are themselves corroboration attempts, so MPI also expects them to fail. "Positives under weak methods, nulls under strong ones" is therefore not decisive on its own.

    The sharper pattern is within single datasets. The same data lose significance under improved analysis (MPI-E002), shrink under a dependence-aware permutation (MPI-E018), or turn significant only in a post-hoc variant (MPI-E006). The 2007 derivation ties decline to replication; nothing in it lets reanalysis of already-collected data wipe out an effect. Analysis-dependence within a dataset is therefore the signature of artifact rather than law. That inference is mine, built on the records.

    MPI's distinctive predictions fare no better:

    - Source dependence is compromised (MPI-C503).

    - Faster decline of stronger effects is untested.

    - Suppression by documentation was tested at only 14 cases.

    Why weakly_supported rather than contradicted? Evidence that the hypothesis predicts as well as its rival cannot refute it, and the proponents have read their failures as the predicted decline (MPI-C010). That immunity is a cost, not a credit. It also means the model earns nothing from the decline it foretold.

    Steelman for MPI:

    - Flores's Studies 1–3 were preregistered and significant under the permutation analysis the thesis offers as its dependence correction.

    - The decline derivation predates the strict failures.

    - In a neighbouring database, a QRP simulation left part of a flagship effect unexplained (MPI-E016).

    Steelman for the conventional reading:

    - Every positive examined closely has weakened under better analysis.

    - The strictest independent test found nothing (MPI-E004).

    - A coding error manufactured this kind of anomaly in a sister correlational line (MPI-E017).

    The conventional account is not itself demonstrated. Joint sufficiency (MPI-C008) remains an inference. So does the reanalysis of the founding datasets (the second half of MPI-C009), since the 1986–2006 raw data were never published.

    My low prior on macroscopic non-local psychophysical correlations comes from general physical background, not from these records. There is no known coupling. In this framework no-transmission must be postulated, because the probabilistic machinery that yields it in quantum theory has been dropped. On the records alone, the verdict holds with less margin.

    Sensitivity: the record whose removal would most change this verdict is MPI-E018. It is the only matrix-specific demonstration that the founding analysis inflated its counts. Without it, the early positives would be impeached only by analogy to other paradigms and by MPI-E002's fragility note. The verdict survives: the strict nulls, the non-discriminating decline, and the compromised modern positives still leave attribution weakly supported. But it would sit near the unresolved boundary.

    No record in the packet is marked provisional; all were weighed.
  steelman: >-
    Flores 2021 Studies 1 and 2 were preregistered, multi-participant replications, the first an exact replication of the founding method. Under the permutation analysis the thesis presents as its dependence-aware correction, both were significant for the whole matrix and for the upper-right block (p = 0.0002 each on the latter).

    None of the four mechanisms named in MPI-C008 straightforwardly explains a preregistered, permutation-calibrated surplus. No record identifies a leak, coding error, or control asymmetry in either study. This assessment discounts them for shared lab, equipment and analytic choices, but it does not explain them.

    A proponent can add two points. The collapse in Studies 4 and 5, after a change of experimenter, generator and procedure, is the sequence the 2007 derivation describes. And the model's most distinctive prediction, that stronger effects decline faster, has never been tested with a prespecified metric.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As a claim about what was reported, this rests on consistent descriptions in successor papers, including the proponents' fully read 2021 paper. That paper says the predecessor experiments "produced more significant correlations than expected by chance and more than seen in a control matrix" (MPI-E001 and the claim's anchor). Confidence is moderate because the 2006 primary text was not examined, the 1986–1987 series appeared mainly in German-language venues and is described second-hand, and whether the experimental-versus-control comparison was formally tested is known only through these descriptions. MPI-E002 concerns the 2020 replication, not the founding series, and adds little here. The strongest opposing consideration bears on validity rather than existence: the founding counting method overstates significance when the psychological variables are intercorrelated (MPI-E018), so this claim establishes what was reported, not that an anomaly occurred.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The failures are consistent across teams: the proponents' two consensus-protocol replications (64 and 40 participants, protocol deposited on OSF) were both non-significant, and their authors called the matrix experiment "not a replicable paradigm" (MPI-E003). Grote's independent 200-participant blind analysis was null (MPI-E004), his three preplanned 2017 analyses were null (MPI-E006), and Flores's preregistered Studies 4 and 5 failed, the first with a reversal (MPI-E020). Against roughly six failures stand three preregistered positives, all from the first three studies of one thesis sharing equipment and personnel, one with the experimenter as sole participant (MPI-E007); that satisfies "predominantly." The claim is locally true but cuts less against MPI than it appears, since the model predicts such failures; its force is against any reading of the paradigm as demonstrating a stable anomaly. The strongest opposing consideration is that Flores's Studies 1–3 were preregistered and significant under permutation, so the strict record is not uniformly null, and two failures were underpowered (Walach's second run at 0.69 power; Grote 2017 with 20 participants).
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Instability is documented throughout. The Walach 2020 surplus was "significant but fragile" and failed two preregistered replications (MPI-E002, MPI-E003); Grote's matrix-family series went from significant (2015) to null on preplanned analyses (2017) to null under blinding (2021) (MPI-E005, MPI-E006, MPI-E004); and Flores's Study 4 reversed, with experimental sessions producing fewer significant correlations than the permutation control (MPI-E020). Migration between analyses and generators is also on record: Grote 2017's significant post-hoc variant, the Study 4 generator split, and the 2023 study's analysis-dependent source contrast (MPI-E006, MPI-E007, MPI-E021). The sign change rests on a paraphrase of letter-spaced pages, and displacement to specific other cells is asserted more than shown, but the claim's disjunctive core does not depend on either. The strongest opposing consideration concerns implication, not truth: "shifted" is a theory-laden word for what a null process spread across thousands of cells produces anyway, so the claim, true as description, carries no weight toward MPI over the conventional account.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The weak (generalized) quantum theory exists as an explicit axiomatization that retains complementarity and entanglement for arbitrary systems (MPI-E010), and the fully read 2007 paper casts MPI's psychophysical correlations and its no-transmission axiom in that framework (MPI-E009, MPI-E011), so the claim's main content is documented. The detail that pragmatic information serves as the "ordering quantity" is not quoted in any evidence record; it rests on the model's name and the claim's extraction, so that component leans on background rather than the ledger, which keeps confidence moderate. The strongest opposing consideration concerns what "instantiates" buys: the framework deliberately drops Hilbert-space structure and Planck's constant. The instantiation therefore supplies vocabulary and qualitative constraints but no calculable predictions; it cannot say how large a matrix surplus should be. The claim's local truth is silent on whether psychophysical entanglement exists.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 2007 paper states the axiom verbatim and derives from it that an apparent effect "will be wiped out" when one tries to corroborate it by replication, and that correlations "may even change sign or disappear altogether, or else show up again in different observables" (MPI-E009). Given the claim's own conditional, the step is deductive: if a stable correlation with a controllable or selectable psychological variable would be a signal channel, an axiom forbidding signals forbids its stability. That derivation was in print a decade or more before the strict failures. For the case, though, what the axiom entails is only a prohibition (no stable, exploitable correlation), which an effect that never existed satisfies equally; it fixes no magnitude, timescale, or choice among decline, reversal and displacement, so its local truth earns MPI little discriminating credit. The strongest opposing consideration is that "in advance of any data" holds only logically and relative to the modern replications: the same text calls this "the well known and often experienced decline effect," so the axiom was framed with the field's decline history in view, which is why confidence is moderate.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      The model's theorists state the rationale verbatim: "make positive use of the evasion phenomenon" through "simultaneous registration of as many different correlations as possible," so that psi shows up as "transitory, jumping" patterns (MPI-E011). The field's theory anthology presents the method as an answer to the repeatability problem (MPI-E012, context only). Reading "reduce the decline effect" as "detect correlations without enabling signal transmission" is a fair gloss given the no-transmission axiom. The evidence is a single source by the model's own authors, documenting the rationale as written in 2007 rather than the 1986 design papers, but for a claim about stated design intent that is the right source. The strongest opposing consideration is internal to the design: a stably elevated count of significant cells would itself be an exploitable channel, so the matrix can only reduce, never remove, the signal capacity the axiom forbids. The same text concedes "it will never be possible to overcome the decline effect completely," which means the model's own logic predicts its nominated test cannot deliver a stable positive.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The decline-and-displacement arc does not discriminate: selection on early significance plus regression to the mean predicts the same sequence, the no-transmission prohibition is satisfied by an effect that never existed, and rigorous replications are corroboration attempts that MPI also expects to fail. The positives that could discriminate are each compromised in a documented way. Founding counts were inflated by variable dependence (MPI-E018); the 2020 two-lab surplus was self-described as fragile (MPI-E002); the 2023 online surplus rests on a Welch test over non-independent cells, with differently generated controls and an analysis-dependent source split (MPI-E021 to MPI-E023); Flores's Study 3 had the experimenter as sole participant and showed causal correlations in its raw data (MPI-E007); and the only field test is mute at 14 cases (MPI-E013). Within single datasets the surplus shrinks or disappears under better analysis, which a replication-triggered decline does not predict but artifact does; that inference, like my low prior on macroscopic psychophysical entanglement, is mine rather than a ledger finding. No record supplies independent evidence for a non-local mechanism or a clean test of MPI's distinctive predictions. The strongest opposing consideration is Flores's Studies 1 and 2: preregistered, multi-participant, and significant under the permutation analysis presented as the dependence-aware correction, with no specific artifact identified in any record (MPI-E007).
  - claimId: MPI-C503
    verdict: mixed
    confidence: high
    reasoning: >-
      On the final cumulative matrix, which the abstract foregrounds, the claim is accurate: Random.org gave t = 3.811, p = 0.00013, and the Mersenne Twister arm gave t = 1.813, p = 0.069 (MPI-E008, MPI-E021). The methods say the authors gave particular emphasis to a second analysis, the average across the 23 cumulative datapoints, and there the pseudo-random arm is also significant (t = 2.972, p = 0.002). The stated contrast therefore holds for one of the paper's two emphasised analyses and fails for the other (MPI-E021). The "deterministic" arm was seeded from participants' swipe timing, so it was not the predetermined-sequence condition the contrast is taken to test (MPI-E022); and a significant/non-significant pair at unequal power (94% versus 67%) is not itself evidence that the arms differ, a point of general statistics rather than a ledger finding. The strongest opposing consideration is that the authors keep the split on effect-size and power criteria that MPI-E021 does not show to be wrong; even granting them, the claim is true of one analysis and false of the other, and as support for source dependence it carries little weight.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Each named mechanism is documented in or near this literature. Analytic flexibility turned Grote 2017's preplanned nulls into a post-hoc p = 0.012 (MPI-E006); variable dependence inflated the founding counting method (MPI-E018); and publication bias is the meta-analysts' preferred, though contested, explanation of the parent micro-PK literature (MPI-E015). The record's shape (positives under flexible or dependence-naive analysis, nulls under blinding and preregistration) is what these mechanisms predict. But joint sufficiency has not been shown for the matrix corpus: the founding datasets have never been reanalysed; the modern program published its nulls, which limits publication bias as an explanation of its own record; and in a neighbouring flagship database a QRP simulation covered about 60% of the effect rather than all of it (MPI-E016). Mundane mechanisms outside the claim's list may be needed to close the gap: a coding error of the kind in MPI-E017, a possible classical route through swipe-seeded generation (MPI-E022), or asymmetric control generation (MPI-E023). The claim as worded does not include them. The strongest opposing consideration is Flores's Studies 1–3: preregistered and significant under permutation, they are not straightforwardly explained by regression, flexibility, publication bias, or the dependence the permutation was meant to absorb (MPI-E007).
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The first half is directly supported: analysing her own exact replication both ways, Flores concludes that "the original Z overestimates results, due to the dependency of the variables," and that the permutation analysis "lowered the results" (MPI-E018). The second half, that dependence-aware reanalysis substantially diminishes the founding 1986–2006 results, is an inference. The thesis reanalyses its own replication data, the founding raw data were never published, and no reanalysis of them exists; the claim's anchor sentence from the 2023 paper ("the results from these studies diminished") does not say which studies. Lucadou's reported reply that the objection holds only where causal signals hold (MPI-E019) does not rebut it on general statistical grounds, since the inflation is a property of the null distribution whatever the alternative; that judgement is mine rather than a ledger finding. The strongest opposing consideration is that in the one dataset analysed both ways, experimental sessions still exceeded control after the correction, so dependence diminishes the surplus without necessarily eliminating it. Until the founding data are reanalysed, the claim is supported in its mechanism and provisional in its scope.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The documented readings fit the claim. The proponents' preregistered failures were interpreted in the same abstract as "likely part of the systematic nature of such effects" (MPI-E003); a failed preregistered no-decline prediction was explained by a list in which the decline effect itself stands beside the experimenter, the instructions and boredom (MPI-E020); the dependence objection was reportedly set aside as applying only to causal signals, and each replication is required to introduce novelty, so no failure counts as a failure to replicate (MPI-E019); and the 2007 rationale concedes in advance that sceptics will never all be convinced (MPI-E011). Successes, meanwhile, are titled as evidence for anomalistic correlations (MPI-E002). The one outcome the model's logic would count against it, a stable and exploitable surplus, is one that both MPI and the null say cannot occur, so it is not a feasible outcome. Confidence is moderate because MPI-E019 is a supervisee's second-hand report of the model's author, and the universal quantifier rests on a handful of documented episodes. The strongest opposing consideration is that the model has been exposed to failable tests (Flores's preregistered no-decline hypothesis and the Watt & Tierney field design, MPI-E013), so the insulation lies in how outcomes have been read rather than in the model's logic, and binding criteria could still be elicited.