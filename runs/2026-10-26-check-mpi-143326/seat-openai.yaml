  verdict: weakly_supported
  loadBearing: [MPI-C003, MPI-C005, MPI-C007, MPI-C008, MPI-C010]
  weakestLinks: [MPI-C001, MPI-C009, MPI-C503]
  synthesis: >-
    The ledger establishes several local facts more securely than it establishes
    MPI's central attribution. The correlation-matrix program reported positive
    results, including the original series and the larger 2020 experiment, while
    later preregistered or blinded tests often returned null, reversed, or
    analysis-dependent outcomes. Thus instability is a genuine feature of the
    reported record. It is also clear that MPI and its no-transmission principle
    predicted decline, sign changes, and displacement in print before the
    prominent 2017–2021 failures, and that the matrix design was expressly
    proposed as a way to accommodate such evasion. These historical and
    theoretical claims do not, however, establish that the instability was
    caused by non-local psychophysical correlations.

    The strongest case for MPI is that it identified an unusual-looking pattern
    in advance: significant findings arise, then disappear, reverse, or migrate
    when investigators tighten or repeat the protocol. The 2020 positive result,
    the first three Flores studies, and the 2023 online true-random-source result
    prevent the record from being characterized as an uninterrupted sequence of
    nulls. In particular, the first two preregistered Flores studies reportedly
    retained large experimental-control differences under their permutation
    analysis. A proponent can therefore argue that the combination of transient
    positives and subsequent failures resembles MPI's qualitative forecast more
    closely than a simple claim of a constant effect would.

    The stronger counterargument is that MPI has not supplied a calibrated,
    prospectively binding probability distribution for this pattern. Null
    effects, sign changes, isolated significant analyses, and migration among
    many cells are also expected when dependent variables, analytic flexibility,
    selection, and regression to the mean operate on noisy data. The strictest
    independent blind analysis was null, two consensus-protocol replications
    were null, and a preregistered prediction of little or no decline failed.
    Direct evidence shows that the original Z method overstates results when
    variables are dependent, although the founding datasets have not themselves
    received the required dependence-aware reanalysis. The 2023 random-source
    contrast likewise disappears on another emphasized analysis and rests on a
    design whose cells may not be independent.

    MPI therefore receives weak rather than no support: its qualitative
    prediction genuinely precedes important failures, and some positive
    observations remain unexplained. Yet the evidence does not discriminate its
    exotic attribution from ordinary statistical processes, while proponents'
    treatment of both successes and failures as compatible with MPI sharply
    reduces its evidential risk. A general scientific prior against novel
    non-local psychophysical mechanisms also lowers plausibility, but the verdict
    chiefly rests on the packet's null blind tests, fragile positives, and
    under-specified predictions. The single record whose removal would most
    change this verdict is MPI-E003, because it contains two preregistered
    consensus-protocol failures by the proponent team itself. The
    weakly_supported verdict survives without it because MPI-E004, MPI-E006,
    MPI-E020, and the unresolved dependence problems independently preserve the
    same structural conclusion.
  steelman: >-
    The first two preregistered Flores studies each reported p = 0.0002 for the
    designated upper-right matrix block and significant whole-matrix results
    under permutation analysis; this assessment has no independent reanalysis
    that explains those repeated experimental-control surpluses as artifacts.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      MPI-E001 documents that the original program was repeatedly described as
      reporting more significant experimental-session correlations than chance
      or control matrices, and MPI-E002 supplies a later positive result from
      the same research line. The claim concerns what was reported, not whether
      the reported excess was valid. The strongest opposing consideration is
      that the founding texts and raw data were not examined directly, while
      dependence-aware methods may undermine the analyses behind those reports.
  - claimId: MPI-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      MPI-E003 reports two null consensus-protocol replications, MPI-E004 a null
      blind analysis of 200 participants, and MPI-E006 null results for all
      three preplanned analyses. MPI-E020 adds a failed preregistered prediction
      followed by an exact replication with no significant result. The
      strongest opposing consideration is MPI-E007: three of five preregistered
      in-house studies were reported significant, although one used the author
      as its sole participant and the final two failed.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      The sequence represented by MPI-E003, MPI-E005, MPI-E006, MPI-E007, and
      MPI-E020 contains weakening, null results, a reversal, and significance
      appearing only under a post-hoc analysis. MPI-E014 independently describes
      decline and displacement as recurring patterns in the wider field. The
      strongest opposing consideration is that these studies are not all exact
      replications, so some instability could reflect changes in protocols,
      equipment, participants, or analyses rather than change in one fixed
      effect.
  - claimId: MPI-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      MPI-E010 supports the existence of an explicit weak-quantum framework
      extending complementarity and entanglement to arbitrary systems after
      removing ordinary quantum theory's Hilbert-space and Planck-constant
      structure. The MPI theory records are consistent with applying that
      framework to psychophysical systems. The strongest opposing consideration
      is that the provided evidence does not directly document, at comparable
      formal detail, how pragmatic information becomes the ordering quantity,
      and the framework lacks quantitative probabilities.
  - claimId: MPI-C005
    verdict: well_supported
    confidence: high
    reasoning: >-
      MPI-E009 quotes the theory deriving decline, faster decline for stronger
      effects, sign changes, disappearance, and displacement from its
      no-transmission principle. This establishes the stated content of MPI
      before the later high-profile replication failures. The strongest
      opposing consideration is that no-transmission alone does not transparently
      entail decline without additional assumptions, and terms such as
      exploitability and displacement lack prespecified quantitative criteria.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: >-
      MPI-E011 explicitly states that many simultaneous correlations should be
      registered so that psi can appear as transitory, jumping patterns while
      reducing the decline problem. This directly establishes the matrix
      design's intended role within MPI. The strongest opposing consideration is
      that the evidence comes from the theory's own authors and establishes the
      design rationale, not that the design successfully detects entanglement
      correlations.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      MPI-E002, MPI-E007, and MPI-E008 provide positive observations that are
      compatible with transient anomalous correlations, and the observed
      instability resembles MPI's qualitative prediction. Against that,
      MPI-E003 and MPI-E004 are rigorous null replications, while MPI-E018 and
      MPI-E023 identify dependence concerns capable of inflating matrix
      evidence. The strongest opposing consideration is that no positive result
      in the packet is both independently replicated and robust under
      prespecified dependence-aware analysis, so the record does not uniquely
      support a non-local cause. A prior against novel psychophysical non-locality
      lowers plausibility, but the verdict primarily reflects this empirical
      failure to discriminate MPI from noise and selection.
  - claimId: MPI-C503
    verdict: mixed
    confidence: high
    reasoning: >-
      The final cumulative-matrix analysis reported in MPI-E021 was significant
      for Random.org and not significant for Mersenne Twister, matching the
      claim's literal contrast for that endpoint. However, the other analysis
      emphasized by the paper found significant results for both sources, so the
      unqualified contrast is analysis-dependent. MPI-E022 further shows that
      the pseudo-random arm was seeded from participant behavior rather than
      providing a clean, pre-fixed deterministic control. The strongest
      consideration supporting the claim is therefore the final-endpoint result;
      the strongest opposing consideration is that the average analysis removes
      the significance split.
  - claimId: MPI-C008
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      MPI-E006 directly demonstrates a significant post-hoc result emerging from
      data whose preplanned analyses were null, while MPI-E018 demonstrates
      inflation from dependent variables and MPI-E015 documents publication
      bias in the neighboring REG literature. The strict null replications are
      also consistent with regression and selection acting on earlier
      positives. The strongest opposing consideration is that no evidence record
      fits a complete conventional model to the matrix corpus or reanalyzes the
      founding datasets, and MPI-E016 found that modeled research practices did
      not fully explain a neighboring psi database.
  - claimId: MPI-C009
    verdict: mixed
    confidence: moderate
    reasoning: >-
      MPI-E018 directly reports that dependent variables caused the original Z
      method to overestimate results when applied to an exact replication and
      that permutation analysis lowered the result. This supports the dependence
      objection to the founding method. The claim's stronger second part is not
      established because Lucadou's 1986–2006 datasets were not themselves
      reanalyzed, and the permutation analysis of Flores's own data still left
      an experimental-control excess. That absence of a direct founding-data
      reanalysis is the strongest opposing consideration.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      MPI-E003 records failed replications being interpreted as part of the
      systematic nature of psi, while MPI-E019 reports that statistical
      dependence was restricted to causal signals and that every replication
      should introduce novelty. MPI-E020 further shows a failed preregistered
      prediction followed by multiple auxiliary explanations, including the
      decline effect itself, rather than rejection of MPI. The strongest
      opposing consideration is that proponents did formulate and publish a
      failable no-decline prediction, and MPI-E013 shows that a separate field
      prediction can be operationalized; the packet therefore supports
      insulation in practice more strongly than the absolute assertion that no
      feasible disconfirming outcome exists.