  synthesis: >-
    The ledger's observation rung establishes a clear historical pattern: early correlation-matrix reports (Lucadou group 1986–2006 and the 2020 two-lab positive) claimed excess psychological–physical correlations relative to controls or chance, yet every adequately powered, preregistered or fully blinded subsequent test (Walach et al. 2021 consensus-protocol pair, Grote 2021 blind analysis of 200 participants, Grote 2017 preplanned analyses, Flores Studies 4–5) returned null or reversed results. Effects that did appear were unstable across replications, changing sign, migrating across cells, or vanishing under tighter analysis—exactly the surface pattern MPI was written to accommodate. On the mechanism rung the model itself is accurately described: Generalized Quantum Theory supplies a formal weak-quantum scaffold, the no-transmission axiom is stated in print by 2007 and does entail decline or displacement whenever a protocol would permit signal use, and the matrix design was explicitly offered as the model's own test that tries to harvest fleeting correlations without enabling transmission. Those theoretical claims are therefore locally true as statements about the literature. The attribution rung, however, decides the case. The same record is jointly explained by ordinary statistical artifacts—regression to the mean after flexible early analyses, publication and selection bias documented in the broader micro-PK meta-analyses, coding and analytic-flexibility errors that have already produced false positives inside neighboring correlational PK lines, and, most decisively, the dependence among psychological variables that inflated the original Z-count method. Flores's own reanalyses inside the program show that dependence-aware permutation tests substantially lower the excess-correlation tallies; the founding datasets have never been subjected to the same correction. When proponents confront nulls they re-describe them as the predicted decline or as insufficient novelty, rendering the model's nominated experiments incapable of disconfirmation. The 2023 online positive is itself analysis-dependent and methodologically compromised (cell-count power, swipe-seeded “pseudo-random” arm, no preregistration). Consequently the genuine-entanglement interpretation (C007) is not required by any surviving result and is contradicted by the cleanest tests. The decline is what noise, dependence, and selection produce; MPI's law-like prediction is an after-the-fact gloss on a null effect. This verdict rests on the convergence of multiple independent nulls and the dependence critique rather than on any single paper; it would weaken if the founding raw data were reanalyzed and the surplus restored under dependence-aware methods, but no such restoration exists in the ledger.
  steelman: >-
    The 2023 online matrix's true-RNG arm still yields a large, high-powered experimental–control difference on the final-matrix Welch test even after the average-analysis and seeding qualifications, and no conventional account yet supplies a positive mechanism that would preferentially couple atmospheric-noise bits (but not a swipe-seeded PRNG) to the psychological variables under an otherwise identical gamified protocol; that residual source-dependent surplus remains an unrebutted, if fragile, observation a proponent can legitimately cite.
claimAssessments:
  - claimId: MPI-C001
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Multiple successor papers (Walach 2020/2021, Grote 2021) uniformly describe the 1986–2006 Lucadou-group matrices as having produced more significant psychological–physical cells than controls or chance expectation; E001 and E002 directly support the reporting claim. The strongest opposing consideration is that the original raw data remain unpublished and the analyses predate dependence-aware methods, so the numerical excess may be inflated, yet the claim is only that the experiments reported the excess, which is historically secure.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: >-
      Walach et al. 2021 (two preregistered consensus-protocol replications, neither significant), Grote 2021 (fully blinded 200-participant analysis, null), Grote 2017 (three preplanned analyses all null), and Flores Studies 4–5 (preregistered, null or reversed) form a consistent failure record under the strictest modern controls. The sole opposing consideration is the handful of earlier or less-controlled positives, which do not meet the preregistered/blind criterion the claim invokes.
  - claimId: MPI-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Within-experimenter series (Grote 2015 significant distribution result followed by 2017/2021 nulls) and the broader matrix sequence (2020 fragile positive, 2021 nulls, Flores early positives then Study-4 reversal) document weakening, sign change, and cell migration. Kennedy 2003 supplies the field-wide backdrop. The opposing consideration is that some displacement could be read as theoretically interesting rather than mere instability, but the observational claim itself holds.
  - claimId: MPI-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Atmanspacher, Römer & Walach 2002 axiomatizes weak quantum theory retaining complementarity and entanglement while dropping Hilbert-space structure, explicitly allowing non-physical applications; MPI is the psychophysical instantiation using pragmatic information. E010 confirms the formal publication. The opposing consideration is that the framework purchases generality by sacrificing quantitative predictions, yet the claim is only that the extension exists and is explicit.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: >-
      The 2007 JCS paper states the no-transmission axiom verbatim and derives from it, in advance of the later failures, that apparent effects will decline, change sign, or displace under replication attempts, with stronger effects declining faster. E009 supplies the primary-text support. No opposing textual evidence exists; the claim is about entailment inside the model, not empirical truth.
  - claimId: MPI-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      The same 2007 paper explicitly recommends simultaneous registration of many correlations so that psi appears as “transitory, jumping” matrix patterns, thereby making positive use of evasion; later sources treat the matrix as MPI’s own proposed test. E011 is decisive. The opposing consideration is that the design concedes it will never convince every skeptic, which some read as a built-in escape clause, but that does not falsify the methodological-intent claim.
  - claimId: MPI-C007
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The cleanest tests (preregistered and blind replications) return nulls, the founding positives are known to be inflated by variable dependence, and conventional artifacts jointly cover the early surplus-plus-decline pattern; no result in the ledger requires non-local psychophysical entanglement. The strongest opposing consideration is the residual 2023 true-RNG surplus and the field-wide elusiveness pattern, yet both remain compatible with selection and analysis artifacts once dependence and flexibility are admitted.
  - claimId: MPI-C503
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The abstract and final-matrix Welch test show significance for Random.org and not for Mersenne Twister, yet the paper’s own average-across-datapoints analysis yields significance for both arms, the pseudo-random arm was seeded from participant swipe timing (introducing a possible classical pathway), and power was uneven. E021 and E022 therefore leave the claimed clean split analysis-dependent rather than robust. The opposing consideration is that the authors still defend a source difference on effect-size grounds, so the observation is not wholly erased.
  - claimId: MPI-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      Bösch 2006 documents tiny heterogeneous micro-PK effects consistent with publication bias; Bierman 2016 shows QRPs can account for a large fraction of a neighboring meta-analytic effect; Maier & Dechamps 2022 caught a coding error that had manufactured a correlational PK positive; Grote 2017’s post-hoc significant variant on null preplanned data illustrates analytic flexibility; and the dependence critique (C009) removes the remaining founding surplus. Jointly these suffice. The strongest opposing consideration is Bierman’s residual significance after QRP adjustment in ganzfeld, but that database is not the matrix corpus and the parameter values needed for a full null were judged unrealistic only under unverified QRP-frequency assumptions.
  - claimId: MPI-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Flores 2021 explicitly states that the original Z-score method overestimates results because of psychological-variable dependence and that permutation analyses lower the tallies (while still leaving some experimental excess in her own early studies). E018 is primary-text support from inside the program. The opposing consideration is that the thesis reanalyzes its own replications rather than the 1986–2006 raw datasets themselves, so the precise degree of diminution of the founding results remains an extrapolation, albeit a well-motivated one.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Walach et al. 2021 interpret their own preregistered nulls as “part of the systematic nature of such effects”; Flores reports Lucadou’s reply that dependence inflation applies only to causal signals and that each replication must introduce novelty so that decline is expected; the same thesis lists the decline effect itself among post-hoc explanations after a preregistered no-decline prediction failed. E003, E019 and E020 document the insulation in practice. The strongest opposing consideration is that Watt & Tierney and the Flores Study-4 preregistration show the program can write failable predictions, yet when those predictions fail the model is retained rather than counted as disconfirmed.