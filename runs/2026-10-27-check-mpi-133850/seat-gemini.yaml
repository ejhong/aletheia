  synthesis: >-
    The Model of Pragmatic Information (MPI) represents an intellectually ambitious attempt to resolve the defining crisis of parapsychological research: the inability to reliably reproduce anomalous effects under controlled conditions. Grounded in Generalized Quantum Theory (GQT), MPI posits that psychophysical phenomena are non-local entanglement correlations that cannot, by fundamental axiomatic constraint, transmit a usable causal signal. Under this framework, any protocol designed to stabilize, isolate, or exploit an anomalous effect inevitably forces the correlation to decline, invert, or displace to unmonitored system variables. To evade this suppression, proponents designed the correlation-matrix method, which disperses observations across hundreds or thousands of psychological and physical variable pairs.

    However, the empirical and methodological ledger does not sustain the claim that this elusive behavior reflects a genuine law of nature. When the correlation-matrix paradigm was subjected to rigorous, preregistered protocols and blind analysis—most notably by Walach et al. (2021) and Grote (2021)—the purported excess correlations failed to manifest. Furthermore, the conventional statistical counter-hypothesis is robust and parsimonious: large correlation matrices naturally generate spurious nominal significance when variable intercorrelations violate independence assumptions, as demonstrated by the methodological evaluations in Flores (2021) and Flores & Rapazote-Flores (2023). Combined with analytic flexibility, small-study publication bias (Bösch 2006), and documented coding vulnerabilities (Maier & Dechamps 2022), standard methodological noise fully accounts for the rise and fall of these effects.

    The epistemic posture of MPI further undermines its empirical standing. As demonstrated in Walach et al. (2021), null results from consensus-protocol replications are absorbed post hoc as evidence verifying the model's evasion prediction. This circular insulation ensures that no experimental outcome can disconfirm the theory, reducing MPI from an empirical scientific model to an unassailable explanatory framework. While exploratory results such as the permutation-resistant surpluses in Flores's early thesis studies remain intriguing, they do not overcome the decisive failure of the paradigm under blinded, preregistered conditions.

    Sensitivity analysis indicates that Walach et al. (2021) (MPI-E003) is the single most influential evidence record against the hypothesis, as it represents the proponents' own preregistered replication failure. Nevertheless, the case verdict of weakly_supported comfortably survives its hypothetical removal: the completely blind, independent null result of Grote (2021) (MPI-E004), coupled with the pervasive statistical dependence documented in MPI-E018 and MPI-E022, is independently sufficient to establish that the matrix surplus does not withstand sound methodological controls.
  steelman: >-
    In Appendix 11 of the Flores (2021) doctoral thesis, raw data from Study 1 and Study 2 retained a statistically significant surplus of matrix correlations (p = 0.0002 for Study 1) when evaluated against 10,000 Monte Carlo permutations specifically constructed to preserve the observed intercorrelations of the psychological variables, an empirical result that direct dependence critiques have not quantitatively overturned.
claimAssessments:
  - claimId: MPI-C001
    verdict: established
    confidence: high
    reasoning: >-
      The historical literature confirms that Lucadou's research group consistently reported significant surpluses of correlations between psychological and physical variables compared to chance and control matrices between 1986 and 2006. This is attested in subsequent literature reviews and program retrospectives, including Walach et al. (2020, 2021). The strongest opposing consideration is that the original raw data have never been made available for independent audit, leaving the validity of the reported statistics reliant entirely on the authors' own descriptive publications.
  - claimId: MPI-C002
    verdict: established
    confidence: high
    reasoning: >-
      The methodologically rigorous replications that utilized formal preregistration and blind analysis failed to reproduce the anomalous excess correlation effect. Specifically, the preregistered consensus-protocol replications by Walach et al. (2021) and the fully blinded analysis by Grote (2021) both yielded null results on their primary preplanned endpoints. The strongest opposing consideration is that Flores (2021) reported statistically significant permutation results in three out of five replication studies, though these lacked formal blind-analysis protocols.
  - claimId: MPI-C003
    verdict: established
    confidence: high
    reasoning: >-
      Across the multi-decade trajectory of the correlation-matrix paradigm, reported statistical anomalies have consistently failed to hold their ground, shifting across matrix cells, fading upon exact replication, or reversing sign. This pattern is evident in Grote's study sequence (2015, 2017, 2021), Flores's thesis studies where later studies showed null or reversed effects (MPI-E019), and field-wide parapsychological reviews (Kennedy 2003). The strongest opposing consideration is that proponents do not dispute this instability, but rather cite it as an empirical verification of MPI's core theoretical prediction of displacement.
  - claimId: MPI-C004
    verdict: established
    confidence: high
    reasoning: >-
      Generalized Quantum Theory (GQT), formulated by Atmanspacher, Römer, and Walach (2002), formally axiomatizes non-commutative complementarity and entanglement relations without physical constants or Hilbert space structures. The Model of Pragmatic Information explicitly adopts this mathematical framework to treat psychophysical systems as entangled states organized by pragmatic information. The strongest opposing consideration is that by discarding Hilbert space and metric probabilities, GQT functions as an abstract algebraic analogy rather than an operationalized physical theory capable of calculating quantitative cross-sections.
  - claimId: MPI-C005
    verdict: established
    confidence: high
    reasoning: >-
      The theoretical literature conclusively documents that MPI's no-transmission axiom was in print well before the modern replication failures, explicitly deriving that anomalous correlations must decline, reverse, or displace if an experiment attempts to exploit or confirm them. Lucadou, Römer, and Walach (2007) published this deduction verbatim, predicting an inverse relationship between effect strength and reproducibility. The strongest opposing consideration is that this derivation is qualitative rather than mathematically rigorous, lacking formal boundary conditions that define what exact degree of experimental stabilization triggers decline.
  - claimId: MPI-C006
    verdict: established
    confidence: high
    reasoning: >-
      The correlation-matrix design was explicitly formulated by Lucadou and collaborators as an operational test intended to accommodate MPI's non-transmission constraint. As detailed in Lucadou, Römer, and Walach (2007), recording hundreds or thousands of simultaneous correlations was intentionally designed to distribute putative entanglement across multiple non-signal channels to evade systematic suppression. The strongest opposing consideration is that from a standard methodological perspective, the design creates massive multiple testing and statistical dependence, resembling an optimal recipe for generating false positives rather than a principled test of non-locality.
  - claimId: MPI-C007
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The hypothesis that matrix surpluses stem from genuine non-local psychophysical entanglement is undermined by repeated failures under rigorous preregistration and blinding, such as Walach et al. (2021) and Grote (2021). The occasional positive findings are heavily confounded by statistical dependence across matrix cells and researcher degrees of freedom. The strongest opposing consideration is that in Flores (2021), Studies 1 and 2 reportedly maintained a statistically significant surplus even when evaluated against 10,000 non-parametric session permutations designed to control for variable intercorrelations.
  - claimId: MPI-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Standard methodological and statistical phenomena—including intercorrelation among matrix cells, flexible post-hoc analyses, publication bias, and software errors—adequately account for the observed empirical record. Field-wide meta-analyses (Bösch 2006) and documented software false-positives (Maier & Dechamps 2022) demonstrate that nominal psi effects routinely dissipate when screened for ordinary artifacts. The strongest opposing consideration is Bierman et al.'s (2016) simulation demonstrating that realistic rates of questionable research practices accounted for only ~60% of effect size in neighboring psi paradigms, suggesting that selection bias alone may not easily explain all historical anomalies without extreme parameter assumptions.
  - claimId: MPI-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Analyses conducted by Flores (2021) and Filk confirmed that matrix cells violate independent-observation assumptions due to high intercorrelations among psychological measures, causing naive control comparisons to overstate significance. However, this reanalysis has only been documented in thesis and preprint literature for Flores's own data, rather than in an independent, peer-reviewed reanalysis of Lucadou's original 1986–2006 datasets. The strongest opposing consideration is that when Filk applied a 10,000-iteration permutation test to Flores's Study 1 data, the surplus correlation count remained well above the permuted null distribution, indicating that dependence alone did not completely erase every observed surplus.
  - claimId: MPI-C010
    verdict: well_supported
    confidence: high
    reasoning: >-
      Proponents have structured the Model of Pragmatic Information such that both positive and null empirical results are interpreted as confirming the theory. In Walach et al. (2021), the failure of two preregistered replications was interpreted not as evidence falsifying the matrix effect, but as an empirical manifestation of the predicted systematic decline effect. The strongest opposing consideration is that proponents have occasionally proposed distinct structural predictions, such as the documentation effect tested by Watt & Tierney (2013) or source-dependent effects, which could in principle provide falsification pathways if formalized with binding quantitative thresholds.
  - claimId: MPI-C503
    verdict: contradicted
    confidence: high
    reasoning: >-
      The preprint reporting the 2023 online experiment does not support the claim that an experimental-control difference was present with a true RNG but absent with a pseudo-RNG. In Flores & Rapazote-Flores (2023), the Mersenne Twister pseudo-RNG condition actually produced a highly significant difference in the paper's primary average analysis across cumulative matrices (p = 0.0029), displaying the exact same sign structure as the true RNG arm. The strongest opposing consideration is that when looking exclusively at the single last-datapoint analysis, the Welch's t-test reached nominal significance in the Random.org arm (p = 0.00013) while remaining non-significant in the Mersenne Twister arm (p = 0.070).