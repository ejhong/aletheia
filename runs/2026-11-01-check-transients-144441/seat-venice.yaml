caseAssessment:
  verdict: mixed
  loadBearing: [TRN-C001, TRN-C020, TRN-C005, TRN-C006, TRN-C011]
  weakestLinks: [TRN-C023, TRN-C022, TRN-C118, TRN-C117, TRN-C108]
  synthesis: >-
    The case divides cleanly by rung, and the division is the finding. The lowest rungs are genuinely settled: the April 1950 nine marks are physically present on surviving Edinburgh copy material (TRN-E002, confirmed by the skeptical camp itself), recovered by a from-scratch independent pipeline (TRN-E008), and — per the unreviewed Yang & Villarroel microscopy — present on the original telescope negative (TRN-E022). The copy-genealogy mechanism (TRN-C007) is documented fact. But the rung that matters, TRN-C020 (light through the telescope versus mark in the emulsion), is explicitly unresolved by the ledger's own most decisive record: TRN-E024 reports that microscopy cannot distinguish a sub-second flash from an emulsion defect, that the independent microscopist leaned defect, and that the parallax test is infeasible for these events. The most promising discriminator, the Hamburg coma signature (TRN-C011), is a single-author preprint never blind-validated against a defect bestiary. The ensemble layer is contested rather than settled: the shadow deficit and nuclear-window correlation replicate when independent code reanalyzes the authors' own 107,875 rows (TRN-E010, TRN-E015) but dissolve or become schedule-driven under independent extraction and corrected null distributions (TRN-E009, TRN-E011), and the proponents' rebuttal defends statistical power without answering the unvalidated-catalog charge (TRN-E012). The attribution rungs inherit all of this: nothing in the record distinguishes artificial from natural near-Earth objects (Cann's dusty-plasma proposal even offers a natural alternative), and the extraterrestrial-artifact claim is conceded unfalsifiable by its own proponents (TRN-E083). Weighing only these records, the honest verdict is mixed: real features of real plates, an unresolved origin crux, contested population statistics, and an attribution ladder whose top rungs rest on toy-model fit rather than measurement. The decisive unmade measurements — flash-profile calibration, blind coma validation, a measured fault rate on 103a-E emulsion, and an independently reconstructed catalog — are all correctly identified in the research agenda.
  steelman: >-
    The coma-aberration result on Hamburg Doppel-Reflektor plates (TRN-E014) is the argument for the hypothesis this assessment cannot answer: transient candidates there show the off-axis coma pattern expected of point sources imaged through the telescope's parabolic optics, on an independent telescope, emulsion stock, archive, and digitization lineage that the Palomar copy-defect mechanism cannot reach, and no record in this ledger rebuts, reanalyzes, or blind-tests it. If that discriminant survives validation, it is a physical incident-light detector that would convert TRN-C020 from unresolved to supported independent of every catalog-provenance dispute here.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: low
    reasoning: >-
      This claim depends entirely on TRN-C020 and TRN-C021, and both fail: the flash-versus-defect crux is acknowledged unanswerable by current evidence (TRN-E024), and the near-Earth attribution rests on a contested shadow deficit (TRN-E011 vs TRN-E010). The strongest opposing consideration is that no record establishes artificiality at all — Cann's proposal (TRN-E020) supplies a candidate natural mechanism, so even a confirmed near-Earth population would not deliver this claim. Nothing in the ledger bears on artificiality directly.
  - claimId: TRN-C023
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      The claim asserts extraterrestrial technological artifacts as fact, but its own proponents state the intelligence interpretation is "unfortunately not falsifiable" (TRN-E083) and hedge the supporting toy-model comparison with "nature can always surprise us" (TRN-E073). No evidence record offers any discriminating observation between extraterrestrial and terrestrial-artificial or natural origins. The verdict concerns testability rather than truth; the claim currently has no refuting or confirming test anywhere in the record.
  - claimId: TRN-C021
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim requires TRN-C020 (light entered the telescope), which is unresolved because microscopy cannot classify the canonical marks (TRN-E024). Its positive evidence is the Earth-shadow deficit, which replicates on the original rows (TRN-E010, TRN-E015) but loses significance under corrected nulls derived from the spatially heterogeneous background (TRN-E011). The strongest opposing consideration is that the entire inference is conditional on a working catalog whose rows were never validated as optical transients, which Watters et al. state directly.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The marks are real emulsion features on the original glass (TRN-E022), so the question narrows to flash versus intrinsic defect — and the examination's own authors report microscopy cannot separate the two (TRN-E024), with the independent microscopist leaning defect. Supporting TRN-C020, the coma signature (TRN-E014) and Hamburg analogs (TRN-E013) suggest incident light on an independent lineage, but neither is blind-validated. The strongest opposing consideration is the mirror-image finding of over a hundred look-alike detections on the neighboring plate (TRN-E228), which shows star-like spurious marks at rates that would explain isolated events without any flash.
  - claimId: TRN-C007
    verdict: established
    confidence: high
    reasoning: >-
      Hambly & Blair document the contact-printing genealogy: DSS and SuperCOSMOS scan independent copy negatives descended from one shared intermediate positive (TRN-E005, strength strong, from an author of SuperCOSMOS itself). The claim asserts the pathway exists, not that it was used, so the opposing consideration — that the canonical events are now known to sit on the original negative (TRN-E023) — limits the mechanism's reach to the catalog population but does not touch the genealogical fact. The mechanism is uncontested in the record.
  - claimId: TRN-C001
    verdict: established
    confidence: high
    reasoning: >-
      Three independent lines converge: the discovery report (TRN-E001), physical inspection of the Edinburgh copy plates by the critics themselves confirming all nine at the published positions and absent from E0086 (TRN-E002, strong), and an independent pipeline recovering eight of nine (TRN-E008). The strongest opposing consideration is that E002 also found similar detections on E0086 absent from E0070 and a visible blemish population, showing the marks are one instance of a common defect class rather than unique — but that bears on interpretation, not on this observational claim as stated.
  - claimId: TRN-C024
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The Yang & Villarroel microscopy reports all nine sources on the original Caltech glass at their published positions (TRN-E022), which would settle this claim, but the record is an unreviewed, unblinded preprint whose load-bearing registration has not been independently checked. The strongest opposing consideration is procedural rather than substantive: the inspection was performed by the proponents' group, and outside verification (TRN-R001) does not yet exist. The manuscript's candor against interest — quoting the microscopist's defect-leaning opinion — raises its credibility but does not substitute for review.
  - claimId: TRN-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The SuperCOSMOS profile statistics place all nine candidates on the sharp side of the stellar distribution with a joint probability of order 0.1⁹ (TRN-E003, strong), and both camps accept the measurement (TRN-E023 records the same sharpness on the original glass). The strongest opposing consideration is the proponents' own point that photographic non-linearity makes fainter images narrower regardless of origin (TRN-E236), so the comparison may not be magnitude-matched — which qualifies interpretation without overturning the reported measurement.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The event is peer-reviewed (TRN-E007, MNRAS), independently recovered three-for-three by a from-scratch pipeline (TRN-E008), and reported present on a Harvard copy plate and in the original survey digitization (TRN-E022). The strongest opposing considerations are that no physical inspection of the event's original negative exists (co-presence in the digitization is inference, per TRN-E022's limitations) and that these star-like profiles contrast with the 1950 nine's sharper ones, so the canonical events are morphologically heterogeneous.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      Hayes's fully independent pipeline, with no reference to the VASCO software or candidate lists, recovers 8/9 and 3/3 of the canonical events at ~0.2 false positives per control field and matches 63.9% of the published catalog (TRN-E008, strong). The strongest opposing consideration is that the extraction reads the same digitized lineage rather than independent material, so this establishes software-independence, not material-independence; the same record also shows the wider population is 500-fold sensitive to vetting choices.
  - claimId: TRN-C101
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Laboratory fault rates of 0.066–0.377 per cm² on other emulsions scale to 83–475 star-like faults per POSS-I plate (TRN-E227), the mirror-image test found over a hundred look-alikes of the nine famous marks on one neighboring copy plate (TRN-E228), and the proponents themselves concede star-like defects exist with unknown false-positive fraction (TRN-E229). The strongest opposing consideration is Hambly & Blair's own note that the best-documented star-like defect class (microdots) is not reported on 103a-type emulsions (TRN-E231), so the transfer of rates across emulsions is the open step.
  - claimId: TRN-C102
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The mechanism's direction follows from ordinary optics — a sub-second flash avoids accumulated tracking error and wind-shake (TRN-E232, TRN-E006) — but theTokovinin reference the proponents cite treats seeing-freezing as a millisecond phenomenon (TRN-E233), and Watters records that neither the flash half nor the defect half of the sharpness comparison has been measured on POSS-I emulsion (TRN-E234). The strongest opposing consideration is that the proponents themselves concede profile sharpness alone cannot distinguish artifact from astrophysical origin (TRN-E235), so even if true the mechanism is not diagnostic.
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      A search of Hamburg Schmidt plate pairs reports transients similar to VASCO's, with narrow FWHM relative to stellar PSFs, on an independent telescope, emulsion, archive, and digitization lineage (TRN-E013). The strongest opposing consideration is the author's own preliminary label and the absence of any false-positive calibration or injection/recovery testing — without a measured candidate rate against matched controls, "similar phenomenon" and "similar defect susceptibility" remain indistinguishable.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      A single-author preprint reports that Hamburg transient images show the coma pattern expected of off-axis point sources through the optics, a signature the paper itself says does not establish the light's physical origin (TRN-E014). The strongest opposing consideration is that the coma classifier has never been blind-validated against known defects, and defect classes mimicking directional asymmetry have not been excluded; the result also applies only to Hamburg candidates and validates no Palomar event.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The deficit replicates under independently written code on the authors' rows (TRN-E010) and persists after ML artifact-scoring (TRN-E015), but Watters et al. show the uniform-random background assumption is false and report no significant deficit under the proper null (TRN-E011), while the proponents' own later work concedes edge effects and makes the magnitude conditional on altitude and post-hoc spatial cuts (TRN-E051). The strongest opposing consideration is that every supporting analysis runs on the same unvalidated 107,875-row lineage, so agreement among them is not independence.
  - claimId: TRN-C129
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The modelling preprint reports the deficit strengthening at all tested altitudes after quality filtering (TRN-E052, TRN-E053), but the filter is the same group's ML classifier trained on visually classified imagery, so strengthening is expected whenever a filter removes defect-diluting rows, whether or not the residual is astrophysical. The strongest opposing consideration is the small-number regime — only 17 filtered transients fall in shadow at altitudes ≥35,000 km — plus the contested background null beneath the whole deficit calculation.
  - claimId: TRN-C108
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The altitude range derives from the group's own χ² fits and deficit-versus-altitude tables (TRN-E025, TRN-E055), and the authors state the 20,000–35,000 km span reflects variation between samples and estimators "rather than a formal statistical confidence interval." The strongest opposing consideration is that the underlying deficit is contested (TRN-E011), the reduced χ² of 3.5–5.4 indicates the model fits poorly, and the companion hotspot paper projects at a different altitude (35,786 km) than the χ² estimator prefers (20,000 km).
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The correlation reproduces with independent code on the original rows, survives negative-binomial regression with weather controls, and persists after ML artifact-scoring (TRN-E010, TRN-E015), with one environmental confounder tested and closed (TRN-E017) — but an independently extracted catalog gives a non-significant, schedule-sensitive relative risk and a null nightly-count model (TRN-E009), and Watters shows the effect is almost completely determined by the observing schedule (TRN-E011). The strongest opposing consideration is the asymmetry of independence: the supporting replications share the candidate rows, while the undermining results vary the extraction step itself.
  - claimId: TRN-C103
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The dose-response result rests on the claim-attached anchor from Cann 2026 (monotonic decline from 17.4% to 2.4% across Kp bins); no evidence record in the ledger independently connects to this claim, and the analysis runs on the same contested catalog lineage as every other ensemble statistic. The strongest opposing consideration is that a declination- or edge-dependent artifact rate could produce a geomagnetic-looking gradient if plate selection or observing conditions covary with Kp, and no independent extraction has tested the pattern.
  - claimId: TRN-C104
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      As stated, the claim is that such alignments are reported, and a peer-reviewed PASP paper does report five shortlisted alignments with per-image significances of 2.5–4σ (TRN-E237). The strongest opposing considerations come from the same paper and its critics: no survey-wide chance probability is computable by the authors' own admission (TRN-E238), some aligned members may be defects (TRN-E239), and Watters shows 8 of 24 aligned points sit near catalogue objects and that aligned clusters are expected from non-random artifact distributions (TRN-E240) — so the report stands while its significance is in doubt.
  - claimId: TRN-C119
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The hotspot analysis is accurately reported (TRN-E041): 16 of 137 cells show Bonferroni-significant excess. The strongest opposing consideration is structural — the excess is measured against the group's own per-plate random control, the projection assumes a fixed altitude the companion paper's own estimator does not prefer (TRN-E078), the largest-O/E cells are fed by one to three plates, and the authors concede their two methods share the same transient sample and so cannot rule out defect-driven hotspots.
  - claimId: TRN-C122
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The paper's own negative control instantiates the claim: a random control sample of 897 positions yields three clusters at silhouette 0.50, meeting the authors' stated non-random-clustering criterion (TRN-E079). The strongest opposing consideration is that only three control draws were run with no null distribution of silhouette values, so the upper end of the claimed 0.50–0.60 range and the two-versus-three cluster spread are thinly sampled; the finding nonetheless stands on the authors' own terms and undermines silhouette as a discriminator.
  - claimId: TRN-C117
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The size-mismatch argument is accurately extracted from the source (TRN-E038), but it is one toy model excluding another, both inside the same group's framework: the centimetre-to-metre facet sizes come from a derivation with entirely assumed inputs (altitude, specularity, duration, reflectivity) and a self-acknowledged bright-source selection bias (TRN-E062, TRN-E063). The strongest opposing consideration is that the exclusion is conditional on the size inference, which the source itself flags as revisable — so the claim's own escape clause is live.
  - claimId: TRN-C118
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim accurately reports the paper's toy-model conclusion (TRN-E072), but the argument is residual explanatory fit over a hand-chosen model set, hedged by the authors themselves (TRN-E073), and three of its five "features" are contested at the catalog level (TRN-C005, TRN-C006, TRN-C103) while the sharpness feature is read both ways (TRN-E003/TRN-E004/TRN-E006). The strongest opposing consideration is that the claim's premises are exactly what the Watters critique undermines, so the accommodation argument inherits rather than resolves the case's central dispute.