caseAssessment:
  verdict: contradicted
  loadBearing: [YDIH-C011, YDIH-C010, YDIH-C507, YDIH-C023]
  weakestLinks: [YDIH-C021, YDIH-C011, YDIH-C023]
  synthesis: >-
    The featured hypothesis (C020) joins three claims: impacts triggered the Younger Dryas, drove megafaunal extinction, and disrupted Clovis. All three rest on an event claim with two declared supports. The first is that the boundary assemblage is diagnostic of impact (C011). The second is that it forms one isochronous layer (C010). The bottom of the ladder is partly real. The GISP2 platinum anomaly (C001), the continental platinum enrichments (C002), the black mats (C006) and the terminal-Pleistocene extinction (C008) all stand. Real is not the same as diagnostic, and the case turns on that gap. No record in the packet is marked provisional, so all were weighed. The review-level records (E030–E033, E037) got little weight of their own, because they aggregate primary studies assessed here directly.

    Diagnosticity fails one proxy at a time, mostly by measurement rather than argument:
    - At Hall's Cave and Page-Ladson the element patterns read as volcanic aerosol, and osmium ratios alone cannot separate meteorite from mantle (E004, E029).
    - Candidate markers accumulate in ordinary wetlands (E015).
    - The one blinded test, with lab work partly by a 2007 author, found the proxies low at the boundary and two to four orders of magnitude higher in a younger sample (E009).
    - The lonsdaleite was misidentified (E011).
    - The authors of the continental platinum paper withdrew its extraterrestrial conclusion (E003).

    Isochrony is shown only as consistency within ~100 years (E020). The proponents now state that standard as "not inconsistent" (E046). The site audit leaves 3 of 29 sites in the window, and re-running the proponents' own regressions with dating error leaves 2 of 11 (E019, E042). At Lake Cuitzeo, the layer's age was chosen by the climate it was meant to explain (E043). The 2026 retractions found the same failures at the newest sites (C031). That is evidence about papers, not about the Pleistocene, but it shows the failure modes persist.

    What turns "unsupported" into "contradicted" is that the hypothesis's distinctive predictions were tested.
    - A trigger must precede its effect. On the GICC05 timescale the platinum arrives about 45 years after the onset (C507). The proponents tie their boundary to that platinum, so their own synchrony claim, combined with the lag, places the event after the cooling began. At face value their modeled range, 12,835–12,735 cal BP, also sits at or after the independent onset of ~12,870 ± 30. Comparing timescales at that precision is fragile, so I do not lean on it.
    - The same ice records a correctly timed cluster of large eruptions (C508). It is real as an observation and unproven as a cause.
    - A continent-wide Clovis collapse was predicted, and two direct tests did not find it (C023).
    - A continental fire pulse was predicted, and the independent baseline does not show it (C007).
    - The extinction clause is coarse coincidence (C022).
    - The impactor is a model-dependent possibility fitted to markers that have since failed (C012).
    - The only candidate crater is 58 million years old (C009).

    The load-bearing claims are therefore C010, C011, C507 and C023. The chain breaks first at C011, C021 and C023.

    The strongest case for the hypothesis has four parts. An independent laboratory's platinum spike remains unattributed, and its ice has never been measured for osmium isotopes. The continental platinum measurements stand. The volcanic readings come from one group, whose own signature recurs away from the boundary (E044). No jointly designed, multi-site blind test with identification criteria fixed in advance has ever been run, so the protocol dispute (E008) is real, not settled. The strongest case against: grant every disputed observation, and the chain still breaks at the trigger's timing and at each consequence that could be tested.

    Sensitivity: the record whose removal would most change this assessment is E039. Without it, the lag rests on a one-sentence aside backed by a supplementary figure (E038). C507 would fall to provisionally_supported, and the trigger clause would drop from contradicted to merely unsupported. The case verdict survives, carried by the two Clovis tests (E026, E027) and by diagnosticity failures that do not depend on E039. It is narrower, but it does not hang on one thread. Where claim verdicts lean on general background rather than records, the entries say so: the genus count, the strength of the overturning-circulation (AMOC) account, and the standing of the Taurid progenitor.
  steelman: >-
    The case's best-attested observation is still unexplained, and nothing in this assessment explains it. An independent laboratory measured an iridium-deficient platinum spike in GISP2 ice near 12.82 ka. Its Pt/Al ratios sit far from every reference group, volcanic gas condensates included. The one specific eruption previously proposed, Laacher See, is excluded by direct measurement. The replacement proposal, an unidentified Icelandic fissure eruption, rests on plausibility, not a source tracer. Neither osmium isotopes on the same ice, which would discriminate the source, nor a second-core replication exists in the record. Platinum enrichments at eleven North American sections dated near the onset stand unchallenged as measurements. The authors' own 2026 correction leaves their source open. A proponent can rightly say that an exotic, unattributed platinum influx near 12.8 ka is what a multi-year encounter with cometary debris would leave. The timing argument here shows only that this influx could not have started the cooling. It neither identifies the influx nor rules out a debris encounter contributing to the ecological disruption that followed within the extinction window.
claimAssessments:
  - claimId: YDIH-C020
    verdict: contradicted
    confidence: high
    reasoning: >-
      This claim joins three causal clauses on top of an event claim. None of the three is supported by the ledger's evidence, and two are contradicted by it. The trigger clause fails the one discriminating test available: on the synchronised GICC05 timescale, the GISP2 platinum the proponents tie to their boundary arrives about 45 years after the cooling began (E038, E039). The Clovis clause, though softer than C023, fails two direct tests that found an ordinary technological transition with no demographic break (E026, E027). The extinction clause has only two-millennium timing behind it, which cannot discriminate (E025). The event itself rests on proxies shown non-diagnostic (E004, E009, E011, E015) and on a chronology that shows consistency rather than isochrony (E019, E020, E042, E043). The strongest opposing consideration: the narrow core, that some cosmic material reached Earth near 12.8 ka, is unsupported rather than refuted, because the Greenland platinum's source is unidentified and an airburst scenario predicts few durable markers.
  - claimId: YDIH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      No evidence record tests extinction against the boundary directly. Faith & Surovell's "synchronous" extinction means concentration within roughly 13.8–11.4 ka calibrated (E025), which fits an event at 12.8 ka but fits climate and human pressures over two millennia equally well. The proposed kill mechanism is undermined: the independent continental charcoal synthesis shows no onset-specific fire pulse (E016), and builders of the database the burning compilation used disputed its exceptionalism (E018). The impact itself is not established (C010, C011). What remains in favour is the founding proposal (E005) and that contested compilation (E017). That support is weak and non-discriminating, but it is not a failed direct test, which is why this is weakly_supported rather than contradicted. The strongest opposing consideration: the verdict rests on missing tests as much as on evidence, and a well-dated species-level extinction chronology set against a securely dated boundary could move it either way.
  - claimId: YDIH-C023
    verdict: contradicted
    confidence: high
    reasoning: >-
      This clause made a large, checkable prediction, a continent-wide demographic crash and a catastrophic end to Clovis, and both direct tests in the ledger came back negative. About 1,500 archaeological radiocarbon dates show continuity through the boundary (E026), and the Paleoindian record shows Clovis giving way to Folsom and regional successors with no occupation gap (E027). Clovis is a technocomplex, so its "termination" is a change in point style, not by itself evidence of collapse. The only later support in the ledger, the 2025 shocked-quartz paper whose title claimed Clovis collapse, has been retracted (E035). The strongest opposing consideration is methodological: radiocarbon date frequencies conflate population with preservation and research intensity, and regional records of uneven resolution could hide local disruption. A continent-wide collapse, though, is the size of signal these methods should see.
  - claimId: YDIH-C021
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      No record demonstrates a pathway from an impact to the freshwater or atmospheric perturbation. The overturning-circulation account (E028) needs something to start it, but not an impact. The decisive record is timing: on GICC05 the GISP2 platinum peaks about 45 years after the cooling's onset, in two placements, the later made without knowledge of the earlier (E038, E039). The proponents tie their boundary to that platinum (E020) and say the spike "defines" the onset (E045). Their framework, combined with the lag, therefore places the event after the cooling began. Meanwhile a correctly timed rival forcing sits in the synchronised ice records (E041), itself unproven as a cause. The strongest opposing consideration: the lag rests on one platinum series in one core, and an impact need not have left that platinum, which is why confidence is moderate rather than high.
  - claimId: YDIH-C010
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The supporting record is a Bayesian model of 354 dates from 23 sections that finds the ages "consistent with synchronous deposition" within ~100 years (E020). Wide uncertainties pass a consistency test easily, and it is the standard the proponents explicitly adopt ("not inconsistent", E046), whereas the claim asserts a single isochronous layer. Against it, the site audit finds only 3 of 29 claimed sites in the window, two of them problematic, with several layers dated directly outside it (E019). Re-weighting the proponents' own regressions by dating error leaves 2 of 11 (E042). At Lake Cuitzeo the layer's age was chosen by its fit to the climate transition it is meant to explain (E043). The 2026 retractions repeat these failure modes at the newest sites (E034, E035). The strongest opposing consideration: none of this shows the better-dated layers are asynchronous. The re-analyses show synchrony is undemonstrated, not false, so synchrony across a subset of sites remains open.
  - claimId: YDIH-C011
    verdict: contradicted
    confidence: high
    reasoning: >-
      Diagnosticity requires excluding terrestrial sources, and the ledger shows that exclusion failing for each component. Siderophile-element patterns at Hall's Cave and Page-Ladson read as volcanic aerosol, and osmium ratios alone cannot separate meteorite from mantle (E004, E029). Spherules and other markers accumulate in ordinary wetlands (E015). The blinded Lubbock Lake split found the proxies low at the boundary and far higher in a younger sample (E009). Lonsdaleite was misidentified (E011), and Baffin Bay's "spherule fragments" were foraminifera (E034). The authors of the continental platinum paper withdrew its extraterrestrial conclusion (E003). The Greenland platinum's chemistry sits nearest volcanic condensates without matching anything (E040), so it cannot be read as diagnostic of an extraterrestrial source, though it does not prove a volcanic one. The strongest opposing consideration has three parts. The volcanic readings come from one group at three sites. Proponents dispute that wetland particles equal their best markers (E015 limitations). The melt-product limb is undermined only by the unmet burden of excluding the analogues the ledger names (fulgurites, fires), not by a direct test.
  - claimId: YDIH-C012
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only direct record is Napier's dynamical possibility argument (E022). If the Taurid Complex is the residue of a 50–100 km comet, interception of dense debris near 12.9 ka was "reasonably probable"; the author leaves to Earth scientists whether it happened. Its premises, the progenitor's fragmentation history and the crossing date, are posited rather than observed. The scenario was fitted to 2007–2009 marker reports whose lonsdaleite and nanodiamond identifications have since failed. The ledger carries no analysis of whether such debris would airburst rather than crater. The lack of a dated crater (C009) is consistent with the scenario but is not evidence for it. The strongest opposing consideration: viability is a low bar, the paper is peer-reviewed dynamics, and nothing in the ledger rebuts it in detail. The 2023 review's "physically inconsistent" appears here only as a summary. My "weakly" therefore leans partly on general background that a giant-comet origin for the Taurids is not an established model.
  - claimId: YDIH-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      A neutral review outside the dispute reports that multiple independent proxies show reduced overturning during the Younger Dryas, consistent with its North Atlantic pattern (E028). The competing trigger accounts in the ledger, impact (C021) and volcanic (E029), both route their forcing through that circulation. The ledger carries this as a single review record, so the strength of the verdict leans partly on general paleoclimate background, disclosed here. The strongest opposing consideration: the review leaves open what started the weakening. "Proximately produced" is a causal reading that reduced-AMOC evidence supports but does not by itself establish against alternatives such as sea-ice or atmospheric-circulation feedbacks, which is why this is well_supported rather than established.
  - claimId: YDIH-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      An independent, non-proponent laboratory produced the high-resolution ICP-MS series from a premier archive (E001). Every later analysis works from these measurements without disputing them: the proponents' correction (E003), the chronology papers (E038, E039) and the volcanic-source study (E040). The 2026 correction supplies the values given in the claim. The ~21-year versus ~14-year span reflects how the elevated interval is counted, not different data (E040). The strongest opposing consideration: it is one series from one core, not yet replicated in a second core, and Green et al. note that post-depositional diffusion of platinum within the ice cannot be ruled out. That is why this is well_supported rather than established.
  - claimId: YDIH-C507
    verdict: well_supported
    confidence: high
    reasoning: >-
      Two placements of the same GISP2 platinum on GICC05 agree on a lag of about 45 years after the onset. One is Svensson et al.'s brief aside resting on a supplementary figure (E038). The other is Green et al.'s fuller analysis, made without knowledge of the earlier results, which puts the peak at 12,822 yr BP (E039). The proponents' reply (E045) does not engage these placements. Defining the onset by the platinum assumes the coincidence at issue, and a ±140-year counting error moves onset and spike together when both are read from the same synchronised ice. The one discordant sentence, in Nana Yobo et al.'s introduction, appears to reverse the offset it cites (E029 limitations) and is not an analysis. The strongest opposing consideration: every placement uses one platinum series and one depth transfer, so the agreement shows the transfer is reproducible, not that independent ice shows the same lag.
  - claimId: YDIH-C508
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Abbott et al., read in full, report from synchronised Greenland and Antarctic sulphate a ~110-year cluster of four major bipolar signals just before the onset (E041). Its cumulative Northern Hemisphere forcing, reconstructed from that sulphate, exceeds the Common Era's most active periods. The claim restates this accurately, including that the forcing is reconstructed rather than measured. A separate 2022 Greenland eruption catalogue, as cited by Green et al., also lists large eruptions at ~12,978 and ~12,870 yr BP. Confidence is moderate because the comparative forcing figure comes from one paper's reconstruction method. The strongest opposing consideration bears on implication rather than local truth: comparable eruptions occur elsewhere in the glacial record (two of these rank 16th and 17th of 1,113 by sulphur), so the cluster's reality does not make it the trigger.
  - claimId: YDIH-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Moore et al. report boundary-layer platinum averaging 6.0 ppb against about 0.3 ppb above and below at eleven sites, by fire assay and ICP-MS (E002). The authors' 2026 correction withdrew the attribution while leaving the measurements unchallenged (E003). Independent work at Hall's Cave and Page-Ladson also finds siderophile-element anomalies at the onset (E004, E029, E044). Those records, though, report osmium and the element pattern rather than platinum enrichment, and their layers are not unique to the onset. The strongest opposing consideration: the measurements come from one group with Comet Research Group (CRG) affiliations and have no independent replication. Sampling clustered around pre-identified horizons without continuous background, and the boundary assignments are of the kind the chronology audit often found inadequate (E019). Both "dated near the onset" and "substantially above background" are therefore shown only provisionally.
  - claimId: YDIH-C003
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The supporting record is a one-page proponent report of cubic and hexagonal nanodiamonds in the boundary layer (E010). Independent re-examination by transmission electron microscopy and electron diffraction found no nanodiamonds in the sediments tested and identified the putative lonsdaleite as graphene/graphane-family aggregates (E011). The blinded Lubbock Lake split found nanodiamonds low or absent at the boundary and orders of magnitude more abundant in a sample younger than 11,500 cal BP (E009). Lonsdaleite, the diagnostically crucial form, has never been independently confirmed, and no independent test in the ledger finds boundary-concentrated nanodiamonds. The strongest opposing consideration: the negatives cover specific sediments and one blind-test site, and proponents report diamonds elsewhere (not carried here as records). Multi-site existence is therefore not closed, hence moderate confidence.
  - claimId: YDIH-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      Proponent studies report boundary spherule peaks at many sites, up to 18 on four continents (E005, E006). LeCompte et al. recovered them at sites shared with the critics using the original protocol, with a concrete diagnosis of why the critics missed them (E008). But the independent seven-site attempt reproduced none of the original results (E007). In the blinded Lubbock Lake test, the split the paper reports, with lab work partly by a 2007 author, had spherules low or absent at, below and above the boundary and two to four orders of magnitude higher in a younger sample (E009). The newest spherule claim, from Baffin Bay, was retracted after its "spherule fragments" proved to be foraminifera and an out-of-boundary peak matched the boundary peak (E034). Peaks appear under one network's protocols and not under blinded or independent ones. The strongest opposing consideration: the protocol dispute is real and unresolved, the blind test covers one site, and no jointly designed multi-site test has been run, which is why this is weak support rather than contradiction.
  - claimId: YDIH-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two proponent-network papers report melt glass with phases interpreted to need roughly 1,730 to over 2,200 °C at sites in the Carolinas, Pennsylvania, Venezuela and Syria (E012, E013). Nothing in the ledger directly contradicts the mineralogy. The support is weak on each element of the claim, though. The temperatures rest on unblinded phase interpretations with no independent confirmation. The Abu Hureyra paper carries a 2025 correction whose content was not reviewed. "Near the Younger Dryas onset" depends on boundary assignments of the kind the chronology audit found wanting at many proponent sites (E019). The strongest opposing consideration: absence of replication is not refutation. If the phase identifications hold, the high-temperature glass is a genuine observation, and what is contested is its attribution, not its existence.
  - claimId: YDIH-C006
    verdict: well_supported
    confidence: high
    reasoning: >-
      Haynes, the geoarchaeologist who mapped these deposits for decades, documents widespread dark organic-rich mats draping the terminal-Pleistocene surface (E014). They frequently overlie the last in-place megafauna and Clovis occupations. Both camps accept the observation, and Pigati et al. treat the same facies (E015). Local truth is high, but the implication for the hypothesis is close to nil. The mats' documenter reads them as wetland deposits of the moist Younger Dryas, and black mats occur at other times and places. The strongest opposing consideration is scope: the record is one survey, and "frequently overlying" is a stratigraphic generalization whose site-by-site frequency the ledger does not quantify.
  - claimId: YDIH-C007
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The claim asserts an exceptional episode at continental-to-hemispheric scale. The independent test at that scale is a continental charcoal synthesis built by the fire-history community for its own purposes. It finds burning rising gradually through deglaciation and tracking climate, with no continent-wide signal at the onset (E016). The positive case is one proponent compilation (E017). Builders of the database it drew on formally disputed its data selection, its handling of chronological uncertainty and its statistical exceptionalism (E018). The 9–10% burned-biomass figure inherits all of that. I read a null from the independent baseline, at the scale the claim specifies, as counter-evidence rather than mere absence. The strongest opposing consideration: charcoal composites can smooth a very short pulse, and the synthesis does not test the ice-core aerosol series. Wolbach et al.'s same-journal reply also leaves the exchange formally open, hence moderate confidence.
  - claimId: YDIH-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      Faith & Surovell's analysis of last-appearance radiocarbon data finds the North American record statistically consistent with an extinction concentrated in the terminal Pleistocene, roughly 13.8–11.4 ka calibrated (E025). That is what the claim states. The genus count of about 35 is not in the evidence record; I take it from general paleontological background and disclose that. The strongest opposing consideration: last appearances underestimate true extinction times and species-level chronologies are sparse. "Concentrated" therefore means a two-millennium window, so the claim is true at that resolution and implies no instantaneous event.
  - claimId: YDIH-C009
    verdict: established
    confidence: high
    reasoning: >-
      Direct dating by two methods gives Hiawatha an age of 57.99 ± 0.54 Ma (E024): ⁴⁰Ar/³⁹Ar on glaciofluvial sand and U-Pb on shocked zircon from impact-melt pebbles. This closes the open age left by the discovery paper (E023), and proponents have dropped Hiawatha. No record in the ledger presents a crater with credible ~12.8-ka dating, and the proponents' own organization is raising funds to search for one (E036). The strongest opposing consideration: the global negative is a statement about the state of knowledge. It rests here on the ledger's statements and general background rather than a crater database, and it cannot exclude unrecognized structures under ice or sea. The airburst version of the hypothesis does not require a crater anyway.
  - claimId: YDIH-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      The ledger documents repeated failures. The independent seven-site test reproduced none of the original spherule results (E007). Independent electron microscopy found no nanodiamonds in the tested sediments and rejected the lonsdaleite identification (E011). The blind test found the proxies unremarkable at the boundary and concluded that "no standard criteria exist for identification of magnetic spheres" (E009). Those records are attached to C003 and C004 rather than to this claim; I apply them because they are its cited basis. The strongest opposing consideration: LeCompte et al. offer a concrete diagnosis that protocol deviations caused the null results (E008), so "failed to reproduce" may partly reflect method differences. Also, "no standardized criteria" is attested directly for spherules and only by dispute for nanodiamonds, while platinum, a quantitative measurement, needs no such criteria.
  - claimId: YDIH-C031
    verdict: established
    confidence: high
    reasoning: >-
      The two PLOS ONE notices, read in full, record retraction on 11 February 2026 for three kinds of defect (E034, E035). The chronology defects are a calibration that, done as recommended, moves ages outside the Younger Dryas, and an incomplete, partly untraceable age model. Sampling was too sparse to establish background. For Baffin Bay, foraminifera were misidentified as cosmic spherule fragments. The Scientific Reports correction of 6 May 2026 replaces the extraterrestrial-event characterization with source-neutral language and concludes that the enrichments do not resolve the source (E003). The claim is documentary and matches the record. The strongest opposing consideration concerns wording and implication. Identification defects appear only in the Baffin Bay notice, and the correction leaves the source unresolved rather than asserting a terrestrial one. Eight authors disputed each retraction, and a retraction removes claimed support without showing the event did not occur.