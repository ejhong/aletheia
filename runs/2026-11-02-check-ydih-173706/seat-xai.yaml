caseAssessment:
  verdict: contradicted
  loadBearing: [YDIH-C020, YDIH-C011, YDIH-C010, YDIH-C021]
  weakestLinks: [YDIH-C004, YDIH-C003, YDIH-C007, YDIH-C010]
  synthesis: >-
    The featured hypothesis requires a multi-link causal chain: real, diagnostic,
    isochronous, extraterrestrial proxies at ~12.8 ka that deliver enough energy
    to perturb AMOC (or atmosphere/ice sheets), drive megafaunal extinctions, and
    collapse Clovis populations. The evidence records establish several lower-rung
    observations while systematically severing the higher links. A genuine platinum
    anomaly exists in GISP2 ice (E001) and reported sedimentary enrichments occur
    at North American sites (E002), yet the 2026 author correction explicitly
    withdraws any extraterrestrial-source conclusion (E003) and independent
    Os-isotope/HSE work at Hall's Cave and Page-Ladson returns volcanic-aerosol
    patterns that recur outside the boundary (E004, E029, E044). Microspherule
    and nanodiamond peaks fail independent and blinded replication (E007, E009,
    E011); the single best-designed blind test recovered higher abundances above
    the boundary than at it and found no standard identification criteria (E009).
    Melt-glass claims remain unreplicated by non-proponent laboratories and sit
    in complex archaeological contexts (E012, E013). Black mats are real but are
    wetland facies, not impact markers (E014, E015). Fire compilations claiming
    exceptional burning are contradicted by the independent charcoal synthesis
    and by custodians of the global database (E016, E018). Chronology audits show
    only a handful of the claimed sites fall inside the onset window once dating
    errors are weighted and circular climate-to-boundary assignments are removed
    (E019, E042, E043); the Bayesian model that restores synchrony imports the
    conclusion at key localities. The Greenland platinum spike itself sits ~45
    years after cooling onset on the GICC05 scale used for both records (E038,
    E039), so it cannot be the trigger signature regardless of source. No crater
    of the right age exists; Hiawatha is 58 Ma (E024). Archaeological
    radiocarbon-frequency and techno-complex data show continuity, not collapse
    (E026, E027). AMOC weakening is well supported as the proximate climate
    mechanism (E028) and a correctly timed cluster of large bipolar volcanic
    eruptions supplies a rival forcing candidate (E041, E508). The two newest
    flagship papers were retracted for the same chronology, sampling, and
    identification defects long identified by critics (E034, E035). The joint-
    inference ladder therefore fails at multiple independent rungs; residual
    anomalies do not reconstitute a cosmic catastrophe. The case verdict is
    contradicted on the evidence records alone. Prior background on impact
    physics and deglacial climate is used only to calibrate that airburst
    scenarios without craters remain dynamically possible and that AMOC can be
    forced by freshwater or aerosols; neither prior supplies positive evidence
    for the YDIH chain.
  steelman: >-
    The GISP2 platinum anomaly is a real, multi-year, Ir-deficient geochemical
    event whose carrier phase and ultimate source remain unidentified by any
    measurement in the ledger; a non-cataclysmic but still extraterrestrial
    dust influx timed near the boundary has not been positively ruled out by
    osmium isotopes or a second ice core, leaving open a limited debris-
    stream contribution whose climatic role would still have to be secondary.
claimAssessments:
  - claimId: YDIH-C020
    verdict: contradicted
    confidence: high
    reasoning: >-
      The full causal package fails because the proxy assemblage is neither
      diagnostic nor reproducibly isochronous (C011, C010, C030), the best-
      attested platinum signal post-dates onset (C507), no crater of appropriate
      age exists (C009), and direct tests of the predicted human and megafaunal
      consequences are negative (C023, C022). Strongest opposing consideration is
      the genuine GISP2 Pt anomaly and the dynamical possibility of airbursts
      (C012), neither of which restores the chain.
  - claimId: YDIH-C022
    verdict: contradicted
    confidence: high
    reasoning: >-
      Last-appearance data are consistent with a geologically concentrated
      terminal-Pleistocene pulse (C008, E025), yet no secure impact horizon,
      diagnostic marker, or energetic mechanism links that pulse to a cosmic
      event. Strongest opposing consideration is temporal overlap within a
      multi-millennial window, which is necessary but far from sufficient for
      causation.
  - claimId: YDIH-C023
    verdict: contradicted
    confidence: high
    reasoning: >-
      Radiocarbon-frequency demography and the Paleoindian archaeological record
      show continuity through 12.9 ka and a normal technological transition from
      Clovis to successors, not a continent-wide collapse or occupation gap
      (E026, E027). Strongest opposing consideration is local site abandonments
      that can be explained by ordinary climate or resource shifts.
  - claimId: YDIH-C021
    verdict: contradicted
    confidence: high
    reasoning: >-
      AMOC weakening is the accepted proximate mechanism (C013), but the
      platinum spike arrives decades after cooling began (C507, E038, E039) and
      therefore cannot be its initiator; volcanic sulphate forcing is correctly
      timed and of comparable magnitude (C508). Strongest opposing consideration
      is residual uncertainty about the precise freshwater or aerosol trigger,
      which still does not require an impact.
  - claimId: YDIH-C010
    verdict: contradicted
    confidence: high
    reasoning: >-
      Site-by-site audit shows only 3 of 29 claimed localities fall inside the
      onset window once dating errors are respected; age-depth regressions
      weighted by uncertainty move most sites out, and at least one Bayesian
      model selects the boundary age by fit to the climate transition itself
      (E019, E042, E043). Strongest opposing consideration is the Kennett et al.
      2015 consistency test, which passes under wide uncertainties but does not
      demonstrate a single isochron.
  - claimId: YDIH-C011
    verdict: contradicted
    confidence: high
    reasoning: >-
      Independent TEM work rejects lonsdaleite and many nanodiamond calls
      (E011); blinded and multi-lab tests find microspherules non-unique to the
      boundary and lacking standard criteria (E009); Os-isotope/HSE patterns at
      multiple sites match volcanic aerosols rather than chondritic material
      (E004, E029); the 2017 platinum paper’s own correction withdraws the ET
      conclusion (E003). Strongest opposing consideration is the still-
      unidentified carrier of the GISP2 Pt anomaly.
  - claimId: YDIH-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Napier’s dynamical argument shows that interception of debris from a
      fragmenting short-period comet is a reasonably probable event capable of
      producing dispersed airbursts without a large crater (E022). Strongest
      opposing consideration is that the scenario was fitted to 2007–2009 marker
      claims many of which have since failed replication or identification, and
      no recovered material ties any YDB deposit to the Taurids.
  - claimId: YDIH-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      Multiple independent paleoceanographic proxies converge on reduced AMOC
      during the Younger Dryas, matching the North Atlantic cooling pattern
      (E028). Strongest opposing consideration is remaining debate over the
      exact routing and magnitude of the initiating freshwater or aerosol
      forcing, which does not overturn the overturning-circulation mechanism
      itself.
  - claimId: YDIH-C001
    verdict: established
    confidence: high
    reasoning: >-
      High-resolution ICP-MS on GISP2 ice documents a multi-year platinum
      enrichment averaging ~30 ppt with an ~80 ppt peak near the YD onset; the
      measurement is from an independent laboratory and survives the 2026
      correction that only neutralizes source language (E001, E003). Strongest
      opposing consideration is that the carrier phase and ultimate source
      remain unidentified.
  - claimId: YDIH-C507
    verdict: well_supported
    confidence: high
    reasoning: >-
      Placement of the same GISP2 Pt series onto the GICC05 timescale used for
      the cooling onset, confirmed by independent re-analysis, puts the spike
      approximately 45 years after the volcanic quadruplet that marks the start
      of GS-1 (E038, E039). Strongest opposing consideration is the proponent
      argument that the spike itself should define the onset, which is circular
      and does not engage the synchronized ice-core chronology (E045).
  - claimId: YDIH-C508
    verdict: well_supported
    confidence: high
    reasoning: >-
      Synchronized Greenland–Antarctic sulphate records document a ~110-year
      cluster of four major bipolar eruptions immediately before YD inception
      whose cumulative NH radiative forcing exceeds the most active Common Era
      intervals (E041). Strongest opposing consideration is that forcing
      magnitude is reconstructed rather than directly measured and climate-
      model experiments confirming a tip into YD conditions have not yet been
      run.
  - claimId: YDIH-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Fire-assay/ICP-MS data at eleven North American sites report Pt peaks
      averaging ~6 ppb against ~0.3 ppb background near purported boundary
      strata (E002); the measurements themselves are unchallenged by the 2026
      correction. Strongest opposing consideration is single-team sampling
      targeted at pre-identified horizons, absence of continuous background
      profiles, and the authors’ own withdrawal of the extraterrestrial-source
      claim (E003).
  - claimId: YDIH-C003
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Proponent reports of nanodiamonds (including hexagonal forms) at multiple
      YDB sites exist (E010), yet independent TEM/electron diffraction found no
      nanodiamonds in tested sediments and re-identified purported lonsdaleite
      as graphene/graphane aggregates (E011); later proponent claims at other
      sites keep the existence question open but never independently confirm
      shock-diagnostic lonsdaleite. Strongest opposing consideration is that
      absence at the tested localities does not logically exclude every other
      site.
  - claimId: YDIH-C004
    verdict: mixed
    confidence: moderate
    reasoning: >-
      Proponent surveys report abundance peaks of magnetic microspherules at
      sites on four continents and estimate multi-million-tonne deposition
      (E005, E006), yet the first independent multi-site test recovered none
      (E007), the 2016 blind split test found the boundary unremarkable and
      higher abundances post-boundary, and no standard identification criteria
      exist (E009). Strongest opposing consideration is the protocol-difference
      rebuttal that spherules can be lost by altered size-fraction or magnetic-
      separation steps (E008).
  - claimId: YDIH-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Mineralogical reports describe melt glass and related phases whose phase
      assemblages are interpreted to require 1,500–2,200 °C formation
      temperatures at several YDB-age localities, including Abu Hureyra (E012,
      E013). Strongest opposing consideration is that temperature alone does not
      identify a cosmic heat source, independent blinded confirmation is
      lacking, and anthropogenic or lightning analogues are difficult to
      exclude at archaeological sites; the Abu Hureyra paper carries an
      unreviewed 2025 correction.
  - claimId: YDIH-C006
    verdict: established
    confidence: high
    reasoning: >-
      Dark organic-rich horizons draping the Rancholabrean surface and last
      in-place megafaunal/Clovis remains are widely documented across North
      American terminal-Pleistocene sites (E014). Strongest opposing
      consideration is that the same mats are ordinary wetland/spring deposits
      of the moist YD interval and occur at many other times and places, so
      they are not event-diagnostic.
  - claimId: YDIH-C007
    verdict: mixed
    confidence: moderate
    reasoning: >-
      A proponent two-part compilation of ice-core aerosols and sedimentary
      charcoal/soot reports synchronous peaks interpreted as burning of ~9–10 %
      of Earth’s biomass (E017), yet the independent North American charcoal
      synthesis finds only climate-tracking fire with no continent-wide pulse
      at onset (E016) and the database custodians formally dispute the
      compilation’s selection, chronology handling and exceptionalism tests
      (E018). Strongest opposing consideration is that a very short, intense
      pulse could be smoothed by taphonomy or sampling resolution.
  - claimId: YDIH-C008
    verdict: well_supported
    confidence: high
    reasoning: >-
      Analysis of last-appearance radiocarbon dates for North American
      megafaunal genera is statistically consistent with a concentrated
      terminal-Pleistocene extinction window rather than a long staggered
      decline (E025). Strongest opposing consideration is the Signor-Lipps
      effect and the multi-millennial width of the assessed interval, which
      cannot resolve a single-year catastrophe.
  - claimId: YDIH-C009
    verdict: established
    confidence: high
    reasoning: >-
      No crater of ~12.8 ka age is known; the sole widely discussed candidate,
      Hiawatha, is directly dated by dual 40Ar/39Ar and U-Pb methods to 57.99 ±
      0.54 Ma and therefore excluded (E023, E024). Strongest opposing
      consideration is the formal possibility of still-undiscovered structures
      or purely aerial airbursts that leave no crater.
  - claimId: YDIH-C030
    verdict: well_supported
    confidence: high
    reasoning: >-
      Independent laboratories using their own protocols repeatedly failed to
      recover claimed microspherule and nanodiamond peaks at shared or similar
      sites (E007, E011); the 2016 blind test recovered little at the boundary
      and concluded that no standard identification criteria exist (E009).
      Strongest opposing consideration is the proponent claim that protocol
      deviations (size fraction, magnetic separation) explain the nulls (E008),
      which remains a live methodological dispute rather than a resolution.
  - claimId: YDIH-C031
    verdict: established
    confidence: high
    reasoning: >-
      PLOS ONE retracted both 2025 flagship papers on 11 February 2026 for
      chronology, sampling, identification and citation defects explicitly
      listed in the notices (E034, E035); the 2017 North American platinum
      paper received a formal May 2026 correction that withdrew its
      extraterrestrial-source conclusion while leaving the measurements intact
      (E003). Strongest opposing consideration is that retraction removes
      claimed support without positively proving the absence of an impact.