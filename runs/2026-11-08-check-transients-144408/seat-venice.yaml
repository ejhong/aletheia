caseAssessment:
  verdict: unresolved
  loadBearing: [TRN-C020, TRN-C005, TRN-C001, TRN-C002]
  weakestLinks: [TRN-C118, TRN-C117, TRN-C108, TRN-C103]
  synthesis: >-
    The case's attribution ladder holds firmly at its bottom and openly above it. The
    observation rung is the best-established part of the whole file: the nine April 1950
    marks are physically present on independent Edinburgh copy glass (TRN-E002), recovered
    at 8-of-9 and 3-of-3 by a from-scratch pipeline (TRN-E008), measured by the critics
    themselves to be sharper than stars (TRN-E003), and — per an unreviewed but candid
    manuscript — present on the original telescope emulsion (TRN-E022). None of that,
    however, decides what made the light-shaped marks. The crux, TRN-C020, is genuinely
    unresolved: the single physical discriminant in the ledger (the Hamburg coma signature,
    TRN-E014) is unblind-validated and its own author states the data do not establish the
    light's origin; microscopy explicitly cannot separate a sub-second flash from an
    emulsion defect (TRN-E024); the artifact classifier is circularly defined (TRN-E004);
    and nobody on either side has measured the star-like defect base rate (TRN-E232,
    TRN-E233). The ensemble statistics are mixed rather than decisive: the shadow deficit
    and nuclear-window correlation replicate at the analysis level on the supplied rows
    (TRN-E010, TRN-E015) but fail under the only independent source extraction (TRN-E009)
    and under Watters' corrected non-uniform null and schedule normalization (TRN-E011),
    with the proponents' rebuttal (TRN-E012) a methodological dispute, not a resolution.
    The near-Earth rung (TRN-C021) inherits exactly that mixed state; the artificial rung
    (TRN-C022) has a live natural alternative (Cann's dusty-plasma candidate, TRN-E020);
    and the extraterrestrial rung is acknowledged unfalsifiable by the proponents
    themselves (TRN-E083). The geographic hotspot and clustering results ride a fixed
    35,786 km projection on the same contested catalog, and the paper's own random
    controls meet its non-random-clustering criterion (TRN-E079). The only evidence
    outside the Palomar copy genealogy — Hamburg analogs and the coma signature — is
    preliminary and unvalidated. My case verdict is therefore unresolved, not as a safe
    default but because the two discriminations that would settle it (flash-versus-defect
    at the source level; signal-versus-catalog-artifact at the ensemble level) each have
    strong, current records on both sides, and the case verdict hangs on them.
  steelman: >-
    The Hamburg coma result (TRN-E014): eleven transient candidates on six plate pairs
    from an independent telescope, emulsion stock, archive and digitization lineage show
    the off-axis coma aberration pattern expected of point sources that passed through the
    telescope optics — a signature the record states plate-surface artifacts should not
    naturally reproduce. No evidence record in this ledger demonstrates any defect class
    reproducing that pattern, no critic has tested or blind-validated the discriminant,
    and the deliberate-flash calibration that would refute it (TRN-R003) has not been
    run. Until someone shows a defect that mimics comatic off-axis imaging, a proponent
    can rightly say the assessment has no measurement that answers this observation.
claimAssessments:
  - claimId: TRN-C022
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record establishes artificiality: the claim inherits an unresolved
      TRN-C020 and a weakly supported TRN-C021, and the only record touching it
      (TRN-E018) is a weak, look-elsewhere-exposed alignment extension. The strongest
      opposing consideration is Cann's natural dusty-plasma candidate (TRN-E020), which
      would satisfy near-Earth reflections with no artificial objects at all; the
      counter-argument that pre-Sputnik reflective objects at 20,000–35,000 km are
      naturally artificial rests on priors, not evidence in this ledger.
  - claimId: TRN-C023
    verdict: presently_untestable
    confidence: moderate
    reasoning: >-
      The only quasi-support is a hedged toy-model comparison (TRN-E072/E073) built on
      features that are themselves contested or ambiguous, and the proponents' own hotspot
      paper states the intelligence interpretation is "unfortunately not falsifiable"
      (TRN-E083). No refuting or confirming test for extraterrestrial technological origin
      exists in the ledger; even the prospective multi-station program (TRN-R009) bears on
      near-Earth reality, not on who built the objects.
  - claimId: TRN-C021
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The near-Earth attribution rests almost entirely on the Earth-shadow deficit
      (TRN-C005), which is mixed: it replicates on the supplied rows (TRN-E010) and
      survives the group's ML filter (TRN-E015), but vanishes under Watters' corrected
      non-uniform null (TRN-E011), and the modelling preprint proceeds from near-Earth
      reality as an explicit assumption (TRN-E074). TRN-C020 is unresolved, so even a
      real shadow signal would not yet attach to real flashes.
  - claimId: TRN-C020
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The strongest pro record is the coma signature (TRN-E014), a genuine physical
      discriminant — but single-author, visually identified, unblind-validated, and
      disclaimed by its own author as not establishing the light's origin. The strongest
      opposing records are the classifier's artifact assignment (TRN-E004, arguably
      circular), the microscopist's defect-leaning opinion (TRN-E024, acknowledged as
      carrying a steady-star default), and Watters' point that no feature in these
      datasets has been shown to be an optical transient (TRN-E011). Both directions
      remain live; no measurement currently decides.
  - claimId: TRN-C007
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The shared-intermediate-positive genealogy is established on documentary and
      material grounds (TRN-E005, strong), and the "can appear without existing on the
      original negative" clause is the logical consequence of a defect arising at that
      stage. The strongest opposing consideration is TRN-E023: for the two canonical
      events the marks are not confined to copy material, so the mechanism's diagnostic
      use against them fails — but the genealogy itself and the pathway stand, with the
      base rate honestly unmeasured (TRN-E232).
  - claimId: TRN-C001
    verdict: well_supported
    confidence: high
    reasoning: >-
      Physical confirmation on an independent Edinburgh copy (TRN-E002, strong),
      independent pipeline recovery of 8/9 (TRN-E008, strong), and original-glass
      microscopy (TRN-E022) converge on the presence/absence pattern as stated. The
      strongest opposing consideration is that the same inspection found over a hundred
      similar detections and blemishes on the neighboring plate (TRN-E002, TRN-E230),
      which qualifies interpretation but not the claim's stated content.
  - claimId: TRN-C024
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The claim rests on a single unreviewed manuscript (TRN-E022) whose registration
      against the digitization is the load-bearing step, performed unblinded by the
      proponents' group and not yet independently repeated. Against it: the examination is
      direct microscopy of the original Caltech glass with field-star fiducials, and was
      conducted with the copy-defect argument's own author directing the microscopist —
      adversarial provenance that raises its credibility pending review.
  - claimId: TRN-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The sharpness measurement was made by the critics themselves (TRN-E003, strong):
      all nine SuperCOSMOS profile statistics fall on the sharp side, jointly improbable
      at order 0.1⁹ under the stellar distribution. The strongest opposing consideration
      concerns interpretation, not the measurement: the classifier groups the marks with
      artifacts (TRN-E004) while the flash argument predicts exactly this sharpness
      (TRN-E006) — the observation is real but direction-ambiguous pending calibration.
  - claimId: TRN-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      A peer-reviewed discovery report (TRN-E007) and fully independent recovery of 3/3
      sources (TRN-E008, strong) establish the presence/absence pattern, with modern
      follow-up to magnitude 25.5. The strongest opposing consideration is provenance: the
      physical inspection covered a Harvard copy plate, not the 1952 original negative
      (TRN-E022 limitations), and the event's stellar-like profiles are morphologically
      inconsistent with the 1950 nine, complicating any single-mechanism account.
  - claimId: TRN-C004
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      TRN-E008 is a from-scratch pipeline with synthetic-injection benchmarking that
      recovers the canonical events and 63.9% of the published catalog without reference
      to the original software. The strongest opposing consideration is that this is
      independent extraction, not independent material — the same digitized descendants —
      and the 500-fold candidate excess in the raw sweep shows how completely the
      population depends on vetting choices.
  - claimId: TRN-C101
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Convergent independent lines support the claim: over a hundred star-like detections
      resembling the canonical nine in one small overlap strip (TRN-E230), a persistent
      artifact population that passes profile filters on the unrelated Hamburg archive
      (TRN-E234), and the proponents' own concession that star-like defects exist and
      coexist with candidates (TRN-E231). The strongest opposing consideration is that the
      rate "sufficient to contaminate" has never been censused — both camps say so
      (TRN-E232, TRN-E233) — so sufficiency rests on the overlap density and Hamburg
      experience rather than a measurement.
  - claimId: TRN-C102
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The mechanism is sound standard physics — image wander dominates long-exposure
      seeing blur, and a sub-second flash freezes it — and Busko provides an actual
      observation of comatic transients narrower than equal-peak stars (TRN-E235) plus the
      proponents' stated prediction (TRN-E236). The strongest opposing consideration is
      that sharpness does not discriminate: artifacts are also rounder and sharper than
      stars (TRN-E234), reciprocity failure may mute the signature, and no calibration on
      period emulsions exists (TRN-R002).
  - claimId: TRN-C010
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      TRN-E013 reports analogs on genuinely independent material — different telescope,
      emulsion, archive and digitization — which the copy-defect mechanism cannot reach.
      The strongest opposing consideration is the record's own preliminarity: 41 plates,
      no false-positive calibration, no injection/recovery, and no measured candidate rate
      against matched controls, leaving "similar phenomenon" and "similar defect
      susceptibility" indistinguishable.
  - claimId: TRN-C011
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      TRN-E014 reports the expected coma pattern in eleven transients on six plate pairs,
      potentially the highest-information positive result in the case. The strongest
      opposing consideration is that the classifier has never been blind-validated against
      known defects or produced flashes, candidates were found visually with an
      acknowledged confirmation-bias concern at the faint end, and the result applies only
      to Hamburg material.
  - claimId: TRN-C005
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The deficit replicates under independently written statistics on the supplied rows
      (TRN-E010), survives ML artifact-scoring (TRN-E015), and strengthens under quality
      filtering (TRN-E052/E053) — but Watters' reanalysis shows the uniform-background
      assumption is false and the deficit is not significant under the proper null
      (TRN-E011, strong), and the deficit's stated magnitude is conditional on post-hoc
      spatial cuts (TRN-E051). The proponents' rebuttal (TRN-E012) disputes the subset's
      power without answering the catalog-validation charge; this is a genuine unresolved
      statistical dispute on both sides.
  - claimId: TRN-C129
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The read preprint directly reports the stronger-after-filtering result at all tested
      altitudes (TRN-E052, TRN-E053). The strongest opposing consideration is structural:
      filter and catalog both originate with the same group, an ML filter trained on
      visually classified labels would amplify any signal that defects dilute whether or
      not the residual is astrophysical, and only 17 filtered transients fall in shadow at
      altitudes ≥35,000 km — a small-number regime.
  - claimId: TRN-C108
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 20,000–35,000 km range is the authors' own spread across samples and estimators,
      explicitly "rather than a formal statistical confidence interval" (TRN-E057), with
      poor absolute fits (reduced χ² 3.5–5.4) and a simplified model lacking orbital
      dynamics (TRN-E055). The strongest opposing consideration is that the whole
      inference inherits the contested TRN-C005 and a hotspot analysis that assumes the
      top of the range while conflating radius with altitude (TRN-E078).
  - claimId: TRN-C006
    verdict: mixed
    confidence: moderate
    reasoning: >-
      The correlation replicates on the original rows with weather controls and
      permutation (TRN-E010), persists under ML scoring (TRN-E015), survives an attenuated
      Bayesian reanalysis (TRN-E019), and one confounder (airglow/sensitivity) has been
      closed by measurement (TRN-E017) — but the only independent source-extraction test
      finds it null and schedule-sensitive (TRN-E009, strong), and Watters shows it is
      almost completely determined by the Palomar observing schedule after normalization
      (TRN-E011, strong). Both directions carry strong records; the crux is extraction and
      exposure modeling, not statistics on fixed rows.
  - claimId: TRN-C103
    verdict: mixed
    confidence: low
    reasoning: >-
      The monotonic Kp decline is reported in a verified source and no record contradicts
      that component; Cann's own control paper supports it not being a plate-sensitivity
      artifact (TRN-E017). The strongest opposing consideration hits the second conjunct:
      "controlling for Kp strengthens the nuclear-window association" is directly
      undermined by the independent-extraction null (TRN-E009) and the schedule
      explanation (TRN-E011), and no dedicated evidence record was entered for this claim,
      so it leans on its source anchor within a contested catalog lineage.
  - claimId: TRN-C104
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The alignments are genuinely reported in a peer-reviewed paper read in full
      (TRN-E227), so the modestly stated claim is accurate as far as it goes. The strongest
      opposing consideration is the authors' own admission that the search-wide correction
      cannot be estimated (TRN-E228) — the ~3.9σ is a per-picture figure — compounded by
      Watters' audit finding 8–9 of 24 shortlist members within 5 arcsec of infrared
      catalogue objects and some members not star-like (TRN-E229).
  - claimId: TRN-C119
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      TRN-E041 accurately reports the Bonferroni-corrected excess in 16 of 137 cells, and
      plate decomposition shows most cells fed by multiple plates (TRN-E075). The strongest
      opposing considerations: every location depends on a single assumed altitude with no
      sensitivity analysis (TRN-E078), the control is the group's own construction, the
      largest-O/E cells after the Pacific ones are single-plate, and a high-defect-rate
      plate would project its excess to whatever cell the geometry assigns.
  - claimId: TRN-C122
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      TRN-E079, from the full reading, directly instantiates the claim: random controls
      yield two or three clusters with silhouette 0.50–0.60, meeting or exceeding the
      authors' own non-random-clustering threshold. The strongest opposing consideration is
      that only three control draws were run with no null distribution of silhouette
      values, so the comparison against the transient sample's 0.70 lacks a formal test —
      though as a negative-control result it already undercuts the clustering
      discriminant.
  - claimId: TRN-C117
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E038 supports the size-mismatch exclusion, but it rests on the group's own
      model-dependent size inference, which is selection-biased toward small facets by the
      catalog's bright-source exclusion (TRN-E062/E063). The strongest opposing
      consideration is that one toy model excluding another, via an unmeasured input,
      constrains Cann's mechanism only conditionally and does not move the observation
      rung either way.
  - claimId: TRN-C118
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      TRN-E072 reports the authors' conclusion and TRN-E073 records their own hedge that
      "nature can always surprise us." The strongest opposing consideration is that this is
      an argument from residual explanatory fit over a hand-chosen set of toy models, three
      of whose five "features" are contested at the catalog level and one of which
      (sharpness) is read both ways — an inference, not a test, and the proponents'
      companion paper concedes the underlying interpretation is unfalsifiable.