  synthesis: >-
    I read the featured hypothesis as the case's third option. Carvajal described a real world: populous, provisioned, road-connected riverine societies in particular reaches of a strongly heterogeneous Amazon. Colonial-era processes then emptied that world, so the gap between his river and the later silence is history rather than invention. His headline numbers are not counts. On this ledger the core of that hypothesis is well supported. Its final step is supported in direction but unquantified on his own reaches. The magnitude of the crowding he saw is unresolved.

    The core rests on three kinds of evidence that do not depend on one another.

    Documentary: E007 reports Nunes (1538) and the Ursúa expedition's accounts (1560). They describe the middle Solimões as among the most densely inhabited stretches of the river, with "infinite" maize stores and straight roads likened to the Incas'. By the record's note, they repeat none of Carvajal's extreme figures. These are two independent sources; the second is a set of correlated accounts from one expedition.

    Textual: E005 confines the 50,000/10,000/8,000-warrior and league-long-village figures to one manuscript branch. E089 shows the other branch blends Orellana's oral account, so the numbers are unstable whichever branch stands nearer the friar. The Relación's own text is unread here and reaches the ledger only through Denevan and Lopes (C001).

    Archaeological: the Belterra Plateau near Santarém (E017) and Cacoal on Marajó (E018) were occupied up to colonization, and the southern rim held fortified villages to about 1500 (E004).

    Two further records weigh nothing either way. The sixteenth-century 'mentirosa' charge was aimed at Orellana's relación and, per Medina, at the Amazons story (E080, E082), not at the settlements. The contemporary endorsements and Medina's caveats (E105, E106, E109–E111) are character evidence only.

    Chronology discipline cuts against over-reading. The Aquiry peak (AD 100–300, E003), Casarabe and Loma Salvatierra (to about 1400) and Upano (a protracted decline to about 550 CE, E124) are not contact-era evidence. Upano also shows that some Amazonian emptying is pre-European. No part of this verdict leans on the Aquiry population model, so the founder funding disclosed for SRC-PARSSINEN-2026 does not touch it; the verdict is unchanged with that source removed. The mosaic's sparse side supports heterogeneity's direction, not its magnitude. That side comprises river distance as the top site predictor (E010), palaeoecological negatives in most sampled terra firme (E011), and about 80% of the basin at 0–1% earthwork probability (E125).

    The final step is weaker. The Ursúa accounts and Belterra's dates place the emptying after first contact. But four gaps remain:
    - the only quantified collapse (E008: about 88% and 62–64% by c.1700) comes from upper-Amazon mission provinces;
    - no record documents the later silence on Carvajal's own reaches, which the case takes as a premise;
    - the fade-out mechanism (C023) has no evidence record;
    - E008 records flight from the rivers, so the banks emptied by displacement as well as death.
    Where I treat the emptying as likely, I lean partly on the general post-contact demographic record of the Americas, not on this ledger. Nor does the ledger discriminate "crowded" from "real but modest" on his reaches. The independent witnesses also write in superlatives, C017 itself declines to treat his numbers as counts, and the decisive spatial test of his populated against his empty reaches (R001) has not been run.

    Steelman against: corroboration of his most famous reaches funnels through one secondary paper. His "organized" societies (political territories, fortifications, organized warfare) lack independent corroboration, per E007's own limitation. Every population figure is assumption-driven: E002's roughly fivefold span, E004's contemporaneity assumption, E009's self-rejected method. And the friar was an avowed admirer of his captain (E111).

    Steelman for: hostile, independent witnesses repeat his mundane details and not his numbers. Settlement ran into the 1600s and then ended. The sparse-matrix lines share one detection problem: LiDAR found five times more earthworks than satellite imagery had along the same lines, even in deforested ground (E001). So the emptied world may be larger than the mosaic allows.

    Sensitivity: the record whose removal would most change this verdict is E007. Without it the middle-Amazon picture is uncorroborated. Support on the river would shrink to Belterra and Cacoal, plus off-route archaeology that shows plausibility rather than corroboration, and the case verdict would fall to provisionally_supported. The verdict therefore hangs substantially on one secondary synthesis of the primary witnesses. Nunes is known here through a modern edition of a letter written fifteen or sixteen years after his entry. No record in this packet is flagged provisional; the rejected records E086, E107 and E108 are not weighed.
  steelman: >-
    Eighteen years after Carvajal, the Ursúa expedition's accounts (E007) still found the middle Solimões among the most densely inhabited stretches of the river. The Belterra settlements near Santarém run up to seventeenth-century colonization (E017). So the populous world demonstrably outlived first contact, and no record in this ledger offers any explanation for the later silence other than colonial-era loss. My assessment leaves the scale and timing of that loss on Carvajal's own reaches open, because quantified decline exists only for the mission-documented upper Amazon (E008). A proponent would rightly answer that a collapse driven by slaving and by flight from exposed riverbanks (E008) predicts exactly that archival silence. Nunes was already invading villages and taking captives in the Machiparo province in 1538 (E007). On that reading, the missing Solimões figures are weak evidence against the hypothesis, and nothing in this assessment rebuts that inference.
claimAssessments:
  - claimId: AMZ-C001
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record quotes the Relación itself: its body is unread in this ledger, and the listed features are anchored only indirectly. E005 shows the Medina branch carries armed multitudes and villages four or five leagues long, while the empty stretches, roads, stores and ceramics appear only in editorial inferences (E006, E007). My expectation that the published Relación contains every listed element is high, but it rests on general familiarity with the text, a prior rather than a record. Strongest opposing consideration: a composite list of features attributed to a text whose two branches differ materially (E005, E089) needs passage-level anchoring per branch before it can be called well supported, which is what R002's synoptic table would supply.
  - claimId: AMZ-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      E005 quotes Denevan's comparison verbatim: Oviedo's version has no 50,000, 10,000 or 8,000 warriors, no villages four or five leagues long, and one mention of 5,000 warriors. The clause saying Oviedo preserves the populous-settlement picture is not in the quoted passage, though a 5,000-warrior figure implies a populous setting. Strongest opposing consideration: this is one scholar's collation read from an OCR copy, not an independent re-collation (R002 is undone). E089 also shows Oviedo's text blends Orellana's oral particulars, which bears on whose numbers are whose but not on whether the branches differ.
  - claimId: AMZ-C074
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E089 quotes Oviedo, via Medina, saying he learned particulars in Santo Domingo 'del mesmo capitán Francisco de Orellana é de otros caballeros' that the friar had not written, which is the claim's exact content. Strongest opposing consideration: this is Oviedo at second hand, read once from Medina's introduction with no second-reader check; the source is labelled unverified and the Oviedo volume is blocked. My confidence that the passage is accurately reported also draws on general familiarity with Oviedo's Historia, a prior rather than a record. The implication is that Oviedo's branch is not independent of Orellana, which complicates reading the C002 branch difference as two copies of one friar's text.
  - claimId: AMZ-C003
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E007 quotes Lopes et al. 2024 verbatim: Nunes entered the Machiparo province in 1538. The accounts it quotes describe the middle Solimões as one of the most densely inhabited areas of the river, maize stores as 'infinita', and straight roads likened to those of the Incas; by the record's note, they do not repeat Carvajal's extreme numbers. Two components are not carried by the record: 'renowned ceramics' does not appear in the quoted statement, and 'long' roads may misrender 'largos', which in Portuguese more naturally means broad. Strongest opposing consideration: all of this reaches the ledger through one secondary synthesis. Nunes survives as a letter written fifteen or sixteen years after his entry and known through a modern edition, and the ten Ursúa accounts come from one expedition, so they are correlated with one another even if independent of Carvajal.
  - claimId: AMZ-C068
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E080 reports Medina writing that Gómara knew Orellana's relación and 'la cita dándole el calificativo de «mentirosa»'; E082 and E099 read the same passage consistently. Strongest opposing consideration: this is a single drafter's reading of Medina's introduction that no second reader has checked, since the verifier could not retrieve the OCR, and Gómara's own text is not in the ledger. The claim is narrow — what Medina records — and the distinctive quotation makes misreporting unlikely. For the hypothesis, it locates the earliest 'lie' charge on Orellana's relación and, per Medina (E082), on the Amazons story rather than on the populous settlements.
  - claimId: AMZ-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      E072 reproduces the abstract: the article verifies Carvajal's narration through a careful study of its geographic reference points and concludes the manuscript 'se puede considerar como una fuente digna de confianza'. That is the claim's exact content. Strongest opposing consideration: only the abstract has been read, so the argument, its route conclusions and any qualifications in the body are unknown. The claim is locally true, but it adds little to the hypothesis, since geographic accuracy does not test descriptions of population; that is why E077 holds it at context for C017.
  - claimId: AMZ-C017
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The qualitative leg has independent corroboration where it matters most: E007's witnesses of 1538 and 1560 report a populous, provisioned, road-connected middle Solimões without the extreme figures, and E017 shows dense, road-linked settlement on the Belterra Plateau near Santarém persisting to colonization. The numerical leg rests on E005's branch comparison, with E089 showing the Oviedo branch is itself a composite, so the figures are unstable either way. The contemporary endorsements and Medina's caveats (E105, E106, E109, E110, E111) are character evidence with no diagnostic weight, and E003 correctly bars spending the Aquiry peak as contact-era corroboration. Strongest opposing consideration: 'organized' (political territories, fortifications, organized warfare) has no independent corroboration, per E007's own limitation. In addition, what Carvajal wrote is known here only second-hand (C001), the corroboration funnels through one secondary paper, and no contact-horizon archaeology has yet tested his populated against his empty reaches (R001).
  - claimId: AMZ-C004
    verdict: well_supported
    confidence: high
    reasoning: >-
      E001 quotes the paper verbatim: ten ALS lines documented 432 earthworks, only 36 previously known (hence 396 new), a circumscribed area of about 183,000 km², and an estimate of about 24,000–30,000 earthworks. Precision note: the record adds 'of which about two thirds belonged to the Aquiry', and E002's arithmetic (4,165 and 10,000 as 25% and 60%) implies an Aquiry subset near 16,700. So 'within it' must be read spatially rather than as Aquiry-culture earthworks; the 4,430 km line length and the 2024 flight date are not in the record. Strongest opposing consideration: the count is one team's unreplicated survey, and the 24–30k figure is a block extrapolation that exceeds another model's entire basin-wide prediction (E038, E039), though the two are not commensurable. For the hypothesis, E003 dates the peak to AD 100–300, so none of this is contact-era evidence.
  - claimId: AMZ-C005
    verdict: established
    confidence: high
    reasoning: >-
      E002 quotes both halves verbatim. If 25–60% (4,165–10,000) of earthworks were in use at 300 people each, the population is 1.25–3 million; the single-family-per-house reading gives 250,000–600,000, or 315,000–760,000 with the laser-invisibility correction. The arithmetic checks: 4,165 × 300 ≈ 1.25 million, and the alternative is a fifth of the headline, about a quarter after correction. The model sensitivity is therefore a property of how the estimate is built, not an editorial opinion. Strongest opposing consideration: the authors call the single-family reading 'very unlikely', so the full span overstates the uncertainty if their ethnographic priors hold. But their preferred range already spans 2.4-fold on the use fraction alone, and '300 people to build and maintain' is itself a conversion assumption. For the hypothesis it matters little, since the peak is a millennium before contact.
  - claimId: AMZ-C006
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E004 quotes the abstract: an 1,800 km stretch was occupied by earth-building cultures in fortified villages ~Cal AD 1250–1500. It also quotes the population passage, whose wording ('assuming site contemporaneity', projections to 463,555 and 1,087,150) establishes the dependency half of the claim. Strongest opposing consideration: occupation of the whole arc is inferred from dispersed dated clusters joined by a MaxEnt projection rather than from a continuous dated distribution, and 'fortified' is an interpretation of ditched enclosures. For the hypothesis, this is contact-adjacent evidence that dense, engineered settlement was ongoing to about 1500, but on the southern rim, not on Carvajal's route.
  - claimId: AMZ-C011
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Two legs are primary and verbatim. Belterra Plateau sites date from ca. AD 1300 'up to the time of European colonization in the seventeenth century', with dark earths, ponds and trodden roads (E017). Cacoal is dated AD 1300–1650, attesting Marajoara permanence as the Portuguese settled (E018). The Upper Xingu leg (500–1770 CE, Kuikuro-like layouts more than ten times larger) rests on a Science news feature held at secondary weight (E019). Strongest opposing consideration: occupation into the contact era is not demographic continuity, and the Cacoal abstract itself records profound sociopolitical change in the late period. 'Up to colonization' is also an abstract-level summary of end dates, and Cacoal is a single site rather than a system.
  - claimId: AMZ-C007
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E014 quotes Lombardo et al. 2025: drainage canals and newly documented savannah farm ponds, plus 178 phytolith samples from 18 profiles recording 'the singular and ubiquitous presence of maize', interpreted as 'intensive year-round maize monoculture'. The infrastructure and the maize are observations; 'year-round' and 'monoculture' are inferences from them. Strongest opposing consideration: phytoliths record root crops such as manioc more weakly than maize, so ubiquitous maize is better evidence of maize's importance than of a monoculture. That is a general proxy concern rather than one raised in the record, and the result comes from a single study. For the hypothesis, Casarabe ends about 1400 CE, before contact (E014's limitation).
  - claimId: AMZ-C008
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The tree-concentration clause is directly supported by Levis et al. 2017 (E012), with corroboration from the same research network that is not independent (E040, E041). Dark earths and raised fields are documented elsewhere in this ledger: E017's extensive anthropogenic soils at Belterra, and E015 and E016 on Mojos raised fields. Human-made forest islands have no evidence record here, so that element leans on background knowledge. Strongest opposing consideration: McMichael et al. (E013) argue that post-Columbian activity likely shaped the floristic pattern more than pre-Columbian activity. Bush 2025 (E122) shows a pre-Columbian influence on modern forest composition can be erased while a Colonial one persists. Neither denies the concentration the claim states, but together they block reading that concentration as evidence of pre-Columbian engineering.
  - claimId: AMZ-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Rodrigues et al. 2015 (E016) dates raised fields to intermittent use since AD 570–770 in a few construction events and explicitly challenges the continuous-cultivation theory. Lombardo et al. 2011 (E015) proposes flood-risk mitigation, with fields built 'only in those areas where there were no alternatives'. The claim speaks of 'raised fields in the Llanos de Mojos', but the dating comes from the Bermeo fields alone (E016's limitation), and the two papers share authors, so they are not independent confirmations. Strongest opposing consideration: other raised-field complexes in the region may have different histories. Dating a few construction events also establishes when fields were built more securely than how intermittently they were used.
  - claimId: AMZ-C019
    verdict: well_supported
    confidence: high
    reasoning: >-
      E116 quotes the paper: the floodplains are 'criss-crossed by vestiges of zigzag weirs and of arrow-straight causeways', and 231 of 382 detected ponds (60%) lie within 35 m of such a feature. Across 10,000 simulations, the probability that random placement would put more ponds that close is below 0.0001. Strongest opposing consideration: the two sub-basins were chosen because vegetation made the earthworks visible, and the randomization assumes ponds are equally detectable everywhere; if ponds beside weirs are easier to see, the association is inflated. The weirs themselves are undated (one pond's infill dates to AD 1030–1180 and 1310–1424), and the system is off Carvajal's route.
  - claimId: AMZ-C087
    verdict: established
    confidence: high
    reasoning: >-
      E117 quotes the Discussion: 'we postulate that the principal function of the V-shaped structures was to concentrate fish in ponds'. The authors argue this from the absence of gaps at the points of the Vs and from the ponds' apparent role as traps. The claim is an attribution, and it states exactly what the authors say. Strongest opposing consideration, to the function rather than the attribution: it is inferred from layout and a modern analogue, no fish remains from the ponds are reported, and the authors themselves keep open a natural origin for the ponds (E118).
  - claimId: AMZ-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E022 quotes the paper: more than 17,000 fish remains came from Loma Salvatierra, a monumental mound in an interfluvial area 50 km from the Mamoré, occupied AD 500–1400. The paper concludes 'that these regions contain year round resources', with lungfish and tiger-fish among the small-water-body dry-season taxa. Strongest opposing consideration: the quoted conclusion is that year-round resources existed. 'Year-round exploitation' is inferred from the ecology of the taxa present rather than, as far as the record shows, from seasonal markers in the remains. For the hypothesis, the site is interfluvial, which complicates a strictly riverine picture of density, and it ends about 1400, before contact.
  - claimId: AMZ-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E009 is decisive for the Denevan half: he rejects the habitat-density method behind 5.1–6.8 million because densities varied too much to average from a few samples, yet still holds 'at least 5 to 6 million' reasonable. The general half (basin-wide estimates are assumption-sharing model families, not measurements) follows partly from the fact that no 1492 count exists. It is illustrated by the regional estimates' stated dependencies (E002, E004), but no record audits the family of basin-wide figures. Strongest opposing consideration: 'on other grounds' is the claim's gloss, since the quote does not say what grounds Denevan has. If those grounds are independent of the rejected method, the number may be better founded than its derivation, and R004 has not been done.
  - claimId: AMZ-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E020 quotes the authors on three points: growth over the 1,700 years before colonization 'adheres to a logistic model'; populations 'had potentially reached carrying capacity (however high)'; and the terminal decline 'is likely to be an outcome of archaeological sampling biases, compounded by demographic decline and dispersal as Europeans enter the region'. The attribution half is exact; 'not to a pre-European endogenous crash' is the claim's contrast, implied rather than quoted. Strongest opposing consideration: summed-date curves are a proxy with stated biases (E020's limitation) that can shape the curve independently of population. Research intensity and taphonomic loss are among them, a general methodological point rather than one argued in the record, and aggregates also mask local pre-European declines such as Upano's (E124). For the hypothesis, it is supporting context: an aggregate population still high when Europeans arrived.
  - claimId: AMZ-C010
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E008 quotes Newson's Table 1 and text: Napo–Aguarico fell from 49,000–51,000 to 6,000 by c.1700 (87.8–88.2%), and Mainas from 83,000–102,000 to 30,180–38,490 (62.3–63.6%). The causes were epidemics, enslaving raids, missionization, service demands culminating in the 1635 revolt, and flight from the major rivers. Strongest opposing consideration: the contact-era baselines are themselves reconstructions, so the percentages inherit their uncertainty, though 'catastrophic' survives large baseline errors. For the hypothesis, these are upper-Amazon mission provinces, and applying their ratios to the Solimões and lower Amazon is extrapolation (E008's own limitation). The recorded flight also means part of the riverbanks' emptying was displacement rather than death.
  - claimId: AMZ-C023
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is linked to this claim; its anchor quotation ('fade outs' were common) sits in the claims file, not in an evidence record, so I do not weigh it. The records do carry the claim's conclusion. E008 lists epidemics, enslaving raids, missionization, forced service, revolt and flight as joint causes with very different outcomes by province, and E007 has Nunes invading villages and taking captives in the Machiparo province in 1538. The specific mechanism (fade-outs in sparse populations, reintroduction through raids and missions, heaviest adult mortality where infection arrived late) rests on general epidemiological priors such as critical community size and non-immune adults, not on this ledger. Strongest opposing consideration: until the Newson passage is entered as evidence, the claim's most distinctive content is unexamined here.
  - claimId: AMZ-C088
    verdict: well_supported
    confidence: high
    reasoning: >-
      E124 quotes the abstract and Discussion: 'a gradual decline in forest exploitation presaged an apparent abandonment of the site c. 550 CE', and 'no evidence of an abrupt abandonment, but rather of a protracted decline'. It also reports no terminal ashfall and a gradual return of forest between about 200 and 550 CE. The excavators' independent dating of the occupation's end to 300–600 CE (E073) is consistent. Strongest opposing consideration: one lake core within 10 km of the mound complexes records land use in its own catchment, which may not track the whole valley, and a later Huapula reoccupation of some mounds is recorded separately (E074). For the hypothesis, this is a pre-European emptying a millennium before Carvajal, and a warning that later forest is not by itself a sign of contact-era collapse.
  - claimId: AMZ-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      E010 quotes the model over 7,363 site locations: distance from river is the most important predictor (21.5% of permutation importance). The models 'differentiate probabilities of occupation in interfluvial areas that were more sparsely populated than those close to rivers'. The relative statement agrees with independent palaeoecological negatives (E011) and earthwork-probability modelling (E125). Strongest opposing consideration: the site inventory is biased toward accessible riverine ground (E010's limitation), so a presence-only model will rank river distance highly even if interfluves were occupied. Moreover, 21.5% leaves most predictive weight elsewhere, and dense non-riverine occupation is on record: Loma Salvatierra 50 km from the Mamoré (E022) and the Belterra upland (E017). The claim holds as a tendency, not a rule, and its sparse half is the less secure.
  - claimId: AMZ-C014
    verdict: well_supported
    confidence: high
    reasoning: >-
      E011 quotes the synthesis: regional sequences, 'particularly in interfluvial areas', show diverse, often closed-canopy forests. They give 'little to no evidence' of annual seed and root crops, significant clearing, anthropic soils, enrichment of favoured trees, or recurrent fires in the pre-Columbian era. The claim reports what was found in sampled settings and does not extrapolate beyond them. Strongest opposing consideration, to representativeness rather than to the finding: sampling is sparse and clustered (E121's critique, which predates this synthesis). The new fieldwork covers only three of the fourteen regions, and all the studies come from one research network. E123 shows a sediment record keeping a 2,500-year-old maize signal, which weakens the objection that old occupations simply vanish from such proxies, though soil profiles may preserve differently.
  - claimId: AMZ-C020
    verdict: established
    confidence: high
    reasoning: >-
      E119 and E120 quote the paper verbatim, from a model with an AUC of 0.91 at 1 km: 'the limited, albeit impressive, predicted extents of earthworks and ADEs' and 'other sites dominate more than two thirds of all Amazonia'. The claim reports what the model finds, accurately. Strongest opposing consideration, to its implication rather than its truth: this is a conditional classification of the most likely site type given that a site exists, trained on discovery-biased known sites. It bounds the reach of earthwork and dark-earth landscapes but says nothing about how densely the rest of the basin was occupied.
  - claimId: AMZ-C021
    verdict: established
    confidence: high
    reasoning: >-
      E121 quotes the reply: 300 cores from 109 sites are 'clustered in five small areas, with only one long transect'. In western Amazonia, 124 cores from 24 sites at 10 cm diameter and up to 120 cm depth sum to about 1.17 m³, set against some 2,000,000 km². The arithmetic checks (124 × π × 0.05² m² × 1.2 m ≈ 1.17 m³), and the claim is only that the reply makes this critique, which it does. Strongest opposing consideration, to the critique rather than the claim: a core samples a site or catchment, not a column of soil, so sediment volume overstates the thinness. The clustering is the stronger point, the critics' own defence is not in the ledger, and the reply predates the 2024 fourteen-region synthesis (E011).
  - claimId: AMZ-C022
    verdict: well_supported
    confidence: high
    reasoning: >-
      E122 quotes the conclusion verbatim: a long forest recovery 'largely eradicated the influence of Pre-Columbian occupations', whereas Colonial-period Indigenous forest use 'left a lasting legacy on the modern system'. E123 confirms the scope the claim states: the erased influence is on modern forest composition, not on the sediment, which records maize from about 570 BCE. Strongest opposing consideration: this is one lake beside one valley whose occupation ended roughly a millennium before Colonial use began (E122's limitation). The time-graded erasure therefore cannot yet be transferred to sites abandoned in the 1600s (R008 is undone).
  - claimId: AMZ-C029
    verdict: established
    confidence: high
    reasoning: >-
      E125 quotes the paper: 'Almost 80% of the basin has a 0 to 1% of predicted probability of earthwork presence' per 1 km² cell, mostly in northwestern, northern and central Amazonia; the claim reports this exactly. Strongest opposing consideration, to its implication: the model is presence-only, trained on site data with acknowledged bias toward deforested, road-accessible areas, and its observability correction is itself modelled. E001's finding that LiDAR detected five times more earthworks than satellite imagery along the same lines, even in deforested ground, suggests such inventories undercount. Its low stratum is also low for ring ditches, geoglyphs, ponds and wells, not for people; the authors themselves point to widespread dark earths there (E126).
  - claimId: AMZ-C016
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      At contact, the positive half rests on settlement systems dated into or up to that horizon (E004 to about 1500; E017 and E018 into colonization), contemporaneous testimony on the middle Solimões (E007), and an aggregate radiocarbon proxy still high at colonization (E020). The matrix half rests on river-distance modelling (E010), palaeoecological negatives in most sampled terra firme (E011) and earthwork-probability surfaces (E125). The direction of heterogeneity is well supported, but its magnitude ('much more lightly occupied') is unmeasured, because no promise-blind interfluve survey exists (R003). Strongest opposing consideration: the matrix-side lines share one detection problem, so their agreement is less independent than it looks. LiDAR found five times more earthworks than satellite imagery along the same lines even in deforested ground (E001), the site inventory leans riverward, and the cores are clustered (E121). The most spectacular hotspots (Aquiry, Casarabe, Loma Salvatierra, Upano) also predate contact and cannot be spent on 'immediately before contact'.