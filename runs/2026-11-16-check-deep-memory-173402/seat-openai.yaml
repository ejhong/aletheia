caseAssessment:
  verdict: weakly_supported
  loadBearing: [DEEP-C002, DEEP-C057, DEEP-C026, DEEP-C035, DEEP-C018, DEEP-C072]
  weakestLinks: [DEEP-C057, DEEP-C027, DEEP-C031, DEEP-C054, DEEP-C037]
  synthesis: >-
    Interpreting the featured hypothesis as the proposition that the distant
    resemblances substantially preserve a common ancient source, the ledger
    provides weak support but not a demonstrated historical connection. The
    strongest case for the hypothesis is that several comparisons concern real
    and sometimes nontrivial features rather than wholly invented likenesses.
    The reported civiliser lineup produced a large claimed-partner versus
    random-pair contrast, Oannes is genuinely described as a fish-bodied
    civilising teacher, one handled chlorite object has wear interpreted as
    prolonged suspension from a cord, and the Hoa Hakananai'a reliefs genuinely
    belong to a birdman composition. These observations justify investigating
    transmission and prevent dismissal of the entire pattern as imaginary.
    They do not, however, connect the distant cases historically.

    The strongest case against the hypothesis is structural. The broad
    catalogue experiment reportedly finds the individual motif classes
    widespread while their three-motif bundle does not stand out under its
    documentation-preserving comparisons. That result is only a weak,
    unaudited self-report, but it points toward high motif baselines rather than
    a distinctive inherited package. More securely, the source audit shows
    that the supposed “navel” parallels are heterogeneous: Delphi has an
    ancient Greek sanctuary usage; Cusco's gloss is a colonial-era report
    rejected by the retrieved historical linguist; Te Pito o te Henua has a
    documented “land's end” reading and disputed indigenous island-name use;
    and Göbekli Tepe is a modern Turkish name interpreted by the excavators as
    describing the mound's shape. Likewise, the Göbekli handled forms have no
    secure functional identification, whereas the Assyrian banduddû has a
    ritual bucket interpretation. Hoa Hakananai'a's birdman reliefs were later
    additions rather than part of the statue's original manufacture. These
    findings weaken particular bundled comparisons without proving that every
    motif arose independently.

    The methodological claims are therefore decisive: resemblance alone does
    not identify a source, date, mechanism, or capabilities, and a broad
    geographical distribution cannot distinguish convergence from ancient
    transmission. The excavation-team comment about missing intermediate links
    is informal and does not prove discontinuity, but the ledger contains no
    dated transmission chain bridging the relevant cultures. The direct
    statistical claims concerning lineups, motif frequencies, flood clustering,
    Genesis-associated details, and image-judge behavior are either weak
    self-reports or wholly unsupported by retrieved run data. Consequently,
    “contradicted” would overstate the evidence: no record demonstrates
    independent origin for the whole pattern. “Unresolved” would understate the
    evidential tilt because genuine resemblance supplies some positive support,
    while the source histories and non-distinctive broad categories materially
    reduce its historical force. The weak-support verdict also relies on the
    ordinary scientific prior that transmission over very large temporal and
    geographical gaps requires dated intermediates or comparably diagnostic
    evidence; that prior is not itself a result in this ledger.

    The single evidence record whose removal would most change the case verdict
    is DEEP-E092, because its specialist rejection of the Cusco “navel”
    etymology removes one prominent member of the apparent sacred-centre
    package. The verdict survives without it: the Rapanui ambiguity, the modern
    descriptive Göbekli name, the uncertain handled forms, the missing
    intermediates, and the unaudited status of the catalogue and lineup results
    still leave the shared-source hypothesis only weakly supported.
  steelman: >-
    The ledger never tests the proponent's strongest prediction: whether
    narrowly specified, multi-feature configurations—such as a bird-associated
    anthropomorph combined with the same handled form, bodily pose, and spatial
    arrangement—co-occur across securely dated cultures more often than
    kind-matched controls. Broad motif bins may erase exactly that
    bundle-specific signal, so the catalogue result does not answer this
    feature-level transmission argument.
claimAssessments:
  - claimId: DEEP-C002
    verdict: established
    confidence: high
    reasoning: >-
      This is a methodological identifiability principle: the same visual
      resemblance can be compatible with transmission, convergence, or
      selective comparison unless chronology, context, differences, and
      possible routes constrain the alternatives. The conclusion rests mainly
      on general scientific reasoning rather than a dedicated evidence record
      in this ledger. The strongest opposing consideration is that an extremely
      complex and independently specified resemblance can itself be
      informative, but even then it does not uniquely assign a historical
      mechanism.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder's page reports that the three-class bundle did not stand out
      under documentation-preserving comparisons. No underlying catalogue,
      code, comparison distribution, or replication is available, and
      DEEP-E018 and DEEP-E019 identify uneven coverage and a mismatch between
      broad categories and the specific images. The strongest opposing
      consideration is that the reported result directly matches the claim as
      phrased, even though it remains unaudited.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 report the claimed 62.5% and 9% rates, so the
      founder's account is internally consistent with the claim. The run data,
      number of incomplete lineups, prompts, controls, and reproducibility
      checks were not retrieved. The strongest opposing consideration is the
      large reported separation between claimed and random pairs, which would
      be notable if independently reproduced.
  - claimId: DEEP-C034
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E097 documents seventeenth-century comparative readers aligning an
      Andean account with Genesis detail by detail, establishing that
      comparative writing can manufacture perceived correspondences. It does
      not provide the before-and-after retellings required to show that the
      stories themselves became more alike through translation or borrowing.
      General knowledge makes the proposed mechanisms plausible, but the
      verdict leans partly on that prior; the strongest opposing consideration
      is the absence of a documented convergent textual sequence in the
      evidence records.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Resemblance does not logically specify a proposed source's identity,
      chronology, social organization, or technical capabilities, because
      multiple source models can generate the same resemblance. Those added
      propositions require independent constraints, so the claim follows as a
      methodological matter rather than from paper counts or authority. The
      strongest opposing consideration is that a highly diagnostic bundle may
      raise the probability of transmission, but it still cannot establish all
      of the added attributes by itself.
  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A geographical distribution alone is observationally compatible with
      both repeated invention and inheritance followed by dispersal unless a
      model adds temporal, phylogenetic, or mechanistic constraints. The ledger
      itself illustrates this underdetermination through widespread broad
      classes and the absence of an established chain of intermediates. The
      strongest opposing consideration is that sufficiently detailed spatial
      gradients can favor one model, but that would require more than the
      distribution of a broad motif class by itself.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder reports broad bird-person and cosmic-serpent frequencies of
      55% and 37% and describes all three classes as widespread. The catalogue,
      coding rules, and sacred-centre results have not been independently
      inspected, while DEEP-E018 and DEEP-E019 flag uneven coverage and broad
      categories. The strongest opposing consideration is that the two
      reported numerical baselines are at least consistent with widespread
      occurrence within the sampled catalogue.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 repeat the reported 55% figure for 926 sampled
      traditions. They are founder self-reports rather than a reproduction from
      retrieved coded data, and DEEP-E015 does not validate the percentage but
      only limits its interpretation. The strongest opposing consideration is
      that no evidence record reports a conflicting calculation.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 directly reports a 37% frequency for the broad cosmic-serpent
      class, but the underlying observations and calculations were not
      retrieved. DEEP-E017 through DEEP-E019 restrict the result to a selected,
      unevenly covered dataset and do not reproduce the number. The strongest
      opposing consideration is the absence of any recorded contradiction to
      the founder's stated percentage.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      A bird-headed deity, a feather-costumed person, and a person undergoing
      transformation are conceptually distinct interpretations. No evidence
      record, however, classifies the compared images into these categories or
      establishes which readings apply to them. The strongest opposing
      consideration is that the semantic distinctions are intrinsically
      plausible, but plausibility does not meet the claim's stated empirical
      truth condition.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the published relative sequence in which
      komari and then the birdman bas-reliefs were added after the statue's
      original manufacture. This directly establishes the local chronological
      claim without requiring an absolute date. The strongest opposing
      consideration is that only the abstract was retrieved, so the survey
      evidence and dating argument in the paper's body remain unread.
  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Similar shape does not entail identical use, and a functional
      interpretation requires contextual or use-trace evidence beyond outline.
      The ledger supplies a concrete contrast between the functionally
      unidentified Pillar 43 forms and an Assyrian object interpreted through
      ritual texts. The strongest opposing consideration is that shape can
      sometimes strongly constrain function, but it still does not collapse
      the two questions into one.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      DEEP-E055 reports a ritual text in which the banduddû contains water that
      is consecrated and sprinkled over a person, supporting a ritual
      bucket-and-sprinkling interpretation. The passage is available only
      through an unchecked personal-blog transcription of Wiggermann, and it
      does not directly establish the separate cone or purifier component. The
      strongest opposing consideration is that the quoted ritual instructions
      are specific and would strongly support the claim if verified against the
      primary edition.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 quotes a member of the excavation team stating that no final
      decision about the meaning of the three forms was possible and that their
      meaning was difficult to guess. This directly supports uncertainty rather
      than any particular functional identification. The strongest opposing
      consideration is that the statement was a 2016/2017 team blog post and
      later formal publications were not comprehensively checked.
  - claimId: DEEP-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035 reports the wear-study authors' abstract-level inference that
      strong wear indicates prolonged suspension on a cord. DEEP-E034 confirms
      wear on the handle and contour, while DEEP-E038 appropriately limits the
      inference to a single object without defeating this object-specific
      claim. The strongest opposing consideration is that the article body and
      the identification of the pictured ledger object were not verified.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 quote an excavation-team member saying there are
      too many missing links to be sure how far the imagery survived or how its
      meaning changed. That is a direct statement of the cautious position
      asserted by the claim. The strongest opposing consideration is that it is
      one informal comment-thread reply rather than a demonstrated team-wide
      conclusion in a formal publication.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      DEEP-E087 through DEEP-E096 document sharply different source histories:
      ancient Greek sanctuary usage at Delphi, Garcilaso's 1609 colonial gloss
      for Cusco, disputed late-recorded Rapanui usage, and a modern Turkish
      descriptive name at Göbekli Tepe. These records differ in language,
      attestation date, semantic security, and connection to the ancient
      builders, exactly as claimed. The strongest opposing consideration is
      that some earliest-attestation searches remain incomplete, but no
      plausible completion would make the four records interchangeable.
  - claimId: DEEP-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E096 quotes the excavators' monograph glossing Göbekli Tepe as
      “belly mountain” and saying that the name aptly evokes the mound's shape
      from afar. This directly supports a descriptive modern toponym rather
      than an ancient sacred designation. The strongest opposing consideration
      is that the passage does not trace the name's earliest historical use and
      reflects the excavators' etymological judgment rather than a dedicated
      toponymic study.
  - claimId: DEEP-C093
    verdict: established
    confidence: high
    reasoning: >-
      DEEP-E094 documents Churchill's Rapanui-based “end” reading, including an
      islander's identification of terminal promontories, and DEEP-E095 adds
      Holmer's independent comparative argument from Maori. The claim concerns
      the documented existence of a rival published reading, not whether that
      reading is ultimately correct. The strongest opposing consideration is
      that Churchill relied on one reported conversation and Holmer reasoned
      from a sister language rather than direct Rapanui usage.
  - claimId: DEEP-C094
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E092 records an Andean historical-linguistics specialist's explicit
      conclusion that Garcilaso's “navel” etymology is entirely unfounded and
      Renaissance in character. This is directly relevant expert analysis, not
      merely absence of corroboration. The strongest opposing consideration is
      that the demonstrating 1999 study was not retrieved and no second
      specialist assessment was entered, so the full lexical case cannot be
      audited here.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Basic mechanical considerations make it plausible that keeping arms and
      hands against a stone body reduces vulnerable projections and can
      contribute to pose selection. This judgment rests chiefly on general
      material reasoning rather than a direct experiment or comparative
      breakage study in the evidence records. The strongest opposing
      consideration is that symbolic convention could independently determine
      the pose, and the ledger does not estimate the material constraint's
      actual contribution.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E075 records Oannes's fish-over-human anatomy, DEEP-E076 says his
      form was reportedly preserved in sculpture, and DEEP-E079 supplies a
      secondary scholarly alignment between Oannes and U-An, the first apkallu.
      Together these make the correspondence plausible but do not directly
      identify a specific fish-cloaked Assyrian image as Oannes or demonstrate
      the complete iconographic equivalence. The strongest opposing
      consideration is the missing textual-iconographic bridge: the retrieved
      fragment never names the depicted type “apkallu.”
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses when the Gate of the Sun figure began to be
      called Viracocha or whether a pre-modern source makes that
      identification. The founding page's assertion is not enough to decide
      the historical naming claim. The strongest opposing consideration is the
      claim's plausibility as a modern interpretive label, but that is a prior
      impression rather than ledger evidence.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies the 263 coded summaries, the regional labels,
      a clustering statistic, or a null comparison. The claim therefore cannot
      be checked from the provided ledger. The strongest opposing consideration
      is the founder's reported conclusion, but it was not entered as a usable
      evidence record for this claim.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      The evidence packet contains no record showing the distribution of
      Genesis-associated details in the coded flood summaries. Neither the
      coding definition nor the expected distribution under a comparison model
      is available. The strongest opposing consideration is that the founding
      source states the result, but without an admitted evidence record or data
      it cannot warrant a verdict in favor.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 directly reports that kind-matching the objects changed the
      lineup result. The pilot data, size of the change, completion rate, and
      robustness to cropping were not retrieved, so the report cannot be
      reproduced. The strongest opposing consideration is that the claim is
      narrowly about the pilot's own result and the founder's statement matches
      it exactly.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record provides inter-judge agreement statistics or even a
      direct admitted report of their magnitude for this claim. DEEP-E022
      concerns kind-matched controls and does not bear on judge disagreement.
      The strongest opposing consideration is the claim's source anchor
      mentioning strong disagreement, but source anchors are not evidence
      records and the relevant pilot output remains unavailable.