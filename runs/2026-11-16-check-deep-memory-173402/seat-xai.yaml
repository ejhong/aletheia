  synthesis: >-
    The ledger evidence, read strictly against the 27 claims and without outside results, yields a mixed verdict on the founding question of how much cross-cultural resemblance in bird-men, handled objects, navel names, civilisers, serpents and floods records a shared past versus independent invention, material convergence, translation/borrowing or later comparative retelling. Methodological claims that resemblance alone is never historical evidence (C002), that catalogue geography cannot separate invention from deep transmission (C026), that similarity cannot underwrite lost-civilisation identity/date/capability claims (C035), and that stories converge under translation and comparative writing (C034, backed by Garcilaso’s own report of Spaniards mapping Inca origin details onto Noah) are well supported by both the records and standard historiographic priors; they correctly place the burden on dated intermediates, contexts and differences. Parallel source-history work on the four “navel” designations (C018) is decisive: Delphi’s omphalos is Greek, fifth-century BCE and used by the sanctuary’s own community (Pindar, Pausanias, Strabo); Cusco’s “navel” is a 1609 Spanish gloss by Garcilaso that Andean historical linguistics rejects as unfounded (C094, Cerrón-Palomino); Te Pito o te Henua carries a documented rival “land’s end” reading from both a Rapanui informant and Maori cognates (C093); Göbekli Tepe’s modern Turkish name is a shape descriptor (“belly mountain”) applied after 1963 recognition, with no builder usage possible (C015). These are different kinds of evidence, so the shared-name pattern dissolves. Handled-object claims reinforce the same caution: the Göbekli Pillar 43 forms remain without secure function per the excavation team itself (C012, Dietrich 2016), shape and function are separate questions (C065), and the Assyrian banduddû bucket-and-purifier reading rests on weak second-hand transcription (C044). Jiroft wear consistent with cord suspension is only provisionally supported at abstract level for a single object (C009). Bird-man carvings on Hoa Hakananai’a post-date manufacture (C059, Pitts abstract), and material constraints are a plausible contributor to hands-on-body poses (C047). Catalogue frequencies (55 % bird-person, 37 % cosmic serpent, widespread classes whose bundle does not stand out) and the V1 civiliser lineup (62.5 % vs 9 %) are merely self-reports of unaudited experiments with uneven coverage and incomplete runs (C005, C025, C056, C057, C027); they supply weak baselines at best and cannot distinguish histories. Flood clustering and Genesis-detail unevenness (C031, C054), AI inter-judge disagreement (C037) and kind-matching effects (C038) lack independent data or remain unresolved. Oannes–apkallu correspondence is only contextual (C053). No claim establishes long-distance contact or a single source with the required intermediates; the excavators themselves note too many missing links (C072). The pattern people see is real as visual impression, yet the ledger’s strongest records systematically undercut treating it as shared deep memory. Independent invention plus later retelling and material logic remain the better-supported default for the bulk of the resemblances examined. Sensitivity is moderate: removing the navel source-history cluster (especially E092/E094/E096) would most weaken the “different kinds” demonstration and slightly soften the mixed verdict toward unresolved, yet the methodological cautions, Pillar 43 uncertainty and self-report weakness would still leave shared-past claims poorly evidenced. The verdict does not hang on one thread.
  steelman: >-
    The V1 civiliser lineup’s 62.5 % first-rank rate for claimed partner figures (versus 9 % random) and the readily perceived multi-motif visual clusters (bird-headed beings plus handled forms plus navel language) across Göbekli, Assyria, Mesoamerica and Rapa Nui have not been shown, inside the ledger, to arise at comparable rates under any explicit independent-invention or pure-convergence generative model; a proponent can still point to that unexplained excess similarity as the observation the cautions have not dissolved.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim is a standard historiographic and archaeological principle: visual resemblance acquires historical meaning only through dates, contexts, differences and possible connections. No evidence record contradicts it; the founder page simply restates it. Verdict leans partly on scientific priors about inference, as the ledger supplies no direct test case that would falsify the principle.
  - claimId: DEEP-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Only the founder’s self-report of the catalogue experiment asserts that the three-class bundle does not stand out against documentation-preserving comparisons, qualified by uneven coverage. No underlying data or independent re-analysis appears; the strongest opposing consideration is that an unaudited self-report cannot establish the negative statistical claim.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 62.5 % versus 9 % figures are solely the founder page’s statement of its own V1 AI lineup results; run data were never retrieved and incomplete runs are noted. The strongest opposing consideration is that an unreplicable self-report of an AI experiment supplies no trustworthy rate comparison.
  - claimId: DEEP-C034
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Documented retellings and comparative writing do produce convergence: Garcilaso records Spaniards already mapping Inca origin details (four couples, cave window) onto Noah’s ark by 1609, while declining the parallel himself. The mechanism is thereby evidenced in period. The strongest opposing consideration is that the record shows commentator alignment more than alteration of the indigenous story’s own later textual details.
  - claimId: DEEP-C035
    verdict: well_supported
    confidence: high
    reasoning: >-
      Similarity of motifs cannot by itself establish a lost-civilisation source’s identity, date or capabilities; those require independent evidence. The claim is methodological and uncontradicted; founder language simply asserts it. Verdict calibrated by ordinary standards of historical proof rather than any single ledger measurement.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: high
    reasoning: >-
      A catalogue’s geographical distribution of a broad motif class is compatible with both independent invention and very old transmission under standard models; the claim correctly states that geography alone cannot distinguish them. No counter-evidence appears. The principle is reinforced by the excavators’ own “missing links” caution elsewhere.
  - claimId: DEEP-C056
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder’s catalogue experiment is the sole source asserting that the three broad classes are each widespread; the same page immediately qualifies coverage as uneven and categories as broader than the specific images at issue. Without the coded data, the frequency claim remains a weak self-report.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The 55 % bird-person figure is reported only by the founder page for its own unaudited sampling of 926 traditions; method, coding rules and the Berezkin catalogue itself were not retrieved. The page’s own caveats on coverage and on what the broad class does not capture further limit weight. Strongest opposition is absence of primary data.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Identical footing to the bird-person frequency: the 37 % cosmic-serpent figure is a founder self-report only, scoped by the page itself to the selected category and uneven catalogue. No independent reproduction exists in the ledger.
  - claimId: DEEP-C004
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Iconographic categories routinely separate deities with bird heads, feathered humans and transformation scenes; the claim that “bird-man” conflates distinct ideas is therefore plausible and matches ordinary comparative practice. No ledger image set or specialist reading contradicts the distinction. Verdict leans on iconographic priors plus the founder’s unchallenged assertion.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Pitts et al. abstract establishes the relative sequence statue manufacture → komari petroglyphs → bas-relief birdman carvings, so the birdman imagery post-dates the statue. Absolute dates and full survey reasoning remain unread (paywalled body). Strongest opposition is that an abstract-level relative sequence leaves the chronological gap unquantified.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: high
    reasoning: >-
      Shape and function are analytically separate questions in material culture; a handled form may be a bucket, a bag, a building glyph or something else. The claim is standard method and is reinforced by the team’s refusal to assign function to the Göbekli forms. No evidence equates the two.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      A second-hand blog transcription of Wiggermann attributes ritual filling and sprinkling to the banduddû, supporting a bucket-and-purifier reading. The printed page was never checked, transliterations are garbled, and the cone/purifier half is not in the transcribed text. Strongest opposition is the unverified secondary channel.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      The excavation team’s own 2016 post states that a final decision on the meaning of the three forms is not possible and that their meaning is hard to guess. Schmidt 2006 describes only shape (“box-like\ldots handle-like”). No later team publication in the ledger overrides the uncertainty. This is direct primary support.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Vidale & Micheli abstract reports wear traces on the handle and contour and explicitly reads them as long suspension on a cord; the founder caption is faithful. Authors immediately limit the inference to a single object and call it far from granted. Body of the paper unread, object identity with the photographed piece unconfirmed. Abstract-level support only.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Dietrich’s 2016 comment-thread reply states there are far too many missing links to be sure of survival of Early Neolithic imagery into later periods and that any meaning change cannot yet be assessed. Informal wording and blog context reduce strength, yet it is the team’s stated position. No contradictory team statement appears.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      Multiple primary and specialist sources demonstrate differences on precisely the three axes named: language, date of first record, and builder usage. Delphi is Greek, fifth-century BCE and sanctuary-internal (Pindar, Pausanias, Strabo); Cusco is a 1609 Spanish gloss later rejected by Andean linguistics; Te Pito o te Henua is late-nineteenth-century with a rival “end” reading; Göbekli is modern Turkish shape description post-1963 with no possible builder name. The kinds are not interchangeable.
  - claimId: DEEP-C015
    verdict: well_supported
    confidence: high
    reasoning: >-
      Dietrich & Schmidt’s own monograph introduction glosses Göbekli Tepe as “belly mountain” that “quite aptly evokes its shape seen from afar” and notes first archaeological recognition in 1963. This matches the claim’s truth condition (descriptive of mound form, not sacred designation). Kurdish names are outside this record.
  - claimId: DEEP-C093
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Churchill 1912 records an islander identifying three “pito o te henua” at the terminal promontories and argues pito also means “end”; Holmer 1962 independently reaches “land’s end” from the Maori cognate. Both supply documented rival readings with evidence. Later Rapanui scholarship remains unread, so the claim is well supported but not exhaustive.
  - claimId: DEEP-C094
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Cerrón-Palomino, a specialist in Andean historical linguistics, states that Garcilaso’s “navel”/“centre” etymology of Cusco is “rather Renaissance in cut” and “entirely gratuitous,” referring to his own 1999 demonstration. The ledger lacks the 1999 article itself and any contrary specialist views, yet the rejection is direct and on-point.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Carving limbs in relief against a stone body is a well-known practical solution to breakage risk in freestanding sculpture; the claim that material constraints are a plausible contributor to hands-on-body poses follows directly. No ledger evidence contradicts the mechanism or supplies a purely symbolic counter-reading that excludes it. Verdict calibrated partly by sculptural priors.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Berossus F1 describes Oannes with whole fish body, human head beneath and human feet (the fish-cloaked form); the translators’ table aligns Oannes with U-An, first of the apkallu in the Uruk list. Direct iconographic confirmation that the named apkallu type is the fish-cloaked sage of Assyrian art is absent, and the tablet edition itself unread. Correspondence is therefore contextual rather than fully demonstrated.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record addresses whether any pre-modern source names the Gate of the Sun staff-bearer Viracocha. The founder page asserts the identification is modern, but the ledger contains neither supporting primary silence nor contradictory early naming. The claim cannot be scored beyond unresolved.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      The founder page reports regional clustering of 263 coded flood-story summaries, yet no evidence record extracts or reproduces the pilot’s coded data, distance measure or cluster statistics. Without those, the observational claim remains unevidenced in the ledger.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      Identical gap: the page asserts an uneven distribution of Genesis-associated details alongside widespread generic motifs, but no coded counts, feature list or statistical test enters the evidence records. The claim is therefore unresolved on the supplied ledger.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The founder page states that matching the kinds of objects changed the lineup result in the image pilots. Pilot data were never retrieved and incomplete runs plus cropping are noted. The claim stands only as a weak self-report of a methodological caution.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record supplies inter-judge agreement statistics or raw AI scores from the image pilots. The founder page alludes to strong disagreement and unreliable feature coding, but the ledger contains no measurable confirmation. The claim is unresolved.