  synthesis: >-
    The structural finding of this assessment is that the case's rungs come
    apart in a specific, asymmetric way. The observation rung is genuinely
    and increasingly supported: microtubules measurably move electronic
    excitation beyond what Förster theory predicts (ORCH-C020), exhibit
    collective optical behavior corroborated partly outside the proponent
    lineage (ORCH-C021, ORCH-C013), and anesthetics demonstrably bind tubulin
    and perturb that photophysics (ORCH-C011). These are real measurements,
    not noise. But none of them measures the quantity the featured hypothesis
    requires. No record in this ledger reports a coherence time, an
    entanglement witness, or a collapse event in a physiological microtubule;
    the two quantitative estimates that bracket the question (Tegmark and
    Hagan et al.) disagree by orders of magnitude, and even the proponents'
    own unconditional number falls short of the theory's 25 ms requirement
    (ORCH-E036). The attribution claims (ORCH-C001, ORCH-C002) therefore have
    no direct positive evidence, and where the theory's implications have
    been tested with independence and rigor, results have tended against it:
    the independent Massachusetts General study runs the microtubule-stability
    direction the wrong way (ORCH-C126, contradicted), the xenon isotope
    anomaly is unreplicated and its dataset cannot support the inference
    built on it (ORCH-C025), and three underground experiments plus LISA
    Pathfinder exclude the natural parameter-free versions of the collapse
    physics (ORCH-C031, ORCH-C047, ORCH-C125, ORCH-C046). Against that, the
    conventional account holds target-level causal evidence of a kind the
    microtubule program does not possess anywhere in this record (the β3
    point mutation), while honestly leaving volatiles incompletely covered.
    The correct verdict is unresolved, not because evidence is thin in both
    directions symmetrically, but because the decisive measurements — a
    310 K coherence witness and a direct test of the ℏ/E_G scaling — have
    never been run, and the theory's literature publishes no pass/fail
    threshold against which any future measurement could score (ORCH-E035).
    The honest summary is: the biological half has become experimentally
    interesting; the attribution remains unearned; the strongest tested
    versions of the physics conjunct are excluded; and the sharpest
    discriminating test (the potency series) remains open.
  steelman: >-
    The Meyer–Overton argument: tubulin is the only candidate molecular
    target for which any published model reproduces the Meyer–Overton
    potency correlation (Craddock et al. 2017, restated in Wiest 2025),
    the prediction was made in advance of any confirming potency series,
    and the conventional account itself concedes (Eger et al. 2008) that
    no ligand- or voltage-gated channel, and no combination of channel
    actions, has been shown sufficient for volatile-anesthetic immobility —
    while the β3 causal evidence covers intravenous agents, not the
    volatiles every microtubule experiment uses. The prospective potency
    series against a microtubule optical observable (ORCH-R002/R009) has
    never been run, so a proponent can rightly say the sharpest test of
    their anesthesia arm is still open and that the one target with a
    quantitative potency account is theirs. This assessment does not answer
    that argument; it can only note that the picrotoxin confound makes the
    existing two-agent result uninformative on specificity, and that the
    test remains undone.
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No record in the ledger measures an orchestrated reduction event in
      neuronal microtubules; the claim rests on two conjuncts (ORCH-C010,
      ORCH-C030) that are themselves unmeasured or excluded in their
      parameter-free forms. The Kerskens result, if validated, would not
      implicate microtubules, and Reimers' critique is unread and carries no
      data. The strongest opposing consideration is the accumulation of
      negative results on the physics conjunct, which pressures but does not
      refute the bare ℏ/E_G criterion the claim needs.
  - claimId: ORCH-C002
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Evidence runs in both directions — anesthetics bind tubulin and reduce
      microtubule exciton diffusion, and epothilone B delays LORR with a
      large effect size — but the picrotoxin specificity confound, the
      independent opposite-direction epothilone-D result, and the epothilone
      authors' own peer-review concession that stability was not shown all
      prevent confirmation. The defining element, a quantum-coherent
      microtubule state, has never been measured. The strongest opposing
      consideration is that no quantum variable appears in any behavioral
      experiment in this record.
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      The β3(N265M) point mutation abolishing etomidate and propofol action
      is the cleanest causal evidence in the entire case — change one
      residue, lose the drug effect — exactly the target-specific causal
      evidence the claim asserts for intravenous agents. The strongest
      opposing consideration is scope: Jurd 2007 shows the hypnosis endpoint
      only partially reduced, and the authors' own conclusion concedes
      volatiles act through broader targets, so the claim's reach beyond IV
      agents is limited.
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The universal quantifier is not earned by the cited records: Eger et
      al. 2008 state that no channel or combination suffices for inhaled
      immobility, and the xenon isotope effect is a quantum-adjacent anomaly
      the classical account does not predict, though it is unreplicated and
      not microtubule-specific. The strongest opposing consideration for a
      proponent of the classical claim is that no demonstrated quantum
      contribution to unconsciousness exists either — the claim fails on
      both sides' insufficiency.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Three independent underground nulls and the LISA Pathfinder mechanical
      bound exclude the parameter-free and nucleon-scale implementations,
      and the Gran Sasso experimenters themselves call Orch OR on the
      simplest version highly implausible. The claim as stated, however, is
      the bare ℏ/E_G lifetime criterion, which predicts no radiation and has
      never been directly measured — the McQueen and Diósi points. The
      strongest opposing consideration is that every dynamics so far
      proposed for the criterion is bounded or unspecified, making the
      escape route cost the theory its testability.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: low
    reasoning: >-
      AI systems have now produced verified novel research-level mathematics,
      including an independently checked Erdős disproof, which undermines
      the claim's concrete predictions; the editor's own audit concedes the
      testable examples have mostly settled against Penrose. The Zahavy
      abduction argument and the "escalator not steps" reply keep the
      philosophical claim alive but in a form critics correctly call close
      to unfalsifiable. The strongest opposing consideration to my verdict
      is that no AI result has yet demonstrated framework-generating
      abduction, which is what the claim in its strong form requires.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No measurement at physiological conditions exists; the governing
      numbers are two calculations disagreeing by seven to eight orders of
      magnitude, and the proponents' own unconditional estimate (10⁻⁵–10⁻⁴ s)
      falls short of their 25 ms requirement. The 2026 entanglement-flavored
      modeling reports radiative, not dephasing, lifetimes and no thermal
      bath. The strongest opposing consideration is that Tegmark modeled a
      state Hagan et al. plausibly show is not the one Orch OR proposes, so
      the rung cannot be called refuted either.
  - claimId: ORCH-C011
    verdict: well_supported
    confidence: high
    reasoning: >-
      Emerson et al. 2013 photolabeled β-tubulin from an independent
      anesthesia-mechanisms laboratory with functional consequences in vivo,
      and Kalra et al. 2023 directly measured anesthetic-dependent reduction
      of microtubule exciton diffusion. The claim as stated asks only for
      binding and altered behavior, not anesthesia-specificity, so the
      picrotoxin confound limits other claims but not this one. The
      strongest opposing consideration is the modest effect size and
      uncertain free aqueous concentration in the Kalra assay.
  - claimId: ORCH-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Three live-animal studies — Khan 2024, Huang 2026, and the independent
      Li 2025 — all show that microtubule-modulating drugs change anesthetic
      sensitivity, which is all the claim as worded asserts. The strongest
      opposing consideration is that Linganna 2015 used a hemodynamic
      surrogate rather than dose, and the direction of change is
      inconsistent across studies, which damages the directional claim
      (ORCH-C126) but not the existence of an effect.
  - claimId: ORCH-C126
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The independent, methodologically strongest study (Li 2025) shows the
      brain-penetrant stabilizer epothilone D increasing isoflurane
      sensitivity, with the destabilizer vinblastine moving the same
      direction — no stability-based account predicts that. Emerson's own
      laboratory reports isoflurane promotes polymerization, and the Khan
      authors formally withdrew the stability reading in peer review in
      favor of a binding-pocket explanation. The strongest opposing
      consideration is the acute epothilone-B delay itself plus the marginal
      paclitaxel rightward shift, which give the direction one real and one
      weak supporting data point.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Kalra's structure-dependent diffusion beyond Förster prediction and
      Babcock's partly independent superradiance result together establish
      that microtubules are electronically nontrivial, and the quantum-yield
      trend gained partial cross-lab support. The strongest opposing
      consideration is that the steady-state quantum-yield increase can
      arise from conventional non-collective mechanisms and the microtubule
      observable is metrologically unstable (scattering bounds spanning an
      order of magnitude, sign reversal at 295 nm).
  - claimId: ORCH-C020
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The 6.6 nm diffusion length and the anesthetic reduction are stated in
      the abstract of a peer-reviewed ACS Central Science paper with
      structure-dependence arguing against artifact. The strongest opposing
      consideration is that the specific reduced values come from the
      unverified paper body, the study has no independent replication, and
      it was performed by a collaboration including the theory's own
      authors.
  - claimId: ORCH-C021
    verdict: well_supported
    confidence: low
    reasoning: >-
      Babcock et al. state the superradiance prediction was confirmed by
      their quantum-yield experiments, and a second laboratory found
      polymerization raising quantum yield at 280 nm. The strongest opposing
      consideration is metrological: at tryptophan-selective 295 nm
      excitation the sign of the polymerization effect reverses across
      plausible scattering corrections, and the 280 nm effect spans +6% to
      +47% depending on the analysis branch, so the observable is not yet
      stable.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The result rests on a single laboratory lineage with no independent
      protocol-level replication in over a decade, published in a
      lower-profile venue, and measures a classical electromagnetic
      observable that could not be an entanglement witness even if
      replicated. The strongest opposing consideration in its favor is that
      no one has attempted the replication and failed, so the measurement
      stands unrefuted.
  - claimId: ORCH-C023
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The +69 s rat result is blinded, tolerance-controlled, and large (d =
      1.9), with a cross-species extension in mice at +29 s. The strongest
      opposing consideration is that both studies come from one research
      program, use small male-only cohorts at a single isoflurane
      concentration, and the mouse effect is acknowledged as modest against
      inter-animal variability.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Li 2025 abstract reports full concentration–response curves with
      published confidence intervals showing both epothilone D and
      vinblastine shifting sensitivity leftward, in a randomized and blinded
      design. The strongest opposing consideration is the regimen mismatch
      (chronic vs acute), the compound mismatch (D vs B), and the
      acknowledged vehicle and blood-gas confounds, which limit transfer to
      the acute epothilone-B result.
  - claimId: ORCH-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Li 2018 genuinely reported the isotope potency gap under randomization
      in a flagship journal, and the site's re-analysis found a spin step
      describes the four means far better than any smooth mass trend. But
      the frozen identification rule tripped, the headline values are
      calculated rather than measured on xenon alone, the dispersions are of
      unstated type, and no replication exists after eight years. The
      strongest opposing consideration to the skeptical reading is the
      shape asymmetry across the spin boundary, which a monotone mass
      confound cannot produce.
  - claimId: ORCH-C026
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The claim as worded is a faithful report: the signals were measured,
      changed with conscious awareness, and the experimenters do interpret
      them as witnessing entanglement — a hedged interpretation they
      defended quantitatively against Warren's classical bound. The
      strongest opposing consideration is Warren's standing objection that
      heterogeneous living tissue is exactly where classical
      multi-compartment effects imitate exotic ones, plus the absence of any
      independent replication and the experiment's total silence on
      microtubules.
  - claimId: ORCH-C031
    verdict: established
    confidence: high
    reasoning: >-
      The Gran Sasso result is a dedicated, ultra-low-background measurement
      with the model's co-originator among the authors, and the independent
      Majorana Demonstrator null in the same channel confirms it. The
      strongest opposing consideration is scope precision: it excludes the
      parameter-free stochastic version, not Penrose's radiation-free
      lifetime criterion, and coloured or dissipative extensions remain
      open — but the measurement outcome itself is not in doubt.
  - claimId: ORCH-C041
    verdict: well_supported
    confidence: high
    reasoning: >-
      The Erdős disproof is anchored on an independent mathematician's own
      paper stating and building on the result, AlphaProof's IMO
      performance is Lean-verified and peer-reviewed in Nature, and the 2025
      gold-level run was officially graded by IMO coordinators. The
      strongest opposing consideration is the documented false-positive
      history of AI Erdős claims, which is why the ledger correctly anchors
      on verification rather than announcements — and the verified items
      survive it.
  - claimId: ORCH-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim rests on one modeling paper from a group with no
      independent corroboration, whose free parameters were chosen to
      reproduce a single hypomagnetic-field experiment that reported no
      uncertainty, and which measures no anesthesia endpoint. The strongest
      opposing consideration is that the model does generate testable
      isotope and field predictions no classical account offers.
  - claimId: ORCH-C046
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The bound is stated in the paper's own abstract and the method of
      attributing all residual noise to collapse makes it conservative
      rather than optimistic, so the claim as worded is carried. The
      strongest opposing consideration is that it is a re-derivation from a
      published noise curve rather than a dedicated collapse experiment,
      and applies to the regularized DP model rather than Penrose's own
      formulation.
  - claimId: ORCH-C047
    verdict: well_supported
    confidence: high
    reasoning: >-
      The Majorana Demonstrator's null in 37.5 kg-y of enriched germanium is
      stated in the abstract with the fit result reported, from an
      underground collaboration independent of the Gran Sasso team. The
      strongest opposing consideration is that it constrains only the
      white-noise formulation, whose coloured-noise extensions the authors
      themselves note evade X-ray bounds.
  - claimId: ORCH-C125
    verdict: well_supported
    confidence: high
    reasoning: >-
      The XENONnT result was read in full from the arXiv PDF including
      supplemental material: a 4.9 × 10⁻¹⁰ m lower limit on R0, a factor of
      five beyond the previous best, in a different target element and
      detector technology, making a detector-specific background explanation
      of all three nulls unlikely. The strongest opposing consideration is
      shared theory input (the emission model and several authors overlap
      with the Gran Sasso line) and the Markovian-only scope.
  - claimId: ORCH-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim rests on a single sentence in an opinion piece by the
      epothilone-B laboratory's senior author, whose uniqueness assertion is
      explicitly flagged in the record as asserted rather than demonstrated,
      with no survey cited. The strongest opposing consideration is that the
      underlying Craddock computation is real and the proposition is in
      principle surveyable — nothing currently refutes it, so weak support
      rather than unresolved is the honest grade for a uniqueness claim
      whose only evidence is one interested assertion.
  - claimId: ORCH-C063
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The source preprint directly states that MD-derived structural
      variability substantially reduced maximal superradiant enhancement
      relative to the ordered lattice, which is a clean computational
      finding within that model. The strongest opposing consideration is
      that it is computational, single-group, disorder is sampled rather
      than measured in vivo, and the finding is hostile to the scale-bridging
      use proponents make of superradiance — meaning its low grade reflects
      provenance, not direction.
