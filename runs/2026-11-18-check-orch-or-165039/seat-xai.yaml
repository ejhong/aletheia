  synthesis: >-
    Orch OR is a conjunction, not a single claim: gravitational objective
    reduction (ORCH-C030) must occur; neuronal microtubules must sustain the
    coherent or entangled states the orchestration requires for tens of
    milliseconds (ORCH-C010); those states must constitute conscious moments
    (ORCH-C001); and general anesthetics must produce unconsciousness
    substantially by disrupting them (ORCH-C002). The ledger shows the rungs
    separating cleanly. On the observation and near-mechanism rungs the
    biological half is no longer empty. Microtubules are electronically
    nontrivial under purified conditions: excitation diffuses farther than
    simple Förster accounting predicts and anesthetics shorten that length
    (ORCH-C020), fluorescence quantum yield rises with hierarchical tubulin
    organization in the direction a collective model expects (ORCH-C021), and
    pharmacologic microtubule manipulation changes anesthetic susceptibility
    in live animals (ORCH-C012, ORCH-C023, ORCH-C024). Those results support
    ORCH-C013 and parts of ORCH-C011. None of them is a coherence time, an
    entanglement witness, a collapse event, or a demonstration that the
    optical perturbation is what causes loss of consciousness. The only
    unconditional decoherence estimates in the corpus, including the
    proponents' own revision, remain one to many orders of magnitude short of
    the theory's ~25 ms requirement (ORCH-E007, ORCH-E008, ORCH-E036); no
    physiological measurement closes the gap. On the anesthesia arm the
    classical account already holds target-level causal evidence the
    microtubule arm lacks: a single GABA_A β3 point mutation abolishes or
    profoundly reduces intravenous anesthetic action in vivo (ORCH-C003,
    ORCH-E015). Volatiles are acknowledged to act more broadly, leaving a
    door open, but the strong Orch OR anesthesia claim still has no quantum
    variable and faces a same-direction stabilizer/destabilizer pattern plus
    an author-level concession that the acute epothilone-B delay need not
    reflect stability at all (ORCH-C126, ORCH-E013, ORCH-E129). The natural
    parameter-free Diósi–Penrose completion is excluded by dedicated
    underground radiation searches and tightened by an independent germanium
    null and by XENONnT (ORCH-C031, ORCH-C047, ORCH-C125); LISA Pathfinder
    further bounds the mechanical channel (ORCH-C046). Penrose's bare
    τ ≈ ℏ/E_G lifetime criterion is not the model those experiments tested
    and remains unmeasured, which is why ORCH-C030 stays unresolved rather
    than refuted—and why the escape costs testability. The non-computability
    motivation is pressured by verified research-level AI mathematics
    (ORCH-C041) without being formally closed. Because the two load-bearing
    conjuncts required by the headline thesis—millisecond-scale MT coherence
    and a working gravitational OR linked to conscious moments—are both
    unestablished, the featured hypothesis as a whole is unresolved. Positive
    observation-rung results do not license the attribution rung; excluding
    one stochastic collapse model does not establish another; and classical
    receptor evidence for intravenous agents is stronger than any microtubule
    causal chain presently on offer. The verdict is not a safe default: it is
    the structural consequence of missing measurements on the quantities the
    theory itself needs.
  steelman: >-
    Xenon isotopes with nuclear spin are markedly less potent anesthetics than
    spin-zero isotopes at identical calculated polarizability (ORCH-C025 /
    Li et al. 2018), a difference no standard lipid-solubility or classical
    polarizability account predicts, and still unreplicated and without an
    identified molecular substrate; a proponent can rightly treat that
    anomaly, together with the still-untested prediction that a microtubule
    optical observable should track Meyer–Overton potency across a controlled
    anesthetic panel, as an open quantum-relevant fact the classical multi-
    target story has not absorbed.
  sensitivity:
    recordId: ORCH-E017
    reason: >-
      Donadi et al. 2021 is the highest-quality physics result that converts
      the natural parameter-free Diósi–Penrose completion from open to
      excluded and anchors the subsequent Majorana and XENONnT tightenings;
      removing it would reopen the most concrete collapse dynamics and soften
      the pressure on ORCH-C030 and the physics half of ORCH-C001.
    survivesWithout: true
claimAssessments:
  - claimId: ORCH-C001
    verdict: unresolved
    confidence: high
    reasoning: >-
      The claim is the full attribution conjunction and inherits the status of
      its load-bearing dependencies: ORCH-C010 has no measured physiological
      coherence or entanglement at the required duration and extent, and
      ORCH-C030 remains an untested lifetime criterion after the natural
      stochastic completion was excluded. No evidence record reports a
      collapse event in neurons or links one to a conscious moment. Strongest
      opposing consideration is that several MT photophysics and anesthesia-
      adjacent results are real; they still do not establish the orchestrated-
      OR mechanism as stated.
  - claimId: ORCH-C002
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Anesthetics can bind tubulin and alter MT optical behavior, and MT drugs
      change anesthetic susceptibility, but the claim requires a quantum-
      coherent MT state that is itself required for consciousness and is the
      substantial route to unconsciousness. No coherence variable was measured
      in any anesthesia experiment here, picrotoxin affected the flagship
      optical assay comparably, animal stabilizer results do not cohere into a
      single directional rule, and intravenous agents have strong GABA_A
      causal evidence. Strongest opposing consideration is the still-open
      volatile-agent target spectrum and the xenon spin anomaly.
  - claimId: ORCH-C003
    verdict: well_supported
    confidence: high
    reasoning: >-
      Jurd et al. 2003 supplies target-level causal evidence: the β3(N265M)
      point mutation abolishes immobilizing action of etomidate and propofol
      and profoundly reduces hypnosis, with the authors themselves limiting
      the cleanest claim to intravenous agents and noting broader targets for
      volatiles. Endpoint separation in the same line sharpens rather than
      erases the result. Strongest opposing consideration is that volatiles
      and immobility-from-inhaled-agents are not fully reduced to the same
      single-channel picture (Eger 2008), so "substantially accounted for"
      should not be read as exhaustive for every agent and endpoint.
  - claimId: ORCH-C004
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The universal quantifier ("fully" and "without any quantum-coherent
      contribution") is not established by the classical successes. Eger et
      al. 2008 report that no known channel or combination suffices for
      inhaled-agent immobility; the xenon nuclear-spin potency difference has
      no classical polarizability explanation on the public record; residual
      hypnotic effect remains after the β3 mutation. Strongest opposing
      consideration is the strength of the intravenous receptor evidence,
      which supports a large classical share without licensing the exhaustive
      claim.
  - claimId: ORCH-C030
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      The claim states Penrose's gravitational self-energy lifetime criterion.
      Dedicated underground searches and related bounds exclude the natural
      parameter-free stochastic Diósi–Penrose completion and constrain
      regularization scales, but those experiments test dynamical models that
      predict radiation or momentum diffusion, not the bare τ ≈ ℏ/E_G relation
      itself. McQueen's distinction is accepted on the ledger: the criterion
      survives by not being the tested model, which leaves it untested rather
      than confirmed. Strongest opposing consideration is the accumulating
      squeeze on every concrete dynamics so far proposed.
  - claimId: ORCH-C040
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim is interpretive and Gödelian rather than a direct experimental
      proposition. Verified AI research-level mathematics and IMO-level
      performance pressure the historical motivation and age several of
      Penrose's concrete examples, while a DeepMind-linked position paper
      relocates the residual gap to abduction rather than deduction. None of
      that constitutes a formal refutation of the non-algorithmic-understanding
      thesis as stated. Strongest opposing consideration is the escalating
      record of formerly human-only mathematical performance inside existing
      frameworks.
  - claimId: ORCH-C010
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record measures a coherence time, coherence length, or
      entanglement witness in microtubules under physiological temperature and
      ionic conditions at the tens-of-milliseconds scale the claim requires.
      Tegmark's and Hagan et al.'s calculations disagree by orders of magnitude
      and address different modeled states; even the proponents' unconditional
      revision remains short of the theory's own exemplar, and 2026 radiative-
      lifetime modeling is not dephasing. Collective optical results support
      nontrivial photophysics without supplying the duration. Strongest
      opposing consideration is that ordered biological environments might
      still differ from the calculated baths once measured.
  - claimId: ORCH-C011
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Emerson et al. identify β-tubulin as a direct binding target of a
      research anesthetic with functional consequences, and Kalra et al. show
      clinical agents reducing exciton diffusion in polymerized microtubules.
      Computational work predicts terahertz-mode correlations with potency but
      is not a measurement. Specificity is incomplete: picrotoxin produced a
      comparable optical effect in the same study, and free aqueous
      concentration was not established. Strongest opposing consideration is
      that binding plus optical perturbation is not yet shown to be anesthesia-
      specific rather than general hydrophobic perturbation.
  - claimId: ORCH-C012
    verdict: well_supported
    confidence: high
    reasoning: >-
      Multiple live-animal studies show that microtubule-modulating drugs
      change anesthetic susceptibility: acute epothilone B delays isoflurane
      LORR in rats and mice, and chronic epothilone D and vinblastine shift
      LORR concentration–response curves in mice. The claim as worded asserts
      change, not a unique direction or a quantum mechanism. Strongest
      opposing consideration is regimen and compound heterogeneity plus
      uncontrolled effects on transport, metabolism, and physiology.
  - claimId: ORCH-C126
    verdict: contradicted
    confidence: high
    reasoning: >-
      The claim requires that direction track stability with stabilizers
      producing resistance. Li et al. 2025 find chronic epothilone D
      (stabilizer) and vinblastine (destabilizer) both increase isoflurane
      sensitivity; paclitaxel's resistance shift is only marginal; Emerson et
      al. report clinical anesthetics themselves promoting polymerization; and
      the Khan et al. authors, in peer review, drop the destabilization
      reading and accept a binding-pocket alternative. Strongest opposing
      consideration is the acute epothilone-B resistance-direction results,
      which do not restore a general stability rule once the contradictory
      independent dataset and author concession are weighed.
  - claimId: ORCH-C013
    verdict: well_supported
    confidence: high
    reasoning: >-
      Kalra et al. report excitation diffusion beyond accepted Förster
      accounting with polymerization dependence; Babcock et al. predict and
      measure quantum-yield enhancement consistent with collective tryptophan
      states; related work finds structure-dependent delayed luminescence and
      partial cross-lab polymerization QY trends. These are not passive-
      scaffolding predictions. Strongest opposing consideration is that
      several observables admit conventional photophysical readings, many
      preparations are purified in vitro, and resonance claims remain
      unreplicated single-lab results.
  - claimId: ORCH-C020
    verdict: well_supported
    confidence: high
    reasoning: >-
      Kalra et al. 2023 state the 6.6 nm diffusion length from quencher-
      dependent tryptophan lifetime analysis and state that etomidate and
      isoflurane reduce exciton diffusion; the abstract-level claims match the
      claim wording. Inference is indirect (not spatially imaged), the
      preparation is purified microtubules, and independent replication is not
      on the ledger. Strongest opposing consideration is the picrotoxin
      comparison and uncertain free concentration, which affect interpretation
      more than the bare measurement claim.
  - claimId: ORCH-C021
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Babcock et al. 2024 predict strongly superradiant collective states and
      report experimental fluorescence quantum-yield enhancement with
      hierarchical organization; Gassab & Craddock supply partial cross-lab
      polymerization QY increase at 280 nm. Metrology is not closed: scattering
      corrections swing effect size by nearly an order of magnitude and at
      295 nm the sign reverses across treatments, so the observable is not yet
      stable enough for strong claims. Strongest opposing consideration is
      model-dependence of the collective interpretation and conventional
      alternative routes to QY change.
  - claimId: ORCH-C022
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Saxena et al. 2020 report self-similar triplet-of-triplet resonance
      patterns across tubulin, microtubule, and axon initial segment, which is
      the measurement the claim restates. The observable is classical
      electromagnetic resonance, the venue and apparatus are specialized, and
      no independent protocol-level replication appears on the ledger after
      years. Strongest opposing consideration is that even a clean replication
      would not become an entanglement or OR witness without additional
      structure.
  - claimId: ORCH-C023
    verdict: well_supported
    confidence: high
    reasoning: >-
      Khan et al. 2024 report a 69 s delay in isoflurane LORR in rats after
      acute epothilone B with Cohen's d = 1.9 and a tolerance control; Huang
      et al. 2026 report a 29 s delay in mice with d = 0.8. The measurement
      claims match. Limits include small N, single high concentration rather
      than full curves, shared program across the two studies, and no quantum
      variable. Strongest opposing consideration is alternative physiological
      routes by which a microtubule drug could alter LORR latency.
  - claimId: ORCH-C024
    verdict: well_supported
    confidence: high
    reasoning: >-
      Li et al. 2025 report leftward (more sensitive) LORR EC50 shifts for both
      chronic epothilone D and vinblastine versus saline, with published
      confidence intervals, in a randomized blinded mouse study using full
      concentration–response curves. The claim restates those results.
      Strongest opposing consideration is chronic-dosing confounds (remodeling,
      pH/CO₂ changes) and imperfect vehicle control for poorly soluble agents.
  - claimId: ORCH-C025
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      Li et al. 2018 report large ED50 differences between spin-bearing and
      spin-zero xenon isotopes at identical calculated polarizability. Study
      re-analysis finds a spin step describes the four means better than a
      linear mass trend descriptively, but the frozen identification rule
      trips, headline xenon-alone values are calculated from an isoflurane
      background, dispersions are of unstated type, and no replication exists
      after years of citation. Strongest opposing consideration is that the
      dataset cannot presently support a clean two-covariate inferential
      separation of spin from mass.
  - claimId: ORCH-C026
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Kerskens & López Pérez report consciousness-related zero-quantum-
      coherence MRI signals they interpret as possible entanglement; Warren
      argues the data provide no entanglement evidence and reflect known
      multicompartment complexity; the authors reply with quantitative bounds
      against a specific classical iZQC mechanism. No independent replication
      or phantom ground-truth validation is on the ledger, and microtubules
      are not implicated. Strongest opposing consideration is that a surviving
      non-classical brain signal would still leave the Orch OR microtubule
      claims untouched.
  - claimId: ORCH-C031
    verdict: established
    confidence: high
    reasoning: >-
      Donadi et al. 2021 report a dedicated Gran Sasso underground null for
      the spontaneous radiation predicted by gravity-related dynamical
      collapse, tightening the mass-density bound by about three orders of
      magnitude and ruling out the natural parameter-free Diósi–Penrose model
      in the authors' own words. Majorana Demonstrator independently adds
      weight in the same radiation channel. Strongest opposing consideration
      is scope: non-Markovian or coloured-noise variants and Penrose's non-
      radiative lifetime criterion are not closed by this result.
  - claimId: ORCH-C041
    verdict: established
    confidence: high
    reasoning: >-
      Sawin 2026 independently states and improves an OpenAI-team disproof of
      a 1946 Erdős unit-distance conjecture; Hubert et al. 2025 report Lean-
      verified AlphaProof silver-medal-equivalent IMO performance in Nature;
      DeepMind reports officially graded IMO gold-standard performance in
      natural language. These are correct, novel or competition-level
      mathematical results by AI systems as claimed. Strongest opposing
      consideration is conceptual: competition problems and framework-internal
      research advances are exactly the category Penrose-side responses say
      were never the decisive test of non-computable understanding.
  - claimId: ORCH-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Zadeh-Haghighi & Simon insert radical-pair magnetic and hyperfine
      effects into a kinetic model of tubulin polymerization and report that
      the model reproduces prior hypomagnetic-field experimental findings
      fairly well. This is modeling with parameters chosen to fit, not a new
      controlled isotope or field experiment on polymerization, and no
      anesthesia endpoint is measured. Strongest opposing consideration is
      that a fitted kinetic model can accommodate data without establishing
      that spin chemistry is the operative biological mechanism.
  - claimId: ORCH-C046
    verdict: well_supported
    confidence: high
    reasoning: >-
      Helou et al. attribute LISA Pathfinder's residual relative acceleration
      noise to collapse-induced force noise and bound the Diósi–Penrose
      regularization length to at least 40.1 ± 0.5 fm, larger than any
      nucleus, ruling out a fundamental-particle-sized cutoff under that
      attribution. The bound is conservative if non-collapse noise dominates.
      Strongest opposing consideration is that the analysis re-derives from a
      published noise curve rather than a dedicated collapse experiment and
      applies to a regularized point-mass cutoff treatment.
  - claimId: ORCH-C047
    verdict: established
    confidence: high
    reasoning: >-
      The Majorana Demonstrator reports no evidence of the predicted 1/E
      spontaneous-collapse radiation signature in 19–100 keV over 37.5 kg-y
      enriched exposure, with a best-fit signal consistent with zero. This is
      a direct measurement claim matching the wording. Strongest opposing
      consideration is that coloured-noise extensions can evade X-ray bounds,
      as the authors note.
  - claimId: ORCH-C125
    verdict: established
    confidence: high
    reasoning: >-
      Aprile et al. (XENON Collaboration) 2026 report no collapse-induced
      X-ray excess in XENONnT electronic-recoil data and set a lower bound on
      the Markovian Diósi–Penrose correlation length R0 of 4.9 × 10⁻¹⁰ m at
      90% confidence, about five times the prior best limit. A different
      target element and detector technology reduces the chance of a shared
      detector artifact. Strongest opposing consideration is restriction to
      Markovian white-noise formulations and shared theory input with prior
      germanium analyses.
  - claimId: ORCH-C057
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is an existence/uniqueness assertion drawn from Wiest's
      commentary summarizing Craddock et al. 2017 computational docking and
      quantum-chemistry work on tubulin. That modeling can reproduce a Meyer–
      Overton-like correlation under an assumed microtubule primary target is
      already on the ledger as weak computational support; no systematic
      survey demonstrating that no other candidate target has any published
      model is provided. Strongest opposing consideration is that uniqueness
      claims require a negative literature search, not a single modeling
      paper's success.
  - claimId: ORCH-C063
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Gassab & Craddock report that molecular-dynamics-derived structural
      variability substantially reduces maximal superradiant enhancement
      relative to an ordered 1JFF reference lattice while quantum yields can
      remain elevated. The claim restates that computational observation.
      Strongest opposing consideration is that the result is preprint
      modeling of sampled disorder rather than an in-vivo measurement, so the
      magnitude of suppression under physiological conditions remains open.