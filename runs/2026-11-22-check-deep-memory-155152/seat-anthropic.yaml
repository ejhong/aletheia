caseAssessment:
  verdict: weakly_supported
  loadBearing: [DEEP-C018, DEEP-C093, DEEP-C059, DEEP-C012, DEEP-C072, DEEP-C026, DEEP-C027]
  weakestLinks: [DEEP-C027, DEEP-C057, DEEP-C053, DEEP-C031, DEEP-C037]
  synthesis: >-
    I read the featured hypothesis as follows. A material share of the
    resemblances the case gathers (bird-men, handled objects, navel names,
    civilisers, floods) records a shared past, through a common source or
    long-distance contact, rather than independent invention, material
    constraint or later retelling. On this ledger the hypothesis is weakly
    supported, and the reason is structural. Where the loop has reached primary
    or peer-reviewed text, it has mostly confirmed that an image or name is real
    in its own place. In the same step it has removed that item's value as
    evidence of connection. The paired instances turn out to differ in date,
    language, function or context. No record documents an intermediate, a
    route, or a co-occurrence above baseline. The only records that point toward
    connection are the founder's own unaudited experiment reports.

    The navel leg is the best documented. The four names differ in language,
    date of first record and builder use (DEEP-C018):

    Delphi's 'navel' is Greek. It appears in Pindar's ode of 462 BCE, and
    Pausanias attributes it to the Delphians themselves (DEEP-E089, DEEP-E090).

    Cusco's 'navel' gloss is first found, in this ledger, in Garcilaso's book of
    1609 (DEEP-E087).

    The meaning of Te Pito o te Henua, and whether it was the island's name, were
    disputed in the early record. Churchill read it as 'the end of the land' and
    treated its use as the island's name as a product of contact (DEEP-C093,
    DEEP-E096, DEEP-E097).

    Göbekli Tepe is a modern Turkish description, 'potbelly hill', of a mound
    whose builders could not have spoken Turkish (DEEP-C015, DEEP-E099).

    The founder page's own renderings, 'navel hill' and 'navel of the world', are
    closer to the Greek omphalos than the documented glosses they replace. This
    is an instance of the convergence through retelling that the case lists among
    its alternatives (DEEP-C034). What survives is two genuine pre-modern 'navel'
    centres, Delphi and Cusco, with nothing documented between them.

    The bird-man leg is weaker still. The Hoa Hakananai'a reliefs were added
    after the statue was made. They are read against the island's birdman myth
    as recorded in the nineteenth and twentieth centuries (DEEP-C059,
    DEEP-E071). No record treats the Nimrud or Göbekli figures. The author's own
    baseline, if it reproduces, puts a broad bird-person class in 55% of sampled
    traditions (DEEP-C005). At that rate, two bird-headed figures in two places
    signal very little.

    In the handled objects, shape and function come apart (DEEP-C065). The set
    contains a ritual water bucket (DEEP-C044, weakly evidenced) and one chlorite
    bag whose wear its analysts cautiously read as suspension on a cord
    (DEEP-C009). It also contains three Pillar 43 forms whose meaning the
    excavators decline to decide and for which they have offered a building
    reading (DEEP-C012).

    On continuity, the excavators say there are too many missing links to
    establish survival of the imagery (DEEP-C072). A distribution of broad
    classes cannot by itself separate invention from very old transmission
    (DEEP-C026).

    The steelman for the hypothesis has four parts. First, its ancient
    attestations are real, not modern projections: Pindar's navel of the earth,
    and Berossus's sea-born teacher of writing, cities, temples, law and
    agriculture (DEEP-E046). Second, at Delphi, birds and a navel-stone were
    already joined on one object by Strabo's day (DEEP-E093). That is exactly a
    pairing of the motif classes the catalogue tests. Third, the one controlled
    measurement, the V1 lineup (DEEP-C027), points to partner-specific
    similarity. Fourth, DEEP-C026 cuts both ways: if distributions cannot show
    deep transmission, they cannot exclude it either, and missing links do not
    prove that no links existed.

    The steelman against also explains why I stop short of 'contradicted'. The
    dissolutions are many and independent of one another. But they show that
    particular pairings lack evidential value, not that the motifs arose
    separately. The founder's experiments that bear most directly against the
    hypothesis have no evidence records and are unresolved here:

    the motif bundle that does not stand out (DEEP-C057);

    the flood clustering (DEEP-C031, DEEP-C054);

    the AI judges' disagreement (DEEP-C037).

    A verdict of 'contradicted' would require those to be audited.

    Sensitivity: the single record whose removal would most change the verdict
    is DEEP-E020, with its companion half DEEP-E021. It is the only record that
    measures resemblance against a control in the hypothesis's favour. Without
    it the verdict survives, but thinly. It would rest only on the existence of
    ancient parallels that are compatible with transmission without being
    diagnostic of it, and it would sit at the edge of 'unresolved'. No single
    record carries the lean against. That lean is spread across separate source
    histories (Delphi, Cusco, Rapa Nui, Göbekli Tepe, Hoa Hakananai'a, Pillar 43),
    so no one removal reverses it.

    Disclosures. SRC-JHONG-2026, the source of every experiment record, is
    marked unverified in its source record, although its notes describe a text
    that was read. I have treated its records as weak self-reports at most. No
    verdict above weakly_supported rests on its statements of fact. Where a
    judgement leans on priors rather than records, the claim reasoning flags it.
    The main priors here are two. One is that calling a centre a 'navel' is a
    bodily metaphor that unrelated peoples can coin independently. The other is
    that Turkish reached Anatolia long after Göbekli Tepe (as DEEP-E099
    discloses). I have not used the background improbability of prehistoric
    transoceanic contact to lower any verdict.
  steelman: >-
    The one controlled measurement in the case points toward connection, and
    this assessment does not answer it. In the founder's V1 lineup, the claimed
    partner civiliser figures were ranked first in 62.5% of completed lineups,
    against 9% for random pairs (DEEP-E020, DEEP-E021). So the resemblance is not
    merely generic: pairs drawn at random were rarely preferred. I have
    discounted the result as an unaudited self-report and named compressed
    modern retellings as a possible source of the gap. But no record shows that
    retelling produced it. The experiment that would decide the matter has not
    been run (DEEP-R003): a blind rerun with human raters, using source-level
    passages and random hero narratives as controls. The passages would be
    Berossus via Polyhistor for Oannes, Sarmiento or Betanzos for Viracocha,
    Sahagún for Quetzalcoatl, and Simón for Bochica. Nor is the template a
    modern construct. Berossus's fragment already has a being from the sea who
    taught writing, mathematics, the building of cities and temples, law, the
    division of land and agriculture (DEEP-E046). If the partner-specific gap
    survives on the original passages, modern retelling cannot explain it. The
    civiliser figures would then carry a measured, partner-specific resemblance
    that nothing in this ledger accounts for.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No evidence record is linked to this methodological principle, so the
      verdict rests on its logic and on the ledger's worked cases rather than on
      a test. The cases bear it out. The Hoa Hakananai'a birdmen change
      significance once the reliefs are shown to postdate the statue and to
      narrate a myth recorded in the nineteenth and twentieth centuries
      (DEEP-E068, DEEP-E069, DEEP-E071). The Göbekli 'navel' falls away once the
      name is shown to be a modern Turkish description (DEEP-E098, DEEP-E099).
      Strongest opposing consideration: the truth condition is a universal
      negative. Highly specific, arbitrary shared features (the shared-error
      logic of textual criticism and phylogenetics) can make a connection
      probable before dates or contexts are known; the claim survives only
      because 'differences' and specificity are among the data it lists.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No record supports this claim. The only linked records (DEEP-E018,
      DEEP-E019) are the author's caveats about coverage, and the null result
      appears in the ledger only as the claim's source anchor, which is not
      evidence. The method, the 'documentation-preserving comparisons' and the
      coded data have not been retrieved, so the result cannot be checked.
      Strongest opposing consideration: an author whose project would have
      gained from a positive result is unlikely to misstate a null, and this is
      the most direct co-occurrence test in the case. Even if it reproduced, it
      would be a weak null: DEEP-E018 places the catalogue's thinnest coverage
      in the ancient Near East and Rapa Nui, where several compared images sit.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is the founder page's statement of its own result
      (DEEP-E020, DEEP-E021), from a source still marked unverified. Run data,
      lineup construction and the number of incomplete runs are not reported, so
      the truth condition (that run data reproduce 62.5% and 9%) is untested.
      The denominator is also unknown: 62.5% reduces to 5/8, so a very small run
      is not excluded. Strongest opposing consideration: authors rarely misstate
      their own headline figures, so the numbers are probably what the page
      says. What is weak is their reproducibility and their inputs, which the
      research agenda, citing the page's own limitation, describes as
      compressed modern retellings (DEEP-R003). Locally the claim concerns only
      the rates, not what they imply about shared origin.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No record is linked to this claim, but the ledger documents the mechanism
      in glosses and captions. Te Pito o te Henua was rendered 'navel and uterus'
      by Thomson, 'le nombril de la terre' by Roussel and 'the end of the land'
      by Churchill, who held that recorders were misled by a secondary sense of
      pito (DEEP-E095, DEEP-E096). 'Navel hill' loosens the documented 'potbelly
      hill' (DEEP-E098), and a modern caption turns Strabo's 'fabricated' eagles
      myth into what the stone marked (DEEP-E092); in each case the later
      rendering sits closer to the comparison being drawn. The verdict also
      leans on general folkloristic background, not ledger records. Strongest
      opposing consideration: these are names and captions, not narrative
      retellings, and Churchill is one contested authority. The civiliser and
      flood stories (including Oannes's nightly return, DEEP-C083, which has no
      evidence record) stay untested until DEEP-R003 is run.
  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      The claim is logical rather than empirical. Resemblance between motifs is
      at most evidence that traditions are connected; it carries no information
      about an otherwise unknown source's identity, date or capabilities, which
      many different connecting histories would fit equally well. The ledger
      shows the gap concretely. The excavators of the oldest site in the
      comparison cannot establish survival of its imagery for want of dated
      intermediates (DEEP-E061, DEEP-E062), and the one ancient civiliser text in
      hand survives only through later excerptors (DEEP-E043). Strongest
      opposing consideration: a proponent can say the shared content itself
      (teachers who bring writing, cities, temples and law, DEEP-E046) describes
      a capable source. But that is testimony needing dating and corroboration,
      which is exactly the evidence beyond resemblance the claim requires.
  - claimId: DEEP-C026
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No record tests this directly; the verdict rests on the logic of
      identifiability, disclosed here as background. Broad, cognitively salient
      classes such as birds and serpents are expected to arise repeatedly, while
      transmission old enough allows any later pattern of loss and innovation,
      so both histories can produce the same presence map. The ledger
      illustrates the local case: the excavators decline to establish survival
      of Göbekli imagery for lack of dated intermediates (DEEP-E061, DEEP-E062),
      and the author confines the catalogue result to "that selected category
      and dataset" (DEEP-E017). Strongest opposing consideration: distributions
      are not inert. Contiguity, clines and correlation with population history
      can shift likelihoods under explicitly stated models, and the claim's
      condition ('under stated models') is met here by argument, not by any
      model in the ledger.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No supporting record is linked; the linked records (DEEP-E018, DEEP-E019)
      only qualify coverage and scope. The author's self-reported 55% for
      bird-person motifs (DEEP-E013) and 37% for cosmic serpents (DEEP-E016),
      attached to sibling claims, would make two of the three classes widespread
      if they reproduce. No record gives any frequency for sacred centres, so
      the third part of the claim rests on the page's assertion alone. Strongest
      opposing consideration: if the self-reports hold, 'widespread' is plainly
      met for birds and serpents, and a broad sacred-centre class is likely to
      be common a priori. The gap is therefore evidentiary rather than
      substantive.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The claim is supported only by the founder page's statement of its own
      result (DEEP-E013, DEEP-E014), unaudited and from a source still marked
      unverified. The catalogue and the coding have not been retrieved, so the
      truth condition (that the coded data reproduce 55% of 926 traditions) is
      untested. DEEP-E015, DEEP-E018 and DEEP-E019 scope the figure rather than
      test it, and DEEP-E018 records uneven coverage for the ancient Near East
      and Rapa Nui. Strongest opposing consideration: a simple proportion from a
      published catalogue is usually reported accurately and is cheap to check,
      so the claim is probably true. The verdict records only that nobody has
      checked it.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is the author's report (DEEP-E016), and the record does
      not state its denominator; the 926 attached to the bird-person result is
      not said to apply here. DEEP-E017 confines the result to "that selected
      category and dataset". DEEP-E018 and DEEP-E019 add uneven coverage and the
      gap between broad categories and the specific images compared. Strongest
      opposing consideration: an author's own proportion from a published
      catalogue is likely accurate and readily verifiable. The low verdict
      reflects the absence of any check, not a reason to doubt the number.
  - claimId: DEEP-C004
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The conceptual half holds on inspection: a deity with a bird's head, a
      person wearing feathers and a person becoming a bird are different ideas
      under one label. The truth condition, though, asks whether the compared
      images actually fall into different categories, and no record classifies
      them. The only bird-man evidence (DEEP-E071, DEEP-E072) ties the Hoa
      Hakananai'a reliefs to the island's own recorded birdman myth, weakly
      consistent with a human ritual figure, and nothing treats the Nimrud or
      Göbekli figures. Background knowledge (Assyrian bird-headed protective
      beings; the Rapa Nui birdman as a human title-holder) points the same way
      but is not ledger evidence. Strongest opposing consideration: ritual
      practice often fuses the categories, since a costumed performer may be
      held to become the being, so the three-way split may be an outsider's
      partition.
  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      Pitts and colleagues' peer-reviewed study states the relative sequence
      directly. The komari "were subsequently added" to the statue after its
      making (DEEP-E068), and the bas-reliefs narrating the birdman myth
      succeeded the komari (DEEP-E069); the claim restates that order.
      Confidence is held at moderate because only the abstract was read, the
      reasoning for the sequence sits in the paywalled body, and no absolute
      dates are given (DEEP-E073, DEEP-E074). Strongest opposing consideration:
      a relative sequence read from surface relationships says nothing about
      the interval, so 'later' could mean generations or a later stage of one
      working life. Locally the claim concerns order only; its bearing on the
      comparison is a separate inference.
  - claimId: DEEP-C065
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      No record is linked, but the ledger shows the two questions answered by
      different kinds of evidence. Shape comes from description: Schmidt's
      "box-like objects with handle-like attachments" (DEEP-E025). Function comes
      from ritual text for the banduddû (DEEP-E055, DEEP-E086) and from wear
      traces for the Jiroft bag (DEEP-E035, DEEP-E038). The Pillar 43 forms have
      a described shape, no decided function and a building reading on the
      table (DEEP-E028): one outline read as bag, bucket or building is the
      claim in miniature. Strongest opposing consideration: shape is not
      independent of function, since handles, openings and proportions constrain
      use. The questions are distinct but linked, and 'separate' slightly
      overstates their independence.
  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The one record on point (DEEP-E055) is a personal-blog transcription
      attributed to Wiggermann 1992, p. 66. It says that in rituals the
      banduddû "was filled with water", and that an incantation has the
      exorcist take the bucket, bring water and sprinkle it over the patient.
      DEEP-E086, linked to the sibling claim, adds that the term denotes the
      bucket held by relief figures. This fits the bucket and its purificatory
      use, but only through an unchecked transcription with garbled
      transliterations, and the cone (the 'purifier' half) has no record at
      all. Strongest opposing consideration: background knowledge of the ritual
      texts points the same way, so the printed page would probably raise the
      bucket half quickly. The verdict reflects the text's chain of custody and
      the missing cone.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The excavation team's own post says "A final decision on the meaning of
      these images" is not possible at present (DEEP-E028). The excavator's
      first description gives shapes, "box-like objects with handle-like
      attachments", without a function (DEEP-E025). Together they meet the truth
      condition as far as the team's literature has been read. Strongest
      opposing consideration: the condition is a universal negative over the
      team's publications, and the fuller statements are unread (Schmidt 2012,
      Becker et al. 2012 and the 2017 response to Sweatman and Tsikritsis,
      DEEP-R005). Nothing after 2017 has been checked, and the same post already
      offers a building reading, so the uncertainty may since have hardened into
      a commitment. That building reading also shows that even 'handled' is an
      interpretation.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The truth condition is that the published wear-trace study reports handle
      wear of this kind, and it is met at abstract level. Vidale and Micheli
      report wear "clearly visible on the handle and along its contour"
      (DEEP-E034) and read it as suspension "for a long time on a cord"
      (DEEP-E035); the claim's hedged 'consistent with' matches that reading.
      The verdict stays provisional because only the abstract was read, and
      because its object, in the National Archaeological Museum, Tehran, is not
      confirmed to be the one on the founder's page. Strongest opposing
      consideration: the authors say the inference rests on a single object and
      is far from being granted (DEEP-E038). That limits what the wear shows,
      though not the modest 'consistent with', and it gives no warrant to extend
      the reading to other chlorite bags or Pillar 43.
  - claimId: DEEP-C072
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The truth condition asks only for a team member's published statement,
      and DEEP-E061 quotes one exactly. Oliver Dietrich, an excavation team
      member replying on the project blog, writes that there are "far to many
      'missing links' to be sure" about survival of Early Neolithic imagery into
      later periods. He adds that changes of meaning cannot yet be assessed
      (DEEP-E062). Strongest opposing consideration: this is one member's
      informal 2016 comment, so 'the team regards' generalises. Its stance is
      also agnostic rather than negative: it allows possible continuity, and the
      research agenda records the team naming Neolithic stamp seals as a
      candidate intermediate (DEEP-R004). A proponent can fairly read it as a
      door left open.
  - claimId: DEEP-C018
    verdict: established
    confidence: high
    reasoning: >-
      Read from primary texts in translation, the four source histories differ
      on all three points. Delphi's 'navel' is Greek, found in Pindar's ode of
      462 BCE and attributed by Pausanias to the Delphians (DEEP-E089 to
      DEEP-E091). Cusco is the Incas' own city name, but its 'navel' gloss is
      first found in Garcilaso's book of 1609, assigned to the Inca lineage's
      language (DEEP-E087, DEEP-E088). Te Pito o te Henua is Rapanui, recorded
      by Europeans in the later nineteenth century, with its status as the
      island's name disputed; Göbekli Tepe is a Turkish descriptive name for a
      Pre-Pottery Neolithic mound (DEEP-E094, DEEP-E097 to DEEP-E099).
      Strongest opposing consideration: 'first record' means earliest found in
      one pass, and Turkish's late arrival is a disclosed prior. Thomson's
      Hotu Matua tradition (DEEP-E094) would make the Rapanui name builder-used;
      none of this removes the differences.
  - claimId: DEEP-C093
    verdict: established
    confidence: high
    reasoning: >-
      The early record disagrees on both points the claim names. On meaning,
      Thomson gives 'navel and uterus', Roussel (as Churchill reports) 'le
      nombril de la terre', and Churchill 'the end of the land'. Churchill also
      states that the first two "disagree upon its interpretation" (DEEP-E094 to
      DEEP-E096). On what it named, Thomson reports a tradition that Hotu Matua
      gave the name to the island. Churchill rejects that antiquity, records an
      islander placing the name at the three headlands, and concludes it was
      not the island's name save through contact (DEEP-E096, DEEP-E097).
      Strongest opposing consideration: Roussel is read only through Churchill,
      the islander is one informant, and later dictionaries are unread
      (DEEP-R006), so which reading is right stays open. But the claim is only
      that the record disagrees.
  - claimId: DEEP-C015
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The UNESCO-collection site presentation says Göbekli Tepe "translates into
      English as 'potbelly hill', a name which describes its physical
      appearance" (DEEP-E098). That is the documentation of a form-descriptive
      name the truth condition asks for, and the ordinary sense of the Turkish
      adjective (a disclosed prior) agrees. Two qualifications apply: the
      documented gloss is 'potbelly', of which the claim's 'navel hill' is a
      looser rendering, and the page is unsigned and gives no first-record date.
      Strongest opposing consideration: the hill does carry local sacred
      meaning. A wishing tree on the ridge is still visited (DEEP-E100), and the
      founder's page reports Kurdish names meaning 'wish hill' (DEEP-E024). The
      descriptive Turkish name therefore sits beside a devotional tradition
      whose relation to it is unrecorded.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim or its sibling (DEEP-C046), so the
      verdict rests on general sculptural background, disclosed as such. Limbs
      freed from a stone block are fragile, and keeping arms against the body is
      a common solution in stone figure-carving. 'Plausible contributor' is a
      modest claim that such background can carry. Strongest opposing
      consideration: the constraint explains why arms lie on the body, not where
      the hands meet or what they do. The Urfa statue's hands grasp the genitals
      (DEEP-E081), and arms carved in relief on a pillar face no breakage risk at
      all, so the specific shared gesture is left unexplained.
  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      The textual half is in the ledger. Berossus's F1 gives Oannes "the whole
      body of a fish", with a human head beneath the fish's head and human feet
      at the tail (DEEP-E075), and says his form was preserved in sculpture
      (DEEP-E076). The translators' table also sets Oannes beside U-An, first of
      the apkallu (DEEP-E079, linked to DEEP-C086). The Assyrian half is not in
      the ledger: no record shows fish-cloaked figures in art or texts naming
      them apkallu (DEEP-C052 has no evidence), and the second reader reduced
      both F1 records to context here. Strongest opposing consideration: the
      description is specific in its arrangement, Berossus points to a
      sculptural type, and background knowledge of Mesopotamian texts and
      reliefs agrees. The missing piece is evidentiary.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim; it rests on the founder's caption
      alone. Its truth condition is a universal negative over pre-modern
      sources, meaning colonial chronicles and any testimony from Inca times,
      none of which the ledger has read. It is unresolved because no search has
      been made, not because evidence conflicts. Strongest opposing
      consideration, from background rather than records: colonial-era accounts
      place Viracocha's acts of creation at Lake Titicaca and Tiwanaku. An early
      association of the site's imagery with Viracocha is therefore conceivable
      and must be looked for before 'modern' can be affirmed.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim. The 263 summaries, the coding
      scheme and the clustering measure appear only in its source anchor, so
      neither the clustering nor its size can be checked. Strongest opposing
      consideration: regional clustering is the expected outcome for coded
      folklore, and an author has little reason to misreport it, so the claim is
      likely to hold once the data are produced. What it would show is a
      separate matter, since clustering in summaries could come from regional
      collecting and summarising practice as much as from the stories.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record bears on this claim; it exists only as the founder's
      sentence. 'Uneven' is not quantified, and 'details associated with
      Genesis' is not defined anywhere in the ledger. Strongest opposing
      consideration: such unevenness is plausible, and the author has no
      evident motive to misreport it. If the data were produced, where the
      Genesis-like details concentrate relative to documented missionary
      contact could discriminate between borrowing and an older shared source.
      That is a reason to retrieve the data rather than dismiss the claim.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      The only support is the founder page's sentence (DEEP-E022): "Matching the
      kinds of objects changed the lineup result." The direction and size of the
      change, the number of lineups and the data are not reported. The page
      itself notes that incomplete runs and cropping constrain its conclusions.
      Strongest opposing consideration: a methodological caution reported
      against the author's own apparent interest is more credible than a
      positive result, and an effect of object category on AI similarity
      judgements is expected. The low verdict reflects that nothing has been
      checked.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      No evidence record supports this claim. DEEP-E022 was checked, and its
      second reader found that the quoted sentence says nothing about agreement
      between judges. The truth condition requires inter-judge agreement
