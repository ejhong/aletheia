  synthesis: >-
    For this roll-up, the featured hypothesis is that a shared ancient past or
    transmission process explains a substantial part of the distant
    resemblances, rather than those resemblances arising mainly from broad
    recurring motifs, material constraints, independent invention, or later
    retelling. The evidence does not presently discriminate those alternatives
    well enough to decide that hypothesis. It does, however, support a stronger
    negative conclusion about method: resemblance alone cannot establish a
    source's identity, date, capabilities, or route of transmission. A broad
    geographical distribution can be generated by both inheritance and
    convergence, so dated intermediates and context-specific correspondences are
    indispensable.

    The strongest case for shared history is that several comparisons are real
    rather than fabricated from nothing. The Jiroft object has wear interpreted
    as prolonged suspension from a cord; Hoa Hakananai'a's birdman reliefs were
    later additions to an older statue; and the Oannes material combines a
    fish-bodied or fish-cloaked form with the role of civilising teacher. The
    reported civiliser lineup result, 62.5% first-place rankings for claimed
    partners against 9% for random pairs, would also be noteworthy if reproduced
    from the run data under blinded, source-level controls. These observations
    justify investigating transmission rather than dismissing the comparisons
    merely because they originate outside a settled synthesis.

    Against the hypothesis, the best-supported contextual checks repeatedly
    weaken the historical specificity of the visual parallels. The Göbekli
    forms have no secure functional identification, while the Assyrian
    banduddû has a particular ritual interpretation; shape and function
    therefore cannot be exchanged. The four “navel” cases differ substantially
    in language, attestation date, and relationship to their builders, with the
    Rapanui phrase already disputed in the early written record and Göbekli
    Tepe's modern Turkish name describing the mound. A team member explicitly
    cited missing intermediate links between Göbekli imagery and later Near
    Eastern material. Moreover, the catalogue frequencies, motif-bundle result,
    flood clustering, and image-pilot agreement are either founder self-reports
    without underlying data or wholly unsupported by admitted evidence records.
    Thus the ledger currently documents suggestive resemblance and several
    reasons it may mislead, but no dated transmission chain, distinctive bundled
    signature, or replicated statistical result.

    The hypothesis is therefore unresolved, not contradicted: the records
    undermine an inference from resemblance alone but do not demonstrate
    independent invention or exclude ancient transmission. Sensitivity is
    greatest to DEEP-E028, the strongest direct team statement that no final
    decision on the Pillar 43 forms' meaning was possible. Removing it would
    restore more latitude to the handled-object comparison, but the case verdict
    survives because the absent intermediates, heterogeneous name histories,
    unaudited experiments, and shape-function distinction remain.
  steelman: >-
    The ledger does not explain the reported 62.5% versus 9% civiliser-lineup
    excess or test whether the full conjunction of specific poses, objects,
    narrative acts, and chronological sequences recurs above chance under
    blinded, source-level, date-matched controls; that untested conjunction is
    the strongest positive prediction available to a proponent.
claimAssessments:
  - claimId: DEEP-C002
    verdict: well_supported
    confidence: high
    reasoning: >-
      The claim expresses a basic identifiability requirement: resemblance does
      not uniquely select transmission, convergence, coincidence, or later
      reinterpretation without chronological and contextual constraints. This
      verdict rests principally on general scientific reasoning rather than a
      directly linked evidence record. The strongest opposing consideration is
      that an exceptionally specific resemblance can itself be informative, but
      it still cannot assign a unique historical explanation without the other
      information named in the claim.

  - claimId: DEEP-C057
    verdict: unresolved
    confidence: high
    reasoning: >-
      The admitted records qualify the catalogue's coverage and distinguish its
      broad categories from the specific images, but none supplies the
      documentation-preserving comparison or its result. The underlying data,
      statistic, and comparison procedure are unavailable. The strongest
      consideration in favor is the founder's reported result, but that report
      appears only as claim material rather than as direct supporting evidence
      here.

  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E020 and DEEP-E021 report the two stated rates, so they weakly support
      the claim as an account of what the V1 experiment reported. They derive
      from the same founder self-report, with neither run data nor the number and
      treatment of incomplete lineups available. The strongest opposing
      consideration is that object selection, compressed retellings, or
      completion filtering could generate the contrast without a historical
      relationship.

  - claimId: DEEP-C034
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      Translation, borrowing, and comparative rewriting are plausible mechanisms
      of narrative convergence, but no evidence record compares a documented
      retelling with its earlier version and demonstrates increased similarity.
      The verdict therefore cannot be based on the claim's truth condition.
      The strongest consideration in favor is the general scientific prior that
      transmission and editorial harmonisation can alter stories, but that prior
      is not a case-specific demonstration.

  - claimId: DEEP-C035
    verdict: established
    confidence: high
    reasoning: >-
      Similarity supplies no measurement of a proposed source's identity, date,
      or technological capabilities, so those additional propositions do not
      follow from resemblance alone. This is chiefly a logical scope judgment
      grounded in general inference principles rather than a direct evidence
      record. The strongest opposing consideration is that a highly distinctive
      bundle could make a common source more probable, but even then it would not
      by itself establish the source's detailed identity and capabilities.

  - claimId: DEEP-C026
    verdict: established
    confidence: high
    reasoning: >-
      A distribution without an explicit generative model is compatible with
      both repeated invention and transmission, making the stated
      underdetermination methodological rather than contingent. This verdict
      relies on general scientific reasoning, while DEEP-E061 and DEEP-E062
      illustrate the practical problem through the admitted missing links. The
      strongest opposing consideration is that a distribution can become
      discriminating when analysed under explicit competing models, but the
      claim is expressly limited to distribution “by itself.”

  - claimId: DEEP-C056
    verdict: unresolved
    confidence: high
    reasoning: >-
      The evidence records provide weak self-reported frequencies for the
      bird-person and cosmic-serpent classes but no admitted result for the
      sacred-centre class. DEEP-E018 and DEEP-E019 only qualify catalogue
      coverage and category breadth. The strongest consideration in favor is
      that 55% and 37% would ordinarily count as widespread, but the three-class
      conjunction stated in the claim cannot be checked from the records.

  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E013 and DEEP-E014 reproduce the reported 55% frequency among 926
      traditions. Both are the site's unaudited self-report, and neither the
      coding rules nor catalogue data are present. The strongest opposing
      consideration is the acknowledged uneven coverage and broad category
      definition, although those limitations constrain interpretation more
      directly than they refute the arithmetic.

  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E016 directly reports the claimed 37% figure, but only through the
      author's account of the author's own experiment. No data or reproducible
      coding procedure is supplied, and DEEP-E017 through DEEP-E019 restrict the
      result to a selected broad category and uneven catalogue. The strongest
      opposing consideration is therefore the inability to reproduce the
      proportion, not affirmative evidence of a different value.

  - claimId: DEEP-C004
    verdict: unresolved
    confidence: moderate
    reasoning: >-
      A bird-headed deity, feather-wearing person, and transforming person are
      conceptually distinguishable categories, which gives the claim substantial
      prior plausibility. No evidence record, however, classifies the compared
      images and shows that they actually occupy different categories as the
      truth condition requires. The strongest opposing consideration to support
      is that similar visual conventions could blur or combine these categories
      in the source cultures.

  - claimId: DEEP-C059
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E068 and DEEP-E069 report the published sequence in which komari were
      added after the statue's manufacture and the birdman-related bas-reliefs
      succeeded them. This directly places the reliefs later than the original
      statue. The strongest opposing consideration is that only the abstract was
      read, leaving the physical basis for the relative sequence unaudited and
      supplying no absolute date.

  - claimId: DEEP-C065
    verdict: established
    confidence: high
    reasoning: >-
      Shape and function are analytically distinct properties, and the records
      illustrate the distinction: Pillar 43 has handle-like forms of uncertain
      meaning, whereas the Assyrian object has a proposed ritual use. This
      conclusion is also supported by general functional reasoning rather than
      depending on either particular identification being correct. The strongest
      opposing consideration is that shape can constrain function, but
      constraint is not identity.

  - claimId: DEEP-C044
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E055 reports ritual text in which the banduddû holds consecrated water
      used for sprinkling, supporting a bucket-and-purification context. The
      passage is an unchecked secondhand blog transcription, and it does not
      directly establish the cone or purifier component of the familiar visual
      pairing. That incomplete and indirect textual basis is the strongest
      opposing consideration.

  - claimId: DEEP-C012
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 directly records an excavation-team statement that no final
      decision on the three forms' meaning was possible at that time. This
      strongly supports uncertainty as of 2016–2017. The strongest opposing
      consideration is temporal: later team publications were not checked, so
      the record cannot establish that no secure identification has subsequently
      appeared.

  - claimId: DEEP-C009
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E034 documents wear on the handle and contour, while DEEP-E035 quotes
      the authors' inference that the object was suspended for a long time on a
      cord. That is a direct abstract-level match to the claim's limited
      “consistent with” wording. The strongest opposing consideration is the
      authors' own single-object caveat in DEEP-E038, compounded by incomplete
      confirmation that the studied specimen is exactly the photographed object.

  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E061 and DEEP-E062 record a team member saying that too many missing
      links prevent certainty about survival and changes of meaning. This
      satisfies the claim's stated test of a published team-member statement.
      The strongest opposing consideration is that the source is an informal
      comment-thread reply by one member, not a comprehensive or current formal
      position of the whole excavation team.

  - claimId: DEEP-C018
    verdict: well_supported
    confidence: high
    reasoning: >-
      DEEP-E087 through DEEP-E099 document sharply different histories: ancient
      Greek sanctuary usage, a seventeenth-century Inca gloss, disputed
      nineteenth- and early-twentieth-century Rapanui accounts, and a modern
      Turkish descriptive name for a Neolithic mound. These records establish
      differences in language, attestation period, and relationship to the
      builders. The strongest opposing consideration is uncertainty about the
      exact first record and original status of the Rapanui phrase, but that
      dispute itself reinforces rather than erases the evidential differences.

  - claimId: DEEP-C093
    verdict: established
    confidence: high
    reasoning: >-
      DEEP-E095 explicitly states that Thomson and Roussel agreed on the phrase
      but disagreed on its meaning, while DEEP-E096 and DEEP-E097 dispute both
      the “navel” interpretation and its status as an ancient island name.
      DEEP-E094 preserves Thomson's contrary traditional account, making the
      disagreement direct rather than inferred. The strongest opposing
      consideration is that Churchill's later judgment may not settle the
      correct meaning, but the claim requires only documented disagreement.

  - claimId: DEEP-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E098 directly glosses Göbekli Tepe as “potbelly hill” and says the
      name describes the mound's physical appearance. This supports the claim's
      distinction between a descriptive modern toponym and a builder-era sacred
      designation. The strongest opposing consideration is that the source is an
      unsigned presentation rather than a toponymic study and does not provide
      the name's first attestation.

  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Keeping limbs close to a stone body is mechanically plausible because it
      reduces unsupported projections and potential breakage, so material
      constraints are a credible contributor. This verdict rests on a general
      engineering prior rather than a direct comparative or fracture-analysis
      record in the ledger. The strongest opposing consideration is that
      symbolic conventions may determine the pose independently, and no evidence
      here measures the material constraint's actual contribution.

  - claimId: DEEP-C053
    verdict: weakly_supported
    confidence: moderate
    reasoning: >-
      DEEP-E075 gives Oannes a fish body over human features, DEEP-E076 reports a
      corresponding sculptural form, and the translators' table represented in
      DEEP-E079 aligns Oannes with U-An of an apkallu list. Together these make
      the correspondence plausible. The strongest opposing consideration is the
      missing iconographic bridge: no admitted record demonstrates that the
      particular Assyrian fish-cloaked figure was textually named as an apkallu
      or explicitly identified with Oannes.

  - claimId: DEEP-C028
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record addresses when the Gate of the Sun's central figure was
      first called Viracocha or surveys pre-modern identifications. The absence
      condition in the claim cannot be established merely by failing to present
      a pre-modern source. The strongest consideration in favor is the general
      plausibility that the label is a modern scholarly identification, but that
      prior is not evidence for this specific historical claim.

  - claimId: DEEP-C031
    verdict: unresolved
    confidence: high
    reasoning: >-
      No admitted evidence record provides the 263 coded summaries, a clustering
      measure, a null comparison, or the pilot's output. Consequently neither
      the sample size nor the asserted regional clustering can be reproduced.
      The strongest consideration in favor is the founder's stated result in the
      claim material, but under the assessment rules that unaudited statement is
      not evidence.

  - claimId: DEEP-C054
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record presents the coding of Genesis-associated details or
      quantifies their distribution across the flood summaries. “Uneven” also
      lacks an admitted operational definition or baseline. The strongest
      consideration in favor is the reported pilot conclusion embedded in the
      claim file, but it cannot substitute for evidence records or underlying
      results.

  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022 directly repeats the reported finding that kind-matched controls
      changed the lineup result. It remains a self-report without pilot data,
      rankings, effect size, or a definition of the matching procedure. The
      strongest opposing consideration is that incomplete runs and cropping
      could account for an apparent change or make it unstable.

  - claimId: DEEP-C037
    verdict: unresolved
    confidence: high
    reasoning: >-
      No evidence record supplies inter-judge agreement statistics or even a
      direct report of the alleged strong disagreement. DEEP-E022 concerns
      kind-matched controls, and its own review note explicitly says it does not
      bear on this claim. The strongest consideration in favor is the founder's
      summary of disagreement, but without the pilot outputs it cannot establish
      the stated result.