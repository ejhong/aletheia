  synthesis: >-
    The ledger is early but not empty, and its two halves point in different directions. Its best-evidenced results come from primary and early secondary texts retrieved in the 2026-09-19 and 2026-11-22 passes; its quantitative results are all self-reports of the founder's own experiments, unretrieved at the level of run data. On the side favouring a shared past behind the resemblances, the ledger holds three thin positives: the catalogue's broad bird-person (55%) and cosmic-serpent (37%) classes are reported widespread (DEEP-C005, DEEP-C025, weakly supported self-reports), the V1 lineup reports claimed civiliser partners ranked first in 62.5% of completed lineups against 9% for random pairs (DEEP-C027, weakly supported self-report), and the Berossus record documents a fish-cloaked civiliser figure that the translators align with the apkallu U-An (DEEP-C053, context only). On the other side stand the ledger's strongest records: the four "navel" names provably differ in language, date of first record and builder use (DEEP-C018, well supported from Pindar, Strabo, Pausanias, Garcilaso, Churchill and Schmidt 2010); the Rapanui name's meaning and antiquity were already disputed by 1912 (DEEP-C093, well supported); the Göbekli handled forms have no secure functional identification from the excavation team (DEEP-C012, well supported); the Hoa Hakananai'a birdman carvings postdate the statue and are read against a myth text recorded centuries later (DEEP-C059); and the team itself states that survival of Early Neolithic imagery into later Near Eastern objects is unestablished for missing links (DEEP-C072). Meanwhile the bundle result (DEEP-C057, DEEP-C056) and the flood-pilot claims (DEEP-C031, DEEP-C054) have no supporting records at all — only qualifications or silence — and several method claims rest on prior plausibility rather than any ledger record. Sensitivity: removing DEEP-E028, the single strong record in the ledger, would drop DEEP-C012 to unresolved and gut the handled-objects theme, but the mixed verdict survives, since the navel source histories (DEEP-C018, DEEP-C093) and the missing-links thread (DEEP-C072) are independent of it. The verdict is mixed, not unresolved: the ledger contains genuine, partly primary-source-backed erosion of several flagship parallels alongside thin but unrebutted quantitative similarity signals, and neither side yet holds a decisive record. Confidence is moderate because the negative-leaning results are strong but scoped, while every positive-leaning result is an unaudited self-report.
  steelman: >-
    The V1 civiliser lineup result (DEEP-C027) is an unrebutted quantitative signal: claimed partners ranked first in 62.5% of completed lineups against 9% for random pairs, and no record in the ledger replicates, rebuts or explains it away. The kind-matching caveat (DEEP-C038) was found in the image pilots, not the text lineups, and the convergence-by-retelling mechanism (DEEP-C034) has no documented instance in the ledger; the designed human rerun on unrecognisable source-level passages (DEEP-R003) has not been run. If the run data hold, a proponent can rightly point to a measured, roughly sevenfold chance-level cross-tradition similarity among civiliser accounts that the ledger's retelling explanation has not yet been shown to produce.
claimAssessments:
  - claimId: DEEP-C002
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record in the ledger bears on this methodological claim; its support is entirely general background: historical readings of resemblance are standardly held to require dates, contexts and documented connections. That is a prior, disclosed as such, not a ledger finding. The strongest opposing consideration — that trained perception of resemblance is itself evidence — appears nowhere in the packet, so nothing in the ledger contests the claim either.
  - claimId: DEEP-C057
    verdict: unresolved
    confidence: low
    reasoning: >-
      The only records linked to this claim (DEEP-E018, DEEP-E019) carry direction "qualifies": they state the author's own limitations about coverage and category breadth, and neither asserts that the bundle fails to stand out. No admitted evidence record supports the finding, though the claim's anchor quote shows the page states it. The opposing consideration is that the qualifying records at least presuppose the experiment ran and produced frequency results; that is context, not support.
  - claimId: DEEP-C027
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two weak records (DEEP-E020, DEEP-E021) report the 62.5% and 9% figures, but both are self-reports of the founder's own AI experiment with run data not retrieved, and "completed lineups" implies unenumerated incomplete runs. The strongest opposing consideration is that no independent check of the numbers exists anywhere in the ledger, and DEEP-R003, the designed human rerun, is still pending. The claim is supported only as the page's statement of its own result.
  - claimId: DEEP-C034
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No ledger record documents a retelling that converged in detail on an earlier version, which is what the claim's truth condition asks for; the verdict rests entirely on background knowledge that translation, borrowing and harmonising comparative writing demonstrably converge stories, disclosed as a prior. The strongest opposing consideration is that convergence is not universal — retellings also diverge — and nothing in the ledger quantifies how often each happens.
  - claimId: DEEP-C035
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record tests this claim; it is supported as a near-analytic point of method — resemblance alone cannot fix a hypothetical source's identity, date or capabilities — resting on background logic rather than ledger material. The team's missing-links agnosticism (DEEP-C072) is consistent in spirit though not linked to this claim. The strongest opposing consideration is that a proponent might argue convergent detail across many independent motifs jointly exceeds what resemblance alone could deliver; the ledger does not address that aggregation argument.
  - claimId: DEEP-C026
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is linked to this claim; the verdict leans on the background methodological point that a static geographic distribution is compatible with both deep transmission and independent invention unless dated intermediates are added, which is the standard position in cultural-evolutionary method. The claim is carefully scoped ("by itself"), which blunts the main objection — that geography plus dated intermediates could in principle distinguish the histories — since that objection concedes the "by itself" formulation.
  - claimId: DEEP-C056
    verdict: unresolved
    confidence: low
    reasoning: >-
      As with DEEP-C057, the only linked records (DEEP-E018, DEEP-E019) qualify rather than support: they record the author's own coverage limitations and the distinction between broad categories and specific images. No admitted record states that the three classes were found widespread, though the claim's anchor quote shows the page asserts it. The opposing consideration is that the coverage caveat presupposes the frequency findings exist; that is not support of their content.
  - claimId: DEEP-C005
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Two weak records (DEEP-E013, DEEP-E014) report the 55% figure, and a third (DEEP-E015) correctly scopes it as not telling us how often pose, object and arrangement co-occur. All are self-reports of the site's own unaudited experiment; the underlying Berezkin & Duvakin catalogue and method page are not in hand. The strongest opposing consideration is that the page itself flags uneven catalogue coverage, particularly for the ancient Near East and Rapa Nui, so the proportion may not generalise even if accurate.
  - claimId: DEEP-C025
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      One weak self-report (DEEP-E016) gives the 37% figure and another (DEEP-E017) scopes the geographic result to the sampled category and dataset. The record stands or falls with the site's own unaudited experiment, whose coded data were not retrieved. The strongest opposing consideration mirrors DEEP-C005: the author's own coverage limitation narrows what the baseline can establish.
  - claimId: DEEP-C004
    verdict: unresolved
    confidence: low
    reasoning: >-
      The taxonomy — bird-headed deity, feather-wearer, bird-transforming person — is coherent as general background, but the claim's truth condition is case-specific: the compared images must actually fall into different categories, and no ledger record classifies them. The Hoa Hakananai'a and Göbekli records in the ledger describe motifs without assigning them to these idea-types. The strongest opposing consideration is that no record contradicts the taxonomy either; the ledger simply has not reached this question.
  - claimId: DEEP-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Two moderate records (DEEP-E068, DEEP-E069) from the peer-reviewed Pitts et al. abstract establish the relative sequence statue, then komari, then bas-relief birdman carvings, which is what the claim asserts. The strongest opposing considerations are that this is abstract-level evidence of a paywalled paper, gives relative order only with no absolute date, and later team publications or the unread body could refine the sequence.
  - claimId: DEEP-C065
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is linked to this claim; the principle that a shape's description and a function's identification are separate questions is a near-analytic methodological point, here disclosed as prior-based. The claim's own anchor quote is in fact the Assyrian ritual-context sentence, illustrating the page's practice of keeping the two apart. The strongest opposing consideration is that in some cases context does secure function — the banduddû itself shows this — so the separation cannot be absolute; but the claim asserts separability of questions, not impossibility of function identification.
  - claimId: DEEP-C044
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The single supporting record (DEEP-E055) is a weak-strength secondhand transcription of Wiggermann 1992 on a personal blog, with garbled transliterations acknowledged and the printed page unread. It supports the water-and-sprinkling use of the bucket in rituals, but the transcribed text does not contain the cone/purifier element, which appears only in the blogger's own caption and was not used. The strongest opposing consideration is that the entire basis is one unchecked transcription; the primary (Wiggermann, p. 66) is blocked and should replace it.
  - claimId: DEEP-C012
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E028 is a strong record: the excavation team's own published statement that "a final decision on the meaning of these images" is not possible, which is exactly what the claim's truth condition asks. The strongest opposing considerations are that it is a team blog post rather than a monograph, dated 2016/2017, and later team publications — including the response to Sweatman and Tsikritsis and Schmidt 2012 — were not retrievable, so the statement is a snapshot whose standing DEEP-R005 is designed to test.
  - claimId: DEEP-C009
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E035, a moderate record from the Vidale & Micheli abstract, states directly that the strong wear suggests the hand-bag was suspended for a long time on a cord, meeting the claim's truth condition at abstract level; DEEP-E038 records the authors' own caveat that the inference rests on a single object and is far from granted. The strongest opposing considerations are that only the abstract was read, and the identity of the studied object with the photographed one is unconfirmed.
  - claimId: DEEP-C072
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Two weak records (DEEP-E061, DEEP-E062) quote the team member's own reply that there are "far to many 'missing links' to be sure" about survival of the imagery, plus the caveat about unassessable changes of meaning — the team's stated agnosticism is what the claim reports. The strongest opposing consideration is the venue: a comment-thread reply with informal wording, not a formal publication, and dated 2016, so it evidences one member's position rather than a settled team statement.
  - claimId: DEEP-C018
    verdict: well_supported
    confidence: high
    reasoning: >-
      Eight records across four independent source traditions establish the differences on all three of the claim's points: Delphi attested in Greek from Pindar's ode of 462 BCE and used by the sanctuary's own community (DEEP-E089, DEEP-E090, DEEP-E091); Cusco a builder-used name whose navel gloss first appears in Garcilaso 1609 in a lineage-specific language (DEEP-E087, DEEP-E088); Te Pito o te Henua recorded by Europeans in the late nineteenth century with disputed meaning (DEEP-E094, DEEP-E097); and Göbekli Tepe a Turkish name for a tenth-to-eighth-millennium site whose builders cannot have used it (DEEP-E098, DEEP-E099). The strongest opposing considerations are that the Greek witnesses share a literary tradition, the Cusco and Rapanui texts are read in translation or transcription, and "first record" means earliest found, not earliest existing — but the contrasts span millennia and different languages, so they are robust to these caveats.
  - claimId: DEEP-C093
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      DEEP-E095 and DEEP-E096, both strong records, document by 1912 that Thomson and Roussel agreed on the name but disagreed on its interpretation, and that Churchill rejected Thomson's story of the name's antiquity and read pito as "end"; DEEP-E094 supplies Thomson's own tradition-based account and DEEP-E097 the headlands informant. The strongest opposing consideration is that Churchill is effectively one witness reporting the disagreement, via OCR text, and later Rapanui lexicography unread in this pass (DEEP-R006) could reweigh his reading — though the claim concerns the disagreement in the early record, which is directly documented.
  - claimId: DEEP-C015
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      DEEP-E098, a moderate record, gives the UNESCO site presentation's statement that the name means "potbelly hill" and describes the mound's physical appearance — the gloss the claim's truth condition asks for, though note it is "potbelly", not the page's looser "navel hill". The strongest opposing considerations are that the page is unsigned, gives no date for the name's first record, and the wishing-tree practice (DEEP-E100) shows living sacred association with the hill itself, even if not with the name.
  - claimId: DEEP-C047
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      No evidence record is linked to this claim; the verdict leans on background knowledge of stone-carving practice, in which limbs carved in relief against the body are less vulnerable to breakage than free-standing ones, disclosed as a prior. The claim is deliberately weak ("a plausible contributor"), which makes it hard to defeat but also thin. The strongest opposing consideration is that plausibility is not demonstration: no ledger record shows breakage patterns or carver behaviour, and hands-on-body poses also occur where the constraint explanation would not apply.
  - claimId: DEEP-C053
    verdict: provisionally_supported
    confidence: low
    reasoning: >-
      The records linked to this claim are context only: Berossus's F1 description of a fish-bodied figure with human head and feet (DEEP-E075) matches the fish-cloaked iconography, and the "preserved in sculpture" line (DEEP-E076) points to an existing type, but neither passage names the apkallu; the Oannes–U-An alignment sits in records linked to DEEP-C086, not here. The correspondence thus rests on background scholarship disclosed as a prior. The strongest opposing considerations are that Berossus survives only through excerptors, and whether the sculpture sentence is Berossus's own or an excerptor's gloss is unsettled.
  - claimId: DEEP-C028
    verdict: unresolved
    confidence: low
    reasoning: >-
      The claim is a negative-existence statement — no pre-modern source names the Gate of the Sun figure Viracocha — and no record in the ledger surveys pre-modern sources on the identification. Background scholarship treats the identification as modern, but that is a prior, disclosed as such, and verifying the negative would require the source survey the ledger has not run. The strongest opposing consideration is that nothing in the ledger contradicts the claim either; the question is simply unreached.
  - claimId: DEEP-C031
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record in the ledger concerns the flood text-coding pilot: nothing reproduces the regional clustering or even reports the experiment's output at second hand. The claim's truth condition requires the pilot's coded data to show clustering under its stated measure, and neither the data nor a methods description is in hand. The strongest opposing consideration is the absence of any contradicting record; the ledger simply has not opened this experiment.
  - claimId: DEEP-C054
    verdict: unresolved
    confidence: low
    reasoning: >-
      As with DEEP-C031, no evidence record bears on the flood pilot's distribution of Genesis-associated details; the claim rests on the page's anchor quote alone, with no retrieved run data or method statement. The strongest opposing consideration is again silence rather than contradiction: the ledger cannot currently evaluate the pilot in either direction.
  - claimId: DEEP-C038
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      DEEP-E022, a weak self-report, quotes the pilots' own finding that matching the kinds of objects changed the lineup result, which is what the claim asserts. The pilot data were not retrieved, and the page itself notes incomplete runs and cropping constrain the conclusions. The strongest opposing consideration is that "changed the result" does not say in which direction or by how much, so the record establishes the fact of sensitivity but not its size or significance.
  - claimId: DEEP-C037
    verdict: unresolved
    confidence: low
    reasoning: >-
      No evidence record carries the inter-judge agreement statistics the claim's truth condition requires; the closest record (DEEP-E022) was explicitly corrected by the second reader as not bearing on judge agreement at all. The anchor quote mentions "strong disagreement between judges", but no admitted record reports it with any statistic. The strongest opposing consideration is that the pilots' own framing suggests disagreement existed; that is the page's characterisation, not measured evidence.